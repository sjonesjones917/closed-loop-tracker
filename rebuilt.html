<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08101d"><meta name="apple-mobile-web-app-capable" content="yes"><title>Closed Loop Workflow</title><style>*{box-sizing:border-box}body{margin:0;background:#08101d;color:#f5f8ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui;padding:12px 12px 82px}h1{font-size:21px;margin:3px 0}h2{font-size:20px}.c{background:#111b2c;border:1px solid #293952;border-radius:15px;padding:13px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button,input,textarea,select{font:inherit;border-radius:11px}button{border:0;padding:10px 12px;background:#6cafff;color:#07101d;font-weight:800}button.s{background:#17243a;color:#f5f8ff;border:1px solid #31435f}input,textarea,select{width:100%;border:1px solid #31435f;background:#091422;color:#fff;padding:10px;font-size:16px}textarea{min-height:105px;resize:vertical}label,small,.muted{color:#9fadc4}label{display:block;font-size:12px;margin:10px 0 5px}.stage{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;background:#111b2c;border:1px solid #293952;border-radius:13px;padding:11px;margin:7px 0}.n{height:34px;width:34px;border-radius:50%;display:grid;place-items:center;background:#18253a;font-size:12px;font-weight:900}.pill{font-size:10px;border-radius:99px;padding:5px 7px;background:#18253a;color:#aab7cb}.pill.COMPLETE{background:#5ed47c;color:#06250f}.pill.BLOCKED{background:#ffd166;color:#302200}.pill.FAILED{background:#ff7777;color:#310000}pre{white-space:pre-wrap;word-break:break-word;background:#07111d;border:1px solid #293952;border-radius:11px;padding:10px;font-size:12px;max-height:460px;overflow:auto}nav{position:fixed;bottom:0;left:0;right:0;padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#08101df5;border-top:1px solid #293952}nav button{font-size:11px;padding:9px 3px;background:#17243a;color:#aab7cb}.notice{border-left:4px solid #6cafff}.warn{border-left:4px solid #ffd166}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#17243a;border-radius:11px;padding:10px;text-align:center}.metric b{display:block;font-size:19px}.hide{display:none}</style></head><body><div class="row between"><div><h1>Closed Loop Workflow</h1><div id="sub"><small>Loading workflow…</small></div></div><button class="s" onclick="backup()">Backup</button></div><main id="app"></main><nav><button onclick="jobs()">Jobs</button><button onclick="flow()">Workflow</button><button onclick="records()">Records</button><button onclick="blockers()">Blockers</button></nav><script>const KEY='clw_v6';let WF=[],RULES='',D=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[]}'),jid=D.jid||null;const A=document.getElementById('app');const E={stage:['NOT_STARTED','IN_PROGRESS','COMPLETE','BLOCKED','FAILED'],truth:['TRUE','FALSE','UNKNOWN'],verification:['SATISFIED','VIOLATED','UNDETERMINED'],defect:['SOURCE_DEFECT','RESEARCH_DEFECT','REQUIREMENT_DEFECT','TEST_DEFECT','INSTRUCTION_DEFECT','INPUT_DEFECT','EXECUTION_DEFECT','TOOL_DEFECT','AUDIT_DEFECT'],release:['ACCEPTED','REJECTED','BLOCKED'],sourceRole:['MANDATORY','INFORMATIVE','EVIDENTIARY'],verifyMethod:['FORMAL_PROOF','EXACT_COMPUTATION','DETERMINISTIC_PROGRAMMATIC_TEST','SCHEMA_OR_STRUCTURAL_VALIDATION','EXACT_SOURCE_COMPARISON','RULE_BASED_EVALUATION','INDEPENDENT_SEMANTIC_EVALUATION','AUTHORIZED_HUMAN_JUDGMENT']};function save(){D.jid=jid;localStorage.setItem(KEY,JSON.stringify(D));hdr()}function j(){return D.jobs.find(x=>x.id===jid)}function st(n){return j()?.stages.find(x=>x.n===n)}function uid(p){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase().padStart(8,'0')}function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function hdr(){document.getElementById('sub').innerHTML='<small>'+(j()?j().id+' • next Stage '+j().next+'/30':'No job selected')+'</small>'}function setJ(k,v){j()[k]=v;save()}async function cp(t){try{await navigator.clipboard.writeText(t)}catch{prompt('Copy this text:',t)}}function parseWorkflow(t){let p=t.split(/\nMandatory operating rules\n/);RULES=(p[1]||'').trim();let main=p[0].replace(/^Closed-Loop Agent Reliability Workflow\s*/,'').trim();WF=[...main.matchAll(/(?:^|\n)(\d+)\. ([^\n]+)\n([\s\S]*?)(?=\n\d+\. [^\n]+\n|$)/g)].map(m=>({n:+m[1],name:m[2].trim(),text:m[3].trim()}));}async function boot(){try{let r=await fetch('workflow-v6.txt?x=6');if(!r.ok)throw 0;parseWorkflow(await r.text());jobs()}catch{A.innerHTML='<div class="c warn"><b>Workflow file failed to load.</b><p>Reload this page. The application will not invent substitute workflow instructions.</p></div>'}}function jobRecord(x=j()){return`JOB_ID: ${x.id}\nEXACT USER OBJECTIVE:\n${x.objective||'UNKNOWN'}\n\nEXACT DELIVERABLE REQUESTED:\n${x.deliverable||'UNKNOWN'}\n\nALL SUPPLIED FILES, MESSAGES, LINKS, DATA, AND CONSTRAINTS:\n${x.materials||'NONE SUPPLIED'}\n\nREQUIRED OUTPUT FORMAT:\n${x.format||'UNKNOWN'}\n\nDEADLINE OR TEMPORAL SCOPE:\n${x.deadline||'NONE SUPPLIED'}\n\nKNOWN AUTHORITATIVE SOURCES:\n${x.authorities||'NONE SUPPLIED'}\n\nAVAILABLE TOOLS:\n${x.tools||'UNKNOWN'}\n\nPROHIBITED ACTIONS:\n${x.prohibited||'NONE SUPPLIED'}\n\nUNKNOWN INFORMATION THAT MAY AFFECT CORRECTNESS:\n${x.unknowns||'NONE RECORDED'}\n\nEXPLICIT USER REQUIREMENTS:\n${x.requirements||'NONE SEPARATELY RECORDED'}\n\nASSUMPTIONS:\n${x.assumptions||'NONE'}\n\nINPUT SET VERSION:\nINPUT-v${String(x.inputVersion).padStart(3,'0')}`}function nj(){let x={id:uid('JOB'),title:'',objective:'',deliverable:'',materials:'',format:'UNSPECIFIED',deadline:'',authorities:'',tools:'',prohibited:'',unknowns:'',requirements:'',assumptions:'',inputVersion:1,next:2,stages:Array.from({length:30},(_,i)=>({n:i+1,status:i===0?'COMPLETE':'NOT_STARTED',result:'',history:[]})),idCounters:{SRC:0,REQ:0,TEST:0,DEFECT:0,REG:0,PRODUCT:0,EXEC:0,BASELINE:0},blockers:[],created:new Date().toISOString()};x.stages[0].result=jobRecord(x);D.jobs.unshift(x);jid=x.id;save();intake()}function jobs(){A.innerHTML='<div class="row between"><h2>Jobs</h2><button onclick="nj()">New Job</button></div>'+(D.jobs.length?D.jobs.map(x=>`<div class="c"><b>${esc(x.title||'Untitled job')}</b><br><small>${x.id}</small><p class="muted">${esc(x.objective||'No objective yet.')}</p><button onclick="jid='${x.id}';save();flow()">Open</button> <button class="s" onclick="jid='${x.id}';save();intake()">Job input</button></div>`).join(''):'<div class="c notice"><b>Create a job.</b><p class="muted">Stage 1 is completed by the application from the job information you enter. The first agent handoff is Stage 2.</p></div>');hdr()}function f(l,k,a=0){return'<label>'+l+'</label>'+(a?`<textarea oninput="setJ('${k}',this.value)">${esc(j()[k]||'')}</textarea>`:`<input value="${esc(j()[k]||'')}" oninput="setJ('${k}',this.value)">`)}function intake(){if(!j())return jobs();A.innerHTML='<div class="row between"><h2>Job input / Stage 1</h2><button class="s" onclick="finishIntake()">Save job</button></div><div class="c notice"><b>Stage 1 is performed here.</b><p class="muted">The app creates the job record, JOB_ID, and INPUT version. You do not send Stage 1 to an agent.</p></div><div class="c"><small>'+j().id+'</small>'+f('Job name','title')+f('Exact user objective','objective',1)+f('Exact deliverable requested','deliverable',1)+f('All supplied files, messages, links, data, and constraints','materials',1)+f('Required output format','format')+f('Deadline or temporal scope','deadline')+f('Known authoritative sources','authorities',1)+f('Available tools','tools',1)+f('Prohibited actions','prohibited',1)+f('Unknown information that may affect correctness','unknowns',1)+f('Explicit user requirements','requirements',1)+f('Assumptions','assumptions',1)+'</div><div class="c"><b>Generated Stage 1 record</b><pre>'+esc(jobRecord())+'</pre></div>'}function finishIntake(){let x=j();x.stages[0].result=jobRecord(x);x.stages[0].status='COMPLETE';x.next=Math.max(2,x.next);save();flow()}function flow(){if(!j())return jobs();let x=j(),c=x.stages.filter(s=>s.status==='COMPLETE').length,b=x.stages.filter(s=>s.status==='BLOCKED').length;A.innerHTML='<div class="row between"><h2>'+esc(x.title||'Workflow')+'</h2><button class="s" onclick="intake()">Job input</button></div><div class="grid"><div class="metric"><b>'+c+'/30</b><small>Complete</small></div><div class="metric"><b>'+b+'</b><small>Blocked</small></div></div><h3>Stages</h3>'+WF.map(w=>{let s=st(w.n);return`<div class="stage" onclick="stage(${w.n})"><div class="n">${String(w.n).padStart(2,'0')}</div><div><b>${esc(w.name)}</b><div class="muted" style="font-size:11px">${w.n===1?'Completed automatically from job input':w.n===x.next?'Next required stage':'Stored workflow stage'}</div></div><span class="pill ${s.status}">${s.status.replaceAll('_',' ')}</span></div>`}).join('')}function prior(n){return j().stages.filter(s=>s.n<n&&s.result.trim()).map(s=>'===== STAGE '+s.n+' RESULT =====\n'+s.result.trim()).join('\n\n')}function enumsFor(n){let a=[];if(n===2)a.push('SOURCE ROLE: '+E.sourceRole.join(' | '));if(n===4||n===6)a.push('VERIFICATION METHOD: '+E.verifyMethod.join(' | '));if(n===12||n===22||n===23)a.push('RESULT / DETERMINATION: '+E.verification.join(' | '));if(n===14)a.push('DEFECT CATEGORY: '+E.defect.join(' | '));if(n===27)a.push('RELEASE STATE: '+E.release.join(' | '));return a.join('\n')}function autoRule(n){if(n===2)return'For each source identifier, write SOURCE_ID: AUTO. The app replaces each AUTO with the next SRC-#### identifier after paste.';if(n===4)return'For each requirement, write REQ_ID: AUTO. The app replaces each AUTO with the next REQ-#### identifier after paste.';if(n===6)return'For each test, write TEST_ID: AUTO. The app replaces each AUTO with the next TEST-#### identifier after paste.';if(n===11)return'Use these run labels exactly: '+Array.from({length:10},(_,i)=>'RUN-'+String(i+1).padStart(3,'0')).join(', ')+'.';if(n===14)return'For each defect, write DEFECT_ID: AUTO. The app replaces each AUTO with the next DEFECT-#### identifier after paste.';if(n===15)return'For each regression test, write REG_ID: AUTO. The app replaces each AUTO with the next REG-#### identifier after paste.';if(n===20)return'Write BASELINE_ID: AUTO. The app replaces AUTO with the generated baseline identifier after paste.';if(n===21)return'Write PRODUCT_ID: AUTO and EXECUTION_ID: AUTO. The app replaces them with generated identifiers after paste.';return''}function promptFor(n){let w=WF[n-1],e=enumsFor(n),ar=autoRule(n);return`CLOSED-LOOP AGENT RELIABILITY WORKFLOW\n\nJOB RECORD\n${jobRecord()}\n\nPRIOR COMPLETED WORKFLOW STATE\n${prior(n)||'NONE'}\n\nSTAGE ${n}. ${w.name}\n${w.text}\n\nMANDATORY OPERATING RULES\n${RULES}\n\nEXECUTE THIS STAGE NOW\nPerform every operation required by Stage ${n} that you can perform using the supplied information, actual supplied files, available tools, and authoritative sources. Return the completed work required by Stage ${n}; do not merely describe how to do it, give a plan, or tell the human to do work you can perform. Do not perform a later workflow stage in this response. If a required fact is genuinely unavailable after using the available sources and tools, use UNKNOWN and follow the workflow's BLOCKED rule.\n${ar?`\nIDENTIFIER HANDLING\n${ar}`:''}${e?`\n\nALLOWED VALUES REQUIRED BY THIS STAGE\n${e}`:''}`}function stage(n){if(n===1)return intake();let w=WF[n-1],s=st(n);A.innerHTML='<div class="row between"><button class="s" onclick="flow()">← Workflow</button><span class="pill '+s.status+'">'+s.status.replaceAll('_',' ')+'</span></div><h2>'+n+'. '+esc(w.name)+'</h2><div class="c"><b>Exact workflow instructions</b><pre>'+esc(w.text)+'</pre></div><div class="c notice"><b>Your only normal actions for this stage</b><p class="muted">Copy the prompt to the required agent/context. When it finishes, paste its complete result here. The app stores the result and generates identifiers marked AUTO.</p><button onclick="copyPrompt('+n+')">Copy Stage '+n+' Prompt</button></div><div class="c"><label>Complete agent result</label><textarea id="result" style="min-height:290px">'+esc(s.result)+'</textarea><div class="row"><button onclick="saveResult('+n+')">Save result</button><button class="s" onclick="markBlocked('+n+')">Agent is BLOCKED</button></div></div>'}function copyPrompt(n){cp(promptFor(n));let s=st(n);if(s.status==='NOT_STARTED')s.status='IN_PROGRESS';save()}function nextId(k){let x=j();x.idCounters[k]=(x.idCounters[k]||0)+1;return k+'-'+String(x.idCounters[k]).padStart(4,'0')}function replaceAuto(n,t){let pairs=[];if(n===2)pairs=[['SOURCE_ID','SRC']];if(n===4)pairs=[['REQ_ID','REQ']];if(n===6)pairs=[['TEST_ID','TEST']];if(n===14)pairs=[['DEFECT_ID','DEFECT']];if(n===15)pairs=[['REG_ID','REG']];if(n===20)pairs=[['BASELINE_ID','BASELINE']];if(n===21)pairs=[['PRODUCT_ID','PRODUCT'],['EXECUTION_ID','EXEC']];for(let [field,k] of pairs){let re=new RegExp('(^|\\n)('+field+'\\s*:\\s*)AUTO(?=\\s|$)','gi');t=t.replace(re,(m,a,b)=>a+b+nextId(k))}return t}function saveResult(n){let el=document.getElementById('result'),s=st(n),t=replaceAuto(n,el.value.trim());if(!t)return alert('Paste the complete agent result first.');s.history.push({at:new Date().toISOString(),result:t});s.result=t;s.status='COMPLETE';j().next=Math.min(30,Math.max(j().next,n+1));save();stage(n)}function markBlocked(n){let el=document.getElementById('result'),s=st(n);s.result=el.value.trim();s.status='BLOCKED';j().blockers.push({id:uid('BLOCK'),stage:n,text:s.result,answer:''});save();stage(n)}function records(){if(!j())return jobs();A.innerHTML='<h2>Stored workflow records</h2><div class="c notice"><p class="muted">These are the exact Stage 1 record and pasted agent results. The app does not ask you to re-enter the agent work into separate forms.</p></div>'+j().stages.filter(s=>s.result.trim()).map(s=>`<div class="c"><div class="row between"><b>Stage ${s.n}: ${esc(WF[s.n-1]?.name||'')}</b><span class="pill ${s.status}">${s.status}</span></div><pre>${esc(s.result)}</pre><button class="s" onclick="cp(st(${s.n}).result)">Copy record</button></div>`).join('')}function blockers(){if(!j())return jobs();A.innerHTML='<h2>Human-only blockers</h2>'+(j().blockers.length?j().blockers.map(b=>`<div class="c warn"><b>${b.id} • Stage ${b.stage}</b><pre>${esc(b.text)}</pre><label>Only enter the missing human-only fact/action here</label><textarea oninput="let q=j().blockers.find(x=>x.id==='${b.id}');q.answer=this.value;save()">${esc(b.answer)}</textarea></div>`).join(''):'<div class="c"><p class="muted">No blockers.</p></div>')}function backup(){A.innerHTML='<h2>Backup</h2><div class="c"><button onclick="exportData()">Export JSON</button> <button class="s" onclick="document.getElementById(\'imp\').click()">Import JSON</button><input class="hide" id="imp" type="file" accept="application/json" onchange="importData(this.files[0])"></div>'}function exportData(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='closed-loop-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);jid=D.jid||D.jobs?.[0]?.id||null;save();jobs()}catch{alert('Invalid backup')}};r.readAsText(f)}boot();</script></body></html>
