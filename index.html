<title>Closed-Loop Reliability</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#111;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}header,main{padding:10px 12px}header{border-bottom:1px solid #ddd}h1{font-size:18px;margin:0 0 3px}.tools{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}button,input,textarea,select{font:inherit}button{border:1px solid #aaa;background:#fff;border-radius:7px;padding:6px 9px;min-height:32px}button.primary,.active{background:#111!important;color:#fff}.bar{height:4px;background:#ddd}.bar i{display:block;height:100%;background:#111}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.nav button{font-size:9.5px;padding:5px 3px;min-height:32px;line-height:1.15}.card{border:1px solid #ddd;border-radius:9px;padding:10px;margin:8px 0}.card h2{font-size:16px}.card h3{font-size:12px;margin:12px 0 5px}label{display:block;font-weight:650;font-size:11px;margin-top:7px}textarea,input,select{width:100%;border:1px solid #bbb;border-radius:7px;padding:7px}textarea{min-height:70px}.copy{white-space:pre-wrap;background:#f2f2f2;border:1px solid #ddd;border-radius:8px;padding:8px;max-height:320px;overflow:auto;font:11px ui-monospace,monospace}.muted{color:#666;font-size:12px}@media(max-width:520px){.nav{grid-template-columns:repeat(3,1fr)}}@media(max-width:360px){.nav{grid-template-columns:repeat(2,1fr)}}

<body><div class="app"><header><h1>Closed-Loop Reliability</h1><div id="job">UNASSIGNED PROJECT</div><div class="tools"><button onclick="newJob()">New project</button><button onclick="exportProject()">Export</button><button onclick="imp.click()">Import</button><input id="imp" type="file" hidden accept=".json" onchange="importProject(this)"></div><div><span id="count"></span><div class="bar"><i id="bar"></i></div></div></header><main><div id="master"></div><div id="nav" class="nav"></div><div id="content"></div></main></div><script>globalThis.job=document.getElementById('job');globalThis.count=document.getElementById('count');globalThis.bar=document.getElementById('bar');globalThis.nav=document.getElementById('nav');globalThis.content=document.getElementById('content');globalThis.imp=document.getElementById('imp');</script><script src="workbook.js?v=human-workbook-20260823-r11"></script><script src="human-ui.js?v=human-workbook-20260823-r11"></script></body></html>
