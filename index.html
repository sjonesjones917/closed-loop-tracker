<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Closed-Loop Agent Reliability</title>
<style>html{color-scheme:dark;background:#07111f;color:#f4f7fb;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(560px,100%);border:1px solid #2f4a6b;border-radius:14px;background:#0d1a2c;padding:16px}h1{font-size:22px;margin:0 0 8px}p{color:#aebdd0}.error{color:#ff9caa;white-space:pre-wrap}</style>
</head>
<body><main class="box"><h1>Closed-Loop Agent Reliability</h1><p id="message">Loading the verified application…</p><div id="error" class="error"></div></main>
<script type="module">
(async()=>{
  const manifest=await fetch('./app-payload/manifest.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`Manifest retrieval failed: ${response.status}`);return response.json()});
  const parts=[];
  for(let index=0;index<manifest.partCount;index+=1){
    const name=manifest.partPattern.replace('%02d',String(index).padStart(2,'0'));
    const response=await fetch(`./app-payload/${name}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`Payload retrieval failed for ${name}: ${response.status}`);
    parts.push((await response.text()).trim());
  }
  const binary=atob(parts.join(''));
  const compressed=Uint8Array.from(binary,character=>character.charCodeAt(0));
  const compressedHash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',compressed))].map(value=>value.toString(16).padStart(2,'0')).join('');
  if(compressedHash!==manifest.compressedSha256)throw new Error('Compressed payload verification failed.');
  if(typeof DecompressionStream!=='function')throw new Error('This browser does not support the required verified gzip decompression stream.');
  const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const htmlBytes=new TextEncoder().encode(html);
  const htmlHash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',htmlBytes))].map(value=>value.toString(16).padStart(2,'0')).join('');
  if(htmlBytes.length!==manifest.htmlBytes||htmlHash!==manifest.htmlSha256)throw new Error('Application payload verification failed.');
  document.open();document.write(html);document.close();
})().catch(error=>{document.getElementById('message').textContent='The verified application could not be loaded.';document.getElementById('error').textContent=error.message});
</script>
</body>
</html>
