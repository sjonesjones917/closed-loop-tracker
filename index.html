<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mobile Closed-Loop Agent Reliability Workbook</title><style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f9fafb;--accent:#111827;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{width:100%;max-width:760px;min-height:100dvh;margin:0 auto;background:var(--panel);box-shadow:0 0 0 1px rgba(17,24,39,.04)}
header{padding:max(14px,env(safe-area-inset-top)) 16px 12px;background:var(--panel);border-bottom:1px solid var(--line)}.headrow{display:flex;align-items:flex-start;gap:12px}.titleblock{min-width:0;flex:1}h1{font-size:20px;line-height:1.15;letter-spacing:-.02em;margin:0 0 4px}.jobline{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;gap:6px;flex-wrap:nowrap}.tools button{width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);font-weight:800}.tools button:first-child{width:auto;padding:0 11px}.progressrow{display:flex;align-items:center;gap:10px;margin-top:11px}.progressrow #count{font-size:12px;color:var(--muted);white-space:nowrap}.bar{height:5px;flex:1;background:#eceef1;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
main{padding:0 0 calc(28px + env(safe-area-inset-bottom))}.tabs{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:8px 10px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 11px;font-weight:700;cursor:pointer}.tabs button{padding:8px 6px;font-size:12px;border-color:transparent;background:var(--soft)}button.primary,.active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
.nav{display:flex;gap:7px;overflow-x:auto;padding:10px 12px 9px;scroll-snap-type:x proximity;border-bottom:1px solid var(--line);background:var(--panel);-webkit-overflow-scrolling:touch}.nav:empty{display:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;min-width:108px;max-width:150px;text-align:left;scroll-snap-align:start;font-size:11px;line-height:1.2;padding:8px 9px;background:var(--soft);border-color:var(--line)}.nav button b{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.nav button.active b{color:rgba(255,255,255,.72)}
#content{padding:12px}.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.025)}.card h2{font-size:19px;line-height:1.22;letter-spacing:-.015em;margin:0}.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}.card p{margin:8px 0}.card ul{padding-left:20px;margin:8px 0}.card li{margin:7px 0}.muted{color:var(--muted);font-size:12px}
label{display:block;font-weight:700;font-size:12px;margin:10px 0 5px}label.check{display:flex;align-items:flex-start;gap:10px;font-weight:500;font-size:14px;line-height:1.4;padding:9px 0;margin:0;border-bottom:1px solid #f0f1f3}label.check:last-child{border-bottom:0}label.check input{width:19px;height:19px;min-width:19px;margin:1px 0 0}textarea,input,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}textarea:focus,input:focus,select:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(17,24,39,.06)}textarea{min-height:90px;resize:vertical}.record{min-height:440px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.copy{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:11px;max-height:420px;overflow:auto;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0}.track{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:start;padding:9px 0;border-bottom:1px solid #f0f1f3;font-size:12px}.track span{font-weight:800}.track small{grid-column:2/4;color:var(--muted);overflow-wrap:anywhere}.flow{line-height:1.7;font-weight:650}
@media(max-width:520px){.app{box-shadow:none}.headrow{align-items:center}h1{font-size:18px}.tools{gap:5px}.tools button{width:36px;height:36px;border-radius:10px}.tools button:first-child{font-size:12px;padding:0 9px}.tabs{top:0;padding-left:8px;padding-right:8px}.tabs button{font-size:11px}.nav{padding-left:10px;padding-right:10px}.nav button{min-width:102px}.card{border-left:0;border-right:0;border-radius:0;margin-left:-12px;margin-right:-12px;padding-left:16px;padding-right:16px;box-shadow:none}#content{padding-top:10px}.record{min-height:380px}}
</style></head><body><div class="app"><header><div class="headrow"><div class="titleblock"><h1>Mobile Closed-Loop Agent Reliability Workbook</h1><div id="job" class="jobline">UNASSIGNED JOB</div></div><div class="tools"><button onclick="newJob()" aria-label="New clean job">New job</button><button onclick="exportProject()" aria-label="Export">⇧</button><button onclick="imp.click()" aria-label="Import">⇩</button><input id="imp" type="file" hidden accept=".json,application/json" onchange="importProject(this)"></div></div><div class="progressrow"><span id="count"></span><div class="bar"><i id="bar"></i></div></div></header><main><div class="tabs"><button onclick="view='workbook';render()">30-stage workbook</button><button onclick="view='appendices';render()">Appendices A–F</button><button onclick="view='control';render()">Job control</button></div><div id="nav" class="nav"></div><div id="content"></div></main></div><script>globalThis.job=document.getElementById('job');globalThis.count=document.getElementById('count');globalThis.bar=document.getElementById('bar');globalThis.nav=document.getElementById('nav');globalThis.content=document.getElementById('content');globalThis.imp=document.getElementById('imp');</script><script src="workbook.js"></script></body></html>
