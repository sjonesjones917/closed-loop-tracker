<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#07101e"><link rel=manifest href=manifest.webmanifest><title>Closed Loop Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#07101e;color:#eef4ff;font-family:-apple-system,system-ui;padding:14px 14px 82px}h1{font-size:22px}.c{background:#101a2c;border:1px solid #263653;border-radius:15px;padding:13px;margin:10px 0}button,select,input,textarea{font:inherit;border-radius:11px;border:1px solid #31425f}button{padding:10px 12px;background:#5ba7ff;color:#07101e;font-weight:700}button.s{background:#162238;color:#fff}input,select,textarea{width:100%;padding:10px;background:#0b1526;color:#fff;margin:4px 0 10px}textarea{min-height:100px}small,label{color:#9fb0cc}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stage{padding:12px;background:#101a2c;border-radius:12px;margin:7px 0}.pill{font-size:11px;padding:4px 7px;border-radius:999px;background:#162238}nav{position:fixed;bottom:0;left:0;right:0;background:#07101eee;border-top:1px solid #263653;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}nav button{font-size:12px}pre{white-space:pre-wrap;background:#06101d;padding:10px;border-radius:10px;max-height:320px;overflow:auto}.hide{display:none}</style></head><body><h1>Closed Loop Tracker</h1><div id=sub><small>No job selected</small></div><main id=app></main><nav><button onclick=jobs()>Jobs</button><button onclick=flow()>Workflow</button><button onclick=regs()>Registries</button><button onclick=backup()>Backup</button></nav><script>const S=["Initialize the job","Build the source inventory","Research the requirements","Compile the requirement specification","Resolve the requirement set","Build the verification suite","Build failure tests","Author the production instruction","Preflight the production instruction","Freeze the test candidate","Run ten independent executions","Verify each execution independently","Compare the ten executions","Root-cause every defect","Convert every confirmed failure into a regression test","Revise the responsible layer","Re-run the complete ten-execution iteration","Continue until convergence","Run an unchanged confirmation iteration","Freeze the production baseline","Generate the finished product","Run deterministic verification on the finished product","Run independent semantic verification","Run adversarial verification","Inspect the final representation","Reconcile process and product evidence","Apply the release gate","Verify artifact identity before release","Preserve the complete evidence chain","Preserve failures permanently"],F={"1":["JOB_ID","EXACT_USER_OBJECTIVE","EXACT_DELIVERABLE_REQUESTED","SUPPLIED_FILES_MESSAGES_LINKS_DATA_CONSTRAINTS","REQUIRED_OUTPUT_FORMAT","DEADLINE_OR_TEMPORAL_SCOPE","KNOWN_AUTHORITATIVE_SOURCES","AVAILABLE_TOOLS","PROHIBITED_ACTIONS","UNKNOWN_INFORMATION","INPUT_SET_VERSION"],"2":["SOURCE_ID","TITLE_OR_DESCRIPTION","SOURCE_TYPE","ORIGIN","VERSION","EFFECTIVE_DATE","AUTHORITY_LEVEL","ROLE","RELEVANT_PORTIONS","CONFLICTS"],"4":["REQ_ID","REQUIREMENT","TYPE","SOURCE","SOURCE_LOCATION","AUTHORITY","APPLICABILITY","DEPENDENCIES","PROHIBITIONS","VERIFICATION_METHOD","EXPECTED_EVIDENCE","FAILURE_CONDITION","STATUS"],"6":["TEST_ID","REQ_ID","TEST_TYPE","INPUTS_REQUIRED","PROCEDURE","EXPECTED_RESULT","FAILURE_CONDITION","EVIDENCE_PRODUCED"],"11":["RUN_ID","INPUT_VERSION","SOURCE_SET_VERSION","REQUIREMENTS_VERSION","INSTRUCTION_VERSION","TOOL_CONFIGURATION_VERSION","OUTPUT","OUTPUT_HASH"],"12":["REQ_ID","RUN_ID","RESULT","TEST_ID","EVIDENCE","DEFECT_ID"],"14":["DEFECT_ID","CATEGORY","OBSERVED_FAILURE","ROOT_CAUSE","CORRECTION"],"15":["REG_ID","ORIGINAL_DEFECT_ID","REQ_ID","FAILURE_FIXTURE","DETECTION_METHOD","EXPECTED_REJECTION_OR_CORRECTION"],"20":["BASELINE_ID","INPUT_CONTRACT_VERSION","SOURCE_SET_VERSION","REQUIREMENTS_VERSION","INSTRUCTION_VERSION","TEST_SUITE_VERSION","VALIDATOR_VERSION","TOOL_CONFIGURATION_VERSION"],"21":["PRODUCT_ID","BASELINE_ID","EXECUTION_ID","OUTPUT_FILES","OUTPUT_HASHES"],"23":["REQ_ID","PRODUCT_LOCATION","SOURCE_EVIDENCE","OBSERVED_MEANING","REQUIRED_MEANING","DETERMINATION"],"27":["RELEASE_STATE","EVIDENCE_COMPLETE","VALIDATORS_SUCCEEDED","VIOLATIONS","UNESTABLISHED_ITEMS"],"28":["ARTIFACT","AUDITED_HASH","RELEASE_HASH","HASH_MATCH"],"29":["REQ_ID","SOURCE","REQUIREMENT","INSTRUCTION","EXECUTION","PRODUCT_ELEMENT","TEST","TEST_RESULT","EVIDENCE","RELEASE_DECISION"],"30":["DEFECT_ID","DATE","ITERATION","PRODUCT_VERSION","REQUIREMENT","OBSERVED_FAILURE","ROOT_CAUSE","CORRECTION","REGRESSION_TEST","VERIFICATION_RESULT"]},E={stage:['NOT_STARTED','IN_PROGRESS','COMPLETE','BLOCKED','FAILED'],truth:['TRUE','FALSE','UNKNOWN','N_A'],release:['ACCEPTED','REJECTED','BLOCKED'],reqType:['USER','AUTHORITATIVE','FORMAT','DEPENDENCY','PROHIBITION','APPLICABILITY','QUALITY'],reqStatus:['CANDIDATE','RESOLVED','BLOCKED','SUPERSEDED'],sourceRole:['MANDATORY','INFORMATIVE','EVIDENTIARY'],sourceType:['USER_INPUT','FILE','WEB','STATUTE','REGULATION','STANDARD','POLICY','SPECIFICATION','DATA','OTHER'],authority:['USER','CONTROLLING','BINDING','PERSUASIVE','INFORMATIVE','UNKNOWN'],verify:['FORMAL_PROOF','EXACT_COMPUTATION','DETERMINISTIC_PROGRAM','SCHEMA_VALIDATION','SOURCE_COMPARISON','RULE_BASED','SEMANTIC_EVALUATION','AUTHORIZED_HUMAN_JUDGMENT'],vresult:['SATISFIED','VIOLATED','UNDETERMINED'],defect:['SOURCE_DEFECT','RESEARCH_DEFECT','REQUIREMENT_DEFECT','TEST_DEFECT','INSTRUCTION_DEFECT','INPUT_DEFECT','EXECUTION_DEFECT','TOOL_DEFECT','AUDIT_DEFECT']};let D=JSON.parse(localStorage.clt||'{"jobs":[]}'),jid=D.jid||null;const A=document.getElementById('app');function save(){D.jid=jid;localStorage.clt=JSON.stringify(D);hdr()}function j(){return D.jobs.find(x=>x.id==jid)}function uid(p){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase()}function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function hdr(){document.getElementById('sub').innerHTML='<small>'+(j()?j().id+' • Stage '+j().current+'/30':'No job selected')+'</small>'}function copy(t){navigator.clipboard.writeText(t).catch(()=>prompt('Copy:',t))}function nj(){let x={id:uid('JOB'),title:'',objective:'',deliverable:'',materials:'',constraints:'',format:'UNSPECIFIED',deadline:'',authorities:'',tools:'',prohibited:'',unknowns:'',current:1,inputVersion:1,st:S.map((n,i)=>({n:i+1,status:'NOT_STARTED',input:'',result:'',handoff:'',agent:'',ids:gen(i+1)})),sources:[],requirements:[],tests:[],runs:[],defects:[],artifacts:[]};D.jobs.unshift(x);jid=x.id;save();intake()}function gen(n){if(n==10)return'FREEZE_ID: '+uid('FREEZE');if(n==17||n==19)return'ITERATION_ID: '+uid('ITER');if(n==20)return'BASELINE_ID: '+uid('BASELINE');if(n==21)return'PRODUCT_ID: '+uid('PRODUCT')+'\nEXECUTION_ID: '+uid('EXEC');return''}function jobs(){A.innerHTML='<div class=row><button onclick=nj()>New Job</button></div>'+(D.jobs.length?D.jobs.map(x=>`<div class=c><b>${esc(x.title||'Untitled')}</b><br><small>${x.id}</small><p>${esc(x.objective)}</p><button onclick="jid='${x.id}';save();flow()">Open</button> <button class=s onclick="jid='${x.id}';save();intake()">Edit</button></div>`).join(''):'<div class=c>No jobs yet.</div>')}function intake(){let x=j();A.innerHTML=`<div class=c><label>Job title</label><input value="${esc(x.title)}" oninput="j().title=this.value;save()"><label>Exact objective</label><textarea oninput="j().objective=this.value;save()">${esc(x.objective)}</textarea><label>Exact deliverable</label><textarea oninput="j().deliverable=this.value;save()">${esc(x.deliverable)}</textarea><label>Supplied files/messages/links/data</label><textarea oninput="j().materials=this.value;save()">${esc(x.materials)}</textarea><label>Constraints</label><textarea oninput="j().constraints=this.value;save()">${esc(x.constraints)}</textarea><label>Required output format</label><input value="${esc(x.format)}" oninput="j().format=this.value;save()"><label>Deadline / temporal scope</label><input value="${esc(x.deadline)}" oninput="j().deadline=this.value;save()"><label>Known authorities</label><textarea oninput="j().authorities=this.value;save()">${esc(x.authorities)}</textarea><label>Available tools</label><textarea oninput="j().tools=this.value;save()">${esc(x.tools)}</textarea><label>Prohibited actions</label><textarea oninput="j().prohibited=this.value;save()">${esc(x.prohibited)}</textarea><label>Known unknowns</label><textarea oninput="j().unknowns=this.value;save()">${esc(x.unknowns)}</textarea><button onclick=flow()>Done</button></div>`}function flow(){if(!j())return jobs();let x=j();A.innerHTML=S.map((n,i)=>`<div class=stage onclick=stage(${i+1})><b>${String(i+1).padStart(2,'0')}. ${n}</b><br><span class=pill>${x.st[i].status}</span></div>`).join('')}function sel(a,v,act){return'<select onchange="'+act+'">'+a.map(z=>`<option ${z==v?'selected':''}>${z}</option>`).join('')+'</select>'}function stage(n){let x=j(),s=x.st[n-1];let fields=(F[n]||['STAGE_SPECIFIC_RECORD','EVIDENCE','STATUS']);A.innerHTML=`<button class=s onclick=flow()>← Workflow</button><h2>${n}. ${S[n-1]}</h2><div class=c><label>Status</label>${sel(E.stage,s.status,`j().st[${n-1}].status=this.value;save()`)}<label>Agent/chat ID</label><input value="${esc(s.agent)}" oninput="j().st[${n-1}].agent=this.value;save()">${s.ids?'<pre>'+esc(s.ids)+'</pre>':''}<label>Prior handoff/input</label><textarea oninput="j().st[${n-1}].input=this.value;save()">${esc(s.input)}</textarea><button onclick="copy(promptFor(${n}))">Copy Agent Prompt</button></div><div class=c><small>Required output fields</small><pre>${fields.join('\n')}</pre><label>Paste complete agent result</label><textarea oninput="j().st[${n-1}].result=this.value;save()">${esc(s.result)}</textarea><button onclick=process(${n})>Process Result</button></div><div class=c><label>Next-stage handoff</label><textarea oninput="j().st[${n-1}].handoff=this.value;save()">${esc(s.handoff)}</textarea><button onclick="copy(j().st[${n-1}].handoff)">Copy Handoff</button></div>`}function process(n){let x=j(),s=x.st[n-1],u=s.result.toUpperCase();if(u.includes('STAGE_STATUS: COMPLETE'))s.status='COMPLETE';else if(u.includes('STAGE_STATUS: BLOCKED'))s.status='BLOCKED';else if(u.includes('STAGE_STATUS: FAILED'))s.status='FAILED';let m=/NEXT_STAGE_HANDOFF_BLOCK\s*:\s*([\s\S]*)/i.exec(s.result);if(m){s.handoff=m[1].trim();if(n<30)x.st[n].input=s.handoff}if(s.status=='COMPLETE')x.current=Math.min(30,Math.max(x.current,n+1));save();stage(n)}function promptFor(n){let x=j(),s=x.st[n-1],fields=(F[n]||['STAGE_SPECIFIC_RECORD','EVIDENCE','STATUS']);return`CLOSED-LOOP AGENT RELIABILITY WORKFLOW\nJOB_ID: ${x.id}\nSTAGE_ID: STAGE-${String(n).padStart(2,'0')}\nSTAGE_NAME: ${S[n-1]}\n\nOPERATING RULES\n- Perform all research, analysis, drafting, testing, validation, comparison, calculations, hashing, and root-cause work yourself when you can.\n- Do not invent facts. Use UNKNOWN. Mandatory UNKNOWN that prevents verification is BLOCKED.\n- Preserve exact source evidence and versions.\n- Do not self-validate when the workflow requires independent evaluation.\n\nOBJECTIVE\n${x.objective}\n\nDELIVERABLE\n${x.deliverable}\n\nCONSTRAINTS\n${x.constraints||'NONE'}\n\nPROHIBITED ACTIONS\n${x.prohibited||'NONE'}\n\nGENERATED IDS\n${s.ids||'NONE'}\n\nPRIOR HANDOFF\n${s.input||'NONE'}\n\nREQUIRED FIELDS\n${fields.map(f=>f+':').join('\n')}\n\nSTAGE_STATUS: COMPLETE | BLOCKED | FAILED\nNEXT_STAGE_AUTHORIZED: TRUE | FALSE\nNEXT_STAGE_HANDOFF_BLOCK:\n[complete exact handoff for next agent]`}function regs(){if(!j())return jobs();let x=j();A.innerHTML=['sources','requirements','tests','runs','defects','artifacts'].map(k=>`<div class=c><b>${k.toUpperCase()}</b> — ${x[k].length}<br><button onclick="add('${k}')">Add ID</button><pre>${x[k].map(v=>v.id).join('\n')}</pre></div>`).join('')}function add(k){let p={sources:'SRC',requirements:'REQ',tests:'TEST',runs:'RUN',defects:'DEFECT',artifacts:'ART'}[k];j()[k].push({id:uid(p)});save();regs()}function backup(){A.innerHTML='<div class=c><button onclick=exportJ()>Export JSON</button><p><small>Use Safari Share → Add to Home Screen for app-like access.</small></p></div>'}function exportJ(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='closed-loop-backup.json';a.click()}hdr();jobs();</script></body></html>
