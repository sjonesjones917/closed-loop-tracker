<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Closed-Loop Reliability</title>
<style>
:root{
  color-scheme:light;
  --ink:#171717;
  --muted:#676767;
  --line:#d9d9d5;
  --soft:#f6f6f3;
  --surface:#ffffff;
  --accent:#1259d9;
  --accent-soft:#edf3ff;
  --danger:#a42318;
  --success:#126a3a;
  --shadow:0 12px 34px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html{background:var(--soft)}
body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid rgba(18,89,217,.28);outline-offset:2px}
.app{width:min(100%,900px);min-height:100vh;margin:0 auto;background:var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.app-header{position:sticky;top:0;z-index:20;padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-row{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.brand{min-width:0}
.brand h1{font-size:19px;line-height:1.18;margin:0;font-weight:800;letter-spacing:-.015em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.project-picker-wrap{min-width:210px;max-width:46%}
.project-picker-wrap label{display:block;margin:0 0 4px;color:var(--muted);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.055em}
#project-picker{width:100%;min-height:40px;border:1px solid #aaa;border-radius:10px;background:#fff;padding:8px 34px 8px 10px;font-weight:700;color:var(--ink)}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.header-actions button,.header-actions .button{min-height:40px;border:1px solid #999;border-radius:10px;background:#fff;color:var(--ink);padding:8px 13px;font-weight:750;line-height:1.15;text-decoration:none}
.header-actions button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.header-actions button[data-active="true"]{background:var(--accent-soft);border-color:var(--accent);color:#0d47b3}
.progress-row{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;margin-top:12px}
#count{font-size:13px;font-weight:700;white-space:nowrap}
.bar{height:7px;background:#e4e4e0;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:inherit;transition:width .2s ease}
main{padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.workspace[hidden]{display:none!important}
.stage-toolbar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:0 0 12px}
.stage-toolbar button{height:42px;border:1px solid #aaa;border-radius:10px;background:#fff;font-size:20px;font-weight:700}
.stage-toolbar select{width:100%;height:42px;border:1px solid #888;border-radius:10px;background:#fff;padding:8px 34px 8px 11px;font-weight:750}
#nav{display:none!important}
#master{display:none}
#content{min-height:260px}
.card,#content>.card,#content>section,#content>article{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;margin:12px 0;box-shadow:none}
.card h2,#content h2{font-size:19px;line-height:1.25;margin:0 0 10px;letter-spacing:-.01em}
.card h3,#content h3{font-size:13px;line-height:1.25;margin:18px 0 7px;text-transform:none;letter-spacing:0}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-weight:750;font-size:12px;margin:11px 0 5px}
textarea,input:not([type="checkbox"]):not([type="radio"]),select{width:100%;min-height:40px;border:1px solid #aaa;border-radius:9px;background:#fff;padding:9px 10px;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
input[type="checkbox"],input[type="radio"]{inline-size:20px;block-size:20px;vertical-align:middle}
#content button{min-height:40px;border:1px solid #999;border-radius:9px;background:#fff;padding:8px 12px;font-weight:700}
#content button.primary,#content button.active{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important}
.copy,pre.code{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f4f1;border:1px solid #ddd;border-radius:10px;padding:12px;max-height:430px;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
details{border-radius:10px}
summary{cursor:pointer}
.human-project{display:grid;gap:14px}
.project-hero{border:1px solid var(--line);border-radius:15px;padding:17px;background:linear-gradient(180deg,#fff,#fafaf8)}
.project-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.project-hero h2{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.02em}
.project-hero p{margin:7px 0 0;color:var(--muted)}
.status-chip{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:800;white-space:nowrap}
.status-chip.accepted,.status-chip.complete,.status-chip.satisfied{background:#e8f6ee;color:var(--success)}
.status-chip.blocked,.status-chip.rejected,.status-chip.violated{background:#feeceb;color:var(--danger)}
.project-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:15px}
.fact{min-width:0;border:1px solid #e0e0dc;border-radius:10px;background:#fff;padding:10px}
.fact strong{display:block;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.fact span{display:block;margin-top:3px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.project-tabs{display:flex;gap:7px;overflow:auto;padding:1px 1px 4px;scrollbar-width:thin}
.project-tabs button{flex:0 0 auto;min-height:40px;border:1px solid #aaa;border-radius:999px;background:#fff;padding:7px 13px;font-weight:750}
.project-tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.project-panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.project-panel h2{font-size:19px;margin:0 0 12px}
.project-panel h3{font-size:15px;margin:18px 0 8px}
.data-list{display:grid;gap:10px}
.data-row{display:grid;grid-template-columns:minmax(150px,.42fr) minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #ecece9}
.data-row:last-child{border-bottom:0}
.data-key{font-weight:750;font-size:12px;color:#444;overflow-wrap:anywhere}
.data-value{min-width:0;overflow-wrap:anywhere}
.record-card{border:1px solid #ddd;border-radius:12px;padding:0;background:#fff;overflow:hidden}
.record-card>summary{list-style:none;padding:13px 14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px}
.record-card>summary::-webkit-details-marker{display:none}
.record-card>summary::after{content:"+";font-size:19px;color:#666}
.record-card[open]>summary::after{content:"−"}
.record-body{border-top:1px solid #e5e5e2;padding:14px}
.record-meta{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 9px}
.record-meta span{background:#f1f1ee;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}
.stage-record-list{display:grid;gap:9px}
.stage-record-list .record-card>summary{align-items:flex-start}
.prompt-actions,.artifact-actions,.panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.prompt-actions button,.artifact-actions button,.panel-actions button{min-height:40px;border:1px solid #999;border-radius:9px;background:#fff;padding:7px 11px;font-weight:700}
.prompt-actions button.primary,.artifact-actions button.primary,.panel-actions button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.empty-state{padding:20px;border:1px dashed #bbb;border-radius:12px;text-align:center;color:var(--muted)}
.raw-json{max-height:66vh}
.reference-grid{display:grid;gap:10px}
.reference-grid details{border:1px solid #ddd;border-radius:12px;padding:0;background:#fff}
.reference-grid summary{padding:13px 14px;font-weight:800}
.reference-grid .reference-body{padding:0 14px 14px}
.notice{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:11px 12px;color:#123b78}
.notice.danger{border-left-color:var(--danger);background:#fff0ef;color:#7d2119}
.screen-reader-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
[data-human-hidden="true"],#repository-test-project,#human-test-project,#run-test-project,#appendix-operational-purpose,[data-integrated-operational-controls="true"]{display:none!important}
@media(max-width:680px){
  .header-row{display:block}.project-picker-wrap{max-width:none;width:100%;margin-top:11px}.project-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.data-row{grid-template-columns:1fr;gap:4px}.app-header{position:relative}.brand h1{font-size:18px}
}
@media(max-width:390px){
  .header-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.header-actions button{width:100%;padding-inline:8px}.project-hero-top{display:block}.status-chip{margin-top:10px}.project-facts{grid-template-columns:1fr 1fr}.fact strong{font-size:15px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app-shell">
<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <h1>Closed-Loop Reliability</h1>
      <p id="job">Loading current job…</p>
    </div>
    <div class="project-picker-wrap">
      <label for="project-picker">Project</label>
      <select id="project-picker" aria-label="Select project">
        <option value="working">Current working job</option>
        <option value="retained">Completed test project</option>
      </select>
    </div>
  </div>
  <div class="header-actions" aria-label="Workbook actions">
    <button id="new-job-button" class="primary" type="button">New clean job</button>
    <button id="import-button" type="button">Import</button>
    <button id="export-button" type="button">Export</button>
    <button id="project-data-button" type="button">Project data</button>
    <button id="guide-button" type="button">Guide</button>
    <input id="imp" type="file" hidden accept=".json,application/json">
  </div>
  <div class="progress-row">
    <span id="count">0/30 complete</span>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  </div>
</header>
<main>
  <section id="workspace-workbook" class="workspace" aria-label="30-stage workbook">
    <div id="stage-toolbar" class="stage-toolbar" aria-label="Stage navigation">
      <button id="previous-stage" type="button" aria-label="Previous stage">‹</button>
      <label class="screen-reader-only" for="stage-select">Current stage</label>
      <select id="stage-select"></select>
      <button id="next-stage" type="button" aria-label="Next stage">›</button>
    </div>
    <div id="master"></div>
    <div id="nav"></div>
    <div id="content"><div class="card"><h2>Loading workbook…</h2><p class="muted">The existing 30-stage workbook is loading.</p></div></div>
  </section>
  <section id="workspace-project" class="workspace" hidden aria-label="Complete project data"></section>
  <section id="workspace-guide" class="workspace" hidden aria-label="Workbook guide"></section>
</main>
</div>
<script>
globalThis.job=document.getElementById('job');
globalThis.count=document.getElementById('count');
globalThis.bar=document.getElementById('bar');
globalThis.nav=document.getElementById('nav');
globalThis.content=document.getElementById('content');
globalThis.imp=document.getElementById('imp');
</script>
<script src="workbook.js"></script>
</body>
</html>
