<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#f7f7f5">
<title>Closed-Loop Reliability</title>
<style>
:root{
  --ink:#161616;--muted:#626262;--line:#d7d7d2;--soft:#f7f7f5;--panel:#fff;
  --accent:#174ea6;--accent-soft:#edf3ff;--danger:#a1261c;--danger-soft:#fff0ee;
  --success:#17643a;--success-soft:#eaf7ef;--warn:#825500;--warn-soft:#fff4d8;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.05)
}
*{box-sizing:border-box}
html{background:var(--soft);color-scheme:light}
body{margin:0;color:var(--ink);background:var(--soft);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled,input:disabled,textarea:disabled,select:disabled{cursor:not-allowed;opacity:.58}
[hidden]{display:none!important}
.app{width:min(100%,920px);min-height:100vh;margin:0 auto;background:var(--panel);box-shadow:0 0 0 1px rgba(0,0,0,.03)}
.app-header{position:sticky;top:0;z-index:20;padding:max(9px,env(safe-area-inset-top)) 11px 8px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.header-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,280px);gap:10px;align-items:start}
.brand h1{font-size:17px;line-height:1.15;margin:0}
.brand p{font-size:10.5px;color:var(--muted);margin:3px 0 0;overflow-wrap:anywhere}
.project-select label{display:block;margin:0 0 3px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.project-select select{width:100%;height:40px;border:1px solid #9f9f9a;border-radius:9px;background:#fff;padding:7px 30px 7px 9px;font-weight:700;font-size:11.5px}
.header-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.header-actions button,.file-button{min-height:38px;max-height:44px;border:1px solid #999;border-radius:9px;background:#fff;padding:7px 10px;font-size:11px;font-weight:750}
.header-actions .primary{background:var(--ink);border-color:var(--ink);color:#fff}
.progress-line{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:7px}
.progress-line strong{font-size:10px;white-space:nowrap}
.progress-track{height:5px;border-radius:999px;background:#e5e5e1;overflow:hidden}.progress-track i{display:block;height:100%;background:var(--ink);width:0}
.view-tabs{position:sticky;top:116px;z-index:15;display:flex;gap:4px;overflow-x:auto;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.view-tabs::-webkit-scrollbar{display:none}
.view-tabs button{flex:0 0 auto;min-height:38px;max-height:44px;border:1px solid #a6a6a1;border-radius:9px;background:#fff;padding:7px 10px;font-size:10.5px;font-weight:750}
.view-tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:10px 11px calc(28px + env(safe-area-inset-bottom))}
.screen{display:grid;gap:9px}
.panel,.hero,.record-card,.stage-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.panel,.hero{padding:10px}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hero h2{font-size:18px;line-height:1.25;margin:0}.hero p{margin:4px 0 0;color:var(--muted);font-size:11.5px}
.status{display:inline-flex;align-items:center;min-height:24px;padding:3px 7px;border-radius:999px;background:#eee;font-size:9px;font-weight:850;white-space:nowrap}
.status.success{background:var(--success-soft);color:var(--success)}.status.danger{background:var(--danger-soft);color:var(--danger)}.status.warn{background:var(--warn-soft);color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:9px}.fact{border:1px solid #e1e1dc;border-radius:9px;padding:7px;min-width:0}.fact strong{display:block;font-size:14px;overflow-wrap:anywhere}.fact span{display:block;margin-top:2px;color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:.03em}
h2.section-title{font-size:15px;margin:0 0 8px}.section-intro{font-size:11px;color:var(--muted);margin:-3px 0 8px}
.notice{padding:8px 9px;border-left:3px solid var(--accent);border-radius:8px;background:var(--accent-soft);color:#173d75;font-size:11px}.notice.danger{border-left-color:var(--danger);background:var(--danger-soft);color:#7d1e16}.notice.success{border-left-color:var(--success);background:var(--success-soft);color:#155633}.notice.warn{border-left-color:var(--warn);background:var(--warn-soft);color:#6e4900}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{min-width:0}.field label,.group-label{display:block;margin:7px 0 4px;font-size:10.5px;font-weight:800;color:#333}.field .help{display:block;margin:3px 0 0;color:var(--muted);font-size:9.5px}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select{width:100%;min-height:40px;border:1px solid #a8a8a2;border-radius:9px;background:#fff;padding:8px 9px}
textarea{min-height:92px;resize:vertical}.small-textarea{min-height:68px}.code-text{font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.check-list{display:grid;gap:5px}.check{display:grid;grid-template-columns:22px 1fr;gap:7px;align-items:start;border:1px solid #e2e2dd;border-radius:8px;padding:7px;background:#fff}.check input{width:20px;height:20px;margin:0}.check span{font-size:10.5px}
.button-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.button-row button,.compact-button,.record-card button,.stage-card button{min-height:38px;max-height:44px;border:1px solid #999;border-radius:9px;background:#fff;padding:7px 10px;font-size:10.5px;font-weight:750}.button-row .primary,.compact-button.primary{background:var(--ink);border-color:var(--ink);color:#fff}.button-row .danger{border-color:var(--danger);color:var(--danger)}
.stage-nav{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;gap:6px;align-items:center}.stage-nav button{width:38px;height:38px;border:1px solid #999;border-radius:9px;background:#fff;font-size:18px}.stage-nav select{height:38px;font-size:11px;font-weight:750}
.stage-card{padding:9px}.stage-card.current{border-color:var(--accent);background:#fbfcff}.stage-head{display:grid;grid-template-columns:35px minmax(0,1fr) auto;gap:7px;align-items:start}.stage-number{font-size:10px;font-weight:850;color:var(--muted)}.stage-name{font-size:11px;font-weight:800}.stage-meta{margin-top:2px;font-size:9.5px;color:var(--muted)}
.workflow-list{display:grid;gap:5px}.workflow-button{width:100%;text-align:left;border:0;background:transparent;padding:0}
.record-stack{display:grid;gap:6px}.record-card{overflow:hidden}.record-card>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px;font-size:10.5px;font-weight:800}.record-card>summary::-webkit-details-marker{display:none}.record-card .record-body{padding:9px;border-top:1px solid #e4e4df}
.record-rows{display:grid}.record-row{display:grid;grid-template-columns:minmax(135px,31%) minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid #ededeb}.record-row:last-child{border-bottom:0}.record-key{font-size:9.5px;font-weight:800;color:#555;overflow-wrap:anywhere}.record-value{font-size:10.5px;overflow-wrap:anywhere;white-space:pre-wrap}.record-value.empty{color:var(--muted);font-style:italic}
.prompt{max-height:420px;overflow:auto;border:1px solid #d8d8d2;border-radius:9px;background:#f5f5f2;padding:9px;font:10.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;padding:7px;border:1px solid #e0e0db;border-radius:8px;margin-top:5px}.file-row strong{display:block;font-size:10.5px}.file-row small{display:block;color:var(--muted);font-size:9px;overflow-wrap:anywhere}
.table-scroll{overflow-x:auto;border:1px solid #ddd;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #e7e7e3;padding:7px;overflow-wrap:anywhere}th{background:#f4f4f1;font-size:9px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}
.empty-state{padding:16px 10px;text-align:center;color:var(--muted);font-size:11px;border:1px dashed #c8c8c2;border-radius:9px}
.tag-list{display:flex;gap:4px;flex-wrap:wrap}.tag{display:inline-flex;padding:3px 6px;border-radius:999px;background:#efefec;font-size:9px;font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}.screen-reader-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
dialog{width:min(calc(100% - 22px),620px);max-height:88vh;border:1px solid #aaa;border-radius:12px;padding:0;box-shadow:0 18px 55px rgba(0,0,0,.23)}dialog::backdrop{background:rgba(0,0,0,.38)}.dialog-body{padding:12px;overflow:auto;max-height:88vh}.dialog-body h2{margin:0 0 5px;font-size:16px}
@media(max-width:620px){
  .header-main{grid-template-columns:1fr}.project-select{margin-top:3px}.view-tabs{top:182px}.facts{grid-template-columns:1fr 1fr}.hero-top{display:block}.status{margin-top:6px}.grid-2,.grid-3{grid-template-columns:1fr}.record-row{grid-template-columns:1fr;gap:2px}.header-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.header-actions button{width:100%;padding-left:5px;padding-right:5px}.button-row>button{flex:1 1 130px}
}
@media(max-width:360px){.app-header{padding-left:8px;padding-right:8px}.view-tabs{padding-left:8px;padding-right:8px}.view-tabs button{padding-left:8px;padding-right:8px}main{padding-left:8px;padding-right:8px}.header-actions{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}.stage-head{grid-template-columns:30px minmax(0,1fr)}.stage-head .status{grid-column:2}}
@media print{.app-header,.view-tabs,.button-row{display:none!important}.app{width:100%;box-shadow:none}main{padding:0}.record-card{break-inside:avoid}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <div class="header-main">
      <div class="brand"><h1>Closed-Loop Reliability</h1><p id="current-project-summary" aria-live="polite">Loading the current project…</p></div>
      <div class="project-select"><label for="project-picker">Project</label><select id="project-picker"></select></div>
    </div>
    <div class="header-actions">
      <button class="primary" id="new-project" type="button">New project</button>
      <button id="export-project" type="button">Export</button>
      <button id="import-project" type="button">Import</button>
      <input id="import-file" type="file" hidden accept=".json,application/json">
    </div>
    <div class="progress-line"><strong id="progress-label">0/30 complete</strong><div class="progress-track" aria-hidden="true"><i id="progress-bar"></i></div></div>
  </header>
  <nav class="view-tabs" id="view-tabs" aria-label="Project views"></nav>
  <main><section class="screen" id="screen"><div class="panel"><h2 class="section-title">Loading the workflow…</h2></div></section></main>
</div>
<dialog id="app-dialog"><div class="dialog-body" id="dialog-body"></div></dialog>
<script src="workbook.js"></script>
<script src="app.js"></script>
</body>
</html>
