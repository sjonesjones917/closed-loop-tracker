<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Closed Loop Workflow</title>
<style>
:root{--bg:#08111e;--p:#111d30;--p2:#17263d;--line:#2b3d5b;--t:#f6f9ff;--m:#9eacc4;--b:#6bb0ff;--g:#60d57d;--a:#ffd166;--r:#ff7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui;padding-bottom:82px}header{position:sticky;top:0;z-index:9;background:#08111ef5;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 13px 9px}h1{font-size:19px;margin:0}main{padding:13px;max-width:900px;margin:auto}.c{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px}.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.muted,small,label{color:var(--m)}button,input,textarea,select{font:inherit;border-radius:11px}button{border:0;padding:10px 12px;background:var(--b);color:#06101c;font-weight:800}button.s{background:var(--p2);color:var(--t);border:1px solid var(--line)}input,textarea,select{width:100%;background:#091523;color:#fff;border:1px solid var(--line);padding:10px;font-size:16px}textarea{min-height:105px}label{display:block;font-size:12px;margin:10px 0 5px}.stage{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:13px;padding:10px;margin:7px 0}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--p2);font-size:12px;font-weight:900}.pill{font-size:10px;border-radius:99px;padding:5px 7px;background:var(--p2);color:var(--m)}.pill.COMPLETE{background:var(--g);color:#06230e}.pill.BLOCKED{background:var(--a);color:#302100}.pill.FAILED{background:var(--r);color:#300}.pill.IN_PROGRESS{background:var(--b);color:#06101c}pre{white-space:pre-wrap;word-break:break-word;background:#07101b;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:12px;max-height:460px;overflow:auto}.notice{border-left:4px solid var(--b)}.warn{border-left:4px solid var(--a)}.bad{border-left:4px solid var(--r)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--p2);padding:10px;border-radius:11px;text-align:center}.metric b{display:block;font-size:19px}nav{position:fixed;left:0;right:0;bottom:0;background:#08111efa;border-top:1px solid var(--line);padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}nav button{font-size:11px;padding:9px 2px;background:var(--p2);color:var(--m)}.run{border-top:1px solid var(--line);padding:10px 0}.hidden{display:none}.ok{border-left:4px solid var(--g)}
</style></head>
<body><header><div class="row between"><div><h1>Closed Loop Workflow</h1><small id="sub">No job selected</small></div><button class="s" onclick="backup()">Backup</button></div></header>
<main id="app"></main><nav><button onclick="jobs()">Jobs</button><button onclick="flow()">Workflow</button><button onclick="records()">Records</button><button onclick="blockers()">Blockers</button></nav>
<script src="spec.js"></script><script src="engine-base.js"></script><script src="engine-contract.js"></script><script src="engine-validate.js"></script><script src="engine-batch.js"></script><script>
const C=ClosedLoopCore, KEY="closed_loop_engine_v1"; let D=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[]}'),jid=D.jid||null; const A=document.getElementById("app");
function save(){D.jid=jid;localStorage.setItem(KEY,JSON.stringify(D));hdr()}function j(){return D.jobs.find(x=>x.id===jid)}function hdr(){document.getElementById("sub").textContent=j()?j().id+" • Stage "+j().currentStage+"/30":"No job selected"}
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}async function cp(t){try{await navigator.clipboard.writeText(t)}catch{prompt("Copy:",t)}}
function nj(){let x=C.newJob();D.jobs.unshift(x);jid=x.id;save();intake()}function jobs(){A.innerHTML='<div class="row between"><h2>Jobs</h2><button onclick="nj()">New Job</button></div>'+(D.jobs.length?D.jobs.map(x=>`<div class="c"><b>${esc(x.title||"Untitled job")}</b><br><small>${x.id}</small><p class="muted">${esc(x.objective||"No objective entered.")}</p><button onclick="jid='${x.id}';save();flow()">Open</button> <button class="s" onclick="jid='${x.id}';save();intake()">Job input</button></div>`).join(""):'<div class="c notice"><b>Create a job.</b><p class="muted">Stage 1 is performed by the app from the job information. The first agent task is Stage 2.</p></div>');hdr()}
function f(label,key,area=false){return `<label>${label}</label>`+(area?`<textarea oninput="j()['${key}']=this.value;refreshStage1();save()">${esc(j()[key]||"")}</textarea>`:`<input value="${esc(j()[key]||"")}" oninput="j()['${key}']=this.value;refreshStage1();save()">`)}
function refreshStage1(){if(!j())return;j().stages[0].result=C.stage1Record(j())}
function intake(){if(!j())return jobs();A.innerHTML='<div class="row between"><h2>Job Input — Stage 1</h2><button class="s" onclick="finishIntake()">Save Stage 1</button></div><div class="c notice"><b>You enter only the job facts here.</b><p class="muted">The app generates JOB_ID and INPUT-v001. It does not send Stage 1 to an agent.</p></div><div class="c">'+f("Job name","title")+f("Exact user objective","objective",true)+f("Exact deliverable requested","deliverable",true)+f("All supplied files, messages, links, data, and constraints","supplied",true)+f("Required output format","format")+f("Deadline or temporal scope","deadline")+f("Known authoritative sources","authorities",true)+f("Available tools","tools",true)+f("Prohibited actions","prohibited",true)+f("Unknown information that may affect correctness","unknowns",true)+f("Explicit user requirements","explicitRequirements",true)+f("Assumptions","assumptions",true)+'</div><div class="c"><b>Generated Stage 1 record</b><pre>'+esc(C.stage1Record(j()))+'</pre></div>'}
function finishIntake(){refreshStage1();j().stages[0].validated=true;j().stages[0].status="COMPLETE";j().currentStage=Math.max(2,j().currentStage);save();flow()}
function flow(){if(!j())return jobs();let x=j(),c=x.stages.filter(s=>s.status==="COMPLETE").length,b=x.stages.filter(s=>s.status==="BLOCKED").length;A.innerHTML=`<div class="row between"><h2>${esc(x.title||"Workflow")}</h2><button class="s" onclick="intake()">Job input</button></div><div class="grid"><div class="metric"><b>${c}/30</b><small>Complete</small></div><div class="metric"><b>${b}</b><small>Blocked</small></div><div class="metric"><b>${x.iteration}</b><small>Iteration</small></div><div class="metric"><b>${x.releaseState||"—"}</b><small>Release</small></div></div><h3>Workflow</h3>`+C.STAGE_NAMES.map((name,i)=>{let s=x.stages[i];return `<div class="stage" onclick="stage(${i+1})"><div class="num">${String(i+1).padStart(2,"0")}</div><div><b>${esc(name)}</b><div class="muted" style="font-size:11px">${i===0?"Completed from job input":i+1===x.currentStage?"Next required work":"Workflow stage"}</div></div><span class="pill ${s.status}">${s.status.replaceAll("_"," ")}</span></div>`}).join("")}
function stage(n){if(n===1)return intake(); if([11,12,17,19].includes(n))return batchStage(n); let x=j(),s=x.stages[n-1],p=C.buildPrompt(x,n);A.innerHTML=`<div class="row between"><button class="s" onclick="flow()">← Workflow</button><span class="pill ${s.status}">${s.status}</span></div><h2>${n}. ${esc(C.STAGE_NAMES[n-1])}</h2><div class="c"><b>What the agent must do</b><pre>${esc(C.STAGE_INSTRUCTIONS[n])}</pre></div><div class="c notice"><b>Your action</b><p class="muted">Copy this task to the agent that should perform this stage. Paste the agent's complete result below. The app validates the workflow gate; it does not ask you to decide whether the stage passed.</p><button onclick="cp(C.buildPrompt(j(),${n}));markStarted(${n})">Copy executable Stage ${n} task</button></div><div class="c"><details><summary>Exact task packet</summary><pre>${esc(p)}</pre></details><label>Complete agent result</label><textarea id="res" style="min-height:300px">${esc(s.result)}</textarea><div class="row wrap"><button onclick="saveStage(${n})">Validate + Save</button></div><div id="validation"></div></div>`}
function markStarted(n){let s=j().stages[n-1];if(s.status==="NOT_STARTED")s.status="IN_PROGRESS";save()}
function saveStage(n){let t=document.getElementById("res").value,r=C.saveStandardStage(j(),n,t);save();let v=document.getElementById("validation");v.className="c "+(r.validation.ok?"ok":"bad");v.innerHTML="<b>"+(r.validation.ok?"Stage gate satisfied":"Stage gate not satisfied")+"</b><p>"+esc(r.validation.reason||"Result accepted.")+"</p>";if(r.validation.ok)setTimeout(()=>flow(),600)}
function kindFor(n){return n===11?"candidate":n===17?"rerun":"confirmation"}
function batchStage(n){let x=j(),kind=kindFor(n),s=x.stages[n-1];if(n===12){C.createRunBatch(x,"candidate",11);save();return verificationView()}let arr=C.createRunBatch(x,kind,n);save();A.innerHTML=`<div class="row between"><button class="s" onclick="flow()">← Workflow</button><span class="pill ${s.status}">${s.status}</span></div><h2>${n}. ${esc(C.STAGE_NAMES[n-1])}</h2><div class="c"><b>Exact workflow requirement</b><pre>${esc(C.STAGE_INSTRUCTIONS[n])}</pre></div><div class="c notice"><b>Ten independent executions</b><p class="muted">Each row has its own task packet. Do not paste one run's output into another run.</p></div>`+arr.map((r,i)=>`<div class="c run"><div class="row between"><b>${r.runId}</b><span class="pill ${r.status}">${r.status}</span></div><button onclick="cp(j().runs['${kind}'][${i}].prompt)">Copy ${r.runId} task</button><label>${r.runId} output</label><textarea id="run_${i}">${esc(r.output)}</textarea><button class="s" onclick="saveRun('${kind}',${i})">Save ${r.runId}</button></div>`).join("")+`<div class="c"><button onclick="finishBatch(${n},'${kind}')">Validate all 10</button><div id="batchv"></div></div>`}
function saveRun(kind,i){C.saveRunOutput(j(),kind,i,document.getElementById("run_"+i).value);save();batchStage(kind==="candidate"?11:kind==="rerun"?17:19)}
function finishBatch(n,kind){let v=C.markBatchStage(j(),n,kind);save();if(v.ok){if(n===19)j().currentStage=20;save();flow()}else document.getElementById("batchv").innerHTML=`<p class="muted">${v.count}/10 complete. All ten are required.</p>`}
function verificationView(){let x=j(),s=x.stages[11],ps=C.createVerificationPrompts(x,"candidate");A.innerHTML=`<div class="row between"><button class="s" onclick="flow()">← Workflow</button><span class="pill ${s.status}">${s.status}</span></div><h2>12. ${esc(C.STAGE_NAMES[11])}</h2><div class="c"><b>Exact workflow requirement</b><pre>${esc(C.STAGE_INSTRUCTIONS[12])}</pre></div>`+ps.map((p,i)=>`<div class="c run"><b>${p.runId} verification</b><br><button onclick="cp(C.createVerificationPrompts(j(),'candidate')[${i}].prompt)">Copy independent verification task</button><label>Verification result</label><textarea id="ver_${i}">${esc(x.runs.candidate[i].verification)}</textarea><button class="s" onclick="saveVer(${i})">Save verification</button></div>`).join("")+`<div class="c"><button onclick="finishVer()">Validate all 10 verifications</button><div id="verv"></div></div>`}
function saveVer(i){C.saveVerification(j(),"candidate",i,document.getElementById("ver_"+i).value);save();verificationView()}
function finishVer(){let v=C.markVerificationStage(j(),12,"candidate");save();if(v.ok)flow();else document.getElementById("verv").innerHTML=`<p>${v.count}/10 conclusively verified. All ten are required.</p>`}
function records(){if(!j())return jobs();A.innerHTML='<h2>Evidence</h2><div class="c notice"><b>The complete stage results are the evidence records.</b><p class="muted">You do not recreate them manually.</p></div>'+j().stages.filter(s=>s.result.trim()).map(s=>`<div class="c"><div class="row between"><b>Stage ${s.number}</b><span class="pill ${s.status}">${s.status}</span></div><pre>${esc(s.result)}</pre></div>`).join("")}
function blockers(){if(!j())return jobs();A.innerHTML='<h2>Human-only blockers</h2><div class="c notice"><p class="muted">A blocker belongs here only when required information or action genuinely cannot be obtained or performed by the agent.</p></div>'+(j().blockers.length?j().blockers.map(b=>`<div class="c"><b>${esc(b.id)}</b><p>${esc(b.question)}</p></div>`).join(""):'<div class="c">No human-only blockers.</div>')}
function backup(){A.innerHTML='<h2>Backup</h2><div class="c"><button onclick="download()">Export job JSON</button> <button class="s" onclick="cp(C.exportState(j()))">Copy job JSON</button></div>'}
function download(){let b=new Blob([C.exportState(j())],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(j()?.id||"closed-loop")+".json";a.click();URL.revokeObjectURL(a.href)}
jobs();hdr();
</script></body></html>
