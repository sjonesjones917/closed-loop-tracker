<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Closed-Loop Reliability</title>
<style>
:root{--ink:#181818;--muted:#666;--line:#d9d9d4;--soft:#f6f6f3;--accent:#1557c9;--danger:#a42318;--success:#17643a;--warn:#8a5b00}
*{box-sizing:border-box}html{background:var(--soft)}body{margin:0;color:var(--ink);font:14px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}button,input,textarea,select{font:inherit}.app{width:min(100%,760px);min-height:100vh;margin:auto;background:#fff}.app-header{position:sticky;top:0;z-index:30;padding:max(10px,env(safe-area-inset-top)) 12px 9px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.98);backdrop-filter:blur(10px)}.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand h1{font-size:18px;line-height:1.15;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.project-picker-wrap{min-width:210px;max-width:46%}.project-picker-wrap label{display:block;margin:0 0 3px;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}#project-picker{width:100%;height:34px;border:1px solid #aaa;border-radius:8px;background:#fff;padding:5px 26px 5px 8px;font-weight:700;font-size:12px}.header-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.header-actions button{min-height:32px;border:1px solid #999;border-radius:8px;background:#fff;color:var(--ink);padding:5px 9px;font-weight:700;font-size:11.5px}.header-actions button.primary{background:var(--ink);border-color:var(--ink);color:#fff}.header-actions button[data-active="true"]{background:#edf3ff;border-color:var(--accent);color:#0d47b3}.progress-row{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;margin-top:8px}#count{font-size:10.5px;font-weight:700}.bar{height:4px;background:#e4e4e0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}main{padding:10px 12px calc(30px + env(safe-area-inset-bottom))}.workspace[hidden]{display:none!important}.stage-toolbar{display:grid;grid-template-columns:34px 1fr 34px;gap:5px;align-items:center;margin-bottom:8px}.stage-toolbar button{height:34px;border:1px solid #aaa;border-radius:8px;background:#fff;font-size:17px}.stage-toolbar select{width:100%;height:34px;border:1px solid #888;border-radius:8px;background:#fff;padding:5px 28px 5px 8px;font-weight:700;font-size:11.5px}#nav,#master{display:none!important}#content{min-height:220px}.card,#content>.card,#content>section,#content>article{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;margin:8px 0}.card h2,#content h2{font-size:16px;margin:0 0 7px}.card h3,#content h3{font-size:12px;margin:12px 0 5px}.muted{color:var(--muted);font-size:11px}label{display:block;font-weight:700;font-size:11px;margin:8px 0 4px}textarea,input:not([type="checkbox"]):not([type="radio"]),select{width:100%;min-height:34px;border:1px solid #aaa;border-radius:8px;background:#fff;padding:6px 8px}textarea{min-height:84px}#content button{min-height:32px;border:1px solid #999;border-radius:8px;background:#fff;padding:5px 9px;font-weight:700;font-size:11.5px}.copy{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f4f1;border:1px solid #ddd;border-radius:8px;padding:8px;max-height:360px;overflow:auto;font:11px/1.4 ui-monospace,monospace}.human-project{display:grid;gap:9px}.project-hero,.project-panel{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.project-hero-top{display:flex;justify-content:space-between;gap:10px}.project-hero h2{font-size:18px;margin:0}.project-hero p{margin:4px 0 0;color:var(--muted);font-size:12px}.status-chip{display:inline-flex;align-items:center;min-height:22px;padding:3px 6px;border-radius:999px;background:#eee;font-size:9px;font-weight:800;white-space:nowrap}.status-chip.satisfied{background:#e8f6ee;color:var(--success)}.status-chip.blocked{background:#feeceb;color:var(--danger)}.status-chip.warn{background:#fff4d8;color:var(--warn)}.project-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:9px}.fact{border:1px solid #e0e0dc;border-radius:8px;padding:7px}.fact strong{display:block;font-size:14px}.fact span{display:block;margin-top:2px;color:var(--muted);font-size:9px;text-transform:uppercase}.project-tabs{display:flex;gap:3px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.project-tabs::-webkit-scrollbar{display:none}.project-tabs button{flex:0 0 auto;min-height:30px;border:1px solid #aaa;border-radius:7px;background:#fff;padding:4px 8px;font-size:10.5px;font-weight:700}.project-tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.project-panel h2{font-size:15px;margin:0 0 7px}.data-list{display:grid}.data-row{display:grid;grid-template-columns:minmax(105px,30%) 1fr;gap:7px;padding:5px 0;border-bottom:1px solid #eee}.data-row:last-child{border-bottom:0}.data-key{font-weight:700;font-size:10px;color:#555}.data-value{font-size:11px;overflow-wrap:anywhere}.record-stack,.stage-record-list,.run-list{display:grid;gap:6px}.record-card{border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff}.record-card>summary{cursor:pointer;list-style:none;padding:8px 9px;font-weight:750;font-size:11px;display:flex;justify-content:space-between;gap:8px}.record-card>summary::-webkit-details-marker{display:none}.record-body{border-top:1px solid #e5e5e2;padding:8px}.notice{border-left:3px solid var(--accent);background:#edf3ff;border-radius:7px;padding:7px 8px;color:#123b78;font-size:11px}.notice.danger{border-left-color:var(--danger);background:#fff0ef;color:#7d1e16}.workflow-list{display:grid;gap:5px}.workflow-row button{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:start;gap:7px;text-align:left;border:1px solid #ddd;border-radius:8px;background:#fff;padding:7px}.workflow-row.current button{border-color:var(--accent);background:#f5f8ff}.workflow-num{font-weight:800;font-size:10px;color:#555}.workflow-copy{display:grid;gap:2px}.workflow-copy strong{font-size:11px}.workflow-copy small{color:var(--muted);font-size:10px}.guide-grid{display:grid;gap:7px}.guide-card{border:1px solid var(--line);border-radius:9px;padding:9px}.guide-card h3{margin:0 0 4px;font-size:12px}.guide-card p{margin:0;color:var(--muted);font-size:11px}.screen-reader-only{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important}[data-integrated-operational-controls="true"],#appendix-operational-purpose,#repository-test-project,#project-inspector{display:none!important}
@media(max-width:560px){.header-row{display:block}.project-picker-wrap{max-width:none;width:100%;margin-top:8px}.project-facts{grid-template-columns:1fr 1fr}.project-hero-top{display:block}.status-chip{margin-top:5px}.data-row{grid-template-columns:1fr}.header-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.header-actions button{width:100%;padding-left:5px;padding-right:5px}}
</style>
</head>
<body><div class="app"><header class="app-header"><div class="header-row"><div class="brand"><h1>Closed-Loop Reliability</h1><p id="job" aria-live="polite">Loading current project…</p></div><div class="project-picker-wrap"><label for="project-picker">Project</label><select id="project-picker"></select></div></div><div class="header-actions"><button id="new-job-button" class="primary" type="button">New project</button><button id="project-data-button" type="button">Project</button><button id="guide-button" type="button">Guide</button><button id="export-button" type="button">Export</button><button id="import-button" type="button">Import</button><input id="imp" type="file" hidden accept=".json,application/json"></div><div class="progress-row"><span id="count">0/31 complete</span><div class="bar"><i id="bar" style="width:0%"></i></div></div></header><main><section id="workspace-workbook" class="workspace" hidden><div class="stage-toolbar"><button id="previous-stage" type="button" aria-label="Previous workbook stage">‹</button><label class="screen-reader-only" for="stage-select">Detailed workbook stage</label><select id="stage-select"></select><button id="next-stage" type="button" aria-label="Next workbook stage">›</button></div><div id="master"></div><div id="nav"></div><div id="content"><div class="card"><h2>Loading detailed workflow controls…</h2></div></div></section><section id="workspace-project" class="workspace"><div class="project-panel"><h2>Loading project…</h2></div></section><section id="workspace-guide" class="workspace" hidden></section></main></div>
<script>globalThis.job=document.getElementById('job');globalThis.count=document.getElementById('count');globalThis.bar=document.getElementById('bar');globalThis.nav=document.getElementById('nav');globalThis.content=document.getElementById('content');globalThis.imp=document.getElementById('imp');</script>
<script src="workbook.js?v=closed-loop-runtime-20260823-r16"></script>
<script src="human-ui.js?v=closed-loop-human-20260823-r31"></script>
<script>
(()=>{const fix=()=>document.querySelectorAll('.status-chip').forEach(el=>{const t=el.textContent.trim().toUpperCase();if(/UNKNOWN|UNDETERMINED|NOT STARTED|NOT READY/.test(t)){el.classList.remove('satisfied','blocked');el.classList.add('warn')}else if(/BLOCK|VIOLAT|REJECT|OPEN|FAIL|STALE/.test(t)){el.classList.remove('satisfied','warn');el.classList.add('blocked')}});new MutationObserver(fix).observe(document.body,{childList:true,subtree:true,characterData:true});fix()})();
</script>
</body></html>
