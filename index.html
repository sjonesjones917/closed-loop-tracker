<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Closed Loop Reliability</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d31;--panel2:#162640;--line:#2d4668;--text:#f4f7fb;--muted:#9fb0c9;--accent:#6ab8ff;--bad:#ff7c7c;--good:#81d69a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:900px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 88px)}header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}.brand h1{font-size:26px;margin:0}.brand p{margin:4px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 14px;border-radius:14px;font-weight:700;min-height:44px}.btn.primary{background:#1f5f98;border-color:#4a94d4}.btn.danger{border-color:#70434b;background:#3e2027}.btn.good{border-color:#3d7550;background:#21442d}.grid{display:grid;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:hidden}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:800;color:#c9d5e8}.field input,.field textarea,.field select{width:100%;min-width:0;border:1px solid var(--line);background:#091525;color:var(--text);border-radius:12px;padding:12px}.field textarea{min-height:110px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.project{display:grid;gap:8px}.project-top{display:flex;align-items:start;justify-content:space-between;gap:12px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#cfe0f7;font-size:12px}.progress{height:10px;border-radius:999px;background:#21324a;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0}.stage-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.stage-btn{text-align:left;width:100%;border:1px solid var(--line);background:#0c1728;color:var(--text);border-radius:12px;padding:10px}.stage-btn.complete{border-color:#3d7550}.stage-btn.active{outline:2px solid var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#07111f;border:1px solid var(--line);padding:12px;border-radius:12px;max-height:360px;overflow:auto;font-size:12px;line-height:1.45}.error{color:#ffb1b1;white-space:pre-wrap}.success{color:#a9e6ba}.hidden{display:none!important}.bottom{position:fixed;left:0;right:0;bottom:0;background:#081321ef;border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));backdrop-filter:blur(12px);z-index:20}.bottom-inner{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.navbtn{min-width:0;border:1px solid var(--line);background:#14243c;color:#cbd7e9;border-radius:12px;padding:10px 4px;font-weight:800;white-space:normal;overflow-wrap:anywhere}.navbtn.active{border-color:var(--accent);color:white}.statusline{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0a1728;margin-bottom:12px;overflow-wrap:anywhere}@media(max-width:520px){.shell{padding-left:12px;padding-right:12px}.brand h1{font-size:23px}.card{padding:14px}.stage-list{grid-template-columns:1fr}.bottom-inner{gap:5px}.navbtn{font-size:12px;padding:10px 2px}.actions>.btn{flex:1 1 145px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><h1>Closed Loop Reliability</h1><p id="subtitle">Projects</p></div><button class="btn" id="backupBtn">Backup</button></header>
<div id="status" class="statusline">Ready. No network connection is required.</div>
<section id="projectsView"><div class="actions"><button class="btn primary" id="newProjectBtn">New project</button><button class="btn good" id="realTestBtn">Run real E2E job</button></div><div id="newProjectCard" class="card hidden" style="margin-top:12px"><h2>Create project</h2><div class="field"><label>Project name *</label><input id="pName"></div><div class="field"><label>Exact user objective *</label><textarea id="pObjective"></textarea></div><div class="field"><label>Exact deliverable requested *</label><textarea id="pDeliverable"></textarea></div><div class="field"><label>Supplied files, messages, links, data</label><textarea id="pInputs"></textarea></div><div class="field"><label>Constraints / prohibited actions</label><textarea id="pConstraints"></textarea></div><div class="field"><label>Required output format</label><input id="pFormat" value="UNSPECIFIED"></div><div class="field"><label>Deadline / temporal scope</label><input id="pDeadline" value="NONE SUPPLIED"></div><div class="actions"><button class="btn primary" id="createProjectBtn">Create project</button><button class="btn" id="cancelProjectBtn">Cancel</button></div><div id="createError" class="error"></div></div><div id="projectList" class="grid" style="margin-top:12px"></div></section>
<section id="workflowView" class="hidden"><div id="noProjectWorkflow" class="card">Select a project from Projects.</div><div id="workflowContent" class="hidden"><div class="card"><div class="project-top"><div><h2 id="wfProjectName"></h2><div class="muted" id="wfIds"></div></div><span class="pill" id="wfPct"></span></div><div class="progress" style="margin-top:12px"><i id="wfBar"></i></div></div><div class="card" style="margin-top:12px"><h3>30-stage workflow</h3><div id="stageList" class="stage-list"></div></div><div class="card" style="margin-top:12px"><h2 id="stageTitle"></h2><div class="muted" id="stageInstruction"></div><div class="actions"><button class="btn" id="copyPromptBtn">Copy exact stage prompt</button></div><div class="field"><label>Prompt sent to agent</label><pre id="promptPreview"></pre></div><div class="field"><label>Agent response — REQUIRED to complete stage</label><textarea id="agentResponse" placeholder="Paste the complete agent response here. Empty responses cannot complete a stage."></textarea></div><div class="field"><label>Evidence / notes</label><textarea id="stageEvidence"></textarea></div><div class="actions"><button class="btn primary" id="completeStageBtn">Validate + complete stage</button><button class="btn" id="saveProgressBtn">Save without completing</button></div><div id="stageMessage" class="error"></div></div></div></section>
<section id="evidenceView" class="hidden"><div class="card"><h2>Evidence</h2><div id="evidenceContent" class="muted">Select a project.</div></div></section><section id="blockersView" class="hidden"><div class="card"><h2>Blockers / release</h2><div id="blockerContent" class="muted">Select a project.</div></div></section></div>
<div class="bottom"><div class="bottom-inner"><button class="navbtn active" data-view="projects">Projects</button><button class="navbtn" data-view="workflow">Workflow</button><button class="navbtn" data-view="evidence">Evidence</button><button class="navbtn" data-view="blockers">Blockers</button></div></div>
<script src="app-core.js"></script>
<script>
'use strict';(function(){const C=window.ClosedLoopCore;if(!C){document.getElementById('status').textContent='ERROR: app-core.js failed to load.';return;}const KEY='closedLoopReliability.projects.v1',SEL='closedLoopReliability.selected.v1';let projects=[],selectedId=null,stageNumber=1;const $=id=>document.getElementById(id);function setStatus(msg,kind=''){const el=$('status');el.textContent=msg;el.style.borderColor=kind==='bad'?'#8b4f5a':kind==='good'?'#3d7550':'#2d4668';}function load(){try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(projects))projects=[];selectedId=localStorage.getItem(SEL)||null;if(selectedId&&!projects.some(p=>p.projectId===selectedId))selectedId=null;setStatus(`Ready. ${projects.length} project${projects.length===1?'':'s'} stored on this iPhone.`,'good');}catch(e){projects=[];selectedId=null;setStatus(`Local data could not be read: ${e.message}`,'bad');}}function save(){localStorage.setItem(KEY,JSON.stringify(projects));if(selectedId)localStorage.setItem(SEL,selectedId);else localStorage.removeItem(SEL);}function current(){return projects.find(p=>p.projectId===selectedId)||null;}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function renderProjects(){const list=$('projectList');if(!projects.length){list.innerHTML='<div class="card"><h3>No projects yet</h3><div class="muted">Create a project or run the real end-to-end job. Projects are stored locally on this device.</div></div>';return;}list.innerHTML=projects.map(p=>`<div class="card project"><div class="project-top"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.jobId)} · ${C.completionPercent(p)}%</div></div><span class="pill">${esc(p.releaseState)}</span></div><div class="progress"><i style="width:${C.completionPercent(p)}%"></i></div><div class="muted">${esc(p.objective)}</div><div class="actions"><button class="btn primary" data-open="${p.projectId}">Open workflow</button><button class="btn" data-export="${p.projectId}">Export JSON</button><button class="btn danger" data-delete="${p.projectId}">Delete</button></div></div>`).join('');list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.open;const idx=current().stages.findIndex(s=>s.status!=='COMPLETE');stageNumber=idx<0?30:idx+1;save();showView('workflow');});list.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>download(`${b.dataset.export}.json`,JSON.stringify(projects.find(p=>p.projectId===b.dataset.export),null,2),'application/json'));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this project from this device?'))return;projects=projects.filter(p=>p.projectId!==b.dataset.delete);if(selectedId===b.dataset.delete)selectedId=null;save();renderAll();});}function renderWorkflow(){const p=current();$('noProjectWorkflow').classList.toggle('hidden',!!p);$('workflowContent').classList.toggle('hidden',!p);if(!p)return;$('wfProjectName').textContent=p.name;$('wfIds').textContent=`${p.projectId} · ${p.jobId}`;const pct=C.completionPercent(p);$('wfPct').textContent=`${pct}% complete`;$('wfBar').style.width=pct+'%';$('stageList').innerHTML=C.STAGES.map((s,i)=>{const state=p.stages[i].status;return `<button class="stage-btn ${state==='COMPLETE'?'complete':''} ${stageNumber===i+1?'active':''}" data-stage="${i+1}">${s.number}. ${esc(s.name)}<br><span class="muted">${state}</span></button>`}).join('');$('stageList').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stageNumber=Number(b.dataset.stage);renderStage();});renderStage();}function renderStage(){const p=current();if(!p)return;const def=C.STAGES[stageNumber-1],rec=p.stages[stageNumber-1];$('stageTitle').textContent=`${stageNumber}. ${def.name}`;$('stageInstruction').textContent=def.instruction;$('agentResponse').value=rec.agentResponse||'';$('stageEvidence').value=rec.evidence||'';$('stageMessage').textContent='';try{$('promptPreview').textContent=C.buildPrompt(p,stageNumber);$('completeStageBtn').disabled=false;}catch(e){$('promptPreview').textContent=`LOCKED: ${e.message}`;$('completeStageBtn').disabled=true;$('stageMessage').textContent=e.message;}}function renderEvidence(){const p=current();if(!p){$('evidenceContent').textContent='Select a project.';return;}$('evidenceContent').innerHTML=`<div class="grid">${p.stages.map((s,i)=>`<div class="card"><b>${i+1}. ${esc(C.STAGES[i].name)}</b><div class="muted">${esc(s.status)} ${s.completedAt?'· '+esc(s.completedAt):''}</div><div>${esc(s.evidence||'No evidence note recorded.')}</div></div>`).join('')}</div>`;}function renderBlockers(){const p=current();if(!p){$('blockerContent').textContent='Select a project.';return;}const incomplete=p.stages.filter(s=>s.status!=='COMPLETE');$('blockerContent').innerHTML=`<p>Release state: <b>${esc(p.releaseState)}</b></p><p>${incomplete.length?`${incomplete.length} stage(s) are not COMPLETE.`:'All 30 stages are COMPLETE.'}</p><div class="field"><label>Final artifact text</label><textarea id="artifactText">${esc(p.finalArtifact||'')}</textarea></div><div class="field"><label>Release decision</label><select id="releaseState"><option>UNSET</option><option>ACCEPTED</option><option>REJECTED</option><option>BLOCKED</option></select></div><div class="actions"><button class="btn primary" id="saveRelease">Save release state</button><button class="btn good" id="downloadArtifact">Download artifact</button></div><div id="releaseMsg" class="error"></div>`;$('releaseState').value=p.releaseState;$('saveRelease').onclick=()=>{p.finalArtifact=$('artifactText').value;p.releaseState=$('releaseState').value;p.updatedAt=new Date().toISOString();save();renderAll();setStatus('Release state saved.','good');};$('downloadArtifact').onclick=()=>{p.finalArtifact=$('artifactText').value;p.releaseState=$('releaseState').value;save();if(!C.canRelease(p)){$('releaseMsg').textContent='Release blocked: all 30 stages must be COMPLETE, release state must be ACCEPTED, and artifact text must be non-empty.';return;}download('released-artifact.txt',p.finalArtifact,'text/plain');};}function renderAll(){renderProjects();renderWorkflow();renderEvidence();renderBlockers();}function showView(name){['projects','workflow','evidence','blockers'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==name));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));$('subtitle').textContent=name[0].toUpperCase()+name.slice(1);renderAll();}function download(name,text,type){const blob=new Blob([text],{type:type||'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}$('newProjectBtn').onclick=()=>$('newProjectCard').classList.remove('hidden');$('cancelProjectBtn').onclick=()=>$('newProjectCard').classList.add('hidden');$('createProjectBtn').onclick=()=>{try{const p=C.createProject({name:$('pName').value,objective:$('pObjective').value,deliverable:$('pDeliverable').value,suppliedInputs:$('pInputs').value,constraints:$('pConstraints').value,outputFormat:$('pFormat').value,deadline:$('pDeadline').value});projects.unshift(p);selectedId=p.projectId;stageNumber=1;save();$('newProjectCard').classList.add('hidden');$('createError').textContent='';showView('workflow');setStatus('Project created. Stage 1 is ready.','good');}catch(e){$('createError').textContent=e.message;}};$('copyPromptBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('promptPreview').textContent);setStatus(`Stage ${stageNumber} prompt copied.`,'good');}catch(e){setStatus('Clipboard permission failed. Select and copy the prompt manually.','bad');}};$('saveProgressBtn').onclick=()=>{const p=current();if(!p)return;const rec=p.stages[stageNumber-1];rec.agentResponse=$('agentResponse').value;rec.evidence=$('stageEvidence').value;if(rec.status==='NOT_STARTED')rec.status='IN_PROGRESS';p.updatedAt=new Date().toISOString();save();renderAll();setStatus(`Stage ${stageNumber} progress saved.`,'good');};$('completeStageBtn').onclick=()=>{const p=current();if(!p)return;const done=stageNumber;try{C.completeStage(p,stageNumber,$('agentResponse').value,$('stageEvidence').value);save();if(stageNumber<30)stageNumber++;renderAll();setStatus(`Stage ${done} completed.`,'good');}catch(e){$('stageMessage').className='error';$('stageMessage').textContent=e.message;setStatus(`Stage ${stageNumber} not completed: ${e.message}`,'bad');}};$('realTestBtn').onclick=()=>{try{const result=C.runRealE2EJob();projects=projects.filter(p=>p.name!==result.project.name);projects.unshift(result.project);selectedId=result.project.projectId;save();renderAll();setStatus(`REAL E2E JOB completed through the actual app engine: ${result.executed.length}/30 stage responses were validated and stored. Artifact release gate is open.`,'good');}catch(e){setStatus(`REAL E2E JOB FAILED: ${e.message}`,'bad');}};$('backupBtn').onclick=()=>download('closed-loop-backup.json',JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),projects},null,2),'application/json');document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>showView(b.dataset.view));load();renderAll();})();
</script>
</body>
</html>
