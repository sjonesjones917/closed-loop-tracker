<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>Closed-Loop Agent Reliability</title><style>body{margin:0;background:#0b0d10;color:#f4f7fb;font-family:system-ui,-apple-system,sans-serif}.load{max-width:680px;margin:12vh auto;padding:24px}.card{background:#15191f;border:1px solid #303844;border-radius:14px;padding:18px}.muted{color:#a9b4c2}pre{white-space:pre-wrap;color:#ff9b9b}</style></head><body><div class="load"><div class="card"><h2>Loading Closed-Loop Agent Reliability…</h2><p class="muted">Loading the tested workflow application and project store.</p><pre id="err"></pre></div></div><script>(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}if(!('DecompressionStream'in window))throw new Error('This browser does not support DecompressionStream. Update Safari/iOS or use a current browser.');const parts=[];for(let i=0;i<5;i++){const name='app-v4/payload-'+String(i).padStart(2,'0')+'.txt?v=4';const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw new Error('Failed to load '+name+' — HTTP '+r.status);parts.push((await r.text()).trim())}const b64=parts.join('');const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!html.includes('Closed-Loop Agent Reliability Workflow')||!html.includes('Built-in End-to-End Self-Test'))throw new Error('Application payload integrity check failed before execution.');document.open();document.write(html);document.close()}catch(e){document.getElementById('err').textContent='LOAD FAILURE: '+(e&&e.message?e.message:String(e));}})();</script></body></ht
