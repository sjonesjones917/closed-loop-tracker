<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Closed Loop">
<title>Closed Loop Workflow</title>
<style>
:root{--bg:#080d18;--panel:#101827;--panel2:#151f32;--line:#27344d;--text:#f7f9ff;--muted:#a4b0c5;--blue:#72adff;--green:#60d47b;--amber:#ffd166;--red:#ff7272}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:82px}button,input,textarea,select{font:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(8,13,24,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 10px}
header h1{font-size:19px;margin:0}main{max-width:920px;margin:auto;padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.tiny{font-size:12px}
button{border:0;border-radius:12px;padding:11px 13px;background:var(--blue);color:#061120;font-weight:800}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:var(--red);color:#300}
input,textarea,select{width:100%;border:1px solid var(--line);background:#091321;color:var(--text);border-radius:12px;padding:11px;font-size:16px}textarea{min-height:100px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}
.stage{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:11px;margin-bottom:8px}.num{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--panel2);font-size:12px;font-weight:900}.status{font-size:10px;border-radius:999px;padding:5px 7px;background:var(--panel2);color:var(--muted)}.status.COMPLETE{background:var(--green);color:#06230e}.status.BLOCKED{background:var(--amber);color:#2d2300}.status.FAILED{background:var(--red);color:#310000}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,13,24,.98);border-top:1px solid var(--line);padding:7px 9px calc(env(safe-area-inset-bottom) + 7px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tabs button{font-size:11px;padding:9px 4px;background:var(--panel2);color:var(--muted)}.tabs button.on{background:var(--blue);color:#061120}.notice{border-left:4px solid var(--blue)}.dangerNotice{border-left:4px solid var(--amber)}
pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);background:#07101c;border-radius:12px;padding:11px;font-size:12px;max-height:480px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}.metric b{display:block;font-size:19px}.hidden{display:none!important}.record{border-top:1px solid var(--line);padding:10px 0}.toast{position:fixed;z-index:99;left:50%;bottom:92px;transform:translateX(-50%);background:white;color:#07101c;padding:10px 15px;border-radius:999px;font-weight:800;opacity:0;transition:.15s}.toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="row between"><div><h1>Closed Loop Workflow</h1><div id="hdr" class="muted tiny">No job selected</div></div><button class="secondary" onclick="backupView()">Backup</button></div></header>
<main id="app"></main>
<div class="tabs"><button id="tJobs" onclick="jobsView()">Jobs</button><button id="tFlow" onclick="flowView()">Workflow</button><button id="tRecords" onclick="recordsView()">Records</button><button id="tBlock" onclick="blockersView()">Blockers</button></div>
<div id="toast" class="toast">Copied</div>
<script>
const WF={"stages":[{"n":1,"name":"Initialize the job","instruction":"Create a job record before doing any substantive work.\n\nRecord:\n• JOB_ID\n• exact user objective\n• exact deliverable requested\n• all supplied files, messages, links, data, and constraints\n• required output format\n• deadline or temporal scope, if any\n• known authoritative sources\n• available tools\n• prohibited actions\n• unknown information that may affect correctness\n\nDo not rewrite the user’s objective into a different objective.\nSeparate explicit user requirements from assumptions.\nIf a required fact is unknown, record it as UNKNOWN. Do not fill it with an inferred value unless inference is expressly permitted.\nAssign a version identifier to the complete input set.","records":[["JOB_ID","AUTO_ID"],["EXACT_USER_OBJECTIVE","TEXT"],["EXACT_DELIVERABLE_REQUESTED","TEXT"],["SUPPLIED_FILES_MESSAGES_LINKS_DATA_CONSTRAINTS","TEXT"],["REQUIRED_OUTPUT_FORMAT","OUTPUT_FORMAT"],["DEADLINE_OR_TEMPORAL_SCOPE","TEXT"],["KNOWN_AUTHORITATIVE_SOURCES","TEXT"],["AVAILABLE_TOOLS","TEXT"],["PROHIBITED_ACTIONS","TEXT"],["UNKNOWN_INFORMATION","TEXT"],["EXPLICIT_USER_REQUIREMENTS","TEXT"],["ASSUMPTIONS","TEXT"],["INPUT_SET_VERSION","AUTO_VERSION"]]},{"n":2,"name":"Build the source inventory","instruction":"Identify every source that may govern correctness.\n\nFor each source, record:\n• source identifier\n• title or description\n• source type\n• origin\n• version\n• publication or effective date when relevant\n• authority level\n• whether it is mandatory, informative, or evidentiary\n• which portions are relevant\n• whether it conflicts with another source\n\nWhen current external facts affect correctness, research them using authoritative and current sources.\nWhen the task depends on supplied files, inspect the actual supplied files rather than relying on filenames, summaries, or prior descriptions.\nWhen multiple sources conflict, determine which source controls by applying the appropriate authority hierarchy for the task.\nDo not silently choose between unresolved authoritative conflicts.\nRecord unresolved conflicts as blockers.","records":[["SOURCE_ID","AUTO_ID"],["TITLE_OR_DESCRIPTION","TEXT"],["SOURCE_TYPE","SOURCE_TYPE"],["ORIGIN","TEXT"],["VERSION","TEXT"],["PUBLICATION_OR_EFFECTIVE_DATE","TEXT"],["AUTHORITY_LEVEL","AUTHORITY"],["ROLE","SOURCE_ROLE"],["RELEVANT_PORTIONS","TEXT"],["CONFLICTS_WITH_OTHER_SOURCE","TRUTH"],["CONFLICT_DETAILS","TEXT"]]},{"n":3,"name":"Research the requirements","instruction":"For each source in the inventory:\n1. Read the portions capable of imposing, limiting, or defining the requested result.\n2. Extract every statement that changes what the final product must contain, omit, preserve, calculate, demonstrate, or accomplish.\n3. Separate mandatory requirements from recommendations, examples, explanatory text, and optional practices.\n4. Identify requirements created directly by the user’s request even when no external authority states them.\n5. Identify requirements created by the intended output format or technical medium.\n6. Identify requirements created by dependencies between parts of the deliverable.\n7. Identify factual propositions that must be true for a requirement to apply.\n8. Identify edge conditions and exceptions.\n9. Record exact source evidence for each externally derived requirement.\n10. Search specifically for requirements that could invalidate, contradict, or restrict requirements already found.\n\nContinue research until another research pass produces no new material requirement category and every known controlling source has been examined.\nDo not stop because the initial obvious requirements have been found.","records":[["RESEARCH_PASS_ID","AUTO_ID"],["SOURCE_ID","REFERENCE"],["EXTRACTED_STATEMENT","TEXT"],["CLASSIFICATION","RESEARCH_CLASSIFICATION"],["APPLICABILITY_FACT","TEXT"],["EDGE_CONDITION_OR_EXCEPTION","TEXT"],["EXACT_SOURCE_EVIDENCE","TEXT"],["SOURCE_LOCATION","TEXT"],["CONTRADICTS_OR_RESTRICTS_EXISTING_REQUIREMENT","TRUTH"]]},{"n":4,"name":"Compile the requirement specification","instruction":"Create one atomic requirement record for every independently testable obligation.\n\nUse this structure:\nREQ_ID:\nREQUIREMENT:\nTYPE:\nSOURCE:\nSOURCE_LOCATION:\nAUTHORITY:\nAPPLICABILITY:\nDEPENDENCIES:\nPROHIBITIONS:\nVERIFICATION_METHOD:\nEXPECTED_EVIDENCE:\nFAILURE_CONDITION:\nSTATUS:\n\nWrite requirements so that two independent evaluators applying the same evidence should reach the same result.\nSplit compound requirements.\n\nBad:\nREQ-014:\nMake the document accurate, complete, professional, and properly formatted.\n\nCorrect:\nREQ-014:\nEvery factual statement derived from Source A must agree with Source A.\n\nREQ-015:\nEvery section required by the governing format must be present.\n\nREQ-016:\nThe document must contain no unresolved internal contradiction.\n\nREQ-017:\nPage margins must satisfy the specified dimensional requirement.\n\nFor every qualitative requirement, define what observable condition establishes satisfaction.\nDo not use undefined criteria such as good, strong, professional, complete, correct, sufficient, appropriate, or perfect.\nReplace each with measurable conditions.","records":[["REQ_ID","AUTO_ID"],["REQUIREMENT","TEXT"],["TYPE","REQUIREMENT_TYPE"],["SOURCE","REFERENCE"],["SOURCE_LOCATION","TEXT"],["AUTHORITY","AUTHORITY"],["APPLICABILITY","TEXT"],["DEPENDENCIES","TEXT"],["PROHIBITIONS","TEXT"],["VERIFICATION_METHOD","VERIFICATION_METHOD"],["EXPECTED_EVIDENCE","TEXT"],["FAILURE_CONDITION","TEXT"],["STATUS","REQUIREMENT_STATUS"]]},{"n":5,"name":"Resolve the requirement set","instruction":"Check the complete requirement set for:\n• duplicate requirements\n• conflicting requirements\n• requirements that cannot simultaneously be satisfied\n• undefined terms\n• circular dependencies\n• missing prerequisites\n• unsupported requirements\n• requirements whose applicability cannot be determined\n• requirements with no possible verification method\n\nResolve every resolvable defect.\nIf a mandatory requirement cannot be resolved because required authority or evidence is unavailable, mark the affected work BLOCKED.\nDo not proceed as though the requirement were satisfied.","records":[["RESOLUTION_ID","AUTO_ID"],["ISSUE_TYPE","REQUIREMENT_SET_ISSUE"],["AFFECTED_REQUIREMENT_IDS","TEXT"],["RESOLUTION","TEXT"],["RESOLVED","TRUTH"],["BLOCKS_MANDATORY_WORK","TRUTH"]]},{"n":6,"name":"Build the verification suite before writing the production instruction","instruction":"Create at least one verification procedure for every mandatory requirement.\n\nUse:\nTEST_ID:\nREQ_ID:\nTEST_TYPE:\nINPUTS_REQUIRED:\nPROCEDURE:\nEXPECTED_RESULT:\nFAILURE_CONDITION:\nEVIDENCE_PRODUCED:\n\nChoose the strongest available verification method in this order:\n1. formal proof or exact computation\n2. deterministic programmatic test\n3. schema or structural validation\n4. exact source comparison\n5. rule-based evaluation\n6. independent semantic evaluation\n7. expert or authorized human judgment when the task requires it\n\nDo not use an AI evaluator for a property that can be deterministically checked.\nCreate separate tests for separate requirements.\nConfirm that every mandatory requirement is covered.\n\nCalculate:\nmandatory_test_coverage =\nmandatory_requirements_with_tests /\ntotal_mandatory_requirements\n\nDo not proceed until mandatory_test_coverage = 1.00 unless a requirement is explicitly blocked and the workflow is stopping on that blocker.","records":[["TEST_ID","AUTO_ID"],["REQ_ID","REFERENCE"],["TEST_TYPE","VERIFICATION_METHOD"],["INPUTS_REQUIRED","TEXT"],["PROCEDURE","TEXT"],["EXPECTED_RESULT","TEXT"],["FAILURE_CONDITION","TEXT"],["EVIDENCE_PRODUCED","TEXT"]]},{"n":7,"name":"Build failure tests","instruction":"For every requirement, determine at least one way the requirement could be violated.\nConstruct malformed, incomplete, contradictory, stale, incorrect, or adversarial cases where applicable.\n\nExamples include:\n• delete a required input\n• substitute a wrong version\n• alter a required number\n• duplicate an identifier\n• introduce a contradiction\n• remove a required section\n• add prohibited material\n• corrupt a cross-reference\n• provide a malformed file\n• inject instructions inside source material\n• provide two conflicting authorities\n• make a tool unavailable\n• provide an unsupported factual assertion\n\nFor each test, define the required system response.\nThe system must detect the defect, reject the affected result, or block the affected operation.\nA validator that accepts a deliberately constructed invalid case is defective.\nCorrect the validator before continuing.","records":[["FAILURE_TEST_ID","AUTO_ID"],["REQ_ID","REFERENCE"],["VIOLATION_CASE","TEXT"],["REQUIRED_SYSTEM_RESPONSE","FAILURE_RESPONSE"],["VALIDATOR_ACCEPTED_INVALID_CASE","TRUTH"],["VALIDATOR_CORRECTION_IF_REQUIRED","TEXT"]]},{"n":8,"name":"Author the production instruction","instruction":"Write the instruction from the compiled requirements, not directly from memory of the original request.\n\nThe instruction must explicitly specify:\n\nObjective\nState exactly what artifact or result the execution agent must produce.\n\nInputs\nIdentify what material the agent may use.\nSpecify how conflicting, missing, or malformed inputs must be handled.\n\nSource authority\nSpecify which source controls when information conflicts.\n\nScope\nSpecify what the agent must do and what it must not do.\n\nDefined terms\nDefine every specialized term whose interpretation could materially change the result.\n\nRequired procedure\nDescribe the actual operations the agent must perform and their required order.\n\nDo not write:\nResearch all requirements.\n\nWrite the method:\nInspect each identified governing source individually. Extract each statement that imposes an obligation, restriction, exception, required element, prohibited element, numerical condition, structural condition, or procedural condition. Record each extracted requirement with its exact source location. Perform a second pass specifically searching for exceptions, conflicts, and requirements omitted during the first pass.\n\nDo not write:\nVerify the result.\n\nWrite:\nEvaluate every mandatory requirement individually. Run its assigned deterministic test when one exists. For requirements requiring semantic evaluation, compare the candidate result directly against the requirement and its source evidence. Record the evidence supporting the determination. Reject the candidate if any mandatory requirement is violated or cannot be established.\n\nDecision rules\nFor every material branch, define what condition selects each path.\n\nTool rules\nSpecify which operations require which tools and what to do if a required tool fails.\n\nOutput contract\nSpecify exact required artifacts, sections, fields, formats, naming conventions, and relationships.\n\nFailure handling\nRequire:\nTRUE → requirement established\nFALSE → requirement violated\nUNKNOWN → requirement not established\nNever permit UNKNOWN to be silently converted to TRUE.\n\nCompletion criteria\nDefine the exact conditions under which execution may terminate successfully.","records":[["INSTRUCTION_ID","AUTO_ID"],["OBJECTIVE","TEXT"],["INPUTS","TEXT"],["INPUT_HANDLING","TEXT"],["SOURCE_AUTHORITY","TEXT"],["SCOPE","TEXT"],["DEFINED_TERMS","TEXT"],["REQUIRED_PROCEDURE","TEXT"],["DECISION_RULES","TEXT"],["TOOL_RULES","TEXT"],["OUTPUT_CONTRACT","TEXT"],["FAILURE_HANDLING","TEXT"],["COMPLETION_CRITERIA","TEXT"],["INSTRUCTION_VERSION","AUTO_VERSION"]]},{"n":9,"name":"Preflight the production instruction","instruction":"Use a separate evaluation process to inspect the instruction without executing the target work.\n\nExamine every sentence.\nFor each sentence ask:\n1. Can it be interpreted in more than one materially different way?\n2. Does it reference an undefined object?\n3. Does it depend on information not supplied?\n4. Does it conflict with another instruction?\n5. Does it require an unavailable capability?\n6. Can compliance with it be objectively verified?\n7. Is the responsible operation clear?\n8. Is its ordering relative to dependent operations clear?\n9. Does it specify what happens on failure?\n10. Does it trace to a requirement or necessary execution control?\n\nCorrect every material defect.\nRepeat preflight until no known material instruction defect remains.\nVersion the result:\nINSTRUCTION-v001","records":[["PREFLIGHT_ITEM_ID","AUTO_ID"],["INSTRUCTION_SENTENCE_OR_REFERENCE","TEXT"],["AMBIGUOUS","TRUTH"],["UNDEFINED_OBJECT","TRUTH"],["UNSUPPLIED_INFORMATION_DEPENDENCY","TRUTH"],["CONFLICT","TRUTH"],["UNAVAILABLE_CAPABILITY","TRUTH"],["OBJECTIVELY_VERIFIABLE","TRUTH"],["RESPONSIBLE_OPERATION_CLEAR","TRUTH"],["ORDERING_CLEAR","TRUTH"],["FAILURE_BEHAVIOR_DEFINED","TRUTH"],["TRACEABLE","TRUTH"],["CORRECTION","TEXT"]]},{"n":10,"name":"Freeze the test candidate","instruction":"Freeze together:\nINPUT-vN\nSOURCE-SET-vN\nREQUIREMENTS-vN\nTEST-SUITE-vN\nINSTRUCTION-vN\nTOOL-CONFIGURATION-vN\n\nRecord hashes for file-based artifacts where practical.\nDo not alter any frozen component during the iteration batch.\nIf anything must change, terminate the current batch and start a new version.","records":[["FREEZE_ID","AUTO_ID"],["INPUT_VERSION","REFERENCE"],["SOURCE_SET_VERSION","REFERENCE"],["REQUIREMENTS_VERSION","REFERENCE"],["TEST_SUITE_VERSION","REFERENCE"],["INSTRUCTION_VERSION","REFERENCE"],["TOOL_CONFIGURATION_VERSION","REFERENCE"],["HASHES","TEXT"]]},{"n":11,"name":"Run ten independent executions","instruction":"Create ten fresh execution contexts.\n\nGive every execution exactly the same frozen:\n• input\n• sources\n• requirements where the production agent is intended to receive them\n• production instruction\n• tool configuration\n\nDo not give any execution:\n• another execution’s output\n• reviewer comments\n• prior failure explanations\n• proposed corrections\n\nRun all ten independently.\nStore every output separately.\n\nLabel:\nRUN-001\nRUN-002\n...\nRUN-010","records":[["RUN_ID","AUTO_RUN"],["EXECUTION_OUTPUT","TEXT"],["OUTPUT_LOCATION_OR_FILE","TEXT"],["OUTPUT_HASH","TEXT"]]},{"n":12,"name":"Verify each execution independently","instruction":"Run the complete verification suite against each result.\n\nFor every requirement and run, record:\nREQ_ID\nRUN_ID\nRESULT = SATISFIED | VIOLATED | UNDETERMINED\nTEST_ID\nEVIDENCE\nDEFECT_ID if applicable\n\nDo not ask the generating agent whether its own work is correct.\nRun deterministic validators independently.\nRun semantic evaluation independently.\nRun adversarial evaluation independently where applicable.","records":[["REQ_ID","REFERENCE"],["RUN_ID","REFERENCE"],["RESULT","VERIFICATION_RESULT"],["TEST_ID","REFERENCE"],["EVIDENCE","TEXT"],["DEFECT_ID","REFERENCE"]]},{"n":13,"name":"Compare the ten executions","instruction":"Compare outcomes requirement-by-requirement.\n\nIdentify:\n• requirements satisfied by all ten\n• requirements violated by one or more\n• requirements producing inconsistent interpretations\n• outputs that vary where variation is prohibited\n• requirements that tests cannot conclusively evaluate\n• failures repeated across multiple executions\n• failures unique to individual executions\n\nDo not select the best execution and discard evidence from the others.\nTreat variance affecting correctness as a defect requiring investigation.","records":[["COMPARISON_ID","AUTO_ID"],["REQ_ID","REFERENCE"],["SATISFIED_BY_ALL_TEN","TRUTH"],["VIOLATED_RUN_IDS","TEXT"],["INCONSISTENT_INTERPRETATION","TRUTH"],["PROHIBITED_VARIANCE","TRUTH"],["INCONCLUSIVE_EVALUATION","TRUTH"],["REPEATED_FAILURE","TRUTH"],["UNIQUE_FAILURE","TRUTH"]]},{"n":14,"name":"Root-cause every defect","instruction":"For each defect, determine the earliest layer at which the condition became incorrect.\n\nUse these categories:\nSOURCE_DEFECT\nRESEARCH_DEFECT\nREQUIREMENT_DEFECT\nTEST_DEFECT\nINSTRUCTION_DEFECT\nINPUT_DEFECT\nEXECUTION_DEFECT\nTOOL_DEFECT\nAUDIT_DEFECT\n\nDetermine root cause by tracing backward:\nbad output\n↓\nwas the execution compliant with the instruction?\n↓\nwas the instruction correct relative to the requirement?\n↓\nwas the requirement correct relative to authority?\n↓\nwas the authority/source correct and complete?\n\nDo not classify a defect as an instruction defect merely because changing the instruction could hide the symptom.\nCorrect the earliest defective layer.","records":[["DEFECT_ID","AUTO_ID"],["CATEGORY","DEFECT_CATEGORY"],["OBSERVED_FAILURE","TEXT"],["ROOT_CAUSE","TEXT"],["EARLIEST_DEFECTIVE_LAYER","DEFECT_CATEGORY"],["CORRECTION_REQUIRED","TEXT"]]},{"n":15,"name":"Convert every confirmed failure into a regression test","instruction":"For each confirmed defect:\n1. preserve an example that reproduces it\n2. create a test that fails before the correction\n3. make the correction\n4. confirm the new test succeeds after the correction\n5. add the test permanently to the suite\n\nRecord:\nREG_ID\nORIGINAL_DEFECT_ID\nREQ_ID\nFAILURE_FIXTURE\nDETECTION_METHOD\nEXPECTED_REJECTION_OR_CORRECTION\n\nDo not remove the regression test while the governing requirement remains applicable.","records":[["REG_ID","AUTO_ID"],["ORIGINAL_DEFECT_ID","REFERENCE"],["REQ_ID","REFERENCE"],["FAILURE_FIXTURE","TEXT"],["DETECTION_METHOD","TEXT"],["EXPECTED_REJECTION_OR_CORRECTION","TEXT"]]},{"n":16,"name":"Revise the responsible layer","instruction":"If research was wrong, redo the affected research.\nIf requirements were wrong, correct the requirements and every dependent artifact.\nIf tests were wrong, correct the tests and rerun affected validation.\nIf the instruction was wrong, correct the instruction.\nIf execution alone was wrong, preserve the instruction unless analysis establishes that additional constraint is required.\nIf tools were wrong, repair or replace the tool path.\nIncrement every changed artifact’s version.\nNever modify a version in place.","records":[["REVISION_ID","AUTO_ID"],["DEFECT_ID","REFERENCE"],["RESPONSIBLE_LAYER","DEFECT_CATEGORY"],["ARTIFACT_CHANGED","TEXT"],["OLD_VERSION","TEXT"],["NEW_VERSION","AUTO_VERSION"],["CORRECTION","TEXT"],["DEPENDENT_VALIDATION_INVALIDATED","TEXT"]]},{"n":17,"name":"Re-run the complete ten-execution iteration","instruction":"After any material change to:\n• source interpretation\n• requirement\n• production instruction\n• validator\n• tool configuration\n• input contract\n\nfreeze the new versions and run ten new independent executions.\nDo not continue the old conversations.\n\nUse:\nRUN-011 through RUN-020\nor a new iteration namespace:\nITERATION-002/RUN-001 through RUN-010\n\nRepeat:\nEXECUTE\n→ VERIFY\n→ COMPARE\n→ ROOT-CAUSE\n→ CORRECT\n→ ADD REGRESSION TEST\n→ RE-EXECUTE","records":[["ITERATION_ID","AUTO_ID"],["RUN_ID","AUTO_RUN"],["EXECUTION_OUTPUT","TEXT"],["OUTPUT_HASH","TEXT"]]},{"n":18,"name":"Continue until convergence","instruction":"After every iteration calculate:\n• mandatory requirement coverage\n• mandatory verification coverage\n• regression-test success\n• number of critical defects\n• number of major defects\n• number of unresolved unknowns\n• number of correctness-affecting disagreements between runs\n\nDo not freeze the production instruction until all of these conditions are simultaneously true:\nmandatory requirement coverage = 100%\nmandatory verification coverage = 100%\nregression test success = 100%\ncritical defects = 0\nmajor defects = 0\nmandatory unresolved unknowns = 0\nknown correctness-affecting contradictions = 0\nknown correctness-affecting ambiguities = 0\nunexplained correctness-affecting execution variance = 0","records":[["MANDATORY_REQUIREMENT_COVERAGE","PERCENT"],["MANDATORY_VERIFICATION_COVERAGE","PERCENT"],["REGRESSION_TEST_SUCCESS","PERCENT"],["CRITICAL_DEFECTS","INTEGER"],["MAJOR_DEFECTS","INTEGER"],["MANDATORY_UNRESOLVED_UNKNOWNS","INTEGER"],["KNOWN_CORRECTNESS_AFFECTING_CONTRADICTIONS","INTEGER"],["KNOWN_CORRECTNESS_AFFECTING_AMBIGUITIES","INTEGER"],["UNEXPLAINED_CORRECTNESS_AFFECTING_EXECUTION_VARIANCE","INTEGER"],["CONVERGED","TRUTH"]]},{"n":19,"name":"Run an unchanged confirmation iteration","instruction":"After the first iteration satisfying all convergence conditions:\n1. change nothing\n2. freeze exactly the same versions\n3. create ten new independent execution contexts\n4. execute the same production instruction again\n5. run the complete verification suite again\n\nIf any new critical or major defect appears, return to root-cause analysis.\nIf a new requirement is discovered, return to requirement research.\nIf a test fails to detect an injected defect, return to test development.\nOnly establish the baseline after an unchanged confirmation iteration satisfies the complete acceptance criteria.","records":[["CONFIRMATION_ITERATION_ID","AUTO_ID"],["RUN_ID","AUTO_RUN"],["RESULT","VERIFICATION_RESULT"],["EVIDENCE","TEXT"]]},{"n":20,"name":"Freeze the production baseline","instruction":"Record exact approved versions:\nBASELINE_ID\nINPUT_CONTRACT_VERSION\nSOURCE_SET_VERSION\nREQUIREMENTS_VERSION\nINSTRUCTION_VERSION\nTEST_SUITE_VERSION\nVALIDATOR_VERSION\nTOOL_CONFIGURATION_VERSION\n\nHash every immutable file.\nNo changed component retains baseline status automatically.","records":[["BASELINE_ID","AUTO_ID"],["INPUT_CONTRACT_VERSION","REFERENCE"],["SOURCE_SET_VERSION","REFERENCE"],["REQUIREMENTS_VERSION","REFERENCE"],["INSTRUCTION_VERSION","REFERENCE"],["TEST_SUITE_VERSION","REFERENCE"],["VALIDATOR_VERSION","REFERENCE"],["TOOL_CONFIGURATION_VERSION","REFERENCE"],["IMMUTABLE_FILE_HASHES","TEXT"]]},{"n":21,"name":"Generate the finished product","instruction":"Create a fresh execution context.\nSupply only the approved baseline materials required for production.\nGenerate the actual requested deliverable.\n\nRecord:\nPRODUCT_ID\nBASELINE_ID\nEXECUTION_ID\nOUTPUT_FILES\nOUTPUT_HASHES\n\nDo not edit the output outside the controlled workflow.\nIf editing is required, create a new product version.","records":[["PRODUCT_ID","AUTO_ID"],["BASELINE_ID","REFERENCE"],["EXECUTION_ID","AUTO_ID"],["OUTPUT_FILES","TEXT"],["OUTPUT_HASHES","TEXT"],["PRODUCT_VERSION","AUTO_VERSION"]]},{"n":22,"name":"Run deterministic verification on the finished product","instruction":"Execute every applicable deterministic test against the actual generated artifact.\n\nCheck, where applicable:\n• arithmetic\n• counts\n• schemas\n• filenames\n• file inventory\n• hashes\n• section presence\n• section ordering\n• identifiers\n• duplicate identifiers\n• references\n• links\n• dates\n• enumerations\n• tables\n• required text\n• prohibited text\n• package contents\n• structural constraints\n• formatting dimensions\n\nStore the actual test results.\nAny failed mandatory deterministic test rejects the product.","records":[["TEST_ID","REFERENCE"],["PRODUCT_ID","REFERENCE"],["EXPECTED_RESULT","TEXT"],["ACTUAL_RESULT","TEXT"],["RESULT","VERIFICATION_RESULT"],["EVIDENCE","TEXT"]]},{"n":23,"name":"Run independent semantic verification","instruction":"Give a separate evaluator:\n• the actual finished product\n• the requirement registry\n• relevant source evidence\n• the evaluation rubric\n\nFor each semantic requirement, require the evaluator to identify:\nREQ_ID\nPRODUCT_LOCATION\nSOURCE_EVIDENCE\nOBSERVED_MEANING\nREQUIRED_MEANING\nDETERMINATION\n\nRequire SATISFIED, VIOLATED, or UNDETERMINED.\nDo not accept unsupported statements such as:\nlooks correct\nappears compliant\npass\ngood","records":[["REQ_ID","REFERENCE"],["PRODUCT_LOCATION","TEXT"],["SOURCE_EVIDENCE","TEXT"],["OBSERVED_MEANING","TEXT"],["REQUIRED_MEANING","TEXT"],["DETERMINATION","VERIFICATION_RESULT"]]},{"n":24,"name":"Run adversarial verification","instruction":"Attempt to disprove product correctness.\n\nSearch deliberately for:\n• missing required material\n• prohibited material\n• contradictions\n• impossible logic\n• unsupported facts\n• misrepresented sources\n• wrong versions\n• broken references\n• hidden assumptions\n• partial completion\n• semantic nonsense\n• inconsistent terminology\n• unhandled exceptions\n• stale external information\n• malformed generated files\n• visually hidden content\n• export corruption\n• requirements technically mentioned but not actually satisfied\n\nA discovered defect returns the product to root-cause analysis.","records":[["ADVERSARIAL_FINDING_ID","AUTO_ID"],["FINDING_TYPE","TEXT"],["PRODUCT_LOCATION","TEXT"],["EVIDENCE","TEXT"],["DEFECT_FOUND","TRUTH"],["DEFECT_ID","REFERENCE"]]},{"n":25,"name":"Inspect the final representation","instruction":"Audit the exact form that will be delivered.\n\nIf production contains transformations:\nsource\n→ DOCX\n→ PDF\n→ ZIP\n\ninspect the resulting PDF and ZIP.\n\nVerify:\n• rendered pages\n• clipping\n• missing content\n• blank pages\n• broken tables\n• misplaced graphics\n• font substitution where material\n• corrupt files\n• missing packaged files\n• unexpected files\n• wrong filenames\n• inconsistent versions\n\nDo not rely solely on validation of an upstream representation.","records":[["REPRESENTATION_INSPECTION_ID","AUTO_ID"],["FINAL_ARTIFACT","TEXT"],["RENDERED_PAGES","TRUTH"],["CLIPPING","TRUTH"],["MISSING_CONTENT","TRUTH"],["BLANK_PAGES","TRUTH"],["BROKEN_TABLES","TRUTH"],["MISPLACED_GRAPHICS","TRUTH"],["MATERIAL_FONT_SUBSTITUTION","TRUTH"],["CORRUPT_FILES","TRUTH"],["MISSING_PACKAGED_FILES","TRUTH"],["UNEXPECTED_FILES","TRUTH"],["WRONG_FILENAMES","TRUTH"],["INCONSISTENT_VERSIONS","TRUTH"]]},{"n":26,"name":"Reconcile process and product evidence","instruction":"Before release, prove both independently:\n\nProcess correctness\nVerify that:\n• the approved inputs were used\n• the approved instruction was used\n• required tools ran\n• required tests ran\n• no unauthorized modification occurred\n\nProduct correctness\nVerify that:\n• every mandatory product requirement is satisfied\n• every mandatory test succeeded\n• every semantic requirement has supporting evidence\n• no unresolved critical or major defect exists\n\nDo not infer product correctness from process correctness.\nDo not infer process correctness from product correctness.","records":[["PROCESS_CORRECTNESS","TRUTH"],["PRODUCT_CORRECTNESS","TRUTH"],["APPROVED_INPUTS_USED","TRUTH"],["APPROVED_INSTRUCTION_USED","TRUTH"],["REQUIRED_TOOLS_RAN","TRUTH"],["REQUIRED_TESTS_RAN","TRUTH"],["UNAUTHORIZED_MODIFICATION_OCCURRED","TRUTH"],["EVERY_MANDATORY_PRODUCT_REQUIREMENT_SATISFIED","TRUTH"],["EVERY_MANDATORY_TEST_SUCCEEDED","TRUTH"],["EVERY_SEMANTIC_REQUIREMENT_HAS_SUPPORTING_EVIDENCE","TRUTH"],["UNRESOLVED_CRITICAL_OR_MAJOR_DEFECT_EXISTS","TRUTH"]]},{"n":27,"name":"Apply the release gate","instruction":"Assign exactly one state:\nACCEPTED\nREJECTED\nBLOCKED\n\nUse:\n\nACCEPTED\nAll mandatory requirements have affirmative supporting evidence and all mandatory validators succeed.\n\nREJECTED\nAt least one mandatory requirement is demonstrably violated.\n\nBLOCKED\nAt least one mandatory requirement cannot be established because required evidence, authority, input, or capability is unavailable.\n\nDo not treat absence of detected defects as proof by itself.\nAcceptance requires affirmative verification evidence for every mandatory requirement.","records":[["RELEASE_STATE","RELEASE_STATE"],["RELEASE_EVIDENCE","TEXT"]]},{"n":28,"name":"Verify artifact identity before release","instruction":"Calculate the cryptographic hash of every artifact that completed final verification.\nImmediately before delivery, calculate the hash again.\n\nRequire:\nRELEASE_HASH = AUDITED_HASH\n\nIf any hash differs:\n1. stop release\n2. identify the modification\n3. create a new product version\n4. rerun every validation affected by the modification\n5. perform the release gate again\n\nNever release a modified artifact under an earlier audit.","records":[["ARTIFACT_ID","REFERENCE"],["AUDITED_HASH","TEXT"],["RELEASE_HASH","TEXT"],["HASH_MATCH","TRUTH"],["MODIFICATION","TEXT"],["REVALIDATION_REQUIRED","TRUTH"]]},{"n":29,"name":"Preserve the complete evidence chain","instruction":"For every mandatory requirement preserve:\n\nSOURCE\n↓\nREQUIREMENT\n↓\nINSTRUCTION\n↓\nEXECUTION\n↓\nPRODUCT ELEMENT\n↓\nTEST\n↓\nTEST RESULT\n↓\nEVIDENCE\n↓\nRELEASE DECISION\n\nThe absence of any required link prevents affirmative acceptance of that requirement.","records":[["REQ_ID","REFERENCE"],["SOURCE","REFERENCE"],["REQUIREMENT","REFERENCE"],["INSTRUCTION","REFERENCE"],["EXECUTION","REFERENCE"],["PRODUCT_ELEMENT","TEXT"],["TEST","REFERENCE"],["TEST_RESULT","REFERENCE"],["EVIDENCE","TEXT"],["RELEASE_DECISION","RELEASE_STATE"],["CHAIN_COMPLETE","TRUTH"]]},{"n":30,"name":"Preserve failures permanently","instruction":"Maintain a defect registry.\n\nFor every defect record:\nDEFECT_ID\nDATE\nITERATION\nPRODUCT_VERSION\nREQUIREMENT\nOBSERVED_FAILURE\nROOT_CAUSE\nCORRECTION\nREGRESSION_TEST\nVERIFICATION_RESULT\n\nBefore approving any later baseline, execute all still-applicable regression tests.\nA previously solved defect that reappears is a regression and prevents release.","records":[["DEFECT_ID","REFERENCE"],["DATE","DATE"],["ITERATION","INTEGER"],["PRODUCT_VERSION","REFERENCE"],["REQUIREMENT","REFERENCE"],["OBSERVED_FAILURE","TEXT"],["ROOT_CAUSE","TEXT"],["CORRECTION","TEXT"],["REGRESSION_TEST","REFERENCE"],["VERIFICATION_RESULT","VERIFICATION_RESULT"]]}],"mandatoryRules":"1. Do not begin production before requirements and acceptance tests exist.\n2. Do not invent missing facts.\n3. Do not silently resolve authoritative conflicts.\n4. Do not allow the generator to be its sole validator.\n5. Use deterministic verification whenever the property is deterministically testable.\n6. Require affirmative evidence for every mandatory requirement.\n7. Treat mandatory unknowns as BLOCKED.\n8. Root-cause every material failure before changing anything.\n9. Correct the earliest defective layer rather than merely patching the final output.\n10. Convert every confirmed defect into a permanent regression test.\n11. Re-run independent executions after NSE":["DETECT","REJECT_RESULT","BLOCK_OPERATION"],"VERIFICATION_RESULT":["SATISFIED","VIOLATED","UNDETERMINED"],"DEFECT_CATEGORY":["SOURCE_DEFECT","RESEARCH_DEFECT","REQUIREMENT_DEFECT","TEST_DEFECT","INSTRUCTION_DEFECT","INPUT_DEFECT","EXECUTION_DEFECT","TOOL_DEFECT","AUDIT_DEFECT"],"RELEASE_STATE":["ACCEPTED","REJECTED","BLOCKED"]}};
const KEY="closed-loop-workflow-v3";let state=load(), currentJobId=state.currentJobId||null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{jobs:[],currentJobId:null}}catch{return{jobs:[],currentJobId:null}}}
function save(){state.currentJobId=currentJobId;localStorage.setItem(KEY,JSON.stringify(state));header()}
function job(){return state.jobs.find(x=>x.id===currentJobId)||null}
function srec(n){let j=job();return j?.stages.find(x=>x.number===n)||null}
function header(){let j=job();document.getElementById("hdr").textContent=j?j.id+" • Stage "+j.currentStage+"/30":"No job selected"}
function uid(prefix){let d=new Date().toISOString().replace(/\D/g,"").slice(0,14),r=crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase().padStart(8,"0");return prefix+"-"+d+"-"+r}
function seq(prefix,list){let used=list.map(x=>x.id||"").filter(x=>x.startsWith(prefix+"-")).map(x=>parseInt(x.split("-").at(-1))).filter(Number.isFinite);return prefix+"-"+String((Math.max(0,...used)+1)).padStart(4,"0")}
function version(kind,j){let n=(j.versions[kind]||0)+1;j.versions[kind]=n;return kind+"-v"+String(n).padStart(3,"0")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function attr(v){return esc(v).replace(/\n/g,"&#10;")}
function toast(t="Copied"){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1000)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast()}catch{let x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();toast()}}
function tab(id){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));document.getElementById(id)?.classList.add("on")}
function select(vals,val,action){return '<select onchange="'+action+'">'+vals.map(x=>'<option '+(x===val?"selected":"")+'>'+x+'</option>').join("")+'</select>'}
function newJob(){let j={id:uid("JOB"),title:"",objective:"",deliverable:"",materials:"",constraints:"",format:"UNSPECIFIED",deadline:"",authorities:"",tools:"",prohibited:"",unknowns:"",inference:"NOT_PERMITTED",currentStage:1,status:"ACTIVE",stages:WF.stages.map(x=>({number:x.n,status:"NOT_STARTED",input:"",result:"",notes:""})),records:{sources:[],research:[],requirements:[],resolutions:[],tests:[],failureTests:[],instruction:[],preflight:[],freezes:[],runs:[],verifications:[],comparisons:[],defects:[],regressions:[],revisions:[],iterations:[],convergence:[],confirmation:[],baselines:[],products:[],deterministic:[],semantic:[],adversarial:[],representations:[],reconciliation:[],release:[],hashes:[],evidenceChains:[]},blockers:[],versions:{INPUT:1,SOURCE_SET:0,REQUIREMENTS:0,TEST_SUITE:0,INSTRUCTION:0,TOOL_CONFIGURATION:0,VALIDATOR:0,PRODUCT:0}};state.jobs.unshift(j);currentJobId=j.id;save();jobView()}
function jobsView(){tab("tJobs");let a=document.getElementById("app");a.innerHTML='<div class="row between"><h2>Jobs</h2><button onclick="newJob()">New Job</button></div>'+(state.jobs.length?state.jobs.map(j=>'<div class="card"><div class="row between"><div><b>'+esc(j.title||"Untitled job")+'</b><div class="muted tiny">'+esc(j.id)+'</div></div><span class="status '+(j.status||"ACTIVE")+'">'+esc(j.status||"ACTIVE")+'</span></div><p class="muted">'+esc(j.objective||"No objective entered.")+'</p><div class="row wrap"><button onclick="currentJobId=\''+j.id+'\';save();flowView()">Open</button><button class="secondary" onclick="currentJobId=\''+j.id+'\';save();jobView()">Job Input</button></div></div>').join(""):'<div class="card notice"><b>No jobs.</b><p class="muted">Create a job. The app generates the identifiers and tracks the workflow state.</p></div>');header()}
function editJob(k,v){let j=job();j[k]=v;save()}
function field(label,key,area=false){let j=job(),v=j[key]||"";return '<label>'+label+'</label>'+(area?'<textarea oninput="editJob(\''+key+'\',this.value)">'+esc(v)+'</textarea>':'<input value="'+attr(v)+'" oninput="editJob(\''+key+'\',this.value)">')}
function jobView(){let j=job();if(!j)return jobsView();tab("tJobs");document.getElementById("app").innerHTML='<div class="row between"><h2>Job Input</h2><button class="secondary" onclick="flowView()">Done</button></div><div class="card notice"><b>This is the only normal human data-entry screen.</b><p class="muted">Enter the job itself. Agents perform the workflow work.</p></div><div class="card"><div class="muted tiny">'+j.id+'</div>'+field("Job name","title")+field("Exact user objective","objective",true)+field("Exact deliverable requested","deliverable",true)+field("All supplied files, messages, links, data, and constraints","materials",true)+field("Explicit constraints","constraints",true)+'<label>Required output format</label>'+select(WF.allowed.OUTPUT_FORMAT,j.format,"editJob(\'format\',this.value)")+field("Deadline or temporal scope","deadline")+field("Known authoritative sources","authorities",true)+field("Available tools","tools",true)+field("Prohibited actions","prohibited",true)+field("Known unknown information","unknowns",true)+'<label>Inference for missing facts</label>'+select(["NOT_PERMITTED","PERMITTED"],j.inference,"editJob(\'inference\',this.value)")+'</div>'}
function flowView(){let j=job();if(!j)return jobsView();tab("tFlow");let c=j.stages.filter(x=>x.status==="COMPLETE").length,b=j.stages.filter(x=>x.status==="BLOCKED").length;document.getElementById("app").innerHTML='<div class="row between"><h2>'+esc(j.title||"Workflow")+'</h2><button class="secondary" onclick="jobView()">Job Input</button></div><div class="grid"><div class="metric"><b>'+c+'/30</b><span class="muted tiny">Complete</span></div><div class="metric"><b>'+b+'</b><span class="muted tiny">Blocked</span></div><div class="metric"><b>'+j.records.requirements.length+'</b><span class="muted tiny">Requirements</span></div><div class="metric"><b>'+j.records.defects.length+'</b><span class="muted tiny">Defects</span></div></div><h3>Workflow</h3>'+WF.stages.map(x=>{let s=srec(x.n);return '<div class="stage" onclick="stageView('+x.n+')"><div class="num">'+String(x.n).padStart(2,"0")+'</div><div><b>'+esc(x.name)+'</b><div class="muted tiny">'+stageHumanAction(x.n)+'</div></div><span class="status '+s.status+'">'+s.status.replaceAll("_"," ")+'</span></div>'}).join("")}
function stageHumanAction(n){if(n===1)return"Copy the prompt, give it to an agent, then paste the complete result back.";if([9,11,12,19,21,23].includes(n))return"Use the independent/fresh agent required by the workflow, then paste the result back.";return"Copy the stage prompt to the agent and paste the complete result back."}
function cumulativeState(n){let j=job(),chunks=[];for(let i=1;i<n;i++){let s=srec(i);if(s.result.trim())chunks.push("===== STAGE "+String(i).padStart(2,"0")+" RESULT =====\n"+s.result.trim())}return chunks.join("\n\n")}
function inputBlock(){let j=job();return `JOB_ID: ${j.id}\nEXACT_USER_OBJECTIVE:\n${j.objective||"UNKNOWN"}\n\nEXACT_DELIVERABLE_REQUESTED:\n${j.deliverable||"UNKNOWN"}\n\nALL_SUPPLIED_FILES_MESSAGES_LINKS_DATA_AND_CONSTRAINTS:\n${j.materials||"NONE SUPPLIED"}\n\nEXPLICIT_CONSTRAINTS:\n${j.constraints||"NONE SUPPLIED"}\n\nREQUIRED_OUTPUT_FORMAT:\n${j.format}\n\nDEADLINE_OR_TEMPORAL_SCOPE:\n${j.deadline||"NONE SUPPLIED"}\n\nKNOWN_AUTHORITATIVE_SOURCES:\n${j.authorities||"NONE SUPPLIED"}\n\nAVAILABLE_TOOLS:\n${j.tools||"UNKNOWN"}\n\nPROHIBITED_ACTIONS:\n${j.prohibited||"NONE SUPPLIED"}\n\nKNOWN_UNKNOWN_INFORMATION:\n${j.unknowns||"NONE RECORDED"}\n\nINFERENCE_FOR_MISSING_FACTS:\n${j.inference}`}
function exactRecordFormat(n){let j=job(),d=WF.stages[n-1];function typeHelp(t){if(WF.allowed[t])return WF.allowed[t].join(" | ");if(t==="AUTO_ID")return"AUTO — the app assigns this identifier when the result is imported";if(t==="AUTO_RUN")return"AUTO — the app assigns the RUN identifier";if(t==="AUTO_VERSION")return"AUTO — the app assigns the next immutable version";if(t==="PERCENT")return"0% through 100%";if(t==="INTEGER")return"integer";if(t==="DATE")return"date";return""}let lines=d.records.map(([f,t])=>{if(n===1&&f==="JOB_ID")return"JOB_ID: "+j.id;if(n===1&&f==="INPUT_SET_VERSION")return"INPUT_SET_VERSION: INPUT-v001";let h=typeHelp(t);return f+":"+(h?" ["+h+"]":"")});return lines.join("\n")}
function stagePrompt(n){let d=WF.stages[n-1],prior=cumulativeState(n);let repeatNote="";if([2,4,6,11,12,14,15,17,19,22,23,29,30].includes(n))repeatNote="\nRepeat the applicable record block once for every item required by this stage.";return `CLOSED-LOOP AGENT RELIABILITY WORKFLOW\n\nJOB INPUT\n${inputBlock()}\n\nPRIOR COMPLETED WORKFLOW STATE\n${prior||"NONE — this is Stage 1."}\n\nSTAGE ${n}. ${d.name}\n\n${d.instruction}\n\nMANDATORY OPERATING RULES\n${WF.mandatoryRules}\n\nEXECUTION REQUIREMENT\nPerform Stage ${n} completely now.\nDo not merely describe the work, tell the human how to do the work, or return a plan for doing the work.\nDo every operation in Stage ${n} that you can perform using the supplied information, actual supplied files, available tools, and authoritative sources.\nDo not perform Stage ${n+1} or any later stage in this response.\nIf Stage ${n} requires information that is genuinely unavailable after using the available sources and tools, record the affected fact as UNKNOWN. If that UNKNOWN prevents a mandatory requirement from being established, stop the affected work as BLOCKED exactly as the workflow requires.\nDo not generate the final requested deliverable unless the current stage itself instructs you to generate it.\n\nREQUIRED OUTPUT FORMAT FOR STAGE ${n}\nReturn the completed work required by Stage ${n}.\nWhere this stage requires structured records, use the following field names and allowed values exactly:\n${exactRecordFormat(n)}\n${repeatNote}\n\nDo not invent identifiers marked AUTO. Leave the value AUTO; the application will replace AUTO with the generated identifier when the result is imported.\nDo not add unrelated sections, generic advice, self-evaluation language, or work belonging to another stage.`}
function preassigned(n){return""}
function preassignedPreview(n){let d=WF.stages[n-1];return d.records.filter(([f,t])=>["AUTO_ID","AUTO_RUN","AUTO_VERSION"].includes(t)).map(([f,t])=>f+": generated automatically when the stage result is imported").join("\n")}
function stageView(n){let s=srec(n),d=WF.stages[n-1],assign=preassignedPreview(n);document.getElementById("app").innerHTML='<div class="row between"><button class="secondary" onclick="flowView()">← Workflow</button><span class="status '+s.status+'">'+s.status.replaceAll("_"," ")+'</span></div><h2>'+n+'. '+esc(d.name)+'</h2><div class="card notice"><b>Your action</b><p>'+stageHumanAction(n)+'</p></div><div class="card"><b>Exact workflow instructions for this stage</b><pre>'+esc(d.instruction)+'</pre></div><div class="card"><label>Stage status</label><div class="status '+s.status+'">'+s.status.replaceAll("_"," ")+'</div>'+(assign?'<label>Fields the app will generate automatically</label><pre>'+esc(assign)+'</pre>':'')+'<div class="row wrap"><button onclick="copyStagePrompt('+n+')">Copy Stage Prompt</button></div></div><div class="card"><label>Paste the complete agent result</label><textarea style="min-height:280px" oninput="editStage('+n+',\'result\',this.value)">'+esc(s.result)+'</textarea><div class="row wrap"><button onclick="pasteStageResult('+n+')">Paste Result</button><button class="secondary" onclick="completeStage('+n+')">Save Agent Result</button></div></div><div class="card"><label>Notes</label><textarea oninput="editStage('+n+',\'notes\',this.value)">'+esc(s.notes)+'</textarea></div>'}
async function copyStagePrompt(n){await copyText(stagePrompt(n));let s=srec(n);if(s.status==="NOT_STARTED")s.status="IN_PROGRESS";save();stageView(n)}function editStage(n,k,v){srec(n)[k]=v;save()}async function pasteStageResult(n){try{srec(n).result=await navigator.clipboard.readText();save();stageView(n)}catch{toast("Paste manually")}}function setStageStatus(n,v){srec(n).status=v;save();stageView(n)}
function completeStage(n){let s=srec(n);if(!s.result.trim())return alert("Paste the complete stage result first.");importStageRecords(n,s.result);s.status=detectBlocked(s.result)?"BLOCKED":"COMPLETE";if(s.status==="COMPLETE")job().currentStage=Math.min(30,Math.max(job().currentStage,n+1));save();stageView(n);toast(s.status==="COMPLETE"?"Stage completed":"Stage blocked")}
function detectBlocked(t){return /(^|\n)\s*(STATUS|STAGE_STATUS|RESULT)\s*:\s*BLOCKED\b/i.test(t)||/(^|\n)\s*BLOCKED\s*:/i.test(t)||/mandatory requirement[^\n]*\bBLOCKED\b/i.test(t)}
function parseBlocks(text,startLabel){let lines=text.split(/\r?\n/),blocks=[],cur=null;for(let line of lines){let m=line.match(/^([A-Z][A-Z0-9_]+)\s*:\s*(.*)$/);if(!m)continue;let k=m[1],v=m[2];if(k===startLabel){if(cur)blocks.push(cur);cur={}}if(cur)cur[k]=v}if(cur)blocks.push(cur);return blocks}
function importStageRecords(n,text){let j=job(),r=j.records;let mappings={2:["sources","SOURCE_ID","SRC"],3:["research","RESEARCH_PASS_ID","RESEARCH"],4:["requirements","REQ_ID","REQ"],5:["resolutions","RESOLUTION_ID","RES"],6:["tests","TEST_ID","TEST"],7:["failureTests","FAILURE_TEST_ID","FAILTEST"],8:["instruction","INSTRUCTION_ID","INSTRUCTION"],9:["preflight","PREFLIGHT_ITEM_ID","PREFLIGHT"],10:["freezes","FREEZE_ID","FREEZE"],11:["runs","RUN_ID","RUN"],12:["verifications","REQ_ID","VER"],13:["comparisons","COMPARISON_ID","COMPARE"],14:["defects","DEFECT_ID","DEFECT"],15:["regressions","REG_ID","REG"],16:["revisions","REVISION_ID","REV"],17:["iterations","ITERATION_ID","ITER"],19:["confirmation","CONFIRMATION_ITERATION_ID","CONFIRM"],20:["baselines","BASELINE_ID","BASELINE"],21:["products","PRODUCT_ID","PRODUCT"],22:["deterministic","TEST_ID","DET"],23:["semantic","REQ_ID","SEM"],24:["adversarial","ADVERSARIAL_FINDING_ID","ADV"],25:["representations","REPRESENTATION_INSPECTION_ID","REP"],29:["evidenceChains","REQ_ID","CHAIN"],30:["defects","DEFECT_ID","DEFECT"]};if(n===18){r.convergence.push({id:uid("CONVERGENCE"),raw:text});return}if(n===26){r.reconciliation.push({id:uid("RECON"),raw:text});return}if(n===27){let m=text.match(/RELEASE_STATE\s*:\s*(ACCEPTED|REJECTED|BLOCKED)/i);r.release.push({id:uid("RELEASE"),state:m?m[1].toUpperCase():"UNKNOWN",raw:text});job().status=m?m[1].toUpperCase():job().status;return}if(n===28){r.hashes.push({id:uid("HASHCHECK"),raw:text});return}let m=mappings[n];if(!m)return;let [bucket,start,prefix]=m,blocks=parseBlocks(text,start);if(!blocks.length){r[bucket].push({id:uid(prefix),raw:text});return}for(let b of blocks){if(!b[start]||["UNKNOWN","AUTO","GENERATE",""].includes((b[start]||"").toUpperCase()))b[start]=prefix==="RUN"?"RUN-"+String(r.runs.length+1).padStart(3,"0"):seq(prefix,r[bucket]);b.id=b[start];r[bucket].push(b)}}
function recordsView(){let j=job();if(!j)return jobsView();tab("tRecords");let order=[["sources","Sources"],["research","Requirement research"],["requirements","Requirements"],["resolutions","Requirement resolutions"],["tests","Verification tests"],["failureTests","Failure tests"],["instruction","Production instruction"],["preflight","Instruction preflight"],["freezes","Frozen candidates"],["runs","Runs"],["verifications","Run verification"],["comparisons","Run comparisons"],["defects","Defects"],["regressions","Regression tests"],["revisions","Revisions"],["iterations","Iterations"],["convergence","Convergence"],["confirmation","Confirmation"],["baselines","Baselines"],["products","Products"],["deterministic","Deterministic product verification"],["semantic","Semantic verification"],["adversarial","Adversarial verification"],["representations","Final representation"],["reconciliation","Process/product reconciliation"],["release","Release gate"],["hashes","Release hash"],["evidenceChains","Evidence chain"]];document.getElementById("app").innerHTML='<h2>Workflow Records</h2><div class="card notice"><b>These records are created from pasted agent results.</b><p class="muted">You do not manually create IDs or populate agent-work registries.</p></div>'+order.map(([k,label])=>'<div class="card"><div class="row between"><b>'+label+'</b><span class="muted">'+j.records[k].length+'</span></div>'+j.records[k].slice(-3).map(x=>'<div class="record"><code>'+esc(x.id||"record")+'</code><div class="muted tiny">'+esc(JSON.stringify(x).slice(0,220))+'</div></div>').join("")+'</div>').join("")}
function blockersView(){let j=job();if(!j)return jobsView();tab("tBlock");let bs=j.blockers;document.getElementById("app").innerHTML='<h2>Human-only blockers</h2><div class="card notice"><b>A blocker belongs here only when the agent cannot complete a mandatory item without information or action that only a human can supply.</b></div>'+(bs.length?bs.map(b=>'<div class="card"><b>'+esc(b.id)+'</b><p>'+esc(b.question)+'</p><label>Your answer</label><textarea oninput="answerBlocker(\''+b.id+'\',this.value)">'+esc(b.answer||"")+'</textarea></div>').join(""):'<div class="card"><p class="muted">No human-only blockers.</p></div>')}function answerBlocker(id,v){let b=job().blockers.find(x=>x.id===id);b.answer=v;save()}
function backupView(){let j=job();document.getElementById("app").innerHTML='<h2>Backup</h2><div class="card"><p class="muted">All data is stored locally in this browser. Export it periodically.</p><div class="row wrap"><button onclick="exportData()">Export JSON</button><button class="secondary" onclick="document.getElementById(\'imp\').click()">Import JSON</button><input id="imp" type="file" accept="application/json" class="hidden" onchange="importData(this.files[0])"></div></div>'+(j?'<div class="card"><button class="secondary" onclick="copyText(JSON.stringify(job(),null,2))">Copy Current Job JSON</button></div>':'')}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="closed-loop-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href)}function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);currentJobId=state.currentJobId||state.jobs?.[0]?.id||null;save();jobsView();toast("Imported")}catch{alert("Invalid backup file.")}};r.readAsText(f)}jobsView();
</script></body></html>
