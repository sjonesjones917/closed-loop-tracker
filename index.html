function renderStage(){const p=cur();if(!p)return;const n=stageNo,d=STAGES[n-1],s=p.stages[n-1];let html=`<div class="row"><h2 style="margin:0">${n}. ${esc(d[0])}</h2><span class="pill">${s.status}</span></div><p class="muted">${esc(d[1])}</p>${promptBlock(p,n)}`;try{gate(p,n);if(n===11||n===18){html+=runFields(p,n,'producer')+`<div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeBatch" class="btn primary">Validate + save all 10 independent runs</button>`}else if(n===12){html+=runFields(p,n,'verifier')+`<div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeVerify" class="btn primary">Validate + save all 10 independent verifications</button>`}else if(n===19){html+=runFields(p,n,'verifier')+`<div class="field"><label>Convergence ledger — REQUIRED</label><textarea id="response">${esc(s.response)}</textarea></div><div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeVerify" class="btn primary">Validate convergence + save stage</button>`}else if(n===20){html+=runFields(p,n,'producer')+runFields(p,n,'verifier')+`<div class="field"><label>Unchanged confirmation summary — REQUIRED</label><textarea id="response">${esc(s.response)}</textarea></div><div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeConfirm" class="btn primary">Validate + save confirmation</button>`}else{html+=`<div class="field"><label>Agent response — REQUIRED</label><textarea id="response" placeholder="Paste the completed agent result. This stage cannot complete without it.">${esc(s.response)}</textarea></div><div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeStandard" class="btn primary">Validate + complete stage</button>`}}catch(e){}html+=`<div id="stageMsg" class="error"></div>`;$('stagePanel').innerHTML=html;const cp=$('copyMain');if(cp)cp.onclick=()=>copyText($('mainPrompt').textContent);document.querySelectorAll('[data-rprompt]').forEach(b=>b.onclick=()=>{const [role,i]=b.dataset.rprompt.split(':'),idx=Number(i),target=role==='verifier'&&n===20?(document.querySelector(`[data-producer="${idx}"]`)?.value||''):'';try{copyText(runPrompt(p,n,idx,role,target))}catch(e){$('stageMsg').textContent=e.message;setStatus(e.message,true)}});const err=e=>{$('stageMsg').textContent=e.message;setStatus(e.message,true)};const done=()=>{setStatus(`Stage ${n} completed with required pasted evidence.`);stageNo=Math.min(31,n+1);render()};if($('completeStandard'))$('completeStandard').onclick=async()=>{try{if(n===30)await complete30(p,$('response').value,$('notes').value);else{completeStandard(p,n,$('response').value,$('notes').value);if(n===31&&!(await canRelease(p)))throw Error('Release blocked: artifact, ACCEPTED decision, all stages, and exact audited/release hash equality are required.')}done()}catch(e){err(e)}};if($('completeBatch'))$('completeBatch').onclick=()=>{try{completeProducerBatch(p,n,[...document.querySelectorAll('[data-producer]')].map(x=>x.value));p.stages[n-1].notes=$('notes').value;save();done()}catch(e){err(e)}};if($('completeVerify'))$('completeVerify').onclick=()=>{try{completeVerifierBatch(p,n,[...document.querySelectorAll('[data-verifier]')].map(x=>x.value),n===19?$('response').value:'');p.stages[n-1].notes=$('notes').value;save();done()}catch(e){err(e)}};if($('completeConfirm'))$('completeConfirm').onclick=()=>{try{completeConfirmation(p,[...document.querySelectorAll('[data-producer]')].map(x=>x.value),[...document.querySelectorAll('[data-verifier]')].map(x=>x.value),$('response').value);p.stages[19].notes=$('notes').value;save();done()}catch(e){err(e)}}}
async function copyText(t){try{await navigator.clipboard.writeText(t);setStatus('Prompt copied.')}catch(e){setStatus('Clipboard unavailable. Select and copy the displayed prompt manually.',true)}}function renderEvidence(){const p=cur();$('evidence').innerHTML=p?`<h2>Evidence</h2>${p.stages.map((s,i)=>`<details><summary>${i+1}. ${esc(STAGES[i][0])} — ${s.status}</summary><pre>${esc(s.response||batchDigest(s)||'No response')}</pre><p>${esc(s.notes||'No notes')}</p></details>`).join('')}`:'Select a project.'}
async function renderRelease(){const p=cur();if(!p){$('release').textContent='Select a project.';return}const h=p.artifact?await sha256(p.artifact):'',allowed=await canRelease(p);$('release').innerHTML=`<h2>Artifact / Release</h2><div class="kv"><b>Stages</b><span>${completeCount(p)}/31</span><b>Decision</b><span>${esc(p.releaseDecision)}</span><b>Actual SHA-256</b><span>${esc(h||'No artifact')}</span><b>Audited hash</b><span>${esc(p.auditedHash||'Not recorded')}</span><b>Release hash</b><span>${esc(p.releaseHash||'Not recorded')}</span><b>Release gate</b><span>${allowed?'PASS':'BLOCKED'}</span></div><div class="field"><label>Exact finished artifact (read-only after Stage 22)</label><textarea id="artifact" readonly>${esc(p.artifact||'')}</textarea></div><button class="btn good" id="downloadArtifact" ${allowed?'':'disabled'}>Download exact accepted artifact</button><div id="releaseMsg"></div>`;if($('downloadArtifact'))$('downloadArtifact').onclick=()=>{const blob=new Blob([p.artifact],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.artifactName||'released-artifact.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}function render(){renderProjects();renderWorkflow();renderEvidence();renderRelease()}
function exportProject(p){const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.name==='CLOSED-LOOP AGENT RELIABILITY APPLICATION — COMPLETE BUILD'?'SELF_VERIFIED_PROJECT.json':`${p.jobId}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importProjectObject(input, options = {}) {
  const replay = replayProject(input);
  if (options.requireFullyValid && replay.invalidatedFrom) {
    throw Error(`${options.source || 'Published self-project'} rejected by current replay validation at Stage ${replay.invalidatedFrom}: ${replay.reason}`);
  }
  const p = replay.project;
  if (projects.some((x) => x.projectId === p.projectId)) projects = projects.filter((x) => x.projectId !== p.projectId);
  projects.unshift(p);
  selected = p.projectId;
  save();
  setStatus(
    replay.invalidatedFrom
      ? `Imported ${p.name}; obsolete completion was reset from Stage ${replay.invalidatedFrom}. ${replay.reason}`
      : `Imported ${p.name}.`,
    Boolean(replay.invalidatedFrom)
  );
  render();
  return p;
}
$('newBtn').onclick=()=>$('newCard').classList.remove('hidden');$('cancelBtn').onclick=()=>$('newCard').classList.add('hidden');$('createBtn').onclick=()=>{try{const p=createProject({projectId:$('projectId').value,jobId:$('jobId').value,name:$('name').value,objective:$('objective').value,deliverable:$('deliverable').value,inputs:$('inputs').value,constraints:$('constraints').value,format:$('format').value,deadline:$('deadline').value});projects.unshift(p);selected=p.projectId;save();$('newCard').classList.add('hidden');stageNo=1;setStatus('Project created at Stage 1. No workflow stage is pre-completed.');show('workflow')}catch(e){$('newErr').textContent=e.message}};$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;importProjectObject(JSON.parse(await f.text()))}catch(e){setStatus(e.message,true)}finally{e.target.value=''}};async function loadSelfProject(manual = false) {
  try {
    const r = await fetch(SELF_PROJECT_PATH, { cache: 'no-store' });
    if (!r.ok) {
      if (manual) throw Error(`Verified self-project export unavailable (${r.status}).`);
      return false;
    }
    importProjectObject(await r.json(), { requireFullyValid: true, source: 'Published self-project' });
    if (manual) show('workflow');
    return true;
  } catch (e) {
    if (manual || /rejected by current replay validation/i.test(String(e.message || e))) setStatus(e.message, true);
    return false;
  }
};$('loadVerifiedBtn').onclick=()=>loadSelfProject(true);$('exportBtn').onclick=()=>{const p=cur();if(p)exportProject(p)};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
load();render();loadSelfProject(false);window.__CLR_V13__={getProjects:()=>projects.map(p=>JSON.parse(JSON.stringify(p))),getCurrent:()=>cur()?JSON.parse(JSON.stringify(cur())):null,STAGES};
})();
