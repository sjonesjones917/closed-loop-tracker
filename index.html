<!doctype html>
<html lang="en">
<head>

<title>Closed-Loop Reliability</title>
<style>
:root{--ink:#161616;--muted:#626262;--line:#d7d7d2;--soft:#f7f7f5;--panel:#fff;--accent:#174ea6;--accent-soft:#edf3ff;--danger:#a1261c;--danger-soft:#fff0ee;--success:#17643a;--success-soft:#eaf7ef;--warn:#825500;--warn-soft:#fff4d8;--radius:10px;--shadow:0 1px 2px rgba(0,0,0,.05)}

.app{width:min(100%,920px);min-height:100vh;margin:0 auto;background:var(--panel);box-shadow:0 0 0 1px rgba(0,0,0,.03)}
.app-header{position:sticky;top:0;z-index:20;padding:max(8px,env(safe-area-inset-top)) 10px 7px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.header-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,280px);gap:9px;align-items:start}.brand h1{font-size:17px;line-height:1.15;margin:0}.brand p{font-size:10.5px;color:var(--muted);margin:3px 0 0;overflow-wrap:anywhere}.project-select label{display:block;margin:0 0 3px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.project-select select{width:100%;height:36px;border:1px solid #9f9f9a;border-radius:8px;background:#fff;padding:5px 28px 5px 8px;font-weight:700;font-size:11px}
.header-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.header-actions button,.file-button{min-height:34px;max-height:38px;border:1px solid #999;border-radius:8px;background:#fff;padding:5px 9px;font-size:10.5px;font-weight:750;white-space:nowrap}.header-actions .primary{background:var(--ink);border-color:var(--ink);color:#fff}.progress-line{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:6px}.progress-line strong{font-size:10px;white-space:nowrap}.progress-track{height:4px;border-radius:999px;background:#e5e5e1;overflow:hidden}.progress-track i{display:block;height:100%;background:var(--ink);width:0}
.view-tabs{position:sticky;top:105px;z-index:15;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}.view-tabs::-webkit-scrollbar{display:none}.view-tabs button{flex:0 0 auto;min-height:34px;max-height:38px;border:1px solid #a6a6a1;border-radius:8px;background:#fff;padding:5px 9px;font-size:10px;font-weight:750}.view-tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:9px 10px calc(26px + env(safe-area-inset-bottom))}.screen{display:grid;gap:8px}.panel,.hero,.record-card,.stage-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}.panel,.hero{padding:10px}.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.hero h2{font-size:18px;line-height:1.25;margin:0}.hero p{margin:4px 0 0;color:var(--muted);font-size:11.5px}.status{display:inline-flex;align-items:center;min-height:22px;padding:3px 7px;border-radius:999px;background:#eee;font-size:9px;font-weight:850;white-space:nowrap}.status.success{background:var(--success-soft);color:var(--success)}.status.danger{background:var(--danger-soft);color:var(--danger)}.status.warn{background:var(--warn-soft);color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:9px}.fact{border:1px solid #e1e1dc;border-radius:9px;padding:7px;min-width:0}.fact strong{display:block;font-size:14px;overflow-wrap:anywhere}.fact span{display:block;margin-top:2px;color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:.03em}h2.section-title{font-size:15px;margin:0 0 8px}.section-intro{font-size:11px;color:var(--muted);margin:-3px 0 8px}.notice{padding:8px 9px;border-left:3px solid var(--accent);border-radius:8px;background:var(--accent-soft);color:#173d75;font-size:11px}.notice.danger{border-left-color:var(--danger);background:var(--danger-soft);color:#7d1e16}.notice.success{border-left-color:var(--success);background:var(--success-soft);color:#155633}.notice.warn{border-left-color:var(--warn);background:var(--warn-soft);color:#6e4900}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{min-width:0}.field.full{grid-column:1/-1}.field label,.group-label{display:block;margin:7px 0 4px;font-size:10.5px;font-weight:800;color:#333}.field .help{display:block;margin:3px 0 0;color:var(--muted);font-size:9.5px}input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select{width:100%;min-height:38px;border:1px solid #a8a8a2;border-radius:8px;background:#fff;padding:7px 8px}textarea{min-height:92px;resize:vertical}.small-textarea{min-height:150px}.stage-record{min-height:330px}.stage-output{min-height:220px}.code-text{font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.check-list{display:grid;gap:5px}.check{display:grid;grid-template-columns:20px 1fr;gap:7px;align-items:start;border:1px solid #e2e2dd;border-radius:8px;padding:7px;background:#fff}.check input{width:18px;height:18px;margin:0}.check span{font-size:10.5px}.button-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.button-row button,.compact-button,.record-card button,.stage-card button{min-height:34px;max-height:38px;border:1px solid #999;border-radius:8px;background:#fff;padding:5px 9px;font-size:10px;font-weight:750;white-space:nowrap}.button-row .primary,.compact-button.primary{background:var(--ink);border-color:var(--ink);color:#fff}.button-row .danger{border-color:var(--danger);color:var(--danger)}
.stage-nav{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:6px;align-items:center}.stage-nav button{width:34px;height:34px;border:1px solid #999;border-radius:8px;background:#fff;font-size:17px}.stage-nav select{height:34px;min-height:34px;font-size:10.5px;font-weight:750}.stage-card{padding:9px}.stage-card.current{border-color:var(--accent);background:#fbfcff}.stage-head{display:grid;grid-template-columns:35px minmax(0,1fr) auto;gap:7px;align-items:start}.stage-number{font-size:10px;font-weight:850;color:var(--muted)}.stage-name{font-size:11px;font-weight:800}.stage-meta{margin-top:2px;font-size:9.5px;color:var(--muted)}.workflow-list{display:grid;gap:5px}.workflow-button{width:100%;text-align:left;border:0;background:transparent;padding:0}
.record-stack{display:grid;gap:6px}.record-card{overflow:hidden}.record-card>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px;font-size:10.5px;font-weight:800}.record-card>summary::-webkit-details-marker{display:none}.record-card .record-body{padding:9px;border-top:1px solid #e4e4df}.record-rows{display:grid}.record-row{display:grid;grid-template-columns:minmax(135px,31%) minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid #ededeb}.record-row:last-child{border-bottom:0}.record-key{font-size:9.5px;font-weight:800;color:#555;overflow-wrap:anywhere}.record-value{font-size:10.5px;overflow-wrap:anywhere;white-space:pre-wrap}.record-value.empty{color:var(--muted);font-style:italic}.prompt{max-height:460px;overflow:auto;border:1px solid #d8d8d2;border-radius:9px;background:#f5f5f2;padding:9px;font:10.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.empty-state{padding:16px 10px;text-align:center;color:var(--muted);font-size:11px;border:1px dashed #c8c8c2;border-radius:9px}
@media(max-width:620px){.header-main{grid-template-columns:1fr}.project-select{margin-top:3px}.view-tabs{position:static}.facts{grid-template-columns:1fr 1fr}.hero-top{display:block}.status{margin-top:6px}.grid-2,.grid-3{grid-template-columns:1fr}.record-row{grid-template-columns:1fr;gap:2px}.header-actions{display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.header-actions::-webkit-scrollbar{display:none}.header-actions button{width:auto;flex:0 0 auto}.button-row>button{flex:0 0 auto}.stage-record{min-height:380px}.stage-output{min-height:240px}.workflow-list .stage-meta{display:none}.workflow-list .stage-card{padding:7px}}

</style>
</head>
