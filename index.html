<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Mobile Closed-Loop Agent Reliability Workbook</title>
<style>
:root{
  color-scheme:light;
  --ink:#171717;
  --muted:#676767;
  --line:#d8d8d2;
  --line-strong:#b8b8b1;
  --paper:#ffffff;
  --canvas:#f4f4f1;
  --soft:#f8f8f6;
  --accent:#145ee7;
  --accent-soft:#edf3ff;
  --danger:#a51d28;
  --danger-soft:#fff0f1;
  --success:#17633a;
  --success-soft:#edf8f1;
  --warning:#7a4a00;
  --warning-soft:#fff7e8;
  --radius:14px;
  --shadow:0 12px 34px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html{background:var(--canvas);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.48 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.52}
a{color:var(--accent)}
.app-shell{min-height:100vh;max-width:860px;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.app-header{padding:max(18px,env(safe-area-inset-top)) 18px 0;background:var(--paper);border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.brand-kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand-title{margin:3px 0 0;font-size:22px;line-height:1.16;letter-spacing:-.02em}
.project-pill{flex:0 0 auto;max-width:42%;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--soft);font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-heading{margin:14px 0 3px;font-size:18px;line-height:1.25}
.project-id{font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}
.header-actions{display:grid;grid-template-columns:1.35fr repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 12px}
.button,.icon-button{border:1px solid var(--line-strong);background:var(--paper);border-radius:11px;min-height:44px;padding:9px 12px;font-weight:720;line-height:1.2}
.button:hover,.icon-button:hover{border-color:#7f7f77;background:var(--soft)}
.button.primary{border-color:var(--ink);background:var(--ink);color:#fff}
.button.accent{border-color:var(--accent);background:var(--accent);color:#fff}
.button.danger{border-color:var(--danger);color:var(--danger);background:#fff}
.button.quiet{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.button.small{min-height:36px;padding:7px 10px;font-size:13px}
.progress-row{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;color:var(--muted);font-weight:650}
.progress-track{height:7px;border-radius:999px;background:#e1e1dc;overflow:hidden;margin:7px 0 13px}
.progress-bar{height:100%;background:var(--ink);width:0;transition:width .2s ease}
.view-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 -4px}
.view-tab{border:0;border-bottom:3px solid transparent;background:transparent;min-height:48px;padding:8px 5px;font-weight:780;color:var(--muted)}
.view-tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.app-main{padding:18px 18px calc(34px + env(safe-area-inset-bottom))}
.loading{padding:36px 18px;color:var(--muted)}
.stack{display:grid;gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:16px}
.card.soft{background:var(--soft)}
.card.accent{border-color:#b9cdfa;background:var(--accent-soft)}
.card.warning{border-color:#ecd59e;background:var(--warning-soft)}
.card.danger{border-color:#efbec3;background:var(--danger-soft)}
.card.success{border-color:#b9dcc7;background:var(--success-soft)}
.card-title{margin:0;font-size:17px;line-height:1.25}
.card-subtitle{margin:5px 0 0;color:var(--muted)}
.section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:10px 0 0}
.section-heading h2{margin:0;font-size:20px;line-height:1.2}
.section-heading p{margin:3px 0 0;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:850;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}
.stat strong{display:block;font-size:19px;line-height:1.1}
.stat span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.status-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;letter-spacing:.025em;background:#ecece8;color:#444}
.status-chip.complete,.status-chip.ready,.status-chip.accepted{background:var(--success-soft);color:var(--success)}
.status-chip.blocked,.status-chip.rejected{background:var(--danger-soft);color:var(--danger)}
.status-chip.in-progress{background:var(--accent-soft);color:#164fae}
.status-chip.not-ready,.status-chip.undetermined{background:var(--warning-soft);color:var(--warning)}
.action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.action-row .button{flex:1 1 150px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:820;color:#333}
.field .help{font-size:12px;color:var(--muted)}
input,textarea,select{width:100%;border:1px solid var(--line-strong);border-radius:10px;background:#fff;min-height:44px;padding:10px 11px}
textarea{min-height:112px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:3px solid rgba(20,94,231,.22);outline-offset:1px;border-color:var(--accent)}
.check-list{display:grid;gap:9px;margin-top:12px}
.check-item{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}
.check-item input{width:20px;height:20px;min-height:0;margin:1px 0 0}
.check-item span{font-weight:630;line-height:1.38}
.stage-toolbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.stage-select{min-width:0;font-weight:750}
.stage-index{display:grid;gap:10px}
.stage-group{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.stage-group h3{margin:0;padding:11px 13px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stage-row{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:12px}
.stage-row:last-child{border-bottom:0}
.stage-row:hover{background:var(--soft)}
.stage-number{font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.stage-name{font-weight:760;line-height:1.3}
.stage-detail-header{display:grid;gap:9px}
.stage-detail-header h2{font-size:24px;line-height:1.14;margin:0;letter-spacing:-.02em}
.stage-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.info-list{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.info-list li{position:relative;padding-left:18px}
.info-list li::before{content:"";position:absolute;left:2px;top:.58em;width:6px;height:6px;border-radius:50%;background:#666}
details.disclosure{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
details.disclosure>summary{list-style:none;cursor:pointer;padding:14px 15px;font-weight:820;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.disclosure>summary::-webkit-details-marker{display:none}
details.disclosure>summary::after{content:"＋";font-size:18px;color:var(--muted)}
details.disclosure[open]>summary{border-bottom:1px solid var(--line)}
details.disclosure[open]>summary::after{content:"−"}
.disclosure-body{padding:15px}
.copy-block{white-space:pre-wrap;overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:11px;background:#f2f2ef;padding:13px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.record-preview{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:11px;background:var(--soft);padding:12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.timeline{display:grid;gap:10px;margin-top:12px}
.timeline-item{border-left:3px solid var(--line-strong);padding:4px 0 4px 12px}
.timeline-item strong{display:block}
.timeline-item small{color:var(--muted)}
.response-card,.artifact-card,.record-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;overflow-wrap:anywhere}
.response-card header,.record-card header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.response-body{white-space:pre-wrap;margin-top:10px}
.meta{font-size:12px;color:var(--muted)}
.key-value{display:grid;grid-template-columns:minmax(120px,35%) minmax(0,1fr);gap:8px 14px;margin:0}
.key-value dt{font-weight:820;color:#333;overflow-wrap:anywhere}
.key-value dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.object-tree{display:grid;gap:10px}
.object-section{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}
.object-section>h4{margin:0 0 8px;font-size:14px}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:var(--soft)}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 13px;background:var(--accent-soft);border:1px solid #c5d6fa}
.notice strong{display:block}
.notice p{margin:2px 0 0;color:#34445f}
.modal{width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px);border:0;border-radius:16px;padding:0;box-shadow:var(--shadow)}
.modal::backdrop{background:rgba(0,0,0,.42)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.modal-header h2{margin:0;font-size:20px}
.modal-body{padding:16px;overflow:auto;max-height:calc(100vh - 150px)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:13px 16px;border-top:1px solid var(--line);background:var(--soft)}
.icon-button{width:42px;padding:0;font-size:20px;line-height:1}
.toast-region{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1000;display:grid;gap:8px;width:min(420px,calc(100vw - 28px));pointer-events:none}
.toast{background:#171717;color:#fff;border-radius:11px;padding:11px 13px;box-shadow:var(--shadow);font-weight:680}
.hidden{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@media(max-width:680px){
  .app-header{padding-left:13px;padding-right:13px}
  .app-main{padding:14px 13px calc(28px + env(safe-area-inset-bottom))}
  .brand-title{font-size:20px}
  .header-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .view-tab{font-size:13px}
  .grid-2,.form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage-row{grid-template-columns:38px minmax(0,1fr)}
  .stage-row .status-chip{grid-column:2;justify-self:start}
  .stage-detail-header h2{font-size:22px}
  .key-value{grid-template-columns:1fr;gap:3px}
  .key-value dd{padding-bottom:8px;border-bottom:1px solid var(--line)}
  .key-value dd:last-child{border-bottom:0}
}
@media(max-width:370px){
  .header-actions{grid-template-columns:1fr}
  .project-pill{display:none}
  .view-tabs{grid-template-columns:1fr}
  .view-tab{min-height:40px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px}
  .view-tab[aria-current="page"]{border-color:var(--ink)}
  .stage-toolbar{grid-template-columns:1fr 1fr}
  .stage-select{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app-shell" aria-live="polite"><div class="loading">Loading the workbook…</div></div>
<div id="legacy-runtime" hidden aria-hidden="true">
  <div id="job"></div><div id="count"></div><div id="bar"></div><div id="master"></div><div id="nav"></div><div id="content"></div><input id="imp" type="file">
</div>
<div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
<dialog id="modal" class="modal"></dialog>
<input id="import-file" class="hidden" type="file" accept="application/json,.json">
<script type="module" src="workbook.js"></script>
</body>
</html>
