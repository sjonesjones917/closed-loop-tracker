<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mobile Closed-Loop Agent Reliability Workbook</title><style>*{box-sizing:border-box}html{background:#efefec}body{margin:0;background:#efefec;color:#111;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:880px;margin:auto;background:#fff;min-height:100vh}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d5d5d0;padding:14px 14px 10px}main{padding:12px 14px 40px}h1{font-size:21px;line-height:1.12;margin:0 0 5px}.tools,.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button,input,textarea,select{font:inherit}button{border:1px solid #222;background:#fff;color:#111;border-radius:8px;padding:9px 11px;font-weight:650;cursor:pointer}button.primary,.active{background:#111!important;color:#fff}.bar{height:6px;background:#ddd;margin-top:6px}.bar i{display:block;height:100%;background:#111}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0}.nav button{text-align:left;font-size:11px;line-height:1.15;padding:8px}.nav button b{display:block;font-size:10px;opacity:.7}.card{border:1px solid #d6d6d1;border-radius:10px;padding:13px;margin:10px 0;background:#fff}.card h2{font-size:17px;line-height:1.25;margin:0}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.035em;margin:0 0 8px}.card p{line-height:1.45}.card ul{padding-left:20px;margin:7px 0}.card li{margin:5px 0;line-height:1.35}label{display:block;font-weight:650;font-size:12px;margin-top:9px}label.check{display:flex;align-items:flex-start;gap:8px;font-weight:500;font-size:14px;line-height:1.35;padding:6px 0;border-bottom:1px solid #eee}label.check input{width:auto;min-width:18px;height:18px;margin:1px 0 0}textarea,input,select{width:100%;border:1px solid #bbb;border-radius:7px;padding:9px;background:#fff;color:#111}textarea{min-height:86px;resize:vertical}.record{min-height:520px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.copy{white-space:pre-wrap;background:#f5f5f2;border:1px solid #d8d8d3;border-radius:8px;padding:10px;max-height:520px;overflow:auto;font:11px/1.42 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0}.muted{color:#666;font-size:12px}.track{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:start;padding:7px 0;border-bottom:1px solid #eee;font-size:12px}.track span{font-weight:700}.track small{grid-column:2/4;color:#666;overflow-wrap:anywhere}.flow{line-height:1.55;font-weight:600}.tabs button{flex:1 1 150px}@media(min-width:700px){.nav{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){header{padding-top:max(12px,env(safe-area-inset-top))}.app{min-height:100dvh}main{padding-left:10px;padding-right:10px}.record{min-height:440px}.tabs button{flex:1 1 30%;font-size:12px;padding:8px 5px}}</style></head><body><div class="app"><header><h1>Mobile Closed-Loop Agent Reliability Workbook</h1><div id="job">UNASSIGNED JOB</div><div class="tools"><button onclick="newJob()">New clean job</button><button onclick="exportProject()">Export</button><button onclick="imp.click()">Import</button><input id="imp" type="file" hidden accept=".json,application/json" onchange="importProject(this)"></div><div><span id="count"></span><div class="bar"><i id="bar"></i></div></div></header><main><div class="tabs"><button onclick="view='workbook';render()">30-stage workbook</button><button onclick="view='appendices';render()">Appendices A–F</button><button onclick="view='control';render()">Job control</button></div><div id="nav" class="nav"></div><div id="content"></div></main></div><script>globalThis.job=document.getElementById('job');globalThis.count=document.getElementById('count');globalThis.bar=document.getElementById('bar');globalThis.nav=document.getElementById('nav');globalThis.content=document.getElementById('content');globalThis.imp=document.getElementById('imp');</script><script src="workbook.js"></script></body></html>
