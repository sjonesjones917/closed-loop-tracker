<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile Closed-Loop Reliability Workbook</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#111;font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:820px;margin:auto;background:#fff;min-height:100vh}header,main{padding:12px}header{border-bottom:1px solid #ddd}h1{font-size:20px;margin:0 0 4px}.tools{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}button,input,textarea,select{font:inherit}button{border:1px solid #222;background:#fff;border-radius:8px;padding:9px}button.primary,.active{background:#111!important;color:#fff}.bar{height:6px;background:#ddd}.bar i{display:block;height:100%;background:#111}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{font-size:11px;padding:7px 3px}.card{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}.card h2{font-size:17px}.card h3{font-size:13px;margin:14px 0 5px}label{display:block;font-weight:650;font-size:12px;margin-top:8px}textarea,input,select{width:100%;border:1px solid #bbb;border-radius:7px;padding:8px}textarea{min-height:70px}.copy{white-space:pre-wrap;background:#f2f2f2;border:1px solid #ddd;border-radius:8px;padding:9px;max-height:330px;overflow:auto;font:11px ui-monospace,monospace}.muted{color:#666;font-size:12px}@media(max-width:520px){.nav{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="app"><header><h1>Mobile Closed-Loop Reliability Workbook</h1><div id="job">UNASSIGNED JOB</div><div class="tools"><button onclick="newJob()">New clean job</button><button onclick="exportProject()">Export</button><button onclick="imp.click()">Import</button><input id="imp" type="file" hidden accept=".json" onchange="importProject(this)"></div><div><span id="count"></span><div class="bar"><i id="bar"></i></div></div></header><main><div id="master"></div><div id="nav" class="nav"></div><div id="content"></div></main></div><script>globalThis.job=document.getElementById('job');globalThis.count=document.getElementById('count');globalThis.bar=document.getElementById('bar');globalThis.nav=document.getElementById('nav');globalThis.content=document.getElementById('content');globalThis.imp=document.getElementById('imp');</script><script src="workbook.js?v=human-workbook-20260823-r10"></script></body></html>
