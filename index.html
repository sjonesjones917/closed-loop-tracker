<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mobile Closed-Loop Agent Reliability Workbook</title><style>
:root{--bg:#fff;--panel:#fff;--ink:#111;--muted:#666;--line:#ddd;--soft:#f5f5f5;--accent:#111;--radius:8px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{width:100%;max-width:720px;min-height:100dvh;margin:0 auto;background:var(--panel)}
header{padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:var(--panel);border-bottom:1px solid var(--line)}.headrow{display:flex;align-items:center;gap:10px}.titleblock{min-width:0;flex:1}h1{font-size:17px;line-height:1.2;margin:0 0 2px}.jobline{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;gap:5px}.tools button{min-width:36px;height:36px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-weight:700}.progressrow{display:flex;align-items:center;gap:8px;margin-top:9px}.progressrow #count{font-size:11px;color:var(--muted);white-space:nowrap}.bar{height:4px;flex:1;background:#eee;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}.tabs{position:sticky;top:0;z-index:4;display:flex;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{flex:0 0 auto;white-space:nowrap;font-size:12px}.nav{display:flex;gap:5px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff;-webkit-overflow-scrolling:touch}.nav:empty{display:none}.nav::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;width:48px;height:38px;overflow:hidden;text-align:center;padding:6px 4px;font-size:0;background:#fff}.nav button b{display:block;font-size:12px;margin:0}.nav button.active b{color:#fff}
button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:9px 11px;font-weight:700;cursor:pointer}button.primary,.active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
#content{padding:12px 14px}.card{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0 16px;margin:0 0 16px;background:#fff;box-shadow:none}.card h2{font-size:18px;line-height:1.25;margin:0}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px}.card p{margin:7px 0}.card ul{padding-left:20px;margin:6px 0}.card li{margin:7px 0}.muted{color:var(--muted);font-size:12px}
label{display:block;font-weight:700;font-size:12px;margin:10px 0 5px}label.check{display:flex;align-items:flex-start;gap:9px;font-weight:500;font-size:14px;line-height:1.4;padding:8px 0;margin:0;border-bottom:1px solid #eee}label.check input{width:20px;height:20px;min-width:20px;margin:0}textarea,input,select{width:100%;border:1px solid #ccc;border-radius:6px;padding:10px;background:#fff;color:var(--ink);outline:none}textarea:focus,input:focus,select:focus{border-color:#777}textarea{min-height:88px;resize:vertical}.record{min-height:360px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.copy{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:360px;overflow:auto;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0}.track{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:start;padding:9px 0;border-bottom:1px solid #eee;font-size:12px}.track span{font-weight:800}.track small{grid-column:2/4;color:var(--muted);overflow-wrap:anywhere}.flow{line-height:1.7;font-weight:650}
@media(max-width:520px){header{padding-left:12px;padding-right:12px}h1{font-size:16px}.tools button{min-width:34px;height:34px;padding:0 7px}.tools button:first-child{font-size:11px}.tabs{padding-left:8px;padding-right:8px}.tabs button{font-size:11px;padding:8px}.nav{padding-left:8px;padding-right:8px}#content{padding:10px 12px}.card{padding-bottom:14px;margin-bottom:14px}.record{min-height:320px}}
</style></head><body><div class="app"><header><div class="headrow"><div class="titleblock"><h1>Mobile Closed-Loop Agent Reliability Workbook</h1><div id="job" class="jobline">UNASSIGNED JOB</div></div><div class="tools"><button onclick="newJob()" aria-label="New clean job">New job</button><button onclick="exportProject()" aria-label="Export">⇧</button><button onclick="imp.click()" aria-label="Import">⇩</button><input id="imp" type="file" hidden accept=".json,application/json" onchange="importProject(this)"></div></div><div class="progressrow"><span id="count"></span><div class="bar"><i id="bar"></i></div></div></header><main><div class="tabs"><button onclick="view='workbook';render()">Workbook</button><button onclick="view='appendices';render()">Appendices</button><button onclick="view='control';render()">Job control</button></div><div id="nav" class="nav"></div><div id="content"></div></main></div><script>globalThis.job=document.getElementById('job');globalThis.count=document.getElementById('count');globalThis.bar=document.getElementById('bar');globalThis.nav=document.getElementById('nav');globalThis.content=document.getElementById('content');globalThis.imp=document.getElementById('imp');</script><script src="workbook.js"></script></body></html>
