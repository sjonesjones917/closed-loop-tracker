<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Closed Loop"><title>Closed Loop Workflow</title><style>:root{--bg:#08111e;--p:#111d30;--p2:#17263d;--line:#2b3d5b;--t:#f6f9ff;--m:#9eacc4;--b:#6bb0ff;--g:#60d57d;--a:#ffd166;--r:#ff7373}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui;padding-bottom:84px}header{position:sticky;top:0;z-index:10;background:#08111ef8;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 13px 9px}h1{font-size:19px;margin:0}h2{font-size:20px}.muted,small,label{color:var(--m)}main{padding:13px;max-width:920px;margin:auto}.c{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px}.notice{border-left:4px solid var(--b)}.ok{border-left:4px solid var(--g)}.warn{border-left:4px solid var(--a)}.bad{border-left:4px solid var(--r)}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}button,input,textarea,select{font:inherit;border-radius:11px}button{border:0;padding:10px 12px;background:var(--b);color:#06101c;font-weight:800}button.s{background:var(--p2);color:var(--t);border:1px solid var(--line)}input,textarea,select{width:100%;background:#091523;color:#fff;border:1px solid var(--line);padding:10px;font-size:16px}textarea{min-height:105px;resize:vertical}label{display:block;font-size:12px;margin:10px 0 5px}.stage{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:13px;padding:10px;margin:7px 0}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--p2);font-size:12px;font-weight:900}.pill{font-size:10px;border-radius:99px;padding:5px 7px;background:var(--p2);color:var(--m)}.pill.COMPLETE{background:var(--g);color:#06230e}.pill.BLOCKED{background:var(--a);color:#302100}.pill.FAILED{background:var(--r);color:#300}.pill.IN_PROGRESS{background:var(--b);color:#06101c}pre{white-space:pre-wrap;word-break:break-word;background:#07101b;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:12px;max-height:460px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--p2);padding:10px;border-radius:11px;text-align:center}.metric b{display:block;font-size:19px}details{margin:8px 0}summary{font-weight:800}nav{position:fixed;left:0;right:0;bottom:0;background:#08111efa;border-top:1px solid var(--line);padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}nav button{font-size:11px;padding:9px 2px;background:var(--p2);color:var(--m)}.run{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}</style></head><body><header><div class="row between"><div><h1>Closed Loop Workflow</h1><small id="sub">No job selected</small></div><button class="s" onclick="backup()">Backup</button></div></header><main id="app"></main><nav><button onclick="jobs()">Jobs</button><button onclick="flow()">Workflow</button><button onclick="records()">Evidence</button><button onclick="blockers()">Blockers</button></nav><script src="v2-spec.js"></script><script src="v2-model.js"></script><script src="v2-contract.js"></script><script src="v2-validate.js"></script><script src="v2-batch.js"></script><script src="v2-ui.js"></script></body></html>
