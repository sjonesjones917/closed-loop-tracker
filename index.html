<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>Closed Loop Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101e;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui;padding:14px 14px 88px}h1{font-size:22px;margin:4px 0}h2{font-size:20px}.c{background:#101a2c;border:1px solid #263653;border-radius:15px;padding:13px;margin:10px 0}button,select,input,textarea{font:inherit;border-radius:11px;border:1px solid #31425f}button{padding:10px 12px;background:#5ba7ff;color:#07101e;font-weight:700}button.s{background:#162238;color:#fff}input,select,textarea{width:100%;padding:10px;background:#0b1526;color:#fff;margin:4px 0 10px}textarea{min-height:100px}small,label{color:#9fb0cc}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stage{padding:12px;background:#101a2c;border-radius:12px;margin:7px 0}.pill{font-size:11px;padding:4px 7px;border-radius:999px;background:#162238}nav{position:fixed;bottom:0;left:0;right:0;background:#07101eee;border-top:1px solid #263653;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}nav button{font-size:12px}pre{white-space:pre-wrap;background:#06101d;padding:10px;border-radius:10px;max-height:320px;overflow:auto}.hide{display:none}.warn{background:#3a2b0d;border-color:#6e5420}.good{background:#0f2919;border-color:#245c38}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}</style></head><body><h1>Closed Loop Tracker</h1><div id=sub><small>No job selected</small></div><main id=app></main><nav><button onclick=jobs()>Jobs</button><button onclick=flow()>Workflow</button><button onclick=regs()>Registries</button><button onclick=backup()>Backup</button></nav><script>
const STAGES=[
{n:1,name:'Initialize the job',objective:'Create and version the authoritative job record. Capture the user request exactly; identify supplied inputs, explicit constraints, assumptions, unknowns, and control metadata.',deliverable:'JOB RECORD + INPUT-vN.',mustNot:['Do not draft, research, outline, evaluate, or otherwise produce any part of the final requested deliverable.','Do not reinterpret the user objective into a different objective.','Do not invent values for missing facts.'],inputs:['Original user objective','Original requested deliverable','Supplied files/messages/links/data','Explicit constraints','Requested output format','Deadline or temporal scope','Known authoritative sources','Available tools','Prohibited actions','Known unknowns'],fields:['JOB_ID','EXACT_USER_OBJECTIVE','EXACT_DELIVERABLE_REQUESTED','SUPPLIED_FILES_MESSAGES_LINKS_DATA_CONSTRAINTS','REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','KNOWN_AUTHORITATIVE_SOURCES','AVAILABLE_TOOLS','PROHIBITED_ACTIONS','UNKNOWN_INFORMATION','EXPLICIT_USER_REQUIREMENTS','ASSUMPTIONS','INPUT_SET_VERSION'],gate:'Complete only when the job record preserves the user request exactly, all supplied inputs are inventoried at the job-record level, assumptions are separated from explicit requirements, required unknowns are marked UNKNOWN, and INPUT-vN is assigned.'},
{n:2,name:'Build the source inventory',objective:'Identify and classify every source that may govern correctness for this job.',deliverable:'SOURCE-SET-vN containing one source record for every known controlling, mandatory, informative, or evidentiary source plus recorded conflicts/blockers.',mustNot:['Do not research the final deliverable itself beyond what is necessary to identify governing sources.','Do not silently resolve unresolved authoritative conflicts.','Do not draft the final product.'],inputs:['Stage 1 job record','Supplied files and links','Current authoritative external sources when correctness depends on them'],fields:['SOURCE_ID','TITLE_OR_DESCRIPTION','SOURCE_TYPE','ORIGIN','VERSION','PUBLICATION_OR_EFFECTIVE_DATE','AUTHORITY_LEVEL','ROLE','RELEVANT_PORTIONS','CONFLICTS','CONTROLLING_SOURCE_DECISION','UNRESOLVED_CONFLICT_BLOCKER','SOURCE_SET_VERSION'],gate:'Complete only when every known governing source has a record, actual supplied files have been inspected rather than inferred from filenames, authority hierarchy has been applied, and unresolved authoritative conflicts are explicitly blocked.'},
{n:3,name:'Research the requirements',objective:'Extract every material requirement, restriction, exception, applicability condition, dependency, and source-evidence link from the complete source set.',deliverable:'RESEARCH-vN containing requirement candidates and exact supporting source evidence, including a final saturation pass.',mustNot:['Do not draft the final requested deliverable.','Do not collapse recommendations and mandatory requirements into one category.','Do not stop after only the obvious requirements.'],inputs:['Stage 2 source set','Stage 1 user requirements and constraints'],fields:['RESEARCH_PASS_ID','SOURCE_ID','REQUIREMENT_CANDIDATE','CLASSIFICATION','USER_CREATED_REQUIREMENTS','OUTPUT_MEDIUM_REQUIREMENTS','DEPENDENCY_REQUIREMENTS','APPLICABILITY_FACTS','EDGE_CONDITIONS','EXCEPTIONS','SOURCE_EVIDENCE','CONTRADICTORY_OR_RESTRICTIVE_FINDINGS','NO_NEW_MATERIAL_CATEGORY_ON_FINAL_PASS','RESEARCH_VERSION'],gate:'Complete only after every known controlling source has been examined and an additional research pass produces no new material requirement category.'},
{n:4,name:'Compile the requirement specification',objective:'Convert the researched obligations into atomic, independently testable requirements with objective verification criteria.',deliverable:'REQUIREMENTS-vN containing one atomic record per independently testable obligation.',mustNot:['Do not use undefined acceptance terms such as good, strong, professional, complete, correct, sufficient, appropriate, or perfect.','Do not combine independently testable obligations into one requirement.','Do not draft the final product.'],inputs:['Stage 3 research record','Source evidence','User-created requirements'],fields:['REQ_ID','REQUIREMENT','TYPE','SOURCE','SOURCE_LOCATION','AUTHORITY','APPLICABILITY','DEPENDENCIES','PROHIBITIONS','VERIFICATION_METHOD','EXPECTED_EVIDENCE','FAILURE_CONDITION','STATUS','REQUIREMENTS_VERSION'],gate:'Complete only when each obligation is atomic and two independent evaluators using the same evidence should reach the same result.'},
{n:5,name:'Resolve the requirement set',objective:'Remove structural defects from the complete requirement set and identify any mandatory blocker that prevents valid continuation.',deliverable:'RESOLVED-REQUIREMENTS-vN plus blocker records for anything mandatory that cannot be established.',mustNot:['Do not treat an unresolved mandatory requirement as satisfied.','Do not patch contradictions by silently choosing one side.','Do not draft the final product.'],inputs:['Stage 4 requirement registry','Source authority/evidence'],fields:['DUPLICATE_REQUIREMENTS','CONFLICTING_REQUIREMENTS','MUTUALLY_UNSATISFIABLE_REQUIREMENTS','UNDEFINED_TERMS','CIRCULAR_DEPENDENCIES','MISSING_PREREQUISITES','UNSUPPORTED_REQUIREMENTS','INDETERMINATE_APPLICABILITY','NO_VERIFICATION_METHOD','RESOLUTION','BLOCKER','RESOLVED_REQUIREMENTS_VERSION'],gate:'Complete only when every resolvable defect is resolved and every unresolved mandatory item is explicitly BLOCKED.'},
{n:6,name:'Build the verification suite',objective:'Create the strongest available verification procedure for every mandatory requirement before production instructions are written.',deliverable:'TEST-SUITE-vN with at least one test per mandatory requirement and mandatory_test_coverage = 1.00.',mustNot:['Do not use AI semantic evaluation for a property that can be deterministically checked.','Do not leave a mandatory requirement without a test unless the workflow is stopping on an explicit blocker.','Do not draft the final product.'],inputs:['Resolved requirement registry','Source evidence'],fields:['TEST_ID','REQ_ID','TEST_TYPE','INPUTS_REQUIRED','PROCEDURE','EXPECTED_RESULT','FAILURE_CONDITION','EVIDENCE_PRODUCED','MANDATORY_REQUIREMENTS_WITH_TESTS','TOTAL_MANDATORY_REQUIREMENTS','MANDATORY_TEST_COVERAGE','TEST_SUITE_VERSION'],gate:'Complete only when mandatory_test_coverage equals 1.00 or the workflow stops on an explicit mandatory blocker.'},
{n:7,name:'Build failure tests',objective:'Construct deliberate invalid cases and prove the validators detect, reject, or block them.',deliverable:'FAILURE-TESTS-vN plus any validator defects and corrected validator versions.',mustNot:['Do not accept a validator that accepts a deliberately invalid case.','Do not draft the final product.'],inputs:['Requirement registry','Verification suite'],fields:['FAILURE_TEST_ID','REQ_ID','FAILURE_FIXTURE','VIOLATION_MODE','EXPECTED_SYSTEM_RESPONSE','ACTUAL_VALIDATOR_RESULT','VALIDATOR_DEFECT_ID','VALIDATOR_CORRECTION','RETEST_RESULT'],gate:'Complete only when each applicable requirement has at least one violation mode and every deliberately invalid fixture is detected/rejected/blocked as specified.'},
{n:8,name:'Author the production instruction',objective:'Write the exact production instruction from the resolved requirements and verified tests, not from memory of the original request.',deliverable:'INSTRUCTION-vN containing objective, inputs, authority, scope, definitions, required procedure, decision rules, tool rules, output contract, failure handling, and completion criteria.',mustNot:['Do not generate the final product.','Do not use vague commands such as research all requirements or verify the result without an operational method.','Do not convert UNKNOWN to TRUE.'],inputs:['Resolved requirements','Verified test suite','Source authority rules'],fields:['OBJECTIVE','INPUTS','CONFLICTING_MISSING_MALFORMED_INPUT_HANDLING','SOURCE_AUTHORITY','SCOPE','DEFINED_TERMS','REQUIRED_PROCEDURE','DECISION_RULES','TOOL_RULES','OUTPUT_CONTRACT','FAILURE_HANDLING','COMPLETION_CRITERIA','PRODUCTION_INSTRUCTION_VERSION'],gate:'Complete only when every material branch, failure path, output obligation, and completion condition is explicit and traceable.'},
{n:9,name:'Preflight the production instruction',objective:'Independently inspect the production instruction without executing the target work and remove every known material instruction defect.',deliverable:'PREFLIGHT-REPORT-vN and corrected INSTRUCTION-vN.',mustNot:['Do not execute the final production task.','Do not let the authoring pass validate itself.'],inputs:['Stage 8 production instruction','Requirement registry','Test suite'],fields:['SENTENCE_ID','MATERIAL_AMBIGUITY','UNDEFINED_OBJECT','UNSUPPLIED_INFORMATION_DEPENDENCY','INSTRUCTION_CONFLICT','UNAVAILABLE_CAPABILITY','OBJECTIVELY_VERIFIABLE','RESPONSIBLE_OPERATION_CLEAR','ORDERING_CLEAR','FAILURE_BEHAVIOR_DEFINED','REQUIREMENT_OR_CONTROL_TRACE','CORRECTION','INSTRUCTION_VERSION'],gate:'Complete only after a separate evaluation process finds no known material instruction defect.'},
{n:10,name:'Freeze the test candidate',objective:'Freeze the exact test candidate so the coming execution batch uses immutable versions.',deliverable:'FREEZE_ID referencing INPUT-vN, SOURCE-SET-vN, REQUIREMENTS-vN, TEST-SUITE-vN, INSTRUCTION-vN, TOOL-CONFIGURATION-vN and hashes where practical.',mustNot:['Do not generate the final product.','Do not alter a frozen component during the batch.'],inputs:['Approved preflight instruction and all dependent versions'],fields:['FREEZE_ID','INPUT_VERSION','SOURCE_SET_VERSION','REQUIREMENTS_VERSION','TEST_SUITE_VERSION','INSTRUCTION_VERSION','TOOL_CONFIGURATION_VERSION','FILE_ARTIFACT','FILE_HASH'],gate:'Complete only when every frozen component is version-identified and no component will be changed during the batch.'},
{n:11,name:'Run ten independent executions',objective:'Run ten fresh independent candidate executions using exactly the same frozen package.',deliverable:'RUN-001 through RUN-010 as separate outputs with no cross-run contamination.',mustNot:['Do not generate the final release product; these are test executions.','Do not expose one run to another run output, reviewer comments, prior failure explanations, or proposed corrections.'],inputs:['Stage 10 frozen package'],fields:['RUN_ID','INPUT_VERSION','SOURCE_SET_VERSION','REQUIREMENTS_VERSION','INSTRUCTION_VERSION','TOOL_CONFIGURATION_VERSION','OUTPUT','OUTPUT_FILE_OR_LOCATION','OUTPUT_HASH'],gate:'Complete only when ten fresh independent outputs exist and all ten used exactly the same frozen package.'},
{n:12,name:'Verify each execution independently',objective:'Apply the full verification suite independently to each of the ten test executions.',deliverable:'Requirement-by-run verification matrix with SATISFIED, VIOLATED, or UNDETERMINED and evidence.',mustNot:['Do not ask the generating agent to certify its own work.','Do not collapse deterministic, semantic, and adversarial validation into unsupported pass/fail labels.'],inputs:['Ten run outputs','Verification suite','Requirement registry','Source evidence'],fields:['REQ_ID','RUN_ID','RESULT','TEST_ID','EVIDENCE','DEFECT_ID','DETERMINISTIC_VALIDATION_RESULT','SEMANTIC_VALIDATION_RESULT','ADVERSARIAL_VALIDATION_RESULT'],gate:'Complete only when every mandatory requirement has a verification determination for every run.'},
{n:13,name:'Compare the ten executions',objective:'Compare the verified ten-run outcomes requirement by requirement and identify correctness-affecting variance.',deliverable:'RUN-COMPARISON-vN identifying universal successes, violations, interpretation conflicts, prohibited variance, inconclusive tests, repeated failures, and unique failures.',mustNot:['Do not select the best run and discard the others.','Do not ignore variance that affects correctness.'],inputs:['Stage 12 verification matrix','Ten run outputs'],fields:['REQ_ID','SATISFIED_BY_ALL_TEN','VIOLATED_RUNS','INCONSISTENT_INTERPRETATIONS','PROHIBITED_OUTPUT_VARIANCE','INCONCLUSIVE_TEST','REPEATED_FAILURE','UNIQUE_FAILURE','VARIANCE_DEFECT_ID'],gate:'Complete only when every correctness-affecting disagreement is classified as a defect or conclusively explained.'},
{n:14,name:'Root-cause every defect',objective:'Trace every confirmed defect backward to the earliest defective layer.',deliverable:'DEFECT ROOT-CAUSE RECORDS classified as SOURCE, RESEARCH, REQUIREMENT, TEST, INSTRUCTION, INPUT, EXECUTION, TOOL, or AUDIT defects.',mustNot:['Do not classify a symptom as an instruction defect merely because changing the instruction could hide it.','Do not patch only the final output.'],inputs:['Comparison defects','Verification evidence','Frozen versions and source authority'],fields:['DEFECT_ID','DEFECT_CATEGORY','BAD_OUTPUT_EVIDENCE','EXECUTION_COMPLIANT_WITH_INSTRUCTION','INSTRUCTION_CORRECT_RELATIVE_TO_REQUIREMENT','REQUIREMENT_CORRECT_RELATIVE_TO_AUTHORITY','SOURCE_CORRECT_AND_COMPLETE','EARLIEST_DEFECTIVE_LAYER','ROOT_CAUSE','RESPONSIBLE_LAYER_TO_CORRECT'],gate:'Complete only when each material defect has one earliest supported root-cause layer.'},
{n:15,name:'Convert every confirmed failure into a regression test',objective:'Preserve each confirmed defect as a permanent reproducing regression test.',deliverable:'REGRESSION-TEST records linked to original defects and requirements.',mustNot:['Do not remove a regression test while its governing requirement remains applicable.'],inputs:['Confirmed root-cause defects'],fields:['REG_ID','ORIGINAL_DEFECT_ID','REQ_ID','FAILURE_FIXTURE','DETECTION_METHOD','EXPECTED_REJECTION_OR_CORRECTION','PRE_CORRECTION_RESULT','POST_CORRECTION_RESULT','PERMANENT_SUITE_ENTRY'],gate:'Complete only when each confirmed defect has a fixture that fails before correction and succeeds after correction.'},
{n:16,name:'Revise the responsible layer',objective:'Correct the earliest defective layer and invalidate all affected downstream evidence.',deliverable:'New version(s) of every changed artifact plus a dependency/rerun record.',mustNot:['Do not modify a version in place.','Do not change the instruction merely to hide a defect rooted earlier.'],inputs:['Root-cause records','Regression tests'],fields:['DEFECT_ID','RESPONSIBLE_LAYER','OLD_ARTIFACT_VERSION','CORRECTION','NEW_ARTIFACT_VERSION','DEPENDENT_ARTIFACTS_INVALIDATED','VALIDATION_TO_RERUN'],gate:'Complete only when the earliest defective layer is corrected, changed artifacts are newly versioned, and affected downstream validation is invalidated.'},
{n:17,name:'Re-run the complete ten-execution iteration',objective:'Freeze the corrected versions and run a new independent ten-execution iteration from scratch.',deliverable:'ITERATION-vN containing a new freeze, ten new run outputs, verification, comparison, defects, regressions, and corrections.',mustNot:['Do not continue old execution conversations.','Do not mix prior run outputs into fresh executions.'],inputs:['Corrected artifact versions','Regression suite'],fields:['ITERATION_ID','NEW_FREEZE_ID','INPUT_VERSION','SOURCE_SET_VERSION','REQUIREMENTS_VERSION','TEST_SUITE_VERSION','INSTRUCTION_VERSION','TOOL_CONFIGURATION_VERSION','RUN_IDS','VERIFICATION_SUMMARY','COMPARISON_SUMMARY','DEFECTS','REGRESSIONS_ADDED','CORRECTIONS'],gate:'Complete only after the new ten-run batch and its full verify/compare/root-cause/correct cycle are complete.'},
{n:18,name:'Continue until convergence',objective:'Evaluate iteration metrics and continue the correction loop until every convergence condition is simultaneously true.',deliverable:'CONVERGENCE-RECORD-vN with calculated metrics and CONVERGED = TRUE or FALSE.',mustNot:['Do not freeze the production baseline merely because ten runs completed.','Do not ignore unresolved mandatory unknowns, ambiguity, contradictions, or variance.'],inputs:['Latest iteration evidence','Regression results'],fields:['ITERATION_ID','MANDATORY_REQUIREMENT_COVERAGE','MANDATORY_VERIFICATION_COVERAGE','REGRESSION_TEST_SUCCESS','CRITICAL_DEFECTS','MAJOR_DEFECTS','MANDATORY_UNRESOLVED_UNKNOWNS','CORRECTNESS_AFFECTING_CONTRADICTIONS','CORRECTNESS_AFFECTING_AMBIGUITIES','UNEXPLAINED_CORRECTNESS_AFFECTING_VARIANCE','CONVERGED'],gate:'Complete successfully only when all convergence metrics meet the workflow thresholds simultaneously.'},
{n:19,name:'Run an unchanged confirmation iteration',objective:'After first convergence, run ten fresh executions with absolutely no changes to confirm the converged candidate.',deliverable:'CONFIRMATION-ITERATION-vN using the exact same frozen versions plus full verification results.',mustNot:['Do not change any frozen component.','Do not continue prior execution conversations.'],inputs:['Exact converged frozen package'],fields:['CONFIRMATION_ITERATION_ID','FREEZE_ID','PROOF_NO_COMPONENT_CHANGED','RUN_IDS','VERIFICATION_RESULTS','NEW_CRITICAL_OR_MAJOR_DEFECT','NEW_REQUIREMENT_DISCOVERED','MUTATION_DETECTION_FAILURE','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED'],gate:'Complete only when the unchanged confirmation iteration satisfies the complete acceptance criteria.'},
{n:20,name:'Freeze the production baseline',objective:'Freeze the exact approved production baseline after successful unchanged confirmation.',deliverable:'BASELINE_ID with exact approved component versions and immutable hashes.',mustNot:['Do not generate the final product yet.','Do not grant baseline status to changed components automatically.'],inputs:['Accepted confirmation iteration'],fields:['BASELINE_ID','INPUT_CONTRACT_VERSION','SOURCE_SET_VERSION','REQUIREMENTS_VERSION','INSTRUCTION_VERSION','TEST_SUITE_VERSION','VALIDATOR_VERSION','TOOL_CONFIGURATION_VERSION','IMMUTABLE_FILE','IMMUTABLE_FILE_HASH'],gate:'Complete only when every approved baseline component and immutable file is identified exactly.'},
{n:21,name:'Generate the finished product',objective:'Generate the actual final requested deliverable using only the approved production baseline materials.',deliverable:'THE FINAL REQUESTED DELIVERABLE plus PRODUCT_ID, BASELINE_ID, EXECUTION_ID, output file list, output hashes, and product version.',mustNot:['Do not use non-baseline instructions or superseded inputs.','Do not manually edit the generated product outside the controlled workflow.'],inputs:['Approved baseline production instruction','Approved baseline inputs/sources/requirements/tools required by the instruction'],fields:['PRODUCT_ID','BASELINE_ID','EXECUTION_ID','OUTPUT_FILE','OUTPUT_HASH','PRODUCT_VERSION'],gate:'Complete only when the final requested deliverable has been generated exactly from the approved baseline and its output identity is recorded.'},
{n:22,name:'Run deterministic verification on the finished product',objective:'Run every applicable deterministic test against the actual finished artifact.',deliverable:'DETERMINISTIC-PRODUCT-VERIFICATION-vN with actual test results and defect IDs.',mustNot:['Do not verify only an upstream source representation when the finished artifact exists.','Do not accept any failed mandatory deterministic test.'],inputs:['Actual finished product','Deterministic portion of approved test suite'],fields:['TEST_ID','PRODUCT_ID','CHECK','EXPECTED_RESULT','ACTUAL_RESULT','DETERMINATION','EVIDENCE','DEFECT_ID'],gate:'Complete successfully only when every applicable mandatory deterministic test succeeds.'},
{n:23,name:'Run independent semantic verification',objective:'Independently evaluate every semantic requirement against the actual finished product and source evidence.',deliverable:'SEMANTIC-VERIFICATION-vN with requirement-by-requirement evidence and SATISFIED, VIOLATED, or UNDETERMINED.',mustNot:['Do not use unsupported conclusions such as looks correct, appears compliant, pass, or good.','Do not let the product-generating agent be the sole semantic evaluator.'],inputs:['Actual finished product','Requirement registry','Relevant source evidence','Evaluation rubric'],fields:['REQ_ID','PRODUCT_LOCATION','SOURCE_EVIDENCE','OBSERVED_MEANING','REQUIRED_MEANING','DETERMINATION','EVIDENCE'],gate:'Complete only when every semantic requirement has a supported determination.'},
{n:24,name:'Run adversarial verification',objective:'Attempt to disprove product correctness by actively searching for hidden defects and technically superficial compliance.',deliverable:'ADVERSARIAL-VERIFICATION-vN containing attack/check records and any discovered defects.',mustNot:['Do not merely confirm previous verification.','Do not treat mention of a requirement as satisfaction of that requirement.'],inputs:['Finished product','Deterministic and semantic verification evidence','Requirement registry','Source evidence'],fields:['ADVERSARIAL_CHECK_ID','TARGET','CHECK_OR_ATTACK','EVIDENCE','DEFECT_FOUND','DEFECT_ID','REQUIRED_RETURN_STAGE'],gate:'Complete only after deliberate searches for omissions, contradictions, unsupported facts, broken references, hidden assumptions, stale information, malformed files, export corruption, and semantic nonsense have been performed.'},
{n:25,name:'Inspect the final representation',objective:'Inspect the exact converted or packaged representation that will actually be delivered.',deliverable:'FINAL-REPRESENTATION-INSPECTION-vN for the exact delivery files.',mustNot:['Do not rely solely on validation of an upstream representation.'],inputs:['Exact files that would be delivered after all conversions/packaging'],fields:['FINAL_REPRESENTATION_ID','TRANSFORMATION_CHAIN','RENDERED_PAGES','CLIPPING','MISSING_CONTENT','BLANK_PAGES','BROKEN_TABLES','MISPLACED_GRAPHICS','MATERIAL_FONT_SUBSTITUTION','CORRUPT_FILES','MISSING_PACKAGE_FILES','UNEXPECTED_FILES','WRONG_FILENAMES','INCONSISTENT_VERSIONS','DEFECT_ID'],gate:'Complete only when the exact final representation and every packaged file has been inspected.'},
{n:26,name:'Reconcile process and product evidence',objective:'Prove process correctness and product correctness independently before release.',deliverable:'RECONCILIATION-vN with separate process and product correctness determinations.',mustNot:['Do not infer product correctness from process correctness.','Do not infer process correctness from product correctness.'],inputs:['Baseline','Production execution record','All final verification evidence'],fields:['APPROVED_INPUTS_USED','APPROVED_INSTRUCTION_USED','REQUIRED_TOOLS_RAN','REQUIRED_TESTS_RAN','UNAUTHORIZED_MODIFICATION','EVERY_MANDATORY_PRODUCT_REQUIREMENT_SATISFIED','EVERY_MANDATORY_TEST_SUCCEEDED','SEMANTIC_REQUIREMENTS_HAVE_SUPPORTING_EVIDENCE','UNRESOLVED_CRITICAL_OR_MAJOR_DEFECT','PROCESS_CORRECTNESS','PRODUCT_CORRECTNESS'],gate:'Complete only when process correctness and product correctness are each independently supported.'},
{n:27,name:'Apply the release gate',objective:'Assign exactly one evidence-based release state: ACCEPTED, REJECTED, or BLOCKED.',deliverable:'RELEASE-DECISION-vN with affirmative evidence or identified violations/blockers.',mustNot:['Do not accept from absence of detected defects alone.','Do not let a human manually override missing mandatory evidence into ACCEPTED.'],inputs:['Reconciled process/product evidence','Mandatory requirement evidence','Mandatory validator results'],fields:['RELEASE_STATE','AFFIRMATIVE_EVIDENCE_FOR_EVERY_MANDATORY_REQUIREMENT','ALL_MANDATORY_VALIDATORS_SUCCEEDED','MANDATORY_VIOLATIONS','MANDATORY_UNESTABLISHED_ITEMS','RELEASE_DECISION_EVIDENCE'],gate:'ACCEPTED only when every mandatory requirement has affirmative evidence and every mandatory validator succeeds; REJECTED when a mandatory requirement is violated; BLOCKED when a mandatory requirement cannot be established.'},
{n:28,name:'Verify artifact identity before release',objective:'Prove the bytes about to be released are identical to the bytes that completed final verification.',deliverable:'RELEASE-HASH-VERIFICATION-vN with AUDITED_HASH and RELEASE_HASH for every artifact.',mustNot:['Do not release any modified artifact under an earlier audit.'],inputs:['Exact audited artifacts','Exact artifacts about to be delivered'],fields:['ARTIFACT','AUDITED_HASH','RELEASE_HASH','HASHES_EQUAL','MODIFICATION_FOUND','NEW_PRODUCT_VERSION_IF_REQUIRED','AFFECTED_VALIDATION_RERUN','RELEASE_GATE_RERUN'],gate:'Complete successfully only when RELEASE_HASH = AUDITED_HASH for every release artifact.'},
{n:29,name:'Preserve the complete evidence chain',objective:'Preserve complete traceability for every mandatory requirement from source through release decision.',deliverable:'EVIDENCE-CHAIN-vN linking SOURCE → REQUIREMENT → INSTRUCTION → EXECUTION → PRODUCT ELEMENT → TEST → TEST RESULT → EVIDENCE → RELEASE DECISION.',mustNot:['Do not claim affirmative acceptance for a mandatory requirement with a missing traceability link.'],inputs:['Complete job evidence'],fields:['REQ_ID','SOURCE','REQUIREMENT','INSTRUCTION','EXECUTION','PRODUCT_ELEMENT','TEST','TEST_RESULT','EVIDENCE','RELEASE_DECISION','CHAIN_COMPLETE'],gate:'Complete only when every mandatory requirement has every required traceability link.'},
{n:30,name:'Preserve failures permanently',objective:'Maintain the permanent defect/regression registry and ensure still-applicable regressions are retained for future baselines.',deliverable:'DEFECT-REGISTRY-vN with permanent regression links and verification results.',mustNot:['Do not remove an applicable regression test merely because the current release passed.'],inputs:['All defects and regression tests from the job'],fields:['DEFECT_ID','DATE','ITERATION','PRODUCT_VERSION','REQUIREMENT','OBSERVED_FAILURE','ROOT_CAUSE','CORRECTION','REGRESSION_TEST','VERIFICATION_RESULT','STILL_APPLICABLE'],gate:'Complete only when every known defect and applicable regression is preserved for future baseline approval.'}
];
const E={stage:['NOT_STARTED','IN_PROGRESS','COMPLETE','BLOCKED','FAILED'],truth:['TRUE','FALSE','UNKNOWN','N_A'],release:['ACCEPTED','REJECTED','BLOCKED'],reqType:['USER','AUTHORITATIVE','FORMAT','DEPENDENCY','PROHIBITION','APPLICABILITY','QUALITY'],reqStatus:['CANDIDATE','RESOLVED','BLOCKED','SUPERSEDED'],sourceRole:['MANDATORY','INFORMATIVE','EVIDENTIARY'],sourceType:['USER_INPUT','FILE','WEB','STATUTE','REGULATION','STANDARD','POLICY','SPECIFICATION','DATA','OTHER'],authority:['USER','CONTROLLING','BINDING','PERSUASIVE','INFORMATIVE','UNKNOWN'],verify:['FORMAL_PROOF','EXACT_COMPUTATION','DETERMINISTIC_PROGRAM','SCHEMA_VALIDATION','SOURCE_COMPARISON','RULE_BASED','SEMANTIC_EVALUATION','AUTHORIZED_HUMAN_JUDGMENT'],vresult:['SATISFIED','VIOLATED','UNDETERMINED'],defect:['SOURCE_DEFECT','RESEARCH_DEFECT','REQUIREMENT_DEFECT','TEST_DEFECT','INSTRUCTION_DEFECT','INPUT_DEFECT','EXECUTION_DEFECT','TOOL_DEFECT','AUDIT_DEFECT']};
let D=JSON.parse(localStorage.clt_v4||'{"jobs":[]}'),jid=D.jid||null;const A=document.getElementById('app');function save(){D.jid=jid;localStorage.clt_v4=JSON.stringify(D);hdr()}function j(){return D.jobs.find(x=>x.id==jid)}function uid(p){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase()}function esc(x){return String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function hdr(){document.getElementById('sub').innerHTML='<small>'+(j()?j().id+' • Stage '+j().current+'/30':'No job selected')+'</small>'}function copy(t){navigator.clipboard.writeText(t).catch(()=>prompt('Copy:',t))}function gen(n){if(n==10)return'FREEZE_ID: '+uid('FREEZE');if(n==17)return'ITERATION_ID: '+uid('ITER');if(n==19)return'CONFIRMATION_ITERATION_ID: '+uid('ITER');if(n==20)return'BASELINE_ID: '+uid('BASELINE');if(n==21)return'PRODUCT_ID: '+uid('PRODUCT')+'\nEXECUTION_ID: '+uid('EXEC');return''}
function nj(){let x={id:uid('JOB'),title:'',objective:'',deliverable:'',materials:'',constraints:'',format:'UNSPECIFIED',deadline:'',authorities:'',tools:'',prohibited:'',unknowns:'',current:1,inputVersion:1,st:STAGES.map(d=>({n:d.n,status:'NOT_STARTED',input:'',result:'',handoff:'',agent:'',ids:gen(d.n)})),sources:[],requirements:[],tests:[],runs:[],defects:[],artifacts:[],blockers:[]};D.jobs.unshift(x);jid=x.id;save();intake()}
function jobs(){A.innerHTML='<div class=row><button onclick=nj()>New Job</button></div>'+(D.jobs.length?D.jobs.map(x=>`<div class=c><b>${esc(x.title||'Untitled')}</b><br><small>${x.id}</small><p>${esc(x.objective)}</p><button onclick="jid='${x.id}';save();flow()">Open</button> <button class=s onclick="jid='${x.id}';save();intake()">Edit</button></div>`).join(''):'<div class=c>No jobs yet.</div>')}
function intake(){let x=j();A.innerHTML=`<div class=c><label>Job title</label><input value="${esc(x.title)}" oninput="j().title=this.value;save()"><label>Exact final job objective</label><textarea oninput="j().objective=this.value;save()">${esc(x.objective)}</textarea><label>Exact final requested deliverable</label><textarea oninput="j().deliverable=this.value;save()">${esc(x.deliverable)}</textarea><label>Supplied files/messages/links/data</label><textarea oninput="j().materials=this.value;save()">${esc(x.materials)}</textarea><label>Explicit constraints</label><textarea oninput="j().constraints=this.value;save()">${esc(x.constraints)}</textarea><label>Required output format</label><input value="${esc(x.format)}" oninput="j().format=this.value;save()"><label>Deadline / temporal scope</label><input value="${esc(x.deadline)}" oninput="j().deadline=this.value;save()"><label>Known authoritative sources</label><textarea oninput="j().authorities=this.value;save()">${esc(x.authorities)}</textarea><label>Available tools/access</label><textarea oninput="j().tools=this.value;save()">${esc(x.tools)}</textarea><label>Prohibited actions</label><textarea oninput="j().prohibited=this.value;save()">${esc(x.prohibited)}</textarea><label>Known unknown information</label><textarea oninput="j().unknowns=this.value;save()">${esc(x.unknowns)}</textarea><button onclick=flow()>Done</button></div>`}
function flow(){if(!j())return jobs();let x=j();A.innerHTML=STAGES.map((d,i)=>`<div class=stage onclick=stage(${d.n})><b>${String(d.n).padStart(2,'0')}. ${d.name}</b><br><small>${esc(d.deliverable)}</small><br><span class=pill>${x.st[i].status}</span></div>`).join('')}
function sel(a,v,act){return'<select onchange="'+act+'">'+a.map(z=>`<option ${z==v?'selected':''}>${z}</option>`).join('')+'</select>'}
function stage(n){let x=j(),s=x.st[n-1],d=STAGES[n-1];A.innerHTML=`<button class=s onclick=flow()>← Workflow</button><h2>${n}. ${d.name}</h2><div class="c good"><b>CURRENT STAGE DELIVERABLE</b><p>${esc(d.deliverable)}</p><small>The final job deliverable is not produced until Stage 21.</small></div><div class=c><label>Status</label>${sel(E.stage,s.status,`j().st[${n-1}].status=this.value;save()`)}<label>Agent/chat ID</label><input value="${esc(s.agent)}" oninput="j().st[${n-1}].agent=this.value;save()">${s.ids?'<pre>'+esc(s.ids)+'</pre>':''}<label>Prior handoff/input</label><textarea oninput="j().st[${n-1}].input=this.value;save()">${esc(s.input)}</textarea><button onclick="copy(promptFor(${n}))">Copy Stage ${n} Agent Prompt</button></div><div class=c><small>Required output fields</small><pre>${d.fields.join('\n')}</pre><label>Paste complete agent result</label><textarea oninput="j().st[${n-1}].result=this.value;save()">${esc(s.result)}</textarea><button onclick=process(${n})>Process Result</button></div><div class=c><label>Next-stage handoff</label><textarea oninput="j().st[${n-1}].handoff=this.value;save()">${esc(s.handoff)}</textarea><button onclick="copy(j().st[${n-1}].handoff)">Copy Handoff</button></div>`}
function process(n){let x=j(),s=x.st[n-1],u=s.result.toUpperCase();if(u.includes('STAGE_STATUS: COMPLETE'))s.status='COMPLETE';else if(u.includes('STAGE_STATUS: BLOCKED'))s.status='BLOCKED';else if(u.includes('STAGE_STATUS: FAILED'))s.status='FAILED';let m=/NEXT_STAGE_HANDOFF_BLOCK\s*:\s*([\s\S]*)/i.exec(s.result);if(m){s.handoff=m[1].trim();if(n<30)x.st[n].input=s.handoff}if(s.status=='COMPLETE')x.current=Math.min(30,Math.max(x.current,n+1));save();stage(n)}
function promptFor(n){let x=j(),s=x.st[n-1],d=STAGES[n-1];return`CLOSED-LOOP AGENT RELIABILITY WORKFLOW\n\nJOB_ID: ${x.id}\nSTAGE_ID: STAGE-${String(n).padStart(2,'0')}\nSTAGE_NAME: ${d.name}\n\nFINAL JOB CONTEXT — REFERENCE ONLY, NOT THIS STAGE'S DELIVERABLE\nFinal objective:\n${x.objective}\n\nFinal requested deliverable:\n${x.deliverable}\n\nFinal-job constraints:\n${x.constraints||'NONE RECORDED'}\n\nIMPORTANT: Do not generate the final requested deliverable in this stage unless this is Stage 21. The final job context tells you what the whole workflow is serving; it does not change the current stage deliverable.\n\nCURRENT STAGE OBJECTIVE\n${d.objective}\n\nCURRENT STAGE DELIVERABLE\n${d.deliverable}\n\nREQUIRED INPUTS FOR THIS STAGE\n${d.inputs.map(v=>'- '+v).join('\n')}\n\nSUPPLIED PRIOR HANDOFF / STAGE INPUT\n${s.input|| (n==1 ? `No prior handoff. Use the job intake exactly as supplied.\nSUPPLIED MATERIALS: ${x.materials||'NONE RECORDED'}\nREQUIRED OUTPUT FORMAT: ${x.format||'UNSPECIFIED'}\nDEADLINE/TEMPORAL SCOPE: ${x.deadline||'NONE'}\nKNOWN AUTHORITIES: ${x.authorities||'NONE RECORDED'}\nAVAILABLE TOOLS: ${x.tools||'NONE RECORDED'}\nPROHIBITED ACTIONS: ${x.prohibited||'NONE RECORDED'}\nKNOWN UNKNOWNS: ${x.unknowns||'NONE RECORDED'}` : 'ERROR: NO PRIOR HANDOFF SUPPLIED. If the required prior-stage evidence is unavailable, return BLOCKED rather than inventing it.')}\n\nTHIS STAGE MUST NOT\n${d.mustNot.map(v=>'- '+v).join('\n')}\n\nGENERAL OPERATING RULES\n- Perform all AI-capable work required by THIS STAGE yourself. Do not push research, analysis, drafting, testing, verification, comparison, calculation, hashing, or root-cause work to the human when you can perform it.\n- Do not invent facts. UNKNOWN remains UNKNOWN.\n- A mandatory UNKNOWN that prevents this stage's completion is BLOCKED.\n- Use deterministic verification when the property is deterministically testable.\n- Preserve exact evidence and version identity.\n- Do not silently resolve authoritative conflicts.\n- Do not allow a generating agent to be its sole validator where independent validation is required.\n\nAPP-GENERATED IDS\n${s.ids||'NONE REQUIRED FOR THIS STAGE'}\n\nREQUIRED OUTPUT RECORD\n${d.fields.map(f=>f+':').join('\n')}\n\nCOMPLETION GATE\n${d.gate}\n\nBLOCKER RECORD — OUTPUT ONLY IF THIS STAGE IS BLOCKED\nBLOCKER_ID:\nMANDATORY_ITEM_BLOCKED:\nWHY_NECESSARY_FOR_THIS_STAGE:\nWHY_YOU_CANNOT_ESTABLISH_IT:\nSOURCES_TOOLS_OR_EVIDENCE_ALREADY_CHECKED:\nMINIMUM_HUMAN_FACT_DECISION_OR_ACTION_REQUIRED:\nEFFECT_IF_UNRESOLVED:\n\nSTAGE COMPLETION RECORD\nSTAGE_STATUS: COMPLETE | BLOCKED | FAILED\nSTAGE_OUTPUT_VERSION:\nINPUT_VERSIONS_USED:\nARTIFACTS_CREATED_OR_UPDATED:\nEVIDENCE_CREATED:\nTESTS_OR_CHECKS_PERFORMED:\nUNRESOLVED_UNKNOWNS:\nDEFECT_IDS_CREATED:\nNEXT_STAGE_AUTHORIZED: TRUE | FALSE\nNEXT_STAGE_HANDOFF_BLOCK:\n[Return one self-contained exact handoff containing only what the next stage requires. Do not treat the final requested deliverable as the next-stage handoff unless the workflow has reached the appropriate production stage.]`}
function regs(){if(!j())return jobs();let x=j();A.innerHTML=['sources','requirements','tests','runs','defects','artifacts','blockers'].map(k=>`<div class=c><b>${k.toUpperCase()}</b> — ${(x[k]||[]).length}<br><button onclick="add('${k}')">Add generated ID</button><pre>${(x[k]||[]).map(v=>v.id).join('\n')}</pre></div>`).join('')}
function add(k){let p={sources:'SRC',requirements:'REQ',tests:'TEST',runs:'RUN',defects:'DEFECT',artifacts:'ART',blockers:'BLOCK'}[k];j()[k].push({id:uid(p)});save();regs()}
function backup(){A.innerHTML='<div class=c><button onclick=exportJ()>Export JSON</button><p><small>This build stores job data locally on this device/browser.</small></p></div>'}function exportJ(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='closed-loop-backup.json';a.click()}hdr();jobs();
</script></body></html>
