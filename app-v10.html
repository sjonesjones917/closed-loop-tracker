<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Closed-Loop Reliability v10</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d31;--line:#2d4668;--text:#f5f7fb;--muted:#a8b7cd;--accent:#69b7ff;--good:#8fe0a6;--bad:#ffaaaa}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.wrap{width:100%;max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 10px calc(env(safe-area-inset-bottom) + 24px)}h1,h2,h3{overflow-wrap:anywhere}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin:4px 0 12px}.status{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#0a1728;overflow-wrap:anywhere}
.nav{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:6px 0;background:var(--bg)}.btn{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#152640;color:var(--text);font-weight:750;white-space:normal;overflow-wrap:anywhere}.btn.primary{background:#1d5b92}.btn.good{background:#21442d}.btn.danger{background:#3d2028}.btn:disabled{opacity:.45}.nav .btn{font-size:11px;padding:7px 2px}.nav .active{outline:2px solid var(--accent)}
.card{width:100%;min-width:0;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:12px;margin:10px 0;overflow:hidden}.grid{display:grid;gap:8px}.actions{display:grid;grid-template-columns:1fr;gap:7px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:800;color:#d1dbeb}.field input,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:#081525;color:var(--text);padding:10px}.field textarea{min-height:130px;resize:vertical}pre{width:100%;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:420px;overflow:auto;background:#07111f;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}
.hidden{display:none!important}.muted{color:var(--muted)}.error{color:var(--bad);white-space:pre-wrap}.success{color:var(--good);white-space:pre-wrap}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;max-width:100%;overflow-wrap:anywhere}.progress{height:8px;background:#21324a;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.stageGrid{display:grid;grid-template-columns:1fr;gap:6px;max-height:420px;overflow:auto}.stageBtn{width:100%;text-align:left;border:1px solid var(--line);background:#0b1728;color:var(--text);border-radius:10px;padding:9px;overflow-wrap:anywhere}.stageBtn.active{outline:2px solid var(--accent)}.stageBtn.complete{border-color:#3d7550}.row{display:grid;grid-template-columns:1fr;gap:8px}.kv{display:grid;grid-template-columns:1fr;gap:4px;font-size:13px}
@media(min-width:620px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.stageGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr auto;align-items:start}.kv{grid-template-columns:190px 1fr}}
</style>
</head>
<body><main class="wrap">
<h1>Closed-Loop Agent Reliability v10</h1><div class="sub">31 operations. Phone-first. Local project state. No perpetual loading state.</div>
<div id="status" class="status">Ready.</div>
<div class="nav"><button class="btn active" data-view="projects">Projects</button><button class="btn" data-view="workflow">Workflow</button><button class="btn" data-view="evidence">Evidence</button><button class="btn" data-view="release">Release</button></div>
<section id="projectsView"><div class="actions"><button id="newBtn" class="btn primary">New project</button><button id="testBtn" class="btn good">Create real E2E job</button></div><div id="newCard" class="card hidden"><h2>New project</h2><div class="field"><label>Project name *</label><input id="name"></div><div class="field"><label>Exact user objective *</label><textarea id="objective"></textarea></div><div class="field"><label>Exact deliverable requested *</label><textarea id="deliverable"></textarea></div><div class="field"><label>Supplied files / messages / links / data</label><textarea id="inputs"></textarea></div><div class="field"><label>Constraints / prohibited actions</label><textarea id="constraints"></textarea></div><div class="field"><label>Required output format</label><input id="format" value="UNSPECIFIED"></div><div class="field"><label>Deadline / temporal scope</label><input id="deadline" value="NONE SUPPLIED"></div><div class="actions"><button id="createBtn" class="btn primary">Create</button><button id="cancelBtn" class="btn">Cancel</button></div><div id="newErr" class="error"></div></div><div id="projects"></div></section>
<section id="workflowView" class="hidden"><div id="workflowEmpty" class="card">Select or create a project first.</div><div id="workflow" class="hidden"><div class="card"><div class="row"><div><h2 id="pTitle" style="margin:0"></h2><div id="pIds" class="muted"></div></div><span id="pct" class="pill"></span></div><div class="progress"><i id="bar"></i></div></div><div class="card"><h3>Workflow</h3><div id="stageGrid" class="stageGrid"></div></div><div class="card"><div class="row"><h2 id="stageTitle" style="margin:0"></h2><span id="stageState" class="pill"></span></div><p id="stageInstruction" class="muted"></p><div class="field"><label>Exact prompt to send to the agent</label><pre id="prompt"></pre></div><button id="copyBtn" class="btn">Copy prompt</button><div class="field"><label>Agent response — REQUIRED</label><textarea id="response" placeholder="Paste the agent's completed stage result here. The app will not complete the stage without it."></textarea></div><div class="field"><label>Evidence / notes</label><textarea id="notes"></textarea></div><div class="actions"><button id="completeBtn" class="btn primary">Validate + complete</button><button id="draftBtn" class="btn">Save draft</button></div><div id="stageMsg" class="error"></div></div></div></section>
<section id="evidenceView" class="hidden"><div id="evidence" class="card"></div></section>
<section id="releaseView" class="hidden"><div id="release" class="card"></div></section>
</main><script src="app-core.js"></script><script>
(function(){'use strict';const C=window.ClosedLoopCore,$=id=>document.getElementById(id);if(!C){$('status').textContent='ERROR: app-core.js failed to load.';return}const KEY='closedLoopReliability.projects.v10',SEL='closedLoopReliability.selected.v10';let projects=[],selected=null,stageNo=1,view='projects';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(m,bad=false){$('status').textContent=m;$('status').style.borderColor=bad?'#8b4f5a':'#3d7550'}function load(){try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(projects))projects=[];selected=localStorage.getItem(SEL)||null;if(selected&&!projects.some(p=>p.projectId===selected))selected=null;status(`Ready. ${projects.length} project${projects.length===1?'':'s'} on this device.`)}catch(e){projects=[];selected=null;status(`Storage error: ${e.message}`,true)}}function save(){localStorage.setItem(KEY,JSON.stringify(projects));selected?localStorage.setItem(SEL,selected):localStorage.removeItem(SEL)}function cur(){return projects.find(p=>p.projectId===selected)||null}function next(p){const i=p.stages.findIndex(s=>s.status!=='COMPLETE');return i<0?31:i+1}
function show(name){view=name;['projects','workflow','evidence','release'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==name));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));render()}
function renderProjects(){const el=$('projects');if(!projects.length){el.innerHTML='<div class="card"><h3>No projects</h3><p class="muted">Create one. A project does not advance until an agent response is pasted and validated for each operation.</p></div>';return}el.innerHTML=projects.map(p=>`<div class="card"><div class="row"><div><h3 style="margin:0">${esc(p.name)}</h3><div class="muted">${esc(p.jobId)} · ${C.completionPercent(p)}%</div></div><span class="pill">${esc(p.releaseState)}</span></div><p>${esc(p.objective)}</p><div class="actions"><button class="btn primary" data-open="${p.projectId}">Open workflow</button><button class="btn danger" data-del="${p.projectId}">Delete</button></div></div>`).join('');el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;stageNo=next(cur());save();show('workflow')});el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this project?'))return;projects=projects.filter(p=>p.projectId!==b.dataset.del);if(selected===b.dataset.del)selected=null;save();render()})}
function stageSemanticGate(p,n,text){const t=text.toLowerCase();if(n===1){for(const [label,val] of [['JOB_ID',p.jobId],['exact objective',p.objective],['exact deliverable',p.deliverable]]){const sample=String(val).trim().slice(0,48).toLowerCase();if(sample.length>=8&&!t.includes(sample))throw new Error(`Stage 1 is not tied to this real project: missing ${label} content.`)}if(!/input-v001/i.test(text))throw new Error('Stage 1 must create INPUT-v001.')}if(n===2&&p.suppliedInputs){const sample=p.suppliedInputs.trim().slice(0,32).toLowerCase();if(sample.length>=8&&!t.includes(sample))throw new Error('Stage 2 source inventory does not reference the supplied project inputs.')}return true}
function renderWorkflow(){const p=cur();$('workflowEmpty').classList.toggle('hidden',!!p);$('workflow').classList.toggle('hidden',!p);if(!p)return;$('pTitle').textContent=p.name;$('pIds').textContent=`${p.projectId} · ${p.jobId}`;const pc=C.completionPercent(p);$('pct').textContent=`${pc}% complete`;$('bar').style.width=pc+'%';$('stageGrid').innerHTML=C.STAGES.map((d,i)=>{const s=p.stages[i];return `<button class="stageBtn ${s.status==='COMPLETE'?'complete':''} ${stageNo===i+1?'active':''}" data-stage="${i+1}"><b>${i+1}. ${esc(d.name)}</b><br><span class="muted">${esc(s.status)}</span></button>`}).join('');$('stageGrid').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stageNo=Number(b.dataset.stage);renderStage()});renderStage()}
function renderStage(){const p=cur();if(!p)return;const d=C.STAGES[stageNo-1],s=p.stages[stageNo-1];$('stageTitle').textContent=`${stageNo}. ${d.name}`;$('stageState').textContent=s.status;$('stageInstruction').textContent=d.instruction;$('response').value=s.agentResponse||'';$('notes').value=s.evidence||'';$('stageMsg').textContent='';try{$('prompt').textContent=C.buildPrompt(p,stageNo);$('completeBtn').disabled=false;$('draftBtn').disabled=false;$('copyBtn').disabled=false}catch(e){$('prompt').textContent='LOCKED: '+e.message;$('completeBtn').disabled=true;$('draftBtn').disabled=true;$('copyBtn').disabled=true;$('stageMsg').textContent=e.message}}
function renderEvidence(){const p=cur();$('evidence').innerHTML=p?`<h2>Evidence</h2>${p.stages.map((s,i)=>`<details><summary>${i+1}. ${esc(C.STAGES[i].name)} — ${esc(s.status)}</summary><pre>${esc(s.agentResponse||'No response')}</pre><p>${esc(s.evidence||'No notes')}</p></details>`).join('')}`:'Select a project.'}
async function renderRelease(){const p=cur();if(!p){$('release').textContent='Select a project.';return}const hash=p.finalArtifact?await C.artifactHash(p):'';const allowed=await C.canRelease(p);$('release').innerHTML=`<h2>Artifact / Release</h2><div class="kv"><b>Stages</b><span>${p.stages.filter(s=>s.status==='COMPLETE').length}/31</span><b>Decision</b><span>${esc(p.releaseState)}</span><b>Actual SHA-256</b><span>${esc(hash||'No artifact')}</span><b>Audited hash</b><span>${esc(p.auditedHash||'Not recorded')}</span><b>Release hash</b><span>${esc(p.releaseHash||'Not recorded')}</span><b>Release gate</b><span>${allowed?'PASS':'BLOCKED'}</span></div><div class="field"><label>Exact finished artifact</label><textarea id="artifact">${esc(p.finalArtifact||'')}</textarea></div><div class="actions"><button class="btn primary" id="saveArtifact">Save + hash</button><button class="btn good" id="downloadArtifact">Release exact accepted artifact</button></div><div id="releaseMsg"></div>`;$('saveArtifact').onclick=async()=>{const h=await C.setFinalArtifact(p,$('artifact').value);save();status('Artifact saved. SHA-256 '+h);await renderRelease()};$('downloadArtifact').onclick=async()=>{p.finalArtifact=$('artifact').value;save();if(!(await C.canRelease(p))){$('releaseMsg').className='error';$('releaseMsg').textContent='BLOCKED: all 31 stages, ACCEPTED decision, non-empty artifact, and exact hash equality are required.';return}const blob=new Blob([p.finalArtifact],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='released-artifact.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),300)}}
function render(){renderProjects();renderWorkflow();renderEvidence();renderRelease()}
$('newBtn').onclick=()=>$('newCard').classList.remove('hidden');$('cancelBtn').onclick=()=>$('newCard').classList.add('hidden');$('createBtn').onclick=()=>{try{const p=C.createProject({name:$('name').value,objective:$('objective').value,deliverable:$('deliverable').value,suppliedInputs:$('inputs').value,constraints:$('constraints').value,outputFormat:$('format').value,deadline:$('deadline').value});projects.unshift(p);selected=p.projectId;stageNo=1;save();$('newCard').classList.add('hidden');show('workflow')}catch(e){$('newErr').textContent=e.message}};$('testBtn').onclick=()=>{const p=C.makeRealTestProject();projects.unshift(p);selected=p.projectId;stageNo=1;save();status('Real E2E job created at 0/31. No stage is pre-completed.');show('workflow')};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);status('Prompt copied.')}catch(e){status('Clipboard failed: '+e.message,true)}};$('draftBtn').onclick=()=>{const p=cur();try{C.saveStageDraft(p,stageNo,$('response').value,$('notes').value);save();render();status('Draft saved; stage remains incomplete.')}catch(e){status(e.message,true)}};$('completeBtn').onclick=()=>{const p=cur();try{stageSemanticGate(p,stageNo,$('response').value);C.completeStage(p,stageNo,$('response').value,$('notes').value);save();stageNo=next(p);render();status(`Stage completed. ${p.stages.filter(s=>s.status==='COMPLETE').length}/31 complete.`)}catch(e){$('stageMsg').textContent=e.message;status('Stage not completed: '+e.message,true)}};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));load();render()})();
</script></body></html>
