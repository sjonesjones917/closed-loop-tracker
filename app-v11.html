<body><main class="wrap">
<h1>Closed-Loop Agent Reliability v11</h1><div class="sub">31 sequential operations · phone-first · every completion requires an actual pasted result · no seeded completed project</div>
<div id="status" class="status">Ready.</div>

<section id="projectsView"><div class="actions"><button id="newBtn" class="btn primary">New project</button><label class="btn fileLabel">Import project JSON<input id="importFile" type="file" accept="application/json,.json"></label><button id="loadVerifiedBtn" class="btn">Load verified E2E export</button></div><div id="newCard" class="card hidden"><h2>New project</h2><div class="field"><label>Project name *</label><input id="name"></div><div class="field"><label>Exact user objective *</label><textarea id="objective"></textarea></div><div class="field"><label>Exact deliverable requested *</label><textarea id="deliverable"></textarea></div><div class="field"><label>Supplied files / messages / links / data</label><textarea id="inputs"></textarea></div><div class="field"><label>Constraints / prohibited actions</label><textarea id="constraints"></textarea></div><div class="field"><label>Required output format</label><input id="format" value="UNSPECIFIED"></div><div class="field"><label>Deadline / temporal scope</label><input id="deadline" value="NONE SUPPLIED"></div><div class="actions"><button id="createBtn" class="btn primary">Create project</button><button id="cancelBtn" class="btn">Cancel</button></div><div id="newErr" class="error"></div></div><div id="projects"></div></section>

</main><script>
(()=>{'use strict';
const STAGES=[
['DEFINE JOB','Read the original request and supplied inputs. Create the authoritative JOB RECORD and INPUT-v001 now. Preserve the exact objective and requested deliverable; inventory inputs, constraints, format, deadline, sources, tools, prohibited actions, explicit requirements, assumptions, and unknowns. Do not research or draft the final deliverable.'],
['INVENTORY SOURCES','Inspect the actual supplied sources and build the complete source inventory now. Record SOURCE_ID, description, type, origin, version/date, authority, SOURCE_ROLE, relevant portions, conflicts, and blockers. Use current authoritative research only when the job requires it.'],
['RESEARCH REQUIREMENTS','Read the controlling sources and extract every obligation, restriction, exception, dependency, applicability condition, format condition, numerical condition, and explicit user requirement now. Cite exact evidence and repeat until no new material category is found.'],
['COMPILE ATOMIC REQUIREMENTS','Compile one independently testable REQ record per obligation now. Split compound obligations. Record source, applicability, dependency, verification method, affirmative evidence, and failure condition for every requirement.'],
['RESOLVE CONFLICTS','Resolve duplicates, contradictions, impossible combinations, undefined terms, circular dependencies, missing prerequisites, uncertain applicability, and unverifiable requirements now. Apply authority hierarchy; unresolved mandatory conflicts are BLOCKED.'],
['BUILD ACCEPTANCE TESTS','Create the acceptance suite now. Every mandatory REQ_ID must have a test with procedure, inputs, expected result, evidence, verification method, and failure condition. Demonstrate 100% mandatory requirement coverage or BLOCK.'],
['BUILD FAILURE/MUTATION TESTS','Construct and execute violating fixtures now. Mutate each constructible requirement, run its validator, record detection/rejection evidence, and treat any validator that accepts an invalid fixture as defective.'],
['AUTHOR PRODUCTION INSTRUCTION','Author the complete production instruction now from the approved requirements and tests. Include exact objective, governing inputs, scope, ordered procedure, decision rules, tool rules, output contract, failure behavior, truth semantics, and completion criteria.'],
['PREFLIGHT INSTRUCTION','Preflight the production instruction now without doing final production. Find ambiguity, missing inputs, contradictions, unavailable capabilities, unverifiable commands, unclear order/failure behavior, missing traceability, and semantic loopholes; correct confirmed defects.'],
['FREEZE CANDIDATE','Freeze the exact inputs, sources, requirements, tests, production instruction, and tool configuration now as immutable CANDIDATE-vN. Record identities and hashes where practical.'],
['RUN 10 INDEPENDENT EXECUTIONS','Perform ten actual independent executions now against the frozen candidate. Each run must be produced in a fresh context and must not see another run output.'],
['VERIFY EVERY RUN AGAINST EVERY REQUIREMENT','Independently verify each of the ten run outputs against every mandatory requirement now. Record SATISFIED, VIOLATED, or UNDETERMINED with requirement/test evidence for each run.'],
['COMPARE ALL RUNS','Compare all independently verified runs requirement-by-requirement now. Identify correctness-affecting variance, inconsistent interpretations, inconclusive tests, repeated failures, and unique failures.'],
['ROOT-CAUSE EVERY DEFECT','Root-cause every confirmed material defect now to the earliest responsible layer and identify every dependent artifact invalidated by that defect.'],
['ADD REGRESSION TESTS','Create a permanent regression test for every confirmed defect now. Preserve a reproducer, prove it fails on the defective version, and define the expected corrected result.'],
['CORRECT RESPONSIBLE LAYER','Apply corrections at the earliest defective layer now, version changed artifacts, regenerate dependents, and run every new regression test.'],
['FREEZE NEW VERSION','Freeze the corrected candidate now under a new immutable CANDIDATE-vN with exact component versions and hashes.'],
['RUN 10 NEW INDEPENDENT EXECUTIONS','Perform a fresh batch of ten independent executions now against the new frozen candidate. No output may reuse or see a prior run.'],
['REPEAT UNTIL CONVERGED','Independently verify the fresh batch and execute the defect/correction loop until mandatory requirement coverage and verification coverage are 100%, regressions are 100%, and critical defects, major defects, mandatory unknowns, correctness contradictions, ambiguities, and unexplained variance are all zero.'],
['RUN UNCHANGED 10-EXECUTION CONFIRMATION','Change nothing. Perform ten fresh independent confirmation executions against the exact converged candidate, independently verify every run against every mandatory requirement, and compare the batch. Any new material defect fails confirmation.'],
['FREEZE APPROVED BASELINE','Freeze the approved input, source, requirement, instruction, test, validator/tool configuration, convergence evidence, and unchanged confirmation evidence now under one BASELINE_ID.'],
['GENERATE FINISHED PRODUCT','Generate the actual requested finished product now in a fresh production context using only approved baseline materials. Return the real deliverable, its identity, and manifest. Include the exact deliverable after a line reading FINAL_ARTIFACT:.'],
['DETERMINISTIC PRODUCT VERIFICATION','Run every applicable deterministic validator against the actual finished artifact now: arithmetic, counts, schemas, filenames, hashes, structure, identifiers, references, package contents, required/prohibited text, and formatting dimensions where applicable.'],
['INDEPENDENT SEMANTIC VERIFICATION','Use an independent evaluator context to verify every semantic requirement against the actual product now. Record product location, source evidence, required meaning, observed meaning, and SATISFIED/VIOLATED/UNDETERMINED.'],
['ADVERSARIAL PRODUCT VERIFICATION','Attempt to disprove the actual product now. Search for missing/prohibited content, contradictions, impossible logic, unsupported facts, wrong versions, broken references, hidden assumptions, semantic nonsense, malformed files, and partial completion.'],
['FINAL REPRESENTATION INSPECTION','Inspect the exact bytes and rendered representation that will be delivered now. Check clipping, off-frame or missing content, blank pages, broken tables/graphics, corruption, filenames, package inventory, versions, and conversion defects.'],
['PROCESS AUDIT','Independently audit the complete process now: approved inputs, frozen instruction, tool configuration, test suites, execution isolation, version transitions, defect/regression evidence, unauthorized modifications, and end-to-end traceability.'],
['PRODUCT AUDIT','Independently audit the finished product now. Confirm affirmative evidence for every mandatory requirement and validator and confirm no unresolved critical or major defect remains.'],
['ACCEPTED / REJECTED / BLOCKED','Assign exactly one RELEASE_DECISION now. ACCEPTED only if every mandatory requirement has affirmative evidence and every mandatory validator passed; REJECTED for demonstrated mandatory violation; BLOCKED for unestablished mandatory requirement.'],
['VERIFY RELEASE HASH','Hash the exact audited artifact bytes and the exact proposed release bytes now. Return AUDITED_HASH and RELEASE_HASH. They must be identical and must equal the app-computed artifact hash.'],
['RELEASE ONLY THE EXACT ACCEPTED ARTIFACT','Release only the exact accepted artifact now. Return PRODUCT_ID, RELEASE_DECISION, AUDITED_HASH, RELEASE_HASH, artifact identity, and traceability reference; the released bytes must be byte-identical to the audited bytes.']];
const KEY='closedLoopReliability.projects.v11',SEL='closedLoopReliability.selected.v11';let projects=[],selected=null,stageNo=1,view='projects';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function now(){return new Date().toISOString()}function id(prefix){return prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}function newStage(i){return{number:i+1,status:'NOT_STARTED',response:'',notes:'',completedAt:null,producers:Array(10).fill(''),verifiers:Array(10).fill('')}}function createProject(v){if(!v.name.trim()||!v.objective.trim()||!v.deliverable.trim())throw Error('Project name, exact objective, and exact deliverable are required.');return{schemaVersion:11,projectId:id('PROJECT'),jobId:id('JOB'),name:v.name.trim(),objective:v.objective.trim(),deliverable:v.deliverable.trim(),inputs:(v.inputs||'').trim(),constraints:(v.constraints||'').trim(),format:(v.format||'UNSPECIFIED').trim(),deadline:(v.deadline||'NONE SUPPLIED').trim(),createdAt:now(),updatedAt:now(),stages:STAGES.map((_,i)=>newStage(i)),artifact:'',artifactName:'released-artifact.txt',releaseDecision:'UNSET',auditedHash:'',releaseHash:''}}
let storageOK=true;function load(){try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(projects))projects=[];selected=localStorage.getItem(SEL)||null;if(selected&&!projects.some(p=>p.projectId===selected))selected=null;setStatus(`Ready. ${projects.length} project${projects.length===1?'':'s'} stored on this browser.`)}catch(e){storageOK=false;projects=[];selected=null;setStatus('Persistent storage is unavailable in this browser context. The app remains usable, but export the project before closing.',true)}}function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(projects));selected?localStorage.setItem(SEL,selected):localStorage.removeItem(SEL)}catch(e){storageOK=false;setStatus('Persistent storage failed. Export the project before closing.',true)}}function cur(){return projects.find(p=>p.projectId===selected)||null}function setStatus(m,bad=false){$('status').textContent=m;$('status').style.borderColor=bad?'#8b4f5a':'#3d7550'}function nextStage(p){const i=p.stages.findIndex(s=>s.status!=='COMPLETE');return i<0?31:i+1}function completeCount(p){return p.stages.filter(s=>s.status==='COMPLETE').length}function gate(p,n){if(n>1&&p.stages[n-2].status!=='COMPLETE')throw Error(`Stage ${n-1} must be COMPLETE before Stage ${n}. No bypass is available.`)}
function prior(p,n){if(n===1)return'NONE';const s=p.stages[n-2];return`STAGE ${n-1} — ${STAGES[n-2][0]}\n${s.response||batchDigest(s)}`}
function batchDigest(s){let x=[];s.producers.forEach((v,i)=>{if(v)x.push(`RUN-${String(i+1).padStart(3,'0')} PRODUCER:\n${v}`)});s.verifiers.forEach((v,i)=>{if(v)x.push(`RUN-${String(i+1).padStart(3,'0')} VERIFIER:\n${v}`)});return x.join('\n\n')}
function prompt(p,n){gate(p,n);return`CLOSED-LOOP AGENT RELIABILITY WORKFLOW\n\nJOB_ID: ${p.jobId}\nPROJECT_ID: ${p.projectId}\nPROJECT: ${p.name}\n\nEXACT USER OBJECTIVE:\n${p.objective}\n\nEXACT DELIVERABLE REQUESTED:\n${p.deliverable}\n\nSUPPLIED FILES / MESSAGES / LINKS / DATA:\n${p.inputs||'NONE SUPPLIED'}\n\nCONSTRAINTS / PROHIBITED ACTIONS:\n${p.constraints||'NONE SUPPLIED'}\n\nREQUIRED OUTPUT FORMAT:\n${p.format}\n\nDEADLINE / TEMPORAL SCOPE:\n${p.deadline}\n\nSTAGE ${n} OF 31 — ${STAGES[n-1][0]}\n\nEXECUTE THIS STAGE NOW\n${STAGES[n-1][1]}\n\nRULES\n- Execute the operation; do not merely describe how.\n- Perform all AI-capable work available to you.\n- Use actual supplied files/tools/sources when required.\n- Do not invent missing facts. A mandatory unavailable fact is BLOCKED.\n- Do not perform a later stage.\n- Preserve exact evidence and identifiers.\n\nPRIOR COMPLETED HANDOFF\n${prior(p,n)}\n\nRETURN ONLY THE COMPLETED STAGE RESULT.`}
function runPrompt(p,n,i,role){gate(p,n);const rid=`RUN-${String(i+1).padStart(3,'0')}`;const base=prompt(p,n);return`${base}\n\n${role==='producer'?'INDEPENDENT EXECUTION':'INDEPENDENT VERIFICATION'} RECORD ${rid}\n${role==='producer'?`Execute ${rid} in a fresh context. Do not read or reuse any other run output. Return this run's complete actual output and evidence.`:`Verify ${rid} independently against every mandatory requirement and approved test. Return SATISFIED, VIOLATED, or UNDETERMINED for each requirement with affirmative evidence. Do not trust the producing run's conclusion.`}`}
function requireText(t,label,min=100){t=String(t||'').trim();if(t.length<min)throw Error(`${label} is required and must contain a substantive completed result (minimum ${min} characters).`);return t}function has(t,r,label){if(!r.test(t))throw Error(label)}function validateStandard(p,n,t){t=requireText(t,'Agent response');const U=t.toUpperCase();if(n===1){has(U,/JOB_ID/,'Stage 1 must contain JOB_ID.');has(U,/INPUT-V?001/,'Stage 1 must create INPUT-v001.');if(!U.includes(p.objective.slice(0,Math.min(24,p.objective.length)).toUpperCase()))throw Error('Stage 1 must preserve content from the real project objective.');if(!U.includes(p.deliverable.slice(0,Math.min(24,p.deliverable.length)).toUpperCase()))throw Error('Stage 1 must preserve content from the real requested deliverable.')}if(n===2){has(U,/SOURCE_ID/,'Stage 2 must contain SOURCE_ID.');has(U,/SOURCE_ROLE/,'Stage 2 must contain SOURCE_ROLE.')}if(n===4)has(U,/REQ-/,'Stage 4 must contain REQ identifiers.');if(n===6){has(U,/TEST-/,'Stage 6 must contain TEST identifiers.');has(U,/100%/,'Stage 6 must establish 100% mandatory test coverage.')}if(n===8)has(U,/INSTRUCTION-V/,'Stage 8 must create an INSTRUCTION version.');if(n===10||n===17)has(U,/CANDIDATE-V/,'This freeze stage must identify CANDIDATE-vN.');if(n===21)has(U,/BASELINE[_ -]?ID/,'Stage 21 must identify BASELINE_ID.');if(n===22)has(t,/FINAL_ARTIFACT\s*:/i,'Stage 22 must include the exact finished deliverable after FINAL_ARTIFACT:.');if(n===29)has(U,/RELEASE_DECISION\s*[:=]\s*(ACCEPTED|REJECTED|BLOCKED)/,'Stage 29 must contain RELEASE_DECISION: ACCEPTED, REJECTED, or BLOCKED.');return t}
function validateRun(v,i,kind){v=requireText(v,`${kind} ${i+1}`,80);const rid=`RUN-${String(i+1).padStart(3,'0')}`;if(!v.toUpperCase().includes(rid))throw Error(`${kind} ${i+1} must identify ${rid}.`);if(kind==='Verifier'&&!/(SATISFIED|VIOLATED|UNDETERMINED)/i.test(v))throw Error(`${kind} ${i+1} must report SATISFIED, VIOLATED, or UNDETERMINED.`);return v}
async function sha256(t){const b=new TextEncoder().encode(String(t||'')),d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function canRelease(p){return completeCount(p)===31&&p.releaseDecision==='ACCEPTED'&&!!p.artifact&&!!p.auditedHash&&p.auditedHash===p.releaseHash&&(await sha256(p.artifact))===p.auditedHash}
function invalidate(p,n){for(let i=n;i<31;i++)p.stages[i]=newStage(i);p.releaseDecision='UNSET';p.auditedHash='';p.releaseHash=''}
function completeStandard(p,n,t,notes){gate(p,n);const s=p.stages[n-1],old=s.response;t=validateStandard(p,n,t);if(s.status==='COMPLETE'&&old!==t)invalidate(p,n);s.response=t;s.notes=String(notes||'').trim();s.status='COMPLETE';s.completedAt=now();p.updatedAt=s.completedAt;if(n===22){const m=t.match(/FINAL_ARTIFACT\s*:\s*([\s\S]*)$/i);p.artifact=(m?m[1]:'').replace(/^\n/,'');if(!p.artifact)throw Error('Stage 22 FINAL_ARTIFACT is empty.')}if(n===29){p.releaseDecision=(t.match(/RELEASE_DECISION\s*[:=]\s*(ACCEPTED|REJECTED|BLOCKED)/i)||[])[1].toUpperCase()}save()}
async function complete30(p,t,notes){gate(p,30);t=validateStandard(p,30,t);if(!p.artifact)throw Error('No finished artifact exists. Complete Stage 22 first.');const h=await sha256(p.artifact),a=(t.match(/AUDITED_HASH\s*[:=]\s*([a-f0-9]{64})/i)||[])[1],r=(t.match(/RELEASE_HASH\s*[:=]\s*([a-f0-9]{64})/i)||[])[1];if(!a||!r)throw Error('Stage 30 must contain 64-hex AUDITED_HASH and RELEASE_HASH.');if(a.toLowerCase()!==h||r.toLowerCase()!==h)throw Error(`Stage 30 hashes must equal the actual artifact SHA-256: ${h}`);p.auditedHash=h;p.releaseHash=h;const s=p.stages[29];s.response=t;s.notes=notes||'';s.status='COMPLETE';s.completedAt=now();save()}
function completeProducerBatch(p,n,vals){gate(p,n);const s=p.stages[n-1];s.producers=vals.map((v,i)=>validateRun(v,i,'Producer'));s.response=`10 independent producer executions captured for Stage ${n}.`;s.status='COMPLETE';s.completedAt=now();save()}
function completeVerifierBatch(p,n,vals,summary=''){gate(p,n);const s=p.stages[n-1];s.verifiers=vals.map((v,i)=>validateRun(v,i,'Verifier'));if(n===19){summary=requireText(summary,'Convergence ledger',120);if(!/100%/.test(summary)||!/CRITICAL[^\n]*0/i.test(summary)||!/MAJOR[^\n]*0/i.test(summary)||!/CANDIDATE-V/i.test(summary))throw Error('Stage 19 convergence ledger must establish 100% coverage, zero critical/major defects, and the converged CANDIDATE-vN.');s.response=summary}else{s.response=`10 independent verifier records captured for Stage ${n}.`}s.status='COMPLETE';s.completedAt=now();save()}
function completeConfirmation(p,producers,verifiers,summary){gate(p,20);const s=p.stages[19];s.producers=producers.map((v,i)=>validateRun(v,i,'Producer'));s.verifiers=verifiers.map((v,i)=>validateRun(v,i,'Verifier'));summary=requireText(summary,'Confirmation summary',120);if(!/UNCHANGED/i.test(summary)||!/CONFIRM/i.test(summary)||!/CANDIDATE-V/i.test(summary))throw Error('Stage 20 summary must identify unchanged confirmation and the exact CANDIDATE-vN.');s.response=summary;s.status='COMPLETE';s.completedAt=now();save()}
function show(v){view=v;['projects','workflow','evidence','release'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function renderProjects(){const el=$('projects');if(!projects.length){el.innerHTML='<div class="card"><h3>No projects</h3><p class="muted">Create a real project or import a verified browser-run export. Nothing is pre-completed.</p></div>';return}el.innerHTML=projects.map(p=>`<div class="card"><div class="row"><div><h3 style="margin:0">${esc(p.name)}</h3><div class="muted">${esc(p.jobId)} · ${completeCount(p)}/31</div></div><span class="pill">${esc(p.releaseDecision)}</span></div><p>${esc(p.objective)}</p><div class="actions"><button class="btn primary" data-open="${p.projectId}">Open workflow</button><button class="btn danger" data-del="${p.projectId}">Delete</button></div></div>`).join('');el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;stageNo=nextStage(cur());save();show('workflow')});el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this project?'))return;projects=projects.filter(p=>p.projectId!==b.dataset.del);if(selected===b.dataset.del)selected=null;save();render()})}
function renderWorkflow(){const p=cur();$('workflowEmpty').classList.toggle('hidden',!!p);$('workflow').classList.toggle('hidden',!p);if(!p)return;$('pTitle').textContent=p.name;$('pIds').textContent=`${p.projectId} · ${p.jobId}`;const pc=Math.round(completeCount(p)/31*100);$('pct').textContent=`${completeCount(p)}/31 · ${pc}%`;$('bar').style.width=pc+'%';$('stageGrid').innerHTML=STAGES.map((d,i)=>`<button class="stageBtn ${p.stages[i].status==='COMPLETE'?'complete':''} ${stageNo===i+1?'active':''}" data-stage="${i+1}"><b>${i+1}. ${esc(d[0])}</b><br><span class="muted">${p.stages[i].status}</span></button>`).join('');$('stageGrid').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stageNo=Number(b.dataset.stage);renderStage()});renderStage()}
function promptBlock(p,n){try{return`<div class="field"><label>Exact stage prompt</label><pre id="mainPrompt">${esc(prompt(p,n))}</pre></div><button id="copyMain" class="btn">Copy stage prompt</button>`}catch(e){return`<div class="error">LOCKED: ${esc(e.message)}</div>`}}
function runFields(p,n,role){const s=p.stages[n-1],arr=role==='producer'?s.producers:s.verifiers;return`<div class="batch"><h3>${role==='producer'?'10 independent producer outputs':'10 independent verifier outputs'}</h3>${arr.map((v,i)=>`<div class="runCard"><div class="runHead"><b>RUN-${String(i+1).padStart(3,'0')} ${role}</b><button class="btn" style="width:auto;min-height:36px" data-rprompt="${role}:${i}">Copy prompt</button></div><div class="field"><label>${role==='producer'?'Producer':'Verifier'} response — REQUIRED</label><textarea class="run" data-${role}="${i}">${esc(v)}</textarea></div></div>`).join('')}</div>`}
function renderStage(){const p=cur();if(!p)return;const n=stageNo,d=STAGES[n-1],s=p.stages[n-1];let html=`<div class="row"><h2 style="margin:0">${n}. ${esc(d[0])}</h2><span class="pill">${s.status}</span></div><p class="muted">${esc(d[1])}</p>${promptBlock(p,n)}`;try{gate(p,n);if(n===11||n===18){html+=runFields(p,n,'producer')+`<div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeBatch" class="btn primary">Validate + save all 10 independent runs</button>`}else if(n===12){html+=runFields(p,n,'verifier')+`<div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeVerify" class="btn primary">Validate + save all 10 independent verifications</button>`}else if(n===19){html+=runFields(p,n,'verifier')+`<div class="field"><label>Convergence ledger — REQUIRED</label><textarea id="response">${esc(s.response)}</textarea></div><div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeVerify" class="btn primary">Validate convergence + save stage</button>`}else if(n===20){html+=runFields(p,n,'producer')+runFields(p,n,'verifier')+`<div class="field"><label>Unchanged confirmation summary — REQUIRED</label><textarea id="response">${esc(s.response)}</textarea></div><div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeConfirm" class="btn primary">Validate + save confirmation</button>`}else{html+=`<div class="field"><label>Agent response — REQUIRED</label><textarea id="response" placeholder="Paste the completed agent result. This stage cannot complete without it.">${esc(s.response)}</textarea></div><div class="field"><label>Evidence / notes</label><textarea id="notes">${esc(s.notes)}</textarea></div><button id="completeStandard" class="btn primary">Validate + complete stage</button>`}}catch(e){}html+=`<div id="stageMsg" class="error"></div>`;$('stagePanel').innerHTML=html;const cp=$('copyMain');if(cp)cp.onclick=()=>copyText($('mainPrompt').textContent);document.querySelectorAll('[data-rprompt]').forEach(b=>b.onclick=()=>{const [role,i]=b.dataset.rprompt.split(':');copyText(runPrompt(p,n,Number(i),role))});const err=e=>{$('stageMsg').textContent=e.message;setStatus(e.message,true)};const done=()=>{setStatus(`Stage ${n} completed with required pasted evidence.`);stageNo=Math.min(31,n+1);render()};if($('completeStandard'))$('completeStandard').onclick=async()=>{try{if(n===30)await complete30(p,$('response').value,$('notes').value);else{completeStandard(p,n,$('response').value,$('notes').value);if(n===31&&!(await canRelease(p)))throw Error('Release blocked: artifact, ACCEPTED decision, all stages, and exact audited/release hash equality are required.')}done()}catch(e){err(e)}};if($('completeBatch'))$('completeBatch').onclick=()=>{try{completeProducerBatch(p,n,[...document.querySelectorAll('[data-producer]')].map(x=>x.value));p.stages[n-1].notes=$('notes').value;save();done()}catch(e){err(e)}};if($('completeVerify'))$('completeVerify').onclick=()=>{try{completeVerifierBatch(p,n,[...document.querySelectorAll('[data-verifier]')].map(x=>x.value),n===19?$('response').value:'');p.stages[n-1].notes=$('notes').value;save();done()}catch(e){err(e)}};if($('completeConfirm'))$('completeConfirm').onclick=()=>{try{completeConfirmation(p,[...document.querySelectorAll('[data-producer]')].map(x=>x.value),[...document.querySelectorAll('[data-verifier]')].map(x=>x.value),$('response').value);p.stages[19].notes=$('notes').value;save();done()}catch(e){err(e)}}}
async function copyText(t){try{await navigator.clipboard.writeText(t);setStatus('Prompt copied.')}catch(e){setStatus('Clipboard unavailable. Select and copy the displayed prompt manually.',true)}}function renderEvidence(){const p=cur();$('evidence').innerHTML=p?`<h2>Evidence</h2>${p.stages.map((s,i)=>`<details><summary>${i+1}. ${esc(STAGES[i][0])} — ${s.status}</summary><pre>${esc(s.response||batchDigest(s)||'No response')}</pre><p>${esc(s.notes||'No notes')}</p></details>`).join('')}`:'Select a project.'}
async function renderRelease(){const p=cur();if(!p){$('release').textContent='Select a project.';return}const h=p.artifact?await sha256(p.artifact):'',allowed=await canRelease(p);$('release').innerHTML=`<h2>Artifact / Release</h2><div class="kv"><b>Stages</b><span>${completeCount(p)}/31</span><b>Decision</b><span>${esc(p.releaseDecision)}</span><b>Actual SHA-256</b><span>${esc(h||'No artifact')}</span><b>Audited hash</b><span>${esc(p.auditedHash||'Not recorded')}</span><b>Release hash</b><span>${esc(p.releaseHash||'Not recorded')}</span><b>Release gate</b><span>${allowed?'PASS':'BLOCKED'}</span></div><div class="field"><label>Exact finished artifact (read-only after Stage 22)</label><textarea id="artifact" readonly>${esc(p.artifact||'')}</textarea></div><button class="btn good" id="downloadArtifact" ${allowed?'':'disabled'}>Download exact accepted artifact</button><div id="releaseMsg"></div>`;if($('downloadArtifact'))$('downloadArtifact').onclick=()=>{const blob=new Blob([p.artifact],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.artifactName||'released-artifact.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}function render(){renderProjects();renderWorkflow();renderEvidence();renderRelease()}
function exportProject(p){const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${p.jobId}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importProjectObject(p){if(!p||p.schemaVersion!==11||!p.projectId||!p.jobId||!Array.isArray(p.stages)||p.stages.length!==31)throw Error('Not a valid v11 project export.');if(projects.some(x=>x.projectId===p.projectId))projects=projects.filter(x=>x.projectId!==p.projectId);projects.unshift(p);selected=p.projectId;save();setStatus(`Imported ${p.name}.`);render()}
$('newBtn').onclick=()=>$('newCard').classList.remove('hidden');$('cancelBtn').onclick=()=>$('newCard').classList.add('hidden');$('createBtn').onclick=()=>{try{const p=createProject({name:$('name').value,objective:$('objective').value,deliverable:$('deliverable').value,inputs:$('inputs').value,constraints:$('constraints').value,format:$('format').value,deadline:$('deadline').value});projects.unshift(p);selected=p.projectId;save();$('newCard').classList.add('hidden');stageNo=1;setStatus('Project created at Stage 1. No workflow stage is pre-completed.');show('workflow')}catch(e){$('newErr').textContent=e.message}};$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;importProjectObject(JSON.parse(await f.text()))}catch(e){setStatus(e.message,true)}finally{e.target.value=''}};$('loadVerifiedBtn').onclick=async()=>{try{const r=await fetch('verified-e2e-project.json',{cache:'no-store'});if(!r.ok)throw Error(`Verified export unavailable (${r.status}).`);importProjectObject(await r.json());show('workflow')}catch(e){setStatus(e.message,true)}};$('exportBtn').onclick=()=>{const p=cur();if(p)exportProject(p)};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
load();render();window.__CLR_V11__={getProjects:()=>projects.map(p=>JSON.parse(JSON.stringify(p))),getCurrent:()=>cur()?JSON.parse(JSON.stringify(cur())):null,STAGES};
})();
</script></body></html>
