(async()=>{const fail=m=>{document.getElementById('e').textContent='LOAD FAILURE: '+m;throw new Error(m)};const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');const sha=async b=>hex(await crypto.subtle.digest('SHA-256',b));try{if(!crypto?.subtle)fail('Web Crypto unavailable.');if(!('DecompressionStream'in window))fail('DecompressionStream unavailable in this browser.');const mr=await fetch('payload-manifest.json',{cache:'no-store'});if(!mr.ok)fail('manifest HTTP '+mr.status);const m=await mr.json();if(m.workflow?.stageCount!==31)fail('manifest stage count is not 31');let encoded='';for(const rec of m.payload.parts){const r=await fetch(rec.file,{cache:'no-store'});if(!r.ok)fail(rec.file+' HTTP '+r.status);const t=(await r.text()).trim();const bytes=new TextEncoder().encode(t);if(bytes.length!==rec.length)fail(rec.file+' length mismatch');if(await sha(bytes)!==rec.sha256)fail(rec.file+' SHA-256 mismatch');encoded+=t}if(encoded.length!==m.payload.encodedLength)fail('encoded payload length mismatch');const raw=atob(encoded),gz=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)gz[i]=raw.charCodeAt(i);const ds=new DecompressionStream('gzip');const appBytes=await new Response(new Blob([gz]).stream().pipeThrough(ds)).arrayBuffer();if(appBytes.byteLength!==m.application.size)fail('application byte size mismatch');if(await sha(appBytes)!==m.application.sha256)fail('application SHA-256 mismatch');const app=new TextDecoder().decode(appBytes);for(const marker of ['JOB-SELFTEST-001','RELEASE ONLY THE EXACT ACCEPTED ARTIFACT','d37d29bf116c0dd3fa88c5c5840339c09cacdff60427df29dd4660a71d3f05be','TOOL-CONFIG-v002','5463b810697c6766faa0e1acce45bddb51eff700380de153b1904b68410ac0e3'])if(!app.includes(marker))fail('required application marker missing: '+marker);document.open();document.write(app);document.close()}catch(err){if(!document.getElementById('e')?.textContent)document.getElementById('e').textContent='LOAD FAILURE: '+(err?.message||String(err))}})();
</script></body></html>
