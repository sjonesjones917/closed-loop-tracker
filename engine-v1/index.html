<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Closed Loop Workflow</title><body style="margin:0;background:#08111e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;padding:24px">Loading Closed Loop Workflow…<script>(async()=>{try{let s='';for(let i=0;i<6;i++){const r=await fetch('payload-'+i+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('payload-'+i+' HTTP '+r.status);s+=await r.text()}const b=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<h2>Closed Loop Workflow failed to load</h2><pre style="white-space:pre-wrap">'+String(e)+'</pre>'}})()</script>
