<header><div class="row between"><div><h1>Closed Loop Reliability</h1><small id="sub">Starting…</small></div><button class="secondary" onclick="safeCall(()=>backupView())">Backup</button></div></header><div id="fatalBoot"></div><main id="app"><div class="card notice"><b>Starting application…</b><p class="muted">If this message remains visible, the startup error will be shown above instead of spinning forever.</p></div></main><nav><button onclick="safeCall(()=>projectsView())">Projects</button><button onclick="safeCall(()=>workflowView())">Workflow</button><button onclick="safeCall(()=>evidenceView())">Evidence</button><button onclick="safeCall(()=>blockersView())">Blockers</button></nav>
<script>
/* ENGINE-V6-AUDITED-SINGLE-FILE: content intentionally self-contained. */
const ENUMS={outputFormat:['UNSPECIFIED','TEXT','MARKDOWN','DOCX','PDF','XLSX','CSV','JSON','ZIP','CODE','OTHER'],sourceType:['USER_INPUT','FILE','MESSAGE','LINK','DATA','STATUTE','REGULATION','RULE','GUIDANCE','STANDARD','SPECIFICATION','CASE_LAW','WEB','OTHER'],sourceRole:['MANDATORY','INFORMATIVE','EVIDENTIARY'],authority:['USER','CONTROLLING','BINDING','PERSUASIVE','INFORMATIVE','UNKNOWN'],requirementType:['USER','AUTHORITATIVE','FORMAT','TECHNICAL_MEDIUM','DEPENDENCY','APPLICABILITY','PROHIBITION','OTHER'],requirementStatus:['RESOLVED','BLOCKED'],verificationMethod:['FORMAL_PROOF','EXACT_COMPUTATION','DETERMINISTIC_PROGRAMMATIC_TEST','SCHEMA_OR_STRUCTURAL_VALIDATION','EXACT_SOURCE_COMPARISON','RULE_BASED_EVALUATION','INDEPENDENT_SEMANTIC_EVALUATION','AUTHORIZED_HUMAN_JUDGMENT'],verificationResult:['SATISFIED','VIOLATED','UNDETERMINED'],defectCategory:['SOURCE_DEFECT','RESEARCH_DEFECT','REQUIREMENT_DEFECT','TEST_DEFECT','INSTRUCTION_DEFECT','INPUT_DEFECT','EXECUTION_DEFECT','TOOL_DEFECT','AUDIT_DEFECT'],defectSeverity:['CRITICAL','MAJOR','MINOR'],releaseState:['ACCEPTED','REJECTED','BLOCKED']};
const STAGE_NAMES=['Initialize the job','Build the source inventory','Research the requirements','Compile the requirement specification','Resolve the requirement set','Build the verification suite before writing the production instruction','Build failure tests','Author the production instruction','Preflight the production instruction','Freeze the test candidate','Run ten independent executions','Verify each execution independently','Compare the ten executions','Root-cause every defect','Convert every confirmed failure into a regression test','Revise the responsible layer','Re-run the complete ten-execution iteration','Continue until convergence','Run an unchanged confirmation iteration','Freeze the production baseline','Generate the finished product','Run deterministic verification on the finished product','Run independent semantic verification','Run adversarial verification','Inspect the final representation','Reconcile process and product evidence','Apply the release gate','Verify artifact identity before release','Preserve the complete evidence chain','Preserve failures permanently'];
const MANDATORY_RULES=`1. Do not begin production before requirements and acceptance tests exist.\n2. Do not invent missing facts.\n3. Do not silently resolve authoritative conflicts.\n4. Do not allow the generator to be its sole validator.\n5. Use deterministic verification whenever the property is deterministically testable.\n6. Require affirmative evidence for every mandatory requirement.\n7. Treat mandatory unknowns as BLOCKED.\n8. Root-cause every material failure before changing anything.\n9. Correct the earliest defective layer rather than merely patching the final output.\n10. Convert every confirmed defect into a permanent regression test.\n11. Re-run independent executions after every material upstream change.\n12. Do not allow independent iterations to see one another’s outputs.\n13. Do not freeze a baseline merely because ten runs completed.\n14. Require an unchanged confirmation iteration.\n15. Validate the actual finished artifact, not merely its source representation.\n16. Invalidate affected downstream verification whenever an upstream artifact changes materially.\n17. Do not release any product containing an unresolved critical or major defect.\n18. Do not release a product whose mandatory requirement cannot be verified.\n19. Do not release bytes different from the bytes that were audited.\n20. Preserve enough evidence to reproduce every acceptance decision.`;
const PREP_SCHEMA={sources:[{title:'',sourceType:'USER_INPUT',origin:'',version:'',effectiveDate:'',authority:'USER',role:'MANDATORY',relevantPortions:'',conflictsWith:[],authorityEvidence:''}],requirements:[{requirement:'',type:'USER',sourceIndex:0,sourceLocation:'',authority:'USER',applicability:'',dependencies:[],prohibitions:'',verificationMethod:'EXACT_SOURCE_COMPARISON',expectedEvidence:'',failureCondition:'',status:'RESOLVED'}],resolution:{duplicates:[],conflicts:[],impossible:[],undefinedTerms:[],circularDependencies:[],missingPrerequisites:[],unsupportedRequirements:[],indeterminateApplicability:[],unverifiableRequirements:[],blockers:[]},tests:[{requirementIndex:0,testType:'EXACT_SOURCE_COMPARISON',inputsRequired:'',procedure:'',expectedResult:'',failureCondition:'',evidenceProduced:''}],failureTests:[{requirementIndex:0,fixture:'',violation:'',expectedSystemResponse:'REJECT',validator:'',actualValidatorResponse:'',validatorDefect:false}],mandatoryRequirementCount:1,mandatoryRequirementsWithTests:1,mandatoryTestCoverage:1,productionInstruction:'',preflight:{materialDefectsRemaining:0,correctedInstruction:''},blocked:false,blockers:[]};
function pad(n,w=3){return String(n).padStart(w,'0')}function now(){return new Date().toISOString()}function rand(){try{let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0].toString(16).toUpperCase().padStart(8,'0')}catch{return Math.floor(Math.random()*0xffffffff).toString(16).toUpperCase().padStart(8,'0')}}function makeJobId(){return'JOB-'+Date.now().toString(36).toUpperCase()+'-'+rand()}function makeStages(){return STAGE_NAMES.map((name,i)=>({number:i+1,name,status:'NOT_STARTED',response:'',evidence:[],completedAt:null}))}function newProject(seed={}){return{schemaVersion:6,id:seed.id||makeJobId(),title:seed.title||'',objective:seed.objective||'',deliverable:seed.deliverable||'',supplied:seed.supplied||'',format:ENUMS.outputFormat.includes(seed.format)?seed.format:'UNSPECIFIED',deadline:seed.deadline||'',authorities:seed.authorities||'',tools:seed.tools||'',prohibited:seed.prohibited||'',unknowns:seed.unknowns||'',explicitRequirements:seed.explicitRequirements||'',assumptions:seed.assumptions||'',inputVersion:1,stage1Record:null,stages:makeStages(),sources:[],requirements:[],tests:[],failureTests:[],defects:[],regressions:[],versions:{SOURCE_SET:0,REQUIREMENTS:0,TEST_SUITE:0,INSTRUCTION:0,TOOL_CONFIGURATION:0,VALIDATOR:1,PRODUCT:0},freeze:null,runs:{candidate:[],rerun:[],confirmation:[]},iteration:1,baseline:null,product:null,release:{state:'UNRELEASED',auditedHash:'',releaseHash:'',hashMatch:null},auditLog:[],currentStage:1}}
function stage1Record(x){return{JOB_ID:x.id,EXACT_USER_OBJECTIVE:x.objective||'UNKNOWN',EXACT_DELIVERABLE_REQUESTED:x.deliverable||'UNKNOWN',ALL_SUPPLIED_FILES_MESSAGES_LINKS_DATA_AND_CONSTRAINTS:x.supplied||'NONE SUPPLIED',REQUIRED_OUTPUT_FORMAT:x.format||'UNSPECIFIED',DEADLINE_OR_TEMPORAL_SCOPE:x.deadline||'NONE SUPPLIED',KNOWN_AUTHORITATIVE_SOURCES:x.authorities||'NONE SUPPLIED',AVAILABLE_TOOLS:x.tools||'UNKNOWN',PROHIBITED_ACTIONS:x.prohibited||'NONE SUPPLIED',UNKNOWN_INFORMATION_THAT_MAY_AFFECT_CORRECTNESS:x.unknowns||'NONE RECORDED',EXPLICIT_USER_REQUIREMENTS:x.explicitRequirements||'NONE SEPARATELY RECORDED',ASSUMPTIONS:x.assumptions||'NONE',INPUT_SET_VERSION:'INPUT-v'+pad(x.inputVersion)}}function log(x,action,details=''){x.auditLog.push({seq:x.auditLog.length+1,at:now(),action,details})}function st(x,n){return x.stages[n-1]}function complete(x,n,response){let s=st(x,n);s.status='COMPLETE';s.response=typeof response==='string'?response:JSON.stringify(response,null,2);s.completedAt=now();x.currentStage=Math.max(x.currentStage,n+1)}function parseJSON(t){try{return JSON.parse(t)}catch(e){throw new Error('Response must be valid JSON. '+e.message)}}function req(x,n){if(!st(x,n).response)throw new Error('Stage '+n+' has no stored result.')}function nextId(list,prefix){return prefix+'-'+pad(list.length+1,4)}function hashText(t){if(!(crypto&&crypto.subtle))return Promise.reject(new Error('SHA-256 is unavailable in this browser.'));return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(buf=>Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''))}
function validateEnum(value,arr,label){if(!arr.includes(value))throw new Error(label+' must be one of: '+arr.join(' | '))}
function preparationPrompt(x){return`CLOSED-LOOP AGENT RELIABILITY WORKFLOW\n\nJOB RECORD\n${JSON.stringify(stage1Record(x),null,2)}\n\nYOUR TASK\nExecute Stages 2 through 9 completely, in order, in this one response. Do not stop after Stage 2. The result of each stage is the input to the next stage. Perform the actual research, extraction, requirement compilation, resolution, test design, failure-test design, production-instruction drafting, and instruction preflight. Do not merely describe those activities.\n\nSTAGE 2 — BUILD THE SOURCE INVENTORY\nIdentify every source that may govern correctness. Inspect supplied files themselves. Research current external facts with authoritative/current sources when required. Resolve source authority where resolvable; unresolved authoritative conflicts are blockers.\n\nSTAGE 3 — RESEARCH THE REQUIREMENTS\nRead every controlling source portion capable of imposing or limiting the result. Extract every mandatory requirement, recommendation, example, explanation, applicability fact, edge condition, exception, conflict, and restriction that can change the final product. Perform a second pass specifically for omissions/conflicts and continue until the final pass produces no new material requirement category.\n\nSTAGE 4 — COMPILE ATOMIC REQUIREMENTS\nCreate one independently testable requirement per record. Split compound requirements. Replace qualitative words with observable conditions.\n\nSTAGE 5 — RESOLVE THE REQUIREMENT SET\nCheck duplicates, conflicts, impossibility, undefined terms, circular dependencies, missing prerequisites, unsupported requirements, indeterminate applicability, and unverifiable requirements. Resolve every resolvable defect; mandatory unresolved items block.\n\nSTAGE 6 — BUILD THE VERIFICATION SUITE\nCreate at least one test for every mandatory requirement using the strongest available method. mandatoryTestCoverage must equal 1.0 before proceeding.\n\nSTAGE 7 — BUILD FAILURE TESTS\nCreate at least one invalid/adversarial fixture for every applicable requirement. Demonstrate that the validator detects, rejects, or blocks each invalid fixture. If a validator accepts an invalid fixture, correct it and retest before proceeding.\n\nSTAGE 8 — AUTHOR THE PRODUCTION INSTRUCTION\nWrite the actual production instruction from the resolved requirement set and tests. It must define objective, inputs, source authority, scope, terms, ordered procedure, decision rules, tool rules, output contract, failure handling, and completion criteria.\n\nSTAGE 9 — PREFLIGHT THE PRODUCTION INSTRUCTION\nInspect every instruction sentence for ambiguity, undefined objects, unavailable inputs/capabilities, conflicts, objective verifiability, operation responsibility, ordering, failure behavior, and traceability. Correct every material defect and return the corrected instruction.\n\nMANDATORY OPERATING RULES\n${MANDATORY_RULES}\n\nRESPONSE CONTRACT\nReturn JSON only. Use exactly this top-level structure and enum spellings:\n${JSON.stringify(PREP_SCHEMA,null,2)}\n\nENUMS\nsourceType=${ENUMS.sourceType.join('|')}\nrole=${ENUMS.sourceRole.join('|')}\nauthority=${ENUMS.authority.join('|')}\nrequirement.type=${ENUMS.requirementType.join('|')}\nrequirement.status=${ENUMS.requirementStatus.join('|')}\nverification/test methods=${ENUMS.verificationMethod.join('|')}\nfailure expectedSystemResponse=DETECT|REJECT|BLOCK\n\nDo not fabricate IDs. The application assigns SRC/REQ/TEST/FAIL identifiers after import.`}
function importPreparation(x,text){let o=parseJSON(text);if(o.blocked||o.blockers?.length)throw new Error('Preparation is BLOCKED. Resolve the listed mandatory blocker before continuing.');if(!Array.isArray(o.sources)||!o.sources.length)throw new Error('No sources returned.');if(!Array.isArray(o.requirements)||!o.requirements.length)throw new Error('No requirements returned.');if(!Array.isArray(o.tests)||!o.tests.length)throw new Error('No verification tests returned.');if(!Array.isArray(o.failureTests)||!o.failureTests.length)throw new Error('No failure tests returned.');if(Number(o.mandatoryTestCoverage)!==1)throw new Error('mandatoryTestCoverage must equal 1.0.');if(!o.productionInstruction?.trim())throw new Error('Production instruction is missing.');if(!o.preflight||Number(o.preflight.materialDefectsRemaining)!==0||!o.preflight.correctedInstruction?.trim())throw new Error('Preflight did not eliminate all known material instruction defects.');o.sources.forEach((s,i)=>{validateEnum(s.sourceType,ENUMS.sourceType,'sourceType');validateEnum(s.role,ENUMS.sourceRole,'source role');validateEnum(s.authority,ENUMS.authority,'source authority');s.id='SRC-'+pad(i+1,4)});o.requirements.forEach((r,i)=>{validateEnum(r.type,ENUMS.requirementType,'requirement type');validateEnum(r.authority,ENUMS.authority,'requirement authority');validateEnum(r.status,ENUMS.requirementStatus,'requirement status');if(!ENUMS.verificationMethod.includes(r.verificationMethod)&&!['SOURCE_COMPARISON','RULE_BASED','SCHEMA_VALIDATION','SEMANTIC_EVALUATION'].includes(r.verificationMethod))throw new Error('Invalid verificationMethod: '+r.verificationMethod);r.id='REQ-'+pad(i+1,4)});o.tests.forEach((t,i)=>t.id='TEST-'+pad(i+1,4));o.failureTests.forEach((t,i)=>t.id='FAIL-'+pad(i+1,4));if(Number(o.mandatoryRequirementCount)!==o.requirements.length)throw new Error('mandatoryRequirementCount does not equal requirement records.');if(Number(o.mandatoryRequirementsWithTests)!==o.requirements.length)throw new Error('Every mandatory requirement must have a test.');if(o.failureTests.length<o.requirements.length)throw new Error('Every applicable requirement needs a failure test.');x.sources=o.sources;x.requirements=o.requirements;x.tests=o.tests;x.failureTests=o.failureTests;x.versions.SOURCE_SET++;x.versions.REQUIREMENTS++;x.versions.TEST_SUITE++;x.versions.INSTRUCTION++;for(let n=2;n<=7;n++)complete(x,n,o);complete(x,8,o.productionInstruction);complete(x,9,o.preflight.correctedInstruction);log(x,'PREPARATION_IMPORTED','Stages 2-9 imported from one agent response; IDs generated by app.');return o}
function freezeCandidate(x){for(let n=1;n<=9;n++)req(x,n);let id='FREEZE-'+pad((x.freeze?1:0)+1,4);let body=[JSON.stringify(stage1Record(x)),...Array.from({length:8},(_,i)=>st(x,i+2).response)].join('\n');x.freeze={id,inputVersion:'INPUT-v'+pad(x.inputVersion),sourceSetVersion:'SOURCE-SET-v'+pad(x.versions.SOURCE_SET),requirementsVersion:'REQUIREMENTS-v'+pad(x.versions.REQUIREMENTS),testSuiteVersion:'TEST-SUITE-v'+pad(x.versions.TEST_SUITE),instructionVersion:'INSTRUCTION-v'+pad(x.versions.INSTRUCTION),toolConfigurationVersion:'TOOL-CONFIGURATION-v001',identity:body};complete(x,10,x.freeze);log(x,'CANDIDATE_FROZEN',id);return x.freeze}
function productionInstruction(x){let s16=st(x,16).response||'';let m16=s16.match(/(?:CORRECTED_FULL_INSTRUCTION|CORRECTED COMPLETE INSTRUCTION)\s*:\s*([\s\S]*)/i);if(m16)return m16[1].trim();return st(x,9).response||st(x,8).response}
function runPrompt(x,runId,batch){return`You are an independent execution agent. Execute the frozen production instruction exactly. Do not inspect or use any other execution's output, reviewer comment, prior failure explanation, or proposed correction.\n\nJOB_ID: ${x.id}\nBATCH: ${batch}\nRUN_ID: ${runId}\nFREEZE_ID: ${x.freeze?.id||x.baseline?.id||'UNKNOWN'}\n\nFROZEN PRODUCTION INSTRUCTION\n${productionInstruction(x)}\n\nReturn only the requested product/output for this run.`}
function verifyPrompt(x,run,batch){return`You are an independent verifier. Do not ask the generating agent whether its own work is correct. Verify RUN_ID ${run.id} against every mandatory requirement and its assigned tests. Use deterministic checks wherever possible; semantic evaluation only where deterministic checking cannot establish the property.\n\nREQUIREMENTS\n${JSON.stringify(x.requirements,null,2)}\n\nTESTS\n${JSON.stringify(x.tests,null,2)}\n\nRUN OUTPUT\n${run.output}\n\nReturn JSON only:\n{"runId":"${run.id}","results":[{"reqId":"REQ-0001","testId":"TEST-0001","result":"SATISFIED|VIOLATED|UNDETERMINED","evidence":"","defect":{"found":false,"category":"EXECUTION_DEFECT","severity":"MAJOR","observedFailure":""}}],"allMandatorySatisfied":true}\nUse defect.category only from ${ENUMS.defectCategory.join('|')} and severity only CRITICAL|MAJOR|MINOR.`}
function makeRunBatch(x,key){let arr=[];for(let i=1;i<=10;i++)arr.push({id:'RUN-'+pad(i),prompt:runPrompt(x,'RUN-'+pad(i),key.toUpperCase()),output:'',verificationPrompt:'',verification:'',verified:false});x.runs[key]=arr;return arr}
function saveRunResponse(x,key,i,t){if(!t.trim())throw new Error('Agent response is required.');x.runs[key][i].output=t;log(x,'RUN_RESPONSE_PASTED',key+':'+x.runs[key][i].id)}function saveVerificationResponse(x,key,i,t){if(!t.trim())throw new Error('Independent verifier response is required.');let o=parseJSON(t);if(o.runId!==x.runs[key][i].id)throw new Error('Verifier runId does not match.');if(!Array.isArray(o.results)||o.results.length!==x.requirements.length)throw new Error('Verifier must return one result for every requirement.');o.results.forEach(r=>validateEnum(r.result,ENUMS.verificationResult,'verification result'));x.runs[key][i].verification=t;x.runs[key][i].verified=o.results.every(r=>r.result==='SATISFIED');log(x,'VERIFICATION_RESPONSE_PASTED',key+':'+x.runs[key][i].id)}function requireBatch(x,key){let a=x.runs[key];if(a.length!==10)throw new Error('Exactly ten '+key+' runs are required.');a.forEach(r=>{if(!r.output.trim())throw new Error(r.id+' agent response is missing.');if(!r.verification.trim())throw new Error(r.id+' verifier response is missing.');if(!r.verified)throw new Error(r.id+' has a violated or undetermined mandatory requirement.')});return true}
function compareRuns(x,key){requireBatch(x,key);let outputs=x.runs[key].map(r=>r.output);let variance=outputs.some(v=>v!==outputs[0]);return{correctnessAffectingVariance:variance,findings:variance?['Outputs differ across independent executions.']:[]}}

function cur(){return DB.projects.find(x=>x.id===DB.currentId)||null}function save(){STORE.setItem(KEY,JSON.stringify(DB));hdr()}function hdr(){let x=cur();document.getElementById('sub').textContent=x?x.id+' • Stage '+Math.min(x.currentStage,30)+'/30':'Ready • '+DB.projects.length+' project'+(DB.projects.length===1?'':'s')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function safeCall(fn){try{let r=fn();if(r&&typeof r.catch==='function')r.catch(showError)}catch(e){showError(e)}}function showError(e){let f=document.getElementById('fatalBoot');f.style.display='block';f.textContent='ERROR: '+(e?.message||e);window.scrollTo({top:0,behavior:'smooth'})}window.onerror=(m,s,l,c,e)=>{showError(e||m);return true};window.onunhandledrejection=e=>showError(e.reason||e);async function cp(t){try{await navigator.clipboard.writeText(t);alert('Copied')}catch{prompt('Copy this text:',t)}}function field(label,key,area=false){let x=cur(),v=x?.[key]||'';return`<label>${label}</label>${area?`<textarea oninput="cur()['${key}']=this.value;save()">${esc(v)}</textarea>`:`<input value="${esc(v)}" oninput="cur()['${key}']=this.value;save()">`}`}
function projectsView(){let cards=DB.projects.map(x=>`<div class="card"><div class="row between"><div><b>${esc(x.title||'Untitled project')}</b><br><small>${esc(x.id)}</small></div><span class="pill ${x.release?.state==='ACCEPTED'?'ACCEPTED':''}">${esc(x.release?.state||'UNRELEASED')}</span></div><p class="muted">${esc(x.objective||'No objective entered.')}</p><p class="muted">${x.stages.filter(s=>s.status==='COMPLETE').length}/30 complete${x.readOnlyReference?' • READ-ONLY E2E REFERENCE':''}</p><div class="actions"><button onclick="safeCall(()=>openProject('${x.id}'))">Open</button><button class="secondary" onclick="safeCall(()=>auditView('${x.id}'))">Audit</button></div></div>`).join('');APP.innerHTML=`<div class="row between"><h2>Projects</h2><button onclick="safeCall(()=>newProjectUI())">New Project</button></div><div class="card notice"><b>No synthetic completion.</b><p class="muted">Projects advance only from job intake, pasted agent responses, deterministic app-computed gates, and release-byte verification. The built-in read-only project is a snapshot of the separate browser-driven E2E test.</p></div>${cards||'<div class="card">No projects.</div>'}`;hdr()}
function newProjectUI(){let x=C.newProject();DB.projects.unshift(x);DB.currentId=x.id;save();intakeView()}function openProject(id){DB.currentId=id;save();workflowView()}function intakeView(){let x=cur();if(!x)return projectsView();if(x.readOnlyReference)return workflowView();APP.innerHTML=`<div class="row between"><h2>Stage 1 — Define Job</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><b>Enter the job. The app performs only the bookkeeping portion of Stage 1.</b><p class="muted">No AI stage response is fabricated here.</p></div><div class="card">${field('Project name','title')}${field('Exact user objective','objective',true)}${field('Exact deliverable requested','deliverable',true)}${field('All supplied files, messages, links, data, and constraints','supplied',true)}<label>Required output format</label><select onchange="cur().format=this.value;save()">${C.ENUMS.outputFormat.map(v=>`<option ${v===x.format?'selected':''}>${v}</option>`).join('')}</select>${field('Deadline or temporal scope','deadline')}${field('Known authoritative sources','authorities',true)}${field('Available tools','tools',true)}${field('Prohibited actions','prohibited',true)}${field('Unknown information that may affect correctness','unknowns',true)}${field('Explicit user requirements','explicitRequirements',true)}${field('Assumptions','assumptions',true)}<button onclick="safeCall(()=>finishStage1())">Complete Stage 1</button></div>`}
function finishStage1(){let x=cur();if(!x.objective.trim()||!x.deliverable.trim())throw new Error('Exact objective and deliverable are required.');x.stage1Record=C.stage1Record(x);C.complete(x,1,x.stage1Record);C.log(x,'STAGE_1_COMPLETE','Completed through human job intake.');save();preparationView()}
function workflowView(){let x=cur();if(!x)return projectsView();let done=x.stages.filter(s=>s.status==='COMPLETE').length;APP.innerHTML=`<div class="row between"><h2>${esc(x.title||'Workflow')}</h2><button class="secondary" onclick="safeCall(()=>intakeView())">Job input</button></div><div class="grid"><div class="metric"><b>${done}/30</b><small>Complete</small></div><div class="metric"><b>${esc(x.release?.state||'UNRELEASED')}</b><small>Release</small></div></div>${x.stages.map(s=>`<div class="stage" onclick="safeCall(()=>stageRouter(${s.number}))"><div class="num">${String(s.number).padStart(2,'0')}</div><div><b>${esc(s.name)}</b><div class="muted" style="font-size:11px">${s.number===x.currentStage?'NEXT REQUIRED WORK':'Workflow stage'}</div></div><span class="pill ${s.status}">${s.status.replaceAll('_',' ')}</span></div>`).join('')}`;hdr()}
function stageRouter(n){let x=cur();if(x.readOnlyReference)return referenceStageView(n);if(n===1)return intakeView();if(n>=2&&n<=9)return preparationView();if(n===10)return freezeView();if(n===11||n===12)return candidateView();if(n>=13&&n<=16)return analysisView();if(n===17||n===18)return rerunView();if(n===19)return confirmationView();if(n===20)return baselineView();if(n===21)return productView();if(n>=22&&n<=26)return finalVerificationView();if(n>=27)return releaseView()}
function preparationView(){let x=cur();if(!x)return projectsView();let promptText=C.preparationPrompt(x);APP.innerHTML=`<div class="row between"><h2>Stages 2–9 — Preparation</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><b>One agent handoff, eight sequential workflow stages.</b><p class="muted">The agent must actually inventory sources, research requirements, compile atomic requirements, resolve conflicts, build acceptance and failure tests, author the production instruction, and preflight it.</p><button onclick="safeCall(()=>cp(C.preparationPrompt(cur())))">Copy executable preparation prompt</button><details><summary>Exact prompt</summary><pre>${esc(promptText)}</pre></details></div><div class="card"><label>Paste the complete agent JSON response</label><textarea id="prep_response" style="min-height:320px"></textarea><button onclick="safeCall(()=>savePreparation())">Validate + import Stages 2–9</button></div>`}
function savePreparation(){let x=cur(),t=document.getElementById('prep_response').value;if(!t.trim())throw new Error('Paste the preparation agent response first.');C.importPreparation(x,t);save();freezeView()}
function freezeView(){let x=cur();APP.innerHTML=`<div class="row between"><h2>Stage 10 — Freeze Candidate</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card"><p class="muted">The app freezes the exact versions created by Stages 1–9. This does not bypass agent work.</p><button onclick="safeCall(()=>doFreeze())">Freeze candidate</button>${x.freeze?`<pre>${esc(JSON.stringify(x.freeze,null,2))}</pre>`:''}</div>`}function doFreeze(){let x=cur();C.freezeCandidate(x);C.makeRunBatch(x,'candidate');save();candidateView()}
function runCard(x,key,i){let r=x.runs[key][i];r.verificationPrompt=C.verifyPrompt(x,r,key);return`<div class="card run"><div class="row between"><b>${r.id}</b><span class="pill ${r.verified?'COMPLETE':r.output?'IN_PROGRESS':'NOT_STARTED'}">${r.verified?'VERIFIED':r.output?'OUTPUT SAVED':'WAITING'}</span></div><div class="actions"><button onclick="safeCall(()=>cp(cur().runs['${key}'][${i}].prompt))">Copy execution prompt</button><button class="secondary" onclick="safeCall(()=>cp(C.verifyPrompt(cur(),cur().runs['${key}'][${i}],'${key}')))">Copy verifier prompt</button></div><label>Paste execution-agent response</label><textarea id="${key}_out_${i}">${esc(r.output)}</textarea><button class="secondary" onclick="safeCall(()=>saveRunUI('${key}',${i}))">Save execution response</button><label>Paste independent-verifier JSON response</label><textarea id="${key}_ver_${i}">${esc(r.verification)}</textarea><button class="secondary" onclick="safeCall(()=>saveVerUI('${key}',${i}))">Save verifier response</button></div>`}
function saveRunUI(key,i){let x=cur();C.saveRunResponse(x,key,i,document.getElementById(`${key}_out_${i}`).value);save();stageRouter(key==='candidate'?11:key==='rerun'?17:19)}function saveVerUI(key,i){let x=cur();C.saveVerificationResponse(x,key,i,document.getElementById(`${key}_ver_${i}`).value);save();stageRouter(key==='candidate'?12:key==='rerun'?17:19)}
function candidateView(){let x=cur();if(!x.runs.candidate.length){if(!x.freeze)throw new Error('Freeze Stage 10 first.');C.makeRunBatch(x,'candidate');save()}APP.innerHTML=`<div class="row between"><h2>Stages 11–12 — Candidate Batch</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><b>20 pasted responses are mandatory.</b><p class="muted">10 independent execution-agent outputs + 10 independent-verifier outputs. The app will not complete either stage with missing fields.</p></div>${x.runs.candidate.map((_,i)=>runCard(x,'candidate',i)).join('')}<div class="card"><button onclick="safeCall(()=>finishCandidate())">Validate all 10 runs + all 10 verifications</button></div>`}
function finishCandidate(){let x=cur();C.requireBatch(x,'candidate');C.complete(x,11,{runs:x.runs.candidate.map(r=>({id:r.id,output:r.output}))});C.complete(x,12,{verifications:x.runs.candidate.map(r=>({id:r.id,verification:r.verification}))});C.log(x,'CANDIDATE_BATCH_COMPLETE','10 execution responses + 10 verifier responses.');save();analysisView()}
function analysisView(){let x=cur(),p=C.analysisPrompt(x);APP.innerHTML=`<div class="row between"><h2>Stages 13–16 — Compare / Root Cause / Regression / Correct</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><button onclick="safeCall(()=>cp(C.analysisPrompt(cur())))">Copy analysis prompt</button><details><summary>Exact prompt</summary><pre>${esc(p)}</pre></details></div><div class="card"><label>Paste analysis-agent JSON response</label><textarea id="analysis_response" style="min-height:300px"></textarea><button onclick="safeCall(()=>saveAnalysis())">Validate + import Stages 13–16</button></div>`}function saveAnalysis(){let x=cur(),t=document.getElementById('analysis_response').value;if(!t.trim())throw new Error('Paste the analysis agent response first.');C.importAnalysis(x,t);C.makeRunBatch(x,'rerun');save();rerunView()}
function rerunView(){let x=cur();if(!x.runs.rerun.length)C.makeRunBatch(x,'rerun');APP.innerHTML=`<div class="row between"><h2>Stage 17 — New 10-Run Iteration</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><b>Again: 20 pasted responses required.</b><p class="muted">10 new independent executions plus independent verification for every new run.</p></div>${x.runs.rerun.map((_,i)=>runCard(x,'rerun',i)).join('')}<div class="card"><button onclick="safeCall(()=>finishRerun())">Validate rerun + compute convergence</button></div>`}function finishRerun(){let x=cur();C.requireBatch(x,'rerun');let cmp=C.compareRuns(x,'rerun');x.analysis=x.analysis||{};x.analysis.comparison=cmp;C.complete(x,17,{runs:x.runs.rerun,comparison:cmp});let c=C.convergence(x);if(!c.converged)throw new Error('Stage 18 convergence conditions are not all satisfied. Root-cause/correct and run another iteration.');C.makeRunBatch(x,'confirmation');save();confirmationView()}
function confirmationView(){let x=cur();if(!x.runs.confirmation.length)C.makeRunBatch(x,'confirmation');APP.innerHTML=`<div class="row between"><h2>Stage 19 — Unchanged Confirmation</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><b>20 more pasted responses required.</b><p class="muted">Same frozen versions, 10 new independent contexts, and independent verification for every confirmation run.</p></div>${x.runs.confirmation.map((_,i)=>runCard(x,'confirmation',i)).join('')}<div class="card"><button onclick="safeCall(()=>finishConfirmation())">Validate unchanged confirmation</button></div>`}function finishConfirmation(){let x=cur();C.requireBatch(x,'confirmation');C.complete(x,19,{runs:x.runs.confirmation});C.log(x,'CONFIRMATION_COMPLETE','10 execution + 10 verifier responses.');save();baselineView()}
function baselineView(){let x=cur();APP.innerHTML=`<div class="row between"><h2>Stage 20 — Freeze Approved Baseline</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card"><button onclick="safeCall(()=>doBaseline())">Freeze approved baseline</button>${x.baseline?`<pre>${esc(JSON.stringify(x.baseline,null,2))}</pre>`:''}</div>`}function doBaseline(){let x=cur();C.baselineFreeze(x);save();productView()}
function productView(){let x=cur(),p=C.productPrompt(x);APP.innerHTML=`<div class="row between"><h2>Stage 21 — Generate Finished Product</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><button onclick="safeCall(()=>cp(C.productPrompt(cur())))">Copy production prompt</button><details><summary>Exact prompt</summary><pre>${esc(p)}</pre></details></div><div class="card"><label>Paste production-agent JSON response</label><textarea id="product_response" style="min-height:260px"></textarea><button onclick="safeCall(()=>saveProduct())">Validate + store exact artifact bytes</button></div>`}async function saveProduct(){let x=cur(),t=document.getElementById('product_response').value;if(!t.trim())throw new Error('Paste the production agent response first.');await C.importProduct(x,t);save();finalVerificationView()}
function finalVerificationView(){let x=cur();let cards=[22,23,24,25,26].map(n=>`<div class="card"><h3>Stage ${n} — ${esc(C.STAGE_NAMES[n-1])}</h3><button onclick="safeCall(()=>cp(C.finalVerifierPrompt(cur(),${n})))">Copy Stage ${n} verifier prompt</button><label>Paste independent verifier JSON response</label><textarea id="fv_${n}">${esc(C.st(x,n).response)}</textarea><button class="secondary" onclick="safeCall(()=>saveFinalVer(${n}))">Validate Stage ${n}</button></div>`).join('');APP.innerHTML=`<div class="row between"><h2>Stages 22–26 — Finished Product Verification</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><b>Five separate verification responses are required.</b></div>${cards}<div class="card"><button onclick="safeCall(()=>releaseView())">Continue to release gate</button></div>`}function saveFinalVer(n){let x=cur(),t=document.getElementById('fv_'+n).value;if(!t.trim())throw new Error('Paste the Stage '+n+' verifier response first.');C.importFinalVerification(x,n,t);save();finalVerificationView()}
function releaseView(){let x=cur();APP.innerHTML=`<div class="row between"><h2>Stages 27–30 — Release</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card"><p>Release state: <span class="pill ${x.release.state}">${esc(x.release.state)}</span></p><p class="muted">The app computes the release state from Stages 22–26, calculates the audited and release hashes from the exact stored artifact text, requires equality, then builds the evidence chain and preserves failures.</p><button onclick="safeCall(()=>runRelease())">Run release gate + hash + evidence chain</button>${x.release.releaseHash?`<pre>AUDITED_HASH=${esc(x.release.auditedHash)}\nRELEASE_HASH=${esc(x.release.releaseHash)}\nMATCH=${x.release.hashMatch}</pre>`:''}</div>${x.product?`<div class="card"><b>Finished artifact</b><pre>${esc(x.product.artifactText)}</pre><button onclick="safeCall(()=>downloadArtifact())">Download exact accepted artifact</button></div>`:''}`}
async function runRelease(){let x=cur();for(let n=22;n<=26;n++)if(!C.st(x,n).response)throw new Error('Stage '+n+' verification response is still missing.');await C.releaseGate(x);if(x.release.state!=='ACCEPTED')throw new Error('Release gate result is '+x.release.state+'.');await C.releaseHash(x);C.evidenceChain(x);C.preserveFailures(x);save();releaseView()}function downloadArtifact(){let x=cur();if(x.release.state!=='ACCEPTED'||!x.release.hashMatch)throw new Error('Only the exact accepted artifact may be released.');let b=new Blob([x.product.artifactText],{type:x.product.mediaType||'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=x.product.artifactName||'product.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function evidenceView(){let x=cur();if(!x)return projectsView();APP.innerHTML=`<div class="row between"><h2>Evidence</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card"><b>IDs</b><pre>${esc(JSON.stringify({sources:x.sources,requirements:x.requirements,tests:x.tests,failureTests:x.failureTests,defects:x.defects,regressions:x.regressions},null,2))}</pre></div><div class="card"><b>Evidence chain</b><pre>${esc(JSON.stringify(x.evidenceChain||[],null,2))}</pre></div>`}function blockersView(){let x=cur();if(!x)return projectsView();let blockers=[];try{let prep=C.st(x,2).response?JSON.parse(C.st(x,2).response):null;blockers=prep?.blockers||[]}catch{}APP.innerHTML=`<h2>Human-only blockers</h2><div class="card notice"><p class="muted">A human is requested only when a mandatory fact, authorization, signature, access item, payment, or real-world action cannot be completed by an agent.</p></div>${blockers.length?blockers.map(b=>`<div class="card"><pre>${esc(JSON.stringify(b,null,2))}</pre></div>`).join(''):'<div class="card">No recorded human-only blockers.</div>'}`}
function auditView(id){let x=DB.projects.find(p=>p.id===id);if(!x)return;DB.currentId=x.id;save();APP.innerHTML=`<div class="row between"><h2>Project Audit</h2><button class="secondary" onclick="safeCall(()=>projectsView())">Projects</button></div><div class="card"><b>${esc(x.title)}</b><pre>${esc(JSON.stringify(x.auditLog||[],null,2))}</pre></div><div class="card"><b>Run response counts</b><pre>Candidate execution responses: ${x.runs.candidate.filter(r=>r.output).length}\nCandidate verifier responses: ${x.runs.candidate.filter(r=>r.verification).length}\nRerun execution responses: ${x.runs.rerun.filter(r=>r.output).length}\nRerun verifier responses: ${x.runs.rerun.filter(r=>r.verification).length}\nConfirmation execution responses: ${x.runs.confirmation.filter(r=>r.output).length}\nConfirmation verifier responses: ${x.runs.confirmation.filter(r=>r.verification).length}</pre></div>`}function referenceStageView(n){let x=cur(),s=C.st(x,n);APP.innerHTML=`<div class="row between"><h2>Reference Stage ${n}</h2><button class="secondary" onclick="safeCall(()=>workflowView())">Workflow</button></div><div class="card notice"><b>Read-only E2E evidence snapshot.</b><p class="muted">This project cannot advance or be edited. It exists only so you can inspect the result of the browser-driven workflow test.</p></div><div class="card"><b>${esc(s.name)}</b><pre>${esc(s.response)}</pre></div>`}function backupView(){let x=cur();APP.innerHTML=`<h2>Backup</h2><div class="card"><button onclick="safeCall(()=>downloadBackup())">Export all project data</button>${x?` <button class="secondary" onclick="safeCall(()=>cp(JSON.stringify(x,null,2)))">Copy current project JSON</button>`:''}</div>`}function downloadBackup(){let b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='closed-loop-reliability-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function boot(){try{projectsView();hdr();document.getElementById('sub').textContent=document.getElementById('sub').textContent.replace('Starting…','Ready')}catch(e){showError(e)}}boot();
</script></body></html>
