<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Closed-Loop Agent Reliability v8</title><style>:root{color-scheme:dark;--bg:#08111f;--panel:#101d31;--line:#2f4565;--text:#f7f9fc;--muted:#a9b7ca;--accent:#6db9ff;--good:#81d69a;--warn:#ffd166;--bad:#ff9a9a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}body{padding-bottom:82px}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#172844;color:var(--text);padding:11px 12px;border-radius:12px;font-weight:800;min-height:44px}button.primary{background:#1e5d95;border-color:#4a92d0}button.good{background:#21462e;border-color:#3e7951}button.danger{background:#49222a;border-color:#7b4651}button:disabled{opacity:.42}.shell{max-width:960px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 10px 18px}header{position:sticky;top:0;z-index:8;background:#08111ff4;padding:8px 2px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:flex-start}.brand h1{margin:0;font-size:21px}.muted,small{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grid{display:grid;gap:9px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:800;color:#cad7e8}.field input,.field textarea,.field select{width:100%;background:#071321;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}.field textarea{min-height:112px;resize:vertical}pre{white-space:pre-wrap;word-break:break-word;background:#06101b;border:1px solid #263b59;border-radius:10px;padding:11px;max-height:520px;overflow:auto;font-size:12px;line-height:1.4}.stage{display:grid;grid-template-columns:35px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;margin:6px 0}.num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#20314b;font-size:11px}.pill{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:5px 7px}.COMPLETE,.ACCEPTED,.CONFIRMED{border-color:#3d7950;color:#b8efc8}.BLOCKED,.UNDETERMINED{border-color:#866d2d;color:#ffe299}.REJECTED,.FAILED{border-color:#87505b;color:#ffc0c0}.notice{border-left:4px solid var(--accent)}.goodline{border-left:4px solid var(--good)}.warnline{border-left:4px solid var(--warn)}.badline{border-left:4px solid var(--bad)}.metric{text-align:center;background:#14243a;border-radius:11px;padding:10px}.metric b{display:block;font-size:19px}.hidden{display:none!important}.bottom{position:fixed;left:0;right:0;bottom:0;background:#08111ff5;border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:10}.bottom>div{max-width:960px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.bottom button{font-size:11px;padding:8px 2px}.err{color:#ffb7b7}.ok{color:#b8efc8}.runbox{border:1px solid var(--line);border-radius:10px;padding:9px;margin:7px 0}.runbox textarea{min-height:150px}@media(max-width:620px){.two{grid-template-columns:1fr}.row.mobile-stack{align-items:stretch;flex-direction:column}.row.mobile-stack button{width:100%}}</style></head><body><div class="shell"><header><div class="brand"><h1>Closed-Loop Agent Reliability</h1><small>v8 · exact 30-stage workbook model</small></div><button id="selfBtn">Run real E2E test</button></header><div id="status" class="card notice">Starting…</div><main id="app"></main></div><div class="bottom"><div><button data-nav="projects">Projects</button><button data-nav="workflow">Workflow</button><button data-nav="evidence">Evidence</button><button data-nav="release">Release</button></div></div><script src="v8-data.js?v=8"></script><script src="v8-app.js?v=8"></script></body></html>
