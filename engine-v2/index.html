<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111e"><title>Closed Loop Workflow</title><body style="margin:0;background:#08111e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;padding:24px">Loading Closed Loop Workflow…<script>(async()=>{try{let s="";for(let i=0;i<12;i++){const r=await fetch(`part-${String(i).padStart(2,"0")}.txt`,{cache:"no-store"});if(!r.ok)throw new Error(`part ${i}: HTTP ${r.status}`);s+=await r.text()}document.open();document.write(s);document.close()}catch(e){document.body.innerHTML='<h2>Closed Loop Workflow failed to load</h2><pre style="white-space:pre-wrap">'+String(e)+'</pre>'}})()</script>
