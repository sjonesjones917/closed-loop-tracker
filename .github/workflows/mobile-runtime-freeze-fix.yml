name: Apply mobile runtime freeze correction
on:
  push:
    branches: [fix/mobile-runtime-freeze-20260828]
    paths: ['.github/workflows/mobile-runtime-freeze-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply responsible-layer mobile performance fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          hash_path=Path('hash.js')
          hash_source=hash_path.read_text()
          marker="\nif(typeof document!=='undefined'){"
          if marker not in hash_source:
              raise SystemExit('Expected UI block was not found in hash.js')
          start=hash_source.index(marker)
          end=hash_source.rindex('\n})();')
          ui_block=hash_source[start+1:end]
          hash_path.write_text(hash_source[:start]+"\n})();\n")

          old_visible="""  function visibleLongSection(){
            const candidates=[...document.querySelectorAll('details.record-card[open]')]
              .filter(section=>!section.closest('#proposal-heading'))
              .map(section=>({section,rect:section.getBoundingClientRect(),depth:sectionDepth(section)}))
              .filter(({rect})=>scrollJumpBounds(rect).active)
              .sort((a,b)=>b.depth-a.depth||Math.abs(a.rect.top)-Math.abs(b.rect.top));
            return candidates[0]?.section||null;
          }"""
          new_visible="""  function visibleLongSection(){
            const x=Math.max(1,Math.min(innerWidth-1,innerWidth/2)),ys=[Math.max(1,innerHeight*.25),Math.max(1,innerHeight*.5),Math.max(1,innerHeight*.75)];
            const seen=new Set(),candidates=[];
            for(const y of ys){
              let section=document.elementFromPoint(x,y)?.closest?.('details.record-card[open]')||null;
              while(section){
                if(!seen.has(section)&&!section.closest('#proposal-heading')){const rect=section.getBoundingClientRect();if(scrollJumpBounds(rect).active)candidates.push({section,rect,depth:sectionDepth(section)});seen.add(section);}
                section=section.parentElement?.closest?.('details.record-card[open]')||null;
              }
            }
            candidates.sort((a,b)=>b.depth-a.depth||Math.abs(a.rect.top)-Math.abs(b.rect.top));
            return candidates[0]?.section||null;
          }"""
          if old_visible not in ui_block:
              raise SystemExit('Expected whole-document long-section scan not found')
          ui_block=ui_block.replace(old_visible,new_visible)
          old_review="    const longReview=Boolean(review&&[...review.querySelectorAll('details.record-card[open]')].some(details=>details.getBoundingClientRect().height>innerHeight));"
          new_review="    const longReview=Boolean(review&&review.querySelector('details.record-card[open]')&&reviewRect?.height>innerHeight);"
          if old_review not in ui_block:
              raise SystemExit('Expected review scan not found')
          ui_block=ui_block.replace(old_review,new_review)
          old_listeners="""  document.addEventListener('click',()=>queueMicrotask(syncMatchedScrollJumps));
            document.addEventListener('change',()=>queueMicrotask(syncMatchedScrollJumps));
            document.addEventListener('toggle',()=>queueMicrotask(syncMatchedScrollJumps),true);
            document.addEventListener('closed-loop-rendered',()=>queueMicrotask(syncMatchedScrollJumps));
            addEventListener('scroll',syncMatchedScrollJumps,{passive:true});
            addEventListener('resize',syncMatchedScrollJumps,{passive:true});
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>queueMicrotask(syncMatchedScrollJumps),{once:true});
            else queueMicrotask(syncMatchedScrollJumps);"""
          new_listeners="""  let syncFrame=0;
            function scheduleMatchedScrollJumps(){if(syncFrame)return;syncFrame=requestAnimationFrame(()=>{syncFrame=0;syncMatchedScrollJumps();});}
            document.addEventListener('click',scheduleMatchedScrollJumps);
            document.addEventListener('change',scheduleMatchedScrollJumps);
            document.addEventListener('toggle',scheduleMatchedScrollJumps,true);
            document.addEventListener('closed-loop-rendered',scheduleMatchedScrollJumps);
            addEventListener('scroll',scheduleMatchedScrollJumps,{passive:true});
            addEventListener('resize',scheduleMatchedScrollJumps,{passive:true});
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scheduleMatchedScrollJumps,{once:true});
            else scheduleMatchedScrollJumps();"""
          if old_listeners not in ui_block:
              raise SystemExit('Expected synchronous scroll listeners not found')
          ui_block=ui_block.replace(old_listeners,new_listeners)

          app_path=Path('app-core.js')
          app=app_path.read_text()
          function_start=app.index('function provenanceMarkup(n){')
          function_end=app.index('\nfunction workflow(){',function_start)
          provenance=r'''function provenanceAnchor(kind,id){return `provenance-${kind}-${String(id||'UNKNOWN').replace(/[^A-Za-z0-9_-]+/g,'-')}`;}
          function provenanceMarkup(n){
            const manifests=safe(current.projectData.extractionManifests).filter(m=>Number(m.stage)===n),rawById=new Map(safe(current.projectData.rawResponses).map(x=>[String(x.rawResponseId||''),x])),promptById=new Map(safe(current.projectData.generatedPrompts).map(x=>[String(x.instructionId||x.promptId||''),x])),evidenceById=new Map(engine.records(current,'evidenceRecords').map(x=>[String(engine.recordId(x,'evidenceRecords')||''),x])),usedRaw=new Set(),usedPrompts=new Set(),usedEvidence=new Set();
            const cards=manifests.flatMap(m=>safe(m.entries||m.changes).map(e=>{const rawId=String(m.rawResponseId||m.RAW_RESPONSE_ID||''),promptId=String(m.promptId||m.PROMPT_ID||''),evidenceIds=safe(e.evidenceIds).map(String),name=`${e.canonicalCollection||e.canonicalRecordType||''}/${e.canonicalRecordId||''}/${e.canonicalField||e.canonicalRelationship||''}`;if(rawId)usedRaw.add(rawId);if(promptId)usedPrompts.add(promptId);evidenceIds.forEach(id=>usedEvidence.add(id));const links=[rawId&&rawById.has(rawId)?`<a href="#${esc(provenanceAnchor('raw',rawId))}">Preserved raw response</a>`:'',promptId&&promptById.has(promptId)?`<a href="#${esc(provenanceAnchor('prompt',promptId))}">Controlling prompt</a>`:'',...evidenceIds.filter(id=>evidenceById.has(id)).map(id=>`<a href="#${esc(provenanceAnchor('evidence',id))}">Evidence ${esc(id)}</a>`)].filter(Boolean).join(' · ');return `<details class="record-card provenance-trace"><summary>${esc(name)}<span>Trace</span></summary><div class="record-body"><p class="section-intro">Canonical field → extraction manifest → exact response pointer → preserved raw response → controlling prompt → canonical evidence.</p>${details('Extraction manifest and response pointer',{manifestId:m.manifestId,responsePointer:e.jsonPointer||e.JSON_POINTER_IN_RESPONSE||'',rawResponseId:rawId||'NONE',promptId:promptId||'NONE',evidenceIds},true)}${links?`<div class="notice provenance-links">${links}</div>`:'<div class="notice warn">One or more provenance targets are unavailable for this trace.</div>'}</div></details>`;}));
            if(!cards.length)return '';
            const rawLookups=[...usedRaw].map(id=>rawById.get(id)).filter(Boolean).map(raw=>`<div id="${esc(provenanceAnchor('raw',raw.rawResponseId))}">${details(`Preserved raw response — ${raw.rawResponseId}`,raw)}</div>`).join('');
            const promptLookups=[...usedPrompts].map(id=>promptById.get(id)).filter(Boolean).map(prompt=>{const id=prompt.instructionId||prompt.promptId;return `<div id="${esc(provenanceAnchor('prompt',id))}">${details(`Controlling prompt — ${id}`,prompt)}</div>`;}).join('');
            const evidenceLookups=[...usedEvidence].map(id=>evidenceById.get(id)).filter(Boolean).map(record=>{const id=engine.recordId(record,'evidenceRecords');return `<div id="${esc(provenanceAnchor('evidence',id))}">${details(`Canonical evidence — ${id}`,record)}</div>`;}).join('');
            return `<div class="panel"><h2 class="section-title">Provenance navigation</h2><p class="section-intro">Each accepted field points to shared provenance targets. Large raw responses and prompts are rendered once per source record instead of being duplicated inside every field trace.</p>${cards.join('')}<details class="record-card provenance-targets"><summary>Provenance source records<span>${usedRaw.size+usedPrompts.size+usedEvidence.size}</span></summary><div class="record-body">${rawLookups}${promptLookups}${evidenceLookups}</div></details></div>`;
          }'''
          app=app[:function_start]+provenance+app[function_end:]
          app_end=app.rindex('\n})();')
          app=app[:app_end]+"\n// Long-section navigation belongs to the UI layer. It is frame-coalesced and samples only viewport-intersecting sections to avoid synchronous whole-document layout scans on mobile.\n"+ui_block+app[app_end:]
          app_path.write_text(app)

          regression=Path('verify-browser-extra.mjs')
          regression_source=regression.read_text()
          test_block="""

          // Mobile responsiveness regression: hashing must remain computation-only, and provenance must not duplicate large raw/prompt payloads per accepted field.
          {
           const hashSource=fs.readFileSync('hash.js','utf8'),appSource=fs.readFileSync('app-core.js','utf8');
           for(const token of ['document.','addEventListener(','requestAnimationFrame('])if(hashSource.includes(token))throw new Error('hash.js contains UI/runtime scheduling logic: '+token);
           for(const token of ['Long-section navigation belongs to the UI layer','scheduleMatchedScrollJumps','elementFromPoint','Large raw responses and prompts are rendered once per source record','Provenance source records'])if(!appSource.includes(token))throw new Error('Missing mobile responsiveness regression protection: '+token);
           if(appSource.includes(\"raw?details('Preserved raw response',raw)\"))throw new Error('Provenance regressed to duplicating the full raw response inside every field trace.');
          }
          """
          if 'Mobile responsiveness regression:' not in regression_source:
              regression.write_text(regression_source+test_block)

          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          def git_blob_sha(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          manifest=''.join(f'{name}:{git_blob_sha(name)}\n' for name in runtime_files)
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          index=Path('index.html')
          source=index.read_text()
          source,count=re.subn(r'runtime-[0-9a-f]{16}',token,source)
          if count!=8:
              raise SystemExit(f'Expected 8 runtime cache tokens, replaced {count}')
          index.write_text(source)
          print(token)
          PY
          node --check hash.js
          node --check app-core.js
          node --check verify-browser-extra.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
      - name: Commit tested correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-runtime-freeze-fix.yml
          git add hash.js app-core.js index.html verify-browser-extra.mjs
          git commit -m 'Fix mobile stage navigation freezes'
          git push origin HEAD:fix/mobile-runtime-freeze-20260828
