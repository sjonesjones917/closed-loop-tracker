name: Apply zero-loss project-memory repair
on:
  push:
    branches:
      - fix/spec-conformance-zero-loss-clean
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare source repair
        run: python3 .prepare-zero-loss-repair.py
      - name: Apply source repair
        run: python3 .repair-project-memory.py
      - name: Align controlling regressions
        run: |
          python3 .patch-zero-loss-tests.py
          python3 -c "from pathlib import Path; p=Path('verify.mjs'); s=p.read_text().replace(\"'closed-loop-project/2'\",\"'closed-loop-project/3'\").replace(\"'closed-loop-stage-response/2'\",\"'closed-loop-stage-response/3'\"); p.write_text(s)"
      - name: Syntax and regression proof
        run: |
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-project-memory.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify.mjs
          python3 -c "import re,subprocess,pathlib; b=subprocess.check_output(['git','show','7a8b4e88962a01fdd3e2245879fa6adbc3e97469:index.html'],text=True); n=pathlib.Path('index.html').read_text(); assert re.search(r'<style>(.*?)</style>',b,re.S).group(1)==re.search(r'<style>(.*?)</style>',n,re.S).group(1); assert \"worker-src 'self'\" in n and 'test-runtime.js?' in n; print('visual baseline CSS: PASS')"
          ! grep -q 'CUSTOM_PIPELINE' prompt-engine.js
      - name: Commit proven repair
        run: |
          git rm -f .prepare-zero-loss-repair.py .repair-project-memory.py .patch-zero-loss-tests.py .github/workflows/materialize-clean-conformance.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add index.html workflow-schema.js test-runtime.js workflow-engine.js prompt-engine.js response-ingestion.js verify-project-memory.mjs verify-prompt-semantics.mjs
          git commit -m 'Enforce durable one-time project input through Stage 04'
          git push origin HEAD:fix/spec-conformance-zero-loss-clean