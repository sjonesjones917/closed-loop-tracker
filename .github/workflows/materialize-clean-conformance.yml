name: Apply zero-loss project-memory repair
on:
  push:
    branches: [fix/spec-conformance-zero-loss-clean]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        run: python3 .repair-project-memory.py
      - name: Syntax and regression proof
        run: |
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-project-memory.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify.mjs
          python3 - <<'PY'
          import re,subprocess,pathlib
          base=subprocess.check_output(['git','show','7a8b4e88962a01fdd3e2245879fa6adbc3e97469:index.html'],text=True)
          now=pathlib.Path('index.html').read_text()
          assert re.search(r'<style>(.*?)</style>',base,re.S).group(1)==re.search(r'<style>(.*?)</style>',now,re.S).group(1)
          assert "worker-src 'self'" in now and 'test-runtime.js?' in now
          print('visual baseline CSS: PASS')
          PY
          ! grep -q 'CUSTOM_PIPELINE' prompt-engine.js
      - name: Commit proven repair
        run: |
          git rm .repair-project-memory.py .github/workflows/materialize-clean-conformance.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add index.html workflow-schema.js test-runtime.js workflow-engine.js prompt-engine.js response-ingestion.js verify-project-memory.mjs
          git commit -m 'Enforce durable one-time project input through Stage 04'
          git push origin HEAD:fix/spec-conformance-zero-loss-clean