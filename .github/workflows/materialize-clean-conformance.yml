name: Apply zero-loss project-memory repair
on: [push]
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Repair and prove controlling behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE=7a8b4e88962a01fdd3e2245879fa6adbc3e97469
          git show "$BASE:index.html" > index.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p=Path(path); s=p.read_text(); n=fn(s)
              if n==s: print('NOTE no change',path)
              p.write_text(n)

          # Keep the exact pre-regression CSS/markup. Add only required nonvisual worker/runtime loading.
          def index_patch(s):
              s=s.replace("base-uri 'none'\">", "base-uri 'none'; worker-src 'self'\">")
              m=re.search(r'<script defer src="workflow-schema\.js\?v=([^\"]+)"></script>',s)
              if not m: raise SystemExit('workflow-schema loader not found')
              token=m.group(1); anchor=f'<script defer src="workflow-schema.js?v={token}"></script>'; line=f'<script defer src="test-runtime.js?v={token}"></script>'
              if line not in s:s=s.replace(anchor,anchor+'\n'+line)
              return s
          edit('index.html',index_patch)

          def schema_patch(s):
              s=s.replace("executableKinds:Object.freeze(['NONE','CUSTOM_PIPELINE'])", "executableKinds:Object.freeze(['NONE','TEST_IR'])")
              s=s.replace("!=='CUSTOM_PIPELINE')issues.push('EXECUTABLE_KIND must be CUSTOM_PIPELINE.')", "!=='TEST_IR')issues.push('EXECUTABLE_KIND must be TEST_IR.')")
              return s
          edit('workflow-schema.js',schema_patch)

          def runtime_patch(s):
              s=s.replace("!=='CUSTOM_PIPELINE')return false;", "!=='TEST_IR')return false;")
              return s
          edit('test-runtime.js',runtime_patch)

          def engine_patch(s):
              marker="'history','newJobResets','reviews','recoveredProjects','responseDispositions','executionFailures'"
              if marker in s:
                  s=s.replace(marker,"'history','newJobResets','reviews','recoveredProjects','responseDispositions','executionFailures','intakeCoverageManifests','obligationManifests'")
              if 'function rebuildIntakeCoverageManifest(' not in s:
                  anchor='function openBlockers(project,stage){'
                  helpers=r'''function splitCapturedUnits(value){const text=typeof value==='string'?value.trim():value===undefined||value===null?'':JSON.stringify(value);if(!text||['NONE','UNKNOWN','NOT APPLICABLE'].includes(upper(text)))return [];return typeof value==='string'?text.split(/(?:\r?\n){2,}|\r?\n(?=\s*(?:[-*•]|\d+[.)])\s+)/).map(x=>x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(Boolean):[text];}
function enumerateProjectInputUnits(project){ensureShape(project);const units=[],seen=new Set(),jobId=String(project.job?.JOB_ID||'');const push=(value,sourceLocation,origin='HUMAN')=>{for(const [index,rawValue] of splitCapturedUnits(value).entries()){const rawValueSha256=hash.sha256Value(rawValue),dedupe=sourceLocation+'|'+rawValueSha256;if(seen.has(dedupe))continue;seen.add(dedupe);units.push({unitId:'INPUT-UNIT-'+hash.sha256Value([jobId,sourceLocation,index,rawValueSha256]).slice(0,20).toUpperCase(),origin,sourceLocation,rawValue,rawValueSha256});}};for(const name of schema.HUMAN_INTAKE_FIELDS||[])push(project.job?.[name],'job.'+name,'HUMAN');for(const item of safe(project.projectData?.humanInputAnswers))if(!item.invalidatedBy)push(item.answer,'humanInputAnswer.'+(item.answerId||item.requestId||'UNKNOWN'),'HUMAN');for(const name of ['EXACT_DELIVERABLE_REQUESTED','INPUT_SET_CONTENTS'])push(project.job?.[name]||project.stages?.[1]?.agentData?.[name],'stage01.'+name,'STAGE01_CAPTURE');return units;}
function rebuildIntakeCoverageManifest(project,{acceptedChangeId=null}={}){ensureShape(project);const inputVersion=String(project.job?.CURRENT_INPUT_VERSION||'UNKNOWN'),units=enumerateProjectInputUnits(project),manifestSha256=hash.sha256Value({inputVersion,units:units.map(x=>({unitId:x.unitId,sourceLocation:x.sourceLocation,rawValueSha256:x.rawValueSha256,origin:x.origin}))}),manifest={manifestId:'INTAKE-MANIFEST-'+manifestSha256.slice(0,20).toUpperCase(),inputVersion,manifestSha256,unitCount:units.length,coverage:units.length?1:0,units,acceptedChangeId,producer:'APPLICATION',createdAt:now()};project.projectData.intakeCoverageManifests=safe(project.projectData.intakeCoverageManifests).filter(x=>String(x.inputVersion)!==inputVersion);project.projectData.intakeCoverageManifests.push(manifest);project.job.INPUT_SET_HASH_OR_MANIFEST=manifest.manifestId;return manifest;}
function currentIntakeCoverageManifest(project){ensureShape(project);const inputVersion=String(project.job?.CURRENT_INPUT_VERSION||'');return safe(project.projectData.intakeCoverageManifests).filter(x=>String(x.inputVersion)===inputVersion).at(-1)||rebuildIntakeCoverageManifest(project);}
function buildObligationManifest(project){ensureShape(project);const intake=currentIntakeCoverageManifest(project),obligations=[],seen=new Set();const push=(rawValue,origin,sourceIdentity,provenance={})=>{for(const value of splitCapturedUnits(rawValue)){const rawValueSha256=hash.sha256Value(value),key=hash.sha256Value([origin,sourceIdentity,rawValueSha256]);if(seen.has(key))continue;seen.add(key);obligations.push({obligationId:'OBL-'+key.slice(0,20).toUpperCase(),origin,sourceIdentity,rawValue:value,rawValueSha256,provenance});}};for(const unit of intake.units||[])push(unit.rawValue,'HUMAN_INPUT',unit.unitId,{inputVersion:intake.inputVersion,sourceLocation:unit.sourceLocation});for(const r of recordsForCurrentScope(project,'candidateRequirements'))push(recordValue(r,'CANDIDATE_OBLIGATION'),'STAGE03_CANDIDATE',recordId(r,'candidateRequirements'),{sourceId:String(recordValue(r,'SOURCE_ID')||r.relationships?.SOURCE_ID||''),sourceLocation:String(recordValue(r,'SOURCE_LOCATION')||'')});for(const r of recordsForCurrentScope(project,'research'))for(const fieldName of ['MANDATORY_STATEMENTS','PROHIBITIONS','RESTRICTIONS','DEPENDENCIES','APPLICABILITY_FACTS','EXCEPTIONS'])push(recordValue(r,fieldName),'STAGE03_RESEARCH',recordId(r,'research')+':'+fieldName,{sourceId:String(recordValue(r,'SOURCE_ID')||r.relationships?.SOURCE_ID||''),field:fieldName});const scope=currentScope(project),manifestSha256=hash.sha256Value({inputVersion:scope.inputVersion,sourceSetVersion:scope.sourceSetVersion,obligations:obligations.map(x=>[x.obligationId,x.rawValueSha256])});return {manifestId:'OBLIGATION-MANIFEST-'+manifestSha256.slice(0,20).toUpperCase(),manifestSha256,inputVersion:scope.inputVersion,sourceSetVersion:scope.sourceSetVersion,obligationCount:obligations.length,obligations,producer:'APPLICATION'};}
function persistObligationManifest(project,manifest){ensureShape(project);const value=clone(manifest||buildObligationManifest(project));project.projectData.obligationManifests=safe(project.projectData.obligationManifests).filter(x=>!(String(x.inputVersion)===String(value.inputVersion)&&String(x.sourceSetVersion)===String(value.sourceSetVersion)));project.projectData.obligationManifests.push(value);return value;}
'''
                  if anchor not in s: raise SystemExit('engine insertion anchor not found')
                  s=s.replace(anchor,helpers+anchor)
              old="const record={...clone(promptRecord),source:'APPLICATION_PROMPT_REGISTRATION'};project.projectData.generatedPrompts.push(record);"
              new=old+"if(Number(record.stage)===1)rebuildIntakeCoverageManifest(project);if(Number(record.stage)===4&&record.contextManifest?.obligationManifest)persistObligationManifest(project,record.contextManifest.obligationManifest);"
              if old in s and 'persistObligationManifest(project,record.contextManifest.obligationManifest)' not in s:s=s.replace(old,new)
              export_anchor='currentScope,recordsForScope,recordsForCurrentScope,scopeForIteration,recordsForIteration,verificationMatrix,'
              export_new='currentScope,recordsForScope,recordsForCurrentScope,scopeForIteration,recordsForIteration,rebuildIntakeCoverageManifest,currentIntakeCoverageManifest,buildObligationManifest,persistObligationManifest,verificationMatrix,'
              if export_anchor in s:s=s.replace(export_anchor,export_new)
              return s
          edit('workflow-engine.js',engine_patch)

          def prompt_patch(s):
              s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';", "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/27';")
              s=s.replace('EXECUTABLE_KIND = CUSTOM_PIPELINE','EXECUTABLE_KIND = TEST_IR')
              if 'function durableProjectMemoryBlock(' not in s:
                  anchor='const procedures={'
                  helper="function durableProjectMemoryBlock(state){const job=state?.job||{},intake=workflow.currentIntakeCoverageManifest(state);return show({inputVersion:job.CURRENT_INPUT_VERSION,intakeManifestId:intake?.manifestId||null,intakeUnits:intake?.units||[],acceptedStage01:{EXACT_DELIVERABLE_REQUESTED:job.EXACT_DELIVERABLE_REQUESTED||state?.stages?.[1]?.agentData?.EXACT_DELIVERABLE_REQUESTED||'',ASSUMPTIONS:job.ASSUMPTIONS||state?.stages?.[1]?.agentData?.ASSUMPTIONS||'',UNKNOWN_INFORMATION:job.UNKNOWN_INFORMATION||state?.stages?.[1]?.agentData?.UNKNOWN_INFORMATION||'',INPUT_SET_CONTENTS:job.INPUT_SET_CONTENTS||state?.stages?.[1]?.agentData?.INPUT_SET_CONTENTS||''},humanAnswers:(state?.projectData?.humanInputAnswers||[]).filter(x=>!x.invalidatedBy).map(x=>({requestId:x.requestId,question:x.question,answer:x.answer,inputVersion:x.inputVersion}))});}\n"
                  if anchor not in s: raise SystemExit('prompt helper anchor not found')
                  s=s.replace(anchor,helper+anchor)
              needle='${humanInputBlock(j)}\n\nCURRENT AGENT-NORMALIZED DELIVERABLE'
              replacement='${humanInputBlock(j)}\n\nDURABLE PROJECT MEMORY — ALREADY SUPPLIED; NEVER ASK THE HUMAN TO REPEAT IT\nBefore asking any human question, search this durable project memory and the current canonical context. If a project fact, decision, constraint, requirement, material reference, or substantive material content is already present, USE IT. Do not ask the human to reconfirm, retype, restate, resend, re-upload, or reattach it merely because this is a later stage or a fresh external conversation. Ask only genuinely new human-only information that is absent here and cannot be established from authorized materials or research.\n\n${durableProjectMemoryBlock(state)}\n\nCURRENT AGENT-NORMALIZED DELIVERABLE'
              if needle not in s: raise SystemExit('prompt memory body anchor not found')
              s=s.replace(needle,replacement)
              body_anchor="function body(stage,state,operation,scope){\n const d=core.STAGES[stage-1],j=state?.job||{};"
              body_new=body_anchor+"\n const obligationManifest=stage===4?workflow.buildObligationManifest(state):null;"
              if body_anchor not in s: raise SystemExit('prompt body anchor not found')
              s=s.replace(body_anchor,body_new)
              display_anchor='${priorStageBlock}\n\nCURRENT CANONICAL CONTEXT'
              display_new='${priorStageBlock}\n\n${obligationManifest?`STAGE 04 APPLICATION-ENUMERATED OBLIGATION MANIFEST — COMPLETE INPUT UNIVERSE\\nAccount for every obligationId below. The application already selected and preserved these inputs. Do not ask the human to supply any item represented here.\\n\\n${show(obligationManifest)}`:\'\'}\n\nCURRENT CANONICAL CONTEXT'
              if display_anchor not in s: raise SystemExit('prompt Stage 04 display anchor not found')
              s=s.replace(display_anchor,display_new)
              record_anchor="promptHandoff={send:handoff.send,withhold:handoff.withhold,expectBack:handoff.expectBack},contextManifest={stage,operation,scope,verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,"
              record_new="promptHandoff={send:handoff.send,withhold:handoff.withhold,expectBack:handoff.expectBack},obligationManifest=stage===4?workflow.buildObligationManifest(state):null,contextManifest={stage,operation,scope,obligationManifest,verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,"
              if record_anchor not in s: raise SystemExit('prompt record anchor not found')
              s=s.replace(record_anchor,record_new)
              return s
          edit('prompt-engine.js',prompt_patch)

          def ingestion_patch(s):
              line="if(!ANSWER_TYPES.includes(request.answerType))issues.push(issue('INVALID_ANSWER_TYPE',`${path}/answerType`,`${request.answerType||'MISSING'} is not a supported answerType.`));"
              guard="if(stageNumber===4){const text=String(request.question||'')+' '+String(request.whyRequired||'');const repeat=/\\b(?:re-?attach|re-?upload|resend|re-?send|retype|re-?type|restate|re-?state|repeat|provide again|supply again|upload again|attach again)\\b/i.test(text),priorMaterial=/\\b(?:intent|original input|project input|supplied material|requirements file|input file)\\b/i.test(text),captured=workflow.currentIntakeCoverageManifest(project)?.unitCount>0;if(captured&&(repeat||(request.answerType==='FILE_REFERENCE'&&priorMaterial)))issues.push(issue('REPEATED_PROJECT_INPUT_REQUEST',path,'Stage 04 cannot request project information or intent material already captured in durable project memory. If prior capture is actually incomplete, return BLOCKED and identify the earlier-stage capture defect.'));}"
              if guard not in s:
                  if line not in s: raise SystemExit('ingestion human request anchor not found')
                  s=s.replace(line,line+guard)
              commit="if(stage===1)for(const name of schema.AGENT_JOB_FIELDS)if(Object.hasOwn(proposal.proposedStageData,name))next.job[name]=clone(proposal.proposedStageData[name]);"
              if 'rebuildIntakeCoverageManifest(next,{acceptedChangeId:changeId})' not in s:
                  if commit not in s: raise SystemExit('Stage 01 commit anchor not found')
                  s=s.replace(commit,commit+"if(stage===1)workflow.rebuildIntakeCoverageManifest(next,{acceptedChangeId:changeId});")
              return s
          edit('response-ingestion.js',ingestion_patch)

          Path('verify-project-memory.mjs').write_text(r'''import fs from 'node:fs';import vm from 'node:vm';import assert from 'node:assert/strict';
const ctx={console,TextEncoder,TextDecoder,crypto:globalThis.crypto,structuredClone};ctx.globalThis=ctx;vm.createContext(ctx);for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js'])vm.runInContext(fs.readFileSync(file,'utf8'),ctx,{filename:file});
const core=ctx.closedLoopCore,engine=ctx.closedLoopWorkflowEngine,prompts=ctx.closedLoopPromptEngine,schema=ctx.closedLoopWorkflowSchema;const p=core.createBlankState('JOB-MEMORY-REGRESSION');p.job.EXACT_USER_OBJECTIVE_VERBATIM='Build from the supplied intent.';p.job.EXPLICIT_USER_REQUIREMENTS='Never ask me to supply the same project information twice.';p.job.INPUT_SET_CONTENTS='Intent file statement: preserve every supplied project requirement.';p.job.CURRENT_INPUT_VERSION='INPUT-v001';engine.ensureShape(p);engine.rebuildIntakeCoverageManifest(p);p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Requested deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:p.job.INPUT_SET_CONTENTS};const manifest=engine.buildObligationManifest(p);assert.ok(manifest.obligations.some(x=>x.rawValue.includes('Never ask me')));assert.ok(manifest.obligations.some(x=>x.rawValue.includes('Intent file statement')));const rec=prompts.buildPromptRecord(4,p,{operation:'COMPLETE'});assert.match(rec.prompt,/APPLICATION-ENUMERATED OBLIGATION MANIFEST/);assert.match(rec.prompt,/Never ask me to supply the same project information twice/);assert.match(rec.prompt,/Intent file statement: preserve every supplied project requirement/);assert.match(rec.prompt,/NEVER ASK THE HUMAN TO REPEAT IT/);assert.ok(rec.contextManifest.obligationManifest);assert.equal(rec.contextManifest.obligationManifest.manifestSha256,manifest.manifestSha256);assert.deepEqual([...schema.TEST_IR.executableKinds],['NONE','TEST_IR']);console.log('project-memory regression: PASS');
''')
          PY

          node --check workflow-schema.js
          node --check test-runtime.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-project-memory.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify.mjs
          python3 - <<'PY'
          import re,subprocess,pathlib
          base=subprocess.check_output(['git','show','7a8b4e88962a01fdd3e2245879fa6adbc3e97469:index.html'],text=True)
          now=pathlib.Path('index.html').read_text()
          bs=re.search(r'<style>(.*?)</style>',base,re.S).group(1);ns=re.search(r'<style>(.*?)</style>',now,re.S).group(1)
          assert bs==ns, 'visual CSS differs from pre-regression baseline'
          assert 'worker-src \'self\'' in now
          assert 'test-runtime.js?' in now
          print('visual baseline CSS: PASS')
          PY
          ! grep -q 'CUSTOM_PIPELINE' prompt-engine.js
          ! grep -q "CUSTOM_PIPELINE')return false" test-runtime.js
          git rm .github/workflows/materialize-clean-conformance.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add index.html workflow-schema.js test-runtime.js workflow-engine.js prompt-engine.js response-ingestion.js verify-project-memory.mjs
          git commit -m 'Enforce durable one-time project input through Stage 04'
          git push origin HEAD:fix/spec-conformance-zero-loss-clean