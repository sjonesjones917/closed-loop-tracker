name: Stage 04 captured-input repair
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths:
      - stage04-capture-fix.py
      - .github/workflows/stage04-capture-fix.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage04-capture-fix
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Stage 04 captured-input repair
        run: python3 stage04-capture-fix.py
      - name: Syntax
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
      - name: Prove Stage 04 engine and prompt regressions
        run: |
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          ! grep -R "Send the Stage 04 instruction with the required material" workflow-engine.js prompt-engine.js app-core.js
          ! grep -R "MATERIALS TO SEND WITH THIS STAGE 04 INSTRUCTION" workflow-engine.js prompt-engine.js app-core.js
          ! grep -R "conversationMaterials" workflow-engine.js prompt-engine.js app-core.js
      - name: Prove Stage 04 browser behavior at required widths
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/stage04-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only permanent repair and regressions
        run: |
          rm -f stage04-capture-fix.py .github/workflows/stage04-capture-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix Stage 04 repeated intent-file attachment loop"
          git push origin HEAD:implementation/closed-loop-v3
