name: Finalize PR6 minimum semantic corrections
on:
  push:
    branches:
      - practical-100/pr6-final-closure
permissions:
  contents: write
concurrency:
  group: pr6-final-closure
  cancel-in-progress: false
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply proven semantic corrections
        run: python3 .pr6-final.py
      - name: Verify corrected source
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js *.mjs; do node --check "$f"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER_BIN"
          export BROWSER="$BROWSER_BIN"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit clean source only
        shell: bash
        run: |
          set -euo pipefail
          rm .pr6-final.py .github/workflows/pr6-final-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name pages.yml -print -quit)"
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          git commit -m "PR 6: close final semantic reliability gaps"
          git push origin HEAD:practical-100/pr6-final-closure
