name: Finalize PR6 minimum semantic corrections
on:
  push:
    branches: [practical-100/pr6-final-closure]
permissions:
  contents: write
concurrency:
  group: pr6-final-closure
  cancel-in-progress: false
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only proven semantic corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected exactly one match, found {n}: {old[:80]!r}')
              p.write_text(s.replace(old,new))

          one('workbook.js',
              "'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','KNOWN_AUTHORITATIVE_SOURCES'",
              "'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','DESIRED_SOURCE_COUNT','KNOWN_AUTHORITATIVE_SOURCES'")
          one('workbook.js',
              "2:['SOURCE_SET_VERSION','AUTHORITY_HIERARCHY','SOURCE_RECORDS'",
              "2:['SOURCE_SET_VERSION','AUTHORITY_HIERARCHY','SOURCE_APPLICABILITY_DETERMINATION','SOURCE_RECORDS'")
          one('workbook.js',
              '      "DEADLINE_OR_TEMPORAL_SCOPE",\n      "KNOWN_AUTHORITATIVE_SOURCES",',
              '      "DEADLINE_OR_TEMPORAL_SCOPE",\n      "DESIRED_SOURCE_COUNT",\n      "KNOWN_AUTHORITATIVE_SOURCES",')
          one('workbook.js',
              '      "AUTHORITY_HIERARCHY",\n      "KNOWN_CONTROLLING_SOURCES_EXAMINED"',
              '      "AUTHORITY_HIERARCHY",\n      "SOURCE_APPLICABILITY_DETERMINATION",\n      "KNOWN_CONTROLLING_SOURCES_EXAMINED"')

          one('workflow-schema.js',
              "  'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','KNOWN_AUTHORITATIVE_SOURCES',",
              "  'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','DESIRED_SOURCE_COUNT','KNOWN_AUTHORITATIVE_SOURCES',")
          marker='function ownerFromPartition(partition,name,label)'
          p=Path('workflow-schema.js'); s=p.read_text()
          if 'const STAGE_FIELD_TYPE_OVERRIDES=' not in s:
              insert="const STAGE_FIELD_TYPE_OVERRIDES=Object.freeze({\n  '1':Object.freeze({DESIRED_SOURCE_COUNT:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:true,normalizerKey:null,closedProperties:null})}),\n  '2':Object.freeze({SOURCE_APPLICABILITY_DETERMINATION:Object.freeze({valueType:'STRING',enumValues:Object.freeze(['APPLICABLE_SOURCES_ESTABLISHED','NO_APPLICABLE_EXTERNAL_SOURCE','UNDETERMINED']),nullable:false,normalizerKey:null,closedProperties:null})})\n});\n"
              if marker not in s: raise SystemExit('workflow-schema.js: owner marker missing')
              s=s.replace(marker,insert+marker,1)
              old="const producer=stageFieldProducer(stage,name),type=EXPLICIT_STAGE_FIELD_TYPES[String(stage)]?.[name];"
              new="const producer=stageFieldProducer(stage,name),type=STAGE_FIELD_TYPE_OVERRIDES[String(stage)]?.[name]||EXPLICIT_STAGE_FIELD_TYPES[String(stage)]?.[name];"
              if old not in s: raise SystemExit('workflow-schema.js: stageFieldDefinition type expression missing')
              s=s.replace(old,new,1)
              p.write_text(s)

          one('app-core.js',
              "['DEADLINE_OR_TEMPORAL_SCOPE','Temporal scope','input'],['KNOWN_AUTHORITATIVE_SOURCES'",
              "['DEADLINE_OR_TEMPORAL_SCOPE','Temporal scope','input'],['DESIRED_SOURCE_COUNT','Desired / suggested number of sources','number'],['KNOWN_AUTHORITATIVE_SOURCES'")
          one('app-core.js',
              "deadlineOrTemporalScope:next.job.DEADLINE_OR_TEMPORAL_SCOPE,knownAuthorities:",
              "deadlineOrTemporalScope:next.job.DEADLINE_OR_TEMPORAL_SCOPE,desiredSourceCount:next.job.DESIRED_SOURCE_COUNT,knownAuthorities:")

          one('prompt-engine.js','${show(open.slice(-20))}','${show(open)}')
          one('prompt-engine.js',
              "EXPLICIT USER REQUIREMENTS:\n${show(j.EXPLICIT_USER_REQUIREMENTS)}\n\nAUTHORIZED BOUNDED CONTEXT FOR THIS STAGE",
              "EXPLICIT USER REQUIREMENTS:\n${show(j.EXPLICIT_USER_REQUIREMENTS)}\n\n${stage===2?`STAGE 02 SOURCE DISCOVERY GUIDANCE\nDESIRED OR SUGGESTED SOURCE COUNT: ${show(j.DESIRED_SOURCE_COUNT)}\nTreat this count as guidance, not a quota. Prefer the most authoritative and reputable sources appropriate to the domain, prioritizing primary, official, controlling sources where they exist. Verify identity, currency, applicability, and authority before proposing a source. If no legitimate external governing source applies, return SOURCE_APPLICABILITY_DETERMINATION = NO_APPLICABLE_EXTERNAL_SOURCE with evidence; never invent a source merely to satisfy a count.\n`:''}\nAUTHORIZED BOUNDED CONTEXT FOR THIS STAGE")

          p=Path('workflow-engine.js'); s=p.read_text()
          s=s.replace("upper(project.stages[2].agentData?.AUTHORITY_HIERARCHY)==='NO_APPLICABLE_EXTERNAL_SOURCE'","upper(project.stages[2].agentData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE'")
          p.write_text(s)

          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          if 'DESIRED_SOURCE_COUNT' not in s:
              anchor="EXACT_USER_OBJECTIVE_VERBATIM:'Produce a reliable deliverable.'"
              if anchor not in s: raise SystemExit('verify-prompt-semantics.mjs: fixture anchor missing')
              s=s.replace(anchor,anchor+",DESIRED_SOURCE_COUNT:5",1)
          if 'desired source count guidance' not in s:
              anchor="const failures=[];"
              if anchor not in s: raise SystemExit('verify-prompt-semantics.mjs: failures anchor missing')
              s=s.replace(anchor,anchor+"\nconst stage2Probe=await promptEngine.build(2,fixture()); if(!stage2Probe.includes('DESIRED OR SUGGESTED SOURCE COUNT: 5'))failures.push('Stage 2 desired source count guidance is missing.'); if(!stage2Probe.includes('NO_APPLICABLE_EXTERNAL_SOURCE'))failures.push('Stage 2 explicit no-applicable-source path is missing.');",1)
          p.write_text(s)

          Path('README.md').write_text('''# Closed-Loop Reliability\n\nLive application: https://sjonesjones917.github.io/closed-loop-tracker/\n\nOne static, phone-first vanilla-JavaScript application implements exactly 30 closed-loop reliability stages. There is no Stage 31.\n\n## Responsibility boundaries\n\n| Responsibility | Final owner |\n|---|---|\n| Workflow stages, names, roles, declared completion conditions | `workbook.js` |\n| Field ownership, types, enums, relationships, stage/operation contracts | `workflow-schema.js` |\n| Canonical serialization and SHA-256 | `hash.js` |\n| Prompt content, bounded context selection, prompt identity | `prompt-engine.js` |\n| Parsing, validation, proposal planning, response disposition | `response-ingestion.js` |\n| Derived values, current-scope selection, gates, invalidation, release logic | `workflow-engine.js` |\n| Projects, revisions, artifact bytes, migration, integrity, import/export | `project-store.js` |\n| Rendering and operator actions | `app-core.js` |\n| Static shell, CSS, accessibility, ordered module loading | `index.html` |\n| Source, lifecycle, browser, deployment, live verification | `.github/workflows/pages.yml` |\n\nNo second parser, store, workflow engine, prompt layer, application shell, runtime wrapper guard, MutationObserver, framework runtime, service worker, or backend is part of the supported architecture.\n\n## Current contracts\n\n- Project schema: `closed-loop-project/2`\n- Workflow identity: `mobile-closed-loop/30`\n- Stage count: `30`\n- Response schema: `closed-loop-stage-response/2`\n- Project package schema: `closed-loop-project-package/1`\n\nResponses are bound to project, stage, operation, project revision, instruction ID, body SHA-256, response-contract SHA-256, context signature, and operation-relevant scope.\n\n## Persistence and backup\n\nThe application uses one IndexedDB database, `closed-loop-reliability`, with `projects`, `artifacts`, and `meta` object stores. Project writes use revision compare-and-swap. Actual artifact Blob bytes are stored and rehashed. Raw agent output is durably captured before parsing; parsing/proposal persistence and canonical acceptance are separate operations. Integrity failures fail closed or quarantine rather than silently becoming canonical state.\n\nBrowser-local storage is not protection against device loss, browser-profile deletion, private-mode eviction, or clearing site data. Retain verified complete exports outside the browser. There is no backend, cloud synchronization, authentication, or multi-device coordination.\n\n## Migration policy\n\nThe deterministic legacy migration is `human-project/30 -> closed-loop-project/2`. It preserves identity, all 30 stages, raw outputs, receipts, history, unknown extension data, and the original payload in a non-operational migration archive.\n\n## Supported browser contract\n\nCurrent Chromium desktop and current Android Chrome, minimum 320 CSS px, with IndexedDB, Web Crypto, Blob, `CompressionStream`, and `DecompressionStream`. Safari, Firefox, service-worker offline operation, and multi-device synchronization are not claimed.\n\n## Verification\n\n```bash\nnode build-test-project.mjs\nnode verify.mjs\nnode verify-ingestion.mjs\nnode verify-complete.mjs\nnode verify-full-cycle.mjs\nnode verify-prompt-semantics.mjs\nPAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs\nPAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs\n```\n\nThe single Pages workflow runs source, schema/ownership, ingestion, gate, continuous lifecycle, semantic prompt, local Chromium, deployment, exact deployed-byte, and deployed Chromium verification before publishing acceptance status.\n\nA green acceptance report supports only: `100% conformant to the tested deterministic invariants`. Operational reliability must be measured from real accepted operations; zero observed silent failures over N materially independent operations gives an approximate 95% upper failure-rate bound of `3 / N`.\n''')
          PY
      - name: Verify exact corrected source
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js *.mjs; do node --check "$f"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit clean source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr6-final-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name pages.yml -print -quit)"
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          git commit -m "PR 6: close final semantic reliability gaps"
          git push origin HEAD:practical-100/pr6-final-closure
