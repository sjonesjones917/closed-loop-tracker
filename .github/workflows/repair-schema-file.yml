name: Repair schema file patch application
on:
  push:
    branches: [fix/deployment-proof-v3-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deployment-proof-v3-20260830
          fetch-depth: 0
      - shell: bash
        run: |
          git checkout origin/main -- workflow-schema.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          s=p.read_text()
          old="if(AGENT_JOB_FIELDS.includes(name))return field(name,PRODUCER.AGENT,{requiredAtStage:1,valueType:name==='INPUT_SET_CONTENTS'?'OBJECT':'STRING'});"
          new="if(AGENT_JOB_FIELDS.includes(name))return field(name,PRODUCER.AGENT,{requiredAtStage:1,valueType:'STRING'});"
          if old not in s: raise SystemExit('expected job field definition not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/repair-schema-file.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-schema.js .github/workflows/repair-schema-file.yml
          git commit -m "Align Stage 01 captured input field type"
          git push origin HEAD:fix/deployment-proof-v3-20260830
