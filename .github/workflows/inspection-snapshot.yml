name: Temporary repository inspection snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: tar --exclude=.git -czf repository-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: repository-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
