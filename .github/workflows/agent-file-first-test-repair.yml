name: One-time file-first browser proof repair

on:
  push:
    branches: [fix/spec-driven-file-first-20260902]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Replace synthetic file assignment with the browser file-input protocol
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "async function selectResponseFile(cdp,text,filename='response.json'){const ok=await evalValue(cdp,`(()=>{const input=document.querySelector('#response-json-file');if(!input)return false;const file=new File([new TextEncoder().encode(${JSON.stringify(text)})],${JSON.stringify(filename)},{type:'application/json'}),dt=new DataTransfer();dt.items.add(file);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));return input.files.length===1&&input.files[0].name===${JSON.stringify(filename)};})()`);assert(ok,'Authoritative response-file input is unavailable.');}"
          new = """async function selectResponseFile(cdp,text,filename='response.json'){
            const safeName=String(filename||'response.json').replace(/[^A-Za-z0-9._-]/g,'_'),directory=fs.mkdtempSync(path.join(os.tmpdir(),'closed-loop-response-file-')),filePath=path.join(directory,safeName);
            fs.writeFileSync(filePath,String(text??''),'utf8');
            await cdp.send('DOM.enable');
            const handle=await cdp.send('Runtime.evaluate',{expression:`document.querySelector('#response-json-file')`,returnByValue:false});
            assert(handle.result?.objectId,'Authoritative response-file input is unavailable.');
            await cdp.send('DOM.setFileInputFiles',{files:[filePath],objectId:handle.result.objectId});
            const selected=await evalValue(cdp,`(()=>{const input=document.querySelector('#response-json-file');if(!input||input.files.length!==1)return false;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));return input.files[0].name===${JSON.stringify(safeName)};})()`);
            assert(selected,'The browser did not select the authoritative response file.');
          }"""

          for filename in ('verify-browser.mjs', 'verify-browser-extra.mjs'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected exactly one synthetic response-file helper')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
          rm .github/workflows/agent-file-first-test-repair.yml
      - name: Commit the whole repaired proof step and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify-browser.mjs verify-browser-extra.mjs .github/workflows/agent-file-first-test-repair.yml
          git commit -m 'Use the real browser file picker in file-first acceptance'
          git push origin HEAD:${GITHUB_REF_NAME}
