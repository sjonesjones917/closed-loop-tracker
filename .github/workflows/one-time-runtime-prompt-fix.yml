name: Apply runtime prompt-flow correction

on:
  push:
    branches:
      - fix/runtime-prompt-flow-20260830
    paths:
      - .github/workflows/one-time-runtime-prompt-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-prompt-flow-20260830
      - name: Apply validated prompt-flow corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "prompt-engine.js",
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/29';",
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/30';",
          )
          replace_once(
              "prompt-engine.js",
              "ONE-TIME INTENT FILE INTAKE: The original intent file is authorized only in Stage 01. Read all of its actually available substantive content and emit one intentStatements record for every atomic statement, instruction, requirement, constraint, prohibition, acceptance criterion, dependency, exception, definition, fact, assumption, question, reference, and other meaning-bearing statement.",
              "ONE-TIME HUMAN-AUTHORITY CAPTURE: Capture all project-relevant human input already supplied in the current conversation, User Job Input, persisted human answers, and actually supplied materials. If an original intent file was actually supplied and its bytes are available, that file is authorized only in Stage 01; inspect it now and only now. Never require or invent an intent file when the human already supplied the project information another way. Emit one intentStatements record for every atomic statement, instruction, requirement, constraint, prohibition, acceptance criterion, dependency, exception, definition, fact, assumption, question, reference, and other meaning-bearing statement.",
          )
          replace_once(
              "app-core.js",
              "Stage 01 is an intake conversation and the one-time intent-file intake. Save any facts you already know here, then send the generated instruction to ChatGPT with the original intent file attached once. The agent must extract every atomic statement into the canonical intentStatements ledger and ask only the remaining human-only questions in normal chat. After acceptance, never attach or resend the original file. Stay in ChatGPT until it returns the final JSON. HUMAN_INPUT_REQUIRED in this app is only a fallback when a required answer remains unavailable or deferred, or interactive conversation was unavailable.",
              "Stage 01 captures human project authority once. Save facts already supplied in User Job Input and continue with the generated instruction in ChatGPT. If the human actually supplied an intent or source file whose contents are needed and have not yet been canonically captured, attach that existing file once during Stage 01; otherwise do not create, request, or reattach an intent file. The agent must extract every atomic project-relevant statement into the canonical intentStatements ledger and ask only the remaining genuinely human-only questions in normal chat. After acceptance, later stages use the canonical ledger and stored project data; never ask the human to resend already supplied project information. Stay in ChatGPT until it returns the final JSON. HUMAN_INPUT_REQUIRED in this app is only a fallback when a required answer remains unavailable or deferred, or interactive conversation was unavailable.",
          )
          replace_once(
              "app-core.js",
              "if([23,24].includes(Number(n))&&!currentReviewerContext(n))return 'CONTROLLING INSTRUCTION UNAVAILABLE\\n\\nOpen a fresh independent reviewer context and register its identifier above. The application will bind that reviewer identity into the controlling prompt before it can be saved or copied.';",
              "if([23,24].includes(Number(n))&&!currentReviewerContext(n))return 'CONTROLLING INSTRUCTION UNAVAILABLE\\n\\nThis stage requires a fresh independent reviewer context before its controlling prompt can be created. Complete the prerequisite stages first. When this stage becomes current, use the reviewer-context control shown for this stage to register the new external context. The application will then bind that identity into the controlling prompt before it can be saved or copied.';",
          )
          replace_once(
              "app-core.js",
              "function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1);",
              "function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1),lockReason=stageLocked(n);",
          )
          replace_once(
              "app-core.js",
              "if(abandoned)return `<div class=\"notice\"><strong>The pending attempt was discarded.</strong><br>Canonical accepted work changed: NO · Audit state changed: YES · New prompt required: YES. Use only the newly generated authoritative prompt; the abandoned response cannot be accepted later.</div>`;if(requests.length||n===1&&!current.stages[1].responseDraft)return",
              "if(abandoned)return `<div class=\"notice\"><strong>The pending attempt was discarded.</strong><br>Canonical accepted work changed: NO · Audit state changed: YES · New prompt required: YES. Use only the newly generated authoritative prompt; the abandoned response cannot be accepted later.</div>`;if(lockReason)return `<div class=\"notice warn\"><strong>No external response is expected yet.</strong><br>${esc(lockReason)} Complete the prerequisite work before sending a controlling instruction or pasting final JSON.</div>`;if([23,24].includes(Number(n))&&!currentReviewerContext(n))return `<div class=\"notice warn\"><strong>No external response is expected yet.</strong><br>Register a fresh independent reviewer context using the control shown for this stage. Do not send work or paste final JSON until the application creates the controlling reviewer prompt.</div>`;if(requests.length||n===1&&!current.stages[1].responseDraft)return",
          )
      - name: Remove one-time repair workflow and commit
        run: |
          git rm .github/workflows/one-time-runtime-prompt-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js prompt-engine.js
          git commit -m "Fix one-time intake and locked reviewer guidance"
          git push origin HEAD:fix/runtime-prompt-flow-20260830
