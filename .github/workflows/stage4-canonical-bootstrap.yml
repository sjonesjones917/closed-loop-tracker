name: Isolated Stage 04 canonical reuse proof
on:
  push:
    branches:
      - fix/stage4-canonical-reuse-proofed
permissions:
  contents: write
jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-canonical-reuse-proofed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash .stage4-bootstrap.sh
