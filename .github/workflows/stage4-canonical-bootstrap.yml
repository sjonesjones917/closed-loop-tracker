name: Isolated Stage 04 canonical reuse proof
on:
  push:
    branches:
      - fix/stage4-canonical-reuse-proofed
permissions:
  contents: write
jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-canonical-reuse-proofed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run proof against final repository shape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.stage4-bootstrap.sh')
          text=p.read_text()
          replacements={
            "'OBJECTIVE','REQUIREMENT','MUST'":"'REQUIREMENT','REQUIREMENT','MUST'",
            "'OUTPUT_CONSTRAINT','REQUIREMENT','MUST'":"'CONSTRAINT','REQUIREMENT','MUST'",
            "'TEMPORAL_CONSTRAINT','REQUIREMENT','MUST'":"'CONSTRAINT','REQUIREMENT','MUST'",
            "'SOURCE_CONSTRAINT','REQUIREMENT','MUST'":"'CONSTRAINT','REQUIREMENT','MUST'",
            "'AUTHORITY_CONTEXT','CONTEXT','CONTEXT'":"'REFERENCE','CONTEXT_ONLY','FACTUAL'",
            "'CAPABILITY_CONTEXT','CONTEXT','CONTEXT'":"'FACT','CONTEXT_ONLY','FACTUAL'",
            "'SUPPLIED_MATERIAL','CONTEXT','CONTEXT'":"'REFERENCE','CONTEXT_ONLY','FACTUAL'",
          }
          for old,new in replacements.items():
              if text.count(old)!=1:
                  raise SystemExit(f'bootstrap enum mapping anchor mismatch: {old} -> {text.count(old)}')
              text=text.replace(old,new)
          needle="p.write_text(text.replace(old,new))"
          injected="""text=text.replace(old,new)
stage4_old=\"The agent compiles the requirement specification from the canonical Stage 01 intent statements, Stage 03 candidate requirements, and accepted external-source research. The original intent file is prohibited and must not be attached or resent.\"
stage4_new=\"Stage 04 uses the current User Job Input, accepted Stage 01 job definition, canonical Stage 01 intent statements, and accepted Stage 03 findings already stored by the application. Do not attach or resend the original intent file. The agent compiles the requirement specification from those current canonical inputs and accepted external-source research.\"
if text.count(stage4_old)!=1: raise SystemExit(f'app-core Stage 04 guidance anchor count={text.count(stage4_old)}')
p.write_text(text.replace(stage4_old,stage4_new))"""
          if text.count(needle)!=1:
              raise SystemExit(f'bootstrap app-core write anchor mismatch: {text.count(needle)}')
          text=text.replace(needle,injected)
          p.write_text(text)
          PY
          rm -f .github/workflows/stage4-canonical-bootstrap.yml
          sed -i "s#^rm \.github/workflows/stage4-canonical-bootstrap\.yml \.stage4-bootstrap\.sh#rm -f .github/workflows/stage4-canonical-bootstrap.yml .stage4-bootstrap.sh#" .stage4-bootstrap.sh
          bash .stage4-bootstrap.sh
