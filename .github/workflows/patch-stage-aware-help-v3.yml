name: Patch stage-aware help v3
on:
  push:
    branches: ['patch/stage-aware-help-v2']
    paths: ['.github/workflows/patch-stage-aware-help-v3.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Install stage-aware help v3 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'patch/stage-aware-help-v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply stage-aware guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('app-core.js'); s=app.read_text()
          insert=r'''
          function stageHelpMarkup(n){
            const supplied=String(current.job.SUPPLIED_MATERIALS_INVENTORY||'').trim();
            const materialGuidance={
              1:()=>`If the job names supplied project files and ChatGPT does not already have those exact files in the current chat, attach them with the Stage 01 instruction so the agent can use them for intake.${supplied?` Supplied Materials / Files: ${supplied}`:''} Do not re-upload files that remain accessible in the same chat.`,
              2:()=>`Attach or otherwise make available every human-supplied project artifact that Stage 02 must inventory or inspect. The prompt text does not give ChatGPT the file bytes.${supplied?` Required supplied material(s) for this job: ${supplied}`:' Use every supplied project material listed in User Job Input.'}`,
              10:()=>`Provide the exact candidate component files selected for the freeze whenever the agent must inspect those bytes. Use the exact files identified by the application; do not substitute revised copies.`,
              11:()=>`Provide the exact frozen candidate package required for the selected run. Every run must receive the identical frozen package.`,
              12:()=>`Provide the exact run output, candidate files, test fixtures, or other artifacts required by the current accepted test definitions. If a test requires byte-backed evidence, the agent must actually receive those bytes before claiming execution.`,
              17:()=>`For an operation that executes, verifies, compares, or corrects the candidate, provide the exact corrected candidate/package and any required test artifacts identified by that operation.`,
              19:()=>`Provide the exact unchanged frozen candidate/package and any test or regression artifacts required by the selected confirmation operation. Do not substitute changed files.`,
              20:()=>`Provide the exact approved component files being frozen into the production baseline whenever byte inspection is required.`,
              21:()=>`Provide the approved baseline files/materials needed to generate the finished product. The agent must generate from those exact approved inputs, not reconstructed or remembered versions.`,
              22:()=>`Provide the exact finished-product files plus any deterministic test artifacts required by the accepted tests.`,
              23:()=>`Provide the exact finished-product files being reviewed. Also provide any source or requirement artifact whose content is not already available through the prompt/context and is needed for the meaning comparison.`,
              24:()=>`Provide the exact finished-product files under adversarial review and any regression fixtures or supporting artifacts required by the accepted tests.`,
              25:()=>`Provide every exact delivery file and rendered/packaged representation that must be inspected. The agent cannot inspect a file it does not actually have.`,
              26:()=>`Provide the exact finished-product or evidence artifacts the reconciliation operation must inspect when their bytes are not already available to the agent.`,
              27:()=>`Provide any exact product/evidence artifacts required to support the release-gate determination when the decision depends on their contents rather than canonical records alone.`,
              28:()=>`Provide the exact audited release files and the exact delivery files whose identity is being verified. Byte-for-byte identity cannot be established from filenames or claimed hashes alone.`
            };
            const extra=materialGuidance[n]?.();
            return `<details class="record-card stage-help"><summary><span>? How to use this stage</span><span>Guide</span></summary><div class="record-body"><ol><li><strong>Send the current instruction to ChatGPT.</strong> Keep using the same chat for this stage.</li>${extra?`<li><strong>Include the required files/materials with the prompt.</strong> ${esc(extra)}</li>`:''}<li><strong>Answer the agent normally.</strong> If it needs a human-only fact or decision, answer in ChatGPT and continue there until the stage is ready for final JSON.</li><li><strong>Paste only the final JSON here.</strong> Then Parse / validate and review the proposal before accepting it.</li></ol><p class="section-intro">If later research or verification reveals a new human-only decision, the agent may ask then. If a rejected response is replaced, parse the replacement again before treating it as evaluated.</p></div></details>`;
          }
          '''
          if 'function stageHelpMarkup(n)' not in s:
              marker='function provenanceMarkup(n)'; assert marker in s; s=s.replace(marker,insert+'\n'+marker)
          old='${humanStageMarkup(n,locked)}${clarificationMarkup(n,locked)}${operationMarkup(n,locked)}${runBatchMarkup(n)}${testExecutionGuidanceMarkup(n)}<div class="panel"><h2 class="section-title">Agent loop</h2><div class="operator-loop" aria-label="Normal stage workflow"><div class="operator-step"><b>1</b><span>Send instruction</span></div><div class="operator-step"><b>2</b><span>Answer agent questions</span></div><div class="operator-step"><b>3</b><span>Paste final JSON</span></div><div class="operator-step"><b>4</b><span>Validate and review</span></div></div></div><div class="panel"><h2 class="section-title">Generated instruction</h2>'
          new='${humanStageMarkup(n,locked)}${clarificationMarkup(n,locked)}${operationMarkup(n,locked)}${runBatchMarkup(n)}${testExecutionGuidanceMarkup(n)}${stageHelpMarkup(n)}<div class="panel"><h2 class="section-title">Generated instruction</h2>'
          if old in s:s=s.replace(old,new)
          app.write_text(s)

          idx=Path('index.html'); t=idx.read_text(); start='<div class="app-help"><details><summary><b>?</b> How to use this stage</summary>'
          if start in t:
              a=t.index(start); b=t.index('<main>',a); t=t[:a]+t[b:]
          t=re.sub(r'([A-Za-z0-9._-]+\.js)\?v=[^\"\']+',r'\1?v=runtime-stage-aware-help-v3',t); idx.write_text(t)

          sem=Path('verify-prompt-semantics.mjs'); q=sem.read_text()
          oldq="if(!ui.includes('Stage 01 is an intake conversation')||!ui.includes('remaining human-only questions in normal chat')||!ui.includes('HUMAN_INPUT_REQUIRED in this app is only a fallback')||!ui.includes('Answer agent questions')||!ui.includes('Paste final JSON'))throw new Error('Stage 01 operator UI does not explain the human conversation and final JSON handoff.');"
          if oldq in q:q=q.replace(oldq,"if(!ui.includes('Stage 01 is an intake conversation')||!ui.includes('remaining human-only questions in normal chat')||!ui.includes('HUMAN_INPUT_REQUIRED in this app is only a fallback')||!ui.includes('? How to use this stage')||!ui.includes('Paste only the final JSON here'))throw new Error('Stage 01 operator UI does not explain the human conversation and final JSON handoff.');\n if(!ui.includes('The prompt text does not give ChatGPT the file bytes')||!ui.includes('Required supplied material(s) for this job'))throw new Error('Stage 02 guide does not tell the human to provide the supplied project artifact.');\n if(ui.includes('<h2 class=\\\"section-title\\\">Agent loop</h2>'))throw new Error('Redundant Agent loop section still exists.');")
          sem.write_text(q)

          browser=Path('verify-browser.mjs'); q=browser.read_text()
          q=q.replace("assert(await evalValue(cdp,`Boolean(document.querySelector('.app-help details')&&!document.querySelector('.app-help details').open)`),'Human guide must exist and start collapsed.');","await openStage(cdp,2);assert(await evalValue(cdp,`Boolean(document.querySelector('.stage-help')&&!document.querySelector('.stage-help').open)`),'Stage guide must exist and start collapsed.');")
          q=q.replace("['Independent external sources only.','closed-loop-stage-response/2','PROMPT IDENTITY','Parse / validate response','Send instruction','Answer agent questions','Paste final JSON','Validate and review','Expand preview','exact controlling copy block','Complete JSON only']","['Independent external sources only.','closed-loop-stage-response/2','PROMPT IDENTITY','Parse / validate response','How to use this stage','The prompt text does not give ChatGPT the file bytes','Required supplied material(s) for this job','Expand preview','exact controlling copy block','Complete JSON only']")
          q=q.replace("['Stage 01 is an intake conversation','remaining human-only questions in normal chat','COPY BLOCK — STAGE 01 — INITIALIZE THE JOB','HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE','Answer agent questions','Paste final JSON']","['Stage 01 is an intake conversation','remaining human-only questions in normal chat','COPY BLOCK — STAGE 01 — INITIALIZE THE JOB','HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE','How to use this stage','Paste only the final JSON here']")
          q=q.replace("await openStage(cdp,2);let text=(await snapshot(cdp)).text;for(const token of ","await openStage(cdp,2);await evalValue(cdp,`document.querySelector('.stage-help').open=true`);let text=(await snapshot(cdp)).text;for(const token of ",1)
          q=q.replace("await openStage(cdp,1);text=(await snapshot(cdp)).text;for(const token of ","await openStage(cdp,1);await evalValue(cdp,`document.querySelector('.stage-help').open=true`);text=(await snapshot(cdp)).text;for(const token of ",1)
          browser.write_text(q)
          PY
      - name: Verify changed source
        run: |
          node --check app-core.js
          node --check verify-browser.mjs
          node --check verify-prompt-semantics.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/help-v3-http.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          kill "$PID" 2>/dev/null || true; trap - EXIT
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js index.html verify-prompt-semantics.mjs verify-browser.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Add stage-aware artifact handoff guidance'
          git push origin HEAD:'patch/stage-aware-help-v2'
