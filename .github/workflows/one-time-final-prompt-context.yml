name: One-time final prompt context repair
on:
  push:
    branches: ["fix/prompt-context-main-38"]
    paths: [".github/workflows/one-time-final-prompt-context.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/prompt-context-main-38"
          fetch-depth: 0
      - run: python3 repair_prompt_context.py
      - run: |
          rm .github/workflows/one-time-final-prompt-context.yml repair_prompt_context.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-engine.js index.html .github/workflows/one-time-final-prompt-context.yml repair_prompt_context.py
          git commit -m "Complete all-stage prompt context handoff"
          git push origin HEAD:fix/prompt-context-main-38
