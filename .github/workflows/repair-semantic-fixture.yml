name: Repair semantic evidence regression fixture
on:
  push:
    branches: [fix/monotonic-zero-loss-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct regression fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-semantic-invariant.mjs'); text=p.read_text(encoding='utf-8')
          replacements={
            "const agentOnlyHuman=record('verification',{EXACT_EVIDENCE:'An agent claims a human inspected it.'});":"const agentOnlyHuman=record('verification',{EXACT_EVIDENCE:'An agent claims a human inspected it.',RUN_ID:'RUN-HUMAN-AGENT',CONTEXT_ID:'CTX-HUMAN-AGENT'});",
            "const actualHuman=record('verification',{EXACT_EVIDENCE:'EVIDENCE-HUMAN'},{evidenceRefs:['EVIDENCE-HUMAN']});":"const actualHuman=record('verification',{EXACT_EVIDENCE:'EVIDENCE-HUMAN',RUN_ID:'RUN-HUMAN-OBSERVED',CONTEXT_ID:'CTX-HUMAN-OBSERVED'},{evidenceRefs:['EVIDENCE-HUMAN']});"
          }
          for old,new in replacements.items():
              if new not in text:
                  if text.count(old)!=1: raise SystemExit(f'fixture insertion count {text.count(old)}')
                  text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Prove semantic evidence regression
        run: |
          set -euo pipefail
          node --check verify-semantic-invariant.mjs
          node verify-semantic-invariant.mjs
      - name: Commit accepted regression correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-semantic-fixture.yml .github/workflows/repair-human-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Isolate human evidence authority regression"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
