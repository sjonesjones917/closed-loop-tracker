name: One-time current file-first reconciliation
on:
  push:
    branches: [codex/spec-response-file-binding]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/spec-response-file-binding
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply marker-checked authoritative exchange repair
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=44982136c959ca28c6b308540e3f2e8fac5e1266
          git fetch --no-tags origin "$SOURCE"
          for f in repair-authoritative-exchange.py repair-authoritative-exchange-v2.py repair-authoritative-exchange-v3.py repair-authoritative-exchange-v4.py; do
            git show "$SOURCE:$f" > "/tmp/$f"
          done
          cp /tmp/repair-authoritative-exchange*.py .
          python3 -m py_compile repair-authoritative-exchange-v4.py
          python3 repair-authoritative-exchange-v4.py
      - name: Prove syntax architecture and file-first contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          node verify-reservation-contract.mjs
          node verify-file-first-response.mjs
          node verify-file-first-operator.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
      - name: Complete source proof suite
        shell: bash
        run: |
          set -euo pipefail
          node verify-deployment-manifest.mjs
          node verify-mobile-release-governance.mjs
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          node verify-semantic-invariant.mjs
      - name: Local Chromium operator path
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-human-stage-walkthrough.mjs
          node verify-mobile-stage-action.mjs
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only permanent repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          rm -f repair-authoritative-exchange.py repair-authoritative-exchange-v2.py repair-authoritative-exchange-v3.py repair-authoritative-exchange-v4.py
          rm -f .github/workflows/one-time-transplant-file-first-current.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git diff --cached --quiet && { echo 'No proven repair diff produced'; exit 1; }
          git commit -m 'Conform authoritative file-first exchange contracts'
          git push origin HEAD:codex/spec-response-file-binding