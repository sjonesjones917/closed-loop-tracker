name: Generic long-section scroll controls

on:
  push:
    branches:
      - fix/generic-long-section-scroll-controls-20260827

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generic-long-section-scroll-controls-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal generic long-section scroll correction
        run: |
          node --check .tmp-generic-long-section-scroll-fix.mjs
          node .tmp-generic-long-section-scroll-fix.mjs
      - name: Verify complete application and generic long-section navigation
        shell: bash
        run: |
          set -euo pipefail
          node --check hash.js
          node --check verify-browser.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only the verified minimal correction
        shell: bash
        run: |
          set -euo pipefail
          rm .tmp-generic-long-section-scroll-fix.mjs
          rm .github/workflows/generic-long-section-scroll-fix.yml
          git config user.name "sjonesjones917"
          git config user.email "sjones.jones917@gmail.com"
          git add hash.js index.html verify-browser.mjs .tmp-generic-long-section-scroll-fix.mjs .github/workflows/generic-long-section-scroll-fix.yml
          git commit -m "Add matched navigation to every long record section"
          git push origin HEAD:fix/generic-long-section-scroll-controls-20260827
