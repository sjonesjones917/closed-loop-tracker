name: one-time-routed-operation-repair
on:
  push:
    branches:
      - repair/scope-authority-20260902
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[routed-operations-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node repair-routed-operations.mjs
      - run: |
          node --check workflow-schema.js
          node verify-operation-scope-authority.mjs
          node verify-spec-grounded-route-oracle.mjs
          node verify-v3-contract.mjs
      - run: |
          rm repair-routed-operations.mjs .github/workflows/repair-routed-operations.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js verify-operation-scope-authority.mjs repair-routed-operations.mjs .github/workflows/repair-routed-operations.yml
          git commit -m 'Preserve dual-route operation authority [routed-operations-repaired]'
          git push origin HEAD:repair/scope-authority-20260902
