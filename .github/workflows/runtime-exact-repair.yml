name: One-time exact Test IR runtime repair

on:
  push:
    branches: [fix/controlling-amendment-53-70]

permissions:
  contents: write

jobs:
  integrate-and-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/controlling-amendment-53-70
          fetch-depth: 0
      - name: Apply exact runtime correction and preserve regressions
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .repair-runtime-exact.patch.gz.b64 | gzip -d > /tmp/runtime-exact.patch
          git apply --check /tmp/runtime-exact.patch
          git apply /tmp/runtime-exact.patch
          node --check test-runtime.js
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
      - name: Remove one-time repair authority and commit owner-file correction
        shell: bash
        run: |
          set -euo pipefail
          rm .repair-runtime-exact.patch.gz.b64 .github/workflows/runtime-exact-repair.yml
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add test-runtime.js verify-test-runtime-v3.mjs .repair-runtime-exact.patch.gz.b64 .github/workflows/runtime-exact-repair.yml
          git commit -m "Implement exact registered Test IR semantics"
          git push origin HEAD:fix/controlling-amendment-53-70
