name: Restore prompt experience
'on': [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch prompt engine only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/53';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';",1)
          marker="${projectDataExecutionRule(stage)}\\\n"
          protocol="""HUMAN COLLABORATION MODE — APPLIES TO EVERY EXTERNAL-AGENT STAGE\
CONVERSATION PRECEDENCE — HUMAN EXPERIENCE IS PART OF EXECUTION\
- Treat this prompt as the complete instruction for performing the current stage, not merely as a schema for producing JSON. First do the stage work completely. The final JSON is only the machine handoff after that work is complete.\
- Work with the human as a normal conversational agent. When a value, fact, preference, observation, authorization, or decision can only come from the human and is not already present in the supplied current context, ask the human directly in concise plain language in this same conversation and WAIT for the answer. Do not emit final JSON in that turn.\
- Continue the same conversation from each human answer until the current stage is semantically complete. Ask only genuinely useful human-only questions. Do not interrogate the human for facts already present in current canonical context, captured Stage 01 input, supplied material already inspected and captured, accepted prior-stage records, or information reliably obtainable through authorized research/tools.\
- The human supplies project information once. Never ask the human to restate, retype, summarize, or reattach information or material that the application has already captured and supplied in this prompt. Reuse the complete current canonical capture.\
- If the human says an ask-now nonblocking item is unknown or deferred, preserve that fact exactly and continue when the stage can otherwise complete. Never silently invent an answer.\
- humanInputRequests is NOT the normal conversation channel. It is only the strict final-response fallback for unresolved human input when the final response contract requires it. Conversational questions are ordinary chat, not JSON.\
- If a later stage discovers a genuinely new human-only fact or decision that could not have been known earlier, ask it at that later stage. Do not force the user to anticipate later discoveries.\
- If this prompt lists files that you must receive, do not pretend you received or inspected them. Ask the human to attach/send the exact listed file when the bytes are actually required in this external context, then inspect those bytes before proceeding. If the application states the bytes are unavailable, say exactly that and follow the stage's blocked/fallback rule.\
- Do not confuse application-local custody with transfer to this conversation. A filename, artifact ID, metadata record, or hash is not the file bytes.\
- Do not prematurely produce a sparse or placeholder DATA_PROPOSAL merely because the JSON schema can be filled. Semantic completeness controls when final JSON is allowed.\
- Before final JSON, re-read the complete current-stage instruction and current context and verify that every required stage obligation has actually been performed, every required input has been used, every required item has been accounted for, and no prohibited later-stage work was performed.\
- When the stage is ready, return exactly one complete strict JSON object and no surrounding prose. The user must never be asked to repair agent JSON. Use ASCII U+0022 double quotation marks, valid escaping, only contract-declared keys, and self-check that the final text parses as JSON before sending it.\
\
"""
          if marker not in s: raise SystemExit('body insertion marker not found')
          s=s.replace(marker,marker+protocol,1)
          old='Perform complete human-authority intake only. Exhaust the human-authority intake before Stage 01 can complete:'
          new='''Perform complete human-authority intake only. This stage is an actual conversational intake, not a JSON-form-filling exercise. Exhaust the human-authority intake before Stage 01 can complete: BEFORE producing any final Stage 01 JSON, read the complete user request and all current Stage 01 context, determine what the requested outcome actually is, identify every supplied material the user says exists, and conduct the necessary human conversation until the job definition is complete. If the user identified a file/material whose bytes are required to understand the objective, deliverable, constraints, acceptance conditions, or other human authority and those bytes have not actually been received in this conversation, explicitly ask the human to attach/send that exact material and wait; do not proceed as though the file were inspected. If the application has already supplied the material's captured contents from an earlier accepted intake, use that captured content and do not request the file again. For every missing issue, classify it exactly as BLOCKING_NOW, ASK_NOW_NONBLOCKING, or LATER_RESOLVABLE. BLOCKING_NOW means human-only and required to define the objective, intended deliverable, or input boundary: ask now and wait. ASK_NOW_NONBLOCKING means human-only and foreseeably needed to achieve the requested outcome: ask now and wait, but unknown/deferred is an acceptable human answer. LATER_RESOLVABLE means obtainable from supplied material, authorized research/tools, or a later stage: do not ask the human now. Nonblocking never means optional-to-ask. Ask every foreseeable human-only BLOCKING_NOW and ASK_NOW_NONBLOCKING item in concise ordinary language before final JSON. Do not hide an unasked human-only issue in UNKNOWN_INFORMATION. Do not start by emitting JSON when conversation or a required file transfer is still needed. The Stage 01 agent must understand the project well enough that later stages do not need the human to resupply the original intent. capture every materially relevant fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue present in current user input or accessible supplied materials.'''
          if old not in s: raise SystemExit('Stage 01 target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          for name in ['index.html','app-core.js']:
              q=Path(name); q.write_text(q.read_text().replace('runtime-20260830-live-operator-59','runtime-20260830-live-operator-60'))
          PY
          rm -f .github/workflows/apply-prompt-ux-restoration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-engine.js index.html app-core.js .github/workflows
          git commit -m "Restore complete conversational execution contract in every prompt"
          git push origin HEAD:${GITHUB_REF_NAME}