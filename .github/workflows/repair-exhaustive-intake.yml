name: One-time exhaustive intake repair

on:
  push:
    branches:
      - fix/exhaust-stage1-stage3-stage4

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaust-stage1-stage3-stage4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Stage 01, 03, and 04 prompt semantics
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('prompt-engine.js','utf8');
          const replaceRegexOnce=(re,to,label)=>{
            const matches=[...s.matchAll(new RegExp(re.source,re.flags.includes('g')?re.flags:re.flags+'g'))];
            if(matches.length!==1) throw new Error(`${label}: expected exactly one anchor, found ${matches.length}`);
            s=s.replace(re,to);
          };
          replaceRegexOnce(/Do not block Stage 01 merely because information will be needed by a later research, design, production, filing, verification, or execution stage\.\s*Record such later-needed information in UNKNOWN_INFORMATION and let the earliest stage that actually requires it resolve it\./,
            "Stage 01 MUST NOT complete until human authority is exhausted for the project definition: every foreseeable human-only fact, requirement, constraint, prohibition, acceptance condition, decision, material reference, and human-only uncertainty relevant to the requested outcome must already be supplied, asked and answered, or asked and explicitly deferred. Facts that are genuinely obtainable from supplied material, authorized research, or a later deterministic stage are LATER_RESOLVABLE and MUST NOT be re-asked of the human. Record only later-resolvable non-human-authority matters in UNKNOWN_INFORMATION; never use UNKNOWN_INFORMATION to hide an unasked foreseeable human-only question.",
            'Stage 01 exhaustion rule');
          replaceRegexOnce(/Repeat discovery passes until saturation is actually supported by the evidence\./,
            "Stage 03 MUST NOT complete on a vague claim of saturation. Exhaust the accepted Stage 02 source set: every current Stage 02 source must have current research coverage unless Stage 02 established NO_APPLICABLE_EXTERNAL_SOURCE; every applicable portion must be examined deeply enough to extract mandatory statements, recommendations, optional practices, examples, explanatory material, prohibitions, exceptions, dependencies, applicability facts, restrictions, invalidating material, and candidate obligations; every active Stage 01 intent statement classified REQUIREMENT must have at least one candidate requirement without weakening its meaning; conflict and exception passes must be complete; every research gap or blocker must be explicit. Continue passes until the latest pass discovers no new material category and the evidence supports closure.",
            'Stage 03 exhaustion rule');
          replaceRegexOnce(/Compile atomic requirement proposals only from the canonical Stage 01 intentStatements ledger, Stage 03 candidateRequirements, and legitimately applicable Stage 03 external-source research\./,
            "Stage 04 may begin only from closed upstream authority: Stage 01 human-authority intake must be complete and fully accounted, and Stage 03 research must be complete for every current Stage 02 source or supported NO_APPLICABLE_EXTERNAL_SOURCE. The application must supply the complete Stage 04 input union in this prompt: current User Job Input + accepted Stage 01 job definition + every active canonical Stage 01 intent statement + obligations extracted from accessible supplied project material + accepted Stage 03 research + every Stage 03 candidate requirement + applicable source identities and evidence. Compile atomic requirement proposals from that complete application-selected obligation universe; do not rediscover, request, reattach, or ask the human to retransmit any already captured project information.",
            'Stage 04 complete-union rule');
          replaceRegexOnce(/EXECUTABLE_KIND = CUSTOM_PIPELINE/,'EXECUTABLE_KIND = TEST_IR','Test IR executable kind');
          replaceRegexOnce(/const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine\/26';/,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/27';",'prompt engine version');
          fs.writeFileSync('prompt-engine.js',s);
          NODE
      - name: Strengthen permanent regression proof
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('verify-one-time-intent-intake.mjs','utf8');
          const anchor="assert(stage1.prompt.includes('one intentStatements record for every atomic statement'),'Stage 01 prompt does not require exhaustive statement capture.');";
          if(!s.includes(anchor)) throw new Error('Stage 01 regression anchor missing');
          s=s.replace(anchor,anchor+"\nassert(stage1.prompt.includes('Stage 01 MUST NOT complete until human authority is exhausted'),'Stage 01 prompt still permits incomplete human-authority intake.');\nassert(!stage1.prompt.includes('Do not block Stage 01 merely because information will be needed by a later research'),'Stage 01 prompt still contains the old weakening rule.');");
          const loop="for(const stage of [3,4]){";
          if(!s.includes(loop)) throw new Error('Stage 3/4 prompt regression anchor missing');
          s=s.replace(loop,"const stage3Exhaustive=prompts.buildPromptRecord(3,p);\nassert(stage3Exhaustive.prompt.includes('Stage 03 MUST NOT complete on a vague claim of saturation'),'Stage 03 prompt does not require exhaustive source research.');\nassert(stage3Exhaustive.prompt.includes('every current Stage 02 source must have current research coverage'),'Stage 03 prompt does not require full current-source coverage.');\nconst stage4Union=prompts.buildPromptRecord(4,p);\nassert(stage4Union.prompt.includes('Stage 01 human-authority intake must be complete and fully accounted'),'Stage 04 prompt does not require closed Stage 01 input.');\nassert(stage4Union.prompt.includes('Stage 03 research must be complete for every current Stage 02 source'),'Stage 04 prompt does not require closed Stage 03 research.');\nassert(stage4Union.prompt.includes('current User Job Input + accepted Stage 01 job definition + every active canonical Stage 01 intent statement'),'Stage 04 prompt does not enumerate the complete upstream union.');\nassert(stage4Union.prompt.includes('do not rediscover, request, reattach, or ask the human to retransmit any already captured project information'),'Stage 04 prompt still permits repeated user input.');\nfor(const required of ['intentStatements','research','candidateRequirements','sources'])assert(schema.STAGE_CONTRACTS[4].readCollections.includes(required),'Stage 04 read contract omits '+required+'.');\nfor(const stage of [3,4]){");
          fs.writeFileSync('verify-one-time-intent-intake.mjs',s);

          let v=fs.readFileSync('verify-prompt-semantics.mjs','utf8');
          const obsolete="'Do not block Stage 01 merely because information will be needed by a later'";
          const replacement="'Stage 01 MUST NOT complete until human authority is exhausted'";
          const count=v.split(obsolete).length-1;
          if(count!==1)throw new Error(`Obsolete Stage 01 verifier token expected once, found ${count}`);
          v=v.replace(obsolete,replacement);
          const oldVersion="prompts.version!=='closed-loop-prompt-engine/26'";
          const newVersion="prompts.version!=='closed-loop-prompt-engine/27'";
          const versionCount=v.split(oldVersion).length-1;
          if(versionCount!==1)throw new Error(`Obsolete prompt-version assertion expected once, found ${versionCount}`);
          v=v.replace(oldVersion,newVersion);
          fs.writeFileSync('verify-prompt-semantics.mjs',v);
          NODE
      - name: Prove no visual changes
        run: |
          git diff --exit-code 69add6a0548eeb89cb0b6e666147008edef7662d -- index.html
      - name: Run intake and prompt regressions
        run: |
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node --check prompt-engine.js
      - name: Commit repaired runtime and regressions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js verify-one-time-intent-intake.mjs verify-prompt-semantics.mjs
          git commit -m "Exhaust Stage 01 and 03 before Stage 04 compilation"
          git push origin HEAD:fix/exhaust-stage1-stage3-stage4
