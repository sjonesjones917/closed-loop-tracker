name: Verify semantic reliability repairs

on:
  push:
    branches:
      - reliability/semantic-current-scope-integrity-20260826

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimum repairs
        run: |
          python3 .github/semantic-patch.py
          python3 .github/semantic-freeze-binding.py
          python3 .github/semantic-migration-history.py
      - name: Check workflow engine syntax
        run: node --check workflow-engine.js
      - name: Check project store syntax
        run: node --check project-store.js
      - name: Hash verification
        run: node verify-hash.mjs
      - name: Source/schema verification
        run: node verify.mjs
      - name: Ingestion verification
        run: node verify-ingestion.mjs
      - name: Gate verification
        run: node verify-complete.mjs
      - name: Full-cycle verification
        run: node verify-full-cycle.mjs
      - name: Prompt semantic verification
        run: node verify-prompt-semantics.mjs
      - name: Primary Chromium verification
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http-primary.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node verify-browser.mjs
      - name: Extended Chromium persistence and recovery verification
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http-extra.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node verify-browser-extra.mjs
      - name: Commit verified permanent files and remove temporary repair paths
        run: |
          git config user.name "closed-loop-reliability-bot"
          git config user.email "closed-loop-reliability-bot@users.noreply.github.com"
          git rm .github/semantic-patch.py .github/semantic-freeze-binding.py .github/semantic-migration-history.py .github/workflows/semantic-minimum-fix.yml .github/workflows/semantic-repair-final.yml
          git add workflow-engine.js project-store.js app-core.js verify-complete.mjs verify-browser.mjs verify-browser-extra.mjs
          git commit -m "Close iteration, regression, version, identity, and storage semantics"
          git push origin HEAD:reliability/semantic-current-scope-integrity-20260826
