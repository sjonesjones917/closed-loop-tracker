name: Temporary operator flow repair
on:
  push:
    branches:
      - repair/operator-flow-20260830
    paths:
      - .github/workflows/temporary-operator-flow-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/operator-flow-20260830
          fetch-depth: 0
      - name: Apply exact corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          prompt = Path('prompt-engine.js')
          s = prompt.read_text()
          old = "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/29';"
          if old not in s:
              raise SystemExit('Unexpected prompt-engine version')
          s = s.replace(old, "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/30';", 1)
          old = "1:'ONE-TIME INTENT FILE INTAKE: The original intent file is authorized only in Stage 01."
          if old not in s:
              raise SystemExit('Stage 01 intake text not found')
          s = s.replace(old, "1:'ONE-TIME HUMAN INTENT INTAKE: If the user supplied an original intent file or other intent artifact, that supplied material is authorized for direct inspection only in Stage 01.", 1)
          old = "Once the Stage 01 proposal is accepted, the original intent file must never be requested, attached, resent, reopened, or relied on by Stage 02 or any later stage; the canonical intentStatements ledger is the only downstream representation."
          if old not in s:
              raise SystemExit('Stage 01 downstream boundary text not found')
          s = s.replace(old, "Once the Stage 01 proposal is accepted, any original Stage 01 intent file or intent artifact must never be requested, attached, resent, reopened, or relied on by Stage 02 or any later stage; the canonical intentStatements ledger is the only downstream representation.", 1)
          prompt.write_text(s)

          app = Path('app-core.js')
          s = app.read_text()
          if "const RUNTIME_BUILD_ID=" not in s:
              s = s.replace("(()=>{'use strict';\nconst $=", "(()=>{'use strict';\nconst RUNTIME_BUILD_ID='__RUNTIME_BUILD_ID__';\nconst $=", 1)
          old = "function humanStageMarkup(n,locked){if(n===1){if(current.isRetainedTestProject&&current.stages[1].status==='COMPLETE')return `<div class=\"notice success\">Stage 01 is preserved completed history for this retained project. No historical event has been fabricated or rewritten.</div>`;return `<div class=\"panel\"><h2 class=\"section-title\">Human job intake</h2><p class=\"section-intro\">Stage 01 is an intake conversation and the one-time intent-file intake. Save any facts you already know here, then send the generated instruction to ChatGPT with the original intent file attached once. The agent must extract every atomic statement into the canonical intentStatements ledger and ask only the remaining human-only questions in normal chat. After acceptance, never attach or resend the original file. Stay in ChatGPT until it returns the final JSON. HUMAN_INPUT_REQUIRED in this app is only a fallback when a required answer remains unavailable or deferred, or interactive conversation was unavailable.</p><div class=\"button-row\"><button data-view=\"Project\">Open User Job Input</button></div></div>`;}"
          new = "function humanStageMarkup(n,locked){if(n===1){if(current.isRetainedTestProject&&current.stages[1].status==='COMPLETE')return `<div class=\"notice success\">Stage 01 is preserved completed history for this retained project. No historical event has been fabricated or rewritten.</div>`;const supplied=String(current.job.SUPPLIED_MATERIALS_INVENTORY||'').trim();const materialInstruction=supplied?` If the original intent or project material is supplied as a file or attachment, send that same supplied material with the Stage 01 instruction once so the agent can capture it completely. After Stage 01 acceptance, never attach or resend that original Stage 01 material; later stages use the canonical intentStatements ledger.`:` No separate intent file is required unless you actually supplied one as project input; the saved User Job Input is authoritative human input for Stage 01.`;return `<div class=\"panel\"><h2 class=\"section-title\">Human job intake</h2><p class=\"section-intro\">Stage 01 is the complete human-authority intake. Save the facts, requirements, constraints, prohibitions, requested output, acceptance conditions, material references, and human-only decisions you already supplied or know.${materialInstruction} The agent must capture the complete supplied intent, ask only genuinely human-only missing questions in normal conversation, and return final JSON only when Stage 01 is semantically closed. HUMAN_INPUT_REQUIRED in this app is only a fallback when a required answer remains unavailable or deferred, or interactive conversation was unavailable.</p><div class=\"button-row\"><button data-view=\"Project\">Open User Job Input</button></div></div>`;}"
          if old not in s:
              raise SystemExit('Stage 01 UI text not found')
          s = s.replace(old, new, 1)
          old = "function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1);if(accepted)"
          new = "function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1);if([23,24].includes(Number(n))&&!currentReviewerContext(n))return `<div class=\"notice warn\"><strong>Open a fresh independent reviewer context first.</strong><br>Do not paste final JSON yet. Register the new reviewer context above; only then can the application bind and expose the controlling reviewer instruction.</div>`;if(accepted)"
          if old not in s:
              raise SystemExit('Interaction mode function not found')
          s = s.replace(old, new, 1)
          old = "new Worker('test-worker.js')"
          if old in s:
              s = s.replace(old, "new Worker(`test-worker.js?v=${RUNTIME_BUILD_ID}`)", 1)
          app.write_text(s)

          # One shared cache identity for every runtime script and the worker.
          h = hashlib.sha256()
          for name in ['prompt-engine.js', 'app-core.js']:
              h.update(Path(name).read_bytes())
          token = 'runtime-' + h.hexdigest()[:16]
          app.write_text(app.read_text().replace('__RUNTIME_BUILD_ID__', token))
          index = Path('index.html')
          html = re.sub(r'runtime-[0-9a-f]{16}', token, index.read_text())
          index.write_text(html)
          print(token)
          PY
          git rm .github/workflows/temporary-operator-flow-repair.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add prompt-engine.js app-core.js index.html
          git commit -m 'Correct Stage 01 intake and independent-review operator flow'
          git push origin HEAD:repair/operator-flow-20260830
