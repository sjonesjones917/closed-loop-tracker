name: One-time native verification repair
on:
  push:
    branches: [fix/subject-neutral-native-verification]
    paths: [.github/workflows/closed-loop-native-test-repair.yml]
permissions: {contents: write}
concurrency: {group: one-time-native-verification-repair, cancel-in-progress: false}

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subject-neutral-native-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal subject-neutral native verification patch
        run: node .closed-loop-native-test-repair.mjs
      - name: Prove repaired source before committing
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-definition-of-done.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-definition-of-done.mjs
      - name: Commit only the finished application change
        run: |
          rm .closed-loop-native-test-repair.mjs .github/workflows/closed-loop-native-test-repair.yml
          git config user.name closed-loop-ci
          git config user.email closed-loop-ci@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Add subject-neutral native verification execution"
          git push origin HEAD:fix/subject-neutral-native-verification
