name: One-time native verification repair
on:
  push:
    branches: [fix/subject-neutral-native-verification]
    paths: [.github/workflows/closed-loop-native-test-repair.yml]
permissions: {contents: write}
concurrency: {group: one-time-native-verification-repair, cancel-in-progress: false}

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subject-neutral-native-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal subject-neutral native verification patch
        run: |
          node .repair-native-anchor.mjs
          node .repair-native-ui-copy.mjs
          node .closed-loop-native-test-repair.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const identity=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of runtimeFiles)html=html.replace(new RegExp(`${file.replace('.', '\\.')}\\?v=[^\"]+`,'g'),`${file}?v=${identity}`);
          fs.writeFileSync('index.html',html);
          console.log(identity);
          NODE
          rm -f .repair-error.txt .repair-native-anchor.mjs .repair-native-ui-copy.mjs .closed-loop-native-test-repair.mjs .github/workflows/closed-loop-native-test-repair.yml
      - name: Prove repaired source before committing
        run: |
          set +e
          (
            set -e
            node --check workflow-schema.js
            node --check workflow-engine.js
            node --check prompt-engine.js
            node --check app-core.js
            node --check verify-complete.mjs
            node --check verify-definition-of-done.mjs
            node build-test-project.mjs
            node verify-hash.mjs
            node verify.mjs
            node verify-complete.mjs
            node verify-prompt-semantics.mjs
            node verify-definition-of-done.mjs
          ) > /tmp/native-proof.log 2>&1
          code=$?
          cat /tmp/native-proof.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/native-proof.log .repair-error.txt
            git checkout -- workflow-schema.js workflow-engine.js prompt-engine.js app-core.js index.html verify-complete.mjs verify-definition-of-done.mjs .repair-native-anchor.mjs .repair-native-ui-copy.mjs .closed-loop-native-test-repair.mjs .github/workflows/closed-loop-native-test-repair.yml
            git config user.name closed-loop-ci
            git config user.email closed-loop-ci@users.noreply.github.com
            git add .repair-error.txt
            git commit -m "Capture native verification proof failure" || true
            git push origin HEAD:fix/subject-neutral-native-verification
            exit "$code"
          fi
      - name: Commit only the finished application change
        run: |
          git config user.name closed-loop-ci
          git config user.email closed-loop-ci@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Add subject-neutral native verification execution"
          git push origin HEAD:fix/subject-neutral-native-verification
