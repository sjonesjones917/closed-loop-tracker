name: Apply semantic closure
on:
  push:
    branches:
      - semantic-reliability/f61-final-closure
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 .semantic-closure.py
      - run: |
          node --check workbook.js
          node --check prompt-engine.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - run: |
          rm -f .semantic-closure.py .github/workflows/apply-semantic-closure.yml
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git add -A
          git commit -m 'Close per-run proof and specification fallback semantics'
          git push origin HEAD:semantic-reliability/f61-final-closure
