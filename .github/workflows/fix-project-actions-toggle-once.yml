name: Fix project actions toggle once
on:
  push:
    branches: [fix/project-actions-toggle-20260828]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-actions-toggle-20260828
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal UI repair
        run: |
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          let html=fs.readFileSync('index.html','utf8');
          const oldSummary='<summary>Project actions</summary>';
          const newSummary='<summary id="project-actions-toggle" aria-expanded="false">Project actions</summary>';
          if(!html.includes(oldSummary)) throw new Error('Project actions summary markup not found');
          html=html.replace(oldSummary,newSummary);
          fs.writeFileSync('index.html',html);

          let app=fs.readFileSync('app-core.js','utf8');
          const anchor="$('#project-picker').onchange=async e=>";
          if(!app.includes(anchor)) throw new Error('Static header wiring anchor not found');
          const wiring=`const projectActionsMenu=$('.project-action-menu'),projectActionsToggle=$('#project-actions-toggle');if(projectActionsMenu&&projectActionsToggle){const setProjectActionsOpen=open=>{projectActionsMenu.open=Boolean(open);projectActionsToggle.setAttribute('aria-expanded',String(Boolean(open)));};projectActionsToggle.onclick=event=>{event.preventDefault();const open=!projectActionsMenu.open;setProjectActionsOpen(open);announce(open?'project actions opened':'project actions closed');};document.addEventListener('click',event=>{if(projectActionsMenu.open&&!projectActionsMenu.contains(event.target))setProjectActionsOpen(false);},true);}\n`;
          app=app.replace(anchor,wiring+anchor);
          fs.writeFileSync('app-core.js',app);

          let test=fs.readFileSync('verify-browser-extra.mjs','utf8');
          const testAnchor="  assert(lifecycleUi.headerMenu,'Compact Project actions menu is missing.');\n";
          if(!test.includes(testAnchor)) throw new Error('Browser lifecycle menu assertion not found');
          const browserProof=`  assert(lifecycleUi.headerMenu,'Compact Project actions menu is missing.');\n  await click(cdp,'#project-actions-toggle');await waitExpr(cdp,\`document.querySelector('.project-action-menu')?.open===true&&document.querySelector('#project-actions-toggle')?.getAttribute('aria-expanded')==='true'\`);assert(await evalValue(cdp,\`Boolean(document.querySelector('.project-action-popover')?.offsetParent)\`),'Project actions click did not reveal the action menu.');await click(cdp,'#project-actions-toggle');await waitExpr(cdp,\`document.querySelector('.project-action-menu')?.open===false&&document.querySelector('#project-actions-toggle')?.getAttribute('aria-expanded')==='false'\`);\n`;
          test=test.replace(testAnchor,browserProof);
          fs.writeFileSync('verify-browser-extra.mjs',test);

          let lifecycle=fs.readFileSync('verify-project-lifecycle.mjs','utf8');
          const lifecycleAnchor="assert(html.includes('project-action-menu')&&html.includes('Project actions'),'Routine header actions must remain compact.');";
          if(!lifecycle.includes(lifecycleAnchor)) throw new Error('Lifecycle header assertion not found');
          lifecycle=lifecycle.replace(lifecycleAnchor,"assert(html.includes('project-action-menu')&&html.includes('id=\\\"project-actions-toggle\\\"')&&html.includes('aria-expanded=\\\"false\\\"')&&html.includes('Project actions'),'Routine header actions must remain compact and explicitly operable.');\nassert(app.includes(\"projectActionsToggle.onclick=event=>\")&&app.includes(\"setProjectActionsOpen\"),'Project actions opener must have application-owned toggle behavior.');");
          fs.writeFileSync('verify-project-lifecycle.mjs',lifecycle);

          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          html=fs.readFileSync('index.html','utf8').replace(/runtime-[a-f0-9]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
      - name: Prove exact repair and full deterministic suite
        run: |
          node --check app-core.js
          node --check verify-browser-extra.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          BROWSER=/usr/bin/google-chrome node verify-browser.mjs
          BROWSER=/usr/bin/google-chrome node verify-browser-extra.mjs
      - name: Remove bootstrap and commit final tree
        run: |
          git rm .github/workflows/fix-project-actions-toggle-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make project actions explicitly operable'
          git push origin HEAD:fix/project-actions-toggle-20260828
