name: One-time operation authority final
on:
  push:
    branches: [operation-stage-data-isolation-final-20260826]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operation-stage-data-isolation-final-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply current-source semantic correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Schema is the single authority. Existing prompt/ingestion code already consumes operationContract.allowedStageData.
          p=Path('workflow-schema.js'); s=p.read_text()
          old="STAGE_OPERATIONS[19]=Object.freeze(['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']);"
          new="STAGE_OPERATIONS[19]=Object.freeze(['EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']);"
          if old not in s: raise SystemExit('Stage 19 operation anchor missing')
          s=s.replace(old,new,1)
          old="""const OPERATION_CONTRACT_OVERRIDES=Object.freeze({17:Object.freeze({FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions'],agentWritableCollections:[]}),EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs']}),VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification']}),COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons']}),ROOT_CAUSE:Object.freeze({readCollections:['defects','comparisons','verification'],agentWritableCollections:['defects','rootCauses']}),REGRESSION:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions'],agentWritableCollections:['regressions','regressionExecutions']}),CORRECT:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions','changes'],agentWritableCollections:['changes']})}),19:Object.freeze({CONFIRM_FREEZE:Object.freeze({readCollections:['convergenceRecords','candidateFreezes','iterations'],agentWritableCollections:[]}),EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs']}),VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification']}),COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons']}),REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs'],agentWritableCollections:['regressionExecutions']}),CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','regressionExecutions','candidateFreezes'],agentWritableCollections:['confirmationRecords']})})});
function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};let scopeRequirements=override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[];if((stage===17||stage===19)&&!['EXECUTE_RUN','VERIFY'].includes(operation))scopeRequirements=scopeRequirements.filter(key=>key!=='runId'&&key!=='contextId');return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(scopeRequirements)});}"""
          new="""const OPERATION_CONTRACT_OVERRIDES=Object.freeze({17:Object.freeze({FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions'],agentWritableCollections:[],allowedStageData:['NEW_FROZEN_VERSIONS','OLD_CONVERSATIONS_CONTINUED','RUN_NAMESPACE','IDENTICAL_PACKAGE_CONFIRMED_FOR_ALL_RUNS','PRIOR_OUTPUTS_WITHHELD']}),EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],allowedStageData:[]}),VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],allowedStageData:[]}),COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],allowedStageData:['EXECUTE_COMPLETED','VERIFY_COMPLETED','COMPARE_COMPLETED']}),ROOT_CAUSE:Object.freeze({readCollections:['defects','comparisons','verification'],agentWritableCollections:['defects','rootCauses'],allowedStageData:['ROOT_CAUSE_COMPLETED']}),REGRESSION:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions'],agentWritableCollections:['regressions','regressionExecutions'],allowedStageData:['REGRESSION_TESTS_ADDED']}),CORRECT:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions','changes'],agentWritableCollections:['changes'],allowedStageData:['CORRECTIONS_COMPLETED']})}),19:Object.freeze({EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],allowedStageData:[]}),VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],allowedStageData:[]}),COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],allowedStageData:['CROSS_RUN_COMPARISON_COMPLETED']}),REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs'],agentWritableCollections:['regressionExecutions'],allowedStageData:[]}),CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','regressionExecutions','candidateFreezes'],agentWritableCollections:['confirmationRecords'],allowedStageData:['COMPLETE_TEST_SUITE_RUN','NEW_CRITICAL_DEFECTS','NEW_MAJOR_DEFECTS','NEW_REQUIREMENTS_DISCOVERED','INJECTED_DEFECTS_NOT_DETECTED','NEW_CORRECTNESS_AFFECTING_VARIANCE','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED','REQUIRED_RETURN_STAGE']})})});
function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};let scopeRequirements=override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[];if((stage===17||stage===19)&&!['EXECUTE_RUN','VERIFY'].includes(operation))scopeRequirements=scopeRequirements.filter(key=>key!=='runId'&&key!=='contextId');return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),allowedStageData:Object.freeze(override.allowedStageData||allowedAgentStageFields(stage)),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(scopeRequirements)});}"""
          if old not in s: raise SystemExit('Operation contract anchor missing')
          p.write_text(s.replace(old,new,1))

          # Stage 19 freeze is an application action, not an agent response gate.
          p=Path('workflow-engine.js'); s=p.read_text()
          old="stage===19?['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:[]"
          new="stage===19?['EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:[]"
          if old not in s: raise SystemExit('Stage 19 required operations anchor missing')
          p.write_text(s.replace(old,new,1))

          # Ingestion fixture must honor operation-specific writable collections and prove cross-operation stageData rejection.
          p=Path('verify-ingestion.mjs'); s=p.read_text()
          old="const contract=schema.STAGE_CONTRACTS[stage],operationContract=schema.operationContract(stage,promptRecord.operation),stageFields=operationContract?.allowedStageData||contract.allowedStageData;"
          new="const contract=schema.STAGE_CONTRACTS[stage],operationContract=schema.operationContract(stage,promptRecord.operation),stageFields=operationContract?.allowedStageData||contract.allowedStageData,writableCollections=operationContract?.agentWritableCollections||contract.allowedCollections;"
          if old not in s: raise SystemExit('validEnvelope operation anchor missing')
          s=s.replace(old,new,1)
          old="const collection=contract.allowedCollections.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||contract.allowedCollections.find(name=>schema.recordAgentFields(name).length);"
          new="const collection=writableCollections.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||writableCollections.find(name=>schema.recordAgentFields(name).length);"
          if old not in s: raise SystemExit('validEnvelope writable collection anchor missing')
          s=s.replace(old,new,1)
          anchor="negative('target product source'"
          test="""{
  const p=project('JOB-NEG-OPERATION-STAGE-DATA'),stage=17,pr={...prompts.buildPromptRecord(stage,p,{operation:'COMPARE'}),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(pr);
  const e={schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage,operation:'COMPARE',promptIdentity:{instructionId:pr.instructionId,bodySha256:pr.bodySha256,contractSha256:pr.contractSha256,contextSignature:pr.contextSignature},scope:pr.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{CORRECTIONS_COMPLETED:'TRUE'},records:{},evidence:[{temporaryKey:'evidence-op-scope',kind:'WORKFLOW_EVIDENCE',description:'Cross-operation scope fixture',location:'verification fixture',content:'CORRECTIONS_COMPLETED belongs to CORRECT, not COMPARE.'}],unresolved:[],warnings:[],attachments:[]};
  const prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});
  if(prepared.validation.valid||!prepared.validation.issues.some(i=>i.code==='STAGE_OPERATION_FIELD_VIOLATION'&&i.path==='/stageData/CORRECTIONS_COMPLETED'))throw new Error(`Cross-operation stageData was not rejected: ${JSON.stringify(prepared.validation.issues)}`);
  if(prepared.project.projectData.acceptedChanges.length)throw new Error('Cross-operation stageData mutated canonical state.');negativeCount++;
}
"""
          if anchor not in s: raise SystemExit('negative test insertion anchor missing')
          s=s.replace(anchor,test+anchor,1)
          p.write_text(s)

          # Semantic verifier binds prompt contract to the schema's operation-specific stageData authority.
          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          anchor="if(!arraysEqual(descriptor.agentWritableCollections||[],op?.agentWritableCollections||[]))issues.push('WRITE_COLLECTION_CONTRADICTION');"
          if anchor not in s: raise SystemExit('semantic write collection anchor missing')
          s=s.replace(anchor,anchor+"\n  if(!arraysEqual(descriptor.agentStageFields||[],op?.allowedStageData||[]))issues.push('WRITE_STAGE_FIELD_CONTRADICTION');",1)
          old="19:{CONFIRM_FREEZE:[],EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],REGRESSION_VERIFY:['regressionExecutions'],CONFIRM:['confirmationRecords']}"
          new="19:{EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],REGRESSION_VERIFY:['regressionExecutions'],CONFIRM:['confirmationRecords']}"
          if old not in s: raise SystemExit('expectedOperationWrites Stage 19 anchor missing')
          s=s.replace(old,new,1)
          anchor='let checked=0;'
          add="""const expectedOperationStageFields={17:{FREEZE:['NEW_FROZEN_VERSIONS','OLD_CONVERSATIONS_CONTINUED','RUN_NAMESPACE','IDENTICAL_PACKAGE_CONFIRMED_FOR_ALL_RUNS','PRIOR_OUTPUTS_WITHHELD'],EXECUTE_RUN:[],VERIFY:[],COMPARE:['EXECUTE_COMPLETED','VERIFY_COMPLETED','COMPARE_COMPLETED'],ROOT_CAUSE:['ROOT_CAUSE_COMPLETED'],REGRESSION:['REGRESSION_TESTS_ADDED'],CORRECT:['CORRECTIONS_COMPLETED']},19:{EXECUTE_RUN:[],VERIFY:[],COMPARE:['CROSS_RUN_COMPARISON_COMPLETED'],REGRESSION_VERIFY:[],CONFIRM:['COMPLETE_TEST_SUITE_RUN','NEW_CRITICAL_DEFECTS','NEW_MAJOR_DEFECTS','NEW_REQUIREMENTS_DISCOVERED','INJECTED_DEFECTS_NOT_DETECTED','NEW_CORRECTNESS_AFFECTING_VARIANCE','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED','REQUIRED_RETURN_STAGE']}};
if(schema.STAGE_OPERATIONS[19].includes('CONFIRM_FREEZE')||schema.operationContract(19,'CONFIRM_FREEZE'))throw new Error('Stage 19 exposes application-only freeze as an agent operation.');
for(const [stage,operations] of Object.entries(expectedOperationStageFields))for(const [operation,fields] of Object.entries(operations)){const op=schema.operationContract(Number(stage),operation);if(!arraysEqual(op.allowedStageData,fields))throw new Error(`Stage ${stage} ${operation} has wrong writable stage fields: ${op.allowedStageData.join(', ')}`);const descriptor=prompts.responseContractDescriptor(Number(stage),operation);if(!arraysEqual(descriptor.agentStageFields,fields))throw new Error(`Stage ${stage} ${operation} prompt exposes wrong stage fields.`);}
{const p=baseProject(),compare=prompts.buildPromptRecord(17,p,{operation:'COMPARE'}),correct=prompts.buildPromptRecord(17,p,{operation:'CORRECT'});if(compare.prompt.includes('- CORRECTIONS_COMPLETED:'))throw new Error('COMPARE prompt exposes CORRECT stageData.');if(!correct.prompt.includes('- CORRECTIONS_COMPLETED:'))throw new Error('CORRECT prompt omits correction stageData.');}
"""
          if anchor not in s: raise SystemExit('semantic insertion anchor missing')
          p.write_text(s.replace(anchor,add+anchor,1))

          # Continuous lifecycle must use operation-specific output and no dummy Stage 19 freeze response.
          p=Path('verify-full-cycle.mjs'); s=p.read_text()
          old="function data(stage,{operation,stageData={},records={},scope={}}={}){const pr=prompt(stage,operation,scope);if(!Object.keys(stageData).length&&!Object.keys(records).length){const f=schema.STAGE_CONTRACTS[stage].allowedStageData[0];if(f)stageData[f]=schema.STAGE_FIELDS[stage][f].valueType==='BOOLEAN'?true:`fixture-${f.toLowerCase()}`;}"
          new="function data(stage,{operation,stageData={},records={},scope={}}={}){const pr=prompt(stage,operation,scope),op=schema.operationContract(stage,pr.operation),operationStageFields=op?.allowedStageData||schema.STAGE_CONTRACTS[stage].allowedStageData;if(!Object.keys(stageData).length&&!Object.keys(records).length){const f=operationStageFields[0];if(f)stageData[f]=schema.STAGE_FIELDS[stage][f].valueType==='BOOLEAN'?true:`fixture-${f.toLowerCase()}`;}"
          if old not in s: raise SystemExit('full-cycle data helper anchor missing')
          s=s.replace(old,new,1)
          old="data(19,{operation:'CONFIRM_FREEZE',stageData:{COMPLETE_TEST_SUITE_RUN:'PENDING'}});engine.freezeCandidate"
          if old not in s: raise SystemExit('full-cycle CONFIRM_FREEZE anchor missing')
          s=s.replace(old,"engine.freezeCandidate",1)
          old="data(19,{operation:'CONFIRM',records:{confirmationRecords:"
          new="data(19,{operation:'CONFIRM',stageData:{COMPLETE_TEST_SUITE_RUN:'TRUE',NEW_CRITICAL_DEFECTS:'NONE',NEW_MAJOR_DEFECTS:'NONE',NEW_REQUIREMENTS_DISCOVERED:'NONE',INJECTED_DEFECTS_NOT_DETECTED:'NONE',NEW_CORRECTNESS_AFFECTING_VARIANCE:'NONE',CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED:'TRUE',REQUIRED_RETURN_STAGE:'NONE'},records:{confirmationRecords:"
          if old not in s: raise SystemExit('full-cycle CONFIRM anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify exact correction
        shell: bash
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit only the green minimum and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-operation-authority-final.yml
          git add workflow-schema.js workflow-engine.js verify-ingestion.mjs verify-prompt-semantics.mjs verify-full-cycle.mjs
          git commit -m 'Make operation stageData authority exact'
          git push origin HEAD:operation-stage-data-isolation-final-20260826
