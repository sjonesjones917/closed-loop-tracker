name: Apply prompt terminology cleanup
on:
  push:
    branches: [controlling-spec-final-current]
    paths: ['.github/workflows/fix-prompt-normal-language.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: controlling-spec-final-current, fetch-depth: 0}
      - run: python3 .github/fix_prompt_normal_language.py
      - run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add prompt-engine.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep prompt terminology operational"
          git push origin HEAD:controlling-spec-final-current
