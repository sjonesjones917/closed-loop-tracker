name: Apply operator lane current
on:
  push:
    branches:
      - reliability/operator-lane-current-6c66-20260826
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/operator-lane-current-6c66-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node apply-operator-lane-current.mjs
      - run: |
          node --check app-core.js
          node --check verify-complete.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - run: |
          rm apply-operator-lane-current.mjs .github/workflows/apply-operator-lane-current.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bind operator review controls to selected lane'
          git push origin HEAD:reliability/operator-lane-current-6c66-20260826
