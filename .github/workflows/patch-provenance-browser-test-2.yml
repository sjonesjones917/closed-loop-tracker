name: Correct provenance control regression
on:
  push:
    branches:
      - fix/provenance-collapse-scroll-20260828
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provenance-collapse-scroll-20260828
          fetch-depth: 0
      - name: Exercise the actual provenance disclosure control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-browser.mjs')
          s=p.read_text()
          old=""" const provenanceJump=await evalValue(cdp,`Boolean(document.querySelector('[data-jump-provenance]'))`);assert(provenanceJump,'View exact evidence / provenance action is missing.');await click(cdp,'[data-jump-provenance]');await waitExpr(cdp,`document.querySelector('#provenance-navigation')?.open===true`);"""
          new=""" await click(cdp,'#provenance-navigation>summary');await waitExpr(cdp,`document.querySelector('#provenance-navigation')?.open===true`);"""
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Expected provenance jump regression fragment not found')
          p.write_text(s)
          PY
          node --check verify-browser.mjs
          if git diff --quiet -- verify-browser.mjs; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser.mjs
          git commit -m "Exercise provenance disclosure directly"
          git push origin HEAD:fix/provenance-collapse-scroll-20260828
