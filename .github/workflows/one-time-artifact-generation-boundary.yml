name: Prove artifact generation versus downstream execution boundary
on:
  push:
    branches: [reliability/artifact-generation-boundary-20260826]
permissions: {contents: write}
jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only the demonstrated semantic corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              if actual!=count:
                  raise SystemExit(f'{path}: expected {count} exact anchor(s), found {actual}: {old[:160]!r}')
              p.write_text(s.replace(old,new,count))

          # Stage 01: generation capability is not downstream execution capability.
          replace('prompt-engine.js',
            'Determine whether the requested deliverable is feasible in the authorized execution environment. If direct implementation or fabrication is unavailable or materially too large but a complete reliable self-contained substitute such as an implementation-ready, design-ready, manufacturing-ready, research, architecture, or other specification deliverable can satisfy the underlying objective, propose that feasible substitute as EXACT_DELIVERABLE_REQUESTED for human intent confirmation and state the execution limitation explicitly.',
            'Determine the actual artifact set that constitutes the requested deliverable and whether the authorized environment can reliably generate those artifact bytes from defined representations and sufficient inputs. Artifact generation capability is distinct from downstream execution or verification capability: absence of a downstream authoring, viewing, compiling, importing, simulation, manufacturing, filing, deployment, or other consuming system is not by itself a reason to downgrade an artifact to prose. When the environment can reliably construct the requested artifact itself, keep that actual artifact in EXACT_DELIVERABLE_REQUESTED and leave downstream execution or interoperability as separate verification. Only propose an implementation-ready, design-ready, manufacturing-ready, research, architecture, or other specification substitute for human intent confirmation when the requested artifact itself genuinely cannot be generated reliably because required generation capability, required inputs, or manageable scale is unavailable.')

          # Stage 21: create real files when their representation can be generated; do not confuse that with using them downstream.
          replace('prompt-engine.js',
            'For self-contained work that can be generated here, create the complete deliverable and every required artifact. For repository, CAD/CAM, simulation, build, deployment, manufacturing, or other tool-dependent work, use those capabilities only when the external execution context actually provides the required tools and access; otherwise do not claim implementation or fabrication occurred and instead produce the complete implementation-ready or manufacturing-ready specification/patch plan required by the approved deliverable mode, or return the appropriate BLOCKED/EXECUTION_FAILED disposition.',
            'Generate the complete approved deliverable and every required actual artifact whenever this environment can reliably construct the artifact bytes from the accepted specification, documented representation, and sufficient inputs. Do not require possession of a downstream authoring or consuming application merely to generate a source, interchange, drawing, document, data, model, or machine-readable artifact whose representation can be constructed correctly here. Treat compilation, import/open validation, simulation, post-processing, machine execution, fabrication, deployment, filing/submission, and physical testing as separate downstream operations: claim them only when they actually occurred in a capable authorized environment with evidence. Use an implementation-ready or manufacturing-ready specification/patch plan only when the approved artifact itself cannot be generated reliably here; otherwise produce the real artifact and separately preserve any downstream verification still required.')

          # One generic rule applies to every domain.
          replace('prompt-engine.js',
            'DOMAIN / DELIVERABLE ADAPTATION — APPLY ONLY WHAT IS RELEVANT\n',
            'DOMAIN / DELIVERABLE ADAPTATION — APPLY ONLY WHAT IS RELEVANT\n- ARTIFACT GENERATION VS DOWNSTREAM EXECUTION: treat artifact-generation capability and downstream execution or verification capability as separate facts. If the current environment can reliably construct the requested artifact bytes from a defined representation and sufficient inputs, generate the actual artifact even when the downstream consumer or authoring application is unavailable. Do not infer importability, compilation, simulation, machining, fabrication, filing/submission, deployment, or physical performance unless that downstream operation was actually executed and evidenced.\n')

          # Software: runtime/repository absence constrains inspection/execution, not necessarily source-file creation.
          replace('prompt-engine.js',
            'When repository or runtime access is unavailable, produce a complete implementation-ready multi-file specification or patch plan with exact logical files/components, responsibilities, interfaces, changes, and acceptance tests instead of claiming files were changed.',
            'Lack of an IDE, compiler, runtime, deployment system, or writable repository does not by itself prevent source-file generation: when the required source/package files can be constructed reliably from the accepted design and available inputs, generate the actual files and preserve their logical paths. If modifying an existing system requires repository content that is not actually available, request/provide that missing artifact or produce a complete implementation-ready patch plan rather than pretending the existing files were inspected or changed. Build, test, deployment, and runtime success remain separate execution claims requiring actual execution evidence.')

          # Physical/CAD/CAM: commercial application possession is not a prerequisite for every documented exchange/source representation.
          replace('prompt-engine.js',
            'Generate executable CAD/CAM/G-code or machine-ready artifacts only when the execution context actually provides the required toolchain and inputs; otherwise produce the complete design/manufacturing specification and verification plan.',
            'Generate the real engineering artifact whenever its documented interchange, source, drawing, model, toolpath, or machine-readable representation can be constructed reliably from sufficient accepted inputs; lack of a commercial CAD/CAM application does not by itself prevent generation of a documented interchange/source format. Separately require actual downstream evidence for import/open success in a named application, simulation, post-processing, controller compatibility, machine execution, fabrication, or physical performance. If artifact generation itself cannot be performed reliably, or required safety-critical/machine-specific inputs are missing, return the appropriate clarification/blocking state or the complete design/manufacturing specification and verification plan without claiming the artifact or downstream operation exists.')

          # Generic environment fallback must use the same boundary.
          replace('prompt-engine.js',
            '- Work too large for the actually available environment, including large repositories or specialist CAD/CAM/simulation/manufacturing work without the required tool access, must not be represented as completed. At Stage 01, when a complete reliable implementation-ready, design-ready, manufacturing-ready, research, architecture, or other self-contained substitute deliverable can satisfy the underlying objective, propose that substitute as EXACT_DELIVERABLE_REQUESTED for human confirmation rather than blocking the whole job. After Stage 01, return WORK_TOO_LARGE_FOR_ENVIRONMENT or MISSING_CAPABILITY only when the currently approved deliverable itself cannot be completed reliably; otherwise complete the approved self-contained deliverable without claiming unavailable implementation or fabrication.',
            '- Work too large for the actually available environment must not be represented as completed, but missing downstream tool possession is not the same as missing artifact-generation capability. If the requested artifact bytes can be generated reliably from a defined representation and sufficient inputs, generate the actual artifact and separately mark any downstream import, build, simulation, machining, fabrication, filing, deployment, or physical verification that still requires another capability. At Stage 01, propose a specification substitute for human confirmation only when the requested artifact itself cannot be completed reliably because generation capability, required inputs, or manageable scale is genuinely unavailable. After Stage 01, return WORK_TOO_LARGE_FOR_ENVIRONMENT or MISSING_CAPABILITY only when the currently approved deliverable itself cannot be completed reliably; otherwise complete it without claiming downstream operations that did not occur.')
          replace('prompt-engine.js',
            '- Self-contained deliverables that can actually be produced in the available environment, including research papers, patent-application drafts, analyses, requirements specifications, architecture/design specifications, and similar artifacts, should be produced directly when the required information and authority are sufficient.',
            '- Any actual deliverable artifact whose documented representation can be generated reliably in the available environment should be produced directly when the required information and authority are sufficient, including documents, patent-application materials, source files, structured data, drawings, engineering interchange/source artifacts, analyses, specifications, and multi-file packages. Generation of those bytes does not by itself prove downstream compatibility, execution, manufacture, filing, or physical performance.')

          # Operator-facing Project copy must not teach the old conflated rule.
          replace('app-core.js',
            'If direct implementation is too large or unavailable in that environment, Stage 01 should establish a complete implementation-ready specification as the deliverable for human confirmation when that specification can be completed reliably; the workflow blocks only when the approved deliverable itself cannot be completed or a genuine human decision is still required. The application never claims unavailable implementation was performed.',
            'Stage 01 separates artifact generation from downstream execution. If the chosen agent can reliably construct the actual requested file or package from a defined representation and sufficient inputs, it should produce that real artifact even when a downstream authoring, build, CAD/CAM, filing, manufacturing, or other consuming system is unavailable. A specification is the fallback only when the requested artifact itself cannot be generated reliably; downstream operations are claimed only when actually performed and evidenced.')

          # Semantic contradiction acceptance: make this boundary first-class.
          replace('verify-prompt-semantics.mjs',
            "  if(!record.prompt.includes('implementation-ready')||!record.prompt.includes('must not be represented as completed'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');",
            "  if(!record.prompt.includes('ARTIFACT GENERATION VS DOWNSTREAM EXECUTION')||!record.prompt.includes('artifact-generation capability')||!record.prompt.includes('downstream execution or verification capability')||!record.prompt.includes('must not be represented as completed'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');")
          replace('verify-prompt-semantics.mjs',
            "  if(!record.prompt.includes('SOFTWARE / MULTI-FILE SYSTEM'))issues.push('SOFTWARE_DOMAIN_RULE_MISSING');",
            "  if(!record.prompt.includes('SOFTWARE / MULTI-FILE SYSTEM')||!record.prompt.includes('does not by itself prevent source-file generation')||!record.prompt.includes('Build, test, deployment, and runtime success remain separate execution claims'))issues.push('SOFTWARE_DOMAIN_RULE_MISSING');")
          replace('verify-prompt-semantics.mjs',
            "  if(!record.prompt.includes('PHYSICAL / MECHANICAL / CAD / CAM / CNC / ADDITIVE'))issues.push('PHYSICAL_ENGINEERING_DOMAIN_RULE_MISSING');",
            "  if(!record.prompt.includes('PHYSICAL / MECHANICAL / CAD / CAM / CNC / ADDITIVE')||!record.prompt.includes('does not by itself prevent generation of a documented interchange/source format')||!record.prompt.includes('Separately require actual downstream evidence'))issues.push('PHYSICAL_ENGINEERING_DOMAIN_RULE_MISSING');")
          replace('verify-prompt-semantics.mjs',
            "    if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('ask only the necessary clarification questions in normal plain language first')||!record.prompt.includes('record those answers in the application’s User Job Input and regenerate this Stage 01 instruction')||!record.prompt.includes('Do not emit a DATA_PROPOSAL until that regenerated instruction contains the required human-authority facts')||!record.prompt.includes('HUMAN_INPUT_REQUIRED response envelope'))issues.push('STAGE01_HUMAN_FIRST_CLARIFICATION_MISSING');",
            "    if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('ask only the necessary clarification questions in normal plain language first')||!record.prompt.includes('record those answers in the application’s User Job Input and regenerate this Stage 01 instruction')||!record.prompt.includes('Do not emit a DATA_PROPOSAL until that regenerated instruction contains the required human-authority facts')||!record.prompt.includes('HUMAN_INPUT_REQUIRED response envelope'))issues.push('STAGE01_HUMAN_FIRST_CLARIFICATION_MISSING');\n    if(!record.prompt.includes('absence of a downstream authoring, viewing, compiling, importing, simulation, manufacturing, filing, deployment, or other consuming system is not by itself a reason to downgrade an artifact to prose')||!record.prompt.includes('Only propose an implementation-ready'))issues.push('STAGE01_ARTIFACT_GENERATION_BOUNDARY_MISSING');")
          replace('verify-prompt-semantics.mjs',
            "  if(record.stage===12&&(!record.prompt.includes('Respect each test’s EXECUTION_MODE')||!record.prompt.includes('do not claim the test ran')))issues.push('TEST_EXECUTION_RESPONSIBILITY_MISSING');",
            "  if(record.stage===12&&(!record.prompt.includes('Respect each test’s EXECUTION_MODE')||!record.prompt.includes('do not claim the test ran')))issues.push('TEST_EXECUTION_RESPONSIBILITY_MISSING');\n  if(record.stage===21&&(!record.prompt.includes('Generate the complete approved deliverable and every required actual artifact whenever this environment can reliably construct the artifact bytes')||!record.prompt.includes('Treat compilation, import/open validation, simulation, post-processing, machine execution, fabrication, deployment, filing/submission, and physical testing as separate downstream operations')||!record.prompt.includes('Use an implementation-ready or manufacturing-ready specification/patch plan only when the approved artifact itself cannot be generated reliably here')))issues.push('STAGE21_ARTIFACT_GENERATION_BOUNDARY_MISSING');")
          replace('verify-prompt-semantics.mjs',
            "  {...original,prompt:original.prompt.replace('must not be represented as completed','may be represented as completed')},",
            "  {...original,prompt:original.prompt.replace('must not be represented as completed','may be represented as completed')},\n  {...original,prompt:original.prompt.replace('ARTIFACT GENERATION VS DOWNSTREAM EXECUTION','TOOL POSSESSION CONTROLS ARTIFACT GENERATION')},")

          # Ensure none of the demonstrated old semantics remain.
          pe=Path('prompt-engine.js').read_text()
          banned=[
            'If direct implementation or fabrication is unavailable or materially too large',
            'When repository or runtime access is unavailable, produce a complete implementation-ready multi-file specification',
            'Generate executable CAD/CAM/G-code or machine-ready artifacts only when the execution context actually provides the required toolchain',
            'specialist CAD/CAM/simulation/manufacturing work without the required tool access'
          ]
          for text in banned:
              if text in pe: raise SystemExit(f'old conflated prompt semantics remain: {text}')
          PY

          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of files)html=html.replace(new RegExp(`(<script\\s+defer\\s+src=\"${file.replace('.','\\.')}\\?v=)[^\"]+(\"\\s*><\\/script>)`),`$1${token}$2`);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE

      - name: Run complete deterministic and browser acceptance
        run: |
          node build-test-project.mjs
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Commit only verified permanent source
        run: |
          rm .github/workflows/one-time-artifact-generation-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js app-core.js verify-prompt-semantics.mjs index.html .github/workflows/one-time-artifact-generation-boundary.yml
          git commit -m "Separate artifact generation from downstream execution"
          git push origin HEAD:reliability/artifact-generation-boundary-20260826
