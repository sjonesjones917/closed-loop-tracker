name: Apply final semantic closure
on:
  push:
    branches:
      - reliability/final-semantic-closure-20260826
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/final-semantic-closure-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal source corrections
        run: |
          python3 .fix-final-semantic-patch.py
          python3 .final-semantic-patch.py
          python3 .fix-artifact-fixtures.py
      - name: Verify deterministic source
        run: |
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check workflow-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Verify local Chromium path
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-final-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only verified final source
        run: |
          rm .final-semantic-patch.py .fix-final-semantic-patch.py .fix-artifact-fixtures.py
          git rm .github/workflows/apply-final-semantic-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Close remaining semantic reliability gaps"
          git push origin HEAD:reliability/final-semantic-closure-20260826
