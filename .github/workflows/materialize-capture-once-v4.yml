name: materialize-capture-once-v4

on:
  push:
    branches:
      - fix/controlling-spec-zero-loss-20260830
    paths:
      - .github/workflows/materialize-capture-once-v4.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-zero-loss-20260830
          fetch-depth: 0
      - name: Run patch and preserve exact failure
        run: |
          set +e
          python3 tools/materialize_remaining_v2.py > materialize-v4.log 2>&1
          echo $? > materialize-v4.status
          cat materialize-v4.log
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add materialize-v4.log materialize-v4.status workflow-schema.js workflow-engine.js app-core.js verify-intent-capture.mjs .github/workflows/pages.yml
          git commit -m 'Record capture-once v4 materialization result' || true
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
          exit 0
