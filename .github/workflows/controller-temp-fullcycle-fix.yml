name: Controller temporary full-cycle fixture repair
on:
  push:
    branches:
      - controller3-prompt-byte-identity-rerun-20260904
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Repair full-cycle capability fixture and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs')
          s=p.read_text()
          old="TEST_TYPE:'MEANING',VERIFICATION_PHASE:'FINAL_PRODUCT_MEANING'"
          new="TEST_TYPE:'MEANING',EXECUTION_MODE:'INDEPENDENT_AGENT_REVIEW',REQUIRED_CAPABILITY:'INDEPENDENT_REVIEW',ARTIFACT_REQUIREMENTS:'NONE',VERIFICATION_PHASE:'FINAL_PRODUCT_MEANING'"
          if old not in s:
              raise SystemExit('full-cycle capability fixture target not found')
          p.write_text(s.replace(old,new,1))
          PY
          timeout 30s node verify-full-cycle.mjs
          rm .github/workflows/controller-temp-fullcycle-fix.yml
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add verify-full-cycle.mjs .github/workflows/controller-temp-fullcycle-fix.yml
          git commit -m "Bind full-cycle fixture to capable independent review"
          git push origin HEAD:controller3-prompt-byte-identity-rerun-20260904
