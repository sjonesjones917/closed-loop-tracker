name: Apply final semantic recovery patch

on:
  push:
    branches:
      - semantic-reliability/final-domain-recovery

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-reliability/final-domain-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimum semantic fixes
        run: python3 .github/final-semantic-patch.py
      - name: Verify patched semantics before commit
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-prompt-semantics.mjs
          node --check verify-ingestion.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit patch and remove repair files
        run: |
          rm .github/final-semantic-patch.py
          rm .github/workflows/apply-final-semantic-patch.yml
          git config user.name semantic-reliability-bot
          git config user.email actions@users.noreply.github.com
          git add prompt-engine.js response-ingestion.js verify-prompt-semantics.mjs verify-ingestion.mjs .github/final-semantic-patch.py .github/workflows/apply-final-semantic-patch.yml
          git commit -m "Close remaining recovery semantics"
          git push origin HEAD:semantic-reliability/final-domain-recovery
