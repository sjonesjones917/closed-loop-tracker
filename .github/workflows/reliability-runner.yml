name: Reliability acceptance runner
on:
  push:
    branches:
      - reliability-evidence-hardening
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-evidence-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch, verify, and commit
        run: |
          sed -i 's/semanticMeaningRecord/meaningReviewRecord/g' .harden-runner.sh
          sed -i "s/EVALUATOR_INDEPENDENT_FROM_GENERATOR:true/EVALUATOR_INDEPENDENT_FROM_GENERATOR:'TRUE'/g" .harden-runner.sh
          sed -i "s/REVIEWER_INDEPENDENT:true/REVIEWER_INDEPENDENT:'TRUE'/g" .harden-runner.sh
          python3 - <<'PY'
          p='.repair-reliability.mjs'
          s=open(p,encoding='utf-8').read()
          old="if(!verifier)return {determination:'UNKNOWN',reasons:['Verifier/reviewer context identity is unavailable.'],evidence};if(generator&&verifier===generator)"
          new="if(!verifier&&((role==='MEANING_REVIEW'&&truth(project.stages?.[23]?.agentData?.EVALUATOR_INDEPENDENT_FROM_GENERATOR))||(role==='ADVERSARIAL_REVIEW'&&truth(project.stages?.[24]?.agentData?.REVIEWER_INDEPENDENT))))return {determination:'EXTERNALLY_SUPPORTED',reasons:['Reviewer separation is supported by accepted external evidence; the application does not claim observation of the external environment.'],evidence:[{verifierContextId:'UNOBSERVED',generatorContextId:generator}]};if(!verifier)return {determination:'UNKNOWN',reasons:['Verifier/reviewer context identity is unavailable.'],evidence};if(generator&&verifier===generator)"
          if old not in s: raise SystemExit('reviewer support source target missing')
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          PY
          bash .harden-runner.sh
