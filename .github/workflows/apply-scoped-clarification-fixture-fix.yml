name: Apply proposal current-value repair
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/restore-controlling-verification-20260831b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-verification-20260831b
      - name: Make proposal current-value field explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old="field:c.canonicalField||c.canonicalRelationship||'',currentValue:(()=>{"
          new="field:c.canonicalField||c.canonicalRelationship||'','current value':(()=>{"
          if old not in s: raise SystemExit('proposal current-value target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify v3 UI contract
        run: |
          node --check app-core.js
          node verify-v3-contract.mjs
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js
          git commit -m "Show explicit current value in proposal diff"
          git push origin HEAD:fix/restore-controlling-verification-20260831b
