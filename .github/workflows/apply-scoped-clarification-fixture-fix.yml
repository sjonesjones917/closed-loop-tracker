name: Apply scoped clarification fixture repair
on:
  push:
    branches: [fix/restore-controlling-verification-20260831b]
    paths: [.github/workflows/apply-scoped-clarification-fixture-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-verification-20260831b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal ingestion and fixture repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          replacements=[
            ("p=ingestion.commit(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY'}).project;const request=p.projectData.humanInputRequests.at(-1);p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'},{operator:'VERIFY'}).project;","p=ingestion.commit(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY'}).project;for(let n=1;n<stage;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}const request=p.projectData.humanInputRequests.at(-1);p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'},{operator:'VERIFY'}).project;"),
            ("const p=project('JOB-RAW-SCOPE');\n  p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';","const p=project('JOB-RAW-SCOPE');\n  for(let n=1;n<17;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}\n  p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';"),
            ("let p=project('JOB-NEG-OPERATION-STAGEDATA'),stage=17;const pr={...prompts.buildPromptRecord(stage,p,","let p=project('JOB-NEG-OPERATION-STAGEDATA'),stage=17;for(let n=1;n<stage;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}const pr={...prompts.buildPromptRecord(stage,p,"),
            ("let p=project('JOB-NEG-RESERVED-TEMPKEY'),stage=21;p.job.CURRENT_BASELINE_ID","let p=project('JOB-NEG-RESERVED-TEMPKEY'),stage=21;for(let n=1;n<stage;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}p.job.CURRENT_BASELINE_ID"),
            ("let p=project('JOB-NEG-COMPLETED-TARGET'),stage=21,productId='PRODUCT-000001';p.job.CURRENT_BASELINE_ID","let p=project('JOB-NEG-COMPLETED-TARGET'),stage=21,productId='PRODUCT-000001';for(let n=1;n<stage;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}p.job.CURRENT_BASELINE_ID"),
            ("let p=project('JOB-NEG-TARGET-SCOPE'),stage=11,runId='RUN-SCOPE-B';p.projectData.runs.push","let p=project('JOB-NEG-TARGET-SCOPE'),stage=11,runId='RUN-SCOPE-B';for(let n=1;n<stage;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}p.projectData.runs.push")
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit('expected fixture target not found: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('response-ingestion.js')
          s=p.read_text()
          old="if(!schema.authorizeMutation({fieldDefinition:definition,actor:'AGENT',mutationType:'RESPONSE_INGESTION'}).authorized)issues.push(issue('FIELD_OWNERSHIP_VIOLATION',path,`${name} is owned by ${definition.producer}, not the external agent.`));\n      else if(!allowedStageData.has(name))issues.push(issue('STAGE_OPERATION_FIELD_VIOLATION',path,`${name} is not writable by operation ${expectedOperation}.`));"
          new="if(!schema.authorizeMutation({fieldDefinition:definition,actor:'AGENT',mutationType:'RESPONSE_INGESTION'}).authorized)issues.push(issue('FIELD_OWNERSHIP_VIOLATION',path,`${name} is owned by ${definition.producer}, not the external agent.`));\n      if(!allowedStageData.has(name))issues.push(issue('STAGE_OPERATION_FIELD_VIOLATION',path,`${name} is not writable by operation ${expectedOperation}.`));"
          if old not in s: raise SystemExit('ingestion authority/operation target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax and targeted regression
        run: |
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node verify-ingestion.mjs
      - name: Commit minimal correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add response-ingestion.js verify-ingestion.mjs
          git commit -m "Reject operation-scoped fields independently of ownership"
          git push origin HEAD:fix/restore-controlling-verification-20260831b
