name: Apply scoped clarification fixture repair
on:
  push:
    branches: [fix/restore-controlling-verification-20260831b]
    paths: [.github/workflows/apply-scoped-clarification-fixture-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-verification-20260831b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve synthetic prerequisites across clarification control-event recalc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="p=ingestion.commit(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY'}).project;const request=p.projectData.humanInputRequests.at(-1);p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'},{operator:'VERIFY'}).project;"
          new="p=ingestion.commit(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY'}).project;for(let n=1;n<stage;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}const request=p.projectData.humanInputRequests.at(-1);p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'},{operator:'VERIFY'}).project;"
          if old not in s:
              raise SystemExit('scoped clarification fixture target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Run targeted regression
        run: node verify-ingestion.mjs
      - name: Commit minimal fixture correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-ingestion.mjs
          git commit -m "Preserve Stage 17 fixture prerequisites after clarification event"
          git push origin HEAD:fix/restore-controlling-verification-20260831b
