name: finalize-intent-capture

on:
  push:
    branches:
      - fix/controlling-spec-zero-loss-20260830
    paths:
      - .github/workflows/finalize-intent-capture.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-zero-loss-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure repository
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git fetch origin main implementation/full-spec-repair144
      - name: Restore functional v3 base and existing visual shell
        run: |
          set -euo pipefail
          git show origin/main:index.html > /tmp/index-main.html
          for f in README.md app-core.js build-test-project.mjs project-store.js prompt-engine.js response-ingestion.js test-runtime.js test-worker.js verify-browser.mjs verify-complete.mjs verify-definition-of-done.mjs verify-full-cycle.mjs verify-hash.mjs verify-ingestion.mjs verify-project-lifecycle.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs verify-test-runtime.mjs verify.mjs workbook.js workflow-engine.js workflow-schema.js .github/workflows/pages.yml; do
            git checkout origin/implementation/full-spec-repair144 -- "$f"
          done
          cp /tmp/index-main.html index.html
      - name: Apply exhaustive capture-once repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_intent_capture.py')
          t=p.read_text()
          old="out,count=re.subn(pattern,repl,src,count=1)"
          new="out,count=re.subn(pattern,lambda m:m.group(1)+str(n)+\":'\"+escaped+\"',\\n\"+str(n+1)+\":'\",src,count=1)"
          if old not in t: raise SystemExit('repair-script regex anchor missing')
          p.write_text(t.replace(old,new,1))
          PY
          python3 tools/finalize_intent_capture.py
      - name: Preserve visual baseline and runtime wiring only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          baseline=Path('/tmp/index-main.html').read_text()
          html=Path('index.html').read_text()
          if "worker-src 'self'" not in html:
              html=html.replace("connect-src 'self'; object-src", "connect-src 'self'; worker-src 'self'; object-src")
          srcs=re.findall(r'<script\s+defer\s+src="([^"]+)"\s*></script>',html)
          token=next((re.search(r'[?&]v=([^&\"]+)',s).group(1) for s in srcs if re.search(r'[?&]v=([^&\"]+)',s)),'runtime')
          order=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          first=html.index('<script defer src="')
          last=html.rindex('</script>')+len('</script>')
          html=html[:first]+'\n'.join(f'<script defer src="{x}?v={token}"></script>' for x in order)+html[last:]
          base_css=re.search(r'<style>(.*?)</style>',baseline,re.S).group(1)
          new_css=re.search(r'<style>(.*?)</style>',html,re.S).group(1)
          if hashlib.sha256(base_css.encode()).hexdigest()!=hashlib.sha256(new_css.encode()).hexdigest():
              raise SystemExit('visual CSS changed from main baseline')
          if '.expandable-prompt{max-height:280px}' not in html:
              raise SystemExit('prompt box baseline size is not 280px')
          Path('index.html').write_text(html)
          PY
      - name: Add permanent capture-once regression
        run: |
          cat > verify-intent-capture.mjs <<'EOF'
          import fs from 'node:fs';
          const r=f=>fs.readFileSync(f,'utf8');
          const a=(v,m)=>{if(!v)throw new Error(m)};
          const p=r('prompt-engine.js'),e=r('workflow-engine.js'),i=r('response-ingestion.js'),app=r('app-core.js'),h=r('index.html'),s=r('workflow-schema.js'),w=r('workbook.js');
          a(w.includes('closed-loop-project/3'),'project /3 missing');
          a(s.includes('closed-loop-stage-response/3'),'response /3 missing');
          a(e.includes('function stage1IntakeManifest(project)'),'intake manifest missing');
          a(e.includes('function stage4ObligationManifest(project)'),'obligation manifest missing');
          a(e.includes('validateStage1IntakeAccounting'),'Stage 01 closure validator missing');
          a(e.includes('validateStage4ObligationAccounting'),'Stage 04 closure validator missing');
          a(i.includes('INCOMPLETE_STAGE_01_INTAKE_ACCOUNTING'),'Stage 01 ingestion closure missing');
          a(i.includes('INCOMPLETE_STAGE_04_OBLIGATION_ACCOUNTING'),'Stage 04 ingestion closure missing');
          a(p.includes('APPLICATION INTAKE COVERAGE MANIFEST — ACCOUNT FOR EVERY ID'),'Stage 01 manifest absent');
          a(p.includes('STAGE 04 COMPLETE CANONICAL INPUT UNION — DO NOT ASK THE USER TO RESUPPLY IT'),'Stage 04 union absent');
          a(p.includes('NEVER ask the human to reattach, resend, retype, restate, reconstruct, or summarize'),'repeat-input prohibition absent');
          a(p.includes('Exhaustively research every current accepted Stage 02'),'Stage 03 exhaustion absent');
          a(app.includes("function artifactControlMarkup(n,locked){if(n===4)return '';"),'Stage 04 upload control remains');
          a(h.includes('.expandable-prompt{max-height:280px}'),'prompt box size changed');
          console.log('intent capture and Stage 04 capture-once regression passed');
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          t=p.read_text()
          step="      - name: Verify exhaustive intent capture and Stage 04 capture-once behavior\n        run: node verify-intent-capture.mjs\n"
          if 'node verify-intent-capture.mjs' not in t:
              marker='      - name: Syntax checks\n'
              if marker not in t: raise SystemExit('pages workflow syntax anchor missing')
              t=t.replace(marker,step+marker,1)
          p.write_text(t)
          PY
      - name: Validate repaired files
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-intent-capture.mjs
      - name: Commit implementation
        run: |
          set -euo pipefail
          git add README.md app-core.js build-test-project.mjs project-store.js prompt-engine.js response-ingestion.js test-runtime.js test-worker.js verify-browser.mjs verify-complete.mjs verify-definition-of-done.mjs verify-full-cycle.mjs verify-hash.mjs verify-ingestion.mjs verify-intent-capture.mjs verify-project-lifecycle.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs verify-test-runtime.mjs verify.mjs workbook.js workflow-engine.js workflow-schema.js index.html .github/workflows/pages.yml tools/finalize_intent_capture.py
          git commit -m 'Finish exhaustive intent capture and Stage 04 capture-once flow'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
