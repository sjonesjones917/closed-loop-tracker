name: Audit remaining zero-loss trust paths

on:
  push:
    branches:
      - reliability/zero-loss-semantic-adjudication-clean
    paths:
      - .github/workflows/zero-loss-audit.yml
      - .zero-loss-audit.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining semantic and operator trust paths
        run: python3 .zero-loss-audit.py
      - name: Export exact branch source for deterministic patching
        uses: actions/upload-artifact@v4
        with:
          name: zero-loss-source-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
