name: zero-loss-audit
on:
  push:
    branches: ['fix/controlling-spec-zero-loss-20260830']
    paths: ['.github/workflows/zero-loss-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-zero-loss-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit controlling specification mismatches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          files={p.name:p.read_text(errors='replace') for p in Path('.').glob('*') if p.is_file() and p.suffix in {'.js','.mjs','.html','.md'} }
          runtime=['workbook.js','workflow-schema.js','test-runtime.js','test-worker.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js','index.html']
          checks={}
          def hits(pattern):
              out=[]; rx=re.compile(pattern,re.I|re.M)
              for name,text in files.items():
                  if rx.search(text): out.append(name)
              return out
          checks['project_v3']=hits(r'closed-loop-project/3')
          checks['response_v3']=hits(r'closed-loop-stage-response/3')
          checks['project_v2_runtime']=[f for f in runtime if f in files and 'closed-loop-project/2' in files[f]]
          checks['response_v2_runtime']=[f for f in runtime if f in files and 'closed-loop-stage-response/2' in files[f]]
          checks['custom_pipeline']=hits(r'CUSTOM_PIPELINE')
          checks['domain_subject_branches']=hits(r'PATENT / REGULATED FILING|SOFTWARE / MULTI-FILE SYSTEM|BUILDING / ARCHITECTURE / AEC|PHYSICAL / MECHANICAL / CAD / CAM / CNC / ADDITIVE')
          required_ops=['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE']
          tr=files.get('test-runtime.js','')
          checks['missing_test_ir_ops']=[x for x in required_ops if x not in tr]
          required_helpers=['evaluateContextIndependence','evaluateEvidenceSufficiency','detectCurrentContradictions','testExecutionPlan','operationalNextAction']
          we=files.get('workflow-engine.js','')
          checks['missing_engine_helpers']=[x for x in required_helpers if x not in we]
          ps=files.get('project-store.js','')
          checks['missing_store_helpers']=[x for x in ['createExecutionPackage'] if x not in ps]
          idx=files.get('index.html','')
          checks['index_test_runtime_before_engine']=idx.find('test-runtime.js')!=-1 and idx.find('workflow-engine.js')!=-1 and idx.find('test-runtime.js')<idx.find('workflow-engine.js')
          checks['csp_worker_self']=bool(re.search(r"worker-src[^;]*'self'",idx,re.I))
          checks['prompt_preview_280']='280px' in idx
          checks['stage16_root_cause']='CORRECT THE ROOT CAUSE' in files.get('workbook.js','')
          checks['workflow_files']=sorted(str(p) for p in Path('.github/workflows').glob('*.yml'))
          print('ZERO_LOSS_AUDIT='+json.dumps(checks,sort_keys=True))
          PY
      - name: Remove one-time audit workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-audit
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/zero-loss-audit.yml
          git commit -m "Remove one-time zero-loss audit workflow"
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
