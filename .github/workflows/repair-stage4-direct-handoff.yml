name: One-time Stage 04 direct handoff repair
on:
  push:
    branches: [reliability-hardening-20260829]
permissions:
  contents: write
concurrency:
  group: repair-stage4-direct-handoff
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-hardening-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the minimal Stage 04 direct-to-agent handoff repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.repair-stage4-direct-handoff.cjs')
          text=path.read_text()
          replacements=[
            (r"const nextPattern=/function operationalNextAction\(project,currentStage\)\{[\s\S]*?\n\}\n\nfunction applicationTestCapabilities/;",r"const nextPattern=/function operationalNextAction\(project,currentStage\)\{[\s\S]*?\}\n\nfunction applicationTestCapabilities/;"),
            ("  text=replaceRegex(text,nextPattern,nextReplacement,'workflow-engine operationalNextAction');","  {const start=text.indexOf('function operationalNextAction(project,currentStage){'),marker='\\n\\nfunction applicationTestCapabilities',end=text.indexOf(marker,start);if(start<0||end<0)throw new Error('workflow-engine operationalNextAction boundary was not found.');text=text.slice(0,start)+nextReplacement+text.slice(end+marker.length);}"),
            (r'''text=text.replace(/(<script\\s+defer\\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\\.js\\?v=)[^"]+(">)/g,'$1'+'20260829-stage4-direct-handoff'+'$2');''',r'''text=text.replace(/(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+(">)/g,'$1'+'20260829-stage4-direct-handoff'+'$2');'''),
            (r'''const tokens=[...text.matchAll(/<script\\s+defer\\s+src="[^"]+\\?v=([^"]+)"/g)].map(m=>m[1]);''',r'''const tokens=[...text.matchAll(/<script\s+defer\s+src="[^"]+\?v=([^"]+)"/g)].map(m=>m[1]);'''),
            ("  text=replaceOnce(text,marker,block+marker,'browser Stage 04 handoff test insertion');\n  text=replaceOnce(text,'malformedImportNonDestructive:true,runtimeErrors:0','malformedImportNonDestructive:true,stage4DirectOutgoingHandoff:true,runtimeErrors:0','browser result report');","  text=replaceOnce(text,marker,block+marker,'browser Stage 04 handoff test insertion');\n  text=replaceOnce(text,'const beforeCount=afterNew.length;','const beforeCount=(await allProjects(cdp)).length;','browser current project count after Stage 04 fixture');\n  text=replaceOnce(text,'malformedImportNonDestructive:true,runtimeErrors:0','malformedImportNonDestructive:true,stage4DirectOutgoingHandoff:true,runtimeErrors:0','browser result report');")
          ]
          for old,new in replacements:
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'Applicator preflight expected one match, found {count}: {old[:80]}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          node --check .repair-stage4-direct-handoff.cjs
          node .repair-stage4-direct-handoff.cjs
          rm -f .repair-stage4-direct-handoff.cjs .github/workflows/repair-stage4-direct-handoff.yml
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
      - name: Verify syntax and deterministic contracts
        run: |
          node --check app-core.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Exercise the exact phone-first browser behavior
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-stage4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit the exact tested tree
        run: |
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          git config user.name "closed-loop-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make Stage 04 direct file handoff unmistakable"
          git push origin HEAD:reliability-hardening-20260829
