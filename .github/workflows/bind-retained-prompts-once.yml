name: Bind retained prompt records once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bind-retained-prompts-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bind-retained-prompts-once
  cancel-in-progress: true

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind and verify retained prompts
        run: |
          set -euo pipefail
          node bind-retained-prompts.mjs
          node verify-self-project.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('SELF_VERIFIED_PROJECT.json','utf8'));
          const s8=p.productionInstructions?.find(r=>Number(r.stageNumber)===8);
          const s9=p.productionInstructions?.find(r=>Number(r.stageNumber)===9);
          if(s8?.instructionId!=='INSTRUCTION-v001'||!s8?.promptText?.startsWith('PRODUCTION INSTRUCTION'))throw new Error('Stage 8 retained prompt is invalid.');
          if(s9?.instructionId!=='INSTRUCTION-v002'||!s9?.promptText?.startsWith('PREFLIGHTED PRODUCTION INSTRUCTION'))throw new Error('Stage 9 retained prompt is invalid.');
          if(p.preflightReviews?.find(r=>Number(r.stageNumber)===9)?.status!=='RESOLVED')throw new Error('Stage 9 retained preflight is unresolved.');
          NODE
      - name: Commit exact verified project and remove one-shot machinery
        run: |
          set -euo pipefail
          rm -f .github/workflows/bind-retained-prompts-once.yml bind-retained-prompts.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Persist generated Stage 8 and Stage 9 prompts in retained project'
          git pull --rebase origin main
          git push origin HEAD:main
