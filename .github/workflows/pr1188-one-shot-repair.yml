name: One-shot exact-byte repair for PR 1188

on:
  push:
    branches: [fix/all-stage-prompt-contracts-clean-20260908]
    paths: [.pr1188-repair/READY]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply and verify exact prompt repair
        shell: bash
        run: |
          set -euo pipefail
          cat .pr1188-repair/chunk-* > /tmp/pr1188.patch.b64
          echo '1bafcc495834b5253cf59db461a5598e96a472dd2fbe4c456bee0c57828e4ae1  /tmp/pr1188.patch.b64' | sha256sum --check --strict
          base64 --decode /tmp/pr1188.patch.b64 > /tmp/pr1188.patch
          echo '8ea83aa43c5840f84a804cc0ab8e8a5b51e944906e2e039c05cf1cb75298e5a7  /tmp/pr1188.patch' | sha256sum --check --strict
          git apply --check /tmp/pr1188.patch
          git apply /tmp/pr1188.patch
          echo '19017c9827ef4f828e96b33fc89cfcca49236e3ee6db0e0b3573265eb0d946a5  prompt-engine.js' | sha256sum --check --strict
          echo 'a046de8beb5e042a434312ca4365ea9118184ded89c02c1cfe3753b3a9443ce7  verify.mjs' | sha256sum --check --strict
          node --check prompt-engine.js
          node --check verify.mjs
          node verify-stage-operation-registry.mjs
          node verify-stage01-intake-closure.mjs
          node verify-stage01-disposition-contract.mjs
          node verify-human-authority-roundtrip.mjs
          node verify-prompt-semantics.mjs
          node verify-all-stage-prompts.mjs
          node verify-user-prompt-invariants.mjs
          node verify-file-first-response.mjs
          node verify-ingestion.mjs
          node verify.mjs
      - name: Publish tested source and verifier bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompt-engine.js verify.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git commit -m 'Repair Stage 2/3 prompt authority and operation-wide verifier'
          git push origin HEAD:refs/heads/fix/all-stage-prompt-contracts-clean-20260908
