name: One-shot exact-byte repair for PR 1188

on:
  push:
    branches: [fix/all-stage-prompt-contracts-clean-20260908]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact locally-verified repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr1188-stage23.patch.b64 <<'PATCH_B64'
          ...
          PATCH_B64
          base64 -d /tmp/pr1188-stage23.patch.b64 > /tmp/pr1188-stage23.patch
          echo 'c9cc9868593f6e2c02bce3e25da51b4bd409e5a5f873602065e59deab85d68f7  /tmp/pr1188-stage23.patch' | sha256sum -c -
          git apply --check /tmp/pr1188-stage23.patch
          git apply /tmp/pr1188-stage23.patch
          test "$(git hash-object prompt-engine.js)" = '87b69dfb93fabf1738a2599e3f319a145cf041c2'
          test "$(git hash-object verify.mjs)" = 'd3639be7a01ed927103d5da2cf8ff50323792a47'
          rm .github/workflows/pr1188-one-shot-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompt-engine.js verify.mjs .github/workflows/pr1188-one-shot-repair.yml
          git diff --cached --check
          git commit -m 'Repair Stage 02/03 prompt authority and executor-aware verification'
          git push origin HEAD:"${GITHUB_REF_NAME}"
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
