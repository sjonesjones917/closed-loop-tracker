name: OpenAI semantic patch apply
on:
  push:
    branches: [openai/semantic-adjudication]
    paths: [.patchparts/READY]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact tested semantic patch
        run: |
          cat .patchparts/part-* | base64 -d > /tmp/semantic-changes.tar.xz
          xz -dc /tmp/semantic-changes.tar.xz | tar -xf -
          rm -rf .patchparts
          rm -f .github/workflows/openai-semantic-snapshot.yml
          git config user.name "closed-loop reliability automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Enforce application-owned semantic adjudication"
          git push origin HEAD:openai/semantic-adjudication
