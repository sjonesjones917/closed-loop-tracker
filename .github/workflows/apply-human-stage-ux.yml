name: Apply minimal human-stage conversation UX repair

on:
  push:
    branches:
      - fix/human-stage-conversation-ux-20260827

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[human-stage-ux-clean]') && !contains(github.event.head_commit.message, '[human-stage-ux-failed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply exact minimal repair
        run: node .maintenance-human-stage-ux.mjs
      - name: Verify syntax, contracts, lifecycle, ingestion, prompts, and browser UX
        run: |
          set +e
          {
            node build-test-project.mjs &&
            node --check app-core.js &&
            node --check hash.js &&
            node --check workflow-schema.js &&
            node --check workflow-engine.js &&
            node --check prompt-engine.js &&
            node --check response-ingestion.js &&
            node --check project-store.js &&
            node --check workbook.js &&
            node --check test-fixtures.mjs &&
            node --check verify-hash.mjs &&
            node --check verify.mjs &&
            node --check verify-ingestion.mjs &&
            node --check verify-complete.mjs &&
            node --check verify-full-cycle.mjs &&
            node --check verify-prompt-semantics.mjs &&
            node --check verify-live.mjs &&
            node --check verify-browser.mjs &&
            node --check verify-browser-extra.mjs &&
            node verify-hash.mjs &&
            node verify.mjs &&
            node verify-ingestion.mjs &&
            node verify-complete.mjs &&
            node verify-full-cycle.mjs &&
            node verify-prompt-semantics.mjs &&
            export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)" &&
            test -n "$BROWSER" &&
            python3 -m http.server 4173 >/tmp/closed-loop-human-stage-http.log 2>&1 &
            SERVER_PID=$! &&
            sleep 1 &&
            node verify-browser.mjs &&
            node verify-browser-extra.mjs &&
            kill "$SERVER_PID" 2>/dev/null || true
          } > .maintenance-human-stage-ux.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > .maintenance-human-stage-ux.exit
      - name: Commit verified source only
        run: |
          status=$(cat .maintenance-human-stage-ux.exit)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" = "0" ]; then
            rm .maintenance-human-stage-ux.mjs .github/workflows/apply-human-stage-ux.yml .maintenance-human-stage-ux.log .maintenance-human-stage-ux.exit
            git add -A
            git commit -m "Clarify human conversation before final stage JSON [human-stage-ux-clean]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            git add -A
            git commit -m "Capture human-stage UX verification failure [human-stage-ux-failed]"
            git push origin HEAD:${GITHUB_REF_NAME}
            cat .maintenance-human-stage-ux.log
            exit "$status"
          fi
