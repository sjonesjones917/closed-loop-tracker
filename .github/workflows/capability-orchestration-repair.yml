          patch('prompt-engine.js',"- When VERIFICATION BATCH PLAN is present, verify only its listed currently missing triples in listed order. If response bytes would exceed the declared limit, return the longest leading prefix that fits. Never skip ahead or repeat a completed triple. Accepted partial batches are canonical progress but never satisfy the application-derived matrix-completeness gate until every required triple exists exactly once.\n- Missing human-authority information requires HUMAN_INPUT_REQUIRED.","- TEST EXECUTION BOUNDARY: a canonical test definition specifies how verification must be performed; it is not itself an execution result. A filename, code block, path, or claimed hash is not a possessed executable artifact. Required test artifacts must be declared in attachments, supplied as actual files to the application, hashed from their bytes, and referenced by the resulting canonical artifact identity before they can satisfy an artifact-dependent test. The browser is not a universal compiler, CAD/CAM/FEA environment, lab, machine controller, repository runner, or filing system.\n- When VERIFICATION BATCH PLAN is present, verify only its listed currently missing triples in listed order. If response bytes would exceed the declared limit, return the longest leading prefix that fits. Never skip ahead or repeat a completed triple. Accepted partial batches are canonical progress but never satisfy the application-derived matrix-completeness gate until every required triple exists exactly once.\n- Missing human-authority information requires HUMAN_INPUT_REQUIRED.")

