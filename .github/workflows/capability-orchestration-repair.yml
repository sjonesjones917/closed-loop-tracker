name: capability-orchestration-repair
on:
  push:
    branches: [capability/test-execution-contract-20260826]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability/test-execution-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact baseline
        run: |
          test "$(git rev-parse origin/main)" = "a129e8ffe9152fc34e9a75b95f1cfe69ff70765d"
          git reset --hard origin/main
      - name: Apply minimum capability/test-execution correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          def patch(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              if actual!=count: raise SystemExit(f'{path}: expected {count} match(es), found {actual}: {old[:100]!r}')
              p.write_text(s.replace(old,new,count))

          patch('workflow-schema.js',"const RESPONSE_TYPES=Object.freeze(['DATA_PROPOSAL','HUMAN_INPUT_REQUIRED','BLOCKED','EXECUTION_FAILED']);","const RESPONSE_TYPES=Object.freeze(['DATA_PROPOSAL','HUMAN_INPUT_REQUIRED','BLOCKED','EXECUTION_FAILED']);\nconst TEST_EXECUTION_MODES=Object.freeze(['EXTERNAL_AGENT_TOOL','INDEPENDENT_AGENT_REVIEW','HUMAN_INSPECTION','EXTERNAL_SYSTEM','UNAVAILABLE']);")
