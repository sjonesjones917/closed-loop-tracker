          patch('prompt-engine.js',"6:'Build this job’s verification suite before any production instruction is authored. Every active mandatory requirement must have at least one valid proposed test. Use the strongest suitable method, including exact computation, programmatic checks, schema or structure checks, source comparison, rule-based verification, and independent human meaning/content review where deterministic checks cannot establish satisfaction. Define inputs, tools, procedure, expected result, failure condition, and evidence to preserve. The application assigns TEST_ID, controlled test-suite identity, and exact mandatory requirement-to-test coverage; do not assert those application-owned values.',","6:'Build this job’s verification architecture before any production instruction is authored. Every active mandatory requirement must have at least one valid proposed test definition. A test definition is not an execution result and does not imply that executable test code exists. For every test, declare EXECUTION_MODE, REQUIRED_CAPABILITIES, whether an executable artifact is required, the required artifact(s), inputs, tools, procedure, expected result, failure condition, and evidence to preserve. Use EXTERNAL_AGENT_TOOL for tool-capable execution, INDEPENDENT_AGENT_REVIEW for independent substantive review, HUMAN_INSPECTION only for irreducible human judgment, EXTERNAL_SYSTEM for specialist software/lab/machine execution, and UNAVAILABLE when the required capability is not currently available. Create executable test artifacts only when they are the appropriate verification mechanism. If a test artifact is required, declare the actual returned file in attachments and link evidence to it; a filename, code block, or agent-claimed hash is not artifact bytes. The application verifies the actual supplied bytes and derives TEST_ARTIFACT_IDS. The application assigns TEST_ID, controlled test-suite identity, lifecycle state, and exact mandatory requirement-to-test coverage; do not assert those application-owned values.',")
          patch('prompt-engine.js',"7:'Build this job’s failure and mutation test proposals to prove validators reject realistic invalid states. Include applicable missing inputs, invalid values, wrong versions, duplicate identifiers, contradictions, omitted required sections, prohibited material, corrupt references, malformed files, conflicting authority, unavailable tools, unsupported claims, injected source instructions, known-invalid artifacts, and other relevant mutations. Preserve fixture, expected rejection, actual observed result, validator defect where applicable, and evidence. The application owns canonical test identities, suite identity, lifecycle state, and derived coverage.',","7:'Build this job’s failure and mutation test proposals to prove validators reject realistic invalid states. Include applicable missing inputs, invalid values, wrong versions, duplicate identifiers, contradictions, omitted required sections, prohibited material, corrupt references, malformed files, conflicting authority, unavailable tools, unsupported claims, injected source instructions, known-invalid artifacts, and other relevant mutations. A fixture definition is not proof that it was executed. Execute a failure fixture only when the current authorized environment actually has the required capability and exact artifact bytes; otherwise return the appropriate BLOCKED or EXECUTION_FAILED disposition instead of fabricating an actual result. Preserve fixture, expected rejection, actual observed result only when executed, validator defect where applicable, and evidence. The application owns canonical test identities, suite identity, lifecycle state, and derived coverage.',")
          patch('prompt-engine.js',"12:'Verify each current execution independently. Execute only the currently missing REQ_ID × RUN_ID × TEST_ID triples listed by the application in VERIFICATION BATCH PLAN, in listed order. Preserve verifier and verifier-context identity, independence status, inputs, procedure, expected result, observed result, exact evidence, SATISFIED/VIOLATED/UNDETERMINED, defect reference where applicable, and reason for UNDETERMINED. If the complete listed batch would exceed the declared response byte limit, return the longest leading prefix that fits; never skip ahead, repeat an already-current triple, substitute wrong-version or wrong-iteration records, or self-validate. After accepted ingestion the application regenerates this stage from the newly missing set. The application reconciles the complete matrix mathematically and the stage cannot complete from a partial batch.',","12:'Verify each current execution independently. Execute only the currently missing REQ_ID × RUN_ID × TEST_ID triples listed by the application in VERIFICATION BATCH PLAN, in listed order. Respect each controlling test’s EXECUTION_MODE, REQUIRED_CAPABILITIES, and canonical TEST_ARTIFACT_IDS. Do not treat a test definition, filename, code block, hash claim, or prior narrative as proof of execution. Execute a triple only in a context that actually has the required tool/system/artifact access; if capability or required bytes are unavailable, return BLOCKED with MISSING_CAPABILITY or MISSING_ARTIFACT, or EXECUTION_FAILED only after an attempted execution actually fails. Preserve verifier and verifier-context identity, independence status, inputs, procedure, expected result, observed result, exact evidence, SATISFIED/VIOLATED/UNDETERMINED, defect reference where applicable, and reason for UNDETERMINED. If the complete listed batch would exceed the declared response byte limit, return the longest leading prefix that fits; never skip ahead, repeat an already-current triple, substitute wrong-version or wrong-iteration records, or self-validate. After accepted ingestion the application regenerates this stage from the newly missing set. The application reconciles the complete matrix mathematically and the stage cannot complete from a partial batch.',")
