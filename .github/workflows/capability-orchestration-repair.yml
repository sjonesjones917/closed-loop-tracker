          patch('workflow-schema.js','      "TEST_ID",\n      "REQ_ID",\n      "STATUS"\n    ]\n  },\n  "failureTests"','      "TEST_ID",\n      "REQ_ID",\n      "TEST_ARTIFACT_IDS",\n      "STATUS"\n    ]\n  },\n  "failureTests"')
          patch('workflow-schema.js','const RECORD_FIELD_TYPE_OVERRIDES=Object.freeze({',"const RECORD_FIELD_TYPE_OVERRIDES=Object.freeze({\n  'TEST':Object.freeze({EXECUTION_MODE:Object.freeze({valueType:'STRING',enumValues:TEST_EXECUTION_MODES,nullable:false,normalizerKey:null,closedProperties:null}),REQUIRED_CAPABILITIES:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),EXECUTABLE_ARTIFACT_REQUIRED:Object.freeze({valueType:'BOOLEAN',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),REQUIRED_ARTIFACTS:Object.freeze({valueType:'STRING',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),TEST_ARTIFACT_IDS:Object.freeze({valueType:'REFERENCE_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null})}),")
