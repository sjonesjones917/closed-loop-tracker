          patch('app-core.js',"function runBatchMarkup(n){if(![11,12,17,19].includes(n))return '';","function testExecutionGuidanceMarkup(n){const relevant=[6,7,8,9,10,11,12,17,19,22,23,24,25].includes(n);if(!relevant)return '';const tests=engine.records(current,'tests'),modes=new Map();for(const test of tests){const mode=String(recordValue(test,'EXECUTION_MODE')||'UNSPECIFIED').toUpperCase();modes.set(mode,(modes.get(mode)||0)+1);}const missingArtifacts=tests.filter(test=>recordValue(test,'EXECUTABLE_ARTIFACT_REQUIRED')===true&&!safe(recordValue(test,'TEST_ARTIFACT_IDS')).length),unavailable=tests.filter(test=>String(recordValue(test,'EXECUTION_MODE')||'').toUpperCase()==='UNAVAILABLE');let action=n===6&&!tests.length?'The agent will define how every test is executed. Executable files are required only when that verification method actually needs them.':missingArtifacts.length?`Attach the exact returned test artifact files before acceptance/completion (${missingArtifacts.length} test${missingArtifacts.length===1?'':'s'} still need verified bytes).`:unavailable.length?`Required verification capability is unavailable for ${unavailable.length} test${unavailable.length===1?'':'s'}. Use a capable environment or supply the missing evidence; the workflow remains blocked.`:modes.has('EXTERNAL_AGENT_TOOL')?'Run the controlling execution/verifier instruction in an agent environment that actually has the listed tools and canonical test artifacts.':modes.has('EXTERNAL_SYSTEM')?'Use the required external system, lab, machine, or specialist tool and return its structured result and evidence.':modes.has('INDEPENDENT_AGENT_REVIEW')?'Use a fresh independent reviewer for the tests assigned to independent review.':modes.has('HUMAN_INSPECTION')?'Complete only the explicitly human-owned inspection judgments when the stage asks for them.':'No separate test-execution action is currently identified for this stage.';const counts=[...modes].map(([mode,count])=>`${mode.replaceAll('_',' ')}: 