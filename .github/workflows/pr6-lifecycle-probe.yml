name: PR6 continuous lifecycle probe
on:
  push:
    branches:
      - practical-100/pr6-finalize
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check verify-full-cycle.mjs
          node verify-full-cycle.mjs
