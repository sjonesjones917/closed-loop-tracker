name: PR6 continuous lifecycle probe
on:
  push:
    branches:
      - practical-100/pr6-finalize
permissions:
  contents: write
jobs:
  lifecycle:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Stage 8 evidence repair
        run: python .pr6-stage8-patch.py
      - name: Verify lifecycle and existing suites
        run: |
          node --check response-ingestion.js
          node --check verify-full-cycle.mjs
          node verify-ingestion.mjs
          node verify-full-cycle.mjs
      - name: Commit proved repair and remove temporary probe
        run: |
          rm .pr6-stage8-patch.py
          rm .github/workflows/pr6-lifecycle-probe.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'PR 6: resolve response-local evidence relationships'
          git push
