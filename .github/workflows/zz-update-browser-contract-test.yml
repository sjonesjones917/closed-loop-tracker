name: Align browser assertions with human-first workflow
on:
  push:
    branches: [fix/human-first-stage-flow-20260827]
    paths: [.github/workflows/zz-update-browser-contract-test.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-first-stage-flow-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace obsolete browser expectations
        shell: python
        run: |
          from pathlib import Path
          p=Path('verify-browser.mjs')
          text=p.read_text(encoding='utf-8')
          replacements=[
            (
              "['Independent external sources only.','closed-loop-stage-response/2','PROMPT IDENTITY','Parse / validate response','Send instruction','Paste full response','Review and accept','Expand preview','exact controlling copy block','Complete JSON only']",
              "['Independent external sources only.','closed-loop-stage-response/2','PROMPT IDENTITY','Parse / validate response','Send instruction','Answer questions','Paste final JSON','Parse, review, accept','Expand preview','exact controlling copy block','Complete JSON only']"
            ),
            (
              "for(const token of ['Start with one thing: save the verbatim job request','one structured HUMAN_INPUT_REQUIRED response','STAGE 01 NEEDS YOUR JOB REQUEST'])assert(text.includes(token),`Stage 01 clarification experience missing ${token}.`);assert(!text.includes('plain-language questions before final JSON'),'Stage 01 UI still advertises the contradictory conversational-before-JSON path.');",
              "for(const token of ['Start with the verbatim job request','Use one ChatGPT conversation.','answer it in that ChatGPT conversation','do not re-enter the answer here','Paste only the final JSON from the agent','STAGE 01 NEEDS YOUR JOB REQUEST'])assert(text.includes(token),`Stage 01 human-first experience missing ${token}.`);for(const obsolete of ['one structured HUMAN_INPUT_REQUIRED response','record the answer in User Job Input and regenerate this instruction'])assert(!text.includes(obsolete),`Stage 01 UI still contains obsolete duplicate-entry guidance: ${obsolete}`);"
            )
          ]
          for old,new in replacements:
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:120]}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/zz-update-browser-contract-test.yml').unlink()
      - name: Run focused browser verification
        run: |
          node --check verify-browser.mjs
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER="$BROWSER" node verify-browser.mjs
          BROWSER="$BROWSER" node verify-browser-extra.mjs
      - name: Commit verified assertion update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser.mjs .github/workflows/zz-update-browser-contract-test.yml
          git diff --cached --check
          git commit -m "Test the human-first mobile workflow labels"
          git push origin HEAD:fix/human-first-stage-flow-20260827
