name: Apply current-base mobile replacement-state repair

on:
  push:
    branches:
      - fix/mobile-replacement-state-current-20260827

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[current-mobile-state-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply exact verified repair on current main
        run: node .maintenance-current-mobile-state.mjs
      - name: Build retained fixture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check test-fixtures.mjs
          node --check verify-hash.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-live.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
      - name: Verify canonical serialization and runtime identity
        run: node verify-hash.mjs
      - name: Verify workflow, persistence, ownership, and non-circularity
        run: node verify.mjs
      - name: Exercise all ingestion contracts including mobile smart quotes
        run: node verify-ingestion.mjs
      - name: Verify complete architecture
        run: node verify-complete.mjs
      - name: Prove the full lifecycle
        run: node verify-full-cycle.mjs
      - name: Reject prompt contradictions
        run: node verify-prompt-semantics.mjs
      - name: Run browser workflow and responsive checks
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-current-mobile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .maintenance-current-mobile-state.mjs .github/workflows/apply-current-mobile-state.yml
          git add -A
          git commit -m "Clarify unparsed replacements on current human-first workflow [current-mobile-state-clean]"
          git push origin HEAD:${GITHUB_REF_NAME}
