name: Semantic final consolidation
on:
  push:
    branches:
      - practical-100/semantic-final-consolidated
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/semantic-final-consolidated
          fetch-depth: 0
      - name: Apply consolidated semantic patch
        run: python3 semantic-consolidate.py
      - name: Verify consolidated source
        if: github.actor != 'github-actions[bot]'
        run: |
          node --check prompt-engine.js
          node --check app-core.js
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check response-ingestion.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          npm exec --yes playwright install chromium >/dev/null 2>&1 || true
          node verify-browser.mjs
          node verify-browser-extra.mjs
          git diff --check
      - name: Commit consolidated source
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js prompt-engine.js response-ingestion.js workflow-engine.js workflow-schema.js workbook.js verify-prompt-semantics.mjs
          git commit -m "Consolidate final semantic reliability fixes"
          git push origin HEAD:practical-100/semantic-final-consolidated
