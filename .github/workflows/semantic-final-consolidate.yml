name: Semantic final consolidation
on:
  push:
    branches:
      - practical-100/semantic-final-consolidated
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/semantic-final-consolidated
          fetch-depth: 0
      - name: Apply consolidated semantic patch
        run: |
          python3 semantic-consolidate.py
          sed -i 's/Research only the legitimate Stage 02 external governing source set/Research only the current accepted Stage 02 external governing source set/g' verify.mjs build-test-project.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs')
          s=p.read_text()
          old="if(!record.prompt.includes('do not claim it occurred; produce the complete implementation-ready specification'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');"
          new="if(!record.prompt.includes('do not simulate completion')||!record.prompt.includes('implementation-ready specification')||!record.prompt.includes('Never claim repository or deployment work occurred unless'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');"
          if old not in s:
              old="if(!record.prompt.includes('do not simulate completion')||!record.prompt.includes('implementation-ready specification')||!record.prompt.includes('current confirmed deliverable'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');"
          if old not in s: raise SystemExit('environment semantic assertion not found')
          s=s.replace(old,new,1)
          old_mut="original.prompt.replace('do not claim it occurred; produce the complete implementation-ready specification','assume implementation occurred')"
          if old_mut in s:s=s.replace(old_mut,"original.prompt.replace('do not simulate completion','simulate completion')",1)
          p.write_text(s)
          PY
      - name: Verify consolidated source
        if: github.actor != 'github-actions[bot]'
        run: |
          node --check prompt-engine.js
          node --check app-core.js
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check response-ingestion.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          npm exec --yes playwright install chromium >/dev/null 2>&1 || true
          node verify-browser.mjs
          node verify-browser-extra.mjs
          git diff --check
      - name: Commit consolidated source
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js prompt-engine.js response-ingestion.js workflow-engine.js workflow-schema.js workbook.js build-test-project.mjs verify.mjs verify-prompt-semantics.mjs
          git commit -m "Consolidate final semantic reliability fixes"
          git push origin HEAD:practical-100/semantic-final-consolidated
