name: Guarded final integration
on:
  push:
    branches: [reliability-execution-evidence-v2-20260827]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability-execution-evidence-v2-20260827}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply final integrated patch
        run: python3 .final-integrate.py
      - name: Deterministic acceptance
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-browser.mjs
          node --check verify-prompt-semantics.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified application changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-engine.js prompt-engine.js app-core.js index.html verify-prompt-semantics.mjs verify-browser.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make reliability guidance contextual and traceable'
          git push origin HEAD:reliability-execution-evidence-v2-20260827
