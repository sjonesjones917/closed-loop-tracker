name: Diagnose controlling spec repair

on:
  push:
    branches:
      - fix/controlling-spec-capture-once
    paths:
      - .github/workflows/diagnose-controlling-spec-fix.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture repair failure
        shell: bash
        run: |
          set +e
          python3 tools/execute-controlling-spec-repair.py > repair-v3-diagnostic.log 2>&1
          status=$?
          echo "exit_status=$status" >> repair-v3-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-v3-diagnostic.log
          git commit -m "Capture exact controlling-spec repair failure" || true
          git push origin HEAD:${GITHUB_REF_NAME}
          exit 0
