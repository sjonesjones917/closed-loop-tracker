name: Apply v3 migration repair
on:
  push:
    branches: [controlling-spec-final-current]
    paths: ['.github/workflows/apply-v3-migration.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: controlling-spec-final-current}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch and verify migration
        run: |
          python3 .github/patch_v3_migration.py
          node --check workbook.js
          node verify-v3-migration.mjs
          node verify-stage01-stage03-stage04-closure.mjs
      - name: Commit migration
        run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add workbook.js verify-v3-migration.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add deterministic project v2 to v3 migration"
          git push origin HEAD:controlling-spec-final-current
