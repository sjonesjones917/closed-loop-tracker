name: One-time exact scope regression correction
on:
  push:
    branches: [repair/spec-scope-current2-20260903]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-scope-current2-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct legacy scope regression
        run: node .repair-scope-regression.mjs
      - name: Prove ingestion and exact stage-operation scope
        run: |
          set -euo pipefail
          node --check verify-ingestion.mjs
          node verify-stage-operation-scope-matrix.mjs
          node verify-ingestion.mjs
      - name: Commit permanent regression only
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          git diff --cached --check
          git commit -m "Align clarification regression with exact Stage 17 scope"
          git push origin HEAD:repair/spec-scope-current2-20260903
