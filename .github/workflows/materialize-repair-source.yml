name: Materialize repair source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source-${{ github.event.pull_request.head.sha }}
          path: |
            *.js
            *.mjs
            *.json
            *.html
            README.md
            .nojekyll
            .github/workflows/pages.yml
          if-no-files-found: error
          retention-days: 1
