name: Repair obsolete prompt verifier assertions
on:
  push:
    branches:
      - controller3-prompt-byte-identity-rerun-20260904
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-prompt-byte-identity-rerun-20260904
      - name: Repair fixed-oracle verifier and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="for(const token of [`JOB_ID: ${p.job.JOB_ID}`,'PROJECT-SCOPE BOUNDARY','STRICT RESPONSE CONTRACT','closed-loop-stage-response/3','PROMPT IDENTITY — ECHO EXACTLY'])"
          new="for(const token of [`JOB_ID: ${p.job.JOB_ID}`,'PROJECT-SCOPE BOUNDARY','RESPONSE CONTRACT DEFINITIONS','closed-loop-stage-response/3'])"
          if old not in s:
              raise SystemExit('obsolete verifier assertion not found')
          p.write_text(s.replace(old,new))
          PY
          node verify.mjs
          rm .github/workflows/repair-verify-prompt-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs .github/workflows/repair-verify-prompt-contract.yml
          git commit -m "Repair obsolete prompt verifier assertions"
          git push origin HEAD:controller3-prompt-byte-identity-rerun-20260904