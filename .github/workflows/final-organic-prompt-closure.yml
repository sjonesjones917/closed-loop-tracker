name: Apply final prompt authority closure
on:
  push:
    branches: [practical-100/final-organic-prompt-closure]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-organic-prompt-closure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch existing responsible layers only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('prompt-engine.js')
          s=p.read_text()
          procedures=r'''const procedures={
          1:'Initialize only this current job from the exact current User Job Input. Preserve the verbatim objective, requested deliverable, supplied-material inventory and provenance, required format, temporal/geographic scope, user-supplied authority, available tools, prohibitions, explicit requirements, assumptions, and unresolved unknowns. Use the application-assigned JOB_ID and controlled input identity; never assign or alter them. Before normalizing the job, determine whether the requested deliverable can actually be produced in the available external agent environment. This static application itself has no external repository, account, deployment, or arbitrary execution access. If required implementation access is unavailable or the work is too large for reliable direct completion, define the most complete implementation-ready specification, architecture, patch plan, acceptance criteria, or other feasible deliverable instead of pretending implementation occurred. Self-contained deliverables that can actually be produced should still be produced. Do not begin Stage 02 research or downstream production work.',
          2:'Build the independent external source inventory for this current job only. Treat DESIRED OR SUGGESTED SOURCE COUNT as optional search-breadth guidance, never a quota and never authority to invent or pad sources. Search broadly enough to discover the relevant source landscape, then prefer the most authoritative, reputable, direct, and current source appropriate to each proposition; prioritize primary, official, controlling authority where it exists and use high-quality secondary sources for corroboration or context when appropriate. Verify identity, issuer/publisher, currency, supersession, applicability, and actual inspected content before relying on a source. Return fewer sources rather than weak or irrelevant ones; continue beyond the target when governing coverage requires it. User Job Input and supplied materials remain authorized project inputs but are not automatically independent external sources. Existing target/repository artifacts may be implementation evidence for an explicit audit or repair job, but they are not independent governing authority merely because they exist. The application assigns SOURCE_ID and source-set version after validated ingestion. If no legitimate external source applies, return the evidence-supported no-applicable-source determination rather than inventing one.',
          3:'Research only the current accepted Stage 02 independent external source set, source-by-source and pass-by-pass. Inspect exact relevant portions and separately capture facts, mandatory obligations, recommendations, optional practices, examples, prohibitions, exceptions, dependencies, applicability conditions, restrictions, invalidating material, conflicts, superseded guidance, source evidence, candidate requirements, and unresolved questions. Do not use the target product, this operating application, repository implementation, previous generated artifacts, or prior agent conclusions as independent requirement authority. Repeat discovery passes until saturation is supported by evidence, not merely asserted.',
          4:'Compile atomic requirement proposals from authorized User Job Input and legitimately applicable Stage 03 research. Each proposed requirement should express one independently testable obligation where practical and preserve mandatory/optional status, source or user-input provenance, exact source location when applicable, authority, applicability, dependencies, prohibitions, defined terms, observable satisfaction condition, intended verification method, expected evidence, failure condition, severity, and notes. The application assigns REQ_ID and controlled requirement-set identity. Do not infer requirements from implementation behavior merely because it exists.',
          5:'Resolve defects in the current requirement set before production instructions are written. Detect duplicates, conflicts, impossible combinations, undefined terms, circular dependencies, missing prerequisites, unsupported requirements, uncertain applicability, and missing verification paths. Preserve the substantive defect, governing evidence, proposed resolution or unresolved state, affected requirements, and blockers. Human authority decides genuine user tradeoffs; the application controls canonical versions and downstream invalidation. Never silently guess away a conflict or manufacture authority.',
          6:'Build verification-test proposals before any production instruction is authored. Every active mandatory requirement must have at least one applicable ready test. Use the strongest suitable method: exact computation, programmatic/schema/structure checks, source comparison, rule-based verification, or independent human meaning/content review when deterministic testing cannot establish satisfaction. Define inputs, tools, procedure, expected result, failure condition, and evidence to preserve. The application assigns TEST_ID and calculates mandatory requirement-to-test coverage; do not set IDs, counts, or coverage values.',
          7:'Build substantive failure/mutation-test proposals that demonstrate validators reject realistic invalid states. Include applicable missing inputs, invalid values, wrong versions, duplicate identifiers, contradictions, omitted required sections, prohibited material, corrupt references, malformed files, conflicting authority, unavailable tools, unsupported claims, injected source instructions, known-invalid artifacts, and other relevant mutations. Preserve fixture, expected rejection, actual observed result, validator defect where applicable, and evidence. The application controls canonical IDs, suite identity, lifecycle state, and derived coverage.',
          8:'Author the production instruction from the resolved current requirements and verification architecture. Define objective, authorized inputs, authority rules, failure handling, scope, prohibitions, defined terms, ordered procedure, branches, tool requirements, output contract, TRUE/FALSE/UNKNOWN handling, rejection/blocking rules, completion conditions, and exact requirement traceability. Do not copy an existing implementation as authority. Make the instruction model-agnostic and explicit enough for capable OpenAI, Anthropic, or other instruction-following agents without relying on vendor-specific hidden behavior. The application controls canonical instruction identity/version after accepted ingestion.',
          9:'Preflight the current production instruction independently without executing target production. Review every material clause for ambiguity, undefined objects, unsupplied dependencies, internal conflicts, unavailable capabilities, objective verifiability, responsible operation, ordering, failure behavior, output-contract completeness, and traceability. Preserve findings and evidence. If correction is needed, identify the exact defect and proposed correction; the application controls versioning and repeated-review state.',
          10:'Review the exact candidate selected by human authority for this iteration. The application assigns CANDIDATE_ID and ITERATION_ID, freezes the selected component identities and actual bytes, calculates hashes, and prevents mutation in place. Report only permitted substantive observations about component completeness, role distribution, tool configuration, settings, permissions, limitations, or discrepancies. The same application-frozen candidate must be used unchanged across the ten-run batch.',
          11:'Execute the application-reserved run in the exact fresh context and frozen candidate identified by scope. Report only actual execution observations, contamination facts, tool configuration, complete substantive output, tool failures, limitations, and evidence. The application owns RUN_ID, CONTEXT_ID, candidate identity, timestamps, lifecycle state, receipt identity, canonical artifact identity, byte size, and hashes. Do not see or use another run’s output, reviewer comments, prior failure explanations, or proposed corrections.',
          12:'Independently verify the current iteration by producing exactly one applicable verification proposal for every required current REQ_ID × RUN_ID × TEST_ID triple authorized by the operation. Preserve verifier/context independence, inputs, procedure, expected result, observed result, exact evidence, substantive SATISFIED/VIOLATED/UNDETERMINED determination, defect relationship where applicable, and reason for UNDETERMINED. Do not omit or duplicate triples, substitute stale tests/runs, or self-validate. The application calculates expected triples, uniqueness, counts, and matrix completeness.',
          13:'Compare all ten current executions requirement-by-requirement. Report substantive per-run observations, interpretation/output variance, whether variance appears authorized, inconclusive tests, repeated and unique failure patterns, correctness-affecting variance, linked defects, and evidence. The application calculates all-ten satisfaction, any-violation, any-undetermined, counts, and completeness. Never discard a run because another appears preferable.',
          14:'Root-cause every current material defect by tracing backward through product/output, execution, instruction, requirement, research, source, user input, tool, and audit as applicable. Identify the earliest defective layer, classify the substantive cause using allowed categories, preserve evidence, and identify required downstream rework. An unknown root cause remains unresolved; do not patch only the final symptom when an earlier layer is responsible.',
          15:'Convert every confirmed defect into a permanent regression definition and actual pre-correction execution evidence. Preserve failure fixture and byte identity where available, reproduction procedure, detection method, applicability, permanent test location, expected corrected behavior, and evidence proving the current/pre-correction failure. The application assigns REG_ID and lifecycle state. Do not claim post-correction success at Stage 15; correction occurs later and success must come from an actual later regression execution.',
          16:'Propose correction only to the earliest responsible defective layer. Preserve triggering defects, RCA, old artifact identity/version, exact proposed modification, required reruns, instruction-change analysis, repeated-preflight need, and justified unchanged artifacts. Human authority authorizes genuine decisions. The application assigns CHANGESET_ID, creates new versions, performs conservative downstream invalidation, and never modifies controlled versions in place.',
          17:'Perform only the declared Stage 17 operation for the application-created corrected iteration/candidate. FREEZE is application/human controlled; EXECUTE_RUN uses the exact reserved run/context; VERIFY creates current verification proposals; COMPARE reports cross-run findings; ROOT_CAUSE analyzes current defects; REGRESSION defines or executes regressions as permitted; CORRECT proposes responsible-layer changes. Use ten new independent contexts, one identical corrected frozen candidate, and withhold prior outputs. Never invent iteration, candidate, run, or context identities.',
          18:'Review the latest completed corrected iteration for convergence anomalies or missing evidence. The application calculates requirement coverage, exact verification coverage, applicable regression success, critical/major defect counts, mandatory unknowns, contradictions, ambiguities, unexplained correctness-affecting variance, and the final convergence Boolean from that exact iteration. Do not set or override application-derived convergence values.',
          19:'Perform only the declared unchanged-confirmation operation using the exact converged Stage 17 candidate identity and hashes with zero material change. Use the application-reserved new contexts/runs, rerun the complete required verification matrix and applicable regressions, compare all runs, and report any new defect, missed requirement, missed failure case, or unexplained correctness-affecting variance. The application owns confirmation iteration/run/context identities and evaluates unchanged confirmation.',
          20:'Inspect the proposed production baseline only after successful unchanged confirmation. Human authority authorizes the baseline. The application assigns BASELINE_ID, freezes exact approved versions and artifact bytes, calculates hashes, and records immutable baseline identity/status. Report substantive discrepancies or blockers only; do not assign baseline identity, hashes, authorization, or lifecycle state.',
          21:'Produce the approved deliverable in a fresh production context using only approved baseline materials when the actual external agent environment can do so reliably. This static application itself cannot modify an external repository, account, deployment, or system. If the approved deliverable is an implementation-ready specification because direct implementation is unavailable or too large, produce that complete specification rather than pretend code was changed. Self-contained artifacts that can actually be produced should be produced. The application reserves PRODUCT_ID and execution identity and is authoritative for actual persisted artifact bytes, filenames, media types, sizes, SHA-256, storage references, versions, and lineage. Report only permitted substantive execution results, deviations, failures, and artifact claims.',
          22:'Perform the substantive deterministic checks actually supported against the current finished product bytes and report test procedure, expected result, actual observed result, evidence, and defect linkage. Never claim a check ran when it did not. The application determines the expected current deterministic-test set and owns product/file identities, hashes, counts, completeness, and gate calculations.',
          23:'Perform independent meaning/content verification where deterministic checks cannot establish substantive satisfaction. For every current requirement that needs meaning review, preserve product location, source/user authority evidence as applicable, required meaning, observed meaning, evidence-based comparison, substantive SATISFIED/VIOLATED/UNDETERMINED result, defect link, and reason for UNDETERMINED. The reviewer must be independent from product generation; the application owns counts/completeness and canonical identities.',
          24:'Perform actual adversarial verification against the current product. Test applicable missing material, prohibited material, contradictions, impossible logic, unsupported facts, source misrepresentation, wrong versions, broken references, hidden assumptions, partial completion, nonsensical meaning, terminology inconsistency, unhandled exceptions, stale facts, malformed files, hidden content, export corruption, superficial keyword compliance, and active historical regression patterns. Preserve attack, method, expected behavior, actual result, severity, defects, and evidence. Do not claim attacks that were not executed.',
          25:'Inspect the exact final representations and package selected by the application. Report substantive rendering/opening observations, clipping, blank/missing content, broken layout, graphics, font substitution, overlap, hidden content, ordering, export corruption, package defects, and irreducible reviewer/human judgments with evidence. The application derives canonical artifact inventory, filenames, byte sizes, SHA-256, objective file facts, and coverage counts from actual stored bytes; do not overwrite those facts.',
          26:'Independently review process evidence and product evidence as separate propositions and report substantive discrepancies, unauthorized-modification evidence, chain-of-custody issues, missing evidence, defects, blockers, and review findings. The application calculates canonical counts, identities, completeness, reconciliation state, and gate results. Neither process correctness nor product correctness proves the other.',
          27:'Review the complete current release evidence for substantive gaps, contradictions, unsupported findings, unresolved defects, blockers, stale evidence, or other release-relevant problems. Do not set a release state. The application alone evaluates the complete current evidence and creates exactly one idempotent ACCEPTED, REJECTED, or BLOCKED release determination. Human or agent preference cannot override it, and ACCEPTED does not itself authorize delivery.',
          28:'After the current Stage 27 result is ACCEPTED, investigate only discrepancies the application cannot explain deterministically. The application performs the authoritative immediate pre-release byte comparison, joining audited canonical artifacts and selected delivery bytes by canonical identity plus authorized filename and comparing actual byte size and SHA-256 independent of file-selection order. Do not assert identity from metadata, names alone, or array position.',
          29:'Investigate any traceability gap identified by the application. The application constructs the complete evidence graph for every current mandatory requirement from canonical IDs: external source or human authority as applicable → requirement → instruction trace → execution or product element → every applicable test → every required test result → canonical evidence → current release decision → every applicable released artifact identity. Do not fabricate links or substitute a raw response ID for canonical evidence.',
          30:'Provide substantive defect/regression findings or correction evidence when needed. The application maintains append-only defect and regression history, stable canonical IDs, supersession relationships, counts, integrity state, and lifecycle state. Never rewrite history. Every confirmed defect must retain a permanent regression definition, and the latest applicable actual regression execution must succeed before baseline approval.'
          };'''
          s2,n=re.subn(r'const procedures=\{.*?\n\};',procedures,s,count=1,flags=re.S)
          assert n==1
          old=" const corrections=(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy&&(!x.operation||x.operation===operation)&&(!x.scope||samePromptScope(x.scope,scope))).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}));if(corrections.length)parts.push(`OPERATOR REQUESTED CORRECTIONS / REFINEMENTS\\n${show(corrections)}`);\n const op="
          new=" const corrections=(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy&&(!x.operation||x.operation===operation)&&(!x.scope||samePromptScope(x.scope,scope))).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}));if(corrections.length)parts.push(`OPERATOR REQUESTED CORRECTIONS / REFINEMENTS\\n${show(corrections)}`);\n const failed=(state?.projectData?.responseValidations||[]).filter(x=>Number(x.stage)===stage&&x.valid===false&&(!x.operation||x.operation===operation)&&(!x.scope||samePromptScope(x.scope,scope))).at(-1);if(failed)parts.push(`LATEST APPLICATION VALIDATION FAILURE TO CORRECT\\n${show({validationId:failed.validationId,issues:(failed.issues||[]).map(i=>({code:i.code,path:i.path,message:i.message}))})}`);\n const op="
          assert old in s2
          s2=s2.replace(old,new,1)
          s2=s2.replace("The project target is treated as not yet existing until Stage 21. The operating application, its repository, source code, UI, stored state, screenshots, prior target versions, generated project artifacts, and other implementations of the same target are never Stage 02 governing sources or Stage 03 requirement authority. They may be used only for implementation-side work when a project explicitly concerns implementation verification.","For a creation job, do not treat the requested new target as already existing before Stage 21. For an explicit audit, repair, migration, or modification job, supplied existing-target artifacts may be inspected as implementation evidence, but they are not independent external authority merely because they exist. The operating application, repository implementation, generated project artifacts, and prior agent conclusions are never Stage 02 independent governing authority or Stage 03 requirement authority without a separately established independent source.")
          s2=s2.replace("- Do not include collections or fields outside the current stage contract.","- Do not include collections or fields outside the current stage and operation contract.")
          s2=s2.replace("- Stage 02 may contain only genuinely independent external governing sources; target-product and repository artifacts are prohibited.\n- Stage 03 may research only accepted Stage 02 external governing sources.","- Stage 02 may contain only genuinely independent external sources appropriate to the job; target/repository artifacts are implementation evidence, not independent external authority.\n- Stage 03 may research only the current accepted Stage 02 independent external source set.")
          s2=s2.replace("Missing, stale, or incomplete canonical application context requires BLOCKED with MISSING_APPLICATION_CONTEXT. An unavailable external capability", "Missing, stale, or incomplete canonical application context requires BLOCKED with MISSING_APPLICATION_CONTEXT. A materially inadequate accepted prior-stage result requires BLOCKED with INADEQUATE_PRIOR_OUTPUT and must identify the earliest result needing refinement. An unavailable external capability")
          old_manifest="operatorCorrectionRequests:(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy&&(!x.operation||x.operation===operation)&&(!x.scope||samePromptScope(x.scope,scope))).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}))};"
          new_manifest="operatorCorrectionRequests:(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy&&(!x.operation||x.operation===operation)&&(!x.scope||samePromptScope(x.scope,scope))).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId})),latestValidationFailure:(state?.projectData?.responseValidations||[]).filter(x=>Number(x.stage)===stage&&x.valid===false&&(!x.operation||x.operation===operation)&&(!x.scope||samePromptScope(x.scope,scope))).slice(-1).map(x=>({validationId:x.validationId,rawResponseId:x.rawResponseId,issues:(x.issues||[]).map(i=>({code:i.code,path:i.path,message:i.message}))}))};"
          assert old_manifest in s2
          s2=s2.replace(old_manifest,new_manifest,1)
          p.write_text(s2)

          q=Path('response-ingestion.js')
          x=q.read_text()
          if "'INADEQUATE_PRIOR_OUTPUT'" not in x:
            x=x.replace("'MISSING_APPLICATION_CONTEXT','MISSING_AUTHORITY'","'MISSING_APPLICATION_CONTEXT','INADEQUATE_PRIOR_OUTPUT','MISSING_AUTHORITY'",1)
          q.write_text(x)
      - name: Strengthen permanent semantic verifier
        shell: python
        run: |
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          insert=r'''
          const forbiddenProcedureSemantics=[
            [/Assign and preserve this job’s unique JOB_ID/i,'AGENT_ASSIGNS_JOB_ID'],[/Create SOURCE-SET-vN/i,'AGENT_CREATES_SOURCE_SET'],[/Each REQ_ID must express/i,'AGENT_COORDINATES_REQ_ID'],[/Calculate mandatory requirement-to-test coverage exactly/i,'AGENT_CALCULATES_COVERAGE'],[/Assign CANDIDATE_ID and ITERATION_ID/i,'AGENT_ASSIGNS_CANDIDATE'],[/Assign BASELINE_ID/i,'AGENT_ASSIGNS_BASELINE'],[/Assign PRODUCT_ID, PRODUCT_VERSION/i,'AGENT_ASSIGNS_PRODUCT'],[/produce exactly one determination/i,'AGENT_SETS_RELEASE'],[/Determine convergence.*Calculate mandatory requirement coverage/i,'AGENT_CALCULATES_CONVERGENCE']
          ];
          for(const [pattern,code] of forbiddenProcedureSemantics)for(const [stage,text] of Object.entries(prompts.procedures))if(pattern.test(text))throw new Error(`Stage ${stage} prompt authority contradiction: ${code}`);
          const requiredProcedureSemantics={1:['application-assigned JOB_ID','implementation-ready specification'],2:['optional search-breadth guidance','application assigns SOURCE_ID'],6:['application assigns TEST_ID','calculates mandatory requirement-to-test coverage'],10:['application assigns CANDIDATE_ID and ITERATION_ID'],12:['REQ_ID × RUN_ID × TEST_ID'],15:['Do not claim post-correction success'],18:['application calculates requirement coverage'],20:['Human authority authorizes the baseline','application assigns BASELINE_ID'],21:['implementation-ready specification','application reserves PRODUCT_ID'],27:['Do not set a release state','application alone evaluates'],28:['application performs the authoritative immediate pre-release byte comparison'],29:['application constructs the complete evidence graph'],30:['application maintains append-only defect and regression history']};
          for(const [stage,phrases] of Object.entries(requiredProcedureSemantics))for(const phrase of phrases)if(!prompts.procedures[Number(stage)].includes(phrase))throw new Error(`Stage ${stage} missing required prompt semantic: ${phrase}`);
          '''
          marker='function semanticIssues(record){'
          assert marker in s and 'forbiddenProcedureSemantics' not in s
          s=s.replace(marker,insert+'\n'+marker,1)
          # Add validation feedback regression before final console.
          add=r'''
          {
            const p=baseProject();p.projectData.responseValidations.push({validationId:'VALIDATION-SCOPED',rawResponseId:'RAW-SCOPED',stage:17,operation:'EXECUTE_RUN',scope:{iterationId:'ITERATION-000001',candidateId:'CANDIDATE-000001',runId:'RUN-000001',contextId:'CONTEXT-000001'},valid:false,issues:[{code:'MISSING_REQUIRED_FIELD',path:'/records/runs/0/fields/COMPLETE_OUTPUT',message:'Complete output is required.'}]});
            const r=prompts.buildPromptRecord(17,p,{operation:'EXECUTE_RUN',scope:{projectRevision:0,inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001',instructionVersion:'INSTRUCTION-v001',iterationId:'ITERATION-000001',candidateId:'CANDIDATE-000001',runId:'RUN-000001',contextId:'CONTEXT-000001'}});
            if(!r.prompt.includes('VALIDATION-SCOPED')||!r.prompt.includes('Complete output is required.'))throw new Error('Scoped validation failure is not included in replacement prompt context.');
          }
          '''
          marker2='console.log(JSON.stringify('
          assert marker2 in s
          s=s.replace(marker2,add+'\n'+marker2,1)
          p.write_text(s)
      - name: Run complete deterministic proof
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit permanent changes and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/final-organic-prompt-closure.yml
          git add prompt-engine.js response-ingestion.js verify-prompt-semantics.mjs .github/workflows/final-organic-prompt-closure.yml
          git commit -m "Close prompt authority and recovery contradictions"
          git push origin HEAD:practical-100/final-organic-prompt-closure
