name: Correct Stage 25 structured determination
on:
  push:
    branches: [fix/zero-loss-controlled-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Stage 25 responsible-layer correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          anchor="function evaluateResultConsistency(collection,record,test,project){\n"
          helper="""function parseRepresentationInspectionObservation(record){
            const reasons=[],normalizeList=value=>[...new Set(safe(value).map(x=>String(x??'').trim()).filter(Boolean))].sort(),sameSet=(a,b)=>hash.sha256Value(normalizeList(a))===hash.sha256Value(normalizeList(b));
            let payload=null;try{payload=JSON.parse(String(recordValue(record,'OBSERVATIONS')||''));}catch{reasons.push('OBSERVATIONS must be the contracted strict JSON coverage object.');return {valid:false,reasons,payload:null};}
            if(!payload||typeof payload!=='object'||Array.isArray(payload)){reasons.push('OBSERVATIONS coverage payload is not an object.');return {valid:false,reasons,payload:null};}
            const requiredPageOrViewIds=normalizeList(payload.requiredPageOrViewIds),inspectedPageOrViewIds=normalizeList(payload.inspectedPageOrViewIds),requiredPackagedFileIds=normalizeList(payload.requiredPackagedFileIds),openedOrTestedPackagedFileIds=normalizeList(payload.openedOrTestedPackagedFileIds),requiredTransformationIds=normalizeList(payload.requiredTransformationIds),inspectedTransformationIds=normalizeList(payload.inspectedTransformationIds),observation=String(payload.observation||'').trim();
            if(!sameSet(requiredPageOrViewIds,inspectedPageOrViewIds))reasons.push('required page/view identities do not exactly match inspected page/view identities.');
            if(!sameSet(requiredPackagedFileIds,openedOrTestedPackagedFileIds))reasons.push('required packaged-file identities do not exactly match opened/tested packaged-file identities.');
            if(!sameSet(requiredTransformationIds,inspectedTransformationIds))reasons.push('required transformation identities do not exactly match inspected transformation identities.');
            if(!observation)reasons.push('representation observation is empty.');
            return {valid:reasons.length===0,reasons,payload,requiredPageOrViewIds,inspectedPageOrViewIds,requiredPackagedFileIds,openedOrTestedPackagedFileIds,requiredTransformationIds,inspectedTransformationIds,observation};
          }

          """
          if helper.strip() not in s:
              if anchor not in s: raise SystemExit('evaluateResultConsistency anchor missing')
              s=s.replace(anchor,helper+anchor,1)
          old="""  else if(collection==='representationInspections'){if(!evidence.sufficient)reasons.push(...evidence.reasons);const epistemic=evaluateEvidenceSufficiency(project,{result:record});if(!epistemic.sufficient)reasons.push(...epistemic.reasons);const defectId=String(recordValue(record,'DEFECT_ID')||record.relationships?.DEFECT_ID||'').trim(),artifactId=String(recordValue(record,'ARTIFACT_ID')||record.relationships?.ARTIFACT_ID||''),artifact=recordsForCurrentScope(project,'artifacts').find(a=>recordId(a,'artifacts')===artifactId),rendered=!adjudicationEmpty(recordValue(record,'RENDERING_OPENING_EVIDENCE')),observations=upper(recordValue(record,'OBSERVATIONS'));if(defectId)determination='VIOLATED';else if(!artifact||!rendered)determination='UNDETERMINED';else if(['NONE','NO DEFECT','NO DEFECTS','NO MATERIAL DEFECT','NO MATERIAL DEFECTS'].includes(observations))determination='SATISFIED';else determination='UNDETERMINED';if(reasons.length&&determination==='SATISFIED')determination='UNDETERMINED';}
          """
          new="""  else if(collection==='representationInspections'){if(!evidence.sufficient)reasons.push(...evidence.reasons);const epistemic=evaluateEvidenceSufficiency(project,{result:record});if(!epistemic.sufficient)reasons.push(...epistemic.reasons);const defectId=String(recordValue(record,'DEFECT_ID')||record.relationships?.DEFECT_ID||'').trim(),artifactId=String(recordValue(record,'ARTIFACT_ID')||record.relationships?.ARTIFACT_ID||''),artifact=recordsForCurrentScope(project,'artifacts').find(a=>recordId(a,'artifacts')===artifactId),rendered=!adjudicationEmpty(recordValue(record,'RENDERING_OPENING_EVIDENCE')),coverage=parseRepresentationInspectionObservation(record);if(!coverage.valid)reasons.push(...coverage.reasons);if(defectId)determination='VIOLATED';else if(!artifact||!rendered||!coverage.valid)determination='UNDETERMINED';else determination='SATISFIED';if(reasons.length&&determination==='SATISFIED')determination='UNDETERMINED';}
          """
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Stage 25 evaluator block mismatch')
          old2="""  const normalizeList=value=>[...new Set(safe(value).map(x=>String(x??'').trim()).filter(Boolean))].sort();
            const sameSet=(a,b)=>hash.sha256Value(normalizeList(a))===hash.sha256Value(normalizeList(b));
            let totalPagesOrViewsRequired=0,totalPagesOrViewsInspected=0,totalPackagedFilesRequired=0,totalPackagedFilesOpenedOrTested=0,totalTransformationsRequired=0,totalTransformationsInspected=0;
          """
          new2="""  let totalPagesOrViewsRequired=0,totalPagesOrViewsInspected=0,totalPackagedFilesRequired=0,totalPackagedFilesOpenedOrTested=0,totalTransformationsRequired=0,totalTransformationsInspected=0;
          """
          if old2 in s: s=s.replace(old2,new2,1)
          old3="""    const inspection=rows[0];let payload=null;try{payload=JSON.parse(String(recordValue(inspection,'OBSERVATIONS')||''));}catch{reasons.push(`${recordId(inspection,'representationInspections')}: OBSERVATIONS must be the contracted strict JSON coverage object.`);continue;}
              if(!payload||typeof payload!=='object'||Array.isArray(payload)){reasons.push(`${recordId(inspection,'representationInspections')}: OBSERVATIONS coverage payload is not an object.`);continue;}
              const requiredPageOrViewIds=normalizeList(payload.requiredPageOrViewIds),inspectedPageOrViewIds=normalizeList(payload.inspectedPageOrViewIds),requiredPackagedFileIds=normalizeList(payload.requiredPackagedFileIds),openedOrTestedPackagedFileIds=normalizeList(payload.openedOrTestedPackagedFileIds),requiredTransformationIds=normalizeList(payload.requiredTransformationIds),inspectedTransformationIds=normalizeList(payload.inspectedTransformationIds),observation=String(payload.observation||'').trim();
              totalPagesOrViewsRequired+=requiredPageOrViewIds.length;totalPagesOrViewsInspected+=inspectedPageOrViewIds.length;totalPackagedFilesRequired+=requiredPackagedFileIds.length;totalPackagedFilesOpenedOrTested+=openedOrTestedPackagedFileIds.length;totalTransformationsRequired+=requiredTransformationIds.length;totalTransformationsInspected+=inspectedTransformationIds.length;
              if(!sameSet(requiredPageOrViewIds,inspectedPageOrViewIds))reasons.push(`${artifactId}: required page/view identities do not exactly match inspected page/view identities.`);
              if(!sameSet(requiredPackagedFileIds,openedOrTestedPackagedFileIds))reasons.push(`${artifactId}: required packaged-file identities do not exactly match opened/tested packaged-file identities.`);
              if(!sameSet(requiredTransformationIds,inspectedTransformationIds))reasons.push(`${artifactId}: required transformation identities do not exactly match inspected transformation identities.`);
              if(!observation)reasons.push(`${artifactId}: representation observation is empty.`);
              details.push({artifactId,requiredPageOrViewIds,inspectedPageOrViewIds,requiredPackagedFileIds,openedOrTestedPackagedFileIds,requiredTransformationIds,inspectedTransformationIds,observation});
          """
          new3="""    const inspection=rows[0],coverage=parseRepresentationInspectionObservation(inspection);if(!coverage.valid){for(const reason of coverage.reasons)reasons.push(`${recordId(inspection,'representationInspections')}: ${reason}`);if(!coverage.payload)continue;}
              const {requiredPageOrViewIds,inspectedPageOrViewIds,requiredPackagedFileIds,openedOrTestedPackagedFileIds,requiredTransformationIds,inspectedTransformationIds,observation}=coverage;
              totalPagesOrViewsRequired+=requiredPageOrViewIds.length;totalPagesOrViewsInspected+=inspectedPageOrViewIds.length;totalPackagedFilesRequired+=requiredPackagedFileIds.length;totalPackagedFilesOpenedOrTested+=openedOrTestedPackagedFileIds.length;totalTransformationsRequired+=requiredTransformationIds.length;totalTransformationsInspected+=inspectedTransformationIds.length;
              details.push({artifactId,requiredPageOrViewIds,inspectedPageOrViewIds,requiredPackagedFileIds,openedOrTestedPackagedFileIds,requiredTransformationIds,inspectedTransformationIds,observation});
          """
          if old3 in s: s=s.replace(old3,new3,1)
          elif new3 not in s: raise SystemExit('Stage 25 aggregate coverage block mismatch')
          p.write_text(s)

          q=Path('verify-semantic-invariant.mjs');t=q.read_text();marker='// Trace integrity is fail-closed: missing evidence/identity/layer linkage cannot pass RCA or changeset validation.\n'
          reg="""// Stage 25 uses one strict structured coverage semantics for both aggregate coverage and effective determination.
          {
           const representationScope={...scope,productId:'PRODUCT-REP'};
           p.job.CURRENT_PRODUCT_ID='PRODUCT-REP';
           p.projectData.artifacts.push({id:'ART-REP',stage:25,active:true,scope:representationScope,fields:{ARTIFACT_ID:'ART-REP',FILENAME:'delivery.pdf',SHA256:'b'.repeat(64),AVAILABILITY:'BYTES_PERSISTED_AND_VERIFIED'}});
           p.projectData.evidenceRecords.push({id:'EVIDENCE-REP',stage:25,active:true,scope:representationScope,fields:{EVIDENCE_ID:'EVIDENCE-REP',KIND:'REPRESENTATION_INSPECTION',AUTHORITY_TYPE:'INDEPENDENT_REVIEWER',DESCRIPTION:'Representation opened and inspected.',CONTENT:'All contracted views and packaged files were inspected.'}});
           const structuredObservation=JSON.stringify({requiredPageOrViewIds:['VIEW-1'],inspectedPageOrViewIds:['VIEW-1'],requiredPackagedFileIds:['FILE-1'],openedOrTestedPackagedFileIds:['FILE-1'],requiredTransformationIds:['TRANSFORM-1'],inspectedTransformationIds:['TRANSFORM-1'],observation:'No material representation defect observed.'});
           const good=record('representationInspections',{ARTIFACT_ID:'ART-REP',OBSERVATIONS:structuredObservation,RENDERING_OPENING_EVIDENCE:'EVIDENCE-REP',DETERMINATION:'SATISFIED'},{stage:25,scope:{productId:'PRODUCT-REP'},evidenceRefs:['EVIDENCE-REP']});
           good.id='INSPECTION-REP-GOOD';good.relationships={ARTIFACT_ID:'ART-REP'};p.projectData.representationInspections.push(good);
           const effective=engine.evaluateResultConsistency('representationInspections',good,null,p);assert(effective.determination==='SATISFIED','Strict Stage 25 coverage JSON was not accepted by effective determination');
           const aggregate=engine.representationInspectionCoverage(p);assert(aggregate.complete,'Strict Stage 25 coverage JSON was not accepted by aggregate coverage');
           good.fields.OBSERVATIONS=JSON.stringify({...JSON.parse(structuredObservation),inspectedPageOrViewIds:[]});
           const broken=engine.evaluateResultConsistency('representationInspections',good,null,p);assert(broken.determination!=='SATISFIED','Incomplete Stage 25 structured coverage was accepted by effective determination');
           p.projectData.representationInspections.pop();p.projectData.evidenceRecords.pop();p.projectData.artifacts.pop();delete p.job.CURRENT_PRODUCT_ID;
          }

          """
          if reg.strip() not in t:
              if marker not in t: raise SystemExit('semantic regression insertion anchor missing')
              t=t.replace(marker,reg+marker,1)
          q.write_text(t)
          PY
      - name: Prove focused regression
        run: |
          node --check workflow-engine.js
          node --check verify-semantic-invariant.mjs
          node verify-semantic-invariant.mjs
      - name: Commit correction and remove one-shot repair workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-stage25-evaluator.yml
          git add workflow-engine.js verify-semantic-invariant.mjs
          git diff --cached --check
          git commit -m "Align Stage 25 effective determination with structured coverage"
          git push origin HEAD:fix/zero-loss-controlled-20260831
