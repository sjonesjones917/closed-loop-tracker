name: Surgical verification batch-plan proof
on:
  push:
    branches: [reliability/verification-batch-plan-final]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/verification-batch-plan-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimum bounded continuation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          p=Path('prompt-engine.js'); s=p.read_text()
          old="const hash=globalThis.closedLoopHash;\nif(!core||!schema||!hash)throw new Error('workbook.js, hash.js, and workflow-schema.js must load before prompt-engine.js.');"
          new="const hash=globalThis.closedLoopHash;\nconst workflow=globalThis.closedLoopWorkflowEngine;\nif(!core||!schema||!hash||!workflow)throw new Error('workbook.js, hash.js, workflow-schema.js, and workflow-engine.js must load before prompt-engine.js.');"
          if old not in s: raise SystemExit('Prompt dependency anchor missing')
          s=s.replace(old,new,1)

          old="12:'Verify each current execution independently. Produce one substantive verification proposal for every required REQ_ID × RUN_ID × TEST_ID triple in the current operation scope, preserving verifier and verifier-context identity, independence status, inputs, procedure, expected result, observed result, exact evidence, SATISFIED/VIOLATED/UNDETERMINED, defect reference where applicable, and reason for UNDETERMINED. Do not omit or duplicate required triples, substitute wrong-version or wrong-iteration records, or self-validate. The application reconciles matrix counts and completeness mathematically.',"
          new="12:'Verify each current execution independently. Execute only the currently missing REQ_ID × RUN_ID × TEST_ID triples listed by the application in VERIFICATION BATCH PLAN, in listed order. Preserve verifier and verifier-context identity, independence status, inputs, procedure, expected result, observed result, exact evidence, SATISFIED/VIOLATED/UNDETERMINED, defect reference where applicable, and reason for UNDETERMINED. If the complete listed batch would exceed the declared response byte limit, return the longest leading prefix that fits; never skip ahead, repeat an already-current triple, substitute wrong-version or wrong-iteration records, or self-validate. After accepted ingestion the application regenerates this stage from the newly missing set. The application reconciles the complete matrix mathematically and the stage cannot complete from a partial batch.',"
          if old not in s: raise SystemExit('Stage 12 procedure anchor missing')
          s=s.replace(old,new,1)

          old="function boundedCollection(state,collection,scope={}){\n const selected=selectedContextRecords(state,collection,scope);if(!selected.length)return 'NONE';\n return show({totalSelected:selected.length,records:selected.map(record=>({id:recordId(record,collection),stage:record.stage??'UNKNOWN',scope:record.scope||{},fields:record.fields||record,relationships:record.relationships||{},contentSha256:record.contentSha256||record.sha256||'UNKNOWN'})),omitted:0,selectionRule:'Only active records matching the explicit operation read contract and controlling prompt scope are selected; large artifact bytes are referenced by canonical artifact identity.'});\n}"
          new="function verificationBatchPlan(stage,state,operation,scope={}){\n const applicable=stage===12||((stage===17||stage===19)&&operation==='VERIFY');if(!applicable||!scope?.iterationId)return null;\n const matrix=workflow.verificationMatrix(state,scope.iterationId),limit=Math.max(1,Number(schema.STAGE_CONTRACTS[stage]?.resourceLimits?.maxRecordsPerCollection||250));\n let missing=matrix.missing.map(key=>{const [requirementId,runId,testId]=String(key).split('|');return {requirementId,runId,testId};});if(scope.runId)missing=missing.filter(item=>item.runId===String(scope.runId));\n const triples=missing.slice(0,limit);return {expectedMatrixTotal:matrix.expected.length,completedMatrixTotal:matrix.expected.length-matrix.missing.length,remainingInOperationBeforeBatch:missing.length,batchRecordLimit:limit,batchSize:triples.length,continuationRequired:missing.length>triples.length,triples};\n}\nfunction contextRecordsFor(state,collection,scope,plan){const selected=selectedContextRecords(state,collection,scope);if(!plan||!plan.triples?.length)return selected;let ids=null;if(collection==='requirements')ids=new Set(plan.triples.map(x=>x.requirementId));else if(collection==='tests')ids=new Set(plan.triples.map(x=>x.testId));else if(collection==='runs')ids=new Set(plan.triples.map(x=>x.runId));if(!ids)return selected;return selected.filter(record=>ids.has(recordId(record,collection)));}\nfunction boundedCollection(state,collection,scope={},selectedOverride=null){\n const selected=selectedOverride||selectedContextRecords(state,collection,scope);if(!selected.length)return 'NONE';\n return show({totalSelected:selected.length,records:selected.map(record=>({id:recordId(record,collection),stage:record.stage??'UNKNOWN',scope:record.scope||{},fields:record.fields||record,relationships:record.relationships||{},contentSha256:record.contentSha256||record.sha256||'UNKNOWN'})),omitted:0,selectionRule:'Only active records matching the explicit operation read contract, controlling prompt scope, and any application-derived verification batch are selected; large artifact bytes are referenced by canonical artifact identity.'});\n}"
          if old not in s: raise SystemExit('Context selection anchor missing')
          s=s.replace(old,new,1)

          old="const op=schema.operationContract(stage,operation||schema.STAGE_CONTRACTS[stage].operations[0]);for(const collection of op?.readCollections||schema.STAGE_CONTRACTS[stage].readCollections||[])parts.push(`${collection.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').toUpperCase()}\\n${boundedCollection(state,collection,scope)}`);"
          new="const op=schema.operationContract(stage,operation||schema.STAGE_CONTRACTS[stage].operations[0]),batchPlan=verificationBatchPlan(stage,state,operation,scope);if(batchPlan)parts.push(`VERIFICATION BATCH PLAN\\n${show(batchPlan)}`);for(const collection of op?.readCollections||schema.STAGE_CONTRACTS[stage].readCollections||[]){const selected=contextRecordsFor(state,collection,scope,batchPlan);parts.push(`${collection.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').toUpperCase()}\\n${boundedCollection(state,collection,scope,selected)}`);}"
          if old not in s: raise SystemExit('contextFor collection loop anchor missing')
          s=s.replace(old,new,1)

          anchor="- Before substantive work, determine whether the combined human input, current canonical application context, prior accepted output, evidence, supplied artifacts, and actually available tools are sufficient for this specific stage and domain. Sufficiency is a reasoned stage-specific determination, not a hard-coded field count."
          addition=anchor+"\n- When VERIFICATION BATCH PLAN is present, verify only its listed currently missing triples in listed order. If response bytes would exceed the declared limit, return the longest leading prefix that fits. Never skip ahead or repeat a completed triple. Accepted partial batches are canonical progress but never satisfy the application-derived matrix-completeness gate until every required triple exists exactly once."
          if anchor not in s: raise SystemExit('Mandatory response rule anchor missing')
          s=s.replace(anchor,addition,1)

          old="const opContract=schema.operationContract(stage,operation);const scope=assertRequiredPromptScope(stage,operation,scopeFor(stage,state,options.scope||{})),feedback=recoveryFeedback(state,stage,operation,scope),contextManifest={stage,operation,scope,readCollections:Object.fromEntries((opContract?.readCollections||schema.STAGE_CONTRACTS[stage].readCollections||[]).map(collection=>[collection,selectedContextRecords(state,collection,scope).map(record=>({id:recordId(record,collection),scope:record.scope||{},contentSha256:record.contentSha256||record.sha256||hash.sha256Value(record.fields||record)}))])),answeredHumanClarifications:"
          new="const opContract=schema.operationContract(stage,operation);const scope=assertRequiredPromptScope(stage,operation,scopeFor(stage,state,options.scope||{})),feedback=recoveryFeedback(state,stage,operation,scope),batchPlan=verificationBatchPlan(stage,state,operation,scope),contextManifest={stage,operation,scope,verificationBatchPlan:batchPlan,readCollections:Object.fromEntries((opContract?.readCollections||schema.STAGE_CONTRACTS[stage].readCollections||[]).map(collection=>[collection,contextRecordsFor(state,collection,scope,batchPlan).map(record=>({id:recordId(record,collection),scope:record.scope||{},contentSha256:record.contentSha256||record.sha256||hash.sha256Value(record.fields||record)}))])),answeredHumanClarifications:"
          if old not in s: raise SystemExit('Context manifest anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          anchor="if(!core.STAGES[11].completionGate.some(x=>x.includes('REQ_ID × RUN_ID × TEST_ID')))throw new Error('Stage 12 completion language is not the exact verification triple.');"
          proof="{\n const p=baseProject(),scope={inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001',instructionVersion:'INSTRUCTION-v001',iterationId:'ITERATION-000001',candidateId:'CANDIDATE-000001'};\n p.projectData.iterations.push({id:'ITERATION-000001',active:true,stage:10,scope:{...scope},fields:{ITERATION_ID:'ITERATION-000001',CANDIDATE_ID:'CANDIDATE-000001'}});\n for(let i=1;i<=26;i++){const req=`REQ-${String(i).padStart(6,'0')}`,test=`TEST-${String(i).padStart(6,'0')}`;p.projectData.requirements.push({id:req,active:true,stage:4,scope:{inputVersion:scope.inputVersion,sourceSetVersion:scope.sourceSetVersion,requirementsVersion:scope.requirementsVersion},fields:{REQ_ID:req,MANDATORY_OPTIONAL_STATUS:'MANDATORY'}});p.projectData.tests.push({id:test,active:true,stage:6,scope:{inputVersion:scope.inputVersion,sourceSetVersion:scope.sourceSetVersion,requirementsVersion:scope.requirementsVersion,testSuiteVersion:scope.testSuiteVersion},fields:{TEST_ID:test,REQ_ID:req,STATUS:'READY'},relationships:{REQ_ID:req}});}\n for(let i=1;i<=10;i++){const run=`RUN-${String(i).padStart(6,'0')}`;p.projectData.runs.push({id:run,active:true,stage:11,scope:{...scope},fields:{RUN_ID:run,ITERATION_ID:scope.iterationId,CANDIDATE_ID:scope.candidateId},relationships:{ITERATION_ID:scope.iterationId,CANDIDATE_ID:scope.candidateId}});}\n const first={id:'VERIFICATION-000001',active:true,stage:12,scope:{...scope},fields:{VERIFICATION_ID:'VERIFICATION-000001',REQ_ID:'REQ-000001',RUN_ID:'RUN-000001',TEST_ID:'TEST-000001',INDEPENDENCE_STATUS:'INDEPENDENT',EXACT_EVIDENCE:'large prior verification prose must not be replayed',DETERMINATION:'SATISFIED'}};p.projectData.verification.push(first);\n const r=prompts.buildPromptRecord(12,p,{operation:'COMPLETE',scope:{...scope,projectRevision:0}}),plan=r.contextManifest.verificationBatchPlan;\n if(plan.expectedMatrixTotal!==260||plan.completedMatrixTotal!==1||plan.remainingInOperationBeforeBatch!==259||plan.batchSize!==250||plan.continuationRequired!==true)throw new Error(`Stage 12 batch plan is not the exact bounded 260-triple continuation: ${JSON.stringify(plan)}`);\n if(plan.triples.some(x=>x.requirementId==='REQ-000001'&&x.runId==='RUN-000001'&&x.testId==='TEST-000001'))throw new Error('Completed verification triple was repeated in the next batch.');\n if(!r.prompt.includes('VERIFICATION BATCH PLAN')||!r.prompt.includes('longest leading prefix that fits')||r.prompt.includes('large prior verification prose must not be replayed'))throw new Error('Stage 12 continuation prompt is incomplete or replays prior verification prose.');\n if((r.contextManifest.readCollections.requirements||[]).length>25||(r.contextManifest.readCollections.tests||[]).length>25||(r.contextManifest.readCollections.runs||[]).length>10)throw new Error('Verification batch did not bound canonical prompt context to planned triples.');\n}\n"
          if anchor not in s: raise SystemExit('Stage 12 semantic test anchor missing')
          s=s.replace(anchor,proof+anchor,1)
          p.write_text(s)

          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          def blob_sha(name):
              data=Path(name).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest=''.join(f'{name}:{blob_sha(name)}\n' for name in runtime_files).encode()
          token='runtime-'+hashlib.sha256(manifest).hexdigest()[:16]
          html=Path('index.html').read_text()
          for name in runtime_files:
              pattern=rf'(<script defer src="{re.escape(name)}\?v=)[^"]+("></script>)'
              html,count=re.subn(pattern,lambda m:m.group(1)+token+m.group(2),html,count=1)
              if count!=1: raise SystemExit(f'Runtime script token anchor missing for {name}')
          Path('index.html').write_text(html)
          print(token)
          PY
      - name: Verify exact correction
        shell: bash
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-batch-plan-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only green permanent source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/surgical-verification-batch-plan.yml
          git add prompt-engine.js verify-prompt-semantics.mjs index.html
          git commit -m 'Make verification matrices continuation-safe'
          git push origin HEAD:reliability/verification-batch-plan-final