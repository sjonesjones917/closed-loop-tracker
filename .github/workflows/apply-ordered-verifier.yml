name: Apply ordered verifier and byte-custody repair

on:
  push:
    branches:
      - fix/complete-closed-loop-spec-20260831
    paths:
      - .github/workflows/apply-ordered-verifier.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal complete corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('verify.mjs'); s=p.read_text()
          old="function prepareStage4(p){const intake=prompts.buildPromptRecord(1,p).contextManifest.intakeCoverageManifest;p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'Preserved for downstream reuse.',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||('Captured '+u.label),statementClass:'FACT'}]}))});p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true,blocked:false,reasons:[]};p.stages[2].status='COMPLETE';p.stages[2].gate={complete:true,blocked:false,reasons:[]};p.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';p.stages[3].status='COMPLETE';p.stages[3].gate={complete:true,blocked:false,reasons:[]};return p;}"
          if 'function preparePromptStage' not in s:
              s=s.replace(old,old+"\nfunction preparePromptStage(p,targetStage){if(targetStage<=1)return p;prepareStage4(p);for(let prior=4;prior<targetStage;prior++){p.stages[prior].status='COMPLETE';p.stages[prior].gate={complete:true,blocked:false,reasons:[]};}return p;}")
          s=s.replace("for(let stage=1;stage<=30;stage++){const p=blank(`JOB-PROMPT-${stage}`);if(stage===4)prepareStage4(p);const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));","for(let stage=1;stage<=30;stage++){const p=preparePromptStage(blank(`JOB-PROMPT-${stage}`),stage);const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));")
          s=s.replace("const pa=prompts.buildPromptRecord(2,blank('JOB-A')).prompt,pb=prompts.buildPromptRecord(2,blank('JOB-B')).prompt;","const pa=prompts.buildPromptRecord(2,preparePromptStage(blank('JOB-A'),2)).prompt,pb=prompts.buildPromptRecord(2,preparePromptStage(blank('JOB-B'),2)).prompt;")
          p.write_text(s)

          p=Path('verify-ingestion.mjs'); s=p.read_text()
          if 'function preparePromptPrerequisites' not in s:
              s=s.replace("function project(jobId='JOB-INGESTION-TEST'){","function preparePromptPrerequisites(p,targetStage){\n  if(targetStage<=1)return p;\n  prepareStage4Upstream(p);\n  for(let prior=4;prior<targetStage;prior++){p.stages[prior].status='COMPLETE';p.stages[prior].gate={complete:true,blocked:false,reasons:[]};}\n  return p;\n}\nfunction project(jobId='JOB-INGESTION-TEST'){")
          s=s.replace("p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||('Captured '+u.label),statementClass:'FACT'}]}))});","p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||('Captured '+u.label),statementClass:'FACT'}]}))});\n  Object.assign(p.stages[1].agentData,{EXACT_DELIVERABlE_REQUESTED:'Controlled verification deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE'});")
          s=s.replace("function savePrompt(p,stage){\n  if(stage===4)prepareStage4Upstream(p);\n  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};","function promptOptions(stage,p,prefix='INGESTION-FIXTURE'){\n  const operation=stage===19?'COMPARE':schema.STAGE_CONTRACTS[stage].operations[0];\n  const scope={};\n  for(const key of schema.operationContract(stage,operation)?.scopeRequirements||[]){if(key==='runId')scope.runId='RUN-'+prefix;if(key==='contextId')scope.contextId='CONTEXT-'+prefix;}\n  return {operation,scope};\n}\nfunction savePrompt(p,stage){\n  preparePromptPrerequisites(p,stage);\n  const options=promptOptions(stage,p);")
          s=s.replace("if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);","const writableStageField=stageFields.find(name=>schema.STAGE_FIELDS[stage]?.[name]?.producer===schema.PRODUCER.AGENT);if(writableStageField)stageData[writableStageField]=safeValue(writableStageField);")
          s=s.replace("for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);}","for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=def.fieldDefinitions[name]?.enumValues?.length?def.fieldDefinitions[name].enumValues[0]:safeValue(name);}")
          s=s.replace("for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)requirementFields[name]=safeValue(name);}","for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)requirementFields[name]=def.fieldDefinitions[name]?.enumValues?.length?def.fieldDefinitions[name].enumValues[0]:safeValue(name);}")
          s=s.replace("if(!Object.keys(fields).length){const agentField=schema.recordAgentFields(collection)[0];if(agentField)fields[agentField]=safeValue(agentField);}\n    records[collection]=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];","if(!Object.keys(fields).length){const agentField=schema.recordAgentFields(collection)[0];if(agentField)fields[agentField]=safeValue(agentField);}\n    if(stage===6&&collection==='tests'){fields.TEST_TYPE='MEANING';fields.EXECUTION_MODE='INDEPENDENT_AGENT_REVIEW';fields.REQUIRED_CAPABILITY='INDEPENDENT_AI_REVIEW';fields.ARTIFACT_REQUIREMENTS='NONE';fields.EXECUTABLE_KIND='NONE';fields.EXECUTABLE_SPEC={};fields.EXECUTABLE_INPUT_BINDINGS={};}\n    records[collection]=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];")
          s=s.replace("if(stage<30){const nextStage=stage+1;if(nextStage===4)prepareStage4Upstream(reloaded);const nextOptions=nextStage===11?{scope:{runId:'RUN-NEXT-FIXTURE',contextId:'CONTEXT-NEXT-FIXTURE'}}:{}","if(stage<30){const nextStage=stage+1;preparePromptPrerequisites(reloaded,nextStage);const nextOptions=promptOptions(nextStage,reloaded,'NEXT-FIXTURE')")
          s=s.replace("if(prepared.validation.valid||!prepared.validation.issues.some(i=>i.code==='STAGE_OPERATION_FIELD_VIOLATION'))throw new Error('EXECUTE_RUN accepted VERIFY stageData.');","if(prepared.validation.valid||!prepared.validation.issues.some(i=>['STAGE_OPERATION_FIELD_VIOLATION','FIELD_OWNERSHIP_VIOLATION'].includes(i.code)))throw new Error('EXECUTE_RUN accepted VERIFY stageData.');")
          for old,new in [
            ("{let p=project('JOB-PARALLEL-PROMPT-VALIDATION'),stage=17;p.revision=0;","{let p=project('JOB-PARALLEL-PROMPT-VALIDATION'),stage=17;preparePromptPrerequisites(p,stage);p.revision=0;"),
            ("{let p=project('JOB-SCOPED-CLARIFICATION'),stage=17;p.revision=0;","{let p=project('JOB-SCOPED-CLARIFICATION'),stage=17;preparePromptPrerequisites(p,stage);p.revision=0;"),
            ("let p=project('JOB-NEG-OPERATION-STAGEDATA'),stage=17;const pr=","let p=project('JOB-NEG-OPERATION-STAGEDATA'),stage=17;preparePromptPrerequisites(p,stage);const pr="),
            ("let p=project('JOB-NEG-RESERVED-TEMPKEY'),stage=21;p.job.CURRENT_BASELINE_ID","let p=project('JOB-NEG-RESERVED-TEMPKEY'),stage=21;preparePromptPrerequisites(p,stage);p.job.CURRENT_BASELINE_ID"),
            ("let p=project('JOB-NEG-COMPLETED-TARGET'),stage=21,productId='PRODUCT-000001';p.job.CURRENT_BASELINE_ID","let p=project('JOB-NEG-COMPLETED-TARGET'),stage=21,productId='PRODUCT-000001';preparePromptPrerequisites(p,stage);p.job.CURRENT_BASELINE_ID"),
            ("let p=project('JOB-NEG-TARGET-SCOPE'),stage=11,runId='RUN-SCOPE-B';p.projectData.runs.push","let p=project('JOB-NEG-TARGET-SCOPE'),stage=11,runId='RUN-SCOPE-B';preparePromptPrerequisites(p,stage);p.projectData.runs.push"),
            ("const p=project('JOB-UNPERSISTED-PROMPT'),stage=2,pr=prompts.buildPromptRecord(stage,p)","const p=project('JOB-UNPERSISTED-PROMPT'),stage=2;preparePromptPrerequisites(p,stage);const pr=prompts.buildPromptRecord(stage,p)")]: s=s.replace(old,new)
          s=s.replace("p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';\n  const prompt=","p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';\n  preparePromptPrerequisites(p,17);\n  const prompt=")
          s=s.replace("const request=p.projectData.humanInputRequests.at(-1);p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'}","const request=p.projectData.humanInputRequests.at(-1);preparePromptPrerequisites(p,stage);p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'}")
          s=s.replace("prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});const result=ingestion.reject(prepared.project,prepared.proposal.proposalId","prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});prepareStage4Upstream(prepared.project);const result=ingestion.reject(prepared.project,prepared.proposal.proposalId",1)
          s=s.replace("fields.ARTIFACT_REQUIREMENTS='fixture.js';","fields.TEST_TYPE='MEANING';fields.EXECUTION_MODE='INDEPENDENT_AGENT_REVIEW';fields.REQUIRED_CAPABILITY='INDEPENDENT_AI_REVIEW';fields.EXECUTABLE_KIND='NONE';fields.EXECUTABLE_SPEC={};fields.EXECUTABLE_INPUT_BINDINGS={};fields.ARTIFACT_REQUIREMENTS='fixture.js';",1)
          p.write_text(s)

          p=Path('response-ingestion.js'); s=p.read_text()
          marker="  const evidenceIndex=new Map();\n"
          addition="""  if(object(envelope.records)&&Array.isArray(envelope.records.tests)){\n    const canonicalArtifacts=workflow.records(project,'artifacts',{active:true});\n    const canonicalHasBytes=required=>canonicalArtifacts.some(artifact=>{\n      const id=String(workflow.recordId(artifact,'artifacts')||'');\n      const filename=String(artifact?.fields?.FILENAME??artifact?.FILENAME??'');\n      const availability=upper(artifact?.fields?.AVAILABILITY??artifact?.AVAILABILITY??'');\n      return (required===id||required===filename)&&availability==='BYTES_PERSISTED_AND_VERIFIED';\n    });\n    const responseHasBytes=required=>[...attachmentIndex.values()].some(entry=>String(entry?.file?.name??entry?.file?.filename??'')===required);\n    envelope.records.tests.forEach((record,index)=>{\n      const raw=String(record?.fields?.ARTIFACT_REQUIREMENTS??'').trim();\n      if(!raw||['NONE','NOT APPLICABLE','N/A'].includes(upper(raw)))return;\n      const required=raw.split(/[;,\\n]/).map(value=>value.trim()).filter(Boolean);\n      for(const name of required)if(!canonicalHasBytes(name)&&!responseHasBytes(name))issues.push(issue('MISSING_REQUIRED_TEST_ARTIFACT',`/records/tests/${index}/fields/ARTIFACT_REQUIREMENTS`,`Required test artifact ${name} is not backed by current application-verified bytes.`));\n    });\n  }\n\n  const evidenceIndex=new Map();\n"""
          if 'MISSING_REQUIRED_TEST_ARTIFACT' not in s: s=s.replace(marker,addition,1)
          p.write_text(s)

          p=Path('workflow-engine.js'); s=p.read_text()
          old="      // Stage 06 proves the verification definition is complete, not that future execution inputs already exist.\n      // Exact byte readiness remains fail-closed in testExecutionPlan() at the execution stage.\n      break;"
          new="      const plan=testExecutionPlan(project),missingBytes=new Set(plan.missingArtifactTestIds||[]),missingMandatory=mandatoryTests.map(test=>recordId(test,'tests')).filter(id=>missingBytes.has(id));\n      if(missingMandatory.length)reasons.push(`Mandatory tests have required artifact bytes that are missing or no longer application-verified: ${missingMandatory.join(', ')}.`);\n      break;"
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('verify-complete.mjs'); s=p.read_text()
          s=s.replace("function prompt(p,stage){const r={...prompts.buildPromptRecord(stage,p),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(r);return r;}","function prompt(p,stage){for(let prior=1;prior<stage;prior++){p.stages[prior].status='COMPLETE';p.stages[prior].gate={complete:true,blocked:false,reasons:[]};}const r={...prompts.buildPromptRecord(stage,p),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(r);return r;}")
          s=s.replace("const replacement=prompts.buildPromptRecord(2,p);","p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true,blocked:false,reasons:[]};const replacement=prompts.buildPromptRecord(2,p);")
          s=s.replace("const slots=engine.reserveRunBatch(p,{stage,iterationId,count:10});","p.stages[10].status='COMPLETE';p.stages[10].gate={complete:true,blocked:false,reasons:[]};const slots=engine.reserveRunBatch(p,{stage,iterationId,count:10});p.stages[10].status='COMPLETE';p.stages[10].gate={complete:true,blocked:false,reasons:[]};")
          s=s.replace("const acceptLane=(slot,label)=>{const pr=","const acceptLane=(slot,label)=>{p.stages[10].status='COMPLETE';p.stages[10].gate={complete:true,blocked:false,reasons:[]};const pr=")
          p.write_text(s)
          PY
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check response-ingestion.js
          node --check workflow-engine.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Commit corrected implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs verify-ingestion.mjs verify-complete.mjs response-ingestion.js workflow-engine.js
          git commit -m 'Enforce ordered verifier fixtures and Stage 06 byte custody'
          git push origin HEAD:fix/complete-closed-loop-spec-20260831