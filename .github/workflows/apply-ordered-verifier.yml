name: Apply ordered permanent verifier repair

on:
  push:
    branches:
      - fix/complete-closed-loop-spec-20260831
    paths:
      - .github/workflows/apply-ordered-verifier.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make verify.mjs honor the ordered workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64;exec(base64.b64decode('...TRUNCATED...'))"
          node --check verify.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-stage01-conversation-first.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
      - name: Commit ordered verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs
          git commit -m 'Run permanent prompt verification in workflow order'
          git push origin HEAD:fix/complete-closed-loop-spec-20260831
