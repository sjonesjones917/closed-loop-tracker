name: Export repair branch source

on:
  push:
    branches:
      - fix/complete-closed-loop-spec-20260831
    paths:
      - .github/workflows/apply-ordered-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
      - name: Preserve the exact checked-out source
        run: |
          set -euo pipefail
          zip -qr repair-branch-source.zip . -x '.git/*' 'repair-branch-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: repair-branch-source-${{ github.sha }}
          path: repair-branch-source.zip
          if-no-files-found: error
          retention-days: 1
