name: Repair project-intake guidance

on:
  push:
    branches: [finish/live-human-gate-20260830]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
      - name: Restore complete artifact-generation guidance and rotate the runtime identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app-core.js')
          text = app.read_text(encoding='utf-8')
          old = "Project-relevant information is supplied once and then reused from canonical project state; do not re-enter data already captured. This static application does not itself access external repositories, websites, or accounts."
          new = "Project-relevant information is supplied once and then reused from canonical project state; do not re-enter data already captured. You do not need to know the final file format in advance. A specification substitute requires human confirmation before it can replace an implemented artifact. This static application does not itself access external repositories, websites, or accounts."
          if text.count(old) != 1:
              raise SystemExit(f'Expected one project-intake guidance target, found {text.count(old)}.')
          text = text.replace(old, new, 1)
          if text.count("runtime-20260830-live-operator-59") != 1:
              raise SystemExit('app-core.js runtime identity target is missing or ambiguous.')
          app.write_text(text.replace("runtime-20260830-live-operator-59", "runtime-20260830-live-operator-60", 1), encoding='utf-8')

          runtime = Path('test-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          if text.count("runtime-20260830-live-operator-59") != 1:
              raise SystemExit('test-runtime.js runtime identity target is missing or ambiguous.')
          runtime.write_text(text.replace("runtime-20260830-live-operator-59", "runtime-20260830-live-operator-60", 1), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          count = text.count("runtime-20260830-live-operator-59")
          if count != 9:
              raise SystemExit(f'Expected nine shared script cache identities, found {count}.')
          index.write_text(text.replace("runtime-20260830-live-operator-59", "runtime-20260830-live-operator-60"), encoding='utf-8')
          PY
          node --check app-core.js
          node --check test-runtime.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js test-runtime.js index.html
          git commit -m "Restore complete project-intake artifact guidance"
          git push origin HEAD:finish/live-human-gate-20260830
