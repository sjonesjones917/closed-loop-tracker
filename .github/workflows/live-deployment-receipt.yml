name: Verify live Pages deployment receipt

on:
  workflow_run:
    workflows:
      - Self-build, verify, publish, and deploy Closed-Loop app
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: verify-live-pages-deployment-receipt
  cancel-in-progress: true

jobs:
  verify-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the published main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and verify the exact live Pages files
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE_URL='https://sjonesjones917.github.io/closed-loop-tracker/'
          test -s app-v13.html
          test -s SELF_VERIFIED_PROJECT.json
          test -s SELF_E2E_REPORT.json
          test -s PUBLISHED_SELF_BUILD.json
          EXPECTED_APP_SHA="$(sha256sum app-v13.html | awk '{print $1}')"
          EXPECTED_PROJECT_SHA="$(sha256sum SELF_VERIFIED_PROJECT.json | awk '{print $1}')"
          EXPECTED_REPORT_SHA="$(sha256sum SELF_E2E_REPORT.json | awk '{print $1}')"
          EXPECTED_PUBLICATION_SHA="$(sha256sum PUBLISHED_SELF_BUILD.json | awk '{print $1}')"
          verified=false
          rm -rf live-verification
          mkdir -p live-verification
          for attempt in $(seq 1 36); do
            nonce="${SOURCE_RUN_ID}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 --retry-delay 1 "${BASE_URL}?verify=${nonce}" -o live-verification/index.html \
              && curl -fsSL --retry 2 --retry-delay 1 "${BASE_URL}app-v13.html?verify=${nonce}" -o live-verification/app-v13.html \
              && curl -fsSL --retry 2 --retry-delay 1 "${BASE_URL}SELF_VERIFIED_PROJECT.json?verify=${nonce}" -o live-verification/SELF_VERIFIED_PROJECT.json \
              && curl -fsSL --retry 2 --retry-delay 1 "${BASE_URL}SELF_E2E_REPORT.json?verify=${nonce}" -o live-verification/SELF_E2E_REPORT.json \
              && curl -fsSL --retry 2 --retry-delay 1 "${BASE_URL}PUBLISHED_SELF_BUILD.json?verify=${nonce}" -o live-verification/PUBLISHED_SELF_BUILD.json; then
              LIVE_INDEX_SHA="$(sha256sum live-verification/index.html | awk '{print $1}')"
              LIVE_APP_SHA="$(sha256sum live-verification/app-v13.html | awk '{print $1}')"
              LIVE_PROJECT_SHA="$(sha256sum live-verification/SELF_VERIFIED_PROJECT.json | awk '{print $1}')"
              LIVE_REPORT_SHA="$(sha256sum live-verification/SELF_E2E_REPORT.json | awk '{print $1}')"
              LIVE_PUBLICATION_SHA="$(sha256sum live-verification/PUBLISHED_SELF_BUILD.json | awk '{print $1}')"
              if [[ "$LIVE_INDEX_SHA" == "$EXPECTED_APP_SHA" \
                && "$LIVE_APP_SHA" == "$EXPECTED_APP_SHA" \
                && "$LIVE_PROJECT_SHA" == "$EXPECTED_PROJECT_SHA" \
                && "$LIVE_REPORT_SHA" == "$EXPECTED_REPORT_SHA" \
                && "$LIVE_PUBLICATION_SHA" == "$EXPECTED_PUBLICATION_SHA" ]]; then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo 'Live Pages files did not become byte-identical to the verified repository release.' >&2
            exit 1
          fi

          EXPECTED_APP_SHA="$EXPECTED_APP_SHA" \
          EXPECTED_PROJECT_SHA="$EXPECTED_PROJECT_SHA" \
          EXPECTED_REPORT_SHA="$EXPECTED_REPORT_SHA" \
          EXPECTED_PUBLICATION_SHA="$EXPECTED_PUBLICATION_SHA" \
          SOURCE_RUN_ID="$SOURCE_RUN_ID" \
          SOURCE_HEAD_SHA="$SOURCE_HEAD_SHA" \
          BASE_URL="$BASE_URL" \
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const fail=(message)=>{throw new Error(message)};
          const app=fs.readFileSync('live-verification/app-v13.html');
          const index=fs.readFileSync('live-verification/index.html');
          const projectBytes=fs.readFileSync('live-verification/SELF_VERIFIED_PROJECT.json');
          const reportBytes=fs.readFileSync('live-verification/SELF_E2E_REPORT.json');
          const publicationBytes=fs.readFileSync('live-verification/PUBLISHED_SELF_BUILD.json');
          const project=JSON.parse(projectBytes.toString('utf8'));
          const report=JSON.parse(reportBytes.toString('utf8'));
          const publication=JSON.parse(publicationBytes.toString('utf8'));
          const hash=(bytes)=>crypto.createHash('sha256').update(bytes).digest('hex');
          const appHash=hash(app);
          const projectHash=hash(projectBytes);
          const reportHash=hash(reportBytes);
          const publicationHash=hash(publicationBytes);
          if(Buffer.compare(app,index)!==0)fail('Live index.html and app-v13.html are not byte-identical.');
          if(appHash!==process.env.EXPECTED_APP_SHA)fail('Live app hash differs from the verified repository app.');
          if(projectHash!==process.env.EXPECTED_PROJECT_SHA)fail('Live project hash differs from the verified repository export.');
          if(reportHash!==process.env.EXPECTED_REPORT_SHA)fail('Live report hash differs from the verified repository report.');
          if(publicationHash!==process.env.EXPECTED_PUBLICATION_SHA)fail('Live publication record differs from the verified repository record.');
          if(project.projectId!=='PROJECT-MT3M46X0-075JMP')fail('Live project ID mismatch.');
          if(project.jobId!=='JOB-MT3M46X0-M0LIB9')fail('Live job ID mismatch.');
          if(!Array.isArray(project.stages)||project.stages.length!==31)fail('Live project does not contain exactly 31 stages.');
          if(project.stages.some(stage=>stage.status!=='COMPLETE'))fail('Live project contains an incomplete stage.');
          if(project.stages[10].producers.filter(Boolean).length!==10)fail('Live Stage 11 producer count mismatch.');
          if(project.stages[11].verifiers.filter(Boolean).length!==10)fail('Live Stage 12 verifier count mismatch.');
          if(project.stages[17].producers.filter(Boolean).length!==10)fail('Live Stage 18 producer count mismatch.');
          if(project.stages[18].verifiers.filter(Boolean).length!==10)fail('Live Stage 19 verifier count mismatch.');
          if(project.stages[19].producers.filter(Boolean).length!==10)fail('Live Stage 20 producer count mismatch.');
          if(project.stages[19].verifiers.filter(Boolean).length!==10)fail('Live Stage 20 verifier count mismatch.');
          if(!project.stages[11].verifiers.every(value=>/REQ-015.*VIOLATED/i.test(value)))fail('Live project does not preserve the real first-candidate defect across 10/10 verifiers.');
          if(!project.stages[18].verifiers.every(value=>/REQ-015.*SATISFIED/i.test(value)))fail('Live corrected candidate did not pass 10/10 verifiers.');
          if(project.releaseDecision!=='ACCEPTED')fail('Live project release decision is not ACCEPTED.');
          if(project.artifactName!=='app-v13.html')fail('Live artifact name is not app-v13.html.');
          if(Buffer.compare(Buffer.from(project.artifact,'utf8'),app)!==0)fail('Live project artifact is not byte-identical to the live app.');
          if(project.auditedHash!==appHash||project.releaseHash!==appHash)fail('Live project audited/release hashes do not equal the live app hash.');
          if(!/SOURCE_SET_VERSION:\s*SOURCE-SET-v002/i.test(String(project.stages[1].response)))fail('Live Stage 2 is not SOURCE-SET-v002.');
          if(!/EXTERNAL_SOURCES_DISCOVERED:\s*40\b/i.test(String(project.stages[1].response)))fail('Live Stage 2 does not contain 40 external sources.');
          if(!/RESEARCH-AREA-012/i.test(String(project.stages[1].response)))fail('Live Stage 2 does not cover all 12 research areas.');
          if(!/RESEARCH_VERSION:\s*RESEARCH-v002/i.test(String(project.stages[2].response)))fail('Live Stage 3 is not RESEARCH-v002.');
          if(!/FINDING_ID:\s*FINDING-0014/i.test(String(project.stages[2].response)))fail('Live Stage 3 does not contain all 14 findings.');
          if(report.status!=='PASS'||report.stagesCompleted!==31||report.producerResponsesPasted!==30||report.verifierResponsesPasted!==30)fail('Live E2E report does not prove the required run.');
          if(report.hardcodedProject!==false||report.freshBrowserSidecarAutoload!==true)fail('Live E2E report does not prove sidecar autoload without hardcoding.');
          if(publication.appSha256!==appHash||publication.projectSha256!==projectHash)fail('Live publication record hashes do not match live files.');
          const html=app.toString('utf8');
          if(html.includes(project.projectId)||html.includes(project.objective))fail('Completed project state is hardcoded into the live HTML.');
          const receipt={
            status:'LIVE_VERIFIED',
            verifiedAt:new Date().toISOString(),
            deploymentUrl:process.env.BASE_URL,
            sourceWorkflowRunId:Number(process.env.SOURCE_RUN_ID),
            sourceWorkflowHeadSha:process.env.SOURCE_HEAD_SHA,
            appSha256:appHash,
            projectSha256:projectHash,
            reportSha256:reportHash,
            publicationRecordSha256:publicationHash,
            projectId:project.projectId,
            jobId:project.jobId,
            stagesComplete:31,
            producerResponses:30,
            verifierResponses:30,
            firstCandidateDefectVerified:'10/10 VIOLATED',
            correctedCandidateVerified:'10/10 SATISFIED',
            releaseDecision:project.releaseDecision,
            auditedReleaseHashIdentity:true,
            indexMatchesApp:true,
            visibleProjectExport:'SELF_VERIFIED_PROJECT.json',
            freshBrowserSidecarAutoload:true,
            hardcodedProject:false,
            stage1LosslessScopes:20,
            stage2ExternalSources:40,
            stage2ResearchAreas:12,
            stage3ExternalFindings:14
          };
          fs.writeFileSync('LIVE_DEPLOYMENT_VERIFIED.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE

      - name: Commit the live deployment verification receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LIVE_DEPLOYMENT_VERIFIED.json
          if git diff --cached --quiet; then
            echo 'Live deployment receipt already matches.'
          else
            git commit -m 'Record exact live Pages deployment verification [skip ci]'
            git push origin HEAD:main
          fi
