name: Materialize live boot recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-live-boot-recovery.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize minimal live repair branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='repair/live-boot-project-actions-20260830'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-core.js')
          s=p.read_text()
          old="if(needsPersist){const selectedId=current.job.JOB_ID;projects=await projectStore.writeAll(projects);current=projects.find(p=>p.job?.JOB_ID===selectedId)||projects[0];await projectStore.metaPut('selectedProject',current.job.JOB_ID);}"
          new="if(needsPersist){const selectedId=current.job.JOB_ID;try{const retained=projects.find(project=>project.isRetainedTestProject);if(retained){const storedProjects=await projectStore.readAll(),prior=storedProjects.find(project=>String(project?.job?.JOB_ID||'')===String(retained?.job?.JOB_ID||''));const saved=await projectStore.writeProject(retained,{expectedProjectRevision:Number(prior?.revision||0),incrementRevision:Boolean(prior)});projects=projects.map(project=>project===retained?saved:project);}else if(projects.length===1){const only=projects[0],saved=await projectStore.writeProject(only,{expectedProjectRevision:Number(only?.revision||0),incrementRevision:Boolean(only?.revision)});projects=[saved];}}catch(error){console.error('Startup support-project persistence failed; continuing without rewriting user projects.',error);}current=projects.find(project=>project.job?.JOB_ID===selectedId)||projects.find(project=>!projectIsArchived(project))||projects[0];if(current)try{await projectStore.metaPut('selectedProject',current.job.JOB_ID);}catch(error){console.error('Selected-project metadata could not be persisted during startup.',error);}}"
          if old not in s:
              raise SystemExit('startup batch-persistence anchor not found')
          s=s.replace(old,new,1)
          s=re.sub(r'runtime-20260830-live-operator-\d+','runtime-20260830-live-operator-54',s)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          fixed='.expandable-prompt{height:280px;max-height:280px}'
          if fixed in s:
              s=s.replace(fixed,'.expandable-prompt{max-height:280px}',1)
          hidden='.header-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;overflow:hidden}'
          visible='.header-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;overflow:visible}'
          if hidden in s:
              s=s.replace(hidden,visible,1)
          s=re.sub(r'runtime-20260830-live-operator-\d+','runtime-20260830-live-operator-54',s)
          p.write_text(s)

          p=Path('test-runtime.js')
          s=re.sub(r'runtime-20260830-live-operator-\d+','runtime-20260830-live-operator-54',p.read_text())
          p.write_text(s)

          wf=Path('.github/workflows/materialize-live-boot-recovery.yml')
          if wf.exists(): wf.unlink()
          PY
          git add -A
          git commit -m 'Recover persisted-project startup and restore prompt sizing'
          git push origin HEAD:"$BRANCH" --force
