name: Deploy corrected existing Closed-Loop v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-current.yml'
      - '.release-verification-trigger'
      - 'index.html'
      - 'app-v13.html'
      - 'app-v11.html'
      - 'build-v13-self.mjs'
      - 'self-e2e-agent.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out existing application
        uses: actions/checkout@v4

      - name: Regenerate the existing v13 app from its corrected generator
        shell: bash
        run: |
          set -euo pipefail
          node --check build-v13-self.mjs
          node build-v13-self.mjs
          test -s app-v13.html
          cp app-v13.html index.html

      - name: Verify the generated Stage 2 and Stage 3 research boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app-v13.html
          cmp -s index.html app-v13.html
          grep -Fq 'EXTERNAL RESEARCH ONLY.' index.html
          grep -Fq 'function researchPrompt(p,n)' index.html
          grep -Fq 'if(n===2||n===3)return researchPrompt(p,n)' index.html
          grep -Fq 'RAW STAGE 1 RESPONSE AND SUPPLIED IMPLEMENTATION FILE LIST OMITTED BY DESIGN.' index.html
          grep -Fq 'STAGE ${n} RESEARCH AUTHORITY BOUNDARY — EXTERNAL SOURCES ONLY' index.html
          grep -Fq 'Do not inspect, inventory, cite, or treat supplied implementation files as research sources.' index.html
          grep -Fq 'Do not inspect, inventory, cite, or treat application HTML, JavaScript, source code, tests, generated prompts, generated project JSON, candidate files, prior workflow outputs, project records, implementation behavior, or any other work product of this job as research authority.' index.html
          grep -Fq 'Stage 2 research sources must be independent external sources' index.html
          if grep -Fq 'Inspect the actual supplied sources and build the complete source inventory now.' index.html; then
            echo 'Refusing to deploy old circular Stage 2 HTML.' >&2
            exit 1
          fi

      - name: Build Pages artifact from the corrected existing app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp index.html dist/404.html
          cp app-v13.html dist/app-v13.html
          # Do not publish the stale circular self-project export.
          # Missing sidecar leaves the application usable with empty/local project state.
          printf '{"status":"CORRECTED_EXISTING_APP_DEPLOY","sourceCommit":"%s","stage2ResearchAuthority":"EXTERNAL_ONLY","dedicatedResearchPrompt":true,"generatedBeforeDeploy":true,"staleSelfProjectPublished":false}\n' "$GITHUB_SHA" > dist/build-info.json
          : > dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload corrected existing app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy corrected existing app
        id: deployment
        uses: actions/deploy-pages@v4
