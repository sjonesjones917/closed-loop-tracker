name: Deploy corrected existing Closed-Loop v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-current.yml'
      - '.release-verification-trigger'
      - 'index.html'
      - 'app-v13.html'
      - 'build-v13-self.mjs'
      - 'self-e2e-agent.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out existing application
        uses: actions/checkout@v4

      - name: Verify the existing v13 contains the Stage 2 correction
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app-v13.html
          cmp -s index.html app-v13.html
          grep -Fq 'Build the EXTERNAL SOURCE inventory for this job now.' index.html
          grep -Fq 'Search the internet and other external authoritative information sources outside this project.' index.html
          grep -Fq 'Do NOT use application source code, HTML, JavaScript, tests, generated prompts, generated project JSON, candidate files, prior workflow outputs, project records, or any other work product of this job as research authority.' index.html
          if grep -Fq 'Inspect the actual supplied sources and build the complete source inventory now.' index.html; then
            echo 'Refusing to deploy old circular Stage 2 HTML.' >&2
            exit 1
          fi

      - name: Build Pages artifact from the corrected existing app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp index.html dist/404.html
          cp app-v13.html dist/app-v13.html
          # Intentionally do not publish the stale SELF_VERIFIED_PROJECT.json.
          # The application treats a missing sidecar as a usable empty/local project state.
          printf '{"status":"CORRECTED_APP_DEPLOY","sourceCommit":"%s","stage2ResearchAuthority":"EXTERNAL_ONLY","staleSelfProjectPublished":false}\n' "$GITHUB_SHA" > dist/build-info.json
          : > dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload corrected existing app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy corrected existing app
        id: deployment
        uses: actions/deploy-pages@v4
