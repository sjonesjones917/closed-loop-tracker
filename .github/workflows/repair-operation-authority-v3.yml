name: Apply guarded operation authority repair
on:
  push:
    branches: [fix/semantic-registry-scope-closure-20260903]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[operation-authority-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/semantic-registry-scope-closure-20260903
      - name: Apply repair and prove local regressions
        run: |
          set -euo pipefail
          python3 .repair-operation-authority.py
          node --check workflow-schema.js
          node --check verify-spec-grounded-route-oracle.mjs
          node verify-contract-closure.mjs
          node verify-spec-grounded-route-oracle.mjs
      - name: Remove scaffolding and commit
        run: |
          set -euo pipefail
          rm .repair-operation-authority.py .github/workflows/repair-operation-authority.yml .github/workflows/repair-operation-authority-v3.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js verify-spec-grounded-route-oracle.mjs .repair-operation-authority.py .github/workflows/repair-operation-authority.yml .github/workflows/repair-operation-authority-v3.yml
          git commit -m "Close application command write authority [operation-authority-repair-applied]"
          git push origin HEAD:fix/semantic-registry-scope-closure-20260903
