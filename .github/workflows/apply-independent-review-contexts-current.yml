name: Apply independent review context binding current
on:
  push:
    branches: [independent-review-contexts-current-main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: independent-review-contexts-current-main
      - run: python repair-current-independent-review-v2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js prompt-engine.js app-core.js
          git commit -m "Bind independent verification to reviewer contexts"
          git push origin HEAD:independent-review-contexts-current-main
