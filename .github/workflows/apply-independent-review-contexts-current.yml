name: Apply independent review context binding current
on:
  push:
    branches: [independent-review-contexts-current-main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: independent-review-contexts-current-main
          fetch-depth: 0
      - run: |
          git fetch origin bind-independent-review-contexts-20260830
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git cherry-pick 9c4e74de096c5b9206e4fd7068f819032f180263
          git push origin HEAD:independent-review-contexts-current-main
