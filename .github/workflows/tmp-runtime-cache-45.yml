name: Advance runtime cache identity
on:
  push:
    branches: [fix/runtime-cache-45-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          target='runtime-20260830-live-operator-45'
          for name in ['app-core.js','test-runtime.js']:
            p=Path(name); s=p.read_text()
            s,n=re.subn(r"const RUNTIME_BUILD_ID='runtime-[^']+';",f"const RUNTIME_BUILD_ID='{target}';",s,count=1)
            if n!=1: raise SystemExit(f'{name}: runtime identity not found')
            p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          s,n=re.subn(r'(?<=\.js\?v=)runtime-[^"\']+',target,s)
          if n!=9: raise SystemExit(f'expected 9 script cache identities, got {n}')
          p.write_text(s)
          PY
          rm .github/workflows/tmp-runtime-cache-45.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Advance runtime cache identity after Stage 29 engine change"
          git push origin HEAD:fix/runtime-cache-45-20260830
