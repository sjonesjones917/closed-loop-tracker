name: PR6 fresh context proof
on:
  push:
    branches:
      - practical-100/pr6-fresh-context-proof
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source repair
        run: python .pr6-fresh-context-transform.py
      - name: Verify existing invariants
        run: |
          node --check workflow-engine.js
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Verify actual external context semantics
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');globalThis.window=globalThis;globalThis.crypto=require('crypto').webcrypto;globalThis.dispatchEvent=()=>{};globalThis.Event=class Event{constructor(type){this.type=type;}};
          for(const f of ['workbook.js','hash.js','workflow-schema.js','workflow-engine.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine;
          const p=core.createBlankState('JOB-CONTEXT-PROOF');engine.ensureShape(p);p.job.CURRENT_ITERATION='ITERATION-000001';
          engine.reserveRunBatch(p,{stage:11,iterationId:'ITERATION-000001',candidateId:'CANDIDATE-000001',count:10});
          const before=engine.evaluateIteration(p,'ITERATION-000001','INITIAL');if(!before.reasons.some(x=>x.includes('actually registered')))throw new Error('Unassigned reserved contexts incorrectly satisfy freshness.');
          for(let i=0;i<10;i++)engine.registerFreshContext(p,{stage:11,externalContextIdentifier:`external-agent-session-${i+1}`});
          const contexts=engine.records(p,'freshContexts',{stage:11});if(contexts.length!==10)throw new Error(`Fresh-context registration created extra records: ${contexts.length}.`);
          let duplicateRejected=false;try{engine.registerFreshContext(p,{stage:11,externalContextIdentifier:'external-agent-session-1'});}catch{duplicateRejected=true;}if(!duplicateRejected)throw new Error('Duplicate external context identifier accepted.');
          for(const run of engine.records(p,'runs',{stage:11})){run.fields.CANDIDATE_ID='CANDIDATE-000001';run.fields.CONTAMINATION_CHECK='NONE';run.fields.EXECUTION_STATUS='COMPLETE';}
          for(let i=0;i<10;i++){p.projectData.rawResponses.push({stage:11,rawResponseId:`RAW-${i}`});p.projectData.outputReceipts.push({stage:11,receiptId:`REC-${i}`});}
          const after=engine.evaluateIteration(p,'ITERATION-000001','INITIAL');if(after.contextCount!==10||after.reasons.some(x=>x.includes('fresh contexts')))throw new Error(after.reasons.join('; '));
          console.log(JSON.stringify({unassignedBlocked:true,duplicateExternalContextRejected:true,reservedSlotsFilledInPlace:true,actualExternalContextCount:after.contextCount},null,2));
          NODE
      - name: Verify browser regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
      - name: Commit verified source
        run: |
          rm -f .pr6-fresh-context-transform.py .github/workflows/pr6-fresh-context-proof.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js verify-complete.mjs .pr6-fresh-context-transform.py .github/workflows/pr6-fresh-context-proof.yml
          git diff --cached --check
          git commit -m 'PR 6: require actual fresh external contexts'
          git push origin HEAD:practical-100/pr6-fresh-context-proof
