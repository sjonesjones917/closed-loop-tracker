name: Materialize canonical Stage 4 accounting repair

on:
  push:
    branches:
      - fix/stage4-canonical-obligation-accounting

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-canonical-obligation-accounting
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Normalize materializer template delimiters and materialize the repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('.github/scripts/materialize_stage4.py')
          data=path.read_text()
          data,n=re.subn(r"(`\/records\/[^`\n]+?)','",r"\1`,'",data)
          if n < 1:
              raise SystemExit('expected generated-validator delimiter defects were not found')
          path.write_text(data)
          PY
          python3 .github/scripts/materialize_stage4.py
      - name: Syntax and targeted regressions
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-test-runtime.mjs
          node verify.mjs
      - name: Commit the final repair
        run: |
          git add -A
          git commit -m "Close Stage 4 obligation accounting without repeat intent upload"
          git push origin HEAD:fix/stage4-canonical-obligation-accounting
