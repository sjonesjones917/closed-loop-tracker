name: Materialize canonical Stage 4 accounting repair

on:
  push:
    branches:
      - fix/stage4-canonical-obligation-accounting

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-canonical-obligation-accounting
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Correct materializer syntax and materialize the repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/materialize_stage4.py')
          data=path.read_text()
          old="`/records/intentStatements/${index}/fields/SOURCE_MATERIAL','SOURCE_MATERIAL"
          new="`/records/intentStatements/${index}/fields/SOURCE_MATERIAL`,'SOURCE_MATERIAL"
          if old not in data:
              raise SystemExit('expected materializer syntax defect was not found')
          path.write_text(data.replace(old,new,1))
          PY
          python3 .github/scripts/materialize_stage4.py
      - name: Syntax and targeted regressions
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-test-runtime.mjs
          node verify.mjs
      - name: Commit the final repair
        run: |
          git add -A
          git commit -m "Close Stage 4 obligation accounting without repeat intent upload"
          git push origin HEAD:fix/stage4-canonical-obligation-accounting
