name: Repair fail-closed locked stage rendering

on:
  push:
    branches:
      - fix/closed-loop-v3-final-20260830

permissions:
  contents: write

concurrency:
  group: locked-stage-render-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[locked-stage-render-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair locked-stage prompt preview behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          t=p.read_text()
          old="if(error?.code==='MISSING_REQUIRED_PROMPT_SCOPE')return `CONTROLLING INSTRUCTION UNAVAILABLE\\n\\n${error.message}\\n\\nReserve/select the exact execution lane shown for this stage, then save or copy the instruction.`;throw error;"
          new="if(error?.code==='MISSING_REQUIRED_PROMPT_SCOPE')return `CONTROLLING INSTRUCTION UNAVAILABLE\\n\\n${error.message}\\n\\nReserve/select the exact execution lane shown for this stage, then save or copy the instruction.`;if(error?.code==='STAGE4_UPSTREAM_INCOMPLETE')return `CONTROLLING INSTRUCTION UNAVAILABLE\\n\\n${error.message}\\n\\nStage 04 remains inspectable, but no Stage 04 controlling instruction can be generated, saved, copied, or executed until complete Stage 01 human-authority intake and complete Stage 03 research are established. Do not ask the user to resupply prior project information.`;throw error;"
          assert t.count(old)==1, f'currentStagePrompt repair target count={t.count(old)}'
          p.write_text(t.replace(old,new,1))

          p=Path('verify-browser.mjs')
          t=p.read_text()
          marker="await openStage(cdp,23);assert(await evalValue(cdp,`!document.querySelector('#reviewer-context-required')`),'Locked future Stage 23 exposed reviewer-context work before the operator needs it.');"
          insert="await openStage(cdp,4);const lockedStage4=(await snapshot(cdp)).text;assert(lockedStage4.includes('Stage 04 — COMPILE THE REQUIREMENT SPECIFICATION'),'Locked Stage 04 is not inspectable.');assert(lockedStage4.includes('CONTROLLING INSTRUCTION UNAVAILABLE'),'Locked Stage 04 falsely generated a controlling instruction.');assert(lockedStage4.includes('Stage 03 research is complete')||lockedStage4.includes('Stage 03'),'Locked Stage 04 does not state its upstream blocker.');assert(!lockedStage4.includes('attach the original intent file'),'Locked Stage 04 asks the operator to resupply the original intent file.');\n " + marker
          assert t.count(marker)==1, f'browser locked Stage 04 marker count={t.count(marker)}'
          p.write_text(t.replace(marker,insert,1))
          PY
      - name: Prove syntax and locked-stage browser behavior
        run: |
          node --check app-core.js
          node --check verify-browser.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name "closed-loop-locked-stage-repair"
          git config user.email "actions@users.noreply.github.com"
          git add app-core.js verify-browser.mjs
          git rm .github/workflows/fix-locked-stage-render.yml
          git commit -m "Keep incomplete Stage 4 inspectable and fail closed [locked-stage-render-fixed]"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
