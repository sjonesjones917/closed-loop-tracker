name: Repair ingestion next prompt fixture

on:
  push:
    branches:
      - fix/monotonic-reliability-pass-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - name: Bind next-stage prompt fixture to completed prior stage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="if(stage<30){const nextStage=stage+1;if(nextStage===4)prepareStage4Upstream(reloaded);const nextOptions="
          new="if(stage<30){const nextStage=stage+1;reloaded.stages[stage].status='COMPLETE';reloaded.stages[stage].gate={complete:true,blocked:false,reasons:[]};if(nextStage===4)prepareStage4Upstream(reloaded);const nextOptions="
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'Expected one next-stage prompt target; found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          rm .github/workflows/repair-ingestion-next-prompt.yml
          node --check verify-ingestion.mjs
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A verify-ingestion.mjs .github/workflows
          git commit -m "Bind ingestion next-stage fixture to completed prior state"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831
