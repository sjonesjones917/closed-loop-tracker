name: Materialize runtime identity repair
on:
  push:
    branches: [fix/runtime-proof-20260830]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Synchronize runtime build identity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-proof-20260830
      - name: Synchronize worker/runtime cache identity
        shell: python
        run: |
          from pathlib import Path
          p=Path('test-runtime.js')
          s=p.read_text()
          old='runtime-20260830-live-operator-55'
          new='runtime-20260830-live-operator-59'
          if old not in s:
            raise SystemExit('test-runtime.js: expected old runtime identity not found')
          p.write_text(s.replace(old,new))
          Path('.github/workflows/materialize-runtime-proof.yml').unlink()
      - name: Commit source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-runtime.js .github/workflows/materialize-runtime-proof.yml
          git commit -m 'Synchronize runtime build identity'
          git push origin fix/runtime-proof-20260830
