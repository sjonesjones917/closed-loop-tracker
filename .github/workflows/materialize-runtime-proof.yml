name: Materialize runtime identity repair
on:
  push:
    branches: [fix/runtime-proof-20260830]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Synchronize runtime build identity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-proof-20260830
      - name: Synchronize the complete runtime build identity
        shell: python
        run: |
          from pathlib import Path
          replacements={
            'index.html':[('runtime-20260830-live-operator-58','runtime-20260830-live-operator-59')],
            'app-core.js':[('runtime-20260830-live-operator-58','runtime-20260830-live-operator-59')],
            'test-runtime.js':[('runtime-20260830-live-operator-55','runtime-20260830-live-operator-59')],
          }
          for name,repls in replacements.items():
            p=Path(name)
            s=p.read_text()
            for old,new in repls:
              if old not in s:
                raise SystemExit(f'{name}: expected build identity {old} not found')
              s=s.replace(old,new)
            p.write_text(s)
          Path('.github/workflows/materialize-runtime-proof.yml').unlink()
      - name: Commit source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-core.js test-runtime.js .github/workflows/materialize-runtime-proof.yml
          git commit -m 'Synchronize runtime build identity'
          git push origin fix/runtime-proof-20260830
