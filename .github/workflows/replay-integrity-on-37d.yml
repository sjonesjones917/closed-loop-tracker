name: Replay integrity on recovery-lane main
on:
  push:
    branches: [reliability/integrity-authority-on-37d-20260826]
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE=456465f29a6ddc6d04cf8dcf8491fcf0eb6ac5a3
          OURS=37d90a661d9e4c87571c0f7db2a6adec030f65bf
          THEIRS=8e6aaac7bff54fbc686bb72c845ab42206146566
          for f in project-store.js workflow-schema.js workflow-engine.js verify-complete.mjs verify-full-cycle.mjs; do git show "$THEIRS:$f" > "$f"; done
          git show "$OURS:response-ingestion.js" >/tmp/ours
          git show "$BASE:response-ingestion.js" >/tmp/base
          git show "$THEIRS:response-ingestion.js" >/tmp/theirs
          git merge-file -p /tmp/ours /tmp/base /tmp/theirs > response-ingestion.js || true
          ! grep -q '^<<<<<<<' response-ingestion.js
          node build-test-project.mjs
          node --check hash.js && node --check workbook.js && node --check workflow-schema.js && node --check workflow-engine.js && node --check project-store.js && node --check prompt-engine.js && node --check response-ingestion.js && node --check app-core.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          rm .github/workflows/replay-integrity-on-37d.yml
          git add project-store.js response-ingestion.js workflow-schema.js workflow-engine.js verify-complete.mjs verify-full-cycle.mjs .github/workflows/replay-integrity-on-37d.yml
          git commit -m 'Apply canonical integrity closure after recovery-lane fixes'
          git push origin HEAD
