name: One-time controlling bundle repair

on:
  push:
    branches:
      - fix/full-controlling-bundle-20260830

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-controlling-bundle-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded repair
        run: |
          set -o pipefail
          python .github/bundle_repair_shim.py 2>&1 | tee .github/bundle-repair-failure.log
      - name: Preserve transform failure diagnostic
        if: failure()
        run: |
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add .github/bundle-repair-failure.log
          git commit -m "Record guarded repair failure diagnostic" || true
          git push origin HEAD:fix/full-controlling-bundle-20260830
      - name: Verify syntax and controlling contracts
        run: |
          set -o pipefail
          {
            node --check workbook.js
            node --check workflow-schema.js
            node --check test-runtime.js
            node --check test-worker.js
            node --check workflow-engine.js
            node --check prompt-engine.js
            node --check response-ingestion.js
            node --check project-store.js
            node verify-bundle-v3.mjs
            node verify-test-runtime.mjs
            node verify-prompt-semantics.mjs
            node verify-ingestion.mjs
            node verify-complete.mjs
          } 2>&1 | tee .github/bundle-verification-failure.log
      - name: Preserve verification failure diagnostic
        if: failure()
        run: |
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add .github/bundle-repair-failure.log .github/bundle-verification-failure.log
          git commit -m "Record bundle verification failure diagnostic" || true
          git push origin HEAD:fix/full-controlling-bundle-20260830
      - name: Commit repaired application
        run: |
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git reset -- .github/workflows/bundle-repair.yml .github/workflows/pages.yml .github/bundle_repair.py .github/bundle_repair_shim.py .github/bundle-repair-failure.log .github/bundle-verification-failure.log || true
          git commit -m "Implement controlling bundle v3 contracts"
          git push origin HEAD:fix/full-controlling-bundle-20260830
