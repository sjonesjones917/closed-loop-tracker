name: fix-file-first-browser-oracle
on:
  workflow_dispatch:
  push:
    branches: [fix/spec-driven-file-first-20260902]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-driven-file-first-20260902
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Replace obsolete copy-block browser oracle
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='verify-browser.mjs';
          let text=fs.readFileSync(path,'utf8');
          const old="for(const token of ['Independent external sources only.','closed-loop-stage-response/3','PROMPT IDENTITY','Stage and validate response file','How to use this stage','Expand preview','exact controlling copy block','Authoritative transport: UTF-8 JSON file.'])assert(text.includes(token),`Stage 02 UI/prompt missing ${token}.`);";
          const replacement="for(const token of ['Independent external sources only.','closed-loop-stage-response/3','PROMPT IDENTITY','Stage and validate response file','How to use this stage','Expand preview','Export authoritative prompt file','Authoritative transport: UTF-8 JSON file.'])assert(text.includes(token),`Stage 02 UI/prompt missing ${token}.`);assert(!text.includes('exact controlling copy block'),'Obsolete copy-block transport remains visible in the Stage 02 operator path.');";
          if(!text.includes(old))throw new Error('Obsolete browser oracle not found exactly.');
          text=text.replace(old,replacement);
          fs.writeFileSync(path,text);
          NODE
          node --check verify-browser.mjs
          rm .github/workflows/fix-file-first-browser-oracle.yml
      - name: Commit repaired oracle and remove one-time scaffolding
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify-browser.mjs .github/workflows/fix-file-first-browser-oracle.yml
          git commit -m 'Fix obsolete copy-block browser oracle'
          git push origin HEAD:fix/spec-driven-file-first-20260902
