name: Apply controlling spec fix

on:
  push:
    branches:
      - fix/controlling-spec-capture-once
    paths:
      - tools/apply-controlling-spec-fix.py
      - .github/workflows/apply-controlling-spec-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align repair anchor with current engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/apply-controlling-spec-fix.py')
          s=p.read_text(encoding='utf-8')
          pattern=r'''s = replace_regex\(s, r"const APPLICATION_TEST_EXECUTORS=.*?'native capability authority'\)'''
          replacement='''s = replace_exact(s, "function applicationTestCapabilities(){return Object.freeze([schema.TEST_IR.capability]);}", "function applicationTestCapabilities(){const runtime=globalThis.closedLoopTestRuntime;return Object.freeze(runtime?.capabilities?Array.from(runtime.capabilities()):[]);}", 'native capability authority')'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'native capability repair anchor patch count={n}')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Apply repair and preserve diagnostics on failure
        shell: bash
        run: |
          set +e
          python3 tools/apply-controlling-spec-fix.py > repair-diagnostic.log 2>&1
          rc=$?
          cat repair-diagnostic.log
          if [ "$rc" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/apply-controlling-spec-fix.py repair-diagnostic.log
            git commit -m "Record controlling-spec repair failure" || true
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$rc"
          fi
          rm -f repair-diagnostic.log
      - name: Syntax and capture-once proof
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node verify-capture-once.mjs
      - name: Commit repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement capture-once Stage 4 and /3 controlling contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
