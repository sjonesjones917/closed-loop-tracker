name: Restore prompt box size and prove browser acceptance once
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths: [.github/workflows/finalize-visual-once.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore established prompt box dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.prompt{height:clamp(260px,45vh,520px);max-height:80vh;'
          new='.prompt{height:280px;max-height:80vh;'
          if old not in s: raise SystemExit('Expected prompt sizing rule not found')
          p.write_text(s.replace(old,new,1))
          PY
          cat > verify-prompt-box-size.mjs <<'EOF'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('.prompt{height:280px;max-height:80vh;'))throw new Error('Generated prompt box is not restored to 280px.');
          if(html.includes('.prompt{height:clamp(260px,45vh,520px);'))throw new Error('Responsive prompt-height redesign returned.');
          console.log(JSON.stringify({promptBoxVisualRegression:true,promptHeightCssPx:280}));
          EOF
          rm -f .github/workflows/finalize-visual-once.yml
      - name: Complete non-browser proof
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-v3-migration.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-single-supply-prompts.mjs
          node verify-prompt-box-size.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Browser proof at required widths
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit proven visual restoration
        run: |
          git config user.name closed-loop-integrator
          git config user.email closed-loop-integrator@users.noreply.github.com
          git add -A
          git commit -m 'Restore established prompt box size with regression proof'
          git push origin HEAD:implementation/closed-loop-v3
