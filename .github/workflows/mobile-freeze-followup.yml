name: Apply provenance completeness follow-up
on:
  push:
    branches: [fix/mobile-runtime-freeze-20260828]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve compact provenance while exposing every required hop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old="const links=[rawId&&rawById.has(rawId)?`<a href=\"#${esc(provenanceAnchor('raw',rawId))}\">Preserved raw response</a>`:'',promptId&&promptById.has(promptId)?`<a href=\"#${esc(provenanceAnchor('prompt',promptId))}\">Controlling prompt</a>`:'',...evidenceIds.filter(id=>evidenceById.has(id)).map(id=>`<a href=\"#${esc(provenanceAnchor('evidence',id))}\">Evidence ${esc(id)}</a>`)].filter(Boolean).join(' · ');return `<details class=\"record-card provenance-trace\"><summary>${esc(name)}<span>Trace</span></summary><div class=\"record-body\"><p class=\"section-intro\">Canonical field → extraction manifest → exact response pointer → preserved raw response → controlling prompt → canonical evidence.</p>${details('Extraction manifest and response pointer',{manifestId:m.manifestId,responsePointer:e.jsonPointer||e.JSON_POINTER_IN_RESPONSE||'',rawResponseId:rawId||'NONE',promptId:promptId||'NONE',evidenceIds},true)}${links?`<div class=\"notice provenance-links\">${links}</div>`:'<div class=\"notice warn\">One or more provenance targets are unavailable for this trace.</div>'}</div></details>`;"
          new="const rawLink=rawId&&rawById.has(rawId)?`<a href=\"#${esc(provenanceAnchor('raw',rawId))}\">${esc(rawId)}</a>`:'UNAVAILABLE',promptLink=promptId&&promptById.has(promptId)?`<a href=\"#${esc(provenanceAnchor('prompt',promptId))}\">${esc(promptId)}</a>`:'UNAVAILABLE',evidenceLinks=evidenceIds.filter(id=>evidenceById.has(id)).map(id=>`<a href=\"#${esc(provenanceAnchor('evidence',id))}\">${esc(id)}</a>`).join(', ')||'NONE LINKED';return `<details class=\"record-card provenance-trace\"><summary>${esc(name)}<span>Trace</span></summary><div class=\"record-body\"><p class=\"section-intro\">Canonical field → extraction manifest → exact response pointer → preserved raw response → controlling prompt → canonical evidence.</p>${details('Extraction manifest and response pointer',{manifestId:m.manifestId,responsePointer:e.jsonPointer||e.JSON_POINTER_IN_RESPONSE||'',rawResponseId:rawId||'NONE',promptId:promptId||'NONE',evidenceIds},true)}<div class=\"notice provenance-links\"><strong>Preserved raw response:</strong> ${rawLink}<br><strong>Controlling prompt:</strong> ${promptLink}<br><strong>Canonical evidence:</strong> ${evidenceLinks}</div></div></details>`;"
          if old not in s:
              raise SystemExit('provenance link target not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check app-core.js
          node build-test-project.mjs
          node verify-hash.mjs
          node verify-semantic-invariant.mjs
          node verify-prompt-semantics.mjs
          git config user.name 'closed-loop reliability bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-core.js index.html TEST_PROJECT.json
          git diff --cached --quiet && exit 0
          git commit -m 'Keep compact provenance traces complete'
          git push origin HEAD:fix/mobile-runtime-freeze-20260828
