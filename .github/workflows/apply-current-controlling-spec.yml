name: Apply current controlling specification corrections
on:
  push:
    branches: [controlling-spec-final-current]
    paths: ['.github/workflows/apply-current-controlling-spec.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: controlling-spec-final-current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and prove critical closure
        run: |
          python3 .github/apply_current_controlling_spec.py
          node --check workbook.js
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check test-runtime.js
          node --check verify-stage01-stage03-stage04-closure.mjs
          node verify-stage01-stage03-stage04-closure.mjs
      - name: Commit product changes
        run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add workbook.js workflow-schema.js prompt-engine.js test-runtime.js index.html verify-stage01-stage03-stage04-closure.mjs
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 0; }
          git commit -m "Enforce exhaustive Stage 01 and Stage 03 before Stage 04"
          git push origin HEAD:controlling-spec-final-current
