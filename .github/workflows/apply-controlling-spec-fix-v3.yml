name: Apply controlling spec fix v3

on:
  push:
    branches:
      - fix/controlling-spec-capture-once
    paths:
      - tools/complete-controlling-spec-repair.py
      - .github/workflows/apply-controlling-spec-fix-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        run: |
          python3 tools/execute-controlling-spec-repair.py
          python3 tools/complete-controlling-spec-repair.py
      - name: Verify syntax and capture-once behavior
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node verify-capture-once.mjs
      - name: Commit repaired tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement capture-once Stage 4 and /3 controlling contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
