name: Materialize controlling specification v3
on:
  push:
    branches: [spec-v3-zero-loss-20260830]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: materialize-controlling-spec-v3, cancel-in-progress: false}
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spec-v3-zero-loss-20260830}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Repair materializer literal
        run: node repair-materializer.mjs
      - name: Materialize controlling specification
        run: node materialize-controlling-spec.mjs
      - name: Syntax and controlling invariants
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node verify-controlling-spec.mjs
      - name: Commit generated application code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -- .github/workflows/pages.yml
          git rm -f materialize-controlling-spec.mjs repair-materializer.mjs
          git add workbook.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js index.html verify-controlling-spec.mjs
          git commit -m "[materialized-v3] Implement controlling /3 zero-loss architecture"
          git push origin HEAD:spec-v3-zero-loss-20260830
