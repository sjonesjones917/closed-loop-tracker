name: Inspect prepared implementation conflicts
on:
  push:
    branches: ["finish/blind-context-and-prompt-authority-43"]
    paths: [".github/workflows/apply-final-chunks.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/blind-context-and-prompt-authority-43
          fetch-depth: 0
      - name: Show exact conflict regions
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/final_patch.part* > /tmp/final.patch.gz.b64
          base64 -d /tmp/final.patch.gz.b64 > /tmp/final.patch.gz
          gzip -dc /tmp/final.patch.gz > /tmp/final.patch
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/final.patch').read_text()
          for prefix in ('main-current/', 'final-work/'):
              src = src.replace(prefix, '')
          Path('/tmp/root.patch').write_text(src)
          PY
          git apply --3way /tmp/root.patch || true
          for f in app-core.js prompt-engine.js workflow-engine.js workflow-schema.js; do
            echo "===== $f CONFLICT REGIONS ====="
            python3 - "$f" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); lines=p.read_text().splitlines()
          marks=[i for i,l in enumerate(lines) if l.startswith('<<<<<<<')]
          for k,i in enumerate(marks,1):
              j=i
              while j < len(lines) and not lines[j].startswith('>>>>>>>'): j+=1
              a=max(0,i-18); b=min(len(lines),j+19)
              print(f'--- conflict {k}, lines {i+1}-{j+1} ---')
              for n in range(a,b): print(f'{n+1:6}: {lines[n]}')
          PY
          done
          exit 1
