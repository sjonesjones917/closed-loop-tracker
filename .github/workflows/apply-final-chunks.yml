name: Materialize completed prompt/context implementation
on:
  push:
    branches: ["finish/blind-context-and-prompt-authority-43"]
    paths: [".github/workflows/apply-final-chunks.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/blind-context-and-prompt-authority-43
          fetch-depth: 0
      - name: Apply and resolve current-source integration
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/final_patch.part* > /tmp/final.patch.gz.b64
          base64 -d /tmp/final.patch.gz.b64 > /tmp/final.patch.gz
          gzip -dc /tmp/final.patch.gz > /tmp/final.patch
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/final.patch').read_text()
          for prefix in ('main-current/','final-work/'):
              src=src.replace(prefix,'')
          Path('/tmp/root.patch').write_text(src)
          PY
          git apply --3way /tmp/root.patch || true
          python3 - <<'PY'
          from pathlib import Path

          def resolve_blocks(path, resolver):
              p=Path(path); lines=p.read_text().splitlines(); out=[]; i=0; idx=0
              while i < len(lines):
                  if not lines[i].startswith('<<<<<<<'):
                      out.append(lines[i]); i+=1; continue
                  idx+=1; i+=1; ours=[]
                  while i<len(lines) and not lines[i].startswith('======='):
                      ours.append(lines[i]); i+=1
                  if i>=len(lines): raise RuntimeError(f'unclosed conflict in {path}')
                  i+=1; theirs=[]
                  while i<len(lines) and not lines[i].startswith('>>>>>>>'):
                      theirs.append(lines[i]); i+=1
                  if i>=len(lines): raise RuntimeError(f'unclosed conflict in {path}')
                  i+=1
                  replacement=resolver(idx,ours,theirs)
                  if isinstance(replacement,str): replacement=replacement.splitlines()
                  out.extend(replacement)
              p.write_text('\n'.join(out)+'\n')

          def app_resolver(idx,ours,theirs):
              text='\n'.join(ours+theirs)
              if 'function promptOptions' in text:
                  return '''function promptOptions(n){
            const operation=selectedOperation(n),options={operation},requirements=schema.operationContract(n,operation)?.scopeRequirements||[],requiresRun=requirements.includes('runId'),reviewerStage=[9,12,23,24].includes(Number(n));
            if(requiresRun){
              const run=selectedRun(n);
              if(run){
                const runId=engine.recordId(run,'runs');options.scope={runId};
                if(reviewerStage){const reviewer=currentReviewerContext(n);if(reviewer)options.scope.contextId=engine.recordId(reviewer,'freshContexts');}
                else{const contextId=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||run.scope?.contextId||'');if(contextId)options.scope.contextId=contextId;}
              }
            }else if(requirements.includes('contextId')||reviewerStage){const context=currentReviewerContext(n);if(context)options.scope={contextId:engine.recordId(context,'freshContexts')};}
            return options;
          }'''
              if 'function currentStagePrompt' in text:
                  chosen='\n'.join(ours)
                  return chosen.replace('[9,23,24]','[9,12,23,24]')
              if 'function controls' in text:
                  chosen='\n'.join(ours)
                  return chosen.replace('![9,23,24].includes(n)','![9,12,23,24].includes(n)')
              if 'function reviewerContextMarkup' in text:
                  return '''function reviewerContextMarkup(n,locked){
            if(![9,12,23,24].includes(n)||locked)return '';
            const ctx=currentReviewerContext(n),external=ctx?String(engine.recordValue(ctx,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim():'',run=n===12?selectedRun(n):null,runContext=run?String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||run.scope?.contextId||'').trim():'';
            const reference=n===9?'the context that authored the Stage 08 production instruction':n===12?(runContext?`the generating context ${runContext} for the selected run`:'the selected run generating context'):'the Stage 21 product-generation context';
            if(ctx&&external)return `<div class="notice success"><strong>Independent reviewer context registered.</strong><br>${esc(engine.recordId(ctx,'freshContexts'))} · ${esc(external)}. The controlling prompt is bound to this reviewer context and must not reuse ${esc(reference)}.</div>`;
            const extra=n===24?' Do not reuse the Stage 23 reviewer context or provide prior reviewer conclusions.':'';
            return `<div class="panel" id="reviewer-context-required" tabindex="-1"><h2 class="section-title">Open a fresh independent reviewer context</h2><p class="section-intro">Use a new external conversation/context that did not perform the work being reviewed.${esc(extra)} Enter its identifier here before saving or copying the reviewer instruction; the application binds that identity into the controlling prompt.</p><div class="field"><label>Fresh reviewer context identifier</label><input id="fresh-context-id" autocomplete="off"><span class="help">Use the external conversation/session identifier you can recognize later. Do not reuse ${esc(reference)}.</span></div><div class="button-row"><button class="primary" id="add-fresh-context" type="button">Register reviewer context</button></div></div>`;
          }'''
              raise RuntimeError(f'unknown app-core conflict {idx}')

          def prompt_resolver(idx,ours,theirs):
              text='\n'.join(ours+theirs)
              if 'function contextFor' not in text: raise RuntimeError(f'unknown prompt conflict {idx}')
              chosen='\n'.join(theirs)
              needle='function contextFor(stage,state,operation,scope={},aliasPlan=null){const parts=[];'
              addition="if(stage===3)parts.push(`STAGE 01 ACCEPTED HUMAN-AUTHORITY CONTEXT — USE FOR SOURCE RELEVANCE AND APPLICABILITY\\n${show({acceptedCapture:parseCapturedInputSet(state),acceptedDefinition:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:workflow.deriveStageData(state,1)}})}`);"
              if needle not in chosen: raise RuntimeError('contextFor signature changed unexpectedly')
              return chosen.replace(needle,needle+addition,1)

          def engine_resolver(idx,ours,theirs):
              text='\n'.join(ours+theirs)
              if 'const plan=testExecutionPlan' not in text: raise RuntimeError(f'unknown engine conflict {idx}')
              chosen='\n'.join(ours)
              chosen=chosen.replace('if([23,24].includes(stage))','if([9,12,23,24].includes(stage))')
              return chosen

          def schema_resolver(idx,ours,theirs):
              text='\n'.join(ours+theirs)
              if 'const SCOPE_REQUIREMENTS' not in text: raise RuntimeError(f'unknown schema conflict {idx}')
              chosen='\n'.join(ours)
              return chosen.replace('if(s===9)keys.push(\'contextId\');','if(s===9||s===12)keys.push(\'contextId\');')

          resolve_blocks('app-core.js',app_resolver)
          resolve_blocks('prompt-engine.js',prompt_resolver)
          resolve_blocks('workflow-engine.js',engine_resolver)
          resolve_blocks('workflow-schema.js',schema_resolver)
          for path in ('app-core.js','prompt-engine.js','workflow-engine.js','workflow-schema.js'):
              text=Path(path).read_text()
              if any(marker in text for marker in ('<<<<<<< ours','=======\n','>>>>>>> theirs')):
                  raise RuntimeError(f'unresolved merge marker in {path}')
          PY
          if git ls-files -u | grep -q .; then
            git add app-core.js prompt-engine.js workflow-engine.js workflow-schema.js
          fi
          git diff --check
          rm -rf .repair
          rm -f .github/workflows/apply-blind-context-final.yml .github/workflows/export-source.yml .github/workflows/apply-final-chunks.yml
          git config user.name "closed-loop-implementation"
          git config user.email "closed-loop-implementation@users.noreply.github.com"
          git add -A
          git commit -m "Complete subject-neutral prompt and independent-review context implementation"
          git push origin HEAD:finish/blind-context-and-prompt-authority-43
