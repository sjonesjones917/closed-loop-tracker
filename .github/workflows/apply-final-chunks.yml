name: Apply final prepared implementation
on:
  push:
    branches: ["finish/blind-context-and-prompt-authority-43"]
    paths: [".github/workflows/apply-final-chunks.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/blind-context-and-prompt-authority-43
          fetch-depth: 0
      - name: Apply prepared patch exactly
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/final_patch.part* > /tmp/final.patch.gz.b64
          base64 -d /tmp/final.patch.gz.b64 > /tmp/final.patch.gz
          gzip -dc /tmp/final.patch.gz > /tmp/final.patch
          echo 'PATCH HEADERS:'
          grep -m 30 -E '^(diff --git|--- |\+\+\+ )' /tmp/final.patch || true
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/final.patch').read_text()
          # The prepared diff was generated between sibling working directories.
          # Strip only those directory prefixes from diff metadata; leave patch body untouched.
          for prefix in ('main-current/', 'main-updated/'):
              src = src.replace(prefix, '')
          Path('/tmp/root.patch').write_text(src)
          PY
          git apply --check /tmp/root.patch
          git apply /tmp/root.patch
          rm -rf .repair
          rm -f .github/workflows/apply-blind-context-final.yml .github/workflows/apply-final-chunks.yml .github/workflows/export-source.yml
          git config user.name "closed-loop-implementation"
          git config user.email "closed-loop-implementation@users.noreply.github.com"
          git add -A
          git commit -m "Complete subject-neutral prompt and blind-context implementation"
          git push origin HEAD:finish/blind-context-and-prompt-authority-43
