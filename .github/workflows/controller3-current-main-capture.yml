name: Temporary current-main source capture
on:
  push:
    branches: [controller3-current-main-b811-source-20260904]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller3-current-main-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
