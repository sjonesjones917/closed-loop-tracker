name: PR6 fix run fixture
on:
  push:
    branches: [practical-100/pr6-completion]
permissions: {contents: write}
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix schema-typed Stage 11 fixture and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs');s=p.read_text()
          old="OUTPUT_ARTIFACT_IDENTITIES:['ARTIFACT-CANDIDATE']"
          new="OUTPUT_ARTIFACT_IDENTITIES:'ARTIFACT-CANDIDATE'"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/pr6-fix-run-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix Stage 11 full-cycle artifact fixture type'
          git push
