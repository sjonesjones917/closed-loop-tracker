name: Temporary Stage 04 minimal finisher
on:
  push:
    branches: [fix/stage4-intent-reuse-current-main]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-intent-reuse-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact minimal corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          def replace_exact(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old,new))

          # The original Stage 01 intent file is not a generic later-stage handoff item.
          replace_exact('workflow-engine.js',
            "  if(stage>1)withhold.set('original Stage 01 intent file',{artifactIdOrCategory:'original Stage 01 intent file',reason:'One-time intake only. Later stages use the canonical intentStatements ledger and must not request, attach, resend, reopen, or rely on the original file.'});\n",
            '')

          # Stage 01 must deeply capture the supplied material once; the later sentence must not contradict that rule.
          replace_exact('prompt-engine.js',
            'If their actual contents are available in the current executing context, read only the minimum portions needed to identify the requested objective or deliverable or to resolve a genuinely Stage-01-blocking ambiguity; do not ask the human to re-enter facts that are already present in those materials.',
            'If their actual contents are available in the current executing context, inspect them deeply enough to capture every human-authority statement relevant to defining the job while staying inside the Stage 01 boundary; do not atomize requirements or perform later-stage work, and do not ask the human to re-enter facts that are already present in those materials.')

          # Stage 04's controlling input union includes the accepted Stage 01 job definition as well as the statement ledger.
          replace_exact('prompt-engine.js',
            "CURRENT AGENT-NORMALIZED DELIVERABLE (when already accepted; otherwise UNKNOWN):\n${show(j.EXACT_DELIVERABLE_REQUESTED)}\n\n${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY",
            "CURRENT AGENT-NORMALIZED DELIVERABLE (when already accepted; otherwise UNKNOWN):\n${show(j.EXACT_DELIVERABLE_REQUESTED)}\n\n${stage===4?`ACCEPTED STAGE 01 JOB DEFINITION — CURRENT CANONICAL VALUES\nASSUMPTIONS:\n${show(j.ASSUMPTIONS)}\n\nUNKNOWN_INFORMATION:\n${show(j.UNKNOWN_INFORMATION)}\n\nINPUT_SET_CONTENTS:\n${show(j.INPUT_SET_CONTENTS)}`:''}\n\n${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY")

          # Focused runtime regression: Stage 04 sends/withholds no original-file artifact; the prompt and canonical ledger carry the information.
          replace_exact('verify-test-runtime.mjs',
            "assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,1);assert.equal(stage4Handoff.withhold[0]?.artifactIdOrCategory,'original Stage 01 intent file');assert.equal(stage4Handoff.expectBack.length,0);",
            "assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,0,'Stage 04 must not turn the original intent file into another handoff item.');assert.equal(stage4Handoff.expectBack.length,0);")
          replace_exact('verify-one-time-intent-intake.mjs',
            "assert(handoff.withhold.some(item=>item.artifactIdOrCategory==='original Stage 01 intent file'),'Stage 04 does not explicitly withhold the original intent file.');",
            "assert(handoff.withhold.length===0,'Stage 04 still turns the original intent file into a later-stage handoff item.');")

          # Existing complete-suite fixture must model the new canonical statement ledger and current next-action wording.
          vc=Path('verify-complete.mjs'); text=vc.read_text()
          old="  Object.assign(p.job,{EXACT_DELIVERABLE_REQUESTED:'CANONICAL-STAGE-01-DELIVERABLE',ASSUMPTIONS:'CANONICAL-STAGE-01-ASSUMPTION',UNKNOWN_INFORMATION:'CANONICAL-STAGE-01-UNKNOWN',INPUT_SET_CONTENTS:'CANONICAL-STAGE-01-INTENT-CAPTURE'});\n  const candidate=record('candidateRequirements',3,{SOURCE_LOCATION:'accepted Stage 03 research',CANDIDATE_OBLIGATION:'CANONICAL-STAGE-03-OBLIGATION',CLASSIFICATION:'MANDATORY',APPLICABILITY:'APPLICABLE',EVIDENCE:'EVIDENCE-STAGE-03'},'CANDIDATE-REQ-STAGE04');"
          new="  Object.assign(p.job,{EXACT_DELIVERABLE_REQUESTED:'CANONICAL-STAGE-01-DELIVERABLE',ASSUMPTIONS:'CANONICAL-STAGE-01-ASSUMPTION',UNKNOWN_INFORMATION:'CANONICAL-STAGE-01-UNKNOWN',INPUT_SET_CONTENTS:'CANONICAL-STAGE-01-INTENT-CAPTURE'});\n  const intent=record('intentStatements',1,{SOURCE_MATERIAL:'design-input.pdf',SOURCE_LOCATION:'page 1',EXACT_STATEMENT:'CANONICAL-STAGE-01-INTENT-STATEMENT',STATEMENT_KIND:'REQUIREMENT',REQUIREMENT_RELEVANCE:'REQUIREMENT',NORMATIVE_FORCE:'MUST',DEPENDENCIES:'NONE',EXCEPTIONS:'NONE',CONFLICTS:'NONE',NOTES:'',STATUS:'ACTIVE'},'INTENT-STATEMENT-STAGE04');intent.scope={inputVersion:p.job.CURRENT_INPUT_VERSION};p.projectData.intentStatements.push(intent);\n  const candidate=record('candidateRequirements',3,{SOURCE_LOCATION:'INTENT-STATEMENT-STAGE04',CANDIDATE_OBLIGATION:'CANONICAL-STAGE-03-OBLIGATION',CLASSIFICATION:'MANDATORY',APPLICABILITY:'APPLICABLE',EVIDENCE:'EVIDENCE-STAGE-03'},'CANDIDATE-REQ-STAGE04');"
          if text.count(old)!=1: raise SystemExit('verify-complete: canonical Stage 04 fixture anchor mismatch')
          text=text.replace(old,new)
          old2="  assert(next.includes('accepted Stage 01 job definition')&&next.includes('accepted Stage 03 findings'),'Stage 04 next action does not identify the canonical input sources it reuses.');"
          new2="  assert(next.includes('canonical Stage 01 intent-statement ledger')&&next.includes('Do not attach, resend, reopen, or otherwise reuse the original intent file.'),'Stage 04 next action does not identify canonical intent reuse.');"
          if text.count(old2)!=1: raise SystemExit('verify-complete: next-action anchor mismatch')
          text=text.replace(old2,new2)
          vc.write_text(text)

          # Refresh the one shared runtime cache identity after runtime byte changes.
          runtime=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for f in runtime:
              b=Path(f).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              manifest += f'{f}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          idx=Path('index.html'); html=idx.read_text()
          html,n=re.subn(r'runtime-[0-9a-f]{16}',token,html)
          if n!=8: raise SystemExit(f'index.html: expected 8 runtime tokens, replaced {n}')
          idx.write_text(html)
          print(token)
          PY
      - name: Prove repaired Stage 01 to Stage 04 path
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check verify-test-runtime.mjs
          node --check verify-one-time-intent-intake.mjs
          node --check verify-complete.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Remove materializer and commit final tree
        run: |
          rm .github/workflows/stage4-minimal-finish.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js verify-test-runtime.mjs verify-one-time-intent-intake.mjs verify-complete.mjs index.html .github/workflows/stage4-minimal-finish.yml
          git commit -m 'Finish Stage 04 one-time intent reuse'
          git push origin HEAD:fix/stage4-intent-reuse-current-main
