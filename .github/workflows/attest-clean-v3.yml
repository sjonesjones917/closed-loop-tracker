name: attest-clean-v3
on:
  push:
    branches: ['fix/final-zero-loss-v3-20260830']
    paths:
      - '.github/workflows/attest-clean-v3.yml'
      - 'deterministic-proof-status.json'
      - 'browser-proof-status.json'
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-zero-loss-v3-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require current proof markers
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');for(const f of ['deterministic-proof-status.json','browser-proof-status.json'])if(!fs.existsSync(f))throw Error(f+' is missing.');
          const d=require('./deterministic-proof-status.json'),b=require('./browser-proof-status.json');
          if(d.status!=='PASSED'||d.workflow!=='mobile-closed-loop/30'||d.projectSchema!=='closed-loop-project/3'||d.responseSchema!=='closed-loop-stage-response/3'||d.testIrSchema!=='closed-loop-test-spec/1')throw Error('Deterministic proof marker is invalid.');
          if(b.status!=='PASSED'||b.engine!=='REAL_CHROMIUM_CDP'||JSON.stringify(b.widths)!=='[320,393,1280]'||b.promptPreviewMaxHeight!=='280px'||!b.stage1Exhaustive||!b.stage3Exhaustive||!b.stage4ClosedSingleSupply)throw Error('Browser proof marker is invalid.');
          NODE
      - name: Construct exact clean tree from main
        shell: bash
        run: |
          set -euo pipefail
          REPAIR_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          git checkout -B fix/closed-loop-v3-final-ready origin/main
          REPAIR_SHA="$REPAIR_SHA" python3 - <<'PY'
          import os,subprocess
          repair=os.environ['REPAIR_SHA'];raw=subprocess.check_output(['git','diff','--name-status','-z','origin/main',repair]);parts=raw.split(b'\0');i=0
          excluded={'deterministic-proof-status.json','browser-proof-status.json','browser-proof-failure.log','isolated-conformance-failure.log','final-proof.log','proof-failure-summary.txt'};selected=[]
          while i<len(parts) and parts[i]:
            status=parts[i].decode();i+=1
            if status.startswith(('R','C')): old=parts[i].decode();path=parts[i+1].decode();i+=2
            else: path=parts[i].decode();i+=1
            if path.startswith('.github/workflows/') or path in excluded or path.endswith('.log'):continue
            if status.startswith('D'):subprocess.run(['git','rm','-f','--ignore-unmatch','--',path],check=True)
            else:subprocess.run(['git','checkout',repair,'--',path],check=True)
            selected.append(path)
          if not selected:raise SystemExit('No proven non-workflow changes selected.')
          print('\n'.join(selected))
          PY
          if find .github/workflows -maxdepth 1 -type f \( -name 'advance-final-proof.yml' -o -name 'materialize-v3-source.yml' -o -name 'v3-browser-proof.yml' -o -name 'promote-clean-v3.yml' -o -name 'attest-clean-v3.yml' -o -name 'final-v3-proof.yml' -o -name 'authority-contract-patch.yml' \) | grep .; then echo 'Temporary workflow present in clean tree.' >&2; exit 1; fi
      - name: Run complete deterministic suite on exact clean tree
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js *.mjs; do node --check "$f"; done
          node build-test-project.mjs
          for t in verify.mjs verify-v3-migration.mjs verify-v3-contract.mjs verify-test-runtime-v3.mjs verify-test-runtime-limits.mjs verify-test-runtime.mjs verify-hash.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-single-supply-prompts.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs verify-v3-definition-of-done.mjs verify-project-lifecycle.mjs; do if [ -f "$t" ]; then echo "=== $t ==="; node "$t"; fi; done
      - name: Prove exact visual baseline and prompt size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,hashlib
          c=Path('index.html').read_text();m=subprocess.check_output(['git','show','origin/main:index.html'],text=True);cs=re.search(r'<style>(.*?)</style>',c,re.S);ms=re.search(r'<style>(.*?)</style>',m,re.S)
          if not cs or not ms or hashlib.sha256(cs.group(1).encode()).hexdigest()!=hashlib.sha256(ms.group(1).encode()).hexdigest():raise SystemExit('VISUAL REGRESSION')
          if '.expandable-prompt{max-height:280px}' not in c:raise SystemExit('PROMPT BOX SIZE CHANGED')
          PY
      - name: Run real Chromium on exact clean tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)";if [ -z "$CHROME_BIN" ]; then sudo apt-get update -y >/dev/null;sudo apt-get install -y chromium >/dev/null;CHROME_BIN="$(command -v chromium)";fi
          CHROME_BIN="$CHROME_BIN" APP_URL=http://127.0.0.1:4173/ node verify-v3-browser.mjs
      - name: Commit, push, attest, and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Implement closed-loop project v3 exhaustive reliability controller'
          git push --force origin HEAD:fix/closed-loop-v3-final-ready
          CLEAN_SHA="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CLEAN_SHA}" -f state=success -f context=pr-v3-proof -f description='Exact clean tree passed deterministic, visual, and real Chromium proof' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh pr view fix/closed-loop-v3-final-ready --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit fix/closed-loop-v3-final-ready --repo "$GITHUB_REPOSITORY" --title 'Implement closed-loop project v3 exhaustive reliability controller' --body 'Exact clean commit passed the complete deterministic suite, unchanged-main visual hash and 280px prompt lock, and real Chromium acceptance at 320px, 393px, and desktop. Temporary repair workflows and diagnostics are excluded by construction.'
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head fix/closed-loop-v3-final-ready --title 'Implement closed-loop project v3 exhaustive reliability controller' --body 'Exact clean commit passed the complete deterministic suite, unchanged-main visual hash and 280px prompt lock, and real Chromium acceptance at 320px, 393px, and desktop. Temporary repair workflows and diagnostics are excluded by construction.'
          fi
