name: Apply prompt surface restoration
on:
  push:
    branches: [restore-prompt-surface-20260830]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-prompt-surface-20260830
      - run: python repair-prompt-surface.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restore responsive prompt surface"
          git push origin HEAD:restore-prompt-surface-20260830
# trigger
