name: Exact-main semantic closure proof
on:
  push:
    branches: [reliability/exact-main-semantic-closure-20260826]
permissions:
  contents: write
jobs:
  prove:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-closure-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/exact-main-semantic-closure-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only reviewed semantic corrections
        run: |
          git fetch origin reliability/final-semantic-closure-20260826-v2 --no-tags
          git show origin/reliability/final-semantic-closure-20260826-v2:finalize-semantic-closure.py >/tmp/finalize-semantic-closure.py
          python3 /tmp/finalize-semantic-closure.py
          python3 apply-current-semantic.py
      - name: Refresh exact runtime cache identity
        run: |
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=files.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const identity=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of files){const marker=`<script defer src="${file}?v=`,first=html.indexOf(marker),second=first<0?-1:html.indexOf(marker,first+1);if(first<0||second>=0)throw new Error(`${file} script marker must occur exactly once.`);const start=first+marker.length,end=html.indexOf('"',start);html=html.slice(0,start)+identity+html.slice(end);}
          fs.writeFileSync('index.html',html);console.log(identity);
          NODE
      - name: Remove all temporary proof machinery before testing
        run: |
          git rm -f apply-current-semantic.py .github/workflows/one-time-proof.yml
          rm -f /tmp/finalize-semantic-closure.py
          rm -f finalize-semantic-closure.py .github/workflows/finalize-semantic-closure.yml
          test -z "$(find . -maxdepth 1 -type f \( -name '.repair-*' -o -name '*repair*.py' -o -name '*semantic-closure*.py' -o -name 'apply-current-semantic.py' \) -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -iname '*repair*' -o -iname '*semantic-closure*' -o -name 'one-time-proof.yml' \) -print -quit)"
      - name: Syntax and architecture
        run: |
          node --check workbook.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
      - name: Deterministic ingestion, gates, lifecycle, and prompt semantics
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Real local Chromium operator acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log" || return 1
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only exact passing permanent source
        run: |
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Close exact prompt and operator semantic boundaries [semantic-closure-complete]"
          git push origin HEAD:reliability/exact-main-semantic-closure-20260826
# trigger exact-current proof
