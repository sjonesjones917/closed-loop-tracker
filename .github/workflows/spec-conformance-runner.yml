name: Run controlling-spec materializer
on:
  push:
    branches:
      - fix/controlling-spec-conformance
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute materializer body
        shell: python
        run: |
          import pathlib, subprocess
          path=pathlib.Path('.github/workflows/spec-conformance-materializer.yml')
          text=path.read_text()
          marker="      - name: Apply controlling specification repair\n        shell: bash\n        run: |\n"
          start=text.index(marker)+len(marker)
          end=text.index("      - name: Syntax and focused conformance proof",start)
          body=text[start:end]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'
          pathlib.Path('/tmp/materialize.sh').write_text(script)
          subprocess.run(['bash','/tmp/materialize.sh'],check=True)
      - name: Verify materialized source
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-controlling-spec.mjs
          node verify-controlling-spec.mjs
          node verify-test-runtime.mjs
          node verify-prompt-semantics.mjs
      - name: Commit repair without temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/spec-conformance-materializer.yml .github/workflows/spec-conformance-runner.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Align runtime with controlling project-neutral /3 specification"
          git push origin HEAD:fix/controlling-spec-conformance
