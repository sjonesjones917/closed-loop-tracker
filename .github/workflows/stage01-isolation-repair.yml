name: Temporary Stage 01 isolation repair
on:
  push:
    branches: [fix/stage01-prompt-isolation-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-prompt-isolation-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply responsible-layer repair
        run: |
          python .stage01-isolation-repair.py
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs');s=p.read_text()
          s=s.replace("original.prompt.replace('If the current environment can reliably construct the requested artifact bytes from a defined representation and sufficient inputs, generate the actual artifact even when the downstream consumer or authoring application is unavailable','Require the downstream consumer before generating any artifact')","original.prompt.replace('ARTIFACT GENERATION VS DOWNSTREAM EXECUTION','TOOL POSSESSION CONTROLS ARTIFACT GENERATION')")
          p.write_text(s)
          PY
      - name: Verify exact prompt boundary
        run: |
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Commit permanent source only
        run: |
          git rm .stage01-isolation-repair.py .github/workflows/stage01-isolation-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js verify-prompt-semantics.mjs index.html
          git commit -m "Make Stage 01 prompt strictly stage-local"
          git push origin HEAD:fix/stage01-prompt-isolation-20260826
