name: Temporary Stage 01 isolation repair
on:
  push:
    branches: [fix/stage01-prompt-isolation-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-prompt-isolation-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .stage01-isolation-repair.py
      - name: Verify exact prompt boundary
        run: |
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Commit permanent source only
        run: |
          git rm .stage01-isolation-repair.py .github/workflows/stage01-isolation-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js verify-prompt-semantics.mjs index.html
          git commit -m "Make Stage 01 prompt strictly stage-local"
          git push origin HEAD:fix/stage01-prompt-isolation-20260826
