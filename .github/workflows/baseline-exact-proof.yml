name: Prove exact candidate baseline boundary
on:
  push:
    branches: [reliability/baseline-exact-candidate-20260826]
permissions: {contents: write}
concurrency: {group: baseline-exact-candidate-proof, cancel-in-progress: false}
jobs:
  prove:
    if: "!contains(github.event.head_commit.message, '[baseline-proof-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only the demonstrated Stage 20 correction
        run: python3 apply-baseline-boundary.py
      - name: Remove temporary proof machinery before verification
        run: rm -f apply-baseline-boundary.py .github/workflows/baseline-exact-proof.yml
      - name: Syntax and exact runtime identity
        run: |
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node verify-hash.mjs
          node verify.mjs
      - name: Deterministic workflow and complete lifecycle
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Real Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only passing permanent source
        run: |
          git config user.name 'closed-loop-proof'
          git config user.email 'closed-loop-proof@users.noreply.github.com'
          git add -A
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          git commit -m 'Bind Stage 20 baseline to exact confirmed candidate [baseline-proof-complete]'
          git push origin HEAD
