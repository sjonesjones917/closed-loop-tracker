name: Apply closed-loop reliability hardening

on:
  push:
    branches: [codex/reliability-hardening-20260829]
    paths: [tools/reliability-hardening-trigger.py]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reliability-hardening-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply line-preserving patch
        run: |
          for patch in tools/patch-*.py; do
            python3 "$patch"
          done
      - name: Verify responsible layers and regressions
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser-extra.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Remove one-time repair machinery and commit verified patch
        run: |
          rm -rf tools .github/workflows/reliability-hardening-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No final patch was produced'; exit 1; }
          git commit -m "Harden verification handoff and evidence proof"
          git push origin HEAD:codex/reliability-hardening-20260829
