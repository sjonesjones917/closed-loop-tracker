name: Apply reliability hardening once
on:
  push:
    branches: [reliability-hardening-20260829]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-hardening-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact reviewed patch and prove fast invariants
        run: |
          set -euo pipefail
          cat .repair-hardening.part00 .repair-hardening.part01 .repair-hardening.part02 .repair-hardening.part03 .repair-hardening.part04 .repair-hardening.part05 | base64 -d | gunzip > /tmp/reliability-hardening.patch
          git apply --check /tmp/reliability-hardening.patch
          git apply /tmp/reliability-hardening.patch
          rm .repair-hardening.part00 .repair-hardening.part01 .repair-hardening.part02 .repair-hardening.part03 .repair-hardening.part04 .repair-hardening.part05
          rm .github/workflows/reliability-hardening-apply.yml
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-full-cycle.mjs
          node --check verify-browser.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          git diff --check
      - name: Commit clean final tree to feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Harden execution proof and reviewer independence'
          git push origin HEAD:reliability-hardening-20260829
