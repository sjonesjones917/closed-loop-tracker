name: Apply Test IR canonical hash schema field
on:
  push:
    branches: [fix/current-main-v3-deploy-proof]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-main-v3-deploy-proof
          fetch-depth: 0
      - name: Complete tests ownership schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          text=p.read_text()
          old="    EXECUTABLE_INPUT_BINDINGS:Object.freeze({valueType:VALUE_TYPES.OBJECT,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null})\n"
          new="    EXECUTABLE_INPUT_BINDINGS:Object.freeze({valueType:VALUE_TYPES.OBJECT,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),\n    EXECUTABLE_SPEC_SHA256:Object.freeze({valueType:VALUE_TYPES.STRING,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null})\n"
          if old in text:
              text=text.replace(old,new,1)
          elif 'EXECUTABLE_SPEC_SHA256:Object.freeze({valueType:VALUE_TYPES.STRING' not in text:
              raise SystemExit('Test IR type insertion target not found')
          old="'EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS','INPUTS'"
          new="'EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS','EXECUTABLE_SPEC_SHA256','INPUTS'"
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('tests record field insertion target not found')
          p.write_text(text)
          PY
          rm .github/workflows/apply-tests-spec-hash-field.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js .github/workflows/apply-tests-spec-hash-field.yml
          git commit -m "Complete Test IR canonical hash ownership field"
          git push origin HEAD:fix/current-main-v3-deploy-proof
