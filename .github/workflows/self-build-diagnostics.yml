name: Capture self-build workflow failure

on:
  workflow_run:
    workflows:
      - Self-build, verify, and publish Closed-Loop app
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main for the failure receipt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the failed job log from this exact workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          {
            printf 'FAILED_RUN_ID=%s\n' "$FAILED_RUN_ID"
            printf 'FAILED_HEAD_SHA=%s\n' "$FAILED_HEAD_SHA"
            printf 'CAPTURED_AT=%s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh run view "$FAILED_RUN_ID" --log-failed
          } > SELF_BUILD_WORKFLOW_FAILURE.log

      - name: Commit the exact failure log without starting another workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SELF_BUILD_WORKFLOW_FAILURE.log
          git commit -m 'Record failed self-build workflow log [skip ci]'
          git push origin HEAD:main
