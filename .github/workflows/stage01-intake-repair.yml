name: Stage 01 intake closure repair

on:
  push:
    branches:
      - fix/stage01-intake-closure-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-intake-closure-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        run: node repair-stage01-intake-closure-v2.mjs
      - name: Syntax and focused regression
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-test-runtime.mjs
      - name: Package tested source
        run: |
          mkdir tested-stage01-repair
          cp workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js verify-stage01-intake-closure.mjs .github/workflows/pages.yml tested-stage01-repair/
      - uses: actions/upload-artifact@v4
        with:
          name: tested-stage01-repair
          path: tested-stage01-repair
          if-no-files-found: error
