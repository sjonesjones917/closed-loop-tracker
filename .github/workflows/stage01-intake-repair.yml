name: Stage 01 intake closure repair

on:
  push:
    branches:
      - fix/stage01-intake-closure-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-intake-closure-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        run: node repair-stage01-intake-closure-v2.mjs
      - name: Syntax and focused regression
        id: focused
        continue-on-error: true
        run: |
          set +e
          {
            node --check workbook.js
            node --check workflow-schema.js
            node --check workflow-engine.js
            node --check prompt-engine.js
            node --check response-ingestion.js
            node verify-stage01-intake-closure.mjs
            node verify-one-time-intent-intake.mjs
            node verify-test-runtime.mjs
          } > repair-failure.log 2>&1
          status=$?
          cat repair-failure.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Persist failure diagnostics
        if: steps.focused.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repair-failure.log
          git commit -m "Capture Stage 01 repair regression failure" || true
          git push origin HEAD:fix/stage01-intake-closure-20260830
          exit 1
      - name: Remove one-time repair infrastructure
        if: steps.focused.outputs.status == '0'
        run: |
          rm -f repair-failure.log
          rm -f fix-repair-generator.mjs repair-stage01-intake-closure.mjs repair-stage01-intake-closure-v2.mjs
          rm .github/workflows/stage01-intake-repair.yml
      - name: Commit repaired source
        if: steps.focused.outputs.status == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close Stage 01 intake accounting and correct Test IR prompt"
          git push origin HEAD:fix/stage01-intake-closure-20260830
