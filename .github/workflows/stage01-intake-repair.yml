name: Stage 01 intake closure repair

on:
  push:
    branches:
      - fix/stage01-intake-closure-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-intake-closure-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        run: node repair-stage01-intake-closure.mjs
      - name: Syntax and focused regression
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-test-runtime.mjs
      - name: Remove one-time repair infrastructure
        run: |
          rm repair-stage01-intake-closure.mjs
          rm .github/workflows/stage01-intake-repair.yml
      - name: Commit repaired source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close Stage 01 intake accounting and correct Test IR prompt"
          git push origin HEAD:fix/stage01-intake-closure-20260830
