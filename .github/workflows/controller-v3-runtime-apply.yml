name: Controller v3 runtime apply
on:
  workflow_dispatch:
  push:
    branches:
      - controller-v3-runtime-closure-20260904b
    paths:
      - controller-v3-runtime-trigger.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller-v3-runtime-closure-20260904b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime corrections
        run: node controller-v3-runtime-apply.mjs
      - name: Syntax and focused regression
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node verify-controller-v3-gap-closure.mjs
          node verify-complete.mjs
          mv .github/workflows/controller-v3-runtime-apply.yml /tmp/controller-v3-runtime-apply.yml
          node verify-v3-definition-of-done.mjs
          mv /tmp/controller-v3-runtime-apply.yml .github/workflows/controller-v3-runtime-apply.yml
      - name: Commit source corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js verify-controller-v3-gap-closure.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce activation proof and pre-delivery checkpoint gates'
          git push origin HEAD:controller-v3-runtime-closure-20260904b
