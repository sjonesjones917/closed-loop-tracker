name: One-time pre-profile v3 repair

on:
  push:
    branches: [fix/preprofile-v3-nongating-20260903]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/preprofile-v3-nongating-20260903
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch profile boundary only
        run: python3 .repair-preprofile.py
      - name: Prove profile boundary
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check workflow-schema.js
          node --check verify-v3-migration.mjs
          node verify-v3-migration.mjs
          rm .repair-preprofile.py
          node verify.mjs
      - name: Commit and remove scaffold
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-preprofile-v3.yml
          git add -A
          git config user.name 'closed-loop repair'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Block pre-profile v3 projects from current gates'
          git push origin HEAD:fix/preprofile-v3-nongating-20260903
