name: Materialize startup recovery on current main
on:
  push:
    branches: [fix/materialize-startup-current-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('project-store.js')
          text=p.read_text()
          old="async function readAllIndexed(){await migrateLegacy();const tx=await openTransaction(PROJECTS,'readonly'),rows=await request(tx.objectStore(PROJECTS).getAll());"
          new="async function readAllIndexed(){try{await migrateLegacy();globalThis.closedLoopLegacyMigrationError=null;}catch(error){globalThis.closedLoopLegacyMigrationError=String(error?.stack||error);console.error('Legacy migration failed without deleting the preserved legacy payload; continuing with the canonical IndexedDB store.',error);}const tx=await openTransaction(PROJECTS,'readonly'),rows=await request(tx.objectStore(PROJECTS).getAll());"
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('readAllIndexed migration guard not found')

          old2="const ready=(async()=>{if(globalThis.indexedDB)await migrateLegacy();return true;})();"
          new2="const ready=(async()=>{if(globalThis.indexedDB)try{await migrateLegacy();globalThis.closedLoopLegacyMigrationError=null;}catch(error){globalThis.closedLoopLegacyMigrationError=String(error?.stack||error);console.error('Legacy migration failed without deleting the preserved legacy payload; application startup will continue.',error);}return true;})();"
          if old2 in text:
              text=text.replace(old2,new2,1)
          elif new2 not in text:
              raise SystemExit('projectStore.ready migration guard not found')
          p.write_text(text)

          cache='runtime-20260830-live-operator-47'
          idx=Path('index.html')
          html=idx.read_text()
          import re
          html=re.sub(r'runtime-20260830-live-operator-\d+',cache,html)
          idx.write_text(html)

          for filename in ['app-core.js','test-runtime.js']:
              f=Path(filename)
              s=f.read_text()
              s=re.sub(r'runtime-20260830-live-operator-\d+',cache,s)
              f.write_text(s)
          PY
          rm -f .github/workflows/repair-startup-migration-brick.yml
          rm -f .github/workflows/materialize-startup-current.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Materialize startup recovery on current main"
          git push origin HEAD:fix/materialize-startup-current-20260830