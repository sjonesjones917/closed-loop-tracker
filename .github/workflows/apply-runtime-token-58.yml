name: Advance shared runtime token
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance shared build identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='runtime-20260830-live-operator-57'
          new='runtime-20260830-live-operator-58'
          if old not in s and new not in s:
              raise SystemExit('shared runtime token not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-runtime-token-58.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-runtime-token-58.yml
          git commit -m "Advance shared runtime identity to operator 58"
          git push origin HEAD:fix/full-human-authority-carryforward-20260830
