name: Apply live schema ownership repair
on:
  push:
    branches: [fix/live-schema-tests-ownership]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair tests ownership field set
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          text=p.read_text()
          old="EXECUTABLE_INPUT_BINDINGS:Object.freeze({valueType:VALUE_TYPES.OBJECT,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null})"
          new=old+",\n    EXECUTABLE_SPEC_SHA256:Object.freeze({valueType:VALUE_TYPES.STRING,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null})"
          if 'EXECUTABLE_SPEC_SHA256:Object.freeze' not in text:
              if old not in text: raise SystemExit('Test IR field metadata insertion point missing')
              text=text.replace(old,new,1)
          old_fields="'TEST_ID','REQ_ID','TEST_TYPE','EXECUTION_MODE','REQUIRED_CAPABILITY','ARTIFACT_REQUIREMENTS','EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS','INPUTS'"
          new_fields="'TEST_ID','REQ_ID','TEST_TYPE','EXECUTION_MODE','REQUIRED_CAPABILITY','ARTIFACT_REQUIREMENTS','EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS','EXECUTABLE_SPEC_SHA256','INPUTS'"
          if old_fields in text:
              text=text.replace(old_fields,new_fields,1)
          elif new_fields not in text:
              raise SystemExit('Verification tests field list insertion point missing')
          p.write_text(text)
          PY
          rm -f .github/workflows/patch-live-schema.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair verification test ownership schema"
          git push origin HEAD:fix/live-schema-tests-ownership