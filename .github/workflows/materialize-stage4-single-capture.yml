name: Materialize permanent Stage 04 single-capture repair

on:
  push:
    branches: [fix/stage4-single-capture]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-single-capture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the permanent repair and regression
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const replaceOnce=(text,oldValue,newValue,label)=>{
            const first=text.indexOf(oldValue);
            if(first<0)throw new Error(label+' anchor not found.');
            if(text.indexOf(oldValue,first+oldValue.length)>=0)throw new Error(label+' anchor is not unique.');
            return text.slice(0,first)+newValue+text.slice(first+oldValue.length);
          };

          let schema=fs.readFileSync('workflow-schema.js','utf8');
          const helper=String.raw`
const EMPTY_SUPPLIED_MATERIALS_PATTERN=/^(?:\s*|\[\s*\]|\{\s*\}|null|none|no supplied materials?|not applicable|n\/a|unknown)$/i;
const REFERENCE_ONLY_MATERIAL_WORDS=/\b(?:type|file|files|filename|filenames|document|documents|attachment|attachments|artifact|artifacts|material|materials|inventory|input|inputs|intent|original|reference|references|exactnameorreference|name|path|url|sha256|hash|bytes|byte|size|media|provided|supplied|attached|available|persisted|verified|captured|from|only|the|a|an|this|that|is|are|was|were|and|or|none|unknown|not|applicable)\b/gi;
function assessStage1MaterialCapture(job={},stageData={}){
  const inventory=String(job?.SUPPLIED_MATERIALS_INVENTORY??'').trim();
  const inputSet=String(stageData?.INPUT_SET_CONTENTS??job?.INPUT_SET_CONTENTS??'').trim();
  let parsedInventory=null;try{parsedInventory=JSON.parse(inventory);}catch{}
  const materialRequired=!EMPTY_SUPPLIED_MATERIALS_PATTERN.test(inventory)&&!(Array.isArray(parsedInventory)&&parsedInventory.length===0)&&!(parsedInventory&&typeof parsedInventory==='object'&&!Array.isArray(parsedInventory)&&Object.keys(parsedInventory).length===0);
  if(!materialRequired)return {required:false,sufficient:true,reason:'NO_SUPPLIED_MATERIAL_REQUIRES_CAPTURE'};
  if(!inputSet)return {required:true,sufficient:false,reason:'MISSING_INPUT_SET_CONTENTS'};
  const normalize=value=>String(value??'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
  if(normalize(inputSet)===normalize(inventory))return {required:true,sufficient:false,reason:'MATERIAL_INVENTORY_REPEATED_WITHOUT_SEMANTIC_CAPTURE'};
  const referenceLike=value=>{
    const text=String(value??'').trim();
    if(!text)return true;
    if(/^(?:file|document|attachment|artifact|material|input|intent|none|unknown|not applicable)$/i.test(text))return true;
    if(/^https?:\/\/\S+$/i.test(text)||/^ARTIFACT-[A-Za-z0-9-]+$/i.test(text)||/^[a-f0-9]{64}$/i.test(text))return true;
    if(/^(?:[A-Za-z]:[\\/])?.+\.[A-Za-z0-9]{1,12}$/i.test(text))return true;
    if(/^(?:\.\.?[\\/]|[A-Za-z]:[\\/]|[\\/]).+/.test(text))return true;
    return false;
  };
  const leaves=[];const collect=value=>{if(Array.isArray(value))for(const item of value)collect(item);else if(value&&typeof value==='object')for(const item of Object.values(value))collect(item);else leaves.push(value);};
  try{collect(JSON.parse(inputSet));}catch{}
  if(leaves.length&&leaves.every(referenceLike))return {required:true,sufficient:false,reason:'STRUCTURED_REFERENCE_ONLY_CAPTURE'};
  if(referenceLike(inputSet))return {required:true,sufficient:false,reason:'REFERENCE_ONLY_CAPTURE'};
  const semanticResidue=inputSet
    .replace(/https?:\/\/[^\s"',;)\]}]+/gi,' ')
    .replace(/\bARTIFACT-[A-Za-z0-9-]+\b/gi,' ')
    .replace(/\b[a-f0-9]{64}\b/gi,' ')
    .replace(/["'](?:[^"']+\.)[A-Za-z0-9]{1,12}["']/gi,' ')
    .replace(/\b[^\s"'()[\]{}:,;]+\.[A-Za-z0-9]{1,12}\b/gi,' ')
    .replace(REFERENCE_ONLY_MATERIAL_WORDS,' ')
    .replace(/[^A-Za-z0-9]+/g,' ')
    .trim();
  if(!semanticResidue)return {required:true,sufficient:false,reason:'REFERENCE_ONLY_CAPTURE'};
  return {required:true,sufficient:true,reason:'SEMANTIC_CAPTURE_PRESENT'};
}
`;
          schema=replaceOnce(schema,'function sourceClassificationIssues(fields={}){',helper+'\nfunction sourceClassificationIssues(fields={}){','Stage 01 material-capture helper');
          schema=replaceOnce(schema,'sourceClassificationIssues,TARGET_PRODUCT_REFERENCE_PATTERN','assessStage1MaterialCapture,sourceClassificationIssues,TARGET_PRODUCT_REFERENCE_PATTERN','Stage 01 helper export');
          fs.writeFileSync('workflow-schema.js',schema);

          let ingestion=fs.readFileSync('response-ingestion.js','utf8');
          const ingestionAnchor="    if(safe(envelope.unresolved).some(item=>item.blocking!==false))issues.push(issue('MIXED_RESPONSE_TYPE','/unresolved','A DATA_PROPOSAL cannot contain blocking unresolved items. Use BLOCKED instead.'));\n    const hasData=Object.keys(envelope.stageData||{}).length||Object.values(envelope.records||{}).some(list=>safe(list).length);";
          const ingestionReplacement="    if(safe(envelope.unresolved).some(item=>item.blocking!==false))issues.push(issue('MIXED_RESPONSE_TYPE','/unresolved','A DATA_PROPOSAL cannot contain blocking unresolved items. Use BLOCKED instead.'));\n    if(stageNumber===1){const materialCapture=schema.assessStage1MaterialCapture(project.job,envelope.stageData||{});if(materialCapture.required&&!materialCapture.sufficient)issues.push(issue('INCOMPLETE_STAGE01_MATERIAL_CAPTURE','/stageData/INPUT_SET_CONTENTS','Stage 01 must preserve the substantive human-authority content already read from supplied material. A filename, path, URL, artifact identity, or material inventory alone is not sufficient for Stage 04 reuse.'));}\n    const hasData=Object.keys(envelope.stageData||{}).length||Object.values(envelope.records||{}).some(list=>safe(list).length);";
          ingestion=replaceOnce(ingestion,ingestionAnchor,ingestionReplacement,'Stage 01 ingestion rejection');
          ingestion=replaceOnce(ingestion,"version:'closed-loop-response-ingestion/4'","version:'closed-loop-response-ingestion/5'",'Response ingestion version');
          fs.writeFileSync('response-ingestion.js',ingestion);

          let engine=fs.readFileSync('workflow-engine.js','utf8');
          const stageOneAnchor="      if(!String(project.job.EXACT_USER_OBJECTIVE_VERBATIM||'').trim())reasons.push('Verbatim User Job Input is required.');\n      requireAccepted();";
          const stageOneReplacement="      if(!String(project.job.EXACT_USER_OBJECTIVE_VERBATIM||'').trim())reasons.push('Verbatim User Job Input is required.');\n      const materialCapture=schema.assessStage1MaterialCapture(project.job,project.stages[1]?.agentData||project.job);if(materialCapture.required&&!materialCapture.sufficient)reasons.push('Stage 01 did not preserve semantic human-authority content from supplied material; filename/reference-only capture cannot feed Stage 04.');\n      requireAccepted();";
          engine=replaceOnce(engine,stageOneAnchor,stageOneReplacement,'Stage 01 gate');
          const activeStageAnchor="  project.activeStage=Math.max(1,Math.min(30,Number(project.activeStage||currentStage)));";
          const activeStageReplacement="  const stageOneCapture=schema.assessStage1MaterialCapture(project.job,project.stages?.[1]?.agentData||project.job);project.activeStage=stageOneCapture.required&&!stageOneCapture.sufficient?1:Math.max(1,Math.min(30,Number(project.activeStage||currentStage)));";
          engine=replaceOnce(engine,activeStageAnchor,activeStageReplacement,'Legacy Stage 01 routing');
          const nextActionAnchor="function operationalNextAction(project,currentStage){const stage=Number(currentStage||1),requests=unresolvedHumanRequests(project,stage);if(requests.length)return 'Answer the current human-only question(s). Saving the answer will invalidate the old instruction and generate a replacement for this same stage.';if(stage===16){";
          const nextActionReplacement="function operationalNextAction(project,currentStage){const stage=Number(currentStage||1),requests=unresolvedHumanRequests(project,stage);if(requests.length)return 'Answer the current human-only question(s). Saving the answer will invalidate the old instruction and generate a replacement for this same stage.';if(stage===1){const materialCapture=schema.assessStage1MaterialCapture(project.job,project.stages?.[1]?.agentData||project.job);if(materialCapture.required&&!materialCapture.sufficient)return 'Correct Stage 01 now because the prior accepted result stored only a material reference instead of the material’s substantive human-authority content. Continue the original Stage 01 conversation that already received the material when that context still has it; do not attach the material to the application again and do not ask the human to retype or summarize it. Return replacement final JSON with a semantic INPUT_SET_CONTENTS capture. If the original external context no longer has the bytes and verified bytes exist in this application, retrieve them from Files; otherwise report the custody gap exactly.';}if(stage===16){";
          engine=replaceOnce(engine,nextActionAnchor,nextActionReplacement,'Stage 01 correction action');
          fs.writeFileSync('workflow-engine.js',engine);

          let prompt=fs.readFileSync('prompt-engine.js','utf8');
          prompt=replaceOnce(prompt,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';",'Prompt engine version');
          fs.writeFileSync('prompt-engine.js',prompt);

          let app=fs.readFileSync('app-core.js','utf8');
          const importAnchor="UNKNOWN_INFORMATION:JSON.stringify(raw.unknowns||[],null,2),CURRENT_ITERATION:raw.currentIteration||''";
          const importReplacement="UNKNOWN_INFORMATION:JSON.stringify(raw.unknowns||[],null,2),INPUT_SET_CONTENTS:raw.userJobInput?.inputSetContents||raw.userJobInput?.authorizedOperation01||'',CURRENT_ITERATION:raw.currentIteration||''";
          app=replaceOnce(app,importAnchor,importReplacement,'Legacy Stage 01 semantic import');
          fs.writeFileSync('app-core.js',app);

          const test=String.raw`import fs from 'node:fs';
import vm from 'node:vm';
import assert from 'node:assert/strict';

globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
const core=globalThis.closedLoopCore,schema=globalThis.closedLoopWorkflowSchema,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine,ingestion=globalThis.closedLoopResponseIngestion;
if(!core||!schema||!engine||!prompts||!ingestion)throw new Error('Runtime modules failed to load.');

const inventory=JSON.stringify([{type:'FILE',exactNameOrReference:'intent.pdf'}]);
const makeProject=id=>{const p=core.createBlankState(id);Object.assign(p.job,{JOB_ID:id,JOB_TITLE:'Stage 04 intent reuse regression',EXACT_USER_OBJECTIVE_VERBATIM:'Build the requested product from the supplied intent.',SUPPLIED_MATERIALS_INVENTORY:inventory,CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'SOURCE-SET-v001'});engine.ensureShape(p);engine.recalculate(p);return p;};
const savePrompt=(p,stage)=>{const record={...prompts.buildPromptRecord(stage,p),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(record);return record;};
const envelope=(p,prompt,inputSetContents)=>({schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage:1,operation:prompt.operation,promptIdentity:{instructionId:prompt.instructionId,bodySha256:prompt.bodySha256,contractSha256:prompt.contractSha256,contextSignature:prompt.contextSignature},scope:prompt.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{EXACT_DELIVERABLE_REQUESTED:'The product defined by the supplied intent.',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:inputSetContents},records:{},evidence:[{temporaryKey:'evidence-1',kind:'HUMAN_INPUT',description:'Human input supporting the Stage 01 definition',authorityType:'HUMAN',location:'AUTHORIZED USER JOB INPUT',content:'The supplied intent and its project requirements were inspected.'}],unresolved:[],warnings:[],attachments:[]});

assert.equal(schema.assessStage1MaterialCapture({SUPPLIED_MATERIALS_INVENTORY:''},{INPUT_SET_CONTENTS:''}).sufficient,true);
assert.equal(schema.assessStage1MaterialCapture({SUPPLIED_MATERIALS_INVENTORY:inventory},{INPUT_SET_CONTENTS:'intent.pdf'}).sufficient,false);
const semanticCapture='intent.pdf states that the product must retain every project requirement supplied by the user and must never request the same project input again.';
assert.equal(schema.assessStage1MaterialCapture({SUPPLIED_MATERIALS_INVENTORY:inventory},{INPUT_SET_CONTENTS:semanticCapture}).sufficient,true);

const bad=makeProject('JOB-STAGE04-BAD-CAPTURE'),badPrompt=savePrompt(bad,1),badPrepared=ingestion.prepare(bad,{stage:1,text:JSON.stringify(envelope(bad,badPrompt,'intent.pdf')),promptRecord:badPrompt});
assert.equal(badPrepared.validation.valid,false);
assert.ok(badPrepared.validation.issues.some(item=>item.code==='INCOMPLETE_STAGE01_MATERIAL_CAPTURE'));
assert.equal(badPrepared.project.projectData.acceptedChanges.length,0);
assert.equal(badPrepared.project.job.INPUT_SET_CONTENTS,'');

const good=makeProject('JOB-STAGE04-GOOD-CAPTURE'),goodPrompt=savePrompt(good,1),goodPrepared=ingestion.prepare(good,{stage:1,text:JSON.stringify(envelope(good,goodPrompt,semanticCapture)),promptRecord:goodPrompt});
assert.equal(goodPrepared.validation.valid,true,JSON.stringify(goodPrepared.validation.issues));
const committed=ingestion.commit(goodPrepared.project,goodPrepared.proposal.proposalId,{operator:'REGRESSION_TEST',reviewNote:'Semantic capture accepted.'}).project;
assert.equal(committed.job.INPUT_SET_CONTENTS,semanticCapture);
const stage4Prompt=prompts.buildPromptRecord(4,committed).prompt;
assert.match(stage4Prompt,/ACCEPTED STAGE 01 JOB DEFINITION — CANONICAL INPUT, DO NOT ASK THE HUMAN TO RESEND IT/i);
assert.match(stage4Prompt,/must never request the same project input again/i);
assert.match(stage4Prompt,/Do not ask the human to attach, resend, retype, or summarize the original intent file/i);
const handoff=engine.executionHandoff(committed,{stage:4,operation:'COMPLETE'});
assert.deepEqual(handoff.send,[]);
assert.deepEqual(handoff.conversationMaterials,[]);

const legacy=makeProject('JOB-STAGE04-LEGACY-CAPTURE');legacy.job.INPUT_SET_CONTENTS='intent.pdf';legacy.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Legacy product',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:'intent.pdf'};legacy.stages[1].acceptedData={...legacy.stages[1].agentData};legacy.projectData.acceptedChanges.push({changeId:'CHANGE-STAGE01-LEGACY',stage:1,status:'COMMITTED',responseType:'DATA_PROPOSAL'});legacy.stages[1].acceptedDataChangeIds=['CHANGE-STAGE01-LEGACY'];legacy.projectData.stageConfirmations.push({confirmationId:'CONFIRM-STAGE01-LEGACY',stage:1,confirmed:true,acceptedChangeId:'CHANGE-STAGE01-LEGACY',inputVersion:'INPUT-v001'});legacy.activeStage=4;engine.recalculate(legacy);
assert.notEqual(legacy.stages[1].status,'COMPLETE');
assert.equal(legacy.activeStage,1);
assert.ok(legacy.stages[1].gate.reasons.some(reason=>/filename\/reference-only capture cannot feed Stage 04/i.test(reason)));
const correction=engine.operationalNextAction(legacy,1);
assert.match(correction,/Continue the original Stage 01 conversation/i);
assert.match(correction,/do not attach the material to the application again/i);
assert.match(correction,/do not ask the human to retype or summarize it/i);

console.log(JSON.stringify({stage1ReferenceOnlyRejected:true,canonicalMutationOnRejectedCapture:false,stage4PromptReusesSemanticCapture:true,stage4RequiresIntentReattachment:false,legacyProjectRoutedToStage1Correction:true,promptEngineVersion:prompts.version,responseIngestionVersion:ingestion.version},null,2));
`;
          fs.writeFileSync('verify-stage4-intent-reuse.mjs',test);

          let workflow=fs.readFileSync('.github/workflows/pages.yml','utf8');
          const stale=/\n  materialize-stage4-intent-reuse:[\s\S]*?(?=\n  publish-status:)/;
          if(!stale.test(workflow))throw new Error('Stale Stage 04 materializer job was not found.');
          workflow=workflow.replace(stale,'');
          workflow=replaceOnce(workflow,'          node --check verify-test-runtime.mjs\n','          node --check verify-test-runtime.mjs\n          node --check verify-stage4-intent-reuse.mjs\n','Stage 04 regression syntax check');
          workflow=replaceOnce(workflow,'          node verify-complete.mjs\n','          node verify-complete.mjs\n          node verify-stage4-intent-reuse.mjs\n','Stage 04 regression test job');
          workflow=replaceOnce(workflow,'node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs','node verify-ingestion.mjs && node verify-complete.mjs && node verify-stage4-intent-reuse.mjs && node verify-full-cycle.mjs','Stage 04 regression deploy proof');
          workflow=replaceOnce(workflow,'          node verify-complete.mjs > /tmp/verify-complete.out\n','          node verify-complete.mjs > /tmp/verify-complete.out\n          node verify-stage4-intent-reuse.mjs > /tmp/verify-stage4-intent-reuse.out\n','Stage 04 regression acceptance proof');
          workflow=replaceOnce(workflow,"          grep -q 'verify-test-runtime: PASS' /tmp/verify-test-runtime.out\n","          grep -q 'verify-test-runtime: PASS' /tmp/verify-test-runtime.out\n          grep -q '\"stage4RequiresIntentReattachment\": false' /tmp/verify-stage4-intent-reuse.out\n",'Stage 04 regression acceptance assertion');
          fs.writeFileSync('.github/workflows/pages.yml',workflow);

          fs.rmSync('.github/workflows/materialize-stage4-single-capture.yml');
          NODE
          node --check workflow-schema.js
          node --check response-ingestion.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-stage4-intent-reuse.mjs
          node verify-stage4-intent-reuse.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Commit the verified permanent repair
        shell: bash
        run: |
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix Stage 04 by enforcing single-capture intent reuse"
          git push origin HEAD:fix/stage4-single-capture
