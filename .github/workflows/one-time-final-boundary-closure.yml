name: One-time exact-current final boundary proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  prove:
    if: github.head_ref == 'reliability/final-boundary-closure-b6bc-20260826'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/final-boundary-closure-b6bc-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only demonstrated boundary corrections
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b6bc2e141df99bc740e3c89dd4b0f634874df45b HEAD
          python3 fix-transformer-anchor.py
          python3 fix-artifact-proof.py
          python3 apply-final-boundary-closure.py
          rm fix-transformer-anchor.py fix-artifact-proof.py apply-final-boundary-closure.py .github/workflows/one-time-final-boundary-closure.yml
      - name: Verify exact responsible-layer corrections
        run: |
          set -euo pipefail
          node --check response-ingestion.js
          node --check prompt-engine.js
          node --check project-store.js
          node --check test-fixtures.mjs
          node --check verify-ingestion.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/final-boundary-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          test ! -e fix-transformer-anchor.py
          test ! -e fix-artifact-proof.py
          test ! -e apply-final-boundary-closure.py
          test ! -e .github/workflows/one-time-final-boundary-closure.yml
      - name: Commit only verified permanent files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add response-ingestion.js prompt-engine.js project-store.js test-fixtures.mjs verify-ingestion.mjs verify-prompt-semantics.mjs verify.mjs index.html
          git add -u .github/workflows/one-time-final-boundary-closure.yml apply-final-boundary-closure.py fix-transformer-anchor.py fix-artifact-proof.py
          git diff --cached --name-only
          git commit -m 'Close remaining response, artifact, prompt, and migration boundaries'
          git push origin HEAD:reliability/final-boundary-closure-b6bc-20260826
