name: Repair stage recalculation and self-remove
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
concurrency:
  group: repair-stage-recalculation-once
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.head_commit.message == 'Retry one-time stage recalculation repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - name: Reacquire stage state after gate normalization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          t=p.read_text()
          old="  for(let stage=1;stage<=30;stage++){\n    const state=project.stages[stage];\n    if(!previousComplete){"
          new="  for(let stage=1;stage<=30;stage++){\n    let state=project.stages[stage];\n    if(!previousComplete){"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('recalculate stage-state declaration anchor not found')
          old2="    const wasComplete=state.status==='COMPLETE',result=gate(stage,project);\n    state.gate=result;"
          new2="    const wasComplete=state.status==='COMPLETE',result=gate(stage,project);\n    // gate() normalizes project shape and may replace stage objects; always mutate the current canonical object.\n    state=project.stages[stage];\n    state.gate=result;"
          if old2 in t:
              t=t.replace(old2,new2,1)
          elif new2 not in t:
              raise SystemExit('recalculate gate-result anchor not found')
          p.write_text(t)
          PY
          node --check workflow-engine.js
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-engine.js
          git rm .github/workflows/repair-stage-recalculation.yml
          git commit -m "Persist recalculated stage state after gate normalization"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
