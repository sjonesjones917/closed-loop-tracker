name: Stage 01 source-commit regression repair
on:
  push:
    branches: [controller-stage01-sourcecommit-regression-20260903]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage01-sourcecommit-regression-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node .stage01-fix.mjs
          rm .stage01-fix.mjs .github/workflows/stage01-sourcecommit-fix.yml
          node verify-specification-governance.mjs >/tmp/governance.json
          node verify-contract-closure.mjs
          node verify-hash.mjs
          grep -q '"sourceCommit": "3f6b8697eca8afaaad9163906f7d07c331fb8556"' /tmp/governance.json
      - run: |
          set -euo pipefail
          git config user.name 'closed-loop-controller'
          git config user.email 'closed-loop-controller@users.noreply.github.com'
          git add -A
          git commit -m 'Stage 01: bind governance to exact source commit'
          git push origin HEAD:controller-stage01-sourcecommit-regression-20260903
