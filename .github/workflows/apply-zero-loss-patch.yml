name: Apply coordinated zero-loss reliability patch
on:
  push:
    branches: [reliability/zero-loss-coordinated-20260828]
    paths: ['.github/workflows/apply-zero-loss-patch.yml']
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact coordinated patch and restore the single-workflow tree
        shell: bash
        run: |
          set -euxo pipefail
          test "$(wc -c < .zero-loss-patch/chunk-03a)" -eq 1500
          test "$(wc -c < .zero-loss-patch/chunk-03b)" -eq 1500
          echo 'be8ba2a4f215eb07887d6a653d4bd1d4da173df7b1b8e0bf6bf2385bc2296bf5  .zero-loss-patch/chunk-03a' | sha256sum -c -
          echo 'df738af1b77df133b23334903b0b0f7b417545d75071fd5d463351e6204eeed1  .zero-loss-patch/chunk-03b' | sha256sum -c -
          cat \
            .zero-loss-patch/chunk-00 \
            .zero-loss-patch/chunk-01 \
            .zero-loss-patch/chunk-02 \
            .zero-loss-patch/chunk-03a \
            .zero-loss-patch/chunk-03b \
            .zero-loss-patch/chunk-04 \
            .zero-loss-patch/chunk-05 \
            .zero-loss-patch/chunk-06 \
            .zero-loss-patch/chunk-07 \
            > /tmp/zero-loss.patch.gz.b64
          test "$(wc -c < /tmp/zero-loss.patch.gz.b64)" -eq 23224
          echo '9e8b42152089c9563266573a8dc2172cf315ce804864cb9ea08a6341df05ab1b  /tmp/zero-loss.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/zero-loss.patch.gz.b64 > /tmp/zero-loss.patch.gz
          gzip --decompress --stdout /tmp/zero-loss.patch.gz > /tmp/zero-loss.patch
          git apply --check /tmp/zero-loss.patch
          git apply /tmp/zero-loss.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          app=Path('app-core.js')
          source=app.read_text()
          old='<h2 class="section-title">Completed stage summary</h2><p class="section-intro">The application renders this bounded canonical summary first so a large preserved audit history cannot freeze stage navigation. No record, prompt, raw response, evidence, or provenance link has been removed.</p>'
          new='<h2 class="section-title">Completed stage summary</h2><div class="notice success"><strong>Stage ${String(n).padStart(2,\'0\')} is preserved completed history.</strong> The canonical stage record remains fully inspectable through Open full Stage ${String(n).padStart(2,\'0\')} audit details.</div><p class="section-intro">The application renders this bounded canonical summary first so a large preserved audit history cannot freeze stage navigation. No record, prompt, raw response, evidence, or provenance link has been removed.</p>'
          if old not in source:
              raise SystemExit('Historical-stage inspectability insertion target was not found.')
          app.write_text(source.replace(old,new,1))

          browser=Path('verify-browser-extra.mjs')
          browser_source=browser.read_text()
          old_fixture="scope:pr.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{},records:{sources:"
          new_fixture="scope:pr.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{SOURCE_APPLICABILITY_DETERMINATION:'APPLICABLE_SOURCES_ESTABLISHED'},records:{sources:"
          if old_fixture not in browser_source:
              raise SystemExit('Stage 02 large-state browser fixture target was not found.')
          browser.write_text(browser_source.replace(old_fixture,new_fixture,1))

          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          def git_blob_sha(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest=''.join(f'{name}:{git_blob_sha(name)}\n' for name in runtime_files)
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          index=Path('index.html')
          html=index.read_text()
          html,count=re.subn(r'runtime-[0-9a-f]{16}',token,html)
          if count!=8:
              raise SystemExit(f'Expected 8 runtime cache tokens, replaced {count}.')
          index.write_text(html)
          print(token)
          PY
          rm -rf .zero-loss-patch
          rm -f .zero-loss.patch.gz.b64
          rm -f .github/workflows/zero-loss-source-export.yml
          rm -f .github/workflows/apply-zero-loss-patch.yml
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
      - name: Syntax and deterministic source gates
        shell: bash
        run: |
          set -euxo pipefail
          node build-test-project.mjs
          for file in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-full-cycle.mjs
      - name: Chromium acceptance including exact large-state Back path
        shell: bash
        run: |
          set -euxo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit exact tested tree
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Bound large-state recalculation and historical navigation'
          git push origin HEAD:reliability/zero-loss-coordinated-20260828
