name: Apply verified minimum semantic corrections
'on':
  push:
    branches:
      - practical-100/pr6-final-proof-current
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-final-proof-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded historical transformer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source=subprocess.check_output(['git','show','b84bbd0484fbc47f42e0289d1df5655a9f2d2cb7:.github/workflows/pr6-semantic-scope-fix.yml'],text=True)
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          code=code.replace("\nold_scope=", "\ntext=engine.read_text()\n\nold_scope=", 1)
          needle="replace_once('verify-full-cycle.mjs',"
          i=code.find(needle)
          if i>=0:
              j=code.find('\n\n',i)
              if j<0: raise SystemExit('Could not isolate already-applied full-cycle fixture correction.')
              code=code[:i]+code[j+2:]
          exec(compile(code,'pr6-minimum-semantic-transform.py','exec'),{})

          p=Path('workflow-engine.js'); text=p.read_text()
          old="stage=Number(iteration?.stage||runs[0]?.stage||0);"
          new="stage=Number(runs[0]?.stage||iteration?.stage||0);"
          if text.count(old)!=1: raise SystemExit(f'Iteration run-stage precedence match {text.count(old)}')
          p.write_text(text.replace(old,new,1))

          p=Path('verify-complete.mjs'); text=p.read_text()
          old="p.projectData.candidateFreezes.push(record('candidateFreezes',10,{ITERATION_ID:'ITERATION-STAGE11',STATUS:'FROZEN'},'CANDIDATE-STAGE11'));"
          new="p.projectData.candidateFreezes.push(record('candidateFreezes',10,{ITERATION_ID:'ITERATION-STAGE11',COMPONENT_HASHES:{'ARTIFACT-STAGE11':'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'},STATUS:'FROZEN'},'CANDIDATE-STAGE11'));"
          if text.count(old)!=1: raise SystemExit(f'Stage11 candidate fixture match {text.count(old)}')
          text=text.replace(old,new,1)
          old="p.projectData.rawResponses.push({rawResponseId:`RAW-STAGE11-${i}`,stage:11});p.projectData.outputReceipts.push({receiptId:`RECEIPT-STAGE11-${i}`,stage:11});"
          new="p.projectData.rawResponses.push({rawResponseId:`RAW-STAGE11-${i}`,stage:11,promptScope:{iterationId:'ITERATION-STAGE11',candidateId:'CANDIDATE-STAGE11',runId:`RUN-STAGE11-${i}`,contextId:`CONTEXT-STAGE11-${i}`}});p.projectData.outputReceipts.push({receiptId:`RECEIPT-STAGE11-${i}`,stage:11,iteration:'ITERATION-STAGE11',runId:`RUN-STAGE11-${i}`,contextId:`CONTEXT-STAGE11-${i}`});"
          if text.count(old)!=1: raise SystemExit(f'Stage11 receipt fixture match {text.count(old)}')
          text=text.replace(old,new,1)

          a=text.index("const p=project('JOB-ITERATION-SCOPE')")
          b=text.index('// Permanent regression/change records',a)
          segment=text[a:b]
          segment=segment.replace("const p=project('JOB-ITERATION-SCOPE'),oldIteration=", "const p=project('JOB-ITERATION-SCOPE'),baseScope=engine.currentScope(p),oldIteration=",1)
          segment=segment.replace("scope:{iterationId:oldIteration,candidateId:oldCandidate}","scope:{...baseScope,iterationId:oldIteration,candidateId:oldCandidate}")
          segment=segment.replace("scope:{iterationId:newIteration,candidateId:newCandidate}","scope:{...baseScope,iterationId:newIteration,candidateId:newCandidate}")
          marker="test.relationships={REQ_ID:'REQ-SCOPED'};"
          if marker not in segment: raise SystemExit('Iteration-scope fixture relationship marker missing.')
          segment=segment.replace(marker,"req.scope={...baseScope};test.scope={...baseScope};"+marker,1)
          text=text[:a]+segment+text[b:]
          p.write_text(text)
          PY
      - name: Verify all deterministic source contracts
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit only verified corrections and remove repair workflow
        run: |
          rm .github/workflows/pr6-minimal-semantic-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix iteration scope and repeated-cycle semantics"
          git push origin HEAD:practical-100/pr6-final-proof-current
