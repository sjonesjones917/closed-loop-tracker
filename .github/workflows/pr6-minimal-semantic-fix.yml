name: Apply verified minimum semantic corrections
'on':
  push:
    branches:
      - practical-100/pr6-final-proof-current
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-final-proof-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded historical transformer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source=subprocess.check_output(['git','show','b84bbd0484fbc47f42e0289d1df5655a9f2d2cb7:.github/workflows/pr6-semantic-scope-fix.yml'],text=True)
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          code=code.replace("\nold_scope=", "\ntext=engine.read_text()\n\nold_scope=", 1)
          needle="replace_once('verify-full-cycle.mjs',"
          i=code.find(needle)
          if i>=0:
              j=code.find('\n\n',i)
              if j<0: raise SystemExit('Could not isolate already-applied full-cycle fixture correction.')
              code=code[:i]+code[j+2:]
          exec(compile(code,'pr6-minimum-semantic-transform.py','exec'),{})

          p=Path('workflow-engine.js'); text=p.read_text()
          old="stage=Number(iteration?.stage||runs[0]?.stage||0);"; new="stage=Number(runs[0]?.stage||iteration?.stage||0);"
          if text.count(old)!=1: raise SystemExit(f'Iteration run-stage precedence match {text.count(old)}')
          text=text.replace(old,new,1)
          old="baselineId:recordId(records(project,'baselines').at(-1),'baselines')||project.job.CURRENT_BASELINE_ID||null,productId:recordId(records(project,'products').at(-1),'products')||project.job.CURRENT_PRODUCT_ID||null"
          new="baselineId:recordId(records(project,'baselines').at(-1),'baselines')||(upper(project.job.CURRENT_BASELINE_ID)==='NONE'?null:project.job.CURRENT_BASELINE_ID)||null,productId:recordId(records(project,'products').at(-1),'products')||(upper(project.job.CURRENT_PRODUCT_ID)==='NONE'?null:project.job.CURRENT_PRODUCT_ID)||null"
          if text.count(old)!=1: raise SystemExit(f'Identity sentinel scope match {text.count(old)}')
          text=text.replace(old,new,1)
          old="function unresolvedMaterialDefects(project){\n  return confirmedDefects(project).filter(record=>{\n    const severity=upper(recordValue(record,'SEVERITY'));\n    const status=upper(recordValue(record,'STATUS'));\n    return ['CRITICAL','MAJOR'].includes(severity)&&!['CLOSED','CLOSED VERIFIED','CLOSED_VERIFIED','RESOLVED','CORRECTED AND VERIFIED','RETIRED'].includes(status);\n  });\n}"
          new="function defectResolvedByRegression(project,defect){const defectId=recordId(defect,'defects'),regressions=records(project,'regressions').filter(record=>String(recordValue(record,'DEFECT_ID')||record.relationships?.DEFECT_ID||'')===defectId&&upper(recordValue(record,'ACTIVE_RETIRED_STATE')||'ACTIVE')!=='RETIRED');if(!regressions.length)return false;return regressions.every(regression=>{const regId=recordId(regression,'regressions'),executions=records(project,'regressionExecutions').filter(record=>String(recordValue(record,'REG_ID')||record.relationships?.REG_ID||'')===regId);const latest=executions.at(-1);return Boolean(latest)&&['SATISFIED','SUCCESS','PASSED'].includes(upper(recordValue(latest,'RESULT')))&&upper(recordValue(latest,'PHASE'))!=='PRE_CORRECTION';});}\nfunction unresolvedMaterialDefects(project){\n  return confirmedDefects(project).filter(record=>{\n    const severity=upper(recordValue(record,'SEVERITY'));\n    const status=upper(recordValue(record,'STATUS'));\n    return ['CRITICAL','MAJOR'].includes(severity)&&!['CLOSED','CLOSED VERIFIED','CLOSED_VERIFIED','RESOLVED','CORRECTED AND VERIFIED','RETIRED'].includes(status)&&!defectResolvedByRegression(project,record);\n  });\n}"
          if text.count(old)!=1: raise SystemExit(f'Defect lifecycle derivation match {text.count(old)}')
          text=text.replace(old,new,1)
          marker='function freezeBaseline(project,'; i=text.index(marker)
          fn="""function beginUnchangedConfirmationIteration(project,{candidateId,operatorLabel='HUMAN_OPERATOR'}={}){\n  ensureShape(project);const candidate=records(project,'candidateFreezes').find(record=>recordId(record,'candidateFreezes')===String(candidateId||'')&&isActiveRecord(record));if(!candidate)throw new Error('A current frozen candidate is required for unchanged confirmation.');const componentHashes=recordValue(candidate,'COMPONENT_HASHES')||{};if(!componentHashes||typeof componentHashes!=='object'||Array.isArray(componentHashes)||!Object.keys(componentHashes).length)throw new Error('The unchanged-confirmation candidate must have application-computed component hashes.');const previousIterationId=String(recordValue(candidate,'ITERATION_ID')||candidate.scope?.iterationId||'');const previousIteration=records(project,'iterations').find(record=>recordId(record,'iterations')===previousIterationId);if(!previousIteration)throw new Error('The candidate source iteration does not exist.');const iterationId=allocateId(project,'iterations'),createdAt=now(),baseScope=clone(previousIteration.scope||candidate.scope||currentScope(project));const fields={ITERATION_ID:iterationId,CANDIDATE_ID:String(candidateId),PREVIOUS_ITERATION_ID:previousIterationId,CHANGESET_ID:'',PURPOSE:'UNCHANGED_CONFIRMATION',STATUS:'FROZEN',LINEAGE:hash.sha256Value({candidateId:String(candidateId),componentHashes}),EVIDENCE:'Application allocated a new unchanged-confirmation iteration using the exact existing frozen candidate identity.'};const iteration={id:iterationId,stage:19,createdAt,active:true,scope:{...baseScope,iterationId,candidateId:String(candidateId)},fields,...fields,source:'APPLICATION_DERIVATION'};iteration.contentSha256=hash.contentRecordSha256(iteration,'ITERATION_ID');iteration.recordSha256=hash.recordSha256(iteration);iteration.sha256=iteration.recordSha256;project.projectData.iterations.push(iteration);project.job.CURRENT_ITERATION=iterationId;addHistory(project,'UNCHANGED_CONFIRMATION_ITERATION_STARTED',{stage:19,iterationId,candidateId:String(candidateId),previousIterationId,operatorLabel,identityAssurance:'SELF_ASSERTED'});recalculate(project);return iteration;\n}\n"""
          text=text[:i]+fn+text[i:]
          old="const contexts=recordsForCurrentScope(project,'freshContexts').filter(r=>!recordValue(r,'RUN_ID')),context=contexts.at(-1);"
          new="const contexts=recordsForCurrentScope(project,'freshContexts').filter(r=>{const runId=upper(recordValue(r,'RUN_ID'));return !runId||runId==='NOT APPLICABLE';}),context=contexts.at(-1);"
          if text.count(old)!=1: raise SystemExit(f'Production context selector match {text.count(old)}')
          text=text.replace(old,new,1)
          old='freezeCandidate,freezeBaseline,reserveProductExecution'; new='freezeCandidate,beginUnchangedConfirmationIteration,freezeBaseline,reserveProductExecution'
          if text.count(old)!=1: raise SystemExit(f'Engine export insertion match {text.count(old)}')
          text=text.replace(old,new,1); p.write_text(text)

          p=Path('verify-complete.mjs'); text=p.read_text()
          old="p.projectData.candidateFreezes.push(record('candidateFreezes',10,{ITERATION_ID:'ITERATION-STAGE11',STATUS:'FROZEN'},'CANDIDATE-STAGE11'));"; new="p.projectData.candidateFreezes.push(record('candidateFreezes',10,{ITERATION_ID:'ITERATION-STAGE11',COMPONENT_HASHES:{'ARTIFACT-STAGE11':'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'},STATUS:'FROZEN'},'CANDIDATE-STAGE11'));"
          if text.count(old)!=1: raise SystemExit(f'Stage11 candidate fixture match {text.count(old)}')
          text=text.replace(old,new,1)
          old="p.projectData.rawResponses.push({rawResponseId:`RAW-STAGE11-${i}`,stage:11});p.projectData.outputReceipts.push({receiptId:`RECEIPT-STAGE11-${i}`,stage:11});"; new="p.projectData.rawResponses.push({rawResponseId:`RAW-STAGE11-${i}`,stage:11,promptScope:{iterationId:'ITERATION-STAGE11',candidateId:'CANDIDATE-STAGE11',runId:`RUN-STAGE11-${i}`,contextId:`CONTEXT-STAGE11-${i}`}});p.projectData.outputReceipts.push({receiptId:`RECEIPT-STAGE11-${i}`,stage:11,iteration:'ITERATION-STAGE11',runId:`RUN-STAGE11-${i}`,contextId:`CONTEXT-STAGE11-${i}`});"
          if text.count(old)!=1: raise SystemExit(f'Stage11 receipt fixture match {text.count(old)}')
          text=text.replace(old,new,1)
          a=text.index("const p=project('JOB-ITERATION-SCOPE')"); b=text.index('// Permanent regression/change records',a); segment=text[a:b]
          segment=segment.replace("const p=project('JOB-ITERATION-SCOPE'),oldIteration=", "const p=project('JOB-ITERATION-SCOPE'),baseScope=engine.currentScope(p),oldIteration=",1).replace("scope:{iterationId:oldIteration,candidateId:oldCandidate}","scope:{...baseScope,iterationId:oldIteration,candidateId:oldCandidate}").replace("scope:{iterationId:newIteration,candidateId:newCandidate}","scope:{...baseScope,iterationId:newIteration,candidateId:newCandidate}")
          marker="test.relationships={REQ_ID:'REQ-SCOPED'};"
          if marker not in segment: raise SystemExit('Iteration-scope fixture relationship marker missing.')
          segment=segment.replace(marker,"req.scope={...baseScope};test.scope={...baseScope};"+marker,1); text=text[:a]+segment+text[b:]; p.write_text(text)

          p=Path('verify-full-cycle.mjs'); text=p.read_text(); marker="acceptStage(17,{operation:'REGRESSION',records:{regressionExecutions:"; i=text.index(marker); text=text[:i]+"acceptStage(17,{operation:'ROOT_CAUSE',stageData:{ROOT_CAUSE_COMPLETED:true}});\n"+text[i:]
          old="engine.constructEvidenceChains(p);assertStage(p,29);"; new="const chains=engine.constructEvidenceChains(p);if(chains.some(x=>engine.recordValue(x,'STATUS')!=='COMPLETE'))console.error('EVIDENCE_CHAINS',JSON.stringify(chains.map(x=>({req:engine.recordValue(x,'REQ_ID'),missing:engine.recordValue(x,'MISSING_LINKS'),fields:x.fields})),null,2));assertStage(p,29);"
          if text.count(old)!=1: raise SystemExit(f'Stage29 diagnostic insertion match {text.count(old)}')
          p.write_text(text.replace(old,new,1))

          p=Path('app-core.js'); text=p.read_text(); old="const applicable=[10,20,21,25,28].includes(n)"; new="const applicable=[10,17,20,21,25,28].includes(n)"
          if text.count(old)!=1: raise SystemExit(f'Artifact stage list match {text.count(old)}')
          text=text.replace(old,new,1); old="${n===10?`<button id=\"freeze-candidate\"${locked?' disabled':''}>Freeze selected candidate</button>`:''}"; new="${(n===10||n===17)?`<button id=\"freeze-candidate\"${locked?' disabled':''}>Freeze selected candidate</button>`:''}${n===19?`<button id=\"begin-unchanged-confirmation\"${locked?' disabled':''}>Begin unchanged confirmation</button>`:''}"
          if text.count(old)!=1: raise SystemExit(f'Freeze candidate button match {text.count(old)}')
          text=text.replace(old,new,1); hook="if($('#freeze-baseline'))"; i=text.index(hook); insertion="if($('#begin-unchanged-confirmation'))$('#begin-unchanged-confirmation').onclick=async()=>{try{const next=clone(current),candidate=engine.records(next,'candidateFreezes').filter(r=>Number(r.stage)===17&&engine.isActiveRecord(r)).at(-1);if(!candidate)throw new Error('A current Stage 17 frozen candidate is required.');engine.beginUnchangedConfirmationIteration(next,{candidateId:engine.recordId(candidate,'candidateFreezes'),operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});await persistReplacement(next);announce('saved');render();}catch(error){alert(error.message||error);}};"
          text=text[:i]+insertion+text[i:]; p.write_text(text)
          PY
      - name: Verify all deterministic source contracts
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit only verified corrections and remove repair workflow
        run: |
          rm .github/workflows/pr6-minimal-semantic-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix iteration scope and repeated-cycle semantics"
          git push origin HEAD:practical-100/pr6-final-proof-current
