name: Run controlling specification repair phase 1
'on':
  push:
    branches:
      - spec-conformance-zero-loss
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-conformance-zero-loss
          fetch-depth: 0
      - name: Apply checked repair program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          source=Path('.github/workflows/spec-repair-phase1.yml').read_text()
          start=source.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=source.index("\n          PY",start)
          program=textwrap.dedent(source[start:end])
          Path('/tmp/spec-repair.py').write_text(program)
          subprocess.run(['python3','/tmp/spec-repair.py'],check=True)
          PY
      - name: Syntax check changed runtime files
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check prompt-engine.js
      - name: Commit phase 1
        shell: bash
        run: |
          rm .github/workflows/spec-repair-phase1.yml .github/workflows/spec-repair-trigger.yml
          git config user.name "closed-loop-spec-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply controlling /3 contract and prompt corrections"
          git push origin HEAD:spec-conformance-zero-loss
