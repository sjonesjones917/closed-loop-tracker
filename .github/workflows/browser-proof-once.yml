name: Repair legacy Stage 01 accounting and prove browser acceptance once
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths: [.github/workflows/browser-proof-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize legacy human authority into the v3 intake capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js');s=p.read_text()
          anchor="function obligationFragments(value){"
          insert=r'''function migrateLegacyStage01Accounting(project){
  ensureShape(project);
  const stage=project.stages?.[1],existing=stage?.agentData?.INPUT_SET_CONTENTS??stage?.acceptedData?.INPUT_SET_CONTENTS;
  if(parseIntakeCaptureValue(existing))return {migrated:false,reason:'CURRENT_CAPTURE_EXISTS'};
  const imported=safe(project.projectData?.nonOperationalImportedPayloads).length>0||safe(stage?.acceptedDataChangeIds).some(id=>String(id).startsWith('IMPORTED-'))||safe(stage?.acceptedResponseIds).some(id=>String(id).startsWith('IMPORTED-'));
  if(!imported)return {migrated:false,reason:'NOT_LEGACY_IMPORTED'};
  const manifest=intakeCoverageManifest(project),job=project.job||{},answers=safe(project.projectData?.humanInputAnswers),classFor=unit=>{
    const field=String(unit.sourceLocation||'').startsWith('job.')?String(unit.sourceLocation).slice(4):'';
    if(field==='EXPLICIT_USER_REQUIREMENTS')return 'REQUIREMENT';
    if(field==='PROHIBITED_ACTIONS')return 'PROHIBITION';
    if(['REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE'].includes(field))return 'CONSTRAINT';
    if(['JOB_TITLE','JOB_OWNER'].includes(field))return 'DECISION';
    if(field==='EXACT_USER_OBJECTIVE_VERBATIM')return 'REQUESTED_OUTPUT';
    if(field==='SUPPLIED_MATERIALS_INVENTORY'||unit.kind==='SUPPLIED_MATERIAL')return 'MATERIAL_REFERENCE';
    return 'FACT';
  },valueFor=unit=>{
    const source=String(unit.sourceLocation||'');
    if(source.startsWith('job.'))return job[source.slice(4)];
    if(unit.kind==='SUPPLIED_MATERIAL')return unit.label;
    if(unit.kind==='HUMAN_ANSWER'){const hit=answers.find(x=>String(x.answerId||x.requestId||'')===String(unit.answerId||unit.requestId||''));return hit?.answer??unit.label;}
    return unit.label;
  };
  const units=manifest.units.map(unit=>({sourceUnitId:unit.unitId,disposition:'INCORPORATED',reason:'Deterministically migrated from preserved legacy human-authority input; original imported payload remains non-operational audit evidence.',extractedStatements:[{statementKey:'legacy-'+unit.unitId.slice(-12),text:String(valueFor(unit)??unit.label??'').trim(),statementClass:classFor(unit)}]}));
  const capture={schema:INTAKE_CAPTURE_SCHEMA,inputVersion:manifest.inputVersion,manifestSha256:manifest.manifestSha256,units,conversationStatements:[]},serialized=JSON.stringify(capture);
  stage.agentData=stage.agentData&&typeof stage.agentData==='object'?stage.agentData:{};stage.agentData.INPUT_SET_CONTENTS=serialized;
  stage.acceptedData=stage.acceptedData&&typeof stage.acceptedData==='object'?stage.acceptedData:{};stage.acceptedData.INPUT_SET_CONTENTS=serialized;
  project.job.INPUT_SET_CONTENTS=serialized;
  const snapshot={...manifest,captureSha256:hash.sha256Value(capture),source:'DETERMINISTIC_LEGACY_MIGRATION',projectRevision:Number(project.revision||0)};
  if(!safe(project.projectData.intakeCoverageManifests).some(x=>x.manifestSha256===manifest.manifestSha256&&x.captureSha256===snapshot.captureSha256))project.projectData.intakeCoverageManifests.push(snapshot);
  addHistory(project,'LEGACY_STAGE01_ACCOUNTING_MATERIALIZED',{stage:1,inputVersion:manifest.inputVersion,manifestSha256:manifest.manifestSha256,captureSha256:snapshot.captureSha256,unitCount:manifest.unitCount});
  return {migrated:true,manifestSha256:manifest.manifestSha256,captureSha256:snapshot.captureSha256,unitCount:manifest.unitCount};
}
'''
          if anchor not in s: raise SystemExit('engine insertion anchor missing')
          s=s.replace(anchor,insert+anchor,1)
          export_anchor='releaseVerificationTrust,evaluateResultConsistency,effectiveDetermination,validateTraceIntegrity,detectCurrentContradictions,executionStability,evidenceChainExplanation,stage16CorrectionPlan,operationalNextAction,operationalMetrics,gate,deriveStageData,recalculate,invalidateDownstream,applicationInitialFields,'
          export_new='releaseVerificationTrust,evaluateResultConsistency,effectiveDetermination,validateTraceIntegrity,detectCurrentContradictions,executionStability,evidenceChainExplanation,stage16CorrectionPlan,operationalNextAction,operationalMetrics,migrateLegacyStage01Accounting,gate,deriveStageData,recalculate,invalidateDownstream,applicationInitialFields,'
          if export_anchor not in s: raise SystemExit('engine export anchor missing')
          p.write_text(s.replace(export_anchor,export_new,1))
          p=Path('project-store.js');s=p.read_text()
          old='for(const source of legacy){const project=core.migrateState(clone(source));engine.ensureShape(project);engine.recalculate(project);assertProjectIntegrity(project,{verifyDerived:true});'
          new='for(const source of legacy){const project=core.migrateState(clone(source));engine.ensureShape(project);if(typeof engine.migrateLegacyStage01Accounting===\'function\')engine.migrateLegacyStage01Accounting(project);engine.recalculate(project);assertProjectIntegrity(project,{verifyDerived:true});'
          if old not in s: raise SystemExit('store migration anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/browser-proof-once.yml
      - name: Prove migration, accounting, prompts, and full non-browser suite
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-v3-migration.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-single-supply-prompts.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Browser acceptance at required widths
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only proven permanent changes
        run: |
          git config user.name closed-loop-integrator
          git config user.email closed-loop-integrator@users.noreply.github.com
          git add -A
          git commit -m 'Preserve legacy Stage 01 intent in v3 accounting without resupply'
          git push origin HEAD:implementation/closed-loop-v3
