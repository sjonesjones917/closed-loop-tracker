name: Locate Stage 01 migration implementation once
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths: [.github/workflows/browser-proof-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate accounting and migration code
        run: |
          grep -n "INPUT_SET_CONTENTS\|intakeCoverageManifest\|buildIntake\|migrate" workflow-engine.js project-store.js workflow-schema.js | head -200
