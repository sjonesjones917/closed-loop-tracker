name: Materialize adjudication closure
on:
  push:
    branches: [semantic-adjudication-20260827]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[adjudication-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize exact proven runtime
        run: |
          node semantic-fixup.mjs
          node verification-trust-fixup.mjs
          node regression-adjudication-fixup.mjs
          node trace-adjudication-fixup.mjs
          node result-adapter-fixup.mjs
          node release-trust-fixup.mjs
          node regression-consumer-fixup.mjs
          node browser-sync-fixup.mjs
          node build-test-project.mjs
      - name: Prove materialized tree before commit
        run: |
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check response-ingestion.js
          node --check verify-semantic-invariant.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify-semantic-invariant.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/materialize-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove one-time non-workflow machinery and commit proven source
        run: |
          git rm -f --ignore-unmatch \
            .contradiction-residual-repair.py \
            .fix-semantic-patcher.py \
            .semantic-adjudication-patch.py \
            .semantic-residual-repair.py \
            semantic-adjudication-patch.mjs \
            semantic-fixup.mjs \
            verification-trust-fixup.mjs \
            regression-adjudication-fixup.mjs \
            trace-adjudication-fixup.mjs \
            result-adapter-fixup.mjs \
            release-trust-fixup.mjs \
            regression-consumer-fixup.mjs \
            browser-sync-fixup.mjs \
            stage16-trace-fixup.mjs
          git add workflow-engine.js workflow-schema.js response-ingestion.js index.html verify-browser.mjs verify-semantic-invariant.mjs TEST_PROJECT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: application-owned adjudication closure [adjudication-materialized]'
          git push origin HEAD:semantic-adjudication-20260827
