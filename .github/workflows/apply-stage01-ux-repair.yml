name: Apply Stage 01 user-experience repair

on:
  push:
    branches:
      - fix/restore-stage01-user-experience-20260830

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-stage01-user-experience-20260830
          fetch-depth: 0
      - name: Correct repair-script YAML newline matching
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apply-stage01-ux-repair.mjs')
          source = path.read_text()
          marker = "replaceOnce(\n  '.github/workflows/pages.yml',"
          start = source.index(marker)
          path.write_text(source[:start] + source[start:].replace('\\\\n', '\\n'))
          PY
      - name: Apply exact repair
        id: apply
        continue-on-error: true
        run: |
          set +e
          node apply-stage01-ux-repair.mjs > repair.log 2>&1
          status=$?
          cat repair.log
          exit $status
      - name: Verify repaired runtime and regressions
        if: steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            node --check "$file"
          done
          node verify-stage01-user-experience.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
      - name: Commit verified repair and remove one-time files
        if: steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f apply-stage01-ux-repair.mjs .github/workflows/apply-stage01-ux-repair.yml repair.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Stage 01 conversation and fail-closed intake"
          git push origin HEAD:fix/restore-stage01-user-experience-20260830
      - name: Commit exact diagnostic on failure
        if: steps.apply.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair.log
          git commit -m "Record Stage 01 repair diagnostic"
          git push origin HEAD:fix/restore-stage01-user-experience-20260830
          exit 1
