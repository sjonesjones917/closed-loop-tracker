name: Reapply Test IR runtime fix
on:
  push:
    branches: [fix/test-ir-runtime-authority-20260830]
    paths: [.github/workflows/reapply-test-ir-runtime-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-ir-runtime-authority-20260830
          fetch-depth: 0
      - name: Apply the functional runtime diff onto current main
        run: |
          set -euo pipefail
          git diff 7d0975b2da0b4089e0863d19c331d3bcf60aad9f adceecdc721c98edf910aa60239749154b00dc50 -- workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js | git apply --3way --index
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          git diff --check --cached
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/reapply-test-ir-runtime-fix.yml
          git add workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js
          git commit -m 'Use Test IR runtime as native execution authority on current main'
          git push origin HEAD:fix/test-ir-runtime-authority-20260830
