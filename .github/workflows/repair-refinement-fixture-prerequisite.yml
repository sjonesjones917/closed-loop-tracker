name: Repair accepted-refinement prerequisite fixture

on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831

permissions:
  contents: write

concurrency:
  group: repair-refinement-fixture-prerequisite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct the Stage 02 refinement fixture prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-complete.mjs')
          text=path.read_text(encoding='utf-8')
          old="  const p=project('JOB-REFINEMENT-CANONICAL'),stage=2,source=record('sources',2,{TITLE:'Accepted source'},'SOURCE-REFINE');"
          new="  const p=project('JOB-REFINEMENT-CANONICAL'),stage=2,source=record('sources',2,{TITLE:'Accepted source'},'SOURCE-REFINE');const intake=engine.intakeCoverageManifest(p),capture={schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((unit,index)=>({sourceUnitId:unit.unitId,sourceRawValueSha256:unit.rawValueSha256,disposition:'retained as context',reason:'Accepted-refinement fixture preserves current human authority.',extractedStatements:[{statementKey:'REFINE-'+String(index+1),text:unit.rawValueText||unit.label||unit.unitId,statementClass:'CONTEXT'}]}))};p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Verify accepted response refinement.',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(capture)};engine.recalculate(p);assert(engine.evaluateIntakeAccounting(p).complete,'Accepted-refinement fixture failed to establish Stage 01 semantic accounting.');"
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'Expected one accepted-refinement fixture boundary; found {text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/repair-refinement-fixture-prerequisite.yml
      - name: Prove refinement reaches its intended acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check verify-complete.mjs
          set +e
          node verify-complete.mjs > /tmp/verify-complete.log 2>&1
          status=$?
          set -e
          cat /tmp/verify-complete.log
          if grep -Fq 'Stage 02 controlling instruction cannot be generated until Stage 01 is complete' /tmp/verify-complete.log; then
            echo 'The corrected accepted-refinement fixture still fails at Stage 01 prerequisite.' >&2
            exit 1
          fi
          if grep -Fq 'Accepted-refinement fixture failed to establish Stage 01 semantic accounting' /tmp/verify-complete.log; then
            echo 'The fixture did not establish real Stage 01 accounting.' >&2
            exit 1
          fi
          if grep -Fq 'Replacement prompt omitted accepted-result refinement reason' /tmp/verify-complete.log; then
            echo 'The fixture reached replacement prompting but the production refinement context failed.' >&2
            exit 1
          fi
          echo "verify-complete advanced beyond the accepted-refinement fixture with status ${status}."
      - name: Commit the accepted fixture correction and remove the runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-complete.mjs .github/workflows/repair-refinement-fixture-prerequisite.yml
          git diff --cached --check
          git commit -m 'Establish durable Stage 01 intake for accepted refinement fixture'
          git push origin HEAD:fix/zero-loss-controlled-20260831
