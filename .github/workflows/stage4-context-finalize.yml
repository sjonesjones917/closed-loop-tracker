name: Stage 4 context binding finalizer
on:
  push:
    branches:
      - fix/stage4-durable-intent-final-20260830
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-durable-intent-final-20260830
      - name: Add the missing context binding to the existing Stage 4 repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/repair-stage4-durable-intent.yml')
          s=p.read_text()
          old='''          s=s[:start]+"4:"+json.dumps(text)+","+s[end:]
          p.write_text(s)

          # 4. Do not display a generic Stage 04 upload panel that contradicts retained-input reuse.'''
          new='''          s=s[:start]+"4:"+json.dumps(text)+","+s[end:]
          old="contextManifest={stage,operation,scope,verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,readCollections:"
          new="contextManifest={stage,operation,scope,humanInputSha256:hash.sha256Value(Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,d])=>d?.producer==='HUMAN').map(([name])=>[name,state?.job?.[name]??null]))),verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,readCollections:"
          if old not in s: raise SystemExit('context manifest marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 4. Do not display a generic Stage 04 upload panel that contradicts retained-input reuse.'''
          if old not in s:
              raise SystemExit('Stage 4 repair insertion marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit only the one-line proof correction
        run: |
          rm -f .github/workflows/stage4-context-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/repair-stage4-durable-intent.yml .github/workflows/stage4-context-finalize.yml
          git commit -m 'Bind Stage 4 prompt identity to retained human input'
          git push origin HEAD:fix/stage4-durable-intent-final-20260830
