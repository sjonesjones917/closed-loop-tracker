name: One-time complete prompt context repair

on:
  push:
    branches: ["fix/all-stage-prompt-context-36"]
    paths:
      - ".github/workflows/one-time-complete-prompt-context.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/all-stage-prompt-context-36"
          fetch-depth: 0
      - name: Apply repair
        run: python3 repair_prompt_context.py
      - name: Commit repair
        run: |
          rm .github/workflows/one-time-complete-prompt-context.yml repair_prompt_context.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-engine.js index.html .github/workflows/one-time-complete-prompt-context.yml repair_prompt_context.py
          git commit -m "Complete all-stage prompt context and restore prompt surface"
          git push origin HEAD:fix/all-stage-prompt-context-36
