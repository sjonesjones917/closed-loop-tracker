name: One-time surgical engine repair
on:
  push:
    branches: [fix/restore-full-acceptance-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-full-acceptance-20260831
      - name: Replace exact broken execution-plan access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="plans=testExecutionPlan(project).filter(item=>String(item.requirementId||'')===reqId)"
          new="plans=testExecutionPlan(project).items.filter(item=>String(item.requirementId||'')===reqId)"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check workflow-engine.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js
          git commit -m "Fix Stage 07 execution plan access"
          git push origin HEAD:fix/restore-full-acceptance-20260831
