name: Materialize universal prompt prerequisite guard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-universal-prompt-prerequisite.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source repair branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='repair/universal-prompt-prerequisite-final'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          echo '' | base64 -d | python3
          git add -A
          git commit -m 'Enforce universal prompt prerequisites'
          git push origin HEAD:"$BRANCH" --force
