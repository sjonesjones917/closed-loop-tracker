name: Apply verification independence ownership
on:
  push:
    branches:
      - fix/verification-independence-owner-20260830
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source correction
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("workflow-schema.js"); s=p.read_text(); oa="      \"VERIFIER\",\n      \"VERIFIER_CONTEXT_ID\",\n      \"INDEPENDENCE_STATUS\",\n      \"INPUTS\","; na="      \"VERIFIER\",\n      \"VERIFIER_CONTEXT_ID\",\n      \"INPUTS\","; aa="      \"VERIFICATION_ID\",\n      \"REQ_ID\",\n      \"RUN_ID\",\n      \"TEST_ID\",\n      \"DEFECT_ID\"\n    ]\n  },\n  \"comparisons\":"; ab="      \"VERIFICATION_ID\",\n      \"REQ_ID\",\n      \"RUN_ID\",\n      \"TEST_ID\",\n      \"DEFECT_ID\",\n      \"INDEPENDENCE_STATUS\"\n    ]\n  },\n  \"comparisons\":"; assert oa in s or na in s; s=s.replace(oa,na,1); assert aa in s or ab in s; s=s.replace(aa,ab,1); p.write_text(s)'
          rm -f .github/workflows/apply-preflight-independence-ownership.yml
          rm -f .github/workflows/apply-verification-independence-owner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js .github/workflows
          git commit -m "Make verification independence application-owned"
          git push origin HEAD:fix/verification-independence-owner-20260830
