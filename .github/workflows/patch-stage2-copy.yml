name: Patch Stage 02 operator boundary

on:
  push:
    branches: [finish/live-human-gate-20260830]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Add the missing Stage 02 operator boundary without changing layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('workbook.js')
          text=path.read_text()
          old="'Identify every source that may control, inform, or prove correctness and establish the authority hierarchy.'"
          new="'Independent external sources only. Identify every source that may control, inform, or prove correctness and establish the authority hierarchy.'"
          if old not in text:
              raise SystemExit('Stage 02 result text target was not found')
          if new in text:
              raise SystemExit('Stage 02 result text is already repaired')
          path.write_text(text.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workbook.js
          git commit -m "Clarify Stage 02 independent-source boundary"
          git push origin HEAD:finish/live-human-gate-20260830
