name: Apply semantic scope repair
on:
  push:
    branches: [fix/semantic-registry-scope-closure-20260903]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-scope-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/semantic-registry-scope-closure-20260903
      - name: Apply exact scope repair and remove scaffolding
        run: |
          set -euo pipefail
          git apply --check .repair-semantic-scope.patch
          git apply .repair-semantic-scope.patch
          rm .repair-semantic-scope.patch .github/workflows/repair-semantic-scope.yml
          node --check workflow-schema.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { webcrypto } from 'node:crypto';
          const context={console,TextEncoder,TextDecoder,crypto:webcrypto,dispatchEvent(){},Event:function Event(type){this.type=type}};context.globalThis=context;vm.createContext(context);
          for(const file of ['workbook.js','hash.js','workflow-schema.js'])vm.runInContext(fs.readFileSync(file,'utf8'),context,{filename:file});
          const s=context.closedLoopWorkflowSchema;
          const checks={
            '25:FREEZE_DELIVERY_CANDIDATE':['deliveryCandidateSetId','TARGET_RESERVED'],
            '25:COMPLETE':['deliveryCandidateSetId','INPUT_CURRENT'],
            '19:CONFIRM_FREEZE':['confirmationIterationId','TARGET_RESERVED'],
            '19:CONFIRM':['confirmationIterationId','INPUT_CURRENT'],
            '27:CALCULATE_RELEASE':['reconciledReviewVersion','INPUT_CURRENT'],
            '28:VERIFY_IDENTITY':['releaseId','INPUT_CURRENT'],
            '29:CALCULATE_EVIDENCE_CHAINS':['hashReviewId','INPUT_CURRENT'],
            '30:CALCULATE_TERMINAL':['evidenceChainVersion','INPUT_CURRENT']
          };
          for(const [key,[dimension,expected]] of Object.entries(checks)){if(s.STAGE_OPERATION_SCOPE_MATRIX[key].dimensions[dimension]!==expected)throw new Error(`${key}.${dimension} mismatch`);const [stage,op]=key.split(':');if(s.operationContract(Number(stage),op)!==s.STAGE_OPERATION_REGISTRY[key])throw new Error(`${key} does not resolve through authoritative registry`);}
          NODE
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js .repair-semantic-scope.patch .github/workflows/repair-semantic-scope.yml
          git commit -m "Close operation-specific scope contracts [semantic-scope-repair-applied]"
          git push origin HEAD:fix/semantic-registry-scope-closure-20260903
