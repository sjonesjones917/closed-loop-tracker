name: Apply semantic scope repair
on:
  push:
    branches: [fix/semantic-registry-scope-closure-20260903]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-scope-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/semantic-registry-scope-closure-20260903
      - name: Apply exact scope repair and remove scaffolding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('workflow-schema.js')
          text=path.read_text()
          replacement="""const TARGET_DIMENSIONS_BY_OPERATION=Object.freeze({
            '2:COMPLETE':Object.freeze(['sourceSetVersion']),
            '2:RECONCILE_SOURCE_SEARCH':Object.freeze(['sourceSetVersion']),
            '3:COMPLETE':Object.freeze(['researchVersion']),
            '3:RECONCILE_RESEARCH':Object.freeze(['researchVersion']),
            '4:COMPLETE':Object.freeze(['requirementsVersion']),
            '4:RECONCILE_REQUIREMENTS':Object.freeze(['requirementsVersion']),
            '5:COMPLETE':Object.freeze(['requirementsVersion']),
            '5:RECONCILE_REQUIREMENT_SET':Object.freeze(['requirementsVersion']),
            '6:COMPLETE':Object.freeze(['testSuiteVersion']),
            '6:RECONCILE_VERIFICATION_SUITE':Object.freeze(['testSuiteVersion']),
            '8:COMPLETE':Object.freeze(['instructionVersion']),
            '10:FREEZE':Object.freeze(['iterationId','candidateId']),
            '11:EXECUTE_RUN':Object.freeze(['runId']),
            '17:FREEZE':Object.freeze(['iterationId','candidateId']),
            '19:CONFIRM_FREEZE':Object.freeze(['confirmationIterationId']),
            '20:FREEZE_BASELINE':Object.freeze(['baselineId']),
            '21:COMPLETE':Object.freeze(['productId']),
            '25:FREEZE_DELIVERY_CANDIDATE':Object.freeze(['deliveryCandidateSetId']),
            '26:COMPLETE':Object.freeze(['reviewVersion'])
          });
          const STAGE_OPERATION_SCOPE_MATRIX=Object.freeze(Object.fromEntries(Object.entries(s0.STAGE_OPERATIONS).flatMap(([stageText,operations])=>{const stage=Number(stageText);return operations.map(operation=>{const targets=new Set(TARGET_DIMENSIONS_BY_OPERATION[`${stage}:${operation}`]||[]);const dimensions=Object.fromEntries((EXACT_SCOPE_DIMENSIONS[stage]||[]).map(name=>[name,targets.has(name)?'TARGET_RESERVED':'INPUT_CURRENT']));return [`${stage}:${operation}`,Object.freeze({stage,operation,requiredDimensions:Object.freeze([...(EXACT_SCOPE_DIMENSIONS[stage]||[])]),dimensions:Object.freeze(dimensions),prohibitedExtraDimensions:true})];});})));
          """
          pattern=r"const TARGET_DIMENSIONS_BY_STAGE=.*?\nconst STAGE_OPERATION_SCOPE_MATRIX=.*?\n"
          text,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'target-dimension replacement count={count}')
          marker="\n\nconst FIELD_REGISTRY_ENTRIES={};"
          if text.count(marker)!=1: raise SystemExit(f'operation-registry marker count={text.count(marker)}')
          text=text.replace(marker,"\nfunction registeredOperationContract(stage,operation){return STAGE_OPERATION_REGISTRY[`${Number(stage)}:${String(operation||'')}`]||null;}"+marker,1)
          old='operationContract:amendedOperationContract,FIELD_REGISTRY'
          if text.count(old)!=1: raise SystemExit(f'operationContract replacement count={text.count(old)}')
          text=text.replace(old,'operationContract:registeredOperationContract,FIELD_REGISTRY',1)
          old='VERIFICATION_PHASE_VALUES,EXACT_SCOPE_DIMENSIONS,allowedCollections'
          if text.count(old)!=1: raise SystemExit(f'export replacement count={text.count(old)}')
          text=text.replace(old,'VERIFICATION_PHASE_VALUES,EXACT_SCOPE_DIMENSIONS,TARGET_DIMENSIONS_BY_OPERATION,allowedCollections',1)
          path.write_text(text)
          PY
          rm .repair-semantic-scope.patch .github/workflows/repair-semantic-scope.yml
          node --check workflow-schema.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { webcrypto } from 'node:crypto';
          const context={console,TextEncoder,TextDecoder,crypto:webcrypto,dispatchEvent(){},Event:function Event(type){this.type=type}};context.globalThis=context;vm.createContext(context);
          for(const file of ['workbook.js','hash.js','workflow-schema.js'])vm.runInContext(fs.readFileSync(file,'utf8'),context,{filename:file});
          const s=context.closedLoopWorkflowSchema;
          const checks={
            '25:FREEZE_DELIVERY_CANDIDATE':['deliveryCandidateSetId','TARGET_RESERVED'],
            '25:COMPLETE':['deliveryCandidateSetId','INPUT_CURRENT'],
            '19:CONFIRM_FREEZE':['confirmationIterationId','TARGET_RESERVED'],
            '19:CONFIRM':['confirmationIterationId','INPUT_CURRENT'],
            '27:CALCULATE_RELEASE':['reconciledReviewVersion','INPUT_CURRENT'],
            '28:VERIFY_IDENTITY':['releaseId','INPUT_CURRENT'],
            '29:CALCULATE_EVIDENCE_CHAINS':['hashReviewId','INPUT_CURRENT'],
            '30:CALCULATE_TERMINAL':['evidenceChainVersion','INPUT_CURRENT']
          };
          for(const [key,[dimension,expected]] of Object.entries(checks)){if(s.STAGE_OPERATION_SCOPE_MATRIX[key].dimensions[dimension]!==expected)throw new Error(`${key}.${dimension} mismatch`);const [stage,op]=key.split(':');if(s.operationContract(Number(stage),op)!==s.STAGE_OPERATION_REGISTRY[key])throw new Error(`${key} does not resolve through authoritative registry`);}
          NODE
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js .repair-semantic-scope.patch .github/workflows/repair-semantic-scope.yml
          git commit -m "Close operation-specific scope contracts [semantic-scope-repair-applied]"
          git push origin HEAD:fix/semantic-registry-scope-closure-20260903
