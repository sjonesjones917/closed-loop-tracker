name: Stage 01 regenerate current governance

on:
  push:
    branches: [controller/stage01-current-spec-main755e]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate exact governance and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=6961725fb4a9899d4bcdecad650c55e76a63abbb node generate-specification-governance.mjs
          node <<'NODE'
          const fs=require('fs'); const crypto=require('crypto');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const proofPath='verification/build-stages/stage-01-proof.json';
          const ledgerPath='verification/closed-loop-build-state.json';
          const proof=JSON.parse(fs.readFileSync(proofPath,'utf8'));
          proof.startingMainCommit='755e9c6c15acb23f80606fc286a38b63b7b0654f';
          proof.endingMainCommit='6961725fb4a9899d4bcdecad650c55e76a63abbb';
          proof.implementationCommitIds=['6961725fb4a9899d4bcdecad650c55e76a63abbb'];
          proof.proofCommands[0].command='SOURCE_COMMIT=6961725fb4a9899d4bcdecad650c55e76a63abbb node generate-specification-governance.mjs';
          proof.proofCommands[3].command='GitHub pull-request test workflow on the exact Stage 01 current-spec branch head';
          for (const rec of proof.proofArtifactDigests) { rec.sha256=sha(rec.path); if(rec.path.endsWith('specification.txt')) rec.byteLength=fs.statSync(rec.path).size; }
          fs.writeFileSync(proofPath,JSON.stringify(proof,null,2)+'\n');
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          ledger.specificationSourceCommit='6961725fb4a9899d4bcdecad650c55e76a63abbb';
          ledger.lastObservedMainCommit='6961725fb4a9899d4bcdecad650c55e76a63abbb';
          ledger.stages['01'].provenCommit='6961725fb4a9899d4bcdecad650c55e76a63abbb';
          ledger.stages['01'].proofDigest=sha(proofPath);
          ledger.lastUpdatedByCommandId='STAGE01-CURRENT-SPEC-6961725F';
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');
          NODE
          node verify-specification-governance.mjs
          node verify-build-stage-ledger.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage01-regenerate-governance.yml
          git add specification/closed-loop-specification-manifest.json specification/closed-loop-normative-requirements.json verification/build-stages/stage-01-proof.json verification/closed-loop-build-state.json
          git commit -m 'Stage 01: regenerate governance from audited source commit'
          git push origin HEAD:controller/stage01-current-spec-main755e
