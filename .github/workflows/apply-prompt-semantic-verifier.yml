name: Apply prompt semantic verifier
on:
  push:
    branches: [spec-v3-zero-loss-20260830]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spec-v3-zero-loss-20260830}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply verifier correction
        run: |
          node repair-prompt-semantics-subject-neutral.mjs
          node --check verify-prompt-semantics.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f repair-prompt-semantics-subject-neutral.mjs
          git add verify-prompt-semantics.mjs
          git commit -m "Test Stage 1 prompt behavior without domain branches"
          git push origin HEAD:spec-v3-zero-loss-20260830