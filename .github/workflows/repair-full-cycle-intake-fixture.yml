name: Repair full-cycle intake fixture and self-remove
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run one-time full-cycle intake fixture repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - name: Bind full-cycle Stage 01 capture to current manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs')
          t=p.read_text()
          old="function completeStage1InputSetContents(){const intake=prompts.buildPromptRecord(1,p).contextManifest.intakeCoverageManifest;return JSON.stringify({units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,disposition:'incorporated into the job definition',extractedStatements:[{statementKey:'S'+String(i+1),text:'Captured '+u.label,statementClass:i===0?'REQUIREMENT':'FACT'}]}))});}"
          new="function completeStage1InputSetContents(){const intake=prompts.buildPromptRecord(1,p).contextManifest.intakeCoverageManifest;return JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'Preserved for downstream reuse.',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||('Captured '+u.label),statementClass:i===0?'REQUIREMENT':'FACT'}]}))});}"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('verify-full-cycle intake fixture anchor not found')
          p.write_text(t)
          PY
          node --check verify-full-cycle.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-full-cycle.mjs
          git rm .github/workflows/repair-full-cycle-intake-fixture.yml
          git commit -m "Bind the full-cycle intake fixture to the current manifest"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
