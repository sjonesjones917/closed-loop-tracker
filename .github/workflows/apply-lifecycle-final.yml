name: Apply exact lifecycle reliability delta
on:
  push:
    branches: [reliability/project-lifecycle-final-20260828]
    paths: ['.github/workflows/apply-lifecycle-final.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply verified responsible-layer delta
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lifecycle-final.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          tr -d '[:space:]' < /tmp/lifecycle-final.patch.gz.b64 > /tmp/lifecycle-final.clean.b64
          echo 'ad30e417dc64f71e1a7d20ba51b743aff9e143c7b9ea2504f21fa814287ac2ed  /tmp/lifecycle-final.clean.b64' | sha256sum -c -
          base64 -d /tmp/lifecycle-final.clean.b64 > /tmp/lifecycle-final.patch.gz
          echo '481d69e56b495db0d5dde95c3d49f315ea5433e798a1d6ea6bdbce0e2107f089  /tmp/lifecycle-final.patch.gz' | sha256sum -c -
          gzip -dc /tmp/lifecycle-final.patch.gz > /tmp/lifecycle-final.patch
          echo '142a483dc6ea4b85202d0d22f723018584e7302423199ff0c60cef02550351f3  /tmp/lifecycle-final.patch' | sha256sum -c -
          git apply --check /tmp/lifecycle-final.patch
          git apply /tmp/lifecycle-final.patch
          node --check app-core.js
          node --check project-store.js
          node --check response-ingestion.js
          node --check workflow-engine.js
          node --check verify-browser.mjs
          node verify-hash.mjs
          node verify-semantic-invariant.mjs
      - name: Commit clean lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-lifecycle-final.yml
          git config user.name 'closed-loop reliability automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app-core.js project-store.js response-ingestion.js workflow-engine.js index.html verify-browser.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'Add rigorous low-stimulus project lifecycle controls'
          git push origin HEAD:reliability/project-lifecycle-final-20260828
