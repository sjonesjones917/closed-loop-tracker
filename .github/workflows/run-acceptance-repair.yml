name: Run acceptance contract repair
on:
  push:
    branches:
      - fix/final-controlling-v3-20260830
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-controlling-v3-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 repair-acceptance.py
      - run: node --check verify-prompt-semantics.mjs
      - run: node verify-prompt-semantics.mjs
      - run: node verify-intake-obligation-accounting.mjs
      - run: node verify-ingestion.mjs
      - name: Commit acceptance repair
        run: |
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-prompt-semantics.mjs .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "Align prompt acceptance with subject-neutral intake contract"
          git push origin HEAD:fix/final-controlling-v3-20260830
