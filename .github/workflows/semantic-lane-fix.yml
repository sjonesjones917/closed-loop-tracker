name: Execution-lane prompt semantic fix
on:
  push:
    branches: [fix/execution-lane-prompt-semantics-20260826]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/execution-lane-prompt-semantics-20260826, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal semantic correction
        run: python3 .semantic-lane-fix.py
      - name: Deterministic verification
        run: |
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Chromium verification
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit verified permanent correction
        run: |
          rm -f .semantic-lane-fix.py .github/workflows/semantic-lane-fix.yml
          git config user.name "closed-loop semantic verifier"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-engine.js verify-prompt-semantics.mjs index.html .semantic-lane-fix.py .github/workflows/semantic-lane-fix.yml
          git commit -m "Make run-scoped prompts operation-exact"
          git push origin HEAD:fix/execution-lane-prompt-semantics-20260826
