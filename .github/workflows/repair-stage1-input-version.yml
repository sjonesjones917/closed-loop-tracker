name: Repair Stage 01 input-version ownership and self-remove
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run one-time Stage 01 input-version ownership repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - name: Keep User Job Input version human-input owned
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine=Path('workflow-engine.js')
          t=engine.read_text()
          old="const VERSION_BY_STAGE=Object.freeze({\n  1:['CURRENT_INPUT_VERSION','INPUT'],2:['CURRENT_SOURCE_SET_VERSION','SOURCE-SET'],3:['CURRENT_RESEARCH_VERSION','RESEARCH'],"
          new="// CURRENT_INPUT_VERSION is versioned only by application-controlled human-input mutation paths.\n// Accepting the Stage 01 agent interpretation must not create a new User Job Input version,\n// otherwise the accepted intake manifest instantly becomes stale and the user is asked to repeat information.\nconst VERSION_BY_STAGE=Object.freeze({\n  2:['CURRENT_SOURCE_SET_VERSION','SOURCE-SET'],3:['CURRENT_RESEARCH_VERSION','RESEARCH'],"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('VERSION_BY_STAGE Stage 01 anchor not found')
          engine.write_text(t)

          test=Path('verify-one-time-intent-intake.mjs')
          t=test.read_text()
          anchor="assert(!engine.evaluateIntakeAccounting(project,{capture:JSON.stringify(incompleteCapture)}).complete,'Stage 01 accepted an intake capture that forgot supplied project information.');"
          addition=anchor+"\nconst inputVersionBeforeStage1Acceptance=project.job.CURRENT_INPUT_VERSION;\nassert(engine.registerStageVersion(project,1,'CHANGE-STAGE1-INTERPRETATION')===null,'Stage 01 agent acceptance created a second input-version artifact.');\nassert(project.job.CURRENT_INPUT_VERSION===inputVersionBeforeStage1Acceptance,'Stage 01 agent acceptance changed the User Job Input version and invalidated the one-time intake capture.');"
          if addition not in t:
              if anchor not in t: raise SystemExit('one-time intent input-version regression anchor not found')
              t=t.replace(anchor,addition,1)
          test.write_text(t)
          PY
          node --check workflow-engine.js
          node --check verify-one-time-intent-intake.mjs
          node verify-one-time-intent-intake.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-engine.js verify-one-time-intent-intake.mjs
          git rm .github/workflows/repair-stage1-input-version.yml
          git commit -m "Keep Stage 01 acceptance bound to the existing User Job Input version"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
