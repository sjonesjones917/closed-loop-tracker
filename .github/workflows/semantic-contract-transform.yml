name: Semantic contract transform
on:
  push:
    branches: [reliability/semantic-contract-hardening-20260826]
permissions:
  contents: write
jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/semantic-contract-hardening-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1))

          def rewrite_const_json(path, name, mutate):
              p=Path(path); text=p.read_text(); pattern=rf'const {re.escape(name)}=Object\.freeze\((\{{.*?\}})\);'; match=re.search(pattern,text,re.S)
              if not match: raise SystemExit(f'{path}: generated JSON constant {name} not found')
              data=json.loads(match.group(1)); mutate(data); rendered=json.dumps(data,indent=2)
              p.write_text(text[:match.start(1)]+rendered+text[match.end(1):])

          def ownership(o): o['regressions']['agent'].remove('CORRECTION')
          rewrite_const_json('workflow-schema.js','RECORD_OWNERSHIP',ownership)
          replace_once('workflow-schema.js',"    'PRE_CORRECTION_EVIDENCE','CORRECTION','POST_CORRECTION_RESULT','POST_CORRECTION_EVIDENCE','PERMANENT_TEST_LOCATION','APPLICABILITY','ACTIVE_RETIRED_STATE','RETIREMENT_AUTHORITY'","    'PRE_CORRECTION_EVIDENCE','POST_CORRECTION_RESULT','POST_CORRECTION_EVIDENCE','PERMANENT_TEST_LOCATION','APPLICABILITY','ACTIVE_RETIRED_STATE','RETIREMENT_AUTHORITY'")
          replace_once('workflow-schema.js',"required:['FAILURE_FIXTURE','REPRODUCTION_PROCEDURE','DETECTION_METHOD','PRE_CORRECTION_RESULT','PRE_CORRECTION_EVIDENCE','CORRECTION','PERMANENT_TEST_LOCATION','APPLICABILITY','ACTIVE_RETIRED_STATE']","required:['FAILURE_FIXTURE','REPRODUCTION_PROCEDURE','DETECTION_METHOD','PRE_CORRECTION_RESULT','PRE_CORRECTION_EVIDENCE','PERMANENT_TEST_LOCATION','APPLICABILITY','ACTIVE_RETIRED_STATE']")
          replace_once('prompt-engine.js','Define the expected post-correction result. The application assigns REG_ID and lifecycle state.','The linked permanent test expected result defines post-correction success. The application assigns REG_ID and lifecycle state.')

          def record_types(t):
              chain=t['CHAIN']
              for key,vt in {'TEST_ID':'REFERENCE_ARRAY','TEST_RESULT_ID':'STRING_ARRAY','EVIDENCE_ID':'STRING_ARRAY','ARTIFACT_HASH_IDENTITY':'REFERENCE_ARRAY'}.items(): chain[key]['valueType']=vt
          rewrite_const_json('workflow-schema.js','EXPLICIT_RECORD_FIELD_TYPES',record_types)

          old=re.search(r"const OPERATION_CONTRACT_OVERRIDES=Object\.freeze\(\{.*?\}\);\nfunction operationContract",Path('workflow-schema.js').read_text(),re.S)
          if not old: raise SystemExit('operation override block not found')
          new="""const OPERATION_CONTRACT_OVERRIDES=Object.freeze({
            17:Object.freeze({
              FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions'],agentWritableCollections:[],agentStageFields:['NEW_FROZEN_VERSIONS']}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],agentStageFields:['OLD_CONVERSATIONS_CONTINUED','RUN_NAMESPACE','IDENTICAL_PACKAGE_CONFIRMED_FOR_ALL_RUNS','PRIOR_OUTPUTS_WITHHELD','EXECUTE_COMPLETED']}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],agentStageFields:['VERIFY_COMPLETED']}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],agentStageFields:['COMPARE_COMPLETED']}),
              ROOT_CAUSE:Object.freeze({readCollections:['defects','comparisons','verification'],agentWritableCollections:['defects','rootCauses'],agentStageFields:['ROOT_CAUSE_COMPLETED']}),
              REGRESSION:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions'],agentWritableCollections:['regressions','regressionExecutions'],agentStageFields:['REGRESSION_TESTS_ADDED']}),
              CORRECT:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions','changes'],agentWritableCollections:['changes'],agentStageFields:['CORRECTIONS_COMPLETED']})
            }),
            19:Object.freeze({
              CONFIRM_FREEZE:Object.freeze({readCollections:['convergenceRecords','candidateFreezes','iterations'],agentWritableCollections:[],agentStageFields:[]}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],agentStageFields:[]}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],agentStageFields:['COMPLETE_TEST_SUITE_RUN']}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],agentStageFields:['CROSS_RUN_COMPARISON_COMPLETED','NEW_CORRECTNESS_AFFECTING_VARIANCE']}),
              REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs'],agentWritableCollections:['regressionExecutions'],agentStageFields:['INJECTED_DEFECTS_NOT_DETECTED']}),
              CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','regressionExecutions','candidateFreezes'],agentWritableCollections:['confirmationRecords'],agentStageFields:['NEW_CRITICAL_DEFECTS','NEW_MAJOR_DEFECTS','NEW_REQUIREMENTS_DISCOVERED','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED','REQUIRED_RETURN_STAGE']})
            }),
            21:Object.freeze({COMPLETE:Object.freeze({readCollections:['baselines','freshContexts'],agentWritableCollections:['products']})})
          });
          function operationContract"""
          s=Path('workflow-schema.js').read_text(); Path('workflow-schema.js').write_text(s[:old.start()]+new+s[old.end():])
          replace_once('workflow-schema.js','applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(scopeRequirements)','applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),agentStageFields:Object.freeze(override.agentStageFields||allowedAgentStageFields(stage)),scopeRequirements:Object.freeze(scopeRequirements)')

          replace_once('response-ingestion.js','const allowedStageData=new Set(contract?.allowedStageData||[]);','const allowedStageData=new Set(operationContract?.agentStageFields||contract?.allowedStageData||[]);')
          replace_once('prompt-engine.js','const stageData=Object.fromEntries(contract.allowedStageData.map(name=>[name,responseFieldContract(schema.STAGE_FIELDS[stage][name])]));','const agentStageFields=op?.agentStageFields||contract.allowedStageData;\n const stageData=Object.fromEntries(agentStageFields.map(name=>[name,responseFieldContract(schema.STAGE_FIELDS[stage][name])]));')
          replace_once('prompt-engine.js','agentStageFields:[...contract.allowedStageData],agentWritableCollections:[...writable]','agentStageFields:[...agentStageFields],agentWritableCollections:[...writable]')
          replace_once('prompt-engine.js',"const fields=contract.allowedStageData.length?contract.allowedStageData.map(x=>{const d=schema.STAGE_FIELDS[stage][x];return `- ${x}: ${d.valueType}${d.enumValues?.length?` enum(${d.enumValues.join(' | ')})`:''}${d.nullable?' nullable':''}`;}).join('\\n'):'- No agent-owned stageData fields; use permitted records/evidence only.';","const agentStageFields=op?.agentStageFields||contract.allowedStageData;\n const fields=agentStageFields.length?agentStageFields.map(x=>{const d=schema.STAGE_FIELDS[stage][x];return `- ${x}: ${d.valueType}${d.enumValues?.length?` enum(${d.enumValues.join(' | ')})`:''}${d.nullable?' nullable':''}`;}).join('\\n'):'- No agent-owned stageData fields; use permitted records/evidence only.';")

          replace_once('response-ingestion.js','const allowedStageData=new Set(operationContract?.agentStageFields||contract?.allowedStageData||[]);','const allowedStageData=new Set(operationContract?.agentStageFields||contract?.allowedStageData||[]);')

          replace_once('workflow-engine.js',"requiredOps=stage===17?['FREEZE','EXECUTE_RUN','VERIFY','COMPARE','ROOT_CAUSE','REGRESSION','CORRECT']:stage===19?['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:[]","requiredOps=stage===17?['FREEZE','EXECUTE_RUN','VERIFY','COMPARE','ROOT_CAUSE','REGRESSION','CORRECT']:stage===19?['EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:[]")

          replace_once('verify-ingestion.mjs',"  const contract=schema.STAGE_CONTRACTS[stage];\n  const stageData={};\n  if(contract.allowedStageData.length)stageData[contract.allowedStageData[0]]=safeValue(contract.allowedStageData[0]);","  const contract=schema.STAGE_CONTRACTS[stage];\n  const operationContract=schema.operationContract(stage,promptRecord.operation);\n  const agentStageFields=operationContract?.agentStageFields||contract.allowedStageData;\n  const writableCollections=operationContract?.agentWritableCollections||contract.allowedCollections;\n  const stageData={};\n  if(agentStageFields.length)stageData[agentStageFields[0]]=safeValue(agentStageFields[0]);")
          replace_once('verify-ingestion.mjs',"    const collection=contract.allowedCollections.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||contract.allowedCollections.find(name=>schema.recordAgentFields(name).length);","    const collection=writableCollections.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||writableCollections.find(name=>schema.recordAgentFields(name).length);")

          replace_once('verify-full-cycle.mjs',"function data(stage,{operation,stageData={},records={},scope={}}={}){const pr=prompt(stage,operation,scope);if(!Object.keys(stageData).length&&!Object.keys(records).length){const f=schema.STAGE_CONTRACTS[stage].allowedStageData[0];if(f)stageData[f]=schema.STAGE_FIELDS[stage][f].valueType==='BOOLEAN'?true:`fixture-${f.toLowerCase()}`;}","function data(stage,{operation,stageData={},records={},scope={}}={}){const pr=prompt(stage,operation,scope);if(!Object.keys(stageData).length&&!Object.keys(records).length){const f=(schema.operationContract(stage,pr.operation)?.agentStageFields||schema.STAGE_CONTRACTS[stage].allowedStageData)[0];if(f)stageData[f]=schema.STAGE_FIELDS[stage][f].valueType==='BOOLEAN'?true:`fixture-${f.toLowerCase()}`;}")
          replace_once('verify-full-cycle.mjs',"PRE_CORRECTION_EVIDENCE:'Failure evidence',CORRECTION:'Controlled correction',POST_CORRECTION_RESULT:'PENDING'","PRE_CORRECTION_EVIDENCE:'Failure evidence',POST_CORRECTION_RESULT:'PENDING'")
          replace_once('verify-full-cycle.mjs',"data(17,{operation:'FREEZE',stageData:{NEW_FROZEN_VERSIONS:'CURRENT',OLD_CONVERSATIONS_CONTINUED:'FALSE'}});","data(17,{operation:'FREEZE',stageData:{NEW_FROZEN_VERSIONS:'CURRENT'}});")
          replace_once('verify-full-cycle.mjs',"data(19,{operation:'CONFIRM_FREEZE',stageData:{COMPLETE_TEST_SUITE_RUN:'PENDING'}});","")

          replace_once('app-core.js','<div class="field"><label>Select exact files</label><input id="stage-files" type="file" multiple${locked?\' disabled\':\'\'}></div>','<div class="field"><label>${n===21&&!engine.currentScope(current).productId?\'Reserve product execution before adding finished-product files\':\'Select exact files\'}</label><input id="stage-files" type="file" multiple${locked||(n===21&&!engine.currentScope(current).productId)?\' disabled\':\'\'}></div>')
          replace_once('app-core.js',"if($('#copy-prompt'))$('#copy-prompt').onclick=async()=>{const record=await savePromptRecord(current.activeStage);await navigator.clipboard?.writeText(record.prompt);announce('instruction saved and copied');};","if($('#copy-prompt'))$('#copy-prompt').onclick=async()=>{const record=await savePromptRecord(current.activeStage);try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard API unavailable.');await navigator.clipboard.writeText(record.prompt);announce('instruction saved and copied');}catch(error){announce('instruction saved; clipboard copy unavailable');alert(`Instruction saved, but automatic clipboard copy failed. Copy it from the generated instruction panel. ${error.message||error}`);}};")

          p=Path('verify-complete.mjs'); text=p.read_text(); marker='console.log(JSON.stringify({finalRequirementRegression:true'
          if marker not in text: raise SystemExit('verify-complete marker missing')
          proof="""
          // Contract hardening: array cardinality, Stage 15 chronology, operation stageData isolation, and product artifact authority.
          {
            const chain=schema.RECORD_SCHEMAS.evidenceChains.fieldDefinitions;
            assert(chain.TEST_ID.valueType==='REFERENCE_ARRAY'&&chain.TEST_RESULT_ID.valueType==='STRING_ARRAY'&&chain.EVIDENCE_ID.valueType==='STRING_ARRAY'&&chain.ARTIFACT_HASH_IDENTITY.valueType==='REFERENCE_ARRAY','Evidence-chain multi-edge fields are not array typed.');
            assert(!schema.RECORD_SCHEMAS.regressions.fieldDefinitions.CORRECTION,'Stage 15 regression schema still requires a correction before Stage 16.');
            assert(!schema.operationContract(17,'EXECUTE_RUN').agentStageFields.includes('REGRESSION_TESTS_ADDED'),'Stage 17 EXECUTE_RUN can assert later regression stageData.');
            assert(schema.operationContract(17,'REGRESSION').agentStageFields.includes('REGRESSION_TESTS_ADDED'),'Stage 17 REGRESSION lost its own stageData field.');
            assert(!schema.operationContract(21,'COMPLETE').agentWritableCollections.includes('artifacts'),'Stage 21 agent can fabricate canonical artifact records instead of using verified bytes.');
            const p=project('JOB-OP-STAGE-DATA'),stage=17,pr=prompts.buildPromptRecord(stage,p,{operation:'EXECUTE_RUN'});
            const e={schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage,operation:'EXECUTE_RUN',promptIdentity:{instructionId:pr.instructionId,bodySha256:pr.bodySha256,contractSha256:pr.contractSha256,contextSignature:pr.contextSignature},scope:pr.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{REGRESSION_TESTS_ADDED:'YES'},records:{},evidence:[{temporaryKey:'evidence-op',kind:'WORKFLOW_EVIDENCE',description:'Operation-field isolation proof',location:'synthetic test',content:'controlled'}],unresolved:[],warnings:[],attachments:[]};
            const v=ingestion.validateEnvelope(p,e,{stage,promptRecord:pr,rawSha256:'operation-stage-data-proof'});
            assert(!v.valid&&v.issues.some(x=>x.code==='FIELD_OWNERSHIP_VIOLATION'&&x.path==='/stageData/REGRESSION_TESTS_ADDED'),'Operation-specific Stage 17 stageData leakage was accepted.');
          }

          """
          p.write_text(text.replace(marker,proof+marker,1))

          idx=Path('index.html'); html=idx.read_text(); html,n=re.subn(r'(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+("\s*></script>)',r'\g<1>20260826-contract2\2',html)
          if n!=8: raise SystemExit(f'expected 8 runtime script token replacements, got {n}')
          idx.write_text(html)
          PY
      - name: Regenerate fixture and verify transformed source
        run: |
          node build-test-project.mjs
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit exact transformed branch and remove transformer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/semantic-contract-transform.yml .semantic-transform-trigger
          git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs TEST_PROJECT.json index.html
          git commit -m "Harden operation and evidence contracts"
          git push origin HEAD:reliability/semantic-contract-hardening-20260826
