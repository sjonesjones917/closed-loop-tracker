name: One-time minimal visual polish
on:
  push:
    branches: [reliability/minimal-visual-polish-20260826]
permissions:
  contents: write
jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability/minimal-visual-polish-20260826}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact one-file visual corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.brand h1{font-size:17px;line-height:1.15;margin:0}.brand p{font-size:10.5px;color:var(--muted);margin:3px 0 0;overflow-wrap:anywhere}.project-select label'
          new='.brand h1{font-size:17px;line-height:1.15;margin:0}.brand p{font-size:10.5px;color:var(--muted);margin:3px 0 0;overflow-wrap:anywhere}.storage-status{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.35;overflow-wrap:anywhere}.project-select label'
          assert old in s
          s=s.replace(old,new,1)
          old='.record-value.empty{color:var(--muted);font-style:italic}.prompt{max-height:460px;overflow:auto;border:1px solid #d8ddd9;border-radius:9px;background:#f5f7f5;padding:9px;font:10.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.empty-state'
          new='.record-value.empty{color:var(--muted);font-style:italic}.prompt{height:clamp(260px,45vh,520px);max-height:80vh;resize:vertical;overflow:auto;border:1px solid #d8ddd9;border-radius:9px;background:#f5f7f5;padding:9px;font:10.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.empty-state'
          assert old in s
          s=s.replace(old,new,1)
          old='.stage-action-strip span{padding:3px 6px;border-radius:999px;background:#f0f3f1}.stage-jumpbar'
          new='.stage-action-strip span{padding:3px 6px;border-radius:999px;background:#f0f3f1;max-width:100%;white-space:normal}.stage-action-strip span:last-child{flex:1 1 260px}.stage-jumpbar'
          assert old in s
          s=s.replace(old,new,1)
          old='@media(max-width:620px){.header-main'
          new='@media(min-width:621px){.app-header{position:relative}.view-tabs{position:sticky;top:0}}\n@media(max-width:620px){.header-main'
          assert old in s
          s=s.replace(old,new,1)
          old='<div id="storage-status" class="brand p" role="status">Storage status loading…</div>'
          new='<div id="storage-status" class="storage-status" role="status">Storage status loading…</div>'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify visual invariants and complete application contracts
        run: |
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          if(!html.includes('class="storage-status"'))throw new Error('Storage status does not use its real visual class.');
          if(!html.includes('.prompt{height:clamp(260px,45vh,520px);max-height:80vh;resize:vertical'))throw new Error('Prompt inspection pane is not resizable.');
          if(!html.includes('@media(min-width:621px){.app-header{position:relative}.view-tabs{position:sticky;top:0}}'))throw new Error('Desktop sticky layers can still overlap.');
          if(!html.includes('.stage-action-strip span:last-child{flex:1 1 260px}'))throw new Error('Long next-action guidance has no sane wrapping lane.');
          NODE
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-polish-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove one-time machinery and commit verified source
        run: |
          rm .github/workflows/minimal-visual-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/minimal-visual-polish-once.yml
          git commit -m 'Refine visual inspection and navigation'
          git push origin HEAD:reliability/minimal-visual-polish-20260826
