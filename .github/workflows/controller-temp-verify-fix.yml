name: Controller temporary verify repair
on:
  push:
    branches:
      - controller3-prompt-byte-identity-rerun-20260904
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Repair stale prompt verifier and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="for(const token of [`JOB_ID: ${p.job.JOB_ID}`,'PROJECT-SCOPE BOUNDARY','STRICT RESPONSE CONTRACT','closed-loop-stage-response/3','PROMPT IDENTITY — ECHO EXACTLY'])if(!record.prompt.includes(token))throw new Error(`Stage ${stage} prompt missing ${token}.`);"
          new="for(const token of [`JOB_ID: ${p.job.JOB_ID}`,'PROJECT-SCOPE BOUNDARY','MANDATORY RESPONSE RULES','RESPONSE CONTRACT DEFINITIONS','closed-loop-stage-response/3'])if(!record.prompt.includes(token))throw new Error(`Stage ${stage} prompt missing ${token}.`);for(const forbidden of ['PROMPT IDENTITY — ECHO EXACTLY','END COPY BLOCK — STAGE','END HASHED INSTRUCTION BODY'])if(record.prompt.includes(forbidden))throw new Error(`Stage ${stage} prompt still contains digest-dependent or clipboard wrapper: ${forbidden}.`);"
          if old not in s:
              raise SystemExit('stale verifier target not found')
          p.write_text(s.replace(old,new))
          PY
          node verify.mjs
          rm .github/workflows/controller-temp-verify-fix.yml
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add verify.mjs .github/workflows/controller-temp-verify-fix.yml
          git commit -m "Repair prompt verifier for file-first identity"
          git push origin HEAD:controller3-prompt-byte-identity-rerun-20260904
