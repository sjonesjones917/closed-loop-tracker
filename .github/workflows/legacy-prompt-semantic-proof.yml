name: Exact legacy and prompt semantic proof
on:
  push:
    branches: [reliability/legacy-prompt-semantics-current-20260826]
permissions: {contents: write}
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply guarded responsible-layer edits
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          function replaceOne(path,from,to){let text=fs.readFileSync(path,'utf8');const count=text.split(from).length-1;if(count!==1)throw new Error(`${path}: expected exactly one guarded match, found ${count}`);text=text.replace(from,to);fs.writeFileSync(path,text);}
          replaceOne('prompt-engine.js',
            'If no legitimate external authority applies after evidence-supported inspection, return an explicit no-applicable-source determination rather than inventing a source.',
            'If no legitimate independent external source or evidence applies after evidence-supported inspection, return an explicit no-applicable-source determination rather than inventing a source.');
          replaceOne('prompt-engine.js',
            'Preflight this job’s production instruction in an independent context where required.',
            'Preflight this job’s production instruction in an independent context.');
          replaceOne('project-store.js',
            "function parseLegacy(storage=globalThis.localStorage){const out=[],seen=new Set();if(!storage)return out;for(const key of LEGACY_KEYS){let raw=null;try{raw=storage.getItem(key);}catch{}if(!raw)continue;try{const parsed=JSON.parse(raw);for(const item of Array.isArray(parsed)?parsed:[parsed]){if(!item||typeof item!=='object')continue;const id=projectIdentity(item)||hash.sha256Value(item);if(seen.has(id))continue;seen.add(id);out.push(item);}}catch{}}return out;}",
            "function parseLegacy(storage=globalThis.localStorage){const out=[],seen=new Set();if(!storage)return out;for(const key of LEGACY_KEYS){let raw=null;try{raw=storage.getItem(key);}catch{}if(!raw)continue;try{const parsed=JSON.parse(raw);for(const item of Array.isArray(parsed)?parsed:[parsed]){if(!item||typeof item!=='object')continue;const id=projectIdentity(item)||hash.sha256Value(item);if(seen.has(id))continue;seen.add(id);out.push(item);}}catch{}}return out;}\nfunction parseLegacyForMigration(storage=globalThis.localStorage){const out=[],seen=new Set();if(!storage)return out;for(const key of LEGACY_KEYS){let raw;try{raw=storage.getItem(key);}catch(error){throw storageError(`Legacy project storage ${key} could not be read; original data was preserved.`,'LEGACY_STORAGE_READ_FAILED');}if(!raw)continue;let parsed;try{parsed=JSON.parse(raw);}catch(error){throw storageError(`Legacy project storage ${key} is malformed; original data was preserved.`,'LEGACY_PROJECT_PARSE_FAILED');}for(const item of Array.isArray(parsed)?parsed:[parsed]){if(!item||typeof item!=='object'||Array.isArray(item))throw storageError(`Legacy project storage ${key} contains a non-project value; original data was preserved.`,'LEGACY_PROJECT_INVALID');const identity=projectIdentity(item)||hash.sha256Value(item);if(seen.has(identity))continue;seen.add(identity);out.push(item);}}return out;}\nfunction canonicalizeLegacyProject(source){const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine;if(!core?.migrateState||!engine?.ensureShape||!engine?.recalculate)throw storageError('Legacy migration runtime is incomplete; original data was preserved.','LEGACY_MIGRATION_RUNTIME_MISSING');const project=core.migrateState(clone(source));engine.ensureShape(project);engine.recalculate(project);if(!projectIdentity(project))throw storageError('Legacy project has no JOB_ID; original data was preserved.','LEGACY_PROJECT_ID_MISSING');assertProjectIntegrity(project);return project;}");
          replaceOne('project-store.js',
            "  const legacy=parseLegacy();if(!legacy.length){await metaPut('migrationStatus',{status:'NONE',at:now()});return {migrated:0};}",
            "  let legacy;try{legacy=parseLegacyForMigration();}catch(error){await metaPut('migrationStatus',{status:'FAILED',message:String(error.message||error),originalPreserved:true,at:now()});throw error;}if(!legacy.length){await metaPut('migrationStatus',{status:'NONE',at:now()});return {migrated:0};}");
          replaceOne('project-store.js',
            "  try{fault('before-legacy-migration');for(const source of legacy){const project=clone(source);const id=projectIdentity(project);if(!id)continue;const revision=Number(project.revision||0);tx.objectStore(PROJECTS).put({jobId:id,revision,project,projectSha256:projectSha256(project),updatedAt:now()});migrated++;}tx.objectStore(META).put({key:'migrationStatus',value:{status:'COMPLETE',migrated,at:now()},updatedAt:now()});fault('during-legacy-migration');await complete(tx);for(const key of LEGACY_KEYS)try{localStorage.removeItem(key);}catch{}return {migrated};}catch(error){try{tx.abort();}catch{}await metaPut('migrationStatus',{status:'FAILED',message:String(error.message||error),originalPreserved:true,at:now()});throw error;}",
            "  try{fault('before-legacy-migration');for(const source of legacy){const project=canonicalizeLegacyProject(source),id=projectIdentity(project),revision=Number(project.revision||0);tx.objectStore(PROJECTS).put({jobId:id,revision,project,projectSha256:projectSha256(project),updatedAt:now()});migrated++;}tx.objectStore(META).put({key:'migrationStatus',value:{status:'COMPLETE',migrated,at:now()},updatedAt:now()});fault('during-legacy-migration');await complete(tx);for(const key of LEGACY_KEYS)try{localStorage.removeItem(key);}catch{}return {migrated};}catch(error){try{tx.abort();}catch{}await metaPut('migrationStatus',{status:'FAILED',message:String(error.message||error),originalPreserved:true,at:now()});throw error;}");
          replaceOne('project-store.js',
            'validateProjectIntegrity,openDatabase,ready,readAll,writeAll,writeProject',
            'validateProjectIntegrity,canonicalizeLegacyProject,openDatabase,ready,readAll,writeAll,writeProject');
          replaceOne('verify-prompt-semantics.mjs',
            "    if(!record.prompt.includes('primary, official, controlling'))issues.push('SOURCE_QUALITY_RULE_MISSING');\n  }",
            "    if(!record.prompt.includes('primary, official, controlling'))issues.push('SOURCE_QUALITY_RULE_MISSING');\n    if(!record.prompt.includes('no legitimate independent external source or evidence applies'))issues.push('SOURCE_EVIDENCE_NO_SOURCE_RULE_MISSING');\n    if(record.prompt.includes('no legitimate external authority applies'))issues.push('SOURCE_AUTHORITY_EVIDENCE_CONFLATION');\n  }\n  if(record.stage===9){if(!record.prompt.includes('in an independent context.'))issues.push('PREFLIGHT_INDEPENDENCE_MISSING');if(record.prompt.includes('independent context where required'))issues.push('PREFLIGHT_INDEPENDENCE_CONDITIONAL');}");
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const b=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const token=`runtime-${crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');html=html.replace(/runtime-[0-9a-f]{16}/g,token);fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
      - name: Verify complete deterministic suite
        run: |
          node --check project-store.js
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Verify Chromium operator flows
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Publish only proven source
        run: |
          rm .github/workflows/legacy-prompt-semantic-proof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-store.js prompt-engine.js verify-prompt-semantics.mjs index.html .github/workflows/legacy-prompt-semantic-proof.yml
          git commit -m 'Harden legacy migration and prompt evidence semantics [proof-complete]'
          git push origin HEAD:reliability/legacy-prompt-semantics-current-20260826
