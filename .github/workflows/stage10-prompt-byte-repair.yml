name: Stage 10 prompt-byte repair

on:
  push:
    branches:
      - controller-v2/stage10-prompt-byte-regression-20260905

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'activate Stage 10 prompt-byte repair')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 10 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Prove pre-repair regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node verify-prompt-file-byte-contract.mjs > /tmp/stage10-before.log 2>&1
          code=$?
          set -e
          cat /tmp/stage10-before.log
          test "$code" -ne 0
          grep -Eq 'Authoritative prompt|bodySha256|BODY_SHA256|identity wrapper|end with one LF' /tmp/stage10-before.log
      - name: Apply minimal repair
        shell: bash
        run: |
          set -euo pipefail
          python .stage10-repair.py
          node --check prompt-engine.js
          node verify-prompt-file-byte-contract.mjs
          node verify-prompt-semantics.mjs
          node verify-file-first-operator.mjs
          node verify-file-first-response.mjs
          node verify-response-contract-profile.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
      - name: Commit repaired runtime and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompt-engine.js verify-prompt-semantics.mjs verify-prompt-file-byte-contract.mjs
          git commit -m 'Stage 10: bind exact authoritative prompt-file bytes'
          git push origin HEAD:${GITHUB_REF_NAME}
