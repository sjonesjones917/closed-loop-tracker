name: Prove live browser CDP startup
on:
  push:
    branches: [reliability/live-browser-cdp-20260826]
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-time harness repair
        run: node .repair-live-browser.mjs
      - name: Verify deterministic stack
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Verify local Chromium harness twice
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit exact passing repair and remove scaffolding
        run: |
          rm -f .repair-live-browser.mjs .github/workflows/prove-live-browser-cdp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser.mjs verify-browser-extra.mjs .repair-live-browser.mjs .github/workflows/prove-live-browser-cdp.yml
          git commit -m 'Use Chrome-assigned DevTools port in browser verification [live-browser-cdp-complete]'
          git push
