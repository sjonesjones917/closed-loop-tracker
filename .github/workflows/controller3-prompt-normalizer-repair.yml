name: Controller prompt normalizer repair
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'controller3-integrate-closure-20260904'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-integrate-closure-20260904
          fetch-depth: 0
      - name: Repair exact prompt final-LF normalizer and self-remove
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n "Authoritative prompt body does not enforce\|trimEnd" verify-prompt-semantics.mjs prompt-engine.js || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          old=".replace(/\\r\\n?/g,'\\n').replace(/\\n*$/,'\\n');"
          new=".replace(/\\r\\n?/g,'\\n').trimEnd()+'\\n';"
          if old not in s:
              raise SystemExit('bodyText final-LF target not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/controller3-prompt-normalizer-repair.yml
          node --check prompt-engine.js
          node verify-prompt-semantics.mjs
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add prompt-engine.js .github/workflows/controller3-prompt-normalizer-repair.yml
          git commit -m 'Make authoritative prompt final-LF normalization explicit'
          git push origin HEAD:controller3-integrate-closure-20260904
