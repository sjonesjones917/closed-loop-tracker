name: Apply canonical Test IR binding repair
on:
  push:
    branches: [fix/canonical-bindings-and-test-ownership-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Test IR canonical bindings and authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # workflow-schema.js: executable spec version/hash are application facts.
          p=Path('workflow-schema.js'); s=p.read_text()
          old='''      "EXECUTABLE_KIND",\n      "EXECUTABLE_SPEC_VERSION",\n      "EXECUTABLE_SPEC",\n      "EXECUTABLE_INPUT_BINDINGS"\n    ],\n    "application": [\n      "TEST_ID",\n      "REQ_ID",\n      "STATUS"\n    ]'''
          new='''      "EXECUTABLE_KIND",\n      "EXECUTABLE_SPEC",\n      "EXECUTABLE_INPUT_BINDINGS"\n    ],\n    "application": [\n      "TEST_ID",\n      "REQ_ID",\n      "STATUS",\n      "EXECUTABLE_SPEC_VERSION",\n      "EXECUTABLE_SPEC_SHA256"\n    ]'''
          if old not in s: raise SystemExit('schema test ownership anchor not found')
          p.write_text(s.replace(old,new,1))

          # workflow-engine.js: one application-selected canonical value catalog.
          p=Path('workflow-engine.js'); s=p.read_text()
          marker='function evidenceChainExplanation(project,chain)'
          if marker not in s: raise SystemExit('workflow engine insertion anchor not found')
          insert='''function canonicalTestBindingCatalog(project){\n  ensureShape(project);\n  const allowed=['JOB_ID','CURRENT_INPUT_VERSION','CURRENT_SOURCE_SET_VERSION','CURRENT_REQUIREMENTS_VERSION','CURRENT_TEST_SUITE_VERSION','CURRENT_INSTRUCTION_VERSION','CURRENT_ITERATION','CURRENT_BASELINE_ID','CURRENT_PRODUCT_ID'];\n  const out={};\n  for(const fieldName of allowed){const value=project?.job?.[fieldName];if(value===undefined||value===null||value==='')continue;const canonicalKey=`JOB.${fieldName}`;out[canonicalKey]={canonicalKey,value:clone(value),valueSha256:hash.sha256Value(value)};}\n  return out;\n}\n'''
          if 'function canonicalTestBindingCatalog(project)' not in s: s=s.replace(marker,insert+marker,1)
          export_anchor='applicationTestCapabilities,capabilityAffirmativelyAvailable,testExecutionPlan'
          if export_anchor not in s: raise SystemExit('workflow engine export anchor not found')
          s=s.replace(export_anchor,'applicationTestCapabilities,capabilityAffirmativelyAvailable,canonicalTestBindingCatalog,testExecutionPlan',1)
          p.write_text(s)

          # prompt-engine.js: publish the exact application-selected canonical values and keep app-owned fields out of agent output.
          p=Path('prompt-engine.js'); s=p.read_text()
          old='''AVAILABLE CURRENT ARTIFACT BINDINGS\n${show(artifacts)}\nPERMITTED FUTURE/IMMUTABLE BINDING FORMS'''
          new='''AVAILABLE CURRENT ARTIFACT BINDINGS\n${show(artifacts)}\nAVAILABLE IMMUTABLE CANONICAL VALUE BINDINGS\n${show(workflow.canonicalTestBindingCatalog(state))}\nPERMITTED FUTURE/IMMUTABLE BINDING FORMS'''
          if old not in s: raise SystemExit('prompt binding guide anchor not found')
          s=s.replace(old,new,1)
          old2='''Use EXECUTION_MODE = APPLICATION_DETERMINISTIC, REQUIRED_CAPABILITY = ${testRuntime.CAPABILITY}, EXECUTABLE_KIND = TEST_IR, EXECUTABLE_SPEC_VERSION = ${testRuntime.SPEC_VERSION}, plus a valid EXECUTABLE_SPEC and EXECUTABLE_INPUT_BINDINGS whenever the proposition can be represented faithfully.'''
          new2='''Use EXECUTION_MODE = APPLICATION_DETERMINISTIC, REQUIRED_CAPABILITY = ${testRuntime.CAPABILITY}, EXECUTABLE_KIND = TEST_IR, plus a valid EXECUTABLE_SPEC and EXECUTABLE_INPUT_BINDINGS whenever the proposition can be represented faithfully. The application assigns EXECUTABLE_SPEC_VERSION = ${testRuntime.SPEC_VERSION} and the normalized Test IR SHA-256 after validation; do not return either application-owned field.'''
          if old2 not in s: raise SystemExit('prompt Test IR authority anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          # response-ingestion.js: validate agent-authored IR, then derive version/hash in canonical materialization.
          p=Path('response-ingestion.js'); s=p.read_text()
          old="if(record.fields.EXECUTABLE_SPEC_VERSION!==testRuntime.SPEC_VERSION)issues.push(issue('INVALID_TEST_IR_VERSION',`${path}/fields/EXECUTABLE_SPEC_VERSION`,`Expected ${testRuntime.SPEC_VERSION}.`));"
          if old not in s: raise SystemExit('ingestion agent version check anchor not found')
          s=s.replace(old,'',1)
          old2='''      const fields={...workflow.applicationInitialFields(collection),...clone(proposed.fields||{})};\n      fields[definition.idField]=id;'''
          new2='''      const fields={...workflow.applicationInitialFields(collection),...clone(proposed.fields||{})};\n      if(collection==='tests'&&String(fields.EXECUTION_MODE||'').toUpperCase()==='APPLICATION_DETERMINISTIC'){fields.EXECUTABLE_SPEC_VERSION=testRuntime.SPEC_VERSION;fields.EXECUTABLE_SPEC_SHA256=hash.sha256Value(testRuntime.normalizeSpec(fields.EXECUTABLE_SPEC));}\n      fields[definition.idField]=id;'''
          if old2 not in s: raise SystemExit('ingestion canonical field anchor not found')
          s=s.replace(old2,new2,1)
          # record application derivation provenance for the two derived Test IR fields.
          needle="for(const [name,value] of Object.entries(workflow.applicationInitialFields(collection)))if(!Object.prototype.hasOwnProperty.call(proposed?.fields||{},name))changes.push({origin:'APPLICATION_DERIVATION'"
          if needle not in s: raise SystemExit('ingestion derivation manifest anchor not found')
          # Existing manifest will capture STATUS; append Test IR fields immediately after proposed-field loop via a narrow replacement.
          old3="for(const [name,value] of Object.entries(proposed?.fields||{}))changes.push({origin:'AGENT_VALUE'"
          new3="if(collection==='tests'&&String(record.fields?.EXECUTION_MODE||'').toUpperCase()==='APPLICATION_DETERMINISTIC'){for(const name of ['EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC_SHA256'])changes.push({origin:'APPLICATION_DERIVATION',jsonPointer:null,rawValueHash:null,normalizerUsed:null,canonicalCollection:collection,canonicalRecordType:collection,canonicalRecordId:record.id,canonicalField:name,relationshipTargetId:null,evidenceIds:record.evidenceRefs||[],normalizedValue:clone(record.fields[name]),temporaryResponseKey:record.temporaryKey,derivationKey:`tests.${name}`});}for(const [name,value] of Object.entries(proposed?.fields||{}))changes.push({origin:'AGENT_VALUE'"
          if old3 not in s: raise SystemExit('ingestion proposed field manifest anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)

          # app-core.js: resolve only explicitly published canonical values and pass them to the runtime; remove obsolete second worker protocol.
          p=Path('app-core.js'); s=p.read_text()
          start=s.find('async function executeTestWorker(')
          end=s.find('async function runNativeStage22Tests()',start)
          if start!=-1 and end!=-1: s=s[:start]+s[end:]
          elif start!=-1: raise SystemExit('app-core duplicate worker end anchor not found')
          old='''const staged=[];for(const item of items){const test=engine.records(current,'tests').find(t=>engine.recordId(t,'tests')===item.testId),bindings=engine.recordValue(test,'EXECUTABLE_INPUT_BINDINGS')||{},artifactPayload={},identities=[];for(const [bindingName,binding] of Object.entries(bindings)){const canonical=resolveNativeBinding(test,bindingName,binding),artifactId=engine.recordId(canonical,'artifacts'),row=await projectStore.getArtifact(artifactId);'''
          new='''const staged=[];for(const item of items){const test=engine.records(current,'tests').find(t=>engine.recordId(t,'tests')===item.testId),bindings=engine.recordValue(test,'EXECUTABLE_INPUT_BINDINGS')||{},artifactPayload={},canonicalPayload={},identities=[],canonicalCatalog=engine.canonicalTestBindingCatalog(current);for(const [bindingName,binding] of Object.entries(bindings)){if(binding&&typeof binding==='object'&&binding.kind==='CANONICAL_VALUE'){const entry=canonicalCatalog[String(binding.canonicalKey||'')];if(!entry)throw new Error(`Test ${item.testId} binding ${bindingName} references an unavailable canonical value.`);if(binding.valueSha256&&String(binding.valueSha256).toLowerCase()!==String(entry.valueSha256).toLowerCase())throw new Error(`Test ${item.testId} binding ${bindingName} is stale because its canonical value changed.`);canonicalPayload[bindingName]={canonicalKey:entry.canonicalKey,value:clone(entry.value),valueSha256:entry.valueSha256};continue;}const canonical=resolveNativeBinding(test,bindingName,binding),artifactId=engine.recordId(canonical,'artifacts'),row=await projectStore.getArtifact(artifactId);'''
          if old not in s: raise SystemExit('app-core binding loop anchor not found')
          s=s.replace(old,new,1)
          old2="const result=await runtime.executeTest(test,artifactPayload,{});"
          if old2 not in s: raise SystemExit('app-core runtime call anchor not found')
          s=s.replace(old2,"const result=await runtime.executeTest(test,artifactPayload,canonicalPayload);",1)
          p.write_text(s)
          PY
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js
          git commit -m "Enforce application-owned Test IR bindings and identity"
          git push
