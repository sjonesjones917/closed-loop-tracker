name: Controller source transport

on:
  push:
    branches:
      - fix/all-stage-prompt-contracts-20260908
    paths:
      - .controller-transport/READY

permissions:
  contents: write

jobs:
  apply-audited-prompt-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reconstruct and verify audited delta
        shell: bash
        run: |
          set -euo pipefail
          cat .controller-transport/chunk-*.b64 | base64 --decode > /tmp/prompt-repair.patch.zst
          echo '307a81941a0b3a8c47b3896b75fd42fa860796bc2e7a006b4e9c9d61f0fd1c8b  /tmp/prompt-repair.patch.zst' | sha256sum --check --strict

      - name: Reset to canonical base and reconstruct exact tested files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=d14d84d580ecb4a328297ccb1eabc626ac99cfee
          test "$(git rev-parse "${BASE_SHA}^{commit}")" = "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          cat > /tmp/changed-list.txt <<'FILES'
          .github/workflows/pages.yml
          app-core.js
          prompt-engine.js
          response-ingestion.js
          stage19-fixture.mjs
          verify-all-stage-prompts.mjs
          verify-browser.mjs
          verify-complete.mjs
          verify-data-route-closure.mjs
          verify-file-first-response.mjs
          verify-full-cycle.mjs
          verify-human-authority-roundtrip.mjs
          verify-human-stage-walkthrough.mjs
          verify-ingestion.mjs
          verify-one-time-intent-intake.mjs
          verify-prompt-file-identity.mjs
          verify-spec-grounded-route-oracle.mjs
          verify-spec3-contract.mjs
          verify-stage-operation-registry.mjs
          verify-stage-prompts-complete.mjs
          verify-stage01-disposition-contract.mjs
          verify-stage01-intake-closure.mjs
          verify-test-runtime.mjs
          verify-user-prompt-invariants.mjs
          verify-zero-loss-accounting.mjs
          verify.mjs
          workflow-engine.js
          workflow-schema.js
          FILES
          rm -rf /tmp/base-overlay
          mkdir -p /tmp/base-overlay
          while IFS= read -r f; do
            mkdir -p "/tmp/base-overlay/$(dirname "$f")"
            if [ -e "$f" ]; then cp -p "$f" "/tmp/base-overlay/$f"; else : > "/tmp/base-overlay/$f"; fi
          done < /tmp/changed-list.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --format=gnu -C /tmp/base-overlay -cf /tmp/base-changed.tar -T /tmp/changed-list.txt
          echo '82dd3655b16e9b268b07919b35075dfcf195537dbf83274890ca43ff554bd78c  /tmp/base-changed.tar' | sha256sum --check --strict
          zstd -q -d --patch-from=/tmp/base-changed.tar /tmp/prompt-repair.patch.zst -o /tmp/new-changed.tar
          echo '7f4336b76705bfd0eb134d5880875a8aa650a41447638fcca8c55bf7f672d07a  /tmp/new-changed.tar' | sha256sum --check --strict
          tar -xf /tmp/new-changed.tar -C .
          test ! -e .controller-transport
          test ! -e .github/workflows/controller-source-transport.yml

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify prompt authority before publication
        shell: bash
        run: |
          set -euo pipefail
          node verify-stage-operation-registry.mjs
          node verify-stage01-intake-closure.mjs
          node verify-stage01-disposition-contract.mjs
          node verify-human-authority-roundtrip.mjs
          node verify-prompt-semantics.mjs
          node verify-all-stage-prompts.mjs
          node verify-user-prompt-invariants.mjs
          node verify-file-first-response.mjs
          node verify-ingestion.mjs
          node verify-full-cycle.mjs

      - name: Verify rendered prompt display and export bytes
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node verify-human-stage-walkthrough.mjs

      - name: Publish tested non-workflow repair files to clean branch
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=d14d84d580ecb4a328297ccb1eabc626ac99cfee
          git checkout "$BASE_SHA" -- .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -Fx '.github/workflows/pages.yml'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '27'
          git commit -m 'Repair all stage prompt contracts and prompt display/export path'
          git push origin HEAD:refs/heads/fix/all-stage-prompt-contracts-clean-20260908
