name: Practical 100 PR5 final verification
on:
  push:
    branches: [practical-100/pr5-indexeddb-ui]
permissions:
  contents: write
jobs:
  verify-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply minimum PR5 changes
        run: |
          sed -i 's/if(\x27http-equiv="Content-Security-Policy"\x27 not in s:/if \x27http-equiv="Content-Security-Policy"\x27 not in s:/' .practical100-pr5.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.practical100-pr5-engineui.py');s=p.read_text()
          s=s.replace("candidateFreezes').at(-1),'candidateFreezes')},hashes:Object.fromEntries", "candidateFreezes').at(-1),'candidateFreezes'),hashes:Object.fromEntries")
          s=s.replace("recordValue(a,'SHA256')]));const fields=", "recordValue(a,'SHA256')]))};const fields=")
          p.write_text(s)
          PY
          python -m py_compile .practical100-pr5*.py
          python .practical100-pr5.py
          python .practical100-pr5-compat.py
          python .practical100-pr5-legacyfix.py
          python .practical100-pr5-browserfix.py
          python .practical100-pr5-assertfix.py
          python .practical100-pr5-migrationstate.py
          python .practical100-pr5-revisionfix.py
          python .practical100-pr5-rawfirst.py
          python - <<'PY'
          from pathlib import Path
          p=Path('response-ingestion.js');s=p.read_text()
          old="rawRecord.canonicalEnvelopeSha256=envelopeHash;\n    if(prior){"
          new="if(prior){rawRecord.canonicalEnvelopeSha256=envelopeHash;"
          assert old in s;s=s.replace(old,new,1)
          start=s.index('function prepareCaptured')
          anchor='  const validationId='
          at=s.index(anchor,start)
          s=s[:at]+"  if(envelope&&!rawRecord.canonicalEnvelopeSha256)rawRecord.canonicalEnvelopeSha256=hash.canonicalEnvelopeSha256(envelope);\n"+s[at:]
          old="return {project:next,rawRecord,validation:prior.validationId?findValidation(next,prior.validationId):null,proposal:prior.proposalId?findProposal(next,prior.proposalId):null,receipt:prior.receiptId?findReceipt(next,prior.receiptId):null,disposition:safe(next.projectData.responseDispositions).find(d=>d.rawResponseId===prior.rawResponseId)||null,duplicate:true};"
          new="return {project:next,rawRecord:prior,validation:prior.validationId?findValidation(next,prior.validationId):null,proposal:prior.proposalId?findProposal(next,prior.proposalId):null,receipt:prior.receiptId?findReceipt(next,prior.receiptId):null,disposition:safe(next.projectData.responseDispositions).find(d=>d.rawResponseId===prior.rawResponseId)||null,duplicate:true};"
          assert old in s;s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python .practical100-pr5-storeatomic.py
          python .practical100-pr5-engineui.py
          python .practical100-pr5-explicittypes.py
          python .practical100-pr5-nodirect.py
          sed -i 's/stage:stage??Number(project.activeStage||0)||null/stage:(stage??Number(project.activeStage||0))||null/' workflow-engine.js
          python - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs');s=p.read_text()
          old="for(const token of ['identityAssurance','SELF_ASSERTED','MULTI_CHOICE','FILE_REFERENCE','Proposal diff','retainedBytes:true'])if(!appSource.includes(token))throw new Error(`PR5 UI boundary missing ${token}.`);"
          new="if(!engineSource.includes('identityAssurance'))throw new Error('PR5 engine identity assurance metadata missing.');for(const token of ['SELF_ASSERTED','MULTI_CHOICE','FILE_REFERENCE','Proposal diff','retainedBytes:true'])if(!appSource.includes(token))throw new Error(`PR5 UI boundary missing ${token}.`);"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)
          for name in ['verify-browser.mjs','verify-browser-extra.mjs']:
            p=Path(name);t=p.read_text().replace('Mobile Closed-Loop Agent Reliability Workbook','Mobile Closed-Loop Reliability Workbook')
            p.write_text(t)
          PY
      - name: Structural boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app-core.js').read_text(); schema=Path('workflow-schema.js').read_text(); store=Path('project-store.js').read_text(); ingestion=Path('response-ingestion.js').read_text(); engine=Path('workflow-engine.js').read_text()
          assert not re.search(r'\bprompt\s*\(',app)
          assert not re.search(r'projectData(?:\.[A-Za-z_$][\w$]*|\[[^\]]+\])\.push\s*\(',app)
          assert 'explicitValueType' not in schema and 'APPLICATION_STAGE_PATTERN' not in schema
          assert 'EXPLICIT_STAGE_FIELD_TYPES' in schema and 'EXPLICIT_RECORD_FIELD_TYPES' in schema
          assert all(x in ingestion for x in ['captureRaw','prepareCaptured','proposalPreconditions','expectedProjectRevision'])
          assert all(x in store for x in ["DB_NAME='closed-loop-reliability'",'putArtifact','before-import-transaction','packageManifest','projectSha256'])
          assert all(x in engine for x in ['registerGeneratedPrompt','freezeCandidate','freezeBaseline','reserveProductExecution','createNewJobReset'])
          PY
      - name: Syntax and deterministic verification
        run: |
          for f in workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$f"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Browser acceptance
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified PR5 source only
        run: |
          rm -f .practical100-pr5*.py
          rm -f .github/workflows/practical100-pr5-*.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 5: IndexedDB bytes and validated operator controls"
          git push origin HEAD:practical-100/pr5-indexeddb-ui
