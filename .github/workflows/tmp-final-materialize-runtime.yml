name: Materialize final runtime
on:
  push:
    branches: [fix/final-materialized-runtime-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize source and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          target='runtime-20260830-live-operator-44'
          p=Path('prompt-engine.js'); s=p.read_text()
          s,n=re.subn(r"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/\d+';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/44';",s,count=1)
          if n!=1: raise SystemExit('prompt engine version not found')
          p.write_text(s)
          for name in ['app-core.js','test-runtime.js']:
            p=Path(name); s=p.read_text()
            s,n=re.subn(r"const RUNTIME_BUILD_ID='runtime-[^']+';",f"const RUNTIME_BUILD_ID='{target}';",s,count=1)
            if n!=1: raise SystemExit(f'{name} runtime identity not found')
            p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          s,n=re.subn(r'(?<=\.js\?v=)runtime-[^"\']+',target,s)
          if n!=9: raise SystemExit(f'expected 9 runtime script identities, got {n}')
          p.write_text(s)
          PY
          rm -f \
            .github/workflows/apply-combined-prompt-engine.yml \
            .github/workflows/apply-current-all-stage-prompt-closure.yml \
            .github/workflows/apply-materialize-stage-closure.yml \
            .github/workflows/tmp-final-materialize-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize materialized prompt runtime"
          git push origin HEAD:fix/final-materialized-runtime-20260830
