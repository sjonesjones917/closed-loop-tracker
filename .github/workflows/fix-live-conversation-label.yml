name: One-time live conversation-label repair
on:
  push:
    branches:
      - repair/full-spec-conformance-fcfc1c6
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/full-spec-conformance-fcfc1c6
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair operator-facing conversation state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old='Continue talking to the agent. Do not import a final response file yet.'
          new='Continue the external conversation. Do not import a final response file yet.'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one live conversation-state target; found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node verify-data-route-closure.mjs
          node verify-file-first-response.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)" node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit whole repair and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-live-conversation-label.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add app-core.js .github/workflows/fix-live-conversation-label.yml
          git diff --cached --check
          git commit -m "Conform live conversation operator state"
          git push origin HEAD:repair/full-spec-conformance-fcfc1c6
