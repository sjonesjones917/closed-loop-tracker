name: Fix canonical evidence chain linkage
'on':
  push:
    branches:
      - practical-100/pr6-final-proof-current
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-final-proof-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply accumulated verified corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('.github/workflows/pr6-minimal-semantic-fix.yml').read_text()
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          exec(compile(code,'accumulated-pr6-fix.py','exec'),{})

          p=Path('workflow-engine.js'); text=p.read_text()
          old="for(const r of results){for(const id of safe(r.evidenceIds))evidenceIds.add(id);if(recordValue(r,'EVIDENCE_ID'))evidenceIds.add(recordValue(r,'EVIDENCE_ID'));}"
          new="for(const r of results){for(const id of safe(r.evidenceRefs)){const value=String(id);if(records(project,'evidenceRecords').some(e=>recordId(e,'evidenceRecords')===value))evidenceIds.add(value);}const direct=String(recordValue(r,'EVIDENCE_ID')||'');if(direct&&records(project,'evidenceRecords').some(e=>recordId(e,'evidenceRecords')===direct))evidenceIds.add(direct);}"
          if text.count(old)!=1: raise SystemExit(f'Evidence reference reader match {text.count(old)}')
          p.write_text(text.replace(old,new,1))

          p=Path('verify-full-cycle.mjs'); text=p.read_text()
          old="const chains=engine.constructEvidenceChains(p);if(chains.some(x=>engine.recordValue(x,'STATUS')!=='COMPLETE'))console.error('EVIDENCE_CHAINS',JSON.stringify(chains.map(x=>({req:engine.recordValue(x,'REQ_ID'),missing:engine.recordValue(x,'MISSING_LINKS'),fields:x.fields})),null,2));assertStage(p,29);"
          new="engine.constructEvidenceChains(p);assertStage(p,29);"
          if text.count(old)==1:text=text.replace(old,new,1)
          p.write_text(text)
          PY
      - name: Verify deterministic contracts and complete lifecycle
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit verified source and remove temporary repair workflows
        run: |
          rm .github/workflows/pr6-minimal-semantic-fix.yml .github/workflows/pr6-stage29-evidence-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete PR6 deterministic lifecycle semantics"
          git push origin HEAD:practical-100/pr6-final-proof-current
