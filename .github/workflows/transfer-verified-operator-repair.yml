name: Transfer and exercise exact operator repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'repair/complete-conformance-continuation-20260914'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.repair.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # This one-use transport produces a commit object, not a branch update.
      # The resulting tree removes this workflow. Every input and output file
      # must match the locally tested SHA-256 before any Git object is created.
      - name: Materialize and verify the exact repair
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE: b5bac1616a4380f45f5a842206d98eb73cb8d6d5
          PATCH_PAYLOAD: 
        run: |
          python3 - <<'PY'
          import os,json,base64,gzip,hashlib,subprocess,urllib.request,pathlib
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^') == os.environ['EXPECTED_BASE'], 'Unexpected parent; refuse to modify a moving branch'
          entries=json.loads(gzip.decompress(base64.b64decode(os.environ['PATCH_PAYLOAD'],validate=True)))
          expected={'app-core.js','verify-complete-operator-journey.mjs','verify-operator-action-lifecycle.mjs','verify-operator-control-state-fault.mjs'}
          assert set(entries)==expected
          for name,row in entries.items():
              source=pathlib.Path(name).read_bytes()
              assert hashlib.sha256(source).hexdigest()==row['before'], 'Unexpected source: '+name
              text=source.decode('utf-8')
              if 'replacements' in row:
                  for before,after,count in row['replacements']:
                      assert text.count(before)==count, 'Replacement is not unique: '+name
                      text=text.replace(before,after)
              else: text=row['content']
              result=text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==row['after'], 'Output differs from tested bytes: '+name
              pathlib.Path(name).write_bytes(result)
          for name in sorted(expected): subprocess.run(['node','--check',name],check=True)
          for name in ['verify-operator-action-lifecycle.mjs','verify-operator-control-state-fault.mjs','verify-ui-acceptance-impact.mjs','verify-ui-persistence-preconditions.mjs','verify-file-first-operator.mjs','verify-data-route-closure.mjs']:
              subprocess.run(['node',name],check=True)
          assert set(git('diff','--name-only').splitlines())==expected
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          def post(route,body):
              request=urllib.request.Request(api+route,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          tree=[]
          for name in sorted(expected):
              blob=post('/git/blobs',{'content':pathlib.Path(name).read_text(),'encoding':'utf-8'})['sha']
              assert blob==git('hash-object',name)
              tree.append({'path':name,'mode':'100644','type':'blob','sha':blob})
          tree.append({'path':'.github/workflows/transfer-verified-operator-repair.yml','mode':'100644','type':'blob','sha':None})
          tree_sha=post('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':tree})['sha']
          commit=post('/git/commits',{'message':'Restore visible workflow controls and preserve next-action focus\n\nShow the current primary action on Workflow, before unbounded details. Retain state, actor, outcome accounting and audit disclosures; avoid duplicate native and package controls. Restore focus after navigation and canonical application actions. Add 23 primary ownership regressions, two reproduced control mutants and three-width browser coverage. Remove the one-use exact-digest transport. Local Node regressions passed; browser and complete product acceptance are not asserted by this commit.','tree':tree_sha,'parents':[git('rev-parse','HEAD')]})['sha']
          result={'candidate':commit,'parent':git('rev-parse','HEAD'),'tree':tree_sha,'files':{name:row['after'] for name,row in entries.items()},'branchUpdated':False}
          pathlib.Path('candidate-manifest.json').write_text(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('candidate='+commit+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-repair-candidate
          path: candidate-manifest.json
          if-no-files-found: warn
          retention-days: 3
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exercise exact repaired build through the browser
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          node build-static-site.mjs --output _site --source-commit "$CANDIDATE" --workflow-run "$GITHUB_RUN_ID"
          python3 -m http.server 4173 --directory _site > /tmp/operator-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          timeout 95m node verify-complete-operator-journey.mjs
          timeout 10m node verify-browser-recovery.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repaired-operator-evidence
          path: |
            operator-evidence/journey.json
            operator-evidence/*.png
            operator-evidence/viewport-*/*.png
            operator-evidence/viewport-*/*.json
            recovery-browser-evidence/**
          if-no-files-found: warn
          retention-days: 3
