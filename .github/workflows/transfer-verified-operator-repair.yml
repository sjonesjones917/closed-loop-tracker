name: Transfer and exercise exact operator repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: exact-operator-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'repair/complete-conformance-continuation-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.repair.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # This one-use transfer creates a commit object, not a branch update.
      # The resulting tree removes this workflow and its readable recipe.
      - name: Materialize and verify the exact repair
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE: b5bac1616a4380f45f5a842206d98eb73cb8d6d5
        run: |
          python3 - <<'PY'
          import os,json,hashlib,subprocess,urllib.request,pathlib
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          transport={'.github/workflows/transfer-verified-operator-repair.yml','.github/operator-repair.py'}
          assert set(git('diff','--name-only',os.environ['EXPECTED_BASE'],'HEAD').splitlines())==transport, 'Unexpected product changes; refusing to overwrite another repair'
          subprocess.run(['python3','.github/operator-repair.py'],check=True)
          expected={'app-core.js','verify-complete-operator-journey.mjs','verify-operator-action-lifecycle.mjs','verify-operator-control-state-fault.mjs'}
          for name in sorted(expected): subprocess.run(['node','--check',name],check=True)
          for name in ['verify-operator-action-lifecycle.mjs','verify-operator-control-state-fault.mjs','verify-ui-acceptance-impact.mjs','verify-ui-persistence-preconditions.mjs','verify-file-first-operator.mjs','verify-data-route-closure.mjs']:
              subprocess.run(['node',name],check=True)
          assert set(git('diff','--name-only').splitlines())==expected
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          def post(route,body):
              request=urllib.request.Request(api+route,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          tree=[]
          digests={}
          for name in sorted(expected):
              blob=post('/git/blobs',{'content':pathlib.Path(name).read_text(),'encoding':'utf-8'})['sha']
              assert blob==git('hash-object',name)
              tree.append({'path':name,'mode':'100644','type':'blob','sha':blob})
              digests[name]=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
          for name in sorted(transport): tree.append({'path':name,'mode':'100644','type':'blob','sha':None})
          tree_sha=post('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':tree})['sha']
          message='Restore visible workflow controls and preserve next-action focus\n\nShow the current primary action on Workflow, before unbounded details. Retain state, actor, outcome accounting and audit disclosures; avoid duplicate native and package controls. Restore focus after navigation and canonical application actions. Add 23 primary ownership regressions, two reproduced control mutants and three-width browser coverage. Remove the one-use repair transport. The Node regressions passed; full browser and product acceptance are not asserted by this commit.'
          commit=post('/git/commits',{'message':message,'tree':tree_sha,'parents':[git('rev-parse','HEAD')]})['sha']
          result={'candidate':commit,'parent':git('rev-parse','HEAD'),'tree':tree_sha,'files':digests,'branchUpdated':False}
          pathlib.Path('candidate-manifest.json').write_text(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('candidate='+commit+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-repair-candidate
          path: candidate-manifest.json
          if-no-files-found: warn
          retention-days: 3
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exercise exact repaired build through the browser
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          node build-static-site.mjs --output _site --source-commit "$CANDIDATE" --workflow-run "$GITHUB_RUN_ID"
          python3 -m http.server 4173 --directory _site > /tmp/operator-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          timeout 95m node verify-complete-operator-journey.mjs
          timeout 10m node verify-browser-recovery.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repaired-operator-evidence
          path: |
            operator-evidence/journey.json
            operator-evidence/*.png
            operator-evidence/viewport-*/*.png
            operator-evidence/viewport-*/*.json
            recovery-browser-evidence/**
          if-no-files-found: warn
          retention-days: 3
