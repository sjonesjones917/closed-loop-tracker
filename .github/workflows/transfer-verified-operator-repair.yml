name: Transfer exact integrated repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: exact-operator-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'repair/complete-conformance-continuation-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # This pre-existing one-use transfer is removed from the exact candidate.
      # It creates only an unreferenced commit object. The connected GitHub
      # write operation must verify and publish that object; the ordinary single
      # Pages workflow then runs every mandatory browser and conformance check.
      - name: Materialize and verify the exact integrated repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/operator-repair.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-repair-candidate
          path: candidate-manifest.json
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-repair-checks
          path: /tmp/exact-operator-repair-checks/*.log
          if-no-files-found: warn
          retention-days: 3
