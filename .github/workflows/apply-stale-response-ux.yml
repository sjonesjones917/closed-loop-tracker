name: Apply stale response UX repair

on:
  push:
    branches:
      - fix/stale-response-ux
    paths:
      - .github/workflows/apply-stale-response-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal stale-response UX repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          p=Path('app-core.js')
          s=p.read_text()
          old="function validationMarkup(n){const v=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1);if(!v||v.valid)return '';return `<div class=\"notice danger\" id=\"validation-report\" tabindex=\"-1\"><strong>Response rejected before canonical mutation.</strong><br>${safe(v.issues).map(x=>esc(`${x.code}: ${x.message}`)).join('<br>')}</div>`;}"
          new="function validationMarkup(n){const v=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1);if(!v||v.valid)return '';const issues=safe(v.issues),staleCodes=new Set(['STALE_SCOPE','STALE_PROMPT_IDENTITY','STALE_PROMPT_HASH','STALE_CONTRACT_HASH','STALE_CONTEXT_SIGNATURE']),stale=issues.some(x=>staleCodes.has(String(x.code||''))),typographyNormalized=issues.some(x=>String(x.code||'')==='JSON_TYPOGRAPHY_NORMALIZED');if(stale){const prompt=currentPromptRecord(n),expected=prompt?.instructionId||prompt?.promptId||'the current saved instruction',technical=issues.map(x=>esc(`${x.code}: ${x.message}`)).join('<br>');return `<div class=\"notice danger\" id=\"validation-report\" tabindex=\"-1\"><strong>This response belongs to an older instruction.</strong><br>Nothing was accepted or changed. The current controlling instruction is <strong>${esc(expected)}</strong>. Do not edit the JSON or repair hashes yourself. Tap <strong>Save and copy instruction</strong> above, paste that current instruction into the same ChatGPT conversation, and ask ChatGPT to return the final JSON for that exact instruction. Then replace the response here and tap <strong>Parse / validate response</strong> again.${typographyNormalized?'<br><br>The smart quotation marks were normalized successfully; they are not the reason this response was rejected.':''}<details class=\"record-card\"><summary>Technical validation details<span>Audit</span></summary><div class=\"record-body\">${technical}</div></details></div>`;}return `<div class=\"notice danger\" id=\"validation-report\" tabindex=\"-1\"><strong>Response rejected before canonical mutation.</strong><br>${issues.map(x=>esc(`${x.code}: ${x.message}`)).join('<br>')}</div>`;}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for file in runtime_files:
              data=Path(file).read_bytes()
              blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              manifest+=f'{file}:{blob}\n'
          runtime_id='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p=Path('index.html')
          s=p.read_text()
          ids=set(re.findall(r'runtime-[A-Za-z0-9]+',s))
          assert len(ids)==1,ids
          s=s.replace(next(iter(ids)),runtime_id)
          p.write_text(s)
          PY
      - name: Verify complete application
        run: |
          node --check app-core.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          node verify-browser.mjs
      - name: Commit verified patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-stale-response-ux.yml
          git config user.name "closed-loop patch"
          git config user.email "actions@users.noreply.github.com"
          git add app-core.js index.html .github/workflows/apply-stale-response-ux.yml
          git commit -m "Explain stale agent responses in plain language"
          git push origin HEAD:fix/stale-response-ux