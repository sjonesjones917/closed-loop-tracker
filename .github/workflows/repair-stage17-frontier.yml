name: Apply Stage 17 frontier repair

on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831
    paths:
      - repair-stage17-frontier.mjs
      - .github/workflows/repair-stage17-frontier.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Stage 17 repair
        run: node repair-stage17-frontier.mjs
      - name: Focused regression proof
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check verify-full-cycle.mjs
          node verify-complete.mjs
          node verify-ingestion.mjs
      - name: Commit repaired source and remove one-shot repair machinery
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm repair-stage17-frontier.mjs .github/workflows/repair-stage17-frontier.yml
          git add workflow-engine.js workflow-schema.js verify-full-cycle.mjs
          git diff --cached --check
          git commit -m "Repair Stage 17 application-owned iteration lifecycle"
          git push origin HEAD:fix/zero-loss-controlled-20260831
