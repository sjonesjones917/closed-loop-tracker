name: One-time browser file-first mode repair

on:
  push:
    branches: [repair/file-first-clean-20260903]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/file-first-clean-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Update permanent browser regression
        run: node .repair-browser-file-first-mode.mjs
      - name: Check permanent regression syntax
        run: node --check verify-browser-extra.mjs
      - name: Commit only permanent browser regression
        run: |
          set -euo pipefail
          rm .repair-browser-file-first-mode.mjs .github/workflows/repair-browser-file-first-mode.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-browser-extra.mjs .repair-browser-file-first-mode.mjs .github/workflows/repair-browser-file-first-mode.yml
          git commit -m "Conform browser conversation-mode regression"
          git push origin HEAD:repair/file-first-clean-20260903
