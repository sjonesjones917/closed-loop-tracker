name: Repair exact-scope ingestion fixtures
on:
  push:
    branches: [repair/spec-scope-current2-20260903]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[scope-fixture-repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-scope-current2-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Replace obsolete out-of-contract scope fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          s=s.replace("{let p=project('JOB-PARALLEL-PROMPT-VALIDATION'),stage=17;p.revision=0;const a={...fixtureBuildPrompt(stage,{...p,revision:1},{operation:'EXECUTE_RUN',scope:{runId:'RUN-A',contextId:'CTX-A'}}),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(a);const b={...fixtureBuildPrompt(stage,{...p,revision:1},{operation:'EXECUTE_RUN',scope:{runId:'RUN-B',contextId:'CTX-B'}}),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(b);", "{let p=project('JOB-PARALLEL-PROMPT-VALIDATION'),stage=11;p.revision=0;const a={...fixtureBuildPrompt(stage,{...p,revision:1},{operation:'EXECUTE_RUN',scope:{runId:'RUN-A'}}),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(a);const b={...fixtureBuildPrompt(stage,{...p,revision:1},{operation:'EXECUTE_RUN',scope:{runId:'RUN-B'}}),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(b);")
          s=s.replace("{let p=project('JOB-SCOPED-CLARIFICATION'),stage=17;p.revision=0;const pr={...fixtureBuildPrompt(stage,{...p,revision:1},{operation:'EXECUTE_RUN',scope:{runId:'RUN-CLARIFY',contextId:'CTX-CLARIFY'}}),generatedAt:new Date().toISOString()};", "{let p=project('JOB-SCOPED-CLARIFICATION'),stage=11;p.revision=0;const pr={...fixtureBuildPrompt(stage,{...p,revision:1},{operation:'EXECUTE_RUN',scope:{runId:'RUN-CLARIFY'}}),generatedAt:new Date().toISOString()};")
          s=s.replace("if(!active.some(x=>x.operation==='EXECUTE_RUN'&&x.scope?.runId==='RUN-CLARIFY'&&x.scope?.contextId==='CTX-CLARIFY'))throw new Error('Scoped clarification did not regenerate the exact operation/run prompt.');if(active.some(x=>x.operation==='FREEZE'))throw new Error('Scoped clarification incorrectly regenerated the stage default operation.');}", "if(!active.some(x=>x.operation==='EXECUTE_RUN'&&x.scope?.runId==='RUN-CLARIFY'&&!Object.prototype.hasOwnProperty.call(x.scope||{},'contextId')))throw new Error('Scoped clarification did not regenerate the exact Stage 11 operation/run scope.');}")
          old="""// Raw capture audit scope must be controlled by the persisted prompt, not a caller-supplied context hint.\n{\n  const p=project('JOB-RAW-SCOPE');\n  p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';\n  const prompt=fixtureBuildPrompt(17,p,{operation:'EXECUTE_RUN',scope:{iterationId:'ITERATION-SCOPE-001',candidateId:'CANDIDATE-SCOPE-001',runId:'RUN-SCOPE-001',contextId:'CONTEXT-SCOPE-001'}});\n  p.projectData.generatedPrompts.push({...prompt,generatedAt:new Date().toISOString()});\n  const captured=ingestion.captureRaw(p,{stage:17,text:'{}',promptRecord:prompt,contextId:'MISLEADING-CALLER-CONTEXT'});\n  if(captured.rawRecord.runId!=='RUN-SCOPE-001'||captured.rawRecord.contextId!=='CONTEXT-SCOPE-001'||captured.rawRecord.iteration!=='ITERATION-SCOPE-001')throw new Error('Raw-response audit identity is not bound to the controlling prompt scope.');\n}\n"""
          new="""// Raw capture audit scope must preserve the exact registered prompt scope; caller hints cannot add scope dimensions.\n{\n  const p=project('JOB-RAW-SCOPE');\n  p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';\n  const prompt=fixtureBuildPrompt(11,p,{operation:'EXECUTE_RUN',scope:{iterationId:'ITERATION-SCOPE-001',candidateId:'CANDIDATE-SCOPE-001',runId:'RUN-SCOPE-001'}});\n  p.projectData.generatedPrompts.push({...prompt,generatedAt:new Date().toISOString()});\n  const captured=ingestion.captureRaw(p,{stage:11,text:'{}',promptRecord:prompt,contextId:'MISLEADING-CALLER-CONTEXT'});\n  if(captured.rawRecord.runId!=='RUN-SCOPE-001'||captured.rawRecord.iteration!=='ITERATION-SCOPE-001')throw new Error('Raw-response audit identity lost the controlling Stage 11 prompt scope.');\n  if(Object.prototype.hasOwnProperty.call(captured.rawRecord.promptScope||{},'contextId')||JSON.stringify(captured.rawRecord.promptScope)!==JSON.stringify(prompt.scope))throw new Error('Caller-supplied context leaked into the registered prompt scope.');\n}\n"""
          if old not in s:
              raise SystemExit('Raw-scope legacy fixture not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node verify-ingestion.mjs
          rm .github/workflows/repair-scope-fixtures.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-ingestion.mjs .github/workflows/repair-scope-fixtures.yml
          git commit -m 'Conform exact-scope ingestion fixtures [scope-fixture-repair]'
          git push origin HEAD:repair/spec-scope-current2-20260903
