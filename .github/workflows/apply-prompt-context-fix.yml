name: Apply prompt context completion fix
on:
  push:
    branches: [fix/complete-closed-loop-spec-20260831]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
          fetch-depth: 0
      - name: Apply prompt/context correction and remove this one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/53';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';")
          s=s.replace('"3":"Research only the complete current accepted Stage 02 independent external source set supplied in this prompt,','"3":"Research only the current accepted Stage 02 independent external source set supplied in this prompt, and treat that current set as complete for this operation:')
          old="function stage4ExhaustedInputs(state){const active=list=>safe(list).filter(r=>r?.active!==false&&!r?.invalidatedBy).map(r=>({id:r?.id||r?.recordId||null,stage:r?.stage??null,scope:r?.scope||{},fields:recordFields(r),relationships:r?.relationships||{},evidenceRefs:r?.evidenceRefs||[]})),humanJobInput=Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>[name,state?.job?.[name]??null]));return {currentUserJobInput:humanJobInput,stage01AcceptedCapture:parseCapturedInputSet(state),stage01AcceptedDefinition:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:state?.stages?.[1]?.derivedData||{}},stage03AcceptedData:{agentData:state?.stages?.[3]?.agentData||state?.stages?.[3]?.acceptedData||{},humanData:state?.stages?.[3]?.humanData||{},derivedData:state?.stages?.[3]?.derivedData||{}},stage03Research:active(state?.projectData?.research),stage03CandidateRequirements:active(state?.projectData?.candidateRequirements),applicableSources:active(state?.projectData?.sources),applicableEvidence:active(state?.projectData?.evidenceRecords).filter(record=>[2,3].includes(Number(record.stage)))}};"
          new="function stage4ExhaustedInputs(state,scope={}){const projectRecord=(record,collection)=>({id:recordId(record,collection),stage:record?.stage??null,scope:record?.scope||{},fields:recordFields(record),relationships:record?.relationships||{},evidenceRefs:record?.evidenceRefs||[],contentSha256:record?.contentSha256||record?.sha256||hash.sha256Value(recordFields(record))}),current=collection=>selectedContextRecords(state,collection,scope).map(record=>projectRecord(record,collection)),humanJobInput=Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>[name,state?.job?.[name]??null]));return {currentUserJobInput:humanJobInput,stage01IntakeManifest:intakeCoverageManifest(state),stage01AcceptedCapture:parseCapturedInputSet(state),stage01AcceptedDefinition:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:workflow.deriveStageData(state,1)},stage02AcceptedData:{agentData:state?.stages?.[2]?.agentData||state?.stages?.[2]?.acceptedData||{},humanData:state?.stages?.[2]?.humanData||{},derivedData:workflow.deriveStageData(state,2)},stage03AcceptedData:{agentData:state?.stages?.[3]?.agentData||state?.stages?.[3]?.acceptedData||{},humanData:state?.stages?.[3]?.humanData||{},derivedData:workflow.deriveStageData(state,3)},stage03Research:current('research'),stage03CandidateRequirements:current('candidateRequirements'),applicableSources:current('sources'),applicableSourceConflicts:current('sourceConflicts'),applicableEvidence:current('evidenceRecords').filter(record=>[1,2,3].includes(Number(record.stage)))}};"
          if old not in s: raise SystemExit('Stage 4 exhausted-input function did not match expected current source')
          s=s.replace(old,new)
          old2="function assertStage4UpstreamExhausted(state){const fail=reason=>{const error=new Error(reason);error.code='STAGE4_UPSTREAM_INCOMPLETE';throw error;};const one=state?.stages?.[1],three=state?.stages?.[3];if(String(one?.status||'').toUpperCase()!=='COMPLETE'||one?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 01 human-authority intake is complete.');const intake=workflow.evaluateIntakeAccounting(state);if(!intake.complete)fail('Stage 04 cannot be generated because Stage 01 controlled-input accounting is incomplete: '+intake.reasons.join('; '));if(String(three?.status||'').toUpperCase()!=='COMPLETE'||three?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 03 research is complete.');const noSource=upper(state?.stages?.[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION||state?.stages?.[2]?.acceptedData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE';if(!noSource){const sources=safe(state?.projectData?.sources).filter(r=>r?.active!==false&&!r?.invalidatedBy),research=safe(state?.projectData?.research).filter(r=>r?.active!==false&&!r?.invalidatedBy),covered=new Set(research.map(r=>clean(recordValue(r,'SOURCE_ID')||r?.relationships?.SOURCE_ID)).filter(Boolean));for(const src of sources){const sid=recordId(src,'sources');if(sid&&!covered.has(sid))fail('Stage 04 cannot be generated because Stage 03 has not researched every current Stage 02 source.');}const d=three?.agentData||three?.acceptedData||{};if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED)))fail('Stage 04 cannot be generated until Stage 03 confirms all controlling sources were examined.');if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED)))fail('Stage 04 cannot be generated until Stage 03 completes the second conflict and exception pass.');if(['TRUE','YES','FOUND','DETECTED'].includes(upper(d.NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS)))fail('Stage 04 cannot be generated while the latest Stage 03 pass found a new material requirement category.');}return true;}"
          new2="function assertStage4UpstreamExhausted(state){const fail=reason=>{const error=new Error(reason);error.code='STAGE4_UPSTREAM_INCOMPLETE';throw error;},one=state?.stages?.[1],two=state?.stages?.[2],three=state?.stages?.[3],scope=scopeFor(4,state);if(String(one?.status||'').toUpperCase()!=='COMPLETE'||one?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 01 human-authority intake is complete.');const intake=workflow.evaluateIntakeAccounting(state);if(!intake.complete)fail('Stage 04 cannot be generated because Stage 01 controlled-input accounting is incomplete: '+intake.reasons.join('; '));if(String(two?.status||'').toUpperCase()!=='COMPLETE'||two?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 02 source inventory is complete.');if(String(three?.status||'').toUpperCase()!=='COMPLETE'||three?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 03 research is complete.');const noSource=upper(two?.agentData?.SOURCE_APPLICABILITY_DETERMINATION||two?.acceptedData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE';if(!noSource){const sources=selectedContextRecords(state,'sources',scope),research=selectedContextRecords(state,'research',scope),covered=new Set(research.map(r=>clean(recordValue(r,'SOURCE_ID')||r?.relationships?.SOURCE_ID)).filter(Boolean));for(const src of sources){const sid=recordId(src,'sources');if(sid&&!covered.has(sid))fail('Stage 04 cannot be generated because Stage 03 has not researched every current Stage 02 source.');}const d=three?.agentData||three?.acceptedData||{};if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED)))fail('Stage 04 cannot be generated until Stage 03 confirms all controlling sources were examined.');if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED)))fail('Stage 04 cannot be generated until Stage 03 completes the second conflict and exception pass.');if(['TRUE','YES','FOUND','DETECTED'].includes(upper(d.NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS)))fail('Stage 04 cannot be generated while the latest Stage 03 pass found new material; Stage 03 must repeat the complete pass until saturation.');}return true;}"
          if old2 not in s: raise SystemExit('Stage 4 prerequisite function did not match expected current source')
          s=s.replace(old2,new2)
          s=s.replace('${show(stage4ExhaustedInputs(state))}','${show(stage4ExhaustedInputs(state,scope))}')
          s=s.replace('stage4ExhaustedInputs:stage===4?stage4ExhaustedInputs(state):null','stage4ExhaustedInputs:stage===4?stage4ExhaustedInputs(state,scope):null')
          s=s.replace('contextRecordsFor(state,collection,scope,batchPlan,stage).map(record=>','contextRecordsFor(state,collection,scope,batchPlan,stage,operation).map(record=>')
          p.write_text(s)
          for name in ['index.html','app-core.js','test-runtime.js']:
              q=Path(name)
              t=q.read_text().replace('runtime-20260830-live-operator-59','runtime-20260830-live-operator-60')
              q.write_text(t)
          Path('.github/workflows/apply-prompt-context-fix.yml').unlink()
          PY
          node --check prompt-engine.js
          node --check app-core.js
          node --check test-runtime.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js index.html app-core.js test-runtime.js .github/workflows/apply-prompt-context-fix.yml
          git commit -m "Complete one-time intent carry-forward and Stage 4 scope"
          git push origin HEAD:fix/complete-closed-loop-spec-20260831
