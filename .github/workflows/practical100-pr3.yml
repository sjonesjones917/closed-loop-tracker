name: Practical 100 PR3 transformation
on:
  push:
    branches: [practical-100/pr3-ingestion-transactions]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Repair transformer matcher
        run: node .pr3-transformer-fix.mjs
      - name: Transform ingestion and transaction rules
        run: node .practical100-pr3.mjs
      - name: Apply PR3 prompt-regeneration and verifier corrections
        shell: python
        run: |
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          old="const d=core.STAGES[stage-1],existing=(state?.projectData?.generatedPrompts||[]).filter(x=>Number(x.stage)===stage&&!x.invalidatedBy);"
          new="const d=core.STAGES[stage-1],existing=(state?.projectData?.generatedPrompts||[]).filter(x=>Number(x.stage)===stage),activeExisting=existing.filter(x=>!x.invalidatedBy);"
          assert old in s
          s=s.replace(old,new,1)
          old="const same=existing.find(x=>x.contextSignature===contextSignature&&x.bodySha256===bodySha256&&x.contractSha256===contractSha256&&x.operation===operation);"
          new="const same=activeExisting.find(x=>x.contextSignature===contextSignature&&x.bodySha256===bodySha256&&x.contractSha256===contractSha256&&x.operation===operation);"
          assert old in s
          p.write_text(s.replace(old,new,1))
          p=Path('build-test-project.mjs')
          s=p.read_text()
          assert 'ACCEPTED_CANONICAL_CHANGE' in s
          p.write_text(s.replace('ACCEPTED_CANONICAL_CHANGE','ACCEPTED_DATA_CHANGE'))
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="if(second.validation.valid||!second.validation.issues.some(x=>x.code==='DUPLICATE_RESPONSE'))throw new Error('Duplicate response was not rejected.');"
          new="if(!second.duplicate||second.rawRecord.rawResponseId!==first.rawRecord.rawResponseId||second.receipt.receiptId!==first.receipt.receiptId)throw new Error('Duplicate canonical envelope did not return the existing response and receipt.');"
          assert old in s
          p.write_text(s.replace(old,new,1))
      - name: Syntax
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check prompt-engine.js
          node --check verify-ingestion.mjs
          node --check build-test-project.mjs
      - name: Deterministic verification
        run: |
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Commit verified PR3 source only
        run: |
          rm .practical100-pr3.mjs .pr3-transformer-fix.mjs .github/workflows/practical100-pr3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 3: complete ingestion clarification and transaction rules"
          git push origin HEAD:practical-100/pr3-ingestion-transactions
