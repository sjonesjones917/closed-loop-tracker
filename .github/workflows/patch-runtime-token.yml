name: Patch runtime bundle token
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
concurrency:
  group: patch-runtime-token
  cancel-in-progress: false
jobs:
  patch:
    if: github.event.head_commit.message == 'Patch runtime bundle token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
      - name: Bind runtime token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text()
          old='controlling-v3-20260830'
          new='runtime-213fd62c4856d307'
          count=t.count(old)
          if count != 9: raise SystemExit(f'expected 9 runtime tokens, found {count}')
          p.write_text(t.replace(old,new))
          PY
          grep -F "height:clamp(260px,45vh,520px)" index.html
          grep -F ".expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}" index.html
          git config user.name closed-loop-patcher
          git config user.email closed-loop-patcher@users.noreply.github.com
          git add index.html
          git commit -m "Bind runtime cache identity to exact source bundle"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
