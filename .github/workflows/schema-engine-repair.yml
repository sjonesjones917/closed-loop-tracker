name: One-time schema and engine owner integration
on:
  push:
    branches: [fix/controlling-amendment-53-70]
permissions:
  contents: write
jobs:
  integrate-and-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/controlling-amendment-53-70
          fetch-depth: 0
      - name: Integrate owner-layer correction
        shell: bash
        run: |
          set -euo pipefail
          node repair-schema-engine.mjs
          node --check workflow-schema.js
          node --check workflow-engine.js
          node verify-spec3-contract.mjs
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs
      - name: Remove one-time repair files and commit production owners
        shell: bash
        run: |
          set -euo pipefail
          rm repair-schema-engine.mjs .github/workflows/schema-engine-repair.yml
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add workflow-schema.js workflow-engine.js repair-schema-engine.mjs .github/workflows/schema-engine-repair.yml
          git commit -m "Correct amendment scope and operation contracts"
          git push origin HEAD:fix/controlling-amendment-53-70
