name: Apply Stage 01 missing-bytes rule

on:
  push:
    branches:
      - fix/stage01-missing-bytes-rule
    paths:
      - .github/workflows/apply-stage01-missing-bytes-rule.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          p=Path('prompt-engine.js')
          s=p.read_text()
          old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/16';"
          assert old in s
          s=s.replace(old,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/17';",1)
          anchor='Before Stage 01 submission verify: objective/deliverable defined; supplied materials identified without doing Stage 02 inventory work; every foreseeable human-only item was already supplied, answered conversationally, or explicitly marked unknown/deferred by the human; no later-stage research or drafting was performed; then choose the final response type.'
          replacement=anchor+'\nIf a material is named in SUPPLIED_MATERIALS_INVENTORY but its bytes are not available in the executing context, keep that material in INPUT_SET_CONTENTS. Do not ask the human to describe or re-enter its contents during Stage 01. Record byte unavailability as a nonblocking Stage 01 condition unless the missing bytes prevent identification of the objective or intended deliverable, and never infer substantive facts merely from the filename.'
          assert anchor in s
          s=s.replace(anchor,replacement,1)
          p.write_text(s)

          p=Path('verify-prompt-semantics.mjs')
          s=p.read_text()
          anchor="if(!record.prompt.includes('MANDATORY STAGE 01 HUMAN-INTAKE GATE')||!record.prompt.includes('BLOCKING_NOW')||!record.prompt.includes('ASK_NOW_NONBLOCKING')||!record.prompt.includes('LATER_RESOLVABLE')||!record.prompt.includes('Nonblocking means the human may defer; it does not mean the agent may skip the question')||!record.prompt.includes('intended jurisdiction(s)')||!record.prompt.includes('additional human-controlled invention materials exist'))issues.push('STAGE01_PROACTIVE_HUMAN_INTAKE_GATE_MISSING');"
          replacement=anchor+"\n    if(!record.prompt.includes('If a material is named in SUPPLIED_MATERIALS_INVENTORY but its bytes are not available')||!record.prompt.includes('Do not ask the human to describe or re-enter its contents during Stage 01')||!record.prompt.includes('never infer substantive facts merely from the filename'))issues.push('STAGE01_MISSING_SUPPLIED_BYTES_RULE_MISSING');"
          assert anchor in s
          s=s.replace(anchor,replacement,1)
          p.write_text(s)

          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for file in runtime_files:
              data=Path(file).read_bytes()
              blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              manifest+=f'{file}:{blob}\n'
          runtime_id='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p=Path('index.html')
          s=p.read_text()
          ids=set(re.findall(r'runtime-[A-Za-z0-9]+',s))
          assert len(ids)==1,ids
          s=s.replace(next(iter(ids)),runtime_id)
          p.write_text(s)
          PY
      - name: Verify complete application
        run: |
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          node verify-browser.mjs
      - name: Commit verified patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-stage01-missing-bytes-rule.yml
          git config user.name "closed-loop patch"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-engine.js verify-prompt-semantics.mjs index.html .github/workflows/apply-stage01-missing-bytes-rule.yml
          git commit -m "Define unavailable supplied-material handling in Stage 01"
          git push origin HEAD:fix/stage01-missing-bytes-rule
