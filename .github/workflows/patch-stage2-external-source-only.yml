name: patch-stage-help-artifact-handoff
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stage-aware artifact handoff guidance
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {createHash}=require('node:crypto');
          function mustReplace(text,oldValue,newValue,label){
            if(!text.includes(oldValue))throw new Error(`Missing expected ${label}`);
            return text.replace(oldValue,newValue);
          }

          let app=fs.readFileSync('app-core.js','utf8');
          const workflowAnchor='function workflow(){const n=current.activeStage,d=core.STAGES[n-1]';
          const helper=String.raw`function suppliedMaterialInventory(){const value=String(current.job.SUPPLIED_MATERIALS_INVENTORY||'').trim();return value&&!['UNKNOWN','NONE','NOT APPLICABLE'].includes(value.toUpperCase())?value:'';}
          function stageArtifactGuidance(n){const inventory=suppliedMaterialInventory(),sameChat=' If those exact files are already attached and still accessible in the same ChatGPT conversation, do not upload duplicate copies.';if(n===1&&inventory)return \`<div class="notice"><strong>Files to include when they are needed to understand your request:</strong> attach the human-supplied project material listed below with the Stage 01 instruction.\${sameChat}<div class="record-value" style="margin-top:6px">\${esc(inventory)}</div></div>\`;if(n===2)return \`<div class="notice"><strong>Required with the Stage 02 instruction:</strong> attach the actual human-supplied project artifact(s) listed under <em>Project → Supplied materials / files</em>. Stage 02 must inspect the real material; the generated prompt carries the inventory text, not the file bytes.\${sameChat}\${inventory?\`<div class="record-value" style="margin-top:6px">\${esc(inventory)}</div>\`:''}</div>\`;if(n===3)return '<div class="notice"><strong>Files to include only when applicable:</strong> attach any accepted Stage 02 source artifact that is file-backed and cannot be retrieved by ChatGPT from its cited URL/reference. Do not automatically reattach the original project packet unless the current Stage 02 source set explicitly requires that file.</div>';if(n===10)return '<div class="notice"><strong>Required with the instruction:</strong> make the exact candidate files/folder being reviewed available to ChatGPT. Candidate IDs, filenames, sizes, and hashes do not give the agent the file contents.</div>';if(n===11)return '<div class="notice"><strong>Required with each run instruction:</strong> make the exact frozen candidate package available to that execution context. Every run must receive the identical candidate bytes.</div>';if(n===12)return '<div class="notice"><strong>Required when the current tests use files:</strong> make the exact run output artifacts being verified and every file/fixture required by the current TEST ARTIFACT_REQUIREMENTS available to the verifier. Metadata or a claimed hash is not a substitute for the bytes.</div>';if(n===17){const op=selectedOperation(17),byOp={FREEZE:'the exact corrected candidate files/folder being frozen',EXECUTE_RUN:'the exact corrected frozen candidate package',VERIFY:'the exact corrected run output artifacts plus every test artifact required by the current verification records',COMPARE:'the exact corrected run output artifacts when comparison depends on file content',ROOT_CAUSE:'the exact file-backed defect evidence needed for the selected root-cause investigation',REGRESSION:'the exact regression fixture/input and corrected output artifacts required by the selected regression execution',CORRECT:'the exact file-backed component(s) at the responsible layer that the correction must change'};return byOp[op]?\`<div class="notice"><strong>Required for \${esc(op.replaceAll('_',' '))}:</strong> make \${esc(byOp[op])} available to ChatGPT with this instruction.</div>\`:'';}if(n===19)return '<div class="notice"><strong>Required for unchanged confirmation:</strong> make the exact converged candidate package available to ChatGPT. For VERIFY, COMPARE, or REGRESSION VERIFY operations, also provide the exact run/test artifacts required by that operation.</div>';if(n===20)return '<div class="notice"><strong>Required with the instruction:</strong> make the exact proposed production-baseline files/package available to ChatGPT for inspection.</div>';if(n===21)return '<div class="notice"><strong>Required with the instruction:</strong> make the exact approved baseline inputs/package available to the production agent. The baseline identity and hashes in the prompt do not supply the underlying file contents.</div>';if([22,23,24,25].includes(n))return \`<div class="notice"><strong>Required with the instruction:</strong> make the exact finished-product artifact(s) available to the \${n===22?'deterministic verifier':n===23?'independent meaning reviewer':n===24?'adversarial verifier':'representation inspector'}. Stage \${String(n).padStart(2,'0')} is evaluating the actual delivered representation, not only its metadata.</div>\`;return '';}
          function stageHelpMarkup(n){const artifact=stageArtifactGuidance(n);return \`<details><summary><b>?</b> How to use this stage</summary><div class="help-body">\${artifact}<ol><li><strong>Send the current instruction to ChatGPT.</strong> Keep using the same chat for this stage.</li><li><strong>Include any stage-required files shown above with the instruction.</strong> If no file notice is shown, do not attach unrelated artifacts just because they exist.</li><li><strong>Answer the agent normally.</strong> It should ask concise human-only questions in chat and wait for your answer when needed.</li><li><strong>Paste only the final JSON into this app</strong>, then tap <em>Parse / validate response</em> and review the proposal before accepting it.</li></ol><p>If later research or verification reveals a new human-only decision, the agent may ask you then. If you replace a rejected response, tap <em>Parse / validate response</em> again; the replacement is not evaluated merely by pasting it.</p></div></details>\`;}
          `;
          if(!app.includes(workflowAnchor))throw new Error('Missing workflow anchor');
          app=app.replace(workflowAnchor,helper+workflowAnchor);
          app=mustReplace(app,'<div class="panel"><h2 class="section-title">Agent loop</h2><div class="operator-loop" aria-label="Normal stage workflow"><div class="operator-step"><b>1</b><span>Send instruction</span></div><div class="operator-step"><b>2</b><span>Answer agent questions</span></div><div class="operator-step"><b>3</b><span>Paste final JSON</span></div><div class="operator-step"><b>4</b><span>Validate and review</span></div></div></div>','','redundant Agent loop panel');
          app=mustReplace(app,"function render(){if(!current)return;header();$('#screen').innerHTML=({Overview:overview,Project:projectView,Workflow:workflow,Records:records,Files:files,Release:release}[current.activeView]||overview)();wire();}","function render(){if(!current)return;header();const stageHelp=$('#stage-help');if(stageHelp){stageHelp.hidden=false;stageHelp.innerHTML=stageHelpMarkup(current.activeStage);}$('#screen').innerHTML=({Overview:overview,Project:projectView,Workflow:workflow,Records:records,Files:files,Release:release}[current.activeView]||overview)();wire();}",'dynamic stage help render');
          fs.writeFileSync('app-core.js',app);

          let index=fs.readFileSync('index.html','utf8');
          const oldHelp='<div class="app-help"><details><summary><b>?</b> How to use this stage</summary><div class="help-body"><ol><li><strong>Copy or send the current instruction to ChatGPT.</strong> Keep using the same chat for that stage.</li><li><strong>Answer the agent normally.</strong> If it needs information only you can provide, it should ask short plain-language questions in ChatGPT and wait for your answer. Keep talking there until it says the stage is ready for the final JSON. Do not paste the conversation into this app.</li><li><strong>Wait for the final JSON.</strong> When the agent has enough information, it should return one JSON object with no extra prose.</li><li><strong>Paste only that final JSON into the response box</strong>, then tap <em>Parse / validate response</em>. Review the proposed change before accepting it.</li></ol><p>If research or requirements reveal a new human-only decision later, the agent may ask you then. That is expected; it must not guess. After you replace a rejected response, the status changes to <strong>Replacement not evaluated</strong> until you tap <em>Parse / validate response</em> again.</p></div></details></div>';
          index=mustReplace(index,oldHelp,'<div class="app-help" id="stage-help"></div>','static stage help');
          fs.writeFileSync('index.html',index);

          let prompt=fs.readFileSync('prompt-engine.js','utf8');
          const versionMatch=prompt.match(/const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine\/(\d+)'/);
          if(!versionMatch)throw new Error('Missing prompt engine version');
          prompt=prompt.replace(versionMatch[0],`const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/${Number(versionMatch[1])+1}'`);
          prompt=mustReplace(prompt,
            "2:'Build the complete source and supplied-material inventory for this current job only. Stage 02 owns inventory and inspection: enumerate human-supplied files, links, references, records, and other materials without treating them as automatically independent governing authority, and discover independent external sources only where the job actually needs them.",
            "2:'Build the complete source and supplied-material inventory for this current job only. Before inventory or inspection, confirm that every human-supplied file or other material named for this job that Stage 02 must inspect is actually available in the executing ChatGPT context. A filename, inventory entry, hash, or prior mention is not the file itself. If a required supplied material is missing, ask the human conversationally to attach that exact material and do not finalize Stage 02 until it is available or the stage is correctly blocked. Stage 02 owns inventory and inspection: enumerate human-supplied files, links, references, records, and other materials without treating them as automatically independent governing authority, and discover independent external sources only where the job actually needs them.",
            'Stage 02 supplied-material byte handoff');
          fs.writeFileSync('prompt-engine.js',prompt);

          let browser=fs.readFileSync('verify-browser.mjs','utf8');
          browser=mustReplace(browser,
            "for(const token of ['Independent external sources only.','closed-loop-stage-response/2','PROMPT IDENTITY','Parse / validate response','Send instruction','Answer agent questions','Paste final JSON','Validate and review','Expand preview','exact controlling copy block','Complete JSON only'])",
            "for(const token of ['Independent external sources only.','closed-loop-stage-response/2','PROMPT IDENTITY','Parse / validate response','Required with the Stage 02 instruction:','Supplied materials / files','generated prompt carries the inventory text, not the file bytes','Expand preview','exact controlling copy block','Complete JSON only'])",
            'Stage 02 browser guidance assertions');
          browser=mustReplace(browser,
            "for(const token of ['Stage 01 is an intake conversation','remaining human-only questions in normal chat','COPY BLOCK — STAGE 01 — INITIALIZE THE JOB','HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE','Answer agent questions','Paste final JSON'])",
            "for(const token of ['Stage 01 is an intake conversation','remaining human-only questions in normal chat','COPY BLOCK — STAGE 01 — INITIALIZE THE JOB','HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE','How to use this stage','Paste only the final JSON'])",
            'Stage 01 browser guidance assertions');
          browser=mustReplace(browser,
            "assert(await evalValue(cdp,`(()=>{const n=document.querySelector('#generated-prompt');return Boolean(n&&n.scrollHeight>n.clientHeight+1);})()`),'Compact prompt preview is not actually bounded.');",
            "assert(!text.includes('Agent loop'),'Redundant Agent loop panel is still rendered.');assert(await evalValue(cdp,`(()=>{const n=document.querySelector('#generated-prompt');return Boolean(n&&n.scrollHeight>n.clientHeight+1);})()`),'Compact prompt preview is not actually bounded.');",
            'Agent loop browser absence assertion');
          fs.writeFileSync('verify-browser.mjs',browser);

          let semantics=fs.readFileSync('verify-prompt-semantics.mjs','utf8');
          semantics=mustReplace(semantics,
            "if(!ui.includes('Stage 01 is an intake conversation')||!ui.includes('remaining human-only questions in normal chat')||!ui.includes('HUMAN_INPUT_REQUIRED in this app is only a fallback')||!ui.includes('Answer agent questions')||!ui.includes('Paste final JSON'))throw new Error('Stage 01 operator UI does not explain the human conversation and final JSON handoff.');",
            "if(!ui.includes('Stage 01 is an intake conversation')||!ui.includes('remaining human-only questions in normal chat')||!ui.includes('HUMAN_INPUT_REQUIRED in this app is only a fallback')||!ui.includes('stageHelpMarkup')||!ui.includes('Required with the Stage 02 instruction:')||!ui.includes('generated prompt carries the inventory text, not the file bytes')||!ui.includes('Paste only the final JSON'))throw new Error('Stage help does not explain the human conversation, required artifact handoff, and final JSON boundary.');\n if(ui.includes('Agent loop</h2>')||ui.includes('class=\"operator-loop\"'))throw new Error('Redundant Agent loop panel still exists.');",
            'stage help semantic assertions');
          semantics=mustReplace(semantics,
            "if(record.stage===2){\n    if(!record.prompt.includes('DESIRED OR SUGGESTED SOURCE COUNT'))issues.push('SOURCE_COUNT_MISSING');",
            "if(record.stage===2){\n    if(!record.prompt.includes('A filename, inventory entry, hash, or prior mention is not the file itself')||!record.prompt.includes('ask the human conversationally to attach that exact material'))issues.push('STAGE02_SUPPLIED_MATERIAL_HANDOFF_MISSING');\n    if(!record.prompt.includes('DESIRED OR SUGGESTED SOURCE COUNT'))issues.push('SOURCE_COUNT_MISSING');",
            'Stage 02 prompt handoff semantic assertion');
          fs.writeFileSync('verify-prompt-semantics.mjs',semantics);

          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          index=fs.readFileSync('index.html','utf8').replace(/runtime-[0-9a-f]+/g,token);
          fs.writeFileSync('index.html',index);
          console.log({token});
          NODE
      - name: Remove stale patch workflow
        run: git rm .github/workflows/patch-stage2-external-source-only.yml
      - name: Verify complete application
        run: |
          node --check app-core.js
          node --check prompt-engine.js
          node --check verify-browser.mjs
          node --check verify-prompt-semantics.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-core.js index.html prompt-engine.js verify-browser.mjs verify-prompt-semantics.mjs .github/workflows/patch-stage2-external-source-only.yml
          git commit -m 'Make stage help name required agent artifacts'
          git push origin HEAD:main
