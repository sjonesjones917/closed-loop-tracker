name: Patch direct collapse anchor

on:
  push:
    branches: [collapse-direct-handler]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collapse-direct-handler
      - name: Patch collapse handler and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app-core.js')
          text = app.read_text()
          old = "if($('#toggle-prompt'))$('#toggle-prompt').onclick=()=>{const node=$('#generated-prompt'),button=$('#toggle-prompt'),expanded=node?.classList.toggle('expanded');if(button){button.textContent=expanded?'Collapse preview':'Expand preview';button.setAttribute('aria-expanded',String(Boolean(expanded)));}if(expanded)node?.focus();};"
          new = "if($('#toggle-prompt'))$('#toggle-prompt').onclick=()=>{const node=$('#generated-prompt'),button=$('#toggle-prompt'),wasExpanded=Boolean(node?.classList.contains('expanded')),expanded=node?.classList.toggle('expanded');if(button){button.textContent=expanded?'Collapse preview':'Expand preview';button.setAttribute('aria-expanded',String(Boolean(expanded)));}if(expanded)node?.focus();else if(wasExpanded)requestAnimationFrame(()=>requestAnimationFrame(()=>button?.scrollIntoView({block:'end',inline:'nearest'})));};"
          if text.count(old) != 1:
              raise SystemExit(f'expected one toggle handler, found {text.count(old)}')
          app.write_text(text.replace(old, new))

          test = Path('verify-browser.mjs')
          text = test.read_text()
          old = "await click(cdp,'#toggle-prompt');assert(await evalValue(cdp,`(()=>{const n=document.querySelector('#generated-prompt'),b=document.querySelector('#toggle-prompt');return Boolean(n?.classList.contains('expanded')&&b?.getAttribute('aria-expanded')==='true'&&n.scrollHeight<=n.clientHeight+1);})()`),'Prompt preview did not expand to reveal the full instruction accessibly.');await click(cdp,'#toggle-prompt');assert(await evalValue(cdp,`(()=>{const n=document.querySelector('#generated-prompt');return Boolean(n&&!n.classList.contains('expanded')&&n.scrollHeight>n.clientHeight+1);})()`),'Prompt preview did not return to the bounded compact state.');"
          new = "await click(cdp,'#toggle-prompt');assert(await evalValue(cdp,`(()=>{const n=document.querySelector('#generated-prompt'),b=document.querySelector('#toggle-prompt');return Boolean(n?.classList.contains('expanded')&&b?.getAttribute('aria-expanded')==='true'&&n.scrollHeight<=n.clientHeight+1);})()`),'Prompt preview did not expand to reveal the full instruction accessibly.');await evalValue(cdp,`(()=>{document.querySelector('#toggle-prompt')?.scrollIntoView({block:'end'});return true})()`);await sleep(120);await click(cdp,'#toggle-prompt');assert(await evalValue(cdp,`(()=>{const n=document.querySelector('#generated-prompt');return Boolean(n&&!n.classList.contains('expanded')&&n.scrollHeight>n.clientHeight+1);})()`),'Prompt preview did not return to the bounded compact state.');const collapsedAnchor=await evalValue(cdp,`(()=>{const t=document.querySelector('#generated-prompt')?.parentElement?.querySelector('.prompt-toolbar');if(!t)return null;const r=t.getBoundingClientRect();return {toolbarBottom:r.bottom,viewportBottom:innerHeight,pageBottom:scrollY+innerHeight,documentBottom:document.documentElement.scrollHeight};})()`);assert(collapsedAnchor&&Math.abs(collapsedAnchor.toolbarBottom-collapsedAnchor.viewportBottom)<=8,`Collapsed prompt end was not anchored to the viewport: ${JSON.stringify(collapsedAnchor)}`);assert(collapsedAnchor.pageBottom<collapsedAnchor.documentBottom-20,`Collapse left the viewport at the page bottom instead of the message end: ${JSON.stringify(collapsedAnchor)}`);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one prompt toggle regression block, found {text.count(old)}')
          test.write_text(text.replace(old, new))
          PY

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const identity=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          const html=fs.readFileSync('index.html','utf8').replace(/runtime-[0-9a-f]{16}/g,identity);
          fs.writeFileSync('index.html',html);
          console.log(identity);
          NODE

          node --check app-core.js
          node --check verify-browser.mjs
          node verify-hash.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-core.js verify-browser.mjs index.html
          git commit -m 'Anchor collapse in direct toggle handler'
          git push origin HEAD:collapse-direct-handler
