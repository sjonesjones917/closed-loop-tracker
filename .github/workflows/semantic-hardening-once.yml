name: One-time semantic clarification and migration hardening
on:
  push:
    branches: [reliability/semantic-clarification-migration-20260826]
permissions:
  contents: write
jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/semantic-clarification-migration-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact semantic corrections
        run: node .github/apply-semantic-hardening.mjs
      - name: Verify deterministic contracts
        run: |
          node --check response-ingestion.js
          node --check app-core.js
          node --check workbook.js
          node --check workflow-engine.js
          node --check verify-ingestion.mjs
          node --check verify.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Verify Chromium operator workflows
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/semantic-hardening-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove one-time machinery and commit verified source
        run: |
          rm -f .github/apply-semantic-hardening.mjs .github/workflows/semantic-hardening-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden clarification and migration semantics"
          git push origin HEAD:reliability/semantic-clarification-migration-20260826
