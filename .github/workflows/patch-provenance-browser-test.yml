name: Patch provenance browser regression on branch
on:
  push:
    branches:
      - fix/provenance-collapse-scroll-20260828
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provenance-collapse-scroll-20260828
          fetch-depth: 0
      - name: Update provenance browser acceptance to match compact disclosure
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('verify-browser.mjs')
          s = p.read_text()
          old = ''' // Provenance is intentionally split into compact per-value trace cards instead of one giant disclosure.\n const provenanceCards=await evalValue(cdp,`(()=>{const panel=[...document.querySelectorAll('.panel')].find(node=>node.querySelector(':scope > .section-title')?.textContent.trim()==='Provenance navigation'),cards=[...(panel?.querySelectorAll(':scope > details.provenance-trace')||[])];if(!cards.length)return null;cards[0].open=true;const text=cards[0].innerText;return {count:cards.length,hasPointer:text.includes('Extraction manifest and response pointer'),hasRaw:text.includes('Preserved raw response'),hasPrompt:text.includes('Controlling prompt'),hasEvidence:text.includes('Canonical evidence'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth};})()`);assert(provenanceCards&&provenanceCards.count>8&&provenanceCards.hasPointer&&provenanceCards.hasRaw&&provenanceCards.hasPrompt&&provenanceCards.hasEvidence&&!provenanceCards.overflow,`Compact provenance trace cards are incomplete or overflow: ${JSON.stringify(provenanceCards)}`);'''
          new = ''' // Provenance uses the same compact retractable long-section control as the rest of the interface.\n const provenanceCollapsed=await evalValue(cdp,`(()=>{const section=document.querySelector('#provenance-navigation'),cards=[...(section?.querySelectorAll(':scope > .record-body > details.provenance-trace')||[])];return section?{tag:section.tagName,open:section.open,count:cards.length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth}:null;})()`);assert(provenanceCollapsed&&provenanceCollapsed.tag==='DETAILS'&&!provenanceCollapsed.open&&provenanceCollapsed.count>8&&!provenanceCollapsed.overflow,`Provenance navigation is not compact and retracted by default: ${JSON.stringify(provenanceCollapsed)}`);\n const provenanceJump=await evalValue(cdp,`Boolean(document.querySelector('[data-jump-provenance]'))`);assert(provenanceJump,'View exact evidence / provenance action is missing.');await click(cdp,'[data-jump-provenance]');await waitExpr(cdp,`document.querySelector('#provenance-navigation')?.open===true`);const firstTrace='#provenance-navigation > .record-body > details.provenance-trace:first-of-type';await click(cdp,firstTrace+'>summary');const provenanceCards=await evalValue(cdp,`(()=>{const section=document.querySelector('#provenance-navigation'),cards=[...(section?.querySelectorAll(':scope > .record-body > details.provenance-trace')||[])],text=cards[0]?.innerText||'';return {count:cards.length,hasPointer:text.includes('Extraction manifest and response pointer'),hasRaw:text.includes('Preserved raw response'),hasPrompt:text.includes('Controlling prompt'),hasEvidence:text.includes('Canonical evidence'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth};})()`);assert(provenanceCards&&provenanceCards.count>8&&provenanceCards.hasPointer&&provenanceCards.hasRaw&&provenanceCards.hasPrompt&&provenanceCards.hasEvidence&&!provenanceCards.overflow,`Compact provenance trace cards are incomplete or overflow: ${JSON.stringify(provenanceCards)}`);await click(cdp,firstTrace+'>summary');await positionNode(cdp,'#provenance-navigation','center');await waitExpr(cdp,`(()=>{const section=document.querySelector('#provenance-navigation'),top=document.querySelector('#section-top-jump'),bottom=document.querySelector('#section-bottom-jump');return Boolean(section?.open&&section.getBoundingClientRect().height>innerHeight&&top&&!top.hidden&&bottom&&!bottom.hidden);})()`);await click(cdp,'#provenance-navigation>summary');await waitExpr(cdp,`(()=>{const section=document.querySelector('#provenance-navigation'),top=document.querySelector('#section-top-jump'),bottom=document.querySelector('#section-bottom-jump');return Boolean(section&&!section.open&&top?.hidden&&bottom?.hidden);})()`);'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected provenance browser regression block was not found')
          p.write_text(s)
          PY
          node --check verify-browser.mjs
          if git diff --quiet -- verify-browser.mjs; then
            echo "Browser regression already current; nothing to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser.mjs
          git commit -m "Test retractable provenance navigation"
          git push origin HEAD:fix/provenance-collapse-scroll-20260828
