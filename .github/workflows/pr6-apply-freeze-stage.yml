name: PR6 apply stage-aware freeze
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact engine correction
        run: |
          python .pr6-freeze-stage.py
          rm -f .pr6-freeze-stage.py .github/workflows/pr6-apply-freeze-stage.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Allow candidate freeze at repeated iteration stages'
          git push
