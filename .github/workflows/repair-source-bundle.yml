name: Repair source bundle
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact pull-request source
        run: tar --exclude=.git -czf /tmp/closed-loop-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-source
          path: /tmp/closed-loop-source.tgz
          if-no-files-found: error
          retention-days: 1
