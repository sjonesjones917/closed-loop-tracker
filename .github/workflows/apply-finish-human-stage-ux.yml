name: Apply final human-stage UX repair

on:
  push:
    branches:
      - fix/finish-human-stage-ux

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[finish-human-stage-applied]') && !contains(github.event.head_commit.message, '[finish-human-stage-debug]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair and run complete verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-browser.mjs')
          text=path.read_text(encoding='utf-8')
          replacements=[
              ("'Complete JSON only'", "'Final JSON only'", 'stale final-JSON label assertion'),
              (
                  "await click(cdp,'[data-view=\"Project\"]');text=(await snapshot(cdp)).text;for(const token of ['You do not need to know the final file format in advance','Stage 01 determines the actual artifact set and suitable formats','A specification substitute requires human confirmation'])",
                  "await click(cdp,'[data-view=\"Project\"]');await click(cdp,'details.record-card summary');text=(await snapshot(cdp)).text;for(const token of ['You do not need to know the final file format in advance','Stage 01 determines the actual artifact set and suitable formats','A specification substitute requires human confirmation'])",
                  'collapsed project-help browser assertion'
              ),
          ]
          for before,after,label in replacements:
              if before not in text:
                  raise SystemExit(f'Expected {label} was not found.')
              text=text.replace(before,after)
          path.write_text(text,encoding='utf-8')
          PY
          run_checks() {
            node build-test-project.mjs || return $?
            node --check workbook.js || return $?
            node --check hash.js || return $?
            node --check workflow-schema.js || return $?
            node --check workflow-engine.js || return $?
            node --check prompt-engine.js || return $?
            node --check response-ingestion.js || return $?
            node --check project-store.js || return $?
            node --check app-core.js || return $?
            node --check test-fixtures.mjs || return $?
            node --check verify.mjs || return $?
            node --check verify-ingestion.mjs || return $?
            node --check verify-complete.mjs || return $?
            node --check verify-full-cycle.mjs || return $?
            node --check verify-prompt-semantics.mjs || return $?
            node --check verify-live.mjs || return $?
            node --check verify-browser.mjs || return $?
            node --check verify-browser-extra.mjs || return $?
            node verify.mjs || return $?
            node verify-ingestion.mjs || return $?
            node verify-complete.mjs || return $?
            node verify-prompt-semantics.mjs || return $?
            node verify-full-cycle.mjs || return $?
            python3 -m http.server 4173 > /tmp/closed-loop-http.log 2>&1 &
            server_pid=$!
            trap 'kill $server_pid 2>/dev/null || true' RETURN
            PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs || return $?
            PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs || return $?
            kill $server_pid 2>/dev/null || true
            trap - RETURN
          }
          set +e
          node .maintenance-finish-human-stage-ux.mjs > .maintenance-finish-human-stage-ux.log 2>&1
          status=$?
          if [ "$status" = "0" ]; then
            run_checks >> .maintenance-finish-human-stage-ux.log 2>&1
            status=$?
          fi
          set -e
          printf '%s\n' "$status" > .maintenance-finish-human-stage-ux.exit
      - name: Commit verified repair or diagnostic state
        run: |
          status=$(cat .maintenance-finish-human-stage-ux.exit)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" = "0" ]; then
            rm .maintenance-finish-human-stage-ux.mjs .github/workflows/apply-finish-human-stage-ux.yml .maintenance-finish-human-stage-ux.log .maintenance-finish-human-stage-ux.exit
            git add -A
            git commit -m "Finish human-first stage prompts and stale-response UX [finish-human-stage-applied]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            cp .maintenance-finish-human-stage-ux.log /tmp/finish-human-stage-ux.log
            cp .maintenance-finish-human-stage-ux.exit /tmp/finish-human-stage-ux.exit
            git reset --hard HEAD
            cp /tmp/finish-human-stage-ux.log .maintenance-finish-human-stage-ux.log
            cp /tmp/finish-human-stage-ux.exit .maintenance-finish-human-stage-ux.exit
            git add .maintenance-finish-human-stage-ux.log .maintenance-finish-human-stage-ux.exit
            git commit -m "Capture final human-stage UX verification failure [finish-human-stage-debug]"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$status"
          fi
