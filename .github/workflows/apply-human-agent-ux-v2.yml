name: Apply reconciled human-agent UX fix
on:
  push:
    branches: [fix/human-agent-stage-ux-v2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply asserted centralized edits
        run: |
          cat .ux-fix/apply.part1 .ux-fix/apply.part2 .ux-fix/apply.part3 .ux-fix/apply.part4 .ux-fix/apply.part5 .ux-fix/apply.part6 .ux-fix/apply.part7 > apply-ux-fix.mjs
          node --check apply-ux-fix.mjs
          node apply-ux-fix.mjs
      - name: Run the complete source and lifecycle proof
        run: |
          node build-test-project.mjs
          for file in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Run local Chromium mobile and workflow proofs
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
      - name: Commit only the product and regression changes
        run: |
          rm -rf .ux-fix apply-ux-fix.mjs .github/workflows/apply-human-agent-ux-v2.yml
          git config user.name "closed-loop-fix-bot"
          git config user.email "closed-loop-fix-bot@users.noreply.github.com"
          git add -A
          git commit -m "Clarify conversational intake and final JSON state [ux-v2-applied]"
          git push origin HEAD:fix/human-agent-stage-ux-v2
