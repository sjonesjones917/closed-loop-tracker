name: Trace stage recalculation transition
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: read
jobs:
  trace:
    if: github.event.head_commit.message == 'Trace stage recalculation transition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');globalThis.Event=class Event{};globalThis.dispatchEvent=()=>true;
          for(const f of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          console.log(closedLoopWorkflowEngine.recalculate.toString());
          NODE
