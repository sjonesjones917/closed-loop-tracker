name: Restore exact prompt geometry
on:
  push:
    branches: [fix/restore-prompt-geometry-exact-20260830]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-prompt-geometry-exact-20260830
      - name: Restore established collapsed prompt geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); old='.expandable-prompt{max-height:280px}'; new='.expandable-prompt{height:280px;max-height:280px}'
          if old not in s: raise SystemExit('prompt geometry anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restore established 280px collapsed prompt geometry"
          git rm .github/workflows/apply-prompt-geometry.yml
          git commit -m "Remove temporary geometry editor"
          git push origin HEAD:fix/restore-prompt-geometry-exact-20260830
