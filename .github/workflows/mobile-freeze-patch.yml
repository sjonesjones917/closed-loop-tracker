name: Apply mobile freeze fix
on:
  push:
    branches: [fix/mobile-freeze-20260828]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal UI performance correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app-core.js');s=p.read_text()
          s=s.replace("const operationSelection={},runSelection={};","const operationSelection={},runSelection={},promptPreviewCache=new Map();")
          old="function normalize(p){try{if(p?.stages)return ensureState(core.migrateState(p));return importSeed(p);}catch(error){const r=ensureState(core.createBlankState(p?.job?.JOB_ID||p?.jobId));r.job.JOB_TITLE=p?.title||p?.job?.JOB_TITLE||'Recovered project';r.job.CURRENT_STATE='BLOCKED';r.projectData.recoveredProjects=[{reason:String(error.message||error),quarantinedOriginalProject:clone(p),operational:false}];return r;}}"
          new="function normalize(p){try{if(p?.schema===core.SCHEMA&&p?.workflow===schema.WORKFLOW_ID&&Object.keys(p?.stages||{}).length===30)return p;if(p?.stages)return ensureState(core.migrateState(p));return importSeed(p);}catch(error){const r=ensureState(core.createBlankState(p?.job?.JOB_ID||p?.jobId));r.job.JOB_TITLE=p?.title||p?.job?.JOB_TITLE||'Recovered project';r.job.CURRENT_STATE='BLOCKED';r.projectData.recoveredProjects=[{reason:String(error.message||error),quarantinedOriginalProject:clone(p),operational:false}];return r;}}"
          if old not in s: raise SystemExit('normalize target missing')
          s=s.replace(old,new)
          old_prompt=re.compile(r"function currentStagePrompt\(n\)\{.*?\}\nfunction operationMarkup",re.S)
          new_prompt=r'''function promptPreviewKey(n){const options=promptOptions(n);return [current?.job?.JOB_ID||'',Number(current?.revision||0),n,options.operation||'COMPLETE',JSON.stringify(options.scope||{}),currentPromptEngineVersion()||'UNKNOWN'].join('|');}
function cachedStagePrompt(n){const saved=currentPromptRecord(n);if(saved?.prompt)return saved.prompt;return promptPreviewCache.get(promptPreviewKey(n))||null;}
function currentStagePrompt(n){const saved=currentPromptRecord(n);if(saved?.prompt)return saved.prompt;const key=promptPreviewKey(n),cached=promptPreviewCache.get(key);if(cached)return cached;const preview=clone(current);preview.revision=Number(current.revision||0)+1;try{const prompt=globalThis.closedLoopPromptEngine.buildPromptRecord(n,preview,promptOptions(n)).prompt;if(promptPreviewCache.size>24)promptPreviewCache.clear();promptPreviewCache.set(key,prompt);return prompt;}catch(error){if(error?.code==='MISSING_REQUIRED_PROMPT_SCOPE')return `CONTROLLING INSTRUCTION UNAVAILABLE\n\n${error.message}\n\nReserve/select the exact execution lane shown for this stage, then save or copy the instruction.`;throw error;}}
function schedulePromptPreview(n){if(current.activeView!=='Workflow'||currentPromptRecord(n)||cachedStagePrompt(n))return;const key=promptPreviewKey(n),run=()=>{if(current.activeView!=='Workflow'||current.activeStage!==n||promptPreviewKey(n)!==key)return;let prompt;try{prompt=currentStagePrompt(n);}catch(error){console.error(error);return;}if(current.activeView!=='Workflow'||current.activeStage!==n||promptPreviewKey(n)!==key)return;const node=$('#generated-prompt'),meta=$('#prompt-meta');if(node)node.textContent=prompt;if(meta)meta.textContent=`${prompt.length.toLocaleString()} characters · exact controlling copy block`;};if(typeof requestIdleCallback==='function')requestIdleCallback(run,{timeout:1500});else setTimeout(run,750);}
function operationMarkup'''
          s,n=old_prompt.subn(new_prompt,s,count=1)
          if n!=1: raise SystemExit('prompt target missing')
          prov=re.compile(r"function provenanceMarkup\(n\)\{.*?\}\nfunction workflow\(\)",re.S)
          new_prov=r'''function provenanceTraceBody(manifestId,entryIndex){const m=safe(current.projectData.extractionManifests).find(x=>String(x.manifestId||x.MANIFEST_ID||'')===String(manifestId||''));const entries=safe(m?.entries||m?.changes),e=entries[Number(entryIndex)];if(!m||!e)return '<div class="notice warn">This provenance trace is no longer current.</div>';const rawId=m.rawResponseId||m.RAW_RESPONSE_ID,promptId=m.promptId||m.PROMPT_ID,raw=safe(current.projectData.rawResponses).find(x=>x.rawResponseId===rawId),prompt=safe(current.projectData.generatedPrompts).find(x=>(x.instructionId||x.promptId)===promptId),evidence=safe(e.evidenceIds).map(id=>engine.records(current,'evidenceRecords').find(x=>engine.recordId(x,'evidenceRecords')===id)).filter(Boolean);return `<p class="section-intro">Canonical field → extraction manifest → exact response pointer → preserved raw response → controlling prompt → canonical evidence.</p>${details('Extraction manifest and response pointer',{manifestId:m.manifestId,responsePointer:e.jsonPointer||e.JSON_POINTER_IN_RESPONSE||'',rawResponseId:rawId||'NONE',promptId:promptId||'NONE',evidenceIds:e.evidenceIds||[]},true)}${raw?details('Preserved raw response',raw):'<div class="notice warn">Preserved raw response is unavailable for this trace.</div>'}${prompt?details('Controlling prompt',prompt):'<div class="notice warn">Controlling prompt is unavailable for this trace.</div>'}${evidence.length?details('Canonical evidence',evidence):'<div class="notice warn">No canonical evidence record is linked to this value.</div>'}`;}
function provenanceMarkup(n){const manifests=safe(current.projectData.extractionManifests).filter(m=>Number(m.stage)===n),cards=manifests.flatMap(m=>safe(m.entries||m.changes).map((e,index)=>{const name=`${e.canonicalCollection||e.canonicalRecordType||''}/${e.canonicalRecordId||''}/${e.canonicalField||e.canonicalRelationship||''}`,manifestId=String(m.manifestId||m.MANIFEST_ID||'');return `<details class="record-card provenance-trace" data-manifest-id="${esc(manifestId)}" data-entry-index="${index}"><summary>${esc(name)}<span>Trace</span></summary><div class="record-body"><div class="empty-state">Open this trace to load its preserved raw response, controlling prompt, and canonical evidence.</div></div></details>`;}));return cards.length?`<div class="panel"><h2 class="section-title">Provenance navigation</h2><p class="section-intro">Open only the value you need to audit. Large preserved responses are loaded only for the trace you open so stage navigation remains responsive.</p>${cards.join('')}</div>`:'';}
function workflow()'''
          s,n=prov.subn(new_prov,s,count=1)
          if n!=1: raise SystemExit('provenance target missing')
          old="function workflow(){const n=current.activeStage,d=core.STAGES[n-1],s=current.stages[n],lock=stageLocked(n),locked=Boolean(lock)&&s.status!=='COMPLETE',savedPrompt=currentPromptRecord(n),prompt=savedPrompt?.prompt||currentStagePrompt(n),responseLocked=locked||s.status==='COMPLETE',latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),retryPreview=!savedPrompt&&latestValidation&&!latestValidation.valid,promptIntro=savedPrompt?'This exact saved instruction is the controlling request. Its identity and strict response contract are embedded below.':retryPreview?'Updated correction instruction preview. The latest validation failure is included automatically. Save or copy this updated instruction before sending it to the agent; only the committed instruction identity is controlling.':'This is an unsaved preview. Save or copy it before sending it to an agent; only the committed instruction identity is controlling.';return `"
          new="function workflow(){const n=current.activeStage,d=core.STAGES[n-1],s=current.stages[n],lock=stageLocked(n),locked=Boolean(lock)&&s.status!=='COMPLETE',savedPrompt=currentPromptRecord(n),cachedPrompt=cachedStagePrompt(n),prompt=savedPrompt?.prompt||cachedPrompt||'Preparing exact instruction preview…',responseLocked=locked||s.status==='COMPLETE',latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),retryPreview=!savedPrompt&&latestValidation&&!latestValidation.valid,promptIntro=savedPrompt?'This exact saved instruction is the controlling request. Its identity and strict response contract are embedded below.':cachedPrompt?(retryPreview?'Updated correction instruction preview. The latest validation failure is included automatically. Save or copy this updated instruction before sending it to the agent; only the committed instruction identity is controlling.':'This is an unsaved preview. Save or copy it before sending it to an agent; only the committed instruction identity is controlling.'):'The stage screen is ready. The exact unsaved instruction preview is being prepared without blocking navigation; Save or copy instruction will generate it immediately if needed.';const promptMeta=savedPrompt||cachedPrompt?`${prompt.length.toLocaleString()} characters · exact controlling copy block`:'Preparing exact preview…';return `"
          if old not in s: raise SystemExit('workflow header target missing')
          s=s.replace(old,new)
          s=s.replace('<span class="prompt-meta">${prompt.length.toLocaleString()} characters · exact controlling copy block</span>','<span class="prompt-meta" id="prompt-meta">${esc(promptMeta)}</span>',1)
          s=s.replace("function render(){if(!current)return;header();$('#screen').innerHTML=({Overview:overview,Project:projectView,Workflow:workflow,Records:records,Files:files,Release:release}[current.activeView]||overview)();updateStageHelp();wire();document.dispatchEvent(new Event('closed-loop-rendered'));}","function render(){if(!current)return;header();$('#screen').innerHTML=({Overview:overview,Project:projectView,Workflow:workflow,Records:records,Files:files,Release:release}[current.activeView]||overview)();updateStageHelp();wire();document.dispatchEvent(new Event('closed-loop-rendered'));if(current.activeView==='Workflow')schedulePromptPreview(current.activeStage);}")
          old_wire="function wire(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current.activeView=b.dataset.view;render();});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{current.activeStage=Number(b.dataset.stage);current.activeView='Workflow';render();});"
          new_wire="function wire(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current.activeView=b.dataset.view;render();});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{current.activeStage=Number(b.dataset.stage);current.activeView='Workflow';requestAnimationFrame(render);});document.querySelectorAll('.provenance-trace[data-manifest-id]').forEach(node=>node.ontoggle=()=>{if(!node.open||node.dataset.loaded)return;node.dataset.loaded='true';const body=node.querySelector('.record-body');if(body)body.innerHTML=provenanceTraceBody(node.dataset.manifestId,Number(node.dataset.entryIndex));});"
          if old_wire not in s: raise SystemExit('wire target missing')
          s=s.replace(old_wire,new_wire)
          p.write_text(s)
          PY
          node --check app-core.js
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          grep -q "data-manifest-id" app-core.js
          grep -q "schedulePromptPreview" app-core.js
          grep -q "p?.schema===core.SCHEMA" app-core.js
      - name: Run Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit application fix
        run: |
          git config user.name 'closed-loop reliability bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-core.js index.html TEST_PROJECT.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile stage navigation freezes'
          git push origin HEAD:fix/mobile-freeze-20260828
