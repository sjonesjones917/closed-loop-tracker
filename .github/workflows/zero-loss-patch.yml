name: Apply minimal zero-loss semantic correction
on:
  push:
    branches:
      - reliability/zero-loss-controlling-20260828
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply responsible-layer semantic corrections
        run: python3 .github/zero-loss-patch.py
      - name: Refresh exact runtime bundle identity
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const bytes=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of files)html=html.replace(new RegExp(`${file.replace('.', '\\.')}\\?v=runtime-[a-f0-9]+`,'g'),`${file}?v=${token}`);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
      - name: Remove temporary patch machinery
        run: rm .github/zero-loss-patch.py .github/workflows/zero-loss-patch.yml
      - name: Run deterministic and semantic gates
        run: |
          node --check workflow-engine.js
          node --check verify-semantic-invariant.mjs
          node --check verify-definition-of-done.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
      - name: Run real local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/zero-loss-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only the proven patch
        run: |
          git config user.name 'closed-loop reliability bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Close remaining zero-loss semantic gaps'
          git push origin HEAD:reliability/zero-loss-controlling-20260828
