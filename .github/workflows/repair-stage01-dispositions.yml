name: Transient Stage 01 disposition repair

on:
  push:
    branches: [fix/file-first-response-contract-20260903]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/file-first-response-contract-20260903
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply controlling Stage 01 disposition contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'incorporated into the job definition':'EXTRACTED_RELEVANT_INFORMATION',
            'retained as context':'RETAINED_AS_CONTEXT',
            'unresolved human-only':'UNRESOLVED_HUMAN_AUTHORITY',
            'later-resolvable':'LATER_RESOLVABLE',
            'inapplicable with reason':'NO_PROJECT_RELEVANT_INFORMATION',
          }
          for path in list(Path('.').glob('*.js'))+list(Path('.').glob('*.mjs')):
              text=path.read_text()
              old=text
              for a,b in replacements.items(): text=text.replace(a,b)
              if text!=old: path.write_text(text)
          p=Path('prompt-engine.js')
          text=p.read_text()
          old='EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|NO_PROJECT_RELEVANT_INFORMATION'
          new='EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED'
          if old not in text: raise SystemExit('Stage 01 prompt disposition contract not found after normalization')
          text=text.replace(old,new)
          p.write_text(text)

          e=Path('workflow-engine.js')
          text=e.read_text()
          needles=[
            "'EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','NO_PROJECT_RELEVANT_INFORMATION'",
            '"EXTRACTED_RELEVANT_INFORMATION","RETAINED_AS_CONTEXT","UNRESOLVED_HUMAN_AUTHORITY","LATER_RESOLVABLE","NO_PROJECT_RELEVANT_INFORMATION"',
          ]
          changed=False
          for needle in needles:
              if needle in text:
                  quote="'" if needle.startswith("'") else '"'
                  repl=needle[:-1]+','+quote+'INACCESSIBLE_OR_BLOCKED'+quote+needle[-1:]
                  text=text.replace(needle,repl)
                  changed=True
          if not changed and 'INACCESSIBLE_OR_BLOCKED' not in text:
              raise SystemExit('Could not extend Stage 01 engine disposition set')
          e.write_text(text)

          test=Path('verify-stage01-disposition-contract.mjs')
          test.write_text(r'''import fs from 'node:fs';
import vm from 'node:vm';
globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine;
const assert=(v,m)=>{if(!v)throw new Error(m);};
const p=core.createBlankState('JOB-STAGE01-DISPOSITIONS');
p.job.EXACT_USER_OBJECTIVE_VERBATIM='Capture every supplied human-authority fact.';
p.job.CURRENT_INPUT_VERSION='INPUT-v001';
engine.ensureShape(p);
const manifest=engine.intakeCoverageManifest(p);
const prompt=prompts.buildPromptRecord(1,p,{operation:'COMPLETE'}).prompt;
const required=['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED'];
for(const value of required)assert(prompt.includes(value),`Stage 01 prompt omits controlling disposition ${value}.`);
for(const legacy of ['incorporated into the job definition','retained as context','unresolved human-only','later-resolvable','inapplicable with reason'])assert(!prompt.includes(legacy),`Stage 01 prompt still advertises legacy disposition ${legacy}.`);
const base={schema:'closed-loop-stage01-capture/1',inputVersion:manifest.inputVersion,manifestSha256:manifest.manifestSha256,units:manifest.units.map((unit,index)=>({sourceUnitId:unit.unitId,sourceRawValueSha256:unit.rawValueSha256,disposition:'RETAINED_AS_CONTEXT',reason:'Preserved.',extractedStatements:[{statementKey:`S${index}`,text:unit.rawValueText||unit.label||unit.unitId,statementClass:'CONTEXT'}]}))};
assert(engine.evaluateIntakeAccounting(p,{capture:JSON.stringify(base)}).complete,'Controlling Stage 01 disposition was rejected.');
const legacy=structuredClone(base);legacy.units[0].disposition='retained as context';
assert(!engine.evaluateIntakeAccounting(p,{capture:JSON.stringify(legacy)}).complete,'Legacy Stage 01 disposition was accepted.');
const inaccessible=structuredClone(base);inaccessible.units[0].disposition='INACCESSIBLE_OR_BLOCKED';
assert(!engine.evaluateIntakeAccounting(p,{capture:JSON.stringify(inaccessible)}).complete,'INACCESSIBLE_OR_BLOCKED incorrectly completed Stage 01.');
console.log(JSON.stringify({closedStage01Dispositions:'PASS',legacyRejected:'PASS',inaccessibleBlocks:'PASS'}));
''')

          wf=Path('.github/workflows/pages.yml')
          text=wf.read_text()
          anchor='          node verify-stage01-intake-closure.mjs\n'
          if 'verify-stage01-disposition-contract.mjs' not in text:
              if anchor not in text: raise SystemExit('Stage 01 CI anchor not found')
              text=text.replace(anchor,anchor+'          node verify-stage01-disposition-contract.mjs\n',1)
          wf.write_text(text)
          PY
      - name: Prove repaired Stage 01 contract
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check workflow-engine.js
          node verify-stage01-disposition-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
      - name: Commit repair and remove transient workflow
        run: |
          set -euo pipefail
          rm .github/workflows/repair-stage01-dispositions.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add -A
          git commit -m 'Conform Stage 01 raw-unit dispositions to controlling contract'
          git push origin HEAD:fix/file-first-response-contract-20260903
