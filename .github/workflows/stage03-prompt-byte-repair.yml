name: Stage 03 prompt-byte repair

on:
  push:
    branches:
      - controller-v2/stage03-prompt-byte-regression-20260905

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'activate Stage 03 prompt-byte repair')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 03 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Prove current prompt-byte regression fails
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node verify-prompt-file-byte-contract.mjs > /tmp/stage03-before.log 2>&1
          code=$?
          set -e
          cat /tmp/stage03-before.log
          if [ "$code" -eq 0 ]; then
            echo 'intentional invalid fixture unexpectedly passed before repair' >&2
            exit 1
          fi
          grep -Eq 'bodySha256|authoritative prompt|BODY_SHA256|identity wrapper|final LF' /tmp/stage03-before.log
          echo "pre-repair regression rejected as required (exit $code)"
