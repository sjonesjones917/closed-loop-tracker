name: repair-test-ir-v1-surface
on:
  push:
    branches: [fix/test-ir-v1-surface-20260902]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/test-ir-v1-surface-20260902
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node repair-test-ir-v1-surface.mjs
      - run: node --check test-runtime.js
      - run: node verify-test-ir-v1-surface.mjs
      - run: node verify-test-runtime-v3.mjs
      - run: node verify-test-runtime.mjs
      - name: Commit repaired runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-runtime.js verify-test-runtime-v3.mjs .github/workflows/pages.yml
          git commit -m 'Conform Test IR v1 operation selector and regex surface'
          git push origin HEAD:fix/test-ir-v1-surface-20260902
