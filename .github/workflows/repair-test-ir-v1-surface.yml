name: repair-test-ir-v1-surface
on:
  push:
    branches: [fix/test-ir-v1-surface-20260902]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/test-ir-v1-surface-20260902
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node repair-test-ir-v1-surface.mjs
      - run: node --check test-runtime.js
      - run: node verify-test-ir-v1-surface.mjs
      - run: node verify-test-runtime-v3.mjs
      - run: node verify-test-runtime.mjs
      - name: Upload proven repair files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proven-test-ir-v1-surface
          path: |
            test-runtime.js
            verify-test-runtime-v3.mjs
            .github/workflows/pages.yml
