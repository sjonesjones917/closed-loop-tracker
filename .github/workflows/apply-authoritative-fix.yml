name: Retire superseded authoritative patch payload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-authoritative-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-authoritative-closed-loop-fix
  cancel-in-progress: true

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the retained current implementation before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'closedLoopReliability.quarantinedProjects' attach-self-project.mjs
          grep -Fq 'data-generate-production-instruction' apply-prompt-generation.mjs
          grep -Fq 'Stage 8 requires an actual generated production prompt.' apply-prompt-generation.mjs
          grep -Fq 'node verify-prompt-generation.mjs' .github/workflows/pages.yml
          grep -Fq 'node prompt-generation-smoke.mjs' .github/workflows/pages.yml
      - name: Remove only superseded one-shot correction machinery
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -rf .authoritative-patch-payload
          rm -f apply-authoritative-fix.mjs .github/workflows/apply-authoritative-fix.yml
          rm -f .github/workflows/repair-current.yml .github/workflows/rebuild-retained-project-once.yml
          rm -f minimal-project-correction.mjs SELF_PROJECT_REBUILD_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove superseded correction workflows and payloads'
          git push origin HEAD:main
