name: Apply Authoritative Closed-Loop Fix Once

on:
  push:
    branches: [main]
    paths:
      - apply-authoritative-fix.mjs
      - .github/workflows/apply-authoritative-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-authoritative-closed-loop-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto the current main branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Apply the exact authoritative patch
        run: node apply-authoritative-fix.mjs

      - name: Verify patched source before publication
        shell: bash
        run: |
          set -euo pipefail
          for file in attach-self-project.mjs migrate-self-project.mjs verify-app.mjs verify-self-project.mjs browser-smoke.mjs; do
            node --check "$file"
          done
          grep -Fq 'data-retained-self-project-loader-mode="direct-storage-v2"' attach-self-project.mjs
          grep -Fq 'RUN 10 INDEPENDENT EXECUTIONS' verify-app.mjs
          grep -Fq 'rebuild-self-project.mjs' .github/workflows/pages.yml
          grep -Fq 'Restore verified application project' attach-self-project.mjs
          if grep -Eqi 'new[[:space:]]+DataTransfer|\.files[[:space:]]*=[[:space:]]*transfer\.files' attach-self-project.mjs; then
            exit 1
          fi

      - name: Commit one authoritative source update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .authoritative-patch-payload
          rm -f apply-authoritative-fix.mjs .github/workflows/apply-authoritative-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Apply authoritative human-first application and retained project pipeline'
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch verified Pages build from the patched main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
