name: Apply verified semantic closure onto current main
on:
  push:
    branches:
      - practical-100/final-semantic-closure-current
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-semantic-closure-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current-main semantic invariants
        run: node .current-semantic-fixes.mjs
      - name: Verify combined current-main source
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified non-workflow source
        run: |
          rm -f .current-semantic-fixes.mjs
          git checkout HEAD -- .github/workflows/cherry-semantic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Close current semantic reliability gaps"
          git push origin HEAD:practical-100/final-semantic-closure-current
