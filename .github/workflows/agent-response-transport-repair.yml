name: Temporary agent response transport repair
on:
  push:
    branches: [fix/agent-response-transport-contract-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-response-transport-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply responsible-layer repair
        run: |
          python .agent-response-transport-repair.py
          python <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); s=p.read_text()
          old="requiredValues:{temporaryKey:'unique non-empty response-local string',kind:'non-empty string',description:'non-empty string',location:'non-empty string',content:'non-empty string',supports:'array of unique /stageData/FIELD JSON pointers covered by this evidence; use [] when this evidence supports records only'},optionalValues:{authorityType:'optional string',sourceRef:'optional relationship object containing exactly one of tempKey or recordId and resolving to sources',attachmentRef:'optional relationship object containing exactly one of tempKey or recordId and resolving to verified artifact bytes',notes:'optional string'}"
          new="requiredValues:{temporaryKey:'unique non-empty response-local string',kind:'non-empty string',description:'non-empty string',location:'non-empty string',content:'non-empty string'},optionalValues:{authorityType:'optional string',sourceRef:'optional relationship object containing exactly one of tempKey or recordId and resolving to sources',attachmentRef:'optional relationship object containing exactly one of tempKey or recordId and resolving to verified artifact bytes',notes:'optional string',supports:'optional array of unique /stageData/FIELD JSON pointers; required only when this evidence proves provenance-required stageData and otherwise may be omitted or []'}"
          if old not in s: raise SystemExit('evidence contract required-supports anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('response-ingestion.js'); s=p.read_text()
          old="if(evidence.supports===undefined)issues.push(issue('MISSING_EVIDENCE_SUPPORTS',`${path}/supports`,'supports is required; use [] when this evidence supports records only.'));else if(!Array.isArray(evidence.supports)||evidence.supports.some(value=>typeof value!=='string'||!value.trim())||new Set(evidence.supports).size!==evidence.supports.length)issues.push(issue('INVALID_EVIDENCE_SUPPORTS',`${path}/supports`,'supports must be an array of unique non-empty stageData JSON pointers.'));else for(const pointer of evidence.supports)"
          new="if(evidence.supports!==undefined&&(!Array.isArray(evidence.supports)||evidence.supports.some(value=>typeof value!=='string'||!value.trim())||new Set(evidence.supports).size!==evidence.supports.length))issues.push(issue('INVALID_EVIDENCE_SUPPORTS',`${path}/supports`,'supports must be an array of unique non-empty stageData JSON pointers when supplied.'));else for(const pointer of safe(evidence.supports))"
          if old not in s: raise SystemExit('evidence validator required-supports anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const bytes=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          const html=fs.readFileSync('index.html','utf8').replace(/runtime-[0-9a-f]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
      - name: Verify complete deterministic and browser path
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-browser.mjs
      - name: Commit permanent source only
        run: |
          git rm .agent-response-transport-repair.py .github/workflows/agent-response-transport-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workbook.js prompt-engine.js response-ingestion.js app-core.js verify-ingestion.mjs verify-prompt-semantics.mjs index.html
          git commit -m "Make agent response transport and evidence contract practical"
          git push origin HEAD:fix/agent-response-transport-contract-20260826
