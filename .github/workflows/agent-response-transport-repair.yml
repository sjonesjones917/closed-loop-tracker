name: Temporary agent response transport repair
on:
  push:
    branches: [fix/agent-response-transport-contract-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-response-transport-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply responsible-layer repair
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('.agent-response-transport-repair.py')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
              if line.startswith('s=s.replace("negative(\'markdown wrapped\''):
                  lines[i] = "s=s.replace(\"negative('markdown wrapped',(e)=>'```json\\\\n'+JSON.stringify(e)+'\\\\n```','NON_JSON_WRAPPER');\",\"{const p=project('JOB-FENCED-JSON'),pr=savePrompt(p,2),e=validEnvelope(p,2,pr),prepared=ingestion.prepare(p,{stage:2,text:'```json\\\\n'+JSON.stringify(e)+'\\\\n```',promptRecord:pr});if(!prepared.validation.valid)throw new Error(`Exact JSON fence was rejected: ${prepared.validation.issues.map(x=>x.code).join(', ')}`);negativeCount++;}\\n{const p=project('JOB-SMART-JSON'),pr=savePrompt(p,2),e=validEnvelope(p,2,pr);let open=true;const smart=JSON.stringify(e).replace(/\\\"/g,()=>String.fromCodePoint((open=!open)?0x201d:0x201c));const prepared=ingestion.prepare(p,{stage:2,text:smart,promptRecord:pr});if(!prepared.validation.valid)throw new Error(`Typographic JSON transport was not normalized: ${prepared.validation.issues.map(x=>x.code).join(', ')}`);negativeCount++;}\\nnegative('prose wrapped JSON',(e)=>'Here is the JSON:\\\\n```json\\\\n'+JSON.stringify(e)+'\\\\n```','NON_JSON_WRAPPER');\",1)"
                  break
          else:
              raise SystemExit('broken verify-ingestion replacement line not found')
          p.write_text('\n'.join(lines)+'\n')
          PY
          python .agent-response-transport-repair.py
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const bytes=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          const html=fs.readFileSync('index.html','utf8').replace(/runtime-[0-9a-f]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
      - name: Verify complete deterministic and browser path
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-browser.mjs
      - name: Commit permanent source only
        run: |
          git rm .agent-response-transport-repair.py .github/workflows/agent-response-transport-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workbook.js prompt-engine.js response-ingestion.js app-core.js verify-ingestion.mjs verify-prompt-semantics.mjs index.html
          git commit -m "Make agent response transport and evidence contract practical"
          git push origin HEAD:fix/agent-response-transport-contract-20260826
