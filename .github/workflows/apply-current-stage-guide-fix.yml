name: Apply current stage guide fix
on:
  push:
    branches:
      - fix/restore-original-stage-guide-current
    paths:
      - .github/workflows/apply-current-stage-guide-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-original-stage-guide-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow repair to current main
        run: |
          git show d6a78e1f72c77e572f86413bceb4ee699e9c3ed1:tools/fix_original_stage_guide.py > /tmp/fix_original_stage_guide.py
          git show d6a78e1f72c77e572f86413bceb4ee699e9c3ed1:tools/fix_original_stage_guide_test.py > /tmp/fix_original_stage_guide_test.py
          python3 /tmp/fix_original_stage_guide.py
          python3 /tmp/fix_original_stage_guide_test.py
      - name: Verify deterministic and workflow behavior
        run: |
          node --check app-core.js
          node --check verify-browser.mjs
          node verify-hash.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Commit verified application change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js index.html verify-browser.mjs verify-prompt-semantics.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Restore original stage guide with conditional artifact note'
          git push origin HEAD:fix/restore-original-stage-guide-current
