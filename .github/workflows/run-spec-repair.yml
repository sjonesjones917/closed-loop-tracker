name: Run tested specification repair
on:
  push:
    branches: [fix/spec-conformance-zero-loss-20260830-0215]
    paths: [spec-closure-repair.mjs, .github/workflows/run-spec-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and test closure repair
        shell: bash
        run: |
          node spec-closure-repair.mjs
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node verify-spec-conformance.mjs
          git diff --check
      - name: Commit application changes only
        shell: bash
        run: |
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js verify-spec-conformance.mjs
          git diff --cached --check
          git commit -m "Enforce Stage 01 and Stage 04 accounting closure"
          git push origin HEAD
