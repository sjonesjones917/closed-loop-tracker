name: Run tested specification repair
on:
  push:
    branches: [fix/spec-conformance-zero-loss-20260830-0215]
    paths: [spec-repair.mjs, .github/workflows/run-spec-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and test application repair
        shell: bash
        run: |
          node spec-repair.mjs
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node verify-spec-conformance.mjs
          git diff --check
      - name: Commit application changes only
        shell: bash
        run: |
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add workbook.js workflow-schema.js test-runtime.js workflow-engine.js prompt-engine.js app-core.js index.html verify-*.mjs test-fixtures.mjs README.md
          git diff --cached --check
          git commit -m "Apply controlling zero-loss specification baseline"
          git push origin HEAD
