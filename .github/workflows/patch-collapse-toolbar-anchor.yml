name: Patch collapse toolbar anchor

on:
  push:
    branches: [collapse-direct-handler]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collapse-direct-handler
      - name: Anchor whole toolbar and refresh runtime token
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          text=p.read_text()
          old="else if(wasExpanded)requestAnimationFrame(()=>requestAnimationFrame(()=>button?.scrollIntoView({block:'end',inline:'nearest'})));"
          new="else if(wasExpanded)requestAnimationFrame(()=>requestAnimationFrame(()=>node?.parentElement?.querySelector('.prompt-toolbar')?.scrollIntoView({block:'end',inline:'nearest'})));"
          if text.count(old)!=1:
              raise SystemExit(f'expected one direct collapse anchor, found {text.count(old)}')
          p.write_text(text.replace(old,new))
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          fs.writeFileSync('index.html',fs.readFileSync('index.html','utf8').replace(/runtime-[0-9a-f]{16}/g,token));
          console.log(token);
          NODE
          node --check app-core.js
          node verify-hash.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-core.js index.html
          git commit -m 'Anchor collapsed prompt to full toolbar end'
          git push origin HEAD:collapse-direct-handler
