name: Apply canonical controller-ledger uniqueness regression
on:
  push:
    branches: [controller/c3-ledger-uniqueness-20260904]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller/c3-ledger-uniqueness-20260904
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node controller-ledger-apply.mjs
      - run: |
          node verify-controller-ledger-uniqueness.mjs
          node verify-build-stage-ledger.mjs
      - run: |
          rm -f controller-ledger-apply.mjs .github/workflows/controller-ledger-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reject duplicate canonical controller ledgers'
          git push origin HEAD:controller/c3-ledger-uniqueness-20260904
