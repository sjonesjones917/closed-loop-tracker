name: Repair Stage 04 manifest authority label

on:
  push:
    branches:
      - fix/monotonic-zero-loss-20260831

permissions:
  contents: write

concurrency:
  group: repair-stage4-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply the minimal Stage 04 authority-label correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('prompt-engine.js')
          text = path.read_text(encoding='utf-8')
          old = 'APPLICATION OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION'
          new = 'APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Stage 04 manifest label; found {count}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Replay affected Stage 04 prompt and accounting tests
        shell: bash
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node build-test-project.mjs
          node verify-spec3-contract.mjs
          node verify-one-time-intent-intake.mjs
          node verify-stage-prompts-complete.mjs
          node verify-zero-loss-accounting.mjs

      - name: Commit the correction and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-stage4-manifest.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js .github/workflows/repair-stage4-manifest.yml
          git commit -m "Identify the Stage 04 obligation manifest as application-owned"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
