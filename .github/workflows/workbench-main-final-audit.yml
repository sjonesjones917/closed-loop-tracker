name: Workbench final main audit export
on:
  push:
    branches: [workbench/main-final-audit]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -qr source.zip . -x source.zip -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: final-main-audit-source
          path: source.zip
          retention-days: 1
