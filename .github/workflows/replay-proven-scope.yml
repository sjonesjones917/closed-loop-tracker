name: Prove current-main scope replay
on:
  push:
    branches: [reliability/scope-and-semantic-final-20260826]
permissions:
  contents: write
jobs:
  prove:
    if: ${{ !contains(github.event.head_commit.message, '[scope-replay-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/scope-and-semantic-final-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay proven non-conflicting files
        run: |
          git fetch origin reliability/fail-closed-prompt-scope-20260826
          git checkout origin/reliability/fail-closed-prompt-scope-20260826 -- app-core.js response-ingestion.js verify-ingestion.mjs verify-prompt-semantics.mjs verify.mjs
          python3 replay-proven-scope.py
      - name: Verify complete deterministic stack
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-hash.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit exact passing source
        run: |
          rm replay-proven-scope.py .github/workflows/replay-proven-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replay proven execution-lane scope repair on current main [scope-replay-complete]"
          git push origin HEAD:reliability/scope-and-semantic-final-20260826
