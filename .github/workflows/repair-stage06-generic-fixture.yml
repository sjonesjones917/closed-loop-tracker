name: Repair Stage 06 generic valid fixture

on:
  push:
    branches: [fix/monotonic-reliability-pass-20260831]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - name: Make the Stage 06 generic valid fixture non-native and schema-valid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          replacements={
            "if(name==='EXECUTION_MODE')return 'APPLICATION_DETERMINISTIC';":"if(name==='EXECUTION_MODE')return 'EXTERNAL_AGENT_TOOL';",
            "if(/ARTIFACT_REQUIREMENTS/.test(name))return 'NONE';":"if(name==='REQUIRED_CAPABILITY')return 'CONTROLLED_EXTERNAL_TOOL';\n  if(name==='EXECUTABLE_KIND')return 'NONE';\n  if(name==='EXECUTABLE_SPEC'||name==='EXECUTABLE_INPUT_BINDINGS')return {};\n  if(/ARTIFACT_REQUIREMENTS/.test(name))return 'NONE';"
          }
          for old,new in replacements.items():
              if new not in s:
                  if s.count(old)!=1: raise SystemExit(f'Expected exactly one fixture target: {old}')
                  s=s.replace(old,new)
          p.write_text(s)
          PY
          rm .github/workflows/repair-stage06-generic-fixture.yml
          node --check verify-ingestion.mjs
          node verify-ingestion.mjs
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A verify-ingestion.mjs .github/workflows
          git commit -m "Fix Stage 06 generic valid ingestion fixture"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831
