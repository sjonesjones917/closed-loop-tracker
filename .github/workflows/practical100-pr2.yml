name: Practical 100 PR2 transformation
on:
  push:
    branches: [practical-100/pr2-schema-response-v2]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair transformer interpolation
        run: node .practical100-pr2-fix.mjs
      - name: Transform responsible modules
        run: node .practical100-pr2.mjs
      - name: Correct generated source and schema references
        shell: python
        run: |
          from pathlib import Path
          p=Path('response-ingestion.js')
          s=p.read_text()
          old="issues.push(issue('INVALID_UNRESOLVED_KIND',`${path}/kind`,'Unresolved kind is not controlled.');"
          new="issues.push(issue('INVALID_UNRESOLVED_KIND',`${path}/kind`,'Unresolved kind is not controlled.'));"
          assert old in s
          s=s.replace(old,new,1).replace('priorSemantic','priorCanonicalEnvelope').replace('This semantic response','This canonical envelope')
          old="bodySha256:promptRecord.bodySha256||promptRecord.sha256,contractSha256:promptRecord.contractSha256"
          new="bodySha256:promptRecord.bodySha256||promptRecord.sha256,promptSha256:promptRecord.bodySha256||promptRecord.sha256,contractSha256:promptRecord.contractSha256"
          assert old in s
          p.write_text(s.replace(old,new,1))
          p=Path('workflow-schema.js')
          s=p.read_text()
          old="derivationKey:options.derivationKey??options.derivation??null,normalizerKey:options.normalizerKey??null"
          new="derivation:options.derivation??options.derivationKey??null,derivationKey:options.derivationKey??options.derivation??null,normalizerKey:options.normalizerKey??null"
          assert old in s
          p.write_text(s.replace(old,new,1))
          for f in list(Path('.').glob('*.mjs'))+[Path('README.md')]:
            if not f.exists(): continue
            t=f.read_text()
            if 'closed-loop-stage-response/1' in t:
              t=t.replace('closed-loop-stage-response/1','closed-loop-stage-response/2')
            if f.name == 'verify-ingestion.mjs':
              t=t.replace("e.promptIdentity.sha256='0'.repeat(64)","e.promptIdentity.bodySha256='0'.repeat(64)")
              old_id="promptIdentity:{instructionId:promptRecord.instructionId,sha256:promptRecord.sha256}"
              new_id="operation:promptRecord.operation,promptIdentity:{instructionId:promptRecord.instructionId,bodySha256:promptRecord.bodySha256,contractSha256:promptRecord.contractSha256,contextSignature:promptRecord.contextSignature},scope:promptRecord.scope"
              t=t.replace(old_id,new_id)
            f.write_text(t)
      - name: Syntax checks
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check hash.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify.mjs
          node --check verify-ingestion.mjs
      - name: Deterministic checks
        run: |
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
      - name: Commit verified PR2 source only
        run: |
          rm .practical100-pr2.mjs .practical100-pr2-fix.mjs .github/workflows/practical100-pr2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 2: explicit schema and response contract v2"
          git push origin HEAD:practical-100/pr2-schema-response-v2
