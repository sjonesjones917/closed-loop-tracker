name: Repair verifier prerequisite fixture

on:
  push:
    branches:
      - fix/monotonic-reliability-pass-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - name: Correct synthetic prompt prerequisites and self-remove
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="function syntheticPromptOptions(stage,p){"
          new="function promptReady(p,stage){for(let prior=1;prior<stage;prior++){p.stages[prior].status='COMPLETE';p.stages[prior].gate={complete:true,blocked:false,reasons:[]};}if(stage===4)prepareStage4(p);return p;}\nfunction syntheticPromptOptions(stage,p){"
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'Expected one helper insertion target; found {s.count(old)}')
              s=s.replace(old,new)
          old_loop="for(let stage=1;stage<=30;stage++){const p=blank(`JOB-PROMPT-${stage}`);if(stage===4)prepareStage4(p);const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));"
          new_loop="for(let stage=1;stage<=30;stage++){const p=promptReady(blank(`JOB-PROMPT-${stage}`),stage);const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));"
          if new_loop not in s:
              if s.count(old_loop)!=1: raise SystemExit(f'Expected one prompt loop target; found {s.count(old_loop)}')
              s=s.replace(old_loop,new_loop)
          old_cross="const pa=prompts.buildPromptRecord(2,blank('JOB-A')).prompt,pb=prompts.buildPromptRecord(2,blank('JOB-B')).prompt;"
          new_cross="const pa=prompts.buildPromptRecord(2,promptReady(blank('JOB-A'),2)).prompt,pb=prompts.buildPromptRecord(2,promptReady(blank('JOB-B'),2)).prompt;"
          if new_cross not in s:
              if s.count(old_cross)!=1: raise SystemExit(f'Expected one cross-project prompt target; found {s.count(old_cross)}')
              s=s.replace(old_cross,new_cross)
          p.write_text(s)
          PY
          rm .github/workflows/repair-verify-prerequisites.yml
          node --check verify.mjs
          node --check prompt-engine.js
          node verify.mjs
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A verify.mjs .github/workflows
          git commit -m "Align verifier fixtures with prompt prerequisites"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831