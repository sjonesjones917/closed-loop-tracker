name: Temporary hot-path regression scope bootstrap
on:
  push:
    branches: [reliability/mobile-large-state-hotpath-20260828]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact test-scope repair
        run: |
          node apply-hotpath-regression-scope.mjs
          node --check verify-browser-extra.mjs
      - name: Commit repaired permanent regression
        run: |
          git config user.name 'closed-loop-ci'
          git config user.email 'closed-loop-ci@users.noreply.github.com'
          git add verify-browser-extra.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Scope mobile clone regression to prompt renderer'
          git push origin HEAD:reliability/mobile-large-state-hotpath-20260828
