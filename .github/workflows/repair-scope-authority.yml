name: one-time-scope-authority-repair
on:
  push:
    branches:
      - repair/scope-authority-20260902
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[scope-authority-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fixed-oracle repair
        run: node repair-scope-authority.mjs
      - name: Prove repaired contract
        run: |
          node --check workflow-schema.js
          node verify-operation-scope-authority.mjs
          node verify-v3-contract.mjs
      - name: Remove one-time scaffolding and commit
        run: |
          rm repair-scope-authority.mjs .github/workflows/repair-scope-authority.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js verify-operation-scope-authority.mjs verify-v3-contract.mjs repair-scope-authority.mjs .github/workflows/repair-scope-authority.yml
          git commit -m 'Conform exact operation scope and command authority [scope-authority-repaired]'
          git push origin HEAD:repair/scope-authority-20260902
