name: PR6 continuous lifecycle
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and continuous lifecycle
        run: |
          node --check test-fixtures.mjs
          node --check verify-full-cycle.mjs
          node verify-full-cycle.mjs
          # Temporary lifecycle runner; remove before opening PR6.
