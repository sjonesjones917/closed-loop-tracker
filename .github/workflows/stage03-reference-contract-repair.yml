name: Stage 03 reference-contract repair

on:
  push:
    branches: [fix/stage03-reference-contract-handshake-20260909]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/stage03-reference-contract-handshake-20260909
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply minimal production repair and permanent regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'prompt-engine.js',
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/63';",
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/64';"
          )
          replace_once(
              'prompt-engine.js',
              "recordIdentityRule:'Exactly one of tempKey or targetId; UPDATE_RESERVED uses targetId and new proposals use tempKey.',",
              "relationshipReferenceContract:{allowedKeys:['tempKey','recordId'],exactlyOneRequired:true,existingCanonicalRecordKey:'recordId',sameResponseRecordKey:'tempKey',prohibitedKeys:['targetId'],bareStringAllowed:false,targetIdScope:'Top-level record identity only; never a relationship, evidence.sourceRef, or evidence.attachmentRef.',examples:{existingCanonicalRecord:{recordId:'SOURCE-000001'},sameResponseRecord:{tempKey:'source-1'}}},evidenceReferenceContract:{sourceRef:'relationshipReferenceContract',attachmentRef:'relationshipReferenceContract'},recordIdentityRule:'At records.<collection>[] identity level, exactly one of tempKey or targetId; UPDATE_RESERVED record identities use targetId and new proposal record identities use tempKey. This record-identity rule does not apply inside relationships, evidence.sourceRef, or evidence.attachmentRef.',"
          )
          replace_once(
              'response-ingestion.js',
              "else{const count=Number(Boolean(evidence.attachmentRef.tempKey))+Number(Boolean(evidence.attachmentRef.recordId));if(count!==1)issues.push(issue('INVALID_EVIDENCE_ATTACHMENT_REF',`${path}/attachmentRef`,'Provide exactly one of tempKey or recordId.'));",
              "else{unknownKeys(evidence.attachmentRef,['tempKey','recordId'],`${path}/attachmentRef`,issues);const count=Number(Boolean(evidence.attachmentRef.tempKey))+Number(Boolean(evidence.attachmentRef.recordId));if(count!==1)issues.push(issue('INVALID_EVIDENCE_ATTACHMENT_REF',`${path}/attachmentRef`,'Provide exactly one of tempKey or recordId.'));"
          )

          ingestion_path = Path('verify-ingestion.mjs')
          text = ingestion_path.read_text()
          anchor = "negative('unresolved evidence source',(e)=>{e.evidence[0].sourceRef={recordId:'SOURCE-NOT-THERE'};},'UNRESOLVED_EVIDENCE_SOURCE');\nnegative('unresolved evidence attachment',(e)=>{e.evidence[0].attachmentRef={recordId:'ARTIFACT-NOT-THERE'};},'UNRESOLVED_EVIDENCE_ATTACHMENT');\nnegative('invalid record identity',(e)=>{e.stageData={};const r=sourceProposal('source-both');r.targetId='SOURCE-ALSO';e.records={sources:[r]};},'INVALID_RECORD_IDENTITY');\nnegativeAt('unresolved relationship',3,(e)=>{e.stageData={};e.records={research:[{tempKey:'research-1',fields:{PASS_NUMBER:1,EXACT_PORTION_EXAMINED:'Controlled source portion',FINDING_CLASSIFICATION:'FACT',SOURCE_EVIDENCE:'Controlled evidence'},relationships:{SOURCE_ID:{recordId:'SOURCE-DOES-NOT-EXIST'}},evidenceRefs:['evidence-1']}]};},'UNRESOLVED_RELATIONSHIP');"
          replacement = "negative('unresolved evidence source',(e)=>{e.evidence[0].sourceRef={recordId:'SOURCE-NOT-THERE'};},'UNRESOLVED_EVIDENCE_SOURCE');\nnegative('unresolved evidence attachment',(e)=>{e.evidence[0].attachmentRef={recordId:'ARTIFACT-NOT-THERE'};},'UNRESOLVED_EVIDENCE_ATTACHMENT');\nnegative('bare-string evidence source reference',(e)=>{e.evidence[0].sourceRef='SOURCE-NOT-AN-OBJECT';},'INVALID_EVIDENCE_SOURCE_REF');\nnegative('top-level targetId prohibited in evidence source reference',(e)=>{e.evidence[0].sourceRef={targetId:'SOURCE-NOT-ALLOWED'};},'UNKNOWN_PROPERTY');\nnegative('bare-string evidence attachment reference',(e)=>{e.evidence[0].attachmentRef='ARTIFACT-NOT-AN-OBJECT';},'INVALID_EVIDENCE_ATTACHMENT_REF');\nnegative('top-level targetId prohibited in evidence attachment reference',(e)=>{e.evidence[0].attachmentRef={targetId:'ARTIFACT-NOT-ALLOWED'};},'UNKNOWN_PROPERTY');\nnegative('invalid record identity',(e)=>{e.stageData={};const r=sourceProposal('source-both');r.targetId='SOURCE-ALSO';e.records={sources:[r]};},'INVALID_RECORD_IDENTITY');\nnegativeAt('bare-string relationship reference',3,(e)=>{e.stageData={};e.records={research:[{tempKey:'research-string-ref',fields:{PASS_NUMBER:1,EXACT_PORTION_EXAMINED:'Controlled source portion',FINDING_CLASSIFICATION:'FACT',SOURCE_EVIDENCE:'Controlled evidence'},relationships:{SOURCE_ID:'SOURCE-NOT-AN-OBJECT'},evidenceRefs:['evidence-1']}]};},'INVALID_RELATIONSHIP_REFERENCE');\nnegativeAt('top-level targetId prohibited in nested relationship',3,(e)=>{e.stageData={};e.records={research:[{tempKey:'research-target-ref',fields:{PASS_NUMBER:1,EXACT_PORTION_EXAMINED:'Controlled source portion',FINDING_CLASSIFICATION:'FACT',SOURCE_EVIDENCE:'Controlled evidence'},relationships:{SOURCE_ID:{targetId:'SOURCE-NOT-ALLOWED'}},evidenceRefs:['evidence-1']}]};},'UNKNOWN_PROPERTY');\nnegativeAt('unresolved relationship',3,(e)=>{e.stageData={};e.records={research:[{tempKey:'research-1',fields:{PASS_NUMBER:1,EXACT_PORTION_EXAMINED:'Controlled source portion',FINDING_CLASSIFICATION:'FACT',SOURCE_EVIDENCE:'Controlled evidence'},relationships:{SOURCE_ID:{recordId:'SOURCE-DOES-NOT-EXIST'}},evidenceRefs:['evidence-1']}]};},'UNRESOLVED_RELATIONSHIP');"
          if text.count(anchor) != 1:
              raise SystemExit(f'verify-ingestion.mjs: expected one negative-case anchor, found {text.count(anchor)}')
          ingestion_path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Run focused existing verification
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-response-contract-profile.mjs
          node --check verify-ingestion.mjs
          node verify-response-contract-profile.mjs
          node verify-ingestion.mjs
          node verify-stage-prompts-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
      - name: Remove repair workflow and commit the repair
        run: |
          set -euo pipefail
          git rm .github/workflows/stage03-reference-contract-repair.yml
          git add prompt-engine.js response-ingestion.js verify-ingestion.mjs verify-response-contract-profile.mjs
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^([ MADRCU?!]{2})? ?(prompt-engine\.js|response-ingestion\.js|verify-ingestion\.mjs|verify-response-contract-profile\.mjs|\.github/workflows/stage03-reference-contract-repair\.yml)$' || true)"
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git commit -m "Repair Stage 03 nested reference contract handshake"
          git push origin HEAD:fix/stage03-reference-contract-handshake-20260909
