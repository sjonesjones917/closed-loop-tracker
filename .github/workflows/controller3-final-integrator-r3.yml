name: Controller 3 exact-tree integration r3

on:
  push:
    branches:
      - controller3-prompt-byte-identity-rerun-20260904
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: controller3-exact-tree-integration-r3
  cancel-in-progress: false

jobs:
  integrate-test-merge-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: controller3-prompt-byte-identity-rerun-20260904
      TARGET_PR: "1016"
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Reconcile exact branch with current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "controller3-integration"
          git config user.email "controller3-integration@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Use the behavior-backed full-cycle capability fixture
        shell: bash
        run: |
          set -euo pipefail
          CAP_BRANCH="$(gh pr view 1015 --json headRefName --jq .headRefName)"
          git fetch origin "$CAP_BRANCH"
          git checkout "origin/$CAP_BRANCH" -- verify-full-cycle.mjs
          node verify-full-cycle.mjs

      - name: Integrate strict mobile capability and evidence validation
        shell: bash
        run: |
          set -euo pipefail
          MOBILE_BRANCH="$(gh pr view 1017 --json headRefName --jq .headRefName)"
          git fetch origin "$MOBILE_BRANCH"
          if ! git merge --no-edit "origin/$MOBILE_BRANCH"; then
            git merge --abort
            BASE="$(git merge-base origin/main "origin/$MOBILE_BRANCH")"
            mapfile -t FILES < <(git diff --name-only "$BASE".."origin/$MOBILE_BRANCH" -- | grep -E '(^|/)(verify-.*mobile.*\.(mjs|js)|mobile-.*\.(json|mjs|js))$' || true)
            test "${#FILES[@]}" -gt 0
            git checkout "origin/$MOBILE_BRANCH" -- "${FILES[@]}"
          fi

      - name: Keep only one dispatchable Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('.github/workflows/pages.yml')
          text=path.read_text()
          if not re.search(r'^\s*workflow_dispatch\s*:',text,re.M):
              marker=re.search(r'^on:\s*\n',text,re.M)
              if not marker: raise SystemExit('Unsupported Pages trigger syntax')
              text=text[:marker.end()]+'  workflow_dispatch:\n'+text[marker.end():]
          text=text.replace("github.event_name == 'push'", "(github.event_name == 'push' || github.event_name == 'workflow_dispatch')")
          text=text.replace('github.event_name == "push"', '(github.event_name == "push" || github.event_name == "workflow_dispatch")')
          path.write_text(text)
          PY
          find .github/workflows -maxdepth 1 -type f ! -name pages.yml -delete
          rm -f verification/controller3-full-cycle-capability-fixture.json
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n')" = pages.yml

      - name: Commit exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo 'No behavior-bearing integration remains' >&2; exit 1; }
          git commit -m "Close executable repository completion contracts"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Execute every canonical test block through local Chromium
        shell: bash
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_HEAD_REF: controller3-prompt-byte-identity-rerun-20260904
          GITHUB_REF_NAME: controller3-prompt-byte-identity-rerun-20260904
          GITHUB_REPOSITORY: sjonesjones917/closed-loop-tracker
          CI: "true"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          git diff --exit-code HEAD --
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, re, json
          lines=Path('.github/workflows/pages.yml').read_text().splitlines()
          blocks=[]; current=''; i=0
          while i<len(lines):
              m=re.match(r'^\s*- name:\s*(.+?)\s*$',lines[i])
              if m: current=m.group(1).strip().strip('"\'')
              r=re.match(r'^(\s*)run:\s*\|[-+]?\s*$',lines[i])
              if r and current:
                  indent=len(r.group(1)); body=[]; i+=1
                  while i<len(lines):
                      raw=lines[i]
                      if raw.strip() and len(raw)-len(raw.lstrip())<=indent: break
                      body.append(raw[indent+2:] if len(raw)>=indent+2 else '')
                      i+=1
                  blocks.append((current,'\n'.join(body))); continue
              i+=1
          env=os.environ.copy(); env['GITHUB_SHA']=subprocess.run(['git','rev-parse','HEAD'],text=True,capture_output=True,check=True).stdout.strip()
          replacements=[
            (r'\$\{\{\s*github\.event_name\s*\}\}','pull_request'),
            (r'\$\{\{\s*github\.sha\s*\}\}',env['GITHUB_SHA']),
            (r'\$\{\{\s*github\.head_ref\s*\}\}',env['GITHUB_HEAD_REF']),
            (r'\$\{\{\s*github\.ref_name\s*\}\}',env['GITHUB_REF_NAME']),
            (r'\$\{\{\s*github\.repository\s*\}\}',env['GITHUB_REPOSITORY'])]
          started=False; records=[]
          for name,script in blocks:
              if name=='Syntax': started=True
              if not started: continue
              for pattern,value in replacements: script=re.sub(pattern,value,script)
              script=re.sub(r'\$\{\{[^}]+\}\}','',script)
              result=subprocess.run(['bash','-lc',script],text=True,capture_output=True,env=env,timeout=1200)
              records.append({'name':name,'code':result.returncode,'stdout':result.stdout,'stderr':result.stderr})
              Path('/tmp/controller3-exact-tree-tests.json').write_text(json.dumps(records,indent=2))
              if result.returncode: raise SystemExit((result.stdout+result.stderr)[-20000:])
              if name=='Local Chromium operator path': break
          if not records or records[-1]['name']!='Local Chromium operator path': raise SystemExit('Local Chromium block was not executed')
          PY
          git diff --exit-code HEAD --

      - name: Push exact tested head and attach check
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.candidate.outputs.sha }}"
          git push origin "HEAD:${TARGET_BRANCH}"
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='controller3-exact-tree-test' -f head_sha="$FINAL_SHA" -f status=completed -f conclusion=success \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f 'output[title]=Exact candidate test barrier passed' \
            -f 'output[summary]=Every canonical test-job run block through Local Chromium executed successfully against this exact commit after all temporary workflows were removed.'

      - name: Merge exact head and dispatch canonical Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.candidate.outputs.sha }}"
          test "$(gh pr view "$TARGET_PR" --json headRefOid --jq .headRefOid)" = "$FINAL_SHA"
          gh pr merge "$TARGET_PR" --merge --delete-branch --match-head-commit "$FINAL_SHA"
          MAIN_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          gh workflow run pages.yml --ref main
          RUN_ID=''
          for i in $(seq 1 120); do
            RUN_ID="$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$MAIN_SHA\") | .databaseId" | head -n1)"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --interval 10 --exit-status
          JOBS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          for name in 'test' 'Deploy exact verified bytes' 'Verify deployed bytes and operator path' 'Publish machine acceptance status'; do
            test "$(jq -r --arg n "$name" '.jobs[] | select(.name==$n) | .conclusion' <<<"$JOBS")" = success
          done

      - name: Close superseded overlapping pull requests
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for pr in 1012 1013 1014 1015 1017 1019; do
            [ "$(gh pr view "$pr" --json state --jq .state 2>/dev/null || true)" = OPEN ] && gh pr close "$pr" --comment "Superseded by the exact-tree integration merged through PR #1016 and its canonical deployed verification." || true
          done
