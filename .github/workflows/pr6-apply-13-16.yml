name: PR6 apply lifecycle 13-16
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lifecycle extension
        run: |
          python .pr6-extend-13-16.py
          rm -f .pr6-extend-13-16.py .github/workflows/pr6-apply-13-16.yml .github/workflows/pr6-extend-13-16.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Extend full-cycle proof through controlled correction'
          git push
