name: Repair Stage 12 verifier context fixture
on:
  push:
    branches: [fix/zero-loss-controlled-20260831]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
      - name: Patch verifier context fixture and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs'); s=p.read_text()
          old="function verifyBatch(stage,operation,slots){const records=[];for(const {runId} of slots)for(const test of stage6Tests){"
          new="function verifyBatch(stage,operation,slots){engine.registerFreshContext(p,{stage,externalContextIdentifier:`VERIFY-CONTEXT-${stage}-${operation}`,operatorLabel:'FULL_CYCLE',purpose:'REVIEWER'});const verifierContextId=rid('freshContexts');const records=[];for(const {runId} of slots)for(const test of stage6Tests){"
          if new not in s:
              if old not in s: raise SystemExit('verifyBatch target not found')
              s=s.replace(old,new,1)
          old2="VERIFIER_CONTEXT_ID:`VERIFY-${runId}-${currentTestId}`"
          new2="VERIFIER_CONTEXT_ID:verifierContextId"
          if new2 not in s:
              if old2 not in s: raise SystemExit('VERIFIER_CONTEXT_ID target not found')
              s=s.replace(old2,new2,1)
          old3="}data(stage,{operation,records:{verification:records}});}"
          new3="}data(stage,{operation,scope:{contextId:verifierContextId},records:{verification:records}});}"
          if new3 not in s:
              if old3 not in s: raise SystemExit('verifyBatch data target not found')
              s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          git rm .github/workflows/repair-stage12-verifier-context.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-full-cycle.mjs
          git commit -m "Bind full-cycle verification to a canonical reviewer context"
          git push origin HEAD:fix/zero-loss-controlled-20260831