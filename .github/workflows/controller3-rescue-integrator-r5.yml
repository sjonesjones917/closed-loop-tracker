name: Controller 3 rescue exact-tree integration r5

on:
  push:
    branches:
      - controller/c3-exact-main-20260904-0525
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: controller3-repository-final-integration
  cancel-in-progress: false

jobs:
  integrate-test-merge-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: controller/c3-exact-main-20260904-0525
      TARGET_PR: "1008"
    steps:
      - name: Check out controller branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Refresh current main and integrate combined implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name controller3-integration
          git config user.email controller3-integration@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          for pr in 1016 1017; do
            STATE="$(gh pr view "$pr" --json state --jq .state 2>/dev/null || true)"
            BRANCH="$(gh pr view "$pr" --json headRefName --jq .headRefName 2>/dev/null || true)"
            if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git fetch origin "$BRANCH"
              git merge --no-edit -X theirs "origin/$BRANCH"
            elif [ "$STATE" != MERGED ]; then
              echo "Implementation source PR #$pr is neither merged nor fetchable." >&2
              exit 1
            fi
          done
          if ! node verify-full-cycle.mjs; then
            CAP_BRANCH="$(gh pr view 1015 --json headRefName --jq .headRefName)"
            git fetch origin "$CAP_BRANCH"
            git checkout "origin/$CAP_BRANCH" -- verify-full-cycle.mjs
            node verify-full-cycle.mjs
          fi

      - name: Produce one final Pages workflow and no temporary controller files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 3 -type f \( -iname '*source-capture*' -o -iname '.controller-*' \) -delete
          rm -f verification/controller3-full-cycle-capability-fixture.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('.github/workflows/pages.yml')
          text=path.read_text()
          if not re.search(r'^\s*workflow_dispatch\s*:',text,re.M):
              marker=re.search(r'^on:\s*\n',text,re.M)
              if not marker: raise SystemExit('Unsupported Pages trigger syntax')
              text=text[:marker.end()]+'  workflow_dispatch:\n'+text[marker.end():]
          text=text.replace("github.event_name == 'push'", "(github.event_name == 'push' || github.event_name == 'workflow_dispatch')")
          text=text.replace('github.event_name == "push"', '(github.event_name == "push" || github.event_name == "workflow_dispatch")')
          path.write_text(text)
          PY
          find .github/workflows -maxdepth 1 -type f ! -name pages.yml -delete
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n')" = pages.yml

      - name: Commit exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo 'No behavior-bearing integration remains.' >&2; exit 1; }
          git commit -m 'Integrate executable repository completion repairs'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract and execute canonical test-job run blocks through Local Chromium
        shell: bash
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_HEAD_REF: controller/c3-exact-main-20260904-0525
          GITHUB_REF_NAME: controller/c3-exact-main-20260904-0525
          GITHUB_REPOSITORY: sjonesjones917/closed-loop-tracker
          CI: "true"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          ruby -ryaml -rjson -e 'w=YAML.safe_load(File.read(%q[.github/workflows/pages.yml]), aliases: true); puts JSON.generate(w.fetch(%q[jobs]).fetch(%q[test]).fetch(%q[steps]).select{|s| s.is_a?(Hash) && s[%q[run]]}.map{|s| {%q[name]=>s[%q[name]],%q[run]=>s[%q[run]]}})' > /tmp/pages-test-run-blocks.json
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,os,re,json
          blocks=json.loads(Path('/tmp/pages-test-run-blocks.json').read_text())
          env=os.environ.copy(); env['GITHUB_SHA']=subprocess.run(['git','rev-parse','HEAD'],text=True,capture_output=True,check=True).stdout.strip()
          replacements=[
              (r'\$\{\{\s*github\.event_name\s*\}\}','pull_request'),
              (r'\$\{\{\s*github\.sha\s*\}\}',env['GITHUB_SHA']),
              (r'\$\{\{\s*github\.head_ref\s*\}\}',env['GITHUB_HEAD_REF']),
              (r'\$\{\{\s*github\.ref_name\s*\}\}',env['GITHUB_REF_NAME']),
              (r'\$\{\{\s*github\.repository\s*\}\}',env['GITHUB_REPOSITORY'])]
          started=False; records=[]
          for block in blocks:
              name=block.get('name','')
              if name=='Syntax': started=True
              if not started: continue
              script=block['run']
              for pattern,value in replacements: script=re.sub(pattern,value,script)
              script=re.sub(r'\$\{\{[^}]+\}\}','',script)
              result=subprocess.run(['bash','-lc',script],text=True,capture_output=True,env=env,timeout=1200)
              records.append({'name':name,'code':result.returncode,'stdout':result.stdout,'stderr':result.stderr})
              Path('/tmp/controller3-tests.json').write_text(json.dumps(records,indent=2))
              if result.returncode: raise SystemExit((result.stdout+result.stderr)[-24000:])
              if name=='Local Chromium operator path': break
          if not records or records[-1]['name']!='Local Chromium operator path': raise SystemExit('Local Chromium was not executed')
          PY
          git diff --exit-code HEAD --

      - name: Push tested tree and publish exact-commit check
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.candidate.outputs.sha }}"
          git push origin "HEAD:${TARGET_BRANCH}"
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/check-runs" -f name=controller3-exact-tree-test -f head_sha="$FINAL_SHA" -f status=completed -f conclusion=success -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -f 'output[title]=Exact candidate passed' -f 'output[summary]=Every canonical test-job run block through Local Chromium executed against this exact commit after temporary workflows were removed.'

      - name: Merge exact head and dispatch canonical main workflow
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.candidate.outputs.sha }}"
          gh pr ready "$TARGET_PR" || true
          gh pr edit "$TARGET_PR" --title 'Integrate executable repository completion repairs' --body 'Fresh-main integration of file-first prompt identity, Stage 01 inspection closure, canonical capability readiness, strict mobile evidence validation, and behavior-backed lifecycle fixtures. The exact final tree ran every canonical test block through Local Chromium before merge.'
          test "$(gh pr view "$TARGET_PR" --json headRefOid --jq .headRefOid)" = "$FINAL_SHA"
          gh pr merge "$TARGET_PR" --merge --delete-branch --match-head-commit "$FINAL_SHA"
          MAIN_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          gh workflow run pages.yml --ref main
          RUN_ID=''
          for i in $(seq 1 120); do
            RUN_ID="$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$MAIN_SHA\") | .databaseId" | head -n1)"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --interval 10 --exit-status
          JOBS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          for name in 'test' 'Deploy exact verified bytes' 'Verify deployed bytes and operator path' 'Publish machine acceptance status'; do
            test "$(jq -r --arg n "$name" '.jobs[] | select(.name==$n) | .conclusion' <<<"$JOBS")" = success
          done

      - name: Close superseded overlaps
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for pr in 1012 1013 1014 1015 1016 1017 1019; do
            [ "$(gh pr view "$pr" --json state --jq .state 2>/dev/null || true)" = OPEN ] && gh pr close "$pr" --comment 'Superseded by the fresh-main exact-tree integration and canonical deployed verification.' || true
          done
