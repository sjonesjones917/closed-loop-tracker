name: Temporary source export

on:
  push:
    branches:
      - codex/reliability-execution-evidence

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact tracked source tree
        run: git archive --format=tar.gz --output=/tmp/closed-loop-tracker-source.tar.gz HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-tracker-source
          path: /tmp/closed-loop-tracker-source.tar.gz
          if-no-files-found: error
          retention-days: 1
