name: Temporary source export

on:
  push:
    branches:
      - codex/reliability-execution-evidence

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact commit
        run: git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Package source tree
        run: tar --exclude=.git -czf closed-loop-tracker-source.tar.gz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-tracker-source
          path: closed-loop-tracker-source.tar.gz
          if-no-files-found: error
          retention-days: 1
