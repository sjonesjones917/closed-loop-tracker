name: Export complete source for single-use intake repair
on:
  push:
    branches: [fix-intake-single-use-20260830]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-complete-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
