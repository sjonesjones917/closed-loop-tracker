name: Capture exact verifier failures
on:
  push:
    branches: [fix/final-runtime-authority-20260830]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.event.head_commit.message != 'Diagnostic output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture failures
        run: |
          {
            echo '=== verify-v3-contract ==='
            node verify-v3-contract.mjs || true
            echo '=== verify-hash ==='
            node verify-hash.mjs || true
          } > diagnostic-output.txt 2>&1
      - name: Persist diagnostic output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostic-output.txt
          git commit -m 'Diagnostic output'
          git push
