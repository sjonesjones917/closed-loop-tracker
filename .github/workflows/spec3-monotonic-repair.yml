name: Spec3 monotonic source diagnostic
on:
  push:
    branches: [spec3-monotonic-20260831]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture Stage 6 source locations
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== execution-plan symbols ==='
            grep -n -E 'testExecutionPlan|missingArtifact|artifactReady|requiredArtifact|Stage 06|case 6|stage===6|stage == 6' workflow-engine.js || true
            echo '=== prompt common contract symbols ==='
            grep -n -E 'Project-relevant information supplied by the human|APPLICATION OBLIGATION MANIFEST|STRICT RESPONSE CONTRACT' prompt-engine.js || true
          } > spec3-source-diagnostic.txt
          cat spec3-source-diagnostic.txt
      - name: Persist source diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec3-source-diagnostic.txt
          git commit -m "Record Stage 6 source diagnostics" || true
          git push origin HEAD:spec3-monotonic-20260831
