name: Spec3 monotonic candidate
on:
  push:
    branches: [spec3-monotonic-20260831]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('prompt-engine.js'); s=p.read_text()
          old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';"
          if old not in s: raise SystemExit('prompt version marker missing')
          s=s.replace(old,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/55';",1)

          old_aug="const procedureAugmentation=Object.freeze({\n  2:'Continue source discovery until no new applicable controlling or correctness-relevant external source category is found. Do not stop at the first plausible source or at an arbitrary source count; source count is a search target, never permission to omit stronger authority or invent weaker sources.',\n  5:'Resolve the current job requirement set exhaustively. After each semantic correction, repeat the defect review against the resulting current requirement set until every defect class has been resolved or is explicitly blocked; do not review only the changed rows.',"
          new_aug="const procedureAugmentation=Object.freeze({\n  2:'Continue source discovery until no new applicable controlling or correctness-relevant external source category is found. Do not stop at the first plausible source or at an arbitrary source count; source count is a search target, never permission to omit stronger authority or invent weaker sources.',\n  4:'APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST is the controlling application-owned representation of the APPLICATION OBLIGATION MANIFEST.',\n  5:'Resolve the current job’s requirement set exhaustively. After each semantic correction, repeat the review against the resulting requirement set from the beginning until every defect class has been resolved or is explicitly blocked; do not review only the changed rows.',"
          if old_aug not in s: raise SystemExit('procedure augmentation marker missing')
          s=s.replace(old_aug,new_aug,1)

          old_rule="'Never ask the human to repeat, retype, summarize, resend, reopen, or reattach project information already present in current User Job Input, accepted Stage 01 capture, accepted canonical records, accessible canonical artifacts, or authorized research.'"
          new_rule="'never ask the human to repeat, retype, summarize, resend, reopen, or reattach it when project-relevant information is already present in current User Job Input, accepted Stage 01 capture, accepted canonical records, accessible canonical artifacts, or authorized research.'"
          if old_rule not in s: raise SystemExit('common no-repeat rule marker missing')
          s=s.replace(old_rule,new_rule,1)

          old_stage1="if(stage===1)lines.push('Exhaust human-authority intake before Stage 01 completion: every application-enumerated input unit must be classified exactly once, every materially relevant human-authority statement must be preserved, and every foreseeable genuinely human-only BLOCKING_NOW or ASK_NOW_NONBLOCKING issue must be asked before final Stage 01 JSON unless already answered. Never silently move an unasked human-only issue into UNKNOWN_INFORMATION.');"
          new_stage1="if(stage===1)lines.push('Exhaust human-authority intake before Stage 01 completion: every application-enumerated input unit must be classified exactly once and every inputId exactly once, every materially relevant human-authority statement must be preserved, and every foreseeable genuinely human-only BLOCKING_NOW or ASK_NOW_NONBLOCKING issue must be asked before final Stage 01 JSON unless already answered. Never silently move an unasked human-only issue into UNKNOWN_INFORMATION.');"
          if old_stage1 not in s: raise SystemExit('Stage 01 rule marker missing')
          s=s.replace(old_stage1,new_stage1,1)

          old_stage3="if(stage===3)lines.push('Stage 03 is exhaustive source research: every current Stage 02 source must have current coverage, the conflict/exception pass and second complete pass must be performed, and Stage 03 must not complete while the latest complete pass finds a new material requirement category.');"
          new_stage3="if(stage===3)lines.push('Stage 03 is exhaustive source research: every current Stage 02 source must have current coverage, the conflict/exception pass and second complete pass must be performed, and Stage 03 must not complete while the latest complete pass finds a new material requirement category; never ask the user to repeat available project facts, and never ask the user to reattach the original Stage 01 intent file solely to rediscover captured semantics.');"
          if old_stage3 not in s: raise SystemExit('Stage 03 rule marker missing')
          s=s.replace(old_stage3,new_stage3,1)

          old_heading='HUMAN COLLABORATION MODE — APPLIES TO EVERY EXTERNAL-AGENT STAGE'
          new_heading='HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE'
          if old_heading not in s: raise SystemExit('human collaboration heading missing')
          s=s.replace(old_heading,new_heading,1)
          p.write_text(s)

          e=Path('workflow-engine.js'); w=e.read_text()
          old_gate="      // Stage 06 proves the verification definition is complete, not that future execution inputs already exist.\n      // Exact byte readiness remains fail-closed in testExecutionPlan() at the execution stage."
          new_gate="      const executionPlan=testExecutionPlan(project);\n      const missingArtifactTestIds=safe(executionPlan?.missingArtifactTestIds);\n      if(missingArtifactTestIds.length)reasons.push(`Required artifact bytes are missing or no longer application-verified for mandatory test(s): ${missingArtifactTestIds.join(', ')}.`);"
          if old_gate not in w: raise SystemExit('Stage 06 gate marker missing')
          e.write_text(w.replace(old_gate,new_gate,1))

          h=Path('index.html'); x=h.read_text()
          old_css='.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'
          new_css='.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'
          if old_css not in x: raise SystemExit('prompt expansion CSS marker missing')
          h.write_text(x.replace(old_css,new_css,1))

          t=Path('verify-complete.mjs'); v=t.read_text()
          old_fixture="  const p=project('JOB-BAD-REL'),stage=3,pr=prompt(p,stage);"
          new_fixture="  const p=project('JOB-BAD-REL'),stage=3; p.stages[2].status='COMPLETE'; p.stages[2].gate={complete:true,blocked:false,reasons:[]}; const pr=prompt(p,stage);"
          if old_fixture not in v: raise SystemExit('verify-complete Stage 3 fixture marker missing')
          v=v.replace(old_fixture,new_fixture,1)
          old_refine="  const p=project('JOB-REFINEMENT-CANONICAL'),stage=2,source=record('sources',2,{TITLE:'Accepted source'},'SOURCE-REFINE');"
          new_refine="  const p=project('JOB-REFINEMENT-CANONICAL'),stage=2,source=record('sources',2,{TITLE:'Accepted source'},'SOURCE-REFINE'); p.stages[1].status='COMPLETE'; p.stages[1].gate={complete:true,blocked:false,reasons:[]};"
          if old_refine not in v: raise SystemExit('verify-complete refinement fixture marker missing')
          t.write_text(v.replace(old_refine,new_refine,1))
          PY
      - name: Verify candidate
        shell: bash
        run: |
          set +e
          : > spec3-candidate-result.txt
          status=0
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            echo "=== node --check $file ===" >> spec3-candidate-result.txt
            node --check "$file" >> spec3-candidate-result.txt 2>&1 || status=1
          done
          for test in verify-all-stage-prompts.mjs verify-stage-prompts-complete.mjs verify-one-time-intent-intake.mjs verify-prompt-semantics.mjs verify-complete.mjs; do
            echo "=== $test ===" >> spec3-candidate-result.txt
            node "$test" >> spec3-candidate-result.txt 2>&1 || status=1
          done
          echo "FINAL_STATUS=$status" >> spec3-candidate-result.txt
          cat spec3-candidate-result.txt
          echo "$status" > .candidate-status
          exit 0
      - name: Retain only a passing candidate
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat .candidate-status)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" = "0" ]; then
            rm -f .github/workflows/spec3-monotonic-repair.yml spec3-diagnostic.txt spec3-source-diagnostic.txt spec3-candidate-result.txt
            git add prompt-engine.js workflow-engine.js index.html verify-complete.mjs .github/workflows/spec3-monotonic-repair.yml spec3-diagnostic.txt spec3-source-diagnostic.txt spec3-candidate-result.txt
            git commit -m "Strengthen prompt closure and Stage 6 byte readiness"
          else
            git checkout -- prompt-engine.js workflow-engine.js index.html verify-complete.mjs
            git add spec3-candidate-result.txt
            git commit -m "Record exact monotonic candidate failures" || true
          fi
          git push origin HEAD:spec3-monotonic-20260831
