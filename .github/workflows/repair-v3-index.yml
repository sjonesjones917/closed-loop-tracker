name: One-time v3 index repair
on:
  push:
    branches: [implementation/closed-loop-v3]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair direct runtime graph and worker CSP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="default-src 'self' data: blob:; script-src 'self' 'sha256-YgkAI8+6MdirEbh6wT7XpR2zE/QVMj5bMSNrm4/WvUc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
          new="default-src 'none'; script-src 'self' 'sha256-YgkAI8+6MdirEbh6wT7XpR2zE/QVMj5bMSNrm4/WvUc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
          if old in s:
              s=s.replace(old,new,1)
          marker='<script defer src="workflow-schema.js?v=runtime-bec66cf2784e2a2b"></script>\n'
          runtime='<script defer src="test-runtime.js?v=runtime-bec66cf2784e2a2b"></script>\n'
          if runtime not in s:
              if marker not in s: raise SystemExit('workflow-schema runtime marker missing')
              s=s.replace(marker,marker+runtime,1)
          p.write_text(s)
          PY
          node build-test-project.mjs
          node verify-test-runtime.mjs
          rm .github/workflows/repair-v3-index.yml
          git diff --check
      - name: Commit proved repair and remove applicator
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/repair-v3-index.yml
          git commit -m "Repair v3 direct runtime graph and worker CSP"
          git push origin HEAD:implementation/closed-loop-v3
