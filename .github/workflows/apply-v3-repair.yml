          s=replace_once(s,"version:'closed-loop-workflow-schema/2'","version:'closed-loop-workflow-schema/3'",'workflow schema version')
          s=replace_once(s,"  'JOB_TITLE','JOB_OWNER','EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY',","  'EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY',",'human job owner partition')
          anchor="const APPLICATION_JOB_FIELDS=Object.freeze(["
          s=replace_once(s,anchor,"const HUMAN_DECISION_JOB_FIELDS=Object.freeze(['JOB_TITLE','JOB_OWNER']);\n"+anchor,'human decision job partition')
          s=replace_once(s,"  if(APPLICATION_JOB_FIELDS.includes(name))return field(name,PRODUCER.APPLICATION,{derivation:`Application derives ${name} from canonical project state.`});\n  if(HUMAN_JOB_FIELDS.includes(name))", "  if(APPLICATION_JOB_FIELDS.includes(name))return field(name,PRODUCER.APPLICATION,{derivation:`Application derives ${name} from canonical project state.`});\n  if(HUMAN_DECISION_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN_DECISION,{provenanceRequired:false,nullable:true});\n  if(HUMAN_JOB_FIELDS.includes(name))",'job decision definition')
          s=replace_once(s,"[...new Set([...HUMAN_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])]","[...new Set([...HUMAN_JOB_FIELDS,...HUMAN_DECISION_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])]",'job field union')
          s=replace_once(s,"      \"EXECUTABLE_SPEC_VERSION\",\n      \"EXECUTABLE_SPEC\",","      \"EXECUTABLE_SPEC\",",'remove agent spec version')
          s=replace_once(s,"      \"TEST_ID\",\n      \"REQ_ID\",\n      \"STATUS\"","      \"TEST_ID\",\n      \"REQ_ID\",\n      \"EXECUTABLE_SPEC_VERSION\",\n      \"EXECUTABLE_SPEC_SHA256\",\n      \"STATUS\"",'application test fields')
          s=replace_once(s,"executableKinds:Object.freeze(['NONE','CUSTOM_PIPELINE'])","executableKinds:Object.freeze(['NONE','TEST_IR'])",'test ir kind')
