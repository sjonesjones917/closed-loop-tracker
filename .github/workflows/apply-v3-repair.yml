  if(stage===1){const manifest=promptRecord?.contextManifest?.intakeCoverageManifest,required=safe(manifest?.units).map(x=>String(x.unitId));if(!manifest){issues.push(issue('MISSING_INTAKE_MANIFEST','/promptIdentity/contextSignature','The controlling Stage 01 intake manifest is missing.'));return;}let parsed;try{parsed=JSON.parse(String(envelope?.stageData?.INPUT_SET_CONTENTS||''));}catch{issues.push(issue('INVALID_INTAKE_CAPTURE','/stageData/INPUT_SET_CONTENTS','INPUT_SET_CONTENTS must be the structured Stage 01 capture JSON string.'));return;}if(!object(parsed)||!Array.isArray(parsed.units)){issues.push(issue('INVALID_INTAKE_CAPTURE','/stageData/INPUT_SET_CONTENTS','Structured Stage 01 capture must contain a units array.'));return;}const allowed=new Set(['incorporated into the job definition','retained as context','unresolved human-only','later-resolvable','inapplicable with reason']),ids=[];for(const [i,u] of parsed.units.entries()){const id=String(u?.sourceUnitId||'');ids.push(id);if(!required.includes(id))issues.push(issue('UNKNOWN_INTAKE_UNIT',`/stageData/INPUT_SET_CONTENTS/units/${i}/sourceUnitId`,'Unknown intake unit identity.'));if(!allowed.has(String(u?.disposition||'')))issues.push(issue('INVALID_INTAKE_DISPOSITION',`/stageData/INPUT_SET_CONTENTS/units/${i}/disposition`,'Invalid intake disposition.'));if(!Array.isArray(u?.extractedStatements))issues.push(issue('INVALID_INTAKE_STATEMENTS',`/stageData/INPUT_SET_CONTENTS/units/${i}/extractedStatements`,'extractedStatements must be an array.'));else{const keys=new Set();for(const [j,st] of u.extractedStatements.entries()){if(!String(st?.statementKey||'').trim()||keys.has(String(st.statementKey)))issues.push(issue('INVALID_INTAKE_STATEMENT_KEY',`/stageData/INPUT_SET_CONTENTS/units/${i}/extractedStatements/${j}/statementKey`,'Statement keys must be non-empty and unique within the unit.'));keys.add(String(st?.statementKey||''));if(!String(st?.text||'').trim())issues.push(issue('EMPTY_INTAKE_STATEMENT',`/stageData/INPUT_SET_CONTENTS/units/${i}/extractedStatements/${j}/text`,'Captured human-authority statement text cannot be empty.'));}}}if(new Set(ids).size!==ids.length)issues.push(issue('DUPLICATE_INTAKE_UNIT','/stageData/INPUT_SET_CONTENTS','Each controlled input unit must be classified exactly once.'));for(const id of required)if(!ids.includes(id))issues.push(issue('MISSING_INTAKE_UNIT','/stageData/INPUT_SET_CONTENTS','Controlled input unit omitted: '+id+'.'));}
  if(stage===4){const manifest=promptRecord?.contextManifest?.obligationManifest,required=safe(manifest?.items).map(x=>String(x.obligationId));if(!manifest){issues.push(issue('MISSING_OBLIGATION_MANIFEST','/promptIdentity/contextSignature','The controlling Stage 04 obligation manifest is missing.'));return;}const mapped=new Map();const mark=(id,kind,path)=>{if(!required.includes(id)){issues.push(issue('UNKNOWN_OBLIGATION_ID',path,'Unknown obligation identity '+id+'.'));return;}const kinds=mapped.get(id)||new Set();kinds.add(kind);mapped.set(id,kinds);};for(const [i,row] of safe(envelope?.records?.requirements).entries())for(const id of (String(row?.fields?.USER_INPUT_RELATIONSHIP||'').match(/OBLIGATION-[A-Z0-9]+/g)||[]))mark(id,'REQUIREMENT',`/records/requirements/${i}/fields/USER_INPUT_RELATIONSHIP`);for(const [i,ev] of safe(envelope?.evidence).entries()){if(upper(ev?.kind)!=='OBLIGATION_DISPOSITION')continue;try{const d=JSON.parse(String(ev.content||'')),id=String(d.obligationId||''),disp=String(d.disposition||'');if(!['retained nonnormative context','inapplicable','blocked'].includes(disp))issues.push(issue('INVALID_OBLIGATION_DISPOSITION',`/evidence/${i}/content`,'Invalid obligation disposition.'));else mark(id,'DISPOSITION',`/evidence/${i}/content`);if(!String(d.reason||'').trim())issues.push(issue('MISSING_OBLIGATION_REASON',`/evidence/${i}/content`,'Non-requirement obligation disposition requires a reason.'));}catch{issues.push(issue('MALFORMED_OBLIGATION_DISPOSITION',`/evidence/${i}/content`,'OBLIGATION_DISPOSITION content must be strict JSON.'));}}for(const id of required){const kinds=mapped.get(id);if(!kinds||!kinds.size)issues.push(issue('MISSING_OBLIGATION_ACCOUNTING','/records/requirements','Stage 04 obligation omitted: '+id+'.'));else if(kinds.size>1)issues.push(issue('CONFLICTING_OBLIGATION_DISPOSITION','/records/requirements','Stage 04 obligation has both requirement and non-requirement dispositions: '+id+'.'));}}
