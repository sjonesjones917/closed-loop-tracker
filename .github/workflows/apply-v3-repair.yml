"""
          s=replace_once(s,"function validateEnvelope(project,envelope,{stage,promptRecord,rawSha256,files=[]}={}){",helper+"\nfunction validateEnvelope(project,envelope,{stage,promptRecord,rawSha256,files=[]}={}){",'ingestion accounting helper')
          s=replace_once(s,"  const contract=schema.STAGE_CONTRACTS[stageNumber];\n", "  const contract=schema.STAGE_CONTRACTS[stageNumber];\n  validateAccountingClosure(envelope,promptRecord,issues);\n",'ingestion accounting call')
          write(p,s)

          # prompt-engine Stage 06 does not ask agent to write application-owned spec version.
          p='prompt-engine.js'; s=read(p)
          s=s.replace("EXECUTABLE_KIND = TEST_IR, EXECUTABLE_SPEC_VERSION = ${schema.TEST_IR.version}, plus valid EXECUTABLE_SPEC and EXECUTABLE_INPUT_BINDINGS", "EXECUTABLE_KIND = TEST_IR plus valid EXECUTABLE_SPEC and EXECUTABLE_INPUT_BINDINGS. The application assigns EXECUTABLE_SPEC_VERSION = ${schema.TEST_IR.version} and the normalized executable-spec SHA-256")
          write(p,s)

          # Update focused runtime regression to the new kind and close the Stage 04 reattachment hole.
          p='verify-test-runtime.mjs'; s=read(p)
          s=s.replace("EXECUTABLE_KIND:'CUSTOM_PIPELINE'","EXECUTABLE_KIND:'TEST_IR'")
          needle="assert.equal(stage4Handoff.expectBack.length,0,'Stage 04 must not require a return attachment outside canonical structured ingestion.');"
          if needle in s:
              s=s.replace(needle,needle+"\nassert.equal(stage4Handoff.conversationMaterials.length,0,'Stage 04 must not tell the operator to reattach the original intent material after Stage 01 capture.');")
          s=s.replace("assert.ok(!/required stage 04 input file|add the exact supplied project file|missing or unverified.*stage 04/i.test(nextAction),'Stage 04 next action must not require a browser artifact copy as a canonical prerequisite.');", "assert.ok(!/attach|provide the original|send the stage 04 instruction with/i.test(nextAction),'Stage 04 next action must not ask for the original intent material again.');\nassert.ok(/already supplied the captured human-authority input/i.test(nextAction),'Stage 04 next action must state that the captured intake is already available.');")
          write(p,s)

          # Update schema/runtime tests using the executable-kind rename; retain explicit legacy /2 migration fixtures.
          for name in ['verify-complete.mjs','verify-ingestion.mjs','verify-full-cycle.mjs','verify-prompt-semantics.mjs','verify-semantic-invariant.mjs','verify.mjs']:
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text().replace("EXECUTABLE_KIND:'CUSTOM_PIPELINE'","EXECUTABLE_KIND:'TEST_IR'").replace('EXECUTABLE_KIND: \'CUSTOM_PIPELINE\'','EXECUTABLE_KIND: \'TEST_IR\'').replace('"EXECUTABLE_KIND":"CUSTOM_PIPELINE"','"EXECUTABLE_KIND":"TEST_IR"')
              p.write_text(t)

          # Definition-of-done current target identities move to /3; historical /2 strings elsewhere are intentionally retained.
          p='verify-definition-of-done.mjs'; s=read(p)
          s=s.replace("schema.PROJECT_SCHEMA==='closed-loop-project/2'","schema.PROJECT_SCHEMA==='closed-loop-project/3'")
          s=s.replace("schema.RESPONSE_SCHEMA==='closed-loop-stage-response/2'","schema.RESPONSE_SCHEMA==='closed-loop-stage-response/3'")
          write(p,s)

          # Remove this one-time repair workflow from the resulting source tree.
          Path('.github/workflows/apply-v3-repair.yml').unlink()

          # Shared runtime build identity: include test-runtime.js in the target dependency graph and stamp all direct runtime scripts.
          runtime=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          def git_blob_sha(path):
              b=Path(path).read_bytes();return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          manifest=''.join(f'{f}:{git_blob_sha(f)}\n' for f in runtime)
          identity='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          html=read('index.html')
          for f in runtime:
              html=re.sub(rf'({re.escape(f)}\?v=)runtime-[0-9a-f]{{16}}',rf'\1{identity}',html)
          write('index.html',html)

          # Keep hash verification aligned with the declared runtime graph.
          p='verify-hash.mjs'; s=read(p)
          s=s.replace("const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];","const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];")
          write(p,s)

          # Syntax and focused checks before commit. Full PR CI runs after the repair commit is surfaced.
          for f in runtime+['test-worker.js']:
              subprocess.run(['node','--check',f],check=True)
          subprocess.run(['node','build-test-project.mjs'],check=True)
          subprocess.run(['node','verify-test-runtime.mjs'],check=True)
          subprocess.run(['node','verify-hash.mjs'],check=True)
          PY
      - name: Commit atomic repair
        shell: bash
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git commit -m "[v3-repair] enforce closed intake and Stage 04 obligation accounting"
          git push origin HEAD:closed-loop-v3-completion
