          if count!=1: raise SystemExit(f'Stage 04 handoff block expected 1, found {count}')
          s=s[:segment.start()]+seg2+s[segment.end():]
          s=sub_once(s,r"if\(stage===4\)\{const handoff=executionHandoff\(project,\{stage:4,operation:'COMPLETE'\}\),materials=handoff\.conversationMaterials\.map\(item=>item\.label\);if\(materials\.length\)return 'Send the Stage 04 instruction with '\+materials\.join\(', '\)\+'\. The prompt does not include those materials\. When the agent finishes, paste its final JSON response here\.';\}","if(stage===4)return 'Use the current Stage 04 instruction. The application has already supplied the captured human-authority input and complete obligation manifest; do not reattach the original intent file. Return the final structured JSON when requirement compilation is complete.';",'stage04 next action')
          s=replace_once(s,"tests:Object.freeze({STATUS:'READY'})","tests:Object.freeze({STATUS:'READY',EXECUTABLE_SPEC_VERSION:schema.TEST_IR.version})",'test initial application fields')
          old_refresh="function refreshRecordHashes(record,collection){\n  if(!record)return record;const definition=schema.RECORD_SCHEMAS[collection];if(!definition)return record;record.contentSha256=hash.contentRecordSha256(record,definition.idField);record.recordSha256=hash.recordSha256(record);record.sha256=record.recordSha256;return record;\n}"
          new_refresh="function refreshRecordHashes(record,collection){\n  if(!record)return record;const definition=schema.RECORD_SCHEMAS[collection];if(!definition)return record;if(collection==='tests'){record.fields=record.fields&&typeof record.fields==='object'?record.fields:{};const kind=upper(recordValue(record,'EXECUTABLE_KIND'));if(kind==='TEST_IR'){record.fields.EXECUTABLE_SPEC_VERSION=schema.TEST_IR.version;record.EXECUTABLE_SPEC_VERSION=schema.TEST_IR.version;const specHash=hash.sha256Value(recordValue(record,'EXECUTABLE_SPEC'));record.fields.EXECUTABLE_SPEC_SHA256=specHash;record.EXECUTABLE_SPEC_SHA256=specHash;}else{record.fields.EXECUTABLE_SPEC_VERSION=null;record.EXECUTABLE_SPEC_VERSION=null;record.fields.EXECUTABLE_SPEC_SHA256=null;record.EXECUTABLE_SPEC_SHA256=null;}}record.contentSha256=hash.contentRecordSha256(record,definition.idField);record.recordSha256=hash.recordSha256(record);record.sha256=record.recordSha256;return record;\n}"
          s=replace_once(s,old_refresh,new_refresh,'test spec application derivation')
          helper="""
function acceptedAccountingClosure(project,stage){
  const latest=acceptedChanges(project,stage).at(-1);if(!latest)return {complete:false,reasons:['No accepted data change exists.']};
  const proposal=safe(project.projectData.responseProposals).find(item=>item.proposalId===latest.proposalId),envelope=proposal?.envelope||{},prompt=safe(project.projectData.generatedPrompts).find(item=>(item.instructionId||item.promptId)===(proposal?.promptId||latest.promptId));
  if(stage===1){const manifest=prompt?.contextManifest?.intakeCoverageManifest,required=safe(manifest?.units).map(x=>String(x.unitId)),reasons=[];let parsed=null;try{parsed=JSON.parse(String(envelope?.stageData?.INPUT_SET_CONTENTS||''));}catch{reasons.push('Stage 01 INPUT_SET_CONTENTS is not the required structured intake capture.');}const units=safe(parsed?.units),ids=units.map(x=>String(x?.sourceUnitId||'')),unique=new Set(ids);if(!manifest)reasons.push('The controlling Stage 01 intake manifest is missing.');if(ids.length!==required.length||unique.size!==ids.length||required.some(id=>!unique.has(id))||ids.some(id=>!required.includes(id)))reasons.push('Stage 01 controlled-input accounting is not exactly complete.');return {complete:reasons.length===0,reasons,coverage:required.length&&reasons.length===0?1:0,manifestSha256:manifest?.manifestSha256||null};}
  if(stage===4){const manifest=prompt?.contextManifest?.obligationManifest,required=safe(manifest?.items).map(x=>String(x.obligationId)),mapped=new Map(),blocked=[],reasons=[];const mark=(id,kind)=>{if(!required.includes(id)){reasons.push('Unknown Stage 04 obligation identity '+id+'.');return;}const prior=mapped.get(id)||new Set();prior.add(kind);mapped.set(id,prior);};for(const row of safe(envelope?.records?.requirements))for(const id of (String(row?.fields?.USER_INPUT_RELATIONSHIP||'').match(/OBLIGATION-[A-Z0-9]+/g)||[]))mark(id,'REQUIREMENT');for(const ev of safe(envelope?.evidence).filter(x=>upper(x?.kind)==='OBLIGATION_DISPOSITION')){try{const d=JSON.parse(String(ev.content||'')),id=String(d.obligationId||''),disposition=String(d.disposition||'');if(!['retained nonnormative context','inapplicable','blocked'].includes(disposition))reasons.push('Invalid Stage 04 non-requirement disposition for '+id+'.');else{mark(id,'DISPOSITION');if(disposition==='blocked')blocked.push(id);if(!String(d.reason||'').trim())reasons.push('Stage 04 non-requirement disposition lacks a reason for '+id+'.');}}catch{reasons.push('Stage 04 OBLIGATION_DISPOSITION evidence content is not strict JSON.');}}if(!manifest)reasons.push('The controlling Stage 04 obligation manifest is missing.');for(const id of required){const kinds=mapped.get(id);if(!kinds||!kinds.size)reasons.push('Stage 04 obligation is unaccounted: '+id+'.');if(kinds&&kinds.size>1)reasons.push('Stage 04 obligation has conflicting requirement/non-requirement dispositions: '+id+'.');}return {complete:reasons.length===0&&!blocked.length,reasons:[...reasons,...blocked.map(id=>'Stage 04 obligation remains blocked: '+id+'.')],coverage:required.length&&reasons.length===0?mapped.size/required.length:0,blocked,manifestSha256:manifest?.manifestSha256||null};}
  return {complete:true,reasons:[],coverage:1};
