name: Apply v3 repair

on:
  push:
    branches: [closed-loop-v3-completion]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[v3-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-v3-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply controlling v3 repair atomically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, subprocess

          def read(path): return Path(path).read_text()
          def write(path,text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old,new,1)
          def sub_once(text, pattern, repl, label, flags=0):
              out,count=re.subn(pattern,repl,text,count=1,flags=flags)
              if count != 1: raise SystemExit(f'{label}: expected exactly one regex match, found {count}')
              return out

