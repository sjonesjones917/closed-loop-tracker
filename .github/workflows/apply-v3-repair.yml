          s=replace_once(s,"const LIMITS=Object.freeze({maxSteps:64,maxTextBytes:16*1024*1024,maxCollectionItems:100000,maxRegexLength:2000,maxCsvCells:250000});","const LIMITS=Object.freeze({maxInputBytes:16*1024*1024,maxTextBytes:16*1024*1024,maxDecompressedBytes:32*1024*1024,maxSteps:64,maxSelectorDepth:32,maxParsedDepth:64,maxCollectionItems:100000,maxRegexLength:2000,maxRegexInputBytes:16*1024*1024,maxWorkerMilliseconds:5000,maxArchiveExpansionBytes:32*1024*1024,maxCsvCells:250000});",'runtime limits')
          s=replace_once(s,"function parseCsv(text){\n  const rows=[];let row=[],cell='',quoted=false,cells=0;","function parseCsv(text,config){\n  if(!config||typeof config!=='object'||Array.isArray(config))throw new Error('PARSE_CSV requires explicit config.');\n  const allowed=new Set(['delimiter','header','quote','newline','encoding']);for(const key of Object.keys(config))if(!allowed.has(key))throw new Error('Unsupported CSV config key '+key+'.');\n  const delimiter=String(config.delimiter??'');const quote=String(config.quote??'');if(delimiter.length!==1||quote.length!==1)throw new Error('CSV delimiter and quote must be one character.');if(config.encoding!=='UTF-8')throw new Error('CSV encoding must be UTF-8.');if(!['LF','CRLF','AUTO'].includes(config.newline))throw new Error('CSV newline must be LF, CRLF, or AUTO.');if(typeof config.header!=='boolean')throw new Error('CSV header must be Boolean.');\n  const rows=[];let row=[],cell='',quoted=false,cells=0;",'csv config')
          s=s.replace("if(ch==='\"'&&text[i+1]==='\"'){cell+='\"';i++;}else if(ch==='\"')quoted=false;", "if(ch===quote&&text[i+1]===quote){cell+=quote;i++;}else if(ch===quote)quoted=false;")
          s=s.replace("if(ch==='\"'){if(cell.length)throw new Error('Malformed CSV: quote begins inside an unquoted field.');quoted=true;continue;}\n    if(ch===',')", "if(ch===quote){if(cell.length)throw new Error('Malformed CSV: quote begins inside an unquoted field.');quoted=true;continue;}\n    if(ch===delimiter)")
          s=s.replace("  return rows;\n}\nfunction selectJsonPath", "  if(config.header&&rows.length){const header=rows[0],body=rows.slice(1);return body.map(row=>Object.fromEntries(header.map((name,index)=>[String(name),row[index]??''])));}\n  return rows;\n}\nfunction parseXml(text){if(typeof DOMParser==='undefined')throw new Error('PARSE_XML is unavailable in this execution environment.');const doc=new DOMParser().parseFromString(String(text),'application/xml');if(doc.querySelector('parsererror'))throw new Error('Malformed XML.');return doc;}\nfunction selectXml(value,path){const text=String(path||'').trim();if(!/^\/[A-Za-z_][A-Za-z0-9_.:-]*(?:\/[A-Za-z_][A-Za-z0-9_.:-]*)*$/.test(text))throw new Error('SELECT_XML supports only absolute child-element paths.');let nodes=[value?.documentElement].filter(Boolean);const parts=text.split('/').filter(Boolean);if(!nodes.length||nodes[0].tagName!==parts[0])throw new Error('XML selector root does not match.');for(const part of parts.slice(1))nodes=nodes.flatMap(node=>[...node.children].filter(child=>child.tagName===part));return nodes;}\nfunction selectJsonPath")
          s=replace_once(s,"if(String(field(test,'EXECUTABLE_KIND')||'').toUpperCase()!=='CUSTOM_PIPELINE')return false;","if(String(field(test,'EXECUTABLE_KIND')||'').toUpperCase()!=='TEST_IR')return false;",'runtime test ir kind')
          s=replace_once(s,"      case 'PARSE_CSV':value=parseCsv(String(value));break;\n      case 'SELECT_JSON_PATH':value=selectJsonPath(value,step.path);break;", "      case 'PARSE_CSV':value=parseCsv(String(value),step.config);break;\n      case 'PARSE_XML':value=parseXml(String(value));break;\n      case 'SELECT_JSON_PATH':value=selectJsonPath(value,step.path);break;\n      case 'SELECT_XML':value=selectXml(value,step.path);break;",'runtime xml/csv cases')
          s=s.replace("      case 'ASSERT_EXISTS':assertion=assertCondition(value!==null&&value!==undefined,step.value??'present',value,step.message);break;\n      case 'ASSERT_TYPE':{const actual=Array.isArray(value)?'array':value===null?'null':typeof value;assertion=assertCondition(actual===String(step.value),step.value,actual,step.message);break;}\n",'')
          s=s.replace("      case 'ASSERT_NE':assertion=assertCondition(stable(comparable(value))!==stable(comparable(step.value)),`not ${stable(step.value)}`,comparable(value),step.message);break;\n",'')
