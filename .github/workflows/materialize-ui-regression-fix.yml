name: Materialize UI regression fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.head_commit.message != 'Fix project actions and restore prompt sizing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source on repair branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='repair/project-actions-and-visual-regression-final'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app-core.js')
          s=app.read_text()
          old="const projectActionsMenu=$('.project-action-menu'),projectActionsToggle=$('#project-actions-toggle');if(projectActionsMenu&&projectActionsToggle){const setProjectActionsOpen=open=>{projectActionsMenu.open=Boolean(open);projectActionsToggle.setAttribute('aria-expanded',String(Boolean(open)));};projectActionsToggle.onclick=event=>{event.preventDefault();const open=!projectActionsMenu.open;setProjectActionsOpen(open);announce(open?'project actions opened':'project actions closed');};document.addEventListener('click',event=>{if(projectActionsMenu.open&&!projectActionsMenu.contains(event.target))setProjectActionsOpen(false);},true);}"
          new="const projectActionsMenu=$('.project-action-menu'),projectActionsToggle=$('#project-actions-toggle');if(projectActionsMenu&&projectActionsToggle){const syncProjectActions=()=>projectActionsToggle.setAttribute('aria-expanded',String(projectActionsMenu.open));projectActionsMenu.addEventListener('toggle',syncProjectActions);syncProjectActions();document.addEventListener('click',event=>{if(projectActionsMenu.open&&!projectActionsMenu.contains(event.target)){projectActionsMenu.open=false;syncProjectActions();}},true);}"
          if old not in s: raise SystemExit('project actions implementation not found')
          s=s.replace(old,new).replace("runtime-20260830-live-operator-49","runtime-20260830-live-operator-50")
          app.write_text(s)
          idx=Path('index.html')
          h=idx.read_text()
          oldcss='.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'
          newcss='.expandable-prompt.expanded{height:auto;max-height:none}'
          if oldcss not in h: raise SystemExit('prompt sizing override not found')
          h=h.replace(oldcss,newcss).replace('runtime-20260830-live-operator-49','runtime-20260830-live-operator-50')
          idx.write_text(h)
          wf=Path('.github/workflows/materialize-ui-regression-fix.yml')
          wf.unlink()
          PY
          git add -A
          git commit -m 'Fix project actions and restore prompt sizing'
          git push origin "$BRANCH" --force
