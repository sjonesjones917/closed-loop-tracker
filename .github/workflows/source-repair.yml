name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Make Stage 04 obligation manifest authority explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/57';"
          new="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/58';"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Prompt engine version marker not found')
          old2="APPLICATION OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION"
          new2="APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION"
          if old2 in s:s=s.replace(old2,new2,1)
          elif new2 not in s:raise SystemExit('Stage 04 obligation manifest heading not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check prompt-engine.js
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add prompt-engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Stage 04 obligation authority explicit'
          git push origin HEAD:repair/spec3-proof-gate
      - name: Expose next ordered prompt proof failure
        run: node verify-stage-prompts-complete.mjs
