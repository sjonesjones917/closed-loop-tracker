name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Remove obsolete intentStatements collection assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-stage-prompts-complete.mjs')
          s=p.read_text()
          s2=s.replace("2:['intentStatements'],4:['sourceConflicts'],5:['intentStatements','sources','candidateRequirements']","2:[],4:['sourceConflicts'],5:['sources','candidateRequirements']",1)
          if s2==s and "2:[],4:['sourceConflicts'],5:['sources','candidateRequirements']" not in s:
              raise SystemExit('Obsolete intentStatements assertions not found')
          p.write_text(s2)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-stage-prompts-complete.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-stage-prompts-complete.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove obsolete intentStatements read assertions'
          git push origin HEAD:repair/spec3-proof-gate
