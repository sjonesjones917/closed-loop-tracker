name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Align Stage 04 declared reads and close static Stage 01 fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          s=p.read_text()
          old="4:['research','candidateRequirements','sources','evidenceRecords']"
          new="4:['research','candidateRequirements','sources','sourceConflicts','evidenceRecords']"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Stage 04 READ_COLLECTIONS entry not found')
          p.write_text(s)

          q=Path('verify-stage-prompts-complete.mjs')
          t=q.read_text()
          old2="engine.ensureShape(p);engine.recalculate(p);for(let stage=1;stage<=30;stage++){p.stages[stage].status='COMPLETE';p.stages[stage].gate={complete:true,blocked:false,reasons:[]};}"
          new2="engine.ensureShape(p);engine.recalculate(p);const intakePrompt=prompts.buildPromptRecord(1,p),intakeManifest=intakePrompt.contextManifest.intakeCoverageManifest;p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intakeManifest.inputVersion,manifestSha256:intakeManifest.manifestSha256,units:intakeManifest.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'Static all-stage prompt audit fixture.',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||u.label,statementClass:'FACT'}]}))});p.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';for(let stage=1;stage<=30;stage++){p.stages[stage].status='COMPLETE';p.stages[stage].gate={complete:true,blocked:false,reasons:[]};}"
          if old2 in t:t=t.replace(old2,new2,1)
          elif new2 not in t:raise SystemExit('Static all-stage prompt fixture initialization not found')
          q.write_text(t)
          PY
      - name: Commit controlled repair
        run: |
          node --check workflow-schema.js
          node --check verify-stage-prompts-complete.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js verify-stage-prompts-complete.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align Stage 04 declared source conflict context'
          git push origin HEAD:repair/spec3-proof-gate
      - name: Expose next ordered prompt proof failure
        run: node verify-stage-prompts-complete.mjs
