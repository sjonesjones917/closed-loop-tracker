name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Make ingestion fixture honor enum declarations
        run: python3 -c "from pathlib import Path; p=Path('verify-ingestion.mjs'); s=p.read_text(); old=\"for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);}\"; new=\"for(const name of def.required){const fieldDef=def.fieldDefinitions[name];if(fieldDef?.producer===schema.PRODUCER.AGENT)fields[name]=valueForDefinition(fieldDef);}\"; assert old in s or new in s; p.write_text(s if new in s else s.replace(old,new,1))"
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make ingestion fixture honor enum declarations'
          git push origin HEAD:repair/spec3-proof-gate
