name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Restrict ingestion fixture stageData to agent authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);"
          new="const writableStageField=stageFields.find(name=>schema.STAGE_FIELDS[stage]?.[name]?.producer===schema.PRODUCER.AGENT);if(writableStageField)stageData[writableStageField]=valueForDefinition(schema.STAGE_FIELDS[stage][writableStageField]);"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('stageData fixture line not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Respect stage-data producer authority in ingestion fixture'
          git push origin HEAD:repair/spec3-proof-gate
