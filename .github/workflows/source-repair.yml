name: Controlled source repair
on:
  push:
    branches: [repair/spec3-proof-gate]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Respect prompt prerequisites in ingestion fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-ingestion.mjs')
          text=path.read_text()
          old="""function savePrompt(p,stage){
  if(stage===4)prepareStage4Upstream(p);
  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};
"""
          new="""function savePrompt(p,stage){
  if(stage===4)prepareStage4Upstream(p);
  else if(stage>1){p.stages[stage-1].status='COMPLETE';p.stages[stage-1].gate={complete:true,blocked:false,reasons:[]};}
  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};
"""
          if old not in text:
              if new in text: raise SystemExit(0)
              raise SystemExit('Expected savePrompt fixture block not found')
          path.write_text(text.replace(old,new,1))
          PY
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          git commit -m 'Respect prompt prerequisites in ingestion fixtures'
          git push origin HEAD:repair/spec3-proof-gate
