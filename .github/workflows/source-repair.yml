name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Derive ingestion fixture prompt scope from schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          anchor="function savePrompt(p,stage){\n"
          helper="""function fixturePromptOptions(stage,operation){
  const scope={};
  for(const key of schema.operationContract(stage,operation)?.scopeRequirements||[]){
    if(key==='runId')scope.runId=`RUN-FIXTURE-${stage}`;
    if(key==='contextId')scope.contextId=`CONTEXT-FIXTURE-${stage}`;
  }
  return Object.keys(scope).length?{scope}:{};
}
"""
          if helper not in s:
              if anchor not in s: raise SystemExit('savePrompt anchor not found')
              s=s.replace(anchor,helper+anchor,1)
          old1="const options=stage===19?{operation:'COMPARE'}:[11,12,23,24].includes(stage)?{scope:{runId:`RUN-INGESTION-${stage}`,contextId:`CONTEXT-INGESTION-${stage}`}}:{};"
          new1="const operation=stage===19?'COMPARE':'COMPLETE',options={...fixturePromptOptions(stage,operation),...(stage===19?{operation}: {})};"
          if old1 in s: s=s.replace(old1,new1,1)
          elif new1 not in s: raise SystemExit('savePrompt options fixture not found')
          old2="const nextOptions=[11,12,23,24].includes(nextStage)?{scope:{runId:`RUN-NEXT-${nextStage}`,contextId:`CONTEXT-NEXT-${nextStage}`}}:{}"
          new2="const nextOptions=fixturePromptOptions(nextStage,'COMPLETE')"
          if old2 in s: s=s.replace(old2,new2,1)
          elif new2 not in s: raise SystemExit('next-stage options fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Derive ingestion fixture scope from schema'
          git push origin HEAD:repair/spec3-proof-gate
