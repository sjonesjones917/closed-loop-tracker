name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Preserve Stage 17 prerequisite through clarification fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="const request=p.projectData.humanInputRequests.at(-1);p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'},{operator:'VERIFY'}).project;"
          new="const request=p.projectData.humanInputRequests.at(-1);p.stages[16].status='COMPLETE';p.stages[16].gate={complete:true,blocked:false,reasons:[]};p=ingestion.answerHumanInput(p,{[request.requestId]:'Exact run-specific answer'},{operator:'VERIFY'}).project;"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Scoped clarification answer fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve Stage 17 prerequisite through clarification fixture'
          git push origin HEAD:repair/spec3-proof-gate
