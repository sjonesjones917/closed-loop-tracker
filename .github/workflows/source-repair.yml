name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Reserve context identities in ingestion fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old1="const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};"
          new1="const options=stage===19?{operation:'COMPARE'}:[11,12,23,24].includes(stage)?{scope:{runId:`RUN-INGESTION-${stage}`,contextId:`CONTEXT-INGESTION-${stage}`}}:{};"
          old2="const nextOptions=nextStage===11?{scope:{runId:'RUN-NEXT-FIXTURE',contextId:'CONTEXT-NEXT-FIXTURE'}}:{}"
          new2="const nextOptions=[11,12,23,24].includes(nextStage)?{scope:{runId:`RUN-NEXT-${nextStage}`,contextId:`CONTEXT-NEXT-${nextStage}`}}:{}"
          if old1 in s: s=s.replace(old1,new1,1)
          elif new1 not in s: raise SystemExit('savePrompt scope fixture not found')
          if old2 in s: s=s.replace(old2,new2,1)
          elif new2 not in s: raise SystemExit('next-stage scope fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reserve context identities in ingestion fixtures'
          git push origin HEAD:repair/spec3-proof-gate
