name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Correct Stage 06 artifact-boundary regression fixture
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Stage 06 artifact-boundary fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct Stage 06 artifact boundary fixture'
          git push origin HEAD:repair/spec3-proof-gate
