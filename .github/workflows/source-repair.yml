name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Isolate Stage 04 upstream prerequisite fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-user-prompt-invariants.mjs')
          s=p.read_text()
          old="const bad1=project();let blocked=false;try{prompts.buildPromptRecord(4,bad1,{scope:{sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001'}});}catch(e){blocked=e.code==='STAGE4_UPSTREAM_INCOMPLETE';}assert(blocked,'Stage 04 generated while Stage 01 was incomplete.');"
          new="const bad1=project();bad1.stages[2].status='COMPLETE';bad1.stages[2].gate={complete:true,blocked:false,reasons:[]};bad1.stages[3].status='COMPLETE';bad1.stages[3].gate={complete:true,blocked:false,reasons:[]};let blocked=false;try{prompts.buildPromptRecord(4,bad1,{scope:{sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001'}});}catch(e){blocked=e.code==='STAGE4_UPSTREAM_INCOMPLETE';}assert(blocked,'Stage 04 generated while Stage 01 was incomplete.');"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Stage 01 incomplete Stage 04 fixture not found')
          old2="const bad3=project();closeStage1(bad3);bad3.stages[2].status='COMPLETE';bad3.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';blocked=false;try{prompts.buildPromptRecord(4,bad3,{scope:{sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001'}});}catch(e){blocked=e.code==='STAGE4_UPSTREAM_INCOMPLETE';}assert(blocked,'Stage 04 generated while Stage 03 was incomplete.');"
          new2="const bad3=project();closeStage1(bad3);bad3.stages[2].status='COMPLETE';bad3.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';blocked=false;try{prompts.buildPromptRecord(4,bad3,{scope:{sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001'}});}catch(e){blocked=e.code==='UPSTREAM_STAGE_INCOMPLETE'&&e.upstreamStage===3;}assert(blocked,'Stage 04 generated while Stage 03 was incomplete.');"
          if old2 in s:s=s.replace(old2,new2,1)
          elif new2 not in s:raise SystemExit('Stage 03 incomplete Stage 04 fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-user-prompt-invariants.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-user-prompt-invariants.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Isolate Stage 04 prompt prerequisite fixtures'
          git push origin HEAD:repair/spec3-proof-gate
