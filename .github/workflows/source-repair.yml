name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Preserve rejection fixture upstream prerequisite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="p=ingestion.reject(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Controlled rejection.'}).project;"
          new="prepared.project.stages[1].status='COMPLETE';prepared.project.stages[1].gate={complete:true,blocked:false,reasons:[]};p=ingestion.reject(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Controlled rejection.'}).project;"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('controlled rejection fixture not found')
          old2="const result=ingestion.reject(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Add the missing controlling-source rationale and make the result more complete.',requestCorrection:true});"
          new2="prepared.project.stages[1].status='COMPLETE';prepared.project.stages[1].gate={complete:true,blocked:false,reasons:[]};const result=ingestion.reject(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Add the missing controlling-source rationale and make the result more complete.',requestCorrection:true});"
          if old2 in s:s=s.replace(old2,new2,1)
          elif new2 not in s:raise SystemExit('refinement rejection fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve rejection fixture upstream prerequisite'
          git push origin HEAD:repair/spec3-proof-gate
