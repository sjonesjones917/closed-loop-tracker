name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Make common prompt invariant semantic rather than case-sensitive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-stage-prompts-complete.mjs')
          s=p.read_text()
          old="for(const common of ['PROJECT DATA EXECUTION RULE — MANDATORY','Project-relevant information supplied by the human is supplied once','never ask the human to repeat, retype, summarize, resend, reopen, or reattach it','STRICT RESPONSE CONTRACT'])if(!prompt.includes(common))throw new Error(`Stage ${stage} ${operation} missing common prompt invariant: ${common}`);"
          new="for(const common of ['PROJECT DATA EXECUTION RULE — MANDATORY','Project-relevant information supplied by the human is supplied once','never ask the human to repeat, retype, summarize, resend, reopen, or reattach','STRICT RESPONSE CONTRACT'])if(!prompt.toLowerCase().includes(common.toLowerCase()))throw new Error(`Stage ${stage} ${operation} missing common prompt invariant: ${common}`);"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Common prompt invariant assertion not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-stage-prompts-complete.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-stage-prompts-complete.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make prompt invariant matching semantic'
          git push origin HEAD:repair/spec3-proof-gate
