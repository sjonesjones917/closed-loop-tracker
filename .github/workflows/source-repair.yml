name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Establish remaining identity fixture prerequisites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="let p=project('JOB-NEG-COMPLETED-TARGET'),stage=21,productId='PRODUCT-000001';p.job.CURRENT_BASELINE_ID='BASELINE-000001';"
          new="let p=project('JOB-NEG-COMPLETED-TARGET'),stage=21,productId='PRODUCT-000001';p.stages[20].status='COMPLETE';p.stages[20].gate={complete:true,blocked:false,reasons:[]};p.job.CURRENT_BASELINE_ID='BASELINE-000001';"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Completed-target fixture not found')
          old2="let p=project('JOB-NEG-TARGET-SCOPE'),stage=11,runId='RUN-SCOPE-B';p.projectData.runs.push"
          new2="let p=project('JOB-NEG-TARGET-SCOPE'),stage=11,runId='RUN-SCOPE-B';p.stages[10].status='COMPLETE';p.stages[10].gate={complete:true,blocked:false,reasons:[]};p.projectData.runs.push"
          if old2 in s:s=s.replace(old2,new2,1)
          elif new2 not in s:raise SystemExit('Target-scope fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Establish identity fixture prerequisites'
          git push origin HEAD:repair/spec3-proof-gate
