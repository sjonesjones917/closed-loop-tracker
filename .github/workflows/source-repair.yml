name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Establish unpersisted-prompt fixture prerequisite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="const p=project('JOB-UNPERSISTED-PROMPT'),stage=2,pr=prompts.buildPromptRecord(stage,p),e=validEnvelope(p,stage,pr);"
          new="const p=project('JOB-UNPERSISTED-PROMPT'),stage=2;p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true,blocked:false,reasons:[]};const pr=prompts.buildPromptRecord(stage,p),e=validEnvelope(p,stage,pr);"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Unpersisted-prompt fixture not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Establish unpersisted-prompt fixture prerequisite'
          git push origin HEAD:repair/spec3-proof-gate
