name: Controlled source repair
on:
  push:
    branches: [repair/spec3-proof-gate]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Add first-semantic-reader boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('prompt-engine.js')
          text=path.read_text()
          old="if(stage===1)lines.push('Exhaust human-authority intake before Stage 01 completion: every application-enumerated input unit must be classified exactly once, every materially relevant human-authority statement must be preserved, and every foreseeable genuinely human-only BLOCKING_NOW or ASK_NOW_NONBLOCKING issue must be asked before final Stage 01 JSON unless already answered. Never silently move an unasked human-only issue into UNKNOWN_INFORMATION.');"
          new="if(stage===1)lines.push('You are the first semantic reader of the complete human request and every supplied artifact made available for Stage 01. No earlier application step or hidden agent has semantically extracted arbitrary file meaning. Read every accessible supplied artifact from beginning to end before claiming it was inspected. Exhaust human-authority intake before Stage 01 completion: every application-enumerated input unit must be classified exactly once, every materially relevant human-authority statement must be preserved, and every foreseeable genuinely human-only BLOCKING_NOW or ASK_NOW_NONBLOCKING issue must be asked before final Stage 01 JSON unless already answered. Never silently move an unasked human-only issue into UNKNOWN_INFORMATION.');"
          if old not in text:
              if new in text: raise SystemExit(0)
              raise SystemExit('Expected Stage 01 prompt boundary not found; refusing broad edit')
          path.write_text(text.replace(old,new,1))
          PY
          node --check prompt-engine.js
          if git diff --quiet; then exit 0; fi
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add prompt-engine.js
          git commit -m 'Make Stage 01 first semantic reader explicit'
          git push origin HEAD:repair/spec3-proof-gate
