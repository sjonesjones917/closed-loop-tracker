name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Align Stage 01 semantic marker with v3 intake units
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-stage-prompts-complete.mjs')
          s=p.read_text()
          old="1:['BLOCKING_NOW','ASK_NOW_NONBLOCKING','LATER_RESOLVABLE','every inputId exactly once'],"
          new="1:['BLOCKING_NOW','ASK_NOW_NONBLOCKING','LATER_RESOLVABLE','every application-enumerated input unit must be classified exactly once'],"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Stage 01 semantic marker not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-stage-prompts-complete.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-stage-prompts-complete.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align Stage 01 prompt marker with v3 intake units'
          git push origin HEAD:repair/spec3-proof-gate
