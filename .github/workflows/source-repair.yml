name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Enforce exhaustive Stage 02 source discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/56';"
          new="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/57';"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Prompt engine version marker not found')
          old2="Discover and inspect every reasonably possible controlling, governing, evidentiary, or informative external source needed for this project; distinguish authority level, role, applicability, currency, supersession, and conflicts."
          new2="Discover and inspect every reasonably possible controlling, governing, evidentiary, or informative external source needed for this project; distinguish authority level, role, applicability, currency, supersession, and conflicts. Do not stop at the first plausible source. Perform complete source-discovery passes until no new applicable controlling or correctness-relevant external source category is found; incorporate every newly discovered applicable category before repeating the complete pass."
          if old2 in s:s=s.replace(old2,new2,1)
          elif new2 not in s:raise SystemExit('Stage 02 source discovery directive not found')
          p.write_text(s)
          PY
      - name: Verify and commit controlled repair
        run: |
          node --check prompt-engine.js
          node verify-stage-prompts-complete.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add prompt-engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enforce exhaustive Stage 02 source discovery'
          git push origin HEAD:repair/spec3-proof-gate
