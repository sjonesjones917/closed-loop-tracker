name: Controlled source repair
on:
  push:
    branches:
      - repair/spec3-proof-gate
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec3-proof-gate
          fetch-depth: 0
      - name: Isolate static all-stage prompt audit from runtime predecessor gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-stage-prompts-complete.mjs')
          s=p.read_text()
          old="engine.ensureShape(p);engine.recalculate(p);"
          new="engine.ensureShape(p);engine.recalculate(p);for(let stage=1;stage<=30;stage++){p.stages[stage].status='COMPLETE';p.stages[stage].gate={complete:true,blocked:false,reasons:[]};}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Prompt audit fixture initialization not found')
          p.write_text(s)
          PY
      - name: Commit controlled repair
        run: |
          node --check verify-stage-prompts-complete.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-stage-prompts-complete.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Isolate all-stage prompt audit prerequisites'
          git push origin HEAD:repair/spec3-proof-gate
