name: Temporary Controller 3 patch executor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'controller3-exec-20260904-2628669'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-exec-20260904-2628669
      - name: Repair Stage 03 semantic challenge and reconciliation authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const schemaPath='workflow-schema.js';
          let schema=fs.readFileSync(schemaPath,'utf8');
          const old="const completionReadCollections=Object.freeze(['propositions','propositionEquivalenceReviews','applicabilityRecords','proofExpressions','proofObligations','observationRecords','entailmentReviews','environmentDependencies']);\nfunction amendedOperationContract(stage,operation){const base=s0.operationContract(stage,operation);if(!base)return null;const addedAgent=addedAgentCollections[stage]||[],addedRead=stage>=5?completionReadCollections:[],addedApplication=stage===30?['operationReservations','proofObligations','deliveryRecords','deploymentManifests']:['operationReservations','proofObligations'];return Object.freeze({...base,readCollections:Object.freeze([...new Set([...(base.readCollections||[]),...addedRead])]),agentWritableCollections:Object.freeze([...new Set([...(base.agentWritableCollections||[]),...addedAgent])]),applicationCollections:Object.freeze([...new Set([...(base.applicationCollections||[]),...addedApplication])]),allowedStageData:Object.freeze([...(CONTRACTS[stage]?.allowedStageData||base.allowedStageData||[])])});}";
          const replacement="const completionReadCollections=Object.freeze(['propositions','propositionEquivalenceReviews','applicabilityRecords','proofExpressions','proofObligations','observationRecords','entailmentReviews','environmentDependencies']);\nconst operationSemanticOverrides=Object.freeze({\n  '3:SEMANTIC_CHALLENGE':Object.freeze({readCollections:Object.freeze(['sources','sourceConflicts']),agentWritableCollections:Object.freeze(['semanticChallenges'])}),\n  '3:RECONCILE_RESEARCH':Object.freeze({readCollections:Object.freeze(['research','candidateRequirements','semanticChallenges','sources','sourceConflicts']),agentWritableCollections:Object.freeze(['semanticReviews'])})\n});\nfunction amendedOperationContract(stage,operation){const base=s0.operationContract(stage,operation);if(!base)return null;const semanticOverride=operationSemanticOverrides[`${stage}:${operation}`]||{},addedAgent=addedAgentCollections[stage]||[],addedRead=stage>=5?completionReadCollections:[],addedApplication=stage===30?['operationReservations','proofObligations','deliveryRecords','deploymentManifests']:['operationReservations','proofObligations'];const baseRead=semanticOverride.readCollections||base.readCollections||[],baseWritable=semanticOverride.agentWritableCollections||base.agentWritableCollections||[];return Object.freeze({...base,readCollections:Object.freeze([...new Set([...baseRead,...addedRead])]),agentWritableCollections:Object.freeze([...new Set([...baseWritable,...addedAgent])]),applicationCollections:Object.freeze([...new Set([...(base.applicationCollections||[]),...addedApplication])]),allowedStageData:Object.freeze([...(CONTRACTS[stage]?.allowedStageData||base.allowedStageData||[])])});}";
          if(!schema.includes(old))throw new Error('Expected amendedOperationContract source not found; refusing ambiguous patch.');
          schema=schema.replace(old,replacement);
          fs.writeFileSync(schemaPath,schema);

          const oraclePath='verify-spec-grounded-route-oracle.mjs';
          let oracle=fs.readFileSync(oraclePath,'utf8');
          const oracleNeedle="const OP={\n'17:FREEZE':";
          const oracleReplacement="const OP={\n'3:SEMANTIC_CHALLENGE':{r:['sources','sourceConflicts'],w:['semanticChallenges']},'3:RECONCILE_RESEARCH':{r:['research','candidateRequirements','semanticChallenges','sources','sourceConflicts'],w:['semanticReviews']},\n'17:FREEZE':";
          if(!oracle.includes(oracleNeedle))throw new Error('Expected specification route oracle insertion point not found.');
          oracle=oracle.replace(oracleNeedle,oracleReplacement);
          fs.writeFileSync(oraclePath,oracle);

          const verifier=`import fs from 'node:fs';\nimport vm from 'node:vm';\n\nconst assert=(condition,message)=>{if(!condition)throw new Error(message);};\nglobalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};\nglobalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);\nfor(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});\n\nconst schema=globalThis.closedLoopWorkflowSchema;\nconst complete=schema.operationContract(3,'COMPLETE');\nconst challenge=schema.operationContract(3,'SEMANTIC_CHALLENGE');\nconst reconcile=schema.operationContract(3,'RECONCILE_RESEARCH');\n\nassert(complete.agentWritableCollections.includes('research')&&complete.agentWritableCollections.includes('candidateRequirements'),'Stage 03 COMPLETE lost its canonical research outputs.');\nassert(challenge.agentWritableCollections.includes('semanticChallenges'),'Stage 03 SEMANTIC_CHALLENGE does not write the durable semanticChallenges family.');\nassert(!challenge.agentWritableCollections.includes('research')&&!challenge.agentWritableCollections.includes('candidateRequirements'),'Stage 03 independent omission challenge can overwrite the author extraction instead of remaining an independent challenge record.');\nassert(challenge.readCollections.includes('sources'),'Stage 03 independent omission challenge does not receive the source set.');\nassert(!challenge.readCollections.includes('research')&&!challenge.readCollections.includes('candidateRequirements'),'Stage 03 independent omission challenge receives the first extraction before its own extraction is complete.');\nassert(reconcile.agentWritableCollections.includes('semanticReviews'),'Stage 03 RECONCILE_RESEARCH does not create the durable reconciliation review record.');\nassert(reconcile.readCollections.includes('research')&&reconcile.readCollections.includes('candidateRequirements')&&reconcile.readCollections.includes('semanticChallenges'),'Stage 03 reconciliation does not receive both the author extraction and completed independent challenge.');\n\nconsole.log(JSON.stringify({stage03SourceResearchOperationClosure:true}));\n`;
          fs.writeFileSync('verify-stage03-source-research.mjs',verifier);

          const workflowPath='.github/workflows/pages.yml';
          let workflow=fs.readFileSync(workflowPath,'utf8');
          const workflowNeedle='      - name: Stage 04 obligation accounting and prompt completeness\n';
          const workflowReplacement="      - name: Stage 02 bounded search and Stage 03 omission challenge\n        run: |\n          set -euo pipefail\n          node verify-stage03-source-research.mjs\n          node verify-spec-grounded-route-oracle.mjs\n\n"+workflowNeedle;
          if(!workflow.includes(workflowNeedle))throw new Error('Expected CI insertion point not found.');
          workflow=workflow.replace(workflowNeedle,workflowReplacement);
          fs.writeFileSync(workflowPath,workflow);
          NODE
          rm -f verification/controller3-exec-source-capture.txt .github/workflows/controller3-patch.yml
          node --check workflow-schema.js
          node verify-stage03-source-research.mjs
          node verify-spec-grounded-route-oracle.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair Stage 03 independent research challenge routing"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
