name: Temporary Controller 3 patch executor

on:
  push:
    branches: [controller3-exec-20260904-2628669]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/controller3-exec-20260904-2628669'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-exec-20260904-2628669
      - name: Integrate Stage 03 regression into permanent route verifier
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='verify-data-route-closure.mjs';
          let source=fs.readFileSync(path,'utf8');
          const anchor="assert(core&&schema&&engine&&prompts&&ingestion,'Data-route audit runtime failed to load.');\n";
          const addition=`\n// Regression: Stage 03 independent omission challenge cannot see or overwrite the author extraction,\n// and reconciliation must consume both completed outputs before Stage 04 can use the research.\n{\n  const complete=schema.operationContract(3,'COMPLETE');\n  const challenge=schema.operationContract(3,'SEMANTIC_CHALLENGE');\n  const reconcile=schema.operationContract(3,'RECONCILE_RESEARCH');\n  assert(complete.agentWritableCollections.includes('research')&&complete.agentWritableCollections.includes('candidateRequirements'),'Stage 03 COMPLETE lost canonical extraction outputs.');\n  assert(challenge.readCollections.includes('sources')&&!challenge.readCollections.includes('research')&&!challenge.readCollections.includes('candidateRequirements'),'Stage 03 challenge is not independent from the first extraction.');\n  assert(challenge.agentWritableCollections.includes('semanticChallenges')&&!challenge.agentWritableCollections.includes('research')&&!challenge.agentWritableCollections.includes('candidateRequirements'),'Stage 03 challenge can overwrite author extraction.');\n  assert(reconcile.readCollections.includes('research')&&reconcile.readCollections.includes('candidateRequirements')&&reconcile.readCollections.includes('semanticChallenges'),'Stage 03 reconciliation lacks author/challenge inputs.');\n  assert(reconcile.agentWritableCollections.includes('semanticReviews')&&!reconcile.agentWritableCollections.includes('research')&&!reconcile.agentWritableCollections.includes('candidateRequirements'),'Stage 03 reconciliation has incorrect write authority.');\n  for(const operation of ['COMPLETE','DISPOSITION_CHALLENGE','ATOMICITY_CHALLENGE','RECONCILE_REQUIREMENTS'])assert(schema.operationContract(4,operation).readCollections.includes('semanticReviews'),'Stage 04/'+operation+' does not consume reconciled Stage 03 review.');\n}\n`;
          if(!source.includes('Stage 03 challenge is not independent from the first extraction.')){
            if(!source.includes(anchor))throw new Error('Permanent verifier insertion point not found.');
            source=source.replace(anchor,anchor+addition);
            fs.writeFileSync(path,source);
          }
          NODE
          node verify-data-route-closure.mjs
          node verify-stage03-source-research.mjs
          node verify-spec-grounded-route-oracle.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-data-route-closure.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve Stage 03 independence as permanent route regression"
          git push origin "HEAD:controller3-exec-20260904-2628669"
