name: Repair Stage 12 derived verification count

on:
  push:
    branches:
      - finish/live-human-gate-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Apply minimal Stage 12 correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('workflow-engine.js')
          text=path.read_text()
          old='ACTUAL_MANDATORY_RECORDS:matrix.actual.length'
          new='ACTUAL_MANDATORY_RECORDS:matrix.verification.length'
          if text.count(old) != 1:
              raise SystemExit('Expected one Stage 12 actual-record count defect.')
          path.write_text(text.replace(old,new))
          PY
          node --check workflow-engine.js
          node verify-human-stage-walkthrough.mjs
      - name: Commit correction and remove one-time workflow
        run: |
          rm .github/workflows/fix-stage12-derived-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Stage 12 derived verification record count'
          git push origin HEAD:finish/live-human-gate-20260830
