name: Apply scoped reliability repair
on:
  push:
    branches: [reliability/scoped-refinement-operation-isolation-20260826]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/scoped-refinement-operation-isolation-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact scoped reliability repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apply-scoped-reliability.py')
          s=p.read_text()
          old='s=replace_once(s,"closed-loop-response-contract/2.1","closed-loop-response-contract/2.2",\'prompt semantic contract version\')'
          new='s=replace_count(s,"closed-loop-response-contract/2.1","closed-loop-response-contract/2.2",2,\'prompt semantic contract version\')'
          if s.count(old)!=1: raise SystemExit('temporary assertion correction did not match exactly once')
          s=s.replace(old,new,1)
          old2='"      if(!allowedStageData.has(name))issues.push(issue(\'STAGE_OPERATION_FIELD_VIOLATION\',path,`${name} is not writable by operation ${expectedOperation}.`));\\n      else if(!schema.authorizeMutation({fieldDefinition:definition,actor:\'AGENT\',mutationType:\'RESPONSE_INGESTION\'}).authorized)issues.push(issue(\'FIELD_OWNERSHIP_VIOLATION\',path,`${name} is owned by ${definition.producer}, not the external agent.`));",'
          new2='"      if(!schema.authorizeMutation({fieldDefinition:definition,actor:\'AGENT\',mutationType:\'RESPONSE_INGESTION\'}).authorized)issues.push(issue(\'FIELD_OWNERSHIP_VIOLATION\',path,`${name} is owned by ${definition.producer}, not the external agent.`));\\n      else if(!allowedStageData.has(name))issues.push(issue(\'STAGE_OPERATION_FIELD_VIOLATION\',path,`${name} is not writable by operation ${expectedOperation}.`));",'
          if s.count(old2)!=1: raise SystemExit('ownership precedence correction did not match exactly once')
          s=s.replace(old2,new2,1)
          old3="assert(runA?.status==='RESERVED','Refined Run A reservation was not restored.');"
          new3="assert(engine.recordValue(runA,'EXECUTION_STATUS')==='RESERVED'&&runA?.status!=='COMPLETED','Refined Run A reservation was not restored.');"
          if s.count(old3)!=1: raise SystemExit('run reservation assertion correction did not match exactly once')
          p.write_text(s.replace(old3,new3,1))
          PY
          python3 apply-scoped-reliability.py
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check test-fixtures.mjs
          node --check verify-hash.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-live.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
      - name: Verify complete deterministic lifecycle
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit only verified permanent source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['verify-ingestion.mjs','verify-complete.mjs','verify-prompt-semantics.mjs']:
              p=Path(name)
              p.write_text(p.read_text().rstrip()+"\n")
          PY
          rm apply-scoped-reliability.py
          rm .github/workflows/apply-scoped-reliability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test ! -e apply-scoped-reliability.py
          test ! -e .github/workflows/apply-scoped-reliability.yml
          git commit -m 'Isolate operation responses and scope accepted-result refinement'
          git push origin HEAD:reliability/scoped-refinement-operation-isolation-20260826
