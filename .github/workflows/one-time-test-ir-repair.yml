name: One-time Test IR repair

on:
  push:
    branches: [closed-loop-test-ir-minimal]
    paths:
      - '.repair-test-ir.py'
      - '.github/workflows/one-time-test-ir-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-test-ir-minimal
          fetch-depth: 0

      - name: Align one-time patch with exact current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.repair-test-ir.py')
          t=p.read_text()
          start=t.index("# Primary action buttons live in existing execution guidance; technical data remains advanced.")
          end=t.index("write('app-core.js',a)",start)
          replacement=r'''# Preserve current action-oriented verification UX; add only native/package actions.
          a=replace_once(a,
          "return text?`<div class=\"notice\"><strong>This stage</strong><br>${esc(text)}</div>`:'';}",
          "const automatic=n===22&&nativeStage22Tests().length?`<div class=\"button-row\"><button class=\"primary\" id=\"run-native-tests\" type=\"button\">Run ${nativeStage22Tests().length} automatic test${nativeStage22Tests().length===1?'':'s'}</button></div>`:'',external=engine.testExecutionPlan(current).items.some(item=>item.executionMode!=='APPLICATION_DETERMINISTIC'&&item.operatorAction!=='NO_ACTION'&&item.operatorAction!=='BLOCKED')?`<div class=\"button-row\"><button id=\"download-execution-package\" type=\"button\">Download verification package</button></div>`:'';return text?`<div class=\"notice\"><strong>This stage</strong><br>${esc(text)}${automatic}${external}</div>`:(automatic+external);}",
          'Stage purpose native/package actions')
          a=replace_once(a,
          "if($('#verify-stored-files'))$('#verify-stored-files').onclick=verifyStoredFilesNow;",
          "if($('#verify-stored-files'))$('#verify-stored-files').onclick=verifyStoredFilesNow;if($('#run-native-tests'))$('#run-native-tests').onclick=runNativeStage22Tests;if($('#download-execution-package'))$('#download-execution-package').onclick=downloadExecutionPackage;",
          'Wire automatic test and package actions')
          '''
          t=t[:start]+replacement+t[end:]
          ci_start=t.index("if 'node verify-test-runtime.mjs' not in y:")
          ci_end=t.index("write('.github/workflows/pages.yml',y)",ci_start)
          ci=r'''if 'node verify-test-runtime.mjs' not in y:
              anchor='      - name: Verify canonical serialization and SHA-256'
              y=replace_once(y,anchor,"      - name: Verify generic deterministic Test IR\n        run: node verify-test-runtime.mjs\n"+anchor,'CI Test IR execution step')
          '''
          t=t[:ci_start]+ci+t[ci_end:]
          marker="vc=read('verify-complete.mjs')"
          pos=t.index(marker)+len(marker)
          premise="\nvc=replace_once(vc,\"assert(engine.applicationTestCapabilities().length===0,'Unexpected application-native executor registration.');\",\"assert(JSON.stringify(engine.applicationTestCapabilities())===JSON.stringify(['CLOSED_LOOP_TEST_IR']),'Application-native capability registry must contain only the exact Closed Loop Test IR capability.');\",'Update native executor acceptance premise')\n"
          t=t[:pos]+premise+t[pos:]
          engine_marker="if 'APPLICATION_TEST_EXECUTORS' in e: raise SystemExit('workflow-engine.js still references APPLICATION_TEST_EXECUTORS after Test IR routing patch')"
          engine_pos=t.index(engine_marker)
          wiring="e=e.replace(\"capabilityAffirmativelyAvailable(project,requiredCapability,mode)\",\"capabilityAffirmativelyAvailable(project,requiredCapability,mode,test)\")\n"
          t=t[:engine_pos]+wiring+t[engine_pos:]
          p.write_text(t)
          PY

      - name: Apply exact minimal repair
        run: python3 .repair-test-ir.py

      - name: Syntax and focused invariant checks
        run: |
          set +e
          (
            set -euo pipefail
            node --check workflow-schema.js
            node --check workflow-engine.js
            node --check prompt-engine.js
            node --check response-ingestion.js
            node --check project-store.js
            node --check app-core.js
            node --check test-runtime.js
            node --check test-worker.js
            node --check verify-test-runtime.mjs
            node verify-test-runtime.mjs
            node verify-complete.mjs
            node verify-prompt-semantics.mjs
            node verify-ingestion.mjs
            node verify-full-cycle.mjs
          ) > integrated-test-ir-output.txt 2>&1
          code=$?
          cat integrated-test-ir-output.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "closed-loop-repair"
            git config user.email "closed-loop-repair@users.noreply.github.com"
            git add integrated-test-ir-output.txt
            git commit -m "Capture integrated Test IR invariant diagnostic" || true
            git push origin HEAD:closed-loop-test-ir-minimal || true
            exit "$code"
          fi

      - name: Remove one-time repair infrastructure
        run: |
          rm -f .repair-test-ir.py .github/workflows/one-time-test-ir-repair.yml comprehensive-repair-output.txt integrated-test-ir-output.txt

      - name: Commit integrated repair
        run: |
          set -euo pipefail
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate subject-neutral deterministic Test IR"
          git push origin HEAD:closed-loop-test-ir-minimal
