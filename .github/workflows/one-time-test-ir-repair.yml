name: One-time Test IR repair

on:
  push:
    branches: [closed-loop-test-ir-minimal]
    paths:
      - '.repair-test-ir.py'
      - '.github/workflows/one-time-test-ir-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-test-ir-minimal
          fetch-depth: 0

      - name: Align one-time patch with exact current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.repair-test-ir.py')
          t=p.read_text()
          start=t.index("# Primary action buttons live in existing execution guidance; technical data remains advanced.")
          end=t.index("write('app-core.js',a)",start)
          replacement=r'''# Preserve current action-oriented verification UX; add only native/package actions.
          a=replace_once(a,
          "return text?`<div class=\"notice\"><strong>This stage</strong><br>${esc(text)}</div>`:'';}",
          "const automatic=n===22&&nativeStage22Tests().length?`<div class=\"button-row\"><button class=\"primary\" id=\"run-native-tests\" type=\"button\">Run ${nativeStage22Tests().length} automatic test${nativeStage22Tests().length===1?'':'s'}</button></div>`:'',external=engine.testExecutionPlan(current).items.some(item=>item.executionMode!=='APPLICATION_DETERMINISTIC'&&item.operatorAction!=='NO_ACTION'&&item.operatorAction!=='BLOCKED')?`<div class=\"button-row\"><button id=\"download-execution-package\" type=\"button\">Download verification package</button></div>`:'';return text?`<div class=\"notice\"><strong>This stage</strong><br>${esc(text)}${automatic}${external}</div>`:(automatic+external);}",
          'Stage purpose native/package actions')
          a=replace_once(a,
          "if($('#verify-stored-files'))$('#verify-stored-files').onclick=verifyStoredFilesNow;",
          "if($('#verify-stored-files'))$('#verify-stored-files').onclick=verifyStoredFilesNow;if($('#run-native-tests'))$('#run-native-tests').onclick=runNativeStage22Tests;if($('#download-execution-package'))$('#download-execution-package').onclick=downloadExecutionPackage;",
          'Wire automatic test and package actions')
          '''
          t=t[:start]+replacement+t[end:]
          ci_start=t.index("if 'node verify-test-runtime.mjs' not in y:")
          ci_end=t.index("write('.github/workflows/pages.yml',y)",ci_start)
          ci=r'''if 'node verify-test-runtime.mjs' not in y:
              anchor='      - name: Verify canonical serialization and SHA-256'
              y=replace_once(y,anchor,"      - name: Verify generic deterministic Test IR\n        run: node verify-test-runtime.mjs\n"+anchor,'CI Test IR execution step')
          '''
          t=t[:ci_start]+ci+t[ci_end:]
          marker="vc=read('verify-complete.mjs')"
          pos=t.index(marker)+len(marker)
          premise="\nvc=replace_once(vc,\"assert(engine.applicationTestCapabilities().length===0,'Unexpected application-native executor registration.');\",\"assert(JSON.stringify(engine.applicationTestCapabilities())===JSON.stringify(['CLOSED_LOOP_TEST_IR']),'Application-native capability registry must contain only the exact Closed Loop Test IR capability.');\",'Update native executor acceptance premise')\n"
          t=t[:pos]+premise+t[pos:]
          engine_marker="if 'APPLICATION_TEST_EXECUTORS' in e: raise SystemExit('workflow-engine.js still references APPLICATION_TEST_EXECUTORS after Test IR routing patch')"
          engine_pos=t.index(engine_marker)
          wiring="e=e.replace(\"capabilityAffirmativelyAvailable(project,requiredCapability,mode)\",\"capabilityAffirmativelyAvailable(project,requiredCapability,mode,test)\")\n"
          t=t[:engine_pos]+wiring+t[engine_pos:]
          accepted_op=r'''e=replace_once(e,
          "  return out;\n}\nfunction candidateComponentIdentity(project,candidateId)",
          "  if(Number(stage)===19){const appIteration=records(project,'iterations').find(r=>Number(r.stage)===19&&isActiveRecord(r)&&upper(recordValue(r,'PURPOSE'))==='UNCHANGED_CONFIRMATION'&&(!scopeRule.iterationId||recordId(r,'iterations')===String(scopeRule.iterationId))&&(!scopeRule.candidateId||String(recordValue(r,'CANDIDATE_ID')||r.scope?.candidateId||'')===String(scopeRule.candidateId)));if(appIteration)out.add('CONFIRM_FREEZE');}\n  return out;\n}\nfunction candidateComponentIdentity(project,candidateId)",
          'Application-controlled Stage 19 CONFIRM_FREEZE operation evidence')
          '''
          t=t[:engine_pos]+accepted_op+t[engine_pos:]
          replacements={
            "assert.equal(schema.TEST_IR.version,'closed-loop-test-spec/1');":"assert(schema.TEST_IR.version==='closed-loop-test-spec/1','Test IR version changed.');",
            "assert.equal(schema.TEST_IR.capability,'CLOSED_LOOP_TEST_IR');":"assert(schema.TEST_IR.capability==='CLOSED_LOOP_TEST_IR','Test IR capability changed.');",
            "assert.ok(schema.TEST_IR.operations.includes('PARSE_JSON')&&schema.TEST_IR.operations.includes('BYTE_COMPARE'));":"assert(schema.TEST_IR.operations.includes('PARSE_JSON')&&schema.TEST_IR.operations.includes('BYTE_COMPARE'),'Required generic Test IR operations are missing.');",
            "assert.ok(!schema.TEST_IR.operations.some(op=>/JAVASCRIPT|PYTHON|SHELL/i.test(op)));":"assert(!schema.TEST_IR.operations.some(op=>/JAVASCRIPT|PYTHON|SHELL/i.test(op)),'Unsafe arbitrary-code Test IR operation registered.');",
            "assert.deepEqual(schema.STAGE_OPERATIONS[19],['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']);":"assert(JSON.stringify(schema.STAGE_OPERATIONS[19])===JSON.stringify(['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']),'Stage 19 operation contract is incomplete.');",
            "assert.equal(schema.validateTestIRTest(native).valid,true);":"assert(schema.validateTestIRTest(native).valid===true,'Valid native Test IR test was rejected.');",
            "assert.equal(engine.applicationTestCapabilities().includes('CLOSED_LOOP_TEST_IR'),true);":"assert(engine.applicationTestCapabilities().includes('CLOSED_LOOP_TEST_IR'),'Closed Loop Test IR is not registered as an application-native capability.');"
          }
          for old,new in replacements.items():
              if old not in t: raise SystemExit(f'Test harness assertion anchor missing: {old}')
              t=t.replace(old,new,1)
          p.write_text(t)
          PY

      - name: Apply exact minimal repair
        run: python3 .repair-test-ir.py

      - name: Reconcile semantic and full-cycle regressions with controlling contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs')
          t=p.read_text()
          replacements={
            "const expectedOperationWrites={17:{FREEZE:[],EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],ROOT_CAUSE:['defects','rootCauses'],REGRESSION:['regressions','regressionExecutions'],CORRECT:['changes']},19:{EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],REGRESSION_VERIFY:['regressionExecutions'],CONFIRM:['confirmationRecords']}};":"const expectedOperationWrites={17:{FREEZE:[],EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],ROOT_CAUSE:['defects','rootCauses'],REGRESSION:['regressions','regressionExecutions'],CORRECT:['changes']},19:{CONFIRM_FREEZE:[],EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],REGRESSION_VERIFY:['regressionExecutions'],CONFIRM:['confirmationRecords']}};",
            "if(schema.STAGE_OPERATIONS[19].includes('CONFIRM_FREEZE')||schema.operationContract(19,'CONFIRM_FREEZE'))throw new Error('Stage 19 still exposes application-owned freeze as an agent response operation.');":"{const freeze=schema.operationContract(19,'CONFIRM_FREEZE');if(!schema.STAGE_OPERATIONS[19].includes('CONFIRM_FREEZE')||!freeze||freeze.agentWritableCollections.length!==0)throw new Error('Stage 19 CONFIRM_FREEZE must exist as an application-controlled operation with no agent-writable collection.');}",
            "if(engine.applicationTestCapabilities().length!==0)throw new Error('A native test capability was registered without a proven application executor test in this patch.');":"if(JSON.stringify(engine.applicationTestCapabilities())!==JSON.stringify(['CLOSED_LOOP_TEST_IR']))throw new Error('The application-native capability registry must contain only the proven subject-neutral Closed Loop Test IR executor.');",
            "if(!record.prompt.includes('APPLICATION-NATIVE TEST CAPABILITIES\\nNONE')||!record.prompt.includes('do not select APPLICATION_DETERMINISTIC'))issues.push('UNREGISTERED_APPLICATION_EXECUTOR_NOT_BLOCKED');":"if(!record.prompt.includes('CLOSED LOOP TEST IR — APPLICATION-OWNED DETERMINISTIC LANGUAGE')||!record.prompt.includes('closed-loop-test-spec/1')||!record.prompt.includes('CLOSED_LOOP_TEST_IR')||!record.prompt.includes('you MUST use EXECUTION_MODE = APPLICATION_DETERMINISTIC'))issues.push('APPLICATION_TEST_IR_COMPILER_CONTRACT_MISSING');",
            "if(record.stage===12&&!record.prompt.includes('APPLICATION-NATIVE TEST CAPABILITIES\\nNONE'))issues.push('APPLICATION_NATIVE_CAPABILITY_CONTEXT_MISSING');":"if(record.stage===12&&(!record.prompt.includes('APPLICATION-NATIVE TEST CAPABILITIES')||!record.prompt.includes('CLOSED_LOOP_TEST_IR')))issues.push('APPLICATION_NATIVE_CAPABILITY_CONTEXT_MISSING');",
            "if(![6,12].includes(record.stage)&&record.prompt.includes('APPLICATION-NATIVE TEST CAPABILITIES'))issues.push('APPLICATION_NATIVE_CAPABILITY_CONTEXT_LEAK');":"if(![6,12,22].includes(record.stage)&&record.prompt.includes('APPLICATION-NATIVE TEST CAPABILITIES'))issues.push('APPLICATION_NATIVE_CAPABILITY_CONTEXT_LEAK');"
          }
          for old,new in replacements.items():
              if old not in t: raise SystemExit(f'Semantic regression anchor missing: {old}')
              t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('verify-full-cycle.mjs')
          t=p.read_text()
          old="engine.freezeCandidate(p,{stage:19,artifactIds:['ARTIFACT-CANDIDATE'],operatorLabel:'FULL_CYCLE',purpose:'UNCHANGED_CONFIRMATION'});const iter19=rid('iterations'),cand19=engine.recordValue(engine.records(p,'iterations',{stage:19}).at(-1),'CANDIDATE_ID');"
          new="const confirmationIteration=engine.beginUnchangedConfirmationIteration(p,{candidateId:cand17,operatorLabel:'FULL_CYCLE'});const iter19=engine.recordId(confirmationIteration,'iterations'),cand19=String(engine.recordValue(confirmationIteration,'CANDIDATE_ID')||confirmationIteration.scope?.candidateId||'');"
          if old not in t: raise SystemExit('Stage 19 full-cycle freeze anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY

      - name: Syntax and focused invariant checks
        run: |
          set +e
          (
            set -euo pipefail
            node --check workflow-schema.js
            node --check workflow-engine.js
            node --check prompt-engine.js
            node --check response-ingestion.js
            node --check project-store.js
            node --check app-core.js
            node --check test-runtime.js
            node --check test-worker.js
            node --check verify-test-runtime.mjs
            node verify-test-runtime.mjs
            node verify-complete.mjs
            node verify-prompt-semantics.mjs
            node verify-ingestion.mjs
            node verify-full-cycle.mjs
          ) > integrated-test-ir-output.txt 2>&1
          code=$?
          cat integrated-test-ir-output.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "closed-loop-repair"
            git config user.email "closed-loop-repair@users.noreply.github.com"
            git add integrated-test-ir-output.txt
            git commit -m "Capture integrated Test IR invariant diagnostic" || true
            git push origin HEAD:closed-loop-test-ir-minimal || true
            exit "$code"
          fi

      - name: Remove one-time repair script and diagnostics
        run: |
          rm -f .repair-test-ir.py comprehensive-repair-output.txt integrated-test-ir-output.txt

      - name: Commit integrated repair
        run: |
          set -euo pipefail
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate subject-neutral deterministic Test IR"
          git push origin HEAD:closed-loop-test-ir-minimal
