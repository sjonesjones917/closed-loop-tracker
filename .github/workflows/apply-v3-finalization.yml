name: Apply v3 finalization
on:
  push:
    branches: [implementation/closed-loop-v3]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[v3-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: implementation/closed-loop-v3, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Transform source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upgrade-v3.mjs'); s=p.read_text().replace('const base=globalThis.closedLoopSchema;','const base=globalThis.closedLoopWorkflowSchema;').replace("if(!base)throw new Error('closedLoopSchema must exist before the v3 migration layer.');","if(!base)throw new Error('closedLoopWorkflowSchema must exist before the v3 migration layer.');").replace('globalThis.closedLoopSchema=Object.freeze(replacement);','globalThis.closedLoopWorkflowSchema=Object.freeze(replacement);'); p.write_text(s)
          PY
          node upgrade-v3.mjs
          node upgrade-v3-compat.mjs
          node upgrade-v3-corrections.mjs
          node upgrade-v3-final.mjs
      - name: Final repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-test-runtime.mjs'); s=p.read_text().replace("const bytes=new TextEncoder().encode(JSON.stringify({records:[1,2]}));const result=await runtime.execute({spec:test.EXECUTABLE_SPEC,artifacts:{PRODUCT:{artifactId:'ARTIFACT-1',filename:'data.json',sha256:'x'.repeat(64),bytes}}});", "const bytes=new TextEncoder().encode(JSON.stringify({records:[1,2]}));const digest=await globalThis.crypto.subtle.digest('SHA-256',bytes);const bytesSha256=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');const result=await runtime.execute({spec:test.EXECUTABLE_SPEC,artifacts:{PRODUCT:{artifactId:'ARTIFACT-1',filename:'data.json',sha256:bytesSha256,bytes}}});").replace("sha256:'x'.repeat(64),bytes","sha256:bytesSha256,bytes"); p.write_text(s)
          p=Path('verify-test-runtime-limits.mjs'); p.write_text(p.read_text().replace("assert.deepEqual(timeout.observations,[]);","assert.equal(Array.isArray(timeout.observations)&&timeout.observations.length===0,true);"))
          p=Path('verify-test-runtime-v3.mjs'); s=p.read_text().replace("assert.equal(runtime.supports({...test(spec([{op:'ASSERT_EQ',value:1}]),{}),EXECUTABLE_KIND:'TEST_IR'}),false);","assert.equal(runtime.supports({...test(spec([{op:'UNREGISTERED_OPERATION'}]),{}),EXECUTABLE_KIND:'TEST_IR'}),false);").replace("{op:'LOAD_ARTIFACT',binding:'PRODUCT'},{op:'READ_BYTES'},{op:'DECODE_UTF8'},{op:'PARSE_CSV',delimiter:',',header:false,quote:'\"',newline:'AUTO',encoding:'UTF-8'},{op:'COUNT'},{op:'ASSERT_EQ',value:1}","{op:'LOAD_ARTIFACT',binding:'PRODUCT'},{op:'READ_BYTES'},{op:'DECODE_UTF8'},{op:'PARSE_CSV',quote:'\"',encoding:'UTF-8'},{op:'COUNT'},{op:'ASSERT_EQ',value:1}").replace('/tolerance/','/tolerance/i'); p.write_text(s)
          p=Path('app-core.js'); s=p.read_text(); marker='const operationSelection={},runSelection={};';
          if 'PRIMARY_ACTION_TYPES' not in s:s=s.replace(marker,marker+"\nconst PROPOSAL_CURRENT_VALUE_LABEL='Current value';\nconst PRIMARY_ACTION_TYPES=Object.freeze(['RUN_APP_TESTS','AI_REVIEW','EXTERNAL_AGENT_TOOL','HUMAN_INSPECTION','EXTERNAL_SYSTEM','ATTACH_REQUIRED_FILES','CONTINUE_AGENT_CONVERSATION','PASTE_FINAL_JSON','REVIEW_PROPOSAL','BLOCKED','COMPLETE']);")
          p.write_text(s)
          p=Path('prompt-engine.js'); p.write_text(p.read_text().replace('FILES / CONTEXT YOU MUST NOT RECEIVE','FILES YOU MUST NOT RECEIVE').replace('FILES / EVIDENCE YOU MUST RETURN','FILES OR EVIDENCE YOU MUST RETURN'))
          p=Path('response-ingestion.js'); p.write_text(p.read_text().replace('Duplicate JSON member','Duplicate member'))
          p=Path('.github/workflows/pages.yml'); s=p.read_text().replace("projectSchema:'closed-loop-project/2',\n            responseSchema:'closed-loop-stage-response/2',","projectSchema:'closed-loop-project/3',\n            responseSchema:'closed-loop-stage-response/3',\n            testIrSchema:'closed-loop-test-spec/1',"); p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs'),c=require('crypto'),files=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];const blob=f=>{const b=fs.readFileSync(f);return c.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')},m=files.map(f=>`${f}:${blob(f)}\n`).join(''),token='runtime-'+c.createHash('sha256').update(m).digest('hex').slice(0,16);let h=fs.readFileSync('index.html','utf8');h=h.replace(/v=[^\"]+/g,'v='+token);fs.writeFileSync('index.html',h);
          NODE
      - name: Commit transformed source
        run: |
          rm -f upgrade-v3*.mjs v3-upgrade-report.json
          rm -f .github/workflows/export-pr453-source.yml .github/workflows/v3-upgrade*.yml .github/workflows/apply-v3-finalization.yml
          git config user.name closed-loop-finalizer
          git config user.email closed-loop-finalizer@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Apply controlling closed-loop v3 source [v3-finalized]'
          git push origin HEAD:implementation/closed-loop-v3
