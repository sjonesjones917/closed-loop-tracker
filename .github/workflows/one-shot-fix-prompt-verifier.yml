name: One-shot fix prompt verifier
on:
  push:
    branches: [controller-v3-prompt-file-identity-20260904]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-v3-prompt-file-identity-20260904
          fetch-depth: 0
      - name: Repair obsolete prompt assertion and self-remove
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="'PROMPT IDENTITY — ECHO EXACTLY'"
          new="'AUTHORITATIVE FILE-FIRST RESPONSE BINDING'"
          if old not in s:
              raise SystemExit('obsolete verifier token not found exactly once')
          if s.count(old)!=1:
              raise SystemExit(f'obsolete verifier token count {s.count(old)}')
          p.write_text(s.replace(old,new))
          Path('.github/workflows/one-shot-fix-prompt-verifier.yml').unlink()
          PY
          git config user.name 'controller-bot'
          git config user.email 'controller-bot@users.noreply.github.com'
          git add verify.mjs .github/workflows/one-shot-fix-prompt-verifier.yml
          git commit -m 'Align prompt verifier with file-first identity contract'
          git push origin HEAD:controller-v3-prompt-file-identity-20260904
