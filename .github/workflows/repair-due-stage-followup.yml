name: One-shot due-stage follow-up repair

on:
  push:
    branches:
      - repair/due-stage-current-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/due-stage-current-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply whole ratchet step
        run: |
          set -euo pipefail
          node .repair-due-stage-followup.mjs
          node --check verify-full-cycle.mjs
          node verify-due-stage-timing.mjs
          node verify-v3-definition-of-done.mjs > /tmp/dod.json
          rm .repair-due-stage-followup.mjs .github/workflows/repair-due-stage-followup.yml
      - name: Commit repaired fixture and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add verify-full-cycle.mjs verify-v3-definition-of-done.mjs .repair-due-stage-followup.mjs .github/workflows/repair-due-stage-followup.yml
          git commit -m 'Fix due-stage full-cycle proof fixture'
          git push origin HEAD:repair/due-stage-current-20260903
