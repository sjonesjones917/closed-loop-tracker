name: Apply Stage 04 raw human-input carry-forward
on:
  push:
    branches: [fix/complete-closed-loop-spec-20260831]
    paths: [.github/workflows/apply-stage04-zero-loss.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve raw user-entered Stage 04 context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); s=p.read_text()
          old='return {currentUserJobInput:humanJobInput,stage01IntakeManifest:'
          new='return {currentUserJobInput:humanJobInput,originalUserEntered:state?.projectData?.userEntered??null,stage01IntakeManifest:'
          if 'originalUserEntered:state?.projectData?.userEntered' not in s:
              if old not in s: raise SystemExit('Stage 04 exhausted-input return anchor not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check prompt-engine.js
          node verify-zero-loss-accounting.mjs
          node verify-user-prompt-invariants.mjs
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js
          git rm .github/workflows/apply-stage04-zero-loss.yml
          git commit -m 'Preserve raw user-entered context in Stage 04'
          git push origin HEAD:fix/complete-closed-loop-spec-20260831