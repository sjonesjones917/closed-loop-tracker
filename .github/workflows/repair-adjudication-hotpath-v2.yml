name: Materialize adjudication hot-path repair v2
on:
  push:
    branches: [reliability/eliminate-gate-full-project-clone-20260828]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/eliminate-gate-full-project-clone-20260828
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal responsible-layer repair
        run: node .repair-adjudication-hotpath.mjs
      - name: Prove changed semantic layer
        run: |
          node --check workflow-engine.js
          node --check verify-semantic-invariant.mjs
          node verify-semantic-invariant.mjs
      - name: Remove all bootstrap before architecture proof
        run: rm .repair-adjudication-hotpath.mjs .github/workflows/repair-adjudication-hotpath.yml .github/workflows/repair-adjudication-hotpath-v2.yml
      - name: Prove retained architecture and gates
        run: |
          node verify.mjs
          node verify-complete.mjs
      - name: Commit exact repair only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Eliminate full-project semantic gate cloning'
          git push origin HEAD:reliability/eliminate-gate-full-project-clone-20260828
