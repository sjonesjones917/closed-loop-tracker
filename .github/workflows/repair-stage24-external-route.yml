name: One-time Stage 24 external-route repair

on:
  push:
    branches:
      - fix/semantic-registry-scope-closure-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reapply proven Stage 12 and Stage 19 corrections
        run: |
          git show 00463441f514efabc374a5c3a1cecbb2b0b94c15:.repair-stage19-application-confirm-v2.cjs > /tmp/repair-stage19.cjs
          node /tmp/repair-stage19.cjs
      - name: Correct Stage 24 reviewer operation routing
        run: node .repair-stage24-external-route.cjs
      - name: Prove corrected lifecycle until next demonstrated gap
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify-v3-contract.mjs
          node verify-full-cycle.mjs
      - name: Remove scaffolding and commit permanent corrections
        run: |
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git rm .github/workflows/repair-stage24-external-route.yml .repair-stage24-external-route.cjs
          git add workflow-schema.js workflow-engine.js verify-full-cycle.mjs
          git commit -m 'Close Stage 19 authority and Stage 24 route boundaries'
          git push origin HEAD:fix/semantic-registry-scope-closure-20260903
