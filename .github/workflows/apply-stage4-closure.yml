name: Apply Stage 04 closure
on:
  push:
    branches:
      - implementation/closed-loop-v3
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Stage 01/04 closure
        shell: bash
        run: |
          git fetch origin closed-loop-v3-completion
          git show origin/closed-loop-v3-completion:prompt-engine.js > prompt-engine.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('workflow-engine.js'); s=p.read_text()
          m=re.search(r"function executionHandoff\(.*?\nfunction evidenceChainExplanation",s,re.S)
          if not m: raise SystemExit('executionHandoff segment not found')
          seg=m.group(0)
          seg2,n=re.subn(r"\n  if\(stage===4\)\{.*?\n  \}\n  for\(const item of items\)","\n  for(const item of items)",seg,count=1,flags=re.S)
          if n not in (0,1): raise SystemExit('unexpected Stage 04 handoff count')
          s=s[:m.start()]+seg2+s[m.end():]
          old="if(stage===4){const handoff=executionHandoff(project,{stage:4,operation:'COMPLETE'}),materials=handoff.conversationMaterials.map(item=>item.label);if(materials.length)return 'Send the Stage 04 instruction with '+materials.join(', ')+'. The prompt does not include those materials. When the agent finishes, paste its final JSON response here.';}"
          new="if(stage===4)return 'Use the current Stage 04 instruction. The application has already supplied the captured human-authority input and complete obligation manifest; do not reattach the original intent file. Return the final structured JSON when requirement compilation is complete.';"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/apply-stage4-closure.yml').unlink()
          PY
          for f in prompt-engine.js workflow-engine.js; do node --check "$f"; done
          node build-test-project.mjs
          node verify-v3-bundle.mjs
      - name: Commit Stage 04 closure
        shell: bash
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git commit -m "Fix Stage 04 to reuse durable Stage 01 intake"
          git push origin HEAD:implementation/closed-loop-v3
