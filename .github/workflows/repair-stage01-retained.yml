name: Repair retained Stage 01 disposition

on:
  push:
    branches: [repair/stage01-final-proof-20260903]
    paths:
      - '.repair-stage01-retained.mjs'
      - '.github/workflows/repair-stage01-retained.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/stage01-final-proof-20260903
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact migration correction
        run: node .repair-stage01-retained.mjs
      - name: Prove source and live operator path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-stage01-contract.mjs
          node verify-v3-authority-and-intake.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node build-test-project.mjs
          node verify.mjs
          if [ ! -x "$BROWSER" ]; then BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"; export BROWSER; fi
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
      - name: Commit only the completed ratchet step
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .repair-stage01-retained.mjs .github/workflows/repair-stage01-retained.yml
          git add app-core.js
          git diff --cached --check
          git commit -m 'Migrate retained Stage 01 accounting disposition'
          git push origin HEAD:repair/stage01-final-proof-20260903
