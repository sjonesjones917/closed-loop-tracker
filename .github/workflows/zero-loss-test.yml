name: Diagnose clean zero-loss semantic adjudication

on:
  push:
    branches:
      - reliability/zero-loss-semantic-adjudication-clean
    paths:
      - .github/workflows/zero-loss-test.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: baseline
        name: Syntax and architecture baseline
        continue-on-error: true
        run: |
          set -euo pipefail
          node build-test-project.mjs
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
      - id: adjudication
        name: Semantic adjudication invariant suite
        continue-on-error: true
        run: timeout 120s node verify-adjudication.mjs
      - id: ingestion
        name: Ingestion and canonical invariants
        continue-on-error: true
        run: |
          timeout 180s node verify-ingestion.mjs
          timeout 180s node verify-complete.mjs
      - id: prompts
        name: Prompt isolation and semantics
        continue-on-error: true
        run: timeout 180s node verify-prompt-semantics.mjs
      - id: lifecycle
        name: Continuous 30-stage lifecycle
        continue-on-error: true
        run: timeout 240s node verify-full-cycle.mjs
      - name: Publish diagnostic result
        if: always()
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          ADJUDICATION: ${{ steps.adjudication.outcome }}
          INGESTION: ${{ steps.ingestion.outcome }}
          PROMPTS: ${{ steps.prompts.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
        run: |
          printf 'baseline=%s\nadjudication=%s\ningestion=%s\nprompts=%s\nlifecycle=%s\n' "$BASELINE" "$ADJUDICATION" "$INGESTION" "$PROMPTS" "$LIFECYCLE"
          test "$BASELINE" = success
          test "$ADJUDICATION" = success
          test "$INGESTION" = success
          test "$PROMPTS" = success
          test "$LIFECYCLE" = success
