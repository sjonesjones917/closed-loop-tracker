name: Apply Stage 2 source-role semantic fix
on:
  push:
    branches:
      - semantic-reliability/source-role-only
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 .source-role-only.py
      - run: |
          node --check workbook.js
          node --check prompt-engine.js
          node --check workflow-engine.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - if: success()
        run: |
          rm -f .source-role-only.py .github/workflows/apply-source-role-only.yml
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git add -A
          git commit -m 'Align Stage 2 source authority and evidence roles'
          git push origin HEAD:semantic-reliability/source-role-only
