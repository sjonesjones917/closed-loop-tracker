name: Gated v2 migration repair
on:
  push:
    branches: [ci/pages-zero-loss-proof-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[v2-migration-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/pages-zero-loss-proof-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow v2 migration correction
        shell: python
        run: |
          from pathlib import Path
          p=Path('workbook.js'); s=p.read_text()
          old="""  if(p.schema!=='human-project/30')throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n"""
          new="""  if(p.schema==='closed-loop-project/2'){\n    if(p.workflow!==WORKFLOW_ID||Number(p.stageCount)!==STAGE_COUNT)throw new Error('Project /2 migration requires mobile-closed-loop/30 with exactly 30 stages.');\n    const migrated=JSON.parse(JSON.stringify(p)),original=JSON.parse(JSON.stringify(p));\n    migrated.schema=PROJECT_SCHEMA;\n    migrated.projectData=migrated.projectData&&typeof migrated.projectData==='object'?migrated.projectData:{};\n    migrated.projectData.migrationArchives=Array.isArray(migrated.projectData.migrationArchives)?migrated.projectData.migrationArchives:[];\n    migrated.projectData.historicalImportRecords=Array.isArray(migrated.projectData.historicalImportRecords)?migrated.projectData.historicalImportRecords:[];\n    migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:'closed-loop-project/2',preservedAt:new Date().toISOString(),nonOperational:true,payload:original});\n    restoreLegacyStage01AcceptedCapture(migrated,original);\n    if(!migrated.stages||Object.keys(migrated.stages).length!==STAGE_COUNT)throw new Error('Project /2 migration requires exactly 30 stages.');\n    return migrated;\n  }\n  if(p.schema!=='human-project/30')throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n"""
          assert old in s
          p.write_text(s.replace(old,new,1))
      - name: Verify migration and existing live path
        run: |
          set -euo pipefail
          node --check workbook.js
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs
          node verify-hash.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.1
          done
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
      - name: Commit accepted repair
        run: |
          rm -f .github/workflows/repair-v2-migration.yml .stage04-repair-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Support deterministic project /2 to /3 migration [v2-migration-repair-applied]'
          git push origin HEAD:ci/pages-zero-loss-proof-20260831
