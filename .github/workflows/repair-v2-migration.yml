name: Gated v3 controlling repair
on:
  push:
    branches: [ci/pages-zero-loss-proof-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[v3-controlling-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/pages-zero-loss-proof-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply candidate corrections in the isolated runner
        run: |
          python3 .github/repair-v3.py
          python3 .github/repair-followup.py
          python3 .github/repair-followup2.py
          python3 .github/repair-followup3.py
          python3 .github/repair-followup4.py
      - name: Verify complete corrected source and local operator path
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            node --check "$file"
          done
          node verify-hash.mjs
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-semantic-invariant.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
          node verify-stage-prompts-complete.mjs
          node verify-all-stage-prompts.mjs
          node verify-full-cycle.mjs
          node verify-complete.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-mobile-stage-action.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-human-stage-walkthrough.mjs
      - name: Commit only the accepted candidate
        run: |
          rm -f .github/workflows/repair-v2-migration.yml .github/repair-v3.py .github/repair-followup.py .github/repair-followup2.py .github/repair-followup3.py .github/repair-followup4.py .stage04-repair-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply controlling /3 reliability corrections [v3-controlling-repair-applied]'
          git push origin HEAD:ci/pages-zero-loss-proof-20260831
