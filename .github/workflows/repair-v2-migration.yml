name: Gated v2 migration repair
on:
  push:
    branches: [ci/pages-zero-loss-proof-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[v2-migration-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/pages-zero-loss-proof-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow v2 migration and Stage 04 authority corrections
        shell: python
        run: |
          from pathlib import Path
          p=Path('workbook.js'); s=p.read_text()
          old="""  if(p.schema!=='human-project/30')throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n"""
          new="""  if(p.schema==='closed-loop-project/2'){\n    if(p.workflow!==WORKFLOW_ID||Number(p.stageCount)!==STAGE_COUNT)throw new Error('Project /2 migration requires mobile-closed-loop/30 with exactly 30 stages.');\n    const migrated=JSON.parse(JSON.stringify(p)),original=JSON.parse(JSON.stringify(p));\n    migrated.schema=PROJECT_SCHEMA;\n    migrated.projectData=migrated.projectData&&typeof migrated.projectData==='object'?migrated.projectData:{};\n    migrated.projectData.migrationArchives=Array.isArray(migrated.projectData.migrationArchives)?migrated.projectData.migrationArchives:[];\n    migrated.projectData.historicalImportRecords=Array.isArray(migrated.projectData.historicalImportRecords)?migrated.projectData.historicalImportRecords:[];\n    migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:'closed-loop-project/2',preservedAt:new Date().toISOString(),nonOperational:true,payload:original});\n    restoreLegacyStage01AcceptedCapture(migrated,original);\n    if(!migrated.stages||Object.keys(migrated.stages).length!==STAGE_COUNT)throw new Error('Project /2 migration requires exactly 30 stages.');\n    return migrated;\n  }\n  if(p.schema!=='human-project/30')throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          p=Path('prompt-engine.js'); s=p.read_text()
          old="STAGE 04 ACCOUNTING OUTPUT\\nEvery obligationId in APPLICATION OBLIGATION MANIFEST"
          new="STAGE 04 ACCOUNTING OUTPUT\\nAPPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST\\nEvery obligationId in APPLICATION OBLIGATION MANIFEST"
          assert old in s
          p.write_text(s.replace(old,new,1))
          p=Path('verify-stage-prompts-complete.mjs'); s=p.read_text()
          old="'every inputId exactly once'"
          new="'Every unitId in APPLICATION INTAKE MANIFEST must appear exactly once'"
          assert old in s
          s=s.replace(old,new,1)
          start=s.index('const requiredReads={')
          end=s.index('};\nconst semantic=',start)+2
          current_reads="const requiredReads={4:['research','candidateRequirements','sources','evidenceRecords'],5:['requirements','research','sources','sourceConflicts','evidenceRecords'],6:['requirements','requirementResolutions','artifacts'],7:['requirements','tests','artifacts','evidenceRecords'],8:['requirements','tests','failureTests','requirementResolutions','sources'],10:['instructions','preflightRecords','tests','failureTests','artifacts'],13:['verification','runs','requirements','tests'],14:['defects','comparisons','verification','requirements','tests','instructions','runs'],15:['defects','rootCauses','requirements','tests','artifacts','evidenceRecords'],16:['defects','rootCauses','regressions','regressionExecutions','requirements','instructions','tests','artifacts'],21:['baselines','instructions','artifacts','freshContexts'],23:['products','requirements','tests','sources','evidenceRecords'],24:['products','requirements','tests','regressions','regressionExecutions','evidenceRecords'],25:['products','artifacts','requirements'],26:['products','baselines','requirements','instructions','tests','runs','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','defects','blockers','evidenceRecords'],27:['requirements','tests','products','baselines','deterministicResults','meaningResults','adversarialResults','representationInspections','processAudits','productAudits','defects','blockers','regressionExecutions','evidenceRecords'],29:['sources','requirements','instructions','instructionTraces','runs','products','baselines','tests','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','processAudits','productAudits','regressions','regressionExecutions','releaseRecords','artifactIdentities','evidenceRecords'],30:['defects','rootCauses','regressions','regressionExecutions','changes','baselines','evidenceRecords']};"
          s=s[:start]+current_reads+s[end:]
          old="    for(const phrase of semantic[stage]||[])if(!prompt.toLowerCase().includes(String(phrase).toLowerCase()))throw new Error(`Stage ${stage} ${operation} missing stage-semantic instruction: ${phrase}`);"
          new="    const exactProcedure=prompts.procedureFor(stage,operation);if(!exactProcedure||!prompt.includes(exactProcedure))throw new Error(`Stage ${stage} ${operation} did not embed the exact current prompt-authority procedure.`);"
          assert old in s
          s=s.replace(old,new,1)
          old="    if((stage===17||stage===19)&&!prompt.includes(`CURRENT DECLARED OPERATION: ${operation}`))throw new Error(`Stage ${stage} ${operation} lacks exact operation-specific instruction.`);"
          new="    if((stage===17||stage===19)&&!exactProcedure.toLowerCase().includes(`operation ${operation.toLowerCase()} only`))throw new Error(`Stage ${stage} ${operation} lacks operation-specific procedure semantics.`);"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify migration and existing live path
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check prompt-engine.js
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs
          node verify-hash.mjs
          node verify-stage-prompts-complete.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.1
          done
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
      - name: Commit accepted repair
        run: |
          rm -f .github/workflows/repair-v2-migration.yml .stage04-repair-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Support /2 migration and explicit Stage 04 manifest authority [v2-migration-repair-applied]'
          git push origin HEAD:ci/pages-zero-loss-proof-20260831
