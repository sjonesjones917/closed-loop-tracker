name: Inspect conformance anchors
on:
  push:
    branches: [fix/spec-conformance-zero-loss-clean]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact accounting/schema anchors
        run: |
          sed -n '970,1065p' workflow-schema.js
          sed -n '1160,1215p' workflow-schema.js
          sed -n '74,285p' response-ingestion.js
