name: Inspect conformance anchors
on:
  push:
    branches: [fix/spec-conformance-zero-loss-clean]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact accounting/schema anchors
        run: |
          sed -n '760,970p' workflow-schema.js
          sed -n '1110,1175p' workflow-schema.js
          grep -n -E "function gate|case 1:|case 3:|case 4:|stage===1|stage===3|stage===4|intakeCoverage|obligationManifest" workflow-engine.js | head -n 220
