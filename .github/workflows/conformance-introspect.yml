name: Inspect conformance anchors
on:
  push:
    branches: [fix/spec-conformance-zero-loss-clean]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact accounting/schema anchors
        run: |
          sed -n '115,155p' workflow-engine.js
          sed -n '300,350p' workflow-engine.js
          sed -n '350,380p' workflow-engine.js
