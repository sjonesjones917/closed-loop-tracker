name: Stage 2 provenance correction on latest main
on:
  push:
    branches: [fix/stage2-provenance-latest-main-20260826]
permissions:
  contents: write
jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage2-provenance-latest-main-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified Stage 2 fix while preserving latest UI changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          set +e
          git cherry-pick 1991a9749890a8a18fdb2c49c30160cb7fac21b6
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            for f in app-core.js index.html .github/workflows/stage2-provenance-latest-main.yml; do
              if git diff --name-only --diff-filter=U | grep -Fxq "$f"; then git checkout --ours -- "$f"; git add "$f"; fi
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unexpected unresolved conflicts:" >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            GIT_EDITOR=true git cherry-pick --continue
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js'); s=p.read_text()
          old_named='return names\n      ?`Include the original supplied project artifact(s) with the Stage 02 prompt so the agent can inventory and inspect the actual files: ${names}.`\n      :\'Include the original supplied project artifact(s) with the Stage 02 prompt so the agent can inventory and inspect the actual files. The prompt text alone does not provide the artifact bytes.\';'
          new="return 'Stage 02 researches independent external sources. Supplied project artifacts are not required for this stage.';"
          if old_named not in s:
              raise SystemExit('Latest Stage 02 artifact-handoff block not found')
          s=s.replace(old_named,new)
          p.write_text(s)
          for name in ['verify-browser.mjs']:
              q=Path(name); t=q.read_text()
              t=t.replace('Include the original supplied project artifact(s) with the Stage 02 prompt so the agent can inventory and inspect the actual files','Stage 02 researches independent external sources. Supplied project artifacts are not required for this stage')
              q.write_text(t)
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const id=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[0-9a-f]{16}/g,id);
          fs.writeFileSync('index.html',html);
          console.log(JSON.stringify({runtimeBuildIdentity:id}));
          NODE
      - name: Syntax and core verification
        run: |
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-ingestion.mjs
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser verification
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/stage2-latest-main-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove temporary workflow and commit tested result
        run: |
          rm -f .github/workflows/stage2-provenance-latest-main.yml
          git add -A
          git diff --cached --quiet || git commit -m "Fix Stage 2 external-source and provenance boundary on latest main"
          git push origin HEAD:fix/stage2-provenance-latest-main-20260826
