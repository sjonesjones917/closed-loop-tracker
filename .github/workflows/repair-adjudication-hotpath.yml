name: Materialize adjudication hot-path repair
on:
  push:
    branches: [reliability/eliminate-gate-full-project-clone-20260828]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/eliminate-gate-full-project-clone-20260828
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal responsible-layer repair
        run: node .repair-adjudication-hotpath.mjs
      - name: Prove semantic preservation before commit
        run: |
          node --check workflow-engine.js
          node --check verify-semantic-invariant.mjs
          node verify-semantic-invariant.mjs
          node verify.mjs
          node verify-complete.mjs
      - name: Remove bootstrap and commit exact repair
        run: |
          rm .repair-adjudication-hotpath.mjs .github/workflows/repair-adjudication-hotpath.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-engine.js verify-semantic-invariant.mjs .repair-adjudication-hotpath.mjs .github/workflows/repair-adjudication-hotpath.yml
          git commit -m 'Eliminate full-project semantic gate cloning'
          git push origin HEAD:reliability/eliminate-gate-full-project-clone-20260828
