name: PR6 operation isolation repair
on:
  push:
    branches: [practical-100/pr6-operation-isolation]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply operation-specific contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('workflow-schema.js'); s=p.read_text()
          old="function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;return Object.freeze({operation,readCollections:Object.freeze(READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(STAGE_COLLECTIONS[stage]||[]),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(SCOPE_REQUIREMENTS[stage]||[])});}"
          new="""const OPERATION_CONTRACT_OVERRIDES=Object.freeze({
            17:Object.freeze({
              FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions'],agentWritableCollections:[]}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs']}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification']}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons']}),
              ROOT_CAUSE:Object.freeze({readCollections:['defects','comparisons','verification'],agentWritableCollections:['defects','rootCauses']}),
              REGRESSION:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions'],agentWritableCollections:['regressions','regressionExecutions']}),
              CORRECT:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions','changes'],agentWritableCollections:['changes']})
            }),
            19:Object.freeze({
              CONFIRM_FREEZE:Object.freeze({readCollections:['convergenceRecords','candidateFreezes','iterations'],agentWritableCollections:[]}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs']}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification']}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons']}),
              REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs'],agentWritableCollections:['regressionExecutions']}),
              CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','regressionExecutions','candidateFreezes'],agentWritableCollections:['confirmationRecords']})
            })
          });
          function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[])});}"
          assert old in s, 'operationContract baseline changed'; s=s.replace(old,new,1); p.write_text(s)

          p=Path('prompt-engine.js'); s=p.read_text()
          s=s.replace(" const contract=schema.STAGE_CONTRACTS[stage];const writable=contract.agentWritableCollections;"," const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation);const writable=op?.agentWritableCollections||contract.agentWritableCollections;",1)
          s=s.replace('function body(stage,state){','function body(stage,state,operation){',1)
          s=s.replace(" const contract=schema.STAGE_CONTRACTS[stage];\n const fields=contract.allowedStageData.length?contract.allowedStageData.map(x=>`- ${x}`).join('\\\n'):'- No agent-owned stageData fields; use permitted records/evidence only.';\n const collections=contract.agentWritableCollections.length?contract.agentWritableCollections.map(c=>`- ${c}: ${schema.recordAgentFields(c).join(', ')||'no agent-owned fields'}`).join('\\\n'):'- NONE';"," const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation||contract.operations[0]);\n const fields=contract.allowedStageData.length?contract.allowedStageData.map(x=>`- ${x}`).join('\\\n'):'- No agent-owned stageData fields; use permitted records/evidence only.';\n const writable=op?.agentWritableCollections||contract.agentWritableCollections;\n const collections=writable.length?writable.map(c=>`- ${c}: ${schema.recordAgentFields(c).join(', ')||'no agent-owned fields'}`).join('\\\n'):'- NONE';",1)
          old="const scope=scopeFor(stage,state,options.scope||{}),contextManifest={stage,operation,scope,readCollections:Object.fromEntries((schema.STAGE_CONTRACTS[stage].readCollections||[]).map(collection=>[collection,(state?.projectData?.[collection]||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy).map(record=>({id:recordId(record,collection),scope:record.scope||{},contentSha256:record.contentSha256||record.sha256||hash.sha256Value(record.fields||record)}))])),answeredHumanClarifications:"
          new="const opContract=schema.operationContract(stage,operation);const scope=scopeFor(stage,state,options.scope||{}),contextManifest={stage,operation,scope,readCollections:Object.fromEntries((opContract?.readCollections||schema.STAGE_CONTRACTS[stage].readCollections||[]).map(collection=>[collection,(state?.projectData?.[collection]||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy).map(record=>({id:recordId(record,collection),scope:record.scope||{},contentSha256:record.contentSha256||record.sha256||hash.sha256Value(record.fields||record)}))])),answeredHumanClarifications:"
          assert old in s, 'context manifest baseline changed'; s=s.replace(old,new,1)
          s=s.replace('bodyText=body(stage,state),bodySha256','bodyText=body(stage,state,operation),bodySha256',1)
          p.write_text(s)

          p=Path('response-ingestion.js'); s=p.read_text()
          old="const expectedOperation=promptRecord?.operation||contract?.operations?.[0];if(String(envelope.operation||'')!==String(expectedOperation||''))issues.push(issue('WRONG_OPERATION','/operation',`Expected operation ${expectedOperation||'UNKNOWN'}.`));"
          new="const expectedOperation=promptRecord?.operation||contract?.operations?.[0];const operationContract=schema.operationContract(stageNumber,expectedOperation);if(String(envelope.operation||'')!==String(expectedOperation||''))issues.push(issue('WRONG_OPERATION','/operation',`Expected operation ${expectedOperation||'UNKNOWN'}.`));"
          assert old in s, 'operation identity baseline changed'; s=s.replace(old,new,1)
          s=s.replace('for(const key of contract?.scopeRequirements||[])','for(const key of operationContract?.scopeRequirements||contract?.scopeRequirements||[])',1)
          s=s.replace('const allowedCollections=new Set(contract?.agentWritableCollections||contract?.allowedCollections||[]);','const allowedCollections=new Set(operationContract?.agentWritableCollections||contract?.agentWritableCollections||contract?.allowedCollections||[]);',1)
          s=s.replace('`${collection} is not writable from Stage ${stageNumber}.`','`${collection} is not writable from Stage ${stageNumber} operation ${expectedOperation}.`',1)
          p.write_text(s)

          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          insert="""
          const expectedOperationWrites={
            17:{FREEZE:[],EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],ROOT_CAUSE:['defects','rootCauses'],REGRESSION:['regressions','regressionExecutions'],CORRECT:['changes']},
            19:{CONFIRM_FREEZE:[],EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],REGRESSION_VERIFY:['regressionExecutions'],CONFIRM:['confirmationRecords']}
          };
          for(const [stage,operations] of Object.entries(expectedOperationWrites))for(const [operation,writes] of Object.entries(operations)){
            const actual=schema.operationContract(Number(stage),operation).agentWritableCollections;
            if(!arraysEqual(actual,writes))throw new Error(`Stage ${stage} ${operation} has semantically wrong writable collections: ${actual.join(', ')}`);
          }
          const runRead=schema.operationContract(17,'EXECUTE_RUN').readCollections;
          if(!runRead.includes('runs')||!runRead.includes('freshContexts'))throw new Error('Stage 17 EXECUTE_RUN cannot see its reserved run/context slots.');
          """
          anchor='let checked=0;'; assert anchor in s; s=s.replace(anchor,insert+'\n'+anchor,1)
          p.write_text(s)

          p=Path('.github/workflows/pages.yml'); s=p.read_text()
          old='node build-test-project.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs'
          new='node build-test-project.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-prompt-semantics.mjs'
          if old in s:s=s.replace(old,new)
          p.write_text(s)
          PY
          for f in *.js *.mjs; do node --check "$f"; done
      - name: Verify operation isolation and existing invariants
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Verify browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
      - name: Commit verified source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr6-operation-isolation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'PR 6: enforce operation-specific contracts'
          git push origin HEAD:practical-100/pr6-operation-isolation
