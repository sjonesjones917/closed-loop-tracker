name: Verify final semantic contract
on:
  push:
    branches:
      - practical-100/final-semantic-contract
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-semantic-contract
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified semantic delta
        run: |
          curl -fsSL https://raw.githubusercontent.com/sjonesjones917/closed-loop-tracker/06a7ee7014b4f8de9e3316da0ee8ac62478a8a03/semantic_contract_patch.py -o /tmp/semantic_contract_patch.py
          python3 /tmp/semantic_contract_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          if 'BLOCKED with INADEQUATE_PRIOR_OUTPUT' not in s:
              anchor='MANDATORY RESPONSE RULES'
              rule='- A materially inadequate accepted prior-stage result requires BLOCKED with INADEQUATE_PRIOR_OUTPUT and must identify the earliest accepted result that needs refinement. This is distinct from missing application context and from missing human input.'
              if anchor not in s:
                  raise SystemExit('Could not locate mandatory-response section.')
              s=s.replace(anchor,anchor+'\n'+rule,1)
          if 'BLOCKED with INADEQUATE_PRIOR_OUTPUT' not in s:
              raise SystemExit('INADEQUATE_PRIOR_OUTPUT recovery rule was not installed.')
          p.write_text(s)
          PY
      - name: Syntax
        run: |
          for f in workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs; do node --check "$f"; done
      - name: Deterministic acceptance
        run: |
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser acceptance
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified source
        run: |
          rm .github/workflows/apply-final-semantic-contract.yml
          rm -f .final-semantic-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Close response-contract and current-scope reliability gaps"
          git push origin HEAD:practical-100/final-semantic-contract