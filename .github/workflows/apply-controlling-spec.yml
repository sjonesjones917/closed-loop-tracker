name: Apply controlling specification conformance repair
on:
  push:
    branches: [controlling-spec-conformance]
    paths: ['.github/workflows/apply-controlling-spec.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: controlling-spec-conformance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified conformance patches
        run: |
          python3 .github/apply_controlling_spec.py
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check test-runtime.js
          node --check verify-controlling-spec.mjs
          node verify-controlling-spec.mjs
      - name: Commit product changes
        run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js index.html .github/workflows/pages.yml verify-controlling-spec.mjs
          git commit -m "Align prompts and capture-once workflow with controlling specification"
          git push origin HEAD:controlling-spec-conformance
