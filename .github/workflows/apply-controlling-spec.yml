name: Apply controlling specification conformance repair
on:
  push:
    branches: [controlling-spec-conformance]
    paths: ['.github/workflows/apply-controlling-spec.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: controlling-spec-conformance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify extended conformance patches
        run: |
          set +e
          : > repair-diagnostics.txt
          failed=0
          run(){ echo ">>> $*" >> repair-diagnostics.txt; "$@" >> repair-diagnostics.txt 2>&1; c=$?; echo "exit=$c" >> repair-diagnostics.txt; [ $c -eq 0 ] || failed=1; }
          run python3 .github/apply_controlling_spec.py
          run python3 .github/apply_controlling_spec2.py
          for f in workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js verify-controlling-spec.mjs verify-test-runtime.mjs; do run node --check "$f"; done
          run node verify-controlling-spec.mjs
          run node verify-test-runtime.mjs
          git restore .github/workflows/pages.yml 2>/dev/null || true
          if [ $failed -eq 0 ]; then echo 'RESULT=PASS' >> repair-diagnostics.txt; else echo 'RESULT=FAIL' >> repair-diagnostics.txt; fi
          cat repair-diagnostics.txt
      - name: Commit verified source or diagnostic
        run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          if grep -q '^RESULT=PASS$' repair-diagnostics.txt; then
            git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js index.html verify-controlling-spec.mjs verify-test-runtime.mjs
            git rm -f repair-diagnostics.txt >/dev/null 2>&1 || true
            git add -u repair-diagnostics.txt
            git commit -m "Complete Test IR and durable Stage 01-04 accounting" || true
          else
            git add repair-diagnostics.txt
            git commit -m "Capture extended repair diagnostic" || true
          fi
          git push origin HEAD:controlling-spec-conformance
