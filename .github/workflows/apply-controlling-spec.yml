name: Apply controlling specification conformance repair
on:
  push:
    branches: [controlling-spec-conformance]
    paths: ['.github/workflows/apply-controlling-spec.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: controlling-spec-conformance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and diagnose extended conformance patch
        run: |
          set +e
          : > repair-diagnostics.txt
          run(){ echo ">>> $*" >> repair-diagnostics.txt; "$@" >> repair-diagnostics.txt 2>&1; c=$?; echo "exit=$c" >> repair-diagnostics.txt; return $c; }
          run python3 .github/apply_controlling_spec.py || true
          for f in workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js verify-controlling-spec.mjs verify-test-runtime.mjs; do run node --check "$f" || true; done
          run node verify-controlling-spec.mjs || true
          run node verify-test-runtime.mjs || true
          git restore .github/workflows/pages.yml 2>/dev/null || true
          cat repair-diagnostics.txt
      - name: Commit diagnostic only
        run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add repair-diagnostics.txt
          git commit -m "Capture extended repair diagnostic" || true
          git push origin HEAD:controlling-spec-conformance
