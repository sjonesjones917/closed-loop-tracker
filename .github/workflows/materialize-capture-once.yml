name: materialize-capture-once

on:
  push:
    branches:
      - fix/controlling-spec-zero-loss-20260830
    paths:
      - .github/workflows/materialize-capture-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-zero-loss-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize capture-once corrections
        id: patch
        continue-on-error: true
        run: |
          set +e
          python3 tools/materialize_remaining.py > materialize-capture-once.log 2>&1
          status=$?
          cat materialize-capture-once.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic on patch failure
        if: steps.patch.outputs.status != '0'
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add materialize-capture-once.log
          git commit -m 'Record capture-once materialization diagnostic'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
      - name: Validate repaired runtime
        if: steps.patch.outputs.status == '0'
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check app-core.js
          node verify-intent-capture.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-test-runtime.mjs
          node verify.mjs
      - name: Commit repaired implementation
        if: steps.patch.outputs.status == '0'
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js app-core.js verify-intent-capture.mjs .github/workflows/pages.yml
          git commit -m 'Materialize durable capture-once intent flow'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
