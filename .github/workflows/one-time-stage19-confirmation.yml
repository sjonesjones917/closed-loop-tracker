name: One-time Stage 19 authority repair

on:
  push:
    branches: [repair/operation-authority-closure-20260903]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply Stage 19 authority correction
        run: node .repair-stage19-application-confirmation.mjs
      - name: Prove focused contracts
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify-operation-authority-closure.mjs
          node verify-v3-contract.mjs
      - name: Remove transient scaffolding and commit correction
        run: |
          set -euo pipefail
          git config user.name "closed-loop repair automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .repair-stage19-application-confirmation.mjs .github/workflows/one-time-stage19-confirmation.yml
          git add workflow-schema.js workflow-engine.js verify-full-cycle.mjs verify-v3-contract.mjs
          git commit -m "Make Stage 19 confirmation application-derived"
          git push origin HEAD:repair/operation-authority-closure-20260903
