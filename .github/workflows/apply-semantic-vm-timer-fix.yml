name: Apply semantic verifier timer harness fix

on:
  push:
    branches:
      - repair/complete-conformance-continuation-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair verifier harness and prove focused regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-semantic-review-acceptance.mjs')
          s=p.read_text()
          old="crypto:globalThis.crypto,URL,structuredClone,console,TextEncoder,TextDecoder,Blob,setTimeout,queueMicrotask,requestAnimationFrame:callback=>queueMicrotask(callback),"
          new="crypto:globalThis.crypto,URL,structuredClone,console,TextEncoder,TextDecoder,Blob,setTimeout,clearTimeout,queueMicrotask,requestAnimationFrame:callback=>queueMicrotask(callback),"
          if old not in s:
              raise SystemExit('semantic verifier timer harness target not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check verify-semantic-review-acceptance.mjs
          node verify-semantic-review-acceptance.mjs
      - name: Commit verified harness correction
        run: |
          set -euo pipefail
          rm .github/workflows/apply-semantic-vm-timer-fix.yml
          git add verify-semantic-review-acceptance.mjs .github/workflows/apply-semantic-vm-timer-fix.yml
          git config user.name 'closed-loop conformance bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Provide timer cleanup in semantic verifier VM'
          git push origin HEAD:repair/complete-conformance-continuation-20260914
