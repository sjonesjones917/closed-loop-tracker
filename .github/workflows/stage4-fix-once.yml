name: Apply Stage 4 retained-intent fix once
on:
  push:
    branches:
      - fix/stage04-retained-intent-final-20260830a
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage04-retained-intent-final-20260830a
          fetch-depth: 0
      - name: Apply and prove repair
        run: bash .stage4-fix.sh
