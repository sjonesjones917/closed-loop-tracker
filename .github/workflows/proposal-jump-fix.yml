name: Proposal jump navigation fix
on:
  push:
    branches:
      - fix/proposal-jump-to-actions-20260827
permissions:
  contents: write
jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/proposal-jump-to-actions-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add long-proposal review shortcut
        run: python3 .github/proposal-jump-patch.py
      - name: Syntax and complete verification
        run: |
          node --check app-core.js
          node --check verify-browser.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser verification
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/proposal-jump-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove temporary patch files and commit verified result
        run: |
          rm -f .github/workflows/proposal-jump-fix.yml .github/proposal-jump-patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Add direct navigation for long proposal review"
          git push origin HEAD:fix/proposal-jump-to-actions-20260827
