name: Apply operator flow fix
on:
  push:
    branches: [fix/native-stage22-stage28-operator-flow]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove false external handoffs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('workflow-engine.js'); s=p.read_text()
          old="if([23,24].includes(stage)){const reviewer=records(project,'freshContexts').filter(r=>isActiveRecord(r)&&Number(r.stage)===stage).at(-1);if(!reviewer){const handoff=executionHandoff(project,{stage,operation:'COMPLETE'});return actionEnvelope(project,stage,{actionType:'AI_REVIEW',heading:'Open a fresh independent reviewer context',explanation:'Use a reviewer context that did not generate the product. Register its external context identifier before sending any product or review material so the application can bind and evaluate independence.',primaryButton:'Register reviewer context',filesToSend:handoff.send,filesToWithhold:handoff.withhold,expectedReturnFiles:handoff.expectBack});}}"
          new="if([9,23,24].includes(stage)){const reviewer=records(project,'freshContexts').filter(r=>isActiveRecord(r)&&Number(r.stage)===stage).at(-1);if(!reviewer){const handoff=executionHandoff(project,{stage,operation:'COMPLETE'}),preflight=stage===9;return actionEnvelope(project,stage,{actionType:'AI_REVIEW',heading:'Open a fresh independent reviewer context',explanation:preflight?'Use a new reviewer context that did not author the Stage 08 production instruction. Register its external context identifier before sending the Stage 09 preflight instruction so the application can bind the reviewer identity into the current prompt.':'Use a reviewer context that did not generate the product. Register its external context identifier before sending any product or review material so the application can bind and evaluate independence.',primaryButton:'Register reviewer context',filesToSend:handoff.send,filesToWithhold:handoff.withhold,expectedReturnFiles:handoff.expectBack});}}"
          if old not in s: raise SystemExit('reviewer action anchor missing')
          s=s.replace(old,new,1)
          anchor="if(stage===4)return actionEnvelope(project,stage,{actionType:'PASTE_FINAL_JSON'"
          if anchor not in s: raise SystemExit('stage4 action anchor missing')
          insert="if(stage===28)return actionEnvelope(project,stage,{actionType:'ATTACH_REQUIRED_FILES',heading:'Verify the exact delivery bytes',explanation:'No external agent response belongs to Stage 28. Open Release control, select the audited canonical files and the exact delivery files, then let the application hash and compare them one-to-one before delivery authorization.',primaryButton:null,blockingReason:null});\n  "
          s=s.replace(anchor,insert+anchor,1)
          p.write_text(s)

          p=Path('app-core.js'); s=p.read_text()
          old="function currentStagePrompt(n){const lock=stageLocked(n);"
          new="function currentStagePrompt(n){const lock=stageLocked(n);if(Number(n)===28)return 'NO EXTERNAL AGENT INSTRUCTION REQUIRED\\n\\nStage 28 is an application-controlled byte-identity operation. Open Release control, select the exact audited canonical files and exact delivery files, and let the application calculate byte size and SHA-256 and compare canonical identity. Do not send a prompt and do not paste agent JSON for this stage.';"
          if old not in s: raise SystemExit('currentStagePrompt anchor missing')
          s=s.replace(old,new,1)
          old2="29:'The application proves every mandatory requirement has a current structural evidence chain and evidence capable of proving the proposition.'}[n];"
          new2="28:'No external agent response is used here. Open Release control and select the exact audited canonical files and exact delivery files; the application computes and compares byte size and SHA-256 before authorization.',29:'The application proves every mandatory requirement has a current structural evidence chain and evidence capable of proving the proposition.'}[n];"
          if old2 not in s: raise SystemExit('stage purpose anchor missing')
          s=s.replace(old2,new2,1)
          old3="return text?`<div class=\"notice\"><strong>This stage</strong><br>${esc(text)}${automatic}${external}</div>`:(automatic+external);"
          new3="return text?`<div class=\"notice\"><strong>This stage</strong><br>${esc(text)}${n===28?'<div class=\"button-row\"><button class=\"primary\" type=\"button\" data-view=\"Release\">Open release controls</button></div>':''}${automatic}${external}</div>`:(automatic+external);"
          if old3 not in s: raise SystemExit('stage purpose return anchor missing')
          s=s.replace(old3,new3,1)
          # workflow variables: disable external prompt/response while pending application-native Stage22 work, and always at Stage28.
          old4="prompt=savedPrompt?.prompt||currentStagePrompt(n),responseLocked=locked||s.status==='COMPLETE',latestValidation="
          new4="prompt=savedPrompt?.prompt||currentStagePrompt(n),applicationOnlyInteraction=(n===22&&nativeStage22Tests().length>0)||n===28,responseLocked=locked||s.status==='COMPLETE'||applicationOnlyInteraction,latestValidation="
          if old4 not in s: raise SystemExit('workflow interaction variable anchor missing')
          s=s.replace(old4,new4,1)
          old5="promptIntro=locked?'This future stage is inspectable, but no controlling instruction is available until every prerequisite stage is complete.':savedPrompt?"
          new5="promptIntro=locked?'This future stage is inspectable, but no controlling instruction is available until every prerequisite stage is complete.':applicationOnlyInteraction?(n===28?'No external instruction is used at Stage 28. Use Release control for the application-owned byte comparison.':'The application must run the pending native deterministic verification before any external handoff. No agent prompt or final JSON is required for the pending native work.'):savedPrompt?"
          if old5 not in s: raise SystemExit('workflow prompt intro anchor missing')
          s=s.replace(old5,new5,1)
          # Disable saving/copying a non-applicable prompt.
          s=s.replace("<button id=\"save-prompt\"${locked?' disabled':''}>Save instruction</button><button class=\"primary\" id=\"copy-prompt\"${locked?' disabled':''}>Save and copy instruction</button>","<button id=\"save-prompt\"${locked||applicationOnlyInteraction?' disabled':''}>Save instruction</button><button class=\"primary\" id=\"copy-prompt\"${locked||applicationOnlyInteraction?' disabled':''}>Save and copy instruction</button>",1)
          # Replace the returned-response guidance for application-only operations.
          old6="${locked?'No response belongs to this stage yet. Complete every prerequisite stage first; do not send a prompt or paste JSON for this stage.':String(s.status||'').toUpperCase()==='COMPLETE'"
          new6="${locked?'No response belongs to this stage yet. Complete every prerequisite stage first; do not send a prompt or paste JSON for this stage.':applicationOnlyInteraction?(n===28?'No agent response belongs to Stage 28. Complete the byte-identity comparison in Release control.':'No agent response belongs to the pending application-native verification. Run the application verification first.'):String(s.status||'').toUpperCase()==='COMPLETE'"
          if old6 not in s: raise SystemExit('response guidance anchor missing')
          s=s.replace(old6,new6,1)
          p.write_text(s)
          PY
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-engine.js app-core.js
          git commit -m "Remove false agent handoffs from native Stage 22 and Stage 28"
          git push
