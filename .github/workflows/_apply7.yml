name: Apply hash verifier correction
on: {push: {branches: [fix/spec-conformance-final]}}
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/spec-conformance-final}
      - run: |
          python _patch7.py
          node verify-hash.mjs
          rm _patch7.py .github/workflows/_apply7.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -m 'Align hash verifier with Test IR runtime graph' && git push origin HEAD:fix/spec-conformance-final
