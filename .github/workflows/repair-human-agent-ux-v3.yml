name: Repair human-agent stage UX v3
on:
  push:
    branches: [fix/stage-agent-ux-repair]
permissions:
  contents: write
jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply minimal repair
        run: python3 .repair-stage-agent-ux-v3.py
      - name: Remove one-time scaffolding
        run: rm .repair-stage-agent-ux.py .repair-stage-agent-ux-v2.py .repair-stage-agent-ux-v3.py .github/workflows/repair-human-agent-ux.yml .github/workflows/repair-human-agent-ux-v2.yml .github/workflows/repair-human-agent-ux-v3.yml
      - name: Syntax checks
        run: |
          for f in workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js test-fixtures.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$f"; done
      - name: Full deterministic suite
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Chromium phone and desktop proof
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only proven source
        run: |
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git add -A
          git commit -m 'Restore real human-first stage agent workflow'
          git push origin HEAD:fix/stage-agent-ux-repair
