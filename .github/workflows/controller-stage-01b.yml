name: Controller Stage 01B
on:
  push:
    branches: [controller-stage-01b]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate governance artifacts
        env:
          SOURCE_COMMIT: b71e828461c86184e9a08f738453443e6b579aab
        run: |
          node generate-specification-governance.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add specification/closed-loop-specification-manifest.json specification/closed-loop-normative-requirements.json
          git diff --cached --quiet || git commit -m 'Stage 01B: generate specification governance manifests'
          git push
