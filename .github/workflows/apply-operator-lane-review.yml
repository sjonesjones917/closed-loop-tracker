name: Apply operator lane review
on:
  push:
    branches:
      - reliability/operator-lane-review-4564-20260826
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/operator-lane-review-4564-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source transformer
        run: node apply-operator-lane-review.mjs
      - name: Verify full deterministic suite
        run: |
          node --check app-core.js
          node --check verify-complete.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit permanent delta only
        run: |
          rm apply-operator-lane-review.mjs .github/workflows/apply-operator-lane-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bind operator review controls to selected lane'
          git push origin HEAD:reliability/operator-lane-review-4564-20260826
