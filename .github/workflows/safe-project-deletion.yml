name: Safe project deletion

on:
  push:
    branches:
      - fix/safe-project-deletion-20260827

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-project-deletion-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal safe project-deletion correction
        run: |
          sed -i 's/browser:true/browserVerified:true/' .tmp-safe-project-deletion.mjs
          node --check .tmp-safe-project-deletion.mjs
          node .tmp-safe-project-deletion.mjs
          node --check app-core.js
          node --check project-store.js
          node --check verify-browser.mjs
      - name: Verify complete application and safe project deletion
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
      - name: Commit only the verified minimal correction
        run: |
          rm .tmp-safe-project-deletion.mjs .github/workflows/safe-project-deletion.yml
          git config user.name "sjonesjones917"
          git config user.email "sjones.jones917@gmail.com"
          git add app-core.js project-store.js verify-browser.mjs index.html .tmp-safe-project-deletion.mjs .github/workflows/safe-project-deletion.yml
          git commit -m "Add safe hidden project deletion"
          git push origin HEAD:fix/safe-project-deletion-20260827
