name: Apply canonical Operation 01 verifier repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/complete-closed-loop-spec-20260831' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-verify-op01.py
          node --check verify.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs
          git commit -m "Verify retained Operation 01 from canonical project data"
          git push origin HEAD:${{ github.head_ref }}
