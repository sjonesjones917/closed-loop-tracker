name: Close later-stage prompt context gaps
on:
  push:
    branches: [fix/later-stage-context-closure-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('prompt-engine.js')
          text=p.read_text()
          replacements={
          "9:Object.freeze(['instructions','requirements','requirementResolutions','tests','failureTests','sources','sourceConflicts','evidenceRecords','freshContexts']),":"9:Object.freeze(['instructions','requirements','requirementResolutions','tests','failureTests','sources','research','candidateRequirements','sourceConflicts','evidenceRecords','freshContexts']),",
          "25:Object.freeze(['products','baselines','tests','artifacts','evidenceRecords']),":"25:Object.freeze(['products','baselines','requirements','tests','artifacts','evidenceRecords']),",
          "26:Object.freeze(['requirements','tests','instructions','runs','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','confirmationRecords','baselines','products','evidenceRecords']),":"26:Object.freeze(['requirements','tests','instructions','runs','verification','comparisons','defects','rootCauses','changes','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','confirmationRecords','baselines','products','blockers','evidenceRecords']),",
          "27:Object.freeze(['requirements','tests','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','processAudits','productAudits','confirmationRecords','baselines','products','blockers','evidenceRecords']),":"27:Object.freeze(['requirements','tests','defects','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','processAudits','productAudits','confirmationRecords','baselines','products','blockers','evidenceRecords']),"
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit('expected prompt context line not found: '+old[:80])
              text=text.replace(old,new,1)
          m=re.search(r"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/(\d+)';",text)
          if not m: raise SystemExit('prompt engine version not found')
          n=int(m.group(1))+1
          text=text[:m.start()]+f"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/{n}';"+text[m.end():]
          p.write_text(text)
          token='runtime-20260830-live-operator-48'
          idx=Path('index.html'); html=idx.read_text(); html=re.sub(r'runtime-20260830-live-operator-\d+',token,html); idx.write_text(html)
          for filename in ('app-core.js','test-runtime.js'):
              f=Path(filename); s=f.read_text(); s=re.sub(r'runtime-20260830-live-operator-\d+',token,s); f.write_text(s)
          PY
          rm -f .github/workflows/materialize-later-stage-context.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close later-stage prompt context gaps"
          git push origin HEAD:fix/later-stage-context-closure-20260830