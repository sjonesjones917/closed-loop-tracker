name: One-time Stage 04 UI repair
on:
  push:
    branches: [controlling-spec-final-current]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controlling-spec-final-current
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Stage 04 no-repeat attachment behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('app-core.js')
          s=p.read_text()
          old="function artifactControlMarkup(n,locked){if(n===19)"
          new="function artifactControlMarkup(n,locked){if(n===4)return '';if(n===19)"
          if new not in s:
              if old not in s:
                  raise SystemExit('expected current artifactControlMarkup preimage not found')
              p.write_text(s.replace(old,new,1))
          v=Path('verify-hash.mjs')
          t=v.read_text()
          old_proof="assert(appCore.includes(\"function artifactControlMarkup(n,locked){if(n===19)\"),'Stage 04 artifact controls must retain the established visual rendering; repeat-input prevention belongs to canonical data flow, not UI suppression.');\nassert(!appCore.includes(\"function artifactControlMarkup(n,locked){if(n===4)return '';\"),'Stage 04 visual controls must not be hidden as a substitute for canonical intent reuse.');"
          new_proof="assert(appCore.includes(\"function artifactControlMarkup(n,locked){if(n===4)return '';if(n===19)\"),'Stage 04 must not render the generic artifact upload control after canonical intent capture.');\nassert(appCore.includes(\"if([2,3,4].includes(stage))throw new Error('The original Stage 01 intent file cannot be registered or reused in Stages 02 through 04; use the canonical intentStatements ledger.')\"),'Stages 02 through 04 must reject reuse of the original Stage 01 intent file.');"
          if old_proof not in t:
              raise SystemExit('expected contradictory Stage 04 verifier preimage not found')
          v.write_text(t.replace(old_proof,new_proof,1))
          runtime_files=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js','test-worker.js']
          manifest=''
          for name in runtime_files:
              b=Path(name).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              manifest+=f'{name}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          h=Path('index.html')
          html=h.read_text()
          html,n=re.subn(r'(src="(?:workbook|hash|workflow-schema|test-runtime|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)runtime-[a-f0-9]+',lambda m:m.group(1)+token,html)
          if n!=9:
              raise SystemExit(f'expected 9 runtime script cache tokens, updated {n}')
          h.write_text(html)
          PY
          node --check app-core.js
          node verify-hash.mjs
      - name: Commit repair
        run: |
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add app-core.js verify-hash.mjs index.html
          git commit -m "Restore Stage 04 no-repeat attachment control"
          git push origin HEAD:controlling-spec-final-current
