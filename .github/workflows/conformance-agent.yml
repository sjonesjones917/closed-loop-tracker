name: Temporary conformance implementation runner
on:
  push:
    branches: [closed-loop-spec-conformance]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closed-loop-spec-conformance
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply current ratchet step
        run: |
          python3 conformance-repair.py
          python3 conformance-repair-2.py
          python3 conformance-repair-3.py
          python3 conformance-repair-4.py
      - name: Prove current ratchet step
        run: bash conformance-proof.sh
      - name: Commit implementation and permanent regressions only
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-conformance-bot'
          git config user.email 'closed-loop-conformance-bot@users.noreply.github.com'
          git add -A -- ':!.github/workflows/conformance-agent.yml' ':!conformance-repair.py' ':!conformance-repair-2.py' ':!conformance-repair-3.py' ':!conformance-repair-4.py' ':!conformance-proof.sh'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ratchet controlling-spec conformance"
          git push origin HEAD:closed-loop-spec-conformance
