name: Reliability adjudication controlled-enum diagnosis
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
permissions: {contents: read}
jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[stage7-diagnose]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply patch and enumerate controlled required enums
        run: |
          cat .tmp/adjudication-patch-*.b64 | base64 -d | gzip -d > /tmp/adjudication.patch
          patch -p0 < /tmp/adjudication.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js'); t=p.read_text()
          old="'OBSERVED_RESULT','EXACT_EVIDENCE','DETERMINATION','DEFECT_ID','UNDETERMINED_REASON'"
          new="'OBSERVED_RESULT','OBSERVATION_OUTCOME','EXACT_EVIDENCE','DETERMINATION','DEFECT_ID','UNDETERMINED_REASON'"
          if t.count(old)!=1: raise SystemExit('verification compatibility target mismatch')
          p.write_text(t.replace(old,new,1))
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js']) vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const s=globalThis.closedLoopWorkflowSchema;
          const controlled=new Set(['EXECUTION_OUTCOME','PREFLIGHT_OBSERVATION','OBSERVATION_OUTCOME']);
          const rows=[];
          for(const [key,def] of Object.entries(s.RECORD_SCHEMAS)) for(const name of controlled) if(def.fields.includes(name)) rows.push({collection:key,field:name,required:def.required.includes(name),enumValues:def.fieldDefinitions[name]?.enumValues||[]});
          console.log(JSON.stringify(rows,null,2));
          NODE
