name: Stage 03 current-main reconciliation

on:
  push:
    branches:
      - fix/stage03-agent-protocol-current-main-20260909

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/stage03-agent-protocol-current-main-20260909
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconcile Stage 03 browser regression with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/stage03-agent-protocol-deadlock-20260909
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const path='verify-browser-extra.mjs';
          const current=fs.readFileSync(path,'utf8');
          if(current.includes("extra:stage03-duplicate-response-recovery")){
            console.log('Stage 03 browser block already present.');
            process.exit(0);
          }
          const old=execFileSync('git',['show','FETCH_HEAD:verify-browser-extra.mjs'],{encoding:'utf8'});
          const startMarker="  console.log('extra:stage03-duplicate-response-recovery');";
          const endMarker="\n\n  console.log('extra:project-lifecycle-ui');";
          const start=old.indexOf(startMarker);
          const end=old.indexOf(endMarker,start);
          if(start<0||end<0)throw new Error('Could not extract the tested Stage 03 browser regression block.');
          const block=old.slice(start,end);
          const insertAt=current.indexOf(endMarker);
          if(insertAt<0)throw new Error('Current-main project lifecycle insertion point is missing.');
          if(!current.slice(0,insertAt).includes("extra:stage01-atomic-human-authority-self-staleness"))throw new Error('Current-main Stage 01 atomic browser regression is missing before the insertion point.');
          fs.writeFileSync(path,current.slice(0,insertAt)+'\n\n'+block+current.slice(insertAt),'utf8');
          NODE
          node --check verify-browser-extra.mjs
          git diff --check
          git diff -- verify-browser-extra.mjs
      - name: Re-run Stage 03 and full semantic barriers on current main
        shell: bash
        run: |
          set -euo pipefail
          node verify-stage03-agent-protocol.mjs
          node verify-ingestion.mjs
          node verify-v3-migration.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify.mjs
      - name: Re-run complete hosted Chromium operator barrier
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-human-stage-walkthrough.mjs
          node verify-mobile-stage-action.mjs
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Publish reconciled browser regression
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- verify-browser-extra.mjs; then
            echo 'No browser reconciliation commit required.'
            exit 0
          fi
          git config user.name 'stage03-reconcile-bot'
          git config user.email 'stage03-reconcile-bot@users.noreply.github.com'
          git add verify-browser-extra.mjs
          git commit -m 'Reconcile Stage 03 browser proof with current main'
          git push origin HEAD:fix/stage03-agent-protocol-current-main-20260909
