name: Temporary browser line diagnostic
on:
  push:
    branches: [repair/stage01-dispositions-current-main-20260903-r2]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Show failing browser fixture context
        run: |
          nl -ba verify-browser.mjs | sed -n '400,418p'
          grep -n -C 3 'contentSha256' verify-browser.mjs || true
