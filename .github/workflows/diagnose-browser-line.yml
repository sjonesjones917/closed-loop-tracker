name: Temporary browser line diagnostic
on:
  push:
    branches: [repair/stage01-dispositions-current-main-20260903-r2]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate legacy Stage 01 disposition producer
        run: |
          set -euo pipefail
          grep -RIn -C 4 --exclude='verify-*.mjs' --exclude='*.yml' 'incorporated into the job definition' . || true
          grep -RIn -C 4 --exclude='verify-*.mjs' --exclude='*.yml' 'retained as context' . || true
