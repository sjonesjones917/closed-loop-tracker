name: Temporary browser line diagnostic
on:
  push:
    branches: [repair/stage01-dispositions-current-main-20260903-r2]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate failing browser dereference
        run: |
          grep -RIn -C 3 'contentSha256' verify-*browser*.mjs verify-human-stage-walkthrough.mjs verify-mobile-stage-action.mjs || true
          for f in verify-human-stage-walkthrough.mjs verify-mobile-stage-action.mjs verify-browser.mjs verify-browser-extra.mjs; do
            echo "===== $f lines ====="
            wc -l "$f"
          done
