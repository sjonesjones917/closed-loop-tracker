name: Temporary Stage 01 compatibility repair
on:
  push:
    branches: [repair/stage01-dispositions-current-main-20260903-r2]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair migration and prompt contract, then prove live path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function replaceExact(path,from,to,expected=1){const s=fs.readFileSync(path,'utf8'),count=s.split(from).length-1;if(count!==expected)throw new Error(`${path}: expected ${expected} occurrence(s), found ${count}`);fs.writeFileSync(path,s.split(from).join(to));}
          replaceExact('app-core.js',"disposition:'retained as context'","disposition:'RETAINED_AS_CONTEXT'");
          replaceExact('prompt-engine.js','"disposition":"incorporated into the job definition|retained as context|unresolved human-only|later-resolvable|inapplicable with reason"','"disposition":"EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED"');
          replaceExact('verify-stage01-disposition-contract.mjs',
            "const promptText=p.buildPromptRecord(1,x,{operation:'COMPLETE'}).prompt;for(const value of exact)assert(promptText.includes(value));assert(/INACCESSIBLE_OR_BLOCKED means .*do not claim Stage 01 completion/i.test(promptText));console.log(JSON.stringify({stage01DispositionContract:'PASS'}));",
            "const promptText=p.buildPromptRecord(1,x,{operation:'COMPLETE'}).prompt;const currentUnion='EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED',retiredUnion='incorporated into the job definition|retained as context|unresolved human-only|later-resolvable|inapplicable with reason';for(const value of exact)assert(promptText.includes(value));assert(promptText.includes(currentUnion),'Stage 01 machine-output contract must advertise the exact closed disposition union.');assert(!promptText.includes(retiredUnion),'Stage 01 machine-output contract still advertises the retired disposition union.');assert(/INACCESSIBLE_OR_BLOCKED means .*do not claim Stage 01 completion/i.test(promptText));console.log(JSON.stringify({stage01DispositionContract:'PASS'}));");
          NODE
          node --check app-core.js
          node --check prompt-engine.js
          node verify-stage01-disposition-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-due-stage-timing.mjs
          node verify-v3-definition-of-done.mjs
          node verify.mjs
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for f in verify-human-stage-walkthrough.mjs verify-mobile-stage-action.mjs verify-browser.mjs verify-browser-extra.mjs; do
            echo "===== START $f ====="
            node "$f"
            echo "===== PASS $f ====="
          done
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          rm .github/workflows/diagnose-browser-line.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Preserve Stage 01 closure across legacy intake migration'
          git push origin HEAD:repair/stage01-dispositions-current-main-20260903-r2
