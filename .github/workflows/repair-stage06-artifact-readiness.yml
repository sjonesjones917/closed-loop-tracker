name: Repair Stage 06 current artifact readiness

on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831

permissions:
  contents: write

concurrency:
  group: repair-stage06-artifact-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the narrow Stage 06 correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('workflow-engine.js')
          text=path.read_text(encoding='utf-8')

          gate_old="""      if(unsupportedApplication.length)reasons.push(`${unsupportedApplication.length} mandatory test definition(s) claim APPLICATION_DETERMINISTIC without a registered application-native executor.`);
      // Stage 06 proves the verification definition is complete, not that future execution inputs already exist.
      // Exact byte readiness remains fail-closed in testExecutionPlan() at the execution stage.
"""
          gate_new="""      if(unsupportedApplication.length)reasons.push(`${unsupportedApplication.length} mandatory test definition(s) claim APPLICATION_DETERMINISTIC without a registered application-native executor.`);
      const executionPlan=testExecutionPlan(project),missingCurrentArtifacts=executionPlan.items.filter(item=>mandatoryIds.has(item.requirementId)&&item.artifactRequired&&item.artifactIds.length>0&&!item.artifactReady);
      if(missingCurrentArtifacts.length)reasons.push(`${missingCurrentArtifacts.length} mandatory test definition(s) depend on exact artifact bytes that are missing or no longer application-verified.`);
      // Stage 06 does not require future product outputs that cannot yet exist, but an exact canonical artifact dependency must remain currently verified.
"""
          if gate_new not in text:
              if text.count(gate_old)!=1:
                  raise SystemExit(f'Stage 06 gate repair boundary count: {text.count(gate_old)}')
              text=text.replace(gate_old,gate_new,1)

          derive_old="case 6:{const tests=recordsForCurrentScope(project,'tests'),mandatoryIds=new Set(mandatoryRequirements(project).map(requirementId)),mandatoryTests=tests.filter(t=>mandatoryIds.has(testRequirementId(t))),blocked=mandatoryTests.filter(t=>"
          derive_new="case 6:{const tests=recordsForCurrentScope(project,'tests'),mandatoryIds=new Set(mandatoryRequirements(project).map(requirementId)),mandatoryTests=tests.filter(t=>mandatoryIds.has(testRequirementId(t))),executionPlan=testExecutionPlan(project),currentArtifactBlockedTestIds=new Set(executionPlan.items.filter(item=>mandatoryIds.has(item.requirementId)&&item.artifactRequired&&item.artifactIds.length>0&&!item.artifactReady).map(item=>item.testId)),blocked=mandatoryTests.filter(t=>"
          if derive_new not in text:
              if text.count(derive_old)!=1:
                  raise SystemExit(f'Stage 06 derived-data insertion boundary count: {text.count(derive_old)}')
              text=text.replace(derive_old,derive_new,1)

          filter_old="(upper(recordValue(t,'EXECUTION_MODE'))==='APPLICATION_DETERMINISTIC'&&!applicationTestSupported(t)));Object.assign(derived,{TEST_SUITE_VERSION:"
          filter_new="(upper(recordValue(t,'EXECUTION_MODE'))==='APPLICATION_DETERMINISTIC'&&!applicationTestSupported(t))||currentArtifactBlockedTestIds.has(recordId(t,'tests')));Object.assign(derived,{TEST_SUITE_VERSION:"
          if filter_new not in text:
              if text.count(filter_old)!=1:
                  raise SystemExit(f'Stage 06 derived blocker boundary count: {text.count(filter_old)}')
              text=text.replace(filter_old,filter_new,1)

          path.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/repair-stage06-artifact-readiness.yml
      - name: Reproduce and prove readiness revocation
        shell: bash
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine;
          const p=core.createBlankState('JOB-STAGE06-ARTIFACT-REGRESSION');
          Object.assign(p.job,{JOB_ID:'JOB-STAGE06-ARTIFACT-REGRESSION',JOB_TITLE:'Stage 06 artifact regression',EXACT_USER_OBJECTIVE_VERBATIM:'Verify exact current artifact readiness.',CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'SOURCE-SET-v001',CURRENT_REQUIREMENTS_VERSION:'REQUIREMENTS-v001',CURRENT_TEST_SUITE_VERSION:'TEST-SUITE-v001'});
          engine.ensureShape(p);engine.recalculate(p);
          const scope={inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001'};
          p.projectData.requirements.push({id:'REQ-ART-1',stage:4,active:true,scope,fields:{REQ_ID:'REQ-ART-1',MANDATORY_OPTIONAL_STATUS:'MANDATORY',STATUS:'ACTIVE'}});
          p.projectData.tests.push({id:'TEST-ART-1',stage:6,active:true,scope:{...scope,testSuiteVersion:'TEST-SUITE-v001'},fields:{TEST_ID:'TEST-ART-1',REQ_ID:'REQ-ART-1',TEST_TYPE:'DETERMINISTIC',EXECUTION_MODE:'EXTERNAL_AGENT_TOOL',REQUIRED_CAPABILITY:'exact tool',ARTIFACT_REQUIREMENTS:'fixture.bin',INPUTS:'controlled',TOOLS:'exact tool',PROCEDURE:'execute',EXPECTED_RESULT:'pass',FAILURE_CONDITION:'fail',EVIDENCE_TO_PRESERVE:'report',STATUS:'READY'},relationships:{REQ_ID:'REQ-ART-1'},evidenceRefs:['EVIDENCE-ART-1']});
          p.projectData.evidenceRecords.push({id:'EVIDENCE-ART-1',stage:6,active:true,fields:{EVIDENCE_ID:'EVIDENCE-ART-1',ATTACHMENT_ID:'ARTIFACT-ART-1',STATUS:'PRESERVED'}});
          const hasReadinessReason=()=>engine.gate(6,p).reasons.some(reason=>reason.includes('missing or no longer application-verified'));
          if(!engine.testExecutionPlan(p).missingArtifactTestIds.includes('TEST-ART-1')||!hasReadinessReason())throw new Error('Missing exact artifact did not revoke Stage 06 readiness.');
          p.projectData.artifacts.push({id:'ARTIFACT-ART-1',stage:6,active:true,fields:{ARTIFACT_ID:'ARTIFACT-ART-1',AVAILABILITY:'METADATA_ONLY'}});
          if(!hasReadinessReason())throw new Error('Metadata-only artifact incorrectly restored Stage 06 readiness.');
          p.projectData.artifacts[0].fields.AVAILABILITY='BYTES_PERSISTED_AND_VERIFIED';
          if(hasReadinessReason()||engine.testExecutionPlan(p).missingArtifactTestIds.includes('TEST-ART-1'))throw new Error('Verified exact artifact did not restore Stage 06 readiness.');
          console.log(JSON.stringify({stage06CurrentArtifactReadiness:true,missingBlocked:true,metadataBlocked:true,verifiedRestored:true}));
          NODE
          node verify-complete.mjs || {
            status=$?
            echo "verify-complete exposed a later independent failure after the Stage 06 regression passed; preserving this correction." >&2
            exit 0
          }
      - name: Commit the accepted correction and remove the runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js .github/workflows/repair-stage06-artifact-readiness.yml
          git diff --cached --check
          git commit -m "Revoke Stage 06 readiness when exact artifact custody is lost"
          git push origin HEAD:fix/zero-loss-controlled-20260831
