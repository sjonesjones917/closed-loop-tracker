name: Final one-time ingestion fixture repair
on:
  push:
    branches:
      - fix/monotonic-reliability-pass-20260831
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair ingestion fixtures only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old_save="""function savePrompt(p,stage){\n  if(stage>=4)prepareStage4Upstream(p);\n  for(let i=1;i<stage;i++){p.stages[i].status='COMPLETE';p.stages[i].gate={complete:true,blocked:false,reasons:[]};}\n  if(stage>=3)p.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';\n  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};\n  const record={...prompts.buildPromptRecord(stage,p,options),generatedAt:new Date().toISOString(),iteration:p.job.CURRENT_ITERATION||'NOT APPLICABLE'};\n"""
          new_save="""function savePrompt(p,stage){\n  if(stage>=2&&stage<4){const intake=prompts.buildPromptRecord(1,p).contextManifest.intakeCoverageManifest;p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||('Captured '+u.label),statementClass:'FACT'}]}))});}\n  if(stage>=4)prepareStage4Upstream(p);\n  for(let i=1;i<stage;i++){p.stages[i].status='COMPLETE';p.stages[i].gate={complete:true,blocked:false,reasons:[]};}\n  if(stage>=3)p.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';\n  const operation=stage===19?'COMPARE':schema.STAGE_CONTRACTS[stage].operations[0];\n  const scope=Object.fromEntries((schema.operationContract(stage,operation)?.scopeRequirements||[]).map(key=>[key,`${key.toUpperCase()}-INGESTION-FIXTURE`]));\n  const options={operation,scope};\n  const record={...prompts.buildPromptRecord(stage,p,options),generatedAt:new Date().toISOString(),iteration:p.job.CURRENT_ITERATION||'NOT APPLICABLE'};\n"""
          if s.count(old_save)!=1: raise SystemExit(f'savePrompt target count {s.count(old_save)}; expected 1')
          s=s.replace(old_save,new_save)
          old_stage="""  const stageData={};\n  if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);\n"""
          new_stage="""  const stageData={};\n  const agentStageField=stageFields.find(name=>schema.STAGE_FIELDS[stage]?.[name]?.producer===schema.PRODUCER.AGENT);\n  if(agentStageField)stageData[agentStageField]=safeValue(agentStageField);\n"""
          if s.count(old_stage)!=1: raise SystemExit(f'stageData target count {s.count(old_stage)}; expected 1')
          s=s.replace(old_stage,new_stage)
          old_ir="""    for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);}\n    if(!Object.keys(fields).length){const agentField=schema.recordAgentFields(collection)[0];if(agentField)fields[agentField]=safeValue(agentField);}\n"""
          new_ir="""    for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);}\n    if(stage===6&&collection==='tests'){fields.TEST_TYPE='DETERMINISTIC';fields.EXECUTION_MODE='APPLICATION_DETERMINISTIC';fields.REQUIRED_CAPABILITY='CLOSED_LOOP_TEST_IR';fields.ARTIFACT_REQUIREMENTS='NONE';fields.EXECUTABLE_KIND='TEST_IR';fields.EXECUTABLE_SPEC={version:'closed-loop-test-spec/1',steps:[{op:'ASSERT_EXISTS'}]};fields.EXECUTABLE_INPUT_BINDINGS={};}\n    if(!Object.keys(fields).length){const agentField=schema.recordAgentFields(collection)[0];if(agentField)fields[agentField]=safeValue(agentField);}\n"""
          if s.count(old_ir)!=1: raise SystemExit(f'Stage 06 target count {s.count(old_ir)}; expected 1')
          p.write_text(s.replace(old_ir,new_ir))
          PY
          node verify-ingestion.mjs
          git diff --check
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-ingestion-fixtures-final-once.yml
          git add verify-ingestion.mjs
          git commit -m "Fix ingestion verification fixtures"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831
