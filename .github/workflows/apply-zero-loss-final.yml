name: Apply remaining zero-loss semantic fixes
on:
  push:
    branches: [reliability/semantic-adjudication-zero-loss]
    paths: [.github/workflows/apply-zero-loss-final.yml]
permissions: {contents: write}
concurrency: {group: zero-loss-final-apply-v3, cancel-in-progress: false}

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply narrow responsible-layer patch
        run: |
          python3 .zero-loss-final-fix.py
          python3 .zero-loss-runtime-token.py
      - name: Syntax
        run: |
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node --check verify-semantic-invariant.mjs
      - name: Hash proof
        run: timeout 60s node verify-hash.mjs
      - name: Architecture proof
        run: timeout 60s node verify.mjs
      - name: Semantic false-acceptance proof
        run: timeout 60s node verify-semantic-invariant.mjs
      - name: Ingestion proof
        run: timeout 90s node verify-ingestion.mjs
      - name: Gate and routing proof
        run: timeout 90s node verify-complete.mjs
      - name: Prompt semantics proof
        run: timeout 90s node verify-prompt-semantics.mjs
      - name: Full-cycle proof
        run: timeout 120s node verify-full-cycle.mjs
      - name: Local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout 120s node verify-browser.mjs
          timeout 120s node verify-browser-extra.mjs
      - name: Commit only proven application and test changes
        run: |
          rm -f .zero-loss-final-fix.py .zero-loss-runtime-token.py .github/workflows/apply-zero-loss-final.yml .github/workflows/bootstrap-semantic.yml
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          git add workflow-engine.js verify-complete.mjs verify-semantic-invariant.mjs index.html .github/workflows/bootstrap-semantic.yml .zero-loss-final-fix.py .zero-loss-runtime-token.py .github/workflows/apply-zero-loss-final.yml
          test -n "$(git status --porcelain)"
          git commit -m 'Close remaining zero-loss semantic gaps'
          git push origin HEAD:reliability/semantic-adjudication-zero-loss
