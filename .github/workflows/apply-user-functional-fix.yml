name: Apply one-time project intake repair
on:
  push:
    branches: [fix/one-time-intake-stage4-20260830]
    paths: [.github/workflows/apply-user-functional-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-time-intake-stage4-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply functional repair exactly once
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('workflow-engine.js'); s=p.read_text()
          anchor="  for(const answer of safe(project.projectData.humanInputAnswers).filter(item=>!item.invalidatedBy)){const answerId=String(answer.answerId||answer.requestId||'UNKNOWN');enumerateInputLeaves(answer.answer,`projectData.humanInputAnswers.${answerId}.answer`,'HUMAN_ANSWER',`Human answer ${answerId}`,units,{inputVersion,extra:{answerId}});}\n"
          insert=anchor+"  const stageOneSelected=new Set(safe(project.stages?.[1]?.authorizedFiles).map(item=>String(item?.artifactId||item?.id||'')).filter(Boolean));\n  const stageOneArtifacts=records(project,'artifacts').filter(record=>Number(record?.stage||recordValue(record,'STAGE')||record?.lineage?.stage||0)===1||stageOneSelected.has(recordId(record,'artifacts')));\n  for(const artifact of stageOneArtifacts){const artifactId=recordId(artifact,'artifacts'),filename=String(recordValue(artifact,'FILENAME')||artifactId),sha256=String(recordValue(artifact,'SHA256')||''),byteSize=Number(recordValue(artifact,'BYTE_SIZE')||0),availability=String(recordValue(artifact,'AVAILABILITY')||'UNKNOWN'),sourceLocation=`artifact.${artifactId}`,rawValueText=JSON.stringify({artifactId,filename,sha256,byteSize,availability}),rawValueSha256=hash.sha256Value(rawValueText),unitId=`INPUT-UNIT-${hash.sha256Value({inputVersion,kind:'SUPPLIED_MATERIAL',sourceLocation,rawValueSha256}).slice(0,20).toUpperCase()}`;units.push({unitId,kind:'SUPPLIED_MATERIAL',sourceLocation,label:`Supplied material ${filename}`,rawValueSha256,rawValueText,artifactId,filename,artifactSha256:sha256,byteSize,availability});}\n"
          if 'const stageOneSelected=new Set(' not in s:
              if anchor not in s: raise SystemExit('Stage 01 intake anchor missing')
              s=s.replace(anchor,insert,1)
          handoff_anchor="  for(const item of items){for(const a of item.handoff.send)addArtifact(artifactsById.get(a.artifactId));for(const x of item.handoff.withhold)withhold.set(x.artifactIdOrCategory,x);for(const x of item.handoff.expectBack)expectBack.set(x.kind+'|'+x.filenameOrPattern,x);}\n"
          if 'if(stage===1){const selectedIds=new Set(' not in s:
              if handoff_anchor not in s: raise SystemExit('Stage 01 handoff anchor missing')
              s=s.replace(handoff_anchor,handoff_anchor+"  if(stage===1){const selectedIds=new Set(safe(project.stages?.[1]?.authorizedFiles).map(item=>String(item?.artifactId||item?.id||'')).filter(Boolean));for(const id of selectedIds)addArtifact(artifactsById.get(id));}\n",1)
          s=s.replace("const externalWork=[11,12,17,19,21,23,24,25].includes(stage);","const externalWork=[1,11,12,17,19,21,23,24,25].includes(stage);",1)
          old_action="  if(stage===1)return actionEnvelope(project,stage,{actionType:'CONTINUE_AGENT_CONVERSATION',heading:'Continue Stage 01 intake with the agent',explanation:'Talk with the agent until every human-only question that must be asked now is answered or explicitly deferred. Paste final JSON only after the conversation is complete.',primaryButton:'Continue conversation'});\n  return actionEnvelope(project,stage,{actionType:'PASTE_FINAL_JSON',heading:'Return the final structured response',explanation:'Use the current Stage '+String(stage).padStart(2,'0')+' instruction. Continue the external work or conversation until the executor is ready to return one final strict JSON response and any required files.',primaryButton:'Paste final JSON'});"
          new_action="  if(stage===1){const handoff=executionHandoff(project,{stage:1,operation:'COMPLETE'});return actionEnvelope(project,stage,{actionType:'CONTINUE_AGENT_CONVERSATION',heading:'Complete the one-time Stage 01 intake',explanation:'Send the current Stage 01 instruction and every listed supplied project file to the same external conversation once. The agent must exhaustively capture the project intent and all human-authority content from those materials, ask only genuinely human-only questions, and return final JSON only when intake is complete. Later stages reuse the accepted Stage 01 capture and must not require these original project files again.',primaryButton:'Continue conversation',filesToSend:handoff.send,filesToWithhold:handoff.withhold,expectedReturnFiles:handoff.expectBack});}\n  if(stage===4)return actionEnvelope(project,stage,{actionType:'PASTE_FINAL_JSON',heading:'Compile the complete requirement specification',explanation:'Use the current Stage 04 instruction. It already contains the exhausted Stage 01 human-authority capture, the complete Stage 03 research, and the application obligation manifest. Do not reattach or restate the original project-intent file. Return one final strict JSON response only after every obligation in the manifest has been accounted for.',primaryButton:'Paste final JSON'});\n  return actionEnvelope(project,stage,{actionType:'PASTE_FINAL_JSON',heading:'Return the final structured response',explanation:'Use the current Stage '+String(stage).padStart(2,'0')+' instruction. Continue the external work or conversation until the executor is ready to return one final strict JSON response and any required files.',primaryButton:'Paste final JSON'});"
          if old_action in s: s=s.replace(old_action,new_action,1)
          elif "heading:'Complete the one-time Stage 01 intake'" not in s: raise SystemExit('Stage action anchor missing')
          old_payload="const payload={...Object.fromEntries(schema.HUMAN_INTAKE_FIELDS.map(name=>[name,project.job[name]??''])),clarifications:clone(project.projectData.userEntered?.clarifications||[])};"
          new_payload="const payload={...Object.fromEntries(schema.HUMAN_INTAKE_FIELDS.map(name=>[name,project.job[name]??''])),clarifications:clone(project.projectData.userEntered?.clarifications||[]),suppliedArtifactFiles:clone(project.projectData.userEntered?.suppliedArtifactFiles||{}),suppliedArtifactText:clone(project.projectData.userEntered?.suppliedArtifactText||{})};"
          if old_payload in s: s=s.replace(old_payload,new_payload,1)
          elif 'suppliedArtifactText:clone(' not in s: raise SystemExit('Human input payload anchor missing')
          p.write_text(s)

          p=Path('prompt-engine.js'); s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/33';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/34';",1)
          old="INPUT_SET_CONTENTS must preserve the complete durable meaning needed by later stages so the original intent or project material is not repeatedly requested."
          new=old+" Every supplied project file listed under FILES YOU MUST RECEIVE is one-time Stage 01 input: inspect the actual received bytes, extract every materially relevant human-authority statement from the file into the corresponding SUPPLIED_MATERIAL intake unit, and preserve enough faithful detail that later stages can operate without receiving that original file again. Do not treat a filename or file hash as a substitute for inspecting the transferred file bytes."
          if new not in s:
              if old not in s: raise SystemExit('Stage 01 procedure anchor missing')
              s=s.replace(old,new,1)
          old="Every unitId in APPLICATION INTAKE MANIFEST must appear exactly once, bound to its exact sourceRawValueSha256. The application rejects omitted, duplicated, unknown, stale, or hash-mismatched accounting. Do not create application IDs.\\n\\n"
          new="Every unitId in APPLICATION INTAKE MANIFEST must appear exactly once, bound to its exact sourceRawValueSha256. The application rejects omitted, duplicated, unknown, stale, or hash-mismatched accounting. Do not create application IDs. For every unit whose kind is SUPPLIED_MATERIAL, use the exact file identified by artifactId/filename/SHA-256 in that manifest and the FILES YOU MUST RECEIVE handoff. extractedStatements must enumerate all materially relevant human-authority content found in that file; do not return only a material-reference statement when the file contains substantive project facts, requirements, constraints, decisions, prohibitions, requested outputs, acceptance conditions, or unresolved human-only issues.\\n\\n"
          if new not in s:
              if old not in s: raise SystemExit('Stage 01 accounting anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('app-core.js'); s=p.read_text()
          old_register="async function registerStageFiles(fileList){const stage=current.activeStage,created=[];try{const product=stage===21?currentStageProduct():null;if(stage===21&&!product)throw new Error('Reserve the current Stage 21 product execution before selecting finished-product files.');const productId=product?engine.recordId(product,'products'):null,paths=fileList.map(logicalFilePath);if(new Set(paths).size!==paths.length)throw new Error('Selected artifact package contains duplicate logical paths. Use the folder picker for structured packages so directory identity is preserved.');for(const file of fileList)created.push(await storeArtifactFile(file,stage,productId?{productId}:{}));const next=clone(current);for(const item of created){const stored=item.stored;engine.registerArtifactBytes(next,{stage,artifactId:stored.artifactId,filename:stored.filename,mediaType:stored.mediaType,byteSize:stored.byteSize,sha256:stored.sha256,lineage:stored.lineage});next.stages[stage].authorizedFiles.push(item.view);}await persistReplacement(next);announce('artifact bytes saved and verified');render();}catch(error){for(const item of created)try{await projectStore.deleteArtifact?.(item.stored.artifactId,current.job.JOB_ID);}catch{}announce('storage failed');alert(`Artifact storage failed without authorizing metadata-only state: ${error.message||error}`);}}"
          new_register="async function registerStageFiles(fileList){const stage=current.activeStage,created=[];try{const product=stage===21?currentStageProduct():null;if(stage===21&&!product)throw new Error('Reserve the current Stage 21 product execution before selecting finished-product files.');const productId=product?engine.recordId(product,'products'):null,paths=fileList.map(logicalFilePath);if(new Set(paths).size!==paths.length)throw new Error('Selected artifact package contains duplicate logical paths. Use the folder picker for structured packages so directory identity is preserved.');for(const file of fileList)created.push(await storeArtifactFile(file,stage,productId?{productId}:{}));const next=clone(current);for(const item of created){const stored=item.stored;engine.registerArtifactBytes(next,{stage,artifactId:stored.artifactId,filename:stored.filename,mediaType:stored.mediaType,byteSize:stored.byteSize,sha256:stored.sha256,lineage:stored.lineage});next.stages[stage].authorizedFiles.push(item.view);}if(stage===1){const suppliedArtifactFiles={...next.projectData.userEntered?.suppliedArtifactFiles},suppliedArtifactText={...next.projectData.userEntered?.suppliedArtifactText};for(let index=0;index<created.length;index++){const stored=created[index].stored,file=fileList[index],metadata={artifactId:stored.artifactId,filename:stored.filename,sha256:stored.sha256,byteSize:stored.byteSize,mediaType:stored.mediaType};suppliedArtifactFiles[stored.artifactId]=metadata;const textLike=/^text\\//i.test(file.type)||/^(?:application\\/(?:json|xml|javascript|x-javascript|yaml|x-yaml))$/i.test(file.type)||/\\.(?:txt|md|markdown|csv|tsv|json|jsonl|xml|yaml|yml|html|htm|css|js|mjs|cjs|ts|tsx|jsx|py|java|c|cc|cpp|h|hpp|rs|go|sh|ps1|sql|ini|cfg|conf|log)$/i.test(stored.filename);if(textLike)suppliedArtifactText[stored.artifactId]={...metadata,text:await file.text()};}next.projectData.userEntered={...next.projectData.userEntered,suppliedArtifactFiles,suppliedArtifactText};engine.recordHumanInputVersion(next,['STAGE_01_SUPPLIED_ARTIFACTS'],'HUMAN_OPERATOR');}await persistReplacement(next);announce('artifact bytes saved and verified');render();}catch(error){for(const item of created)try{await projectStore.deleteArtifact?.(item.stored.artifactId,current.job.JOB_ID);}catch{}announce('storage failed');alert(`Artifact storage failed without authorizing metadata-only state: ${error.message||error}`);}}"
          if old_register in s: s=s.replace(old_register,new_register,1)
          elif 'STAGE_01_SUPPLIED_ARTIFACTS' not in s: raise SystemExit('Stage file registration anchor missing')
          p.write_text(s)
          PY
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          git diff --check
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/apply-user-functional-fix.yml
          git add workflow-engine.js prompt-engine.js app-core.js
          git commit -m 'Capture project input once and reuse it through Stage 04'
          git push origin HEAD:fix/one-time-intake-stage4-20260830
