name: Final requirement verification
on:
  push:
    branches: [verify/final-requirement-ledger]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/final-requirement-ledger
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Repair test-only interpolation typo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-browser-extra.mjs');s=p.read_text();bad="===${JSON.stringify(roundTrip.job.JOB_ID)}";good="===roundTrip.job.JOB_ID"
          if bad in s:p.write_text(s.replace(bad,good,1))
          PY
      - name: Run complete source and deterministic regressions
        run: |
          node build-test-project.mjs
          node --check app.js
          node --check app-core.js
          node --check workbook.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-live.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Run complete browser acceptance regressions locally
        shell: bash
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
      - name: Commit verified test correction
        shell: bash
        run: |
          if git diff --quiet -- verify-browser-extra.mjs; then exit 0; fi
          git config user.name 'closed-loop-repair-bot'
          git config user.email 'closed-loop-repair-bot@users.noreply.github.com'
          git add verify-browser-extra.mjs
          git commit -m 'Fix final browser regression syntax'
          git push origin HEAD:verify/final-requirement-ledger
