name: Semantic finalization proof
on:
  push:
    branches: [practical-100/final-deliverable-semantics]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal semantic corrections
        run: |
          python .semantic-finalize.py
          python .semantic-title-fix.py
      - name: Verify source and complete lifecycle
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node --check verify-complete.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit only proved permanent changes
        if: success()
        run: |
          rm .semantic-finalize.py .semantic-title-fix.py .github/workflows/semantic-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix deliverable and execution semantics"
          git push
