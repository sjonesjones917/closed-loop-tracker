name: Audit final authority and scope boundaries
on:
  push:
    branches: [practical-100/final-authority-storage-closure]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect response-contract examples
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const core=globalThis.closedLoopCore,schema=globalThis.closedLoopWorkflowSchema,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine;
          const p=core.createBlankState('JOB-AUDIT-CONTRACT');engine.ensureShape(p);engine.recalculate(p);
          const surfaces=[];
          for(let stage=1;stage<=30;stage++)for(const operation of schema.STAGE_CONTRACTS[stage].operations){const pr=prompts.buildPromptRecord(stage,p,{operation});const example=JSON.parse(prompts.responseContract(stage,operation,pr.instructionId,pr.bodySha256,pr.contractSha256,pr.contextSignature,pr.scope));const records=Object.entries(example.records).flatMap(([collection,list])=>list.map(record=>({collection,tempKey:record.tempKey,targetId:record.targetId,policy:schema.RECORD_SCHEMAS[collection].commitPolicy})));surfaces.push({stage,operation,agentStageFields:schema.STAGE_CONTRACTS[stage].allowedStageData,agentWritableCollections:schema.operationContract(stage,operation).agentWritableCollections,exampleHasData:Object.keys(example.stageData).length>0||Object.values(example.records).some(list=>list.length),records});}
          console.log(JSON.stringify({applicationOnly:surfaces.filter(x=>!x.agentStageFields.length&&!x.agentWritableCollections.length),invalidIdentityExamples:surfaces.flatMap(x=>x.records.map(r=>({...x,...r}))).filter(x=>(Boolean(x.tempKey)?1:0)+(Boolean(x.targetId)?1:0)!==1),all:surfaces},null,2));
          NODE
