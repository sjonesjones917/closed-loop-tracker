name: Reliability adjudication schema diagnosis
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
permissions: {contents: read}
concurrency: {group: 'reliability-adjudication-diagnose-${{ github.ref }}', cancel-in-progress: false}

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[diagnose-adjudication]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact coordinated patch in runner only
        run: |
          cat .tmp/adjudication-patch-*.b64 | base64 -d | gzip -d > /tmp/adjudication.patch
          echo 'ea95f16b98b3b51e9436f983ca59046556d17cdddc47b9cad5a861882d61089c  /tmp/adjudication.patch' | sha256sum -c -
          patch -p0 < /tmp/adjudication.patch
      - name: Enumerate every ownership partition mismatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          text=Path('workflow-schema.js').read_text()
          marker='const RECORD_OWNERSHIP=Object.freeze('
          s=text.index(marker)+len(marker)
          depth=0; end=None; in_str=False; esc=False
          for i,ch in enumerate(text[s:],s):
              if in_str:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': in_str=False
                  continue
              if ch=='"': in_str=True; continue
              if ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          ownership=json.loads(text[s:end])
          mismatches=[]
          pos=0
          while True:
              idx=text.find('recordSchema({',pos)
              if idx<0: break
              nxt=text.find('recordSchema({',idx+1)
              block=text[idx:nxt if nxt>=0 else len(text)]
              km=re.search(r"key\s*:\s*'([^']+)'",block)
              tm=re.search(r"title\s*:\s*'([^']+)'",block)
              fm=re.search(r"fields\s*:\s*\[([^\]]*)\]",block,re.S)
              if km and fm:
                  key=km.group(1); title=tm.group(1) if tm else key
                  fields=re.findall(r"'([^']+)'",fm.group(1))
                  own=ownership.get(key,{})
                  union=[]
                  for bucket in ('human','humanDecision','agent','application'): union += own.get(bucket,[])
                  missing=[x for x in union if x not in fields]
                  unowned=[x for x in fields if x not in union]
                  dup=[x for x in set(union) if union.count(x)>1]
                  if missing or unowned or dup or len(union)!=len(set(union)):
                      mismatches.append({'key':key,'title':title,'missingFromFields':missing,'unownedFields':unowned,'ownershipDuplicates':dup,'fieldCount':len(fields),'ownershipCount':len(union)})
              if nxt<0: break
              pos=nxt
          print('OWNERSHIP_MISMATCH_COUNT',len(mismatches))
          print(json.dumps(mismatches,indent=2,sort_keys=True))
          if mismatches: raise SystemExit(2)
          PY
