name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: |
          node --check workbook.js
          node --check hash.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check build-test-project.mjs
          node --check verify-v3-migration.mjs
          node --check verify-stage01-stage03-stage04-closure.mjs
          node --check verify-closed-accounting.mjs
      - name: Schema ownership and architecture
        run: |
          node build-test-project.mjs
          node verify.mjs
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(m=>m[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} runtime scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong runtime order at ${file}`);const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} lacks build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(/document\.write|MutationObserver/.test(html+fs.readFileSync('app-core.js','utf8')))throw new Error('Prohibited runtime patching remains');
          NODE
      - name: Migration
        run: node verify-v3-migration.mjs
      - name: Test IR validation security and deterministic runtime
        run: node verify-test-runtime.mjs
      - name: Canonical hashing
        run: node verify-hash.mjs
      - name: Raw-first ingestion and negative cases
        run: node verify-ingestion.mjs
      - name: Workflow gates and all 30 stage contracts
        run: node verify-complete.mjs
      - name: Prompt closure accounting isolation and leakage
        run: |
          node verify-stage01-stage03-stage04-closure.mjs
          node verify-closed-accounting.mjs
          node verify-prompt-semantics.mjs
      - name: Full lifecycle and false-acceptance proof
        run: |
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-project-lifecycle.mjs
          node verify-definition-of-done.mjs
      - name: Local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Deployed Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/live-${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build final machine acceptance artifact
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify-test-runtime.mjs > /tmp/runtime.out
          node verify-stage01-stage03-stage04-closure.mjs > /tmp/closure.out
          node verify-closed-accounting.mjs > /tmp/accounting.out
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const ingestion=fs.readFileSync('/tmp/ingestion.out','utf8');
          const negative=[...ingestion.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)].at(-1)?.[1];
          if(!negative)throw new Error('Negative-case count unavailable');
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            ...definition,
            stage01IntakeAccounting:1,
            stage04ObligationAccounting:1,
            nativeExecutionCoverage:1,
            stagesCompleted:30,
            negativeCasesPassed:Number(negative),
            deployedByteIdentity:true,
            browserWidths:[320,393,'desktop'],
            liveVerification:true,
            fullProductionMaturity:false,
            productionMaturityReason:'Actual Android Chrome runtime acceptance and required real-project maturity fixtures are not established by desktop CI.'
          };
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
      - name: Create release tag only after deployed proof
        run: |
          git config user.name closed-loop-release
          git config user.email actions@users.noreply.github.com
          TAG="closed-loop-${GITHUB_SHA::12}"
          git rev-parse "$TAG" >/dev/null 2>&1 || { git tag "$TAG" "$GITHUB_SHA" && git push origin "$TAG"; }
