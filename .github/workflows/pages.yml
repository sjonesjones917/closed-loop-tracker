name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify retained project and single application architecture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check test-fixtures.mjs
          node --check verify-hash.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-live.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
          node --check verify-semantic-invariant.mjs
          node --check verify-definition-of-done.mjs
          node --check verify-project-lifecycle.mjs
          node --check verify-test-runtime.mjs
      - name: Verify generic deterministic Test IR runtime
        run: node verify-test-runtime.mjs
      - name: Verify canonical serialization and SHA-256
        run: node verify-hash.mjs
      - name: Verify canonical workflow, persistence, ownership, and non-circularity
        run: node verify.mjs
      - name: Exercise all 30 stage prompt-response ingestion contracts and negative cases
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Prove one continuous 30-stage lifecycle
        run: node verify-full-cycle.mjs
      - name: Reject semantic prompt contradictions and operation leakage
        run: node verify-prompt-semantics.mjs
      - name: Prove semantic false-acceptance invariant
        run: node verify-semantic-invariant.mjs
      - name: Derive definition-of-done coverage metrics
        run: node verify-definition-of-done.mjs
      - name: Prove compact rigorous project lifecycle controls
        run: node verify-project-lifecycle.mjs
      - name: Enforce one application shell and responsible layers
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f experience.js
          test ! -f usability.js
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} lacks build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          NODE
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "GEN-042|field status report|maintenance[- ]handoff|human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
      - name: Exercise local Chromium workflow, persistence, ingestion, and responsive layout
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify-test-runtime.mjs && node verify-hash.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs && node verify-prompt-semantics.mjs && node verify-semantic-invariant.mjs && node verify-definition-of-done.mjs && node verify-project-lifecycle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Exercise deployed browser workflow, persistence, ingestion, and responsive layout
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  materialize-stage4-intent-reuse:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Install one-time Stage 04 materializer')
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal Stage 01 and Stage 04 repair
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          let prompt=fs.readFileSync('prompt-engine.js','utf8');
          const oldVersion="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';";
          const newVersion="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';";
          if(!prompt.includes(oldVersion))throw new Error('Prompt engine version anchor not found.');
          prompt=prompt.replace(oldVersion,newVersion);
          const oldGuidance='INPUT_SET_CONTENTS should identify the top-level supplied human inputs and attached materials available to this job. Do not turn it into a Stage 02 archive/file inventory. UNKNOWN_INFORMATION should carry nonblocking later-needed facts. ASSUMPTIONS must contain only assumptions, not unknowns or application-derived identity facts.';
          const newGuidance='INPUT_SET_CONTENTS must preserve a concise semantic capture of every material human-authority statement that Stage 01 actually read from the current human input and any supplied material bytes available in the executing context, together with the top-level material references. It must be sufficient for later stages to reuse that captured meaning without asking the human to attach, resend, retype, or summarize the same intent material. Do not copy an entire file or turn it into a Stage 02 archive/file inventory. If bytes were unavailable, preserve only the material reference and do not infer contents. UNKNOWN_INFORMATION should carry nonblocking later-needed facts. ASSUMPTIONS must contain only assumptions, not unknowns or application-derived identity facts.';
          if(!prompt.includes(oldGuidance))throw new Error('Stage 01 INPUT_SET_CONTENTS anchor not found.');
          prompt=prompt.replace(oldGuidance,newGuidance);
          fs.writeFileSync('prompt-engine.js',prompt);
          fs.writeFileSync('verify-stage4-intent-reuse.mjs',`import fs from 'node:fs';\nimport vm from 'node:vm';\nimport assert from 'node:assert/strict';\nglobalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};\nglobalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);\nfor(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});\nconst core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine;\nconst p=core.createBlankState('JOB-STAGE04-INTENT-REUSE');\nObject.assign(p.job,{EXACT_USER_OBJECTIVE_VERBATIM:'Build the requested product from the supplied intent.',SUPPLIED_MATERIALS_INVENTORY:JSON.stringify([{type:'FILE',exactNameOrReference:'intent.pdf'}]),CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'SOURCE-SET-v001',EXACT_DELIVERABLE_REQUESTED:'Requested product',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:'Captured human authority: preserve the supplied safety constraint and acceptance condition.'});\nengine.ensureShape(p);engine.recalculate(p);\nconst stage1=prompts.buildPromptRecord(1,p).prompt;\nassert.match(stage1,/INPUT_SET_CONTENTS must preserve a concise semantic capture of every material human-authority statement/i);\nconst stage4=prompts.buildPromptRecord(4,p).prompt;\nassert.match(stage4,/ACCEPTED STAGE 01 JOB DEFINITION — CANONICAL INPUT, DO NOT ASK THE HUMAN TO RESEND IT/i);\nassert.match(stage4,/Captured human authority: preserve the supplied safety constraint and acceptance condition\./);\nassert.match(stage4,/Do not ask the human to attach, resend, retype, or summarize the original intent file/i);\nconst handoff=engine.executionHandoff(p,{stage:4,operation:'COMPLETE'});\nassert.equal(handoff.send.length,0);\nassert.equal(handoff.conversationMaterials.length,0);\nconsole.log(JSON.stringify({stage01SemanticCaptureRequired:true,stage04ReusesCapturedIntent:true,stage04IntentFileReattachmentRequired:false,promptEngineVersion:prompts.version},null,2));\n`);
          let workflow=fs.readFileSync('.github/workflows/pages.yml','utf8');
          workflow=workflow.replace(/\n  materialize-stage4-intent-reuse:[\s\S]*?(?=\n  publish-status:)/,'');
          workflow=workflow.replace('          node --check verify-test-runtime.mjs\n','          node --check verify-test-runtime.mjs\n          node --check verify-stage4-intent-reuse.mjs\n');
          workflow=workflow.replace('          node verify-complete.mjs\n','          node verify-complete.mjs\n          node verify-stage4-intent-reuse.mjs\n');
          workflow=workflow.replace('node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs','node verify-ingestion.mjs && node verify-complete.mjs && node verify-stage4-intent-reuse.mjs && node verify-full-cycle.mjs');
          fs.writeFileSync('.github/workflows/pages.yml',workflow);
          NODE
          node --check prompt-engine.js
          node verify-stage4-intent-reuse.mjs
          node verify-complete.mjs
      - name: Open exact minimal repair pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH=fix/stage4-intent-reuse-actual
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git checkout -b "$BRANCH"
          git add prompt-engine.js verify-stage4-intent-reuse.mjs .github/workflows/pages.yml
          git diff --cached --check
          git commit -m "Fix Stage 04 intent reuse without repeated attachment"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Fix Stage 04 intent reuse without repeated attachment" --body "Minimal permanent repair only: Stage 01 now stores the semantic human-authority content it actually reads in existing INPUT_SET_CONTENTS, saved prompts are invalidated by the prompt-engine version bump, Stage 04 reuses the accepted Stage 01 capture, and a focused regression proves the original intent file is not requested again. The one-time materializer removes itself from pages.yml in this PR."

  publish-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build acceptance report from executed proofs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-test-runtime.mjs > /tmp/verify-test-runtime.out
          node verify-ingestion.mjs > /tmp/verify-ingestion.out
          node verify.mjs > /tmp/verify-source.out
          node verify-complete.mjs > /tmp/verify-complete.out
          node verify-semantic-invariant.mjs > /tmp/verify-semantic-invariant.out
          node verify-definition-of-done.mjs > /tmp/verify-definition-of-done.out
          node verify-project-lifecycle.mjs > /tmp/verify-project-lifecycle.out
          grep -q 'verify-test-runtime: PASS' /tmp/verify-test-runtime.out
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-report-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          success=false
          for attempt in 1 2 3; do
            if node verify-browser-extra.mjs > /tmp/verify-browser-extra.out 2>&1; then success=true; break; fi
            cat /tmp/verify-browser-extra.out
            grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' /tmp/verify-browser-extra.out || exit 1
            test "$attempt" -lt 3 || exit 1
          done
          test "$success" = true
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          NEGATIVE_CASES=$(node - <<'NODE'
          const fs=require('fs'),text=fs.readFileSync('/tmp/verify-ingestion.out','utf8');
          const matches=[...text.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!matches.length)throw new Error('verify-ingestion did not publish totalNegativeCases');
          process.stdout.write(matches.at(-1)[1]);
          NODE
          )
          STORAGE_FAILURE_CASES=$(node - <<'NODE'
          const fs=require('fs');
          const proofs=[
            ['/tmp/verify-source.out',/"transactionRollback"\s*:\s*true/],
            ['/tmp/verify-complete.out',/"acceptedStateStorageRollback"\s*:\s*true/],
            ['/tmp/verify-browser-extra.out',/"storageFailureRollback"\s*:\s*true/]
          ];
          let count=0;
          for(const [path,re] of proofs){const text=fs.readFileSync(path,'utf8');if(!re.test(text))throw new Error(`Missing executed storage proof: ${path}`);count++;}
          process.stdout.write(String(count));
          NODE
          )
          test "$NEGATIVE_CASES" -gt 0
          test "$STORAGE_FAILURE_CASES" -eq 3
          grep -q '"semanticFalseAcceptanceInvariant":true' /tmp/verify-semantic-invariant.out
          grep -q '"projectLifecycleControls":true' /tmp/verify-project-lifecycle.out
          grep -q '"lifecycleMetadataDeleteAtomic":true' /tmp/verify-project-lifecycle.out
          grep -q 'extra:package-round-trip' /tmp/verify-browser-extra.out
          grep -q 'extra:blob-persistence' /tmp/verify-browser-extra.out
          export NEGATIVE_CASES STORAGE_FAILURE_CASES
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/verify-definition-of-done.out','utf8'));
          const jsonLines=path=>fs.readFileSync(path,'utf8').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>JSON.parse(line));
          const semantic=Object.assign({},...jsonLines('/tmp/verify-semantic-invariant.out'));
          const lifecycle=Object.assign({},...jsonLines('/tmp/verify-project-lifecycle.out'));
          const browser=fs.readFileSync('/tmp/verify-browser-extra.out','utf8');
          if(!semantic.semanticFalseAcceptanceInvariant)throw new Error('Semantic false-acceptance proof is not true.');
          if(!lifecycle.projectLifecycleControls||!lifecycle.lifecycleMetadataDeleteAtomic||lifecycle.unsafeOverrides!==0)throw new Error('Project lifecycle proof is incomplete.');
          if(!browser.includes('extra:package-round-trip')||!browser.includes('extra:blob-persistence'))throw new Error('Browser custody/round-trip proof is incomplete.');
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/2',
            responseSchema:'closed-loop-stage-response/2',
            ...definition,
            nativeTestRuntime:true,
            nativeTestRuntimeVersion:'closed-loop-test-runtime/1',
            nativeTestSpecVersion:'closed-loop-test-spec/1',
            stagesCompleted:30,
            negativeCasesPassed:Number(process.env.NEGATIVE_CASES),
            storageFailureCasesPassed:Number(process.env.STORAGE_FAILURE_CASES),
            semanticFalseAcceptanceInvariant:Boolean(semantic.semanticFalseAcceptanceInvariant),
            conclusionBearingCollections:Number(semantic.conclusionBearingCollections||0),
            releaseGradeIndependence:Boolean(semantic.releaseGradeIndependence),
            traceIntegrity:Boolean(semantic.traceIntegrity),
            projectLifecycleControls:Boolean(lifecycle.projectLifecycleControls),
            lifecycleMetadataDeleteAtomic:Boolean(lifecycle.lifecycleMetadataDeleteAtomic),
            unsafeLifecycleOverrides:Number(lifecycle.unsafeOverrides),
            artifactRoundTrip:browser.includes('extra:package-round-trip'),
            blobPersistence:browser.includes('extra:blob-persistence'),
            deployedByteIdentity:process.env.LIVE_RESULT==='success',
            proofSources:{
              structuralCoverage:'verify-definition-of-done.mjs',
              nativeTestRuntime:'verify-test-runtime.mjs',
              canonicalWorkflow:'verify.mjs',
              ingestion:'verify-ingestion.mjs',
              workflowGates:'verify-complete.mjs',
              semanticAdjudication:'verify-semantic-invariant.mjs',
              projectLifecycle:'verify-project-lifecycle.mjs',
              browserPersistence:'verify-browser-extra.mjs',
              deployedIdentity:'verify-live job'
            }
          };
          const coverageKeys=['fieldOwnershipCoverage','applicationDerivationCoverage','typedRelationshipCoverage','acceptedAgentValueExtractionCoverage','acceptedRelationshipProvenanceCoverage','currentScopeSelectorCoverage','exactReqRunTestCoverage','applicableCurrentRegressionSuccess','mandatoryEvidenceChainCoverage','releaseArtifactIdentityCoverage'];
          for(const key of coverageKeys)if(report[key]!==1)throw new Error(`${key} is not 100%.`);
          const zeroKeys=['unauthorizedFieldMutationsAccepted','canonicalMutationsBeforeAcceptance','partialCommitsAfterInjectedFailure','staleProposalsAccepted','crossProjectRelationshipsAccepted','historicalScopeSatisfyingCurrentGates','unmatchedDeliveryFilesAuthorized','appendOnlyHistoryRewritesAccepted','favorableAgentVerdictsOverridingContradictoryObservations','structurallyInsufficientEvidenceProducingMandatorySatisfaction','externallySupportedUnestablishedIndependenceTreatedAsProven'];
          for(const key of zeroKeys)if(report[key]!==0)throw new Error(`${key} must be zero.`);
          if(!report.nativeTestRuntime||!report.deployedByteIdentity||!report.semanticFalseAcceptanceInvariant||!report.projectLifecycleControls||!report.lifecycleMetadataDeleteAtomic||report.unsafeLifecycleOverrides!==0||!report.artifactRoundTrip||!report.blobPersistence)throw new Error('Acceptance report proof reduction is incomplete.');
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
          if-no-files-found: error
      - name: Tag exact accepted commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="acceptance-${GITHUB_SHA:0:12}"
          EXISTING=$(curl --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" || true)
          EXISTING_SHA=$(printf '%s' "$EXISTING" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).object?.sha||'')}catch{}})")
          if [ -n "$EXISTING_SHA" ]; then
            test "$EXISTING_SHA" = "$GITHUB_SHA"
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" \
              --data "{\"ref\":\"refs/tags/$TAG\",\"sha\":\"$GITHUB_SHA\"}"
          fi
      - name: Publish exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then
            STATE=success
            DESCRIPTION='Measured deterministic, semantic, lifecycle, browser, persistence, and byte proofs passed'
          else
            STATE=failure
            DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"
          fi
          test "$(printf '%s' "$DESCRIPTION" | wc -c)" -le 140
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
          test "$STATE" = success
