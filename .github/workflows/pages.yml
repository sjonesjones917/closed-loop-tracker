name: Apply final operator completion
on:
  push:
    branches: [fix/final-live-operator-completion-20260830]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final current-main repairs
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('app-core.js'); s=p.read_text(); old="stageOneSummary=stageOne?`<div class=\"record-card\"><div class=\"record-body\"><div class=\"record-rows\">${field('Requested deliverable',p.envelope?.stageData?.EXACT_DELIVERABLE_REQUESTED||'UNKNOWN')}${field('Controlled input units accounted',stageOneAccounting.length)}${field('Intent statements captured',stageOneIntents.length)}${field('Assumptions',p.envelope?.stageData?.ASSUMPTIONS||'NONE')}${field('Unresolved human information',p.envelope?.stageData?.UNKNOWN_INFORMATION||'NONE')}</div></div></div><details class=\"record-card\"><summary>Advanced Stage 01 extraction details<span>${rows.length}</span></summary><div class=\"record-body\">${details('Complete extraction diff',rows,false)}</div></details>`:details('Proposal diff',rows,!longProposal);"; new=old.replace("details('Proposal diff',rows,!longProposal)","details('Proposal diff',rows,true)"); assert old in s; p.write_text(s.replace(old,new,1))
          Path('verify-v3-contract.mjs').write_text(subprocess.check_output(['git','show','364477572a675d133d457f3be6ce86b35aa4505e:verify-v3-contract.mjs'],text=True))
          Path('.github/workflows/pages.yml').write_text(subprocess.check_output(['git','show','364477572a675d133d457f3be6ce86b35aa4505e:.github/workflows/pages.yml'],text=True))
      - name: Commit final branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js verify-v3-contract.mjs .github/workflows/pages.yml
          git commit -m "Complete current-main operator prompt behavior"
          git push