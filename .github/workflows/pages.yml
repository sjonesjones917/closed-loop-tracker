name: Deploy application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      # BEGIN ONE-TIME STAGE4 CARRY-FORWARD REPAIR
      - name: Carry original user-entered project data into Stage 04
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          prompt=Path('prompt-engine.js')
          source=prompt.read_text()
          source=source.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/55';",1)
          old='return {currentUserJobInput:humanJobInput,stage01AcceptedCapture:'
          new="return {currentUserJobInput:humanJobInput,originalUserEntered:state?.projectData?.userEntered&&typeof state.projectData.userEntered==='object'?state.projectData.userEntered:{},stage01AcceptedCapture:"
          if old not in source:
              raise SystemExit('Stage 04 exhausted-input return object was not found')
          prompt.write_text(source.replace(old,new,1))

          old_token='runtime-20260830-live-operator-59'
          new_token='runtime-20260830-live-operator-60'
          for name in ['index.html','app-core.js','test-runtime.js']:
              path=Path(name)
              text=path.read_text()
              if old_token not in text:
                  raise SystemExit(f'{name} does not contain the current shared runtime token')
              path.write_text(text.replace(old_token,new_token))

          workflow=Path('.github/workflows/pages.yml')
          text=workflow.read_text()
          begin='      # BEGIN ONE-TIME STAGE4 CARRY-FORWARD REPAIR\n'
          end='      # END ONE-TIME STAGE4 CARRY-FORWARD REPAIR\n'
          if begin not in text or end not in text:
              raise SystemExit('One-time repair block markers are missing')
          before,rest=text.split(begin,1)
          _,after=rest.split(end,1)
          text=before+after
          text=text.replace('  contents: write\n','  contents: read\n',1)
          text=text.replace("      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}\n          fetch-depth: 0\n","      - uses: actions/checkout@v4\n",1)
          workflow.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-engine.js index.html app-core.js test-runtime.js .github/workflows/pages.yml
          git commit -m "Carry original user-entered data into Stage 04"
          git push origin HEAD:"$HEAD_BRANCH"
      # END ONE-TIME STAGE4 CARRY-FORWARD REPAIR

      - name: Materialize the exact retained Stage 01 output
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const project=JSON.parse(fs.readFileSync('TEST_PROJECT.json','utf8'));
          const output=String(project.stageRecords?.['1']?.output||'');
          if(!output||project.generatedOutputs?.[0]?.output!==output)throw new Error('Canonical retained Stage 01 output is missing or inconsistent.');
          fs.writeFileSync('AUTHORIZED_OPERATION_01.txt',output);
          NODE

      - name: Verify runtime JavaScript parses
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            node --check "$file"
          done

      - name: Verify schemas, migration, ingestion, routing, prompts, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-zero-loss-accounting.mjs
          node verify-one-time-intent-intake.mjs
          node verify-stage01-intake-closure.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
          node verify-semantic-invariant.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-complete.mjs

      - name: Use the application through Chromium at phone and desktop widths
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.2
          done
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-mobile-stage-action.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize the exact retained Stage 01 output
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const project=JSON.parse(fs.readFileSync('TEST_PROJECT.json','utf8'));
          const output=String(project.stageRecords?.['1']?.output||'');
          if(!output||project.generatedOutputs?.[0]?.output!==output)throw new Error('Canonical retained Stage 01 output is missing or inconsistent.');
          fs.writeFileSync('AUTHORIZED_OPERATION_01.txt',output);
          NODE

      - name: Build static application
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .nojekyll _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact deployed bytes and /3 runtime identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node verify-live.mjs

      - name: Use the deployed application through Chromium
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          node verify-browser.mjs
          node verify-browser-extra.mjs
