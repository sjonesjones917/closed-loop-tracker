name: Prepare reviewed Stage 30 source (nonproduction)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-reviewed-source:
    if: github.event.pull_request.number == 1187 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'controller/stage30-final-acceptance-20260907' && github.repository == 'sjonesjones917/closed-loop-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Materialize only the exact reviewed source tree on a nonproduction branch
        run: python3 .github/stage30-reviewed-source.py
