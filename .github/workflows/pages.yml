name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      negative_cases: ${{ steps.ingestion.outputs.negative_cases }}
      stages_completed: ${{ steps.full_cycle.outputs.stages_completed }}
      artifact_round_trip: ${{ steps.full_cycle.outputs.artifact_round_trip }}
      storage_failure_cases: ${{ steps.browser.outputs.storage_failure_cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify retained project and single application architecture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-live.mjs
          node --check test-fixtures.mjs
          node --check verify-full-cycle.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
      - name: Verify canonical workflow, persistence, ownership, and non-circularity
        run: node verify.mjs
      - name: Exercise all 30 stage prompt-response ingestion contracts and negative cases
        id: ingestion
        shell: bash
        run: |
          output="$(node verify-ingestion.mjs)"
          printf '%s\n' "$output"
          count="$(printf '%s\n' "$output" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/\"negativeCases\"\s*:\s*(\d+)/);if(!m)process.exit(2);process.stdout.write(m[1])})")"
          echo "negative_cases=$count" >> "$GITHUB_OUTPUT"
      - name: Verify exact deterministic gates and scope
        run: node verify-complete.mjs
      - name: Reject semantic prompt contradictions and operation leakage
        run: node verify-prompt-semantics.mjs
      - name: Run complete Stage 01-30 lifecycle
        id: full_cycle
        shell: bash
        run: |
          output="$(node verify-full-cycle.mjs)"
          printf '%s\n' "$output"
          stages="$(printf '%s\n' "$output" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/\"stagesCompleted\"\s*:\s*(\d+)/);if(!m)process.exit(2);process.stdout.write(m[1])})")"
          roundtrip="$(printf '%s\n' "$output" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{process.stdout.write(/\"artifactRoundTrip\"\s*:\s*true/.test(s)?'true':'false')})")"
          echo "stages_completed=$stages" >> "$GITHUB_OUTPUT"
          echo "artifact_round_trip=$roundtrip" >> "$GITHUB_OUTPUT"
      - name: Exercise local Chromium operator acceptance
        id: browser
        shell: bash
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          extra="$(PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs)"
          printf '%s\n' "$extra"
          storage_count="$(printf '%s\n' "$extra" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{process.stdout.write(/\"storageFailureRollback\"\s*:\s*true/.test(s)?'1':'0')})")"
          echo "storage_failure_cases=$storage_count" >> "$GITHUB_OUTPUT"
      - name: Enforce one application shell and responsible layers
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f experience.js
          test ! -f usability.js
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} lacks build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          NODE
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "GEN-042|field status report|maintenance[- ]handoff|human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-prompt-semantics.mjs && node verify-full-cycle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Re-run full deterministic lifecycle against exact deployed source revision
        run: node verify-full-cycle.mjs
      - name: Exercise deployed browser workflow, persistence, ingestion, and responsive layout
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node verify-browser.mjs
          node verify-browser-extra.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - name: Build measured acceptance report
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
          NEGATIVE_CASES: ${{ needs.test.outputs.negative_cases }}
          STAGES_COMPLETED: ${{ needs.test.outputs.stages_completed }}
          ARTIFACT_ROUND_TRIP: ${{ needs.test.outputs.artifact_round_trip }}
          STORAGE_FAILURE_CASES: ${{ needs.test.outputs.storage_failure_cases }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const ok=process.env.TEST_RESULT==='success'&&process.env.DEPLOY_RESULT==='success'&&process.env.LIVE_RESULT==='success';
          const report={commit:process.env.GITHUB_SHA,workflow:'mobile-closed-loop/30',projectSchema:'closed-loop-project/2',responseSchema:'closed-loop-stage-response/2',ownershipCoverage:process.env.TEST_RESULT==='success'?1:0,derivationCoverage:process.env.TEST_RESULT==='success'?1:0,relationshipCoverage:process.env.TEST_RESULT==='success'?1:0,semanticPromptContradictions:process.env.TEST_RESULT==='success'?0:null,stagesCompleted:Number(process.env.STAGES_COMPLETED||0),negativeCasesPassed:Number(process.env.NEGATIVE_CASES||0),storageFailureCasesPassed:Number(process.env.STORAGE_FAILURE_CASES||0),artifactRoundTrip:process.env.ARTIFACT_ROUND_TRIP==='true',deployedByteIdentity:process.env.LIVE_RESULT==='success'};
          fs.writeFileSync('acceptance-report.json',JSON.stringify(report,null,2)+'\n');
          if(ok&&(report.stagesCompleted!==30||!report.artifactRoundTrip||!report.deployedByteIdentity))process.exit(2);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: acceptance-report.json
          if-no-files-found: error
      - name: Publish exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then
            STATE=success
            DESCRIPTION='Source, 30-stage lifecycle, semantic prompts, persistence, browser workflow, and deployed-byte verification passed'
          else
            STATE=failure
            DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
      - name: Tag only a fully verified deployed commit
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        run: |
          tag="closed-loop-verified-${GITHUB_SHA::12}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
