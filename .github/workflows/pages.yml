name: Verify exact application bytes and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Reconstruct and verify the exact audited application
        run: python3 tools/build-pages.py
      - name: Upload only the verified deployment directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy verified bytes
        id: deployment
        uses: actions/deploy-pages@v4
