name: Apply exact integration-candidate repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: candidate-self-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact acceptance-focus repair and regression
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app-core.js')
          source = app.read_text()
          old = "current.activeStage=canonicalCurrentStage();current.activeView='Workflow';render();focusAfterAction($('#next-required-action'));\n}"
          new = "current.activeStage=canonicalCurrentStage();current.activeView='Workflow';render();focusAfterAction($('#next-required-action'),{reason:'RETURN'});\n}"
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one acceptance focus target, found {source.count(old)}')
              app.write_text(source.replace(old, new, 1))

          test = Path('verify-workflow-focus.mjs')
          source = test.read_text()
          old_harness = "vm.runInContext(source.slice(0,source.indexOf('globalThis.closedLoopAppReady=false;'))+`globalThis.ui={focus:focusAfterAction,run:runOperatorAction,fail:reportActionFailure,announce,retry:async()=>{const previous={current,savePromptRecord,render,selectedOperation};current={job:{JOB_ID:'FOCUS-DISPOSABLE'},activeStage:1};savePromptRecord=async()=>{};render=()=>{};selectedOperation=()=> 'COMPLETE';try{await prepareReplacementAttempt();await Promise.resolve();}finally{({current,savePromptRecord,render,selectedOperation}=previous);}}};})();`,c,{filename:'app-core.js'});"
          new_harness = "vm.runInContext(source.slice(0,source.indexOf('globalThis.closedLoopAppReady=false;'))+`globalThis.ui={focus:focusAfterAction,run:runOperatorAction,fail:reportActionFailure,announce,retry:async()=>{const previous={current,savePromptRecord,render,selectedOperation};current={job:{JOB_ID:'FOCUS-DISPOSABLE'},activeStage:1};savePromptRecord=async()=>{};render=()=>{};selectedOperation=()=> 'COMPLETE';try{await prepareReplacementAttempt();await Promise.resolve();}finally{({current,savePromptRecord,render,selectedOperation}=previous);}},accept:async()=>{const previous={current,recordMobileOperation,render,replacementReview};current={job:{JOB_ID:'FOCUS-ACCEPT',CURRENT_STAGE:'STAGE 01'},activeStage:1,activeView:'Workflow',projectData:{generatedPrompts:[]},stages:{1:{gate:{complete:false}}}};recordMobileOperation=async()=>{};render=()=>{};replacementReview={};try{await finishAcceptedProposal({proposalId:'P1',rawResponseId:'R1',stage:1,continuationInstructionId:null});}finally{({current,recordMobileOperation,render,replacementReview}=previous);}}};})();`,c,{filename:'app-core.js'});"
          if new_harness not in source:
              if source.count(old_harness) != 1:
                  raise SystemExit(f'Expected exactly one focus harness target, found {source.count(old_harness)}')
              source = source.replace(old_harness, new_harness, 1)
          old_case = "cases.push({caseId:'FOCUS-NO-UPWARD-SCROLL-FOR-FORWARD-PROGRESS',result:'PASS'});calls.length=0;\n"
          new_case = "cases.push({caseId:'FOCUS-NO-UPWARD-SCROLL-FOR-FORWARD-PROGRESS',result:'PASS'});calls.length=0;\nconst acceptedNext=element('next-required-action',{top:-3412.875,bottom:-3259.875,left:0,right:347,width:347,height:153});nodes.set('#next-required-action',acceptedNext);await c.ui.accept();assert.ok(calls.some(call=>call.type==='scroll'&&call.id===acceptedNext.id),'FOCUS_ACCEPTANCE_RETURN_ORACLE: committed acceptance did not return the next required action to view.');cases.push({caseId:'FOCUS-AFTER-ACCEPTANCE-RETURNS-NEXT-ACTION',result:'PASS'});calls.length=0;nodes.delete('#next-required-action');\n"
          if new_case not in source:
              if source.count(old_case) != 1:
                  raise SystemExit(f'Expected exactly one forward-focus case anchor, found {source.count(old_case)}')
              source = source.replace(old_case, new_case, 1)
          test.write_text(source)
          PY
          node --check app-core.js
          node --check verify-workflow-focus.mjs
          node verify-workflow-focus.mjs
          if git diff --quiet -- app-core.js verify-workflow-focus.mjs; then
            echo 'Candidate already contains the exact repair.'
            exit 0
          fi
          git config user.name 'closed-loop-ci'
          git config user.email 'closed-loop-ci@users.noreply.github.com'
          git add app-core.js verify-workflow-focus.mjs
          git commit -m 'Fix post-acceptance next-action focus'
          git push origin "HEAD:${HEAD_REF}"
