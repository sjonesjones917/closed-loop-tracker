name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Commit final future-stage prompt gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const appPath='app.js', indexPath='index.html', buildPath='build-test-project.mjs', verifyPath='verify.mjs';
          let app=fs.readFileSync(appPath,'utf8');
          const old='<div class="button-row"><button id="save-prompt">Save instruction</button><button id="copy-prompt">Copy instruction</button></div>';
          const replacement='<div class="button-row"><button id="save-prompt"${lock?\' disabled\':\'\'}>Save instruction</button><button id="copy-prompt"${lock?\' disabled\':\'\'}>Copy instruction</button></div>';
          if(app.includes(old))app=app.replace(old,replacement);
          else if(!app.includes('id="save-prompt"${lock?\' disabled\':\'\'}'))throw new Error('Could not locate future-stage prompt controls.');
          fs.writeFileSync(appPath,app);
          for(const path of [indexPath,buildPath,verifyPath]){
            let text=fs.readFileSync(path,'utf8');
            text=text.replaceAll('closed-loop-30-runtime-20260823-2001','closed-loop-30-runtime-20260823-2020');
            fs.writeFileSync(path,text);
          }
          NODE
          if ! git diff --quiet -- app.js index.html build-test-project.mjs verify.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js index.html build-test-project.mjs verify.mjs
            git commit -m "Gate future-stage prompt actions"
            git push origin HEAD:main
          fi
      - run: node build-test-project.mjs
      - run: node --check app.js && node --check workbook.js && node --check build-test-project.mjs && node --check build-test-project-impl.mjs && node --check verify.mjs && node --check verify-live.mjs && node --check verify-browser.mjs
      - run: node verify.mjs
      - name: Verify build is read-only and single-source
        run: |
          git diff --exit-code -- app.js TEST_PROJECT.json index.html workbook.js
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f human-ui.js
          test ! -f agent-workflow.js
          test ! -f prompt-center.js
          grep -q 'src="workbook.js' index.html
          grep -q 'src="app.js' index.html
          grep -q 'rel="icon"' index.html
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app.js','utf8')+fs.readFileSync('index.html','utf8')+fs.readFileSync('workbook.js','utf8')+fs.readFileSync('TEST_PROJECT.json','utf8');
          const banned=new RegExp('se'+'mantic','i');
          if(banned.test(s))throw new Error('prohibited terminology');
          if(/GEN-042|field status report|maintenance[- ]handoff/i.test(s))throw new Error('unrelated product content');
          if(/human-project\/31|31 operations|Freeze New Version/i.test(s))throw new Error('discarded architecture');
          NODE

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs
      - name: Confirm deploy artifact equals checked-in source
        run: git diff --exit-code -- app.js TEST_PROJECT.json index.html workbook.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify-live.mjs
      - name: Verify rendered phone views
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          for WIDTH in 320 393; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --window-size=${WIDTH},852 --virtual-time-budget=10000 --dump-dom "${PAGE_URL}?verify=${GITHUB_SHA}-${WIDTH}" > "live-${WIDTH}.html"
            grep -q 'Mobile Closed-Loop Agent Reliability Workbook' "live-${WIDTH}.html"
            grep -q '1/30 complete' "live-${WIDTH}.html"
            grep -q 'STAGE 02' "live-${WIDTH}.html"
            grep -q 'Saved instructions' "live-${WIDTH}.html"
            grep -q 'Saved outputs' "live-${WIDTH}.html"
            grep -q 'Overview' "live-${WIDTH}.html"
            ! grep -qi 'GEN-042' "live-${WIDTH}.html"
            ! grep -qi 'field status report' "live-${WIDTH}.html"
            ! grep -qi 'maintenance handoff' "live-${WIDTH}.html"
            ! grep -q '0/31 complete' "live-${WIDTH}.html"
            ! grep -q 'Loading the workflow' "live-${WIDTH}.html"
          done
      - name: Exercise deployed project and persistence in Chromium
        run: node verify-browser.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then
            STATE=success
            DESCRIPTION='Source, deployment, mobile/desktop UI, persistence, and browser verification passed'
          else
            STATE=failure
            DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
