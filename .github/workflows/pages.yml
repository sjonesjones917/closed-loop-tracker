name: Verify and deploy the single reliability app
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize zero-loss candidate without visual redesign
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git show origin/fix/final-zero-loss-v3-20260830:.github/workflows/final-v3-proof.yml > /tmp/final-v3-proof.yml
          cp .github/workflows/pages.yml /tmp/pages.yml
          git checkout origin/fix/final-zero-loss-v3-20260830 -- .
          cp /tmp/pages.yml .github/workflows/pages.yml
          rm -f .github/workflows/final-v3-proof.yml final-proof.log
          python3 - <<'PY'
          from pathlib import Path
          source=Path('/tmp/final-v3-proof.yml').read_text()
          marker="      - name: Repair controlling candidate in runner\n        shell: bash\n        run: |\n"
          start=source.index(marker)+len(marker)
          end=source.index("      - name: Run every deterministic proof",start)
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())+'\n'
          Path('/tmp/repair.sh').write_text(body)
          PY
          bash /tmp/repair.sh
          node - <<'NODE'
          const fs=require('fs');
          let p=fs.readFileSync('prompt-engine.js','utf8');
          const anchor='Classify unresolved issues as BLOCKING_NOW, ASK_NOW_NONBLOCKING, or LATER_RESOLVABLE.';
          if(!p.includes(anchor))throw new Error('Stage 01 unresolved-issue classification anchor missing.');
          const rule=' Never silently place an unasked human-only issue into UNKNOWN_INFORMATION. Any foreseeable human-only issue not already supplied must be asked before Stage 01 final JSON; ASK_NOW_NONBLOCKING may be answered UNKNOWN or DEFERRED, but it may not be skipped.';
          if(!p.includes('Never silently place an unasked human-only issue into UNKNOWN_INFORMATION.'))p=p.replace(anchor,anchor+rule);
          fs.writeFileSync('prompt-engine.js',p);
          NODE
      - name: Prove exhaustive Stage 01, Stage 03, and closed Stage 04
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('prompt-engine.js','utf8'),e=fs.readFileSync('workflow-engine.js','utf8'),a=fs.readFileSync('app-core.js','utf8'),s=fs.readFileSync('workflow-schema.js','utf8');
          const q=(v,m)=>{if(!v)throw new Error(m)};
          q(p.includes('Stage 01 is COMPLETE HUMAN-AUTHORITY INTAKE'),'Stage 01 is not exhaustive intake');
          q(p.includes('account for EVERY INPUT UNIT ID'),'Stage 01 does not require complete input identity accounting');
          q(p.includes('Never silently place an unasked human-only issue into UNKNOWN_INFORMATION'),'Stage 01 permits silent unknowns');
          q(p.includes('Exhaustively research every current accepted Stage 02 independent external source'),'Stage 03 is not exhaustive');
          q(p.includes('Do not mark Stage 03 complete until all current sources have coverage'),'Stage 03 permits incomplete coverage');
          q(p.includes('Compile the requirement specification ONLY from the complete APPLICATION OBLIGATION MANIFEST'),'Stage 04 does not use closed obligation universe');
          q(p.includes('NEVER ask the human to reattach, resend, retype, restate, reconstruct, or summarize'),'Stage 04 can still repeat user input');
          q(p.includes('If an earlier stage is incomplete, return BLOCKED with INADEQUATE_PRIOR_OUTPUT'),'Stage 04 can proceed on incomplete earlier stages');
          q(e.includes('function stage1IntakeManifest(project)')&&e.includes('validateStage1IntakeAccounting'),'application-owned Stage 01 accounting missing');
          q(e.includes('function stage4ObligationManifest(project)')&&e.includes('validateStage4ObligationAccounting'),'application-owned Stage 04 accounting missing');
          q(e.includes('stage4Prompt.contextManifest.obligationManifest'),'Stage 04 gate not bound to controlling prompt manifest');
          q(e.includes('SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED')&&e.includes('SATURATION_STATUS'),'Stage 03 saturation gate missing');
          q(a.includes("function artifactControlMarkup(n,locked){if(n===4)return '';"),'Stage 04 still exposes repeat upload control');
          q(a.includes('registerIntakeArtifactSnapshot'),'Stage 01 does not snapshot supplied artifact content');
          q(s.includes("const RESPONSE_SCHEMA='closed-loop-stage-response/3'"),'response schema is not /3');
          console.log('stage-01-03-04-closure: PASS');
          NODE
      - name: Run every deterministic proof
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js *.mjs; do node --check "$f"; done
          node build-test-project.mjs
          for t in verify.mjs verify-v3-migration.mjs verify-v3-contract.mjs verify-test-runtime-v3.mjs verify-test-runtime-limits.mjs verify-test-runtime.mjs verify-hash.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-single-supply-prompts.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs verify-v3-definition-of-done.mjs verify-project-lifecycle.mjs; do node "$t"; done
      - name: Run local Chromium acceptance
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit proven source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-spec-finalizer
          git config user.email actions@users.noreply.github.com
          rm -f final-proof.log .spec-work-in-progress .github/workflows/final-v3-proof.yml
          git add -A -- ':!.github/workflows/*'
          git diff --cached --check
          git commit -m 'Complete exhaustive intent capture and closed obligation accounting' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
