name: Verify, test, and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: project
        continue-on-error: true
        run: node build-test-project.mjs
      - id: loader
        continue-on-error: true
        run: node --check workbook.js
      - id: human
        continue-on-error: true
        run: node --check human-ui.js
      - id: verifier
        continue-on-error: true
        run: node verify.mjs
      - id: structure
        continue-on-error: true
        run: |
          test -f index.html
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test -f TEST_PROJECT.json
          node - <<'NODE'
          const p=require('./TEST_PROJECT.json');
          if(p.schema!=='mobile-closed-loop-project/5'||p.currentOperation!==11||p.currentState!=='BLOCKED'||p.runRecords.length!==0||Object.keys(p.operationStates).length!==31)process.exit(1);
          NODE
      - name: Publish source statuses
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', PROJECT: '${{ steps.project.outcome }}', LOADER: '${{ steps.loader.outcome }}', HUMAN: '${{ steps.human.outcome }}', VERIFIER: '${{ steps.verifier.outcome }}', STRUCTURE: '${{ steps.structure.outcome }}'}
        run: |
          for pair in "retained-project:$PROJECT" "workbook-loader:$LOADER" "human-ui-syntax:$HUMAN" "repository-verifier:$VERIFIER" "single-app-structure:$STRUCTURE"; do
            context="${pair%%:*}"; result="${pair#*:}"; state=failure; [ "$result" = success ] && state=success
            gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context="$context" -f description="$context $result"
          done
      - name: Enforce source verification
        run: |
          test '${{ steps.project.outcome }}' = success
          test '${{ steps.loader.outcome }}' = success
          test '${{ steps.human.outcome }}' = success
          test '${{ steps.verifier.outcome }}' = success
          test '${{ steps.structure.outcome }}' = success

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: browser-actions/setup-chrome@v1
      - id: identity
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p live-proof
          verified=false
          FILES=(index.html workbook.js human-ui.js TEST_PROJECT.json)
          for attempt in $(seq 1 36); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"; good=true
            for f in "${FILES[@]}"; do curl -fsSL "${PAGE_URL%/}/$f?verify=$nonce" -o "live-proof/$f" || good=false; done
            if $good; then
              exact=true
              for f in "${FILES[@]}"; do [[ "$(sha256sum "$f"|awk '{print $1}')" == "$(sha256sum "live-proof/$f"|awk '{print $1}')" ]] || exact=false; done
              $exact && verified=true && break
            fi
            sleep 5
          done
          test "$verified" = true
      - id: render
        continue-on-error: true
        run: |
          set -euo pipefail
          BROWSER="$(command -v chrome || command -v google-chrome || command -v chromium)"
          BASE="${PAGE_URL%/}/?test=1&verify=${GITHUB_SHA}"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --window-size=393,852 --dump-dom "$BASE" > live-proof/test-393.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --window-size=393,852 --screenshot=live-proof/test-393.png "$BASE"
          grep -q 'Closed-Loop Reliability application repair' live-proof/test-393.html
          grep -q 'Real retained project.' live-proof/test-393.html
          grep -q 'BLOCKED' live-proof/test-393.html
          grep -q '10/31 complete' live-proof/test-393.html
          grep -q 'User Job Input' live-proof/test-393.html
          grep -q 'External Research Sources' live-proof/test-393.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --window-size=320,800 --dump-dom "$BASE" > live-proof/test-320.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --window-size=320,800 --screenshot=live-proof/test-320.png "$BASE"
          grep -q 'Closed-Loop Reliability application repair' live-proof/test-320.html
      - id: interaction
        continue-on-error: true
        run: |
          set -euo pipefail
          BROWSER="$(command -v chrome || command -v google-chrome || command -v chromium)"
          rm -rf /tmp/live-e2e
          "$BROWSER" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/live-e2e --window-size=393,852 about:blank >/tmp/live-chrome.log 2>&1 &
          for n in $(seq 1 50); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep .2; done
          cat > /tmp/live-e2e.mjs <<'NODE'
          import fs from 'node:fs';
          const port=9222,base=process.env.PAGE_URL.replace(/\/$/,'')+'/?test=1&e2e='+Date.now(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const target=(await (await fetch(`http://127.0.0.1:${port}/json/list`)).json()).find(x=>x.type==='page');if(!target)throw Error('No page target');
          const ws=new WebSocket(target.webSocketDebuggerUrl);let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(JSON.stringify(m.error))):p.resolve(m.result)}};await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++seq;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
          async function ev(expression){const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.exception?.description||r.exceptionDetails.text);return r.result.value}
          async function waitFor(expression,ms=20000){const end=Date.now()+ms;while(Date.now()<end){try{if(await ev(expression))return}catch{}await sleep(100)}throw Error(`Timed out: ${expression}`)}
          const ok=(c,m)=>{if(!c)throw Error(m)};
          await send('Page.enable');await send('Page.navigate',{url:base});
          await waitFor("document.readyState==='complete'&&document.body.innerText.includes('Closed-Loop Reliability application repair')");
          ok((await ev("document.querySelector('#new-job-button').getBoundingClientRect().height"))<=36,'New project button oversized');
          ok((await ev("document.querySelector('#project-data-button').getBoundingClientRect().height"))<=36,'Project button oversized');
          await ev("document.querySelector('[data-view=workflow]').click()");await waitFor("document.body.innerText.includes('31-operation workflow')");
          ok((await ev("document.querySelectorAll('[data-operation]').length"))===31,'31 operations not rendered');
          await ev("document.querySelector('[data-operation=2]').click()");await waitFor("document.body.innerText.includes('Discover independent external authorities')");
          ok(await ev("document.body.innerText.includes('Generated instruction / prompt')"),'Prompt not inspectable');
          await ev("document.querySelector('[data-view=runs]').click()");await waitFor("document.body.innerText.includes('Executions and independent review')");
          ok(await ev("document.body.innerText.includes('None recorded')"),'Synthetic run data unexpectedly present');
          await ev("document.querySelector('[data-view=history]').click()");await waitFor("document.body.innerText.includes('Complete history')");
          ok(await ev("document.body.innerText.includes('Generated instruction')"),'History does not expose generated instructions');
          await ev("document.querySelector('#new-job-button').click()");await waitFor("JSON.parse(localStorage.getItem('mobile-closed-loop-agent')).job.JOB_TITLE==='New project'");
          const clean=await ev("(()=>{const s=JSON.parse(localStorage.getItem('mobile-closed-loop-agent'));return {op:s.projectData.currentOperation,req:s.projectData.requirements.length,runs:s.projectData.runRecords.length,blockers:s.projectData.blockers.length,baseline:Object.keys(s.projectData.baseline).length,product:Object.keys(s.projectData.product).length}})()");
          ok(clean.op===1&&clean.req===0&&clean.runs===0&&clean.blockers===0&&clean.baseline===0&&clean.product===0,'New project inherited prior state');
          fs.writeFileSync('live-proof/interaction.json',JSON.stringify({ok:true,operations:31,compactButtons:true,authoritySeparation:true,syntheticRuns:false,cleanNewProject:true},null,2));ws.close();
          NODE
          node /tmp/live-e2e.mjs 2>&1 | tee live-proof/interaction.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'live-proof-${{ github.run_id }}', path: live-proof, if-no-files-found: error}
      - name: Enforce live verification
        run: |
          test '${{ steps.identity.outcome }}' = success
          test '${{ steps.render.outcome }}' = success
          test '${{ steps.interaction.outcome }}' = success
