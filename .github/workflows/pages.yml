          (Path(os.environ['DIAG_OUT'])/'normal-owner-config.json').write_text(json.dumps(row,indent=2)+'\n')
          CONFIG
          # Replace this line with the exact external normal-contract-owner.mjs heredoc and SHA check.
          cat > "$RUNNER_TEMP/normal-contract-owner.mjs" <<'NORMAL_OWNER'
          // External CI orchestration. Runs the unchanged normal registered owner.
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {pathToFileURL} from 'node:url';
          const [outputArg,configArg]=process.argv.slice(2),out=path.resolve(outputArg),configBytes=fs.readFileSync(configArg),config=JSON.parse(configBytes),source=fs.realpathSync(process.cwd()),owner='verify-contract-closure.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex'),git=(...args)=>execFileSync('git',args,{encoding:'utf8',timeout:30000}).trim(),save=(name,value)=>fs.writeFileSync(path.join(out,name),JSON.stringify(value,null,2)+'\n',{flag:'wx'});
          for(const key of ['sourceCommit','sourceTree'])assert(/^[0-9a-f]{40}$/.test(config[key]||''),'Unfrozen '+key);
          for(const key of ['sourceInputsSha256','projectStoreSha256','driverSha256'])assert(/^[0-9a-f]{64}$/.test(config[key]||''),'Unfrozen '+key);
          assert.equal(process.version,'v22.23.3');assert.equal(process.platform,'linux');assert.equal(process.arch,'x64');assert.deepEqual(process.execArgv,[]);
          assert.equal(git('rev-parse','HEAD'),config.sourceCommit);assert.equal(git('rev-parse','HEAD^{tree}'),config.sourceTree);assert.equal(git('status','--porcelain'),'');
          assert.equal(process.env.GITHUB_ACTIONS,'true');assert.equal(process.env.NODE_OPTIONS,'--import '+pathToFileURL(path.join(source,'verification-evidence-preload.mjs')).href);
          assert.equal(process.env.CLOSED_LOOP_VERIFICATION_SOURCE_ROOT,source);assert.equal(process.env.CLOSED_LOOP_VERIFICATION_RECEIPTS,path.join(out,'receipts'));assert.equal(process.env.VERIFIER_CHILD_EVIDENCE_DIRECTORY,path.join(out,'children'));
          assert.equal(process.env.CLOSED_LOOP_VERIFIER_OWNER_FD,undefined);assert.equal(process.env.BASELINE_COMMIT,undefined);assert.equal(process.env.CLOSED_LOOP_REQUIRE_CURRENT_OWNER_RECEIPTS,undefined);
          assert(out!==source&&!out.startsWith(source+path.sep));assert(!fs.existsSync(path.join(out,'receipts')));assert(!fs.existsSync(path.join(out,'children')));
          fs.mkdirSync(path.join(out,'receipts'));fs.mkdirSync(path.join(out,'children'));fs.mkdirSync(path.join(out,'execution'));
          assert.equal(sha(fs.readFileSync('project-store.js')),config.projectStoreSha256);assert.equal(sha(fs.readFileSync('operator-browser-driver.mjs')),config.driverSha256);
          const evidence=await import(pathToFileURL(path.join(source,'verification-evidence.mjs'))),fingerprint=evidence.evidenceFingerprint(source);
          assert.equal(fingerprint.sourceCommit,config.sourceCommit);assert.equal(fingerprint.sourceTree,config.sourceTree);assert.equal(fingerprint.sourceInputsSha256,config.sourceInputsSha256);
          const {executeGate,suiteTimeoutMs}=await import(pathToFileURL(path.join(source,'verify-conformance-regressions.mjs'))),timeoutMs=suiteTimeoutMs(owner);
          assert.equal(timeoutMs,1200000,'Preserve the source owner twenty-minute cap');
          const command=[process.execPath,path.join(source,owner)],controller=new AbortController(),term=()=>controller.abort('SIGTERM'),int=()=>controller.abort('SIGINT');
          process.on('SIGTERM',term);process.on('SIGINT',int);
          save('normal-owner-invocation.json',{owner,command,sourceCommit:config.sourceCommit,sourceTree:config.sourceTree,sourceInputsSha256:config.sourceInputsSha256,timeoutMs,defaultHeap:true,sourceOwnedSupervisor:true,startedAt:new Date().toISOString()});
          try{
           const actual=await executeGate({name:owner,command:process.execPath,args:[path.join(source,owner)]},{directory:path.join(out,'execution'),cwd:source,timeoutMs,killGraceMs:5000,signal:controller.signal,requireJson:false});
           save('normal-owner-actual-execution.json',actual);
           assert.deepEqual(actual.command,command);assert.equal(actual.timeoutMs,timeoutMs);assert.equal(actual.outcome,'PASS');assert.equal(actual.exitCode,0);
           for(const key of ['signal','reason','error','reportError'])assert.equal(actual[key],null,key);
           assert.equal(fs.readFileSync(actual.stdoutPath,'utf8'),actual.stdout);assert.equal(fs.readFileSync(actual.stderrPath,'utf8'),actual.stderr);
           assert.equal(sha(actual.stdout),actual.stdoutSha256);assert.equal(sha(actual.stderr),actual.stderrSha256);
           assert(actual.ownedProcessGroups.length>0);assert(actual.ownedProcessGroups.every(row=>row.active===false));
           const receiptPath=path.join(out,'receipts',owner+'.json'),receiptBytes=fs.readFileSync(receiptPath),receipt=evidence.validateExecutionReceipt(JSON.parse(receiptBytes),owner,fingerprint);
           assert.equal(receipt.promotion,undefined);assert.deepEqual(receipt.command,command);assert.equal(receipt.stdoutSha256,actual.stdoutSha256);assert.equal(receipt.stderrSha256,actual.stderrSha256);assert.deepEqual(receipt.reports,evidence.executionReports(actual.stdout));
           assert.deepEqual(evidence.evidenceFingerprint(source),fingerprint);assert.equal(git('status','--porcelain'),'');assert.deepEqual(fs.readFileSync(configArg),configBytes);
           save('normal-owner-validation.json',{outcome:'PASS',owner,sourceCommit:config.sourceCommit,sourceTree:config.sourceTree,sourceInputsSha256:config.sourceInputsSha256,platform:process.platform,node:process.version,receiptSha256:receipt.receiptSha256,receiptFileSha256:sha(receiptBytes),rawStdoutSha256:actual.stdoutSha256,rawStderrSha256:actual.stderrSha256,sourceClean:true,ownedGroupsInactive:true,scope:'One actual normal Linux owner; not Mac or browser acceptance.'});
           console.log(JSON.stringify({owner,outcome:'PASS',sourceCommit:config.sourceCommit,receiptSha256:receipt.receiptSha256}));
          }finally{process.removeListener('SIGTERM',term);process.removeListener('SIGINT',int);}
          NORMAL_OWNER
          echo "bfb496a8794b13ffbedbb4b654671281c2f4584177bca3a1cfb9400d3208f874  $RUNNER_TEMP/normal-contract-owner.mjs" | sha256sum --check
          cp "$RUNNER_TEMP/normal-contract-owner.mjs" "$DIAG_OUT/normal-contract-owner.mjs"
      - name: Run actual normal contract closure with current-source evidence
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          test -z "$(git status --porcelain)"
          export CLOSED_LOOP_VERIFICATION_SOURCE_ROOT="$PWD"
          export CLOSED_LOOP_VERIFICATION_RECEIPTS="$DIAG_OUT/receipts"
          export VERIFIER_CHILD_EVIDENCE_DIRECTORY="$DIAG_OUT/children"
          export NODE_OPTIONS="--import $(node -e 'process.stdout.write(require("node:url").pathToFileURL(require("node:path").resolve("verification-evidence-preload.mjs")).href)')"
          node "$RUNNER_TEMP/normal-contract-owner.mjs" "$DIAG_OUT" "$DIAG_OUT/normal-owner-config.json"
      - name: Preserve normal owner source state
        if: always()
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$DIAG_OUT/source-commit-after.txt"
          git status --porcelain > "$DIAG_OUT/source-status-after.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
      - name: Retain actual normal owner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env:
          NODE_OPTIONS: ''
        with:
          name: actual-candidate-contract-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAG_OUT }}
          if-no-files-found: error
          retention-days: 7
