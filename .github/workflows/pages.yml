name: Verify, test, and deploy the single workbook app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: workbook_syntax
        continue-on-error: true
        run: node --check workbook.js
      - id: human_syntax
        continue-on-error: true
        run: node --check human-ui.js
      - id: verifier
        continue-on-error: true
        run: node verify.mjs
      - id: structure
        continue-on-error: true
        run: |
          test -f index.html
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test -f test-project/inputs/REQUEST.md
          test -f test-project/inputs/SITE_POLICY.md
          test -f test-project/inputs/WORKFLOW_RULES.md
          test ! -f test-project/TEST-JOB-001__FIELD-HANDOFF.md
      - name: Publish granular verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKBOOK: ${{ steps.workbook_syntax.outcome }}
          HUMAN: ${{ steps.human_syntax.outcome }}
          VERIFIER: ${{ steps.verifier.outcome }}
          STRUCTURE: ${{ steps.structure.outcome }}
        run: |
          for pair in "workbook-syntax:$WORKBOOK" "human-ui-syntax:$HUMAN" "repository-verifier:$VERIFIER" "single-app-structure:$STRUCTURE"; do
            context="${pair%%:*}"; outcome="${pair#*:}"
            if [ "$outcome" = success ]; then state=success; else state=failure; fi
            gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context="$context" -f description="$context $outcome"
          done
      - name: Enforce verification results
        if: always()
        run: |
          test '${{ steps.workbook_syntax.outcome }}' = success
          test '${{ steps.human_syntax.outcome }}' = success
          test '${{ steps.verifier.outcome }}' = success
          test '${{ steps.structure.outcome }}' = success
      - name: Publish test status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='workbook-test-project' -f description='Truthful closed-loop project verification'
  deploy:
    if: github.event_name != 'pull_request'
    needs: test-project
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish deployment status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='single-workbook-pages' -f description='Exact tested application deployed'
  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test-project, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact deployed files
        run: |
          set -euo pipefail; mkdir -p live-proof; verified=false
          FILES=(index.html workbook.js human-ui.js TEST_PROJECT.json test-project/inputs/REQUEST.md test-project/inputs/SITE_POLICY.md test-project/inputs/WORKFLOW_RULES.md)
          for attempt in $(seq 1 48); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            good=true
            for f in "${FILES[@]}"; do
              mkdir -p "live-proof/$(dirname "$f")"
              curl -fsSL "${PAGE_URL%/}/$f?verify=$nonce" -o "live-proof/$f" || good=false
            done
            if $good; then
              exact=true
              for f in "${FILES[@]}"; do
                [[ "$(sha256sum "$f"|awk '{print $1}')" == "$(sha256sum "live-proof/$f"|awk '{print $1}')" ]] || exact=false
              done
              if $exact; then verified=true; break; fi
            fi
            sleep 5
          done
          test "$verified" = true
      - name: Render phone UI and open real test project
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || true)"; test -n "$BROWSER"
          BASE="${PAGE_URL%/}/?verify=${GITHUB_SHA}"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --window-size=393,852 --dump-dom "$BASE" > live-proof/blank.html
          grep -q 'Closed-Loop Reliability' live-proof/blank.html
          grep -q 'Current working job' live-proof/blank.html
          grep -q 'New project' live-proof/blank.html
          grep -q 'Project data' live-proof/blank.html
          grep -q 'Workflow' live-proof/blank.html
          ! grep -q 'APPENDIX A–F — OPERATIONAL CONTROLS' live-proof/blank.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=24000 --window-size=393,852 --dump-dom "${BASE}&test=1" > live-proof/test-project.html
          grep -q 'Portable generator service handoff' live-proof/test-project.html
          grep -q 'GEN-042' live-proof/test-project.html
          grep -q 'Test project.' live-proof/test-project.html
          grep -q 'Current stage' live-proof/test-project.html
          grep -q 'Open blockers' live-proof/test-project.html
          grep -q 'Requirements' live-proof/test-project.html
          grep -q '>Workflow<' live-proof/test-project.html
          grep -q '>Runs<' live-proof/test-project.html
          grep -q '>Issues<' live-proof/test-project.html
          grep -q '>Release<' live-proof/test-project.html
          grep -q '>History<' live-proof/test-project.html
          grep -q 'BLOCKED' live-proof/test-project.html
          grep -q 'zero are recorded' live-proof/test-project.html
          ! grep -q 'APPENDIX A–F — OPERATIONAL CONTROLS' live-proof/test-project.html
      - name: Publish live status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='live-workbook-ui' -f description='Rendered phone UI and truthful test project verified'
