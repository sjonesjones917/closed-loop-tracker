name: Repair recovery response lanes
on:
  push:
    branches:
      - reliability/recovery-response-lanes
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/recovery-response-lanes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded repair
        run: python3 .repair-response-lanes.py
      - name: Restore production workflow and remove helper
        run: |
          git checkout 456465f29a6ddc6d04cf8dcf8491fcf0eb6ac5a3 -- .github/workflows/pages.yml
          rm .repair-response-lanes.py
      - name: Run deterministic acceptance
        run: |
          node build-test-project.mjs
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit source-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -z "$(git diff --name-only | grep -vE '^(response-ingestion.js|verify-ingestion.mjs|.github/workflows/pages.yml|.repair-response-lanes.py)$' || true)"
          git add -A
          git commit -m "Enforce distinct recovery response lanes"
          git push origin HEAD:reliability/recovery-response-lanes