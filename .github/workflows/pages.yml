name: Verify, test, and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: project
        continue-on-error: true
        run: node build-test-project.mjs
      - id: human
        continue-on-error: true
        run: node --check human-ui.js
      - id: live_verifier
        continue-on-error: true
        run: node --check verify-live.mjs
      - id: verifier
        continue-on-error: true
        run: node verify.mjs
      - id: structure
        continue-on-error: true
        run: |
          test -f index.html
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test -f TEST_PROJECT.json
          test ! -f agent-workflow.js
          test ! -f prompt-center.js
          node - <<'NODE'
          const p=require('./TEST_PROJECT.json');
          if(p.schema!=='closed-loop-project/30'||p.job?.currentStage!==30||Object.keys(p.stageRecords||{}).length!==30)process.exit(1);
          const text=JSON.stringify(p);
          if(/application conformance|Evaluate the Closed-Loop Reliability application/i.test(text))process.exit(1);
          if(!p.userEntries?.[0]?.objective?.includes('GEN-042'))process.exit(1);
          if(p.runs?.length!==20||p.verification?.length!==p.requirements.length*20)process.exit(1);
          NODE
      - name: Publish source statuses
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', PROJECT: '${{ steps.project.outcome }}', HUMAN: '${{ steps.human.outcome }}', LIVE: '${{ steps.live_verifier.outcome }}', VERIFIER: '${{ steps.verifier.outcome }}', STRUCTURE: '${{ steps.structure.outcome }}'}
        run: |
          target="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for pair in "retained-real-project:$PROJECT" "human-ui-syntax:$HUMAN" "live-verifier-syntax:$LIVE" "30-stage-repository-verifier:$VERIFIER" "single-app-structure:$STRUCTURE"; do
            context="${pair%%:*}"; result="${pair#*:}"; state=failure; [ "$result" = success ] && state=success
            gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context="$context" -f description="$context $result" -f target_url="$target"
          done
      - name: Enforce source verification
        run: |
          test '${{ steps.project.outcome }}' = success
          test '${{ steps.human.outcome }}' = success
          test '${{ steps.live_verifier.outcome }}' = success
          test '${{ steps.verifier.outcome }}' = success
          test '${{ steps.structure.outcome }}' = success

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build the same retained real project used in deployment
        run: node build-test-project.mjs
      - name: Confirm runner browser
        run: |
          BROWSER="$(command -v google-chrome || command -v chrome || command -v chromium || true)"
          test -n "$BROWSER"
          "$BROWSER" --version
      - id: identity
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p live-proof
          verified=false
          FILES=(index.html human-ui.js TEST_PROJECT.json verify-live.mjs)
          for attempt in $(seq 1 36); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"; good=true
            for f in "${FILES[@]}"; do curl -fsSL "${PAGE_URL%/}/$f?verify=$nonce" -o "live-proof/$f" || good=false; done
            if $good; then
              exact=true
              for f in "${FILES[@]}"; do [[ "$(sha256sum "$f"|awk '{print $1}')" == "$(sha256sum "live-proof/$f"|awk '{print $1}')" ]] || exact=false; done
              $exact && verified=true && break
            fi
            sleep 5
          done
          test "$verified" = true
      - name: Start 320px interaction browser
        run: |
          BROWSER="$(command -v google-chrome || command -v chrome || command -v chromium)"
          rm -rf /tmp/live-e2e
          "$BROWSER" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/live-e2e --window-size=320,800 about:blank >/tmp/live-chrome.log 2>&1 &
          for n in $(seq 1 50); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && exit 0; sleep .2; done
          cat /tmp/live-chrome.log
          exit 1
      - id: workflow_interaction
        continue-on-error: true
        run: |
          set -o pipefail
          node verify-live.mjs workflow 2>&1 | tee live-proof/workflow-interaction.log
      - id: history_interaction
        continue-on-error: true
        run: |
          set -o pipefail
          node verify-live.mjs history 2>&1 | tee live-proof/history-interaction.log
      - id: reset_interaction
        continue-on-error: true
        run: |
          set -o pipefail
          node verify-live.mjs reset 2>&1 | tee live-proof/reset-interaction.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'live-proof-${{ github.run_id }}', path: live-proof, if-no-files-found: error}
      - name: Publish live verification statuses
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', IDENTITY: '${{ steps.identity.outcome }}', WORKFLOW: '${{ steps.workflow_interaction.outcome }}', HISTORY: '${{ steps.history_interaction.outcome }}', RESET: '${{ steps.reset_interaction.outcome }}'}
        run: |
          target="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for pair in "live-file-identity:$IDENTITY" "live-320px-workflow:$WORKFLOW" "live-project-history:$HISTORY" "live-new-project-reset:$RESET"; do
            context="${pair%%:*}"; result="${pair#*:}"; state=failure; [ "$result" = success ] && state=success
            gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context="$context" -f description="$context $result" -f target_url="$target"
          done
      - name: Enforce live verification
        run: |
          test '${{ steps.identity.outcome }}' = success
          test '${{ steps.workflow_interaction.outcome }}' = success
          test '${{ steps.history_interaction.outcome }}' = success
          test '${{ steps.reset_interaction.outcome }}' = success
