name: Materialize proposal-label repair
on:
  push:
    branches: [fix/restore-pages-workflow-after-repair]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve required proposal labels and restore workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('app-core.js'); s=p.read_text(); start=s.index('function proposalMarkup(n)'); end=s.index('\nfunction stageConfirmationMarkup',start); f=s[start:end]
          replacements=[('recordType:',"'Record type':"),('temporaryKey:',"'Response temporary key':"),('canonicalId:',"'Canonical ID to be assigned':"),('field:',"'Field or relationship':"),('currentValue:',"'Current value':"),('proposedValue:',"'Proposed value':"),('jsonPointer:',"'JSON pointer':"),('evidence:',"'Evidence reference':"),('validation:',"'Validation status':")]
          for old,new in replacements: f=f.replace(old,new,1)
          p.write_text(s[:start]+f+s[end:])
          subprocess.run(['git','fetch','origin','b771f38117d36ed4be4e267dee587902e8a82946','--depth=1'],check=True)
          original=subprocess.check_output(['git','show','b771f38117d36ed4be4e267dee587902e8a82946:.github/workflows/pages.yml'],text=True)
          Path('.github/workflows/pages.yml').write_text(original)
      - name: Commit materialized repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js .github/workflows/pages.yml
          git commit -m "Preserve current-value labels in Stage 01 proposal review"
          git push