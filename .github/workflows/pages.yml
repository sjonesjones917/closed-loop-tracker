           try{const files=await Promise.race([browser.download('#export-pre-delivery-checkpoint'),stopping.then(()=>{throw new Error('Diagnostic interrupted during original action');})]);result.originalAction={outcome:'COMPLETED_WITHIN_ORIGINAL_DRIVER_LIMITS',elapsedMs:Date.now()-actionStarted,downloads:files.map(f=>({filename:f.filename,sha256:f.sha256,byteSize:f.bytes.length,path:f.path})),notFullJourneyPass:true};}
           catch(e){result.originalAction={outcome:'FAILED_ORIGINAL_ACTION',elapsedMs:Date.now()-actionStarted,error:String(e.stack||e),code:e.code||null,timeoutMs:e.timeoutMs||null,verifierObservation:e.verifierObservation||null};}
           save('original-action.json',result.originalAction);await stopProfiles();
           if(!interrupted&&result.originalAction.outcome==='FAILED_ORIGINAL_ACTION'){
            await startProfiles('passive-after-original-failure');
            while(!interrupted&&Date.now()<captureEnds){recordDescendants();try{await discoverTargets();const observation=await snapshot();log('passive-observations.jsonl',{elapsedSinceClickMs:Date.now()-actionStarted,observation});if(observation.ready&&!observation.inert&&observation.busy!=='true'){result.eventualInteractive={elapsedSinceClickMs:Date.now()-actionStarted,observation};break;}}catch(e){log('passive-observations.jsonl',{error:String(e)});}await Promise.race([delay(5000),stopping]);}
           }
           await stopProfiles(); // Exclude the following diagnostic project read from passive CPU samples.
           if(!interrupted&&Date.now()<captureEnds&&(!result.originalAction?.error||result.eventualInteractive)){try{const after=await bounded(browser.readWorkflow([30]),'final stored state',Math.max(1,Math.min(20000,captureEnds-Date.now())));save('after-state.json',{jobId:after.project.job.JOB_ID,revision:after.project.revision,projectSha256:after.project.projectSha256,workflow:after.workflow});}catch(e){save('after-state-error.json',{error:String(e)});}}
          }catch(e){result.setupOrDiagnosticError=String(e.stack||e);process.exitCode=1;}
          finally{
           finalizing=true;clearTimeout(cap);result.interrupted=interrupted;recordDescendants();
           if(connection)try{await bounded(stopProfiles(),'final CPU profile capture',20000);}catch(error){result.profileGaps.push({phase:'finalization',error:String(error)});log('profiles.jsonl',{phase:'finalization',error:String(error)});}
           if(browser){save('driver-events.json',browser.events);save('driver-exceptions.json',browser.exceptions());try{save('final-runtime-observation.json',await bounded(browser.executionEvidence(),'final strict observer'));}catch(e){log('diagnostic-errors.jsonl',{phase:'runtime-observation',error:String(e)});}try{await browser.close();}catch(e){log('diagnostic-errors.jsonl',{phase:'native-driver-close',error:String(e)});}}
           if(connection)connection.close();
           if(server&&server.exitCode===null&&server.signalCode===null){serverShutdownRequested=true;server.kill('SIGTERM');}
           for(let i=0;i<100;i++){const live=[...observedProcesses.values()].filter(old=>{const current=proc(old.pid);return current&&current.startedTicks===old.startedTicks&&current.state!=='Z';});if(!live.length&&(!opening||openingSettled)&&(!server||server.exitCode!==null||server.signalCode!==null)){cleanupComplete=true;break;}await delay(100);}
           const completed=[];for(const e of downloadEvents.filter(e=>e.method==='Browser.downloadProgress'&&e.params.state==='completed')){const {guid,receivedBytes}=e.params;assert.match(guid,/^[a-zA-Z0-9-]+$/);const file=path.join(out,'replay/downloads',guid);try{const bytes=fs.readFileSync(file);assert.equal(bytes.length,receivedBytes);completed.push({guid,path:file,byteSize:bytes.length,sha256:sha(bytes),suggestedFilename:downloadEvents.find(x=>x.method==='Browser.downloadWillBegin'&&x.params.guid===guid)?.params.suggestedFilename||null});}catch(error){completed.push({guid,error:String(error)});}}save('native-downloads.json',completed);
           result.cleanup={complete:cleanupComplete,driverClose:'Unchanged driver SIGKILL; only the owned live HTTP child receives SIGTERM',openingSettled,serverExit,serverError,observedProcesses:[...observedProcesses.values()],stillLive:[...observedProcesses.values()].filter(old=>{const n=proc(old.pid);return n&&n.startedTicks===old.startedTicks&&n.state!=='Z';})};
           result.finishedAt=new Date().toISOString();result.elapsedMs=Date.now()-started;result.sourceClean=git('status','--porcelain')==='';result.sourceCommitAfter=git('rev-parse','HEAD');
           save('diagnostic-result.json',result);if(!cleanupComplete||result.profileGaps.length||serverError||serverExit?.shutdownRequested!==true||!result.sourceClean||result.sourceCommitAfter!==EXPECTED||interrupted)process.exitCode=1;
           console.log(JSON.stringify({diagnosticOnly:true,eligibleVerificationReceipt:false,originalAction:result.originalAction?.outcome||null,eventualInteractiveMs:result.eventualInteractive?.elapsedSinceClickMs||null,cleanupComplete,setupOrDiagnosticError:result.setupOrDiagnosticError||null}));
           process.removeListener('SIGTERM',onSignal);process.removeListener('SIGINT',onSignal);
          }
          REPLAY
          cat > "$RUNNER_TEMP/supervisor.mjs" <<'SUPERVISOR'
          // Source-owned bounded process cleanup, not a verification owner or receipt.
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {pathToFileURL} from 'node:url';
          const [replay,outArg]=process.argv.slice(2),out=path.resolve(outArg),source=process.cwd();
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'315f85b3dc34c274e4470fe4e84e9dcebc9a1551');
          assert.equal(execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim(),'');
          assert(!process.env.NODE_OPTIONS,'No receipt preload or inherited heap override');
          for(const key of Object.keys(process.env))assert(!/^(CLOSED_LOOP_|VERIFIER_|CONFORMANCE_)/.test(key),'Unexpected inherited owner/receipt environment: '+key);
          const {executeGate}=await import(pathToFileURL(path.join(source,'verify-conformance-regressions.mjs')));
          const controller=new AbortController(),relay=signal=>controller.abort(signal);
          process.on('SIGTERM',relay);process.on('SIGINT',relay);
          try{
           const result=await executeGate({name:'checkpoint-diagnostic',command:process.execPath,args:[path.resolve(replay),out]}, {cwd:source,directory:path.join(out,'supervisor'),signal:controller.signal,timeoutMs:900000,killGraceMs:10000,maxOutputBytes:64*1024*1024,forwardOutput:true,requireJson:false});
           fs.writeFileSync(path.join(out,'supervisor-result.json'),JSON.stringify({diagnosticOnly:true,eligibleVerificationReceipt:false,notCompleteJourney:true,sourceRoot:source,...result},null,2)+'\n');
           if(result.exitCode!==0||result.signal||result.reason||result.error)process.exitCode=1;
          }finally{process.removeListener('SIGTERM',relay);process.removeListener('SIGINT',relay);}
          SUPERVISOR
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/replay.mjs" "$RUNNER_TEMP/supervisor.mjs" "$DIAG_OUT/"
      - name: Restore an authenticated disposable native-profile copy
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/restore.py" --archive "$DIAG_OUT/original.zip" --directory "$DIAG_OUT/replay" | tee "$DIAG_OUT/restore.log"
      - name: Build the unchanged original source with original provenance
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          test "$(git rev-parse 'HEAD^{tree}')" = 24735288da9f734997c1920c111ad4d472e743e5
          test -z "$(git status --porcelain)"
          echo '8352b036eca02dfd86bb441df4ea3fe0ea54b9ad6bcaaee9a000219ddfae09c5  TEST_PROJECT.json' | sha256sum --check
          node build-static-site.mjs --out "$DIAG_OUT/site" --source-commit 315f85b3dc34c274e4470fe4e84e9dcebc9a1551 --workflow-run 42374851354 | tee "$DIAG_OUT/build.log"
          test -z "$(git status --porcelain)"
      - name: Capture one original-budget click and bounded passive diagnosis
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/supervisor.mjs" "$RUNNER_TEMP/replay.mjs" "$DIAG_OUT"
      - name: Preserve original archive identity and final source state
        if: always()
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$DIAG_OUT/source-commit-after.txt"
          git status --porcelain > "$DIAG_OUT/source-status-after.txt"
          if test -f "$DIAG_OUT/original.zip"; then
            sha256sum "$DIAG_OUT/original.zip" > "$DIAG_OUT/original-archive-after.sha256"
            echo 'b6a35d9e0eda405d69a240008c444a0502df96c1f2b17c42d696b44d3f295e56  '"$DIAG_OUT/original.zip" | sha256sum --check
          fi
          test -z "$(git status --porcelain)"
      - name: Retain diagnostic artifacts without creating acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-only-stage30-50f53978-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint-diagnostic
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
