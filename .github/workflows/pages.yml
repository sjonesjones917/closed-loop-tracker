name: Verify, test, and deploy the single workbook app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check workbook.js
      - run: node verify.mjs
      - run: |
          test -f index.html
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
      - name: Publish test status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='workbook-test-project' -f description='Workbook verification'
  deploy:
    if: github.event_name != 'pull_request'
    needs: test-project
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish deployment status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='single-workbook-pages' -f description='Exact tested workbook deployed'
  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test-project, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact deployed files
        run: |
          set -euo pipefail; mkdir -p live-proof; verified=false
          for attempt in $(seq 1 48); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl -fsSL "${PAGE_URL%/}/index.html?verify=$nonce" -o live-proof/index.html && curl -fsSL "${PAGE_URL%/}/workbook.js?verify=$nonce" -o live-proof/workbook.js && curl -fsSL "${PAGE_URL%/}/TEST_PROJECT.json?verify=$nonce" -o live-proof/TEST_PROJECT.json; then
              if [[ "$(sha256sum index.html|awk '{print $1}')" == "$(sha256sum live-proof/index.html|awk '{print $1}')" && "$(sha256sum workbook.js|awk '{print $1}')" == "$(sha256sum live-proof/workbook.js|awk '{print $1}')" && "$(sha256sum TEST_PROJECT.json|awk '{print $1}')" == "$(sha256sum live-proof/TEST_PROJECT.json|awk '{print $1}')" ]]; then verified=true; break; fi
            fi
            sleep 5
          done
          test "$verified" = true
      - name: Render phone UI and open test project
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || true)"; test -n "$BROWSER"
          URL="${PAGE_URL%/}/?verify=${GITHUB_SHA}"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=16000 --window-size=393,852 --dump-dom "$URL" > live-proof/blank.html
          grep -q 'Test project' live-proof/blank.html
          grep -q '01 INITIALIZE THE JOB' live-proof/blank.html
          ! grep -q 'APPENDIX A–F — OPERATIONAL CONTROLS' live-proof/blank.html
      - name: Publish live status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='live-workbook-ui' -f description='Rendered live phone UI verified'
