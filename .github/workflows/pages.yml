name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mobile_acceptance_target_json:
        description: Pinned physical-iPhone acceptance target JSON for the exact currently deployed main commit
        required: false
        type: string
      mobile_acceptance_evidence_json:
        description: Physical-iPhone mobile-acceptance-evidence JSON bound to the submitted target
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: tar --exclude=.git -czf /tmp/pr-source.tar.gz .
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do
            node --check "$file"
          done

      - name: Deployment manifest, build identity, and reproducibility
        run: |
          set -euo pipefail
          node verify-deployment-manifest.mjs

      - name: Physical iPhone release-tag governance
        run: |
          set -euo pipefail
          node verify-mobile-release-governance.mjs

      - name: Schema, ownership, and single-architecture proof
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs

      - name: Migration and v3 contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion and negative cases
        run: |
          set -euo pipefail
          node verify-ingestion.mjs

      - name: Workflow, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-production-baseline.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs

      - name: Prompt semantics and leakage
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs

      - name: Local Chromium operator path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    name: Deploy exact verified bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild retained fixture from verified source
        run: node build-test-project.mjs
      - name: Build static application
        run: |
          set -euo pipefail
          node build-static-site.mjs --out _site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-live:
    name: Verify deployed bytes and operator path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild retained fixture used by deployment
        run: node build-test-project.mjs
      - name: Exact deployed-byte verification
        run: node verify-live.mjs
      - name: Deployed Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    name: Publish machine acceptance status
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    env:
      TEST_RESULT: ${{ needs.test.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      LIVE_RESULT: ${{ needs.verify-live.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild retained fixture for acceptance
        run: node build-test-project.mjs
      - name: Evaluate submitted physical-iPhone evidence
        if: github.event_name == 'workflow_dispatch' && inputs.mobile_acceptance_target_json != '' && inputs.mobile_acceptance_evidence_json != ''
        env:
          MOBILE_TARGET_JSON: ${{ inputs.mobile_acceptance_target_json }}
          MOBILE_EVIDENCE_JSON: ${{ inputs.mobile_acceptance_evidence_json }}
        run: |
          set -euo pipefail
          printf '%s' "$MOBILE_TARGET_JSON" > /tmp/mobile-target.json
          printf '%s' "$MOBILE_EVIDENCE_JSON" > /tmp/mobile-evidence.json
          node evaluate-mobile-acceptance-submission.mjs /tmp/mobile-target.json /tmp/mobile-evidence.json > /tmp/mobile-evaluation.json
      - name: Publish acceptance evidence
        id: acceptance
        env:
          MOBILE_EVALUATION_FILE: /tmp/mobile-evaluation.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const vm=require('vm');const cp=require('child_process');const crypto=require('crypto');
          const fullCycle=JSON.parse(cp.execFileSync(process.execPath,['verify-full-cycle.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const ingestion=JSON.parse(cp.execFileSync(process.execPath,['verify-ingestion.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const definition=JSON.parse(cp.execFileSync(process.execPath,['verify-definition-of-done.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const v3=JSON.parse(cp.execFileSync(process.execPath,['verify-v3-definition-of-done.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const routeClosure=JSON.parse(cp.execFileSync(process.execPath,['verify-route-oracle.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const dataRoute=JSON.parse(cp.execFileSync(process.execPath,['verify-data-route-closure.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const infrastructureRoute=JSON.parse(cp.execFileSync(process.execPath,['verify-infrastructure-route-closure.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const mobileGovernance=JSON.parse(cp.execFileSync(process.execPath,['verify-mobile-release-governance.mjs'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).at(-1));
          const negativeOut=cp.execFileSync(process.execPath,['verify-complete.mjs'],{encoding:'utf8'});
          const negativeMatches=[...negativeOut.matchAll(/"negativeCases"\s*:\s*(\d+)/g)];
          if(!negativeMatches.length)throw new Error('No complete negative-case count found.');
          const load=(f)=>{const c={console,globalThis:null,Blob:global.Blob,crypto:crypto.webcrypto,TextEncoder,TextDecoder,setTimeout,clearTimeout,structuredClone};c.globalThis=c;c.window=c;c.require=require;vm.createContext(c);vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f});return c;};
          const c=load('workbook.js');for(const f of ['hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js'])vm.runInContext(fs.readFileSync(f,'utf8'),c,{filename:f});
          const blank=c.WORKBOOK.createBlankProject();
          blank.EXACT_USER_OBJECTIVE_VERBATIM='Acceptance fixture';
          blank.artifacts.push({ARTIFACT_ID:'ART-MACHINE-1',ORIGINAL_FILENAME:'input.txt',BYTE_SIZE:1,SHA256:'a'.repeat(64),STORAGE_STATE:'VERIFIED_AVAILABLE',STATUS:'CURRENT'});
          blank.rawInputUnits=[{RAW_UNIT_ID:'RAW-1',UNIT_KIND:'HUMAN_TEXT',SOURCE_KIND:'HUMAN_TEXT',SOURCE_REF:'EXACT_USER_OBJECTIVE_VERBATIM',ARTIFACT_ID:null,LOCATION:'text:0-17',CONTENT_SHA256:'b'.repeat(64),STATUS:'CURRENT'}];
          blank.stage01Accounting=[{RAW_UNIT_ID:'RAW-1',DISPOSITION:'EXTRACTED_RELEVANT_INFORMATION',EXTRACTED_STATEMENT_IDS:['STAT-1'],SOURCE_LOCATIONS:['text:0-17']}];
          blank.stage01SemanticStatements=[{STATEMENT_ID:'STAT-1',KIND:'REQUESTED_OUTPUT',TEXT:'Acceptance fixture',SOURCE_UNIT_IDS:['RAW-1'],SOURCE_LOCATIONS:['text:0-17'],CURRENT:true}];
          blank.stage01InspectionClaims=[];
          blank.stage04Obligations=[{OBLIGATION_ID:'OBL-1',ORIGIN_CLASS:'HUMAN',SOURCE_ID:'RAW-1',SOURCE_LOCATION:'text:0-17',VALUE_HASH:'c'.repeat(64),VERSION:'INPUT-V1',PROVENANCE_ID:'STAT-1',CURRENT:true}];
          blank.stage04Accounting=[{OBLIGATION_ID:'OBL-1',DISPOSITION:'ATOMIC_REQUIREMENTS',REQUIREMENT_IDS:['REQ-M1']}];
          blank.requirements=[{REQ_ID:'REQ-M1',REQUIREMENT_CLASS:'MANDATORY',STATUS:'CURRENT',CURRENT:true}];
          const stage01=c.ClosedLoopEngine.evaluateStage01IntakeAccounting(blank);
          const stage04=c.ClosedLoopEngine.evaluateStage04ObligationCoverage(blank);
          const stage01RawInputAccounting=stage01.complete?1:0;
          const stage01RequiredFileInspectionAccounting=stage01.missingRequiredFiles?.length===0?1:0;
          const stage01AcceptedSemanticMappingCoverage=stage01.missingStatementIds?.length===0?1:0;
          const stage04ObligationAccounting=stage04.complete?1:0;
          let mobileAcceptance={
            actualIPhoneSafariAcceptance:false,
            mobileAcceptanceResult:'BLOCKED_ENVIRONMENT',
            mobileAcceptanceTargetId:null,
            mobileAcceptanceChallenge:null,
            mobileAcceptanceEvidenceId:null,
            mobileAcceptanceEvidenceBasis:null,
            mobileAcceptanceCommit:null,
            mobileAcceptanceDeploymentManifestSha256:null,
            mobileAcceptanceOrigin:null,
            mobileAcceptanceTestProjectId:null,
            mobileAcceptancePerformer:null,
            mobileAcceptanceIdentityAssurance:null,
            mobileAcceptanceDeviceModel:null,
            mobileAcceptanceIosVersion:null,
            mobileAcceptanceSafariUserAgent:null,
            mobileAcceptanceWebKitBuild:null,
            mobileAcceptanceViewport:null,
            mobileAcceptanceCapabilityProbe:null,
            mobileAcceptanceOperatorReceipts:null,
            mobileAcceptanceSubmitter:null,
            mobileAcceptanceSubmitterAuthenticated:false,
            mobileAcceptanceVerificationTime:null,
            physicalIPhoneJobResult:'blocked_environment'
          };
          const evalFile=process.env.MOBILE_EVALUATION_FILE;
          if(evalFile&&fs.existsSync(evalFile)){
            const evaluated=JSON.parse(fs.readFileSync(evalFile,'utf8'));
            if(evaluated.mobileAcceptanceResult!=='ACCEPTED')throw new Error(`Submitted physical-iPhone evidence was rejected: ${JSON.stringify(evaluated)}`);
            mobileAcceptance={...mobileAcceptance,...evaluated,actualIPhoneSafariAcceptance:true,physicalIPhoneJobResult:'success'};
          }
          if(routeClosure.routeOracle!=='PASS')throw new Error('Route oracle did not pass.');
          if(dataRoute.dataRouteClosure!=='PASS')throw new Error('Canonical data-route proof did not pass.');
          if(infrastructureRoute.infrastructureRouteClosure!=='PASS')throw new Error('Infrastructure route-closure proof did not pass.');
          if(mobileGovernance.mobileReleaseGovernance!=='PASS')throw new Error('Physical-iPhone release-tag governance proof did not pass.');
          const finalAcceptancePublication=mobileAcceptance.actualIPhoneSafariAcceptance===true&&mobileAcceptance.mobileAcceptanceResult==='ACCEPTED';
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            contractProfileId:'closed-loop-completion-profile/1',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            stageCount:30,
            ...definition,
            ...v3,
            dataRouteClosure:dataRoute.dataRouteClosure,
            infrastructureRouteClosure:infrastructureRoute.infrastructureRouteClosure,
            routeOperationsChecked:dataRoute.operationsChecked,
            routeCanonicalFamilies:dataRoute.canonicalFamilies,
            routeReadEdgesChecked:dataRoute.readEdgesChecked,
            routeWritableCollectionsChecked:dataRoute.writableCollectionsChecked,
            routeWritableFieldsChecked:dataRoute.writableFieldsChecked,
            routeRelationshipDefinitionsChecked:dataRoute.relationshipDefinitionsChecked,
            routeInvalidationStagesChecked:dataRoute.invalidationStagesChecked,
            routeCurrentScopeStaleExclusion:dataRoute.currentScopeStaleExclusion,
            routePromptReadSerialization:dataRoute.promptReadSerialization,
            routeResponseAuthorizationClosure:dataRoute.responseAuthorizationClosure,
            routeProvenanceContractClosure:dataRoute.provenanceContractClosure,
            routeDownstreamForwardingClosure:dataRoute.downstreamForwardingClosure,
            routeDownstreamOnlyInvalidation:dataRoute.downstreamOnlyInvalidation,
            routeSubjectNeutralPromptAuthority:dataRoute.subjectNeutralPromptAuthority,
            routeHumanExperiencePromptContract:dataRoute.humanExperiencePromptContract,
            infrastructureFamiliesChecked:infrastructureRoute.infrastructureFamilies,
            infrastructureRawFirstCapture:infrastructureRoute.rawFirstCapture,
            infrastructurePrecommitRevalidation:infrastructureRoute.precommitRevalidation,
            infrastructureExtractionManifestProvenance:infrastructureRoute.extractionManifestProvenance,
            infrastructurePromptContextManifestRoute:infrastructureRoute.promptContextManifestRoute,
            infrastructureAuthorityPartitionsSeparated:infrastructureRoute.authorityPartitionsSeparated,
            infrastructureCurrentScopeRoute:infrastructureRoute.currentScopeRoute,
            infrastructurePersistenceIntegrityRoute:infrastructureRoute.persistenceIntegrityRoute,
            infrastructureStructuredOperatorActionRoute:infrastructureRoute.structuredOperatorActionRoute,
            currentScopeSelectorCoverage:definition.currentScopeSelectorCoverage,
            exactReqRunTestCoverage:definition.exactReqRunTestCoverage,
            applicableCurrentRegressionSuccess:definition.applicableCurrentRegressionSuccess,
            mandatoryEvidenceChainStructuralCoverage:definition.mandatoryEvidenceChainCoverage,
            mandatoryEvidenceSufficiencyCoverage:v3.mandatoryEvidenceSufficiencyCoverage,
            releaseArtifactIdentityCoverage:definition.releaseArtifactIdentityCoverage,
            unauthorizedFieldMutationsAccepted:definition.unauthorizedFieldMutationsAccepted,
            canonicalMutationsBeforeAcceptance:definition.canonicalMutationsBeforeAcceptance,
            partialCommitsAfterInjectedFailure:definition.partialCommitsAfterInjectedFailure,
            staleProposalsAccepted:definition.staleProposalsAccepted,
            crossProjectRelationshipsAccepted:definition.crossProjectRelationshipsAccepted,
            historicalScopeSatisfyingCurrentGates:definition.historicalScopeSatisfyingCurrentGates,
            unmatchedDeliveryFilesAuthorized:definition.unmatchedDeliveryFilesAuthorized,
            appendOnlyHistoryRewritesAccepted:definition.appendOnlyHistoryRewritesAccepted,
            unsupportedTestIrTreatedAsExecutable:v3.unsupportedTestIrTreatedAsExecutable,
            externalAssertionsOverridingApplicationProof:v3.externalAssertionsOverridingApplicationProof,
            nativeExecutionReceiptsFabricatedExternally:v3.nativeExecutionReceiptsFabricatedExternally,
            releaseAcceptedWithContradiction:v3.releaseAcceptedWithContradiction,
            stage01RawInputAccounting,
            stage01RequiredFileInspectionAccounting,
            stage01AcceptedSemanticMappingCoverage,
            stage04ObligationAccounting,
            stagesCompleted:Number(fullCycle.stagesCompleted||0),
            negativeCasesPassed:Number(negativeMatches.at(-1)[1]),
            deployedByteIdentity:process.env.LIVE_RESULT==='success',
            deploymentManifestSchema:'closed-loop-deployment-manifest/1',
            finalDeploymentResourceIdentityCoverage:process.env.LIVE_RESULT==='success'?1:0,
            localChromiumAcceptance:process.env.TEST_RESULT==='success',
            deployedChromiumAcceptance:process.env.LIVE_RESULT==='success',
            testedBrowserWidths:[320,393,'desktop'],
            mobileReleaseTagGovernanceCoverage:Number(mobileGovernance.mobileReleaseGovernance==='PASS'),
            ...mobileAcceptance,
            finalAcceptancePublication,
            releaseTagEligible:finalAcceptancePublication,
            realThirtyStageProjectAcceptance:false,
            fullProductionMaturity:false,
            jobResults:{test:process.env.TEST_RESULT,deploy:process.env.DEPLOY_RESULT,live:process.env.LIVE_RESULT,physicalIPhone:mobileAcceptance.physicalIPhoneJobResult},
            nextProofStep:finalAcceptancePublication?'Create the release tag for this exact accepted commit.':'Pinned actual-iPhone Safari acceptance for the exact deployed commit and deployment manifest.',
            proofSources:{
              ownership:'verify.mjs',
              canonicalDataRoutes:'verify-data-route-closure.mjs',
              infrastructureRoutes:'verify-infrastructure-route-closure.mjs',
              migration:'verify-v3-migration.mjs',
              stage01:'verify-stage01-intake-closure.mjs',
              stage01Reuse:'verify-one-time-intent-intake.mjs',
              stage04:'verify-zero-loss-accounting.mjs',
              testIr:'verify-test-runtime-v3.mjs',
              limits:'verify-test-runtime-limits.mjs',
              ingestion:'verify-ingestion.mjs',
              workflow:'verify-complete.mjs',
              fullCycle:'verify-full-cycle.mjs',
              prompts:'verify-prompt-semantics.mjs',
              localBrowser:'verify-browser.mjs and verify-browser-extra.mjs',
              deployedIdentity:'verify-live.mjs or evaluate-mobile-acceptance-submission.mjs exact deployed manifest/resource verification',
              deploymentManifest:'build-static-site.mjs and verify-deployment-manifest.mjs',
              deployedBrowser:'verify-browser.mjs and verify-browser-extra.mjs',
              physicalIPhoneReleaseGovernance:'verify-mobile-release-governance.mjs',
              physicalIPhoneAcceptance:finalAcceptancePublication?`${mobileAcceptance.mobileAcceptanceEvidenceId} (${mobileAcceptance.mobileAcceptanceEvidenceBasis})`:'BLOCKED_ENVIRONMENT or BLOCKED: current physical-device evidence did not satisfy the gate'
            }
          };
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          if(!process.env.GITHUB_OUTPUT)throw new Error('GITHUB_OUTPUT is unavailable.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `actual_iphone=${report.actualIPhoneSafariAcceptance}`,
            `final_acceptance=${report.finalAcceptancePublication}`,
            ''
          ].join('\n'));
          NODE
      - name: Upload acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-loop-acceptance-${{ github.sha }}-${{ github.run_id }}
          path: closed-loop-acceptance.json
      - name: Record blocked actual-iPhone acceptance
        if: steps.acceptance.outputs.final_acceptance != 'true'
        run: |
          set -euo pipefail
          echo "::notice title=Release tag blocked::Actual-iPhone Safari acceptance is not proven for ${GITHUB_SHA}; no release tag was created."
          test "${{ steps.acceptance.outputs.actual_iphone }}" = false
      - name: Create release tag only after deployed and actual-iPhone proof
        if: steps.acceptance.outputs.final_acceptance == 'true'
        run: |
          set -euo pipefail
          TAG="acceptance-${GITHUB_SHA::12}"
          CHALLENGE="$(node -e "const r=require('./closed-loop-acceptance.json');const c=String(r.mobileAcceptanceChallenge||'').toLowerCase();if(!/^[0-9a-f]{32,}$/.test(c))process.exit(2);process.stdout.write(c);")"
          CHALLENGE_TAG="mobile-acceptance-challenge-$CHALLENGE"
          git config user.name closed-loop-release
          git config user.email closed-loop-release@users.noreply.github.com
          test -z "$(git ls-remote --tags origin "refs/tags/$CHALLENGE_TAG" | awk '{print $1}')"
          EXISTING="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$GITHUB_SHA"
          fi
          git tag "$CHALLENGE_TAG" "$GITHUB_SHA"
          if [ -z "$EXISTING" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$CHALLENGE_TAG" "refs/tags/$TAG"
          else
            git push origin "refs/tags/$CHALLENGE_TAG"
          fi
