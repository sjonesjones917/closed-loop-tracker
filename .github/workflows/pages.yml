name: Diagnostic original startup refusal details on frozen 50f53978

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-stage30-startup-inspection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage30-startup-inspection-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIAG_OUT: ${{ github.workspace }}/stage30-startup-inspection-diagnostic
      BROWSER: /usr/bin/google-chrome
      NODE_OPTIONS: ''
    steps:
      - name: Check out the exact original tested application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Require the original runtime and fresh diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DIAG_OUT"
          mkdir "$DIAG_OUT"
          node --version | tee "$DIAG_OUT/node-version.txt"
          "$BROWSER" --product-version | tee "$DIAG_OUT/chrome-version.txt"
          test "$(node --version)" = v22.23.3
          test "$("$BROWSER" --product-version)" = 156.0.8078.79
          uname -a > "$DIAG_OUT/uname.txt"
          python3 - <<'IDENTITY'
          import json, os
          from pathlib import Path
          fields=('GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF')
          (Path(os.environ['DIAG_OUT'])/'diagnostic-workflow-identity.json').write_text(json.dumps({key:os.environ[key] for key in fields},indent=2)+'\n')
          IDENTITY
      - name: Authenticate the exact suffix artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/sjonesjones917/closed-loop-tracker/actions/artifacts/13587783254 > "$DIAG_OUT/original-artifact-metadata.json"
          python3 - <<'METADATA'
          import json, os
          from pathlib import Path
          metadata=json.loads((Path(os.environ['DIAG_OUT'])/'original-artifact-metadata.json').read_text())
          assert metadata['id']==13587783254
          assert metadata['size_in_bytes']==2372016040
          assert metadata['digest']=='sha256:2b270a5ad66b220dcfd75f9adb15aeed25443d4a93c1343eb508b8b05084cf69'
          assert metadata['expired'] is False
          assert metadata['workflow_run']['id']==42403368280
          assert metadata['workflow_run']['repository_id']==1341211619
          assert metadata['workflow_run']['head_repository_id']==1341211619
          assert metadata['workflow_run']['head_sha']=='30690ad61bb1694588768d49117e8fa9b0e3f903'
          assert metadata['workflow_run']['head_branch']=='diagnostic/stage30-suffix-50f53978'
          METADATA
          test ! -e "$RUNNER_TEMP/stage30-startup-inspection-original.zip"
          gh api repos/sjonesjones917/closed-loop-tracker/actions/artifacts/13587783254/zip > "$RUNNER_TEMP/stage30-startup-inspection-original.zip"
      - name: Materialize the reviewed external helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$DIAG_OUT/runner-helpers"
          cat > "$DIAG_OUT/runner-helpers/restore-profile.py" <<'FROZEN_HELPER_0'
          #!/usr/bin/env python3
          """Restore only the authenticated synthetic native profile into a fresh copy.

          This diagnostic utility neither changes an original artifact nor creates test
          receipts. It is intended for the isolated Linux runner, not the active Mac run.
          """
          import argparse
          import hashlib
          import json
          import pathlib
          import stat
          import zipfile

          ARTIFACT_SHA256 = '2b270a5ad66b220dcfd75f9adb15aeed25443d4a93c1343eb508b8b05084cf69'
          ARTIFACT_BYTES = 2372016040
          PREFIX = 'replay/profile/'
          PROFILE_FILES = 5578
          PROFILE_BYTES = 1323811861
          CHROME_VERSION = '156.0.8078.79'


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def sha256_file(file):
              value = hashlib.sha256()
              with file.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(chunk)
              return value.hexdigest()


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--archive', type=pathlib.Path, required=True)
              parser.add_argument('--directory', type=pathlib.Path, required=True)
              args = parser.parse_args()
              archive = args.archive.resolve(strict=True)
              output = args.directory.resolve()
              require(archive.is_file(), 'Original archive is not a regular file')
              require(archive.stat().st_size == ARTIFACT_BYTES, 'Original archive size mismatch')
              require(sha256_file(archive) == ARTIFACT_SHA256, 'Original archive SHA-256 mismatch')
              require(not output.exists(), 'Diagnostic browser directory must be fresh')
              with zipfile.ZipFile(archive) as zipped:
                  members = [item for item in zipped.infolist() if item.filename.startswith(PREFIX)]
                  require(len(members) == PROFILE_FILES, 'Original profile member count mismatch')
                  require(sum(item.file_size for item in members) == PROFILE_BYTES, 'Original profile byte count mismatch')
                  seen = set()
                  selected = []
                  for item in members:
                      suffix = item.filename[len(PREFIX):]
                      relative = pathlib.PurePosixPath(suffix)
                      require(suffix and not relative.is_absolute(), 'Invalid profile path')
                      require(all(part not in ('', '.', '..') for part in suffix.split('/')), 'Noncanonical profile path')
                      require('\\' not in suffix and '\x00' not in suffix, 'Ambiguous profile path')
                      require(suffix not in seen, 'Duplicate original profile path')
                      require(not item.is_dir(), 'Unexpected explicit directory member')
                      mode = item.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFREG), 'Nonregular profile entry is not extracted')
                      seen.add(suffix)
                      selected.append((item, relative))
                  require(zipped.read(PREFIX + 'Last Version').decode().strip() == CHROME_VERSION,
                          'Original native Chrome profile version mismatch')
                  output.mkdir(parents=True, exist_ok=False)
                  profile = output / 'profile'
                  profile.mkdir()
                  records = []
                  for item, relative in selected:
                      destination = profile.joinpath(*relative.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      digest = hashlib.sha256()
                      size = 0
                      with zipped.open(item) as source, destination.open('xb') as target:
                          for chunk in iter(lambda: source.read(1024 * 1024), b''):
                              size += len(chunk)
                              require(size <= item.file_size, 'Archive member exceeds its declared size')
                              digest.update(chunk)
                              target.write(chunk)
                      require(size == item.file_size, 'Profile member byte count mismatch')
                      records.append({'path': relative.as_posix(), 'byteSize': size, 'sha256': digest.hexdigest()})
                  # Preserve the original manifest and every original served runtime byte.
                  site_members = [item for item in zipped.infolist() if item.filename.startswith('site/')]
                  expected_site = {'.nojekyll', 'TEST_PROJECT.json', 'app-core.js',
                      'closed-loop-deployment-manifest.json', 'hash.js', 'index.html',
                      'project-store.js', 'prompt-engine.js', 'response-ingestion.js',
                      'test-runtime.js', 'test-worker.js', 'workbook.js',
                      'workflow-engine.js', 'workflow-schema.js'}
                  require(len(site_members) == 14 and sum(item.file_size for item in site_members) == 3970967,
                          'Original site inventory mismatch')
                  require({item.filename[5:] for item in site_members} == expected_site,
                          'Original site has missing, duplicate or unexpected members')
                  site = output.parent / 'site'
                  site.mkdir(exist_ok=False)
                  site_records = []
                  for item in site_members:
                      suffix = item.filename[5:]
                      require(not item.is_dir() and stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG),
                              'Nonregular original site member')
                      destination = site / suffix
                      digest = hashlib.sha256()
                      size = 0
                      with zipped.open(item) as source, destination.open('xb') as target:
                          for chunk in iter(lambda: source.read(1024 * 1024), b''):
                              size += len(chunk)
                              require(size <= item.file_size, 'Site member exceeds declared length')
                              digest.update(chunk)
                              target.write(chunk)
                      require(size == item.file_size, 'Site member byte count mismatch')
                      site_records.append({'path': suffix, 'byteSize': size, 'sha256': digest.hexdigest()})
              require(sha256_file(archive) == ARTIFACT_SHA256, 'Original archive changed during restoration')
              provenance = {
                  'schema': 'clrt-checkpoint-diagnostic-native-profile-copy/1',
                  'purpose': 'Diagnostic replay only; not a complete journey or acceptance receipt',
                  'artifactId': 13587783254,
                  'originalRun': 42403368280,
                  'originalTestedCommit': '315f85b3dc34c274e4470fe4e84e9dcebc9a1551',
                  'originalHeadCommit': '50f539785914002b6bcdf398a71e4e29605d376c',
                  'archive': str(archive), 'archiveSha256': ARTIFACT_SHA256,
                  'archiveBytes': ARTIFACT_BYTES, 'originalArchiveUnchanged': True,
                  'profileDirectory': str(profile), 'profileFileCount': len(records),
                  'profileBytes': sum(record['byteSize'] for record in records),
                  'originalChromeVersion': CHROME_VERSION, 'files': records,
                  'siteDirectory': str(site), 'siteFileCount': len(site_records),
                  'siteBytes': sum(record['byteSize'] for record in site_records), 'siteFiles': site_records,
                  'applicationStateChangedByThisUtility': False,
                  'testReceiptCreated': False,
              }
              with (output / 'profile-copy-provenance.json').open('x') as target:
                  json.dump(provenance, target, indent=2)
                  target.write('\n')
              print(json.dumps({key: value for key, value in provenance.items() if key != 'files'}))


          if __name__ == '__main__':
              main()
          FROZEN_HELPER_0
          cat > "$DIAG_OUT/runner-helpers/inspect.mjs" <<'FROZEN_HELPER_1'
          // Diagnostic-only observations after the ORIGINAL startup failure, before close.
          // No application globals, clocks, source records or validator hooks are changed.
          export function createStartupInspection({save,log,verifyNativeOwner,finishObserver,deadlineMs=180000}){
           return async function inspect(originalError,{evaluate,childPid,profileDirectory}){
            const started=Date.now(),ends=started+deadlineMs;
            const errorRecord=e=>({name:e?.name,code:e?.code||null,message:String(e?.message||e),stack:e?.stack||null,issues:Array.isArray(e?.issues)?e.issues:null,timeoutMs:e?.timeoutMs||null,verifierObservation:e?.verifierObservation||null});
            const report={diagnosticOnly:true,eligibleReceipt:false,originalFailurePreserved:true,originalError:errorRecord(originalError),startedAt:new Date(started).toISOString(),deadlineMs,observations:[],secondaryErrors:[],canonicalMutationRequested:false,clockOrFixtureChanged:false};
            save('original-startup-failure.json',report.originalError);
            const bounded=async(operation,label,max=60000)=>{let timer;const remaining=ends-Date.now();if(remaining<=0)throw Error('Inspection deadline exhausted before '+label);try{return await Promise.race([operation(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('Inspection deadline: '+label)),Math.min(max,remaining));})]);}finally{clearTimeout(timer);}};
            const observe=async(label,expression)=>{if(Date.now()>=ends)throw Error('Inspection deadline exhausted');const value=await bounded(()=>evaluate(expression),label);const row={label,at:new Date().toISOString(),value};report.observations.push(row);save('startup-inspection-progress.json',report);return value;};
            try{
             report.nativeOwner=await bounded(()=>verifyNativeOwner(childPid,profileDirectory),'native owner',10000);
             const quarantineBefore=await observe('quarantine-keys-before',`(async()=>{const store=closedLoopProjectStore,db=await store.openDatabase(),tx=db.transaction(store.stores.meta,'readonly'),request=tx.objectStore(store.stores.meta).getAllKeys();return new Promise((resolve,reject)=>{request.onerror=()=>reject(request.error);request.onsuccess=()=>resolve(request.result.filter(key=>String(key).startsWith('quarantine:')));});})()`);
             const inventory=await observe('ordered-project-and-active-root-inventory',`(async()=>{
              const store=closedLoopProjectStore,summaries=await store.listProjectSummaries();if(summaries.length>32)throw Error('Diagnostic project population bound exceeded');
              const selectedProject=await store.metaGet('selectedProject'),rows=[];
              for(const summary of summaries){const jobId=summary.job.JOB_ID,state=await store.metaGet('recovery:'+jobId),entry=state?.entries?.find(row=>row.id===state.activeId),rootId=entry?.projectReference?.checkpointId||entry?.id,root=rootId?await store.metaGet('recovery:'+jobId+':snapshot:'+rootId):null;
               rows.push({jobId,revision:summary.revision,activeId:state?.activeId||null,generation:state?.generation||null,activeProjectSha256:state?.activeProjectSha256||null,activeRevision:state?.activeRevision||null,entries:state?.entries?.length||0,entry:entry?{id:entry.id,createdAt:entry.createdAt,projectSha256:entry.projectSha256,projectReference:entry.projectReference||null,sha256:entry.sha256,byteSize:entry.byteSize}:null,root:root?{id:root.id,createdAt:root.createdAt,projectSha256:root.projectSha256,sha256:root.sha256,byteSize:root.byteSize,actualBlobBytes:root.blob?.size}:null});}
              return {observedAt:new Date().toISOString(),selectedProject,rows};
             })()`);
             // load() invokes beginHistorySession over this same summary order before it
             // selects/materializes the requested project. Do not attribute to selection.
             for(const row of inventory.rows){
              if(!row.activeId)continue;
              await observe('active-checkpoint-read:'+row.jobId,`(async()=>{try{const view=await closedLoopProjectStore.readHistoryView(${JSON.stringify(row.jobId)},${JSON.stringify(row.activeId)});return {outcome:'RETURNED_VIEW',jobId:${JSON.stringify(row.jobId)},checkpointId:${JSON.stringify(row.activeId)},activeView:view?.activeView,activeStage:view?.activeStage};}catch(error){return {outcome:'THREW',jobId:${JSON.stringify(row.jobId)},checkpointId:${JSON.stringify(row.activeId)},error:{name:error.name,code:error.code||null,message:error.message,issues:Array.isArray(error.issues)?error.issues:null,stack:error.stack}};}})()`);
             }
             const selected=inventory.selectedProject;
             if(typeof selected==='string'&&selected){
              // Default readProject does not request a projection refresh. Original
              // corruption quarantine remains possible; record it, never call it repair.
              await observe('selected-current-project-integrity',`(async()=>{try{
               const store=closedLoopProjectStore,engine=closedLoopWorkflowEngine,p=await store.readProject(${JSON.stringify(selected)});if(!p)return {missing:true};
               const checkedAt=p.stages?.[2]?.gate?.checkedAt,observedAt=p.projectData?.applicationProjection?.observedAt;
               return {jobId:p.job.JOB_ID,revision:p.revision,projectSha256:p.projectSha256,projectionObservedAt:observedAt,stage2CheckedAt:checkedAt,gateObservationEpochs:Object.fromEntries(Object.entries(p.stages).map(([key,value])=>[key,value.gate?.checkedAt||null])),currentIntegrity:store.validateProjectIntegrity(p),recordedStage2Integrity:typeof checkedAt==='string'?store.validateProjectIntegrity(p,{projectionObservedAt:checkedAt}):null,retainedReceipt:engine.validateApplicationProjection(p,p,{useRetainedObservations:true}),stage2Status:p.stages[2].status,stage3Status:p.stages[3].status};
              }catch(error){return {outcome:'THREW',jobId:${JSON.stringify(selected)},error:{name:error.name,code:error.code||null,message:error.message,issues:Array.isArray(error.issues)?error.issues:null,stack:error.stack}};}})()`);
             }
             const after=await observe('ordered-project-and-history-labels-after',`(async()=>{const store=closedLoopProjectStore,rows=[];for(const summary of await store.listProjectSummaries()){const jobId=summary.job.JOB_ID,state=await store.metaGet('recovery:'+jobId);rows.push({jobId,revision:summary.revision,activeId:state?.activeId||null,generation:state?.generation||null,activeProjectSha256:state?.activeProjectSha256||null});}return {selectedProject:await store.metaGet('selectedProject'),rows};})()`);
             const quarantineAfter=await observe('quarantine-keys-after',`(async()=>{const store=closedLoopProjectStore,db=await store.openDatabase(),tx=db.transaction(store.stores.meta,'readonly'),request=tx.objectStore(store.stores.meta).getAllKeys();return new Promise((resolve,reject)=>{request.onerror=()=>reject(request.error);request.onsuccess=()=>resolve(request.result.filter(key=>String(key).startsWith('quarantine:')));});})()`);
             const beforeLabels={selectedProject:inventory.selectedProject,rows:inventory.rows.map(({jobId,revision,activeId,generation,activeProjectSha256})=>({jobId,revision,activeId,generation,activeProjectSha256}))};
