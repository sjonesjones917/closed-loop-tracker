name: Verify and deploy the single reliability app

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: test
    if: github.event.pull_request.head.ref == 'controller3-runtime-current-spec-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-runtime-current-spec-closure
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply, execute, and persist current-spec repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main controller3-runtime-current-spec-closure
          git checkout -B controller3-runtime-current-spec-closure origin/controller3-runtime-current-spec-closure
          python3 controller3-repair-fix.py
          python3 controller3-repair.py
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node verify-contract-closure.mjs
          node verify-capability-readiness.mjs
          node verify-stage01-intake-closure.mjs
          node verify-stage01-disposition-contract.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          git checkout origin/main -- .github/workflows/pages.yml
          rm controller3-repair.py controller3-repair-fix.py
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add -A
          git commit -m 'Enforce capability readiness and Stage 01 inspection basis'
          git push origin HEAD:controller3-runtime-current-spec-closure
