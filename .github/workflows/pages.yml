name: Final application repair
on:
  push:
    branches:
      - "fix/final-runtime-authority-20260830"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final application repair
        run: python repair-final.py
      - name: Commit final application repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finish Test IR authority and Stage 29 runtime"
          git push
