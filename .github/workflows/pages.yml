name: Verify and commit final human-agent UX repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: final-human-agent-ux-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify-and-commit:
    if: github.head_ref == 'fix/human-agent-stage-ux-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply asserted minimal edits
        run: |
          node --check .ux-final/apply.mjs
          node .ux-final/apply.mjs
      - name: Verify retained project and source architecture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          for file in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$file"; done
      - name: Run deterministic, ingestion, lifecycle, and prompt proofs
        run: |
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Run mobile Chromium workflow proofs
        timeout-minutes: 9
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              echo "BEGIN $script attempt $attempt"
              if timeout --signal=TERM --kill-after=10s 240s node "$script"; then
                echo "END $script"
                return 0
              fi
              status=$?
              echo "$script failed with status $status"
              test "$attempt" -lt 3 || return "$status"
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
      - name: Commit only verified product and regression files
        run: |
          git fetch origin main
          rm -rf .ux-final
          git checkout origin/main -- .github/workflows/pages.yml
          git config user.name "closed-loop-fix-bot"
          git config user.email "closed-loop-fix-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fix human-agent handoff and response validation recovery [ux-final-applied]"
          git push origin HEAD:${{ github.head_ref }}
