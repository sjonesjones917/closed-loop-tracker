name: Apply application-owned Stage 18 convergence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/complete-closed-loop-spec-20260831' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-stage18.py
          node --check workflow-engine.js
          node --check app-core.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js app-core.js index.html test-runtime.js
          git commit -m "Make Stage 18 convergence application-owned"
          git push origin HEAD:${{ github.head_ref }}
