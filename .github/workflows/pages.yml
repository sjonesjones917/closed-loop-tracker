          const recordError=e=>({name:e?.name,code:e?.code||null,message:String(e?.message||e),stack:e?.stack||null,timeoutMs:e?.timeoutMs||null,verifierObservation:e?.verifierObservation||null});
          async function bounded(operation,label,max=10000){const remaining=hardEnd-Date.now();if(remaining<=0)throw Error('Diagnostic limit before '+label);let timer;try{return await Promise.race([operation(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('Diagnostic limit: '+label)),Math.min(max,remaining));})]);}finally{clearTimeout(timer);}}
          assert(out!==source&&!out.startsWith(source+path.sep));assert.equal(git('rev-parse','HEAD'),COMMIT);assert.equal(git('rev-parse','HEAD^{tree}'),TREE);assert.equal(git('status','--porcelain'),'');
          assert.equal(process.version,'v22.23.3');assert.equal(process.platform,'linux');assert.equal(process.arch,'x64');assert(!process.env.NODE_OPTIONS);
          for(const key of Object.keys(process.env))if(/^(CLOSED_LOOP_|VERIFIER_|CONFORMANCE_)/.test(key))assert(key==='CLOSED_LOOP_VERIFIER_OWNER_FD'&&process.env[key]==='3');
          assert.equal(fs.readFileSync(path.join(profile,'Last Version'),'utf8').trim(),'156.0.8078.79');assert.equal(execFileSync(process.env.BROWSER,['--product-version'],{encoding:'utf8'}).trim(),'156.0.8078.79');
          process.env.CLOSED_LOOP_BROWSER_SCOPE='LOCAL';process.env.CLOSED_LOOP_BROWSER_SOURCE_COMMIT=COMMIT;process.env.STATIC_SITE_ROOT=path.join(out,'site');process.env.PAGE_URL=URL;
          const {validateSite}=await import(pathToFileURL(path.join(source,'verified-site.mjs')));const manifest=validateSite(process.env.STATIC_SITE_ROOT);
          assert.equal(manifest.sourceCommit,COMMIT);assert.equal(manifest.manifestDigest.digest,'817d87c06d6a13e8ec975b3388746c449dfdac6d942e17e464bead8424f9926b');assert.equal(manifest.buildIdentity,'build-sha256-b1483a0a8c201adf14a2a04eb9ee6451a5518fd9c6619e3f81859cb575833ed2');
          let browser=null,server=null,serverError=null,serverExit=null,serverShutdownRequested=false,interrupted=null,chrome=null,openingStarted=null;
          const result={diagnosticOnly:true,eligibleVerificationReceipt:false,applicationSourceChanged:false,completeJourney:false,sourceCommit:COMMIT,sourceTree:TREE,url:URL,originalStartupTimeoutMs:180000,inspectionTimeoutMs:180000,outerTimeoutMs:480000,startedAt:new Date(begun).toISOString(),originalStartup:null,inspectionCalled:false,secondaryErrors:[],limitations:['Public default readProject can retain its original quarantine response to static corruption; this diagnostic requests no refresh/write and does not claim universal absence of internal storage effects.','Inspection results are observations after the original failure, not successful startup or import.']};
