name: Validate controlling bundle branch
on:
  push:
    branches:
      - fix/complete-spec-stage4-prompts-20260830
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check verify-stage01-stage04-exhaustion.mjs
      - name: Stage 01 and Stage 04 zero-loss proof
        run: node verify-stage01-stage04-exhaustion.mjs
