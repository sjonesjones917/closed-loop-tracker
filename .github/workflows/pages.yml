name: Diagnostic retained-profile candidate startup comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-startup-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  startup-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "baseline"
            sourceCommit: "315f85b3dc34c274e4470fe4e84e9dcebc9a1551"
            sourceTree: "24735288da9f734997c1920c111ad4d472e743e5"
            driverSha256: "a140064f45aa4c73fe53f17aa850a5e629beebe1ed6557192d0c34311608e3c9"
            projectStoreSha256: "fd65a3a24aed4ccac46a016dec609eed3a2038687bcb148b4ee515765d263d79"
          - variant: "candidate"
            sourceCommit: "a5cd6c34d06891285dca9326708b5160c0c47b8a"
            sourceTree: "45c318632a0935e68864ec11b6689a35c0d50180"
            driverSha256: "a140064f45aa4c73fe53f17aa850a5e629beebe1ed6557192d0c34311608e3c9"
            projectStoreSha256: "720c65a6dfd778e05a4c43e03afcd4e89c777dc2a80b665552cd1ebd9014809a"
            sourceInputsSha256: "9d9bffeed7ec8430f6e2504b574c0a4b5621c69ad7e5a9760be07aba1c304c5e"
    env:
      DIAG_OUT: ${{ github.workspace }}/startup-comparison-${{ matrix.variant }}
      BROWSER: /usr/bin/google-chrome
      NODE_OPTIONS: ''
      EXPECTED_SOURCE_COMMIT: ${{ matrix.sourceCommit }}
      EXPECTED_SOURCE_TREE: ${{ matrix.sourceTree }}
    steps:
      - name: Check out exact reviewed variant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sourceCommit }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Pin actual source and runtimes
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DIAG_OUT"
          mkdir "$DIAG_OUT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          test -z "$(git status --porcelain)"
          node --version | tee "$DIAG_OUT/node-version.txt"
          test "$(node --version)" = v22.23.3
          "$BROWSER" --product-version | tee "$DIAG_OUT/chrome-version.txt"
          test "$("$BROWSER" --product-version)" = 156.0.8078.79
          git rev-parse HEAD > "$DIAG_OUT/source-commit-before.txt"
          git rev-parse 'HEAD^{tree}' > "$DIAG_OUT/source-tree-before.txt"
          uname -a > "$DIAG_OUT/uname.txt"
      - name: Materialize reviewed external comparison
        env:
          COMPARISON_CONFIG: ${{ toJSON(matrix) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONFIG'
          import json,os,re
          from pathlib import Path
          config=json.loads(os.environ['COMPARISON_CONFIG'])
          for key in ['sourceCommit','sourceTree']:assert re.fullmatch('[0-9a-f]{40}',config[key]), 'Candidate not frozen'
          for key in ['driverSha256','projectStoreSha256']:assert re.fullmatch('[0-9a-f]{64}',config[key]), 'Candidate pins not frozen'
          assert config['variant'] in ['baseline','candidate']
          (Path(os.environ['DIAG_OUT'])/'comparison-config.json').write_text(json.dumps(config,indent=2)+'\n')
          CONFIG
          cat > "$DIAG_OUT/original-retained-reference.json" <<'REFERENCE'
          {
            "parentArtifactId": 13585083441,
            "parentArtifactSha256": "4a79c1425489facee5aa72191ae6514c3129ce83d9ba0fc70794358baff49800",
