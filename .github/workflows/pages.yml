name: Restore controlling deployment workflow
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "workflow restoration ready"
  restore:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore controlling workflow
        run: |
          git fetch origin fix/apply-live-repair-clean-20260830
          git checkout FETCH_HEAD -- .github/workflows/pages.yml
      - name: Commit restored workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pages.yml
          git commit -m "Restore controlling verification and deployment workflow"
          git push
