name: Temporary final operator-flow repair
on:
  pull_request:
    branches: [main]
  push:
    branches: [repair/final-operator-flow-v36]
permissions:
  contents: write
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/final-operator-flow-v36
          fetch-depth: 0
      - name: Apply exact operator-flow corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app-core.js')
          s = app.read_text()
          if "const RUNTIME_BUILD_ID=" not in s:
              marker="(()=>{'use strict';\nconst $="
              if marker not in s:
                  raise SystemExit('app-core header target not found')
              s=s.replace(marker,"(()=>{'use strict';\nconst RUNTIME_BUILD_ID='runtime-20260830-operator-flow-36';\nconst $=",1)

          old_worker="new Worker('test-worker.js')"
          new_worker="new Worker(`test-worker.js?v=${RUNTIME_BUILD_ID}`)"
          if old_worker in s:
              s=s.replace(old_worker,new_worker,1)
          elif new_worker not in s:
              raise SystemExit('Worker construction target not found')

          old_intro="const intro=n===1?'Attach the original intent file and any other supplied project files here once for Stage 01 intake. After Stage 01 acceptance, later stages consume the canonical captured project data; do not attach or resend these files again.':'Use this control only when the current stage explicitly requires an exact artifact or the agent actually returned a file required by its response contract. Do not reattach, resend, or substitute the original Stage 01 intent file. Actual selected bytes are stored in IndexedDB, hashed by the application, read back, and rehashed before becoming canonical artifact identities. A filename, hash claim, or code block is not file possession.';"
          new_intro="const intro=n===1?(String(current.job.SUPPLIED_MATERIALS_INVENTORY||'').trim()?'Attach only the project files or intent material the user actually supplied, and attach each supplied Stage 01 input only once. After Stage 01 acceptance, later stages consume the canonical captured project data; do not attach or resend those original Stage 01 files again.':'No separate intent file is required because none is currently recorded as supplied project material. Attach a file here only if it is genuinely part of the user-supplied Stage 01 project input; do not create or request a duplicate intent file.'): 'Use this control only when the current stage explicitly requires an exact artifact or the agent actually returned a file required by its response contract. Do not reattach, resend, or substitute the original Stage 01 intent file. Actual selected bytes are stored in IndexedDB, hashed by the application, read back, and rehashed before becoming canonical artifact identities. A filename, hash claim, or code block is not file possession.';"
          if old_intro in s:
              s=s.replace(old_intro,new_intro,1)
          elif new_intro not in s:
              raise SystemExit('Stage 01 artifact guidance target not found')

          old_mode="if(lockReason)return `<div class=\"notice warn\"><strong>No external response is expected yet.</strong><br>${esc(lockReason)} Complete the prerequisite stages in order before sending a prompt or pasting final JSON for this stage.</div>`;if(requests.length||n===1&&!current.stages[1].responseDraft)"
          new_mode="if(lockReason)return `<div class=\"notice warn\"><strong>No external response is expected yet.</strong><br>${esc(lockReason)} Complete the prerequisite stages in order before sending a prompt or pasting final JSON for this stage.</div>`;if([23,24].includes(Number(n))&&!currentReviewerContext(n))return `<div class=\"notice warn\"><strong>Open a fresh independent reviewer context first.</strong><br>Do not paste final JSON yet. Register the new reviewer context on this stage; only then can the application bind and expose the controlling reviewer instruction.</div>`;if(requests.length||n===1&&!current.stages[1].responseDraft)"
          if old_mode in s:
              s=s.replace(old_mode,new_mode,1)
          elif new_mode not in s:
              raise SystemExit('Reviewer interaction mode target not found')
          app.write_text(s)

          index=Path('index.html')
          html=index.read_text()
          old_css='.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'
          new_css='.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'
          if old_css in html:
              html=html.replace(old_css,new_css,1)
          elif new_css not in html:
              raise SystemExit('Prompt box baseline target not found')
          html=re.sub(r'runtime-20260830-prompt-authority-35','runtime-20260830-operator-flow-36',html)
          index.write_text(html)
          PY
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add app-core.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finish operator flow without changing visual design'
          git push origin HEAD:repair/final-operator-flow-v36
