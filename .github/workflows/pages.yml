name: Verify and deploy the single reliability app
on:
  pull_request: {branches: [main]}
permissions: {contents: write, statuses: write}
concurrency: {group: 'boundary-proof-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/proven-boundary-closure-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact guarded boundary correction
        run: |
          python3 apply-boundary-closure.py
          rm apply-boundary-closure.py
          git diff --check
      - name: Verify retained project and syntax
        run: |
          node build-test-project.mjs
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check verify-hash.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
      - name: Run deterministic acceptance stack
        run: |
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Enforce architecture boundaries on transformed tree
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f experience.js
          test ! -f usability.js
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
      - name: Exercise real local Chromium operator acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-boundary-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log" || return 1
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only passing permanent source and restore normal workflow
        run: |
          git fetch origin main --no-tags
          git checkout origin/main -- .github/workflows/pages.yml
          git rm -f apply-boundary-closure.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Close demonstrated prompt and operator boundaries"
          git push origin HEAD:reliability/proven-boundary-closure-20260826
