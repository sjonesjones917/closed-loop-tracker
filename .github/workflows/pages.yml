name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify retained project and single application architecture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js test-fixtures.mjs verify*.mjs; do
            node --check "$file"
          done
      - name: Verify canonical hashing
        run: node verify-hash.mjs
      - name: Run base repository contracts
        id: verify_base
        continue-on-error: true
        run: |
          set +e
          node verify.mjs >/tmp/verify-base.log 2>&1
          status=$?
          message="$(grep -m1 -E 'Error: ' /tmp/verify-base.log | sed -E 's/.*Error: //' | tr '\r\n' ' ' | head -c 180)"
          if [ -z "$message" ]; then message="exit-$status"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Base contract failure — ${{ steps.verify_base.outputs.message }}
        if: steps.verify_base.outcome == 'failure'
        run: exit 1
      - name: Verify transactional response ingestion
        run: node verify-ingestion.mjs
      - name: Verify complete application contracts
        run: node verify-complete.mjs
      - name: Verify v3 response and project contracts
        run: node verify-v3-contract.mjs
      - name: Verify controlling specification contracts
        run: node verify-spec3-contract.mjs
      - name: Verify deterministic v3 migration
        run: node verify-v3-migration.mjs
      - name: Verify Stage 01 intake closure
        run: node verify-stage01-intake-closure.mjs
      - name: Verify one-time intent intake and reuse
        run: node verify-one-time-intent-intake.mjs
      - name: Verify Test IR runtime
        run: node verify-test-runtime.mjs
      - name: Verify v3 Test IR contracts
        run: node verify-test-runtime-v3.mjs
      - name: Verify Test IR resource limits
        run: node verify-test-runtime-limits.mjs
      - name: Verify prompt semantics and isolation
        run: node verify-prompt-semantics.mjs
      - name: Verify complete stage prompt obligations
        run: node verify-stage-prompts-complete.mjs
      - name: Verify all stage prompts
        run: node verify-all-stage-prompts.mjs
      - name: Verify user-facing prompt invariants
        run: node verify-user-prompt-invariants.mjs
      - name: Verify semantic invariants
        run: node verify-semantic-invariant.mjs
      - name: Verify full-cycle behavior
        run: node verify-full-cycle.mjs
      - name: Verify project lifecycle
        run: node verify-project-lifecycle.mjs
      - name: Verify definition of done
        run: node verify-definition-of-done.mjs
      - name: Verify v3 definition of done
        run: node verify-v3-definition-of-done.mjs
      - name: Enforce one application shell and responsible layers
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
      - name: Exercise local Chromium operator path and responsive layout
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-mobile-stage-action.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Exercise deployed Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node verify-browser.mjs
          node verify-browser-extra.mjs

  publish-status:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: read, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then
            STATE=success
            DESCRIPTION='v3 contracts, full-cycle checks, local/deployed Chromium, and deployed-byte identity passed'
          else
            STATE=failure
            DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
          test "$STATE" = success
