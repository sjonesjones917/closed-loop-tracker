name: One-time operator-lane materialization
on:
  push:
    branches: [reliability/operator-lane-final-455a-20260826-1710]
permissions: {contents: write}
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability/operator-lane-final-455a-20260826-1710, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only demonstrated operator-lane correction
        run: python3 apply-operator-lane.py
      - name: Restore production workflow and remove proof machinery
        run: |
          git checkout origin/main -- .github/workflows/pages.yml
          rm -f apply-operator-lane.py .operator-lane-proof-trigger
      - name: Verify exact resulting source
        run: |
          node build-test-project.mjs
          node --check app-core.js
          node --check verify-complete.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/operator-lane-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser(){
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if PAGE_URL=http://127.0.0.1:4173/ node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log" || return 1
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser verify-browser.mjs
          run_browser verify-browser-extra.mjs
      - name: Commit only green permanent source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test ! -f apply-operator-lane.py
          test ! -f .operator-lane-proof-trigger
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only | grep -qx app-core.js
          git diff --cached --name-only | grep -qx verify-complete.mjs
          git diff --cached --name-only | grep -qx index.html
          git commit -m 'Bind operator review controls to selected workflow lane'
          git push origin HEAD:reliability/operator-lane-final-455a-20260826-1710
