name: Apply complete 30-stage prompt audit repair
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths: [.github/workflows/pages.yml]
permissions:
  contents: write
jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply complete stage prompt/context repair
        run: |
          python3 .repair-all-stage-prompts.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); s=p.read_text()
          replacements={
          'Perform complete human-authority intake and nothing from a later stage.':'Perform complete human-authority intake only. Perform complete human-authority intake and nothing from a later stage. Stage 01 is job definition and clarification only. Work only from authorized human job input and accessible supplied human-authority material. Limited intake inspection is Stage 01 job-definition work only when needed to extract human-authority statements relevant to defining the job. Do not classify, validate, rank, establish provenance for, or determine authority/currency/conflicts among supplied materials here.',
          'Classify every APPLICATION INTAKE MANIFEST unit exactly once':'Classify every supplied unit exactly once against APPLICATION INTAKE MANIFEST',
          'Do not perform source research, authority ranking, requirement atomization, test design, production design, production, filing, simulation, manufacturing, or verification.':'Do not perform source research, requirement atomization, test design, production, filing, simulation, manufacturing, or product verification. Do not perform authority ranking, production design, or any other later-stage work.',
          'INPUT_SET_CONTENTS must be the complete durable semantic capture using closed-loop-intake-capture/1, with every manifest unit accounted for.':'The accepted capture is the durable meaning-preserving handoff to every later stage, so the original intent file must not be repeatedly requested. INPUT_SET_CONTENTS must be the complete durable semantic capture using closed-loop-intake-capture/1, with every manifest unit accounted for.',
          'Build the complete current inventory of genuinely independent external sources that can govern, inform, or prove correctness for this job, and do only that.':'Stage 02 is not a supplied-project-material inventory stage. Missing project-material bytes do not by themselves block Stage 02. Build the complete current inventory of genuinely independent external sources that can govern, inform, or prove correctness for this job, and do only that.',
          'Do not perform Stage 03 substantive requirement research or derive requirements.':'Do not perform Stage 03 substantive source research or derive requirements yet. Do not perform Stage 03 substantive requirement research or derive requirements.',
          'If no legitimate independent external source applies after adequate discovery, return an evidence-supported NO_APPLICABLE_EXTERNAL_SOURCE determination.':'If no legitimate independent external source or evidence of any justified authority or evidentiary role applies after adequate discovery, return an evidence-supported no-applicable-source determination using NO_APPLICABLE_EXTERNAL_SOURCE; never invent a source.',
          'Research the complete current accepted Stage 02 source set exhaustively and do not atomize requirements yet.':'Research only the complete current accepted Stage 02 independent external source set exhaustively and do not atomize requirements yet. Every current Stage 02 source must have current research coverage. Perform a second conflict-and-exception pass and continue additional passes until saturation is supported by evidence.',
          'Design the complete verification suite for every current active mandatory requirement before production instructions are authored.':'Define this job’s verification suite before any production instruction is authored. A TEST record is a verification specification: it does not by itself prove that an executable test file exists or that any test has run. Design the complete verification suite for every current active mandatory requirement before production instructions are authored.',
          'When the proposition is exactly expressible by the published registered Test IR, use APPLICATION_DETERMINISTIC and produce valid Test IR and bindings;':'Generating an executable or input test artifact and executing that artifact are separate boundaries. When the current environment can reliably construct the exact artifact bytes, return the actual artifact even if the downstream runner or verification tool is unavailable; a filename, claimed hash, repository path, or code block is not possession of a file. Preserve the canonical TEST → EVIDENCE_ID → ATTACHMENT_ID trace using attachmentRef and evidenceRefs where an actual test artifact is returned. Any non-NONE ARTIFACT_REQUIREMENTS means actual byte-backed artifact evidence is mandatory before the response can validate, and Stage 06 remains blocked if those canonical bytes later become missing or unverified. Browser-local custody does not give a later external executor access; the exact execution context must actually receive the required artifact bytes. When the proposition is exactly expressible by the published registered Test IR, use APPLICATION_DETERMINISTIC and produce valid Test IR and bindings;',
          'Build and actually exercise the complete applicable failure-test suite.':'Generating an invalid fixture and executing that fixture are separate boundaries. Build and actually exercise the complete applicable failure-test suite. A proposed fixture alone does not satisfy the gate. If execution cannot occur, report MISSING_CAPABILITY or MISSING_ARTIFACT exactly as applicable instead of inventing execution.',
          'Author one complete production instruction from the resolved current requirement set and verification architecture.':'Distinguish artifact creation from downstream use: use an implementation-ready specification only when actual artifact generation is genuinely unavailable or the specification is the human-confirmed deliverable. Author one complete production instruction from the resolved current requirement set and verification architecture.',
          'Independently preflight the complete current production instruction and do not execute production.':'Independently preflight the complete current production instruction in an independent context from the instruction author and do not execute production.',
          'Independently verify only the exact current missing REQ_ID × RUN_ID × TEST_ID triples in VERIFICATION BATCH PLAN.':'Independently verify only the exact current missing REQ_ID × RUN_ID × TEST_ID triples in VERIFICATION BATCH PLAN. Respect each test’s EXECUTION_MODE, REQUIRED_CAPABILITY, ARTIFACT_REQUIREMENTS, and actual artifact accessibility. If the required executor, capability, or exact artifact is unavailable, do not claim the test ran.',
          'Convert every confirmed defect into a permanent regression definition and prove the original failure with an actual pre-correction execution.':'Convert every confirmed defect into a permanent regression definition plus a separate actual pre-correction regression execution and prove the original failure with an actual pre-correction execution. In regressionExecutions, record actual PRE_CORRECTION execution evidence. Do not write PRE_CORRECTION_RESULT into the regression definition. Do not claim post-correction success at Stage 15; that must come from a distinct later corrected execution.',
          'Generate the complete finished product from the exact approved baseline and production instruction.':'Generate the complete approved deliverable and every required actual artifact whenever this environment can reliably construct the artifact bytes from the accepted specification, documented representation, and sufficient inputs. Generate the complete finished product from the exact approved baseline and production instruction.',
          'Treat import/open validation, compilation, simulation, manufacturing, deployment, filing/submission, and physical testing as separate operations':'Treat compilation, import/open validation, simulation, post-processing, machine execution, fabrication, deployment, filing/submission, and physical testing as separate downstream operations',
          'Produce every requested deliverable artifact whose exact bytes can be reliably constructed here; do not downgrade to a specification merely because a downstream consuming tool is unavailable.':'Produce every requested deliverable artifact whose exact bytes can be reliably constructed here; do not downgrade to a specification merely because a downstream consuming tool is unavailable. Use an implementation-ready or manufacturing-ready specification/patch plan only when the approved artifact itself cannot be generated reliably here; otherwise produce the real artifact and separately preserve any downstream verification still required.',
          'ACCEPTED STAGE 01 JOB DEFINITION — DURABLE PROJECT MEMORY':'ACCEPTED STAGE 01 JOB DEFINITION — CURRENT HUMAN-AUTHORITY CAPTURE — DURABLE PROJECT MEMORY'
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('compatibility prompt clause missing: '+old)
              s=s.replace(old,new,1)
          # Preserve exact application-ownership boundary phrases required by permanent regressions.
          exact_additions={
          'The application assigns candidate and iteration identities, freezes exact component identities and bytes, computes hashes, and prevents in-place mutation.':'the application assigns CANDIDATE_ID and ITERATION_ID; The application assigns candidate and iteration identities, freezes exact component identities and bytes, computes hashes, and prevents in-place mutation.',
          'Use runs, verification, comparisons, defects/RCA, requirements, tests, regressions/executions, changes, blockers, evidence sufficiency, contradiction findings, and stability diagnostics.':'The application calculates mandatory requirement coverage and all other convergence metrics. Use runs, verification, comparisons, defects/RCA, requirements, tests, regressions/executions, changes, blockers, evidence sufficiency, contradiction findings, and stability diagnostics.',
          'The human performs the genuine baseline authorization; the application assigns BASELINE_ID, freezes exact approved versions and bytes, calculates hashes, and preserves immutable identity.':'The human performs the genuine baseline authorization; the application assigns BASELINE_ID, freezes exact approved versions and bytes, calculates hashes, and preserves immutable identity.',
          'The application owns PRODUCT_ID, versions, filenames, byte sizes, hashes, persisted bytes, and lineage.':'The application assigns PRODUCT_ID and execution identity. The application owns PRODUCT_ID, versions, filenames, byte sizes, hashes, persisted bytes, and lineage.',
          'Review the complete current release evidence for substantive gaps only; the application alone decides release.':'Do not set a release state. Review the complete current release evidence for substantive gaps only; the application alone decides release.',
          'The application performs the authoritative one-to-one byte comparison':'The application performs the authoritative immediate pre-release byte comparison and the authoritative one-to-one byte comparison',
          'The application constructs the evidence graph':'The application constructs the complete evidence graph',
          'Preserve the permanent append-only defect and regression history and verify its current integrity.':'The application maintains append-only defect and regression history. Preserve the permanent append-only defect and regression history and verify its current integrity.'
          }
          for old,new in exact_additions.items():
              if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git fetch origin f91db9249878f5e2cb21facd401f5f5616458693 --depth=1
          git show f91db9249878f5e2cb21facd401f5f5616458693:.github/workflows/pages.yml > /tmp/pages.final.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pages.final.yml'); s=p.read_text()
          marker='          node verify-single-supply-prompts.mjs\n'
          if 'node verify-all-stage-prompts.mjs' not in s:
              s=s.replace(marker, marker+'          node verify-all-stage-prompts.mjs\n', 1)
              idx=s.find(marker, s.find('Re-prove exact source before upload'))
              if idx!=-1:
                  end=idx+len(marker)
                  s=s[:end]+'          node verify-all-stage-prompts.mjs\n'+s[end:]
          p.write_text(s)
          PY
          mv /tmp/pages.final.yml .github/workflows/pages.yml
          rm .repair-all-stage-prompts.py
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const id='runtime-'+crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16);
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|test-runtime|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)runtime-[a-f0-9]{16}("\s*><\/script>)/g,`$1${id}$2`);
          fs.writeFileSync('index.html',html);
          NODE
      - name: Prove syntax, schema, prompts, runtime, ingestion, workflow, and lifecycle
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-v3-migration.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-single-supply-prompts.mjs
          node verify-all-stage-prompts.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Prove browser behavior at required widths
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only proven final source
        run: |
          git config user.name closed-loop-integrator
          git config user.email closed-loop-integrator@users.noreply.github.com
          git add app-core.js workflow-schema.js prompt-engine.js index.html verify-all-stage-prompts.mjs .github/workflows/pages.yml
          test -z "$(git status --porcelain | grep '^?? .*\.repair-' || true)"
          git commit -m 'Complete all 30 stage prompts and preserve captured project memory'
          git push origin HEAD:implementation/closed-loop-v3
