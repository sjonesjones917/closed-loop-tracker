name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build the retained ordinary project
        run: node build-test-project.mjs
      - name: Check application code
        run: node --check app.js && node --check workbook.js && node --check verify-live.mjs
      - name: Verify application structure and project records
        run: node verify.mjs
      - name: Enforce one application
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f human-ui.js
          test ! -f agent-workflow.js
          test ! -f prompt-center.js
          grep -q '<script src="workbook.js"></script>' index.html
          grep -q '<script src="app.js"></script>' index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node verify-live.mjs
      - name: Verify 320-pixel human view
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --window-size=320,800 --virtual-time-budget=6000 --dump-dom "${PAGE_URL}" > live-320.html
          grep -q 'GEN-042' live-320.html
          grep -q '30/30' live-320.html
          grep -q 'Complete project records\|Overview' live-320.html
