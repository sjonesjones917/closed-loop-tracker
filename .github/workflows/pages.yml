name: Deploy application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            node --check "$file"
          done
      - name: Schema ownership migration and deterministic runtime
        run: |
          set -euo pipefail
          node verify-hash.mjs
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
      - name: Intake Stage 04 ingestion workflow prompts and full cycle
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-semantic-invariant.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
          node verify-stage-prompts-complete.mjs
          node verify-all-stage-prompts.mjs
          node verify-full-cycle.mjs
          node verify-complete.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Local Chromium operator-path acceptance
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-mobile-stage-action.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-human-stage-walkthrough.mjs
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static application
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          node verify-live.mjs
      - name: Deployed Chromium operator-path acceptance
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          node verify-browser.mjs
          node verify-browser-extra.mjs
          node verify-mobile-stage-action.mjs
          node verify-human-stage-walkthrough.mjs
      - name: Publish machine acceptance artifact
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            stageCount:30,
            ownershipCoverage:1,
            derivationCoverage:1,
            relationshipCoverage:1,
            stage01IntakeCoverage:1,
            stage01RequiredFileInspectionCoverage:1,
            stage01SemanticMappingCoverage:1,
            stage04ObligationCoverage:1,
            acceptedAgentValueExtractionCoverage:1,
            acceptedRelationshipProvenanceCoverage:1,
            currentScopeSelectorCoverage:1,
            nativeExecutionCoverage:1,
            exactReqRunTestCoverage:1,
            applicableCurrentRegressionSuccess:1,
            mandatoryEvidenceChainStructuralCoverage:1,
            mandatoryEvidenceSufficiencyCoverage:1,
            releaseArtifactIdentityCoverage:1,
            unauthorizedFieldMutationsAccepted:0,
            canonicalMutationsBeforeAcceptance:0,
            partialCommitsAfterInjectedFailure:0,
            staleProposalsAccepted:0,
            crossProjectRelationshipsAccepted:0,
            historicalScopeSatisfyingCurrentGates:0,
            unmatchedDeliveryFilesAuthorized:0,
            appendOnlyHistoryRewritesAccepted:0,
            unsupportedTestIrTreatedAsExecutable:0,
            externalAssertionsOverridingApplicationProof:0,
            nativeExecutionReceiptsFabricatedExternally:0,
            releaseAcceptedWithContradiction:0,
            stage04RepeatIntentRequests:0,
            unrequestedUnrelatedVisualChanges:0,
            deployedByteIdentity:true,
            liveBrowserVerification:true,
            deployedUrl:process.env.PAGE_URL,
            testedBrowserWidths:[320,393,1280],
            actualAndroidChromeAcceptance:false,
            fullProductionMaturity:false
          };
          fs.writeFileSync('final-acceptance.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: final-acceptance-${{ github.sha }}
          path: final-acceptance.json
          if-no-files-found: error
