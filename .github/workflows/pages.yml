name: Deploy application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  repair-current-branch:
    name: integrate-current-runtime-fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/complete-closed-loop-spec-20260831' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Apply pending Stage 9 and Stage 26 runtime corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-preflight.py
          python3 .github/apply-reconcile.py
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check workflow-schema.js
          node --check app-core.js
          node --check test-runtime.js
      - name: Remove one-time repair infrastructure and restore the normal deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply-preflight.py .github/apply-reconcile.py .github/workflows/apply-preflight.yml .github/workflows/apply-reconcile.yml
          git checkout HEAD^ -- .github/workflows/pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js workflow-schema.js index.html app-core.js test-runtime.js .github
          git commit -m "Integrate Stage 9 and Stage 26 application-owned closure"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: test
    if: github.event_name != 'pull_request' || needs.repair-current-branch.result == 'skipped'
    needs: [repair-current-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify retained project and application architecture
        run: node build-test-project.mjs

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js \
            workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js \
            build-test-project-impl.mjs build-test-project.mjs test-fixtures.mjs \
            verify.mjs verify-hash.mjs verify-ingestion.mjs verify-complete.mjs \
            verify-test-runtime.mjs verify-test-runtime-v3.mjs verify-test-runtime-limits.mjs \
            verify-prompt-semantics.mjs verify-all-stage-prompts.mjs verify-stage-prompts-complete.mjs \
            verify-user-prompt-invariants.mjs verify-human-stage-walkthrough.mjs \
            verify-one-time-intent-intake.mjs verify-stage01-intake-closure.mjs \
            verify-zero-loss-accounting.mjs verify-spec3-contract.mjs verify-v3-contract.mjs \
            verify-v3-migration.mjs verify-v3-definition-of-done.mjs verify-semantic-invariant.mjs \
            verify-full-cycle.mjs verify-project-lifecycle.mjs verify-definition-of-done.mjs \
            verify-mobile-stage-action.mjs verify-browser.mjs verify-browser-extra.mjs verify-live.mjs; do
            node --check "$file"
          done

      - name: Verify deterministic schemas, runtime, ingestion, prompts, stages, and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-prompt-semantics.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-one-time-intent-intake.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-v3-definition-of-done.mjs
          node verify-semantic-invariant.mjs
          node verify-full-cycle.mjs
          node verify-project-lifecycle.mjs
          node verify-definition-of-done.mjs
          node verify-mobile-stage-action.mjs

      - name: Enforce the single runtime architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f experience.js
          test ! -f usability.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|closed-loop-project/4|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} directly loaded scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks a build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          NODE

      - name: Exercise the application in local Chromium
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            local script="$1"
            local success=false
            for attempt in 1 2 3; do
              local log="/tmp/${script}.${attempt}.log"
              if PAGE_URL="http://127.0.0.1:4173/" node "$script" >"$log" 2>&1; then
                cat "$log"
                success=true
                break
              fi
              cat "$log"
              grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log" || return 1
            done
            test "$success" = true
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exact static application artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: verify-live
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify exact deployed byte identity
        run: node verify-live.mjs
      - name: Exercise deployed application in Chromium
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            local script="$1"
            local success=false
            for attempt in 1 2 3; do
              local log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                success=true
                break
              fi
              cat "$log"
              grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log" || return 1
            done
            test "$success" = true
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    name: publish-status
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Require the complete proof chain
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
      - name: Write machine acceptance record
        shell: bash
        run: |
          cat > closed-loop-acceptance.json <<JSON
          {
            "commit": "$GITHUB_SHA",
            "workflow": "mobile-closed-loop/30",
            "projectSchema": "closed-loop-project/3",
            "responseSchema": "closed-loop-stage-response/3",
            "testIrSchema": "closed-loop-test-spec/1",
            "verificationPackageSchema": "closed-loop-verification-package/1",
            "stageCount": 30,
            "sourceTestsPassed": true,
            "localChromiumPassed": true,
            "deployedByteIdentity": true,
            "deployedChromiumPassed": true
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
          if-no-files-found: error
      - name: Tag the exact accepted commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="acceptance-${GITHUB_SHA:0:12}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
