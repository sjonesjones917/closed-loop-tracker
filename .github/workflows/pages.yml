name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and static architecture
        run: |
          set -euo pipefail
          mkdir -p _proof
          git diff --check
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
          node build-test-project.mjs | tee _proof/build-test-project.out
          git diff --exit-code -- TEST_PROJECT.json
          node verify-release-pipeline.mjs | tee _proof/verify-release-pipeline.out
          node verify-runtime-bundle-identity.mjs | tee _proof/verify-runtime-bundle-identity.out
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
          test ! -f app.js
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f experience.js
          test ! -f usability.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "GEN-042|field status report|maintenance[- ]handoff|human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .

      - name: Schema ownership migration and Test IR
        run: |
          set -euo pipefail
          node verify-hash.mjs | tee _proof/verify-hash.out
          node verify-spec3-contract.mjs | tee _proof/verify-spec3-contract.out
          node verify-v3-contract.mjs | tee _proof/verify-v3-contract.out
          node verify-v3-migration.mjs | tee _proof/verify-v3-migration.out
          node verify-test-runtime.mjs | tee _proof/verify-test-runtime.out
          node verify-test-runtime-v3.mjs | tee _proof/verify-test-runtime-v3.out
          node verify-test-runtime-limits.mjs | tee _proof/verify-test-runtime-limits.out

      - name: Ingestion and zero-loss authority accounting
        run: |
          set -euo pipefail
          node verify-ingestion.mjs | tee _proof/verify-ingestion.out
          node verify-zero-loss-accounting.mjs | tee _proof/verify-zero-loss-accounting.out
          node verify-one-time-intent-intake.mjs | tee _proof/verify-one-time-intent-intake.out
          node verify-stage01-intake-closure.mjs | tee _proof/verify-stage01-intake-closure.out

      - name: Workflow gates and deterministic adjudication
        run: |
          set -euo pipefail
          node verify.mjs | tee _proof/verify.out
          node verify-complete.mjs | tee _proof/verify-complete.out
          node verify-project-lifecycle.mjs | tee _proof/verify-project-lifecycle.out

      - name: Prompt semantics and information isolation
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs | tee _proof/verify-all-stage-prompts.out
          node verify-stage-prompts-complete.mjs | tee _proof/verify-stage-prompts-complete.out
          node verify-prompt-semantics.mjs | tee _proof/verify-prompt-semantics.out
          node verify-user-prompt-invariants.mjs | tee _proof/verify-user-prompt-invariants.out
          node verify-semantic-invariant.mjs | tee _proof/verify-semantic-invariant.out

      - name: Full lifecycle and definition of done
        run: |
          set -euo pipefail
          node verify-full-cycle.mjs | tee _proof/verify-full-cycle.out
          node verify-definition-of-done.mjs | tee _proof/verify-definition-of-done.out
          node verify-v3-definition-of-done.mjs | tee _proof/verify-v3-definition-of-done.out

      - name: Local Chromium acceptance
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            test "$attempt" -lt 30
            sleep 0.2
          done
          run_browser_verifier() {
            script="$1"
            log="_proof/${script%.mjs}.out"
            for attempt in 1 2 3; do
              if PAGE_URL=http://127.0.0.1:4173/ node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          run_browser_verifier verify-human-stage-walkthrough.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Build exact static Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site/
          node - <<'NODE' | tee _proof/exact-site-manifest.out
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const files=fs.readdirSync('_site').sort().filter(file=>fs.statSync(path.join('_site',file)).isFile());
          const sha256=Object.fromEntries(files.map(file=>[file,crypto.createHash('sha256').update(fs.readFileSync(path.join('_site',file))).digest('hex')]));
          console.log(JSON.stringify({commit:process.env.GITHUB_SHA,files,sha256},null,2));
          NODE

      - name: Upload executed test proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-test-proof-${{ github.sha }}
          path: _proof
          if-no-files-found: error

      - name: Upload exact verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: exact-site-${{ github.sha }}
          path: _site
          if-no-files-found: error

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact verified application
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: verify-live
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact deployed source identity
        run: |
          set -euo pipefail
          mkdir -p _live-proof
          verified=false
          for attempt in {1..30}; do
            if node verify-live.mjs >_live-proof/verify-live.out 2>&1; then
              cat _live-proof/verify-live.out
              verified=true
              break
            fi
            cat _live-proof/verify-live.out
            test "$attempt" -lt 30
            sleep 5
          done
          test "$verified" = true

      - name: Deployed Chromium acceptance
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            log="_live-proof/${script%.mjs}.out"
            for attempt in 1 2 3; do
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

      - name: Upload executed live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-live-proof-${{ github.sha }}
          path: _live-proof
          if-no-files-found: error

  publish-status:
    name: publish-status
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        with:
          name: closed-loop-test-proof-${{ github.sha }}
          path: _proof
      - uses: actions/download-artifact@v4
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        with:
          name: closed-loop-live-proof-${{ github.sha }}
          path: _live-proof

      - name: Build final machine acceptance artifact
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const read=path=>fs.readFileSync(path,'utf8');
          const json=path=>JSON.parse(read(path));
          const has=(path,re)=>re.test(read(path));
          const lastJson=path=>{
            const text=read(path).trim();
            for(let index=text.lastIndexOf('{');index>=0;index=text.lastIndexOf('{',index-1)){
              try{return JSON.parse(text.slice(index));}catch{}
            }
            throw new Error(`No final JSON object found in ${path}`);
          };
          const definition=json('_proof/verify-definition-of-done.out');
          const v3=json('_proof/verify-v3-definition-of-done.out');
          const runtime=json('_proof/verify-runtime-bundle-identity.out');
          const live=json('_live-proof/verify-live.out');
          const browserExtra=lastJson('_live-proof/verify-browser-extra.out');
          const ingestionText=read('_proof/verify-ingestion.out');
          const negativeMatches=[...ingestionText.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!negativeMatches.length)throw new Error('verify-ingestion did not publish totalNegativeCases.');
          const negativeCasesPassed=Number(negativeMatches.at(-1)[1]);
          const storageProofs=[
            has('_proof/verify.out',/"transactionRollback"\s*:\s*true/),
            has('_proof/verify-complete.out',/"acceptedStateStorageRollback"\s*:\s*true/),
            browserExtra.storageFailureRollback===true
          ];
          if(storageProofs.some(value=>!value))throw new Error('One or more storage-failure rollback proofs are missing.');
          const artifactRoundTrip=browserExtra.successfulExport===true&&browserExtra.successfulImport===true&&browserExtra.unknownFieldRoundTrip===true&&browserExtra.blobPersistence===true;
          if(!artifactRoundTrip)throw new Error('Complete project/artifact round trip was not proven.');
          if(live.liveSourceIdentity!==true)throw new Error('Exact deployed source identity was not proven.');
          const acceptance={
            schema:'closed-loop-acceptance-report/3',
            commit:process.env.GITHUB_SHA,
            deployment:process.env.PAGE_URL,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            runtimeBuildId:runtime.buildId,
            runtimeGraphSha256:runtime.graphIdentitySha256,
            ...definition,
            stage01IntakeCoverage:v3.stage01IntakeCoverage,
            stage04ObligationCoverage:v3.stage04ObligationCoverage,
            mandatoryEvidenceSufficiencyCoverage:v3.mandatoryEvidenceSufficiencyCoverage,
            nativeExecutionCoverage:v3.nativeExecutionCoverage,
            unsupportedTestIrTreatedAsExecutable:v3.unsupportedTestIrTreatedAsExecutable,
            externalAssertionsOverridingApplicationProof:v3.externalAssertionsOverridingApplicationProof,
            nativeExecutionReceiptsFabricatedExternally:v3.nativeExecutionReceiptsFabricatedExternally,
            releaseAcceptedWithContradiction:v3.releaseAcceptedWithContradiction,
            migrationV2ToV3Covered:v3.migrationV2ToV3Covered,
            oldV2ResponseRejectedForCurrentPrompt:v3.oldV2ResponseRejectedForCurrentPrompt,
            negativeCasesPassed,
            storageFailureCasesPassed:storageProofs.filter(Boolean).length,
            artifactRoundTrip,
            localBrowserAcceptance:true,
            liveBrowserVerification:true,
            browserWidths:[320,393,1280],
            deployedByteIdentity:true,
            deployedFileSha256:live.exactFileSha256,
            androidChromeAcceptance:false,
            realThirtyStageProjectAcceptance:false,
            fullProductionMaturity:false,
            unprovenProductionMaturityItems:[
              'Actual Android Chrome runtime acceptance',
              'A separately identified real external-agent 30-stage project'
            ]
          };
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(acceptance,null,2)+'\n');
          NODE
          node -e "const r=require('./closed-loop-acceptance.json');if(r.commit!==process.env.GITHUB_SHA||r.deployedByteIdentity!==true||r.fullProductionMaturity!==false)throw new Error('Acceptance report identity or truthfulness check failed.');"

      - name: Upload final machine acceptance artifact
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
          if-no-files-found: error

      - name: Tag exact accepted commit
        if: needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success'
        run: |
          set -euo pipefail
          TAG="acceptance-${GITHUB_SHA:0:12}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish exact workflow status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then
            STATE=success
            DESCRIPTION='Deterministic, browser, deployment, and byte-identity proofs passed'
          else
            STATE=failure
            DESCRIPTION="Proof failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
          test "$STATE" = success
