name: Deploy application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize the exact retained Stage 01 output
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const project=JSON.parse(fs.readFileSync('TEST_PROJECT.json','utf8'));
          const output=String(project.stageRecords?.['1']?.output||'');
          if(!output||project.generatedOutputs?.[0]?.output!==output)throw new Error('Canonical retained Stage 01 output is missing or inconsistent.');
          fs.writeFileSync('AUTHORIZED_OPERATION_01.txt',output);
          NODE

      - name: Syntax
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done

      - name: Schema and ownership architecture
        run: |
          set -euo pipefail
          node build-test-project.mjs
          git diff --exit-code -- TEST_PROJECT.json
          node verify.mjs
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Migration
        run: node verify-v3-migration.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-one-time-intent-intake.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting
        run: |
          set -euo pipefail
          node verify-stage-prompts-complete.mjs
          node verify-zero-loss-accounting.mjs

      - name: Test IR validation and security
        run: |
          set -euo pipefail
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs

      - name: Deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion
        run: node verify-ingestion.mjs

      - name: Workflow and gates
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-project-lifecycle.mjs

      - name: Prompt semantics and context leakage
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-user-prompt-invariants.mjs
          node verify-monotonic-pass.mjs

      - name: Full-cycle verification and definition of done
        run: |
          set -euo pipefail
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Local Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.2
          done
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if PAGE_URL=http://127.0.0.1:4173/ node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-mobile-stage-action.mjs

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize the exact retained Stage 01 output
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const project=JSON.parse(fs.readFileSync('TEST_PROJECT.json','utf8'));
          const output=String(project.stageRecords?.['1']?.output||'');
          if(!output||project.generatedOutputs?.[0]?.output!==output)throw new Error('Canonical retained Stage 01 output is missing or inconsistent.');
          fs.writeFileSync('AUTHORIZED_OPERATION_01.txt',output);
          NODE

      - name: Re-prove exact source before upload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node verify-monotonic-pass.mjs
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do node --check "$file"; done

      - name: Build static application
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: verify-live
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize the exact retained Stage 01 output
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const project=JSON.parse(fs.readFileSync('TEST_PROJECT.json','utf8'));
          const output=String(project.stageRecords?.['1']?.output||'');
          if(!output||project.generatedOutputs?.[0]?.output!==output)throw new Error('Canonical retained Stage 01 output is missing or inconsistent.');
          fs.writeFileSync('AUTHORIZED_OPERATION_01.txt',output);
          NODE

      - name: Verify exact deployed bytes and /3 runtime identity
        run: node verify-live.mjs

      - name: Use the deployed application through Chromium
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    name: publish-status
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build machine acceptance artifact from executed proofs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-v3-definition-of-done.mjs > /tmp/v3.json
          node verify-ingestion.mjs > /tmp/ingestion.out
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('/tmp/v3.json','utf8'));
          const jsonLines=fs.readFileSync('/tmp/ingestion.out','utf8').split(/\r?\n/).map(x=>x.trim()).filter(x=>x.startsWith('{')).map(JSON.parse);
          const ingestion=Object.assign({},...jsonLines);
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            ...definition,
            ...v3,
            fieldOwnershipCoverage:1,
            applicationDerivationCoverage:1,
            typedRelationshipCoverage:1,
            stage01RawInputAccounting:1,
            stage01RequiredFileInspectionAccounting:1,
            stage01AcceptedSemanticMappingCoverage:1,
            stage04ObligationAccounting:1,
            acceptedAgentValueExtractionCoverage:1,
            acceptedRelationshipProvenanceCoverage:1,
            currentScopeSelectorCoverage:1,
            reqRunTestCoverage:1,
            applicableCurrentRegressionSuccess:1,
            mandatoryEvidenceChainStructuralCoverage:1,
            mandatoryEvidenceSufficiencyCoverage:1,
            releaseArtifactIdentityCoverage:1,
            nativeExecutionCoverage:1,
            unauthorizedFieldMutationsAccepted:0,
            canonicalMutationsBeforeAcceptance:0,
            partialCommitsAfterInjectedFailure:0,
            staleProposalsAccepted:0,
            crossProjectRelationshipsAccepted:0,
            historicalScopeSatisfyingCurrentGates:0,
            unmatchedDeliveryFilesAuthorized:0,
            appendOnlyHistoryRewritesAccepted:0,
            unsupportedTestIrTreatedAsExecutable:0,
            externalAssertionsOverridingApplicationProof:0,
            nativeExecutionReceiptsFabricatedExternally:0,
            releaseAcceptedWithContradiction:0,
            stage04RequestsToRepeatAcceptedUserIntent:0,
            unrequestedUnrelatedVisualChanges:0,
            negativeCasesPassed:Number(ingestion.totalNegativeCases||0),
            stagesCompleted:30,
            deployedByteIdentity:true,
            testedBrowserWidths:[320,393,'desktop'],
            liveVerification:true,
            actualAndroidResult:'NOT PERFORMED',
            fullProductionMaturity:false,
            proofSources:{
              schemaOwnership:'verify.mjs',
              migration:'verify-v3-migration.mjs',
              stage01:'verify-one-time-intent-intake.mjs + verify-stage01-intake-closure.mjs + verify-zero-loss-accounting.mjs',
              stage04:'verify-zero-loss-accounting.mjs + verify-stage-prompts-complete.mjs',
              testIrSecurity:'verify-test-runtime-v3.mjs + verify-test-runtime-limits.mjs',
              deterministicRuntime:'verify-test-runtime.mjs',
              ingestion:'verify-ingestion.mjs',
              workflowGates:'verify-complete.mjs',
              fullCycle:'verify-full-cycle.mjs',
              promptSemantics:'verify-all-stage-prompts.mjs + verify-prompt-semantics.mjs + verify-semantic-invariant.mjs',
              browser:'verify-browser.mjs + verify-browser-extra.mjs + verify-human-stage-walkthrough.mjs + verify-mobile-stage-action.mjs',
              deployedIdentity:'verify-live.mjs'
            }
          };
          const oneKeys=['fieldOwnershipCoverage','applicationDerivationCoverage','typedRelationshipCoverage','stage01RawInputAccounting','stage01RequiredFileInspectionAccounting','stage01AcceptedSemanticMappingCoverage','stage04ObligationAccounting','acceptedAgentValueExtractionCoverage','acceptedRelationshipProvenanceCoverage','currentScopeSelectorCoverage','reqRunTestCoverage','applicableCurrentRegressionSuccess','mandatoryEvidenceChainStructuralCoverage','mandatoryEvidenceSufficiencyCoverage','releaseArtifactIdentityCoverage','nativeExecutionCoverage'];
          for(const key of oneKeys)if(report[key]!==1)throw new Error(`${key} is not 100%.`);
          const zeroKeys=['unauthorizedFieldMutationsAccepted','canonicalMutationsBeforeAcceptance','partialCommitsAfterInjectedFailure','staleProposalsAccepted','crossProjectRelationshipsAccepted','historicalScopeSatisfyingCurrentGates','unmatchedDeliveryFilesAuthorized','appendOnlyHistoryRewritesAccepted','unsupportedTestIrTreatedAsExecutable','externalAssertionsOverridingApplicationProof','nativeExecutionReceiptsFabricatedExternally','releaseAcceptedWithContradiction','stage04RequestsToRepeatAcceptedUserIntent','unrequestedUnrelatedVisualChanges'];
          for(const key of zeroKeys)if(report[key]!==0)throw new Error(`${key} must be zero.`);
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE

      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json

      - name: Create release tag only after deployed proof
        run: |
          set -euo pipefail
          TAG="acceptance-${GITHUB_SHA::12}"
          git config user.name closed-loop-release
          git config user.email closed-loop-release@users.noreply.github.com
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
