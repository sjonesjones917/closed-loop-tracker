name: Temporary deterministic zero-loss accounting repair
on:
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: 'repair-${{ github.ref }}', cancel-in-progress: false}

jobs:
  repair:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply integrated zero-loss accounting repair
