name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mobile_acceptance_target_json:
        description: Pinned physical-iPhone acceptance target JSON for the exact currently deployed main commit
        required: false
        type: string
      mobile_acceptance_evidence_json:
        description: Physical-iPhone mobile-acceptance-evidence JSON bound to the submitted target
        required: false
        type: string
      visual_baseline_evidence_json:
        description: Frozen visual baseline and exact-main comparison JSON; see README Repository visual acceptance submission
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Verify the latest PR revision promptly; main deployments remain serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLOSED_LOOP_VERIFICATION_SOURCE_ROOT: ${{ github.workspace }}
      CLOSED_LOOP_VERIFICATION_RECEIPTS: ${{ github.workspace }}/.verification-receipts
      NODE_OPTIONS: --import ${{ github.workspace }}/verification-evidence-preload.mjs
    outputs:
      verified_artifact_name: ${{ steps.verified.outputs.artifact_name }}
      verification_run_id: ${{ steps.reuse.outputs.run_id || github.run_id }}
      verification_source_commit: ${{ steps.reuse.outputs.tested_commit || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          # The repository preload does not exist until checkout completes.
          NODE_OPTIONS: ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verified artifact reuse checks
        run: node verify-verified-site.mjs

      - name: Find completed PR verification for this main commit
        id: candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node verified-site.mjs select
      - name: Download the passing PR artifact
        if: steps.candidate.outputs.artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: _verified-pr
      - name: Verify matching source and promote tested runtime files
        id: reuse
        if: steps.candidate.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node verified-site.mjs reuse

      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: tar --exclude=.git -czf /tmp/pr-source.tar.gz .
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do
            node --check "$file"
          done

      - name: Stage 01 agent response contract alignment
        if: steps.reuse.outputs.reused != 'true'
        run: node verify-stage01-agent-contract-alignment.mjs

      - name: Deployment manifest, build identity, and reproducibility
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-deployment-manifest.mjs

      - name: Physical iPhone release-tag governance
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-mobile-acceptance-target.mjs
          node verify-final-acceptance.mjs
          node verify-visual-baseline-submission.mjs
          node verify-prompt-file-identity.mjs
          node verify-final-product-timing.mjs
          node verify-mobile-release-governance.mjs

      - name: Schema, ownership, and single-architecture proof
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          node verify-proposal-acceptance-memory.mjs
          node verify-semantic-review-acceptance.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs

      - name: Migration and v3 contracts
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-context-boundary.mjs
          node verify-handoff-metadata-boundary.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs

      - name: Test IR validation, security, and deterministic runtime
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion and negative cases
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-ingestion.mjs
          node verify-execution-reports.mjs
          node verify-backup-json-stream.mjs

      - name: Workflow, gates, and full cycle
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-stage28-artifact-delivery-intent.mjs
          node verify-full-cycle.mjs | tee /tmp/full-cycle-proof.json
          node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync('/tmp/full-cycle-proof.json','utf8'));"
          node verify-stage29-evidence-chain-checkpoint.mjs
          node verify-production-baseline-authority.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs

      - name: Prompt semantics and leakage
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs

      # Complete non-browser proof before browser acceptance (specification 46).
      # Every gate remains mandatory; failures retain their raw evidence.
      - name: Shared production faults, bounded sequences, and executed observations
        id: conformance
        if: steps.reuse.outputs.reused != 'true'
        timeout-minutes: 185
        run: |
          set -euo pipefail
          node verify-conformance-regressions.mjs > /tmp/conformance-regressions.json
      - name: Preserve executed regression evidence
        if: always() && (steps.conformance.outcome == 'success' || steps.conformance.outcome == 'failure' || steps.conformance.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conformance-regressions-${{ github.sha }}
          path: |
            conformance-regression-evidence/
            /tmp/conformance-regressions.json
          if-no-files-found: error

      - name: Stale project navigation and draft preservation
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          node verify-stale-view-navigation.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node build-static-site.mjs --out _stale_view_site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
          python3 -m http.server 4173 --directory _stale_view_site >/tmp/stale-view-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=10s 5m node verify-stale-view-browser.mjs

      - name: Preserve stale project navigation observations
        if: always() && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stale-view-${{ github.sha }}-${{ github.run_id }}
          path: |
            stale-view-browser-evidence/stale-view.json
            stale-view-browser-evidence/*/stage-*.png
          if-no-files-found: warn

      - name: Verification routing and capability evidence
        if: steps.reuse.outputs.reused != 'true'
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node verify-verification-routing.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node build-static-site.mjs --out _routing_site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
          python3 -m http.server 4173 --directory _routing_site >/tmp/verification-routing-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=10s 5m node verify-verification-routing-browser.mjs

      - name: Preserve verification routing observations
        if: always() && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-routing-${{ github.sha }}-${{ github.run_id }}
          path: |
            verification-routing-browser-evidence/routing.json
            verification-routing-browser-evidence/*/stage-*.png
          if-no-files-found: warn

      - name: Startup and scrolling at phone and desktop sizes
        if: steps.reuse.outputs.reused != 'true'
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          # Use the retained fixture already in this commit for fast UI feedback.
          # The following viewport gate still regenerates and validates it.
          node build-static-site.mjs --out _acceptance_site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
          python3 -m http.server 4173 --directory _acceptance_site >/tmp/acceptance-viewport-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=10s 10m node verify-browser.mjs --startup-scroll-only 2>&1 | tee /tmp/startup-scroll.log

      - name: Acceptance viewport regression and targeted layout fault
        if: steps.reuse.outputs.reused != 'true'
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node build-static-site.mjs --out _acceptance_site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
          python3 -m http.server 4173 --directory _acceptance_site >/tmp/acceptance-viewport-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=10s 15m node verify-acceptance-viewport.mjs 2>&1 | tee /tmp/acceptance-viewport.log

      - name: Preserve acceptance viewport observations
        if: always() && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-viewport-${{ github.sha }}-${{ github.run_id }}
          path: |
            acceptance-viewport-evidence/acceptance-viewport.json
            acceptance-viewport-evidence/*/stage-*.png
            acceptance-viewport-evidence/*/downloads/
            /tmp/acceptance-viewport.log
            /tmp/startup-scroll.log
            /tmp/startup-scroll-*.png
          if-no-files-found: warn

      - name: Build static application for operator verification
        if: steps.reuse.outputs.reused != 'true'
        run: node build-static-site.mjs --out _site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"

      - name: Local Chromium operator path
        if: steps.reuse.outputs.reused != 'true'
        env:
          BROWSER: /usr/bin/google-chrome
          STATIC_SITE_ROOT: _site
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          python3 -m http.server 4173 --directory _site >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            budget="${2:-10m}"
            log="/tmp/${script}.log"
            # A failed gate stays failed. Startup readiness is bounded in the
            # browser driver; classified infrastructure failures may be rerun
            # explicitly against the unchanged SHA after their logs are read.
            timeout --signal=TERM --kill-after=10s "$budget" node "$script" 2>&1 | tee "$log"
          }
          BROWSER_VERIFY_RESULT=0
          # Exercise lifecycle and recovery controls before the long journey.
          run_browser_verifier verify-browser-extra.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-human-stage-walkthrough.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-mobile-stage-action.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-mobile-capability-journey.mjs || BROWSER_VERIFY_RESULT=1
          # Run5926 reached all30 stages and imported its backup before the90m
          # deadline cut off final proof. Keep a finite budget with headroom.
          run_browser_verifier verify-complete-operator-journey.mjs 120m || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser-recovery.mjs || BROWSER_VERIFY_RESULT=1
          test "$BROWSER_VERIFY_RESULT" = 0
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Preserve complete operator journey evidence
        if: always() && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-journeys-${{ github.sha }}-${{ github.run_id }}
          path: |
            recovery-browser-evidence/recovery.json
            recovery-browser-evidence/stage-*.png
            recovery-browser-evidence/downloads/
            operator-evidence/journey.json
            operator-evidence/stage-*.png
            operator-evidence/downloads/
            mobile-capability-evidence/capability.json
            mobile-capability-evidence/stage-*.png
            mobile-capability-evidence/downloads/
      - name: Preserve the exact browser-verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

      - name: Collect current executed assertion evidence
        run: node collect-verification-evidence.mjs --run-missing

      # This is reached only after full verification or proven reuse of the
      # identical Git tree and runtime bytes from a fully passing PR attempt.
      - name: Seal verified deployment artifact
        id: verified
        run: node verified-site.mjs seal
      - name: Preserve verified site for merge and live verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.verified.outputs.artifact_name }}
          path: _verified-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy exact verified bytes
    permissions:
      pages: write
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-live:
    name: Verify deployed bytes and operator path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      VERIFIED_SITE_DIR: _verified-site/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download the exact verified deployment files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.test.outputs.verified_artifact_name }}
          path: _verified-site
      - name: Restore the verified retained fixture
        run: cp _verified-site/site/TEST_PROJECT.json TEST_PROJECT.json
      - name: Exact deployed-byte verification
        run: |
          set -euo pipefail
          node verify-live.mjs 2>&1 | tee /tmp/deployed-byte-proof.log
      - name: Deployed Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            budget="${2:-10m}"
            log="/tmp/${script}.log"
            # A failed gate stays failed. Startup readiness is bounded in the
            # browser driver; classified infrastructure failures may be rerun
            # explicitly against the unchanged SHA after their logs are read.
            timeout --signal=TERM --kill-after=10s "$budget" node "$script" 2>&1 | tee "$log"
          }
          BROWSER_VERIFY_RESULT=0
          run_browser_verifier verify-mobile-stage-action.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-mobile-capability-journey.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-complete-operator-journey.mjs 120m || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser-recovery.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser-extra.mjs || BROWSER_VERIFY_RESULT=1
          test "$BROWSER_VERIFY_RESULT" = 0

      - name: Preserve deployed operator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployed-operator-journeys-${{ github.sha }}-${{ github.run_id }}
          path: |
            operator-evidence/
            recovery-browser-evidence/
            mobile-capability-evidence/
            /tmp/verify-*.mjs.*.log
            /tmp/deployed-byte-proof.log
          retention-days: 90
          if-no-files-found: warn

  publish-status:
    name: Publish machine acceptance status
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.test.result == 'success'))
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    env:
      CLOSED_LOOP_VERIFICATION_SOURCE_ROOT: ${{ github.workspace }}
      CLOSED_LOOP_VERIFICATION_RECEIPTS: ${{ github.workspace }}/.verification-receipts
      NODE_OPTIONS: --import ${{ github.workspace }}/verification-evidence-preload.mjs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          NODE_OPTIONS: ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reverify deployed Chromium for authenticated mobile acceptance
        if: github.event_name == 'workflow_dispatch'
        env:
          PAGE_URL: https://sjonesjones917.github.io/closed-loop-tracker/
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            budget="${2:-10m}"
            log="/tmp/${script}.log"
            # A failed gate stays failed. Startup readiness is bounded in the
            # browser driver; classified infrastructure failures may be rerun
            # explicitly against the unchanged SHA after their logs are read.
            timeout --signal=TERM --kill-after=10s "$budget" node "$script" 2>&1 | tee "$log"
          }
          BROWSER_VERIFY_RESULT=0
          run_browser_verifier verify-mobile-stage-action.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-mobile-capability-journey.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-complete-operator-journey.mjs 120m || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser-recovery.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser.mjs || BROWSER_VERIFY_RESULT=1
          run_browser_verifier verify-browser-extra.mjs || BROWSER_VERIFY_RESULT=1
          test "$BROWSER_VERIFY_RESULT" = 0
      - name: Preserve reverified deployed operator evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverified-deployed-operator-journeys-${{ github.sha }}-${{ github.run_id }}
          path: |
            operator-evidence/
            recovery-browser-evidence/
            mobile-capability-evidence/
            /tmp/mobile-verify-*.mjs.*.log
          retention-days: 90
          if-no-files-found: warn
      - name: Download current executed assertion evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.test.outputs.verified_artifact_name }}
          path: _verified-evidence
      - name: Validate current executed assertion evidence handoff
        run: |
          set -euo pipefail
          mkdir -p .verification-receipts
          cp -R _verified-evidence/proofs/. .verification-receipts/
          node collect-verification-evidence.mjs
      - name: Build acceptance artifact from executed proof jobs
        id: acceptance
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ github.event_name == 'workflow_dispatch' && 'success' || needs.deploy.result }}
          LIVE_RESULT: ${{ github.event_name == 'workflow_dispatch' && 'success' || needs.verify-live.result }}
          VERIFICATION_RUN_ID: ${{ needs.test.outputs.verification_run_id }}
          VERIFICATION_SOURCE_COMMIT: ${{ needs.test.outputs.verification_source_commit }}
          MOBILE_ACCEPTANCE_TARGET_JSON: ${{ inputs.mobile_acceptance_target_json || '' }}
          MOBILE_ACCEPTANCE_EVIDENCE_JSON: ${{ inputs.mobile_acceptance_evidence_json || '' }}
          VISUAL_BASELINE_EVIDENCE_JSON: ${{ inputs.visual_baseline_evidence_json || '' }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-v3-definition-of-done.mjs > /tmp/v3.json
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify-stage01-intake-closure.mjs > /tmp/stage01.out
          node verify-zero-loss-accounting.mjs > /tmp/zero-loss.out
          node verify-full-cycle.mjs > /tmp/full-cycle.json
          node verify-data-route-closure.mjs > /tmp/data-route.json
          node verify-infrastructure-route-closure.mjs > /tmp/infrastructure-route.json
          node verify-mobile-release-governance.mjs > /tmp/mobile-governance.json
          USED_MOBILE_CHALLENGES_JSON="$(git ls-remote --tags origin 'refs/tags/mobile-acceptance-challenge-*' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=s.split(/\n/).filter(Boolean).map(l=>l.trim().split(/\s+/)[1]||'').map(r=>r.replace('refs/tags/mobile-acceptance-challenge-','').replace(/\^\{\}$/,'')).filter(Boolean);process.stdout.write(JSON.stringify([...new Set(a)]));});")"
          export USED_MOBILE_CHALLENGES_JSON
          node evaluate-mobile-acceptance-submission.mjs > /tmp/mobile-acceptance.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {evaluateFinalAcceptance} from './final-acceptance.mjs';
          import {execFileSync} from 'node:child_process';
          import {resolveVisualBaselineSubmission} from './visual-baseline-submission.mjs';
          import {applyExecutedEvidence,readExecutedEvidence} from './verification-evidence.mjs';
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('/tmp/v3.json','utf8'));
          const stage01=JSON.parse(fs.readFileSync('/tmp/stage01.out','utf8'));
          const zeroLoss=JSON.parse(fs.readFileSync('/tmp/zero-loss.out','utf8'));
          const fullCycle=JSON.parse(fs.readFileSync('/tmp/full-cycle.json','utf8'));
          const dataRoute=JSON.parse(fs.readFileSync('/tmp/data-route.json','utf8'));
          const infrastructureRoute=JSON.parse(fs.readFileSync('/tmp/infrastructure-route.json','utf8'));
          const mobileGovernance=JSON.parse(fs.readFileSync('/tmp/mobile-governance.json','utf8'));
          const mobileAcceptance=JSON.parse(fs.readFileSync('/tmp/mobile-acceptance.json','utf8'));
          const ingestionText=fs.readFileSync('/tmp/ingestion.out','utf8');
          const stage01RawInputAccounting=Number(Boolean(stage01.stage01IntakeClosure&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01RequiredFileInspectionAccounting=Number(Boolean(stage01.artifactIdentityBound&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01AcceptedSemanticMappingCoverage=Number(Boolean(zeroLoss.zeroLossStage01&&zeroLoss.incompleteIntakeRejected));
          const stage04ObligationAccounting=Number(Boolean(zeroLoss.zeroLossStage04&&zeroLoss.completeStage03ResearchUnion&&zeroLoss.incompleteObligationRejected));
          const negativeMatches=[...ingestionText.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!negativeMatches.length)throw new Error('Ingestion proof did not publish totalNegativeCases.');
          if(dataRoute.dataRouteClosure!=='PASS')throw new Error('Canonical data-route closure proof did not pass.');
          if(infrastructureRoute.infrastructureRouteClosure!=='PASS')throw new Error('Infrastructure route-closure proof did not pass.');
          if(mobileGovernance.mobileReleaseGovernance!=='PASS')throw new Error('Physical-iPhone release-tag governance proof did not pass.');
          // A favorable top-level summary must never mask incomplete detailed proof.
          for(const [key,value] of Object.entries({stage01RawInputAccounting,stage01RequiredFileInspectionAccounting,stage01AcceptedSemanticMappingCoverage,stage04ObligationAccounting})){
            if(v3.section49CoverageMetrics?.[key]?.value!==value)throw new Error(`Conflicting executed metric evidence: ${key}`);
          }
          const physicalIPhoneAccepted=mobileAcceptance.actualIPhoneSafariAcceptance===true&&mobileAcceptance.mobileAcceptanceResult==='ACCEPTED';
          const finalAcceptancePublication=false;
          let report={
            commit:process.env.GITHUB_SHA,
            verificationSource:{runId:process.env.VERIFICATION_RUN_ID,sourceCommit:process.env.VERIFICATION_SOURCE_COMMIT},
            workflow:'mobile-closed-loop/30',
            contractProfileId:'closed-loop-completion-profile/1',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            stageCount:30,
            ...definition,
            ...v3,
            dataRouteClosure:dataRoute.dataRouteClosure,
            infrastructureRouteClosure:infrastructureRoute.infrastructureRouteClosure,
            routeOperationsChecked:dataRoute.operationsChecked,
            routeCanonicalFamilies:dataRoute.canonicalFamilies,
            routeReadEdgesChecked:dataRoute.readEdgesChecked,
            routeWritableCollectionsChecked:dataRoute.writableCollectionsChecked,
            routeWritableFieldsChecked:dataRoute.writableFieldsChecked,
            routeRelationshipDefinitionsChecked:dataRoute.relationshipDefinitionsChecked,
            routeInvalidationStagesChecked:dataRoute.invalidationStagesChecked,
            routeCurrentScopeStaleExclusion:dataRoute.currentScopeStaleExclusion,
            routePromptReadSerialization:dataRoute.promptReadSerialization,
            routeResponseAuthorizationClosure:dataRoute.responseAuthorizationClosure,
            routeProvenanceContractClosure:dataRoute.provenanceContractClosure,
            routeDownstreamForwardingClosure:dataRoute.downstreamForwardingClosure,
            routeDownstreamOnlyInvalidation:dataRoute.downstreamOnlyInvalidation,
            routeSubjectNeutralPromptAuthority:dataRoute.subjectNeutralPromptAuthority,
            routeHumanExperiencePromptContract:dataRoute.humanExperiencePromptContract,
            infrastructureFamiliesChecked:infrastructureRoute.infrastructureFamilies,
            infrastructureRawFirstCapture:infrastructureRoute.rawFirstCapture,
            infrastructurePrecommitRevalidation:infrastructureRoute.precommitRevalidation,
            infrastructureExtractionManifestProvenance:infrastructureRoute.extractionManifestProvenance,
            infrastructurePromptContextManifestRoute:infrastructureRoute.promptContextManifestRoute,
            infrastructureAuthorityPartitionsSeparated:infrastructureRoute.authorityPartitionsSeparated,
            infrastructureCurrentScopeRoute:infrastructureRoute.currentScopeRoute,
            infrastructurePersistenceIntegrityRoute:infrastructureRoute.persistenceIntegrityRoute,
            infrastructureStructuredOperatorActionRoute:infrastructureRoute.structuredOperatorActionRoute,
            currentScopeSelectorCoverage:definition.currentScopeSelectorCoverage,
            exactReqRunTestCoverage:definition.exactReqRunTestCoverage,
            applicableCurrentRegressionSuccess:definition.applicableCurrentRegressionSuccess,
            mandatoryEvidenceChainStructuralCoverage:definition.mandatoryEvidenceChainCoverage,
            mandatoryEvidenceSufficiencyCoverage:v3.mandatoryEvidenceSufficiencyCoverage,
            releaseArtifactIdentityCoverage:definition.releaseArtifactIdentityCoverage,
            unauthorizedFieldMutationsAccepted:definition.unauthorizedFieldMutationsAccepted,
            canonicalMutationsBeforeAcceptance:definition.canonicalMutationsBeforeAcceptance,
            partialCommitsAfterInjectedFailure:definition.partialCommitsAfterInjectedFailure,
            staleProposalsAccepted:definition.staleProposalsAccepted,
            crossProjectRelationshipsAccepted:definition.crossProjectRelationshipsAccepted,
            historicalScopeSatisfyingCurrentGates:definition.historicalScopeSatisfyingCurrentGates,
            unmatchedDeliveryFilesAuthorized:definition.unmatchedDeliveryFilesAuthorized,
            appendOnlyHistoryRewritesAccepted:definition.appendOnlyHistoryRewritesAccepted,
            unsupportedTestIrTreatedAsExecutable:v3.unsupportedTestIrTreatedAsExecutable,
            externalAssertionsOverridingApplicationProof:v3.externalAssertionsOverridingApplicationProof,
            nativeExecutionReceiptsFabricatedExternally:v3.nativeExecutionReceiptsFabricatedExternally,
            releaseAcceptedWithContradiction:v3.releaseAcceptedWithContradiction,
            stage01RawInputAccounting,
            stage01RequiredFileInspectionAccounting,
            stage01AcceptedSemanticMappingCoverage,
            stage04ObligationAccounting,
            stagesCompleted:Number(fullCycle.stagesCompleted||0),
            negativeCasesPassed:Number(negativeMatches.at(-1)[1]),
            deployedByteIdentity:process.env.LIVE_RESULT==='success',
            deploymentManifestSchema:'closed-loop-deployment-manifest/1',
            finalDeploymentResourceIdentityCoverage:process.env.LIVE_RESULT==='success'?1:0,
            localChromiumAcceptance:process.env.TEST_RESULT==='success',
            deployedChromiumAcceptance:process.env.LIVE_RESULT==='success',
            testedBrowserWidths:[320,393,'desktop'],
            mobileReleaseTagGovernanceCoverage:Number(mobileGovernance.mobileReleaseGovernance==='PASS'),
            ...mobileAcceptance,
            finalAcceptancePublication,
            releaseTagEligible:finalAcceptancePublication,
            realThirtyStageProjectAcceptance:false,
            fullProductionMaturity:false,
            jobResults:{test:process.env.TEST_RESULT,deploy:process.env.DEPLOY_RESULT,live:process.env.LIVE_RESULT,physicalIPhone:mobileAcceptance.physicalIPhoneJobResult},
            nextProofStep:finalAcceptancePublication?'Use the authorized repository connection to recheck this exact acceptance report, consume its unused challenge marker, and create the release tag for this commit.':'Pinned actual-iPhone Safari acceptance for the exact deployed commit and deployment manifest.',
            proofSources:{
              ownership:'verify.mjs',
              canonicalDataRoutes:'verify-data-route-closure.mjs',
              infrastructureRoutes:'verify-infrastructure-route-closure.mjs',
              migration:'verify-v3-migration.mjs',
              stage01:'verify-stage01-intake-closure.mjs',
              stage01Reuse:'verify-one-time-intent-intake.mjs',
              stage04:'verify-zero-loss-accounting.mjs',
              testIr:'verify-test-runtime-v3.mjs',
              limits:'verify-test-runtime-limits.mjs',
              ingestion:'verify-ingestion.mjs',
              workflow:'verify-complete.mjs',
              fullCycle:'verify-full-cycle.mjs',
              prompts:'verify-prompt-semantics.mjs',
              localBrowser:'verify-browser.mjs and verify-browser-extra.mjs',
              deployedIdentity:'verify-live.mjs or evaluate-mobile-acceptance-submission.mjs exact deployed manifest/resource verification',
              deploymentManifest:'build-static-site.mjs and verify-deployment-manifest.mjs',
              deployedBrowser:'verify-browser.mjs and verify-browser-extra.mjs',
              physicalIPhoneReleaseGovernance:'verify-mobile-release-governance.mjs',
              physicalIPhoneAcceptance:physicalIPhoneAccepted?`${mobileAcceptance.mobileAcceptanceEvidenceId} (${mobileAcceptance.mobileAcceptanceEvidenceBasis})`:'BLOCKED_ENVIRONMENT or BLOCKED: current physical-device evidence did not satisfy the gate'
            }
          };
          const mobileMetric=report.section49CoverageMetrics.actualIPhoneSafariAcceptanceCoverage;
          mobileMetric.numerator=Number(physicalIPhoneAccepted);
          mobileMetric.value=Number(physicalIPhoneAccepted);
          mobileMetric.disposition=physicalIPhoneAccepted?'SATISFIED':mobileAcceptance.mobileAcceptanceResult;
          mobileMetric.scopeHash=`commit:${report.commit}:manifest:${mobileAcceptance.mobileAcceptanceDeploymentManifestDigest||'UNPROVEN'}`;
          mobileMetric.evidenceReferences=physicalIPhoneAccepted?[`mobile-evidence:${mobileAcceptance.mobileAcceptanceEvidenceId}`,`submitter:${mobileAcceptance.mobileAcceptanceSubmitter}`]:['evaluate-mobile-acceptance-submission.mjs:physical-proof-unavailable'];
          report.actualIPhoneSafariAcceptanceCoverage=mobileMetric.value;
          const executedEvidence=readExecutedEvidence('.verification-receipts/evidence.json');
          report=applyExecutedEvidence(report,executedEvidence);
          // Resolve only the supplied exact source object in this repository.
          // A shallow checkout may need that immutable predecessor object; no
          // branch, checkout, workflow run, or published history is changed.
          if(process.env.VISUAL_BASELINE_EVIDENCE_JSON?.trim()){
            let sourceCommit;
            try{sourceCommit=JSON.parse(process.env.VISUAL_BASELINE_EVIDENCE_JSON)?.sourceCommit;}catch{} // The owning parser reports malformed input.
            if(typeof sourceCommit==='string'&&/^[0-9a-f]{40}$/.test(sourceCommit)){
              try{execFileSync('git',['cat-file','-e',`${sourceCommit}^{commit}`],{stdio:'pipe',timeout:30000});}
              catch{execFileSync('git',['fetch','--no-tags','--depth=1','origin',sourceCommit],{stdio:'pipe',timeout:30000});}
            }
          }
          const visualBaseline=resolveVisualBaselineSubmission({
            inputJson:process.env.VISUAL_BASELINE_EVIDENCE_JSON,
            ledgerVisualBaseline:JSON.parse(fs.readFileSync('verification/closed-loop-build-state.json','utf8')).visualBaseline,
            eventName:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,
            submitter:process.env.GITHUB_ACTOR,commit:report.commit,
            deploymentManifestDigest:report.mobileAcceptanceDeploymentManifestDigest
          });
          const finalGate=evaluateFinalAcceptance(report,{visualBaseline,executedEvidence});
          report.finalAcceptanceGate=finalGate;
          report.finalAcceptancePublication=finalGate.accepted;
          report.releaseTagEligible=finalGate.accepted;
          report.visualBaselineEvidence=visualBaseline;
          report.nextProofStep=finalGate.accepted?'Use the authorized repository connection to recheck this exact acceptance report, consume its unused challenge marker, and create the release tag for this commit.':finalGate.blockers.map(item=>`${item.requiredActor}: ${item.code} (${item.path})`).join('; ');
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          if(!process.env.GITHUB_OUTPUT)throw new Error('GITHUB_OUTPUT is unavailable.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,[
            `actual_iphone=${report.actualIPhoneSafariAcceptance}`,
            `final_acceptance=${report.finalAcceptancePublication}`,
            ''
          ].join('\n'));
          NODE
      - name: Upload acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-loop-acceptance-${{ github.sha }}-${{ github.run_id }}
          path: closed-loop-acceptance.json
      - name: Record blocked actual-iPhone acceptance
        if: steps.acceptance.outputs.final_acceptance != 'true'
        run: |
          set -euo pipefail
          echo "::notice title=Release tag blocked::Final Section 49 and actor acceptance is not proven for ${GITHUB_SHA}; see closed-loop-acceptance.json blockers. No release tag was created."
          test "${{ steps.acceptance.outputs.final_acceptance }}" = false
      - name: Record release tag eligibility for authorized repository connection
        if: steps.acceptance.outputs.final_acceptance == 'true'
        run: |
          set -euo pipefail
          echo "::notice title=Release tag eligible::Recheck closed-loop-acceptance.json through the authorized repository connection, consume its unused challenge marker, and publish the tag for ${GITHUB_SHA}."
