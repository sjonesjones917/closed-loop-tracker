name: Verify and deploy the single reliability app
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'controller3-current-runtime-closure-20260904'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply current-spec runtime closure and self-restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin controller3-runtime-current-spec-closure controller/repository-completion-v3-r2-20260904 main
          git show origin/controller3-runtime-current-spec-closure:.github/workflows/controller3-runtime-repair.yml > /tmp/source-repair.yml
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap, subprocess
          source=Path('/tmp/source-repair.yml').read_text()
          m=re.search(r"python3 - <<'PY'\n(.*?)\n\s*PY\n",source,re.S)
          if not m:
              raise SystemExit('repair source python block not found')
          Path('/tmp/runtime-repair.py').write_text(textwrap.dedent(m.group(1)))
          subprocess.run(['python3','/tmp/runtime-repair.py'],check=True)

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'expected one anchor in {path}, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          # The current capability contract requires the verifier fixture to use canonical capability records, not prose.
          old="const p=project('JOB-RELIABILITY-V2');p.job.CURRENT_REQUIREMENTS_VERSION='REQUIREMENTS-v001';p.job.CURRENT_TEST_SUITE_VERSION='TEST-SUITE-v001';p.job.AVAILABLE_TOOLS='CAP-EXTERNAL_AGENT_TOOL; CAP-EXTERNAL_SYSTEM';const scope=engine.currentScope(p);\n const req=record('requirements',4,{MANDATORY_OPTIONAL_STATUS:'MANDATORY',STATUS:'ACTIVE'},'REQ-V2');req.scope={...scope};p.projectData.requirements.push(req);"
          new="const p=project('JOB-RELIABILITY-V2');p.job.CURRENT_REQUIREMENTS_VERSION='REQUIREMENTS-v001';p.job.CURRENT_TEST_SUITE_VERSION='TEST-SUITE-v001';p.job.AVAILABLE_TOOLS='CAP-EXTERNAL_AGENT_TOOL; CAP-EXTERNAL_SYSTEM';const scope=engine.currentScope(p);\n const req=record('requirements',4,{MANDATORY_OPTIONAL_STATUS:'MANDATORY',STATUS:'ACTIVE'},'REQ-V2');req.scope={...scope};p.projectData.requirements.push(req);\n for(const capability of ['CAP-EXTERNAL_AGENT_TOOL','CAP-EXTERNAL_SYSTEM']){const c=record('externalCapabilities',0,{CAPABILITY_CLAIM:capability,FRESHNESS_STATUS:'CURRENT',STATUS:'CURRENT',AUTHORIZED:true,PERMISSIONS_READY:true,INPUTS_TRANSFERABLE:true,ROUTE_USABLE:true,EVIDENCE_OBTAINABLE:true},`CAPABILITY-${capability}`);c.scope={inputVersion:p.job.CURRENT_INPUT_VERSION};p.projectData.externalCapabilities.push(c);}"
          replace_once('verify-complete.mjs',old,new)

          old="extractedStatements:[{statementKey:`S${i+1}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT'}]"
          new="extractedStatements:[{statementKey:`S${i+1}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT',sourceLocation:u.kind==='SUPPLIED_MATERIAL'?u.sourceLocation:undefined}]"
          replace_once('verify-spec-grounded-route-oracle.mjs',old,new)

          p=Path('verify-capability-readiness.mjs'); s=p.read_text()
          s=s.replace("globalThis.crypto=webcrypto;","if(!globalThis.crypto)Object.defineProperty(globalThis,'crypto',{value:webcrypto,configurable:true});")
          p.write_text(s)
          PY

          git checkout origin/controller/repository-completion-v3-r2-20260904 -- verify-build-stage-ledger.mjs
          rm -f implementation/closed-loop-build-state.json

          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node verify-contract-closure.mjs
          node verify-capability-readiness.mjs
          node verify-stage01-intake-closure.mjs
          node verify-stage01-disposition-contract.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-build-stage-ledger.mjs

          git checkout origin/main -- .github/workflows/pages.yml
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add -A
          git commit -m 'Enforce current runtime closure contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
