name: Deploy application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime syntax
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do node --check "$file"; done
      - name: Current v3 contract
        run: node verify-spec3-contract.mjs
      - name: V3 ownership and schema contract
        run: node verify-v3-contract.mjs
      - name: Migration contract
        run: node verify-v3-migration.mjs
      - name: Test IR deterministic runtime
        run: node verify-test-runtime.mjs
      - name: Test IR v3 semantics
        run: node verify-test-runtime-v3.mjs
      - name: Test IR limits and isolation
        run: node verify-test-runtime-limits.mjs
      - name: Raw-first ingestion
        run: node verify-ingestion.mjs
      - name: Workflow gate closure
        run: node verify-complete.mjs
      - name: Semantic authority invariants
        run: node verify-semantic-invariant.mjs
      - name: Prompt semantics
        run: node verify-prompt-semantics.mjs
      - name: Every stage prompt
        run: node verify-all-stage-prompts.mjs
      - name: Stage prompt completeness
        run: node verify-stage-prompts-complete.mjs
      - name: Stage 01 intake closure
        run: node verify-stage01-intake-closure.mjs
      - name: One-time intent intake
        run: node verify-one-time-intent-intake.mjs
      - name: User prompt invariants
        run: node verify-user-prompt-invariants.mjs
      - name: Full 30-stage cycle
        run: node verify-full-cycle.mjs
      - name: Project lifecycle
        run: node verify-project-lifecycle.mjs
      - name: Definition of done
        run: node verify-definition-of-done.mjs
      - name: V3 definition of done
        run: node verify-v3-definition-of-done.mjs > acceptance-source.json
      - name: Local Chromium operator workflow
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .1; done
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-human-stage-walkthrough.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-mobile-stage-action.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: source-acceptance
          path: acceptance-source.json
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static application
        run: |
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact deployed bytes
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node verify-live.mjs > acceptance-live.json
      - name: Deployed Chromium operator workflow
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          node verify-browser.mjs
          node verify-browser-extra.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-mobile-stage-action.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-acceptance
          path: acceptance-live.json
