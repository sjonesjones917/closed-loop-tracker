name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: tar --exclude=.git -czf /tmp/pr-source.tar.gz .
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do
            node --check "$file"
          done

      - name: Schema, ownership, and single-architecture proof
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          if(/<script(?![^>]*\bsrc=)/i.test(html))throw new Error('Inline script execution is prohibited.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs

      - name: Migration and v3 contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion and negative cases
        run: |
          set -euo pipefail
          node verify-ingestion.mjs

      - name: Workflow, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs

      - name: Prompt semantics and leakage
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs

      - name: Focused completion-amendment regressions
        run: |
          set -euo pipefail
          node verify-amendment-engine-safety.mjs
          node verify-artifact-store-security.mjs
          node verify-evidence-no-elevation.mjs
          node verify-failure-variance-environment.mjs
          node verify-identity-action-idempotency.mjs
          node verify-independence-dimensions.mjs
          node verify-proof-obligation-routing.mjs
          node verify-response-reservation-binding.mjs
          node verify-semantic-closure-bypasses.mjs
          node verify-semantic-review-binding.mjs
          node verify-source-search-evidence-binding.mjs
          node verify-single-runtime-authority.mjs
          node verify-spec-grounded-route-oracle.mjs
          node verify-store-reservation.mjs
          node verify-terminal-release-safety.mjs
          node verify-terminal-chain-reentry.mjs

      - name: Build exact static application
        run: |
          set -euo pipefail
          node verify-deployment-pipeline.mjs
          rm -rf _site _site-rebuild
          mkdir _site _site-rebuild
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site/
          SOURCE_COMMIT="$GITHUB_SHA" WORKFLOW_RUN_ID="$GITHUB_RUN_ID" BUILD_ENVIRONMENT_IDENTITY="ubuntu-latest-node-22" node build-deployment-manifest.mjs _site
          node verify-deployment-manifest.mjs _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site-rebuild/
          SOURCE_COMMIT="$GITHUB_SHA" WORKFLOW_RUN_ID="$GITHUB_RUN_ID" BUILD_ENVIRONMENT_IDENTITY="ubuntu-latest-node-22" node build-deployment-manifest.mjs _site-rebuild
          node verify-deployment-manifest.mjs _site-rebuild
          diff -r --no-dereference _site _site-rebuild
          rm -rf _site-rebuild

      - name: Local Chromium operator path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          python3 -m http.server 4173 --directory _site >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            verifier_timeout_seconds="${BROWSER_VERIFIER_TIMEOUT_SECONDS:-300}"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              echo "Starting ${script} attempt ${attempt} with a ${verifier_timeout_seconds}s hard limit."
              set +e
              timeout --signal=TERM --kill-after=5s "${verifier_timeout_seconds}s" node "$script" 2>&1 | tee "$log"
              status="${PIPESTATUS[0]}"
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              echo "${script} attempt ${attempt} failed with status ${status}."
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload exact verified site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-loop-site-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  deploy:
    name: Deploy exact verified bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Download exact verified site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-loop-site-${{ github.sha }}
          path: _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-live:
    name: Verify deployed bytes and operator path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download exact verified site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-loop-site-${{ github.sha }}
          path: _site
      - name: Verify downloaded deployment artifact
        run: node verify-deployment-manifest.mjs _site
      - name: Exact deployed-byte verification
        run: node verify-live.mjs
      - name: Deployed Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            verifier_timeout_seconds="${BROWSER_VERIFIER_TIMEOUT_SECONDS:-300}"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              echo "Starting ${script} attempt ${attempt} with a ${verifier_timeout_seconds}s hard limit."
              set +e
              timeout --signal=TERM --kill-after=5s "${verifier_timeout_seconds}s" node "$script" 2>&1 | tee "$log"
              status="${PIPESTATUS[0]}"
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              echo "${script} attempt ${attempt} failed with status ${status}."
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    name: Publish machine acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download exact verified site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-loop-site-${{ github.sha }}
          path: _site
      - name: Build acceptance artifact from executed proof jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-v3-definition-of-done.mjs > /tmp/v3.json
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify-stage01-intake-closure.mjs > /tmp/stage01.out
          node verify-zero-loss-accounting.mjs > /tmp/zero-loss.out
          node verify-test-runtime-v3.mjs > /tmp/test-runtime-v3.json
          node verify-full-cycle.mjs > /tmp/full-cycle.json
          node verify-data-route-closure.mjs > /tmp/data-route.json
          node verify-infrastructure-route-closure.mjs > /tmp/infrastructure-route.json
          node verify-amendment-engine-safety.mjs > /tmp/amendment-engine-safety.json
          node verify-artifact-store-security.mjs > /tmp/artifact-store-security.json
          node verify-evidence-no-elevation.mjs > /tmp/evidence-no-elevation.json
          node verify-failure-variance-environment.mjs > /tmp/failure-variance-environment.json
          node verify-identity-action-idempotency.mjs > /tmp/identity-action-idempotency.json
          node verify-independence-dimensions.mjs > /tmp/independence-dimensions.json
          node verify-proof-obligation-routing.mjs > /tmp/proof-obligation-routing.json
          node verify-response-reservation-binding.mjs > /tmp/response-reservation-binding.json
          node verify-semantic-closure-bypasses.mjs > /tmp/semantic-closure-bypasses.json
          node verify-semantic-review-binding.mjs > /tmp/semantic-review-binding.json
          node verify-source-search-evidence-binding.mjs > /tmp/source-search-evidence-binding.json
          node verify-single-runtime-authority.mjs > /tmp/single-runtime-authority.json
          node verify-spec-grounded-route-oracle.mjs > /tmp/spec-grounded-route-oracle.json
          node verify-store-reservation.mjs > /tmp/store-reservation.json
          node verify-terminal-release-safety.mjs > /tmp/terminal-release-safety.json
          node verify-terminal-chain-reentry.mjs > /tmp/terminal-chain-reentry.json
          node verify-deployment-pipeline.mjs > /tmp/deployment-pipeline.json
          node verify-deployment-manifest.mjs _site > /tmp/deployment-manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('/tmp/v3.json','utf8'));
          const stage01=JSON.parse(fs.readFileSync('/tmp/stage01.out','utf8'));
          const zeroLoss=JSON.parse(fs.readFileSync('/tmp/zero-loss.out','utf8'));
          const testRuntimeV3=JSON.parse(fs.readFileSync('/tmp/test-runtime-v3.json','utf8'));
          const fullCycle=JSON.parse(fs.readFileSync('/tmp/full-cycle.json','utf8'));
          const dataRoute=JSON.parse(fs.readFileSync('/tmp/data-route.json','utf8'));
          const infrastructureRoute=JSON.parse(fs.readFileSync('/tmp/infrastructure-route.json','utf8'));
          const amendmentEngineSafety=JSON.parse(fs.readFileSync('/tmp/amendment-engine-safety.json','utf8'));
          const artifactStoreSecurity=JSON.parse(fs.readFileSync('/tmp/artifact-store-security.json','utf8'));
          const evidenceNoElevation=JSON.parse(fs.readFileSync('/tmp/evidence-no-elevation.json','utf8'));
          const failureVarianceEnvironment=JSON.parse(fs.readFileSync('/tmp/failure-variance-environment.json','utf8'));
          const identityActionIdempotency=JSON.parse(fs.readFileSync('/tmp/identity-action-idempotency.json','utf8'));
          const independenceDimensions=JSON.parse(fs.readFileSync('/tmp/independence-dimensions.json','utf8'));
          const proofObligationRouting=JSON.parse(fs.readFileSync('/tmp/proof-obligation-routing.json','utf8'));
          const responseReservationBinding=JSON.parse(fs.readFileSync('/tmp/response-reservation-binding.json','utf8'));
          const semanticClosureBypasses=JSON.parse(fs.readFileSync('/tmp/semantic-closure-bypasses.json','utf8'));
          const semanticReviewBinding=JSON.parse(fs.readFileSync('/tmp/semantic-review-binding.json','utf8'));
          const sourceSearchEvidenceBinding=JSON.parse(fs.readFileSync('/tmp/source-search-evidence-binding.json','utf8'));
          const singleRuntimeAuthority=JSON.parse(fs.readFileSync('/tmp/single-runtime-authority.json','utf8'));
          const specGroundedRouteOracle=JSON.parse(fs.readFileSync('/tmp/spec-grounded-route-oracle.json','utf8'));
          const storeReservation=JSON.parse(fs.readFileSync('/tmp/store-reservation.json','utf8'));
          const terminalReleaseSafety=JSON.parse(fs.readFileSync('/tmp/terminal-release-safety.json','utf8'));
          const terminalChainReentry=JSON.parse(fs.readFileSync('/tmp/terminal-chain-reentry.json','utf8'));
          const deploymentPipeline=JSON.parse(fs.readFileSync('/tmp/deployment-pipeline.json','utf8'));
          const deploymentManifest=JSON.parse(fs.readFileSync('/tmp/deployment-manifest.json','utf8'));
          const ingestionText=fs.readFileSync('/tmp/ingestion.out','utf8');
          const stage01RawInputAccounting=Number(Boolean(stage01.stage01IntakeClosure&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01RequiredFileInspectionAccounting=Number(Boolean(stage01.artifactIdentityBound&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01AcceptedSemanticMappingCoverage=Number(Boolean(zeroLoss.zeroLossStage01&&zeroLoss.incompleteIntakeRejected));
          const stage04ObligationAccounting=Number(Boolean(zeroLoss.zeroLossStage04&&zeroLoss.completeStage03ResearchUnion&&zeroLoss.incompleteObligationRejected));
          const negativeMatches=[...ingestionText.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!negativeMatches.length)throw new Error('Ingestion proof did not publish totalNegativeCases.');
          if(dataRoute.dataRouteClosure!=='PASS')throw new Error('Canonical data-route closure proof did not pass.');
          if(infrastructureRoute.infrastructureRouteClosure!=='PASS')throw new Error('Infrastructure route-closure proof did not pass.');
          const requireTrue=(record,keys,label)=>{for(const key of keys)if(record?.[key]!==true)throw new Error(`${label} did not establish ${key}.`);};
          if(testRuntimeV3.verifyTestRuntimeV3!=='PASS')throw new Error('Test IR runtime v3 proof did not pass.');
          requireTrue(testRuntimeV3,['staleWorkerBuildRejected','staleWorkerProtocolRejected','wrongWorkerDigestRejected','wrongInputBindingRejected','undeclaredWorkerBindingRejected','preExecutionWorkerByteMismatchRejected','observedWorkerIdentityPersisted','nativeCommitAuthorityBound'],'Test IR runtime worker-authority proof');
          requireTrue(amendmentEngineSafety,['strictIntake','legacyDispositionRejected','artifactInspectionBound','proofAstClosed','terminalFailClosed','reservationBinding'],'Amendment-engine safety proof');
          requireTrue(artifactStoreSecurity,['filenameContract','disclosureFailClosed','secretScanHonest','formatIdentity','packageAllowlist','importPreActivationLimits','restoreCloneExplicit','stagedAtomicRecovery','backupCheckpointPolicy','singleStoreAuthority'],'Artifact-store security proof');
          requireTrue(evidenceNoElevation,['separateObservationAndEntailmentOperations','externalClaimNotElevatedOnIngestion','independentNormalizationBoundToExactRunAndLeaf','originPreserved','reusedContextRejected','wrongRunRejected','idempotent'],'Evidence authority proof');
          requireTrue(failureVarianceEnvironment,['executableNowRequiresExecutionEvidence','futureTargetDeferralValidated','deferredNeverMarkedExecuted','dueDeferredBlocksUntilRecordedExecution','availableTargetCannotBeDeferred','allowedVarianceNeedsNoDefect','prohibitedVarianceRequiresDefect','unknownVarianceBlocks','expectedVarianceFrozenBeforeRuns','candidateFreezeDerivesSetHashes','materialEnvironmentUnknownOrExpiredBlocks','materialEnvironmentDifferenceDetected','sameBytesDoNotOverrideEnvironmentChange'],'Failure, variance, and environment proof');
          requireTrue(identityActionIdempotency,['identityActionIdempotency','candidateFreezeIdempotent','unchangedIterationIdempotent','baselineFreezeIdempotent','productReservationIdempotent','conflictingReuseRejected','singleCommandAuthority'],'Identity-producing action idempotency proof');
          requireTrue(independenceDimensions,['independenceDimensions','applicationIsolationSeparate','providerStateNotElevated','reuseDetected','proofPolicyControlsBasis','ruleOfThreeSuppressed','environmentUnknownFailsClosed'],'Independence-dimension proof');
          requireTrue(proofObligationRouting,['humanInspectionBasis','independentReviewDimensions','nativeArtifactBinding','futureProductBindingPreserved','requiredProofLeafClosure','weakerBasisRejected','responseLocalProofLeafResolution'],'Proof-obligation routing proof');
          requireTrue(responseReservationBinding,['reservationBindingValidated','wrongReservationRejected','wrongNonceRejected','wrongPackageRejected','unboundPreviewRejected','reservationConsumed','exactRetryIdempotent','correctionSuperseded','unboundCorrectionPromptPrevented','abandonmentCancelled'],'Response-reservation proof');
          requireTrue(semanticClosureBypasses,['stage01ChallengeGate','stage02BoundedSearchGate','stage04AtomicityChallengeGate','stage05SemanticClosureGate','stage05EquivalenceReviewGate','stage06SelfReviewBlocked'],'Semantic-closure bypass proof');
          requireTrue(semanticReviewBinding,['distinctReviewAccepted','exactTargetHashBound','wrongHashRejected','reusedAuthorContextRejected'],'Semantic-review binding proof');
          requireTrue(sourceSearchEvidenceBinding,['fabricatedEvidenceRejected','missingEvidenceRejected','staleEvidenceRejected','wrongScopeEvidenceRejected','crossProjectEvidenceRejected','currentCanonicalEvidenceAccepted','currentCanonicalReceiptAccepted','noApplicableSourceRulesPreserved'],'Source-search evidence-binding proof');
          if(singleRuntimeAuthority.singleRuntimeAuthority!=='PASS'||singleRuntimeAuthority.runtimePromptWrapperCount!==0||!Array.isArray(singleRuntimeAuthority.authorities)||!singleRuntimeAuthority.authorities.length)throw new Error('Single-runtime-authority proof did not establish one final prompt authority and an inspectable authority inventory.');
          requireTrue(singleRuntimeAuthority,['postFinalExportMutationRejected','frozenRuntimeAuthorities','sharedPromptEntryPoint'],'Single-runtime-authority proof');
          if(specGroundedRouteOracle.specGroundedRouteOracle!=='PASS')throw new Error('Specification-grounded route oracle did not pass.');
          requireTrue(specGroundedRouteOracle,['currentScopeSelectors','independentReadWriteOracle','withheldContextOracle','promptGenerationCannotSilentlySkip','downstreamForwardingOracle','operatorDoubleCheckGuidance','humanExperiencePromptContract','infrastructureFamiliesPresent'],'Specification-grounded route oracle');
          requireTrue(storeReservation,['stagedArtifactLifecycle','startupArtifactReconciliation','atomicArtifactPromotion','reservationBoundPackage','reservationPersistedBeforePackage'],'Store/reservation proof');
          if(storeReservation.reservationNonceBits!==128||storeReservation.duplicateAuthoritativeReservations!==0)throw new Error('Store/reservation proof did not establish its exact nonce or duplicate-reservation boundary.');
          requireTrue(terminalReleaseSafety,['completeProductArtifactSetRequired','authorizedFilenameIdentityRequired','activeRegressionExecutionsRequired','explicitPostCorrectionPhaseRequired','distinctLaterExecutionRequired','historicalPostCorrectionSurvivesCurrentScopeAdvance','invalidatedPostCorrectionRejected','latestApplicableRegressionExecutionRequired','unsupportedRetirementRejected','registryRepairProven'],'Terminal-release safety proof');
          requireTrue(terminalChainReentry,['tenRunLeafInstancesAccepted','duplicateRunEntailmentRejected','skeletalEvidenceChainRejected','postReleaseDeliveryPreserved','reentryAtResponsibleStage','reentryIdempotent'],'Terminal chain and post-release re-entry proof');
          if(deploymentPipeline.deploymentPipelineVerification!=='PASS')throw new Error('Deployment-pipeline proof did not pass.');
          requireTrue(deploymentPipeline,['exactArtifactHandoff','pinnedActions','sharedCanonicalizer','cleanAndWarmBrowserProof'],'Deployment-pipeline proof');
          if(deploymentPipeline.rebuildInDeploy!==false||deploymentPipeline.rebuildInLiveVerification!==false)throw new Error('Deployment-pipeline proof did not establish zero post-test rebuilds.');
          if(deploymentManifest.deploymentManifestVerification!=='PASS')throw new Error('Deployment-manifest proof did not pass.');
          if(testRuntimeV3.runtimeBuildIdentity!==deploymentManifest.buildIdentity)throw new Error('Test IR runtime build identity differs from the deployed build identity.');
          if(testRuntimeV3.testWorkerSha256!==deploymentManifest.workerDigest)throw new Error('Test IR worker byte identity differs from the deployed worker digest.');
          if(!/^closed-loop-test-worker-protocol\/\d+$/.test(String(testRuntimeV3.workerProtocolVersion||'')))throw new Error('Test IR worker protocol identity is missing or invalid.');
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            stageCount:30,
            ...definition,
            ...v3,
            dataRouteClosure:dataRoute.dataRouteClosure,
            infrastructureRouteClosure:infrastructureRoute.infrastructureRouteClosure,
            routeOperationsChecked:dataRoute.operationsChecked,
            routeCanonicalFamilies:dataRoute.canonicalFamilies,
