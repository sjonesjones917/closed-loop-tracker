name: Apply Stage 5 requirement resolution semantics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/complete-closed-loop-spec-20260831' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-stage5.py
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check prompt-engine.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js response-ingestion.js prompt-engine.js index.html app-core.js test-runtime.js
          git commit -m "Make Stage 5 commit corrected requirement versions"
          git push origin HEAD:${{ github.head_ref }}
