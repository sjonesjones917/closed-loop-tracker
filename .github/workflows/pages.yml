name: Verify and deploy the single reliability app
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'controller3-runtime-current-main-replay-20260904'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore canonical workflow after verified current runtime replay
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node verify-full-cycle.mjs
          node verify-capability-readiness.mjs
          node verify-stage01-intake-closure.mjs
          node verify-build-stage-ledger.mjs
          git fetch origin main
          git checkout origin/main -- .github/workflows/pages.yml
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add .github/workflows/pages.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Restore canonical Pages verification workflow'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
