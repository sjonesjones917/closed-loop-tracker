name: Diagnostic Stage 30 suffix and final backup on frozen 50f53978

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-stage30-suffix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage30-suffix-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIAG_OUT: ${{ github.workspace }}/stage30-suffix-diagnostic
      BROWSER: /usr/bin/google-chrome
      NODE_OPTIONS: ''
    steps:
      - name: Check out the exact original tested application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Require the original runtime and prepare a fresh diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DIAG_OUT"
          mkdir "$DIAG_OUT"
          node --version | tee "$DIAG_OUT/node-version.txt"
          "$BROWSER" --product-version | tee "$DIAG_OUT/chrome-version.txt"
          test "$(node --version)" = v22.23.3
          test "$("$BROWSER" --product-version)" = 156.0.8078.79
          uname -a > "$DIAG_OUT/uname.txt"
          python3 - <<'IDENTITY'
          import json, os
          from pathlib import Path
          fields=('GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF')
          (Path(os.environ['DIAG_OUT'])/'diagnostic-workflow-identity.json').write_text(json.dumps({key:os.environ[key] for key in fields},indent=2)+'\n')
          IDENTITY
      - name: Authenticate the exact retained completion artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/sjonesjones917/closed-loop-tracker/actions/artifacts/13584232921 > "$DIAG_OUT/original-artifact-metadata.json"
          python3 - <<'METADATA'
          import json, os
          from pathlib import Path
          metadata=json.loads((Path(os.environ['DIAG_OUT'])/'original-artifact-metadata.json').read_text())
          assert metadata['id']==13584232921
          assert metadata['size_in_bytes']==2490627623
          assert metadata['digest']=='sha256:e69c1b720115c28c623877868404865c239879b680b491df4679f314bfc53092'
          assert metadata['expired'] is False
          assert metadata['workflow_run']['id']==42395549736
          assert metadata['workflow_run']['repository_id']==1341211619
          assert metadata['workflow_run']['head_repository_id']==1341211619
          assert metadata['workflow_run']['head_sha']=='3e576f4f35bf28aebe3de29d3d0fb5602fce86b0'
          assert metadata['workflow_run']['head_branch']=='diagnostic/stage30-completion-50f53978'
          METADATA
          test ! -e "$RUNNER_TEMP/stage30-suffix-original.zip"
          gh api repos/sjonesjones917/closed-loop-tracker/actions/artifacts/13584232921/zip > "$RUNNER_TEMP/stage30-suffix-original.zip"
      - name: Materialize the six reviewed external diagnostic helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$DIAG_OUT/runner-helpers"
          cat > "$DIAG_OUT/runner-helpers/restore-profile.py" <<'FROZEN_HELPER_0'
          #!/usr/bin/env python3
          """Restore only the authenticated synthetic native profile into a fresh copy.

          This diagnostic utility neither changes an original artifact nor creates test
          receipts. It is intended for the isolated Linux runner, not the active Mac run.
          """
          import argparse
          import hashlib
          import json
          import pathlib
          import stat
          import zipfile

          ARTIFACT_SHA256 = 'e69c1b720115c28c623877868404865c239879b680b491df4679f314bfc53092'
          ARTIFACT_BYTES = 2490627623
          PREFIX = 'replay/profile/'
          PROFILE_FILES = 5464
          PROFILE_BYTES = 1275130437
          CHROME_VERSION = '156.0.8078.79'


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def sha256_file(file):
              value = hashlib.sha256()
              with file.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(chunk)
              return value.hexdigest()


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--archive', type=pathlib.Path, required=True)
              parser.add_argument('--directory', type=pathlib.Path, required=True)
              args = parser.parse_args()
              archive = args.archive.resolve(strict=True)
              output = args.directory.resolve()
              require(archive.is_file(), 'Original archive is not a regular file')
              require(archive.stat().st_size == ARTIFACT_BYTES, 'Original archive size mismatch')
              require(sha256_file(archive) == ARTIFACT_SHA256, 'Original archive SHA-256 mismatch')
              require(not output.exists(), 'Diagnostic browser directory must be fresh')
              with zipfile.ZipFile(archive) as zipped:
                  members = [item for item in zipped.infolist() if item.filename.startswith(PREFIX)]
                  require(len(members) == PROFILE_FILES, 'Original profile member count mismatch')
                  require(sum(item.file_size for item in members) == PROFILE_BYTES, 'Original profile byte count mismatch')
                  seen = set()
                  selected = []
                  for item in members:
                      suffix = item.filename[len(PREFIX):]
                      relative = pathlib.PurePosixPath(suffix)
                      require(suffix and not relative.is_absolute(), 'Invalid profile path')
                      require(all(part not in ('', '.', '..') for part in suffix.split('/')), 'Noncanonical profile path')
                      require('\\' not in suffix and '\x00' not in suffix, 'Ambiguous profile path')
                      require(suffix not in seen, 'Duplicate original profile path')
                      require(not item.is_dir(), 'Unexpected explicit directory member')
                      mode = item.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFREG), 'Nonregular profile entry is not extracted')
                      seen.add(suffix)
                      selected.append((item, relative))
                  require(zipped.read(PREFIX + 'Last Version').decode().strip() == CHROME_VERSION,
                          'Original native Chrome profile version mismatch')
                  output.mkdir(parents=True, exist_ok=False)
                  profile = output / 'profile'
                  profile.mkdir()
                  records = []
                  for item, relative in selected:
                      destination = profile.joinpath(*relative.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      digest = hashlib.sha256()
                      size = 0
                      with zipped.open(item) as source, destination.open('xb') as target:
                          for chunk in iter(lambda: source.read(1024 * 1024), b''):
                              size += len(chunk)
                              require(size <= item.file_size, 'Archive member exceeds its declared size')
                              digest.update(chunk)
                              target.write(chunk)
                      require(size == item.file_size, 'Profile member byte count mismatch')
                      records.append({'path': relative.as_posix(), 'byteSize': size, 'sha256': digest.hexdigest()})
                  # Preserve the original manifest and every original served runtime byte.
                  site_members = [item for item in zipped.infolist() if item.filename.startswith('site/')]
                  expected_site = {'.nojekyll', 'TEST_PROJECT.json', 'app-core.js',
                      'closed-loop-deployment-manifest.json', 'hash.js', 'index.html',
                      'project-store.js', 'prompt-engine.js', 'response-ingestion.js',
                      'test-runtime.js', 'test-worker.js', 'workbook.js',
                      'workflow-engine.js', 'workflow-schema.js'}
                  require(len(site_members) == 14 and sum(item.file_size for item in site_members) == 3970967,
                          'Original site inventory mismatch')
                  require({item.filename[5:] for item in site_members} == expected_site,
                          'Original site has missing, duplicate or unexpected members')
                  site = output.parent / 'site'
                  site.mkdir(exist_ok=False)
                  site_records = []
                  for item in site_members:
                      suffix = item.filename[5:]
                      require(not item.is_dir() and stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG),
                              'Nonregular original site member')
                      destination = site / suffix
                      digest = hashlib.sha256()
                      size = 0
                      with zipped.open(item) as source, destination.open('xb') as target:
                          for chunk in iter(lambda: source.read(1024 * 1024), b''):
                              size += len(chunk)
                              require(size <= item.file_size, 'Site member exceeds declared length')
                              digest.update(chunk)
                              target.write(chunk)
                      require(size == item.file_size, 'Site member byte count mismatch')
                      site_records.append({'path': suffix, 'byteSize': size, 'sha256': digest.hexdigest()})
              require(sha256_file(archive) == ARTIFACT_SHA256, 'Original archive changed during restoration')
              provenance = {
                  'schema': 'clrt-checkpoint-diagnostic-native-profile-copy/1',
                  'purpose': 'Diagnostic replay only; not a complete journey or acceptance receipt',
                  'artifactId': 13584232921,
                  'originalRun': 42395549736,
                  'originalTestedCommit': '315f85b3dc34c274e4470fe4e84e9dcebc9a1551',
                  'originalHeadCommit': '50f539785914002b6bcdf398a71e4e29605d376c',
                  'archive': str(archive), 'archiveSha256': ARTIFACT_SHA256,
                  'archiveBytes': ARTIFACT_BYTES, 'originalArchiveUnchanged': True,
                  'profileDirectory': str(profile), 'profileFileCount': len(records),
                  'profileBytes': sum(record['byteSize'] for record in records),
                  'originalChromeVersion': CHROME_VERSION, 'files': records,
                  'siteDirectory': str(site), 'siteFileCount': len(site_records),
                  'siteBytes': sum(record['byteSize'] for record in site_records), 'siteFiles': site_records,
                  'applicationStateChangedByThisUtility': False,
                  'testReceiptCreated': False,
