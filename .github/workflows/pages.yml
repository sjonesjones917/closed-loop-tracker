name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: tar --exclude=.git -czf /tmp/pr-source.tar.gz .
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        run: |
          set -euo pipefail
          git diff --check
          for file in *.js *.mjs; do
            node --check "$file"
          done
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('node:vm');
          const workflow=fs.readFileSync('.github/workflows/pages.yml','utf8');
          const blocks=[...workflow.matchAll(/^[ \t]*node - <<'NODE'\r?\n([\s\S]*?)^[ \t]*NODE[ \t]*$/gm)].map(match=>match[1]);
          if(!blocks.length)throw new Error('Workflow contains no inline Node.js contracts.');
          blocks.forEach((source,index)=>new vm.Script(source,{filename:`pages.yml:inline-node-${index+1}.js`}));
          const publish=blocks.find(source=>source.includes("const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'))"));
          if(!publish)throw new Error('Publish acceptance builder was not found.');
          for(const token of [
            "const executionRoute=JSON.parse(fs.readFileSync('/tmp/execution-route.json','utf8'))",
            'executionRoute.futureProductBinding!==true',
            'executionRoute.evidenceAttachmentPlaceholderFiltering!==true',
            'executionRouteClosureProof:executionRoute',
            "const finalSemanticGates=JSON.parse(fs.readFileSync('/tmp/final-semantic-gates.json','utf8'))",
            "finalSemanticGates.status!=='PASS'",
            'finalSemanticGateProof:finalSemanticGates',
            "finalSemanticGates:'verify-final-semantic-gates.mjs'",
            "verify-browser-core-proof.json",
            'coreBrowserProof.browserVerified!==true',
            "verify-human-stage-walkthrough-proof.json",
            'humanWalkthroughProof.humanStageWalkthrough!==true',
            "verify-mobile-stage-action-proof.json",
            'mobileActionProof.mobileStageActionRegression!==true',
            'deployedCoreBrowserProof:coreBrowserProof',
            'deployedHumanStageWalkthroughProof:humanWalkthroughProof',
            'deployedMobileStageActionProof:mobileActionProof'
          ])if(!publish.includes(token))throw new Error(`Publish acceptance contract is missing ${token}.`);
          NODE

      - name: Schema, ownership, and single-architecture proof
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          node verify-retained-candidate.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs

      - name: Migration and v3 contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs

      - name: Controlling completion amendment and deployment contracts
        run: |
          set -euo pipefail
          node verify-amendment-schema.mjs
          node verify-completion-amendment.mjs
          node verify-semantic-challenge-gates.mjs
          node verify-operation-reservation-routing.mjs
          node verify-external-evidence-normalization.mjs
          node verify-final-semantic-gates.mjs
          node verify-source-backup-closure.mjs
          node verify-restore-activation-contract.mjs
          node verify-deployment-manifest.mjs
          node verify-ui-contract.mjs

      - name: Raw-first ingestion and negative cases
        run: |
          set -euo pipefail
          node verify-ingestion.mjs

      - name: Workflow, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-execution-route-closure.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs

      - name: Prompt semantics and leakage
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs

      - name: Local Chromium operator path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          LOCAL_SITE_ROOT="_site-local-browser"
          LOCAL_SOURCE_COMMIT="${GITHUB_SHA}"
          LOCAL_WORKFLOW_RUN="${GITHUB_RUN_ID}-local-browser"
          rm -rf "$LOCAL_SITE_ROOT"
          mkdir "$LOCAL_SITE_ROOT"
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll "$LOCAL_SITE_ROOT/"
          node build-deployment-manifest.mjs "$LOCAL_SITE_ROOT" "$LOCAL_SOURCE_COMMIT" "$LOCAL_WORKFLOW_RUN"
          node verify-deployment-manifest.mjs "$LOCAL_SITE_ROOT" "$LOCAL_SOURCE_COMMIT" "$LOCAL_WORKFLOW_RUN"
          python3 -m http.server 4173 --directory "$LOCAL_SITE_ROOT" >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            proof_path="${2:-}"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                if [ -n "$proof_path" ]; then cp "$log" "$proof_path"; fi
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          run_browser_verifier verify-restore-activation-path.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    name: Deploy exact verified bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Rebuild retained fixture from verified source
        run: node build-test-project.mjs
      - name: Build static application
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site/
          node build-deployment-manifest.mjs _site "$GITHUB_SHA" "$GITHUB_RUN_ID"
          node verify-deployment-manifest.mjs _site "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Preserve exact verified deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-live:
    name: Verify deployed bytes and operator path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Retrieve the exact artifact uploaded by the verified build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-site-${{ github.sha }}
          path: _site
      - name: Build an independent source-to-output reproducibility comparison
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify-deployment-manifest.mjs _site "$GITHUB_SHA" "$GITHUB_RUN_ID"
          rm -rf _site-rebuild
          mkdir _site-rebuild
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site-rebuild/
          node build-deployment-manifest.mjs _site-rebuild "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Exact deployed-byte verification
        env:
          REPRODUCIBILITY_SITE_ROOT: _site-rebuild
        run: node verify-live.mjs | tee verify-live-proof.json
      - name: Shared restore/import contract proof
        run: node verify-restore-activation-contract.mjs | tee verify-restore-activation-contract-proof.json
      - name: Deployed Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            proof_path="${2:-}"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                if [ -n "$proof_path" ]; then cp "$log" "$proof_path"; fi
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs verify-human-stage-walkthrough-proof.json
          run_browser_verifier verify-mobile-stage-action.mjs verify-mobile-stage-action-proof.json
          run_browser_verifier verify-browser.mjs verify-browser-core-proof.json
          export BROWSER_PROOF_PATH=verify-browser-proof.json
          run_browser_verifier verify-browser-extra.mjs
          run_browser_verifier verify-restore-activation-path.mjs verify-restore-activation-path-proof.json
          test -s verify-human-stage-walkthrough-proof.json
          test -s verify-mobile-stage-action-proof.json
          test -s verify-browser-core-proof.json
          test -s "$BROWSER_PROOF_PATH"
          test -s verify-restore-activation-path-proof.json
      - name: Preserve exact deployed verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-proof-${{ github.sha }}
          path: |
            verify-live-proof.json
            verify-browser-core-proof.json
            verify-browser-proof.json
            verify-human-stage-walkthrough-proof.json
            verify-mobile-stage-action-proof.json
            verify-restore-activation-contract-proof.json
            verify-restore-activation-path-proof.json
          if-no-files-found: error
          retention-days: 1

  publish-status:
    name: Publish machine acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Retrieve exact deployed-byte proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: live-proof-${{ github.sha }}
          path: /tmp/live-proof
      - name: Build acceptance artifact from executed proof jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-v3-definition-of-done.mjs > /tmp/v3.json
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify-stage01-intake-closure.mjs > /tmp/stage01.out
          node verify-zero-loss-accounting.mjs > /tmp/zero-loss.out
          node verify-full-cycle.mjs > /tmp/full-cycle.json
          node verify-execution-route-closure.mjs > /tmp/execution-route.json
          node verify-data-route-closure.mjs > /tmp/data-route.json
          node verify-infrastructure-route-closure.mjs > /tmp/infrastructure-route.json
          node verify-amendment-schema.mjs > /tmp/amendment-schema.json
          node verify-completion-amendment.mjs > /tmp/completion-amendment.json
          node verify-semantic-challenge-gates.mjs > /tmp/semantic-challenge-gates.json
          node verify-operation-reservation-routing.mjs > /tmp/operation-reservation-routing.json
          node verify-external-evidence-normalization.mjs > /tmp/external-evidence-normalization.json
          node verify-final-semantic-gates.mjs > /tmp/final-semantic-gates.json
          node verify-source-backup-closure.mjs > /tmp/source-backup-closure.json
          node verify-deployment-manifest.mjs > /tmp/deployment-manifest-proof.json
          node verify-ui-contract.mjs > /tmp/ui-contract.json
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('/tmp/v3.json','utf8'));
          const stage01=JSON.parse(fs.readFileSync('/tmp/stage01.out','utf8'));
          const zeroLoss=JSON.parse(fs.readFileSync('/tmp/zero-loss.out','utf8'));
          const fullCycle=JSON.parse(fs.readFileSync('/tmp/full-cycle.json','utf8'));
          const executionRoute=JSON.parse(fs.readFileSync('/tmp/execution-route.json','utf8'));
          const dataRoute=JSON.parse(fs.readFileSync('/tmp/data-route.json','utf8'));
          const infrastructureRoute=JSON.parse(fs.readFileSync('/tmp/infrastructure-route.json','utf8'));
          const amendmentSchema=JSON.parse(fs.readFileSync('/tmp/amendment-schema.json','utf8'));
          const completionAmendment=JSON.parse(fs.readFileSync('/tmp/completion-amendment.json','utf8'));
          const semanticChallengeGates=JSON.parse(fs.readFileSync('/tmp/semantic-challenge-gates.json','utf8'));
          const operationReservationRouting=JSON.parse(fs.readFileSync('/tmp/operation-reservation-routing.json','utf8'));
          const externalEvidenceNormalization=JSON.parse(fs.readFileSync('/tmp/external-evidence-normalization.json','utf8'));
          const finalSemanticGates=JSON.parse(fs.readFileSync('/tmp/final-semantic-gates.json','utf8'));
          const sourceBackupClosure=JSON.parse(fs.readFileSync('/tmp/source-backup-closure.json','utf8'));
          const deploymentManifestProof=JSON.parse(fs.readFileSync('/tmp/deployment-manifest-proof.json','utf8'));
          const uiContract=JSON.parse(fs.readFileSync('/tmp/ui-contract.json','utf8'));
          const liveProof=JSON.parse(fs.readFileSync('/tmp/live-proof/verify-live-proof.json','utf8'));
          const coreBrowserProof=JSON.parse(fs.readFileSync('/tmp/live-proof/verify-browser-core-proof.json','utf8'));
          const browserProof=JSON.parse(fs.readFileSync('/tmp/live-proof/verify-browser-proof.json','utf8'));
          const humanWalkthroughProof=JSON.parse(fs.readFileSync('/tmp/live-proof/verify-human-stage-walkthrough-proof.json','utf8'));
          const mobileActionProof=JSON.parse(fs.readFileSync('/tmp/live-proof/verify-mobile-stage-action-proof.json','utf8'));
          const restoreContractProof=JSON.parse(fs.readFileSync('/tmp/live-proof/verify-restore-activation-contract-proof.json','utf8'));
          const restoreActivationProof=JSON.parse(fs.readFileSync('/tmp/live-proof/verify-restore-activation-path-proof.json','utf8'));
          const ingestionText=fs.readFileSync('/tmp/ingestion.out','utf8');
          const stage01RawInputAccounting=Number(Boolean(stage01.stage01IntakeClosure&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01RequiredFileInspectionAccounting=Number(Boolean(stage01.artifactIdentityBound&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01AcceptedSemanticMappingCoverage=Number(Boolean(zeroLoss.zeroLossStage01&&zeroLoss.incompleteIntakeRejected));
          const stage04ObligationAccounting=Number(Boolean(zeroLoss.zeroLossStage04&&zeroLoss.completeStage03ResearchUnion&&zeroLoss.incompleteObligationRejected));
          const negativeMatches=[...ingestionText.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!negativeMatches.length)throw new Error('Ingestion proof did not publish totalNegativeCases.');
          if(executionRoute.futureProductBinding!==true||executionRoute.evidenceAttachmentPlaceholderFiltering!==true||executionRoute.realEvidenceAttachmentPreserved!==true||executionRoute.stage22Through25ExactProductHandoff!==true||executionRoute.deferredFailureExecutionClosure!==true||executionRoute.humanInspectionExactReservation!==true)throw new Error('Execution routing, evidence-attachment filtering, deferred failure-test closure, or exact human-inspection reservation proof did not pass.');
          if(dataRoute.dataRouteClosure!=='PASS')throw new Error('Canonical data-route closure proof did not pass.');
          if(infrastructureRoute.infrastructureRouteClosure!=='PASS')throw new Error('Infrastructure route-closure proof did not pass.');
          if(amendmentSchema.verifyAmendmentSchema!=='PASS')throw new Error('Controlling amendment schema proof did not pass.');
          if(completionAmendment.status!=='PASS')throw new Error('Controlling completion amendment proof did not pass.');
          if(semanticChallengeGates.stage01OrdinaryCompletePath!==true||semanticChallengeGates.stage01ChallengeRequiresLaterReconciliation!==true||semanticChallengeGates.stage01ConfirmationBindsFinalAcceptedOperation!==true||semanticChallengeGates.stage04ChallengesRequireLaterReconciliation!==true||semanticChallengeGates.acceptedChangeOperationSequencing!==true||semanticChallengeGates.operatorSuboperationSelectionIsApplicationDerived!==true)throw new Error('Stage 01/04 semantic challenge and reconciliation gate proof did not pass.');
          if(operationReservationRouting.reservationPromptIdentityBound!==true||operationReservationRouting.reservationFutureRevisionBound!==true||operationReservationRouting.orphanPendingProposalPreserved!==true||operationReservationRouting.stage17DefectPhaseOrder!==true||operationReservationRouting.stage19ExactPhaseOrder!==true||operationReservationRouting.operatorActionUsesEngineOperation!==true||operationReservationRouting.humanInspectionReservationUsesEngineOperation!==true)throw new Error('Operation reservation and deterministic phase-routing proof did not pass.');
          if(externalEvidenceNormalization.status!=='PASS'||Number(externalEvidenceNormalization.assertions)<42||!externalEvidenceNormalization.coverage?.includes('stage5-proposition-applicability-binding')||!externalEvidenceNormalization.coverage?.includes('stage22-external-deterministic-normalization')||!externalEvidenceNormalization.coverage?.includes('distinct-author-reviewer-execution-scope')||!externalEvidenceNormalization.coverage?.includes('epistemic-non-elevation')||!externalEvidenceNormalization.coverage?.includes('advisory-proof-exclusion')||!externalEvidenceNormalization.coverage?.includes('frozen-proof-test-set'))throw new Error('External evidence application-normalization proof did not pass.');
          if(finalSemanticGates.status!=='PASS'||Number(finalSemanticGates.assertions)<47||!finalSemanticGates.coverage?.includes('independent-exact-test-review')||!finalSemanticGates.coverage?.includes('independent-exact-proof-expression-review')||!finalSemanticGates.coverage?.includes('independent-review-context-isolation-with-controlling-scope')||!finalSemanticGates.coverage?.includes('closed-nonempty-proof-contracts')||!finalSemanticGates.coverage?.includes('not-applicable-review-and-evidence')||!finalSemanticGates.coverage?.includes('conditional-activation-three-valued')||!finalSemanticGates.coverage?.includes('stage23-refutation')||!finalSemanticGates.coverage?.includes('stage24-refutation-and-defect')||!finalSemanticGates.coverage?.includes('stage25-normalized-observation-entailment')||!finalSemanticGates.coverage?.includes('unrelated-attestation-non-elevation'))throw new Error('Final semantic proof/evidence gate mutations did not pass.');
          if(sourceBackupClosure.sourceSearchContractClosure!==true||sourceBackupClosure.noSourceFailsClosed!==true||sourceBackupClosure.responseLocalEvidenceBinding!==true||sourceBackupClosure.sourceAuthenticityNotElevated!==true||sourceBackupClosure.stage3EpistemicLimitations!==true||sourceBackupClosure.sourceProofDependencyInheritance!==true||sourceBackupClosure.sourceProofBasisFloor!==true||sourceBackupClosure.expiredSourceBlocksStage6ReleaseDelivery!==true||sourceBackupClosure.contradictedSourceBlocksProof!==true||sourceBackupClosure.sensitiveBackupDisclosureControl!==true||sourceBackupClosure.restoreTestedBaselineCheckpoint!==true||sourceBackupClosure.staleCheckpointDetection!==true||sourceBackupClosure.terminalFinalBackupGate!==true||sourceBackupClosure.backupRoundTripIntegrity!==true)throw new Error('Bounded source discovery, inherited proof dependencies, and restore-tested backup closure proof did not pass.');
