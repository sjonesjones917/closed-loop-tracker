name: Apply canonical verification-plan repair
on:
  push:
    branches: [reliability/canonical-verification-plan-current]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability/canonical-verification-plan-current, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply guarded repair
        run: python3 .repair-canonical-verification.py
      - name: Restore production workflow and remove helper
        run: |
          git checkout 1683f8aaca02557bbae7edfe0e1e05c7627c1cf1 -- .github/workflows/pages.yml
          rm .repair-canonical-verification.py
      - name: Run deterministic acceptance
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit source-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind product verification to the canonical Stage 6 plan"
          git push origin HEAD:reliability/canonical-verification-plan-current
