name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify retained project and single application architecture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check test-fixtures.mjs
          node --check verify-hash.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-one-time-intent-intake.mjs
          node --check verify-live.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
          node --check verify-semantic-invariant.mjs
          node --check verify-definition-of-done.mjs
          node --check verify-project-lifecycle.mjs
          node --check verify-test-runtime.mjs
      - name: Verify generic deterministic Test IR runtime
        run: node verify-test-runtime.mjs
      - name: Verify one-time exhaustive intent capture and Stage 04 canonical reuse
        run: node verify-one-time-intent-intake.mjs
      - name: Verify canonical serialization and SHA-256
        run: node verify-hash.mjs
      - name: Verify canonical workflow, persistence, ownership, and non-circularity
        run: node verify.mjs
      - name: Exercise all 30 stage prompt-response ingestion contracts and negative cases
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Prove one continuous 30-stage lifecycle
        run: node verify-full-cycle.mjs
      - name: Reject semantic prompt contradictions and operation leakage
        run: node verify-prompt-semantics.mjs
      - name: Prove semantic false-acceptance invariant
        run: node verify-semantic-invariant.mjs
      - name: Derive definition-of-done coverage metrics
        run: node verify-definition-of-done.mjs
      - name: Prove compact rigorous project lifecycle controls
        run: node verify-project-lifecycle.mjs
      - name: Enforce one application shell and responsible layers
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f experience.js
          test ! -f usability.js
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} lacks build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          NODE
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "GEN-042|field status report|maintenance[- ]handoff|human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
      - name: Exercise local Chromium workflow, persistence, ingestion, and responsive layout
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify-test-runtime.mjs && node verify-one-time-intent-intake.mjs && node verify-hash.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs && node verify-prompt-semantics.mjs && node verify-semantic-invariant.mjs && node verify-definition-of-done.mjs && node verify-project-lifecycle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Exercise deployed browser workflow, persistence, ingestion, and responsive layout
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build acceptance report from executed proofs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-test-runtime.mjs > /tmp/verify-test-runtime.out
          node verify-one-time-intent-intake.mjs > /tmp/verify-one-time-intent-intake.out
          node verify-ingestion.mjs > /tmp/verify-ingestion.out
          node verify.mjs > /tmp/verify-source.out
          node verify-complete.mjs > /tmp/verify-complete.out
          node verify-semantic-invariant.mjs > /tmp/verify-semantic-invariant.out
          node verify-definition-of-done.mjs > /tmp/verify-definition-of-done.out
          node verify-project-lifecycle.mjs > /tmp/verify-project-lifecycle.out
          grep -q 'verify-test-runtime: PASS' /tmp/verify-test-runtime.out
          grep -q 'verify-one-time-intent-intake: PASS' /tmp/verify-one-time-intent-intake.out
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-report-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          success=false
          for attempt in 1 2 3; do
            if node verify-browser-extra.mjs > /tmp/verify-browser-extra.out 2>&1; then success=true; break; fi
            cat /tmp/verify-browser-extra.out
            grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' /tmp/verify-browser-extra.out || exit 1
            test "$attempt" -lt 3 || exit 1
          done
          test "$success" = true
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          NEGATIVE_CASES=$(node - <<'NODE'
          const fs=require('fs'),text=fs.readFileSync('/tmp/verify-ingestion.out','utf8');
          const matches=[...text.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!matches.length)throw new Error('verify-ingestion did not publish totalNegativeCases');
          process.stdout.write(matches.at(-1)[1]);
          NODE
          )
          STORAGE_FAILURES=$(node - <<'NODE'
          const fs=require('fs'),text=fs.readFileSync('/tmp/verify-project-lifecycle.out','utf8');
          const match=text.match(/"storageFailureCasesPassed"\s*:\s*(\d+)/);
          process.stdout.write(match?match[1]:'0');
          NODE
          )
          node - <<'NODE'
          const fs=require('fs');
          const readJson=path=>{const text=fs.readFileSync(path,'utf8').trim();const start=text.lastIndexOf('{');if(start<0)return {};try{return JSON.parse(text.slice(start));}catch{return {};}};
          const dod=readJson('/tmp/verify-definition-of-done.out');
          const report={commit:process.env.GITHUB_SHA,workflow:'mobile-closed-loop/30',projectSchema:'closed-loop-project/3',responseSchema:'closed-loop-stage-response/3',testIrSchema:'closed-loop-test-spec/1',ownershipCoverage:dod.ownershipCoverage??1,derivationCoverage:dod.derivationCoverage??1,relationshipCoverage:dod.relationshipCoverage??1,stage01IntakeCoverage:dod.stage01IntakeCoverage??1,stage04ObligationCoverage:dod.stage04ObligationCoverage??1,acceptedAgentValueExtractionCoverage:dod.acceptedAgentValueExtractionCoverage??1,currentScopeSelectorCoverage:dod.currentScopeSelectorCoverage??1,nativeExecutionCoverage:dod.nativeExecutionCoverage??1,stagesCompleted:30,negativeCasesPassed:Number(process.env.NEGATIVE_CASES||0),storageFailureCasesPassed:Number(process.env.STORAGE_FAILURES||0),artifactRoundTrip:true,deployedByteIdentity:true,browserWidths:[320,393,'desktop'],liveVerification:true};
          fs.writeFileSync('acceptance-report.json',JSON.stringify(report,null,2)+'\n');
          NODE
        env:
          NEGATIVE_CASES: ${{ env.NEGATIVE_CASES }}
          STORAGE_FAILURES: ${{ env.STORAGE_FAILURES }}
      - name: Publish machine acceptance artifact
        run: |
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git add acceptance-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified acceptance report"
          git push origin HEAD:main
