name: Verify, test, and deploy the single workbook app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: workbook_syntax
        continue-on-error: true
        run: node --check workbook.js
      - id: human_syntax
        continue-on-error: true
        run: node --check human-ui.js
      - id: verifier
        continue-on-error: true
        run: node verify.mjs
      - id: structure
        continue-on-error: true
        run: |
          test -f index.html
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test -f test-project/inputs/REQUEST.md
          test -f test-project/inputs/SITE_POLICY.md
          test -f test-project/inputs/WORKFLOW_RULES.md
          test -f test-project/fixtures/INVALID_ACCEPTED_HANDOFF.md
          test ! -f test-project/TEST-JOB-001__FIELD-HANDOFF.md
      - name: Publish granular verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKBOOK: ${{ steps.workbook_syntax.outcome }}
          HUMAN: ${{ steps.human_syntax.outcome }}
          VERIFIER: ${{ steps.verifier.outcome }}
          STRUCTURE: ${{ steps.structure.outcome }}
        run: |
          for pair in "workbook-syntax:$WORKBOOK" "human-ui-syntax:$HUMAN" "repository-verifier:$VERIFIER" "single-app-structure:$STRUCTURE"; do
            context="${pair%%:*}"; outcome="${pair#*:}"
            if [ "$outcome" = success ]; then state=success; else state=failure; fi
            gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context="$context" -f description="$context $outcome"
          done
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=success -f context='pages-run-${{ github.run_id }}' -f description='GitHub Actions run identifier for verification diagnostics'
      - name: Enforce verification results
        if: always()
        run: |
          test '${{ steps.workbook_syntax.outcome }}' = success
          test '${{ steps.human_syntax.outcome }}' = success
          test '${{ steps.verifier.outcome }}' = success
          test '${{ steps.structure.outcome }}' = success
      - name: Publish test status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='workbook-test-project' -f description='Truthful closed-loop project verification'
  deploy:
    if: github.event_name != 'pull_request'
    needs: test-project
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish deployment status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='single-workbook-pages' -f description='Exact tested application deployed'
  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test-project, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chrome for phone rendering
        uses: browser-actions/setup-chrome@v1
      - id: live_identity
        continue-on-error: true
        name: Verify exact deployed files
        run: |
          set -euo pipefail; mkdir -p live-proof; verified=false
          FILES=(index.html workbook.js human-ui.js TEST_PROJECT.json test-project/inputs/REQUEST.md test-project/inputs/SITE_POLICY.md test-project/inputs/WORKFLOW_RULES.md test-project/fixtures/INVALID_ACCEPTED_HANDOFF.md)
          for attempt in $(seq 1 48); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            good=true
            for f in "${FILES[@]}"; do
              mkdir -p "live-proof/$(dirname "$f")"
              curl -fsSL "${PAGE_URL%/}/$f?verify=$nonce" -o "live-proof/$f" || good=false
            done
            if $good; then
              exact=true
              for f in "${FILES[@]}"; do
                [[ "$(sha256sum "$f"|awk '{print $1}')" == "$(sha256sum "live-proof/$f"|awk '{print $1}')" ]] || exact=false
              done
              if $exact; then verified=true; break; fi
            fi
            sleep 5
          done
          test "$verified" = true
      - id: blank_render
        continue-on-error: true
        name: Render compact working project UI
        run: |
          set -euo pipefail
          BROWSER="$(command -v chrome || command -v google-chrome || command -v chromium || true)"; test -n "$BROWSER"
          BASE="${PAGE_URL%/}/?verify=${GITHUB_SHA}"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --window-size=393,852 --dump-dom "$BASE" > live-proof/blank.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --window-size=393,852 --screenshot=live-proof/working.png "$BASE"
          grep -q 'Closed-Loop Reliability' live-proof/blank.html
          grep -q 'Current working job' live-proof/blank.html
          grep -q 'New project' live-proof/blank.html
          grep -q '>Overview<' live-proof/blank.html
          grep -q '>Workflow<' live-proof/blank.html
          grep -q '>Work<' live-proof/blank.html
          ! grep -q 'APPENDIX A–F — OPERATIONAL CONTROLS' live-proof/blank.html
      - id: test_render
        continue-on-error: true
        name: Render genuine test project UI
        run: |
          set -euo pipefail
          BROWSER="$(command -v chrome || command -v google-chrome || command -v chromium || true)"; test -n "$BROWSER"
          BASE="${PAGE_URL%/}/?verify=${GITHUB_SHA}"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=45000 --window-size=393,852 --dump-dom "${BASE}&test=1" > live-proof/test-project.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=45000 --window-size=393,852 --screenshot=live-proof/test-project.png "${BASE}&test=1"
          grep -q 'Portable generator service handoff' live-proof/test-project.html
          grep -q 'GEN-042' live-proof/test-project.html
          grep -q 'Test project.' live-proof/test-project.html
          grep -q 'Current stage' live-proof/test-project.html
          grep -q 'Open blockers' live-proof/test-project.html
          grep -q 'Requirements' live-proof/test-project.html
          grep -q '>Overview<' live-proof/test-project.html
          grep -q '>Workflow<' live-proof/test-project.html
          grep -q '>Work<' live-proof/test-project.html
          grep -q '>Runs<' live-proof/test-project.html
          grep -q '>Issues<' live-proof/test-project.html
          grep -q '>Release<' live-proof/test-project.html
          grep -q '>History<' live-proof/test-project.html
          grep -q 'BLOCKED' live-proof/test-project.html
          grep -q 'genuinely independent fresh execution contexts' live-proof/test-project.html
          ! grep -q 'APPENDIX A–F — OPERATIONAL CONTROLS' live-proof/test-project.html
      - id: interaction
        continue-on-error: true
        name: Exercise deployed human controls
        run: |
          set -euo pipefail
          BROWSER="$(command -v chrome || command -v google-chrome || command -v chromium || true)"; test -n "$BROWSER"
          rm -rf /tmp/live-e2e /tmp/live-downloads; mkdir -p /tmp/live-downloads
          "$BROWSER" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/live-e2e --window-size=393,852 about:blank >/tmp/live-chrome.log 2>&1 &
          for n in $(seq 1 50); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep .2; done
          cat > /tmp/live-e2e.mjs <<'NODE'
          import fs from 'node:fs';
          const port=9222,base=process.env.PAGE_URL.replace(/\/$/,'')+'/?e2e='+Date.now(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const targets=await (await fetch(`http://127.0.0.1:${port}/json/list`)).json(),target=targets.find(x=>x.type==='page');
          if(!target)throw new Error('No Chrome page target');
          const ws=new WebSocket(target.webSocketDebuggerUrl);let id=0;const pending=new Map();
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result)}};
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
          async function ev(expression){const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||JSON.stringify(r.exceptionDetails));return r.result.value}
          async function waitFor(expression,ms=12000){const end=Date.now()+ms;while(Date.now()<end){try{if(await ev(expression))return}catch{}await sleep(100)}throw new Error(`Timed out: ${expression}`)}
          async function nav(url){await send('Page.enable');await send('Page.navigate',{url});await waitFor("document.readyState==='complete'");await waitFor("!!document.querySelector('#project-data-button') && document.body.innerText.includes('Project overview')",20000)}
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          await send('Browser.setDownloadBehavior',{behavior:'allow',downloadPath:'/tmp/live-downloads'}).catch(()=>{});
          await nav(base);
          ok((await ev("document.querySelector('#new-job-button').getBoundingClientRect().height"))<=36,'New project button is oversized');
          ok((await ev("document.querySelector('#project-data-button').getBoundingClientRect().height"))<=36,'Project data button is oversized');
          await ev("document.querySelector('#guide-button').click()");await waitFor("document.body.innerText.includes('How this application uses the workbook')");
          await ev("document.querySelector('#project-data-button').click()");await waitFor("document.body.innerText.includes('Project overview')");
          await ev("document.querySelector('[data-project-view=workflow]').click()");await waitFor("document.body.innerText.includes('30-stage workflow')");
          await ev("document.querySelector('[data-stage-open=1]').click()");await waitFor("!document.querySelector('#workspace-workbook').hasAttribute('hidden')");
          ok((await ev("document.querySelector('#stage-select').value"))==='1','Stage 01 did not open');
          await ev("document.querySelector('#next-stage').click()");await waitFor("document.querySelector('#stage-select').value==='2'");
          await ev("document.querySelector('#previous-stage').click()");await waitFor("document.querySelector('#stage-select').value==='1'");
          await ev("document.querySelector('#project-data-button').click()");await waitFor("document.body.innerText.includes('Project overview')");
          await ev("document.querySelector('#export-button').click()");await sleep(700);
          ok(fs.readdirSync('/tmp/live-downloads').some(x=>x.endsWith('.json')),'Export did not produce project JSON');
          await ev("(()=>{const s=document.querySelector('#project-picker');s.value='retained';s.dispatchEvent(new Event('change',{bubbles:true}))})()");
          await waitFor("document.body.innerText.includes('Portable generator service handoff')",20000);
          ok(await ev("document.body.innerText.includes('GEN-042')"),'Test project data not visible');
          ok(await ev("document.body.innerText.includes('Test project.')"),'Test project identity not visible');
          for(const view of ['work','runs','issues','release','history']){
            await ev(`document.querySelector('[data-project-view="${view}"]').click()`);await sleep(80);
            ok((await ev('document.body.innerText.length'))>500,`${view} view is empty`);
          }
          ok(await ev("document.body.innerText.includes('Generated instruction')"),'Generated instructions not inspectable in history');
          ok((await ev("JSON.parse(localStorage.getItem('mobile-closed-loop-agent')).job.JOB_TITLE"))==='Portable generator service handoff','Test project is not persisted through ordinary project state');
          await ev("document.querySelector('#new-job-button').click()");
          await waitFor("JSON.parse(localStorage.getItem('mobile-closed-loop-agent')).job.JOB_TITLE==='New project'",20000);
          ok((await ev("JSON.parse(localStorage.getItem('mobile-closed-loop-agent')).activeStage"))===1,'New project did not reset to Stage 01');
          const imported=await ev("JSON.parse(localStorage.getItem('mobile-closed-loop-agent'))");imported.job.JOB_TITLE='Imported verification project';fs.writeFileSync('/tmp/import-project.json',JSON.stringify(imported));
          await send('DOM.enable');const doc=await send('DOM.getDocument',{depth:1});const q=await send('DOM.querySelector',{nodeId:doc.root.nodeId,selector:'#imp'});await send('DOM.setFileInputFiles',{nodeId:q.nodeId,files:['/tmp/import-project.json']});await ev("document.querySelector('#imp').dispatchEvent(new Event('change',{bubbles:true}))");
          await waitFor("JSON.parse(localStorage.getItem('mobile-closed-loop-agent')).job.JOB_TITLE==='Imported verification project'",20000);
          fs.writeFileSync('live-proof/interaction.json',JSON.stringify({ok:true,controls:['Guide','Project data','Workflow','stage open','next stage','previous stage','Export','project switch','Work','Runs','Issues','Release','History','New project','Import'],compactButtonHeight:true,testProjectPersisted:true},null,2));
          ws.close();
          NODE
          node /tmp/live-e2e.mjs
      - name: Preserve rendered live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-proof-${{ github.run_id }}
          path: live-proof
          if-no-files-found: error
      - name: Publish granular live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ steps.live_identity.outcome }}
          BLANK: ${{ steps.blank_render.outcome }}
          TEST: ${{ steps.test_render.outcome }}
          INTERACTION: ${{ steps.interaction.outcome }}
        run: |
          for pair in "live-file-identity:$IDENTITY" "live-working-ui:$BLANK" "live-test-project-ui:$TEST" "live-controls:$INTERACTION"; do
            context="${pair%%:*}"; outcome="${pair#*:}"
            if [ "$outcome" = success ]; then state=success; else state=failure; fi
            gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context="$context" -f description="$context $outcome"
          done
      - name: Enforce live verification
        if: always()
        run: |
          test '${{ steps.live_identity.outcome }}' = success
          test '${{ steps.blank_render.outcome }}' = success
          test '${{ steps.test_render.outcome }}' = success
          test '${{ steps.interaction.outcome }}' = success
      - name: Publish live status
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RESULT: '${{ job.status }}'}
        run: |
          if [ "$RESULT" = success ]; then STATE=success; else STATE=failure; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$STATE" -f context='live-workbook-ui' -f description='Rendered phone UI, controls, and truthful test project verified'
