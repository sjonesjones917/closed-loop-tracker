name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs
      - run: node --check app.js && node --check app-core.js && node --check storage-reliability.js && node --check integrity-guard.js && node --check prompt-engine.js && node --check workbook.js && node --check experience.js && node --check build-test-project.mjs && node --check build-test-project-impl.mjs && node --check verify.mjs && node --check verify-live.mjs && node --check verify-browser.mjs && node --check verify-integrity-browser.mjs && node --check verify-hardening-browser.mjs && node --check verify-hardening-runner.mjs && node --check verify-prompts-live.mjs && node --check verify-storage-browser.mjs
      - run: node verify.mjs
      - name: Verify build is read-only and single-app
        run: |
          git diff --exit-code -- app.js app-core.js storage-reliability.js integrity-guard.js prompt-engine.js TEST_PROJECT.json index.html workbook.js experience.js build-test-project.mjs verify.mjs verify-live.mjs verify-browser.mjs verify-integrity-browser.mjs verify-hardening-browser.mjs verify-hardening-runner.mjs verify-prompts-live.mjs verify-storage-browser.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f human-ui.js
          test ! -f agent-workflow.js
          test ! -f prompt-center.js
          grep -q 'src="workbook.js' index.html
          grep -q 'src="app.js' index.html
          grep -q 'src="experience.js' index.html
          grep -q 'rel="icon"' index.html
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('app.js','utf8');
          const app=fs.readFileSync('app-core.js','utf8');
          const storage=fs.readFileSync('storage-reliability.js','utf8');
          const guard=fs.readFileSync('integrity-guard.js','utf8');
          const prompts=fs.readFileSync('prompt-engine.js','utf8');
          const experience=fs.readFileSync('experience.js','utf8');
          const ui=loader+app+storage+guard+prompts+experience+fs.readFileSync('index.html','utf8')+fs.readFileSync('workbook.js','utf8');
          const project=fs.readFileSync('TEST_PROJECT.json','utf8');
          const banned=new RegExp('se'+'mantic','i');
          if(banned.test(ui))throw new Error('prohibited terminology');
          if(/GEN-042|field status report|maintenance[- ]handoff/i.test(ui+project))throw new Error('unrelated product content');
          if(/human-project\/31|31 operations|Freeze New Version/i.test(ui))throw new Error('discarded architecture');
          for(const token of ['prompt-engine.js','app-core.js','storage-reliability.js','integrity-guard.js'])if(!loader.includes(token))throw new Error(`loader missing ${token}`);
          for(const token of ['function validateStructuredStageState(','globalThis.closedLoopIntegrity=',"19:['runs']",'function appendixDefault(','structuredIssues=validateStructuredStageState','filenamesIdentical','retainedBytes:false',"['Release control',current.release]","recordHistory('STAGE_DECISION_SAVED'"])if(!app.includes(token))throw new Error(`record-linked control missing: ${token}`);
          for(const token of ['closed-loop-storage-20260824-r1','navigationOnlyChange','reclaimRedundantBackup','skippedWrites'])if(!storage.includes(token))throw new Error(`storage reliability control missing: ${token}`);
          for(const token of ['JOB_ID is immutable','repairInvalidatedStageOne','invalidateDerivedRecords','deriveReleaseGate','sameFileSet','requiredRecordFields','Save failed:','closedLoopIntegrityGuard'])if(!guard.includes(token))throw new Error(`integrity guard missing: ${token}`);
          for(const token of ['core.buildStagePrompt=build','const procedures={','AUTHORIZED INPUTS FOR THIS STAGE','SOURCE-SET-v001','Do not perform Stage 03 requirements research'])if(!prompts.includes(token))throw new Error(`prompt engine control missing: ${token}`);
          for(let n=1;n<=30;n++)if(!prompts.includes(`${n}:'`))throw new Error(`stage prompt missing: ${n}`);
          for(const token of ['Mobile closed-loop control','Current work','Completed work','Continue current stage','Work for this stage','Completion controls','Find project information','Supporting records'])if(!experience.includes(token))throw new Error(`human-facing experience missing: ${token}`);
          NODE

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs
      - name: Confirm deploy artifact equals checked-in source
        run: git diff --exit-code -- app.js app-core.js storage-reliability.js integrity-guard.js prompt-engine.js TEST_PROJECT.json index.html workbook.js experience.js build-test-project.mjs verify.mjs verify-live.mjs verify-browser.mjs verify-integrity-browser.mjs verify-hardening-browser.mjs verify-hardening-runner.mjs verify-prompts-live.mjs verify-storage-browser.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify-live.mjs
      - name: Verify deployed source identity
        run: |
          node --input-type=module - <<'NODE'
          const base=process.env.PAGE_URL;
          const expected={
            'index.html':['closed-loop-runtime-20260823-2037-r2','closed-loop-integrity-20260824-r3','experience.js','Reliability Workbook'],
            'experience.js':['Mobile closed-loop control','Current work','Completed work','Continue current stage','Find project information'],
            'app.js':['prompt-engine.js','app-core.js','storage-reliability.js','integrity-guard.js','closed-loop-storage-20260824-r1'],
            'app-core.js':['function validateStructuredStageState(','globalThis.closedLoopIntegrity=',"19:['runs']"],
            'storage-reliability.js':['closed-loop-storage-20260824-r1','navigationOnlyChange','reclaimRedundantBackup','skippedWrites'],
            'integrity-guard.js':['JOB_ID is immutable','invalidateDerivedRecords','deriveReleaseGate','sameFileSet','closedLoopIntegrityGuard'],
            'prompt-engine.js':['core.buildStagePrompt=build','AUTHORIZED INPUTS FOR THIS STAGE','SOURCE-SET-v001','Do not perform Stage 03 requirements research'],
            'TEST_PROJECT.json':['JOB-20260823144121','Mobile Closed-Loop Agent Reliability Workbook']
          };
          for(const [path,tokens] of Object.entries(expected)){
            const response=await fetch(new URL(`${path}?integrity=${Date.now()}`,base),{cache:'no-store'});
            if(!response.ok)throw new Error(`${path} returned ${response.status}`);
            const body=await response.text();
            for(const token of tokens)if(!body.includes(token))throw new Error(`${path} missing deployed token: ${token}`);
          }
          NODE
      - name: Verify rendered phone views
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          for WIDTH in 320 393; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --window-size=${WIDTH},852 --virtual-time-budget=10000 --dump-dom "${PAGE_URL}?verify=${GITHUB_SHA}-${WIDTH}" > "live-${WIDTH}.html"
            grep -q 'Mobile Closed-Loop Agent Reliability Workbook' "live-${WIDTH}.html"
            grep -q '1/30 complete' "live-${WIDTH}.html"
            grep -q 'STAGE 02' "live-${WIDTH}.html"
            grep -q 'Closed-Loop Reliability' "live-${WIDTH}.html"
            grep -q 'Current work' "live-${WIDTH}.html"
            grep -q 'Completed work' "live-${WIDTH}.html"
            grep -q 'Continue current stage' "live-${WIDTH}.html"
            grep -q 'Overview' "live-${WIDTH}.html"
            ! grep -qi 'GEN-042' "live-${WIDTH}.html"
            ! grep -qi 'field status report' "live-${WIDTH}.html"
            ! grep -qi 'maintenance handoff' "live-${WIDTH}.html"
            ! grep -q '0/31 complete' "live-${WIDTH}.html"
            ! grep -q 'Loading the workflow' "live-${WIDTH}.html"
          done
      - name: Exercise deployed project, persistence, all stages, and mobile overflow
        run: node verify-browser.mjs
      - name: Exercise project identity and invalidation integrity regressions
        run: node verify-integrity-browser.mjs
      - name: Exercise quota pressure, redundant backups, and repeated navigation
        run: node verify-storage-browser.mjs
      - name: Exercise release, draft, evidence, storage, files, and control hardening
        run: node verify-hardening-runner.mjs
      - name: Exercise all 30 rendered stage prompts against the retained project
        run: node verify-prompts-live.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then
            STATE=success
            DESCRIPTION='Source, deployment, prompts, mobile UI, persistence, quota recovery, hardening, and browser verification passed'
          else
            STATE=failure
            DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
