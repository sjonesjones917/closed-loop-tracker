             report.quarantineKeysPreserved=JSON.stringify(quarantineBefore)===JSON.stringify(quarantineAfter);
             report.wholeDatabaseByteEqualityClaimed=false;
            }catch(error){report.secondaryErrors.push(errorRecord(error));}
            finally{
             // finish() belongs after all observations. The driver will still execute
             // its original close and rethrow its original error regardless of this hook.
             try{report.runtimeObservation=await bounded(()=>finishObserver(),'final strict observer',10000);}catch(error){report.secondaryErrors.push(errorRecord(error));}
             report.finishedAt=new Date().toISOString();report.elapsedMs=Date.now()-started;save('startup-inspection.json',report);log('inspection-events.jsonl',{event:'finished',elapsedMs:report.elapsedMs,observations:report.observations.length,secondaryErrors:report.secondaryErrors.length});
            }
           };
          }
          FROZEN_HELPER_1
          cat > "$DIAG_OUT/runner-helpers/replay.mjs" <<'FROZEN_HELPER_2'
