name: Verify and deploy the single workbook app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check workbook.js
      - run: node verify.mjs
      - name: Enforce one application
        run: |
          test -f index.html
          test "$(find . -maxdepth 1 -type f \( -name '*.html' -o -name 'app-*' -o -name 'v*.html' \) | wc -l)" -eq 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact verified repository
        id: deployment
        uses: actions/deploy-pages@v4
