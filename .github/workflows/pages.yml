name: Test and deploy Closed-Loop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed app structure
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'Closed-Loop Agent Reliability Workflow' index.html
          grep -q 'Paste the actual agent response for this stage' index.html
          grep -q 'Run 10 independent executions' index.html
          grep -q 'Release only exact accepted artifact' index.html
          grep -q 'crypto.subtle.digest' index.html
          grep -q 'Released artifact bytes/text do not exactly equal' index.html
          grep -q 'Response is too short to be a completed stage result' index.html
      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp index.html dist/404.html
          : > dist/.nojekyll
      - name: Configure Pages and enable it if necessary
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
