name: Verify and deploy the single application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce one application
        run: |
          test -f index.html
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -e workbook.js
      - name: Verify application architecture
        run: node verify.mjs
      - name: Verify retained proof project
        run: node verify-project.mjs
      - uses: actions/configure-pages@v5
      - name: Build minimal Pages payload
        run: |
          mkdir -p _site
          cp index.html SELF_VERIFIED_PROJECT.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact verified application
        id: deployment
        uses: actions/deploy-pages@v4
