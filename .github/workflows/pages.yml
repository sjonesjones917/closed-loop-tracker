name: Replay canonical verification repair
on:
  push:
    branches: [reliability/canonical-verification-plan-current-v4]
permissions: {contents: write}
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability/canonical-verification-plan-current-v4, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Replay source-only semantic delta
        run: |
          git diff -U0 1683f8aaca02557bbae7edfe0e1e05c7627c1cf1 ef62cf054cb33cbdfa3640135b1b6dbd4293f45b -- workflow-schema.js workflow-engine.js verify-full-cycle.mjs > /tmp/canonical-verification.patch
          test -s /tmp/canonical-verification.patch
          git apply --unidiff-zero /tmp/canonical-verification.patch
      - name: Restore production workflow
        run: git checkout 263f4e8b179d4949d319ec260dce3fdb9888f7b9 -- .github/workflows/pages.yml
      - name: Run deterministic acceptance
        run: |
          node build-test-project.mjs
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit replayed repair only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -z "$(git diff --name-only | grep -vE '^(workflow-schema.js|workflow-engine.js|verify-full-cycle.mjs|.github/workflows/pages.yml)$' || true)"
          git add -A
          git commit -m "Bind product verification to the canonical Stage 6 plan on current main"
          git push origin HEAD:reliability/canonical-verification-plan-current-v4