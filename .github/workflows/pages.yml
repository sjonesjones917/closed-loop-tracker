name: Apply verified closed-loop repair
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: closed-loop-repair-bootstrap
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify repair archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .repair-bundle/chunk-00 \
            .repair-bundle/chunk-01 \
            .repair-bundle/chunk-02 \
            .repair-bundle/chunk-03 \
            .repair-bundle/chunk-04 \
            .repair-bundle/chunk-05 \
            .repair-bundle/chunk-06 \
            .repair-bundle/chunk-07 \
            .repair-bundle/chunk-08 \
            .repair-bundle/chunk-09-0 .repair-bundle/chunk-09-1 .repair-bundle/chunk-09-2 .repair-bundle/chunk-09-3 \
            .repair-bundle/chunk-10-0 .repair-bundle/chunk-10-1 .repair-bundle/chunk-10-2 .repair-bundle/chunk-10-3 \
            .repair-bundle/chunk-11-0 .repair-bundle/chunk-11-1 .repair-bundle/chunk-11-2 .repair-bundle/chunk-11-3 \
            .repair-bundle/chunk-12-0 .repair-bundle/chunk-12-1 .repair-bundle/chunk-12-2 .repair-bundle/chunk-12-3 \
            .repair-bundle/chunk-13-0 .repair-bundle/chunk-13-1 .repair-bundle/chunk-13-2 .repair-bundle/chunk-13-3a .repair-bundle/chunk-13-3b \
            > /tmp/closed-loop-repair.b64
          base64 --decode /tmp/closed-loop-repair.b64 > /tmp/closed-loop-repair.tgz
          echo '65bf240d9639832e11f1e13e77dd06d356458ff9dc518ae73783c08fe909922c  /tmp/closed-loop-repair.tgz' | sha256sum --check --strict
          cp .github/workflows/pages.yml /tmp/bootstrap-pages.yml
          tar -xzf /tmp/closed-loop-repair.tgz
          cp /tmp/bootstrap-pages.yml .github/workflows/pages.yml
          rm -rf .repair-bundle
          rm -f authority-guard.js experience.js integrity-guard.js prompt-display.js storage-reliability.js usability.js \
            verify-hardening-browser.mjs verify-hardening-runner.mjs verify-integrity-browser.mjs \
            verify-prompt-isolation.mjs verify-prompts-live.mjs verify-storage-browser.mjs
      - name: Verify repaired source before committing
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node --check app.js
          node --check app-core.js
          node --check workbook.js
          node --check prompt-engine.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check hash.js
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-live.mjs
          node --check verify-browser.mjs
          node verify.mjs
          node verify-ingestion.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          ! grep -R 'MutationObserver' --include='*.js' --include='*.html' .
      - name: Commit verified repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Repair closed-loop response ingestion and workflow reliability'
          git push origin HEAD:main
