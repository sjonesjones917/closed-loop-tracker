name: Verify final browser behavior
on:
  pull_request: {branches: [main]}
permissions: {contents: read}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs
      - run: node --check app.js && node --check workbook.js && node --check build-test-project.mjs && node --check verify.mjs && node --check verify-live.mjs && node --check verify-browser.mjs
      - run: node verify.mjs
      - name: Confirm canonical build is idempotent
        run: git diff --exit-code -- app.js workbook.js index.html TEST_PROJECT.json
      - name: Start the existing application
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          echo $! > /tmp/closed-loop-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
      - name: Verify served resources
        env: {PAGE_URL: 'http://127.0.0.1:4173/'}
        run: node verify-live.mjs
      - name: Exercise the running application at phone and desktop widths
        env: {PAGE_URL: 'http://127.0.0.1:4173/'}
        run: node verify-browser.mjs
