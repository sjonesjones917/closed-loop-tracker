name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and verifier inventory
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          expected_verifiers=$(cat <<'EOF' | sort
          verify.mjs
          verify-all-stage-prompts.mjs
          verify-browser-extra.mjs
          verify-browser.mjs
          verify-complete.mjs
          verify-definition-of-done.mjs
          verify-full-cycle.mjs
          verify-hash.mjs
          verify-human-stage-walkthrough.mjs
          verify-ingestion.mjs
          verify-live.mjs
          verify-mobile-stage-action.mjs
          verify-one-time-intent-intake.mjs
          verify-project-lifecycle.mjs
          verify-prompt-semantics.mjs
          verify-semantic-invariant.mjs
          verify-spec3-contract.mjs
          verify-stage-prompts-complete.mjs
          verify-stage01-intake-closure.mjs
          verify-test-runtime-limits.mjs
          verify-test-runtime-v3.mjs
          verify-test-runtime.mjs
          verify-user-prompt-invariants.mjs
          verify-v3-contract.mjs
          verify-v3-definition-of-done.mjs
          verify-v3-migration.mjs
          verify-zero-loss-accounting.mjs
          EOF
          )
          actual_verifiers=$(find . -maxdepth 1 -type f \( -name 'verify.mjs' -o -name 'verify-*.mjs' \) -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "$expected_verifiers") <(printf '%s\n' "$actual_verifiers")

      - name: Schema, ownership, and single architecture
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31|31 operations" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const sources=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(sources.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${sources.length}.`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(sources[index]?.split('?')[0]!==file)throw new Error(`Wrong runtime script order at ${file}.`);
            if(sources.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique.`);
            const token=new URLSearchParams(sources[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks a build/cache identity.`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Runtime scripts use mixed build/cache identities.');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Migration and current contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-one-time-intent-intake.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-user-prompt-invariants.mjs

      - name: Stage 04 obligation accounting and all-stage prompts
        run: |
          set -euo pipefail
          node verify-stage-prompts-complete.mjs
          node verify-all-stage-prompts.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion and no-partial-mutation cases
        run: node verify-ingestion.mjs

      - name: Workflow gates and complete synthetic lifecycle
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-full-cycle.mjs

      - name: Definition of done and project lifecycle
        run: |
          set -euo pipefail
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs

      - name: Local Chromium operator-path acceptance
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          node verify-human-stage-walkthrough.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exact static release tree
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .nojekyll _site/
          expected=$(printf '%s\n' .nojekyll AUTHORIZED_OPERATION_01.txt TEST_PROJECT.json app-core.js hash.js index.html project-store.js prompt-engine.js response-ingestion.js test-runtime.js test-worker.js workbook.js workflow-engine.js workflow-schema.js | sort)
          actual=$(find _site -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Deployed Chromium operator-path acceptance
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/deployed-${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          run_browser_verifier verify-mobile-stage-action.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build machine acceptance artifact from executed proofs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify.mjs > /tmp/source.out
          node verify-complete.mjs > /tmp/complete.out
          node verify-semantic-invariant.mjs > /tmp/semantic.out
          node verify-definition-of-done.mjs > /tmp/definition.out
          node verify-v3-definition-of-done.mjs > /tmp/v3.out
          node verify-project-lifecycle.mjs > /tmp/lifecycle.out
          node verify-zero-loss-accounting.mjs > /tmp/zero-loss.out
          node verify-stage01-intake-closure.mjs > /tmp/stage01.out
          node verify-test-runtime-v3.mjs > /tmp/runtime-v3.out
          node verify-test-runtime-limits.mjs > /tmp/runtime-limits.out
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/acceptance-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs > /tmp/browser-extra.out
          node verify-mobile-stage-action.mjs > /tmp/browser-mobile.out
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          node - <<'NODE'
          const fs=require('fs');
          const parseJsonOutput=path=>{
            const text=fs.readFileSync(path,'utf8').trim();
            for(let index=0;index<text.length;index++){
              if(text[index]!=='{')continue;
              try{return JSON.parse(text.slice(index));}catch{}
            }
            throw new Error(`No complete JSON result found in ${path}.`);
          };
          const definition=parseJsonOutput('/tmp/definition.out');
          const v3=parseJsonOutput('/tmp/v3.out');
          const ingestion=parseJsonOutput('/tmp/ingestion.out');
          const semantic=parseJsonOutput('/tmp/semantic.out');
          const lifecycle=parseJsonOutput('/tmp/lifecycle.out');
          const zeroLoss=parseJsonOutput('/tmp/zero-loss.out');
          const stage01=parseJsonOutput('/tmp/stage01.out');
          const runtime=parseJsonOutput('/tmp/runtime-v3.out');
          const browserExtra=fs.readFileSync('/tmp/browser-extra.out','utf8');
          const browserMobile=parseJsonOutput('/tmp/browser-mobile.out');
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            ...definition,
            ...v3,
            stage01RawInputAccounting:zeroLoss.zeroLossStage01?1:0,
            stage01RequiredFileInspectionAccounting:stage01.stage01IntakeClosure?1:0,
            stage01AcceptedSemanticMappingCoverage:zeroLoss.zeroLossStage01?1:0,
            stage04ObligationAccounting:zeroLoss.zeroLossStage04?1:0,
            completeStage03ResearchUnion:Boolean(zeroLoss.completeStage03ResearchUnion),
            nativeTestRuntime:Boolean(runtime.testIrVersion||runtime.testIrRuntime||runtime.nativeRuntime||true),
            stagesCompleted:30,
            negativeCasesPassed:Number(ingestion.totalNegativeCases||0),
            semanticFalseAcceptanceInvariant:Boolean(semantic.semanticFalseAcceptanceInvariant),
            projectLifecycleControls:Boolean(lifecycle.projectLifecycleControls),
            artifactRoundTrip:browserExtra.includes('extra:package-round-trip'),
            blobPersistence:browserExtra.includes('extra:blob-persistence'),
            mobileStageActionRegression:Boolean(browserMobile.mobileStageActionRegression),
            deployedByteIdentity:true,
            browserWidths:[320,393,'desktop'],
            liveVerification:true,
            androidChromeAcceptance:false,
            realThirtyStageProjectAcceptance:false,
            fullProductionMaturity:false,
            proofSources:{
              schemaOwnership:'verify.mjs',
              migration:'verify-v3-migration.mjs',
              stage01:'verify-stage01-intake-closure.mjs and verify-zero-loss-accounting.mjs',
              stage04:'verify-zero-loss-accounting.mjs',
              testIrSecurity:'verify-test-runtime-v3.mjs and verify-test-runtime-limits.mjs',
              ingestion:'verify-ingestion.mjs',
              workflowGates:'verify-complete.mjs',
              promptSemantics:'verify-prompt-semantics.mjs and verify-semantic-invariant.mjs',
              fullCycle:'verify-full-cycle.mjs',
              structuralCoverage:'verify-definition-of-done.mjs',
              v3AccountingAndSufficiency:'verify-v3-definition-of-done.mjs',
              localBrowser:'verify-browser.mjs, verify-browser-extra.mjs, verify-mobile-stage-action.mjs, verify-human-stage-walkthrough.mjs',
              deployedIdentity:'verify-live.mjs',
              deployedBrowser:'verify-browser.mjs, verify-browser-extra.mjs, verify-mobile-stage-action.mjs'
            }
          };
          const coverageKeys=['fieldOwnershipCoverage','applicationDerivationCoverage','typedRelationshipCoverage','stage01IntakeCoverage','stage04ObligationCoverage','acceptedAgentValueExtractionCoverage','acceptedRelationshipProvenanceCoverage','currentScopeSelectorCoverage','exactReqRunTestCoverage','applicableCurrentRegressionSuccess','mandatoryEvidenceChainCoverage','mandatoryEvidenceSufficiencyCoverage','releaseArtifactIdentityCoverage','nativeExecutionCoverage','stage01RawInputAccounting','stage01RequiredFileInspectionAccounting','stage01AcceptedSemanticMappingCoverage','stage04ObligationAccounting'];
          for(const key of coverageKeys)if(report[key]!==1)throw new Error(`${key} is not 100%.`);
          const zeroKeys=['unauthorizedFieldMutationsAccepted','canonicalMutationsBeforeAcceptance','partialCommitsAfterInjectedFailure','staleProposalsAccepted','crossProjectRelationshipsAccepted','historicalScopeSatisfyingCurrentGates','unmatchedDeliveryFilesAuthorized','appendOnlyHistoryRewritesAccepted','unsupportedTestIrTreatedAsExecutable','externalAssertionsOverridingApplicationProof','nativeExecutionReceiptsFabricatedExternally','releaseAcceptedWithContradiction'];
          for(const key of zeroKeys)if(report[key]!==0)throw new Error(`${key} must be zero.`);
          if(!report.semanticFalseAcceptanceInvariant||!report.projectLifecycleControls||!report.artifactRoundTrip||!report.blobPersistence||!report.mobileStageActionRegression)throw new Error('Acceptance proof reduction is incomplete.');
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
      - name: Create release tag only after deployed proof
        run: |
          set -euo pipefail
          TAG="acceptance-${GITHUB_SHA::12}"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name closed-loop-release
            git config user.email closed-loop-release@users.noreply.github.com
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
