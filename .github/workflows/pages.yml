    lines.forEach((rawLine,index)=>{if(!rawLine.trim())return;const location=lines.length>1?`${sourceLocation}#line=${index+1}`:sourceLocation,rawValueSha256=hash.sha256Value(rawLine),unitId=`INPUT-UNIT-${hash.sha256Value({inputVersion:metadata.inputVersion,kind,sourceLocation:location,rawValueSha256}).slice(0,20).toUpperCase()}`;units.push({unitId,kind,sourceLocation:location,label:lines.length>1?`${label} line ${index+1}`:label,rawValueSha256,rawValueText:rawLine,...clone(metadata.extra||{})});emitted++;});
    if(!emitted&&value.length){const rawValueSha256=hash.sha256Value(value),unitId=`INPUT-UNIT-${hash.sha256Value({inputVersion:metadata.inputVersion,kind,sourceLocation,rawValueSha256}).slice(0,20).toUpperCase()}`;units.push({unitId,kind,sourceLocation,label,rawValueSha256,rawValueText:value,...clone(metadata.extra||{})});}
