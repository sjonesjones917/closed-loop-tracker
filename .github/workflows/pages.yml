name: Repair controlling bundle branch
on:
  push:
    branches:
      - fix/complete-spec-stage4-prompts-20260830
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-spec-stage4-prompts-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair
        id: repair
        shell: bash
        run: |
          set +e
          node repair-runner.mjs > repair.log 2>&1
          code=$?
          cat repair.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve diagnostic when repair fails
        if: steps.repair.outputs.exit_code != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair.log
          git commit -m 'Capture controlling-bundle repair diagnostic' || true
          git push origin HEAD:fix/complete-spec-stage4-prompts-20260830 || true
          exit 1
      - name: Syntax and zero-loss proof
        if: steps.repair.outputs.exit_code == '0'
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-stage01-stage04-exhaustion.mjs
          node verify-stage01-stage04-exhaustion.mjs
          git diff --check
      - name: Commit implementation and restore normal Pages workflow
        if: steps.repair.outputs.exit_code == '0'
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js verify-stage01-stage04-exhaustion.mjs .github/workflows/pages.yml
          git commit -m 'Implement exhaustive Stage 1-4 accounting and v3 prompt contracts'
          git push origin HEAD:fix/complete-spec-stage4-prompts-20260830
