name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs
      - run: node --check app.js && node --check workbook.js && node --check verify.mjs && node --check verify-live.mjs
      - run: node verify.mjs
      - name: Verify single app and source terminology
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f human-ui.js
          test ! -f agent-workflow.js
          test ! -f prompt-center.js
          grep -q 'src="workbook.js' index.html
          grep -q 'src="app.js' index.html
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app.js','utf8')+fs.readFileSync('index.html','utf8')+fs.readFileSync('workbook.js','utf8');
          const banned=new RegExp('se'+'mantic','i');
          if(banned.test(s))throw new Error('prohibited terminology');
          if(/human-project\/31|31 operations|Freeze New Version/i.test(s))throw new Error('discarded architecture');
          NODE
      - name: Render the existing application at phone and desktop sizes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          for WIDTH in 320 393 1365; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=${WIDTH},900 --virtual-time-budget=12000 --screenshot="render-${WIDTH}.png" "http://127.0.0.1:4173/?verify=${GITHUB_SHA}-${WIDTH}"
            "$BROWSER" --headless --no-sandbox --disable-gpu --window-size=${WIDTH},900 --virtual-time-budget=12000 --dump-dom "http://127.0.0.1:4173/?verify=${GITHUB_SHA}-${WIDTH}" > "render-${WIDTH}.html"
            grep -q 'JOB-20260823144121' "render-${WIDTH}.html"
            grep -q 'Mobile Closed-Loop Agent Reliability Workbook' "render-${WIDTH}.html"
            grep -q '1/30 complete' "render-${WIDTH}.html"
            grep -q 'STAGE 02' "render-${WIDTH}.html"
            grep -q 'Proceed to Operation 02' "render-${WIDTH}.html"
            ! grep -qi 'GEN-042' "render-${WIDTH}.html"
            ! grep -qi 'field status report' "render-${WIDTH}.html"
            ! grep -qi 'maintenance handoff' "render-${WIDTH}.html"
          done
      - name: Preserve source and rendered verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: existing-app-verification-${{ github.sha }}
          if-no-files-found: error
          path: |
            index.html
            app.js
            workbook.js
            TEST_PROJECT.json
            build-test-project.mjs
            verify.mjs
            verify-live.mjs
            README.md
            .github/workflows/pages.yml
            render-*.png
            render-*.html
            server.log

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node verify-live.mjs
      - name: Verify phone views at 320 and 393 CSS pixels
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          for WIDTH in 320 393; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --window-size=${WIDTH},852 --virtual-time-budget=10000 --dump-dom "${PAGE_URL}?verify=${GITHUB_SHA}-${WIDTH}" > "live-${WIDTH}.html"
            grep -q 'Mobile Closed-Loop Agent Reliability Workbook' "live-${WIDTH}.html"
            grep -q '1/30 complete' "live-${WIDTH}.html"
            grep -q 'STAGE 02' "live-${WIDTH}.html"
            grep -q 'Saved instructions' "live-${WIDTH}.html"
            grep -q 'Saved outputs' "live-${WIDTH}.html"
            grep -q 'Overview' "live-${WIDTH}.html"
            ! grep -qi 'GEN-042' "live-${WIDTH}.html"
            ! grep -qi 'field status report' "live-${WIDTH}.html"
            ! grep -qi 'maintenance handoff' "live-${WIDTH}.html"
            ! grep -q '0/31 complete' "live-${WIDTH}.html"
            ! grep -q 'Loading the workflow' "live-${WIDTH}.html"
          done
