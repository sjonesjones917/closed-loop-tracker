name: Apply Stage 01 artifact authority repair
on:
  push:
    branches: [fix/stage01-artifact-authority-20260830]
permissions:
  contents: write
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "stage 01 artifact authority repair ready"
  repair:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-artifact-authority-20260830
          fetch-depth: 1
      - name: Apply exact repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return False
              if old not in s:
                  raise SystemExit(f"Expected source not found in {path}")
              p.write_text(s.replace(old, new, 1))
              return True

          changed = False
          changed |= replace(
              'workflow-engine.js',
              "  enumerateInputLeaves(project.projectData.userEntered,'projectData.userEntered','ORIGINAL_USER_INPUT','Original user input',units,{inputVersion});\n  for(const answer of safe(project.projectData.humanInputAnswers).filter(item=>!item.invalidatedBy)){",
              "  enumerateInputLeaves(project.projectData.userEntered,'projectData.userEntered','ORIGINAL_USER_INPUT','Original user input',units,{inputVersion});\n  for(const file of safe(project?.stages?.[1]?.authorizedFiles)){const artifactId=String(file?.artifactId||file?.id||'').trim();if(!artifactId)continue;const artifact=records(project,'artifacts').find(record=>recordId(record,'artifacts')===artifactId);const descriptor=JSON.stringify({artifactId,filename:String(recordValue(artifact,'FILENAME')||file?.name||artifactId),sha256:String(recordValue(artifact,'SHA256')||file?.sha256||'UNKNOWN'),byteSize:Number(recordValue(artifact,'BYTE_SIZE')||file?.size||0)});enumerateInputLeaves(descriptor,`projectData.stage1SuppliedArtifacts.${artifactId}`,'SUPPLIED_MATERIAL',`Supplied Stage 01 artifact ${artifactId}`,units,{inputVersion,extra:{artifactId}});}\n  for(const answer of safe(project.projectData.humanInputAnswers).filter(item=>!item.invalidatedBy)){"
          )
          changed |= replace(
              'app-core.js',
              "const applicable=[1,10,17,20,21,25].includes(n),productReady=n!==21||Boolean(currentStageProduct()),fileLocked=locked||!productReady;",
              "const applicable=[1,10,17,20,21,25].includes(n),productReady=n!==21||Boolean(currentStageProduct()),fileLocked=locked||!productReady||(n===1&&current.stages[1].status==='COMPLETE');"
          )
          changed |= replace(
              'prompt-engine.js',
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/34';",
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/35';"
          )

          p = Path('index.html')
          s = p.read_text()
          old_token = 'runtime-20260830-prompt-authority-34'
          new_token = 'runtime-20260830-prompt-authority-35'
          if old_token in s:
              s = s.replace(old_token, new_token)
              changed = True
          elif new_token not in s:
              raise SystemExit('Expected runtime cache token not found')
          p.write_text(s)
          print('changed', changed)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js app-core.js prompt-engine.js index.html
          git commit -m "Bind Stage 01 supplied artifacts into intake authority"
          git push origin HEAD:fix/stage01-artifact-authority-20260830
