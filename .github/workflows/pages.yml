name: Deploy Closed-Loop Agent Reliability

on:
  push:
    branches:
      - main
    paths-ignore:
      - LIVE_DEPLOYMENT_VERIFIED.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closed-loop-pages-deployment
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      app_sha256: ${{ steps.package.outputs.app_sha256 }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4

      - name: Use current Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild the exact application from the verified payload
        run: node build-app.mjs

      - name: Verify the application architecture and JavaScript
        run: node verify-app.mjs

      - name: Install the browser driver
        run: npm install --no-save --ignore-scripts playwright-core

      - name: Execute the rendered phone UI smoke test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node browser-smoke.mjs

      - name: Build the exact static Pages payload
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA256="$(sha256sum index.html | awk '{print $1}')"
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp index.html dist/404.html
          cp -R app-payload dist/app-payload
          for legacy in app-v10.html app-v11.html app-v13.html live.html; do
            if [[ -f "$legacy" ]]; then cp "$legacy" "dist/$legacy"; fi
          done
          : > dist/.nojekyll
          printf '{"status":"VERIFIED_AND_READY_TO_DEPLOY","sourceCommit":"%s","publicName":"Closed-Loop Agent Reliability","publicVersionLabel":false,"stages":31,"stage1Scopes":20,"informationClasses":3,"seededSelfBuildProject":false,"promptRelayArchitecture":false,"appSha256":"%s"}\n' "$GITHUB_SHA" "$APP_SHA256" > dist/deployment.json
          echo "app_sha256=$APP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Preserve verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-verification-evidence
          path: |
            STATIC_VERIFICATION.json
            BROWSER_SMOKE_REPORT.json
            PHONE_SMOKE_393.png
            PHONE_SMOKE_320.png
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact verified source revision
        uses: actions/checkout@v4

      - name: Deploy the verified application
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live root bytes
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.app_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p live-check
          verified=false
          for attempt in $(seq 1 36); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 --retry-delay 1 "${PAGE_URL}?verify=${nonce}" -o live-check/index.html; then
              LIVE_SHA256="$(sha256sum live-check/index.html | awk '{print $1}')"
              if [[ "$LIVE_SHA256" == "$EXPECTED_SHA256" ]]; then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo 'Live GitHub Pages root did not become byte-identical to the verified application.' >&2
            exit 1
          fi
          grep -Fq '<title>Closed-Loop Agent Reliability</title>' live-check/index.html
          grep -Fq '<h1>Closed-Loop Agent Reliability</h1>' live-check/index.html
          if grep -Eqi 'Closed-Loop Agent Reliability[[:space:]]+v[0-9]+' live-check/index.html; then
            echo 'A public version label appeared in the live application.' >&2
            exit 1
          fi

      - name: Record the verified live deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.app_sha256 }}
        run: |
          set -euo pipefail
          LIVE_SHA256="$(sha256sum live-check/index.html | awk '{print $1}')"
          test "$LIVE_SHA256" = "$EXPECTED_SHA256"
          printf '{"status":"VERIFIED_LIVE","sourceCommit":"%s","pageUrl":"%s","publicName":"Closed-Loop Agent Reliability","publicVersionLabel":false,"stages":31,"stage1Scopes":20,"informationClasses":3,"humanWorkSupported":true,"agentWorkSupported":true,"seededSelfBuildProject":false,"promptRelayArchitecture":false,"appSha256":"%s","liveSha256":"%s","verifiedAt":"%s"}\n' "$GITHUB_SHA" "$PAGE_URL" "$EXPECTED_SHA256" "$LIVE_SHA256" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > LIVE_DEPLOYMENT_VERIFIED.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LIVE_DEPLOYMENT_VERIFIED.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record verified live application deployment [skip ci]'
          git push origin HEAD:main
