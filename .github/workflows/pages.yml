          3f63581f766c0753aa4c8c11aa1e5847ca62c22f74b2ef2c9f971c45f6dee102  restore-profile.py
          9e7a3d87a35ebc0dd45cc954bfb20f29cc829830860d40c575a71ae1a255c974  prepare-helpers.mjs
          743008339b44d825ea345dc7f963aee283233fcfed443e76cbf28b44b509f592  replay.mjs
          879c488fe582ca26631520389d2e8ca7e828489c4965526b5ce22cea70d42911  supervisor.mjs
          5e5ba59cad1d014569282c9412e895959b5af74de2a1c37c49a4e90072355a94  reviewed-wait-driver-template.mjs
          8b6301c498c226b2b1190e87988139cfcc0bd9ea8f1bbcff85e37cada1522b69  downloaded-backup-decoder.mjs
          HELPER_HASHES
          (cd "$DIAG_OUT/runner-helpers" && sha256sum --check SHA256SUMS)
      - name: Restore an authenticated disposable profile and exact original site
        shell: bash
        run: |
          set -euo pipefail
          python3 "$DIAG_OUT/runner-helpers/restore-profile.py" --archive "$RUNNER_TEMP/stage30-suffix-original.zip" --directory "$DIAG_OUT/replay" | tee "$DIAG_OUT/restore.log"
      - name: Authenticate source and extract unchanged remaining-stage assertions
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          test "$(git rev-parse 'HEAD^{tree}')" = 24735288da9f734997c1920c111ad4d472e743e5
          test -z "$(git status --porcelain)"
          node "$DIAG_OUT/runner-helpers/prepare-helpers.mjs" "$DIAG_OUT/helpers" | tee "$DIAG_OUT/prepare.log"
          for script in "$DIAG_OUT/runner-helpers/"*.mjs "$DIAG_OUT/helpers/"*.mjs; do node --check "$script"; done
          test -z "$(git status --porcelain)"
      - name: Execute only the remaining Stage 30 suffix and final backup diagnostic
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          (cd "$DIAG_OUT/runner-helpers" && sha256sum --check SHA256SUMS)
          node "$DIAG_OUT/runner-helpers/supervisor.mjs" "$DIAG_OUT"
      - name: Preserve original archive identity and final source state
        if: always()
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$DIAG_OUT/source-commit-after.txt"
          git status --porcelain > "$DIAG_OUT/source-status-after.txt"
          if test -f "$RUNNER_TEMP/stage30-suffix-original.zip"; then
            sha256sum "$RUNNER_TEMP/stage30-suffix-original.zip" > "$DIAG_OUT/original-archive-after.sha256"
            echo 'e69c1b720115c28c623877868404865c239879b680b491df4679f314bfc53092  '"$RUNNER_TEMP/stage30-suffix-original.zip" | sha256sum --check
          fi
          if test -f "$DIAG_OUT/runner-helpers/SHA256SUMS"; then
            (cd "$DIAG_OUT/runner-helpers" && sha256sum --check SHA256SUMS) > "$DIAG_OUT/runner-helper-hashes-after.txt"
          fi
          test "$(git rev-parse HEAD)" = 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          test -z "$(git status --porcelain)"
      - name: Retain new diagnostic evidence without the original archive or acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-only-stage30-suffix-50f53978-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAG_OUT }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
