          const substitutions=[
           ["child.stderr.on('data',bytes=>{stderr=(stderr+bytes).slice(-8000);});","child.stderr.on('data',bytes=>{globalThis.__clrtDiagnosticChromeStderr(bytes);stderr=(stderr+bytes).slice(-8000);});"],
