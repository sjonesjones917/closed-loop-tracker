name: Apply Stage 14 candidate-freeze repair

on:
  push:
    branches: [controller-stage14-candidate-freeze-20260904]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply candidate-freeze repair and verify focused behavior
        run: |
          set -euo pipefail
          node .repair-stage14.mjs
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check app-core.js
          node --check verify-candidate-freeze.mjs
          node verify-semantic-operation-boundaries.mjs
          node verify-candidate-freeze.mjs
      - name: Remove one-time scaffold and restore canonical Pages workflow
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/pages.yml > .github/workflows/pages.yml
          rm .repair-stage14.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js app-core.js verify-full-cycle.mjs verify-complete.mjs verify-definition-of-done.mjs verify-candidate-freeze.mjs .github/workflows/pages.yml .repair-stage14.mjs
          git commit -m "Require explicit human component selection before candidate freeze"
          git push origin HEAD:controller-stage14-candidate-freeze-20260904
