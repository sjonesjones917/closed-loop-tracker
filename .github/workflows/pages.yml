name: Self-build, verify, publish, and deploy Closed-Loop app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: closed-loop-build-and-pages-deploy
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source and regenerate the existing application
        shell: bash
        run: |
          set -euo pipefail
          test -s self-stage1-response.txt
          node --check app-core.js
          node --check build-v13-self.mjs
          node --check v13-state-replay.mjs
          node --check self-e2e-agent.mjs
          node --check self-browser-e2e.mjs
          node --check self-browser-defect-boundary.mjs
          node --check run-v13-self-e2e.mjs
          node build-v13-self.mjs
          node v13-state-replay.mjs
          test -s app-v13-candidate1.html
          test -s app-v13.html
          cp app-v13.html index.html

      - name: Verify lossless Stage 1 and external-authority research architecture
        shell: bash
        run: |
          set -euo pipefail
          cmp -s app-v13.html index.html
          grep -Fq 'all 20 scopes explicitly' app-v13.html
          grep -Fq 'COMPLETE STAGE 1 JOB DEFINITION — USER INPUT / RESEARCH SCOPE, NOT EXTERNAL AUTHORITY:' app-v13.html
          grep -Fq 'RESEARCH AUTHORITY BOUNDARY — EXTERNAL SOURCES ONLY' app-v13.html
          grep -Fq 'Stage 2 research sources must be independent external sources' app-v13.html
          grep -Fq 'function replayProject(input)' app-v13.html
          grep -Fq "requireFullyValid: true, source: 'Published self-project'" app-v13.html
          grep -Fq 'SELF_VERIFIED_PROJECT.json' app-v13.html
          grep -Fq 'TARGET RUN OUTPUT TO VERIFY' app-v13.html
          if grep -Fq 'Inspect the actual supplied sources and build the complete source inventory now.' app-v13.html; then
            echo 'Obsolete circular Stage 2 instruction remains.' >&2
            exit 1
          fi
          if grep -Fq 'RAW STAGE 1 RESPONSE AND SUPPLIED IMPLEMENTATION FILE LIST OMITTED BY DESIGN.' app-v13.html; then
            echo 'Obsolete narrowed Stage 1 handoff remains.' >&2
            exit 1
          fi

      - name: Install browser test driver
        shell: bash
        run: npm install --no-save playwright-core

      - name: Complete the actual 31-stage self-build through the rendered UI
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node self-browser-defect-boundary.mjs
          node run-v13-self-e2e.mjs

      - name: Independently verify the UI-exported project and exact release bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s SELF_VERIFIED_PROJECT.json
          test -s SELF_E2E_REPORT.json
          test -s SELF_PROJECT_COMPLETED_393.png
          test -s SELF_PROJECT_AUTOLOADED_393.png
          test -s SELF_PROJECT_AUTOLOADED_320.png
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const fail = (message) => { throw new Error(message); };
          const appBytes = fs.readFileSync('app-v13.html');
          const html = appBytes.toString('utf8');
          const projectBytes = fs.readFileSync('SELF_VERIFIED_PROJECT.json');
          const project = JSON.parse(projectBytes.toString('utf8'));
          const report = JSON.parse(fs.readFileSync('SELF_E2E_REPORT.json', 'utf8'));
          const stage1 = String(project.stages?.[0]?.response || '');
          const stage2 = String(project.stages?.[1]?.response || '');
          const stage3 = String(project.stages?.[2]?.response || '');
          const stage1Tokens = [
            'JOB_ID', 'EXACT USER OBJECTIVE', 'EXACT DELIVERABLE', 'REQUESTED ACTIONS',
            'SUBJECT AND TARGET', 'PROBLEM AND QUESTION SET', 'SCOPE BOUNDARIES',
            'SUPPLIED INFORMATION', 'PROVENANCE CLASSIFICATION',
            'PRIOR CONVERSATION DEPENDENCIES', 'USER-DEFINED TERMINOLOGY',
            'CONSTRAINTS', 'PROHIBITED ACTIONS', 'REQUIRED METHODS',
            'REQUIRED OUTPUT PROPERTIES', 'TEMPORAL SCOPE', 'LOCATION AND JURISDICTION',
            'SUCCESS AND ACCEPTANCE CONDITIONS', 'PRIORITIES AND OPTIMIZATION CRITERIA',
            'UNCERTAINTIES', 'EXTERNAL RESEARCH QUESTIONS', 'ASSUMPTIONS', 'BLOCKERS'
          ];
          for (const token of stage1Tokens) if (!stage1.toUpperCase().includes(token)) fail(`Stage 1 missing ${token}`);
          if (!Array.isArray(project.stages) || project.stages.length !== 31) fail('Project does not contain exactly 31 stages.');
          if (project.stages.some((stage) => stage.status !== 'COMPLETE')) fail('Project contains incomplete stages.');
          if (project.projectId !== 'PROJECT-MT3M46X0-075JMP') fail('Exact PROJECT_ID was not preserved.');
          if (project.jobId !== 'JOB-MT3M46X0-M0LIB9') fail('Exact JOB_ID was not preserved.');
          if (!/EXTERNAL_SEARCH_PERFORMED\s*:\s*true/i.test(stage2)) fail('Stage 2 lacks real external-search evidence.');
          if (!/SOURCE_ID\s*:\s*SRC-/i.test(stage2) || !/SOURCE_TYPE\s*:/i.test(stage2) || !/https?:\/\//i.test(stage2)) fail('Stage 2 lacks external-source records.');
          if (/SOURCE_TYPE\s*:\s*(APPLICATION_FILE|GENERATED_FILE|WORK_PRODUCT|PROJECT_JSON|HTML|JAVASCRIPT)\b/i.test(stage2)) fail('Stage 2 contains an internal work product as external authority.');
          if (/\b(app-v11\.html|build-v13-self\.mjs|self-browser-e2e\.mjs|self-e2e-agent\.mjs|SELF_VERIFIED_PROJECT\.json)\b/i.test(stage2)) fail('Stage 2 contains prohibited project work-product authority.');
          if (!/FINDING_ID\s*:\s*FINDING-/i.test(stage3) || !/SOURCE_ID\s*:\s*SRC-/i.test(stage3)) fail('Stage 3 findings are not traced to external sources.');
          if (/\b(app-v11\.html|build-v13-self\.mjs|self-browser-e2e\.mjs|self-e2e-agent\.mjs)\b/i.test(stage3)) fail('Stage 3 derives requirements from project work products.');
          if (project.stages[10].producers.filter(Boolean).length !== 10) fail('Stage 11 does not contain 10 producer responses.');
          if (project.stages[11].verifiers.filter(Boolean).length !== 10) fail('Stage 12 does not contain 10 verifier responses.');
          if (project.stages[17].producers.filter(Boolean).length !== 10) fail('Stage 18 does not contain 10 producer responses.');
          if (project.stages[18].verifiers.filter(Boolean).length !== 10) fail('Stage 19 does not contain 10 verifier responses.');
          if (project.stages[19].producers.filter(Boolean).length !== 10) fail('Stage 20 does not contain 10 producer responses.');
          if (project.stages[19].verifiers.filter(Boolean).length !== 10) fail('Stage 20 does not contain 10 verifier responses.');
          if (!project.stages[11].verifiers.every((value) => /REQ-015.*VIOLATED/i.test(value))) fail('First-candidate defect is not preserved in all 10 verifier records.');
          if (!project.stages[18].verifiers.every((value) => /REQ-015.*SATISFIED/i.test(value))) fail('Corrected candidate did not pass all 10 verifier records.');
          if (project.releaseDecision !== 'ACCEPTED') fail('Release decision is not ACCEPTED.');
          if (project.artifactName !== 'app-v13.html') fail('Released artifact name is not app-v13.html.');
          if (Buffer.compare(Buffer.from(project.artifact, 'utf8'), appBytes) !== 0) fail('Project artifact is not byte-identical to app-v13.html.');
          const hash = crypto.createHash('sha256').update(appBytes).digest('hex');
          if (project.auditedHash !== hash || project.releaseHash !== hash) fail('Audited/release hashes do not equal the actual app SHA-256.');
          if (html.includes(project.projectId) || html.includes(project.objective)) fail('Completed project state is hardcoded into the HTML.');
          if (report.status !== 'PASS' || report.hardcodedProject !== false || report.freshBrowserSidecarAutoload !== true) fail('Browser report does not prove exact sidecar autoload without hardcoding.');
          if (report.storedCircularStage2ReplayInvalidatedFromStage !== 2) fail('Browser report does not prove invalidation of obsolete circular Stage 2 state.');
          console.log(JSON.stringify({
            status: 'PASS',
            projectId: project.projectId,
            jobId: project.jobId,
            stagesComplete: 31,
            producerResponses: 30,
            verifierResponses: 30,
            releaseDecision: project.releaseDecision,
            appSha256: hash,
            projectExportBytes: projectBytes.length,
            stage1LosslessScopes: 20,
            stage2Authority: 'EXTERNAL_ONLY',
            stage3Authority: 'EXTERNAL_ONLY',
            hardcodedProject: false
          }, null, 2));
          NODE

      - name: Create publication record and Pages artifact
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA256="$(sha256sum app-v13.html | awk '{print $1}')"
          PROJECT_SHA256="$(sha256sum SELF_VERIFIED_PROJECT.json | awk '{print $1}')"
          printf '{"status":"VERIFIED_AND_DEPLOYING","sourceCommit":"%s","app":"app-v13.html","entry":"index.html","project":"SELF_VERIFIED_PROJECT.json","report":"SELF_E2E_REPORT.json","appSha256":"%s","projectSha256":"%s","projectId":"PROJECT-MT3M46X0-075JMP","jobId":"JOB-MT3M46X0-M0LIB9","stagesComplete":31,"producerResponses":30,"verifierResponses":30,"releaseDecision":"ACCEPTED","stage1LosslessScopes":20,"stage2ResearchAuthority":"EXTERNAL_ONLY","stage3ResearchAuthority":"EXTERNAL_ONLY","hardcodedProject":false}\n' "$GITHUB_SHA" "$APP_SHA256" "$PROJECT_SHA256" > PUBLISHED_SELF_BUILD.json
          rm -rf dist
          mkdir -p dist
          cp app-v13.html dist/index.html
          cp app-v13.html dist/404.html
          cp app-v13.html dist/app-v13.html
          cp SELF_VERIFIED_PROJECT.json dist/SELF_VERIFIED_PROJECT.json
          cp SELF_E2E_REPORT.json dist/SELF_E2E_REPORT.json
          cp SELF_PROJECT_COMPLETED_393.png dist/SELF_PROJECT_COMPLETED_393.png
          cp SELF_PROJECT_AUTOLOADED_393.png dist/SELF_PROJECT_AUTOLOADED_393.png
          cp SELF_PROJECT_AUTOLOADED_320.png dist/SELF_PROJECT_AUTOLOADED_320.png
          cp PUBLISHED_SELF_BUILD.json dist/PUBLISHED_SELF_BUILD.json
          : > dist/.nojekyll
          echo "app_sha256=$APP_SHA256" >> "$GITHUB_OUTPUT"
          echo "project_sha256=$PROJECT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Preserve downloadable evidence from this exact run
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-v13-verified-release
          path: |
            app-v13-candidate1.html
            app-v13.html
            SELF_VERIFIED_PROJECT.json
            SELF_E2E_REPORT.json
            SELF_PROJECT_COMPLETED_393.png
            SELF_PROJECT_AUTOLOADED_393.png
            SELF_PROJECT_AUTOLOADED_320.png
            PUBLISHED_SELF_BUILD.json
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload exact verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish the exact tested app and project export to main
        shell: bash
        run: |
          set -euo pipefal
          cp app-v13.html index.html
          rm -f SELF_BUILD_WORKFLOW_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app-v13.html index.html SELF_VERIFIED_PROJECT.json SELF_E2E_REPORT.json SELF_PROJECT_COMPLETED_393.png SELF_PROJECT_AUTOLOADED_393.png SELF_PROJECT_AUTOLOADED_320.png PUBLISHED_SELF_BUILD.json SELF_BUILD_WORKFLOW_FAILURE.log
          if git diff --cached --quiet; then
            echo 'Tested repository artifacts already match this run.'
          else
            git commit -m 'Publish exact verified v13 app and matching project [skip ci]'
            git push origin HEAD:main
          fi

  deploy:
    needs: verify-build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact verified app and matching project
        id: deployment
        uses: actions/deploy-pages@v4
