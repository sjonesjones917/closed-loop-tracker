name: Diagnostic frozen f9 normal owners
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-f9-normal-owners-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: ''
      DIAG_OUT: ${{ github.workspace }}/normal-contract
      EXPECTED_SOURCE_COMMIT: f9a1b3a3c220b1b4f6c4685cf0dc5304102c9edf
    steps:
      - name: Check out the exact combined candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f9a1b3a3c220b1b4f6c4685cf0dc5304102c9edf
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Materialize the reviewed source-owned gate supervisor
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/normal-owner-lanes.mjs" <<'NORMAL_OWNER_HELPER'
          // External diagnostic orchestration. Every child is the unchanged default source-owned verifier.
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {pathToFileURL,fileURLToPath} from 'node:url';
          const PIN={sourceCommit:'f9a1b3a3c220b1b4f6c4685cf0dc5304102c9edf',sourceTree:'6070d6380ef99915ffc2d38bee354289f793f038',sourceInputsSha256:'6d78e5ff710d39f5a1f5d31f0a9ecc0df758412acd9413f27214add519565635',projectStoreSha256:'720c65a6dfd778e05a4c43e03afcd4e89c777dc2a80b665552cd1ebd9014809a',driverSha256:'ea0060f9dc46dadd3679e4547706006502a0ccc77b9b12097eed9da68199d87c'};
          const LANES={contract:['verify-contract-closure.mjs'],A:['verify-ingestion.mjs','verify-response-authority-integrity.mjs','verify-returned-slot-authority.mjs'],B:['verify-verifier-runtime.mjs','verify-test-runtime-v3.mjs','verify-stage01-agent-contract-alignment.mjs'],executed:['verify-executed-evidence.mjs']};
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex'),read=file=>JSON.parse(fs.readFileSync(file)),save=(file,value)=>fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n',{flag:'wx'});
          const expectedRuntime={node:'v22.23.3',platform:'linux',architecture:'x64'};
          const fileRecord=(root,name)=>{const stat=fs.lstatSync(path.join(root,name));assert(stat.isFile()&&!stat.isSymbolicLink(),'Seed member must be a regular file');const bytes=fs.readFileSync(path.join(root,name));return {path:name,bytes:bytes.length,sha256:sha(bytes)};};
          const seedFiles=owner=>[owner+'.receipt.json',owner+'.execution.json',owner+'.stdout.log',owner+'.stderr.log'];
          export function assertSeedBinding(binding,expected){
           assert.deepEqual(Object.keys(binding).sort(),['schema','source','runtime','workflow','helperSha256','owners','files'].sort());
           assert.equal(binding.schema,'clrt-diagnostic-current-owner-seeds/1');assert.deepEqual(binding.source,PIN);assert.deepEqual(binding.runtime,expectedRuntime);assert.deepEqual(binding.workflow,expected.workflow);assert.equal(binding.helperSha256,expected.helperSha256);assert.deepEqual(binding.owners,LANES.A);
           assert.deepEqual(binding.files.map(row=>row.path),LANES.A.flatMap(seedFiles));
           for(const row of binding.files){assert.deepEqual(Object.keys(row).sort(),['path','bytes','sha256'].sort());assert(Number.isSafeInteger(row.bytes)&&row.bytes>=0);assert(/^[a-f0-9]{64}$/.test(row.sha256));}
          }
          export function assertSeedFileInventory(seed,binding){
           assert(fs.lstatSync(path.join(seed,'seed-binding.json')).isFile()&&!fs.lstatSync(path.join(seed,'seed-binding.json')).isSymbolicLink(),'Seed binding must be regular');
           assert.deepEqual(fs.readdirSync(seed).sort(),['seed-binding.json',...binding.files.map(x=>x.path)].sort());
           for(const row of binding.files)assert.deepEqual(fileRecord(seed,row.path),row,'Transferred seed bytes differ');
          }
          async function main(){
           const [lane,outArg,seedArg]=process.argv.slice(2);assert(Object.hasOwn(LANES,lane));assert.equal(process.argv.length,lane==='executed'?5:4);
           const out=path.resolve(outArg),source=fs.realpathSync(process.cwd()),git=(...args)=>execFileSync('git',args,{encoding:'utf8',timeout:30000}).trim();
           assert.deepEqual({node:process.version,platform:process.platform,architecture:process.arch},expectedRuntime);assert.deepEqual(process.execArgv,[]);
           assert.equal(git('rev-parse','HEAD'),PIN.sourceCommit);assert.equal(git('rev-parse','HEAD^{tree}'),PIN.sourceTree);assert.equal(git('status','--porcelain'),'');
           assert.equal(process.env.GITHUB_ACTIONS,'true');assert.equal(process.env.NODE_OPTIONS,'--import '+pathToFileURL(path.join(source,'verification-evidence-preload.mjs')).href);
           assert.equal(process.env.CLOSED_LOOP_VERIFICATION_SOURCE_ROOT,source);assert.equal(process.env.CLOSED_LOOP_VERIFICATION_RECEIPTS,path.join(out,'receipts'));assert.equal(process.env.VERIFIER_CHILD_EVIDENCE_DIRECTORY,path.join(out,'children'));
           for(const key of ['CLOSED_LOOP_VERIFIER_OWNER_FD','BASELINE_COMMIT','CLOSED_LOOP_REQUIRE_CURRENT_OWNER_RECEIPTS','CLOSED_LOOP_EXECUTED_EVIDENCE_COPY_BASE'])assert.equal(process.env[key],undefined,key);
           assert(out!==source&&!out.startsWith(source+path.sep));assert(!fs.existsSync(out),'Each lane must start with a fresh outside-source output');
           const workflow={runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,headSha:process.env.GITHUB_SHA};assert(/^[1-9][0-9]*$/.test(workflow.runId));assert(/^[1-9][0-9]*$/.test(workflow.runAttempt));assert(/^[a-f0-9]{40}$/.test(workflow.headSha));
           const helperSha256=sha(fs.readFileSync(fileURLToPath(import.meta.url)));
           fs.mkdirSync(out);for(const name of ['receipts','children','execution'])fs.mkdirSync(path.join(out,name));
           assert.equal(sha(fs.readFileSync('project-store.js')),PIN.projectStoreSha256);assert.equal(sha(fs.readFileSync('operator-browser-driver.mjs')),PIN.driverSha256);
           const evidence=await import(pathToFileURL(path.join(source,'verification-evidence.mjs'))),fingerprint=evidence.evidenceFingerprint(source);
           for(const key of ['sourceCommit','sourceTree','sourceInputsSha256'])assert.equal(fingerprint[key],PIN[key]);assert.deepEqual(fingerprint.runtime,expectedRuntime);
           save(path.join(out,'lane-identity.json'),{lane,source:PIN,runtime:expectedRuntime,workflow,helperSha256,defaultHeap:true,sourceOwnedSupervisor:true,normalDefaultEntries:LANES[lane],diagnosticWorkflow:true,requiredOriginalCi:false});
           save(path.join(out,'source-fingerprint-before.json'),fingerprint);
           const {executeGate,suiteTimeoutMs}=await import(pathToFileURL(path.join(source,'verify-conformance-regressions.mjs')));
           const assertCurrent=()=>{assert.deepEqual(evidence.evidenceFingerprint(source),fingerprint);assert.equal(git('status','--porcelain'),'');};
           const checkExecution=(owner,actual,receipt,raw)=>{
            assert.equal(actual.outcome,'PASS');assert.equal(actual.exitCode,0);assert.equal(actual.timeoutMs,suiteTimeoutMs(owner));assert.equal(actual.timeoutMs,owner==='verify-executed-evidence.mjs'?3600000:1200000);
            for(const key of ['signal','reason','error','reportError'])assert.equal(actual[key],null,key);assert(actual.ownedProcessGroups.length>0);assert(actual.ownedProcessGroups.every(row=>row.active===false));
            assert.deepEqual(actual.command,[process.execPath,path.join(source,owner)],'Require exact default current-source entry');
            evidence.validateExecutionReceipt(receipt,owner,fingerprint);assert.equal(receipt.promotion,undefined);assert.deepEqual(receipt.command,actual.command);assert.deepEqual(receipt.reports,evidence.executionReports(actual.stdout));
            for(const stream of ['stdout','stderr']){assert.equal(raw[stream].toString(),actual[stream]);assert.equal(sha(raw[stream]),actual[stream+'Sha256']);assert.equal(actual[stream+'Sha256'],receipt[stream+'Sha256']);}
           };
           let seedCustody=null;
           const assertSeedsUnchanged=()=>{if(!seedCustody)return;assert.equal(sha(fs.readFileSync(path.join(seedCustody.directory,'seed-binding.json'))),seedCustody.bindingSha256);assertSeedFileInventory(seedCustody.directory,seedCustody.binding);for(const row of seedCustody.copiedReceipts)assert.equal(sha(fs.readFileSync(path.join(out,'receipts',row.owner+'.json'))),row.sha256,'Consumed prerequisite receipt bytes changed');};
           if(lane==='executed'){
            const seed=fs.realpathSync(seedArg);assert(seed!==source&&!seed.startsWith(source+path.sep)&&seed!==out&&!seed.startsWith(out+path.sep));
            const binding=read(path.join(seed,'seed-binding.json'));assertSeedBinding(binding,{workflow,helperSha256});
            assertSeedFileInventory(seed,binding);
            // Validate all three before copying any receipt. No stale/missing/partial or prior-attempt proof is promoted.
            for(const owner of LANES.A){const receipt=read(path.join(seed,owner+'.receipt.json')),actual=read(path.join(seed,owner+'.execution.json'));checkExecution(owner,actual,receipt,Object.fromEntries(['stdout','stderr'].map(stream=>[stream,fs.readFileSync(path.join(seed,owner+'.'+stream+'.log'))])));}
            for(const owner of LANES.A)fs.copyFileSync(path.join(seed,owner+'.receipt.json'),path.join(out,'receipts',owner+'.json'),fs.constants.COPYFILE_EXCL);
            seedCustody={directory:seed,bindingSha256:sha(fs.readFileSync(path.join(seed,'seed-binding.json'))),binding,copiedReceipts:LANES.A.map(owner=>({owner,sha256:sha(fs.readFileSync(path.join(seed,owner+'.receipt.json')))}))};assertSeedsUnchanged();
            save(path.join(out,'seed-authentication.json'),{outcome:'PASS',binding,bindingSha256:seedCustody.bindingSha256,copiedReceipts:seedCustody.copiedReceipts,receiptBytesCopiedUnchanged:true,promotion:false,allThreeValidatedBeforeCopy:true});assertCurrent();
           }
           const controller=new AbortController(),term=()=>controller.abort('SIGTERM'),int=()=>controller.abort('SIGINT');process.on('SIGTERM',term);process.on('SIGINT',int);
           const completed=[];
           try{
            for(const owner of LANES[lane]){
             assert(!controller.signal.aborted,'Interrupted before next owner');assertCurrent();const timeoutMs=suiteTimeoutMs(owner);assert.equal(timeoutMs,owner==='verify-executed-evidence.mjs'?3600000:1200000);
             save(path.join(out,owner+'.invocation.json'),{owner,command:[process.execPath,path.join(source,owner)],timeoutMs,defaultHeap:true,source:PIN,workflow,startedAt:new Date().toISOString()});
             const actual=await executeGate({name:owner,command:process.execPath,args:[path.join(source,owner)]},{directory:path.join(out,'execution'),cwd:source,timeoutMs,killGraceMs:5000,signal:controller.signal,requireJson:false});
             save(path.join(out,owner+'.execution.json'),actual);
             assert.equal(actual.outcome,'PASS',owner+' actual gate failed: '+(actual.error?.message||actual.reason||actual.signal||'exit '+actual.exitCode));assert.equal(actual.exitCode,0);
             const receiptFile=path.join(out,'receipts',owner+'.json'),receipt=read(receiptFile),raw=Object.fromEntries(['stdout','stderr'].map(stream=>[stream,fs.readFileSync(actual[stream+'Path'])]));checkExecution(owner,actual,receipt,raw);assertCurrent();assertSeedsUnchanged();
             const row={owner,outcome:'PASS',timeoutMs,elapsedMs:Date.parse(actual.finishedAt)-Date.parse(actual.startedAt),receiptSha256:receipt.receiptSha256,receiptFileSha256:sha(fs.readFileSync(receiptFile)),reportCount:receipt.reports.length,observations:receipt.observations.length,rawStdoutSha256:actual.stdoutSha256,rawStderrSha256:actual.stderrSha256,sourceClean:true,ownedGroupsInactive:true};completed.push(row);save(path.join(out,owner+'.validation.json'),row);console.log(JSON.stringify(row));
            }
            assert(!controller.signal.aborted,'Interrupted before lane completion');assertCurrent();assertSeedsUnchanged();
            if(seedCustody)save(path.join(out,'seed-consumption-validation.json'),{outcome:'PASS',bindingSha256:seedCustody.bindingSha256,copiedReceipts:seedCustody.copiedReceipts,originalArtifactBytesUnchanged:true,copiedReceiptBytesUnchanged:true});
            if(lane==='A'){
             const seed=path.join(out,'seeds');fs.mkdirSync(seed);
             for(const owner of LANES.A){fs.copyFileSync(path.join(out,'receipts',owner+'.json'),path.join(seed,owner+'.receipt.json'));fs.copyFileSync(path.join(out,owner+'.execution.json'),path.join(seed,owner+'.execution.json'));const actual=read(path.join(out,owner+'.execution.json'));for(const stream of ['stdout','stderr'])fs.copyFileSync(actual[stream+'Path'],path.join(seed,owner+'.'+stream+'.log'));}
             const binding={schema:'clrt-diagnostic-current-owner-seeds/1',source:PIN,runtime:expectedRuntime,workflow,helperSha256,owners:LANES.A,files:LANES.A.flatMap(seedFiles).map(name=>fileRecord(seed,name))};assertSeedBinding(binding,{workflow,helperSha256});save(path.join(seed,'seed-binding.json'),binding);
            }
            save(path.join(out,'lane-validation.json'),{outcome:'PASS',lane,source:PIN,workflow,completed,sourceClean:true,ownedGroupsInactive:true,requiredOriginalCi:false});
           }catch(error){save(path.join(out,'lane-failure.json'),{lane,source:PIN,workflow,completed,primary:{name:error.name,message:error.message,stack:error.stack}});throw error;}
           finally{process.removeListener('SIGTERM',term);process.removeListener('SIGINT',int);save(path.join(out,'source-fingerprint-after.json'),evidence.evidenceFingerprint(source));fs.writeFileSync(path.join(out,'source-status-after.txt'),git('status','--porcelain'));}
          }
          if(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url))await main();
          NORMAL_OWNER_HELPER
          echo "6fe72ed1af2548bd82181e3d36d1b0b4b12a2a23cea6789498928e37e0998679  $RUNNER_TEMP/normal-owner-lanes.mjs" | sha256sum --check
      - name: Run complete default owners with actual current receipts
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = '6070d6380ef99915ffc2d38bee354289f793f038'
          test -z "$(git status --porcelain)"
          test ! -e "$DIAG_OUT"
          export CLOSED_LOOP_VERIFICATION_SOURCE_ROOT="$PWD"
          export CLOSED_LOOP_VERIFICATION_RECEIPTS="$DIAG_OUT/receipts"
          export VERIFIER_CHILD_EVIDENCE_DIRECTORY="$DIAG_OUT/children"
          export NODE_OPTIONS="--import $(node -e 'process.stdout.write(require("node:url").pathToFileURL(require("node:path").resolve("verification-evidence-preload.mjs")).href)')"
          node "$RUNNER_TEMP/normal-owner-lanes.mjs" contract "$DIAG_OUT"
      - name: Preserve source state and helper bytes
        if: always()
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_OUT"
          cp "$RUNNER_TEMP/normal-owner-lanes.mjs" "$DIAG_OUT/normal-owner-lanes.mjs"
          git rev-parse HEAD > "$DIAG_OUT/source-commit-after.txt"
          git status --porcelain > "$DIAG_OUT/source-status-final.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
      - name: Retain raw normal-owner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env:
          NODE_OPTIONS: ''
        with:
          name: f9-normal-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAG_OUT }}
          if-no-files-found: error
          retention-days: 7
  authority-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NODE_OPTIONS: ''
