name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: tar --exclude=.git -czf /tmp/pr-source.tar.gz .
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do
            node --check "$file"
          done

      - name: Schema, ownership, and single-architecture proof
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          node verify-schema-hash-sections-53-70.mjs
          node verify-schema-type-closure.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs
          node verify-spec-grounded-route-oracle.mjs

      - name: Migration and v3 contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
          node verify-prompt-ingestion-boundaries.mjs
          node verify-semantic-review-contract.mjs
          node verify-semantic-review-ingestion.mjs
          node verify-stage6-package-ui.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-hash-cache.mjs

      - name: Deployment manifest and reproducible static build
        run: |
          set -euo pipefail
          for target in .deployment-proof-a .deployment-proof-b; do
            CLOSED_LOOP_REPRODUCIBILITY_STATUS=NOT_EVALUATED_IN_THIS_MANIFEST node build-static-site.mjs "$target"
            CLOSED_LOOP_VERIFY_PRODUCER_ENVIRONMENT=true node verify-deployment-manifest.mjs "$target/deployment-manifest.json"
          done
          diff -rq .deployment-proof-a .deployment-proof-b
          for target in .deployment-proof-a .deployment-proof-b; do
            CLOSED_LOOP_REPRODUCIBILITY_STATUS=CHECKED_BY_SECOND_CLEAN_MANIFEST_BUILD node build-static-site.mjs "$target"
            CLOSED_LOOP_VERIFY_PRODUCER_ENVIRONMENT=true node verify-deployment-manifest.mjs "$target/deployment-manifest.json"
          done
          diff -rq .deployment-proof-a .deployment-proof-b
          rm -rf _site
          mv .deployment-proof-a _site
          rm -rf .deployment-proof-b
          node verify-deployment-manifest-negative.mjs
          node verify-release-workflow.mjs

      - name: Raw-first ingestion and negative cases
        run: |
          set -euo pipefail
          node verify-ingestion.mjs

      - name: Workflow, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-complete.mjs
          terminal_report="$RUNNER_TEMP/full-cycle-terminal-evidence.json"
          test ! -e "$terminal_report"
          FULL_CYCLE_TERMINAL_REPORT_PATH="$terminal_report" node verify-full-cycle.mjs
          FULL_CYCLE_TERMINAL_REPORT_PATH="$terminal_report" node verify-controlling-completion.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs
          node verify-store-completion-amendment.mjs
          node verify-objective-attestation.mjs
          node verify-terminal-delivery-lifecycle.mjs

      - name: Prompt semantics and leakage
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-amendment-ui.mjs

      - name: Local Chromium operator path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          export CLOSED_LOOP_STATIC_ROOT="$PWD/_site"
          export PAGE_URL="http://127.0.0.1:4173/"
          python3 -m http.server 4173 --directory _site >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          run_browser_verifier verify-amendment-ui-browser.mjs
          run_browser_verifier verify-cached-deployment-profile.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Preserve the exact verified deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          CLOSED_LOOP_VERIFY_PRODUCER_ENVIRONMENT=true node verify-deployment-manifest.mjs _site/deployment-manifest.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf /tmp/closed-loop-verified-site.tar -C _site .
          (cd /tmp && sha256sum closed-loop-verified-site.tar > closed-loop-verified-site.tar.sha256)
      - name: Make exact verified site bytes independently retrievable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-loop-verified-site-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/closed-loop-verified-site.tar
            /tmp/closed-loop-verified-site.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Hand exact verified site bytes to Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    name: Deploy exact verified bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-live:
    name: Verify deployed bytes and operator path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Retrieve the exact verified site bytes produced by the test job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-loop-verified-site-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/closed-loop-verified-site
      - name: Reconstitute and verify the retained deployment artifact
        run: |
          set -euo pipefail
          (cd /tmp/closed-loop-verified-site && sha256sum -c closed-loop-verified-site.tar.sha256)
          mkdir _site
          tar -xf /tmp/closed-loop-verified-site/closed-loop-verified-site.tar -C _site
          node verify-deployment-manifest.mjs _site/deployment-manifest.json
      - name: Exact deployed-byte verification
        env:
          DEPLOYMENT_MANIFEST_PATH: _site/deployment-manifest.json
        run: node verify-live.mjs
      - name: Deployed Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          run_browser_verifier verify-amendment-ui-browser.mjs
          run_browser_verifier verify-deployed-resource-graph.mjs
          run_browser_verifier verify-cached-deployment-profile.mjs

  publish-status:
    name: Publish machine acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Retrieve the exact verified site bytes produced by the test job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-loop-verified-site-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/closed-loop-verified-site
      - name: Reconstitute the retained deployment artifact
        run: |
          set -euo pipefail
          (cd /tmp/closed-loop-verified-site && sha256sum -c closed-loop-verified-site.tar.sha256)
          mkdir _site
          tar -xf /tmp/closed-loop-verified-site/closed-loop-verified-site.tar -C _site
      - name: Build acceptance artifact from executed proof jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-v3-definition-of-done.mjs > /tmp/v3.json
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify-stage01-intake-closure.mjs > /tmp/stage01.out
          node verify-zero-loss-accounting.mjs > /tmp/zero-loss.out
          terminal_report=/tmp/full-cycle-terminal-evidence.json
          test ! -e "$terminal_report"
          FULL_CYCLE_TERMINAL_REPORT_PATH="$terminal_report" node verify-full-cycle.mjs > /tmp/full-cycle.json
          node verify-data-route-closure.mjs > /tmp/data-route.json
          node verify-infrastructure-route-closure.mjs > /tmp/infrastructure-route.json
          FULL_CYCLE_TERMINAL_REPORT_PATH="$terminal_report" node verify-controlling-completion.mjs > /tmp/controlling-completion.json
          cp "$terminal_report" full-cycle-terminal-evidence.json
          node verify-objective-attestation.mjs > /tmp/objective-attestation.json
          node verify-prompt-ingestion-boundaries.mjs > /tmp/prompt-ingestion-boundaries.json
          node verify-semantic-review-contract.mjs > /tmp/semantic-review-contract.json
          node verify-semantic-review-ingestion.mjs > /tmp/semantic-review-ingestion.json
          node verify-stage6-package-ui.mjs > /tmp/stage6-package-ui.json
          node verify-terminal-delivery-lifecycle.mjs > /tmp/terminal-delivery-lifecycle.json
          node verify-deployment-manifest-negative.mjs > /tmp/deployment-negative.json
          node verify-release-workflow.mjs > /tmp/release-workflow.json
          node verify-deployment-manifest.mjs _site/deployment-manifest.json > /tmp/deployment-manifest.json
          cp /tmp/deployment-manifest.json /tmp/static-build.json
          DEPLOYMENT_MANIFEST_PATH=_site/deployment-manifest.json node verify-live.mjs > /tmp/live.json
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          DEPLOYMENT_MANIFEST_PATH=_site/deployment-manifest.json node verify-deployed-resource-graph.mjs > /tmp/deployed-resource-graph.json
          DEPLOYMENT_MANIFEST_PATH=_site/deployment-manifest.json node verify-cached-deployment-profile.mjs > /tmp/cached-deployment-profile.json
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('/tmp/v3.json','utf8'));
          const stage01=JSON.parse(fs.readFileSync('/tmp/stage01.out','utf8'));
          const zeroLoss=JSON.parse(fs.readFileSync('/tmp/zero-loss.out','utf8'));
          const fullCycle=JSON.parse(fs.readFileSync('/tmp/full-cycle.json','utf8'));
          const fullCycleTerminalEvidence=JSON.parse(fs.readFileSync('/tmp/full-cycle-terminal-evidence.json','utf8'));
          const dataRoute=JSON.parse(fs.readFileSync('/tmp/data-route.json','utf8'));
          const infrastructureRoute=JSON.parse(fs.readFileSync('/tmp/infrastructure-route.json','utf8'));
          const controllingCompletion=JSON.parse(fs.readFileSync('/tmp/controlling-completion.json','utf8'));
          const objectiveAttestation=JSON.parse(fs.readFileSync('/tmp/objective-attestation.json','utf8'));
          const promptIngestionBoundaries=JSON.parse(fs.readFileSync('/tmp/prompt-ingestion-boundaries.json','utf8'));
          const semanticReviewContract=JSON.parse(fs.readFileSync('/tmp/semantic-review-contract.json','utf8'));
          const semanticReviewIngestion=JSON.parse(fs.readFileSync('/tmp/semantic-review-ingestion.json','utf8'));
          const stage6PackageUi=JSON.parse(fs.readFileSync('/tmp/stage6-package-ui.json','utf8'));
          const terminalDeliveryLifecycle=JSON.parse(fs.readFileSync('/tmp/terminal-delivery-lifecycle.json','utf8'));
          const deploymentNegative=JSON.parse(fs.readFileSync('/tmp/deployment-negative.json','utf8'));
          const releaseWorkflow=JSON.parse(fs.readFileSync('/tmp/release-workflow.json','utf8'));
          const staticBuild=JSON.parse(fs.readFileSync('/tmp/static-build.json','utf8'));
          const deploymentManifest=JSON.parse(fs.readFileSync('/tmp/deployment-manifest.json','utf8'));
          const live=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const deployedResourceGraph=JSON.parse(fs.readFileSync('/tmp/deployed-resource-graph.json','utf8'));
          const cachedDeploymentProfile=JSON.parse(fs.readFileSync('/tmp/cached-deployment-profile.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('_site/deployment-manifest.json','utf8'));
          const retainedVerifiedArtifactArchiveSha256=fs.readFileSync('/tmp/closed-loop-verified-site/closed-loop-verified-site.tar.sha256','utf8').trim().split(/\s+/)[0];
          if(!/^[a-f0-9]{64}$/.test(retainedVerifiedArtifactArchiveSha256))throw new Error('Retained verified site archive digest is malformed.');
          const ingestionText=fs.readFileSync('/tmp/ingestion.out','utf8');
          const stage01RawInputAccounting=Number(Boolean(stage01.stage01IntakeClosure&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01RequiredFileInspectionAccounting=Number(Boolean(stage01.artifactIdentityBound&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01AcceptedSemanticMappingCoverage=Number(Boolean(zeroLoss.zeroLossStage01&&zeroLoss.incompleteIntakeRejected));
          const stage04ObligationAccounting=Number(Boolean(zeroLoss.zeroLossStage04&&zeroLoss.completeStage03ResearchUnion&&zeroLoss.incompleteObligationRejected));
          const negativeMatches=[...ingestionText.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!negativeMatches.length)throw new Error('Ingestion proof did not publish totalNegativeCases.');
          if(dataRoute.dataRouteClosure!=='PASS')throw new Error('Canonical data-route closure proof did not pass.');
          if(infrastructureRoute.infrastructureRouteClosure!=='PASS')throw new Error('Infrastructure route-closure proof did not pass.');
          if(fullCycle.terminalEvidence?.reportSha256!==fullCycleTerminalEvidence.reportSha256)throw new Error('Full-cycle stdout and exact terminal evidence report are not bound to the same execution result.');
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            stageCount:30,
            ...definition,
            ...v3,
            ...controllingCompletion,
            controllingCompletion,
            fullCycleTerminalEvidence,
            focusedCompletionProofs:{objectiveAttestation,promptIngestionBoundaries,semanticReviewContract,semanticReviewIngestion,stage6PackageUi,terminalDeliveryLifecycle},
            deploymentManifestProof:deploymentManifest,
            deploymentManifestMutationProof:deploymentNegative,
            releaseWorkflowProof:releaseWorkflow,
            deployedResourceGraph,
            cachedDeploymentProfileProof:cachedDeploymentProfile,
            deploymentManifestSchema:manifest.schema,
            deploymentManifestDigest:manifest.overallManifestDigest,
            deploymentBuildIdentity:manifest.buildIdentity,
            deploymentBuildIdentityDerivation:manifest.buildIdentityDerivation,
            deploymentGeneratedResources:manifest.deterministicGeneratedResources,
            contentDerivedBuildIdentity:deploymentManifest.contentDerivedBuildIdentity,
            buildIdentityChangesWithRuntimeBytes:deploymentNegative.contentChangeChangesBuildIdentity,
            deploymentSourceCommit:manifest.sourceCommit,
            deploymentWorkflowRunIdentity:manifest.workflowRunIdentity,
            deploymentRuntimeResources:manifest.runtimeResources.map(resource=>({path:resource.path,mediaType:resource.mediaType,byteSize:resource.byteSize,hashAlgorithm:resource.hashAlgorithm,digest:resource.digest,buildIdentity:resource.buildIdentity})),
            deploymentRuntimeResourceIdentityCoverage:deploymentManifest.runtimeResourceIdentityCoverage,
            retainedVerifiedArtifactArchiveSha256,
            deploymentWorkerSha256:deployedResourceGraph.workerDigest,
            executedWorkerSha256:deployedResourceGraph.returnedWorkerDigest,
            deploymentWorkerProtocolVersion:deployedResourceGraph.workerProtocolVersion,
            cleanProfileCurrentBuild:deployedResourceGraph.cleanProfileCurrentBuild,
            previouslyCachedProfileCurrentBuild:deployedResourceGraph.previouslyCachedProfileCurrentBuild,
            cachedProfileCacheHitObserved:cachedDeploymentProfile.cacheHitObserved,
            priorBuildIdentityMismatchBlocked:cachedDeploymentProfile.priorBuildIdentityMismatchBlocked,
            priorBuildIdentityBlockVisible:cachedDeploymentProfile.priorBuildIdentityBlockVisible,
            postMismatchCurrentBuildRecovered:cachedDeploymentProfile.currentBuildRecovered,
            staleBuildExecuted:false,
            controllingServiceWorker:live.controllingServiceWorker,
            exactVerifiedArtifactDeployment:releaseWorkflow.exactVerifiedArtifactDeployment&&live.liveSourceIdentity&&deployedResourceGraph.deployedResourceGraph==='PASS'&&cachedDeploymentProfile.cachedDeploymentProfile==='PASS',
            sourceToBuildProvenance:releaseWorkflow.sourceToBuildProvenance&&deploymentManifest.exactArtifactProvenance,
            deploymentRebuildPermitted:false,
            secondCleanBuildReproducibility:staticBuild.reproducibilityStatus==='CHECKED_BY_SECOND_CLEAN_MANIFEST_BUILD'&&deploymentManifest.reproducibilityStatus==='CHECKED_BY_SECOND_CLEAN_MANIFEST_BUILD',
            immutableReleaseActionPins:releaseWorkflow.immutableActionPins,
            releaseNodeToolchainVersion:releaseWorkflow.nodeToolchainVersion,
            deploymentBuildEnvironment:manifest.buildEnvironmentIdentity,
            deploymentSupplyChainLimitations:manifest.buildEnvironmentIdentity.supplyChainLimitations,
            supplyChainEvidenceLevel:'APPLICATION_OBSERVED_WORKFLOW_PINS_AND_DEPLOYED_BYTE_MATCH; HOSTED_PLATFORM_COMPROMISE_NOT_RULED_OUT',
            dataRouteClosure:dataRoute.dataRouteClosure,
            infrastructureRouteClosure:infrastructureRoute.infrastructureRouteClosure,
            routeOperationsChecked:dataRoute.operationsChecked,
            routeCanonicalFamilies:dataRoute.canonicalFamilies,
            routeReadEdgesChecked:dataRoute.readEdgesChecked,
            routeWritableCollectionsChecked:dataRoute.writableCollectionsChecked,
            routeWritableFieldsChecked:dataRoute.writableFieldsChecked,
            routeRelationshipDefinitionsChecked:dataRoute.relationshipDefinitionsChecked,
            routeInvalidationStagesChecked:dataRoute.invalidationStagesChecked,
            routeCurrentScopeStaleExclusion:dataRoute.currentScopeStaleExclusion,
            routePromptReadSerialization:dataRoute.promptReadSerialization,
            routeResponseAuthorizationClosure:dataRoute.responseAuthorizationClosure,
            routeProvenanceContractClosure:dataRoute.provenanceContractClosure,
            routeDownstreamForwardingClosure:dataRoute.downstreamForwardingClosure,
            routeDownstreamOnlyInvalidation:dataRoute.downstreamOnlyInvalidation,
            routeSubjectNeutralPromptAuthority:dataRoute.subjectNeutralPromptAuthority,
            routeHumanExperiencePromptContract:dataRoute.humanExperiencePromptContract,
            infrastructureFamiliesChecked:infrastructureRoute.infrastructureFamilies,
            infrastructureRawFirstCapture:infrastructureRoute.rawFirstCapture,
            infrastructurePrecommitRevalidation:infrastructureRoute.precommitRevalidation,
            infrastructureExtractionManifestProvenance:infrastructureRoute.extractionManifestProvenance,
            infrastructurePromptContextManifestRoute:infrastructureRoute.promptContextManifestRoute,
            infrastructureAuthorityPartitionsSeparated:infrastructureRoute.authorityPartitionsSeparated,
            infrastructureCurrentScopeRoute:infrastructureRoute.currentScopeRoute,
            infrastructurePersistenceIntegrityRoute:infrastructureRoute.persistenceIntegrityRoute,
            infrastructureStructuredOperatorActionRoute:infrastructureRoute.structuredOperatorActionRoute,
            currentScopeSelectorCoverage:definition.currentScopeSelectorCoverage,
            exactReqRunTestCoverage:definition.exactReqRunTestCoverage,
            applicableCurrentRegressionSuccess:definition.applicableCurrentRegressionSuccess,
            mandatoryEvidenceChainStructuralCoverage:definition.mandatoryEvidenceChainCoverage,
            mandatoryEvidenceSufficiencyCoverage:v3.mandatoryEvidenceSufficiencyCoverage,
            releaseArtifactIdentityCoverage:definition.releaseArtifactIdentityCoverage,
            unauthorizedFieldMutationsAccepted:definition.unauthorizedFieldMutationsAccepted,
            canonicalMutationsBeforeAcceptance:definition.canonicalMutationsBeforeAcceptance,
            partialCommitsAfterInjectedFailure:definition.partialCommitsAfterInjectedFailure,
            staleProposalsAccepted:definition.staleProposalsAccepted,
            crossProjectRelationshipsAccepted:definition.crossProjectRelationshipsAccepted,
            historicalScopeSatisfyingCurrentGates:definition.historicalScopeSatisfyingCurrentGates,
            unmatchedDeliveryFilesAuthorized:definition.unmatchedDeliveryFilesAuthorized,
            appendOnlyHistoryRewritesAccepted:definition.appendOnlyHistoryRewritesAccepted,
            unsupportedTestIrTreatedAsExecutable:v3.unsupportedTestIrTreatedAsExecutable,
            externalAssertionsOverridingApplicationProof:v3.externalAssertionsOverridingApplicationProof,
            nativeExecutionReceiptsFabricatedExternally:v3.nativeExecutionReceiptsFabricatedExternally,
            releaseAcceptedWithContradiction:v3.releaseAcceptedWithContradiction,
            stage01RawInputAccounting,
            stage01RequiredFileInspectionAccounting,
            stage01AcceptedSemanticMappingCoverage,
            stage04ObligationAccounting,
            stagesCompleted:Number(fullCycle.stagesCompleted||0),
            negativeCasesPassed:Number(negativeMatches.at(-1)[1]),
            deployedByteIdentity:live.liveSourceIdentity===true,
            localChromiumAcceptance:process.env.TEST_RESULT==='success',
            deployedChromiumAcceptance:process.env.LIVE_RESULT==='success'&&deployedResourceGraph.deployedResourceGraph==='PASS'&&cachedDeploymentProfile.cachedDeploymentProfile==='PASS',
            testedBrowserWidths:[320,393,'desktop'],
            actualAndroidChromeAcceptance:false,
            realThirtyStageProjectAcceptance:false,
            fullProductionMaturity:false,
            jobResults:{test:process.env.TEST_RESULT,deploy:process.env.DEPLOY_RESULT,live:process.env.LIVE_RESULT},
            proofSources:{
              ownership:'verify.mjs',
              canonicalDataRoutes:'verify-data-route-closure.mjs',
              infrastructureRoutes:'verify-infrastructure-route-closure.mjs',
              migration:'verify-v3-migration.mjs',
              stage01:'verify-stage01-intake-closure.mjs',
              stage01Reuse:'verify-one-time-intent-intake.mjs',
              stage04:'verify-zero-loss-accounting.mjs',
              testIr:'verify-test-runtime-v3.mjs',
              limits:'verify-test-runtime-limits.mjs',
              ingestion:'verify-ingestion.mjs',
              workflow:'verify-complete.mjs',
              fullCycle:'verify-full-cycle.mjs',
              fullCycleTerminalEvidence:'full-cycle-terminal-evidence.mjs consumed by verify-controlling-completion.mjs',
              prompts:'verify-prompt-semantics.mjs',
              localBrowser:'verify-browser.mjs and verify-browser-extra.mjs',
              deployedIdentity:'verify-live.mjs',
              deployedBrowser:'verify-browser.mjs, verify-browser-extra.mjs, verify-amendment-ui-browser.mjs, verify-deployed-resource-graph.mjs, and verify-cached-deployment-profile.mjs',
              cachedDeploymentProfile:'verify-cached-deployment-profile.mjs',
              controllingCompletion:'verify-controlling-completion.mjs',
              objectiveAttestation:'verify-objective-attestation.mjs',
              promptIngestionBoundaries:'verify-prompt-ingestion-boundaries.mjs',
              semanticReviewContract:'verify-semantic-review-contract.mjs and verify-semantic-review-ingestion.mjs',
              stage6PackageUi:'verify-stage6-package-ui.mjs',
              terminalDeliveryLifecycle:'verify-terminal-delivery-lifecycle.mjs',
              deploymentManifest:'verify-deployment-manifest.mjs and verify-deployment-manifest-negative.mjs',
              releaseWorkflow:'verify-release-workflow.mjs'
            }
          };
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
          sha256sum closed-loop-acceptance.json > closed-loop-acceptance.json.sha256
      - name: Upload acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: |
            closed-loop-acceptance.json
            closed-loop-acceptance.json.sha256
            full-cycle-terminal-evidence.json
      - name: Create release tag only after deployed proof
        run: |
          set -euo pipefail
          TAG="acceptance-${GITHUB_SHA::12}"
          git config user.name closed-loop-release
          git config user.email closed-loop-release@users.noreply.github.com
          EXISTING="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
