function semanticLeaves(value,emit,path='value'){
  if(value===undefined||value===null)return;if(typeof value==='string'){const lines=value.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');for(const [index,line] of lines.entries())if(line.trim())emit(line,lines.length>1?`${path}#line=${index+1}`:path);return;}if(Array.isArray(value)){value.forEach((item,index)=>semanticLeaves(item,emit,`${path}[${index}]`));return;}if(typeof value==='object'){for(const key of Object.keys(value).sort())semanticLeaves(value[key],emit,`${path}.${key}`);return;}emit(String(value),path);
