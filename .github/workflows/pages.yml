name: Apply UI-safe prompt context limit repair
on:
  push:
    branches:
      - reliability/prompt-context-limit-ui-safe
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/prompt-context-limit-ui-safe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded repair
        run: python3 .repair-prompt-limit-ui.py
      - name: Restore production workflow and remove helper
        run: |
          git checkout 37d90a661d9e4c87571c0f7db2a6adec030f65bf -- .github/workflows/pages.yml
          rm .repair-prompt-limit-ui.py
      - name: Run deterministic and browser acceptance
        run: |
          node build-test-project.mjs
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-browser-extra.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-prompt-limit-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit permanent source and regression changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -z "$(git diff --name-only | grep -vE '^(prompt-engine.js|app-core.js|verify-prompt-semantics.mjs|verify-browser-extra.mjs|.github/workflows/pages.yml|.repair-prompt-limit-ui.py)$' || true)"
          git add -A
          git commit -m "Fail visibly and safely on oversized controlling prompts"
          git push origin HEAD:reliability/prompt-context-limit-ui-safe
# trigger