name: Apply verification-mode coverage repair
on:
  push:
    branches:
      - reliability/verification-mode-coverage-20260826
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/verification-mode-coverage-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded repairs
        run: |
          python3 .repair-schema.py
          python3 .repair-engine.py
          python3 .repair-fullcycle.py
      - name: Restore original workflow and remove helpers
        run: |
          git checkout 276fc3e2920ff91a81e1f49243a9894d64c79011 -- .github/workflows/pages.yml
          rm -f .repair-schema.py .repair-engine.py .repair-fullcycle.py
      - name: Run deterministic acceptance
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit source-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind verification stages to the canonical test plan"
          git push origin HEAD:reliability/verification-mode-coverage-20260826
