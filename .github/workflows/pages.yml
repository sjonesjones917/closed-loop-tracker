name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_ID: build-${{ github.sha }}
  MOBILE_ACCEPTANCE_TARGET_ID: iphone-safari-target-2026-08-23-v1
  MOBILE_ACCEPTANCE_CHALLENGE_ID: iphone-safari-challenge-2026-08-23-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          rm -rf .pr-source
          mkdir .pr-source
          tar --exclude=.git --exclude=.pr-source -cf - . | tar -C .pr-source -xf -
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.head.sha }}
          path: .pr-source
          if-no-files-found: error
          retention-days: 7
      - name: Syntax
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            node --check "$file"
          done
      - name: Deployment manifest, build identity, and reproducibility
        run: |
          set -euo pipefail
          node build-static-site.mjs --source . --output public --build-id "$BUILD_ID" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          node verify-deployment-manifest.mjs public "$GITHUB_SHA" "$BUILD_ID"
          node build-static-site.mjs --source . --output public-repro --build-id "$BUILD_ID" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          diff -qr public public-repro
      - name: Physical iPhone release-tag governance
        run: |
          set -euo pipefail
          node verify-mobile-release-governance.mjs
          node verify-mobile-acceptance-evidence.mjs --target "$MOBILE_ACCEPTANCE_TARGET_ID" --challenge "$MOBILE_ACCEPTANCE_CHALLENGE_ID"
      - name: Schema, ownership, and single-architecture proof
        run: |
          set -euo pipefail
          node verify.mjs
          node verify-stage-operation-registry.mjs
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs

      - name: Migration and v3 contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime-dag.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion and negative cases
        run: |
          set -euo pipefail
          node verify-ingestion.mjs

      - name: Workflow, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-spec-grounded-route-oracle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs
          node verify-retained-candidate.mjs
          node verify-mobile-stage-action.mjs

      - name: Prompt semantics and leakage
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-human-stage-walkthrough.mjs

      - name: Local Chromium operator path
        run: |
          set -euo pipefail
          npx --yes playwright@1.55.0 install --with-deps chromium
          node verify-browser.mjs
          node verify-browser-extra.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build exact verified static artifact
        run: |
          set -euo pipefail
          node build-static-site.mjs --source . --output public --build-id "$BUILD_ID" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          node verify-deployment-manifest.mjs public "$GITHUB_SHA" "$BUILD_ID"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@6de6a7b54538bb2c7b281d79f9d3f23e21aa5475

  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify deployed exact bytes and Chromium path
        run: |
          set -euo pipefail
          npx --yes playwright@1.55.0 install --with-deps chromium
          node verify-live.mjs "https://sjonesjones917.github.io/closed-loop-tracker/" "$GITHUB_SHA" "$BUILD_ID"

  publish-acceptance:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.live.result == 'success'
    needs: [test, live]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Re-run machine definition-of-done proof
        run: |
          set -euo pipefail
          node verify-definition-of-done.mjs > definition-of-done.json
          node verify-v3-definition-of-done.mjs > v3-definition-of-done.json
      - name: Write machine acceptance artifact
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('definition-of-done.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('v3-definition-of-done.json','utf8'));
          const report={
            schema:'closed-loop-machine-acceptance/1',
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            ...definition,
            ...v3,
            localChromiumAcceptance:process.env.TEST_RESULT==='success',
            deployedByteIdentity:process.env.LIVE_RESULT==='success',
            deployedChromiumAcceptance:process.env.LIVE_RESULT==='success',
            acceptanceEvidenceBasis:'Repository tests plus exact deployed-byte verification and deployed Chromium operator-path evidence.',
            generatedAt:new Date().toISOString()
          };
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
          if-no-files-found: error
          retention-days: 90
