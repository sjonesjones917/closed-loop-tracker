name: Diagnostic original mobile and recovery on frozen50

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-mobile-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mobile-capability-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIAG_OUT: ${{ github.workspace }}/mobile-capability-diagnostic
      BROWSER: /usr/bin/google-chrome
      NODE_OPTIONS: ''
    steps:
      - name: Check out the exact original tested application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Pin original source and Node runtime
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DIAG_OUT"
          mkdir "$DIAG_OUT"
          test "$(git rev-parse HEAD)" = 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          test "$(git rev-parse 'HEAD^{tree}')" = 24735288da9f734997c1920c111ad4d472e743e5
          test -z "$(git status --porcelain)"
          node --version | tee "$DIAG_OUT/node-version.txt"
          test "$(node --version)" = v22.23.3
          echo '8352b036eca02dfd86bb441df4ea3fe0ea54b9ad6bcaaee9a000219ddfae09c5  TEST_PROJECT.json' | sha256sum --check
          git rev-parse HEAD > "$DIAG_OUT/source-commit-before.txt"
          git rev-parse 'HEAD^{tree}' > "$DIAG_OUT/source-tree-before.txt"
          uname -a > "$DIAG_OUT/uname.txt"
      - name: Require the original installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          "$BROWSER" --product-version | tee "$DIAG_OUT/chrome-version.txt"
          test "$("$BROWSER" --product-version)" = 156.0.8078.79
      - name: Materialize external diagnostic supervision
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/frozen50-browser-baseline-runner.mjs" <<'EXTERNAL_0'
          // Diagnostic namespace; invokes the unchanged, normal browser collector CLI.
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import http from 'node:http';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {pathToFileURL} from 'node:url';
          const [suite, outArg] = process.argv.slice(2), out = path.resolve(outArg), source = process.cwd();
          assert(['verify-mobile-capability-journey.mjs', 'verify-browser-recovery.mjs'].includes(suite));
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'}).trim();
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const expected = '315f85b3dc34c274e4470fe4e84e9dcebc9a1551';
          assert.equal(git('rev-parse', 'HEAD'), expected);
          assert.equal(git('rev-parse', 'HEAD^{tree}'), '24735288da9f734997c1920c111ad4d472e743e5');
          assert.equal(git('status', '--porcelain'), '');
          assert.equal(process.version, 'v22.23.3'); assert.equal(process.platform, 'linux'); assert.equal(process.arch, 'x64');
          assert.equal(execFileSync(process.env.BROWSER, ['--product-version'], {encoding: 'utf8'}).trim(), '156.0.8078.79');
          assert.equal(process.env.NODE_OPTIONS, '--import ' + path.join(source, 'verification-evidence-preload.mjs'));
          assert.equal(process.env.CLOSED_LOOP_VERIFICATION_SOURCE_ROOT, source);
          assert.equal(process.env.CLOSED_LOOP_VERIFICATION_RECEIPTS, path.join(out, 'receipts'));
          assert.equal(process.env.VERIFIER_CHILD_EVIDENCE_DIRECTORY, path.join(out, 'children'));
          assert.equal(process.env.STATIC_SITE_ROOT, path.join(out, 'site'));
          assert.equal(process.env.MOBILE_EVIDENCE_DIR, path.join(out, 'mobile-capability-evidence'));
          assert.equal(process.env.RECOVERY_EVIDENCE_DIR, path.join(out, 'recovery-browser-evidence'));
          for (const key of ['OPERATOR_DRIVER_MODULE', 'BASELINE_COMMIT']) assert(!process.env[key], 'Unexpected diagnostic override: ' + key);
          const {executeGate} = await import(pathToFileURL(path.join(source, 'verify-conformance-regressions.mjs')));
          const {evidenceFingerprint} = await import(pathToFileURL(path.join(source, 'verification-evidence.mjs')));
          const {browserVerificationCatalog} = await import(pathToFileURL(path.join(source, 'verification-evidence-catalog.mjs')));
          assert.equal(browserVerificationCatalog[suite].timeoutMs, 600000);
          assert(fs.readFileSync('operator-browser-driver.mjs', 'utf8').includes('captureExecution=false,actionTimeoutMs=90000}={}'));
          const fingerprint = evidenceFingerprint(source);
          assert.equal(fingerprint.sourceCommit, expected);
          assert.equal(fingerprint.sourceInputsSha256, '7fdf2a3ea62b617960895cc939cb719cd172107f6d001c83b7e428a751d77c54');
          fs.writeFileSync(path.join(out, 'source-identity-before.json'), JSON.stringify(fingerprint, null, 2) + '\n');
          const site = path.join(out, 'site'), manifest = fs.readFileSync(path.join(site, 'closed-loop-deployment-manifest.json'));
          const requests = [], server = http.createServer((request, response) => {
            try {
              const pathname = decodeURIComponent(new URL(request.url, 'http://127.0.0.1').pathname);
              const file = path.resolve(site, '.' + (pathname === '/' ? '/index.html' : pathname));
              if (request.method !== 'GET' || !file.startsWith(site + path.sep) || !fs.statSync(file).isFile()) throw new Error('Unavailable path');
              const bytes = fs.readFileSync(file), type = file.endsWith('.html') ? 'text/html; charset=utf-8' : file.endsWith('.js') ? 'text/javascript; charset=utf-8' : file.endsWith('.css') ? 'text/css; charset=utf-8' : file.endsWith('.json') ? 'application/json' : 'application/octet-stream';
              requests.push({path: pathname, byteSize: bytes.length, sha256: sha(bytes)});
              response.writeHead(200, {'Content-Type': type, 'Content-Length': bytes.length, 'Cache-Control': 'no-store'}); response.end(bytes);
            } catch { response.writeHead(404); response.end(); }
          });
          const controller = new AbortController(), relay = signal => controller.abort(signal);
          process.on('SIGTERM', relay); process.on('SIGINT', relay);
          let execution = null;
          try {
            await new Promise((resolve, reject) => { server.once('error', reject); server.listen(4173, '127.0.0.1', resolve); });
            const response = await fetch('http://127.0.0.1:4173/closed-loop-deployment-manifest.json', {signal: AbortSignal.timeout(5000)});
            assert(response.ok); assert.deepEqual(Buffer.from(await response.arrayBuffer()), manifest);
            // Outer600s matches the normal workflow bound; collector's original catalog
            // child also remains600s and its unchanged driver action boundary is90s.
            execution = await executeGate({name: 'diagnostic-' + suite, command: process.execPath, args: ['collect-verification-evidence.mjs', '--browser-suite=' + suite, '--browser-scope=LOCAL']}, {cwd: source, directory: path.join(out, 'supervisor'), signal: controller.signal, timeoutMs: 600000, killGraceMs: 10000, maxOutputBytes: 64 * 1024 * 1024, forwardOutput: true, requireJson: false});
            fs.writeFileSync(path.join(out, 'normal-cli-result.json'), JSON.stringify({diagnosticOnly: true, requiredCiCheck: false, sourceCommit: expected, suite, actionTimeoutMs: 90000, catalogTimeoutMs: 600000, ...execution}, null, 2) + '\n');
            if (execution.exitCode !== 0 || execution.signal || execution.reason || execution.error) process.exitCode = 1;
          } finally {
            server.closeAllConnections(); await new Promise(resolve => server.close(resolve));
            process.removeListener('SIGTERM', relay); process.removeListener('SIGINT', relay);
            const after = evidenceFingerprint(source);
            fs.writeFileSync(path.join(out, 'source-identity-after.json'), JSON.stringify(after, null, 2) + '\n');
            fs.writeFileSync(path.join(out, 'http-resources.json'), JSON.stringify(requests, null, 2) + '\n');
            assert.equal(git('status', '--porcelain'), ''); assert.deepEqual(after, fingerprint);
            fs.writeFileSync(path.join(out, 'diagnostic-summary.json'), JSON.stringify({diagnosticOnly: true, requiredCiCheck: false, sourceUnchanged: true, nativeServerClosed: true, suite, result: execution?.outcome || null, originalActionAndCatalogBoundsRetained: true, limits: ['This is the normal original suite in a separate diagnostic workflow; it is not the original required CI job.', 'Synthetic Chromium mobile controls are not physical iPhone acceptance.']}, null, 2) + '\n');
          }
          EXTERNAL_0
          cp "$RUNNER_TEMP/frozen50-browser-baseline-runner.mjs" "$DIAG_OUT/"
      - name: Build exact original application bytes
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          node build-static-site.mjs --out "$DIAG_OUT/site" --source-commit 315f85b3dc34c274e4470fe4e84e9dcebc9a1551 --workflow-run "$GITHUB_RUN_ID" | tee "$DIAG_OUT/build.log"
          test -z "$(git status --porcelain)"
      - name: Execute unchanged normal browser collector with original bounds
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          export CLOSED_LOOP_VERIFICATION_SOURCE_ROOT="$PWD"
          export CLOSED_LOOP_VERIFICATION_RECEIPTS="$DIAG_OUT/receipts"
          export VERIFIER_CHILD_EVIDENCE_DIRECTORY="$DIAG_OUT/children"
          export NODE_OPTIONS="--import $PWD/verification-evidence-preload.mjs"
          export STATIC_SITE_ROOT="$DIAG_OUT/site"
          export PAGE_URL=http://127.0.0.1:4173/
          export CLOSED_LOOP_BROWSER_SCOPE=LOCAL
          export MOBILE_EVIDENCE_DIR="$DIAG_OUT/mobile-capability-evidence"
          export RECOVERY_EVIDENCE_DIR="$DIAG_OUT/recovery-browser-evidence"
          node "$RUNNER_TEMP/frozen50-browser-baseline-runner.mjs" verify-mobile-capability-journey.mjs "$DIAG_OUT"
      - name: Preserve exact source state
        if: always()
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$DIAG_OUT/source-commit-after.txt"
          git status --porcelain > "$DIAG_OUT/source-status-after.txt"
          test "$(git rev-parse HEAD)" = 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          test -z "$(git status --porcelain)"
      - name: Retain diagnostic evidence without changing required CI
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-only-mobile-capability-diagnostic-50f53978-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAG_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

