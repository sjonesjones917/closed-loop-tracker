name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs
      - name: Syntax
        run: node --check app.js && node --check app-core.js && node --check workflow-model.js && node --check workflow-engine.js && node --check project-store.js && node --check response-ingestion.js && node --check prompt-engine.js && node --check workbook.js && node --check verify.mjs && node --check verify-ingestion.mjs && node --check verify-live.mjs && node --check verify-browser.mjs
      - run: node verify-ingestion.mjs
      - run: node verify.mjs
      - name: Single application and responsible layers
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          for f in authority-guard.js prompt-display.js integrity-guard.js storage-reliability.js experience.js usability.js human-ui.js agent-workflow.js prompt-center.js; do test ! -f "$f"; done
          grep -q 'src="workbook.js' index.html
          grep -q 'src="app.js' index.html
          ! grep -Eqi 'GEN-042|field status report|maintenance[- ]handoff' index.html app.js app-core.js workflow-model.js workflow-engine.js project-store.js response-ingestion.js prompt-engine.js workbook.js TEST_PROJECT.json
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: browser-actions/setup-chrome@v1
      - run: PAGE_URL="$PAGE_URL" node verify-live.mjs
      - run: PAGE_URL="$PAGE_URL" node verify-browser.mjs
      - name: Render exact phone widths
        run: |
          BROWSER="$(command -v chrome || command -v google-chrome || command -v chromium)"
          for WIDTH in 320 393; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --window-size=${WIDTH},852 --virtual-time-budget=15000 --dump-dom "${PAGE_URL}?width=${WIDTH}-${GITHUB_SHA}" > "live-${WIDTH}.html"
            grep -q 'Mobile Closed-Loop Agent Reliability Workbook' "live-${WIDTH}.html"
            grep -q '1/30 complete' "live-${WIDTH}.html"
            grep -q 'STAGE 02' "live-${WIDTH}.html"
            ! grep -q 'Loading the workflow' "live-${WIDTH}.html"
          done
  publish-status:
    if: always() && github.event_name != 'pull_request'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: '${{ github.token }}', TEST_RESULT: '${{ needs.test.result }}', DEPLOY_RESULT: '${{ needs.deploy.result }}', LIVE_RESULT: '${{ needs.verify-live.result }}'}
        run: |
          state=failure; description="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then state=success; description='Source, transactional ingestion, 30-stage browser cycle, persistence, mobile render, and deployment verification passed'; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context='closed-loop-live-verification' -f description="$description"
