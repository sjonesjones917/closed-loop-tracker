          if(coreBrowserProof.browserVerified!==true||JSON.stringify(coreBrowserProof.widths)!==JSON.stringify([320,393,1280])||coreBrowserProof.liveStage1OperatorPath!==true||coreBrowserProof.stage1ReservationBound!==true||coreBrowserProof.stage1IntentConfirmed!==true||coreBrowserProof.all30StagesReachable!==true||coreBrowserProof.canonicalCommit!==true||coreBrowserProof.reloadPersistence!==true||coreBrowserProof.runtimeErrors!==0)throw new Error('Deployed core browser operator-path proof is incomplete.');
