name: One-time Stage 10 contract repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact repair and push branch
        run: |
          set -euo pipefail
          if [ ! -f .repair-stage10-contract.mjs ]; then
            echo 'Repair scaffold already consumed.'
            exit 0
          fi
          node .repair-stage10-contract.mjs
          node --check workflow-schema.js
          node --check verify-complete.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js verify-complete.mjs TEST_PROJECT.json
          if git diff --cached --quiet; then
            echo 'No target repair diff produced.'
            exit 1
          fi
          git commit -m 'Complete Stage 10 byte-hash contract repair'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
