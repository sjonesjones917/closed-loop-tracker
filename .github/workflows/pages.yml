          echo "b32f70a6b0621c863c3c7c94c0edb92a3e2a1345209110d5b6126df0d1c81a6b  $DIAG_OUT/original-retained-reference.json" | sha256sum --check
          cat > "$RUNNER_TEMP/restore-original-profile.py" <<'HELPER_0'
