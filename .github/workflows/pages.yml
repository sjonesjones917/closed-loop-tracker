name: Deploy application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime JavaScript parses before deployment
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            node --check "$file"
          done
      - name: Run deterministic acceptance verifiers
        run: |
          set -uo pipefail
          mapfile -t verifiers < <(find . -maxdepth 1 -type f -name 'verify-*.mjs' -printf '%f\n' | sort)
          if [ "${#verifiers[@]}" -eq 0 ]; then
            echo 'No deterministic verifier scripts found.' >&2
            exit 1
          fi
          failures=0
          for verifier in "${verifiers[@]}"; do
            case "$verifier" in
              *browser*.mjs|*chromium*.mjs|*deployed*.mjs|*live*.mjs)
                continue
                ;;
            esac
            echo "==> node $verifier"
            if ! node "$verifier"; then
              echo "FAILED: $verifier" >&2
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures deterministic verifier(s) failed." >&2
            exit 1
          fi
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static application
        run: |
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4
