name: Verify and deploy the single reliability app
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/job-scope-contracts-20260902
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact closed-state derivation repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const replace=(path,from,to)=>{
            let text=fs.readFileSync(path,'utf8');
            if(!text.includes(from))throw new Error(`Expected repair target missing in ${path}`);
            text=text.replace(from,to);
            fs.writeFileSync(path,text);
          };
          replace('workflow-engine.js',
            "const projectOpenBlockers=openBlockers(project);project.job.CURRENT_STATE=projectOpenBlockers.length?'BLOCKED':completed===30?'COMPLETE':current.status==='BLOCKED'?'BLOCKED':current.status==='IN PROGRESS'?'IN PROGRESS':'READY';\n  project.job.CURRENT_BLOCKERS=projectOpenBlockers.length?projectOpenBlockers.map(record=>recordId(record,'blockers')).join(', '):'NONE';\n  project.job.NEXT_REQUIRED_ACTION=completed===30?actionEnvelope(project,currentStage,{actionType:'COMPLETE',heading:'Workflow complete',explanation:'Preserve the completed workflow and exact release evidence.',primaryButton:null}):operationalNextAction(project,currentStage);\n  project.job.LATEST_EVIDENCE_REFERENCE=safe(project.projectData.acceptedChanges).at(-1)?.changeId||project.job.LATEST_EVIDENCE_REFERENCE||'NONE';\n  project.job.JOB_RECORD_STATUS=project.stages[1].status==='COMPLETE'?'READY':'NOT READY';",
            "const projectOpenBlockers=openBlockers(project);\n  const currentHumanInput=safe(project.projectData.responseDispositions).findLast?.(item=>Number(item.stage)===currentStage&&!item.invalidatedBy&&item.type==='HUMAN_INPUT_REQUIRED');\n  const currentPendingProposal=safe(project.projectData.responseProposals).findLast?.(item=>Number(item.stage)===currentStage&&!item.invalidatedBy&&item.status==='PENDING_OPERATOR_REVIEW');\n  const currentRawResponse=safe(project.projectData.rawResponses).findLast?.(item=>Number(item.stage)===currentStage&&!item.invalidatedBy&&item.status==='PRESERVED'&&!safe(project.projectData.responseProposals).some(proposal=>proposal.rawResponseId===item.rawResponseId&&!proposal.invalidatedBy));\n  const currentPrompt=safe(project.projectData.generatedPrompts).findLast?.(item=>Number(item.stage)===currentStage&&!item.invalidatedBy);\n  project.job.CURRENT_STATE=projectOpenBlockers.length?'BLOCKED':currentHumanInput?'AWAITING_HUMAN_INPUT':currentPendingProposal?'PROPOSAL_PENDING_REVIEW':currentRawResponse?'RESPONSE_STAGED':completed===30?'WORKFLOW_COMPLETE':currentPrompt?'AWAITING_EXTERNAL_RESPONSE':'READY_FOR_NEXT_OPERATION';\n  project.job.CURRENT_BLOCKERS={blockerIds:projectOpenBlockers.map(record=>recordId(record,'blockers'))};\n  project.job.NEXT_REQUIRED_ACTION=completed===30?actionEnvelope(project,currentStage,{actionType:'COMPLETE',heading:'Workflow complete',explanation:'Preserve the completed workflow and exact release evidence.',primaryButton:null}):operationalNextAction(project,currentStage);\n  project.job.LATEST_EVIDENCE_REFERENCE=safe(project.projectData.acceptedChanges).at(-1)?.changeId||project.job.LATEST_EVIDENCE_REFERENCE||null;\n  project.job.JOB_RECORD_STATUS=project.stages[1].status==='BLOCKED'?'BLOCKED':project.stages[1].status==='COMPLETE'?'COMPLETE':'INCOMPLETE';");
          replace('workflow-engine.js',
            "JOB_RECORD_STATUS:intake.complete&&acceptedChanges(project,1).length?'READY':'NOT READY'",
            "JOB_RECORD_STATUS:project.stages[1]?.status==='BLOCKED'?'BLOCKED':intake.complete&&acceptedChanges(project,1).length?'COMPLETE':'INCOMPLETE'");
          replace('workbook.js',"CURRENT_BLOCKERS:[],","CURRENT_BLOCKERS:{blockerIds:[]},");
          NODE
          node verify-section15-job-contract.mjs
          git diff --check
      - name: Restore canonical workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js workbook.js verify-section15-job-contract.mjs .github/workflows/pages.yml
          git commit -m "Correct closed Job-state derivations"
          git push origin HEAD:repair/job-scope-contracts-20260902
