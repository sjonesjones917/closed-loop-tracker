name: Test complete workflow and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check application core
        run: node --check app-core.js
      - name: Run full 31-stage real-job traversal
        run: node e2e-test.mjs
      - name: Build Pages artifact from tested files
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html app-core.js live.html README.md dist/
          if [ -f payload-manifest.json ]; then cp payload-manifest.json dist/; fi
          if [ -d release ]; then cp -R release dist/; fi
          printf '' > dist/.nojekyll
          cp index.html dist/404.html
      - uses: actions/configure-pages@v5
      - name: Upload exact tested application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy tested application
        id: deployment
        uses: actions/deploy-pages@v4
