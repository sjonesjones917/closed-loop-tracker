name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax checks
        run: |
          for f in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs test-fixtures.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$f"; done
      - name: Verify retained project and single application architecture
        run: node build-test-project.mjs
      - name: Verify schema, ownership, derivations, relationships, and prompt semantics
        run: node verify.mjs
      - name: Exercise response ingestion and negative cases
        run: node verify-ingestion.mjs
      - name: Verify deterministic gates and workflow invariants
        run: node verify-complete.mjs
      - name: Verify one continuous 30-stage lifecycle
        run: node verify-full-cycle.mjs
      - name: Enforce one application shell and responsible layers
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          for f in authority-guard.js integrity-guard.js storage-reliability.js prompt-display.js experience.js usability.js app.js; do test ! -f "$f"; done
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write\|MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "GEN-042|field status report|maintenance[- ]handoff|human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(m=>m[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set(); expected.forEach((file,i)=>{if(src[i]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);const token=new URLSearchParams(src[i].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} lacks build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          NODE
      - name: Exercise local Chromium workflow and IndexedDB persistence
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          export PAGE_URL=http://127.0.0.1:4173/
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Build acceptance report
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report={commit:process.env.GITHUB_SHA,workflow:'mobile-closed-loop/30',projectSchema:'closed-loop-project/2',responseSchema:'closed-loop-stage-response/2',ownershipCoverage:1,derivationCoverage:1,relationshipCoverage:1,stagesCompleted:30,negativeCasesPassed:true,storageFailureCasesPassed:true,artifactRoundTrip:true,localBrowserAcceptance:true,deployedByteIdentity:false};
          fs.writeFileSync('acceptance-report.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with: {name: closed-loop-acceptance-report, path: acceptance-report.json}

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Exercise deployed browser workflow and persistence
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Publish final acceptance report
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report={commit:process.env.GITHUB_SHA,workflow:'mobile-closed-loop/30',projectSchema:'closed-loop-project/2',responseSchema:'closed-loop-stage-response/2',ownershipCoverage:1,derivationCoverage:1,relationshipCoverage:1,stagesCompleted:30,negativeCasesPassed:true,storageFailureCasesPassed:true,artifactRoundTrip:true,deployedByteIdentity:true,deployedBrowserAcceptance:true};
          fs.writeFileSync('acceptance-report-live.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with: {name: closed-loop-live-acceptance-report, path: acceptance-report-live.json}

  publish-status:
    if: always() && github.event_name != 'pull_request'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then STATE=success; DESCRIPTION='30-stage source, browser, storage, deployed-byte, and live verification passed'; else STATE=failure; DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"; fi
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
