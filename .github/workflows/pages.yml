name: Install exact corrected Closed-Loop source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'bootstrap-source.part-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: closed-loop-source-bootstrap
  cancel-in-progress: false

jobs:
  install-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-source.part-* > /tmp/closed-loop-source.b64
          base64 --decode /tmp/closed-loop-source.b64 > /tmp/closed-loop-source.tar.gz
          printf '%s  %s\n' '8a521131a84d3f236a29a7efd9905048aa8caa7c03caa58f5d2fb0c462b49415' '/tmp/closed-loop-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/closed-loop-source.tar.gz -C .
          test -s .github/workflows/pages.yml
          test -s tests/e2e_self_build.py
          test -s source/core.template.js

      - name: Commit the exact restored source candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f bootstrap-source.part-*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install exact corrected Closed-Loop source candidate'
          git push origin HEAD:main
