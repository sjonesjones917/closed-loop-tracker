name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify retained project and single application architecture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          node --check workbook.js
          node --check hash.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check test-fixtures.mjs
          node --check verify-spec-v3.mjs
          node --check verify-intent-exhaustion.mjs
          node --check verify-hash.mjs
          node --check verify-test-runtime.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-semantic-invariant.mjs
          node --check verify-definition-of-done.mjs
          node --check verify-project-lifecycle.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
          node --check verify-live.mjs
      - name: Verify schema ownership migration and Stage 01/03/04 closure
        run: |
          node verify-spec-v3.mjs
          node verify-intent-exhaustion.mjs
      - name: Verify Test IR validation security and deterministic runtime
        run: node verify-test-runtime.mjs
      - name: Verify canonical serialization migration and runtime build identity
        run: node verify-hash.mjs
      - name: Verify canonical workflow persistence ownership and non-circularity
        run: node verify.mjs
      - name: Verify ingestion and all 30 stage contracts
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Prove one continuous 30-stage lifecycle
        run: node verify-full-cycle.mjs
      - name: Reject prompt semantic contradictions context leakage and operation leakage
        run: node verify-prompt-semantics.mjs
      - name: Prove semantic false-acceptance invariant
        run: node verify-semantic-invariant.mjs
      - name: Derive definition-of-done coverage metrics
        run: node verify-definition-of-done.mjs
      - name: Prove rigorous project lifecycle controls
        run: node verify-project-lifecycle.mjs
      - name: Enforce one shell one workflow and exact runtime graph
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -o -name '*.yaml' | wc -l)" -eq 1
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f experience.js
          test ! -f usability.js
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} lacks build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          const worker=fs.readFileSync('test-runtime.js','utf8').match(/test-worker\.js\?v=([A-Za-z0-9._-]+)/);
          if(!worker||!tokens.has(worker[1]))throw new Error('Worker does not share the runtime build/cache identity');
          if(!/\.expandable-prompt\s*\{[^}]*max-height\s*:\s*280px/i.test(html))throw new Error('Established 280px prompt preview was changed');
          if(/\.expandable-prompt[^}]*max-height\s*:\s*88px/i.test(html))throw new Error('Unauthorized 88px prompt preview override exists');
          NODE
      - name: Exercise local Chromium workflow persistence ingestion and responsive layout
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Re-run release-critical deterministic proofs
        run: |
          node build-test-project.mjs
          node verify-spec-v3.mjs
          node verify-intent-exhaustion.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Exercise deployed Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build machine acceptance report from executed proofs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-spec-v3.mjs > /tmp/verify-spec-v3.out
          node verify-intent-exhaustion.mjs > /tmp/verify-intent-exhaustion.out
          node verify-test-runtime.mjs > /tmp/verify-test-runtime.out
          node verify-ingestion.mjs > /tmp/verify-ingestion.out
          node verify.mjs > /tmp/verify-source.out
          node verify-complete.mjs > /tmp/verify-complete.out
          node verify-semantic-invariant.mjs > /tmp/verify-semantic-invariant.out
          node verify-definition-of-done.mjs > /tmp/verify-definition-of-done.out
          node verify-project-lifecycle.mjs > /tmp/verify-project-lifecycle.out
          grep -q '"stage1Exhausted":true' /tmp/verify-intent-exhaustion.out
          grep -q '"stage3Exhausted":true' /tmp/verify-intent-exhaustion.out
          grep -q '"stage4CarriesStage1AndStage3":true' /tmp/verify-intent-exhaustion.out
          grep -q '"userIntentNotRequestedAgain":true' /tmp/verify-intent-exhaustion.out
          grep -q 'verify-test-runtime: PASS' /tmp/verify-test-runtime.out
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-report-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          success=false
          for attempt in 1 2 3; do
            if node verify-browser-extra.mjs > /tmp/verify-browser-extra.out 2>&1; then success=true; break; fi
            cat /tmp/verify-browser-extra.out
            grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' /tmp/verify-browser-extra.out || exit 1
            test "$attempt" -lt 3 || exit 1
          done
          test "$success" = true
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          NEGATIVE_CASES=$(node - <<'NODE'
          const fs=require('fs'),text=fs.readFileSync('/tmp/verify-ingestion.out','utf8');
          const matches=[...text.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!matches.length)throw new Error('verify-ingestion did not publish totalNegativeCases');
          process.stdout.write(matches.at(-1)[1]);
          NODE
          )
          STORAGE_FAILURE_CASES=$(node - <<'NODE'
          const fs=require('fs');
          const proofs=[['/tmp/verify-source.out',/"transactionRollback"\s*:\s*true/],['/tmp/verify-complete.out',/"acceptedStateStorageRollback"\s*:\s*true/],['/tmp/verify-browser-extra.out',/"storageFailureRollback"\s*:\s*true/]];
          let count=0;for(const [path,re] of proofs){const text=fs.readFileSync(path,'utf8');if(!re.test(text))throw new Error(`Missing executed storage proof: ${path}`);count++;}process.stdout.write(String(count));
          NODE
          )
          export NEGATIVE_CASES STORAGE_FAILURE_CASES
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/verify-definition-of-done.out','utf8'));
          const spec=JSON.parse(fs.readFileSync('/tmp/verify-spec-v3.out','utf8').trim().split(/\r?\n/).filter(Boolean).at(-1));
          const intent=JSON.parse(fs.readFileSync('/tmp/verify-intent-exhaustion.out','utf8').trim().split(/\r?\n/).filter(Boolean).at(-1));
          const jsonLines=path=>fs.readFileSync(path,'utf8').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>JSON.parse(line));
          const semantic=Object.assign({},...jsonLines('/tmp/verify-semantic-invariant.out'));
          const lifecycle=Object.assign({},...jsonLines('/tmp/verify-project-lifecycle.out'));
          const browser=fs.readFileSync('/tmp/verify-browser-extra.out','utf8');
          const report={commit:process.env.GITHUB_SHA,workflow:'mobile-closed-loop/30',projectSchema:'closed-loop-project/3',responseSchema:'closed-loop-stage-response/3',testIrSchema:'closed-loop-test-spec/1',verificationPackageSchema:'closed-loop-verification-package/1',...definition,stage01IntakeCoverage:intent.stage1Exhausted?1:0,stage03ResearchExhausted:Boolean(intent.stage3Exhausted),stage04ObligationCoverage:intent.stage4CarriesStage1AndStage3?1:0,userIntentSingleSupply:Boolean(intent.userIntentNotRequestedAgain),nativeTestRuntime:true,nativeTestRuntimeVersion:'closed-loop-test-runtime/1',nativeTestSpecVersion:'closed-loop-test-spec/1',stagesCompleted:30,negativeCasesPassed:Number(process.env.NEGATIVE_CASES),storageFailureCasesPassed:Number(process.env.STORAGE_FAILURE_CASES),semanticFalseAcceptanceInvariant:Boolean(semantic.semanticFalseAcceptanceInvariant),projectLifecycleControls:Boolean(lifecycle.projectLifecycleControls),artifactRoundTrip:browser.includes('extra:package-round-trip'),blobPersistence:browser.includes('extra:blob-persistence'),deployedByteIdentity:process.env.LIVE_RESULT==='success',browserWidths:[320,393,'desktop'],liveVerification:process.env.LIVE_RESULT==='success'};
          if(spec.projectSchema!==report.projectSchema||spec.responseSchema!==report.responseSchema||spec.testIrSchema!==report.testIrSchema)throw new Error('Executed schema proof disagrees with acceptance identities');
          if(report.stage01IntakeCoverage!==1||!report.stage03ResearchExhausted||report.stage04ObligationCoverage!==1||!report.userIntentSingleSupply)throw new Error('Stage 01/03/04 closure proof is incomplete');
          if(!report.nativeTestRuntime||!report.deployedByteIdentity||!report.semanticFalseAcceptanceInvariant||!report.projectLifecycleControls||!report.artifactRoundTrip||!report.blobPersistence)throw new Error('Acceptance proof reduction is incomplete');
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
          if-no-files-found: error
      - name: Tag exact accepted commit
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="acceptance-${GITHUB_SHA:0:12}"
          EXISTING=$(curl --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" || true)
          EXISTING_SHA=$(printf '%s' "$EXISTING" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).object?.sha||'')}catch{}})")
          if [ -n "$EXISTING_SHA" ]; then test "$EXISTING_SHA" = "$GITHUB_SHA"; else curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" --data "{\"ref\":\"refs/tags/$TAG\",\"sha\":\"$GITHUB_SHA\"}"; fi
      - name: Publish exact workflow status
        env: {GH_TOKEN: '${{ github.token }}', TEST_RESULT: '${{ needs.test.result }}', DEPLOY_RESULT: '${{ needs.deploy.result }}', LIVE_RESULT: '${{ needs.verify-live.result }}'}
        run: |
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then STATE=success; DESCRIPTION='v3 deterministic semantic browser persistence and byte proofs passed'; else STATE=failure; DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"; fi
          test "$(printf '%s' "$DESCRIPTION" | wc -c)" -le 140
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
