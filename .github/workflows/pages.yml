name: Diagnostic Stage 30 checkpoint on frozen 50f53978

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-stage30-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkpoint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIAG_OUT: ${{ runner.temp }}/checkpoint-diagnostic
      BROWSER: /usr/bin/google-chrome
      NODE_OPTIONS: ''
    steps:
      - name: Check out the exact original tested application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 315f85b3dc34c274e4470fe4e84e9dcebc9a1551
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Record runtime and require the original installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DIAG_OUT"
          mkdir "$DIAG_OUT"
          node --version | tee "$DIAG_OUT/node-version.txt"
          "$BROWSER" --product-version | tee "$DIAG_OUT/chrome-version.txt"
          test "$(node --version)" = v22.23.3
          test "$("$BROWSER" --product-version)" = 156.0.8078.79
          uname -a > "$DIAG_OUT/uname.txt"
      - name: Download and authenticate the retained original artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/sjonesjones917/closed-loop-tracker/actions/artifacts/13580754986 > "$DIAG_OUT/original-artifact-metadata.json"
          python3 - <<'PYMETA'
          import json, os
          from pathlib import Path
          metadata=json.loads((Path(os.environ['DIAG_OUT'])/'original-artifact-metadata.json').read_text())
          assert metadata['id']==13580754986
          assert metadata['size_in_bytes']==611651635
          assert metadata['digest']=='sha256:b6a35d9e0eda405d69a240008c444a0502df96c1f2b17c42d696b44d3f295e56'
          assert metadata['expired'] is False
          assert metadata['workflow_run']['id']==42374851354
          assert metadata['workflow_run']['head_sha']=='50f539785914002b6bcdf398a71e4e29605d376c'
          PYMETA
          gh api repos/sjonesjones917/closed-loop-tracker/actions/artifacts/13580754986/zip > "$DIAG_OUT/original.zip"
      - name: Materialize external diagnostic helpers
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/restore.py" <<'RESTORE'
          #!/usr/bin/env python3
          """Restore only the authenticated synthetic native profile into a fresh copy.

          This diagnostic utility neither changes an original artifact nor creates test
          receipts. It is intended for the isolated Linux runner, not the active Mac run.
          """
          import argparse
          import hashlib
          import json
          import pathlib
          import stat
          import zipfile

          ARTIFACT_SHA256 = 'b6a35d9e0eda405d69a240008c444a0502df96c1f2b17c42d696b44d3f295e56'
          ARTIFACT_BYTES = 611651635
          PREFIX = 'home/runner/work/closed-loop-tracker/closed-loop-tracker/operator-evidence/profile/'
          PROFILE_FILES = 5402
          PROFILE_BYTES = 770745044
          CHROME_VERSION = '156.0.8078.79'


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def sha256_file(file):
              value = hashlib.sha256()
              with file.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(chunk)
              return value.hexdigest()


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--archive', type=pathlib.Path, required=True)
              parser.add_argument('--directory', type=pathlib.Path, required=True)
              args = parser.parse_args()
              archive = args.archive.resolve(strict=True)
              output = args.directory.resolve()
              require(archive.is_file(), 'Original archive is not a regular file')
              require(archive.stat().st_size == ARTIFACT_BYTES, 'Original archive size mismatch')
              require(sha256_file(archive) == ARTIFACT_SHA256, 'Original archive SHA-256 mismatch')
              require(not output.exists(), 'Diagnostic browser directory must be fresh')
              with zipfile.ZipFile(archive) as zipped:
                  members = [item for item in zipped.infolist() if item.filename.startswith(PREFIX)]
                  require(len(members) == PROFILE_FILES, 'Original profile member count mismatch')
                  require(sum(item.file_size for item in members) == PROFILE_BYTES, 'Original profile byte count mismatch')
                  seen = set()
                  selected = []
                  for item in members:
                      suffix = item.filename[len(PREFIX):]
                      relative = pathlib.PurePosixPath(suffix)
                      require(suffix and not relative.is_absolute(), 'Invalid profile path')
                      require(all(part not in ('', '.', '..') for part in suffix.split('/')), 'Noncanonical profile path')
                      require('\\' not in suffix and '\x00' not in suffix, 'Ambiguous profile path')
                      require(suffix not in seen, 'Duplicate original profile path')
                      require(not item.is_dir(), 'Unexpected explicit directory member')
                      mode = item.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFREG), 'Nonregular profile entry is not extracted')
                      seen.add(suffix)
                      selected.append((item, relative))
                  require(zipped.read(PREFIX + 'Last Version').decode().strip() == CHROME_VERSION,
                          'Original native Chrome profile version mismatch')
                  output.mkdir(parents=True, exist_ok=False)
                  profile = output / 'profile'
                  profile.mkdir()
                  records = []
                  for item, relative in selected:
                      destination = profile.joinpath(*relative.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      digest = hashlib.sha256()
                      size = 0
                      with zipped.open(item) as source, destination.open('xb') as target:
                          for chunk in iter(lambda: source.read(1024 * 1024), b''):
                              size += len(chunk)
                              require(size <= item.file_size, 'Archive member exceeds its declared size')
                              digest.update(chunk)
                              target.write(chunk)
                      require(size == item.file_size, 'Profile member byte count mismatch')
                      records.append({'path': relative.as_posix(), 'byteSize': size, 'sha256': digest.hexdigest()})
              require(sha256_file(archive) == ARTIFACT_SHA256, 'Original archive changed during restoration')
              provenance = {
                  'schema': 'clrt-checkpoint-diagnostic-native-profile-copy/1',
                  'purpose': 'Diagnostic replay only; not a complete journey or acceptance receipt',
                  'artifactId': 13580754986,
                  'originalRun': 42374851354,
                  'originalTestedCommit': '315f85b3dc34c274e4470fe4e84e9dcebc9a1551',
                  'originalHeadCommit': '50f539785914002b6bcdf398a71e4e29605d376c',
                  'archive': str(archive), 'archiveSha256': ARTIFACT_SHA256,
                  'archiveBytes': ARTIFACT_BYTES, 'originalArchiveUnchanged': True,
                  'profileDirectory': str(profile), 'profileFileCount': len(records),
                  'profileBytes': sum(record['byteSize'] for record in records),
                  'originalChromeVersion': CHROME_VERSION, 'files': records,
                  'applicationStateChangedByThisUtility': False,
                  'testReceiptCreated': False,
              }
              with (output / 'profile-copy-provenance.json').open('x') as target:
                  json.dump(provenance, target, indent=2)
                  target.write('\n')
              print(json.dumps({key: value for key, value in provenance.items() if key != 'files'}))


          if __name__ == '__main__':
              main()
          RESTORE
          cat > "$RUNNER_TEMP/replay.mjs" <<'REPLAY'
