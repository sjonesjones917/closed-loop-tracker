name: Verify and deploy the single reliability app
on:
  pull_request:
    branches: [main]
permissions: {contents: read}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact checked-out source for audit
        uses: actions/upload-artifact@v4
        with:
          name: exact-current-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
