          echo "f2a8920ab90551b1090bcc7a34b66df4a068100300a7218539859818a37f7abf  $RUNNER_TEMP/frozen50-mobile-startup-profile-restore.py" | sha256sum --check
          cp "$RUNNER_TEMP/frozen50-mobile-startup-profile-restore.py" "$DIAG_OUT/frozen50-mobile-startup-profile-restore.py"
          cat > "$RUNNER_TEMP/frozen50-mobile-startup-profile.mjs" <<'EXTERNAL_1'
