name: Test and deploy Closed-Loop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source syntax and state-machine gates
        shell: bash
        run: |
          set -euo pipefail
          node --check app-core.js
          node e2e-test.mjs

      - name: Install browser test driver
        shell: bash
        run: npm install --no-save playwright-core

      - name: Run real Chromium end-to-end workflow
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH=/usr/bin/google-chrome node run-v12-e2e.mjs

      - name: Build exact Pages artifact from tested v12
        shell: bash
        run: |
          set -euo pipefail
          test -s app-v12.html
          grep -q 'Closed-Loop Agent Reliability v12' app-v12.html
          grep -q 'every completion requires an actual pasted result' app-v12.html
          grep -q 'RUN-001' app-v12.html
          grep -q 'TARGET RUN OUTPUT TO VERIFY' app-v12.html
          grep -q 'crypto.subtle.digest' app-v12.html
          rm -rf dist
          mkdir -p dist
          cp app-v12.html dist/index.html
          cp app-v12.html dist/404.html
          : > dist/.nojekyll

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
