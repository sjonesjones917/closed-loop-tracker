name: Deploy Closed-Loop Agent Reliability

on:
  push:
    branches:
      - main
    paths-ignore:
      - LIVE_DEPLOYMENT_VERIFIED.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closed-loop-pages-deployment
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      app_sha256: ${{ steps.package.outputs.app_sha256 }}
      project_sha256: ${{ steps.package.outputs.project_sha256 }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
      - name: Use current Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize the retained application project to the complete application scope
        run: node migrate-self-project.mjs
      - name: Build the human-first application
        run: node build-app.mjs
      - name: Keep the retained application project in the normal Projects UI
        run: node attach-self-project.mjs
      - name: Verify application architecture
        run: node verify-app.mjs
      - name: Verify the retained application project against the current 31-stage workflow
        run: node verify-self-project.mjs
      - name: Install the browser driver
        run: npm install --no-save --ignore-scripts playwright-core
      - name: Execute rendered phone UI smoke test with retained project and human project ownership
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node browser-smoke.mjs
      - name: Build exact static Pages payload
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA256="$(sha256sum index.html | awk '{print $1}')"
          PROJECT_SHA256="$(sha256sum SELF_VERIFIED_PROJECT.json | awk '{print $1}')"
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp index.html dist/404.html
          cp SELF_VERIFIED_PROJECT.json dist/SELF_VERIFIED_PROJECT.json
          : > dist/.nojekyll
          printf '{"status":"VERIFIED_AND_READY_TO_DEPLOY","sourceCommit":"%s","publicName":"Closed-Loop Agent Reliability","publicVersionLabel":false,"stages":31,"stage1Scopes":20,"informationClasses":3,"humanWorkSupported":true,"agentWorkSupported":true,"humanAgentTeamSupported":true,"retainedApplicationProject":true,"retainedProjectNormalProject":true,"retainedProjectVisible":true,"promptRelayArchitecture":false,"appSha256":"%s","projectSha256":"%s"}\n' "$GITHUB_SHA" "$APP_SHA256" "$PROJECT_SHA256" > dist/deployment.json
          echo "app_sha256=$APP_SHA256" >> "$GITHUB_OUTPUT"
          echo "project_sha256=$PROJECT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Preserve exact verification and publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-verification-evidence
          path: |
            index.html
            STATIC_VERIFICATION.json
            BROWSER_SMOKE_REPORT.json
            PHONE_SMOKE_393.png
            PHONE_SMOKE_320.png
            SELF_VERIFIED_PROJECT.json
          if-no-files-found: error
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact verified source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact verified application and project
        uses: actions/download-artifact@v4
        with:
          name: closed-loop-verification-evidence
          path: verified-source
      - name: Deploy verified application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live application and retained project bytes
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_APP_SHA256: ${{ needs.verify.outputs.app_sha256 }}
          EXPECTED_PROJECT_SHA256: ${{ needs.verify.outputs.project_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p live-check
          verified=false
          for attempt in $(seq 1 36); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 2 --retry-delay 1 "${PAGE_URL}?verify=${nonce}" -o live-check/index.html \
              && curl -fsSL --retry 2 --retry-delay 1 "${PAGE_URL%/}/SELF_VERIFIED_PROJECT.json?verify=${nonce}" -o live-check/SELF_VERIFIED_PROJECT.json; then
              LIVE_APP_SHA256="$(sha256sum live-check/index.html | awk '{print $1}')"
              LIVE_PROJECT_SHA256="$(sha256sum live-check/SELF_VERIFIED_PROJECT.json | awk '{print $1}')"
              if [[ "$LIVE_APP_SHA256" == "$EXPECTED_APP_SHA256" && "$LIVE_PROJECT_SHA256" == "$EXPECTED_PROJECT_SHA256" ]]; then verified=true; break; fi
            fi
            sleep 5
          done
          test "$verified" = true
          cmp -s verified-source/index.html live-check/index.html
          cmp -s verified-source/SELF_VERIFIED_PROJECT.json live-check/SELF_VERIFIED_PROJECT.json
          grep -Fq '<title>Closed-Loop Agent Reliability</title>' live-check/index.html
          grep -Fq '<h1>Closed-Loop Agent Reliability</h1>' live-check/index.html
          grep -Fq 'data-self-project-proof="true"' live-check/index.html
          grep -Fq 'data-self-project-status' live-check/index.html
          grep -Fq 'SELF_VERIFIED_PROJECT.json' live-check/index.html
          node -e "const p=require('./live-check/SELF_VERIFIED_PROJECT.json'); if(p.schema!=='closed-loop-project/1'||!Array.isArray(p.stages)||p.stages.length!==31||p.stages.some((s,i)=>s.number!==i+1||s.status!=='COMPLETE')||p.stages[0]?.assignedActorType!=='HUMAN_AGENT_TEAM'||p.legacyProjectMetadata?.releaseDecision!=='ACCEPTED') process.exit(1)"
          if grep -Eqi 'Closed-Loop Agent Reliability[[:space:]]+v[0-9]+' live-check/index.html; then exit 1; fi
      - name: Materialize the live-verified application, project, and deployment receipt
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_APP_SHA256: ${{ needs.verify.outputs.app_sha256 }}
          EXPECTED_PROJECT_SHA256: ${{ needs.verify.outputs.project_sha256 }}
        run: |
          set -euo pipefail
          LIVE_APP_SHA256="$(sha256sum live-check/index.html | awk '{print $1}')"
          LIVE_PROJECT_SHA256="$(sha256sum live-check/SELF_VERIFIED_PROJECT.json | awk '{print $1}')"
          test "$LIVE_APP_SHA256" = "$EXPECTED_APP_SHA256"
          test "$LIVE_PROJECT_SHA256" = "$EXPECTED_PROJECT_SHA256"
          cmp -s verified-source/index.html live-check/index.html
          cmp -s verified-source/SELF_VERIFIED_PROJECT.json live-check/SELF_VERIFIED_PROJECT.json

          git pull --rebase origin main
          cp verified-source/index.html index.html
          cp verified-source/index.html app-v13.html
          cp verified-source/SELF_VERIFIED_PROJECT.json SELF_VERIFIED_PROJECT.json
          printf '{"status":"VERIFIED_LIVE","sourceCommit":"%s","pageUrl":"%s","publicName":"Closed-Loop Agent Reliability","publicVersionLabel":false,"stages":31,"stage1Scopes":20,"informationClasses":3,"humanWorkSupported":true,"agentWorkSupported":true,"humanAgentTeamSupported":true,"retainedApplicationProject":true,"retainedProjectNormalProject":true,"retainedProjectVisible":true,"promptRelayArchitecture":false,"repositoryMatchesLiveBytes":true,"appSha256":"%s","projectSha256":"%s","liveAppSha256":"%s","liveProjectSha256":"%s","verifiedAt":"%s"}\n' "$GITHUB_SHA" "$PAGE_URL" "$EXPECTED_APP_SHA256" "$EXPECTED_PROJECT_SHA256" "$LIVE_APP_SHA256" "$LIVE_PROJECT_SHA256" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > LIVE_DEPLOYMENT_VERIFIED.json

          test "$(sha256sum index.html | awk '{print $1}')" = "$LIVE_APP_SHA256"
          test "$(sha256sum app-v13.html | awk '{print $1}')" = "$LIVE_APP_SHA256"
          test "$(sha256sum SELF_VERIFIED_PROJECT.json | awk '{print $1}')" = "$LIVE_PROJECT_SHA256"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v13.html SELF_VERIFIED_PROJECT.json LIVE_DEPLOYMENT_VERIFIED.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified human-first application and retained project [skip ci]'
          git push origin HEAD:main
