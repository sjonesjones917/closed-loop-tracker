name: Test workflow state machine and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check application core
        run: node --check app-core.js
      - name: Run strict state-machine regression tests
        run: node e2e-test.mjs
      - name: Build standalone Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html app-core.js dist/
          printf '' > dist/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Upload tested application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy tested application
        id: deployment
        uses: actions/deploy-pages@v4
