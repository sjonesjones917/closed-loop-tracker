name: Deploy application

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup-current-branch:
    if: github.head_ref == 'fix/complete-closed-loop-spec-20260831' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 50
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply-reconcile.py .github/workflows/apply-reconcile.yml .github/workflows/apply-preflight.yml .github/apply-preflight.py
          git show 1fb354e024d217ed199ab70eb205f883239fbb90:.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github
          git commit -m "Remove completed one-time repair infrastructure"
          git push origin HEAD:${{ github.head_ref }}
