name: Verify and deploy the single reliability app
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconcile current capture-once implementation with proven /3 runtime
        shell: bash
        run: |
          git diff --binary 4acd4ad9795b053fed6952fbd8e95cda9912b08c 28aaaf10a630c45094f53a587b203848ef07ccea -- app-core.js build-test-project.mjs index.html prompt-engine.js response-ingestion.js verify-browser.mjs verify-complete.mjs verify-full-cycle.mjs verify-ingestion.mjs verify-one-time-intent-intake.mjs verify-prompt-semantics.mjs verify-test-runtime.mjs verify.mjs workbook.js workflow-engine.js workflow-schema.js > /tmp/capture-once.patch
          git apply --3way /tmp/capture-once.patch
      - name: Enforce exhaustive Stage 01 and Stage 03 before Stage 04 prompt generation
        shell: node {0}
        run: |
          const fs=require('fs');
          const must=(c,m)=>{if(!c)throw new Error(m)};
          const rep=(s,a,b,m)=>{must(s.includes(a),m);return s.replace(a,b)};
          let p=fs.readFileSync('prompt-engine.js','utf8');
          p=rep(p,'Stage 01 is complete human-authority intake for defining the Job and intentionally does not require every fact needed to execute later stages.','Stage 01 is complete and exhaustive human-authority intake for defining the requested outcome. Before DATA_PROPOSAL, exhaust every foreseeable project-relevant issue that must come from the human: it must already be supplied, be asked and answered, or be asked and explicitly answered UNKNOWN or DEFERRED. Never silently place an unasked human-only issue into UNKNOWN_INFORMATION. Facts obtainable from accessible supplied material or authorized research remain LATER_RESOLVABLE and must not be re-asked of the human.','Stage 01 contradictory prompt rule not found');
          p=rep(p,'Before DATA_PROPOSAL, account for every application-supplied intake identity and do not omit a controlled input unit.','Before DATA_PROPOSAL, account for every application-supplied intake identity; every controlled input unit must have exactly one allowed semantic disposition, every foreseeable human-only issue must have been given to the human if not already supplied, and zero controlled input identities may be omitted. If any condition is false, return HUMAN_INPUT_REQUIRED or BLOCKED instead of DATA_PROPOSAL.','Stage 01 accounting rule not found');
          p=rep(p,'Repeat discovery passes until saturation is actually supported: record the latest pass number, whether a new material category was found, and complete the required conflict/exception pass.','Repeat discovery passes until Stage 03 is exhausted: every current Stage 02 source has current research coverage unless Stage 02 validly established NO_APPLICABLE_EXTERNAL_SOURCE, the required conflict/exception pass is complete, and the latest complete pass found no new material category. Do not return DATA_PROPOSAL while any current source is uncovered, any required pass is incomplete, or saturation is not established.','Stage 03 exhaustion rule not found');
          p=rep(p,'Use the complete current canonical input union supplied by the application: current human input, accepted Stage 01 job definition and intake-accounting identities, project-material obligations already extracted into canonical intake/material records, and accepted Stage 03 research/source candidate obligations.','Use ONLY the complete application-enumerated current obligation universe, and use ALL of it: current User Job Input + the accepted exhaustive Stage 01 job definition + every current Stage 01 intake identity and human-origin obligation + every obligation extracted from accessible supplied project material + accepted exhaustive Stage 03 research + every current candidate external-source obligation + applicable current source identities and evidence. Stage 04 must not rediscover or ask the human to reconstruct this universe. If Stage 01 or Stage 03 is incomplete, or if the application obligation manifest is absent, stale, or incomplete, Stage 04 is BLOCKED and no DATA_PROPOSAL is permitted.','Stage 04 union rule not found');
          fs.writeFileSync('prompt-engine.js',p);
      - name: Focused proofs
        shell: bash
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node verify-controlling-spec.mjs
          node verify-one-time-intent-intake.mjs
          node verify-test-runtime.mjs
          node verify-prompt-semantics.mjs
      - name: Complete non-browser proof
        shell: bash
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit verified source only
        shell: bash
        run: |
          git config user.name closed-loop-spec-finalizer
          git config user.email actions@users.noreply.github.com
          git add -A -- ':!.github/workflows/*'
          git diff --cached --check
          git commit -m 'Reconcile exhaustive intent capture with /3 runtime' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
