name: Prove exact Stage 20 baseline boundary
on:
  pull_request: {branches: [main]}
permissions: {contents: write, statuses: write}
concurrency: {group: 'stage20-baseline-proof-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/baseline-exact-candidate-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only demonstrated Stage 20 correction
        run: |
          python3 apply-baseline-boundary.py
          rm -f apply-baseline-boundary.py .github/workflows/baseline-exact-proof.yml
          git diff --check
      - name: Verify retained project and syntax
        run: |
          node build-test-project.mjs
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check verify-hash.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
      - name: Run deterministic acceptance stack
        run: |
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Enforce architecture boundaries
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f authority-guard.js
          test ! -f integrity-guard.js
          test ! -f storage-reliability.js
          test ! -f prompt-display.js
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
          ! grep -R "document.write\|MutationObserver" --include='*.js' --include='*.html' .
      - name: Exercise real local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only passing permanent source and restore normal workflow
        run: |
          git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
          rm -f apply-baseline-boundary.py .github/workflows/baseline-exact-proof.yml
          test ! -f apply-baseline-boundary.py
          test ! -f .github/workflows/baseline-exact-proof.yml
          git diff --check
          git config user.name 'closed-loop-proof'
          git config user.email 'closed-loop-proof@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Bind Stage 20 baseline to exact confirmed candidate [stage20-proof-complete]'
          git push origin HEAD:reliability/baseline-exact-candidate-20260826
