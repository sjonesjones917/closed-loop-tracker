name: Deploy application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime JavaScript parses
        run: |
          set -euo pipefail
          for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
            node --check "$file"
          done
      - name: Start application for human-use browser verification
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/closed-loop-http.log 2>&1 &
          echo $! > /tmp/closed-loop-http.pid
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/closed-loop-http.log
          exit 1
      - name: Run controlling application acceptance before merge or deploy
        env:
          PAGE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          checks=(
            verify-v3-migration.mjs
            verify-v3-contract.mjs
            verify-test-runtime-v3.mjs
            verify-test-runtime-limits.mjs
            verify-full-cycle.mjs
            verify-complete.mjs
            verify-semantic-invariant.mjs
            verify-definition-of-done.mjs
            verify-v3-definition-of-done.mjs
            verify-prompt-semantics.mjs
            verify-stage-prompts-complete.mjs
            verify-one-time-intent-intake.mjs
            verify-human-stage-walkthrough.mjs
            verify-browser.mjs
            verify-browser-extra.mjs
            verify-mobile-stage-action.mjs
          )
          for check in "${checks[@]}"; do
            test -f "$check" || { echo "Missing required verification: $check" >&2; exit 1; }
            echo "===== $check ====="
            node "$check"
          done
      - name: Stop local application server
        if: always()
        run: |
          if [ -f /tmp/closed-loop-http.pid ]; then
            kill "$(cat /tmp/closed-loop-http.pid)" 2>/dev/null || true
          fi
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static application
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed source identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node verify-live.mjs
      - name: Exercise deployed app through Chrome
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          node verify-human-stage-walkthrough.mjs
          node verify-browser.mjs
          node verify-browser-extra.mjs
          node verify-mobile-stage-action.mjs
      - name: Publish final machine acceptance status
        run: |
          cat > final-acceptance.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "workflow": "mobile-closed-loop/30",
            "projectSchema": "closed-loop-project/3",
            "responseSchema": "closed-loop-stage-response/3",
            "testIrSchema": "closed-loop-test-spec/1",
            "verificationPackageSchema": "closed-loop-verification-package/1",
            "fieldOwnershipCoverage": 1,
            "applicationDerivationCoverage": 1,
            "typedRelationshipCoverage": 1,
            "stage01IntakeCoverage": 1,
            "stage04ObligationCoverage": 1,
            "acceptedAgentValueExtractionCoverage": 1,
            "acceptedRelationshipProvenanceCoverage": 1,
            "currentScopeSelectorCoverage": 1,
            "exactReqRunTestCoverage": 1,
            "applicableCurrentRegressionSuccess": 1,
            "mandatoryEvidenceChainStructuralCoverage": 1,
            "mandatoryEvidenceSufficiencyCoverage": 1,
            "releaseArtifactIdentityCoverage": 1,
            "nativeExecutionCoverage": 1,
            "unsupportedTestIrTreatedAsExecutable": 0,
            "externalAssertionsOverridingApplicationProof": 0,
            "nativeExecutionReceiptsFabricatedExternally": 0,
            "releaseAcceptedWithContradiction": 0,
            "deployedByteIdentity": true,
            "liveBrowserVerification": true,
            "androidChromeAcceptance": false,
            "fullProductionMaturity": false
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: final-acceptance-${{ github.sha }}
          path: final-acceptance.json
