name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mobile_acceptance_target_json:
        description: Pinned physical-iPhone acceptance target JSON for the exact currently deployed main commit
        required: false
        type: string
      mobile_acceptance_evidence_json:
        description: Physical-iPhone mobile-acceptance-evidence JSON bound to the submitted target
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply and commit the one-time legacy browser-fixture repair
        if: github.event_name == 'pull_request' && github.head_ref == 'repair/stage01-disposition-current-20260903'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node <<'NODE'
          const fs=require('fs');
          const file='verify-browser.mjs',source=fs.readFileSync(file,'utf8');
          const start='// Clean state: retained project is seeded exactly once and remains Stage 02 next.';
          const end='// Phone and desktop rendering checks.';
          const a=source.indexOf(start),b=source.indexOf(end,a);
          if(a<0||b<0||b<=a)throw new Error('Expected stale retained-project browser block was not found exactly once.');
          if(source.indexOf(start,a+1)>=0)throw new Error('Stale retained-project browser block is duplicated.');
          const replacement=String.raw`// Clean state: the shipped retained fixture is legacy historical evidence and must not be promoted into current /3 proof by migration.
 await waitExpr(cdp,\`document.querySelector('#project-picker')?.options.length>=1\`,20000);
 assert((await allProjects(cdp)).filter(p=>p.job?.JOB_ID==='JOB-20260823144121').length===1,'Retained project missing or duplicated in clean state.');
 let retained=await activeProject(cdp);assert(retained.job.JOB_ID==='JOB-20260823144121','Wrong retained JOB_ID.');assert(String(retained.job.EXACT_USER_OBJECTIVE_VERBATIM||'').trim().length>0,'Exact legacy user objective was not preserved as human authority.');
 const retainedLegacyBasis=await evalValue(cdp,\`(async()=>{const all=await globalThis.closedLoopProjectStore.readAll(),p=all.find(x=>x.job?.JOB_ID==='JOB-20260823144121');return {stage1Status:p?.stages?.['1']?.status||'',currentStage:p?.job?.CURRENT_STAGE||'',acceptedStage1:(p?.projectData?.acceptedChanges||[]).filter(x=>Number(x.stage)===1&&x.status==='COMMITTED'&&x.responseType==='DATA_PROPOSAL'&&!x.invalidatedBy).length,intakeComplete:globalThis.closedLoopWorkflowEngine.evaluateIntakeAccounting(p).complete};})()\`);
 assert(retainedLegacyBasis&&retainedLegacyBasis.acceptedStage1===0,'Legacy migration fabricated a current accepted Stage 01 DATA_PROPOSAL.');
 assert(retainedLegacyBasis.intakeComplete===false,'Legacy migration fabricated current Stage 01 semantic-accounting proof.');
 assert(!(retainedLegacyBasis.stage1Status==='COMPLETE'&&retainedLegacyBasis.currentStage==='STAGE 02'),'Legacy migration incorrectly made historical Stage 01 evidence current and gating.');
 await openStage(cdp,1);await click(cdp,'[data-view="Records"]');let recordText=(await snapshot(cdp)).text;for(const token of ['Original user-entered data','Migration archives'])assert(recordText.includes(token),\`Retained historical record surface missing \${token}.\`);
 // The remaining Stage 02+ browser checks require a genuinely current Stage 01 prerequisite. Build it through the current prompt, ingestion, commit, and human-confirmation path.
 const currentFixture=await evalValue(cdp,\`(async()=>{const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine,ingestion=globalThis.closedLoopResponseIngestion,store=globalThis.closedLoopProjectStore,schema=globalThis.closedLoopWorkflowSchema;const all=await store.readAll(),legacy=all.find(x=>x.job?.JOB_ID==='JOB-20260823144121');if(!legacy)throw new Error('Legacy retained fixture disappeared.');const p=core.createBlankState('JOB-20260823144121');p.isRetainedTestProject=true;p.retainedSpecRevision=legacy.retainedSpecRevision||legacy.specRevision||'legacy-retained-history';Object.assign(p.job,{JOB_TITLE:'Mobile Closed-Loop Agent Reliability Workbook',JOB_OWNER:'Browser acceptance operator',EXACT_USER_OBJECTIVE_VERBATIM:'Exercise the current closed-loop browser operator path without fabricating legacy semantic proof.',SUPPLIED_MATERIALS_INVENTORY:'NONE',REQUIRED_OUTPUT_FORMAT:'Controlled browser acceptance fixture.',DEADLINE_OR_TEMPORAL_SCOPE:null,DESIRED_SOURCE_COUNT:null,KNOWN_AUTHORITATIVE_SOURCES:null,AVAILABLE_TOOLS:'Current application and authorized browser verifier.',PROHIBITED_ACTIONS:'Do not promote legacy migration evidence into current semantic proof.',EXPLICIT_USER_REQUIREMENTS:'Use current Stage 01 ingestion and human confirmation before Stage 02.'});p.projectData.userEntered={objective:p.job.EXACT_USER_OBJECTIVE_VERBATIM,explicitRequirements:p.job.EXPLICIT_USER_REQUIREMENTS};p.projectData.migrationArchives=structuredClone(legacy.projectData?.migrationArchives||[]);engine.ensureShape(p);engine.recalculate(p);const pr=prompts.buildPromptRecord(1,p),manifest=pr.contextManifest.intakeCoverageManifest,capture={schema:'closed-loop-stage01-capture/1',inputVersion:manifest.inputVersion,manifestSha256:manifest.manifestSha256,units:manifest.units.map((unit,index)=>({sourceUnitId:unit.unitId,sourceRawValueSha256:unit.rawValueSha256,disposition:'RETAINED_AS_CONTEXT',reason:'Current browser acceptance fixture preserves this supplied human-authority unit for downstream reuse.',extractedStatements:[{statementKey:'BROWSER-STAGE1-'+String(index+1),text:unit.rawValueText||unit.label||unit.unitId,statementClass:'CONTEXT'}]}))},envelope={schema:schema.RESPONSE_SCHEMA,contractProfileId:schema.CONTRACT_PROFILE_ID,jobId:p.job.JOB_ID,stage:1,operation:pr.operation,promptIdentity:{instructionId:pr.instructionId,bodySha256:pr.bodySha256,contractSha256:pr.contractSha256,contextSignature:pr.contextSignature},scope:pr.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{EXACT_DELIVERABLE_REQUESTED:'Controlled browser acceptance fixture',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(capture)},records:{},evidence:[{temporaryKey:'browser-stage1-evidence',kind:'INTAKE',description:'Current browser Stage 01 acceptance fixture evidence',authorityType:'AGENT_CLAIM',location:'verify-browser.mjs',content:'Every current application-enumerated raw input unit is accounted for.'}],unresolved:[],warnings:[],attachments:[]};const prepared=ingestion.prepare(p,{stage:1,text:JSON.stringify(envelope),promptRecord:pr});if(!prepared.validation.valid)throw new Error('Current Stage 01 browser fixture response rejected: '+JSON.stringify(prepared.validation.issues));const committed=ingestion.commit(prepared.project,prepared.proposal.proposalId,{operator:'BROWSER_CURRENT_FIXTURE'}),q=committed.project;engine.recordStageConfirmation(q,1,true,'Current Stage 01 intent confirmed for browser acceptance.','BROWSER_CURRENT_FIXTURE',{acceptedChangeId:committed.acceptedChange.changeId,inputVersion:q.job.CURRENT_INPUT_VERSION,instructionId:committed.acceptedChange.promptId,contextSignature:committed.acceptedChange.contextSignature,operatorLabel:'BROWSER_CURRENT_FIXTURE'});engine.recalculate(q);const gate=engine.gate(1,q);if(!gate.complete||q.stages[1].status!=='COMPLETE'||q.job.CURRENT_STAGE!=='STAGE 02')throw new Error('Current browser fixture did not establish Stage 01: '+JSON.stringify({gate,status:q.stages[1].status,currentStage:q.job.CURRENT_STAGE}));await store.writeAll([...all.filter(x=>x.job?.JOB_ID!=='JOB-20260823144121'),q]);return {stage1:q.stages[1].status,currentStage:q.job.CURRENT_STAGE,intakeComplete:engine.evaluateIntakeAccounting(q).complete,acceptedStage1:(q.projectData.acceptedChanges||[]).filter(x=>Number(x.stage)===1&&x.status==='COMMITTED').length};})()\`);
 assert(currentFixture?.stage1==='COMPLETE'&&currentFixture?.currentStage==='STAGE 02'&&currentFixture?.intakeComplete===true&&currentFixture?.acceptedStage1===1,\`Current Stage 01 browser fixture is not valid: \${JSON.stringify(currentFixture)}\`);
 await evalValue(cdp,\`location.reload();true\`);await sleep(450);await waitExpr(cdp,\`globalThis.closedLoopAppReady===true\`,20000);retained=await activeProject(cdp);assert(retained.job.JOB_ID==='JOB-20260823144121'&&retained.stages['1'].status==='COMPLETE'&&retained.job.CURRENT_STAGE==='STAGE 02','Current Stage 01 browser prerequisite did not survive reload.');
 const retainedInputCapture=String(retained.stages['1']?.agentData?.INPUT_SET_CONTENTS||retained.stages['1']?.acceptedData?.INPUT_SET_CONTENTS||'');let parsedRetainedInputCapture;try{parsedRetainedInputCapture=JSON.parse(retainedInputCapture);}catch{parsedRetainedInputCapture=null;}assert(parsedRetainedInputCapture?.inputVersion===retained.job.CURRENT_INPUT_VERSION&&String(parsedRetainedInputCapture?.manifestSha256||'').length>0,'Current Stage 01 accepted input-set capture is not bound to its intake manifest.');
 const nativeIntakeProof=await evalValue(cdp,\`(()=>{const p=globalThis.closedLoopCore.createBlankState('JOB-BROWSER-INTAKE-PROOF');p.job.EXACT_USER_OBJECTIVE_VERBATIM='browser-intake-objective';p.job.EXPLICIT_USER_REQUIREMENTS='browser-intake-requirement';p.projectData.userEntered={objective:'browser-intake-objective',nested:{acceptance:'browser-intake-acceptance'}};globalThis.closedLoopWorkflowEngine.recalculate(p);const m=globalThis.closedLoopWorkflowEngine.intakeCoverageManifest(p);return {inputVersion:m?.inputVersion,unitCount:m?.unitCount||0,hasObjective:(m?.units||[]).some(u=>u.sourceLocation==='job.EXACT_USER_OBJECTIVE_VERBATIM'),hasNested:(m?.units||[]).some(u=>u.sourceLocation==='projectData.userEntered.nested.acceptance')};})()\`);assert(nativeIntakeProof&&nativeIntakeProof.unitCount>0&&nativeIntakeProof.hasObjective&&nativeIntakeProof.hasNested,'Application-owned Stage 01 intake manifest did not enumerate native current human-authority input.');assert((retained.projectData.sources||[]).length===0,'Stage 02 sources were fabricated on current fixture.');
 await openStage(cdp,1);assert((await snapshot(cdp)).text.includes('Stage 01 is preserved completed history'),'Current Stage 01 completed history is not inspectable.');
 await click(cdp,'[data-view="Records"]');recordText=(await snapshot(cdp)).text;for(const token of ['Original user-entered data','Generated instructions','Generated outputs','Output receipts','Migration archives'])assert(recordText.includes(token),\`Current Stage 01 record surface missing \${token}.\`);
 `;
          fs.writeFileSync(file,source.slice(0,a)+replacement+source.slice(b));
          NODE
          node --check verify-browser.mjs
          git checkout origin/main -- .github/workflows/pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser.mjs .github/workflows/pages.yml
          git commit -m "Fix browser proof to keep legacy evidence non-gating"
          git push origin HEAD:${{ github.head_ref }}

      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: tar --exclude=.git -czf /tmp/pr-source.tar.gz .
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do
            node --check "$file"
          done

      - name: Deployment manifest, build identity, and reproducibility
        run: |
          set -euo pipefail
          node verify-deployment-manifest.mjs

      - name: Physical iPhone release-tag governance
        run: |
          set -euo pipefail
          node verify-mobile-release-governance.mjs

      - name: Schema, ownership, and single-architecture proof
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs

      - name: Migration and v3 contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion and negative cases
        run: |
          set -euo pipefail
          node verify-ingestion.mjs

      - name: Workflow, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs

      - name: Prompt semantics and leakage
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs

      - name: Local Chromium operator path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    name: Deploy exact verified bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild retained fixture from verified source
        run: node build-test-project.mjs
      - name: Build static application
        run: |
          set -euo pipefail
          node build-static-site.mjs --out _site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-live:
    name: Verify deployed bytes and operator path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild retained fixture used by deployment
        run: node build-test-project.mjs
      - name: Exact deployed-byte verification
        run: node verify-live.mjs
      - name: Deployed Chromium operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs