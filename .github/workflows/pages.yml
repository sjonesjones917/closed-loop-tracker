name: Temporary completed-stage interaction repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/completed-stage-mode-20260830
          fetch-depth: 0
      - name: Correct completed-stage interaction state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js');s=p.read_text()
          needle="function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1),lockReason=stageLocked(n);if(accepted)"
          replacement="function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1),lockReason=stageLocked(n);if(String(current.stages[n]?.status||'').toUpperCase()==='COMPLETE'&&Number(n)<canonicalCurrentStage())return `<div class=\"notice success\"><strong>This stage is complete.</strong><br>No response is needed for this historical stage. Use the current next action shown above; do not reuse this stage's old prompt.</div>`;if(accepted)"
          if needle not in s: raise SystemExit('interaction mode insertion target not found')
          p.write_text(s.replace(needle,replacement,1))
          PY
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add app-core.js
          git commit -m 'Keep completed historical stages non-actionable'
          git pull --rebase origin repair/completed-stage-mode-20260830
          git push origin HEAD:repair/completed-stage-mode-20260830
