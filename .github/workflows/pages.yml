name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify retained project and single application architecture
        run: node build-test-project.mjs
      - name: Syntax checks
        run: |
          for f in app-core.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs verify-project-lifecycle.mjs verify-test-runtime.mjs verify-controlling-spec.mjs; do node --check "$f"; done
      - name: Verify controlling v3 specification invariants
        run: node verify-controlling-spec.mjs
      - name: Verify generic deterministic Test IR runtime
        run: node verify-test-runtime.mjs
      - name: Verify canonical serialization and SHA-256
        run: node verify-hash.mjs
      - name: Verify canonical workflow, persistence, ownership, and non-circularity
        run: node verify.mjs
      - name: Exercise all 30 stage prompt-response ingestion contracts and negative cases
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Prove one continuous 30-stage lifecycle
        run: node verify-full-cycle.mjs
      - name: Reject semantic prompt contradictions and operation leakage
        run: node verify-prompt-semantics.mjs
      - name: Prove semantic false-acceptance invariant
        run: node verify-semantic-invariant.mjs
      - name: Derive definition-of-done coverage metrics
        run: node verify-definition-of-done.mjs
      - name: Prove compact rigorous project lifecycle controls
        run: node verify-project-lifecycle.mjs
      - name: Enforce one application shell and runtime graph
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(x=>x[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} runtime scripts, got ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,i)=>{if(src[i]?.split('?')[0]!==file)throw new Error(`Wrong runtime order at ${file}`);const token=new URLSearchParams(src[i].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} has no build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Runtime build/cache identities differ');
          if(!/worker-src 'self'/.test(html))throw new Error('CSP does not permit the same-origin Test IR worker');
          NODE
      - name: Exercise local Chromium workflow, persistence, ingestion, and responsive layout
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser() { for attempt in 1 2 3; do if node "$1"; then return 0; fi; test "$attempt" -lt 3 || return 1; done; }
          run_browser verify-browser.mjs
          run_browser verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Re-run deterministic release proofs before deployment
        run: node build-test-project.mjs && node verify-controlling-spec.mjs && node verify-test-runtime.mjs && node verify-hash.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs && node verify-prompt-semantics.mjs && node verify-semantic-invariant.mjs && node verify-definition-of-done.mjs && node verify-project-lifecycle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Exercise deployed Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          for script in verify-browser.mjs verify-browser-extra.mjs; do success=false; for attempt in 1 2 3; do if node "$script"; then success=true; break; fi; done; test "$success" = true; done

  publish-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build machine acceptance report from executed proofs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-controlling-spec.mjs > /tmp/controlling.out
          node verify-test-runtime.mjs > /tmp/runtime.out
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify-definition-of-done.mjs > /tmp/dod.out
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/dod.out','utf8').trim().split(/\r?\n/).at(-1));
          const controlling=JSON.parse(fs.readFileSync('/tmp/controlling.out','utf8').trim().split(/\r?\n/).at(-1));
          const ingestion=fs.readFileSync('/tmp/ingestion.out','utf8');
          const n=[...ingestion.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)].at(-1)?.[1];
          const report={commit:process.env.GITHUB_SHA,workflow:'mobile-closed-loop/30',projectSchema:'closed-loop-project/3',responseSchema:'closed-loop-stage-response/3',testIrSchema:'closed-loop-test-spec/1',verificationPackageSchema:'closed-loop-verification-package/1',...definition,...controlling,negativeCasesPassed:Number(n||0),deployedByteIdentity:process.env.LIVE_RESULT==='success',browserWidths:[320,393,'desktop'],liveVerification:true};
          for(const key of ['fieldOwnershipCoverage','applicationDerivationCoverage','typedRelationshipCoverage','acceptedAgentValueExtractionCoverage','acceptedRelationshipProvenanceCoverage','currentScopeSelectorCoverage'])if(report[key]!==1)throw new Error(`${key} is not 100%`);
          if(!report.stage01Accounting||!report.stage04Accounting||!report.captureOncePromptInvariant||!report.subjectNeutralPrompts||!report.deployedByteIdentity)throw new Error('Controlling acceptance proof incomplete');
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with: {name: 'closed-loop-acceptance-${{ github.sha }}', path: closed-loop-acceptance.json}
      - name: Tag exact accepted commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          TAG="accepted-${GITHUB_SHA}"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin -f "$TAG"
