name: Verify and deploy the single reliability app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mobile_acceptance_target_json:
        description: Pinned physical-iPhone acceptance target JSON for the exact currently deployed main commit
        required: false
        type: string
      mobile_acceptance_evidence_json:
        description: Physical-iPhone mobile-acceptance-evidence JSON bound to the submitted target
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: '152.0.7977.82'

      - name: Capture exact PR source workspace
        if: github.event_name == 'pull_request'
        run: tar --exclude=.git -czf /tmp/pr-source.tar.gz .
      - name: Preserve exact PR source workspace
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do
            node --check "$file"
          done

      - name: Deployment manifest, build identity, and reproducibility
        run: |
          set -euo pipefail
          node verify-deployment-manifest.mjs

      - name: Physical iPhone release-tag governance
        run: |
          set -euo pipefail
          node verify-mobile-release-governance.mjs

      - name: Schema, ownership, and single-architecture proof
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(match=>match[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} direct deferred scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,index)=>{
            if(src[index]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);
            if(src.filter(value=>value.split('?')[0]===file).length!==1)throw new Error(`${file} is not unique`);
            const token=new URLSearchParams(src[index].split('?')[1]||'').get('v');
            if(!token)throw new Error(`${file} lacks build token`);
            tokens.add(token);
          });
          if(tokens.size!==1)throw new Error('Mixed runtime build tokens');
          if(!/worker-src\s+'self'/.test(html))throw new Error('CSP does not restrict the worker to same origin.');
          NODE

      - name: Complete 30-stage canonical data-route closure
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs

      - name: Migration and v3 contracts
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs

      - name: Stage 01 raw intake and semantic accounting
        run: |
          set -euo pipefail
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs

      - name: Stage 04 obligation accounting and prompt completeness
        run: |
          set -euo pipefail
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs

      - name: Test IR validation, security, and deterministic runtime
        run: |
          set -euo pipefail
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs

      - name: Raw-first ingestion and negative cases
        run: |
          set -euo pipefail
          node verify-ingestion.mjs

      - name: Workflow, gates, and full cycle
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs

      - name: Project lifecycle and application-owned controls
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs

      - name: Prompt semantics and leakage
        run: |
          set -euo pipefail
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs

      - name: Local Chromium operator path
        env:
          BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test -x "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    name: Deploy exact verified bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild retained fixture from verified source
        run: node build-test-project.mjs
      - name: Build static application
        run: |
          set -euo pipefail
          node build-static-site.mjs --out _site --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-live:
    name: Verify deployed bytes and operator path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: '152.0.7977.82'

      - name: Rebuild retained fixture used by deployment
        run: node build-test-project.mjs
      - name: Exact deployed-byte verification
        run: node verify-live.mjs
      - name: Deployed Chromium operator path
        env:
          BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test -x "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    name: Publish machine acceptance status
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify-live.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.test.result == 'success'))
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: '152.0.7977.82'

      - name: Reverify deployed Chromium for authenticated mobile acceptance
        if: github.event_name == 'workflow_dispatch'
        env:
          PAGE_URL: https://sjonesjones917.github.io/closed-loop-tracker/
          BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test -x "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/mobile-${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then
                return 1
              fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
      - name: Build acceptance artifact from executed proof jobs
        id: acceptance
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ github.event_name == 'workflow_dispatch' && 'success' || needs.deploy.result }}
          LIVE_RESULT: ${{ github.event_name == 'workflow_dispatch' && 'success' || needs.verify-live.result }}
          MOBILE_ACCEPTANCE_TARGET_JSON: ${{ inputs.mobile_acceptance_target_json || '' }}
          MOBILE_ACCEPTANCE_EVIDENCE_JSON: ${{ inputs.mobile_acceptance_evidence_json || '' }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-v3-definition-of-done.mjs > /tmp/v3.json
          node verify-ingestion.mjs > /tmp/ingestion.out
          node verify-stage01-intake-closure.mjs > /tmp/stage01.out
          node verify-zero-loss-accounting.mjs > /tmp/zero-loss.out
          node verify-full-cycle.mjs > /tmp/full-cycle.json
          node verify-data-route-closure.mjs > /tmp/data-route.json
          node verify-infrastructure-route-closure.mjs > /tmp/infrastructure-route.json
          node verify-mobile-release-governance.mjs > /tmp/mobile-governance.json
          USED_MOBILE_CHALLENGES_JSON="$(git ls-remote --tags origin 'refs/tags/mobile-acceptance-challenge-*' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=s.split(/\n/).filter(Boolean).map(l=>l.trim().split(/\s+/)[1]||'').map(r=>r.replace('refs/tags/mobile-acceptance-challenge-','').replace(/\^\{\}$/,'')).filter(Boolean);process.stdout.write(JSON.stringify([...new Set(a)]));});")"
          export USED_MOBILE_CHALLENGES_JSON
          node evaluate-mobile-acceptance-submission.mjs > /tmp/mobile-acceptance.json
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('/tmp/v3.json','utf8'));
          const stage01=JSON.parse(fs.readFileSync('/tmp/stage01.out','utf8'));
          const zeroLoss=JSON.parse(fs.readFileSync('/tmp/zero-loss.out','utf8'));
          const fullCycle=JSON.parse(fs.readFileSync('/tmp/full-cycle.json','utf8'));
          const dataRoute=JSON.parse(fs.readFileSync('/tmp/data-route.json','utf8'));
          const infrastructureRoute=JSON.parse(fs.readFileSync('/tmp/infrastructure-route.json','utf8'));
          const mobileGovernance=JSON.parse(fs.readFileSync('/tmp/mobile-governance.json','utf8'));
          const mobileAcceptance=JSON.parse(fs.readFileSync('/tmp/mobile-acceptance.json','utf8'));
          const ingestionText=fs.readFileSync('/tmp/ingestion.out','utf8');
          const stage01RawInputAccounting=Number(Boolean(stage01.stage01IntakeClosure&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01RequiredFileInspectionAccounting=Number(Boolean(stage01.artifactIdentityBound&&stage01.currentManifestBound&&stage01.incompleteAccountingRejected));
          const stage01AcceptedSemanticMappingCoverage=Number(Boolean(zeroLoss.zeroLossStage01&&zeroLoss.incompleteIntakeRejected));
          const stage04ObligationAccounting=Number(Boolean(zeroLoss.zeroLossStage04&&zeroLoss.completeStage03ResearchUnion&&zeroLoss.incompleteObligationRejected));
          const negativeMatches=[...ingestionText.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)];
          if(!negativeMatches.length) throw new Error('Unable to derive negative-case count from ingestion verification.');
          const negativeCasesPassed=Math.max(...negativeMatches.map(match=>Number(match[1])));
          const completedStages=Number(fullCycle.verifiedStages||0);
          if(completedStages!==30) throw new Error(`Full-cycle verification covered ${completedStages}/30 stages.`);
          const storageFailureCasesPassed=Number(definition.storageFailureCasesPassed||0);
          const artifactRoundTrip=Boolean(definition.artifactRoundTrip);
          const deployedByteIdentity=process.env.LIVE_RESULT==='success';
          if(!deployedByteIdentity) throw new Error('Live deployed-byte proof did not succeed.');
          if(dataRoute.dataRouteClosure!=='PASS') throw new Error('Canonical data-route closure did not pass.');
          if(infrastructureRoute.infrastructureRouteClosure!=='PASS') throw new Error('Infrastructure data-route closure did not pass.');
          if(mobileGovernance.mobileReleaseGovernance!=='PASS') throw new Error('Physical iPhone release-tag governance did not pass.');
          const actualIPhoneSafariAcceptance=Number(Boolean(mobileAcceptance.accepted&&mobileAcceptance.physicalDeviceObservationAccepted));
          if(!actualIPhoneSafariAcceptance) throw new Error(`Actual-iPhone acceptance is not current: ${(mobileAcceptance.reasons||[]).join('; ')}`);
          const metrics={
            ownershipCoverage:definition.ownershipCoverage,
            derivationCoverage:definition.derivationCoverage,
            relationshipCoverage:definition.relationshipCoverage,
            stage01RawInputAccounting,
            stage01RequiredFileInspectionAccounting,
            stage01AcceptedSemanticMappingCoverage,
            stage04ObligationAccounting,
            agentExtractionCoverage:definition.agentExtractionCoverage,
            relationshipProvenanceCoverage:definition.relationshipProvenanceCoverage,
            scopeSelectorCoverage:definition.scopeSelectorCoverage,
            reqRunTestCoverage:definition.reqRunTestCoverage,
            regressionSuccess:definition.regressionSuccess,
            mandatoryEvidenceChainStructuralCoverage:definition.mandatoryEvidenceChainStructuralCoverage,
            mandatoryEvidenceSufficiencyCoverage:v3.mandatoryEvidenceSufficiencyCoverage,
            releaseArtifactIdentityCoverage:definition.releaseArtifactIdentityCoverage,
            contractProfileMigrationCoverage:v3.contractProfileMigrationCoverage,
            fieldRegistryCoverage:v3.fieldRegistryCoverage,
            stageOperationRegistryCoverage:v3.stageOperationRegistryCoverage,
            stageOperationScopeMatrixCoverage:v3.stageOperationScopeMatrixCoverage,
            durableObjectRegistryCoverage:v3.durableObjectRegistryCoverage,
            fileFirstPromptByteIdentityCoverage:v3.fileFirstPromptByteIdentityCoverage,
            fileFirstResponseByteCaptureCoverage:v3.fileFirstResponseByteCaptureCoverage,
            attachmentSlotMappingCoverage:v3.attachmentSlotMappingCoverage,
            semanticReviewIndependenceCoverage:v3.semanticReviewIndependenceCoverage,
            dueStageObligationCoverage:v3.dueStageObligationCoverage,
            activationProofCoverage:v3.activationProofCoverage,
            testIrDagRegistryCoverage:v3.testIrDagAndRegistryIdentityCoverage,
            closedMetricUniverseCoverage:v3.closedMetricUniverseCoverage,
            deliveryCandidateIdentityCoverage:v3.deliveryCandidateIdentityCoverage,
            terminalCommandPrerequisiteCoverage:v3.terminalCommandPrerequisiteCoverage,
            preDeliveryCheckpointCoverage:v3.preDeliveryCheckpointCoverage,
            destinationBoundAuthorizationCoverage:v3.destinationBoundAuthorizationCoverage,
            actualIphoneSafariAcceptanceCoverage:actualIPhoneSafariAcceptance,
            canonicalDeploymentOriginCoverage:v3.canonicalDeploymentOriginCoverage,
            normativeRequirementTraceCoverage:v3.normativeRequirementTraceCoverage
          };
          const nonFull=Object.entries(metrics).filter(([,value])=>value!==1);
          if(nonFull.length) throw new Error(`Acceptance coverage is incomplete: ${nonFull.map(([key,value])=>`${key}=${value}`).join(', ')}`);
          const zeroMetrics={
            unauthorizedFieldMutationsAccepted:definition.unauthorizedFieldMutationsAccepted,
            canonicalMutationsBeforeAcceptance:definition.canonicalMutationsBeforeAcceptance,
            partialCommitsAfterInjectedFailure:definition.partialCommitsAfterInjectedFailure,
            staleProposalsAccepted:definition.staleProposalsAccepted,
            crossProjectRelationshipsAccepted:definition.crossProjectRelationshipsAccepted,
            historicalScopeSatisfyingCurrentGates:definition.historicalScopeSatisfyingCurrentGates,
            unmatchedDeliveryFilesAuthorized:definition.unmatchedDeliveryFilesAuthorized,
            appendOnlyHistoryRewritesAccepted:definition.appendOnlyHistoryRewritesAccepted,
            unsupportedTestIrTreatedAsExecutable:v3.unsupportedTestIrTreatedAsExecutable,
            externalAssertionsOverridingApplicationProof:v3.externalAssertionsOverridingApplicationProof,
            nativeExecutionReceiptsFabricatedExternally:v3.nativeExecutionReceiptsFabricatedExternally,
            releaseAcceptedWithContradiction:v3.releaseAcceptedWithContradiction,
            ...v3.section49ZeroCountMetrics
          };
          const nonZero=Object.entries(zeroMetrics).filter(([,value])=>value!==0);
          if(nonZero.length) throw new Error(`Acceptance zero-count invariants failed: ${nonZero.map(([key,value])=>`${key}=${value}`).join(', ')}`);
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            contractProfile:'closed-loop-completion-profile/1',
            ...metrics,
            nativeExecutionCoverage:v3.nativeExecutionCoverage,
            completedStages,
            negativeCasesPassed,
            storageFailureCasesPassed,
            artifactRoundTrip,
            deployedByteIdentity,
            dataRouteClosure:dataRoute.dataRouteClosure,
            infrastructureRouteClosure:infrastructureRoute.infrastructureRouteClosure,
            physicalIphoneRequiredForTag:mobileGovernance.actualIPhoneRequiredForTag,
            physicalIphoneAcceptance:mobileAcceptance
          };
          fs.writeFileSync('verification/closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
          test -s verification/closed-loop-acceptance.json
          test "$(node -p "JSON.parse(require('fs').readFileSync('verification/closed-loop-acceptance.json','utf8')).commit")" = "$GITHUB_SHA"
      - name: Publish machine acceptance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: verification/closed-loop-acceptance.json
          if-no-files-found: error
      - name: Create release tag only after physical-iPhone acceptance
        if: github.event_name == 'workflow_dispatch'
        env:
          MOBILE_ACCEPTANCE_TARGET_JSON: ${{ inputs.mobile_acceptance_target_json || '' }}
          MOBILE_ACCEPTANCE_EVIDENCE_JSON: ${{ inputs.mobile_acceptance_evidence_json || '' }}
        run: |
          set -euo pipefail
          ACCEPTED="$(node -p "JSON.parse(require('fs').readFileSync('verification/closed-loop-acceptance.json','utf8')).physicalIphoneAcceptance.accepted")"
          test "$ACCEPTED" = true
          CHALLENGE="$(node -p "JSON.parse(process.env.MOBILE_ACCEPTANCE_EVIDENCE_JSON||'{}').challenge||''")"
          test -n "$CHALLENGE"
          git fetch --tags --force
          ! git rev-parse -q --verify "refs/tags/mobile-acceptance-challenge-$CHALLENGE" >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "mobile-acceptance-challenge-$CHALLENGE" "$GITHUB_SHA" -m "Consumed physical-iPhone acceptance challenge $CHALLENGE"
          git tag -a "closed-loop-accepted-$GITHUB_SHA" "$GITHUB_SHA" -m "Closed-loop exact deployed acceptance $GITHUB_SHA"
          git push origin "refs/tags/mobile-acceptance-challenge-$CHALLENGE" "refs/tags/closed-loop-accepted-$GITHUB_SHA"
