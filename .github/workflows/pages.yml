name: Verify and deploy the single reliability app
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, statuses: write}
concurrency: {group: 'pages-${{ github.ref }}', cancel-in-progress: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and single-application architecture
        run: |
          node --check workbook.js
          node --check hash.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          for f in verify.mjs verify-test-runtime.mjs verify-test-runtime-v3.mjs verify-test-runtime-limits.mjs verify-v3-migration.mjs verify-v3-contract.mjs verify-v3-definition-of-done.mjs verify-ingestion.mjs verify-complete.mjs verify-definition-of-done.mjs verify-semantic-invariant.mjs verify-prompt-semantics.mjs verify-user-prompt-invariants.mjs verify-full-cycle.mjs verify-project-lifecycle.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs build-test-project.mjs; do node --check "$f"; done
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find . -maxdepth 1 -type f -name '.tmp-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('index.html','utf8');
          const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const src=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"\s*><\/script>/g)].map(m=>m[1]);
          if(src.length!==expected.length)throw new Error(`Expected ${expected.length} runtime scripts; found ${src.length}`);
          const tokens=new Set();
          expected.forEach((file,i)=>{if(src[i]?.split('?')[0]!==file)throw new Error(`Wrong script order at ${file}`);const token=new URLSearchParams(src[i].split('?')[1]||'').get('v');if(!token)throw new Error(`${file} lacks build token`);tokens.add(token);});
          if(tokens.size!==1)throw new Error('Mixed runtime build/cache identities');
          if(!/worker-src\s+'self'/.test(html)||/worker-src[^;]*(?:\*|https?:|blob:|data:)/.test(html))throw new Error('Worker CSP is not same-origin only');
          NODE
      - name: Schema, ownership, migration, and v3 contracts
        run: |
          node build-test-project.mjs
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-v3-definition-of-done.mjs
      - name: Test IR validation, security, limits, and deterministic runtime
        run: |
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
      - name: Canonical ingestion and workflow gates
        run: |
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Prompt semantics, exhaustive intake, leakage, and stage routing
        run: |
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
      - name: Full-cycle, semantic authority, definition-of-done, and lifecycle proofs
        run: |
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Local Chromium acceptance at responsive widths
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    outputs: {page_url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Re-prove deployable tree before upload
        run: |
          node build-test-project.mjs
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    env: {PAGE_URL: '${{ needs.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact deployed source identity
        run: node verify-live.mjs
      - name: Exercise deployed Chromium workflow and responsive acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs

  publish-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, deploy, verify-live]
    runs-on: ubuntu-latest
    permissions: {contents: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build exact v3 machine acceptance report
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$LIVE_RESULT" = success
          node verify-definition-of-done.mjs > /tmp/definition.json
          node verify-v3-definition-of-done.mjs > /tmp/v3.json
          node verify-semantic-invariant.mjs > /tmp/semantic.out
          node verify-project-lifecycle.mjs > /tmp/lifecycle.out
          node verify-ingestion.mjs > /tmp/ingestion.out
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-report-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs > /tmp/browser-extra.out
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          node - <<'NODE'
          const fs=require('fs');
          const definition=JSON.parse(fs.readFileSync('/tmp/definition.json','utf8'));
          const v3=JSON.parse(fs.readFileSync('/tmp/v3.json','utf8'));
          const text=p=>fs.readFileSync(p,'utf8');
          const ingestion=text('/tmp/ingestion.out'),semantic=text('/tmp/semantic.out'),lifecycle=text('/tmp/lifecycle.out'),browser=text('/tmp/browser-extra.out');
          const negative=[...ingestion.matchAll(/"totalNegativeCases"\s*:\s*(\d+)/g)].at(-1)?.[1];
          if(!negative)throw new Error('Negative-case count missing');
          const report={
            commit:process.env.GITHUB_SHA,
            workflow:'mobile-closed-loop/30',
            projectSchema:'closed-loop-project/3',
            responseSchema:'closed-loop-stage-response/3',
            testIrSchema:'closed-loop-test-spec/1',
            verificationPackageSchema:'closed-loop-verification-package/1',
            ...definition,
            ...v3,
            favorableAgentVerdictsOverridingContradictoryObservations:definition.favorableAgentVerdictsOverridingContradictoryObservations,
            externallySupportedUnestablishedIndependenceTreatedAsProven:definition.externallySupportedUnestablishedIndependenceTreatedAsProven,
            nativeTestRuntime:true,
            stagesCompleted:30,
            negativeCasesPassed:Number(negative),
            artifactRoundTrip:browser.includes('extra:package-round-trip'),
            blobPersistence:browser.includes('extra:blob-persistence'),
            deployedByteIdentity:process.env.LIVE_RESULT==='success',
            semanticFalseAcceptanceInvariant:semantic.includes('"semanticFalseAcceptanceInvariant":true'),
            projectLifecycleControls:lifecycle.includes('"projectLifecycleControls":true')
          };
          const coverageKeys=['fieldOwnershipCoverage','applicationDerivationCoverage','typedRelationshipCoverage','stage01IntakeCoverage','stage04ObligationCoverage','acceptedAgentValueExtractionCoverage','acceptedRelationshipProvenanceCoverage','currentScopeSelectorCoverage','exactReqRunTestCoverage','applicableCurrentRegressionSuccess','mandatoryEvidenceChainCoverage','mandatoryEvidenceSufficiencyCoverage','releaseArtifactIdentityCoverage','nativeExecutionCoverage'];
          for(const key of coverageKeys)if(report[key]!==1)throw new Error(`${key} is not 100%.`);
          const zeroKeys=['unauthorizedFieldMutationsAccepted','canonicalMutationsBeforeAcceptance','partialCommitsAfterInjectedFailure','staleProposalsAccepted','crossProjectRelationshipsAccepted','historicalScopeSatisfyingCurrentGates','unmatchedDeliveryFilesAuthorized','appendOnlyHistoryRewritesAccepted','unsupportedTestIrTreatedAsExecutable','externalAssertionsOverridingApplicationProof','nativeExecutionReceiptsFabricatedExternally','releaseAcceptedWithContradiction','favorableAgentVerdictsOverridingContradictoryObservations','structurallyInsufficientEvidenceProducingMandatorySatisfaction','externallySupportedUnestablishedIndependenceTreatedAsProven'];
          for(const key of zeroKeys)if(report[key]!==0)throw new Error(`${key} must be zero.`);
          if(!report.deployedByteIdentity||!report.artifactRoundTrip||!report.blobPersistence||!report.semanticFalseAcceptanceInvariant||!report.projectLifecycleControls)throw new Error('Acceptance proof reduction incomplete');
          fs.writeFileSync('closed-loop-acceptance.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-acceptance-${{ github.sha }}
          path: closed-loop-acceptance.json
          if-no-files-found: error
      - name: Tag exact accepted commit
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="acceptance-${GITHUB_SHA:0:12}"
          EXISTING=$(curl --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" || true)
          EXISTING_SHA=$(printf '%s' "$EXISTING" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).object?.sha||'')}catch{}})")
          if [ -n "$EXISTING_SHA" ]; then test "$EXISTING_SHA" = "$GITHUB_SHA"; else curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" --data "{\"ref\":\"refs/tags/$TAG\",\"sha\":\"$GITHUB_SHA\"}"; fi
      - name: Publish exact workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LIVE_RESULT: ${{ needs.verify-live.result }}
        run: |
          if [ "$TEST_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$LIVE_RESULT" = success ]; then STATE=success; DESCRIPTION='Closed-loop v3 tested, deployed, byte-verified, and browser-verified'; else STATE=failure; DESCRIPTION="Verification failed: test=$TEST_RESULT deploy=$DEPLOY_RESULT live=$LIVE_RESULT"; fi
          test "$(printf '%s' "$DESCRIPTION" | wc -c)" -le 140
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data "{\"state\":\"$STATE\",\"context\":\"closed-loop-live-verification\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
          test "$STATE" = success
