name: Build, verify, publish, and deploy Closed-Loop Agent Reliability

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closed-loop-build-and-pages-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    outputs:
      app_sha256: ${{ steps.publication.outputs.app_sha256 }}
      project_sha256: ${{ steps.publication.outputs.project_sha256 }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct the project scope before any build or execution
        shell: bash
        run: |
          set -euo pipefail
          node --check correct-project-scope.mjs
          node correct-project-scope.mjs
          node --check app-core.js
          node --check build-v13-self.mjs
          node --check v13-state-replay.mjs
          node --check self-e2e-agent.mjs
          node --check self-e2e-agent-base.mjs
          node --check self-browser-e2e.mjs
          node --check self-browser-defect-boundary.mjs
          node --check run-v13-self-e2e.mjs

      - name: Generate the existing application with the corrected public scope
        shell: bash
        run: |
          set -euo pipefail
          node build-v13-self.mjs
          node v13-state-replay.mjs
          node correct-project-scope.mjs --generated-only
          test -s app-v13-candidate1.html
          test -s app-v13.html
          cp app-v13.html index.html

      - name: Verify application architecture and public identity
        shell: bash
        run: |
          set -euo pipefail
          cmp -s app-v13.html index.html
          grep -Fq '<title>Closed-Loop Reliability</title>' app-v13.html
          grep -Fq '<h1>Closed-Loop Agent Reliability</h1>' app-v13.html
          if grep -Fq 'Closed-Loop Agent Reliability v13' app-v13.html; then
            echo 'Obsolete public v13 identity remains.' >&2
            exit 1
          fi
          grep -Fq 'all 20 scopes explicitly' app-v13.html
          grep -Fq 'COMPLETE STAGE 1 JOB DEFINITION — USER INPUT / RESEARCH SCOPE, NOT EXTERNAL AUTHORITY:' app-v13.html
          grep -Fq 'RESEARCH AUTHORITY BOUNDARY — EXTERNAL SOURCES ONLY' app-v13.html
          grep -Fq 'Stage 2 research sources must be independent external sources' app-v13.html
          grep -Fq 'function replayProject(input)' app-v13.html
          grep -Fq "requireFullyValid: true, source: 'Published self-project'" app-v13.html
          grep -Fq 'SELF_VERIFIED_PROJECT.json' app-v13.html
          grep -Fq 'TARGET RUN OUTPUT TO VERIFY' app-v13.html
          grep -Fq 'CLOSED-LOOP AGENT RELIABILITY APPLICATION — COMPLETE BUILD' app-v13.html
          if grep -Fq 'Inspect the actual supplied sources and build the complete source inventory now.' app-v13.html; then
            echo 'Obsolete circular Stage 2 instruction remains.' >&2
            exit 1
          fi
          if grep -Fq 'RAW STAGE 1 RESPONSE AND SUPPLIED IMPLEMENTATION FILE LIST OMITTED BY DESIGN.' app-v13.html; then
            echo 'Obsolete narrowed Stage 1 handoff remains.' >&2
            exit 1
          fi

      - name: Install the browser test driver
        shell: bash
        run: npm install --no-save playwright-core

      - name: Execute the complete 31-stage project through the rendered UI
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node self-browser-defect-boundary.mjs
          node run-v13-self-e2e.mjs

      - name: Independently verify the UI-exported project and accepted artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s SELF_VERIFIED_PROJECT.json
          test -s SELF_E2E_REPORT.json
          test -s SELF_PROJECT_COMPLETED_393.png
          test -s SELF_PROJECT_AUTOLOADED_393.png
          test -s SELF_PROJECT_AUTOLOADED_320.png
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const fail=(message)=>{throw new Error(message)};
          const appBytes=fs.readFileSync('app-v13.html');
          const html=appBytes.toString('utf8');
          const projectBytes=fs.readFileSync('SELF_VERIFIED_PROJECT.json');
          const project=JSON.parse(projectBytes.toString('utf8'));
          const report=JSON.parse(fs.readFileSync('SELF_E2E_REPORT.json','utf8'));
          const stage1=String(project.stages?.[0]?.response||'');
          const stage2=String(project.stages?.[1]?.response||'');
          const stage3=String(project.stages?.[2]?.response||'');
          const expectedName='CLOSED-LOOP AGENT RELIABILITY APPLICATION — COMPLETE BUILD';
          const expectedObjective='Build, verify, release, and deploy one phone-first, domain-general Closed-Loop Agent Reliability application';
          const stage1Tokens=['JOB_ID','EXACT USER OBJECTIVE','EXACT DELIVERABLE','REQUESTED ACTIONS','SUBJECT AND TARGET','PROBLEM AND QUESTION SET','SCOPE BOUNDARIES','SUPPLIED INFORMATION','PROVENANCE CLASSIFICATION','PRIOR CONVERSATION DEPENDENCIES','USER-DEFINED TERMINOLOGY','CONSTRAINTS','PROHIBITED ACTIONS','REQUIRED METHODS','REQUIRED OUTPUT PROPERTIES','TEMPORAL SCOPE','LOCATION AND JURISDICTION','SUCCESS AND ACCEPTANCE CONDITIONS','PRIORITIES AND OPTIMIZATION CRITERIA','UNCERTAINTIES','EXTERNAL RESEARCH QUESTIONS','ASSUMPTIONS','BLOCKERS'];
          if(project.name!==expectedName)fail(`Wrong project name: ${project.name}`);
          if(!String(project.objective||'').startsWith(expectedObjective))fail('Project objective is not the complete domain-general application build.');
          if(/existing v13|sidecar-filename defect|meant to build.*v13/i.test(stage1))fail('Stage 1 still frames the job as a v13 repair or test-fixture task.');
          for(const token of stage1Tokens)if(!stage1.toUpperCase().includes(token))fail(`Stage 1 missing ${token}`);
          if(!stage1.includes(expectedObjective))fail('Stage 1 did not preserve the corrected exact objective.');
          if(!Array.isArray(project.stages)||project.stages.length!==31)fail('Project does not contain exactly 31 stages.');
          if(project.stages.some(stage=>stage.status!=='COMPLETE'))fail('Project contains incomplete stages.');
          if(project.projectId!=='PROJECT-MT3M46X0-075JMP')fail('Exact PROJECT_ID was not preserved.');
          if(project.jobId!=='JOB-MT3M46X0-M0LIB9')fail('Exact JOB_ID was not preserved.');
          if(!/SOURCE_SET_VERSION:\s*SOURCE-SET-v002/i.test(stage2))fail('Stage 2 is not the expanded source inventory.');
          if(!/EXTERNAL_SOURCES_DISCOVERED:\s*40\b/i.test(stage2))fail('Stage 2 does not inventory all 40 external sources.');
          if(!/RESEARCH-AREA-012/i.test(stage2))fail('Stage 2 does not cover all 12 research areas.');
          if(!/EXTERNAL_SEARCH_PERFORMED\s*:\s*true/i.test(stage2))fail('Stage 2 lacks real external-search evidence.');
          if(!/SOURCE_ID\s*:\s*SRC-/i.test(stage2)||!/SOURCE_TYPE\s*:/i.test(stage2)||!/https?:\/\//i.test(stage2))fail('Stage 2 lacks external-source records.');
          if(/SOURCE_TYPE\s*:\s*(APPLICATION_FILE|GENERATED_FILE|WORK_PRODUCT|PROJECT_JSON|HTML|JAVASCRIPT)\b/i.test(stage2))fail('Stage 2 contains an internal work product as external authority.');
          if(/\b(app-v11\.html|build-v13-self\.mjs|self-browser-e2e\.mjs|self-e2e-agent\.mjs|SELF_VERIFIED_PROJECT\.json)\b/i.test(stage2))fail('Stage 2 contains prohibited project work-product authority.');
          if(!/RESEARCH_VERSION:\s*RESEARCH-v002/i.test(stage3))fail('Stage 3 is not the expanded external research result.');
          if(!/FINDING_ID\s*:\s*FINDING-0014/i.test(stage3))fail('Stage 3 does not contain all 14 findings.');
          if(!/FINDING_ID\s*:\s*FINDING-/i.test(stage3)||!/SOURCE_ID\s*:\s*SRC-/i.test(stage3))fail('Stage 3 findings are not traced to external sources.');
          if(/\b(app-v11\.html|build-v13-self\.mjs|self-browser-e2e\.mjs|self-e2e-agent\.mjs)\b/i.test(stage3))fail('Stage 3 derives requirements from project work products.');
          if(project.stages[10].producers.filter(Boolean).length!==10)fail('Stage 11 does not contain 10 producer responses.');
          if(project.stages[11].verifiers.filter(Boolean).length!==10)fail('Stage 12 does not contain 10 verifier responses.');
          if(project.stages[17].producers.filter(Boolean).length!==10)fail('Stage 18 does not contain 10 producer responses.');
          if(project.stages[18].verifiers.filter(Boolean).length!==10)fail('Stage 19 does not contain 10 verifier responses.');
          if(project.stages[19].producers.filter(Boolean).length!==10)fail('Stage 20 does not contain 10 producer responses.');
          if(project.stages[19].verifiers.filter(Boolean).length!==10)fail('Stage 20 does not contain 10 verifier responses.');
          if(!project.stages[11].verifiers.every(value=>/REQ-015.*VIOLATED/i.test(value)))fail('The first candidate defect is not preserved in all 10 verifier records.');
          if(!project.stages[18].verifiers.every(value=>/REQ-015.*SATISFIED/i.test(value)))fail('The corrected candidate did not pass all 10 verifier records.');
          if(project.releaseDecision!=='ACCEPTED')fail('Release decision is not ACCEPTED.');
          if(project.artifactName!=='app-v13.html')fail('Accepted artifact filename changed unexpectedly.');
          if(Buffer.compare(Buffer.from(project.artifact,'utf8'),appBytes)!==0)fail('Project artifact is not byte-identical to app-v13.html.');
          const hash=crypto.createHash('sha256').update(appBytes).digest('hex');
          if(project.auditedHash!==hash||project.releaseHash!==hash)fail('Audited/release hashes do not equal the actual app SHA-256.');
          if(html.includes(project.projectId)||html.includes(project.objective))fail('Completed project state is hardcoded into the HTML.');
          if(!html.includes('<h1>Closed-Loop Agent Reliability</h1>')||html.includes('Closed-Loop Agent Reliability v13'))fail('Public application identity is still versioned incorrectly.');
          if(report.status!=='PASS'||report.hardcodedProject!==false||report.freshBrowserSidecarAutoload!==true)fail('Browser report does not prove exact sidecar autoload without hardcoding.');
          if(report.storedCircularStage2ReplayInvalidatedFromStage!==2)fail('Browser report does not prove invalidation of obsolete circular Stage 2 state.');
          console.log(JSON.stringify({status:'PASS',projectName:project.name,projectId:project.projectId,jobId:project.jobId,stagesComplete:31,producerResponses:30,verifierResponses:30,releaseDecision:project.releaseDecision,appSha256:hash,projectExportBytes:projectBytes.length,stage1LosslessScopes:20,stage2ExternalSources:40,stage2ResearchAreas:12,stage3ExternalFindings:14,hardcodedProject:false,publicVersionLabel:false},null,2));
          NODE

      - name: Create the exact Pages payload and publication record
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA256="$(sha256sum app-v13.html | awk '{print $1}')"
          PROJECT_SHA256="$(sha256sum SELF_VERIFIED_PROJECT.json | awk '{print $1}')"
          printf '{"status":"VERIFIED_AND_READY_TO_DEPLOY","sourceCommit":"%s","publicName":"Closed-Loop Agent Reliability","publicVersionLabel":false,"projectName":"CLOSED-LOOP AGENT RELIABILITY APPLICATION — COMPLETE BUILD","app":"app-v13.html","entry":"index.html","project":"SELF_VERIFIED_PROJECT.json","report":"SELF_E2E_REPORT.json","appSha256":"%s","projectSha256":"%s","projectId":"PROJECT-MT3M46X0-075JMP","jobId":"JOB-MT3M46X0-M0LIB9","stagesComplete":31,"producerResponses":30,"verifierResponses":30,"releaseDecision":"ACCEPTED","stage1LosslessScopes":20,"stage2ExternalSources":40,"stage2ResearchAreas":12,"stage3ExternalFindings":14,"stage2ResearchAuthority":"EXTERNAL_ONLY","stage3ResearchAuthority":"EXTERNAL_ONLY","hardcodedProject":false}\n' "$GITHUB_SHA" "$APP_SHA256" "$PROJECT_SHA256" > PUBLISHED_SELF_BUILD.json
          rm -rf dist
          mkdir -p dist
          cp app-v13.html dist/index.html
          cp app-v13.html dist/404.html
          cp app-v13.html dist/app-v13.html
          cp SELF_VERIFIED_PROJECT.json dist/SELF_VERIFIED_PROJECT.json
          cp SELF_E2E_REPORT.json dist/SELF_E2E_REPORT.json
          cp SELF_PROJECT_COMPLETED_393.png dist/SELF_PROJECT_COMPLETED_393.png
          cp SELF_PROJECT_AUTOLOADED_393.png dist/SELF_PROJECT_AUTOLOADED_393.png
          cp SELF_PROJECT_AUTOLOADED_320.png dist/SELF_PROJECT_AUTOLOADED_320.png
          cp PUBLISHED_SELF_BUILD.json dist/PUBLISHED_SELF_BUILD.json
          : > dist/.nojekyll
          echo "app_sha256=$APP_SHA256" >> "$GITHUB_OUTPUT"
          echo "project_sha256=$PROJECT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Preserve the exact verified release and corrected source
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-verified-release
          path: |
            app-v13-candidate1.html
            app-v13.html
            SELF_VERIFIED_PROJECT.json
            SELF_E2E_REPORT.json
            SELF_PROJECT_COMPLETED_393.png
            SELF_PROJECT_AUTOLOADED_393.png
            SELF_PROJECT_AUTOLOADED_320.png
            PUBLISHED_SELF_BUILD.json
            correct-project-scope.mjs
            self-stage1-response.txt
            self-browser-e2e.mjs
            self-e2e-agent-base.mjs
            run-v13-self-e2e.mjs
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the exact verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact verified app and matching project
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live GitHub Pages bytes and project scope
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_APP_SHA256: ${{ needs.verify.outputs.app_sha256 }}
          EXPECTED_PROJECT_SHA256: ${{ needs.verify.outputs.project_sha256 }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}/"
          verified=false
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-$attempt"
            if curl -fsSL --retry 2 --retry-delay 1 "${base}app-v13.html?verify=${nonce}" -o live-app.html \
              && curl -fsSL --retry 2 --retry-delay 1 "${base}SELF_VERIFIED_PROJECT.json?verify=${nonce}" -o live-project.json \
              && curl -fsSL --retry 2 --retry-delay 1 "${base}?verify=${nonce}" -o live-index.html; then
              app_hash="$(sha256sum live-app.html | awk '{print $1}')"
              project_hash="$(sha256sum live-project.json | awk '{print $1}')"
              index_hash="$(sha256sum live-index.html | awk '{print $1}')"
              if [[ "$app_hash" == "$EXPECTED_APP_SHA256" && "$index_hash" == "$EXPECTED_APP_SHA256" && "$project_hash" == "$EXPECTED_PROJECT_SHA256" ]]; then
                node -e "const fs=require('node:fs'),crypto=require('node:crypto');const p=JSON.parse(fs.readFileSync('live-project.json','utf8'));const app=fs.readFileSync('live-app.html');if(p.name!=='CLOSED-LOOP AGENT RELIABILITY APPLICATION — COMPLETE BUILD')throw new Error('Live project name mismatch.');if(!String(p.objective||'').startsWith('Build, verify, release, and deploy one phone-first, domain-general Closed-Loop Agent Reliability application'))throw new Error('Live project objective mismatch.');if(p.projectId!=='PROJECT-MT3M46X0-075JMP'||p.jobId!=='JOB-MT3M46X0-M0LIB9')throw new Error('Live identifiers mismatch.');if(p.stages?.length!==31||p.stages.some(s=>s.status!=='COMPLETE'))throw new Error('Live project is not 31/31 complete.');if(p.releaseDecision!=='ACCEPTED')throw new Error('Live project is not ACCEPTED.');if(!/SOURCE_SET_VERSION:\\s*SOURCE-SET-v002/i.test(String(p.stages[1].response)))throw new Error('Live Stage 2 mismatch.');if(!/RESEARCH_VERSION:\\s*RESEARCH-v002/i.test(String(p.stages[2].response)))throw new Error('Live Stage 3 mismatch.');const h=crypto.createHash('sha256').update(app).digest('hex');if(p.auditedHash!==h||p.releaseHash!==h||Buffer.compare(Buffer.from(p.artifact,'utf8'),app)!==0)throw new Error('Live accepted artifact identity mismatch.');"
                grep -Fq '<h1>Closed-Loop Agent Reliability</h1>' live-app.html
                if grep -Fq 'Closed-Loop Agent Reliability v13' live-app.html; then
                  echo 'Live page retains obsolete public version label.' >&2
                  exit 1
                fi
                verified=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo "Live Pages verification failed for $base" >&2
            exit 1
          fi
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"status":"LIVE_DEPLOYMENT_VERIFIED","pageUrl":"%s","publicName":"Closed-Loop Agent Reliability","publicVersionLabel":false,"projectName":"CLOSED-LOOP AGENT RELIABILITY APPLICATION — COMPLETE BUILD","appSha256":"%s","projectSha256":"%s","indexSha256":"%s","projectId":"PROJECT-MT3M46X0-075JMP","jobId":"JOB-MT3M46X0-M0LIB9","stagesComplete":31,"producerResponses":30,"verifierResponses":30,"releaseDecision":"ACCEPTED","sourceCommit":"%s","workflowRunId":"%s","verifiedAt":"%s"}\n' "$base" "$app_hash" "$project_hash" "$index_hash" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$verified_at" > LIVE_DEPLOYMENT_VERIFIED.json

      - name: Preserve the live deployment verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-live-deployment-receipt
          path: LIVE_DEPLOYMENT_VERIFIED.json
          if-no-files-found: error
          retention-days: 30

  publish-repository:
    needs:
      - verify
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the exact verified release
        uses: actions/download-artifact@v4
        with:
          name: closed-loop-verified-release
          path: release-files

      - name: Download the live deployment receipt
        uses: actions/download-artifact@v4
        with:
          name: closed-loop-live-deployment-receipt
          path: live-receipt

      - name: Publish matching repository artifacts after live verification
        shell: bash
        env:
          EXPECTED_APP_SHA256: ${{ needs.verify.outputs.app_sha256 }}
          EXPECTED_PROJECT_SHA256: ${{ needs.verify.outputs.project_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum release-files/app-v13.html | awk '{print $1}')" = "$EXPECTED_APP_SHA256"
          test "$(sha256sum release-files/SELF_VERIFIED_PROJECT.json | awk '{print $1}')" = "$EXPECTED_PROJECT_SHA256"
          test -s live-receipt/LIVE_DEPLOYMENT_VERIFIED.json
          mkdir -p /tmp/closed-loop-publish
          cp release-files/app-v13.html /tmp/closed-loop-publish/app-v13.html
          cp release-files/SELF_VERIFIED_PROJECT.json /tmp/closed-loop-publish/SELF_VERIFIED_PROJECT.json
          cp release-files/SELF_E2E_REPORT.json /tmp/closed-loop-publish/SELF_E2E_REPORT.json
          cp release-files/SELF_PROJECT_COMPLETED_393.png /tmp/closed-loop-publish/SELF_PROJECT_COMPLETED_393.png
          cp release-files/SELF_PROJECT_AUTOLOADED_393.png /tmp/closed-loop-publish/SELF_PROJECT_AUTOLOADED_393.png
          cp release-files/SELF_PROJECT_AUTOLOADED_320.png /tmp/closed-loop-publish/SELF_PROJECT_AUTOLOADED_320.png
          cp release-files/PUBLISHED_SELF_BUILD.json /tmp/closed-loop-publish/PUBLISHED_SELF_BUILD.json
          cp release-files/self-browser-e2e.mjs /tmp/closed-loop-publish/self-browser-e2e.mjs
          cp release-files/self-e2e-agent-base.mjs /tmp/closed-loop-publish/self-e2e-agent-base.mjs
          cp release-files/run-v13-self-e2e.mjs /tmp/closed-loop-publish/run-v13-self-e2e.mjs
          cp live-receipt/LIVE_DEPLOYMENT_VERIFIED.json /tmp/closed-loop-publish/LIVE_DEPLOYMENT_VERIFIED.json
          rm -rf release-files live-receipt

          publish_once() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/closed-loop-publish/app-v13.html app-v13.html
            cp /tmp/closed-loop-publish/app-v13.html index.html
            cp /tmp/closed-loop-publish/SELF_VERIFIED_PROJECT.json SELF_VERIFIED_PROJECT.json
            cp /tmp/closed-loop-publish/SELF_E2E_REPORT.json SELF_E2E_REPORT.json
            cp /tmp/closed-loop-publish/SELF_PROJECT_COMPLETED_393.png SELF_PROJECT_COMPLETED_393.png
            cp /tmp/closed-loop-publish/SELF_PROJECT_AUTOLOADED_393.png SELF_PROJECT_AUTOLOADED_393.png
            cp /tmp/closed-loop-publish/SELF_PROJECT_AUTOLOADED_320.png SELF_PROJECT_AUTOLOADED_320.png
            cp /tmp/closed-loop-publish/PUBLISHED_SELF_BUILD.json PUBLISHED_SELF_BUILD.json
            cp /tmp/closed-loop-publish/LIVE_DEPLOYMENT_VERIFIED.json LIVE_DEPLOYMENT_VERIFIED.json
            cp /tmp/closed-loop-publish/self-browser-e2e.mjs self-browser-e2e.mjs
            cp /tmp/closed-loop-publish/self-e2e-agent-base.mjs self-e2e-agent-base.mjs
            cp /tmp/closed-loop-publish/run-v13-self-e2e.mjs run-v13-self-e2e.mjs
            rm -f SELF_BUILD_WORKFLOW_FAILURE.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m 'Publish the exact verified application and correctly scoped project [skip ci]'
            git push origin HEAD:main
          }

          success=false
          for attempt in 1 2 3; do
            if publish_once; then
              success=true
              break
            fi
            sleep 2
          done
          if [[ "$success" != true ]]; then
            echo 'Unable to publish verified repository artifacts after three synchronized attempts.' >&2
            exit 1
          fi
