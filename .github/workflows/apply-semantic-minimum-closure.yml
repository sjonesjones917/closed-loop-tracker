name: Apply semantic minimum closure
on:
  push:
    branches:
      - reliability/semantic-minimum-closure-20260826
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply responsible-layer fixes
        run: |
          python3 .semantic-minimum-closure.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="const p=project('JOB-BLOCKED-SEMANTICS'),stage=1,pr=prompt(p,stage);"
          new="const p=project('JOB-BLOCKED-SEMANTICS'),stage=1,pr={...prompts.buildPromptRecord(stage,p),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(pr);"
          if old not in s: raise SystemExit('semantic test fixture line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify syntax and semantics
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit only permanent responsible-layer changes
        if: success()
        run: |
          rm -f .semantic-minimum-closure.py .github/workflows/apply-semantic-minimum-closure.yml
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git add -A
          git commit -m 'Close semantic response and prompt scope gaps'
          git push origin HEAD:reliability/semantic-minimum-closure-20260826
