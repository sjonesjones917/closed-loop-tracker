name: Correct acceptance reduction provenance
on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply acceptance reduction correction
        run: python3 .repair-acceptance-reduction.py
      - name: Remove temporary repair machinery before proof
        run: rm .github/workflows/repair-acceptance-reduction.yml .repair-acceptance-reduction.py
      - name: Prove acceptance reduction independently
        run: |
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          grep -F 'currentScopeSelectorCoverage:definition.currentScopeSelectorCoverage' .github/workflows/pages.yml
          grep -F 'mandatoryEvidenceChainStructuralCoverage:definition.mandatoryEvidenceChainCoverage' .github/workflows/pages.yml
          grep -F 'releaseAcceptedWithContradiction:v3.releaseAcceptedWithContradiction' .github/workflows/pages.yml
      - name: Commit proven correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u .github/workflows/repair-acceptance-reduction.yml .repair-acceptance-reduction.py
          git add .github/workflows/pages.yml verify-project-lifecycle.mjs
          git diff --cached --check
          git commit -m "Make acceptance reduction explicit and provenance-bound"
          git push origin HEAD:fix/zero-loss-controlled-20260831
