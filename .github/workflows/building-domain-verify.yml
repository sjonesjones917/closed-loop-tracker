name: Verify building-domain prompt specialization

on:
  push:
    branches:
      - prompt/building-domain-specialist-20260826

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply building-domain prompt rule
        run: python3 .github/building-domain-patch.py
      - name: Verify runtime and prompt semantics
        run: |
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Verify browser behavior unchanged
        run: |
          python3 -m http.server 4173 >/tmp/building-domain-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node verify-browser.mjs
      - name: Commit only verified permanent prompt change
        run: |
          git config user.name "closed-loop-reliability-bot"
          git config user.email "closed-loop-reliability-bot@users.noreply.github.com"
          git rm .github/building-domain-patch.py .github/workflows/building-domain-verify.yml
          git add prompt-engine.js verify-prompt-semantics.mjs index.html
          git commit -m "Add building-domain prompt authority guidance"
          git push origin HEAD:prompt/building-domain-specialist-20260826
