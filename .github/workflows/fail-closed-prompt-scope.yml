name: Prompt scope proof
on: [push]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/fail-closed-prompt-scope-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python3 repair-prompt-scope.py
          python3 repair-prompt-scope-tests.py
      - run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-hash.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fail closed on incomplete controlling prompt scope [prompt-scope-complete]"
          git push origin HEAD:reliability/fail-closed-prompt-scope-20260826
