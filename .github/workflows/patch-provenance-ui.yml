name: Patch provenance UI on branch
on:
  push:
    branches:
      - fix/provenance-collapse-scroll-20260828
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provenance-collapse-scroll-20260828
          fetch-depth: 0
      - name: Apply minimal provenance disclosure patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app-core.js')
          s = p.read_text()
          old = '''  return `<div class="panel" id="provenance-navigation" tabindex="-1"><h2 class="section-title">Provenance navigation</h2><p class="section-intro">Each accepted field points to shared provenance targets. Large raw responses and prompts are rendered once per source record instead of being duplicated inside every field trace.</p>${cards.join('')}<details class="record-card provenance-targets"><summary>Provenance source records<span>${usedRaw.size+usedPrompts.size+usedEvidence.size}</span></summary><div class="record-body">${rawLookups}${promptLookups}${evidenceLookups}</div></details></div>`;'''
          new = '''  return `<details class="record-card" id="provenance-navigation" tabindex="-1"><summary>Provenance navigation<span>${cards.length} trace${cards.length===1?'':'s'}</span></summary><div class="record-body"><p class="section-intro">Each accepted field points to shared provenance targets. Large raw responses and prompts are rendered once per source record instead of being duplicated inside every field trace.</p>${cards.join('')}<details class="record-card provenance-targets"><summary>Provenance source records<span>${usedRaw.size+usedPrompts.size+usedEvidence.size}</span></summary><div class="record-body">${rawLookups}${promptLookups}${evidenceLookups}</div></details></div></details>`;'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected provenance markup was not found')
          old_jump = '''document.querySelectorAll('[data-jump-provenance]').forEach(b=>b.onclick=()=>{const node=$('#provenance-navigation');node?.scrollIntoView({behavior:'smooth',block:'start'});node?.focus();});'''
          new_jump = '''document.querySelectorAll('[data-jump-provenance]').forEach(b=>b.onclick=()=>{const node=$('#provenance-navigation');if(node?.tagName==='DETAILS')node.open=true;node?.scrollIntoView({behavior:'smooth',block:'start'});node?.focus();});'''
          if old_jump in s:
              s = s.replace(old_jump, new_jump, 1)
          elif new_jump not in s:
              raise SystemExit('Expected provenance jump handler was not found')
          p.write_text(s)
          PY
          node --check app-core.js
          if git diff --quiet -- app-core.js; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js
          git commit -m "Make provenance navigation collapsible"
          git push origin HEAD:fix/provenance-collapse-scroll-20260828
