name: OpenAI semantic patch apply
on:
  push:
    branches: [openai/semantic-adjudication]
    paths: ['.semantic-patch/**']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply coordinated semantic adjudication patch
        run: |
          cat .semantic-patch/part-* | base64 -d | gzip -d > /tmp/semantic.patch
          tail -n +28 /tmp/semantic.patch > /tmp/semantic-production.patch
          patch -p1 < /tmp/semantic-production.patch
          rm -rf .semantic-patch .github/workflows/openai-semantic-apply.yml .github/workflows/openai-semantic-snapshot.yml
          git config user.name "openai-semantic-adjudication"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement application-owned semantic adjudication"
          git push origin HEAD:openai/semantic-adjudication
