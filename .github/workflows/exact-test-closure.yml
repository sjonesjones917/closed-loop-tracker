name: Exact reliability test closure
on:
  push:
    branches:
      - tmp-reliability-acceptance-runner-20260827
permissions:
  contents: write
jobs:
  close-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-exact-acceptance-20260827
          fetch-depth: 0
          path: target
      - uses: actions/checkout@v4
        with:
          ref: tmp-reliability-acceptance-runner-20260827
          path: runner
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add and verify exact behavioral tests
        run: |
          cd target
          bash ../runner/.runner-exact.sh
