name: Exact reliability test closure
on:
  push:
    branches:
      - tmp-reliability-acceptance-runner-20260827
permissions:
  contents: write
jobs:
  close-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-exact-acceptance-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add exact behavioral tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-complete.mjs');s=p.read_text()
          marker='// EXACT-RELIABILITY-ACCEPTANCE-037-048'
          if marker not in s:
            s += r'''

// EXACT-RELIABILITY-ACCEPTANCE-037-048
{
 const p=project('JOB-STABILITY-EXACT');p.job.CURRENT_REQUIREMENTS_VERSION='R-STAB';p.job.CURRENT_TEST_SUITE_VERSION='T-STAB';const base=engine.currentScope(p),iterationId='ITER-STAB',candidateId='CAND-STAB';
 const iteration=record('iterations',10,{CANDIDATE_ID:candidateId,PURPOSE:'stability',STATUS:'COMPLETE',LINEAGE:'fixture',EVIDENCE:'fixture'},iterationId);iteration.scope={...base,iterationId,candidateId};p.projectData.iterations.push(iteration);
 const req=record('requirements',4,{OBLIGATION:'stable',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'evidence',FAILURE_CONDITION:'no',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-STAB');req.scope={...base};p.projectData.requirements.push(req);
 const test=record('tests',6,{REQ_ID:'REQ-STAB',TEST_TYPE:'DETERMINISTIC',EXECUTION_MODE:'INDEPENDENT_AGENT_REVIEW',REQUIRED_CAPABILITY:'review',ARTIFACT_REQUIREMENTS:'NONE',INPUTS:'run',TOOLS:'reviewer',PROCEDURE:'review',EXPECTED_RESULT:'satisfied',FAILURE_CONDITION:'violation',EVIDENCE_TO_PRESERVE:'review',STATUS:'READY'},'TEST-STAB');test.scope={...base};p.projectData.tests.push(test);
 for(let i=1;i<=10;i++){const runId='RUN-STAB-'+i,contextId='CTX-STAB-'+i,run=record('runs',11,{ITERATION_ID:iterationId,CANDIDATE_ID:candidateId,CONTEXT_ID:contextId,FRESH_CONTEXT_RECORD:'fresh',CONTAMINATION_CHECK:'NONE',TOOL_CONFIGURATION:'same',EXECUTION_STATUS:'COMPLETED',COMPLETE_OUTPUT:'output '+i},runId);run.scope={...base,iterationId,candidateId,runId,contextId};p.projectData.runs.push(run);const v=record('verification',12,{REQ_ID:'REQ-STAB',RUN_ID:runId,TEST_ID:'TEST-STAB',VERIFIER:'reviewer '+i,VERIFIER_CONTEXT_ID:'VERIFIER-'+i,INDEPENDENCE_STATUS:'INDEPENDENT',INPUTS:'run '+i,PROCEDURE:'review',EXPECTED_RESULT:'satisfied',OBSERVED_RESULT:'satisfied',EXACT_EVIDENCE:'evidence '+i,DETERMINATION:'SATISFIED'},'VER-STAB-'+i);v.scope={...base,iterationId,candidateId,runId};p.projectData.verification.push(v);}
 let m=engine.executionStability(p,iterationId);assert(m.runCount===10&&m.requirementStability['REQ-STAB'].agreementRate===1,'037 10/10 agreement must equal 1');p.projectData.verification.at(-1).fields.DETERMINATION='VIOLATED';p.projectData.verification.at(-1).DETERMINATION='VIOLATED';m=engine.executionStability(p,iterationId);assert(m.requirementStability['REQ-STAB'].agreementRate===0.9,'038 9/10 agreement must equal 0.9');assert(m.requirementStability['REQ-STAB'].violated===1&&m.requirementStability['REQ-STAB'].undetermined===0,'039 violation/undetermined counts wrong');p.projectData.verification.at(-2).fields.DETERMINATION='UNDETERMINED';p.projectData.verification.at(-2).DETERMINATION='UNDETERMINED';m=engine.executionStability(p,iterationId);assert(m.requirementStability['REQ-STAB'].satisfied===8&&m.requirementStability['REQ-STAB'].violated===1&&m.requirementStability['REQ-STAB'].undetermined===1,'039 exact result counts wrong');
 for(const [id,runId,failure] of [['DEF-STAB-A','RUN-STAB-1','A'],['DEF-STAB-B','RUN-STAB-1','B'],['DEF-STAB-C','RUN-STAB-2','A']]){const d=record('defects',14,{REQ_ID:'REQ-STAB',RUN_ID:runId,OBSERVED_FAILURE:failure,EXPECTED_CONDITION:'pass',EVIDENCE:'e',SEVERITY:'MAJOR',STATUS:'CONFIRMED'},id);d.scope={...base,iterationId,candidateId,runId};p.projectData.defects.push(d);}m=engine.executionStability(p,iterationId);assert(m.newDefectsByRun['RUN-STAB-1']===2&&m.newDefectsByRun['RUN-STAB-2']===1,'040 new defects by run wrong');const historic=record('runs',11,{ITERATION_ID:'ITER-OLD',CANDIDATE_ID:'OLD',CONTEXT_ID:'OLD-C',EXECUTION_STATUS:'COMPLETED'},'RUN-HIST');historic.scope={...base,iterationId:'ITER-OLD',candidateId:'OLD',runId:'RUN-HIST'};historic.active=false;p.projectData.runs.push(historic);assert(engine.executionStability(p,iterationId).runCount===10,'041 invalidated historical run entered current metrics');const wrong=record('runs',11,{ITERATION_ID:'ITER-OTHER',CANDIDATE_ID:'OTHER',CONTEXT_ID:'OTHER-C',EXECUTION_STATUS:'COMPLETED'},'RUN-WRONG-ITER');wrong.scope={...base,iterationId:'ITER-OTHER',candidateId:'OTHER',runId:'RUN-WRONG-ITER'};p.projectData.runs.push(wrong);assert(engine.executionStability(p,iterationId).runCount===10,'042 wrong iteration entered current metrics');
}
{
 const mk=()=>{const p=project('JOB-REG-EXACT');p.projectData.acceptedChanges.push({changeId:'CHANGE-ST15',stage:15,status:'COMMITTED'});const d=record('defects',14,{REQ_ID:'REQ-R',OBSERVED_FAILURE:'bad',EXPECTED_CONDITION:'good',EVIDENCE:'E',SEVERITY:'MAJOR',STATUS:'CONFIRMED'},'DEF-R');p.projectData.defects.push(d);const r=record('regressions',15,{DEFECT_ID:'DEF-R',REQ_ID:'REQ-R',FAILURE_FIXTURE:'fixture',REPRODUCTION_PROCEDURE:'run',DETECTION_METHOD:'detect',CORRECTION:'fix',PERMANENT_TEST_LOCATION:'suite',APPLICABILITY:'APPLICABLE',ACTIVE_RETIRED_STATE:'ACTIVE'},'REG-R');p.projectData.regressions.push(r);return p;};
 let p=mk();assert(!engine.gate(p,15).complete,'043 regression definition without execution satisfied Stage 15');let e=record('regressionExecutions',15,{REG_ID:'REG-R',PHASE:'PRE_CORRECTION',RESULT:'SATISFIED',EVIDENCE_ID:'E-PRE'},'REGEXEC-PRE');e.evidenceRefs=['E-PRE'];p.projectData.evidenceRecords.push(record('evidenceRecords',15,{KIND:'TOOL_OUTPUT',DESCRIPTION:'pre',LOCATION:'test',CONTENT:'pre',STATUS:'PRESERVED'},'E-PRE'));p.projectData.regressionExecutions.push(e);assert(!engine.gate(p,15).complete,'044 SATISFIED pre-correction result proved regression failure');e.fields.RESULT='VIOLATED';e.RESULT='VIOLATED';assert(engine.gate(p,15).complete,'045 actual evidenced pre-correction failure did not satisfy reproduction');assert(!['SATISFIED','SUCCESS','PASSED'].includes(String(engine.recordValue(e,'RESULT')).toUpperCase()),'046 pre-correction failure was reused as a post-correction pass');const later=record('regressionExecutions',15,{REG_ID:'REG-R',PHASE:'POST_CORRECTION',RESULT:'SATISFIED',EVIDENCE_ID:'E-POST'},'REGEXEC-POST');later.evidenceRefs=['E-POST'];p.projectData.evidenceRecords.push(record('evidenceRecords',17,{KIND:'TOOL_OUTPUT',DESCRIPTION:'post',LOCATION:'test',CONTENT:'post',STATUS:'PRESERVED'},'E-POST'));p.projectData.regressionExecutions.push(later);assert(engine.records(p,'regressionExecutions').some(x=>engine.recordId(x,'regressionExecutions')==='REGEXEC-POST'&&engine.recordValue(x,'RESULT')==='SATISFIED'),'047 later corrected execution cannot establish success');p.projectData.regressions[0].fields.ACTIVE_RETIRED_STATE='RETIRED';p.projectData.regressions[0].ACTIVE_RETIRED_STATE='RETIRED';assert(!engine.evaluateIteration(p,'NO-ITERATION','CORRECTED').reasons.some(x=>String(x).includes('REG-R')),'048 legitimately retired regression remained in active-iteration obligation');p.projectData.regressions[0].fields.ACTIVE_RETIRED_STATE='ACTIVE';p.projectData.regressions[0].ACTIVE_RETIRED_STATE='ACTIVE';assert(engine.evaluateIteration(p,'NO-ITERATION','CORRECTED').reasons.some(x=>String(x).includes('REG-R')),'048 active regression was incorrectly excluded');
}
console.log(JSON.stringify({exactReliabilityAcceptance037_048:true},null,2));
'''
          p.write_text(s)

          p=Path('verify-prompt-semantics.mjs');s=p.read_text();marker='// EXACT-RELIABILITY-ACCEPTANCE-057-065'
          if marker not in s:
            s += r'''

// EXACT-RELIABILITY-ACCEPTANCE-057-065
{
 const p=baseProject();p.job.CURRENT_REQUIREMENTS_VERSION='R-ISO';p.job.CURRENT_TEST_SUITE_VERSION='T-ISO';p.job.CURRENT_PRODUCT_ID='PRODUCT-ISO';p.job.CURRENT_BASELINE_ID='BASE-ISO';const scope={inputVersion:p.job.CURRENT_INPUT_VERSION,requirementsVersion:'R-ISO',testSuiteVersion:'T-ISO',productId:'PRODUCT-ISO',baselineId:'BASE-ISO'};
 const req={id:'REQ-ISO',stage:4,active:true,scope:{...scope},fields:{REQ_ID:'REQ-ISO',MANDATORY_OPTIONAL_STATUS:'MANDATORY',STATUS:'ACTIVE'}};p.projectData.requirements.push(req);
 const art={id:'ARTIFACT-ISO',stage:21,active:true,scope:{...scope},fields:{ARTIFACT_ID:'ARTIFACT-ISO',FILENAME:'assembly.step',TYPE:'model/step',BYTE_SIZE:7,SHA256:'a'.repeat(64),ROLE:'PRODUCT',STORAGE_REFERENCE:'indexeddb:ARTIFACT-ISO',AVAILABILITY:'BYTES_PERSISTED_AND_VERIFIED'}};p.projectData.artifacts.push(art);
 const ev={id:'EVIDENCE-ISO',stage:6,active:true,scope:{...scope},fields:{EVIDENCE_ID:'EVIDENCE-ISO',ATTACHMENT_ID:'ARTIFACT-ISO',KIND:'TOOL_OUTPUT',DESCRIPTION:'artifact',LOCATION:'local',CONTENT:'artifact',STATUS:'PRESERVED'}};p.projectData.evidenceRecords.push(ev);
 const mk=(id,mode,cap,type='DETERMINISTIC')=>({id,stage:6,active:true,scope:{...scope},evidenceRefs:['EVIDENCE-ISO'],fields:{TEST_ID:id,REQ_ID:'REQ-ISO',TEST_TYPE:type,EXECUTION_MODE:mode,REQUIRED_CAPABILITY:cap,ARTIFACT_REQUIREMENTS:'assembly.step',INPUTS:'ARTIFACT-ISO',TOOLS:cap,PROCEDURE:'inspect exact file',EXPECTED_RESULT:'pass',FAILURE_CONDITION:'fail',EVIDENCE_TO_PRESERVE:'verification-report.json',STATUS:'READY'},relationships:{REQ_ID:'REQ-ISO'}});
 p.projectData.tests.push(mk('TEST-TOOL','EXTERNAL_AGENT_TOOL','CAD_IMPORT'),mk('TEST-HUMAN','HUMAN_INSPECTION','HUMAN','REPRESENTATION'),mk('TEST-SYSTEM','EXTERNAL_SYSTEM','LAB_SYSTEM'),mk('TEST-NATIVE','APPLICATION_DETERMINISTIC','NOT_REGISTERED'));
 p.projectData.regressions.push({id:'REG-AUTH',stage:15,active:true,scope:{...scope},fields:{REG_ID:'REG-AUTH',REQ_ID:'REQ-ISO',FAILURE_FIXTURE:'HISTORICAL-REGRESSION-PATTERN',REPRODUCTION_PROCEDURE:'attack',DETECTION_METHOD:'detect',CORRECTION:'fix',PERMANENT_TEST_LOCATION:'suite',APPLICABILITY:'APPLICABLE',ACTIVE_RETIRED_STATE:'ACTIVE'}});
 let r=prompts.buildPromptRecord(24,p,{operation:'COMPLETE',scope:{...scope,projectRevision:0}});if(!r.prompt.includes('HISTORICAL-REGRESSION-PATTERN'))throw new Error('057 Stage 24 did not receive authorized active historical regression pattern');
 r=prompts.buildPromptRecord(12,p,{operation:'COMPLETE',scope:{...scope,iterationId:'ITER-X',candidateId:'CAND-X',projectRevision:0}});for(const token of ['ARTIFACT-ISO','assembly.step','verification-report.json'])if(!r.prompt.includes(token))throw new Error('058-060 external verifier prompt missing '+token);if(!r.prompt.includes('browser')&&!r.prompt.includes('Browser'))throw new Error('062 prompt does not state browser-local transfer boundary');
 const missing=structuredClone(p);missing.projectData.artifacts[0].fields.AVAILABILITY='METADATA_ONLY';missing.projectData.artifacts[0].AVAILABILITY='METADATA_ONLY';r=prompts.buildPromptRecord(12,missing,{operation:'COMPLETE',scope:{...scope,iterationId:'ITER-X',candidateId:'CAND-X',projectRevision:0}});if(!/unavailable|missing|not available|not possess/i.test(r.prompt))throw new Error('061 unavailable bytes are not explicit');
 r=prompts.buildPromptRecord(25,p,{operation:'COMPLETE',scope:{...scope,projectRevision:0}});if(/pretend|impersonate the human|act as the human/i.test(r.prompt))throw new Error('063 human inspection prompt allows AI impersonation');
 r=prompts.buildPromptRecord(22,p,{operation:'COMPLETE',scope:{...scope,projectRevision:0}});if(/substitute.*agent.*external system|agent may replace.*external system/i.test(r.prompt))throw new Error('064 external-system prompt allows agent substitution');if(/fake native execution|pretend.*application.*execut/i.test(r.prompt))throw new Error('065 application-native prompt allows fake execution');
}
console.log(JSON.stringify({exactReliabilityAcceptance057_065:true},null,2));
'''
          p.write_text(s)
          PY
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          git config user.name github-actions
          git config user.email github-actions@github.com
