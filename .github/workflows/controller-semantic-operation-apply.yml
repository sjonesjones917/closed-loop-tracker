pressions','environmentDependencies','expectedVarianceContracts']},'6:PROOF_REVIEW':{r:['requirements','tests','proofExpressions','proofObligations','environmentDependencies','expectedVarianceContracts','propositions','applicabilityRecords','artifacts','sources','research'],w:['semanticReviews']},'6:RECONCILE_VERIFICATION_SUITE':{r:['requirements','tests','proofExpressions','proofObligations','environmentDependencies','expectedVarianceContracts','propositions','applicabilityRecords','artifacts','sources','research','semanticReviews'],w:['tests','proofExpressions','environmentDependencies','expectedVarianceContracts','semanticReviews']},"
          if old not in s: raise SystemExit('oracle OP anchor changed')
          s=s.replace(old,new,1)
