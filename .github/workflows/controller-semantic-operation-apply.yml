          new="const OPERATION_CONTRACT_OVERRIDES=Object.freeze({1:Object.freeze({SEMANTIC_CHALLENGE:Object.freeze({readCollections:[],agentWritableCollections:['semanticChallenges'],allowedStageData:[]}),RECONCILE_INTAKE:Object.freeze({readCollections:['semanticChallenges'],agentWritableCollections:['semanticReviews']})}),2:Object.freeze({COMPLETE:Object.freeze({readCollections:[],agentWritableCollections:['sources','sourceConflicts','sourceSearchContracts']}),SEARCH_ADEQUACY_REVIEW:Object.freeze({readCollections:['sources','sourceConflicts','sourceSearchContracts'],agentWritableCollections:['semanticReviews'],allowedStageData:[]}),RECONCILE_SOURCE_SEARCH:Object.freeze({readCollections:['sources','sourceConflicts','sourceSearchContracts','semanticReviews'],agentWritableCollections:['sources','sourceConflicts','sourceSearchContracts','semanticReviews']})}),3:Object.freeze({SEMANTIC_CHALLENGE:Object.freeze({readCollections:['sources','sourceConflicts'],agentWritableCollections:['semanticChallenges'],allowedStageData:[]}),RECONCILE_RESEARCH:Object.freeze({readCollections:['sources','sourceConflicts','research','candidateRequirements','semanticChallenges'],agentWritableCollections:['research','candidateRequirements','semanticReviews'],allowedStageData:[]})}),4:Object.freeze({DISPOSITION_CHALLENGE:Object.freeze({readCollections:['research','candidateRequirements','sources','evidenceRecords','sourceConflicts'],agentWritableCollections:['semanticChallenges'],allowedStageData:[]}),ATOMICITY_CHALLENGE:Object.freeze({readCollections:['research','candidateRequirements','sources','evidenceRecords','sourceConflicts'],agentWritableCollections:['semanticChallenges'],allowedStageData:[]}),RECONCILE_REQUIREMENTS:Object.freeze({readCollections:['research','candidateRequirements','sources','evidenceRecords','sourceConflicts','requirements','propositions','semanticChallenges'],agentWritableCollections:['requirements','propositions','semanticReviews']})}),5:Object.freeze({SEMANTIC_REVIEW:Object.freeze({readCollections:['requirements','requirementResolutions','propositionEquivalenceReviews','applicabilityRecords','propositions','research','sources','sourceConflicts','evidenceRecords','candidateRequirements'],agentWritableCollections:['semanticReviews'],allowedStageData:[]}),RECONCILE_REQUIREMENT_SET:Object.freeze({readCollections:['requirements','requirementResolutions','propositionEquivalenceReviews','applicabilityRecords','propositions','research','sources','sourceConflicts','evidenceRecords','candidateRequirements','semanticReviews'],agentWritableCollections:['requirementResolutions','propositionEquivalenceReviews','applicabilityRecords','semanticReviews']})}),6:Object.freeze({COMPLETE:Object.freeze({readCollections:['requirements','requirementResolutions','artifacts','sources','research','propositions','applicabilityRecords'],agentWritableCollections:['tests','proofExpressions','environmentDependencies','expectedVarianceContracts']}),PROOF_REVIEW:Object.freeze({readCollections:['requirements','tests','proofExpressions','proofObligations','environmentDependencies','expectedVarianceContracts','propositions','applicabilityRecords','artifacts','sources','research'],agentWritableCollections:['semanticReviews'],allowedStageData:[]}),RECONCILE_VERIFICATION_SUITE:Object.freeze({readCollections:['requirements','tests','proofExpressions','proofObligations','environmentDependencies','expectedVarianceContracts','propositions','applicabilityRecords','artifacts','sources','research','semanticReviews'],agentWritableCollections:['tests','proofExpressions','environmentDependencies','expectedVarianceContracts','semanticReviews']})}),17:Object.freeze({FREEZE:"
