          new="const completionReadCollections=Object.freeze(['propositions','propositionEquivalenceReviews','applicabilityRecords','proofExpressions','proofObligations','observationRecords','entailmentReviews','environmentDependencies','semanticReviews']);\nconst NARROW_SEMANTIC_OPERATION_KEYS=new Set(['1:SEMANTIC_CHALLENGE','1:RECONCILE_INTAKE','2:COMPLETE','2:SEARCH_ADEQUACY_REVIEW','2:RECONCILE_SOURCE_SEARCH','3:SEMANTIC_CHALLENGE','3:RECONCILE_RESEARCH','4:DISPOSITION_CHALLENGE','4:ATOMICITY_CHALLENGE','4:RECONCILE_REQUIREMENTS','5:SEMANTIC_REVIEW','5:RECONCILE_REQUIREMENT_SET','6:COMPLETE','6:PROOF_REVIEW','6:RECONCILE_VERIFICATION_SUITE']);\nconst REVIEW_ONLY_OPERATION_KEYS=new Set(['1:SEMANTIC_CHALLENGE','2:SEARCH_ADEQUACY_REVIEW','3:SEMANTIC_CHALLENGE','4:DISPOSITION_CHALLENGE','4:ATOMICITY_CHALLENGE','5:SEMANTIC_REVIEW','6:PROOF_REVIEW']);\nfunction amendedOperationContract(stage,operation){const base=s0.operationContract(stage,operation);if(!base)return null;const key=`${stage}:${operation}`,narrow=NARROW_SEMANTIC_OPERATION_KEYS.has(key),addedAgent=narrow?[]:(addedAgentCollections[stage]||[]),addedRead=stage>=5&&!narrow?completionReadCollections:[],addedApplication=stage===30?['operationReservations','proofObligations','deliveryRecords','deploymentManifests']:['operationReservations','proofObligations'],allowedStageData=REVIEW_ONLY_OPERATION_KEYS.has(key)?[]:(CONTRACTS[stage]?.allowedStageData||base.allowedStageData||[]);return Object.freeze({...base,readCollections:Object.freeze([...new Set([...(base.readCollections||[]),...addedRead])]),agentWritableCollections:Object.freeze([...new Set([...(base.agentWritableCollections||[]),...addedAgent])]),applicationCollections:Object.freeze([...new Set([...(base.applicationCollections||[]),...addedApplication])]),allowedStageData:Object.freeze([...allowedStageData])});}"
