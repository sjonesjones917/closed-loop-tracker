name: Repair output-format guidance

on:
  push:
    branches:
      - finish/live-human-gate-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Restore the required optional output-format guidance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app-core.js')
          text=path.read_text()
          old="${t==='number'?'<span class=\"help\">Whole number only. Leave blank if unknown or no preference.</span>':''}"
          new="${k==='REQUIRED_OUTPUT_FORMAT'?'<span class=\"help\">You do not need to know the final file format in advance. Leave this blank when the deliverable is defined but the representation is not yet known. A specification substitute requires human confirmation.</span>':t==='number'?'<span class=\"help\">Whole number only. Leave blank if unknown or no preference.</span>':''}"
          if old not in text:
              raise SystemExit('Output-format help insertion target not found')
          path.write_text(text.replace(old,new,1))
          self_path=Path('.github/workflows/repair-output-format-guidance.yml')
          if self_path.exists(): self_path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js .github/workflows
          git commit -m "Restore optional output-format guidance"
          git push origin HEAD:finish/live-human-gate-20260830