name: Temporary spec port-type repair
on:
  push:
    branches:
      - repair/spec-conformance-response-file-20260903
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-conformance-response-file-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply repair
        run: node apply-port-type-repair.mjs
      - name: Prove correction
        run: |
          set -euo pipefail
          node --check test-runtime.js
          node --check verify-test-ir-port-types.mjs
          node verify-test-ir-port-types.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
      - name: Commit source correction
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git reset .github/workflows/spec-port-type-repair.yml
          git commit -m "Enforce Test IR port type contracts"
          git push origin HEAD:repair/spec-conformance-response-file-20260903
