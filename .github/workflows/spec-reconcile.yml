name: Controlling specification reconciliation
on:
  push:
    branches: [fix/full-spec-reconcile-20260830]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-spec-reconcile-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reconciliation
        run: |
          python3 .github/spec-reconcile.py
          python3 .github/spec-reconcile-capture.py
          python3 .github/spec-reconcile-proof.py
          python3 .github/spec-reconcile-proof2.py
      - name: Remove temporary repair files
        run: rm .github/workflows/spec-reconcile.yml .github/spec-reconcile.py .github/spec-reconcile-capture.py .github/spec-reconcile-proof.py .github/spec-reconcile-proof2.py
      - name: Verify source and controlling invariants
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check verify-controlling-spec.mjs
          node verify-controlling-spec.mjs
      - name: Run complete existing proof
        run: |
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Run browser acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit proven changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile repository to controlling implementation specification'
          git push origin HEAD:fix/full-spec-reconcile-20260830
