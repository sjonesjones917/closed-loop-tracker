  'COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE',
  'ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE'
]);
const LIMITS=Object.freeze({
  maxInputBytes:16*1024*1024,
  maxDecompressedBytes:16*1024*1024,
  maxSteps:64,
  maxSelectorDepth:32,
  maxParsedDepth:64,
  maxCollectionItems:100000,
  maxRegexLength:2000,
  maxRegexInputLength:2*1024*1024,
  maxWorkerMs:5000,
  maxArchiveExpansionBytes:16*1024*1024,
  maxCsvCells:250000
});
const FORBIDDEN_STEP_KEYS=Object.freeze(['code','javascript','python','shell','command','eval','function','script','import','network','url']);
const bytesOf=value=>value instanceof Uint8Array?value:value instanceof ArrayBuffer?new Uint8Array(value):ArrayBuffer.isView(value)?new Uint8Array(value.buffer,value.byteOffset,value.byteLength):null;
const field=(test,key)=>test?.fields?.[key]??test?.[key];
const stable=value=>JSON.stringify(value,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a.localeCompare(b))):v);
const isInteger=value=>typeof value==='number'&&Number.isSafeInteger(value);
function parsedDepth(value,depth=0){if(depth>LIMITS.maxParsedDepth)throw new Error('Parsed structure exceeds deterministic runtime depth limit.');if(value&&typeof value==='object')for(const item of Array.isArray(value)?value:Object.values(value))parsedDepth(item,depth+1);return value;}
async function sha256(bytes){const data=bytesOf(bytes);if(!data)throw new Error('HASH_SHA256 requires bytes.');if(data.byteLength>LIMITS.maxInputBytes)throw new Error('Input exceeds deterministic runtime byte limit.');const digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function parseCsv(text,config){
  const delimiter=String(config?.delimiter??'');if(delimiter.length!==1)throw new Error('PARSE_CSV requires an explicit one-character delimiter.');
  if(typeof config?.header!=='boolean')throw new Error('PARSE_CSV requires explicit header boolean.');
  if(config?.quoting!=='RFC4180')throw new Error('PARSE_CSV requires quoting = RFC4180.');
  if(!['LF','CRLF','AUTO'].includes(config?.newline))throw new Error('PARSE_CSV requires newline = LF, CRLF, or AUTO.');
  if(config?.encoding!=='UTF-8')throw new Error('PARSE_CSV requires encoding = UTF-8.');
