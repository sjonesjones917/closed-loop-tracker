  if(!Array.isArray(spec?.steps)||!spec.steps.length)issues.push('Test IR requires at least one step.');
  if((spec?.steps?.length||0)>LIMITS.maxSteps)issues.push('Test IR exceeds maximum step count.');
  const rootAllowed=new Set(['version','steps']);for(const key of Object.keys(spec||{}))if(!rootAllowed.has(key))issues.push(`Unsupported Test IR root property ${key}.`);
  for(const [index,step] of (spec?.steps||[]).entries()){
    if(!step||typeof step!=='object'||Array.isArray(step)){issues.push(`Step ${index} is not an object.`);continue;}
    if(!OPS.includes(step.op))issues.push(`Step ${index} uses unsupported operation ${String(step.op)}.`);
    for(const key of FORBIDDEN_STEP_KEYS)if(Object.prototype.hasOwnProperty.call(step,key))issues.push(`Step ${index} contains forbidden executable field ${key}.`);
    if(step.op==='LOAD_ARTIFACT'&&!step.binding)issues.push(`Step ${index} LOAD_ARTIFACT requires binding.`);
    if(step.op==='SELECT_JSON_PATH'&&!step.path)issues.push(`Step ${index} SELECT_JSON_PATH requires path.`);
    if(step.op==='SELECT_XML'&&!step.path)issues.push(`Step ${index} SELECT_XML requires path.`);
    if(step.op==='PARSE_CSV')for(const key of ['delimiter','header','quoting','newline','encoding'])if(!Object.prototype.hasOwnProperty.call(step,key))issues.push(`Step ${index} PARSE_CSV requires ${key}.`);
