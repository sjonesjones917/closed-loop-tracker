name: Controlling specification reconciliation
on:
  push:
    branches:
      - fix/full-spec-reconcile-20260830
permissions:
  contents: write
jobs:
  reconcile:
    if: github.event.head_commit.message == 'Run full controlling-spec reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-spec-reconcile-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile implementation to controlling specification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def once(text, old, new, label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected exactly one anchor, found {n}')
              return text.replace(old,new,1)

          # Visual baseline is immutable in this repair.
          index_before=read('index.html')
          style_before=re.search(r'<style>(.*?)</style>',index_before,re.S).group(1)

          # 1) Workflow/project identity and visible Stage 16 wording.
          p='workbook.js'; s=read(p)
          s=once(s,"const PROJECT_SCHEMA='closed-loop-project/2';","const PROJECT_SCHEMA='closed-loop-project/3';",'project schema')
          s=once(s,"'REVISE THE RESPONSIBLE LAYER'","'CORRECT THE ROOT CAUSE'",'Stage 16 visible label')
          write(p,s)

          # 2) Response contract /3 and exact Job ownership.
          p='workflow-schema.js'; s=read(p)
          s=once(s,"const RESPONSE_SCHEMA='closed-loop-stage-response/2';","const RESPONSE_SCHEMA='closed-loop-stage-response/3';",'response schema')
          old="const HUMAN_JOB_FIELDS=Object.freeze([\n  'JOB_TITLE','JOB_OWNER','EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY',\n  'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','DESIRED_SOURCE_COUNT','KNOWN_AUTHORITATIVE_SOURCES',\n  'AVAILABLE_TOOLS','PROHIBITED_ACTIONS','EXPLICIT_USER_REQUIREMENTS'\n]);"
          new="const HUMAN_JOB_FIELDS=Object.freeze([\n  'EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY',\n  'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','DESIRED_SOURCE_COUNT','KNOWN_AUTHORITATIVE_SOURCES',\n  'AVAILABLE_TOOLS','PROHIBITED_ACTIONS','EXPLICIT_USER_REQUIREMENTS'\n]);\nconst HUMAN_DECISION_JOB_FIELDS=Object.freeze(['JOB_TITLE','JOB_OWNER']);"
          s=once(s,old,new,'Job ownership partition')
          old="function jobFieldDefinition(name){\n  if(APPLICATION_JOB_FIELDS.includes(name))return field(name,PRODUCER.APPLICATION,{derivation:`Application derives ${name} from canonical project state.`});\n  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:name==='EXACT_USER_OBJECTIVE_VERBATIM'?1:null,provenanceRequired:false,valueType:name==='DESIRED_SOURCE_COUNT'?'INTEGER':'STRING',nullable:name!=='EXACT_USER_OBJECTIVE_VERBATIM'});"
          new="function jobFieldDefinition(name){\n  if(APPLICATION_JOB_FIELDS.includes(name))return field(name,PRODUCER.APPLICATION,{derivation:`Application derives ${name} from canonical project state.`});\n  if(HUMAN_DECISION_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN_DECISION,{requiredAtStage:null,provenanceRequired:false,valueType:'STRING',nullable:true});\n  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:name==='EXACT_USER_OBJECTIVE_VERBATIM'?1:null,provenanceRequired:false,valueType:name==='DESIRED_SOURCE_COUNT'?'INTEGER':'STRING',nullable:name!=='EXACT_USER_OBJECTIVE_VERBATIM'});"
          s=once(s,old,new,'Job field producer dispatch')
          old="const JOB_FIELDS=Object.freeze(Object.fromEntries([...new Set([...HUMAN_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])].map(name=>[name,jobFieldDefinition(name)])));"
          new="const JOB_FIELDS=Object.freeze(Object.fromEntries([...new Set([...HUMAN_JOB_FIELDS,...HUMAN_DECISION_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])].map(name=>[name,jobFieldDefinition(name)])));"
          s=once(s,old,new,'Job field complete set')
          s=s.replace("'CUSTOM_PIPELINE'","'TEST_IR'")
          s=s.replace('CUSTOM_PIPELINE','TEST_IR')
          write(p,s)

          # 3) Test IR canonical name in runtime/tests/source. Exact runtime overhaul follows below.
          for p in ['prompt-engine.js','workflow-engine.js','response-ingestion.js','verify-test-runtime.mjs','verify-complete.mjs','verify-prompt-semantics.mjs','verify-definition-of-done.mjs','verify-full-cycle.mjs','verify.mjs']:
              if Path(p).exists():
                  t=read(p).replace('CUSTOM_PIPELINE','TEST_IR')
                  write(p,t)

          # 4) Remove prohibited project-subject branches from prompt authority and make the task precede project context.
          p='prompt-engine.js'; s=read(p)
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/27';")
          start=s.find("${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY")
          end=s.find("${stage===1?`STAGE 01 CLARIFICATION EXPERIENCE",start)
          if start<0 or end<0: raise SystemExit('domain-specific prompt block anchors not found')
          generic="${stage===1?`STAGE 01 SUBJECT-NEUTRAL INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY\nDerive the project-specific human-authority questions from the actual request, accessible supplied materials, and current canonical context. Ask only genuinely human-only facts or decisions. Do not encode or assume a project subject, profession, industry, jurisdiction, artifact family, toolchain, or regulatory domain in application prompt logic. Do not perform later-stage work.\n`:`SUBJECT-NEUTRAL STAGE ADAPTATION\nDerive only the domain semantics required by the current project from the accepted project request, current canonical records, supplied evidence, and current stage contract. Do not use hard-coded project-subject branches or catalogues. Do not force irrelevant fields.\n`}\n\n"
          s=s[:start]+generic+s[end:]
          # Patent acceptance fixture must stay in tests, never runtime prompt.
          patent_start=s.find('For PATENT / REGULATED FILING jobs,')
          if patent_start>=0:
              patent_end=s.find('Before Stage 01 submission verify:',patent_start)
              if patent_end<0: raise SystemExit('patent fixture prompt end not found')
              s=s[:patent_start]+s[patent_end:]
          # Put the actual stage task before bounded project context. Remove later duplicate task heading.
          marker='AUTHORIZED BOUNDED CONTEXT FOR THIS STAGE\n${contextFor(stage,state,operation,scope)}'
          if marker not in s: raise SystemExit('bounded-context marker not found')
          s=s.replace(marker,'STAGE-SPECIFIC TASK — DO THIS NOW\n${procedures[stage]}\n\n'+marker,1)
          later="})()}STAGE-SPECIFIC TASK\n${procedures[stage]}\n\nPERMITTED AGENT-OWNED STAGE DATA"
          if later not in s: raise SystemExit('later stage-task duplicate anchor not found')
          s=s.replace(later,"})()}PERMITTED AGENT-OWNED STAGE DATA",1)
          # Stage 4 must use canonical retained intent and never turn missing prior capture into repeat user input.
          if 'Do not ask the human to attach, resend, retype, or summarize the original intent file' not in s:
              raise SystemExit('Stage 4 no-repeat-input instruction missing')
          write(p,s)

          # 5) Canonical Test IR runtime: exact required primitive set, explicit limits, worker coordination.
          runtime=r'''(()=>{
'use strict';
const VERSION='closed-loop-test-runtime/2';
const SPEC_VERSION='closed-loop-test-spec/1';
const CAPABILITY='CLOSED_LOOP_TEST_IR';
const OPS=Object.freeze([
