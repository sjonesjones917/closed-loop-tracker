name: Controller Stage 09 runtime one-time repair
on:
  push:
    branches:
      - controller3-stage09-runtime-current-main-20260904
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-stage09-runtime-current-main-20260904
          fetch-depth: 0
      - name: Apply and verify Stage 09 next-action runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="function next(p){const b=e0.operationalNextAction(p),n=Number(p.activeStage||p.job?.CURRENT_STAGE||0);"
          new="function next(p,currentStage){const b=e0.operationalNextAction(p,currentStage),n=Number(currentStage||p.activeStage||String(p.job?.CURRENT_STAGE||'').replace(/[^0-9]/g,'')||0);"
          if s.count(old)!=1:
              raise SystemExit(f'Expected one Stage 09 next-action wrapper; found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check workflow-engine.js
          node verify-independent-preflight.mjs
          rm .github/workflows/controller-stage09-runtime-repair.yml
          node verify-definition-of-done.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js .github/workflows/controller-stage09-runtime-repair.yml
          git commit -m "Fix explicit-stage operational next action routing"
          git push origin HEAD:controller3-stage09-runtime-current-main-20260904
