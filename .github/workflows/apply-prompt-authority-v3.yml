name: Apply prompt authority corrections v3
on:
  push:
    branches: [practical-100/current-main-prompt-authority]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/current-main-prompt-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited authority transform and exact Stage 2 terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/apply-prompt-authority-v2.yml').read_text()
          start=wf.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=wf.index("          PY\n",start)
          wrapper='\n'.join(line[10:] if line.startswith('          ') else line for line in wf[start:end].splitlines())
          exec(compile(wrapper,'authority-v2-wrapper','exec'),{})
          p=Path('prompt-engine.js');s=p.read_text()
          old='return the explicit NO_APPLICABLE_EXTERNAL_SOURCE determination rather than inventing a source.'
          new='return an explicit no-applicable-source determination with SOURCE_APPLICABILITY_DETERMINATION = NO_APPLICABLE_EXTERNAL_SOURCE rather than inventing a source.'
          if old not in s: raise SystemExit('Stage 2 no-source phrase anchor missing after authority transform.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Deterministic and semantic acceptance
        run: |
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Clean and publish exact tested source
        run: |
          rm .github/workflows/apply-prompt-authority.yml .github/workflows/apply-prompt-authority-v2.yml .github/workflows/apply-prompt-authority-v3.yml
          git diff --check
          test ! -e app.js
          ! find . -maxdepth 2 -type f \( -name '.repair-*' -o -name '*guard.js' -o -name 'prompt-display.js' \) | grep .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Make stage prompts authority-correct and model-agnostic"
          git push origin HEAD:practical-100/current-main-prompt-authority