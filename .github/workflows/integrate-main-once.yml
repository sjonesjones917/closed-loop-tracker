name: Integrate exact current main once
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths: [.github/workflows/integrate-main-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Merge current main and resolve authority boundaries
        run: |
          git config user.name closed-loop-integrator
          git config user.email closed-loop-integrator@users.noreply.github.com
          BEFORE=$(git rev-parse HEAD)
          git fetch origin main --force
          set +e
          git merge --no-commit --no-ff origin/main
          set -e
          for f in .github/workflows/pages.yml app-core.js build-test-project.mjs index.html project-store.js prompt-engine.js response-ingestion.js test-runtime.js verify-browser.mjs verify-complete.mjs verify-full-cycle.mjs verify-hash.mjs verify-ingestion.mjs verify-project-lifecycle.mjs verify-prompt-semantics.mjs verify-test-runtime.mjs verify.mjs workbook.js workflow-engine.js workflow-schema.js; do
            git checkout "$BEFORE" -- "$f"
            git add "$f"
          done
          rm -f verify-one-time-intent-intake.mjs .github/workflows/integrate-main-once.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Prove merged non-browser implementation
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-v3-migration.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-single-supply-prompts.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit exact integrated tree
        run: |
          git commit -m 'Integrate current main without losing closed-loop v3 semantics'
          git push origin HEAD:implementation/closed-loop-v3
