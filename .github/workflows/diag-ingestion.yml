name: Repair complete gate fixture
on:
  push:
    branches: [implementation/closed-loop-v3]
permissions: {contents: write}
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[complete-fixture-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: implementation/closed-loop-v3, fetch-depth: 0}
      - run: |
          sed -i "s/EXECUTABLE_KIND:'CUSTOM_PIPELINE'/EXECUTABLE_KIND:'TEST_IR'/g" verify-complete.mjs
          git config user.name closed-loop-finalizer
          git config user.email closed-loop-finalizer@users.noreply.github.com
          git add verify-complete.mjs
          git commit -m 'Use canonical TEST_IR in complete-gate fixtures [complete-fixture-final]'
          git push origin HEAD:implementation/closed-loop-v3
