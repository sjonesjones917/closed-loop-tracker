name: Diagnose ingestion
on:
  push:
    branches: [implementation/closed-loop-v3]
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node verify-ingestion.mjs > ingestion.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with: {name: ingestion-diagnostic, path: ingestion.log}
