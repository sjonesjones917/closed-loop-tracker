name: Apply human-first stage UX hotfix
on:
  push:
    branches: [fix/human-first-stage-ux-20260826]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-first-stage-ux-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch prompt semantics and stage UX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:140]!r}')
              p.write_text(text.replace(old,new,count))

          replace_exact('prompt-engine.js', "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/13';", "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/14';")

          replace_exact('prompt-engine.js', " if(stage===1&&!String(state?.job?.EXACT_USER_OBJECTIVE_VERBATIM||'').trim()){const error=new Error('Stage 01 needs one thing before an instruction can be generated: enter the verbatim job request in User Job Input and save it. Additional details may be clarified by the agent afterward.');error.code='MISSING_MINIMUM_HUMAN_INPUT';throw error;}\n", "")

          replace_exact('prompt-engine.js',
          "If such a genuinely Stage-01-blocking fact is missing, return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL—as the single response. Put only the smallest set of blocking questions inside humanInputRequests using the exact question contract below. Ask necessary human questions conversationally before the final JSON response; do not encode a question as JSON merely to talk to the human. The application will display and type-check those questions, version the answers as User Job Input, invalidate this prompt, and generate a replacement Stage 01 instruction.",
          "If such a genuinely Stage-01-blocking fact is missing and interactive conversation is available, ask the human directly in concise plain language and wait for the answer before producing the final JSON. Do not encode an ordinary conversational question in JSON. Use HUMAN_INPUT_REQUIRED only when a required answer remains unavailable or explicitly deferred after that conversation, or when interactive conversation is unavailable.")

          replace_exact('prompt-engine.js',
          "- Never set a HUMAN or HUMAN_DECISION-owned field. When unavailable human information is required, return HUMAN_INPUT_REQUIRED and structured humanInputRequests. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.",
          "- Never set a HUMAN or HUMAN_DECISION-owned field. When required human information is missing and interactive conversation is available, ask the human conversationally first. Use HUMAN_INPUT_REQUIRED with structured humanInputRequests only when a required answer remains unavailable or explicitly deferred after that conversation, or when interactive conversation is unavailable. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.")

          replace_exact('app-core.js',
          "Start with one thing: save the verbatim job request. Add files or constraints you already have; everything else can be clarified later. If more human information is needed now, the agent must return one structured HUMAN_INPUT_REQUIRED response. Paste it once and the application will show the plain-language questions here, validate your answers, version them as User Job Input, and regenerate Stage 01.",
          "Send the generated instruction to ChatGPT. If your saved job request is still blank, the agent should ask what you want to accomplish in normal conversation. If it needs any other human-only fact, answer it in the same chat. When it has enough information, it returns the final strict JSON for this app. HUMAN_INPUT_REQUIRED is only a fallback when that conversation cannot finish the clarification.")

          replace_exact('app-core.js',
          "<strong>Clarify before final JSON.</strong> If the external agent asks a question, answer it there, then record the answer in User Job Input and regenerate this instruction. Do not paste or accept a placeholder DATA_PROPOSAL just to discover what information is missing.",
          "<strong>Talk to the agent normally.</strong> If ChatGPT needs a human-only fact, answer it in the same chat. It should continue until it has enough information, then return the final strict JSON. Do not paste conversational questions into the response box.")

          replace_exact('index.html','runtime-6e61c99da4e764b5','runtime-human-first-20260826c',8)

          p=Path('verify-prompt-semantics.mjs'); text=p.read_text()
          old="if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL')||!record.prompt.includes('Ask necessary human questions conversationally before the final JSON response')||!record.prompt.includes('display and type-check those questions')||!record.prompt.includes('generate a replacement Stage 01 instruction'))issues.push('STAGE01_STRUCTURED_CLARIFICATION_MISSING');"
          new="if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('ask the human directly in concise plain language')||!record.prompt.includes('Do not encode an ordinary conversational question in JSON')||!record.prompt.includes('Use HUMAN_INPUT_REQUIRED only when a required answer remains unavailable'))issues.push('STAGE01_HUMAN_FIRST_CLARIFICATION_MISSING');"
          if old not in text:
              raise SystemExit('verify-prompt-semantics.mjs: expected Stage 01 clarification assertion not found')
          p.write_text(text.replace(old,new,1))

          p=Path('verify-browser.mjs'); text=p.read_text()
          old="await openStage(cdp,1);text=(await snapshot(cdp)).text;for(const token of ['Start with one thing: save the verbatim job request','one structured HUMAN_INPUT_REQUIRED response','STAGE 01 NEEDS YOUR JOB REQUEST'])assert(text.includes(token),`Stage 01 clarification experience missing ${token}.`);assert(!text.includes('plain-language questions before final JSON'),'Stage 01 UI still advertises the contradictory conversational-before-JSON path.');"
          new="await openStage(cdp,1);text=(await snapshot(cdp)).text;for(const token of ['Send the generated instruction to ChatGPT','COPY BLOCK — STAGE 01 — INITIALIZE THE JOB','HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE','Save and copy instruction'])assert(text.includes(token),`Stage 01 human-first prompt experience missing ${token}.`);assert(!text.includes('STAGE 01 NEEDS YOUR JOB REQUEST'),'Stage 01 still renders an internal prerequisite message as the generated instruction.');"
          if old not in text:
              raise SystemExit('verify-browser.mjs: expected blank Stage 01 UX assertion not found')
          p.write_text(text.replace(old,new,1))
          PY

          node --check app-core.js
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node build-test-project.mjs

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/human-first-hotfix.yml
          git config user.name "closed-loop-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add app-core.js prompt-engine.js index.html verify-prompt-semantics.mjs verify-browser.mjs .github/workflows/human-first-hotfix.yml
          git commit -m "Fix missing prompt and human-first clarification flow"
          git push origin HEAD:fix/human-first-stage-ux-20260826
