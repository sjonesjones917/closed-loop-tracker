name: Finalize Stage 04 durable capture on current main
on:
  push:
    branches: [fix/stage4-durable-accounting-current-main-20260830]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-durable-accounting-current-main-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply durable capture-once implementation without visual redesign
        shell: bash
        run: |
          set -euo pipefail
          donor=f5e5c14081373b89faf40a867425b99c34841dc3
          git fetch origin "$donor"
          git checkout "$donor" -- \
            workflow-schema.js \
            workflow-engine.js \
            prompt-engine.js \
            response-ingestion.js \
            workbook.js \
            build-test-project.mjs \
            verify-one-time-intent-intake.mjs \
            verify-test-runtime.mjs \
            verify-complete.mjs \
            verify-full-cycle.mjs \
            verify-ingestion.mjs \
            verify-prompt-semantics.mjs \
            verify.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          p=Path('prompt-engine.js')
          text=p.read_text()
          text,count=re.subn(r"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/27';",text,count=1)
          if count!=1: raise SystemExit(f'prompt version source mismatch: {count}')
          p.write_text(text)
          p=Path('verify-prompt-semantics.mjs')
          p.write_text(p.read_text().replace("closed-loop-prompt-engine/26","closed-loop-prompt-engine/27"))
          runtime=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for filename in runtime:
              data=Path(filename).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              manifest+=f'{filename}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p=Path('index.html')
          text,count=re.subn(r'runtime-[0-9a-f]{16}',token,p.read_text())
          if count!=8: raise SystemExit(f'runtime token occurrence mismatch: {count}')
          p.write_text(text)
          print(token)
          PY
      - name: Prove capture once and automatic Stage 04 reuse
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 4acd4ad9795b053fed6952fbd8e95cda9912b08c -- app-core.js | wc -l)" -eq 0
          for file in workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js verify-one-time-intent-intake.mjs verify-test-runtime.mjs verify-complete.mjs verify-full-cycle.mjs verify-ingestion.mjs verify-prompt-semantics.mjs verify.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify-one-time-intent-intake.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          git diff --check
      - name: Commit proven code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js build-test-project.mjs verify-one-time-intent-intake.mjs verify-test-runtime.mjs verify-complete.mjs verify-full-cycle.mjs verify-ingestion.mjs verify-prompt-semantics.mjs verify.mjs index.html
          git diff --cached --check
          git commit -m 'Capture project intent once and reuse it in Stage 04'
          git push origin HEAD:fix/stage4-durable-accounting-current-main-20260830
