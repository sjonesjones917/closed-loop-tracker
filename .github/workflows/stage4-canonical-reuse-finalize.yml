name: Finalize Stage 04 canonical intent reuse
on:
  push:
    branches: [fix/stage04-canonical-intent-reuse-20260830]
    paths: [.github/workflows/stage4-canonical-reuse-finalize.yml]
permissions:
  contents: write
jobs:
  finalize-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage04-canonical-intent-reuse-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact deltas and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/stage4-canonical-reuse-apply.yml').read_text()
          start=source.index('          set -euo pipefail\n')
          end=source.index('      - name: Syntax checks\n',start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-stage4.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/apply-stage4.sh
          rm -f .github/workflows/stage4-canonical-reuse-apply.yml
          rm -f .github/workflows/stage4-canonical-reuse-finalize.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          test ! -e .stage4-fix
          test ! -e .stage4-canonical-reuse-payload
          grep -q 'Do not attach or resend the original intent file' workflow-engine.js
          ! grep -q 'function suppliedMaterialReferences' workflow-engine.js
          ! grep -q 'MATERIALS TO SEND WITH THIS STAGE 04 INSTRUCTION' prompt-engine.js
      - name: Syntax
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-test-runtime.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-complete.mjs
          node --check verify-browser.mjs
      - name: Deterministic and semantic proof
        run: |
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Chromium proof
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/stage4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for script in verify-browser.mjs verify-browser-extra.mjs; do
            success=false
            for attempt in 1 2 3; do
              if node "$script"; then success=true; break; fi
              test "$attempt" -lt 3 || exit 1
            done
            test "$success" = true
          done
      - name: Commit proved permanent correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-stage4-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -c '^\.github/workflows/' || true)" -eq 2
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          git commit -m 'Fix Stage 04 canonical intent reuse'
          git push origin HEAD:fix/stage04-canonical-intent-reuse-20260830
