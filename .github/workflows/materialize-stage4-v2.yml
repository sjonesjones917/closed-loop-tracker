name: Materialize Stage 4 canonical obligation accounting v2

on:
  push:
    branches:
      - fix/stage4-canonical-obligation-accounting-v2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-canonical-obligation-accounting-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure git
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "actions@users.noreply.github.com"
      - name: Align prompt contract wording
        run: sed -i 's/SOURCE_MATERIAL must equal the exact INPUT-UNIT ID/SOURCE_MATERIAL must be the exact INPUT-UNIT ID/' .github/scripts/materialize_stage4_v2.py
      - name: Materialize current-main repair
        run: python3 .github/scripts/materialize_stage4_v2.py
      - name: Finalize current-main Stage 4 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          engine=Path('workflow-engine.js')
          data=engine.read_text()
          old="if(stage>1)withhold.set('original Stage 01 intent file',{artifactIdOrCategory:'original Stage 01 intent file',reason:'One-time intake only. Later stages use the canonical intentStatements ledger and must not request, attach, resend, reopen, or rely on the original file.'});"
          new="if(stage>1&&stage!==4)withhold.set('original Stage 01 intent file',{artifactIdOrCategory:'original Stage 01 intent file',reason:'One-time intake only. Later stages use canonical project state and must not request, attach, resend, reopen, or rely on the original file.'});"
          if old not in data:
              raise SystemExit('expected later-stage intent withhold rule was not found')
          engine.write_text(data.replace(old,new,1))

          regression=Path('verify-one-time-intent-intake.mjs')
          r=regression.read_text()
          old="assert(handoff.conversationMaterials.length===0,'Stage 04 still creates a material resend payload.');\nassert(handoff.withhold.some(item=>item.artifactIdOrCategory==='original Stage 01 intent file'),'Stage 04 does not explicitly withhold the original intent file.');"
          new="assert(!handoff.send.length&&!handoff.withhold.length&&!handoff.expectBack.length&&!handoff.conversationMaterials.length&&!handoff.optionalApplicationCopies.length,'Stage 04 converted already-captured intent into an execution handoff instead of using canonical state.');"
          if old not in r:
              raise SystemExit('expected Stage 04 handoff regression assertion was not found')
          regression.write_text(r.replace(old,new,1))

          runtime_regression=Path('verify-test-runtime.mjs')
          t=runtime_regression.read_text()
          old="assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,1);assert.equal(stage4Handoff.withhold[0]?.artifactIdOrCategory,'original Stage 01 intent file');assert.equal(stage4Handoff.expectBack.length,0);assert.equal(stage4Handoff.conversationMaterials.length,0,'Stage 04 must not convert a supplied-material filename into a repeated external-conversation attachment.');assert.equal(stage4Handoff.optionalApplicationCopies.length,0);"
          new="assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,0,'Stage 04 must not convert prior intent into a synthetic withhold handoff item.');assert.equal(stage4Handoff.expectBack.length,0);assert.equal(stage4Handoff.conversationMaterials.length,0,'Stage 04 must not convert a supplied-material filename into a repeated external-conversation attachment.');assert.equal(stage4Handoff.optionalApplicationCopies.length,0);"
          if old not in t:
              raise SystemExit('expected legacy Stage 04 runtime handoff assertion was not found')
          runtime_regression.write_text(t.replace(old,new,1))

          semantics=Path('verify-prompt-semantics.mjs')
          s=semantics.read_text()
          old="if(prompts.version!=='closed-loop-prompt-engine/26')throw new Error('Persisted Stage 04 prompts were not invalidated after the canonical-input reuse repair.');"
          new="if(prompts.version!=='closed-loop-prompt-engine/27')throw new Error('Persisted Stage 04 prompts were not invalidated after the canonical obligation-accounting repair.');"
          if old not in s:
              raise SystemExit('expected /26 persisted-prompt regression was not found')
          semantics.write_text(s.replace(old,new,1))

          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for file in runtime_files:
              b=Path(file).read_bytes()
              blob=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
              manifest+=f'{file}:{blob}\n'
          build='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          html=Path('index.html')
          h=html.read_text()
          h,n=re.subn(r'(\?v=)[A-Za-z0-9._-]+',lambda m:m.group(1)+build,h)
          if n!=len(runtime_files):
              raise SystemExit(f'expected {len(runtime_files)} runtime cache tokens, changed {n}')
          html.write_text(h)
          PY
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check workbook.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check verify-one-time-intent-intake.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-ingestion.mjs
          node --check verify-test-runtime.mjs
          node --check verify-hash.mjs
          node --check verify.mjs
      - name: Targeted Stage 01 and Stage 04 mutation proof
        run: node verify-one-time-intent-intake.mjs
      - name: Prompt, ingestion, runtime, hash, and lifecycle proof
        run: |
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit tested repair
        run: |
          git add -A
          git commit -m "Close Stage 4 obligation accounting on current main"
          git push origin HEAD:fix/stage4-canonical-obligation-accounting-v2