name: Finalize Stage 01 retained state once
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths: [.github/workflows/finalize-stage1-once.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair retained Stage 01 canonicalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js'); s=p.read_text()
          old="engine.ensureShape(p);engine.recalculate(p);return p;}\nfunction importSeed(raw)"
          new="engine.ensureShape(p);if(typeof engine.migrateLegacyStage01Accounting==='function')engine.migrateLegacyStage01Accounting(p);engine.recalculate(p);return p;}\nfunction importSeed(raw)"
          if old in s: p.write_text(s.replace(old,new,1))
          PY
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const id='runtime-'+crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16);
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|test-runtime|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)runtime-[a-f0-9]{16}("\s*><\/script>)/g,`$1${id}$2`);
          fs.writeFileSync('index.html',html);console.log(id);
          NODE
      - name: Complete non-browser proof
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-v3-migration.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-single-supply-prompts.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Browser acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit proven repair
        run: |
          git config user.name closed-loop-integrator
          git config user.email closed-loop-integrator@users.noreply.github.com
          git add app-core.js index.html
          git commit -m 'Canonicalize retained Stage 01 accounting on every app load path'
          git push origin HEAD:implementation/closed-loop-v3
