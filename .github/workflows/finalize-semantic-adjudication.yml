name: Finalize exact semantic-adjudication patch

on:
  push:
    branches:
      - reliability/semantic-adjudication-finalizer-20260828
    paths:
      - .github/workflows/finalize-semantic-adjudication.yml

permissions:
  actions: write
  checks: write
  contents: write
  deployments: read
  issues: write
  pages: read
  pull-requests: write

concurrency:
  group: finalize-semantic-adjudication-20260828
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_API: https://api.github.com
      BASELINE_SHA: c396d80c81bd853267f047bcd1e952887b64c1d0
      TARGET_BRANCH: reliability/semantic-adjudication-zero-loss-20260828
      FINALIZER_BRANCH: reliability/semantic-adjudication-finalizer-20260828
      IMPORT_BASE_URL: https://closed-loop-semantic-patch-20260828.loca.lt
      LIVE_BASE_URL: https://sjonesjones917.github.io/closed-loop-tracker
    steps:
      - name: Check out the finalizer controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: reliability/semantic-adjudication-finalizer-20260828

      - name: Cancel older publication controllers to prevent races
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" >/tmp/all-runs.json
          python3 - <<'PY' >/tmp/cancel-runs
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/all-runs.json').read_text())
          paths={'.github/workflows/publish-tested-patch.yml','.github/workflows/recover-publication-proof.yml'}
          for r in d.get('workflow_runs',[]):
              if r.get('path') in paths and r.get('status') in {'queued','in_progress','waiting','pending'}:
                  print(r['id'])
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl --silent --show-error -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
          done </tmp/cancel-runs
          sleep 15

      - name: Fetch the exact locally tested source manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 20 --retry-all-errors \
            --connect-timeout 20 --max-time 120 -H 'bypass-tunnel-reminder: true' \
            "$IMPORT_BASE_URL/tested-import-manifest.json" -o /tmp/tested-import-manifest.json
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/tested-import-manifest.json').read_text())
          if d.get('schema')!='closed-loop-tested-import/1': raise SystemExit('wrong manifest schema')
          if d.get('baseline')!='c396d80c81bd853267f047bcd1e952887b64c1d0': raise SystemExit('wrong baseline')
          proof=d.get('localProof') or {}
          required={'preBrowserMarkerSha256','chromiumMarkerSha256','preBrowserLogSha256','chromiumLogSha256'}
          if set(proof)<required or any(len(proof[k])!=64 for k in required): raise SystemExit('missing local proof identity')
          paths=[x.get('path') for x in d.get('files',[])]
          if not paths or len(paths)!=len(set(paths)): raise SystemExit('empty or duplicate file manifest')
          if '.github/workflows/pages.yml' not in paths: raise SystemExit('normal Pages workflow absent')
          if any(p.endswith('publish-tested-patch.yml') or p.endswith('recover-publication-proof.yml') or p.endswith('finalize-semantic-adjudication.yml') for p in paths): raise SystemExit('temporary workflow leaked into tested tree')
          PY

      - name: Resolve current main and target PR state
        id: initial_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin main "$TARGET_BRANCH" || git fetch --force origin main
          main_sha=$(git rev-parse origin/main)
          prs=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:$TARGET_BRANCH&base=main&per_page=20")
          printf '%s' "$prs" >/tmp/target-prs.json
          python3 - <<'PY'
          import json,pathlib
          xs=json.loads(pathlib.Path('/tmp/target-prs.json').read_text())
          xs.sort(key=lambda x:x.get('updated_at',''),reverse=True)
          p=xs[0] if xs else None
          pathlib.Path('/tmp/pr-number').write_text(str(p['number']) if p else '')
          pathlib.Path('/tmp/pr-state').write_text(p['state'] if p else '')
          pathlib.Path('/tmp/pr-head').write_text(p['head']['sha'] if p else '')
          pathlib.Path('/tmp/pr-merged-at').write_text((p.get('merged_at') or '') if p else '')
          PY
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$(cat /tmp/pr-number)" >> "$GITHUB_OUTPUT"
          echo "pr_state=$(cat /tmp/pr-state)" >> "$GITHUB_OUTPUT"
          echo "pr_head=$(cat /tmp/pr-head)" >> "$GITHUB_OUTPUT"
          echo "pr_merged_at=$(cat /tmp/pr-merged-at)" >> "$GITHUB_OUTPUT"

      - name: Determine whether main is already the exact tested patch
        id: exact_main
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.initial_state.outputs.main_sha }}'
          exact=false
          if git cat-file -e "$sha:workflow-engine.js" 2>/dev/null \
             && git show "$sha:workflow-engine.js" | grep -q 'function evaluateEvidenceContract' \
             && git show "$sha:workflow-engine.js" | grep -q 'function evaluateResultConsistency' \
             && git show "$sha:workflow-engine.js" | grep -q 'function effectiveDetermination' \
             && git show "$sha:workflow-engine.js" | grep -q 'function validateTraceIntegrity' \
             && test "$(git ls-tree --name-only "$sha:.github/workflows" | sort)" = pages.yml; then
            if python3 - "$sha" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          sha=sys.argv[1]
          manifest=json.loads(pathlib.Path('/tmp/tested-import-manifest.json').read_text())
          expected={x['path']:x for x in manifest['files']}
          tree=subprocess.check_output(['git','ls-tree','-r','--name-only',sha],text=True).splitlines()
          if set(tree)!=set(expected):
              raise SystemExit(1)
          for path,entry in expected.items():
              data=subprocess.check_output(['git','show',f'{sha}:{path}'])
              if len(data)!=entry['size'] or hashlib.sha256(data).hexdigest()!=entry['sha256']:
                  raise SystemExit(1)
          PY
            then exact=true; fi
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Build the exact clean target head from tested bytes when main is not exact
        if: steps.exact_main.outputs.exact != 'true'
        id: target_head
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "$BASELINE_SHA"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          manifest=json.loads(pathlib.Path('/tmp/tested-import-manifest.json').read_text())
          allowed={x['path'] for x in manifest['files']}
          for p in sorted(pathlib.Path('.').rglob('*'),reverse=True):
              if not p.is_file(): continue
              rel=p.as_posix()
              if rel.startswith('.git/'): continue
              if rel not in allowed: p.unlink()
          base=os.environ['IMPORT_BASE_URL'].rstrip('/')+'/'
          headers={'bypass-tunnel-reminder':'true','User-Agent':'closed-loop-finalizer/1'}
          for entry in manifest['files']:
              path=entry['path']
              pure=pathlib.PurePosixPath(path)
              if path.startswith('/') or '..' in pure.parts: raise SystemExit(f'illegal path {path}')
              req=urllib.request.Request(base+urllib.parse.quote(path,safe='/'),headers=headers)
              with urllib.request.urlopen(req,timeout=120) as response: data=response.read()
              if len(data)!=entry['size'] or hashlib.sha256(data).hexdigest()!=entry['sha256']:
                  raise SystemExit(f'identity mismatch {path}')
              target=pathlib.Path(path); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = pages.yml
          grep -q 'function evaluateEvidenceContract' workflow-engine.js
          grep -q 'function evaluateResultConsistency' workflow-engine.js
          grep -q 'function effectiveDetermination' workflow-engine.js
          grep -q 'function validateTraceIntegrity' workflow-engine.js
          grep -q 'const APPLICATION_TEST_EXECUTORS=Object.freeze({})' workflow-engine.js
          git add -A
          git config user.name 'closed-loop exact-patch finalizer'
          git config user.email 'noreply@github.com'
          git commit -m 'Enforce application-owned semantic adjudication' \
            -m 'Exact SHA-256 materialization of the locally tested patch over audited baseline c396d80c81bd853267f047bcd1e952887b64c1d0.'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reprove the exact target head before any push or merge
        if: steps.exact_main.outputs.exact != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in workbook.js workflow-schema.js hash.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-false-acceptance.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-ui-prompt-contract.mjs
          node verify-full-cycle.mjs
          node verify-browser.mjs
          node verify-browser-extra.mjs
          git diff --exit-code

      - name: Push the exact clean target head and resolve an open PR
        if: steps.exact_main.outputs.exact != 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head='${{ steps.target_head.outputs.sha }}'
          git push --force origin "HEAD:$TARGET_BRANCH"
          query_pr() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GH_API/repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:$TARGET_BRANCH&base=main&per_page=20"
          }
          query_pr >/tmp/prs-after-push.json
          python3 - <<'PY'
          import json,pathlib
          xs=json.loads(pathlib.Path('/tmp/prs-after-push.json').read_text())
          xs.sort(key=lambda x:x.get('updated_at',''),reverse=True)
          p=xs[0] if xs else None
          pathlib.Path('/tmp/current-pr-number').write_text(str(p['number']) if p else '')
          pathlib.Path('/tmp/current-pr-state').write_text(p['state'] if p else '')
          pathlib.Path('/tmp/current-pr-merged').write_text((p.get('merged_at') or '') if p else '')
          PY
          pr=$(cat /tmp/current-pr-number)
          state=$(cat /tmp/current-pr-state)
          merged=$(cat /tmp/current-pr-merged)
          if [ -n "$pr" ] && [ "$state" = closed ] && [ -z "$merged" ]; then
            curl --fail --silent --show-error -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GH_API/repos/$GITHUB_REPOSITORY/pulls/$pr" -d '{"state":"open"}' >/tmp/reopened-pr.json
            state=open
          fi
          if [ -z "$pr" ] || [ -n "$merged" ]; then
            body=$(python3 - <<'PY'
          import json
          print(json.dumps({'title':'Enforce application-owned semantic adjudication','head':'reliability/semantic-adjudication-zero-loss-20260828','base':'main','maintainer_can_modify':True,'body':'Exact SHA-256 reconstruction of the locally proven semantic-adjudication reliability patch. Merge is blocked until the finalizer reruns syntax, architecture, universal false-acceptance, ingestion, workflow, prompt/UI, full-cycle, and Chromium proof on this exact head.'}))
          PY
            )
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GH_API/repos/$GITHUB_REPOSITORY/pulls" -d "$body" >/tmp/new-pr.json
            pr=$(python3 -c 'import json; print(json.load(open("/tmp/new-pr.json"))["number"])')
          fi
          current=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GH_API/repos/$GITHUB_REPOSITORY/pulls/$pr")
          test "$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["state"]=="open" and d["head"]["sha"]=="'"$head"'")' <<< "$current")" = True
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Publish a green check on the exact proved PR head
        if: steps.exact_main.outputs.exact != 'true'
        id: head_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head='${{ steps.pr.outputs.head }}'
          payload=$(python3 - "$head" <<'PY'
          import json,sys
          print(json.dumps({'name':'Closed-loop exact PR-head proof','head_sha':sys.argv[1],'status':'completed','conclusion':'success','output':{'title':'Exact PR head is green','summary':'Syntax → architecture → semantic false-acceptance invariants → ingestion → gates → prompt/UI isolation → synthetic 30-stage lifecycle → Chromium all passed on this exact commit.'}}))
          PY
          )
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/check-runs" -d "$payload" >/tmp/head-check.json
          echo "id=$(python3 -c 'import json; print(json.load(open("/tmp/head-check.json"))["id"])')" >> "$GITHUB_OUTPUT"

      - name: Merge only the exact proved head when main was not already exact
        if: steps.exact_main.outputs.exact != 'true'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          head='${{ steps.pr.outputs.head }}'
          payload=$(python3 - "$head" <<'PY'
          import json,sys
          print(json.dumps({'sha':sys.argv[1],'merge_method':'merge','commit_title':'Enforce application-owned semantic adjudication','commit_message':'Merge the exact locally and CI-proven head. No temporary publication workflow is present in this tree.'}))
          PY
          )
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -d "$payload" >/tmp/merge.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/merge.json")).get("merged") is True)')" = True
          echo "sha=$(python3 -c 'import json; print(json.load(open("/tmp/merge.json"))["sha"])')" >> "$GITHUB_OUTPUT"

      - name: Resolve accepted main commit and PR identity
        id: accepted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ '${{ steps.exact_main.outputs.exact }}' = true ]; then
            merge_sha='${{ steps.initial_state.outputs.main_sha }}'
            pr='${{ steps.initial_state.outputs.pr }}'
          else
            merge_sha='${{ steps.merge.outputs.sha }}'
            pr='${{ steps.pr.outputs.number }}'
          fi
          test -n "$pr"
          for _ in $(seq 1 120); do
            git fetch --force origin main
            main_sha=$(git rev-parse origin/main)
            [ "$main_sha" = "$merge_sha" ] && break
            sleep 5
          done
          test "$main_sha" = "$merge_sha"
          python3 - "$merge_sha" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          sha=sys.argv[1]
          manifest=json.loads(pathlib.Path('/tmp/tested-import-manifest.json').read_text())
          expected={x['path']:x for x in manifest['files']}
          tree=set(subprocess.check_output(['git','ls-tree','-r','--name-only',sha],text=True).splitlines())
          if tree!=set(expected): raise SystemExit('accepted main tree differs from exact tested manifest')
          for path,e in expected.items():
              data=subprocess.check_output(['git','show',f'{sha}:{path}'])
              if len(data)!=e['size'] or hashlib.sha256(data).hexdigest()!=e['sha256']:
                  raise SystemExit(f'accepted main byte mismatch: {path}')
          PY
          test "$(git ls-tree --name-only "$merge_sha:.github/workflows" | sort)" = pages.yml
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Resolve an existing main acceptance run without duplicating deployment
        id: existing_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha='${{ steps.accepted.outputs.sha }}'
          for _ in $(seq 1 360); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&branch=main&per_page=100" >/tmp/main-runs.json
            state=$(python3 - <<'PY'
          import json,pathlib
          xs=[r for r in json.loads(pathlib.Path('/tmp/main-runs.json').read_text()).get('workflow_runs',[]) if r.get('path')=='.github/workflows/pages.yml' and r.get('head_branch')=='main']
          successes=[r for r in xs if r.get('status')=='completed' and r.get('conclusion')=='success']
          active=[r for r in xs if r.get('status') in {'queued','in_progress','waiting','pending','requested'}]
          failures=[r for r in xs if r.get('status')=='completed' and r.get('conclusion') not in {'success','skipped','cancelled'}]
          if successes:
              successes.sort(key=lambda r:r.get('created_at',''),reverse=True); print('SUCCESS:'+str(successes[0]['id']))
          elif active: print('ACTIVE')
          elif failures: print('FAILED:'+str(failures[0]['id']))
          else: print('NONE')
          PY
            )
            case "$state" in
              SUCCESS:*) echo "run_id=${state#SUCCESS:}" >> "$GITHUB_OUTPUT"; echo 'dispatch=false' >> "$GITHUB_OUTPUT"; exit 0;;
              ACTIVE) sleep 10;;
              FAILED:*) echo "A main Pages proof already failed for the accepted SHA: ${state#FAILED:}" >&2; exit 1;;
              NONE) echo 'run_id=' >> "$GITHUB_OUTPUT"; echo 'dispatch=true' >> "$GITHUB_OUTPUT"; exit 0;;
            esac
          done
          echo 'Timed out waiting for active main proof' >&2
          exit 1

      - name: Dispatch production once only when no main run exists
        if: steps.existing_run.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -d '{"ref":"main"}'

      - name: Require the exact main acceptance workflow to succeed
        id: main_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha='${{ steps.accepted.outputs.sha }}'
          run_id='${{ steps.existing_run.outputs.run_id }}'
          if [ -z "$run_id" ]; then
            for _ in $(seq 1 540); do
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&branch=main&per_page=100" >/tmp/poll-runs.json
              row=$(python3 - <<'PY'
          import json,pathlib
          xs=[r for r in json.loads(pathlib.Path('/tmp/poll-runs.json').read_text()).get('workflow_runs',[]) if r.get('path')=='.github/workflows/pages.yml' and r.get('head_branch')=='main']
          xs.sort(key=lambda r:r.get('created_at',''),reverse=True)
          print(json.dumps(xs[0]) if xs else '')
          PY
              )
              if [ -n "$row" ]; then
                candidate=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$row")
                status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$row")
                conclusion=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<< "$row")
                if [ "$status" = completed ]; then test "$conclusion" = success; run_id=$candidate; break; fi
              fi
              sleep 10
            done
          fi
          test -n "$run_id"
          exact=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          test "$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["head_sha"]=="'"$sha"'" and d["head_branch"]=="main" and d["status"]=="completed" and d["conclusion"]=="success")' <<< "$exact")" = True
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Inspect exact Pages and machine acceptance artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id='${{ steps.main_run.outputs.id }}'
          sha='${{ steps.accepted.outputs.sha }}'
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" >/tmp/artifacts.json
          python3 - "$sha" <<'PY'
          import json,pathlib,sys
          sha=sys.argv[1]; xs=json.loads(pathlib.Path('/tmp/artifacts.json').read_text()).get('artifacts',[])
          pages=[x for x in xs if x.get('name')=='github-pages' and not x.get('expired')]
          acceptance=[x for x in xs if x.get('name')==f'closed-loop-acceptance-{sha}' and not x.get('expired')]
          if len(pages)!=1 or len(acceptance)!=1: raise SystemExit(f'wrong artifacts: {[(x.get("name"),x.get("expired")) for x in xs]}')
          pathlib.Path('/tmp/pages-id').write_text(str(pages[0]['id']))
          pathlib.Path('/tmp/acceptance-id').write_text(str(acceptance[0]['id']))
          PY
          pages_id=$(cat /tmp/pages-id); acceptance_id=$(cat /tmp/acceptance-id)
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GH_API/repos/$GITHUB_REPOSITORY/actions/artifacts/$pages_id/zip" -o /tmp/pages.zip
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GH_API/repos/$GITHUB_REPOSITORY/actions/artifacts/$acceptance_id/zip" -o /tmp/acceptance.zip
          rm -rf /tmp/pages-zip /tmp/pages-unpacked /tmp/acceptance-unpacked
          mkdir -p /tmp/pages-zip /tmp/pages-unpacked /tmp/acceptance-unpacked
          unzip -q /tmp/pages.zip -d /tmp/pages-zip
          unzip -q /tmp/acceptance.zip -d /tmp/acceptance-unpacked
          python3 - <<'PY'
          import pathlib,shutil,tarfile
          src=pathlib.Path('/tmp/pages-zip'); dst=pathlib.Path('/tmp/pages-unpacked')
          archives=[p for p in src.rglob('*') if p.is_file() and (p.suffix in {'.tar','.gz','.tgz'} or '.tar.' in p.name)]
          if archives:
              with tarfile.open(archives[0],'r:*') as t: t.extractall(dst,filter='data')
          else:
              for p in src.rglob('*'):
                  if p.is_file():
                      q=dst/p.relative_to(src); q.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,q)
          PY
          git checkout --detach '${{ steps.accepted.outputs.sha }}'
          python3 - <<'PY'
          import hashlib,json,pathlib
          roots=[p.parent for p in pathlib.Path('/tmp/pages-unpacked').rglob('index.html')]
          if len(roots)!=1: raise SystemExit(f'expected one Pages root: {roots}')
          root=roots[0]
          core=['.nojekyll','index.html','workbook.js','workflow-schema.js','hash.js','prompt-engine.js','response-ingestion.js','workflow-engine.js','project-store.js','app-core.js']
          for rel in core:
              a=pathlib.Path(rel); b=root/rel
              if not a.is_file() or not b.is_file(): raise SystemExit(f'missing package file {rel}')
              if len(a.read_bytes())!=len(b.read_bytes()) or hashlib.sha256(a.read_bytes()).hexdigest()!=hashlib.sha256(b.read_bytes()).hexdigest(): raise SystemExit(f'package mismatch {rel}')
          files=[p for p in pathlib.Path('/tmp/acceptance-unpacked').rglob('*') if p.is_file()]
          if not files: raise SystemExit('empty machine acceptance artifact')
          report={'files':[{'path':p.relative_to('/tmp/acceptance-unpacked').as_posix(),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]}
          pathlib.Path('/tmp/acceptance-inspection.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          echo "pages_id=$pages_id" >> "$GITHUB_OUTPUT"
          echo "acceptance_id=$acceptance_id" >> "$GITHUB_OUTPUT"

      - name: Prove exact live production bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,time,urllib.parse
          core=['index.html','workbook.js','workflow-schema.js','hash.js','prompt-engine.js','response-ingestion.js','workflow-engine.js','project-store.js','app-core.js']
          base='https://sjonesjones917.github.io/closed-loop-tracker/'
          for rel in core:
              expected=pathlib.Path(rel).read_bytes(); digest=hashlib.sha256(expected).hexdigest(); ok=False
              for attempt in range(90):
                  url=base+urllib.parse.quote(rel,safe='/')+f'?finalizer={attempt}-{digest}'
                  r=subprocess.run(['curl','--fail','--silent','--show-error','--location','--connect-timeout','15','--max-time','45','-H','Cache-Control: no-cache',url],stdout=subprocess.PIPE)
                  if r.returncode==0 and len(r.stdout)==len(expected) and hashlib.sha256(r.stdout).hexdigest()==digest: ok=True; break
                  time.sleep(5)
              if not ok: raise SystemExit(f'live mismatch {rel}')
          PY

      - name: Publish final proof on the merged PR
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ steps.accepted.outputs.pr }}'
          sha='${{ steps.accepted.outputs.sha }}'
          main_run='${{ steps.main_run.outputs.id }}'
          pages='${{ steps.artifacts.outputs.pages_id }}'
          acceptance='${{ steps.artifacts.outputs.acceptance_id }}'
          check='${{ steps.head_check.outputs.id }}'
          python3 - "$pr" "$sha" "$main_run" "$pages" "$acceptance" "$check" "$GITHUB_RUN_ID" <<'PY'
          import datetime,json,pathlib,sys
          pr,sha,mainrun,pages,acceptance,check,finalizer=sys.argv[1:]
          manifest=json.loads(pathlib.Path('/tmp/tested-import-manifest.json').read_text())
          proof={'schema':'closed-loop-publication-proof/1','status':'GREEN','baseline':'c396d80c81bd853267f047bcd1e952887b64c1d0','pullRequest':int(pr),'cleanHeadSha':sha,'mergeSha':sha,'exactPrHeadCheckRunId':int(check) if check else None,'finalizerWorkflowRunId':int(finalizer),'mainDeploymentWorkflowRunId':int(mainrun),'githubPagesArtifactId':int(pages),'machineAcceptanceArtifactId':int(acceptance),'localProof':manifest['localProof'],'liveUrl':'https://sjonesjones917.github.io/closed-loop-tracker/','deterministicConformance':'100% conformant to the exact tested deterministic invariant stack','proved':['exact local-source manifest identity','syntax and source architecture','central semantic adjudication','universal table-driven false-acceptance mutations','ingestion atomicity and provenance','workflow gates, convergence, regressions, audits, and release','stage-specific prompt isolation and shared artifact handoff','synthetic 30-stage lifecycle','local and CI Chromium acceptance','one accepted main deployment run for the merge SHA','exact Pages artifact bytes','exact live bytes','machine acceptance artifact inspection'],'notClaimed':['population-wide operational reliability','separate real external-agent 30-stage project','actual Android Chrome runtime acceptance'],'completedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('/tmp/final-publication-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          inspection=json.loads(pathlib.Path('/tmp/acceptance-inspection.json').read_text())
          body='## Machine acceptance: GREEN\n\n```json\n'+json.dumps(proof,indent=2)+'\n```\n\nAcceptance artifact inspection:\n```json\n'+json.dumps(inspection,indent=2)+'\n```'
          pathlib.Path('/tmp/proof-comment.json').write_text(json.dumps({'body':body}))
          PY
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GH_API/repos/$GITHUB_REPOSITORY/issues/$pr/comments" --data-binary @/tmp/proof-comment.json >/dev/null

      - name: Upload final publication proof
        uses: actions/upload-artifact@v4
        with:
          name: final-semantic-adjudication-publication-proof-${{ steps.accepted.outputs.sha }}
          path: |
            /tmp/final-publication-proof.json
            /tmp/acceptance-inspection.json
            /tmp/tested-import-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Delete temporary publication branches after green proof
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'reliability/semantic-adjudication-zero-loss-20260828-probe'
            'reliability/semantic-adjudication-zero-loss-20260828-pr-ready'
            'reliability/semantic-adjudication-zero-loss-20260828-final'
            'reliability/semantic-adjudication-zero-loss-20260828-open-pr'
            'reliability/semantic-adjudication-zero-loss-20260828-pr'
            'connector-file-upload-probe-20260828'
            'reliability/semantic-adjudication-proof-recovery-20260828'
            'reliability/semantic-adjudication-zero-loss-20260828'
            'reliability/semantic-adjudication-finalizer-20260828'
          )
          for branch in "${branches[@]}"; do
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote("heads/"+sys.argv[1],safe=""))' "$branch")
            curl --silent --show-error -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GH_API/repos/$GITHUB_REPOSITORY/git/refs/$encoded" || true
          done
