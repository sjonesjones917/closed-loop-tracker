name: Apply future-stage action correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/future-stage-action-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply browser-validated app-core corrections
        shell: python
        run: |
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          def once(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'expected one match, found {s.count(old)}')
              s=s.replace(old,new,1)
          old="function currentNextAction(){const value=current?.job?.NEXT_REQUIRED_ACTION;if(value&&typeof value==='object'&&!Array.isArray(value))return value;return {actionType:'PASTE_FINAL_JSON',heading:'Next required action',explanation:String(value||'No next action recorded.'),primaryButton:null,secondaryAction:null,filesToSend:[],filesToWithhold:[],expectedReturnFiles:[],blockingReason:null,canonicalStateChanged:false,acceptedChange:null,downstreamInvalidated:[],newPromptRequired:false};}"
          once(old,old+"\nfunction displayedStageAction(n){const stage=Number(n||canonicalCurrentStage()),lock=stageLocked(stage);if(stage!==canonicalCurrentStage()&&lock)return {actionType:'BLOCKED',heading:'This stage is not ready',explanation:`${lock} Complete the prerequisite stages in order. Do not send a prompt or paste a response for this stage yet.`,primaryButton:null,secondaryAction:null,filesToSend:[],filesToWithhold:[],expectedReturnFiles:[],blockingReason:lock,canonicalStateChanged:false,acceptedChange:null,downstreamInvalidated:[],newPromptRequired:false};return currentNextAction();}")
          once("function nextActionMarkup(withPrimaryButton=true){const action=currentNextAction(),button=","function nextActionMarkup(withPrimaryButton=true,stage=canonicalCurrentStage()){const action=displayedStageAction(stage),button=")
          once("if([23,24].includes(Number(n))&&!currentReviewerContext(n))return 'CONTROLLING INSTRUCTION UNAVAILABLE\\n\\nOpen a fresh independent reviewer context and register its identifier above. The application will bind that reviewer identity into the controlling prompt before it can be saved or copied.';","if([23,24].includes(Number(n))&&!currentReviewerContext(n))return 'CONTROLLING INSTRUCTION UNAVAILABLE\\n\\nThis stage requires a fresh independent reviewer context before its controlling prompt can be created. Complete the prerequisite stages first. When this stage becomes current, register the new external reviewer context using the reviewer-context control shown on this stage. The application will then bind that identity into the controlling prompt before it can be saved or copied.';")
          once("function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1);","function interactionModeMarkup(n){const pending=pendingProposal(),latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),accepted=acceptedLaneChanges(n).at(-1),requests=safe(current.projectData.humanInputRequests).filter(x=>Number(x.stage)===n&&String(x.status||'OPEN').toUpperCase()==='OPEN'),abandoned=safe(current.projectData.responseDispositions).filter(x=>Number(x.stage)===n&&x.type==='ABANDONED_RESPONSE').at(-1),lockReason=stageLocked(n);")
          once("if(abandoned)return `<div class=\"notice\"><strong>The pending attempt was discarded.</strong><br>Canonical accepted work changed: NO · Audit state changed: YES · New prompt required: YES. Use only the newly generated authoritative prompt; the abandoned response cannot be accepted later.</div>`;if(requests.length||n===1&&!current.stages[1].responseDraft)return","if(abandoned)return `<div class=\"notice\"><strong>The pending attempt was discarded.</strong><br>Canonical accepted work changed: NO · Audit state changed: YES · New prompt required: YES. Use only the newly generated authoritative prompt; the abandoned response cannot be accepted later.</div>`;if(lockReason)return `<div class=\"notice warn\"><strong>No external response is expected yet.</strong><br>${esc(lockReason)} Complete the prerequisite stages in order before sending a prompt or pasting final JSON for this stage.</div>`;if(requests.length||n===1&&!current.stages[1].responseDraft)return")
          once("<span>${esc(current.job.CURRENT_STATE)}</span><span>${esc(currentNextAction().heading||currentNextAction().actionType)}</span>","<span>${esc(current.job.CURRENT_STATE)}</span><span>${esc(displayedStageAction(n).heading||displayedStageAction(n).actionType)}</span>")
          once("${nextActionMarkup(false)}${locked?","${nextActionMarkup(false,n)}${locked?")
          p.write_text(s)
      - name: Remove one-time workflow and commit patch
        run: |
          git rm .github/workflows/one-time-future-stage-action-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js
          git commit -m "Fix locked future-stage operator guidance"
          git push origin HEAD:${{ github.head_ref }}
