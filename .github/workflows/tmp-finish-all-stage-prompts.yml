name: Apply complete all-stage prompt functionality
on:
  push:
    branches: [fix/complete-all-stage-prompts-main-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-all-stage-prompts-main-20260830
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('prompt-engine.js')
          s=p.read_text()
          s=re.sub(r"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/\d+';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/35';",s,1)

          duplicate="The original Stage 01 intent file is prohibited input: never request it, attach it, resend it, reopen it, or rely on an earlier conversation that contains it. The original Stage 01 intent file is prohibited input: never request it, attach it, resend it, reopen it, or rely on an earlier conversation that contains it."
          single="The original Stage 01 intent file is prohibited input: never request it, attach it, resend it, reopen it, or rely on an earlier conversation that contains it."
          s=s.replace(duplicate,single)

          old3="Do not finalize Stage 03 until every current accepted Stage 02 source has current research coverage, every requirement-relevant canonical intent statement has candidate-obligation coverage, and a distinct conflict/exception/saturation pass finds no new material requirement category."
          new3="Do not finalize Stage 03 until every current accepted Stage 02 source has current research coverage, every requirement-relevant canonical intent statement has candidate-obligation coverage, and a complete conflict/exception/saturation pass finds no new material requirement category, obligation, exception, restriction, dependency, applicability fact, conflict, supersession issue, or invalidating condition. If a pass discovers any new such material, incorporate it and run another complete pass over the entire current source set; repeat until the latest complete pass finds nothing new."
          if old3 not in s: raise SystemExit('Stage 03 completion anchor missing')
          s=s.replace(old3,new3,1)

          old22="22:'Perform the substantive deterministic verification work that is actually supported against the finished product and report procedures, expected results, actual observed results, evidence, and defects. Use specialized deterministic tools when the authorized execution context provides them. Objective artifact identities, byte sizes, cryptographic hashes, expected test-set completeness, counts, and final gate calculations are application-owned. Never claim an unexecuted deterministic check ran.',"
          new22="22:'Handle only deterministic finished-product verification that the application has routed to an external deterministic executor. Every current supported APPLICATION_DETERMINISTIC Test IR is executed by the application worker and produces application-owned observations/results; do not impersonate, repeat, or fabricate native execution. For each externally routed deterministic test, use exactly the declared capability, exact current finished-product bytes, exact test definition, and required evidence contract. Report actual procedure, expected result, observed result, attributable tool/system evidence, returned artifacts, and defects. If the required external capability or bytes are unavailable, return the correct blocker, execution failure, or undetermined result instead of a synthetic pass. Objective artifact identities, byte sizes, cryptographic hashes, native results, expected test-set completeness, counts, and final gate calculations are application-owned.',"
          if old22 not in s: raise SystemExit('Stage 22 procedure anchor missing')
          s=s.replace(old22,new22,1)

          old23="23:'Perform independent meaning/content verification on the actual finished product where deterministic checks cannot establish substantive satisfaction. For each applicable requirement preserve product location, source evidence where applicable, required meaning, observed meaning, evidence-based comparison, SATISFIED/VIOLATED/UNDETERMINED, defect, and reason a determination could not be made. For engineering artifacts, meaning review includes whether dimensions, tolerances, interfaces, notes, symbols, manufacturing intent, and other human-interpreted meaning communicate the required design unambiguously.',"
          new23="23:'Perform independent meaning/content verification on the actual finished product only where deterministic checks cannot establish substantive satisfaction. Use the exact current requirement, applicable governing evidence, current product, and authorized meaning test/rubric supplied by the application. For each applicable requirement preserve exact product location, source evidence where applicable, required meaning, observed meaning, evidence-based comparison, SATISFIED/VIOLATED/UNDETERMINED, defect, and reason a determination could not be made. Derive every project-specific review dimension from the current requirements, governing evidence, artifact semantics, interfaces, transformations, and acceptance conditions; do not inject a hard-coded project-subject checklist. Remain independent from the generator and do not rely on generator self-evaluation, prior meaning-review conclusions, adversarial conclusions, or unnecessary deterministic pass status.',"
          if old23 not in s: raise SystemExit('Stage 23 procedure anchor missing')
          s=s.replace(old23,new23,1)

          old25="25:'Inspect the exact final delivered representation and package. Report substantive rendering/opening observations, clipping, missing or blank content, broken layout, graphics, font substitution, overlap, hidden content, ordering, export corruption, package problems, defects, and irreducible human/reviewer judgments. For drawings, CAD/CAM, CNC, and additive-manufacturing artifacts, inspect every required view/representation and verify that human-visible units, scales, datums/coordinates, dimensions/tolerances, notes, revision identifiers, and manufacturing information are present and coherent where applicable. The application derives canonical artifact inventory, filenames, byte sizes, SHA-256 values, and other objective file facts from actual stored bytes.',"
          new25="25:'Inspect the exact final delivered representation and package. Open or inspect every required current product/delivery artifact, representation, page or view, transformation, and packaged file through the correct capable route. Report substantive rendering/opening observations, clipping, missing or blank content, broken layout, graphics/font problems, overlap, hidden content, ordering, transformation/export corruption, package problems, defects, and irreducible human/reviewer judgments. Derive every required inspection dimension from the current requirements, governing evidence, artifact semantics, transformation chain, and delivery contract; do not inject a hard-coded project-subject checklist. The application derives canonical artifact inventory, filenames, versions, byte sizes, SHA-256 values, transformation identity, and other objective file facts from actual stored bytes.',"
          if old25 not in s: raise SystemExit('Stage 25 procedure anchor missing')
          s=s.replace(old25,new25,1)

          oldcap="This static browser is not a universal compiler, script runner, CAD/CAE tool, lab, or machine controller."
          s=s.replace(oldcap,"This static browser is not a universal compiler, arbitrary script runner, specialized external tool, laboratory, or physical machine controller.")

          anchor="function contextFor(stage,state,operation,scope={}){\n const parts=[];\n"
          addition="function contextFor(stage,state,operation,scope={}){\n const parts=[];\n if(stage>1){parts.push('DURABLE PROJECT MEMORY — CURRENT HUMAN AUTHORITY AND ACCEPTED STAGE 01 SEMANTIC CAPTURE — DO NOT ASK THE HUMAN TO RESUPPLY IT\\n'+show({humanJobInput:Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>[name,state?.job?.[name]??null])),acceptedStage01:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:state?.stages?.[1]?.derivedData||{}},intentStatements:(state?.projectData?.intentStatements||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy),currentInputVersion:state?.job?.CURRENT_INPUT_VERSION||null}));}\n if(stage===4){parts.push('COMPLETE STAGE 04 INPUT UNION — APPLICATION SELECTED; DO NOT REDISCOVER OR ASK THE HUMAN TO REPEAT IT\\n'+show({stage01:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:state?.stages?.[1]?.derivedData||{}},intentStatements:(state?.projectData?.intentStatements||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy),stage03:{agentData:state?.stages?.[3]?.agentData||state?.stages?.[3]?.acceptedData||{},humanData:state?.stages?.[3]?.humanData||{},derivedData:state?.stages?.[3]?.derivedData||{}},research:(state?.projectData?.research||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy),candidateRequirements:(state?.projectData?.candidateRequirements||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy),sources:(state?.projectData?.sources||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy),sourceConflicts:(state?.projectData?.sourceConflicts||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy),evidenceRecords:(state?.projectData?.evidenceRecords||[]).filter(x=>x?.active!==false&&!x?.invalidatedBy)}));}\n"
          if 'DURABLE PROJECT MEMORY — CURRENT HUMAN AUTHORITY' not in s:
              if anchor not in s: raise SystemExit('contextFor anchor missing')
              s=s.replace(anchor,addition,1)
          p.write_text(s)

          p=Path('workflow-engine.js')
          s=p.read_text()
          handoff_anchor="  const current=currentScope(project),runExecution=stage===11||(stage===17&&op==='EXECUTE_RUN')||(stage===19&&op==='EXECUTE_RUN');\n"
          stage1="  if(stage===1){for(const ref of safe(project?.stages?.[1]?.authorizedFiles)){const id=String(ref?.artifactId||ref?.id||'');if(id)addArtifact(artifactsById.get(id));}}\n"
          if stage1 not in s:
              if handoff_anchor not in s: raise SystemExit('Stage 01 handoff anchor missing')
              s=s.replace(handoff_anchor,handoff_anchor+stage1,1)
          s=s.replace("const externalWork=[11,12,17,19,21,23,24,25].includes(stage)","const externalWork=[1,11,12,17,19,21,23,24,25].includes(stage)",1)
          next_anchor="function operationalNextAction(project,currentStage){const stage=Number(currentStage||1),requests=unresolvedHumanRequests(project,stage);if(requests.length)return 'Answer the current human-only question(s). Saving the answer will invalidate the old instruction and generate a replacement for this same stage.';"
          next_add=next_anchor+"if(stage===1){const handoff=executionHandoff(project,{stage:1,operation:'COMPLETE'}),files=handoff.send.length?' Send these supplied files once to the Stage 01 agent: '+handoff.send.map(x=>x.filename+' ['+x.artifactId+']').join(', ')+'.':'';return 'Use the current Stage 01 instruction.'+files+' Continue the same conversation until every foreseeable human-only BLOCKING_NOW and ASK_NOW_NONBLOCKING item is answered or explicitly deferred. After the Stage 01 intentStatements ledger is accepted, later stages use canonical project memory and must not ask you to resend the original supplied material merely to recover already-captured project information.';}"
          if "if(stage===1){const handoff=executionHandoff" not in s:
              if next_anchor not in s: raise SystemExit('Stage 01 next action anchor missing')
              s=s.replace(next_anchor,next_add,1)
          p.write_text(s)
          PY
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/tmp-finish-all-stage-prompts.yml
          git add prompt-engine.js workflow-engine.js
          git commit -m 'Complete all-stage prompt behavior and one-time project memory'
          git push origin HEAD:fix/complete-all-stage-prompts-main-20260830
