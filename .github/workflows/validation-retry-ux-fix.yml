name: Validation retry UX fix
on:
  push:
    branches: [fix/validation-retry-ux-20260827]
permissions:
  contents: write
jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validation-retry-ux-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal retry-state guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app=Path('app-core.js')
          s=app.read_text()
          old="responseLocked=locked||s.status==='COMPLETE',promptIntro=savedPrompt?'This exact saved instruction is the controlling request. Its identity and strict response contract are embedded below.':'This is an unsaved preview. Save or copy it before sending it to an agent; only the committed instruction identity is controlling.';return"
          new="responseLocked=locked||s.status==='COMPLETE',latestValidation=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1),retryPreview=!savedPrompt&&latestValidation&&!latestValidation.valid,promptIntro=savedPrompt?'This exact saved instruction is the controlling request. Its identity and strict response contract are embedded below.':retryPreview?'Updated correction instruction preview. The latest validation failure is included automatically. Save or copy this updated instruction before sending it to the agent; only the committed instruction identity is controlling.':'This is an unsaved preview. Save or copy it before sending it to an agent; only the committed instruction identity is controlling.';return"
          if old not in s:
              raise SystemExit('workflow prompt intro anchor not found')
          s=s.replace(old,new,1)

          start=s.index('function validationMarkup(n){')
          end=s.index('\nfunction proposalMarkup(n){',start)
          replacement=r'''function validationMarkup(n){
 const v=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n).at(-1);if(!v||v.valid)return '';
 const issues=safe(v.issues),staleCodes=new Set(['STALE_SCOPE','STALE_PROMPT_IDENTITY','STALE_PROMPT_HASH','STALE_CONTRACT_HASH','STALE_CONTEXT_SIGNATURE']),stale=issues.some(x=>staleCodes.has(String(x.code||''))),typographyNormalized=issues.some(x=>String(x.code||'')==='JSON_TYPOGRAPHY_NORMALIZED'),technical=issues.map(x=>esc(`${x.code}: ${x.message}`)).join('<br>');
 if(stale){const saved=currentPromptRecord(n),expected=saved?.instructionId||saved?.promptId||null,currentLine=expected?` The current controlling instruction is <strong>${esc(expected)}</strong>.`:' The prior instruction is stale.';return `<div class="notice danger" id="validation-report" tabindex="-1"><strong>This response belongs to an older instruction.</strong><br>Nothing was accepted or changed.${currentLine} The app has prepared an updated instruction preview above from the current project state. Tap <strong>Save and copy instruction</strong>, send that updated instruction to the agent, then replace the response here with the new final JSON and tap <strong>Parse / validate response</strong> again. The updated prompt includes the applicable validation/recovery context automatically; simply pasting response text does not regenerate anything.${typographyNormalized?'<br><br>The smart quotation marks were normalized successfully; they are not the reason this response was rejected.':''}<details class="record-card"><summary>Technical validation details<span>Audit</span></summary><div class="record-body">${technical}</div></details></div>`;}
 return `<div class="notice danger" id="validation-report" tabindex="-1"><strong>Response rejected before canonical mutation.</strong><br>Nothing was accepted or changed. The app preserved this validation failure and automatically prepared an updated correction instruction preview above. Tap <strong>Save and copy instruction</strong>, send that updated instruction to the agent, then paste the replacement final JSON here and parse again. The updated prompt includes this validation report automatically; simply pasting response text does not regenerate anything.<details class="record-card"><summary>Technical validation details<span>Audit</span></summary><div class="record-body">${technical}</div></details></div>`;
}'''
          s=s[:start]+replacement+s[end:]
          app.write_text(s)

          idx=Path('index.html')
          h=idx.read_text()
          old_help='If research or requirements reveal a new human-only decision later, the agent may ask you then. That is expected; it must not guess. After you replace a rejected response, the status changes to <strong>Replacement not evaluated</strong> until you tap <em>Parse / validate response</em> again.'
          new_help='If research or requirements reveal a new human-only decision later, the agent may ask you then. That is expected; it must not guess. After <em>Parse / validate response</em> rejects a final JSON response, the app preserves the failure and automatically prepares an updated correction instruction preview above. Save and copy that updated instruction before asking the agent for a replacement; simply pasting text does not regenerate anything. After you replace a rejected response, the status changes to <strong>Replacement not evaluated</strong> until you tap <em>Parse / validate response</em> again.'
          if old_help not in h:
              raise SystemExit('help anchor not found')
          idx.write_text(h.replace(old_help,new_help,1))

          vb=Path('verify-browser.mjs')
          t=vb.read_text()
          old_test="await fill(cdp,'#stage-output','{\"schema\":}');await click(cdp,'#parse-output');await waitExpr(cdp,`document.body.innerText.includes('Response rejected before canonical mutation.')`);assert(await evalValue(cdp,`(()=>{const v=document.querySelector('#validation-report'),o=document.querySelector('#stage-output');return Boolean(v&&o&&(v.compareDocumentPosition(o)&Node.DOCUMENT_POSITION_FOLLOWING));})()`),'Validation status must appear before the response box so a phone user can see what the currently rejected response means.');"
          new_test=old_test+"assert(await evalValue(cdp,`document.querySelector('#validation-report')?.innerText.includes('automatically prepared an updated correction instruction preview')`),'Rejected response does not explain automatic correction-prompt preparation.');assert(await evalValue(cdp,`document.querySelector('#generated-prompt')?.innerText.includes('LATEST APPLICATION VALIDATION FAILURE TO CORRECT')`),'Updated prompt preview does not carry the latest validation failure.');assert((await snapshot(cdp)).text.includes('Updated correction instruction preview.'),'Generated-instruction panel does not identify the automatic correction preview.');"
          if old_test not in t:
              raise SystemExit('browser rejection anchor not found')
          vb.write_text(t.replace(old_test,new_test,1))
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const id=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[0-9a-f]{16}/g,id);
          fs.writeFileSync('index.html',html);
          console.log(JSON.stringify({runtimeBuildIdentity:id}));
          NODE
      - name: Syntax and core verification
        run: |
          node --check app-core.js
          node --check verify-browser.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser verification
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/validation-retry-ux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove temporary workflow and commit verified result
        run: |
          rm -f .github/workflows/validation-retry-ux-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Explain automatic correction prompt after validation failure"
          git push origin HEAD:fix/validation-retry-ux-20260827
