name: Test IR integration patch
on:
  push:
    branches: [reliability-test-ir]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-test-ir
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/apply-test-ir-engine.mjs
      - run: |
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js
          if git diff --cached --quiet; then
            echo 'No engine patch changes to commit.'
          else
            git commit -m 'Integrate Test IR execution routing'
            git push origin HEAD:reliability-test-ir
          fi
