name: One-shot repair PR 776
on:
  push:
    branches: [fix/spec-driven-file-first-20260902]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-driven-file-first-20260902
      - name: Bind file-first checks into required ingestion verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          marker="import vm from 'node:vm';\n"
          if marker not in s:
              raise SystemExit('Required verifier import marker is missing')
          prefix="import './verify-file-first-response.mjs';\nimport './verify-file-first-operator.mjs';\n"
          if "import './verify-file-first-response.mjs';" not in s:
              s=s.replace(marker,marker+prefix,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-ingestion.mjs
          git commit -m 'Make file-first regressions part of ingestion proof'
          git push origin HEAD:fix/spec-driven-file-first-20260902
