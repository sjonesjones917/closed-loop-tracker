name: One-shot repair PR 776
on:
  push:
    branches: [fix/spec-driven-file-first-20260902]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-driven-file-first-20260902
      - name: Restore exact Stage 11 operation binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          bad="requiredRunOperation=mode==='INITIAL'?'COMPLETE':'EXECUTE_RUN'"
          good="requiredRunOperation='EXECUTE_RUN'"
          if bad not in s:
              raise SystemExit('Expected Stage 11 defect not found')
          p.write_text(s.replace(bad,good,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js
          git commit -m 'Restore exact Stage 11 EXECUTE_RUN binding'
          git push origin HEAD:fix/spec-driven-file-first-20260902
