name: One-shot repair PR 776
on:
  push:
    branches: [fix/spec-driven-file-first-20260902]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-driven-file-first-20260902
      - name: Wire permanent file-first checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text()
          needle='          node verify-ingestion.mjs\n'
          if needle not in s:
              raise SystemExit('Required ingestion proof step is missing')
          if 'node verify-file-first-response.mjs' not in s:
              s=s.replace(needle,needle+'          node verify-file-first-response.mjs\n          node verify-file-first-operator.mjs\n',1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pages.yml
          git commit -m 'Run permanent file-first response regressions in CI'
          git push origin HEAD:fix/spec-driven-file-first-20260902
