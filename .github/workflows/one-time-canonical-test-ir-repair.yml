name: One-time canonical Test IR repair
on:
  push:
    paths:
      - .github/workflows/one-time-canonical-test-ir-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair canonical hash authority and regress it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('test-runtime.js')
          text = runtime.read_text()
          old = "const canonical=value=>JSON.stringify(value,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>scalarCompare(a,b))):v);"
          new = "const canonical=value=>{const authority=root.closedLoopHash;if(!authority||authority.canonicalizationVersion!=='closed-loop-canonical-json/1'||typeof authority.stableStringify!=='function')fail('CANONICAL_HASH_AUTHORITY_UNAVAILABLE','Test IR requires the shared closed-loop-canonical-json/1 authority.');return authority.stableStringify(value);};"
          if old not in text:
              raise SystemExit('Expected duplicate Test IR canonicalizer was not found; refusing an unverified patch.')
          runtime.write_text(text.replace(old, new, 1))

          p = Path('verify-test-runtime.mjs')
          s = p.read_text()
          old = "context.globalThis=context;vm.createContext(context);vm.runInContext(fs.readFileSync('test-runtime.js','utf8'),context,{filename:'test-runtime.js'});"
          new = "context.globalThis=context;vm.createContext(context);vm.runInContext(fs.readFileSync('hash.js','utf8'),context,{filename:'hash.js'});vm.runInContext(fs.readFileSync('test-runtime.js','utf8'),context,{filename:'test-runtime.js'});"
          if old not in s: raise SystemExit('verify-test-runtime bootstrap anchor missing')
          p.write_text(s.replace(old,new,1))

          p = Path('verify-test-runtime-dag.mjs')
          s = p.read_text()
          old = "vm.createContext(context);\nvm.runInContext(fs.readFileSync('test-runtime.js','utf8'),context,{filename:'test-runtime.js'});"
          new = "vm.createContext(context);\nvm.runInContext(fs.readFileSync('hash.js','utf8'),context,{filename:'hash.js'});\nvm.runInContext(fs.readFileSync('test-runtime.js','utf8'),context,{filename:'test-runtime.js'});"
          if old not in s: raise SystemExit('verify-test-runtime-dag bootstrap anchor missing')
          s = s.replace(old,new,1)
          anchor = "assert.match(result.normalizedDagSha256,/^[0-9a-f]{64}$/);"
          regression = "assert.match(result.normalizedDagSha256,/^[0-9a-f]{64}$/);\nassert.equal(await runtime.sha256Canonical(normalized),context.closedLoopHash.sha256Value(normalized),'Test IR canonical hashing must use the single shared closed-loop-canonical-json/1 authority.');"
          if anchor not in s: raise SystemExit('canonical authority regression anchor missing')
          p.write_text(s.replace(anchor,regression,1))

          p = Path('verify-test-runtime-v3.mjs')
          s = p.read_text()
          old = "vm.createContext(context);\nvm.runInContext(source,context,{filename:'test-runtime.js'});"
          new = "vm.createContext(context);\nvm.runInContext(fs.readFileSync(new URL('./hash.js',import.meta.url),'utf8'),context,{filename:'hash.js'});\nvm.runInContext(source,context,{filename:'test-runtime.js'});"
          if old not in s: raise SystemExit('verify-test-runtime-v3 bootstrap anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          node verify-test-runtime-dag.mjs
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          rm .github/workflows/one-time-canonical-test-ir-repair.yml
      - name: Commit repaired implementation and remove one-time scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test-runtime.js verify-test-runtime.mjs verify-test-runtime-dag.mjs verify-test-runtime-v3.mjs .github/workflows/one-time-canonical-test-ir-repair.yml
          git commit -m "Bind Test IR hashing to canonical JSON authority"
          git push origin HEAD:repair/canonical-test-ir-authority-20260903
