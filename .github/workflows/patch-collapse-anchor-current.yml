name: Patch collapse-fix runtime token

on:
  push:
    branches: [collapse-anchor-current-main]
    paths: [.github/workflows/patch-collapse-anchor-current.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collapse-anchor-current-main
      - name: Refresh runtime token
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='runtime-226f176ead45909c'
          new='runtime-70299df42bc5228b'
          if old not in s and new not in s:
              raise SystemExit('expected runtime token not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit token update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Refresh runtime cache token'
          git push origin HEAD:collapse-anchor-current-main
