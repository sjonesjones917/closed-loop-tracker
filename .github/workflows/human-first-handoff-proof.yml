name: Diagnose human-first agent handoff
on:
  push:
    branches:
      - fix/human-first-agent-handoff-20260826
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture candidate patch output
        run: |
          set +e
          node .tmp-human-agent-handoff.mjs > .handoff-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .handoff-diagnostic.txt
          cat .handoff-diagnostic.txt
          if [ "$code" -eq 0 ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .tmp-human-agent-handoff.mjs .github/workflows/human-first-handoff-proof.yml
          git add .handoff-diagnostic.txt
          git commit -m "Capture human-first handoff patch diagnosis"
          git push origin HEAD
          exit 1
