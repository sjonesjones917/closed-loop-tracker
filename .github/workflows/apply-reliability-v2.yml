name: Apply reliability v2 patch
on:
  push:
    branches: [reliability-execution-evidence-v2-20260827]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-execution-evidence-v2-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic production patch
        run: |
          python3 .reliability-v2-patch.py
          python3 .reliability-v2-fix.py
      - name: Syntax checks
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser-extra.mjs
      - name: Run all non-browser diagnostics
        id: diagnostics
        continue-on-error: true
        run: |
          set +e
          : > reliability-diagnostics.log
          rm -f reliability-failures.txt
          for cmd in \
            "node build-test-project.mjs" \
            "node verify.mjs" \
            "node verify-ingestion.mjs" \
            "node verify-complete.mjs" \
            "node verify-prompt-semantics.mjs"; do
            echo "===== $cmd =====" | tee -a reliability-diagnostics.log
            bash -lc "$cmd" >> reliability-diagnostics.log 2>&1
            code=$?
            echo "EXIT=$code" | tee -a reliability-diagnostics.log
            if [ $code -ne 0 ]; then echo "$cmd" >> reliability-failures.txt; fi
          done
          test ! -s reliability-failures.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-v2-diagnostics
          path: |
            reliability-diagnostics.log
            reliability-failures.txt
          if-no-files-found: ignore
      - name: Stop on non-browser diagnostic failure
        if: steps.diagnostics.outcome == 'failure'
        run: exit 1
      - name: Browser workflow
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node verify-browser.mjs
      - name: Browser responsive/adversarial
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          node verify-browser-extra.mjs
      - name: Commit only verified production and regression changes
        run: |
          rm -f .reliability-v2-patch.py .reliability-v2-fix.py .github/workflows/apply-reliability-v2.yml reliability-diagnostics.log reliability-failures.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: make verification evidence operationally decisive"
          git push origin HEAD:reliability-execution-evidence-v2-20260827
