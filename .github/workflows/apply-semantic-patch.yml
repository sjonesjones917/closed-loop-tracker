name: Apply semantic authority closure
on:
  push:
    branches:
      - practical-100/final-authority-organic
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-authority-organic
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct patch targeting and apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('semantic_patch.py');s=p.read_text()
          old='s=s.replace("\'PRE_CORRECTION_EVIDENCE\',\'CORRECTION\',\'POST_CORRECTION_RESULT\',\'POST_CORRECTION_EVIDENCE\',\'PERMANENT_TEST_LOCATION\'","\'PRE_CORRECTION_EVIDENCE\',\'CORRECTION\',\'PERMANENT_TEST_LOCATION\'",1)'
          new='s=s.replace("required:[\'FAILURE_FIXTURE\',\'REPRODUCTION_PROCEDURE\',\'DETECTION_METHOD\',\'PRE_CORRECTION_RESULT\',\'PRE_CORRECTION_EVIDENCE\',\'CORRECTION\',\'POST_CORRECTION_RESULT\',\'POST_CORRECTION_EVIDENCE\',\'PERMANENT_TEST_LOCATION\',\'APPLICABILITY\',\'ACTIVE_RETIRED_STATE\']","required:[\'FAILURE_FIXTURE\',\'REPRODUCTION_PROCEDURE\',\'DETECTION_METHOD\',\'PRE_CORRECTION_RESULT\',\'PRE_CORRECTION_EVIDENCE\',\'CORRECTION\',\'PERMANENT_TEST_LOCATION\',\'APPLICABILITY\',\'ACTIVE_RETIRED_STATE\']",1)'
          if old not in s: raise SystemExit('Patch targeting line not found')
          p.write_text(s.replace(old,new,1))
          PY
          python3 semantic_patch.py
      - name: Syntax
        run: |
          for f in workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs; do node --check "$f"; done
      - name: Deterministic acceptance
        run: |
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm semantic_patch.py .github/workflows/apply-semantic-patch.yml .semantic-trigger
          git add -A
          git commit -m "Close prompt authority and late-stage semantic gaps"
          git push origin HEAD:practical-100/final-authority-organic
