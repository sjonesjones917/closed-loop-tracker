name: Apply semantic authority closure
on:
  push:
    branches:
      - practical-100/final-authority-organic
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-authority-organic
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 semantic_patch.py
      - name: Syntax
        run: |
          for f in workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs; do node --check "$f"; done
      - name: Deterministic acceptance
        run: |
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm semantic_patch.py .github/workflows/apply-semantic-patch.yml
          git add -A
          git commit -m "Close prompt authority and late-stage semantic gaps"
          git push origin HEAD:practical-100/final-authority-organic
