name: Apply semantic adjudication patch
on:
  push:
    branches: [semantic-adjudication-20260827]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply semantic adjudication patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-adjudication-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node semantic-adjudication-patch.mjs
      - run: |
          node --check workflow-engine.js
          node --check verify-semantic-invariant.mjs
          node verify-semantic-invariant.mjs
      - name: Commit coordinated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js verify-semantic-invariant.mjs .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply semantic adjudication patch'
          git push origin HEAD:semantic-adjudication-20260827
