name: Apply prompt runtime identity
on:
  push:
    branches: [fix/prompt-runtime-identity-20260830]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-runtime-identity-20260830
      - name: Advance exact prompt and shared runtime identities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); s=p.read_text(); old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/50';"; new="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/51';"
          if old not in s: raise SystemExit('prompt engine identity anchor missing')
          p.write_text(s.replace(old,new,1))
          p=Path('index.html'); s=p.read_text(); old='runtime-20260830-live-operator-56'; new='runtime-20260830-live-operator-57'
          if old not in s: raise SystemExit('shared runtime identity anchor missing')
          p.write_text(s.replace(old,new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js index.html
          git commit -m "Advance prompt and shared runtime identities"
          git rm .github/workflows/apply-prompt-runtime-identity.yml
          git commit -m "Remove temporary identity editor"
          git push origin HEAD:fix/prompt-runtime-identity-20260830
