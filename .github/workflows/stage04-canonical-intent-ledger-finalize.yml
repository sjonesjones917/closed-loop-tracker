name: Finalize Stage 04 canonical intent ledger
on:
  push:
    branches: [fix/stage04-canonical-intent-ledger-final]
permissions:
  contents: write
  pull-requests: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage04-canonical-intent-ledger-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Port deterministic one-time capture onto current main
        shell: bash
        run: |
          git fetch origin fix/stage4-intent-reuse-current-main
          git checkout origin/fix/stage4-intent-reuse-current-main -- \
            build-test-project.mjs \
            prompt-engine.js \
            response-ingestion.js \
            verify-full-cycle.mjs \
            verify-ingestion.mjs \
            verify-one-time-intent-intake.mjs \
            verify-prompt-semantics.mjs \
            verify-test-runtime.mjs \
            verify.mjs \
            workbook.js \
            workflow-engine.js \
            workflow-schema.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          def replace_exact(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old,new))

          # The original intent file is not a synthetic later-stage handoff item.
          replace_exact('workflow-engine.js',
            "  if(stage>1)withhold.set('original Stage 01 intent file',{artifactIdOrCategory:'original Stage 01 intent file',reason:'One-time intake only. Later stages use the canonical intentStatements ledger and must not request, attach, resend, reopen, or rely on the original file.'});\n",
            '')

          # Stage 01 must capture all available project-relevant human authority once.
          replace_exact('prompt-engine.js',
            'If their actual contents are available in the current executing context, read only the minimum portions needed to identify the requested objective or deliverable or to resolve a genuinely Stage-01-blocking ambiguity; do not ask the human to re-enter facts that are already present in those materials.',
            'If their actual contents are available in the current executing context, inspect them deeply enough to capture every human-authority statement relevant to defining the job while staying inside the Stage 01 boundary; do not atomize requirements or perform later-stage work, and do not ask the human to re-enter facts that are already present in those materials.')

          # Later stages consume canonical capture. They never turn missing executor custody into a request for the human to repeat information.
          replace_exact('prompt-engine.js',
            "${stage===1?`ONE-TIME INTENT FILE RULE\\n- Use the original intent file now, in Stage 01 only, to create the complete canonical intentStatements ledger.\\n- Stage 01 may not complete without that ledger.\\n- Acceptance of the Stage 01 ledger ends authorization to use the original file.`:`ONE-TIME INTENT FILE RULE\\n- The original Stage 01 intent file is prohibited input for this stage.\\n- Never request, attach, resend, reopen, quote from, or depend on that file or an earlier conversation containing it.\\n- Use only the current canonical intentStatements records and their preserved source locations.`}",
            "${stage===1?`ONE-TIME HUMAN SUPPLY RULE\\n- Use the original intent material now to create the complete canonical intentStatements ledger.\\n- Stage 01 may not complete without the required canonical capture.\\n- After acceptance, the human must not be asked to repeat, retype, summarize, or reattach information already captured.`:`ONE-TIME HUMAN SUPPLY RULE\\n- Do not ask the human to attach, resend, retype, or summarize the original Stage 01 intent material.\\n- Use the current canonical intentStatements ledger and accepted Stage 01 job definition for semantic intent.\\n- If this stage genuinely requires exact bytes already in application custody, use only the application-derived artifact handoff; missing executor custody never authorizes asking the human to repeat project information.`}")

          # Stage 04 receives the full accepted Stage 01 job definition in addition to the canonical statement ledger.
          replace_exact('prompt-engine.js',
            "CURRENT AGENT-NORMALIZED DELIVERABLE (when already accepted; otherwise UNKNOWN):\n${show(j.EXACT_DELIVERABLE_REQUESTED)}\n\n${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY",
            "CURRENT AGENT-NORMALIZED DELIVERABLE (when already accepted; otherwise UNKNOWN):\n${show(j.EXACT_DELIVERABLE_REQUESTED)}\n\n${stage===4?`ACCEPTED STAGE 01 JOB DEFINITION — CURRENT CANONICAL VALUES\nASSUMPTIONS:\n${show(j.ASSUMPTIONS)}\n\nUNKNOWN_INFORMATION:\n${show(j.UNKNOWN_INFORMATION)}\n\nINPUT_SET_CONTENTS:\n${show(j.INPUT_SET_CONTENTS)}`:''}\n\n${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY")

          # Stage 03/04 wording: canonical reuse, never user resupply.
          replace_exact('prompt-engine.js',
            "3:'Research the current accepted Stage 02 independent external source set and the canonical Stage 01 intentStatements ledger, source-by-source and statement-by-statement. The original Stage 01 intent file is not an authorized input to this or any later stage and must never be requested, attached, resent, reopened, or relied on.",
            "3:'Research the current accepted Stage 02 independent external source set and the canonical Stage 01 intentStatements ledger, source-by-source and statement-by-statement. Do not ask the human to resend, reattach, retype, or summarize original Stage 01 intent material; use the canonical ledger.")
          replace_exact('prompt-engine.js',
            "4:'Compile atomic requirement proposals only from the canonical Stage 01 intentStatements ledger, Stage 03 candidateRequirements, and legitimately applicable Stage 03 external-source research. The original Stage 01 intent file is prohibited input: never request it, attach it, resend it, reopen it, or rely on an earlier conversation that contains it.",
            "4:'Compile atomic requirement proposals only from the complete current canonical input union: current User Job Input, the accepted Stage 01 job definition, the canonical Stage 01 intentStatements ledger, Stage 03 candidateRequirements, and legitimately applicable Stage 03 external-source research. Do not ask the human to resend, reattach, retype, or summarize original Stage 01 intent material; use the canonical capture. If required prior-stage semantic content is missing, return BLOCKED with the exact missing canonical context and responsible earlier stage instead of turning an earlier capture defect into another user-supply request.")

          # Handoff regressions: Stage 04 should have no synthetic send/withhold item for the original intent file.
          replace_exact('verify-test-runtime.mjs',
            "assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,1);assert.equal(stage4Handoff.withhold[0]?.artifactIdOrCategory,'original Stage 01 intent file');assert.equal(stage4Handoff.expectBack.length,0);",
            "assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,0,'Stage 04 must not turn the original intent file into another handoff item.');assert.equal(stage4Handoff.expectBack.length,0);")
          replace_exact('verify-one-time-intent-intake.mjs',
            "assert(handoff.withhold.some(item=>item.artifactIdOrCategory==='original Stage 01 intent file'),'Stage 04 does not explicitly withhold the original intent file.');",
            "assert(handoff.withhold.length===0,'Stage 04 still turns the original intent file into a later-stage handoff item.');")
          replace_exact('verify-prompt-semantics.mjs',
            "if(!handoff?.withhold?.some(item=>item.artifactIdOrCategory==='original Stage 01 intent file'))throw new Error('Stage 04 does not explicitly withhold the original intent file.');",
            "if((handoff?.withhold||[]).some(item=>item.artifactIdOrCategory==='original Stage 01 intent file'))throw new Error('Stage 04 still turns the original intent file into a later-stage handoff item.');")

          # Focused intake test should assert the no-repeat rule without requiring the obsolete blanket-prohibition sentence.
          replace_exact('verify-one-time-intent-intake.mjs',
            "  assert(prompt.prompt.includes('The original Stage 01 intent file is prohibited input for this stage.'),`Stage ${stage} does not prohibit original-file reuse.`);",
            "  assert(prompt.prompt.includes('Do not ask the human to attach, resend, retype, or summarize the original Stage 01 intent material.'),`Stage ${stage} does not enforce canonical no-repeat intake reuse.`);")

          # Existing complete-suite fixture must include the canonical Stage 01 ledger and current next-action language.
          vc=Path('verify-complete.mjs'); text=vc.read_text()
          old="  Object.assign(p.job,{EXACT_DELIVERABLE_REQUESTED:'CANONICAL-STAGE-01-DELIVERABLE',ASSUMPTIONS:'CANONICAL-STAGE-01-ASSUMPTION',UNKNOWN_INFORMATION:'CANONICAL-STAGE-01-UNKNOWN',INPUT_SET_CONTENTS:'CANONICAL-STAGE-01-INTENT-CAPTURE'});\n  const candidate=record('candidateRequirements',3,{SOURCE_LOCATION:'accepted Stage 03 research',CANDIDATE_OBLIGATION:'CANONICAL-STAGE-03-OBLIGATION',CLASSIFICATION:'MANDATORY',APPLICABILITY:'APPLICABLE',EVIDENCE:'EVIDENCE-STAGE-03'},'CANDIDATE-REQ-STAGE04');"
          new="  Object.assign(p.job,{EXACT_DELIVERABLE_REQUESTED:'CANONICAL-STAGE-01-DELIVERABLE',ASSUMPTIONS:'CANONICAL-STAGE-01-ASSUMPTION',UNKNOWN_INFORMATION:'CANONICAL-STAGE-01-UNKNOWN',INPUT_SET_CONTENTS:'CANONICAL-STAGE-01-INTENT-CAPTURE'});\n  const intent=record('intentStatements',1,{SOURCE_MATERIAL:'design-input.pdf',SOURCE_LOCATION:'page 1',EXACT_STATEMENT:'CANONICAL-STAGE-01-INTENT-STATEMENT',STATEMENT_KIND:'REQUIREMENT',REQUIREMENT_RELEVANCE:'REQUIREMENT',NORMATIVE_FORCE:'MUST',DEPENDENCIES:'NONE',EXCEPTIONS:'NONE',CONFLICTS:'NONE',NOTES:'',STATUS:'ACTIVE'},'INTENT-STATEMENT-STAGE04');intent.scope={inputVersion:p.job.CURRENT_INPUT_VERSION};p.projectData.intentStatements.push(intent);\n  const candidate=record('candidateRequirements',3,{SOURCE_LOCATION:'INTENT-STATEMENT-STAGE04',CANDIDATE_OBLIGATION:'CANONICAL-STAGE-03-OBLIGATION',CLASSIFICATION:'MANDATORY',APPLICABILITY:'APPLICABLE',EVIDENCE:'EVIDENCE-STAGE-03'},'CANDIDATE-REQ-STAGE04');"
          if text.count(old)!=1: raise SystemExit('verify-complete: canonical Stage 04 fixture anchor mismatch')
          text=text.replace(old,new)
          old2="  assert(next.includes('accepted Stage 01 job definition')&&next.includes('accepted Stage 03 findings'),'Stage 04 next action does not identify the canonical input sources it reuses.');"
          new2="  assert(next.includes('canonical Stage 01 intent-statement ledger')&&next.includes('Do not attach, resend, reopen, or otherwise reuse the original intent file.'),'Stage 04 next action does not identify canonical intent reuse.');"
          if text.count(old2)!=1: raise SystemExit('verify-complete: next-action anchor mismatch')
          vc.write_text(text.replace(old2,new2))

          # Add the permanent one-time intake regression to the normal CI/deploy proof and remove obsolete self-materializer job.
          wf=Path('.github/workflows/pages.yml'); workflow=wf.read_text()
          workflow=re.sub(r'\n  materialize-stage4-intent-reuse:[\s\S]*?(?=\n  publish-status:)', '', workflow)
          if 'node --check verify-one-time-intent-intake.mjs' not in workflow:
              workflow=workflow.replace('          node --check verify-test-runtime.mjs\n','          node --check verify-test-runtime.mjs\n          node --check verify-one-time-intent-intake.mjs\n')
          if '          node verify-one-time-intent-intake.mjs\n' not in workflow:
              workflow=workflow.replace('          node verify-complete.mjs\n','          node verify-complete.mjs\n          node verify-one-time-intent-intake.mjs\n')
          workflow=workflow.replace('node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs','node verify-ingestion.mjs && node verify-complete.mjs && node verify-one-time-intent-intake.mjs && node verify-full-cycle.mjs')
          wf.write_text(workflow)

          # Runtime files changed; refresh the one shared cache/build identity without altering the verified Stage 04 UI fix.
          runtime=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for f in runtime:
              b=Path(f).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              manifest += f'{f}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          idx=Path('index.html'); html=idx.read_text()
          html,n=re.subn(r'runtime-[0-9a-f]{16}',token,html)
          if n!=8: raise SystemExit(f'index.html: expected 8 runtime tokens, replaced {n}')
          idx.write_text(html)
          print(token)
          PY
      - name: Prove deterministic capture, closure, full lifecycle, and browser behavior
        shell: bash
        run: |
          node --check app-core.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-one-time-intent-intake.mjs
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-one-time-intent-intake.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-stage04-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit verified repair and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/stage04-canonical-intent-ledger-finalize.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add \
            .github/workflows/pages.yml \
            build-test-project.mjs \
            index.html \
            prompt-engine.js \
            response-ingestion.js \
            verify-complete.mjs \
            verify-full-cycle.mjs \
            verify-ingestion.mjs \
            verify-one-time-intent-intake.mjs \
            verify-prompt-semantics.mjs \
            verify-test-runtime.mjs \
            verify.mjs \
            workbook.js \
            workflow-engine.js \
            workflow-schema.js \
            .github/workflows/stage04-canonical-intent-ledger-finalize.yml
          git diff --cached --check
          git commit -m 'Make Stage 04 reuse canonical intent without repeated supply'
          git push origin HEAD:fix/stage04-canonical-intent-ledger-final
          gh pr create --base main --head fix/stage04-canonical-intent-ledger-final --title 'Make Stage 04 reuse canonical intent without repeated supply' --body 'Deterministic Stage 01→Stage 04 repair on the verified current main. Adds a canonical intent-statement ledger, rejects incomplete Stage 03 and Stage 04 coverage, requires exact statement provenance, preserves the existing Stage 04 no-upload UI, removes the synthetic original-file handoff, and permanently tests that already-supplied project intent is reused rather than requested again. The temporary finalizer removes itself before this PR is created.'
