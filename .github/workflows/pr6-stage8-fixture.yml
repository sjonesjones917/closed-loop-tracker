name: Complete the Stage 8 lifecycle fixture
on:
  push:
    branches: [practical-100/pr6-final]
permissions:
  contents: write
concurrency:
  group: pr6-stage8-fixture
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether the lifecycle already passes
        id: before
        shell: bash
        run: |
          set +e
          node verify-full-cycle.mjs > /tmp/before.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - name: Add only the omitted Stage 8 trace proposal
        if: steps.before.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp verify-full-cycle.mjs /tmp/verify-full-cycle.before.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('verify-full-cycle.mjs')
          text=p.read_text()
          # Find the narrow Stage 8 response region.
          markers=list(re.finditer(r'(?m)(?:stage\s*:\s*8\b|\baccept\w*\s*\(\s*8\b|\brun\w*\s*\(\s*8\b)', text))
          if not markers:
              raise SystemExit('Stage 8 lifecycle block not found')
          marker=markers[0]
          start=max(0, text.rfind('\n',0,marker.start())-3000)
          next_markers=list(re.finditer(r'(?m)(?:stage\s*:\s*9\b|\baccept\w*\s*\(\s*9\b|\brun\w*\s*\(\s*9\b)', text[marker.end():]))
          end=marker.end()+next_markers[0].start() if next_markers else min(len(text),marker.end()+14000)
          segment=text[start:end]
          if 'instructionTraces' in segment:
              raise SystemExit('Stage 8 lifecycle already proposes instructionTraces; fixture-only candidate does not apply')
          records_match=re.search(r'records\s*:\s*\{', segment)
          if not records_match:
              raise SystemExit('Stage 8 records object not found')
          records_open=records_match.end()-1
          def match_brace(source, opening):
              depth=0; quote=None; esc=False; line=False; block=False
              for i in range(opening,len(source)):
                  c=source[i]; n=source[i+1] if i+1<len(source) else ''
                  if line:
                      if c=='\n': line=False
                      continue
                  if block:
                      if c=='*' and n=='/': block=False
                      continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c=='/' and n=='/': line=True; continue
                  if c=='/' and n=='*': block=True; continue
                  if c in ('"',"'",'`'): quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return i
              raise ValueError('unmatched brace')
          records_close=match_brace(segment,records_open)
          records_body=segment[records_open+1:records_close]
          instruction_key='instruction-stage-8'
          m=re.search(r'instructions\s*:\s*\[[\s\S]{0,3000}?tempKey\s*:\s*["\']([^"\']+)', records_body)
          if m: instruction_key=m.group(1)
          evidence_key='evidence-stage-8'
          m=re.search(r'evidenceRefs\s*:\s*\[\s*["\']([^"\']+)', segment)
          if m: evidence_key=m.group(1)
          # Detect the project-state variable used in this verifier; default to the conventional name.
          project_var='project'
          for candidate in ('project','state','currentProject','projectState'):
              if re.search(rf'\b(?:let|const)\s+{candidate}\b', text[:marker.start()]):
                  project_var=candidate; break
          indent_match=re.search(r'(?m)^(\s*)records\s*:', segment[:records_match.start()+1])
          base_indent=(indent_match.group(1) if indent_match else '      ')
          item_indent=base_indent+'  '
          req_expr=(f'{{ recordId: ({project_var}.projectData?.requirements?.find((record) => '
                    f'!record.invalidatedBy && !record.supersededBy)?.recordId || '
                    f'{project_var}.projectData?.requirements?.find((record) => !record.invalidatedBy && !record.supersededBy)?.id || '
                    f'{project_var}.projectData?.requirements?.find((record) => !record.invalidatedBy && !record.supersededBy)?.fields?.REQ_ID) }}')
          insertion=f'''\n{item_indent}instructionTraces: [\n{item_indent}  {{\n{item_indent}    tempKey: "trace-stage-8-1",\n{item_indent}    targetId: null,\n{item_indent}    fields: {{\n{item_indent}      INSTRUCTION_LOCATION: "Complete instruction body",\n{item_indent}      IMPLEMENTED_BEHAVIOR: "Implements the current mandatory requirement"\n{item_indent}    }},\n{item_indent}    relationships: {{\n{item_indent}      REQ_ID: {req_expr},\n{item_indent}      INSTRUCTION_ID: {{ tempKey: "{instruction_key}" }}\n{item_indent}    }},\n{item_indent}    evidenceRefs: ["{evidence_key}"]\n{item_indent}  }}\n{item_indent}],\n'''
          # Insert after the opening brace so no existing property syntax is disturbed.
          segment=segment[:records_open+1]+insertion+segment[records_open+1:]
          text=text[:start]+segment+text[end:]
          p.write_text(text)
          Path('/tmp/stage8-fixture-report.txt').write_text(
              f'Inserted instruction trace using instruction temp key {instruction_key}, evidence key {evidence_key}, project variable {project_var}.\n')
          PY
          cat /tmp/stage8-fixture-report.txt
      - name: Verify fixture candidate
        id: candidate
        if: steps.before.outputs.exit_code != '0'
        shell: bash
        run: |
          set +e
          for file in *.js *.mjs; do node --check "$file" || exit 20; done
          node build-test-project.mjs && \
          node verify.mjs && \
          node verify-prompt-semantics.mjs && \
          node verify-ingestion.mjs && \
          node verify-complete.mjs && \
          node verify-full-cycle.mjs > /tmp/after.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - name: Retain only a passing fixture
        shell: bash
        run: |
          set -euo pipefail
          before='${{ steps.before.outputs.exit_code }}'
          after='${{ steps.candidate.outputs.exit_code }}'
          if [ "$before" != 0 ] && [ "$after" != 0 ]; then
            cp /tmp/verify-full-cycle.before.mjs verify-full-cycle.mjs
            {
              echo 'Stage 8 fixture-only candidate did not pass; test source was restored.'
              test -f /tmp/stage8-fixture-report.txt && cat /tmp/stage8-fixture-report.txt
              echo '--- ORIGINAL LIFECYCLE ---'
              tail -n 300 /tmp/before.log
              echo '--- CANDIDATE LIFECYCLE ---'
              test -f /tmp/after.log && tail -n 300 /tmp/after.log
            } > PR6_FULL_CYCLE_DIAGNOSTIC.txt
            rm -f .github/workflows/pr6-stage8-fixture.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "PR 6: preserve failed Stage 8 fixture diagnostic"
            git push origin HEAD:practical-100/pr6-final
            exit 1
          fi
          rm -f PR6_FULL_CYCLE_DIAGNOSTIC.txt
          rm -f .github/workflows/pr6-stage8-fixture.yml .github/workflows/pr6-stage8-semantic.yml .github/workflows/pr6-finalize.yml .github/workflows/pr6-finalize-robust.yml .github/workflows/pr6-stage8-contract.yml .github/workflows/pr6-materialize.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          text=p.read_text()
          for anchor, command in [('node verify.mjs','node verify-prompt-semantics.mjs'),('node verify-complete.mjs','node verify-full-cycle.mjs')]:
              if command in text: continue
              pos=text.find(anchor)
              if pos < 0: raise SystemExit(f'missing anchor {anchor}')
              eol=text.find('\n',pos)
              prefix=text[text.rfind('\n',0,pos)+1:pos]
              text=text[:eol+1]+prefix+command+'\n'+text[eol+1:]
          p.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 6: complete the Stage 8 lifecycle fixture"
          git push origin HEAD:practical-100/pr6-final
