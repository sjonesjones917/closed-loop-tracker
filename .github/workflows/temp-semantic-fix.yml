name: Temporary semantic correction proof
on:
  push:
    branches: [reliability/final-semantic-operator-migration-prompt]
permissions: {contents: write}
jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, 'Apply final semantic edge corrections') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability/final-semantic-operator-migration-prompt, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact semantic changes
        run: node .semantic-fix-v4.mjs
      - name: Syntax
        run: node --check app-core.js && node --check project-store.js && node --check prompt-engine.js
      - name: Hash verifier
        run: node verify-hash.mjs
      - name: Build retained project
        run: node build-test-project.mjs
      - name: Architecture and storage verifier
        run: node verify.mjs
      - name: Ingestion verifier
        run: node verify-ingestion.mjs
      - name: Completion verifier
        run: node verify-complete.mjs
      - name: Full lifecycle verifier
        run: node verify-full-cycle.mjs
      - name: Prompt semantic verifier
        run: node verify-prompt-semantics.mjs
      - name: Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-semantic-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit clean final tree
        run: |
          rm -f .semantic-fix.mjs .semantic-fix-v2.mjs .semantic-fix-v3.mjs .semantic-fix-v4.mjs .semantic-fix-exec.mjs .github/workflows/temp-semantic-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final semantic edge corrections"
          git push origin HEAD:reliability/final-semantic-operator-migration-prompt
