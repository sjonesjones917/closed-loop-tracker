name: Apply verified mobile readability repair
on:
  push:
    branches: [repair/mobile-readability-touch-targets]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply CSS-layer readability and touch-target repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          marker='/* Mobile readability and touch-target floor */'
          assert marker not in text, 'Readability repair already present.'
          block=r'''
          /* Mobile readability and touch-target floor */
          :root{--touch-target:44px;--ui-small:11px;--ui-body:12px}
          body{font-size:15px;line-height:1.5}
          .brand-kicker,.project-select label,.progress-line strong,.fact span,.field .help,.stage-number,.stage-meta,.record-key,.project-field-group>summary span:last-child,.stage-action-strip{font-size:var(--ui-small)}
          .brand h1{font-size:18px}
          .brand p,.field label,.group-label,.check span,.record-card>summary,.stage-name,.record-value,.section-intro,.notice,.empty-state,.project-field-group>summary,.record-tools label{font-size:var(--ui-body)}
          .project-select select{height:var(--touch-target);min-height:var(--touch-target);font-size:13px}
          button:not(.workflow-button),.file-button{min-height:var(--touch-target);font-size:12px}
          .header-actions button,.view-tabs button,.button-row button,.compact-button,.record-card button,.stage-card button{min-height:var(--touch-target);font-size:12px}
          .view-tabs{top:125px}
          .status{min-height:26px;font-size:11px}
          .fact strong{font-size:16px}
          h2.section-title{font-size:16px}
          input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select{min-height:var(--touch-target)}
          .stage-nav{grid-template-columns:44px minmax(0,1fr) 44px}
          .stage-nav button{width:44px;height:44px}
          .stage-nav select{height:44px;min-height:44px;font-size:12px}
          .prompt,.code-text{font-size:12px}
          .stage-jumpbar button{min-height:44px;max-height:44px;font-size:11px}
          .workflow-list .stage-name{font-size:12px;line-height:1.25}
          @media(max-width:620px){.workflow-list .stage-card{padding:6px}.workflow-list .status{font-size:11px;min-height:24px}.workflow-list .stage-head{row-gap:3px}}
          '''
          assert '</style>' in text
          index.write_text(text.replace('</style>',block+'\n</style>',1),encoding='utf-8')

          selector='.brand-kicker,.project-select label,.progress-line strong,.header-actions button,.view-tabs button,.status,.fact span,.field label,.field .help,.button-row button,.stage-number,.stage-name,.stage-meta,.record-card>summary,.record-key,.record-value,.prompt,.empty-state,.stage-action-strip,.project-field-group>summary,.record-tools label'
          for name in ['verify-browser.mjs','verify-browser-extra.mjs']:
              p=Path(name)
              if not p.exists(): continue
              source=p.read_text(encoding='utf-8')
              source=source.replace('<=64','<=72').replace('>=32','>=44')
              if name=='verify-browser.mjs' and 'minimumUiTextPx' not in source:
                  old="assert(Math.min(...s.buttons.filter(b=>b.h>0).map(b=>b.h),40)>=44,`Unusably small button detected at ${width}px.`);}"
                  new="assert(Math.min(...s.buttons.filter(b=>b.h>0).map(b=>b.h),44)>=44,`Touch target below 44px detected at ${width}px.`);const tinyText=await evalValue(cdp,`[...document.querySelectorAll(${repr(selector)})].filter(e=>e.getClientRects().length&&parseFloat(getComputedStyle(e).fontSize)<11).map(e=>({text:e.textContent.trim().slice(0,80),size:getComputedStyle(e).fontSize,className:e.className}))`);assert(tinyText.length===0,`UI text below 11px at ${width}px: ${JSON.stringify(tinyText)}`);}"
                  assert old in source, 'Expected browser touch-target assertion not found.'
                  source=source.replace(old,new,1)
                  source=source.replace('buttonSizing:true,','buttonSizing:true,touchTargetFloor:44,minimumUiTextPx:11,',1)
              p.write_text(source,encoding='utf-8')
          PY
      - name: Run complete deterministic and browser verification
        run: |
          node build-test-project.mjs
          for f in app.js app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$f"; done
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .1; done
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
      - name: Commit only the verified permanent repair
        run: |
          git rm .github/workflows/repair-readability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html verify-browser.mjs verify-browser-extra.mjs
          git commit -m "Raise mobile readability and touch-target floor"
          git push origin HEAD:repair/mobile-readability-touch-targets
