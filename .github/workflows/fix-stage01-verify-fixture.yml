name: One-time retained Stage 01 verifier fixture repair
on:
  push:
    branches: [fix/stage01-disposition-contract-20260903c]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/stage01-disposition-contract-20260903c
          fetch-depth: 0
      - name: Repair retained verifier fixture
        run: python .github/fix-stage01-verify-fixture.py
      - name: Prove exact CI prerequisite sequence
        run: |
          node --version
          node build-test-project.mjs
          node verify.mjs
          node verify-complete.mjs
      - name: Commit repaired canonical fixture proof
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs
          git commit -m "Update retained Stage 01 verifier fixture"
          git push origin HEAD:fix/stage01-disposition-contract-20260903c
