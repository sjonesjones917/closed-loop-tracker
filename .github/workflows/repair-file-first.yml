name: One-time file-first repair scaffold
on:
  push:
    branches: [closed-loop-file-first-transport]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect exact remaining anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets={
            'app-core.js':['id="save-prompt"','id="copy-prompt"',"$('#save-prompt')","$('#copy-prompt')","$('#parse-output')",'function responsePromptRecord','async function savePromptRecord'],
            'project-store.js':['async function putArtifact','async function getArtifact','async function deleteArtifact','async function createExecutionPackage'],
            'response-ingestion.js':['function captureRaw(','function prepareCaptured('],
            '.github/workflows/pages.yml':['verify-browser-extra.mjs','verify-definition-of-done.mjs']
          }
          for filename,needles in targets.items():
            text=Path(filename).read_text()
            print(f'===== {filename} =====')
            for needle in needles:
              index=text.find(needle)
              print(f'--- {needle!r}: {index} ---')
              if index>=0:
                lo=max(0,index-1200); hi=min(len(text),index+2600)
                print(text[lo:hi])
          raise SystemExit('INSPECTION_ONLY')
          PY
