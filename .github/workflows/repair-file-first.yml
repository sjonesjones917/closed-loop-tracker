name: One-time file-first repair
on:
  push:
    branches:
      - repair/full-spec-conformance-fcfc1c6
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/full-spec-conformance-fcfc1c6
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair exact static response-file guidance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<strong>When the application says the final response is required, obtain the authoritative response.json file for the current instruction.</strong>'
          new='<strong>Select the exact response.json file returned by the agent for the current instruction.</strong>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one static guidance target; found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node verify-file-first-response.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
          node verify.mjs
      - name: Remove one-time repair scaffolding and commit whole step
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-file-first.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add index.html .github/workflows/repair-file-first.yml
          git diff --cached --check
          git commit -m "Conform static response-file operator guidance"
          git push origin HEAD:repair/full-spec-conformance-fcfc1c6
