name: One-time file-first repair scaffold
on:
  push:
    branches: [closed-loop-file-first-transport]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect exact repair anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets={
            'app-core.js':['function currentNextAction','PASTE_FINAL_JSON','stage-output','async function prepareStageResponse','function wire()'],
            'response-ingestion.js':['const TOP_LEVEL_KEYS','function captureRaw(','closedLoopResponseIngestion'],
            'prompt-engine.js':['function buildPromptRecord','PROMPT IDENTITY','END HASHED INSTRUCTION BODY','closedLoopPromptEngine'],
            'project-store.js':['async function createExecutionPackage','closedLoopProjectStore'],
            'index.html':['Paste only that final JSON']
          }
          for filename,needles in targets.items():
            text=Path(filename).read_text()
            print(f'===== {filename} =====')
            for needle in needles:
              index=text.find(needle)
              print(f'--- {needle!r}: {index} ---')
              if index>=0:
                lo=max(0,index-700); hi=min(len(text),index+1800)
                print(text[lo:hi])
          raise SystemExit('INSPECTION_ONLY')
          PY
