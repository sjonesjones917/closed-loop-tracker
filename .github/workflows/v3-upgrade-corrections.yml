name: One-time closed-loop v3 final proof closure
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths:
      - upgrade-v3-corrections.mjs
      - .github/workflows/v3-upgrade-corrections.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: closed-loop-v3-upgrade
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply every pending deterministic transformer in order
        run: |
          if [ -f upgrade-v3.mjs ]; then node upgrade-v3.mjs; fi
          if [ -f upgrade-v3-compat.mjs ]; then node upgrade-v3-compat.mjs; fi
          node upgrade-v3-corrections.mjs
      - name: Syntax and closed-contract proof
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
      - name: Complete deterministic, ingestion, workflow, and semantic proof
        run: |
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Local Chromium proof at required emulated widths
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove temporary machinery and commit only the proven implementation
        run: |
          rm -f upgrade-v3.mjs upgrade-v3-compat.mjs upgrade-v3-corrections.mjs v3-upgrade-report.json
          rm -f .github/workflows/v3-upgrade.yml .github/workflows/v3-upgrade-compat.yml .github/workflows/v3-upgrade-corrections.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement and prove closed-loop v3 reliability contracts"
          git push origin HEAD:implementation/closed-loop-v3
