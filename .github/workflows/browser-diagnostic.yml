name: Browser regression repair
on:
  push:
    branches: [fix/subject-neutral-native-verification]
    paths: [.github/workflows/browser-diagnostic.yml]
permissions: {contents: write}

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subject-neutral-native-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore exact handoff label and prove browser behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old='<div><h3>Files to send</h3><p class="section-intro">'
          new='<div><h3>Exact handoff — Files to send</h3><p class="section-intro">'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one handoff heading anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const identity=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of runtimeFiles)html=html.replace(new RegExp(`${file.replace('.', '\\.')}\\?v=[^\"]+`,'g'),`${file}?v=${identity}`);
          fs.writeFileSync('index.html',html);
          NODE
          rm -f .browser-error.txt .github/workflows/browser-diagnostic.yml
          node verify-hash.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          git config user.name closed-loop-ci
          git config user.email closed-loop-ci@users.noreply.github.com
          git add -A
          git commit -m "Restore exact handoff operator label"
          git push origin HEAD:fix/subject-neutral-native-verification
