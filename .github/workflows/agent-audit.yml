name: Temporary exhaustive intent audit
on:
  push:
    branches:
      - fix/exhaustive-intent-obligation-closure
permissions:
  contents: write
jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node agent-audit.mjs
      - run: node extract-donor.mjs
      - name: Commit audit exports without retriggering workflows
        run: |
          git config user.name "closed-loop-audit"
          git config user.email "actions@users.noreply.github.com"
          git add candidate-scan.json donor-snippets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Export candidate scan for verified integration [skip ci]"
          git push origin HEAD:fix/exhaustive-intent-obligation-closure
