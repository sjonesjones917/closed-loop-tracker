name: Temporary exhaustive intent audit
on:
  push:
    branches:
      - fix/exhaustive-intent-obligation-closure
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node agent-audit.mjs
