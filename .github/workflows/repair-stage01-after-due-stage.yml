name: One-time Stage 01 integration repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'repair/stage01-after-due-stage-final-20260903'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/stage01-after-due-stage-final-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and prove integrated Stage 01 repair
        run: |
          set -euo pipefail
          node repair-stage01-after-due-stage.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git commit -m "Conform Stage 01 dispositions after due-stage repair"
          git push origin HEAD:repair/stage01-after-due-stage-final-20260903
