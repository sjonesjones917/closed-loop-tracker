name: One-time Stage 10 current-scope repair

on:
  push:
    branches: [controller-stage10-authoritative-prompt-20260903]

permissions:
  contents: write

jobs:
  repair-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage10-authoritative-prompt-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply authoritative prompt and exact-scope repairs
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Apply the exact current Stage 10 repair script/{found=1;next}
            found && /- name: Syntax proof/{exit}
            found && /^        run: \|/{inrun=1;next}
            found && inrun{sub(/^          /,""); print}
          ' .github/workflows/controller-stage10-diagnostic.yml > /tmp/apply.sh
          bash /tmp/apply.sh
          node <<'NODE'
          const fs=require('fs');
          const path='prompt-engine.js';
          let s=fs.readFileSync(path,'utf8');
          const old="function selectedContextRecords(state,collection,scope={}){const list=safe(state?.projectData?.[collection]).filter(record=>record?.active!==false&&!record?.invalidatedBy),keys=['inputVersion','sourceSetVersion','requirementsVersion','testSuiteVersion','instructionVersion','iterationId','candidateId','runId','contextId','baselineId','productId'],policy=schema.RECORD_SCHEMAS?.[collection]?.commitPolicy,scoped=['REPLACE_CURRENT_STAGE_SET','APPEND_SCOPED','UPDATE_RESERVED','APPLICATION_DERIVED'].includes(policy);return list.filter(record=>{const rs=record?.scope||{};if(scoped&&!Object.keys(rs).length)return false;for(const key of keys){const expected=scope?.[key];if(expected===undefined||expected===null||expected==='')continue;const actual=rs?.[key];if(actual!==undefined&&actual!==null&&actual!==''&&String(actual)!==String(expected))return false;}if(collection==='runs'&&scope.runId&&recordId(record,'runs')!==String(scope.runId))return false;if(collection==='freshContexts'&&scope.contextId&&recordId(record,'freshContexts')!==String(scope.contextId))return false;return true;});}";
          const neu="function selectedContextRecords(state,collection,scope={}){const job=state?.job||{},selectionScope={inputVersion:job.CURRENT_INPUT_VERSION||null,sourceSetVersion:job.CURRENT_SOURCE_SET_VERSION||null,researchVersion:job.CURRENT_RESEARCH_VERSION||null,requirementsVersion:job.CURRENT_REQUIREMENTS_VERSION||null,testSuiteVersion:job.CURRENT_TEST_SUITE_VERSION||null,instructionVersion:job.CURRENT_INSTRUCTION_VERSION||null,iterationId:job.CURRENT_ITERATION||null,candidateId:job.CURRENT_CANDIDATE_ID||null,baselineId:job.CURRENT_BASELINE_ID||null,productId:job.CURRENT_PRODUCT_ID||null,productVersion:job.CURRENT_PRODUCT_VERSION||null,...scope},list=safe(state?.projectData?.[collection]).filter(record=>record?.active!==false&&!record?.invalidatedBy),keys=['inputVersion','sourceSetVersion','researchVersion','requirementsVersion','testSuiteVersion','instructionVersion','iterationId','candidateId','runId','contextId','baselineId','productId','productVersion'],policy=schema.RECORD_SCHEMAS?.[collection]?.commitPolicy,scoped=['REPLACE_CURRENT_STAGE_SET','APPEND_SCOPED','UPDATE_RESERVED','APPLICATION_DERIVED'].includes(policy);return list.filter(record=>{const rs=record?.scope||{};if(scoped&&!Object.keys(rs).length)return false;for(const key of keys){const expected=selectionScope?.[key];if(expected===undefined||expected===null||expected==='')continue;const actual=rs?.[key];if(actual!==undefined&&actual!==null&&actual!==''&&String(actual)!==String(expected))return false;}if(collection==='runs'&&selectionScope.runId&&recordId(record,'runs')!==String(selectionScope.runId))return false;if(collection==='freshContexts'&&selectionScope.contextId&&recordId(record,'freshContexts')!==String(selectionScope.contextId))return false;return true;});}";
          const n=s.split(old).length-1;if(n!==1)throw new Error(`selectedContextRecords anchor count ${n}`);
          fs.writeFileSync(path,s.replace(old,neu));
          NODE
      - name: Stage 10 proof order
        shell: bash
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node verify-spec-grounded-route-oracle.mjs
          node build-test-project.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
          node verify-file-first-operator.mjs
          node verify-file-first-response.mjs
          node verify-ingestion.mjs
          node verify-full-cycle.mjs
          node verify-hash.mjs
          node verify-specification-governance.mjs
      - name: Commit integrated correction only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/controller-stage10-repair.yml .github/workflows/controller-stage10-diagnostic.yml .github/workflows/controller-stage10-log.yml .github/workflows/controller-stage10-context-fix.yml stage10-route.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair authoritative Stage 10 prompt bytes"
          git push --force-with-lease origin HEAD:controller-stage10-authoritative-prompt-20260903
