name: Finalize implementation
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
concurrency:
  group: finalize-implementation
  cancel-in-progress: false
jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize implementation source [finalize-applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - name: Restore deployment workflow and remove UI agent instructions
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          t=p.read_text()
          old='''<div class="app-help"><details><summary><b>?</b> How to use this stage</summary><div class="help-body"><ol><li><strong>Copy or send the current instruction to ChatGPT.</strong> Keep using the same chat for that stage.</li><li id="stage-artifact-help" hidden></li><li><strong>Answer the agent normally.</strong> If it needs information only you can provide, it should ask short plain-language questions in ChatGPT and wait for your answer. Keep talking there until it says the stage is ready for the final JSON. Do not paste the conversation into this app.</li><li><strong>Wait for the final JSON.</strong> When the agent has enough information, it should return one JSON object with no extra prose.</li><li><strong>Paste only that final JSON into the response box</strong>, then tap <em>Parse / validate response</em>. Review the proposed change before accepting it.</li></ol><p>If research or requirements reveal a new human-only decision later, the agent may ask you then. That is expected; it must not guess. After <em>Parse / validate response</em> rejects a final JSON response, the app preserves the failure and automatically prepares an updated correction instruction preview above. Save and copy that updated instruction before asking the agent for a replacement; simply pasting text does not regenerate anything. After you replace a rejected response, the status changes to <strong>Replacement not evaluated</strong> until you tap <em>Parse / validate response</em> again.</p></div></details></div>'''
          new='''<div class="app-help"><details><summary><b>?</b> How to use this stage</summary><div class="help-body"><ol><li><strong>Use the current instruction shown by the application.</strong> Follow the listed handoff action and send only the files the application lists for this stage.</li><li id="stage-artifact-help" hidden></li><li><strong>Continue the current external conversation when the application says conversation is required.</strong> Do not paste conversational messages into this application.</li><li><strong>When the application says final JSON is required, obtain the final JSON for the current instruction.</strong></li><li><strong>Paste only that final JSON into the response box</strong>, then tap <em>Parse / validate response</em>. Review the proposed change before accepting it.</li></ol><p>If the current stage requires a later human-only decision, answer that decision when the application presents it. After <em>Parse / validate response</em> rejects a final JSON response, the application preserves the failure and prepares the replacement instruction. Save and copy the new current instruction before obtaining a replacement response. After replacing a rejected response, the status remains <strong>Replacement not evaluated</strong> until <em>Parse / validate response</em> runs again.</p></div></details></div>'''
          if old not in t:
              raise SystemExit('Expected help block not found')
          p.write_text(t.replace(old,new,1))

          p=Path('.github/workflows/pages.yml')
          t=p.read_text()
          anchor='''          node --check verify-prompt-semantics.mjs\n          node --check verify-one-time-intent-intake.mjs\n'''
          replacement='''          node --check verify-prompt-semantics.mjs\n          node --check verify-all-stage-prompts.mjs\n          node --check verify-zero-loss-accounting.mjs\n          node --check verify-user-prompt-invariants.mjs\n          node --check verify-one-time-intent-intake.mjs\n'''
          if anchor not in t:
              raise SystemExit('Pages syntax anchor not found')
          t=t.replace(anchor,replacement,1)
          anchor='''      - name: Reject semantic prompt contradictions and operation leakage\n        run: node verify-prompt-semantics.mjs\n'''
          replacement='''      - name: Verify every stage prompt and zero-loss project reuse\n        run: |\n          node verify-all-stage-prompts.mjs\n          node verify-zero-loss-accounting.mjs\n          node verify-user-prompt-invariants.mjs\n      - name: Reject semantic prompt contradictions and operation leakage\n        run: node verify-prompt-semantics.mjs\n'''
          if anchor not in t:
              raise SystemExit('Pages prompt proof anchor not found')
          t=t.replace(anchor,replacement,1)
          old='node build-test-project.mjs && node verify-test-runtime.mjs && node verify-one-time-intent-intake.mjs && node verify-hash.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs && node verify-prompt-semantics.mjs && node verify-semantic-invariant.mjs && node verify-definition-of-done.mjs && node verify-project-lifecycle.mjs'
          new='node build-test-project.mjs && node verify-test-runtime.mjs && node verify-one-time-intent-intake.mjs && node verify-all-stage-prompts.mjs && node verify-zero-loss-accounting.mjs && node verify-user-prompt-invariants.mjs && node verify-hash.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs && node verify-prompt-semantics.mjs && node verify-semantic-invariant.mjs && node verify-definition-of-done.mjs && node verify-project-lifecycle.mjs'
          if old not in t:
              raise SystemExit('Pages deploy proof command not found')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Verify final source shape
        run: |
          grep -F "height:clamp(260px,45vh,520px)" index.html
          grep -F ".expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}" index.html
          ! grep -Ei "agent should|agent must|it should ask|it should return" index.html app-core.js
          grep -F "name: Verify and deploy the single reliability app" .github/workflows/pages.yml
          node --check prompt-engine.js
          node --check app-core.js
          node verify-all-stage-prompts.mjs
      - name: Commit final source
        run: |
          git config user.name closed-loop-finalizer
          git config user.email closed-loop-finalizer@users.noreply.github.com
          git rm .github/workflows/finalize-implementation.yml
          git add index.html .github/workflows/pages.yml
          git commit -m "Finalize implementation source [finalize-applied]"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
