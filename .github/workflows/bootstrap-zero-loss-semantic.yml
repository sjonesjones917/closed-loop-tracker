name: Bootstrap zero-loss semantic correction

on:
  push:
    branches: [reliability/semantic-adjudication-zero-loss-20260828-1103]
    paths: [.github/workflows/bootstrap-zero-loss-semantic.yml]

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal responsible-layer semantic correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
