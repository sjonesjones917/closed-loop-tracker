name: One-time route fixture correction

on:
  push:
    branches: [repair/scope-matrix-726b]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/scope-matrix-726b
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct route fixture
        run: node .repair-route-fixture.mjs
      - name: Prove route closure and exact scope
        run: |
          set -euo pipefail
          node verify-section14-scope-matrix.mjs
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs
          node verify-v3-contract.mjs
          node verify-full-cycle.mjs
      - name: Commit proven fixture correction
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-data-route-closure.mjs
          git commit -m "Exercise exact operation scopes in route closure"
          git push origin HEAD:repair/scope-matrix-726b
