name: Repair full-cycle independent-review fixtures
on:
  push:
    branches: [fix/monotonic-zero-loss-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct full-cycle route, reviewer-context, and authority fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs'); text=p.read_text(encoding='utf-8')
          repairs=[
            ("overrides:{TEST_TYPE:'MEANING',INPUTS:'Product content',TOOLS:'Independent evaluator',PROCEDURE:'Compare delivered meaning with the requirement and evidence.'",
             "overrides:{TEST_TYPE:'MEANING',EXECUTION_MODE:'INDEPENDENT_AGENT_REVIEW',REQUIRED_CAPABILITY:'INDEPENDENT_REVIEW',INPUTS:'Product content',TOOLS:'Independent evaluator',PROCEDURE:'Compare delivered meaning with the requirement and evidence.'"),
            ("data(9,{records:{preflightRecords:[recordProposal(schema,'preflightRecords'",
             "const preflightContext=engine.registerFreshContext(p,{stage:9,externalContextIdentifier:'PREFLIGHT-REVIEW-CONTEXT-1',operatorLabel:'FULL_CYCLE',purpose:'REVIEWER'}),preflightContextId=engine.recordId(preflightContext,'freshContexts');data(9,{scope:{contextId:preflightContextId},records:{preflightRecords:[recordProposal(schema,'preflightRecords'"),
            ("data(10,{stageData:{HASHES_RECORDED_WHERE_PRACTICAL:'TRUE',CHANGES_ALLOWED_DURING_BATCH:'NONE'}});engine.freezeCandidate(p,{stage:10,artifactIds:['ARTIFACT-CANDIDATE'],operatorLabel:'FULL_CYCLE'});",
             "engine.freezeCandidate(p,{stage:10,artifactIds:['ARTIFACT-CANDIDATE'],operatorLabel:'FULL_CYCLE'});")
          ]
          for old,new in repairs:
              count=text.count(old)
              if count == 1:
                  text=text.replace(old,new,1)
                  continue
              if count != 0: raise SystemExit(f'Expected at most one fixture target, found {count}: {old[:70]}')
              if new not in text: raise SystemExit(f'Neither old nor repaired fixture exists: {old[:70]}')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Prove full-cycle and downstream lifecycle
        run: |
          set -euo pipefail
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit regression and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-full-cycle-route.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-full-cycle.mjs .github/workflows/repair-full-cycle-route.yml
          git diff --cached --check
          git commit -m "Preserve full-cycle independent-review contracts"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
