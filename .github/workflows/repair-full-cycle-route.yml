name: Repair full-cycle Stage 07 route fixture
on:
  push:
    branches: [fix/monotonic-zero-loss-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct full-cycle execution route fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs'); text=p.read_text(encoding='utf-8')
          old="overrides:{TEST_TYPE:'MEANING',INPUTS:'Product content',TOOLS:'Independent evaluator',PROCEDURE:'Compare delivered meaning with the requirement and evidence.'"
          new="overrides:{TEST_TYPE:'MEANING',EXECUTION_MODE:'INDEPENDENT_AGENT_REVIEW',REQUIRED_CAPABILITY:'INDEPENDENT_REVIEW',INPUTS:'Product content',TOOLS:'Independent evaluator',PROCEDURE:'Compare delivered meaning with the requirement and evidence.'"
          if new not in text:
              count=text.count(old)
              if count != 1: raise SystemExit(f'Expected exactly one meaning-test fixture target, found {count}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Prove full-cycle and downstream lifecycle
        run: |
          set -euo pipefail
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit regression and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-full-cycle-route.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-full-cycle.mjs .github/workflows/repair-full-cycle-route.yml
          git diff --cached --check
          git commit -m "Route full-cycle meaning verification independently"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
