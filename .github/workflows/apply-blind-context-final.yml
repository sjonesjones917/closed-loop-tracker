name: Apply final blind-context implementation
on:
  push:
    branches: ["finish/blind-context-and-prompt-authority-43"]
    paths: [".github/workflows/apply-blind-context-final.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/blind-context-and-prompt-authority-43
          fetch-depth: 0
      - name: Apply exact prepared source patch
        shell: bash
        run: |
          cat > /tmp/final.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/final.patch.gz.b64 | gzip -d > /tmp/final.patch
          git apply -p2 /tmp/final.patch
          rm .github/workflows/apply-blind-context-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js project-store.js index.html test-runtime.js .github/workflows/apply-blind-context-final.yml
          git commit -m "Complete blind reviewer context and prompt identity flow"
          git push origin HEAD:finish/blind-context-and-prompt-authority-43