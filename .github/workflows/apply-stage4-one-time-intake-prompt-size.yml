name: Apply minimal Stage 04 intake and prompt-size repair
on:
  push:
    branches: [fix/stage4-one-time-intake-prompt-size-20260830]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-one-time-intake-prompt-size-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce the verified repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fix/stage-input-once:refs/remotes/origin/fix/stage-input-once
          for file in prompt-engine.js app-core.js verify-browser.mjs verify-complete.mjs verify-prompt-semantics.mjs verify-stage-input-once.mjs; do
            git show "refs/remotes/origin/fix/stage-input-once:${file}" > "${file}"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          def replace_once(path, old, new):
              target=Path(path); text=target.read_text(); count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected one match, found {count}')
              target.write_text(text.replace(old,new,1))

          replace_once('prompt-engine.js',"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';")
          replace_once('workflow-engine.js',"if(stage===4)return 'Use the current Stage 04 instruction. It already carries current User Job Input, the accepted Stage 01 job definition, and accepted Stage 03 findings. Do not attach or resend the original intent file. If required canonical context is incomplete, return the exact earlier-stage deficiency instead of asking the user to provide the same material again.';","if(stage===4)return 'Use the current Stage 04 instruction. The application supplies current User Job Input, the accepted Stage 01 job definition, the accepted canonical Stage 01 intake, and accepted Stage 03 findings; no original intake file is required or used. When the agent finishes, paste its final JSON response here.';")
          replace_once('app-core.js',"if(n===4)return `<div class=\"notice\"><strong>The agent should now return one final JSON response.</strong><br>The current Stage 04 instruction contains the accepted canonical intake and research context. No original intake file is required or used. Paste only the final JSON below.</div>`;","if(n===4)return `<div class=\"notice\"><strong>The agent should now return one final JSON response.</strong><br>The current Stage 04 instruction contains the accepted canonical intake and research context. No original intake file is required or used. When the agent finishes, paste its final JSON response here.</div>`;")

          index=Path('index.html'); html=index.read_text(); shrink='  #prompt-heading .expandable-prompt:not(.expanded){max-height:88px}\n'
          if html.count(shrink)!=1: raise SystemExit('index.html: 88px override count changed')
          html=html.replace(shrink,'',1)
          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for name in runtime_files:
              data=Path(name).read_bytes()
              prefix=b'blob '+str(len(data)).encode()+bytes([0])
              blob_sha=hashlib.sha1(prefix+data).hexdigest()
              manifest += f'{name}:{blob_sha}\n'
          identity='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          pattern=re.compile(r'(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+("\s*></script>)')
          html,count=pattern.subn(lambda m:m.group(1)+identity+m.group(2),html)
          if count!=8: raise SystemExit(f'index.html: expected 8 runtime tokens, found {count}')
          index.write_text(html)

          mobile=Path('verify-mobile-stage-action.mjs'); text=mobile.read_text()
          pairs=[
            ("next.textContent='Send the Stage 04 instruction with '+${JSON.stringify(filename)}+'. The prompt does not include those materials.';","next.textContent='Use the current canonical Stage 04 intake without requesting the original file again. Long wrapping sentinel: '+${JSON.stringify(filename)};"),
            ('assert(state.filenameNodes.length>=2&&state.filenameNodes.every','assert(state.filenameNodes.length>=1&&state.filenameNodes.every'),
            ('assert(state.prompt&&state.prompt.height<=100,`Collapsed mobile prompt still buries the primary action at ${width}px: ${JSON.stringify(state.prompt)}`);','assert(state.prompt&&state.prompt.height>=260,`Generated prompt box was resized below the established minimum at ${width}px: ${JSON.stringify(state.prompt)}`);'),
            ('assert(state.copyDistance!==null&&state.copyDistance<=1100,`Primary copy action is too far below the current action at ${width}px: ${state.copyDistance}`);','assert(state.copyDistance!==null&&state.copyDistance<=1450,`Primary copy action is too far below the current action at ${width}px: ${state.copyDistance}`);'),
            ('primaryActionReachable:true,horizontalOverflow:false','primaryActionReachable:true,promptBoxSizePreserved:true,horizontalOverflow:false')]
          for old,new in pairs:
              if text.count(old)!=1: raise SystemExit(f'verify-mobile-stage-action.mjs: patch point changed: {old[:80]}')
              text=text.replace(old,new,1)
          mobile.write_text(text)
          PY
          git diff --check
      - name: Re-run the complete verified suite
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-stage4-one-time-intake-prompt-size.yml
          node build-test-project.mjs
          for file in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js test-runtime.js test-worker.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs verify-project-lifecycle.mjs verify-test-runtime.mjs verify-stage-input-once.mjs verify-mobile-stage-action.mjs; do node --check "$file"; done
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-stage-input-once.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-fix-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          node verify-mobile-stage-action.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          git restore .github/workflows/apply-stage4-one-time-intake-prompt-size.yml
      - name: Push only the tested product and regression files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-core.js index.html prompt-engine.js workflow-engine.js verify-browser.mjs verify-complete.mjs verify-prompt-semantics.mjs verify-stage-input-once.mjs verify-mobile-stage-action.mjs
          git diff --cached --check
          git commit -m 'Capture intent once and restore prompt size [skip ci]'
          git push origin HEAD:fix/stage4-one-time-intake-prompt-size-20260830
