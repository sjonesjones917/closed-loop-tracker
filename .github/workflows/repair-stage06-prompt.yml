name: One-time Stage 06 prompt contract repair
on:
  push:
    branches: [fix/controlling-spec-final-20260830]
    paths: ['.github/workflows/repair-stage06-prompt.yml']
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/controlling-spec-final-20260830, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Repair Stage 06 dynamic Test IR authoring prompt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('prompt-engine.js')
          s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/32';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/33';")
          marker='function body(stage,state,operation,scope)'
          if marker not in s:
              raise SystemExit('prompt-engine body marker missing')
          helper=r'''function testIrAuthoringBlock(state){
const runtime=globalThis.closedLoopTestRuntime;if(!runtime)throw new Error('test-runtime.js must load before Stage 06 prompt generation.');
const artifacts=safe(state?.projectData?.artifacts).filter(record=>record?.active!==false&&!record?.invalidatedBy).map(record=>{const fields=recordFields(record);return {artifactId:recordId(record,'artifacts'),filename:fields.FILENAME||record.filename||null,role:fields.ROLE||record.role||null,sha256:fields.SHA256||record.sha256||null,available:fields.AVAILABILITY??record.available??null};});
const canonicalBindings=Object.fromEntries(['CURRENT_INPUT_VERSION','CURRENT_SOURCE_SET_VERSION','CURRENT_REQUIREMENTS_VERSION','CURRENT_TEST_SUITE_VERSION','CURRENT_INSTRUCTION_VERSION','CURRENT_BASELINE_ID','CURRENT_PRODUCT_ID'].filter(key=>!placeholder(state?.job?.[key])).map(key=>[key,{kind:'CANONICAL_VALUE',canonicalKey:key,value:state.job[key]}]));
return `CLOSED LOOP TEST IR — APPLICATION-OWNED DETERMINISTIC LANGUAGE\nVersion: ${runtime.SPEC_VERSION}\nRegistered capability: ${runtime.CAPABILITY}\nSupported operations: ${runtime.OPS.join(', ')}\n\nOPERATION ARGUMENT CONTRACTS — APPLICATION OWNED\n${show(runtime.operationContracts())}\n\nAVAILABLE BINDINGS — CURRENT APPLICATION-SELECTED AUTHORING INPUTS\n${show({artifactBindings:artifacts,canonicalBindings})}\n\nRUNTIME LIMITS RELEVANT TO AUTHORING — APPLICATION OWNED\n${show(runtime.LIMITS)}\n\nPROHIBITED CONSTRUCTS\nArbitrary JavaScript, Python, shell commands, dynamic imports, eval, Function, arbitrary network access, arbitrary project-state access, user- or agent-provided executable source, and unregistered custom pipelines are prohibited.\nUse EXECUTION_MODE = APPLICATION_DETERMINISTIC, REQUIRED_CAPABILITY = ${runtime.CAPABILITY}, EXECUTABLE_KIND = TEST_IR, EXECUTABLE_SPEC_VERSION = ${runtime.SPEC_VERSION}, plus valid EXECUTABLE_SPEC and EXECUTABLE_INPUT_BINDINGS whenever the proposition can be represented faithfully by these registered contracts. Select a non-native route when deterministic representation would lose substantive meaning.\n`;}
'''
          s=s.replace(marker,helper+marker,1)
          pattern=r",native=stage===6\?`CLOSED LOOP TEST IR — APPLICATION-OWNED DETERMINISTIC LANGUAGE.*?\\n`:'';return `COPY BLOCK"
          replacement=",native=stage===6?testIrAuthoringBlock(state):'';return `COPY BLOCK"
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'expected one Stage 06 native prompt replacement, got {n}')
          p.write_text(s)

          p=Path('verify-prompt-semantics.mjs')
          s=p.read_text()
          s=s.replace("  'closed-loop-test-spec/1',\n",'')
          anchor="assert(!/PATENT \\/ REGULATED FILING|SOFTWARE \\/ MULTI-FILE SYSTEM|BUILDING \\/ ARCHITECTURE \\/ AEC|PHYSICAL \\/ MECHANICAL/.test(stage1),'Generated Stage 01 prompt is not subject neutral.');\n"
          addition=anchor+"\nconst stage6=prompts.buildPromptRecord(6,project,{operation:'COMPLETE'}).prompt;\nassert(stage6.includes('Version: closed-loop-test-spec/1'),'Generated Stage 06 prompt omits the current Test IR schema version.');\nassert(stage6.includes('OPERATION ARGUMENT CONTRACTS — APPLICATION OWNED'),'Generated Stage 06 prompt omits operation argument contracts.');\nassert(stage6.includes('AVAILABLE BINDINGS — CURRENT APPLICATION-SELECTED AUTHORING INPUTS'),'Generated Stage 06 prompt omits available bindings.');\nassert(stage6.includes('RUNTIME LIMITS RELEVANT TO AUTHORING — APPLICATION OWNED'),'Generated Stage 06 prompt omits runtime limits.');\nassert(stage6.includes('LOAD_ARTIFACT')&&stage6.includes('required')&&stage6.includes('binding'),'Generated Stage 06 prompt does not publish the LOAD_ARTIFACT argument contract.');\nassert(stage6.includes('maxSteps')&&stage6.includes('workerTimeoutMs'),'Generated Stage 06 prompt does not publish authoring-relevant runtime limits.');\nassert(stage6.includes('CURRENT_INPUT_VERSION'),'Generated Stage 06 prompt does not publish current canonical binding availability.');\nassert(stage6.includes('Arbitrary JavaScript')&&stage6.includes('network access'),'Generated Stage 06 prompt omits prohibited constructs.');\n"
          if anchor not in s:
              raise SystemExit('prompt semantic insertion anchor missing')
          s=s.replace(anchor,addition,1)
          p.write_text(s)
          PY
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          git rm .github/workflows/repair-stage06-prompt.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add prompt-engine.js verify-prompt-semantics.mjs
          git commit -m 'Publish complete Stage 06 Test IR authoring contract'
          git push origin HEAD:fix/controlling-spec-final-20260830
