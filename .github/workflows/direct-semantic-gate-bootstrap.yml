name: Direct semantic-gate integration proof
# proof revision: 6

on:
  push:
    branches:
      - reliability/direct-semantic-gates-20260828
    paths:
      - .github/workflows/direct-semantic-gate-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: direct-semantic-gate-integration-v6
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact reliability branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only the audited responsible-layer correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .fix-direct-semantic-anchor.py
          python3 .direct-semantic-gate-fix.py
          python3 .repair-direct-semantic-helper.py
          python3 .refresh-runtime-and-status.py
          rm -f .fix-direct-semantic-anchor.py .direct-semantic-gate-fix.py .repair-direct-semantic-helper.py .refresh-runtime-and-status.py .github/workflows/direct-semantic-gate-bootstrap.yml
          test ! -e .github/workflows/export-source.yml
          test ! -e .export-source/READY
          grep -q 'function evaluateEvidenceContract' workflow-engine.js
          grep -q 'function evaluateResultConsistency' workflow-engine.js
          grep -q 'function effectiveDetermination' workflow-engine.js
          grep -q 'function validateTraceIntegrity' workflow-engine.js
          grep -q 'function addSemanticGateReasons' workflow-engine.js
          ! grep -q 'applicationadjudicationGate' workflow-engine.js
          ! grep -q 'gate=function adjudicationGate' workflow-engine.js
          grep -q 'REVIEWER_CONTEXT_ID' workflow-schema.js

      - name: Prove syntax, architecture, semantic adjudication, ingestion, workflow, prompts, and full cycle
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-complete.mjs
          node verify-semantic-invariant.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs

      - name: Prove local Chromium acceptance
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-direct-proof-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Publish only the proven source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Integrate semantic adjudication directly into gates'
          git push origin HEAD:refs/heads/reliability/direct-semantic-gates-20260828
