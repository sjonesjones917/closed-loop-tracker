name: One-time IndexedDB reconnect repair

on:
  push:
    branches:
      - repair/stage01-disposition-current-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact reconnect correction
        run: node .repair-indexeddb-reconnect.cjs
      - name: Prove syntax and focused persistence contracts
        run: |
          node --check project-store.js
          node verify-project-store.mjs
          node verify-storage-reliability.mjs
      - name: Remove scaffolding and commit permanent repair
        run: |
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git rm .github/workflows/repair-indexeddb-reconnect.yml .repair-indexeddb-reconnect.cjs
          git add project-store.js
          git commit -m 'Recover transient IndexedDB reconnect failures'
          git push origin HEAD:repair/stage01-disposition-current-20260903
