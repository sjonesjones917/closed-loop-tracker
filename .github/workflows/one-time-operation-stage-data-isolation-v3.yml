name: One-time operation stageData isolation repair v3
on:
  push:
    branches: [operation-stage-data-isolation-20260826]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operation-stage-data-isolation-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimum operation authority correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('workflow-schema.js'); s=p.read_text(); a=s.index('const OPERATION_CONTRACT_OVERRIDES='); b=s.index('\n\nconst HUMAN_INTAKE_FIELDS',a)
          block="""const OPERATION_CONTRACT_OVERRIDES=Object.freeze({
            17:Object.freeze({
              FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions'],agentWritableCollections:[],agentStageFields:['NEW_FROZEN_VERSIONS','OLD_CONVERSATIONS_CONTINUED','RUN_NAMESPACE','IDENTICAL_PACKAGE_CONFIRMED_FOR_ALL_RUNS','PRIOR_OUTPUTS_WITHHELD']}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],agentStageFields:[]}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],agentStageFields:[]}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],agentStageFields:['EXECUTE_COMPLETED','VERIFY_COMPLETED','COMPARE_COMPLETED']}),
              ROOT_CAUSE:Object.freeze({readCollections:['defects','comparisons','verification'],agentWritableCollections:['defects','rootCauses'],agentStageFields:['ROOT_CAUSE_COMPLETED']}),
              REGRESSION:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions'],agentWritableCollections:['regressions','regressionExecutions'],agentStageFields:['REGRESSION_TESTS_ADDED']}),
              CORRECT:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions','changes'],agentWritableCollections:['changes'],agentStageFields:['CORRECTIONS_COMPLETED']})
            }),
            19:Object.freeze({
              CONFIRM_FREEZE:Object.freeze({readCollections:['convergenceRecords','candidateFreezes','iterations'],agentWritableCollections:[],agentStageFields:[]}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],agentStageFields:[]}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],agentStageFields:[]}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],agentStageFields:['CROSS_RUN_COMPARISON_COMPLETED']}),
              REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs'],agentWritableCollections:['regressionExecutions'],agentStageFields:[]}),
              CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','regressionExecutions','candidateFreezes'],agentWritableCollections:['confirmationRecords'],agentStageFields:['COMPLETE_TEST_SUITE_RUN','NEW_CRITICAL_DEFECTS','NEW_MAJOR_DEFECTS','NEW_REQUIREMENTS_DISCOVERED','INJECTED_DEFECTS_NOT_DETECTED','NEW_CORRECTNESS_AFFECTING_VARIANCE','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED','REQUIRED_RETURN_STAGE']})
            })
          });
          function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};let scopeRequirements=override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[];if((stage===17||stage===19)&&!['EXECUTE_RUN','VERIFY'].includes(operation))scopeRequirements=scopeRequirements.filter(key=>key!=='runId'&&key!=='contextId');return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),agentStageFields:Object.freeze(override.agentStageFields||allowedAgentStageFields(stage)),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(scopeRequirements)});}"""
          p.write_text(s[:a]+block+s[b:])

          p=Path('prompt-engine.js'); s=p.read_text()
          replacements=[
            ("const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation),writable=op?.agentWritableCollections||contract.agentWritableCollections;\n const stageData=Object.fromEntries(contract.allowedStageData.map(name=>[name,responseFieldContract(schema.STAGE_FIELDS[stage][name])]));","const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation),writable=op?.agentWritableCollections||contract.agentWritableCollections,stageFields=op?.agentStageFields||contract.allowedStageData;\n const stageData=Object.fromEntries(stageFields.map(name=>[name,responseFieldContract(schema.STAGE_FIELDS[stage][name])]));"),
            ("agentStageFields:[...contract.allowedStageData]","agentStageFields:[...stageFields]"),
            ("const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation||contract.operations[0]);\n const fields=contract.allowedStageData.length?contract.allowedStageData.map(x=>{const d=schema.STAGE_FIELDS[stage][x];return `- ${x}: ${d.valueType}${d.enumValues?.length?` enum(${d.enumValues.join(' | ')})`:''}${d.nullable?' nullable':''}`;}).join('\\n'):'- No agent-owned stageData fields; use permitted records/evidence only.';","const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation||contract.operations[0]),stageFields=op?.agentStageFields||contract.allowedStageData;\n const fields=stageFields.length?stageFields.map(x=>{const d=schema.STAGE_FIELDS[stage][x];return `- ${x}: ${d.valueType}${d.enumValues?.length?` enum(${d.enumValues.join(' | ')})`:''}${d.nullable?' nullable':''}`;}).join('\\n'):'- No agent-owned stageData fields for this operation; use permitted records/evidence only.';")]
          for old,new in replacements:
            if old not in s: raise SystemExit('prompt anchor missing')
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('response-ingestion.js'); s=p.read_text()
          old="const allowedStageData=new Set(contract?.allowedStageData||[]);"; new="const allowedStageData=new Set(operationContract?.agentStageFields||contract?.allowedStageData||[]);"
          if old not in s: raise SystemExit('ingestion stage field anchor missing')
          s=s.replace(old,new,1)
          old="if(!allowedStageData.has(name)||!schema.authorizeMutation({fieldDefinition:definition,actor:'AGENT',mutationType:'RESPONSE_INGESTION'}).authorized)issues.push(issue('FIELD_OWNERSHIP_VIOLATION',path,`${name} is owned by ${definition.producer}, not the external agent.`));"
          new="const authorized=schema.authorizeMutation({fieldDefinition:definition,actor:'AGENT',mutationType:'RESPONSE_INGESTION'}).authorized;\n      if(!authorized)issues.push(issue('FIELD_OWNERSHIP_VIOLATION',path,`${name} is owned by ${definition.producer}, not the external agent.`));\n      else if(!allowedStageData.has(name))issues.push(issue('OPERATION_SCOPE_VIOLATION',path,`${name} is agent-owned but is not writable during operation ${expectedOperation}.`));"
          if old not in s: raise SystemExit('ingestion ownership anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('verify-ingestion.mjs'); s=p.read_text()
          replacements=[
            ("const contract=schema.STAGE_CONTRACTS[stage];","const contract=schema.STAGE_CONTRACTS[stage],operationContract=schema.operationContract(stage,promptRecord.operation),stageFields=operationContract?.agentStageFields||contract.allowedStageData,writable=operationContract?.agentWritableCollections||contract.allowedCollections;"),
            ("if(contract.allowedStageData.length)stageData[contract.allowedStageData[0]]=safeValue(contract.allowedStageData[0]);","if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);"),
            ("const collection=contract.allowedCollections.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||contract.allowedCollections.find(name=>schema.recordAgentFields(name).length);","const collection=writable.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||writable.find(name=>schema.recordAgentFields(name).length);")]
          for old,new in replacements:
            if old not in s: raise SystemExit('verify-ingestion anchor missing')
            s=s.replace(old,new,1)
          anchor='// Duplicate response is semantic, not whitespace-sensitive.'
          test="""// Agent ownership does not grant cross-operation stageData authority.
          {const p=project('JOB-NEG-OPERATION-STAGE-DATA'),stage=17,pr={...prompts.buildPromptRecord(stage,p,{operation:'COMPARE'}),generatedAt:new Date().toISOString()};p.projectData.generatedPrompts.push(pr);const e={schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage,operation:'COMPARE',promptIdentity:{instructionId:pr.instructionId,bodySha256:pr.bodySha256,contractSha256:pr.contractSha256,contextSignature:pr.contextSignature},scope:pr.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{CORRECTIONS_COMPLETED:'YES'},records:{},evidence:[{temporaryKey:'evidence-op-scope',kind:'WORKFLOW_EVIDENCE',description:'Cross-operation scope fixture',location:'verification fixture',content:'Agent-owned field belongs to CORRECT, not COMPARE.'}],unresolved:[],warnings:[],attachments:[]};const prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});if(prepared.validation.valid||!prepared.validation.issues.some(i=>i.code==='OPERATION_SCOPE_VIOLATION'&&i.path==='/stageData/CORRECTIONS_COMPLETED'))throw new Error(`Cross-operation stageData was not rejected correctly: ${JSON.stringify(prepared.validation.issues)}`);if(prepared.project.projectData.acceptedChanges.length)throw new Error('Cross-operation stageData mutated canonical state.');negativeCount++;}

          """
          if anchor not in s: raise SystemExit('verify-ingestion insertion anchor missing')
          p.write_text(s.replace(anchor,test+anchor,1))

          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          anchor="if(!arraysEqual(descriptor.agentWritableCollections||[],op?.agentWritableCollections||[]))issues.push('WRITE_COLLECTION_CONTRADICTION');"
          if anchor not in s: raise SystemExit('prompt semantic anchor missing')
          s=s.replace(anchor,anchor+"\n  if(!arraysEqual(descriptor.agentStageFields||[],op?.agentStageFields||[]))issues.push('WRITE_STAGE_FIELD_CONTRADICTION');",1)
          anchor='let checked=0;'
          add="""const expectedOperationStageFields={17:{FREEZE:['NEW_FROZEN_VERSIONS','OLD_CONVERSATIONS_CONTINUED','RUN_NAMESPACE','IDENTICAL_PACKAGE_CONFIRMED_FOR_ALL_RUNS','PRIOR_OUTPUTS_WITHHELD'],EXECUTE_RUN:[],VERIFY:[],COMPARE:['EXECUTE_COMPLETED','VERIFY_COMPLETED','COMPARE_COMPLETED'],ROOT_CAUSE:['ROOT_CAUSE_COMPLETED'],REGRESSION:['REGRESSION_TESTS_ADDED'],CORRECT:['CORRECTIONS_COMPLETED']},19:{CONFIRM_FREEZE:[],EXECUTE_RUN:[],VERIFY:[],COMPARE:['CROSS_RUN_COMPARISON_COMPLETED'],REGRESSION_VERIFY:[],CONFIRM:['COMPLETE_TEST_SUITE_RUN','NEW_CRITICAL_DEFECTS','NEW_MAJOR_DEFECTS','NEW_REQUIREMENTS_DISCOVERED','INJECTED_DEFECTS_NOT_DETECTED','NEW_CORRECTNESS_AFFECTING_VARIANCE','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED','REQUIRED_RETURN_STAGE']}};
          for(const [stage,operations] of Object.entries(expectedOperationStageFields))for(const [operation,fields] of Object.entries(operations)){const op=schema.operationContract(Number(stage),operation);if(!arraysEqual(op.agentStageFields,fields))throw new Error(`Stage ${stage} ${operation} has wrong writable stage fields: ${op.agentStageFields.join(', ')}`);const descriptor=prompts.responseContractDescriptor(Number(stage),operation);if(!arraysEqual(descriptor.agentStageFields,fields))throw new Error(`Stage ${stage} ${operation} prompt contract exposes wrong stage fields.`);}
          {const p=baseProject(),compare=prompts.buildPromptRecord(17,p,{operation:'COMPARE'}),correct=prompts.buildPromptRecord(17,p,{operation:'CORRECT'});if(compare.prompt.includes('- CORRECTIONS_COMPLETED:'))throw new Error('COMPARE prompt exposes CORRECT stageData.');if(!correct.prompt.includes('- CORRECTIONS_COMPLETED:'))throw new Error('CORRECT prompt omits correction stageData.');}
          """
          if anchor not in s: raise SystemExit('prompt semantic insertion anchor missing')
          p.write_text(s.replace(anchor,add+anchor,1))

          p=Path('verify-full-cycle.mjs'); s=p.read_text()
          old="function data(stage,{operation,stageData={},records={},scope={}}={}){const pr=prompt(stage,operation,scope);if(!Object.keys(stageData).length&&!Object.keys(records).length){const f=schema.STAGE_CONTRACTS[stage].allowedStageData[0];if(f)stageData[f]=schema.STAGE_FIELDS[stage][f].valueType==='BOOLEAN'?true:`fixture-${f.toLowerCase()}`;}"
          new="function data(stage,{operation,stageData={},records={},scope={}}={}){const pr=prompt(stage,operation,scope),op=schema.operationContract(stage,pr.operation),operationStageFields=op?.agentStageFields||schema.STAGE_CONTRACTS[stage].allowedStageData;if(!Object.keys(stageData).length&&!Object.keys(records).length){const f=operationStageFields[0];if(f)stageData[f]=schema.STAGE_FIELDS[stage][f].valueType==='BOOLEAN'?true:`fixture-${f.toLowerCase()}`;}"
          if old not in s: raise SystemExit('full-cycle helper anchor missing')
          s=s.replace(old,new,1)
          old="data(19,{operation:'CONFIRM_FREEZE',stageData:{COMPLETE_TEST_SUITE_RUN:'PENDING'}});engine.freezeCandidate"
          if old not in s: raise SystemExit('full-cycle confirm-freeze anchor missing')
          s=s.replace(old,"engine.freezeCandidate",1)
          old="data(19,{operation:'CONFIRM',records:{confirmationRecords:"
          new="data(19,{operation:'CONFIRM',stageData:{COMPLETE_TEST_SUITE_RUN:'TRUE',NEW_CRITICAL_DEFECTS:'NONE',NEW_MAJOR_DEFECTS:'NONE',NEW_REQUIREMENTS_DISCOVERED:'NONE',INJECTED_DEFECTS_NOT_DETECTED:'NONE',NEW_CORRECTNESS_AFFECTING_VARIANCE:'NONE',CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED:'TRUE',REQUIRED_RETURN_STAGE:'NONE'},records:{confirmationRecords:"
          if old not in s: raise SystemExit('full-cycle confirm anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify exact repaired branch
        shell: bash
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit green patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-operation-stage-data-isolation.yml .github/workflows/one-time-operation-stage-data-isolation-v2.yml .github/workflows/one-time-operation-stage-data-isolation-v3.yml
          git add workflow-schema.js prompt-engine.js response-ingestion.js verify-ingestion.mjs verify-prompt-semantics.mjs verify-full-cycle.mjs
          git commit -m 'Enforce operation-specific stageData authority'
          git push origin HEAD:operation-stage-data-isolation-20260826
