name: Apply exact prompt authority corrections
on:
  push:
    branches: [practical-100/current-main-prompt-authority]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/current-main-prompt-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct only stage procedure authority semantics
        shell: python
        run: |
          from pathlib import Path
          import json,re
          p=Path('prompt-engine.js'); s=p.read_text()
          procedures={
          1:"Initialize this current job only from the current human-supplied User Job Input. Preserve the verbatim request, supplied-material inventory and provenance, explicit constraints, known human authority, allowed tools, prohibited actions, assumptions, and unresolved unknowns. First determine whether the requested deliverable can actually be completed reliably in the authorized environment. The application itself does not connect to or modify an external repository. If required repository, runtime, account, network, deployment, or tool access is absent, do not pretend implementation occurred: propose the most complete reliable implementation-ready specification, architecture, patch plan, acceptance criteria, or other feasible deliverable. Self-contained deliverables such as research, analysis, specifications, papers, applications, and similar artifacts may be produced directly when the authorized environment is sufficient. The application owns JOB_ID, input versions, timestamps, lifecycle state, and derived next action. Do not create or prescribe a reusable master job or prompt for unrelated jobs. Do not begin substantive Stage 02 research or downstream production work.",
          2:"Build the independent external source inventory for this current job only. Treat any desired or suggested source count as a search target, never as authority to invent or pad sources. When web or external-source access is actually available, search it and inspect the source itself before claiming verification. Select sources according to what the job actually needs: prefer primary, official, controlling authority where such authority exists; otherwise prefer the most authoritative, reputable, direct, current evidence appropriate to the claim and domain. Verify source identity, issuer or publisher, currency, supersession, applicability, and exact location when possible. Use reputable secondary sources for corroboration or context when appropriate, not as substitutes for available controlling primary authority. Seek the requested source count when legitimate useful sources exist; return fewer rather than adding weak or irrelevant sources, and continue beyond the target when governing coverage requires it. If no legitimate external source applies after evidence-supported inspection, return the explicit NO_APPLICABLE_EXTERNAL_SOURCE determination rather than inventing a source. User Job Input and supplied materials remain authorized project inputs but are not automatically independent external sources. Never use the target product, this application, its repository/source/UI/stored state, generated prompts, prior target implementations, or project outputs as authority for requirements merely because they exist. Report substantive source findings and evidence only. The application assigns canonical SOURCE_ID values, source-set version, hashes from controlled bytes, lifecycle state, counts, and gate state after validated ingestion.",
          3:"Research only the current accepted Stage 02 independent external source set, source-by-source and pass-by-pass. If Stage 02 validly established NO_APPLICABLE_EXTERNAL_SOURCE, do not invent research records; report Stage 03 as substantively not applicable with any remaining user-input-only observations or blockers required by the stage contract. Otherwise examine exact source portions and separately capture facts, obligations, recommendations, optional practices, examples, prohibitions, exceptions, dependencies, applicability, restrictions, invalidating material, conflicts, superseded guidance, evidence, candidate requirement substance, and unresolved questions. Do not research the target product, this application/repository, prior implementations, project-generated artifacts, or current UI behavior as requirement authority. Repeat discovery passes until saturation is supported by evidence. The application owns canonical IDs, versions, record lifecycle, and gate calculations.",
          4:"Compile atomic proposed requirements for this current job from authorized User Job Input plus legitimately applicable Stage 03 research, preserving provenance for every obligation. Propose one independently testable obligation per requirement where possible and provide requirement type, mandatory/optional status, governing source or user-input relationship, exact source location when applicable, authority, applicability, dependencies, prohibitions, defined terms, observable satisfaction condition, intended verification method, expected evidence, failure condition, severity, and notes. The application assigns REQ_ID and controlled requirement-set version after validated acceptance. Do not derive requirements from a target product or existing implementation merely because it contains a behavior.",
          5:"Review and resolve the substantive current requirement set. Detect duplicate or conflicting requirements, impossible combinations, undefined terms, circular dependencies, missing prerequisites, unsupported requirements, uncertain applicability, and requirements lacking a verification method. Preserve the defect, governing evidence, proposed resolution or unresolved state, affected requirement, and blockers. Ask for human input only for genuine human-authority decisions or missing human facts. The application owns canonical versions, lifecycle state, downstream invalidation, counts, and gate state. Never silently guess away a conflict or manufacture authority.",
          6:"Author proposed verification tests before production instruction authoring. Every current active mandatory requirement must have at least one appropriate ready test. Use the strongest suitable method, including exact computation, programmatic/schema/structure checks, source comparison, rule-based verification, and independent meaning/content review where deterministic checks cannot establish satisfaction. Define inputs, tools, procedure, expected result, failure condition, and evidence to preserve. The application assigns TEST_ID and test-suite version and calculates exact mandatory requirement-to-test coverage; do not assert application-owned coverage values or completion state.",
          7:"Author the substantive mutation and failure-test proposals needed to prove validators reject realistic invalid states. Include applicable missing inputs, invalid values, wrong versions, duplicate identifiers, contradictions, omitted required sections, prohibited material, corrupt references, malformed files, conflicting authority, unavailable tools, unsupported claims, injected source instructions, known-invalid artifacts, and other relevant mutations. Preserve fixture, expected rejection, actual observed result when truly executed, validator defect where applicable, and evidence. Never claim an unexecuted mutation ran. The application owns canonical IDs, controlled suite identity/version, derived coverage, lifecycle state, and gates.",
          8:"Author the production instruction only from the resolved current requirement set and verification architecture. Define objective, authorized inputs, authority rules, failure handling, scope, prohibitions, defined terms, ordered procedure, branches, tool requirements, output contract, TRUE/FALSE/UNKNOWN handling, rejection/blocking rules, completion conditions, and requirement traceability. Do not copy or imitate an existing target implementation as authority. Do not turn this job’s production instruction into a reusable instruction for unrelated jobs unless the current User Job Input explicitly requires that deliverable. The application assigns canonical instruction identity/version and calculates trace/gate completeness after validated ingestion.",
          9:"Perform an independent substantive preflight of the current production instruction. Review every material clause and trace for multiple interpretations, undefined objects, unsupplied dependencies, internal conflicts, unavailable capabilities, objective verifiability, responsible operation, ordering, defined failure behavior, and traceability. Preserve findings and evidence. If correction is required, identify the exact substantive correction; the application controls canonical review identity, instruction versioning, lifecycle state, repeated-review requirement, and gate state. Do not execute target production during preflight.",
          10:"Review the exact candidate materials selected by the human for this iteration. The human selects authorized canonical components; the application assigns CANDIDATE_ID and ITERATION_ID, freezes the exact component manifest and stored bytes, and calculates hashes from verified bytes. Report substantive observations about role distribution, tool configuration, settings, permissions, limitations, or blockers. Do not invent or assign candidate/iteration identity, versions, hashes, timestamps, lifecycle state, or freeze status. One frozen candidate package must remain unchanged across the ten-run batch.",
          11:"Execute the assigned run using the exact application-reserved RUN_ID, CONTEXT_ID, ITERATION_ID, and frozen CANDIDATE_ID supplied in this prompt. Report actual execution observations, contamination state, tool configuration, complete output, tool failures, deviations, and evidence for this run only. Do not invent IDs, timestamps, lifecycle state, canonical artifact identity, byte size, or cryptographic hashes; the application owns those values and calculates byte facts from actual persisted bytes. Do not read or use another run’s output, reviewer comments, failure explanations, or corrections. Never select a preferred run to discard the others.",
          12:"Independently verify the executions in the exact scope supplied by this prompt. Produce exactly one current verification proposal for every required applicable REQ_ID × RUN_ID × TEST_ID triple in scope. Preserve verifier/context identity, independence status, inputs, procedure, expected result, observed result, exact evidence, substantive SATISFIED/VIOLATED/UNDETERMINED determination, defect reference where applicable, and reason for UNDETERMINED. Do not omit or duplicate triples, substitute wrong-version tests or wrong-iteration runs, or self-validate. The application calculates matrix cardinality, duplicates, completeness, coverage, lifecycle state, and gate state.",
          13:"Compare all ten current executions requirement-by-requirement and report substantive per-run observations, interpretation variance, output variance, authorized-versus-unauthorized variance evidence, inconclusive tests, repeated/unique failure patterns, correctness-affecting variance, linked defects, and evidence. Never discard a run because another appears preferable. The application calculates all-ten satisfaction, any-violation, any-undetermined, exact run coverage, counts, lifecycle state, and gate result.",
          14:"Perform evidence-supported root-cause analysis for every current material defect in scope by tracing backward through product/output, execution, instruction, requirement, research, source, user input, tool, and audit as applicable. Identify the substantive root-cause category, earliest defective layer, explanation, evidence, and required downstream rework. Unknown root cause remains unresolved; do not guess. The application owns canonical IDs, relationships, lifecycle state, downstream invalidation, and gate calculations.",
          15:"Define permanent regression coverage for every confirmed defect in scope. Preserve the failure fixture and identity/hash claim when available, reproduction procedure, detection method, applicability, permanent test location, and an actual PRE_CORRECTION execution with evidence that demonstrates the failure. Do not claim post-correction success at Stage 15; correction occurs later and success must come from a later actual regression execution. The application assigns REG_ID and regression-execution identities and owns lifecycle/active-retired state except for authorized retirement decisions.",
          16:"Propose the exact correction at the earliest responsible defective layer. Preserve triggering defects, RCA, responsible layer, old artifact version/reference, exact substantive modification, required reruns, instruction-change analysis, repeated-preflight need, and justified unchanged artifacts. Ask the human only for genuine authority/tradeoff decisions. The application assigns CHANGESET_ID, creates controlled versions, applies conservative downstream invalidation, records lifecycle state, and recalculates gates. Never overwrite a controlled version in place.",
          17:"Perform only the declared Stage 17 operation using the application-assigned corrected ITERATION_ID, CANDIDATE_ID, RUN_ID, and CONTEXT_ID in scope. The application creates the new iteration/candidate/run/context identities and freezes verified candidate bytes. Use ten new independent contexts for EXECUTE_RUN, withhold prior outputs, and keep one identical corrected candidate package across all runs. For VERIFY, COMPARE, ROOT_CAUSE, REGRESSION, and CORRECT, return only the substantive proposals permitted by that operation contract. Do not invent canonical identities, hashes, lifecycle state, derived counts, or completion. The application evaluates the full corrected iteration from all required operations and current evidence.",
          18:"Review the latest completed corrected iteration for any remaining anomaly, missing evidence, contradiction, ambiguity, defect, or unexplained correctness-affecting variance. Explain substantive problems and evidence; do not set convergence. The application calculates requirement coverage, exact verification coverage, applicable regression success, critical/major defect counts, unresolved unknowns, contradiction/ambiguity counts, unexplained variance, and the final convergence Boolean from current canonical scope.",
          19:"Perform only the declared Stage 19 unchanged-confirmation operation using the exact existing converged candidate identity and application-assigned new iteration/run/context identities. Do not create or modify candidate identity or component hashes. Use ten new independent contexts for EXECUTE_RUN, rerun the complete required verification matrix and applicable permanent regression suite, compare all runs, and report any new defect, missed requirement, missed failure case, contamination, or correctness-affecting variance. The application verifies unchanged versions/hashes, evaluates all required operations, and determines confirmation completion.",
          20:"Inspect the proposed production baseline only after successful unchanged confirmation. The human authorizes the baseline selection; the application assigns BASELINE_ID, freezes exact approved versions and stored artifact bytes, calculates hashes, records immutable baseline identity/lifecycle state, and invalidates it after material upstream change. Report substantive discrepancies or blockers only; do not assign baseline identity, hashes, authorization, timestamps, or status.",
          21:"Produce the approved deliverable only when the actual authorized execution environment can do so reliably from the approved baseline. The application itself does not connect to or modify an external repository. If the requested implementation requires repository, runtime, account, network, deployment, or other execution access that is absent, do not claim implementation or fabricate product bytes; produce the complete implementation-ready specification/architecture/patch plan confirmed as the feasible deliverable at Stage 01, or return BLOCKED/EXECUTION_FAILED when even that cannot be completed reliably. Self-contained deliverables may be produced directly. Use only approved baseline materials and a fresh production context. The application assigns PRODUCT_ID, product/execution identity, timestamps, canonical artifact IDs, filenames/byte sizes/hashes from actual persisted bytes, storage references, lineage, lifecycle state, and gates. Report substantive generated content, tool observations, deviations, failures, and declared attachments; no uncontrolled post-generation editing is permitted.",
          22:"Perform every substantive deterministic check that is actually executable in the authorized environment against the current finished product and report procedure, expected result, observed result, evidence, and defect when applicable. Never claim a check ran when it did not. Objective canonical artifact identity, byte size, SHA-256, expected deterministic-test set/cardinality, duplicate/missing-result detection, counts, coverage, lifecycle state, and final gate calculation are application-owned.",
          23:"Perform independent meaning/content verification on the current finished product wherever deterministic checks cannot establish substantive satisfaction. For each applicable requirement in scope, report product location, required meaning, observed meaning, evidence-based comparison, substantive SATISFIED/VIOLATED/UNDETERMINED determination, defect reference when applicable, and reason a determination could not be made. Preserve reviewer independence. The application owns canonical identities, expected-review cardinality, duplicates/missing detection, lifecycle state, counts, and gate result.",
          24:"Perform adversarial verification on the current finished product using every declared applicable attack category and every active applicable historical regression pattern in context. Test missing/prohibited material, contradictions, impossible logic, unsupported facts, source misrepresentation, wrong versions, broken references, hidden assumptions, partial completion, nonsensical meaning, terminology inconsistency, unhandled exceptions, stale facts, malformed files, hidden content, export corruption, superficial keyword compliance, and other applicable attacks. Preserve actual attack, method, expected behavior, observed result, substantive finding, defect/severity, and evidence. Never claim an attack ran when it did not. The application owns canonical IDs, completeness/cardinality, lifecycle state, and gates.",
          25:"Inspect the exact current final representation and package. Report substantive rendering/opening observations, clipping, missing/blank content, broken layout, graphics/font substitution/overlap/hidden content, ordering/export corruption, package problems, defects, requirement trace observations, and irreducible human/reviewer judgments. The application derives canonical artifact inventory, filenames, versions where controlled, actual byte sizes, SHA-256 values, before/after byte identity, expected inspection set/cardinality, duplicates/missing detection, coverage, lifecycle state, and gate result from actual stored artifacts; do not overwrite objective byte facts.",
          26:"Independently reconcile process evidence and product evidence as two separate propositions. Report substantive discrepancies, unauthorized-modification evidence, chain-of-custody issues, missing required work, defects, blockers, and reviewer findings. Do not infer product correctness solely from process correctness or vice versa. The application derives required identities/counts, completeness, canonical relationships, lifecycle state, and gate result from current records.",
          27:"Review the complete current release evidence for substantive gaps, contradictions, unsupported findings, unresolved defects, blockers, stale evidence, or missing verification. Do not set or override a release state. The application evaluates current canonical evidence and creates exactly one idempotent ACCEPTED, REJECTED, or BLOCKED determination, its evidence hash, counts, lifecycle state, and downstream authorization effects. Human or agent preference cannot override that deterministic result; ACCEPTED alone does not authorize delivery.",
          28:"After the application has established a current Stage 27 ACCEPTED result, investigate any artifact discrepancy only as supporting analysis. The human selects the audited and delivery artifacts; the application joins them by canonical ARTIFACT_ID and authorized filename, hashes the exact selected bytes immediately before delivery, compares byte size and SHA-256 independently of selection order, rejects missing/extra/duplicate/renamed/resized/rehashed/stale mismatches, and determines authorization. Do not assert exact identity from metadata or array position.",
          29:"Investigate any missing traceability link identified by the application and report evidence that can establish a legitimate missing relationship. Do not fabricate a link or substitute raw-response identity for canonical evidence. The application constructs the complete current evidence graph for every mandatory requirement from canonical IDs: applicable authority or human authority → requirement → instruction trace → execution/product element → every applicable test → every required test result → canonical evidence → current release decision → every applicable released artifact identity, and determines graph completeness.",
          30:"Report substantive defect/regression findings, correction evidence, or retirement justification when needed, without rewriting prior records. The application maintains append-only defect/regression history, stable canonical IDs, supersession/correction relationships, lifecycle state, and event order. Every confirmed defect must retain a permanent regression definition and the latest applicable regression execution must have succeeded before baseline approval. Human authority is required for any explicitly authorized retirement; historical evidence remains preserved."
          }
          for n,text in procedures.items():
            pat=re.compile(rf'(?m)^{n}:.*,$')
            m=pat.findall(s)
            if len(m)!=1: raise SystemExit(f'Stage {n}: expected exactly one procedure line, found {len(m)}')
            s=pat.sub(f'{n}:'+json.dumps(text,ensure_ascii=False)+',',s,1)
          p.write_text(s)

          v=Path('verify-prompt-semantics.mjs'); t=v.read_text()
          marker='// PROMPT_AUTHORITY_COVERAGE_V2'
          if marker in t: raise SystemExit('Prompt authority coverage already present.')
          block=r'''
          // PROMPT_AUTHORITY_COVERAGE_V2
          const authorityForbidden=[
            [/Assign and preserve this job’s unique JOB_ID/i,'agent JOB_ID assignment'],
            [/Create SOURCE-SET-vN/i,'agent source-set version assignment'],
            [/Each REQ_ID must express/i,'agent requirement-ID coordination'],
            [/Calculate mandatory requirement-to-test coverage exactly/i,'agent coverage calculation'],
            [/Build this job’s MUTATION-SUITE-vN/i,'agent mutation-suite version assignment'],
            [/Assign CANDIDATE_ID and ITERATION_ID/i,'agent candidate/iteration assignment'],
            [/For each RUN_ID preserve context identity, timestamps/i,'agent run-lifecycle ownership'],
            [/create a complete new ten-execution iteration.*new ITERATION_ID and CANDIDATE_ID/i,'agent repeated-iteration assignment'],
            [/Determine convergence.*Calculate mandatory requirement coverage/i,'agent convergence calculation'],
            [/Assign BASELINE_ID/i,'agent baseline assignment'],
            [/Assign PRODUCT_ID, PRODUCT_VERSION, BASELINE_ID, EXECUTION_ID/i,'agent product identity assignment'],
            [/Apply this job’s release gate and produce exactly one determination/i,'agent release determination'],
            [/verify exact artifact identity immediately before release\. Compare audited artifact identity/i,'agent byte identity determination'],
            [/Preserve this job’s complete evidence chain for every mandatory requirement/i,'agent evidence-graph construction']
          ];
          for(const [pattern,name] of authorityForbidden)for(const [stage,text] of Object.entries(prompts.procedures))if(pattern.test(text))throw new Error(`Stage ${stage} prompt authority contradiction: ${name}`);
          const authorityRequired={
            1:['The application owns JOB_ID','does not connect to or modify an external repository'],
            2:['application assigns canonical SOURCE_ID values','return fewer rather than adding weak or irrelevant sources'],
            3:['NO_APPLICABLE_EXTERNAL_SOURCE','do not invent research records'],
            4:['application assigns REQ_ID'],6:['application assigns TEST_ID','calculates exact mandatory requirement-to-test coverage'],
            10:['human selects authorized canonical components','application assigns CANDIDATE_ID and ITERATION_ID'],
            11:['application owns run/context IDs','hashes calculated from actual persisted bytes'],
            12:['REQ_ID × RUN_ID × TEST_ID','application calculates matrix cardinality'],
            13:['application calculates all-ten satisfaction'],15:['application assigns REG_ID','later actual regression execution'],
            16:['application assigns CHANGESET_ID','downstream invalidation'],17:['Do not invent canonical identities'],
            18:['do not set convergence','final convergence Boolean'],19:['exact existing converged candidate identity'],
            20:['human authorizes the baseline selection','application assigns BASELINE_ID'],
            21:['complete implementation-ready specification','application assigns PRODUCT_ID'],
            22:['expected deterministic-test set/cardinality','application-owned'],25:['application derives canonical artifact inventory','actual byte sizes'],
            27:['Do not set or override a release state','application evaluates current canonical evidence'],
            28:['application joins them by canonical ARTIFACT_ID','hashes the exact selected bytes'],
            29:['application constructs the complete current evidence graph'],30:['application maintains append-only defect/regression history']
          };
          for(const [stage,phrases] of Object.entries(authorityRequired)){const text=prompts.procedures[Number(stage)];for(const phrase of phrases)if(!text.includes(phrase))throw new Error(`Stage ${stage} missing prompt-authority semantic: ${phrase}`);}
          console.log(JSON.stringify({promptAuthorityCoverage:true,authorityStages:Object.keys(authorityRequired).length,forbiddenAuthorityPatterns:authorityForbidden.length},null,2));
          '''
          v.write_text(t+'\n'+block)
      - name: Deterministic acceptance including semantic contradiction tests
        run: |
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Clean and publish permanent source only
        run: |
          rm .github/workflows/apply-prompt-authority.yml
          git diff --check
          test ! -e app.js
          ! find . -maxdepth 2 -type f \( -name '.repair-*' -o -name '*guard.js' -o -name 'prompt-display.js' \) | grep .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js verify-prompt-semantics.mjs .github/workflows/apply-prompt-authority.yml
          git diff --cached --check
          git commit -m "Make stage prompts authority-correct and model-agnostic"
          git push origin HEAD:practical-100/current-main-prompt-authority