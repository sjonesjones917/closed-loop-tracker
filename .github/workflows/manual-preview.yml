name: Manual application walkthrough package

on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact branch files for manual application walkthrough
        run: |
          set -euo pipefail
          mkdir -p walkthrough-source/.github/workflows
          cp index.html workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .nojekyll walkthrough-source/
          cp .github/workflows/pages.yml walkthrough-source/.github/workflows/pages.yml
          cp *.mjs walkthrough-source/
      - uses: actions/upload-artifact@v4
        with:
          name: walkthrough-source-${{ github.sha }}
          path: walkthrough-source
          if-no-files-found: error
