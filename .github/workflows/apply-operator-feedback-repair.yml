name: Apply verified operator feedback repair
on:
  push:
    branches: [repair/complete-conformance-continuation-20260914]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply repair
        env:
          OLD_BLOCK: ""
          NEW_BLOCK: ""
        run: |
          set -euo pipefail
          cat .repair-feedback/part* | base64 -d > /tmp/raw.patch
          python3 -c "from pathlib import Path; p=Path('/tmp/raw.patch'); lines=p.read_text().splitlines(); Path('/tmp/fixed.patch').write_text('\\n'.join(line.replace('paintOperatorAction(.);','paintOperatorAction();') for i,line in enumerate(lines,1) if not 67 <= i <= 79)+'\\n')"
          git apply --reject --recount /tmp/fixed.patch || true
          python3 -c "import os,base64; from pathlib import Path; p=Path('app-core.js'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_BLOCK']).decode(); new=base64.b64decode(os.environ['NEW_BLOCK']).decode(); assert old in s; p.write_text(s.replace(old,new))"
          python3 -c "from pathlib import Path; p=Path('verify-conformance-regressions.mjs'); s=p.read_text(); n=\"'verify-operator-action-lifecycle.mjs',\"; p.write_text(s if \"'verify-operator-feedback.mjs',\" in s else s.replace(n,n+\"'verify-operator-feedback.mjs',\",1))"
          rm -f *.rej
      - name: Verify focused dependency closure
        run: |
          set -euo pipefail
          node --check app-core.js
          node --check verify-operator-feedback.mjs
          node --check verify-complete-operator-journey.mjs
          node verify-operator-feedback.mjs
          node verify-operator-action-lifecycle.mjs
          node verify-workflow-focus.mjs
          node verify-file-first-operator.mjs
          node verify-ui-acceptance-impact.mjs
          node verify-ui-persistence-preconditions.mjs
      - name: Commit verified repair and remove scaffolding
        run: |
          set -euo pipefail
          rm -rf .repair-feedback .github/workflows/apply-operator-feedback-repair.yml
          git add -A
          git config user.name 'closed-loop conformance bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Close operator loading startup and latency feedback gaps'
          git push origin HEAD:repair/complete-conformance-continuation-20260914
