name: Apply verified operator feedback repair

on:
  push:
    branches:
      - repair/complete-conformance-continuation-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact repair
        run: |
          set -euo pipefail
          cat .repair-feedback/part* | base64 -d > /tmp/operator-feedback.patch
          patch -p1 --forward < /tmp/operator-feedback.patch
      - name: Verify focused dependency closure
        run: |
          set -euo pipefail
          node --check app-core.js
          node --check verify-operator-feedback.mjs
          node --check verify-complete-operator-journey.mjs
          node verify-operator-feedback.mjs
          node verify-operator-action-lifecycle.mjs
          node verify-workflow-focus.mjs
          node verify-file-first-operator.mjs
          node verify-ui-acceptance-impact.mjs
          node verify-ui-persistence-preconditions.mjs
      - name: Commit verified repair
        run: |
          set -euo pipefail
          rm -rf .repair-feedback
          git add -A -- ':!.github/workflows/apply-operator-feedback-repair.yml'
          git config user.name 'closed-loop conformance bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Close operator loading startup and latency feedback gaps'
          git push origin HEAD:repair/complete-conformance-continuation-20260914
