name: Restore prompt size once
on:
  push:
    branches: [fix/restore-prompt-size-20260830]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-prompt-size-20260830
      - name: Restore only the prompt dimensions and refresh cache identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.expandable-prompt{max-height:80vh}.expandable-prompt.expanded{max-height:none}'
          new='.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'
          if old not in s:
              raise SystemExit('Expected changed prompt-size rule was not found; refusing unrelated edits.')
          s=s.replace(old,new,1).replace('runtime-20260830-live-operator-40','runtime-20260830-live-operator-41')
          p.write_text(s)
          p=Path('app-core.js')
          s=p.read_text()
          old_id="const RUNTIME_BUILD_ID='runtime-20260830-live-operator-40';"
          new_id="const RUNTIME_BUILD_ID='runtime-20260830-live-operator-41';"
          if old_id not in s:
              raise SystemExit('Expected runtime build identity was not found; refusing unrelated edits.')
          p.write_text(s.replace(old_id,new_id,1))
          PY
          rm .github/workflows/restore-prompt-size-once.yml
      - name: Commit the narrow repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app-core.js .github/workflows/restore-prompt-size-once.yml
          git commit -m 'Restore original prompt box dimensions'
          git push origin HEAD:fix/restore-prompt-size-20260830
