name: Materialize application-control prompt UI repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-application-control-prompt-ui.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source repair branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='repair/application-control-prompt-ui-final'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-core.js')
          s=p.read_text()
          control_code="""const action=displayedStageAction(n),applicationControlTypes=new Set(['RUN_APP_TESTS','CALCULATE_RELEASE','BUILD_EVIDENCE_CHAINS','FREEZE_CANDIDATE','RESERVE_RUN_BATCH','BEGIN_UNCHANGED_CONFIRMATION','FREEZE_BASELINE','REGISTER_PRODUCTION_CONTEXT','RESERVE_PRODUCT_EXECUTION']);if(applicationControlTypes.has(action.actionType))return `NO EXTERNAL AGENT INSTRUCTION REQUIRED\n\n${action.heading||'Complete the current application control step'}\n\n${action.explanation||action.blockingReason||''}\n\nComplete this control step in the application first. Do not send an agent prompt or paste agent JSON. If external agent work is required afterward, the application will generate a new current controlling instruction from the resulting canonical state.`;"""
          anchor="if(lock&&current.stages[n]?.status!=='COMPLETE')return"
          if control_code not in s:
              if anchor not in s:
                  raise SystemExit('currentStagePrompt lock anchor missing')
              s=s.replace(anchor,control_code+anchor,1)
          s=s.replace("The application must run the pending native deterministic verification before any external handoff. No agent prompt or final JSON is required for the pending native work.","No external instruction is used for the current application control step. Complete the current application action shown above first. If external agent work is required afterward, the application will expose a new current controlling instruction.")
          s=s.replace("No agent response belongs to the pending application-native verification. Run the application verification first.","No agent response belongs to the current application control step. Complete the application action shown above first. If external work is required afterward, use only the new current instruction the application generates.")
          p.write_text(s)

          for name in ['app-core.js','test-runtime.js','index.html']:
              f=Path(name)
              text=f.read_text()
              text=re.sub(r'runtime-20260830-live-operator-\d+','runtime-20260830-live-operator-53',text)
              f.write_text(text)

          wf=Path('.github/workflows/materialize-application-control-prompt-ui.yml')
          if wf.exists(): wf.unlink()
          PY
          git add -A
          git commit -m 'Hide agent prompts during application control steps'
          git push origin HEAD:"$BRANCH" --force
