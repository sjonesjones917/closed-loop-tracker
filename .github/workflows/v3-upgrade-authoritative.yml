name: Authoritative closed-loop v3 implementation closure
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths:
      - .github/workflows/v3-upgrade-authoritative.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: closed-loop-v3-upgrade
  cancel-in-progress: true
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the complete deterministic transformation exactly once
        run: |
          node upgrade-v3.mjs
          node upgrade-v3-compat.mjs
          node upgrade-v3-corrections.mjs
          node upgrade-v3-final.mjs
      - name: Syntax
        run: for file in *.js *.mjs; do node --check "$file"; done
      - name: Schema and ownership architecture
        run: node verify.mjs
      - name: Deterministic migration
        run: node verify-v3-migration.mjs
      - name: Test IR validation and security
        run: |
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
      - name: Deterministic runtime and canonical hashing
        run: |
          node verify-test-runtime.mjs
          node verify-hash.mjs
      - name: Raw-first ingestion
        run: node verify-ingestion.mjs
      - name: Workflow gates and full cycle
        run: |
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Prompt contradictions, leakage, and semantic false acceptance
        run: |
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
      - name: Definition of done and project lifecycle
        run: |
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Local Chromium at 320, 393, and desktop widths
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove all temporary implementation machinery and commit proven source
        run: |
          rm -f upgrade-v3.mjs upgrade-v3-compat.mjs upgrade-v3-corrections.mjs upgrade-v3-final.mjs v3-upgrade-report.json
          rm -f .github/workflows/v3-upgrade.yml .github/workflows/v3-upgrade-compat.yml .github/workflows/v3-upgrade-corrections.yml .github/workflows/v3-upgrade-final.yml .github/workflows/v3-upgrade-authoritative.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement complete closed-loop v3 deterministic reliability contract"
          git push origin HEAD:implementation/closed-loop-v3
# triggered 2026-08-30 authoritative closure
