name: Finalize current-main PR6 acceptance
on:
  push:
    branches: [practical-100/pr6-acceptance-current]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize Stage 17 candidate freeze fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js');s=p.read_text()
          s=s.replace("function freezeCandidate(project,{artifactIds=[],operatorLabel='HUMAN_OPERATOR',purpose='TEST_CANDIDATE',toolConfiguration=", "function freezeCandidate(project,{stage=10,artifactIds=[],operatorLabel='HUMAN_OPERATOR',purpose='TEST_CANDIDATE',toolConfiguration=",1)
          s=s.replace("const iteration={id:iterationId,stage:10,createdAt,active:true,scope:currentScope(project),fields:iterationFields,...iterationFields,source:'APPLICATION_DERIVATION'};", "const iteration={id:iterationId,stage:Number(stage),createdAt,active:true,scope:{...currentScope(project),iterationId,candidateId},fields:iterationFields,...iterationFields,source:'APPLICATION_DERIVATION'};",1)
          s=s.replace("const candidate={id:candidateId,stage:10,createdAt,active:true,scope:{...currentScope(project),iterationId,candidateId}", "const candidate={id:candidateId,stage:Number(stage),createdAt,active:true,scope:{...currentScope(project),iterationId,candidateId}",1)
          s=s.replace("addHistory(project,'CANDIDATE_FROZEN',{stage:10,iterationId,candidateId", "addHistory(project,'CANDIDATE_FROZEN',{stage:Number(stage),iterationId,candidateId",1)
          p.write_text(s)
          PY
          node --check workflow-engine.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js
          git commit -m "Honor stage ownership when freezing corrected candidates"
          git push --force origin HEAD:practical-100/pr6-acceptance-current
      - name: Capture next lifecycle boundary
        shell: bash
        run: |
          set +e
          node verify-full-cycle.mjs | tee /tmp/full-cycle.log
          status=${PIPESTATUS[0]}
          set -e
          echo "full-cycle-exit=$status"
          exit 0
