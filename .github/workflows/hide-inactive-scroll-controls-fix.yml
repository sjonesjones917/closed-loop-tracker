name: Hide inactive scroll controls fix

on:
  push:
    branches:
      - fix/hide-inactive-scroll-controls-20260827

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hide-inactive-scroll-controls-20260827
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply minimal visibility correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hash_path = Path('hash.js')
          hash_text = hash_path.read_text()
          old = """    const reviewRect=review?.getBoundingClientRect();
              const longReview=review?.dataset.longReview==='true';
              const reviewActive=Boolean(longReview&&reviewRect&&reviewRect.bottom>0&&reviewRect.top<innerHeight);
              const reviewPast=Boolean(longReview&&reviewRect&&reviewRect.bottom<=0);
              const promptActive=Boolean(prompt?.classList.contains('expanded')&&!reviewActive&&!reviewPast);
          """
          new = """    const reviewRect=review?.getBoundingClientRect();
              const reviewDetails=review?.querySelector(':scope>details.record-card');
              const longReview=Boolean(review?.dataset.longReview==='true'&&reviewDetails?.open&&review?.scrollHeight>innerHeight);
              const reviewActive=Boolean(longReview&&reviewRect&&reviewRect.bottom>0&&reviewRect.top<innerHeight);
              const reviewPast=Boolean(longReview&&reviewRect&&reviewRect.bottom<=0);
              const promptActive=Boolean(prompt?.classList.contains('expanded')&&prompt?.scrollHeight>innerHeight&&!reviewActive&&!reviewPast);
          """
          if hash_text.count(old) != 1:
              raise SystemExit(f'hash.js visibility target count: {hash_text.count(old)}')
          hash_text = hash_text.replace(old, new)
          toggle_listener = "  document.addEventListener('change',()=>queueMicrotask(syncMatchedScrollJumps));\n"
          toggle_replacement = toggle_listener + "  document.addEventListener('toggle',()=>queueMicrotask(syncMatchedScrollJumps),true);\n"
          if hash_text.count(toggle_listener) != 1:
              raise SystemExit(f'hash.js listener target count: {hash_text.count(toggle_listener)}')
          hash_text = hash_text.replace(toggle_listener, toggle_replacement)
          hash_path.write_text(hash_text)

          browser_path = Path('verify-browser.mjs')
          browser = browser_path.read_text()
          marker = "assert(await evalValue(cdp,`document.querySelector('#proposal-heading>details.record-card')?.open===true`),'Long proposal diff must remain expanded.');"
          insertion = marker + "await click(cdp,'#proposal-heading>details.record-card>summary');await waitExpr(cdp,`(()=>{const details=document.querySelector('#proposal-heading>details.record-card'),top=document.querySelector('#review-top-jump'),bottom=document.querySelector('#review-bottom-jump');return Boolean(details&&!details.open&&top?.hidden&&bottom?.hidden);})()`);await click(cdp,'#proposal-heading>details.record-card>summary');await waitExpr(cdp,`(()=>{const details=document.querySelector('#proposal-heading>details.record-card'),top=document.querySelector('#review-top-jump'),bottom=document.querySelector('#review-bottom-jump');return Boolean(details?.open&&top&&!top.hidden&&bottom&&!bottom.hidden);})()`);"
          if browser.count(marker) != 1:
              raise SystemExit(f'verify-browser.mjs review marker count: {browser.count(marker)}')
          browser = browser.replace(marker, insertion)
          browser_path.write_text(browser)
          PY

          node <<'NODE'
          const fs=require('node:fs');
          const {createHash}=require('node:crypto');
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[a-f0-9]{16}/g,token);
          const tokens=[...html.matchAll(/<script defer src="[^"]+\?v=(runtime-[a-f0-9]{16})"><\/script>/g)].map(match=>match[1]);
          if(tokens.length!==8||new Set(tokens).size!==1||tokens[0]!==token)throw new Error('Runtime token update failed.');
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE

      - name: Verify complete application and browser behavior
        shell: bash
        run: |
          node --check hash.js
          node --check verify-browser.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node verify-browser.mjs
          node verify-browser-extra.mjs

      - name: Commit only the verified minimal correction
        shell: bash
        run: |
          rm .github/workflows/hide-inactive-scroll-controls-fix.yml
          git config user.name "sjonesjones917"
          git config user.email "sjones.jones917@gmail.com"
          git add hash.js verify-browser.mjs index.html .github/workflows/hide-inactive-scroll-controls-fix.yml
          git commit -m "Hide scroll controls when content is collapsed"
          git push origin HEAD:fix/hide-inactive-scroll-controls-20260827
