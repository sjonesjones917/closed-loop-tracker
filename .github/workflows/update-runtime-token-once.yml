name: Materialize runtime identity once
on:
  push:
    branches: [reliability/eliminate-gate-full-project-clone-20260828]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/eliminate-gate-full-project-clone-20260828
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Update exact runtime identity
        run: sed -i 's/runtime-424a0a7f3e43865d/runtime-fb6d7c4dedb36682/g' index.html
      - name: Prove exact runtime identity
        run: node verify-hash.mjs
      - name: Remove bootstrap and commit
        run: |
          rm .github/workflows/update-runtime-token-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh runtime identity for semantic gate repair'
          git push origin HEAD:reliability/eliminate-gate-full-project-clone-20260828
