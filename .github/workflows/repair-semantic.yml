name: Apply semantic adjudication repair payload
on:
  push:
    branches: [reliability-semantic-adjudication]
    paths: ['.repair-semantic/READY']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-semantic-adjudication
          fetch-depth: 0
      - name: Apply exact locally verified patch
        run: |
          set -euo pipefail
          cat .repair-semantic/gz-00 .repair-semantic/gz-01 .repair-semantic/gz-02 .repair-semantic/gz-03a .repair-semantic/gz-03b .repair-semantic/gz-04 .repair-semantic/gz-05 .repair-semantic/gz-06 .repair-semantic/gz-07 .repair-semantic/gz-08a .repair-semantic/gz-08b .repair-semantic/gz-09 .repair-semantic/gz-10 .repair-semantic/gz-11 .repair-semantic/gz-12 .repair-semantic/gz-13 .repair-semantic/gz-14 .repair-semantic/gz-15 .repair-semantic/gz-16 > /tmp/semantic.patch.gz.b64
          base64 -d /tmp/semantic.patch.gz.b64 > /tmp/semantic.patch.gz
          gzip -dc /tmp/semantic.patch.gz > /tmp/semantic.patch
          echo '174fc99648c22ba0331f53c24b12b8239104a9e09deefa5b065b68b74c8d3dd4  /tmp/semantic.patch' | sha256sum -c -
          rm -f verify-adjudication.mjs
          git apply --check /tmp/semantic.patch
          git apply /tmp/semantic.patch
          rm -rf .repair-semantic
          rm -f .github/workflows/repair-semantic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Enforce application-owned semantic adjudication'
          git push origin HEAD:reliability-semantic-adjudication
