name: PR6 apply regression scope
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact current-scope correction
        run: |
          python .pr6-regression-scope.py
          rm -f .pr6-regression-scope.py .github/workflows/pr6-apply-regression-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Keep permanent regressions current across iterations'
          git push
