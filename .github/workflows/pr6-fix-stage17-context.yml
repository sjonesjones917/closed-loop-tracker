name: PR6 fix Stage 17 context fixture
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove application-owned context assertion
        run: |
          python .pr6-fix-stage17-context.py
          rm -f .pr6-fix-stage17-context.py .github/workflows/pr6-fix-stage17-context.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Derive Stage 17 context count in application'
          git push
