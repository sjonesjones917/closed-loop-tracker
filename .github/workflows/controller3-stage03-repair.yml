name: Controller 3 Stage 03 repair
on:
  push:
    branches:
      - controller3-exec-20260904-2628669
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          ref: controller3-exec-20260904-2628669
          fetch-depth: 0
      - uses: actions/setup-node@5e2628c959b9a0733e173b40a961100b681af08c
        with:
          node-version: '22'
      - name: Apply repair
        run: node verification/apply-controller3-stage03-source-research.mjs
      - name: Execute focused invalid/repaired path
        run: node verify-stage03-source-research.mjs
      - name: Replay affected downstream verification
        run: |
          node verify-stage-operation-registry.mjs
          node verify-contract-closure.mjs
          node verify-data-route-closure.mjs
          node verify-spec-grounded-route-oracle.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          node verify-complete.mjs
      - name: Commit behavior repair and remove applicator
        run: |
          rm verification/apply-controller3-stage03-source-research.mjs
          rm .github/workflows/controller3-stage03-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js verify-spec-grounded-route-oracle.mjs verify-stage03-source-research.mjs .github/workflows/pages.yml verification/apply-controller3-stage03-source-research.mjs .github/workflows/controller3-stage03-repair.yml
          git commit -m "Fix Stage 03 independent source-research operations"
          git push origin HEAD:controller3-exec-20260904-2628669
