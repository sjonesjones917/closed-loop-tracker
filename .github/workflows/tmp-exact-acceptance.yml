name: Exact reliability acceptance runner
on:
  push:
    branches:
      - reliability-exact-acceptance-20260827
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-exact-acceptance-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reliability delta and verify
        run: |
          sed -i "/stage19 evidence gate/d" .tmp-exact-acceptance.mjs
          node .tmp-exact-acceptance.mjs
          python3 - <<'PY'
          p='workflow-engine.js';s=open(p,encoding='utf-8').read()
          old="if(mode==='EXTERNAL_AGENT_TOOL'){requiredEvidenceClasses.push('CAPABILITY_EXECUTION');"
          new="const specializedReview=Number(result?.stage)===23||Number(result?.stage)===24||Object.prototype.hasOwnProperty.call(recordFields(result),'OBSERVED_MEANING')||Object.prototype.hasOwnProperty.call(recordFields(result),'ATTACK');if(mode==='EXTERNAL_AGENT_TOOL'&&!byteTest&&!specializedReview){requiredEvidenceClasses.push('CAPABILITY_EXECUTION');"
          if old not in s: raise SystemExit('external-tool evidence rule target missing')
          s=s.replace(old,new,1)
          old="const ids=evidenceReferences(result),evidence=ids.map(id=>records(project,'evidenceRecords').find(x=>recordId(x,'evidenceRecords')===id)).filter(Boolean),narrative=['EXACT_EVIDENCE','EVIDENCE','PROCESS_EVIDENCE','PRODUCT_EVIDENCE','CONTROLLING_EVIDENCE'].map(k=>String(recordValue(result,k)||'').trim()).find(Boolean)||''"
          new="const ids=evidenceReferences(result),evidence=ids.map(id=>records(project,'evidenceRecords').find(x=>recordId(x,'evidenceRecords')===id)).filter(Boolean),narrative=['EXACT_EVIDENCE','EVIDENCE','PROCESS_EVIDENCE','PRODUCT_EVIDENCE','CONTROLLING_EVIDENCE','EXTERNAL_SOURCE_EVIDENCE','EVIDENCE_BASED_COMPARISON'].map(k=>String(recordValue(result,k)||'').trim()).find(Boolean)||''"
          if old not in s: raise SystemExit('evidence narrative target missing')
          s=s.replace(old,new,1)
          old="reviewerContextId=String(project.stages?.[stage]?.derivedData?.[key]||'').trim(),base=evaluateContextIndependence(project,{role:stage===23?'MEANING_REVIEW':'ADVERSARIAL_REVIEW',reviewerContextId,productionContextId});if(base.determination==='VIOLATED')return base;const externallySupported=truth(project.stages?.[stage]?.agentData?.[claimKey]);if(base.determination==='UNKNOWN'&&externallySupported)return"
          new="reviewerIdentity=String(project.stages?.[stage]?.derivedData?.[key]||'').trim(),reviewerContext=records(project,'freshContexts').find(r=>recordId(r,'freshContexts')===reviewerIdentity&&isActiveRecord(r)),reviewerContextId=reviewerContext?reviewerIdentity:'',base=reviewerContextId?evaluateContextIndependence(project,{role:stage===23?'MEANING_REVIEW':'ADVERSARIAL_REVIEW',reviewerContextId,productionContextId}):{determination:'UNKNOWN',reasons:['The external reviewer context is not application-observable.'],evidence:[]};if(base.determination==='VIOLATED')return base;const externallySupported=truth(project.stages?.[stage]?.agentData?.[claimKey]);if(base.determination==='UNKNOWN'&&externallySupported)return"
          if old not in s: raise SystemExit('reviewer context namespace target missing')
          s=s.replace(old,new,1)
          old="if(test&&!evaluateEvidenceSufficiency(project,{test,result}).sufficient)reasons.push('Meaning review '+recordId(result,'meaningResults')+' has evidence insufficient for the proposition.');"
          new="if(test){const proof=evaluateEvidenceSufficiency(project,{test,result});if(!proof.sufficient)reasons.push('Meaning review '+recordId(result,'meaningResults')+' has evidence insufficient for the proposition: '+proof.reasons.join('; ')+'.');}"
          if old not in s: raise SystemExit('stage23 reason target missing')
          s=s.replace(old,new,1)
          old="if(!evaluateEvidenceSufficiency(project,{test,result}).sufficient)reasons.push('Adversarial result '+recordId(result,'adversarialResults')+' has insufficient evidence.');"
          new="{const proof=evaluateEvidenceSufficiency(project,{test,result});if(!proof.sufficient)reasons.push('Adversarial result '+recordId(result,'adversarialResults')+' has insufficient evidence: '+proof.reasons.join('; ')+'.');}"
          if old not in s: raise SystemExit('stage24 reason target missing')
          s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          p='verify-complete.mjs';s=open(p,encoding='utf-8').read()
          old="const humanResult=record('representationInspections',25,{DETERMINATION:'SATISFIED',EVIDENCE:'EVIDENCE-H'},'INS-H');p.projectData.evidenceRecords.push"
          new="const humanResult=record('representationInspections',25,{DETERMINATION:'SATISFIED',EVIDENCE:'EVIDENCE-H'},'INS-H');humanResult.evidenceRefs=['EVIDENCE-H'];p.projectData.evidenceRecords.push"
          if old not in s: raise SystemExit('human evidence fixture target missing')
          open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          p='verify-full-cycle.mjs';s=open(p,encoding='utf-8').read()
          old="data(23,{records:{meaningResults:"
          new="data(23,{stageData:{EVALUATOR_INDEPENDENT_FROM_GENERATOR:'TRUE'},records:{meaningResults:"
          if old not in s: raise SystemExit('stage23 fixture target missing')
          s=s.replace(old,new,1)
          old="data(24,{records:{adversarialResults:"
          new="data(24,{stageData:{REVIEWER_INDEPENDENT:'TRUE'},records:{adversarialResults:"
          if old not in s: raise SystemExit('stage24 fixture target missing')
          open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          PY
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=f=>{const b=fs.readFileSync(f);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(f=>`${f}:${blob(f)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+("\s*><\/script>)/g,`$1${token}$2`);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check response-ingestion.js
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          rm -f .tmp-trigger .tmp-exact-acceptance.mjs .github/workflows/tmp-exact-acceptance.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Complete exact reliability acceptance coverage"
          git push origin HEAD:reliability-exact-acceptance-20260827
