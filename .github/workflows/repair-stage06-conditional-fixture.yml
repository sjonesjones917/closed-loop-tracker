name: Repair Stage 06 ingestion fixture

on:
  push:
    branches: [fix/monotonic-reliability-pass-20260831]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use a coherent external Stage 06 fixture and remove every temporary repair workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="    records[collection]=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];\n    if(stage===4&&collection==='requirements')"
          new="    if(stage===6&&collection==='tests'){fields.TEST_TYPE='DETERMINISTIC';fields.EXECUTION_MODE='EXTERNAL_AGENT_TOOL';fields.REQUIRED_CAPABILITY='CONTROLLED_EXTERNAL_TOOL';fields.ARTIFACT_REQUIREMENTS='NONE';fields.EXECUTABLE_KIND='NONE';fields.EXECUTABLE_SPEC={};fields.EXECUTABLE_INPUT_BINDINGS={};}\n    records[collection]=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];\n    if(stage===4&&collection==='requirements')"
          if new not in s:
              if s.count(old)!=1:
                  raise SystemExit(f'Expected one Stage 06 fixture insertion point; found {s.count(old)}')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          rm -f .github/workflows/repair-stage06-conditional-fixture.yml .github/workflows/repair-stage06-native-fixture.yml
          node --check verify-ingestion.mjs
          node verify-ingestion.mjs
          node verify-monotonic-pass.mjs
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A verify-ingestion.mjs .github/workflows
          git commit -m "Use coherent external Stage 06 ingestion fixture"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831