name: Finalize lifecycle UI functional repair
on:
  push:
    branches: [reliability/lifecycle-ui-functional-repair-20260828]
    paths: ['.lifecycle-ui-finalize.mjs', '.lifecycle-ui-diagnostic.mjs', '.github/workflows/lifecycle-ui-diagnostic.yml']
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability/lifecycle-ui-functional-repair-20260828, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inject permanent user-visible lifecycle interaction regressions
        run: node .lifecycle-ui-diagnostic.mjs
      - name: Apply minimal retained-project lifecycle repair
        run: node .lifecycle-ui-finalize.mjs
      - name: Remove temporary construction files before architecture proof
        run: rm -f .lifecycle-ui-diagnostic.mjs .lifecycle-ui-finalize.mjs .github/workflows/lifecycle-ui-diagnostic.yml
      - name: Refresh runtime cache identity
        run: |
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          fs.writeFileSync('index.html',fs.readFileSync('index.html','utf8').replace(/runtime-[a-f0-9]{16}/g,token));
          console.log(token);
          NODE
      - name: Deterministic proof
        run: |
          node --check app-core.js
          node --check project-store.js
          node --check verify-browser-extra.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/lifecycle-ui-final-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Publish only proven final tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Allow retained reference project lifecycle management'
          git push origin HEAD:reliability/lifecycle-ui-functional-repair-20260828
