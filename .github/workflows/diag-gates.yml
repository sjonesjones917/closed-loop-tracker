name: Diagnose workflow gates
on:
  push:
    branches: [implementation/closed-loop-v3]
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node verify-complete.mjs > gates.log 2>&1 || true
          echo '--- FULL CYCLE ---' >> gates.log
          node verify-full-cycle.mjs >> gates.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with: {name: gate-diagnostic, path: gates.log}
