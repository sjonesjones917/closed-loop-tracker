name: Export implementation source snapshot

on:
  push:
    branches:
      - implementation/closed-loop-v3-bundle

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r source-snapshot.zip . -x '.git/*' 'source-snapshot.zip'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 1
          if-no-files-found: error
