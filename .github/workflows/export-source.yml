name: Export exact source
on:
  push:
    paths: ['.github/workflows/export-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Package exact tree
        run: tar --exclude=.git -czf /tmp/exact-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: zero-loss-e237-source
          path: /tmp/exact-source.tar.gz
          if-no-files-found: error
          retention-days: 1
