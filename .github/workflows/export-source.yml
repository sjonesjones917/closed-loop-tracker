name: Export semantic-adjudication source
on:
  push:
    branches: [semantic-adjudication-20260827]
    paths: ['.export-source/READY']
permissions: {contents: read}
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf /tmp/closed-loop-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-source
          path: /tmp/closed-loop-source.tgz
          if-no-files-found: error
          retention-days: 1
