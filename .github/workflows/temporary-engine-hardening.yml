name: Temporary engine hardening applicator
on:
  push:
    branches: [fix/restore-zero-loss-proof-20260831]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-zero-loss-proof-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow workflow-engine derivation fixes
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='workflow-engine.js';
          let text=fs.readFileSync(path,'utf8');
          const replacements=[
            ["if(stage===11){const runs=ev.runs,contexts=runs.map(r=>String(recordValue(r,'CONTEXT_ID')||r.relationships?.CONTEXT_ID||''));", "if(stage===11){const runs=safe(ev.matrix?.runs),contexts=runs.map(r=>String(recordValue(r,'CONTEXT_ID')||r.relationships?.CONTEXT_ID||''));"],
            ["ACTUAL_MANDATORY_RECORDS:matrix.actual.length", "ACTUAL_MANDATORY_RECORDS:matrix.verification.length"],
            ["const f=comparisonFacts(project,requirementId(req),iterationId);facts[requirementId(req)]={RUN_DETERMINATIONS:f.runDeterminations,ALL_TEN_SATISFIED:f.allSatisfied,ANY_VIOLATION:f.anyViolation,ANY_UNDETERMINED:f.anyUndetermined,SATISFIED_COUNT:f.determinations.filter(x=>x==='SATISFIED').length,VIOLATED_COUNT:f.determinations.filter(x=>x==='VIOLATED').length,UNDETERMINED_COUNT:f.determinations.filter(x=>!['SATISFIED','VIOLATED'].includes(x)).length};", "const f=comparisonFacts(project,requirementId(req),iterationId),determinations=safe(f?.determinations),runDeterminations=safe(f?.runDeterminations);facts[requirementId(req)]={RUN_DETERMINATIONS:runDeterminations,ALL_TEN_SATISFIED:Boolean(f?.allSatisfied),ANY_VIOLATION:Boolean(f?.anyViolation),ANY_UNDETERMINED:Boolean(f?.anyUndetermined),SATISFIED_COUNT:determinations.filter(x=>x==='SATISFIED').length,VIOLATED_COUNT:determinations.filter(x=>x==='VIOLATED').length,UNDETERMINED_COUNT:determinations.filter(x=>!['SATISFIED','VIOLATED'].includes(x)).length};"],
            ["const stability=iterationId?executionStability(project,iterationId):{repeatedDefectCount:0,uniqueDefectCount:0},comparisons=iterationId?recordsForIteration(project,'comparisons',iterationId):[];", "const stability=iterationId?executionStability(project,iterationId):{runCount:0,requirementStability:{},testStability:{},totalDistinctDefects:0,repeatedDefectCount:0,uniqueDefectCount:0,newDefectsByRun:{},unexplainedVarianceCount:0},comparisons=safe(iterationId?recordsForIteration(project,'comparisons',iterationId):[]);"],
            ["RUN_NAMESPACE:ev.runs.map(r=>recordId(r,'runs'))", "RUN_NAMESPACE:safe(ev.matrix?.runs).map(r=>recordId(r,'runs'))"]
          ];
          for(const [from,to] of replacements){
            const count=text.split(from).length-1;
            if(count!==1)throw new Error(`Expected exactly one engine replacement target; found ${count}: ${from.slice(0,100)}`);
            text=text.replace(from,to);
          }
          fs.writeFileSync(path,text);
          NODE
          node --check workflow-engine.js
          node verify-hash.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-engine.js
          git commit -m "Harden stage derivation against incomplete state"
          git push origin HEAD:fix/restore-zero-loss-proof-20260831
