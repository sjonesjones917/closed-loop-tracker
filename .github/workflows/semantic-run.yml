name: Run semantic reliability audit
on:
  push:
    branches:
      - semantic-reliability/final-audit
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-reliability/final-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semantic patch
        run: |
          python3 .semantic-patch.py
          python3 .semantic-patch-fix.py
      - name: Verify deterministic suites
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Verify Chromium suites
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified clean source
        run: |
          set -euo pipefail
          rm -f .semantic-patch.py .semantic-patch-fix.py .github/workflows/semantic-final-audit.yml .github/workflows/semantic-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close semantic prompt and recovery gaps"
          git push origin HEAD:semantic-reliability/final-audit
