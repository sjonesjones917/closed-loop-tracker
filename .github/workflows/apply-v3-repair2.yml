name: Run v3 repair
on:
  push:
    branches:
      - closed-loop-v3-completion
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-v3-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute repair program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/apply-v3-repair.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n",start)
          lines=text[start:end].splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/repair.py').write_text(script)
          PY
          python3 /tmp/repair.py
      - name: Commit repair
        shell: bash
        run: |
          rm -f .github/workflows/apply-v3-repair2.yml
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git commit -m "[v3-repair] enforce closed intake and Stage 04 obligation accounting"
          git push origin HEAD:closed-loop-v3-completion
