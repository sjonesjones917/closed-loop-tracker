name: Materialize required stage controls
on:
  push:
    branches: [fix/required-stage-control-sequencing-20260830]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/required-stage-control-sequencing-20260830
      - name: Materialize control sequencing
        run: |
          python .github/repair/stage-control-patch.py
          rm .github/repair/stage-control-patch.py .github/workflows/materialize-stage-control.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sequence required application control steps' || exit 0
          git push
