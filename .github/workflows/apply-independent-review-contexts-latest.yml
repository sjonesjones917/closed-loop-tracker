name: Apply independent review contexts latest
on:
  push:
    branches: [independent-review-contexts-latest]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: independent-review-contexts-latest
          fetch-depth: 0
      - run: |
          git show f16b051fad21363d64c9f9a86a00b16c101950d7:repair-current-independent-review-v2.py > /tmp/repair.py
          python /tmp/repair.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js prompt-engine.js app-core.js
          git commit -m "Bind independent verification to reviewer contexts"
          git push origin HEAD:independent-review-contexts-latest
