name: One-time operation-scope fixture repair

on:
  push:
    branches:
      - fix/semantic-registry-scope-closure-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/semantic-registry-scope-closure-20260903
          fetch-depth: 0
      - name: Make route fixture cover the complete operation scope vocabulary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('verify-data-route-closure.mjs')
          source=path.read_text(encoding='utf-8')
          old="const scope={projectRevision:state.revision,inputVersion:state.job.CURRENT_INPUT_VERSION,sourceSetVersion:state.job.CURRENT_SOURCE_SET_VERSION,requirementsVersion:state.job.CURRENT_REQUIREMENTS_VERSION,testSuiteVersion:state.job.CURRENT_TEST_SUITE_VERSION,instructionVersion:state.job.CURRENT_INSTRUCTION_VERSION,iterationId:'ITER-ROUTE-v1',candidateId:'CAND-ROUTE-v1',runId:collectionSentinels.runs.currentId,contextId:collectionSentinels.freshContexts.currentId,baselineId:'BASE-ROUTE-v1',productId:'PROD-ROUTE-v1'};"
          new="const scope={projectRevision:state.revision,inputVersion:state.job.CURRENT_INPUT_VERSION,sourceSetVersion:state.job.CURRENT_SOURCE_SET_VERSION,researchVersion:'RESEARCH-ROUTE-v1',requirementsVersion:state.job.CURRENT_REQUIREMENTS_VERSION,testSuiteVersion:state.job.CURRENT_TEST_SUITE_VERSION,instructionVersion:state.job.CURRENT_INSTRUCTION_VERSION,iterationId:'ITER-ROUTE-v1',candidateId:'CAND-ROUTE-v1',runId:collectionSentinels.runs.currentId,contextId:collectionSentinels.freshContexts.currentId,sourceConvergedIterationId:'ITER-CONVERGED-ROUTE-v1',confirmationIterationId:'ITER-CONFIRM-ROUTE-v1',baselineId:'BASE-ROUTE-v1',productId:'PROD-ROUTE-v1',productVersion:'PRODUCT-ROUTE-v1',deliveryCandidateSetId:'DELIVERY-CANDIDATE-ROUTE-v1',reviewVersion:'REVIEW-ROUTE-v1',reconciledReviewVersion:'RECONCILED-REVIEW-ROUTE-v1',releaseId:'RELEASE-ROUTE-v1',hashReviewId:'HASH-REVIEW-ROUTE-v1',evidenceChainVersion:'EVIDENCE-CHAIN-ROUTE-v1'};"
          if old not in source:
              raise SystemExit('scope fixture target not found')
          path.write_text(source.replace(old,new,1),encoding='utf-8')
          PY
          node --check verify-data-route-closure.mjs
          node verify-data-route-closure.mjs
      - name: Remove one-time workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/one-time-scope-fixture-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-data-route-closure.mjs .github/workflows/one-time-scope-fixture-repair.yml
          git commit -m "test: cover complete operation scope vocabulary"
          git push origin HEAD:fix/semantic-registry-scope-closure-20260903
