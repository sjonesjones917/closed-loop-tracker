name: Controller Stage 27 patch
on:
  push:
    branches: [controller-stage-27-reconciliation-release-20260905]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage-27-reconciliation-release-20260905
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply Stage 27 implementation patch
        run: |
          node .controller-stage27-patch.mjs
          node .controller-stage27-fix1.mjs
          node .controller-stage27-fix2.mjs
          node .controller-stage27-fix3.mjs
      - name: Syntax
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-stage26-27-reconciliation-release.mjs
          node --check verify-full-cycle.mjs
      - name: Temporarily hide patch-only workflow from repository invariants
        run: mv .github/workflows/controller-stage27-patch.yml /tmp/controller-stage27-patch.yml
      - name: Focused Stage 26/27 proofs
        run: |
          set -euo pipefail
          node verify-stage-operation-registry.mjs
          node verify-stage26-27-reconciliation-release.mjs
          node verify-semantic-operation-boundaries.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
      - name: Commit tested implementation only
        run: |
          set -euo pipefail
          mv /tmp/controller-stage27-patch.yml .github/workflows/controller-stage27-patch.yml
          git config user.name 'closed-loop-controller'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/pages.yml prompt-engine.js response-ingestion.js verify-full-cycle.mjs workflow-engine.js workflow-schema.js verify-stage26-27-reconciliation-release.mjs
          git diff --cached --quiet && { echo 'Patch produced no implementation changes'; exit 1; }
          git commit -m 'Controller Stage 27: require independent reconciliation before release'
          git push origin HEAD:controller-stage-27-reconciliation-release-20260905
