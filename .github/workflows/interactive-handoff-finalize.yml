name: Apply minimal interactive handoff delta
on:
  push:
    branches:
      - fix/interactive-handoff-final
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interactive-handoff-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact minimal delta
        run: python3 .github/interactive_handoff_finalize.py
      - name: Verify deterministic source and lifecycle behavior
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-ingestion.mjs
          node --check verify-browser.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Commit only the verified application repair
        run: |
          rm .github/interactive_handoff_finalize.py .github/workflows/interactive-handoff-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finish human-first agent handoff semantics"
          git push origin HEAD:fix/interactive-handoff-final
