name: Apply minimal interactive handoff delta
on:
  push:
    branches: [fix/interactive-handoff-final]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply minimal interactive handoff delta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interactive-handoff-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch only remaining contradictions and transport UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected one match, found {n}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # Prompt semantic identity and only the contradictory human-clarification rules.
          replace_once('prompt-engine.js', "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/12';", "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/13';")
          replace_once('prompt-engine.js',
            'When Stage 01 cannot proceed without a genuinely human-only fact or decision, return HUMAN_INPUT_REQUIRED as the one machine response for this turn. Put only the smallest set of genuinely blocking questions in humanInputRequests using the exact contract below. Do not ask conversational questions outside the JSON response and do not ask the human to manually rewrite those answers into unrelated fields. The application will render the questions as normal human-facing controls, type-check the answers, version them as User Job Input, invalidate this prompt, and regenerate Stage 01.',
            'When Stage 01 needs a genuinely human-only fact or decision and the human can reply in the current conversation, ask the smallest useful set of plain-language questions conversationally and continue until the current-stage intake is sufficient or the human says an item is unknown or unavailable. Do not emit HUMAN_INPUT_REQUIRED merely to ask a normal human question. Use HUMAN_INPUT_REQUIRED only when interactive clarification cannot be conducted in the current agent context. Do not ask the human to manually rewrite conversational answers into unrelated fields.')
          replace_once('prompt-engine.js',
            'If such a genuinely Stage-01-blocking fact is missing, return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL—as the single response. Put only the smallest set of blocking questions inside humanInputRequests using the exact question contract below. Ask necessary human questions conversationally before the final JSON response; do not encode a question as JSON merely to talk to the human. The application will display and type-check those questions, version the answers as User Job Input, invalidate this prompt, and generate a replacement Stage 01 instruction.',
            'If such a genuinely Stage-01-blocking fact is missing and the human can reply, ask it conversationally before the final machine handoff; do not encode a normal human question as JSON. Continue in the same conversation until enough is known or the human marks the item unknown or unavailable. Use HUMAN_INPUT_REQUIRED only when interactive clarification cannot be conducted in the current agent context.')
          replace_once('prompt-engine.js',
            'When you have enough information to submit the current stage result, return exactly one final JSON object and no Markdown fence, preamble, conversational question, or trailing prose. Before that final submission, normal concise human dialogue is allowed and required when human-only information is needed.',
            'When you have enough information to submit the current stage result, provide exactly one final response-envelope payload. The payload may be bare JSON or exactly one Markdown code block labelled json; at most one short human-facing handoff sentence may appear outside that single code block. Do not provide a second payload or any conversational question after the payload. Before that final submission, normal concise human dialogue is allowed and required when human-only information is needed.')
          replace_once('prompt-engine.js',
            'Never set a HUMAN or HUMAN_DECISION-owned field. When unavailable human information is required, return HUMAN_INPUT_REQUIRED and structured humanInputRequests. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.',
            'Never set a HUMAN or HUMAN_DECISION-owned field. If human-only information is required and the human can reply in the current conversation, ask conversationally first. Use HUMAN_INPUT_REQUIRED with structured humanInputRequests only when that interaction cannot be conducted. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.')
          replace_once('prompt-engine.js',
            'Missing human-authority information requires HUMAN_INPUT_REQUIRED. Missing, stale, incomplete, or contradictory canonical application context requires BLOCKED with MISSING_APPLICATION_CONTEXT.',
            'Missing human-authority information must be resolved conversationally when the human can reply; otherwise use HUMAN_INPUT_REQUIRED. Missing, stale, incomplete, or contradictory canonical application context requires BLOCKED with MISSING_APPLICATION_CONTEXT.')

          # Accept the normal ChatGPT/iPhone single-json-code-block transport while preserving raw bytes.
          p=Path('response-ingestion.js'); s=p.read_text()
          marker='function scanJsonAmbiguity(raw,maxDepth)'
          helper=r'''function jsonTransport(raw){
  const text=String(raw??''),trimmed=text.trim();if(!trimmed.includes('```'))return {text:trimmed,changed:false};
  const blocks=[...text.matchAll(/```([A-Za-z0-9_-]*)\s*\n?([\s\S]*?)```/g)];
  if(blocks.length!==1||String(blocks[0][1]||'').trim().toLowerCase()!=='json')throw Object.assign(new Error('Return one response-envelope JSON object, optionally inside exactly one Markdown code block labelled json.'),{code:'NON_JSON_WRAPPER'});
  const before=text.slice(0,blocks[0].index),after=text.slice(blocks[0].index+blocks[0][0].length),outside=(before+after).trim();if(outside.includes('```'))throw Object.assign(new Error('Multiple or nested Markdown code blocks are not accepted.'),{code:'NON_JSON_WRAPPER'});
  const payload=String(blocks[0][2]||'').trim();if(!payload)throw Object.assign(new Error('The json code block is empty.'),{code:'EMPTY_RESPONSE'});return {text:payload,changed:true};
}
'''
          if marker not in s: raise SystemExit('response-ingestion marker missing')
          s=s.replace(marker,helper+marker,1)
          old="  const raw=String(text??'');const trimmed=raw.trim();if(!trimmed)throw Object.assign(new Error('Returned output is empty.'),{code:'EMPTY_RESPONSE'});if(byteLength(raw)>limits.maxRawResponseBytes)throw Object.assign(new Error('Returned output exceeds the stage byte limit.'),{code:'OVERSIZED_RESPONSE'});if(trimmed.startsWith('```')||trimmed.endsWith('```'))throw Object.assign(new Error('The response must be one JSON object without a Markdown code fence.'),{code:'NON_JSON_WRAPPER'});\n  const parseCandidate=(candidate)=>{try{scanJsonAmbiguity(candidate,limits.maxJsonDepth);}catch(error){if(error.code)throw error;}return JSON.parse(candidate);};\n  let envelope,normalization=null,firstError=null;"
          new="  const raw=String(text??'');if(!raw.trim())throw Object.assign(new Error('Returned output is empty.'),{code:'EMPTY_RESPONSE'});if(byteLength(raw)>limits.maxRawResponseBytes)throw Object.assign(new Error('Returned output exceeds the stage byte limit.'),{code:'OVERSIZED_RESPONSE'});const transport=jsonTransport(raw),trimmed=transport.text.trim();\n  const parseCandidate=(candidate)=>{try{scanJsonAmbiguity(candidate,limits.maxJsonDepth);}catch(error){if(error.code)throw error;}return JSON.parse(candidate);};\n  let envelope,normalization=transport.changed?'JSON_TRANSPORT':null,firstError=null;"
          if s.count(old)!=1: raise SystemExit('strictParse prefix mismatch')
          s=s.replace(old,new,1)
          old2="try{envelope=parseCandidate(trimmed);}catch(error){if(error.code)throw error;firstError=error;const repaired=normalizeSmartJsonDelimiters(trimmed);if(repaired.changed){try{envelope=parseCandidate(repaired.text);normalization='SMART_JSON_DELIMITERS';}catch(repairError)"
          new2="try{envelope=parseCandidate(trimmed);}catch(error){if(error.code)throw error;firstError=error;const repaired=normalizeSmartJsonDelimiters(trimmed);if(repaired.changed){try{envelope=parseCandidate(repaired.text);normalization=transport.changed?'JSON_TRANSPORT_AND_SMART_JSON_DELIMITERS':'SMART_JSON_DELIMITERS';}catch(repairError)"
          if s.count(old2)!=1: raise SystemExit('strictParse smart normalization mismatch')
          s=s.replace(old2,new2,1)
          old3="if(envelope?.__parseNormalization){validation.issues.push(issue('JSON_TYPOGRAPHY_NORMALIZED','/','Typographic JSON delimiter quotes were deterministically normalized for parsing; the exact raw response remains preserved unchanged.','WARNING'));validation.warningCount=validation.issues.filter(item=>item.severity==='WARNING').length;}"
          new3="if(envelope?.__parseNormalization){const mode=String(envelope.__parseNormalization);if(mode.includes('JSON_TRANSPORT'))validation.issues.push(issue('JSON_TRANSPORT_NORMALIZED','/','A single Markdown json code block was deterministically unwrapped for parsing; the exact raw response remains preserved unchanged.','WARNING'));if(mode.includes('SMART_JSON_DELIMITERS'))validation.issues.push(issue('JSON_TYPOGRAPHY_NORMALIZED','/','Typographic JSON delimiter quotes were deterministically normalized for parsing; the exact raw response remains preserved unchanged.','WARNING'));validation.warningCount=validation.issues.filter(item=>item.severity==='WARNING').length;}"
          if s.count(old3)!=1: raise SystemExit('parse warning mismatch')
          s=s.replace(old3,new3,1).replace("version:'closed-loop-response-ingestion/4'","version:'closed-loop-response-ingestion/5'",1)
          p.write_text(s)

          # Human-facing UI: same-chat conversation, final handoff only, and explicit edited-response state.
          replace_once('app-core.js',
            'Start with one thing: save the verbatim job request. Add files or constraints you already have; everything else can be clarified later. If more human information is needed now, the agent must return one structured HUMAN_INPUT_REQUIRED response. Paste it once and the application will show the plain-language questions here, validate your answers, version them as User Job Input, and regenerate Stage 01.',
            'Save the request and any files or constraints you already have. Then send the generated instruction to ChatGPT. If ChatGPT needs something only you can provide, answer normally in that same chat. Do not bring intermediate questions back to this app. When ChatGPT says the stage handoff is ready, paste its final response-envelope payload here.')
          replace_once('app-core.js',
            '<strong>Clarify before final JSON.</strong> If the external agent asks a question, answer it there, then record the answer in User Job Input and regenerate this instruction. Do not paste or accept a placeholder DATA_PROPOSAL just to discover what information is missing.',
            '<strong>Talk to the agent first; paste the handoff last.</strong> Answer any human questions in the same ChatGPT conversation. Paste into this app only when the agent has enough information and gives the final response-envelope payload.')
          replace_once('app-core.js',
            'Paste the complete strict JSON response. Parse / validate preserves the raw response first, then validates it without changing canonical project records. If the response declares returned files, attach those exact files in Authorized files for this stage before parsing.',
            'Paste the final response-envelope payload from ChatGPT. Bare JSON or one code block labelled json is accepted. Parse / validate preserves the exact raw response first, then validates it without changing canonical project records. If the response declares returned files, attach those exact files in Authorized files for this stage before parsing.')
          replace_once('app-core.js','<textarea class="code-text stage-output" id="stage-output"${responseLocked?\' disabled\':\'\'}>${esc(s.responseDraft||\'\')}</textarea>','<textarea class="code-text stage-output" id="stage-output" aria-describedby="stage-output-status"${responseLocked?\' disabled\':\'\'}>${esc(s.responseDraft||\'\')}</textarea>')
          replace_once('app-core.js','<div class="stage-output-hint"><span>Complete JSON only — no Markdown wrapper.</span><span>${s.responseDraft?`${s.responseDraft.length.toLocaleString()} characters pasted`:\'No response pasted yet\'}</span></div>','<div class="stage-output-hint"><span>Bare JSON or one fenced json block.</span><span id="stage-output-status">${s.responseDraft?`${s.responseDraft.length.toLocaleString()} characters pasted · not yet re-parsed if edited`:\'No response pasted yet\'}</span></div>')
          replace_once('app-core.js',"if($('#parse-output'))$('#parse-output').onclick=prepareStageResponse;","if($('#stage-output'))$('#stage-output').oninput=e=>{const node=$('#stage-output-status');if(node)node.textContent=`${e.target.value.length.toLocaleString()} characters pasted · edited since last parse; press Parse / validate response`;};if($('#parse-output'))$('#parse-output').onclick=prepareStageResponse;")

          # Global collapsed guide and runtime asset identity.
          replace_once('index.html','<li><strong>Wait for the final JSON.</strong> When the agent has enough information, it should return one JSON object with no extra prose.</li><li><strong>Paste only that final JSON into the response box</strong>, then tap <em>Parse / validate response</em>. Review the proposed change before accepting it.</li>','<li><strong>Wait for the final handoff.</strong> When the agent has enough information, it should give one response-envelope payload.</li><li><strong>Paste that final handoff into the response box</strong>, then tap <em>Parse / validate response</em>. Bare JSON or one code block labelled <code>json</code> is accepted. Review the proposed change before accepting it.</li>')
          p=Path('index.html'); s=p.read_text(); old='runtime-916178475daeb452'; new='runtime-interactive-handoff-13';
          if s.count(old)!=8: raise SystemExit(f'expected 8 runtime tokens, got {s.count(old)}')
          p.write_text(s.replace(old,new))

          # First-class semantic regression: no machine-question contradiction remains.
          p=Path('verify-prompt-semantics.mjs'); s=p.read_text(); add=r'''

// human-first-interactive-handoff-regression-v1
{
 const p=baseProject();p.job.EXACT_USER_OBJECTIVE_VERBATIM='Turn my invention packet into the strongest supportable patent application.';p.job.SUPPLIED_MATERIALS_INVENTORY='invention.zip';
 const text=prompts.buildPromptRecord(1,p).prompt;
 for(const token of ['HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE','ask the smallest useful set of plain-language questions conversationally','Use HUMAN_INPUT_REQUIRED only when interactive clarification cannot be conducted','bare JSON or exactly one Markdown code block labelled json'])if(!text.includes(token))throw new Error('Interactive human handoff guidance missing: '+token);
 for(const forbidden of ['Do not ask conversational questions outside the JSON response','Missing human-authority information requires HUMAN_INPUT_REQUIRED.','return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL—as the single response'])if(text.includes(forbidden))throw new Error('Machine-question contradiction remains in Stage 01: '+forbidden);
 for(let stage=2;stage<=30;stage++){const operation=schema.STAGE_CONTRACTS[stage].operations[0],q=prompts.buildPromptRecord(stage,baseProject(),{operation}).prompt;if(!q.includes('HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE'))throw new Error(`Stage ${stage} lacks the shared human collaboration contract.`);}
}
'''
          if 'human-first-interactive-handoff-regression-v1' in s: raise SystemExit('semantic regression already exists')
          p.write_text(s+add)

          # Ingestion regression: one normal ChatGPT json fence succeeds, multiple fenced payloads fail closed.
          p=Path('verify-ingestion.mjs'); s=p.read_text()
          old="negative('markdown wrapped',(e)=>'```json\\n'+JSON.stringify(e)+'\\n```','NON_JSON_WRAPPER');"
          new=r'''{
 const p=project('JOB-FENCED-JSON'),pr=savePrompt(p,2),e=validEnvelope(p,2,pr),raw='Here is the final handoff.\n```json\n'+JSON.stringify(e)+'\n```\n';
 const prepared=ingestion.prepare(p,{stage:2,text:raw,promptRecord:pr});if(!prepared.validation.valid)throw new Error('One ChatGPT json code block was rejected: '+JSON.stringify(prepared.validation.issues));if(prepared.project.projectData.rawResponses.at(-1).completeRawResponse!==raw)throw new Error('Fenced reply raw bytes were not preserved exactly.');if(!prepared.validation.issues.some(i=>i.code==='JSON_TRANSPORT_NORMALIZED'))throw new Error('Fenced JSON transport normalization was not disclosed.');
}
negative('multiple markdown payloads',(e)=>'```json\n'+JSON.stringify(e)+'\n```\n```json\n'+JSON.stringify(e)+'\n```','NON_JSON_WRAPPER');'''
          if s.count(old)!=1: raise SystemExit('verify-ingestion markdown case mismatch')
          p.write_text(s.replace(old,new,1))

          # Browser expectations must match the human-first UI and explicit edited-response state.
          p=Path('verify-browser.mjs'); s=p.read_text()
          old="await openStage(cdp,1);text=(await snapshot(cdp)).text;for(const token of ['Start with one thing: save the verbatim job request','one structured HUMAN_INPUT_REQUIRED response','STAGE 01 NEEDS YOUR JOB REQUEST'])assert(text.includes(token),`Stage 01 clarification experience missing ${token}.`);assert(!text.includes('plain-language questions before final JSON'),'Stage 01 UI still advertises the contradictory conversational-before-JSON path.');"
          new="await openStage(cdp,1);text=(await snapshot(cdp)).text;for(const token of ['Save the request and any files or constraints you already have','answer normally in that same chat','Talk to the agent first; paste the handoff last.','STAGE 01 NEEDS YOUR JOB REQUEST'])assert(text.includes(token),`Stage 01 human-first experience missing ${token}.`);assert(!text.includes('one structured HUMAN_INPUT_REQUIRED response'),'Stage 01 UI still routes normal human questions through machine JSON.');"
          if s.count(old)!=1: raise SystemExit('verify-browser stage1 case mismatch')
          s=s.replace(old,new,1)
          anchor="await fill(cdp,'#stage-output','{\"schema\":}');await click(cdp,'#parse-output');await waitExpr(cdp,`document.body.innerText.includes('Response rejected before canonical mutation.')`);retained=await activeProject(cdp);"
          replacement="await fill(cdp,'#stage-output','{\"schema\":}');await click(cdp,'#parse-output');await waitExpr(cdp,`document.body.innerText.includes('Response rejected before canonical mutation.')`);await fill(cdp,'#stage-output','{\"schema\": \"replacement\"}');assert((await snapshot(cdp)).text.includes('edited since last parse; press Parse / validate response'),'Edited replacement response does not visibly invalidate the displayed prior parse result.');retained=await activeProject(cdp);"
          if s.count(anchor)!=1: raise SystemExit('verify-browser edit-state anchor mismatch')
          p.write_text(s.replace(anchor,replacement,1))
          PY

          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-ingestion.mjs
          node --check verify-browser.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs

          rm .github/workflows/interactive-handoff-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finish human-first agent handoff semantics"
          git push origin HEAD:fix/interactive-handoff-final
