name: Prove current Stage 01 JSON clarification

on:
  push:
    branches:
      - 'fix/stage01-json-clarification-current-20260826'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only residual Stage 01 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          p=Path('prompt-engine.js'); s=p.read_text()
          old="In an interactive agent conversation, first ask the human the smallest set of concise plain-language questions needed to resolve those points. After the human answers, tell the human to record the answers in this application’s User Job Input and regenerate the Stage 01 instruction; do not emit the final machine response envelope until the regenerated instruction contains the required human-authority answers. If interactive questioning is unavailable, return HUMAN_INPUT_REQUIRED with the same concise structured questions so the application can render and version the answers."
          new="When Stage 01 cannot proceed without a genuinely human-only fact or decision, return HUMAN_INPUT_REQUIRED as the one machine response for this turn. Put only the smallest set of genuinely blocking questions in humanInputRequests using the exact contract below. Do not ask conversational questions outside the JSON response and do not ask the human to manually rewrite those answers into unrelated fields. The application will render the questions as normal human-facing controls, type-check the answers, version them as User Job Input, invalidate this prompt, and regenerate Stage 01."
          assert old in s; s=s.replace(old,new,1)

          old="Before producing final machine JSON, determine whether the human-authority input plus any supplied materials actually available in this executing context are sufficient for the Stage 01 job-definition result only. Ask a clarification question only when an irreducible human fact or decision is needed now to identify the objective, intended deliverable, or input boundary. Never ask for information merely because a later stage will need it, and never ask the human to repeat information you can directly read from supplied materials. If such a genuinely Stage-01-blocking fact is missing and this agent can converse with the human, ask only the necessary clarification questions in normal plain language first. After the human answers, instruct the human to record those answers in the application’s User Job Input and regenerate this Stage 01 instruction. Do not emit a DATA_PROPOSAL until that regenerated instruction contains the required human-authority facts. Do not hide missing human information behind UNKNOWN, placeholders, empty strings, or guessed assumptions. If this agent cannot conduct an interactive clarification, return the existing HUMAN_INPUT_REQUIRED response envelope so the application can display and type-check the questions."
          new="Before returning the Stage 01 machine response, determine whether the human-authority input plus any supplied materials actually available in this executing context are sufficient for the Stage 01 job-definition result only. Ask for clarification only when an irreducible human fact or decision is needed now to identify the objective, intended deliverable, or input boundary. Never ask for information merely because a later stage will need it, and never ask the human to repeat information you can directly read from supplied materials. If such a genuinely Stage-01-blocking fact is missing, return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL—as the single response. Put only the smallest set of blocking questions inside humanInputRequests using the exact question contract below. Do not ask conversational questions outside the JSON response. The application will display and type-check those questions, version the answers as User Job Input, invalidate this prompt, and generate a replacement Stage 01 instruction. Do not hide missing human information behind UNKNOWN, placeholders, empty strings, or guessed assumptions."
          assert old in s; s=s.replace(old,new,1)

          old='- Return exactly one JSON object and no Markdown fence, preamble, or trailing prose.'
          new='- Return exactly one JSON object and no Markdown fence, preamble, conversational question, or trailing prose. Use valid JSON syntax with ASCII U+0022 double quotation marks for every JSON member name and string delimiter; never use typographic/curly quotation marks.'
          assert old in s; s=s.replace(old,new,1)

          needle="function buildPromptRecord(stageOrDefinition,state,options={}){\n const stage=Number(stageOrDefinition?.number||stageOrDefinition);if(!Number.isInteger(stage)||stage<1||stage>schema.STAGE_COUNT)throw new Error(`Stage must be 1 through ${schema.STAGE_COUNT}.`);\n"
          assert needle in s
          s=s.replace(needle,needle+" if(stage===1&&!String(state?.job?.EXACT_USER_OBJECTIVE_VERBATIM||'').trim()){const error=new Error('Stage 01 needs one thing before an instruction can be generated: enter the verbatim job request in User Job Input and save it. Additional details may be clarified by the agent afterward.');error.code='MISSING_MINIMUM_HUMAN_INPUT';throw error;}\n",1)
          p.write_text(s)

          p=Path('app-core.js'); s=p.read_text()
          old='<p class="section-intro">Supply the smallest genuine human-owned intake. If the agent needs more information, it should ask you concise plain-language questions before final JSON. Record those answers in User Job Input and regenerate Stage 01. If the agent instead returns HUMAN_INPUT_REQUIRED, paste it once and the application will render the typed questions here.</p>'
          new='<p class="section-intro">Start with one thing: save the verbatim job request. Add files or constraints you already have; everything else can be clarified later. If more human information is needed now, the agent must return one structured HUMAN_INPUT_REQUIRED response. Paste it once and the application will show the plain-language questions here, validate your answers, version them as User Job Input, and regenerate Stage 01.</p>'
          assert old in s; s=s.replace(old,new,1)
          old="try{return globalThis.closedLoopPromptEngine.buildPromptRecord(n,preview,promptOptions(n)).prompt;}catch(error){if(error?.code==='MISSING_REQUIRED_PROMPT_SCOPE')return `CONTROLLING INSTRUCTION UNAVAILABLE\\n\\n${error.message}\\n\\nReserve/select the exact execution lane shown for this stage, then save or copy the instruction.`;throw error;}"
          new="try{return globalThis.closedLoopPromptEngine.buildPromptRecord(n,preview,promptOptions(n)).prompt;}catch(error){if(error?.code==='MISSING_MINIMUM_HUMAN_INPUT')return `STAGE 01 NEEDS YOUR JOB REQUEST\\n\\n${error.message}`;if(error?.code==='MISSING_REQUIRED_PROMPT_SCOPE')return `CONTROLLING INSTRUCTION UNAVAILABLE\\n\\n${error.message}\\n\\nReserve/select the exact execution lane shown for this stage, then save or copy the instruction.`;throw error;}"
          assert old in s; s=s.replace(old,new,1); p.write_text(s)

          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          old="if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('ask only the necessary clarification questions in normal plain language first')||!record.prompt.includes('record those answers in the application’s User Job Input and regenerate this Stage 01 instruction')||!record.prompt.includes('Do not emit a DATA_PROPOSAL until that regenerated instruction contains the required human-authority facts')||!record.prompt.includes('HUMAN_INPUT_REQUIRED response envelope'))issues.push('STAGE01_HUMAN_FIRST_CLARIFICATION_MISSING');"
          new="if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL')||!record.prompt.includes('Do not ask conversational questions outside the JSON response')||!record.prompt.includes('display and type-check those questions')||!record.prompt.includes('generate a replacement Stage 01 instruction'))issues.push('STAGE01_STRUCTURED_CLARIFICATION_MISSING');"
          assert old in s; s=s.replace(old,new,1)
          old="if(!ui.includes('Clarify before final JSON.')||!ui.includes('record the answer in User Job Input and regenerate this instruction')||!ui.includes('If the agent instead returns HUMAN_INPUT_REQUIRED'))throw new Error('Stage 01 operator UI does not explain human-first clarification and structured fallback.');"
          new="if(!ui.includes('Start with one thing: save the verbatim job request')||!ui.includes('one structured HUMAN_INPUT_REQUIRED response')||!ui.includes('validate your answers, version them as User Job Input, and regenerate Stage 01'))throw new Error('Stage 01 operator UI does not explain minimum intake and structured clarification.');"
          assert old in s; s=s.replace(old,new,1)
          marker='let checked=0;'
          extra="""// Stage 01 must not create a machine instruction before the minimum human objective exists.\n{\n const empty=core.createBlankState('JOB-STAGE01-MINIMUM');engine.ensureShape(empty);let error=null;try{prompts.buildPromptRecord(1,empty,{operation:'COMPLETE'});}catch(caught){error=caught;}if(error?.code!=='MISSING_MINIMUM_HUMAN_INPUT')throw new Error('Stage 01 still creates an UNKNOWN-objective instruction.');\n const patent=baseProject();patent.job.EXACT_USER_OBJECTIVE_VERBATIM='I need a patent application for my project.';const record=prompts.buildPromptRecord(1,patent,{operation:'COMPLETE'});if(!record.prompt.includes('ASCII U+0022')||!record.prompt.includes('never use typographic/curly quotation marks'))throw new Error('Strict JSON quote syntax is not explicit.');if(record.prompt.includes('ask only the necessary clarification questions in normal plain language first'))throw new Error('Stage 01 still contains the conversational-vs-JSON contradiction.');\n}\n\n"""
          assert marker in s; s=s.replace(marker,extra+marker,1); p.write_text(s)

          p=Path('verify-browser.mjs'); s=p.read_text()
          old="await openStage(cdp,1);text=(await snapshot(cdp)).text;for(const token of ['Clarify before final JSON.','plain-language questions before final JSON','record the answer in User Job Input and regenerate this instruction','HUMAN_INPUT_REQUIRED'])assert(text.includes(token),`Stage 01 clarification experience missing ${token}.`);"
          new="await openStage(cdp,1);text=(await snapshot(cdp)).text;for(const token of ['Start with one thing: save the verbatim job request','one structured HUMAN_INPUT_REQUIRED response','STAGE 01 NEEDS YOUR JOB REQUEST'])assert(text.includes(token),`Stage 01 clarification experience missing ${token}.`);assert(!text.includes('plain-language questions before final JSON'),'Stage 01 UI still advertises the contradictory conversational-before-JSON path.');"
          assert old in s; s=s.replace(old,new,1); p.write_text(s)

          files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for f in files:
              b=Path(f).read_bytes(); blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest(); manifest+=f'{f}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p=Path('index.html'); html=p.read_text(); html=re.sub(r'(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+("\s*></script>)',lambda m:m.group(1)+token+m.group(2),html); p.write_text(html)
          PY
      - name: Verify complete application
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit verified permanent source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage01-json-current-proof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompt-engine.js app-core.js verify-prompt-semantics.mjs verify-browser.mjs index.html .github/workflows/stage01-json-current-proof.yml
          git commit -m 'Make Stage 01 clarification JSON-only and fail closed'
          git push origin HEAD
