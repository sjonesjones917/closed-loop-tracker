name: Apply current prompt selection fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-agent-prompt-fix.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prevent legacy prompts from replacing executable work orders
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('agent-workflow.js')
          s=p.read_text()
          old="function latestPrompt(s,n){const arr=Array.isArray(s?.projectData?.generatedPrompts)?s.projectData.generatedPrompts:[];return [...arr].reverse().find(x=>Number(x.operation||x.stage)===n&&x.prompt)?.prompt||buildPrompt(s,n);}"
          new="function isExecutablePrompt(x,n){const t=String(x?.prompt||'');return Number(x?.operation||x?.stage)===n&&t.includes('CLOSED-LOOP RELIABILITY WORK ORDER')&&t.includes('AUTHORIZED PROJECT PACKAGE')&&t.includes('NON-NEGOTIABLE CONTROL RULES')&&t.includes(`${pad(n)} — ${OPS[n-1]}`);}\nfunction latestPrompt(s,n){const arr=Array.isArray(s?.projectData?.generatedPrompts)?s.projectData.generatedPrompts:[];return [...arr].reverse().find(x=>isExecutablePrompt(x,n))?.prompt||buildPrompt(s,n);}"
          old2="function ensurePromptRecord(){const s=read();if(!s)return;const n=currentOperation(s),arr=s.projectData?.generatedPrompts||[];if(!arr.some(x=>Number(x.operation||x.stage)===n&&x.prompt))persistPrompt(s,n,buildPrompt(s,n),'auto-prepared');}"
          new2="function ensurePromptRecord(){const s=read();if(!s)return;const n=currentOperation(s),arr=s.projectData?.generatedPrompts||[];if(!arr.some(x=>isExecutablePrompt(x,n)))persistPrompt(s,n,buildPrompt(s,n),'auto-prepared');}"
          if old not in s or old2 not in s: raise SystemExit('expected prompt-selection source not found')
          p.write_text(s.replace(old,new).replace(old2,new2))
          PY
          node --check agent-workflow.js
          grep -q 'function isExecutablePrompt' agent-workflow.js
      - name: Commit repaired existing app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agent-workflow.js
          git commit -m "Use only complete controlled work orders as current prompts"
          git push
