name: Controller v3 prompt verifier apply
on:
  push:
    branches:
      - controller-v3-prompt-file-identity-20260904
    paths:
      - controller-v3-prompt-verifier-trigger.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller-v3-prompt-file-identity-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node controller-v3-prompt-verifier-apply.mjs
      - run: |
          node verify-authoritative-prompt-file-identity.mjs
          node verify-prompt-semantics.mjs
          node verify.mjs
          mv .github/workflows/controller-v3-prompt-verifier-apply.yml /tmp/controller-v3-prompt-verifier-apply.yml
          node verify-complete.mjs
          node verify-v3-definition-of-done.mjs
          mv /tmp/controller-v3-prompt-verifier-apply.yml .github/workflows/controller-v3-prompt-verifier-apply.yml
      - name: Commit repaired verifier
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs verify-prompt-semantics.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Verify exact prompt file identity without self hash'
          git push origin HEAD:controller-v3-prompt-file-identity-20260904
