name: Repair legacy accounting gate compatibility
on:
  push:
    branches:
      - fix/exhaustive-intake-stage4-20260830
    paths:
      - .github/workflows/tmp-legacy-accounting.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage4-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply legacy accounting gate repair
        run: python3 .repair-legacy-accounting-gate.py
      - name: Prove deterministic and browser behavior
        run: |
          node --check workflow-engine.js
          node verify-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          git diff --check
      - name: Commit tested gate repair
        run: |
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git checkout -- .github/workflows/tmp-legacy-accounting.yml .repair-legacy-accounting-gate.py
          git add workflow-engine.js
          git commit -m 'Preserve legacy completed stages under prompt-bound accounting gates'
          git push origin HEAD:fix/exhaustive-intake-stage4-20260830