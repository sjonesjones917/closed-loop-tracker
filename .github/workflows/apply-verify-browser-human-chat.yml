name: Apply Stage 01 browser human-chat assertion

on:
  push:
    branches:
      - fix/stage01-human-chat-copy-20260826

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[verify-browser-human-chat-clean]') && !contains(github.event.head_commit.message, '[verify-browser-human-chat-failed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align browser assertion
        run: node .maintenance-verify-browser-human-chat.mjs
      - name: Verify browser and deterministic contracts
        run: |
          set +e
          {
            node build-test-project.mjs &&
            node --check verify-browser.mjs &&
            node verify-hash.mjs &&
            node verify-prompt-semantics.mjs &&
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)" &&
            test -n "$BROWSER" &&
            python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
            SERVER_PID=$! &&
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT &&
            BROWSER="$BROWSER" node verify-browser.mjs
          } > .maintenance-verify-browser-human-chat.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > .maintenance-verify-browser-human-chat.exit
      - name: Commit verified source only
        run: |
          status=$(cat .maintenance-verify-browser-human-chat.exit)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" = "0" ]; then
            rm .maintenance-verify-browser-human-chat.mjs .github/workflows/apply-verify-browser-human-chat.yml .maintenance-verify-browser-human-chat.log .maintenance-verify-browser-human-chat.exit
            git add -A
            git commit -m "Align browser test with Stage 01 human conversation [verify-browser-human-chat-clean]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            git add -A
            git commit -m "Capture Stage 01 browser human-chat verification failure [verify-browser-human-chat-failed]"
            git push origin HEAD:${GITHUB_REF_NAME}
            cat .maintenance-verify-browser-human-chat.log
            exit "$status"
          fi
