name: Apply proposal review navigation fix
on:
  push:
    branches: [fix/complete-closed-loop-spec-20260831]
    paths: [.github/workflows/apply-review-scroll-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct review navigation responsible layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js'); s=p.read_text()
          old="""    const longReview=Boolean(review&&review.querySelector('details.record-card[open]')&&reviewRect?.height>innerHeight);\n    const reviewActive=Boolean(longReview&&reviewBounds.active);\n    const reviewPast=Boolean(longReview&&reviewRect&&reviewRect.bottom<=0);"""
          new="""    const longReview=Boolean(review&&reviewBounds.active);\n    const reviewActive=longReview;\n    const reviewPast=Boolean(review&&reviewRect&&reviewRect.height>innerHeight&&reviewRect.bottom<=0);"""
          if old not in s: raise SystemExit('Reproduced review-navigation defect signature not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check app-core.js
          node verify-browser-extra.mjs || true
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js
          git rm .github/workflows/apply-review-scroll-fix.yml
          git commit -m 'Fix long proposal review navigation state'
          git push origin HEAD:fix/complete-closed-loop-spec-20260831