name: Apply failure and regression execution handoff
on:
  push:
    branches: [fix/failure-regression-execution-handoff]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          text=p.read_text()
          old="const op=String(operation||'').toUpperCase(),testStages=stage===12||[22,23,24].includes(stage)||(stage===17&&['VERIFY','REGRESSION'].includes(op))||(stage===19&&['VERIFY','REGRESSION_VERIFY'].includes(op)),ids=testIds?new Set(testIds.map(String)):null,allItems=testExecutionPlan(project).items,stageItems=stage===22?allItems.filter(i=>i.testType==='DETERMINISTIC'):stage===23?allItems.filter(i=>i.testType==='MEANING'):stage===24?allItems.filter(i=>i.testType==='ADVERSARIAL'):allItems,items=testStages?stageItems.filter(i=>!ids||ids.has(i.testId)):[],send=new Map()"
          new="const op=String(operation||'').toUpperCase(),testStages=[7,12,15,22,23,24].includes(stage)||(stage===17&&['VERIFY','REGRESSION'].includes(op))||(stage===19&&['VERIFY','REGRESSION_VERIFY'].includes(op)),ids=testIds?new Set(testIds.map(String)):null,allItems=testExecutionPlan(project).items,defectRequirementIds=stage===15?new Set(confirmedDefects(project).map(d=>String(recordValue(d,'REQ_ID')||d.relationships?.REQ_ID||'')).filter(Boolean)):null,stageItems=stage===22?allItems.filter(i=>i.testType==='DETERMINISTIC'):stage===23?allItems.filter(i=>i.testType==='MEANING'):stage===24?allItems.filter(i=>i.testType==='ADVERSARIAL'):stage===15&&defectRequirementIds?.size?allItems.filter(i=>defectRequirementIds.has(String(i.requirementId))):allItems,items=testStages?stageItems.filter(i=>!ids||ids.has(i.testId)):[],send=new Map()"
          if old not in text:
              raise SystemExit('executionHandoff test-stage expression not found')
          text=text.replace(old,new,1)
          old2="const externalWork=[1,11,12,17,19,21,23,24,25].includes(stage);"
          new2="const externalWork=[1,7,11,12,15,17,19,21,23,24,25].includes(stage);"
          if old2 not in text:
              raise SystemExit('executionHandoff external-work expression not found')
          text=text.replace(old2,new2,1)
          p.write_text(text)
          PY
          rm -f .github/workflows/apply-failure-regression-handoff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Route failure and regression execution handoffs"
          git push origin HEAD:fix/failure-regression-execution-handoff