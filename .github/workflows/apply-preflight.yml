name: Apply Stage 9 preflight closure
on:
  push:
    branches:
      - fix/complete-closed-loop-spec-20260831
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
          fetch-depth: 0
      - name: Integrate Stage 9 application-enumerated preflight coverage
        run: python3 .github/apply-preflight.py
      - name: Verify changed runtime parses
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check test-runtime.js
      - name: Commit integrated runtime and remove one-time files
        run: |
          rm .github/apply-preflight.py .github/workflows/apply-preflight.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js index.html app-core.js test-runtime.js .github/apply-preflight.py .github/workflows/apply-preflight.yml
          git commit -m "Make Stage 9 preflight coverage application-enumerated"
          git push origin HEAD:fix/complete-closed-loop-spec-20260831
