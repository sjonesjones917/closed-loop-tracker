name: Apply Stage 04 accounting repair without visual changes
on:
  push:
    branches:
      - fix/stage04-one-time-capture-no-visual
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical accounting patch from prior audited repair payload
        shell: bash
        run: |
          set -euo pipefail
          cp index.html /tmp/index-before.html
          python3 <<'PY'
          import subprocess, textwrap
          path='.github/workflows/apply-stage04-accounting-no-visual.yml'
          previous=subprocess.check_output(['git','show','HEAD^:'+path],text=True)
          start="python3 <<'PY'\n"
          if start not in previous:
              raise SystemExit('prior accounting payload start marker missing')
          payload=previous.split(start,1)[1]
          end='\n          PY\n'
          if end not in payload:
              raise SystemExit('prior accounting payload end marker missing')
          script=payload.split(end,1)[0]
          exec(compile(textwrap.dedent(script),'<stage04-accounting-patch>','exec'))
          PY

          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-stage04-one-time-capture.mjs
          node verify-stage04-one-time-capture.mjs

          python3 <<'PY'
          from pathlib import Path
          import re,hashlib
          before=Path('/tmp/index-before.html').read_text()
          after=Path('index.html').read_text()
          style=lambda s: re.search(r'<style>([\s\S]*?)</style>',s).group(1)
          if style(before)!=style(after): raise SystemExit('VISUAL REGRESSION: CSS changed')
          structural_before=re.sub(r'\?v=[^"\s]+','?v=BUILD_TOKEN',before)
          structural_after=re.sub(r'\?v=[^"\s]+','?v=BUILD_TOKEN',after)
          if structural_before!=structural_after: raise SystemExit('VISUAL REGRESSION: index.html changed beyond runtime cache tokens')
          print('visual-css-sha256',hashlib.sha256(style(after).encode()).hexdigest())
          PY

          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Commit permanent repair and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-stage04-accounting-no-visual.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Close Stage 01 intake and Stage 04 obligation accounting"
          git push origin HEAD:fix/stage04-one-time-capture-no-visual
