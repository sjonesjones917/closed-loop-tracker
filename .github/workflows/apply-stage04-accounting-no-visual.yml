name: Apply Stage 04 accounting repair without visual changes
on:
  push:
    branches: [fix/stage04-one-time-capture-no-visual]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch canonical intake and obligation accounting only
        shell: bash
        run: |
          set -euo pipefail
          cp index.html /tmp/index-before.html
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique: {label} ({text.count(old)})')
              return text.replace(old, new, 1)

          engine_path=Path('workflow-engine.js')
          engine=engine_path.read_text()
          accounting=r'''
const INTAKE_MANIFEST_SCHEMA='closed-loop-intake-manifest/1';
const INTAKE_CAPTURE_SCHEMA='closed-loop-intake-capture/1';
const OBLIGATION_MANIFEST_SCHEMA='closed-loop-obligation-manifest/1';
const INTAKE_DISPOSITIONS=Object.freeze(['INCORPORATED','RETAINED_CONTEXT','UNRESOLVED_HUMAN_ONLY','LATER_RESOLVABLE','INAPPLICABLE']);
const INTAKE_STATEMENT_CLASSES=Object.freeze(['FACT','FACT_AFFECTING_REQUIREMENTS','REQUIREMENT','CONSTRAINT','DECISION','PROHIBITION','REQUESTED_OUTPUT','ACCEPTANCE_CONDITION','MATERIAL_REFERENCE','UNRESOLVED_HUMAN_ONLY']);
const OBLIGATION_STATEMENT_CLASSES=new Set(['FACT_AFFECTING_REQUIREMENTS','REQUIREMENT','CONSTRAINT','DECISION','PROHIBITION','REQUESTED_OUTPUT','ACCEPTANCE_CONDITION','UNRESOLVED_HUMAN_ONLY']);
const OBLIGATION_NONREQUIREMENT_DISPOSITIONS=Object.freeze(['RETAINED_NONNORMATIVE_CONTEXT','INAPPLICABLE','BLOCKED']);
const accountingPresent=value=>value!==undefined&&value!==null&&(typeof value!=='string'||value.trim()!=='')&&(!Array.isArray(value)||value.length>0)&&(typeof value!=='object'||Array.isArray(value)||Object.keys(value).length>0);
const accountingId=(prefix,payload)=>`${prefix}-${hash.sha256Value(payload).slice(0,24).toUpperCase()}`;
const exactKeys=(value,allowed)=>value&&typeof value==='object'&&!Array.isArray(value)&&Object.keys(value).every(key=>allowed.includes(key));
function stageOneControlledInputVersion(project){const accepted=acceptedChanges(project,1).at(-1);return String(accepted?.scope?.inputVersion||accepted?.inputVersion||project.job.CURRENT_INPUT_VERSION||'UNKNOWN');}
function suppliedMaterialEntries(raw){if(!accountingPresent(raw))return [];try{const parsed=typeof raw==='string'?JSON.parse(raw):raw;return (Array.isArray(parsed)?parsed:[parsed]).filter(accountingPresent);}catch{return String(raw).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);}}
function materialReference(value,index){if(value&&typeof value==='object'){for(const key of ['exactNameOrReference','filename','name','path','url','reference'])if(accountingPresent(value[key]))return String(value[key]);return `SUPPLIED_MATERIAL_${index+1}`;}return String(value);}
function intakeCoverageManifest(project){
  ensureShape(project);const inputVersion=stageOneControlledInputVersion(project),units=[],artifacts=records(project,'artifacts');
  const add=(kind,sourceLocation,rawValue,extra={})=>{if(!accountingPresent(rawValue))return;const rawValueSha256=hash.sha256Value(rawValue),sourceUnitId=accountingId('INPUT-UNIT',{jobId:project.job.JOB_ID,inputVersion,kind,sourceLocation,rawValueSha256});units.push({sourceUnitId,kind,sourceLocation,rawValue:clone(rawValue),rawValueSha256,...extra});};
  for(const [name,definition] of Object.entries(schema.JOB_FIELDS||{})){if(name==='SUPPLIED_MATERIALS_INVENTORY'||!['HUMAN','HUMAN_DECISION'].includes(definition?.producer))continue;add('USER_JOB_FIELD',`job.${name}`,project.job?.[name],{fieldName:name});}
  suppliedMaterialEntries(project.job?.SUPPLIED_MATERIALS_INVENTORY).forEach((item,index)=>{const reference=materialReference(item,index),base=reference.replaceAll('\\','/').split('/').pop(),matches=artifacts.filter(a=>String(recordValue(a,'FILENAME')||'')===reference||String(recordValue(a,'FILENAME')||'')===base),artifact=matches.length===1?matches[0]:null;add('SUPPLIED_MATERIAL',`job.SUPPLIED_MATERIALS_INVENTORY[${index}]`,item,{materialReference:reference,artifactId:artifact?recordId(artifact,'artifacts'):null,artifactSha256:artifact?String(recordValue(artifact,'SHA256')||''):null,artifactAvailability:artifact?String(recordValue(artifact,'AVAILABILITY')||''):'NOT_IN_APPLICATION_CUSTODY'});});
  for(const answer of safe(project.projectData.humanInputAnswers).filter(x=>Number(x.stage)===1&&!x.invalidatedBy))add('STAGE_01_HUMAN_ANSWER',`humanInputAnswers.${answer.answerId||answer.requestId}`,answer.answer,{answerId:answer.answerId||null,requestId:answer.requestId||null,question:answer.question||''});
  const manifestBase={schema:INTAKE_MANIFEST_SCHEMA,jobId:String(project.job.JOB_ID||''),inputVersion,units,unitCount:units.length};return {...manifestBase,manifestSha256:hash.sha256Value(manifestBase)};
}
function parseIntakeCaptureValue(value){if(value&&typeof value==='object'&&!Array.isArray(value))return clone(value);if(typeof value!=='string'||!value.trim())return null;try{const parsed=JSON.parse(value);return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:null;}catch{return null;}}
function evaluateIntakeCoverage(project,captureOverride){
  const manifest=intakeCoverageManifest(project),capture=parseIntakeCaptureValue(captureOverride===undefined?project.job?.INPUT_SET_CONTENTS:captureOverride),errors=[],capturedById=new Map(),statements=[];
  if(!capture)return {manifest,capture:null,complete:false,coverage:0,missingUnitIds:manifest.units.map(x=>x.sourceUnitId),errors:['INPUT_SET_CONTENTS must be one closed structured intake capture; free-form summaries are not complete accounting.'],statements};
  if(!exactKeys(capture,['schema','inputVersion','manifestSha256','units','conversationStatements']))errors.push('Intake capture contains an unknown root property.');
  if(capture.schema!==INTAKE_CAPTURE_SCHEMA)errors.push(`Intake capture schema must be ${INTAKE_CAPTURE_SCHEMA}.`);
  if(String(capture.inputVersion||'')!==manifest.inputVersion)errors.push('Intake capture inputVersion does not match the controlled Stage 01 input version.');
  if(String(capture.manifestSha256||'')!==manifest.manifestSha256)errors.push('Intake capture manifestSha256 does not match the application intake manifest.');
  const rows=Array.isArray(capture.units)?capture.units:[];if(!Array.isArray(capture.units))errors.push('Intake capture units must be an array.');
  for(const row of rows){if(!exactKeys(row,['sourceUnitId','disposition','reason','extractedStatements']))errors.push('Intake unit accounting contains an unknown property.');const id=String(row?.sourceUnitId||'');if(!manifest.units.some(x=>x.sourceUnitId===id)){errors.push(`Unknown intake source unit ${id||'MISSING'}.`);continue;}if(capturedById.has(id)){errors.push(`Duplicate intake source unit accounting for ${id}.`);continue;}capturedById.set(id,row);if(!INTAKE_DISPOSITIONS.includes(String(row?.disposition||'')))errors.push(`${id}: invalid intake disposition.`);if(row?.disposition==='INAPPLICABLE'&&!String(row?.reason||'').trim())errors.push(`${id}: INAPPLICABLE requires a reason.`);const extracted=Array.isArray(row?.extractedStatements)?row.extractedStatements:[];if(row?.disposition!=='INAPPLICABLE'&&!extracted.length)errors.push(`${id}: every applicable supplied unit must preserve at least one semantic statement.`);const statementKeys=new Set();for(const statement of extracted){if(!exactKeys(statement,['statementKey','text','statementClass']))errors.push(`${id}: extracted statement contains an unknown property.`);const key=String(statement?.statementKey||''),text=String(statement?.text||'').trim(),statementClass=String(statement?.statementClass||'');if(!key||statementKeys.has(key))errors.push(`${id}: statementKey must be present and unique within the source unit.`);statementKeys.add(key);if(!text)errors.push(`${id}/${key||'MISSING'}: statement text is required.`);if(!INTAKE_STATEMENT_CLASSES.includes(statementClass))errors.push(`${id}/${key||'MISSING'}: invalid statementClass.`);if(key&&text&&INTAKE_STATEMENT_CLASSES.includes(statementClass))statements.push({statementId:accountingId('INPUT-STMT',{sourceUnitId:id,statementKey:key,text,statementClass}),sourceUnitId:id,statementKey:key,text,statementClass,disposition:row.disposition,sourceLocation:manifest.units.find(x=>x.sourceUnitId===id)?.sourceLocation||''});}}
  const conversation=Array.isArray(capture.conversationStatements)?capture.conversationStatements:[];if(capture.conversationStatements!==undefined&&!Array.isArray(capture.conversationStatements))errors.push('conversationStatements must be an array when present.');for(const statement of conversation){if(!exactKeys(statement,['statementKey','question','text','statementClass','status']))errors.push('Conversation statement contains an unknown property.');const key=String(statement?.statementKey||''),text=String(statement?.text||'').trim(),statementClass=String(statement?.statementClass||''),status=String(statement?.status||'');if(!key||!text)errors.push('Conversation statement requires statementKey and text.');if(!INTAKE_STATEMENT_CLASSES.includes(statementClass))errors.push(`${key||'MISSING'}: invalid conversation statementClass.`);if(!['ANSWERED','UNKNOWN','DEFERRED'].includes(status))errors.push(`${key||'MISSING'}: invalid conversation status.`);if(key&&text&&INTAKE_STATEMENT_CLASSES.includes(statementClass))statements.push({statementId:accountingId('INPUT-STMT',{inputVersion:manifest.inputVersion,conversation:true,key,text,statementClass,status}),sourceUnitId:null,statementKey:key,text,statementClass,disposition:status==='ANSWERED'?'INCORPORATED':'UNRESOLVED_HUMAN_ONLY',sourceLocation:'STAGE_01_CONVERSATION'});}
  const missingUnitIds=manifest.units.filter(x=>!capturedById.has(x.sourceUnitId)).map(x=>x.sourceUnitId);for(const id of missingUnitIds)errors.push(`Unaccounted intake source unit ${id}.`);const coverage=manifest.unitCount?capturedById.size/manifest.unitCount:1;return {manifest,capture,complete:errors.length===0&&coverage===1,coverage,missingUnitIds,errors:[...new Set(errors)],statements};
}
function obligationManifest(project){
  ensureShape(project);const intake=evaluateIntakeCoverage(project),items=[],seen=new Set();const inputVersion=String(project.job.CURRENT_INPUT_VERSION||'UNKNOWN'),sourceSetVersion=String(project.job.CURRENT_SOURCE_SET_VERSION||'NOT APPLICABLE');
  const add=(originKind,originId,text,provenance={},statementClass='REQUIREMENT')=>{const normalized=String(text??'').trim();if(!normalized)return;const obligationId=accountingId('OBLIGATION',{jobId:project.job.JOB_ID,inputVersion,sourceSetVersion,originKind,originId,normalized,statementClass});if(seen.has(obligationId))return;seen.add(obligationId);items.push({obligationId,originKind,originId,statementClass,text:normalized,provenance:clone(provenance),inputVersion,sourceSetVersion});};
  for(const statement of intake.statements)if(OBLIGATION_STATEMENT_CLASSES.has(statement.statementClass))add('HUMAN_AUTHORITY',statement.statementId,statement.text,{sourceUnitId:statement.sourceUnitId,sourceLocation:statement.sourceLocation,intakeManifestSha256:intake.manifest.manifestSha256},statement.statementClass);
  for(const answer of safe(project.projectData.humanInputAnswers).filter(x=>Number(x.stage)>1&&Number(x.stage)<=4&&!x.invalidatedBy))add('LATER_HUMAN_AUTHORITY',answer.answerId||answer.requestId,answer.answer,{requestId:answer.requestId,stage:answer.stage,inputVersion:answer.inputVersion||inputVersion},'DECISION');
  add('STAGE_01_JOB_DEFINITION','EXACT_DELIVERABLE_REQUESTED',project.job.EXACT_DELIVERABLE_REQUESTED,{acceptedStage:1},'REQUESTED_OUTPUT');
  const unknown=String(project.job.UNKNOWN_INFORMATION||'').trim();if(unknown&&!['NONE','UNKNOWN','NOT APPLICABLE'].includes(upper(unknown)))add('STAGE_01_JOB_DEFINITION','UNKNOWN_INFORMATION',unknown,{acceptedStage:1},'UNRESOLVED_HUMAN_ONLY');
  for(const candidate of recordsForCurrentScope(project,'candidateRequirements'))add('STAGE_03_CANDIDATE',recordId(candidate,'candidateRequirements'),recordValue(candidate,'CANDIDATE_OBLIGATION'),{candidateRequirementId:recordId(candidate,'candidateRequirements'),sourceId:String(recordValue(candidate,'SOURCE_ID')||candidate.relationships?.SOURCE_ID||''),evidence:recordValue(candidate,'EVIDENCE')},'REQUIREMENT');
  const researchFields=['MANDATORY_STATEMENTS','RECOMMENDATIONS','OPTIONAL_PRACTICES','PROHIBITIONS','EXCEPTIONS','DEPENDENCIES','APPLICABILITY_FACTS','RESTRICTIONS','INVALIDATING_MATERIAL'];for(const research of recordsForCurrentScope(project,'research'))for(const field of researchFields){const value=recordValue(research,field),values=Array.isArray(value)?value:[value];values.filter(accountingPresent).forEach((text,index)=>add('STAGE_03_RESEARCH',`${recordId(research,'research')}:${field}:${index}`,text,{researchId:recordId(research,'research'),sourceId:String(recordValue(research,'SOURCE_ID')||research.relationships?.SOURCE_ID||''),field,sourceEvidence:recordValue(research,'SOURCE_EVIDENCE')},field==='RECOMMENDATIONS'||field==='OPTIONAL_PRACTICES'?'FACT_AFFECTING_REQUIREMENTS':'REQUIREMENT'));}
  const base={schema:OBLIGATION_MANIFEST_SCHEMA,jobId:String(project.job.JOB_ID||''),inputVersion,sourceSetVersion,intakeManifestSha256:intake.manifest.manifestSha256,intakeCaptureComplete:intake.complete,items,obligationCount:items.length};return {...base,manifestSha256:hash.sha256Value(base)};
}
function obligationIdsFromRelationship(value){return [...new Set((String(value??'').match(/OBLIGATION-[A-F0-9]{24}/gi)||[]).map(x=>x.toUpperCase()))];}
function parseObligationDispositionEvidence(item){const kind=String(recordValue(item,'KIND')||item?.kind||'').toUpperCase();if(kind!=='OBLIGATION_DISPOSITION')return null;const raw=recordValue(item,'CONTENT')??item?.content;let content=raw;if(typeof raw==='string')try{content=JSON.parse(raw);}catch{return {error:'OBLIGATION_DISPOSITION evidence content must be strict JSON.'};}if(!exactKeys(content,['obligationId','disposition','reason']))return {error:'OBLIGATION_DISPOSITION content must contain only obligationId, disposition, and reason.'};return {content};}
function evaluateObligationAccounting(project,{requirements=null,evidence=null}={}){
  const manifest=obligationManifest(project),reqs=requirements||recordsForCurrentScope(project,'requirements'),ev=evidence||records(project,'evidenceRecords'),mapping=new Map(),dispositions=new Map(),errors=[];
  for(const requirement of safe(reqs)){const relationship=recordValue(requirement,'USER_INPUT_RELATIONSHIP')??requirement?.fields?.USER_INPUT_RELATIONSHIP,ids=obligationIdsFromRelationship(relationship);if(!ids.length)errors.push('A Stage 04 requirement lacks an OBLIGATION manifest identity in USER_INPUT_RELATIONSHIP.');for(const id of ids){if(!manifest.items.some(x=>x.obligationId===id)){errors.push(`Requirement references unknown obligation ${id}.`);continue;}if(!mapping.has(id))mapping.set(id,[]);mapping.get(id).push(requirement);}}
  for(const item of safe(ev)){const parsed=parseObligationDispositionEvidence(item);if(!parsed)continue;if(parsed.error){errors.push(parsed.error);continue;}const content=parsed.content,id=String(content.obligationId||'').toUpperCase(),disposition=String(content.disposition||'').toUpperCase(),reason=String(content.reason||'').trim();if(!manifest.items.some(x=>x.obligationId===id)){errors.push(`Disposition references unknown obligation ${id||'MISSING'}.`);continue;}if(dispositions.has(id)){errors.push(`Duplicate non-requirement disposition for ${id}.`);continue;}if(!OBLIGATION_NONREQUIREMENT_DISPOSITIONS.includes(disposition))errors.push(`${id}: invalid non-requirement disposition.`);if(!reason)errors.push(`${id}: non-requirement disposition requires a reason.`);dispositions.set(id,{disposition,reason});}
  const missingObligationIds=[];for(const item of manifest.items){const mapped=mapping.has(item.obligationId),disposed=dispositions.has(item.obligationId);if(mapped&&disposed)errors.push(`${item.obligationId} is both mapped to a requirement and given a non-requirement disposition.`);if(!mapped&&!disposed)missingObligationIds.push(item.obligationId);}for(const id of missingObligationIds)errors.push(`Unaccounted Stage 04 obligation ${id}.`);if(!manifest.intakeCaptureComplete)errors.push('Stage 04 cannot close because Stage 01 intake accounting is incomplete.');const blockedObligationIds=[...dispositions].filter(([,x])=>x.disposition==='BLOCKED').map(([id])=>id),coverage=manifest.obligationCount?(manifest.obligationCount-missingObligationIds.length)/manifest.obligationCount:1,closed=errors.length===0&&coverage===1;return {manifest,coverage,missingObligationIds,blockedObligationIds,closed,complete:closed&&blockedObligationIds.length===0,errors:[...new Set(errors)]};
}
'''
          engine=replace_once(engine,'function gate(stage,project){',accounting+'\nfunction gate(stage,project){','engine accounting insertion')
          old1="""    case 1:{\n      if(!String(project.job.EXACT_USER_OBJECTIVE_VERBATIM||'').trim())reasons.push('Verbatim User Job Input is required.');\n      requireAccepted();\n      const latest=changes.at(-1),confirmed=safe(project.projectData.stageConfirmations).some(item=>Number(item.stage)===1&&item.confirmed===true&&!item.invalidatedBy&&item.acceptedChangeId===latest?.changeId&&item.inputVersion===project.job.CURRENT_INPUT_VERSION);\n      if(!confirmed)reasons.push('Human confirmation bound to the current accepted change and input version is required.');\n      break;\n    }"""
          new1="""    case 1:{\n      if(!String(project.job.EXACT_USER_OBJECTIVE_VERBATIM||'').trim())reasons.push('Verbatim User Job Input is required.');\n      requireAccepted();\n      const intake=evaluateIntakeCoverage(project);if(!intake.complete)reasons.push(...intake.errors.map(error=>'Stage 01 intake accounting: '+error));\n      const latest=changes.at(-1),confirmed=safe(project.projectData.stageConfirmations).some(item=>Number(item.stage)===1&&item.confirmed===true&&!item.invalidatedBy&&item.acceptedChangeId===latest?.changeId&&item.inputVersion===stageOneControlledInputVersion(project));\n      if(!confirmed)reasons.push('Human confirmation bound to the current accepted change and input version is required.');\n      break;\n    }"""
          engine=replace_once(engine,old1,new1,'stage 1 gate')
          old4="""    case 4:{\n      requireAccepted();requireCount('requirements',1);"""
          new4="""    case 4:{\n      requireAccepted();requireCount('requirements',1);\n      const obligationAccounting=evaluateObligationAccounting(project);if(!obligationAccounting.closed)reasons.push(...obligationAccounting.errors.map(error=>'Stage 04 obligation accounting: '+error));if(obligationAccounting.blockedObligationIds.length)reasons.push('Stage 04 has explicitly blocked obligation(s): '+obligationAccounting.blockedObligationIds.join(', ')+'.');"""
          engine=replace_once(engine,old4,new4,'stage 4 gate')
          oldderive="if(!wasComplete||state.status!=='COMPLETE'||!state.derivedData||!Object.keys(state.derivedData).length)state.derivedData=deriveStageData(project,stage);"
          newderive="if(!wasComplete||state.status!=='COMPLETE'||!state.derivedData||!Object.keys(state.derivedData).length)state.derivedData=deriveStageData(project,stage);if(stage===1){const accounting=evaluateIntakeCoverage(project);state.derivedData={...state.derivedData,INTAKE_COVERAGE_MANIFEST:accounting.manifest,INTAKE_COVERAGE:accounting.coverage,UNACCOUNTED_INPUT_UNIT_IDS:accounting.missingUnitIds};}if(stage===4){const accounting=evaluateObligationAccounting(project);state.derivedData={...state.derivedData,OBLIGATION_MANIFEST:accounting.manifest,OBLIGATION_ACCOUNTING_COVERAGE:accounting.coverage,UNACCOUNTED_OBLIGATION_IDS:accounting.missingObligationIds,BLOCKED_OBLIGATION_IDS:accounting.blockedObligationIds};}"
          engine=replace_once(engine,oldderive,newderive,'derived accounting metadata')
          engine=replace_once(engine,'testExecutionPlan,executionHandoff,evaluateContextIndependence','testExecutionPlan,executionHandoff,intakeCoverageManifest,evaluateIntakeCoverage,obligationManifest,evaluateObligationAccounting,evaluateContextIndependence','engine exports')
          engine_path.write_text(engine)

          prompt_path=Path('prompt-engine.js')
          prompt=prompt_path.read_text()
          prompt=replace_once(prompt,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';",'prompt version')
          prompt=replace_once(prompt,"function contextFor(stage,state,operation,scope={}){\n const parts=[];","function contextFor(stage,state,operation,scope={}){\n const parts=[];\n if(stage===1)parts.push(`APPLICATION INTAKE COVERAGE MANIFEST — EVERY IDENTITY MUST BE ACCOUNTED FOR\\n${show(workflow.intakeCoverageManifest(state))}`);\n if(stage===4)parts.push(`APPLICATION OBLIGATION MANIFEST — COMPLETE INPUT UNIVERSE, DO NOT ASK THE HUMAN TO RESUPPLY IT\\n${show(workflow.obligationManifest(state))}`);",'prompt manifest context')
          pattern=re.compile(r"INPUT_SET_CONTENTS must preserve the substantive human-authority statements already available from each supplied intent or material file, together with the material name or reference needed to trace them\. Do not return only filenames, a material list, or a summary that drops supplied requirements\. Do not turn it into a Stage 02 archive/file inventory\. UNKNOWN_INFORMATION should carry nonblocking later-needed facts\. ASSUMPTIONS must contain only assumptions, not unknowns or application-derived identity facts\.")
          replacement="""INPUT_SET_CONTENTS is the durable semantic capture for the application-owned intake manifest. It MUST be a JSON string whose parsed value has exactly this closed shape: {\"schema\":\"closed-loop-intake-capture/1\",\"inputVersion\":\"<exact manifest inputVersion>\",\"manifestSha256\":\"<exact manifestSha256>\",\"units\":[{\"sourceUnitId\":\"<exact INPUT-UNIT identity>\",\"disposition\":\"INCORPORATED|RETAINED_CONTEXT|UNRESOLVED_HUMAN_ONLY|LATER_RESOLVABLE|INAPPLICABLE\",\"reason\":\"<required for INAPPLICABLE; otherwise concise or empty>\",\"extractedStatements\":[{\"statementKey\":\"<response-local stable key>\",\"text\":\"<faithful project-relevant human-authority statement>\",\"statementClass\":\"FACT|FACT_AFFECTING_REQUIREMENTS|REQUIREMENT|CONSTRAINT|DECISION|PROHIBITION|REQUESTED_OUTPUT|ACCEPTANCE_CONDITION|MATERIAL_REFERENCE|UNRESOLVED_HUMAN_ONLY\"}]}],\"conversationStatements\":[{\"statementKey\":\"<key>\",\"question\":\"<question asked>\",\"text\":\"<human answer or explicit unknown/deferred state>\",\"statementClass\":\"<same controlled class>\",\"status\":\"ANSWERED|UNKNOWN|DEFERRED\"}]}. Account for every APPLICATION INTAKE COVERAGE MANIFEST sourceUnitId exactly once. Do not return only filenames, a material list, or a summary that drops supplied requirements. If one supplied material contains multiple relevant statements, preserve all of them as separate extractedStatements under that one source unit. Do not make the user repeat information already present in the manifest, current human input, supplied material you can access, or existing canonical Stage 01 capture. UNKNOWN_INFORMATION should carry nonblocking later-needed facts. ASSUMPTIONS must contain only assumptions, not unknowns or application-derived identity facts."""
          prompt,n=pattern.subn(replacement,prompt,count=1)
          if n!=1: raise SystemExit(f'Stage 01 capture guidance replacement count={n}')
          cm='contextManifest={stage,operation,scope,verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,readCollections:'
          cmnew='contextManifest={stage,operation,scope,verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,intakeCoverageManifest:stage===1?workflow.intakeCoverageManifest(state):null,obligationManifest:stage===4?workflow.obligationManifest(state):null,readCollections:'
          prompt=replace_once(prompt,cm,cmnew,'prompt context identity accounting')
          prompt_path.write_text(prompt)

          ingestion_path=Path('response-ingestion.js')
          ingestion=ingestion_path.read_text()
          anchor='  const canonicalEnvelopeSha256=hash.canonicalEnvelopeSha256(envelope);'
          validation=r'''  if(envelope.responseType==='DATA_PROPOSAL'&&stageNumber===1){const accounting=workflow.evaluateIntakeCoverage(project,envelope.stageData?.INPUT_SET_CONTENTS);for(const message of accounting.errors)issues.push(issue('INCOMPLETE_INTAKE_ACCOUNTING','/stageData/INPUT_SET_CONTENTS',message));}
  if(envelope.responseType==='DATA_PROPOSAL'&&stageNumber===4){const accounting=workflow.evaluateObligationAccounting(project,{requirements:safe(envelope.records?.requirements),evidence:safe(envelope.evidence)});for(const message of accounting.errors)issues.push(issue('INCOMPLETE_OBLIGATION_ACCOUNTING','/records/requirements',message));}

'''
          ingestion=replace_once(ingestion,anchor,validation+anchor,'ingestion accounting validation')
          ingestion_path.write_text(ingestion)

          test=Path('verify-stage04-one-time-capture.mjs')
          test.write_text(r'''import fs from 'node:fs';
import vm from 'node:vm';
import assert from 'node:assert/strict';
globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
const core=globalThis.closedLoopCore,schema=globalThis.closedLoopWorkflowSchema,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine,ingestion=globalThis.closedLoopResponseIngestion;
const p=core.createBlankState('JOB-STAGE04-ONE-TIME-CAPTURE');
Object.assign(p.job,{JOB_TITLE:'One-time intake fixture',EXACT_USER_OBJECTIVE_VERBATIM:'Build the requested product and preserve every supplied project requirement.',SUPPLIED_MATERIALS_INVENTORY:JSON.stringify([{type:'FILE',exactNameOrReference:'intent.pdf'}]),EXPLICIT_USER_REQUIREMENTS:'Never ask the user to supply project-relevant information more than once.',CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'NOT APPLICABLE'});
