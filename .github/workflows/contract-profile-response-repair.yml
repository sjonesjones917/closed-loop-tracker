name: Temporary response contract-profile repair
on:
  push:
    branches:
      - repair/response-envelope-binding-20260903
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/response-envelope-binding-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply repair
        run: node apply-contract-profile-response-repair.mjs
      - name: Prove correction
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-response-contract-profile.mjs
          node verify-response-contract-profile.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
          node verify-v3-contract.mjs
      - name: Commit source correction
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git reset .github/workflows/contract-profile-response-repair.yml
          git commit -m "Bind response files to contract profile"
          git push origin HEAD:repair/response-envelope-binding-20260903
