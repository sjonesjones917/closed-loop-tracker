name: Repair Fresh Context operator path

on:
  push:
    branches: [fix/zero-loss-controlled-20260831]

permissions:
  contents: write

concurrency:
  group: repair-fresh-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the demonstrated Fresh Context gating correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          replacements=[
            ("function reviewerContextMarkup(n,locked){if(!reviewerOperation(n)||locked)return '';", "function reviewerContextMarkup(n,locked){if(!reviewerOperation(n))return '';"),
            ('<input id="fresh-context-id" autocomplete="off">', '<input id="fresh-context-id" autocomplete="off"${locked?\' disabled\':\'\'}>'),
            ('<button class="primary" id="add-fresh-context" type="button">Register reviewer context</button>', '<button class="primary" id="add-fresh-context" type="button"${locked?\' disabled\':\'\'}>Register reviewer context</button>')
          ]
          for old,new in replacements:
            if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one repair anchor, found {s.count(old)}: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check app-core.js
      - name: Replay exact failed browser path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove one-shot machinery and commit proven correction
        run: |
          rm .github/workflows/repair-fresh-context.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js .github/workflows/repair-fresh-context.yml
          git diff --cached --check
          git commit -m "Keep Fresh Context control visible while gated"
          git push origin HEAD:fix/zero-loss-controlled-20260831
