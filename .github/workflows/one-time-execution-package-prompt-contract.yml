name: One-time execution package prompt contract repair
on:
  push:
    branches: ["fix/execution-package-prompt-contract-40"]
    paths: [".github/workflows/one-time-execution-package-prompt-contract.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/execution-package-prompt-contract-40"
          fetch-depth: 0
      - run: python3 repair_execution_package_prompt_contract.py
      - run: |
          rm .github/workflows/one-time-execution-package-prompt-contract.yml repair_execution_package_prompt_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-store.js app-core.js index.html .github/workflows/one-time-execution-package-prompt-contract.yml repair_execution_package_prompt_contract.py
          git commit -m "Package the exact controlling instruction and response contract"
          git push origin HEAD:fix/execution-package-prompt-contract-40
