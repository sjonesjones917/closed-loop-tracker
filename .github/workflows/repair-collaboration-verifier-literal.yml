name: Repair collaboration verifier literal

on:
  push:
    branches:
      - finish/live-human-gate-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Align verifier with the current external-agent collaboration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old='HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE'
          new='HUMAN COLLABORATION MODE — APPLIES TO EVERY EXTERNAL-AGENT STAGE'
          changed=[]
          for path in Path('.').glob('verify*.mjs'):
              text=path.read_text()
              if old in text:
                  path.write_text(text.replace(old,new))
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No stale collaboration verifier literal was found')
          print('updated', *changed)
          self_path=Path('.github/workflows/repair-collaboration-verifier-literal.yml')
          if self_path.exists(): self_path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify*.mjs .github/workflows
          git commit -m "Assert the current external-agent collaboration contract"
          git push origin HEAD:finish/live-human-gate-20260830