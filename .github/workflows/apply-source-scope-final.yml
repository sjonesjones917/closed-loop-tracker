name: Apply source-role and raw-scope closure
on:
  push:
    branches:
      - semantic-reliability/source-scope-final
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 .source-scope-final.py
      - run: |
          node --check workbook.js
          node --check prompt-engine.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - if: success()
        run: |
          rm -f .source-scope-final.py .github/workflows/apply-source-scope-final.yml
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git add -A
          git commit -m 'Align external source roles and raw response scope'
          git push origin HEAD:semantic-reliability/source-scope-final
