name: Apply exact current stage sequencing repair
on:
  push:
    branches:
      - fix/exact-current-stage-sequencing-20260830
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply repair
        run: |
          git show HEAD^:.github/workflows/apply-exact-current-stage-sequencing.yml > /tmp/previous-repair.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/previous-repair.yml').read_text()
          start=text.index("          python3 - <<'PY'")+len("          python3 - <<'PY'\n")
          end=text.index("          PY\n",start)
          lines=text[start:end].splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          exec(compile(script,'exact-current-stage-sequencing-repair','exec'),{})
          PY
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js app-core.js
          git commit -m "Enforce exact operation order and fresh verification contexts"
          git push