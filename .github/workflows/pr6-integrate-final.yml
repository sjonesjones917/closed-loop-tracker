name: PR6 integrate exact tested patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'practical-100/pr6-integrated-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-integrated-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore current main and reviewed PR6 proof files
        run: |
          git fetch origin main practical-100/pr6-final-reliability
          while IFS= read -r path; do git checkout origin/main -- "$path"; done < <(git ls-tree -r --name-only origin/main)
          git checkout origin/practical-100/pr6-final-reliability -- test-fixtures.mjs verify-full-cycle.mjs .github/workflows/pages.yml
      - name: Apply only reproduced workflow-engine repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="""function unresolvedMaterialDefects(project){
            return confirmedDefects(project).filter(record=>{
              const severity=upper(recordValue(record,'SEVERITY'));
              const status=upper(recordValue(record,'STATUS'));
              return ['CRITICAL','MAJOR'].includes(severity)&&!['CLOSED','CLOSED VERIFIED','CLOSED_VERIFIED','RESOLVED','CORRECTED AND VERIFIED','RETIRED'].includes(status);
            });
          }"""
          new="""function defectResolutionState(project,record){const defectId=recordId(record,'defects');const changes=recordsForCurrentScope(project,'changes').filter(change=>{const value=recordValue(change,'TRIGGERING_DEFECT_IDS');return Array.isArray(value)?value.map(String).includes(defectId):String(value||'').split(/[\\s,;]+/).includes(defectId)||String(value||'').includes(defectId);});const regressions=recordsForCurrentScope(project,'regressions').filter(reg=>String(recordValue(reg,'DEFECT_ID')||reg.relationships?.DEFECT_ID||'')===defectId);const regressionIds=new Set(regressions.map(reg=>recordId(reg,'regressions')));const executions=records(project,'regressionExecutions').filter(execution=>regressionIds.has(String(recordValue(execution,'REG_ID')||execution.relationships?.REG_ID||'')));const verified=executions.some(execution=>upper(recordValue(execution,'PHASE'))==='POST_CORRECTION'&&['SATISFIED','SUCCESS','PASSED'].includes(upper(recordValue(execution,'RESULT'))));return {resolved:changes.length>0&&regressions.length>0&&verified,changeIds:changes.map(change=>recordId(change,'changes')),regressionIds:[...regressionIds],executionIds:executions.map(execution=>recordId(execution,'regressionExecutions'))};}
          function unresolvedMaterialDefects(project){
            return confirmedDefects(project).filter(record=>{
              const severity=upper(recordValue(record,'SEVERITY'));
              const status=upper(recordValue(record,'STATUS'));
              return ['CRITICAL','MAJOR'].includes(severity)&&!['CLOSED','CLOSED VERIFIED','CLOSED_VERIFIED','RESOLVED','CORRECTED AND VERIFIED','RETIRED'].includes(status)&&!defectResolutionState(project,record).resolved;
            });
          }"""
          if old not in s: raise SystemExit('defect resolution target not found')
          s=s.replace(old,new,1)
          old="""const SCOPE_KEYS=Object.freeze(['inputVersion','sourceSetVersion','requirementsVersion','testSuiteVersion','instructionVersion','iterationId','candidateId','baselineId','productId']);
          function currentScope(project){return {inputVersion:project.job.CURRENT_INPUT_VERSION||null,sourceSetVersion:project.job.CURRENT_SOURCE_SET_VERSION||null,requirementsVersion:project.job.CURRENT_REQUIREMENTS_VERSION||null,testSuiteVersion:project.job.CURRENT_TEST_SUITE_VERSION||null,instructionVersion:project.job.CURRENT_INSTRUCTION_VERSION||null,iterationId:recordId(latestIteration(project,[10,17,19]),'iterations')||project.job.CURRENT_ITERATION||null,candidateId:recordId(records(project,'candidateFreezes').at(-1),'candidateFreezes')||null,baselineId:recordId(records(project,'baselines').at(-1),'baselines')||project.job.CURRENT_BASELINE_ID||null,productId:recordId(records(project,'products').at(-1),'products')||project.job.CURRENT_PRODUCT_ID||null};}
          function scopeMatches(record,scopeRule={}){const rs=record?.scope||{};for(const [key,value] of Object.entries(rs)){if(value===undefined||value===null)continue;if(Object.prototype.hasOwnProperty.call(scopeRule,key)&&(scopeRule[key]??null)!==value)return false;}return true;}
          function recordsForCurrentScope(project,collection,scopeRule={}){const active=records(project,collection);const scope={...currentScope(project),...scopeRule};const applicable=Object.fromEntries(Object.entries(scope).filter(([,v])=>v!==undefined&&v!==null));return active.filter(record=>record.scope&&Object.keys(record.scope).length>0&&scopeMatches(record,applicable));}"""
          new="""const SCOPE_KEYS=Object.freeze(['inputVersion','sourceSetVersion','requirementsVersion','testSuiteVersion','instructionVersion','iterationId','candidateId','baselineId','productId']);
          const PERSISTENT_DEFINITION_SCOPE_KEYS=Object.freeze(['inputVersion','sourceSetVersion','requirementsVersion','testSuiteVersion','instructionVersion']);
          const CURRENT_SCOPE_KEYS_BY_COLLECTION=Object.freeze({defects:PERSISTENT_DEFINITION_SCOPE_KEYS,rootCauses:PERSISTENT_DEFINITION_SCOPE_KEYS,regressions:PERSISTENT_DEFINITION_SCOPE_KEYS,changes:PERSISTENT_DEFINITION_SCOPE_KEYS});
          function currentScope(project){return {inputVersion:project.job.CURRENT_INPUT_VERSION||null,sourceSetVersion:project.job.CURRENT_SOURCE_SET_VERSION||null,requirementsVersion:project.job.CURRENT_REQUIREMENTS_VERSION||null,testSuiteVersion:project.job.CURRENT_TEST_SUITE_VERSION||null,instructionVersion:project.job.CURRENT_INSTRUCTION_VERSION||null,iterationId:recordId(latestIteration(project,[10,17,19]),'iterations')||project.job.CURRENT_ITERATION||null,candidateId:recordId(records(project,'candidateFreezes').at(-1),'candidateFreezes')||null,baselineId:recordId(records(project,'baselines').at(-1),'baselines')||project.job.CURRENT_BASELINE_ID||null,productId:recordId(records(project,'products').at(-1),'products')||project.job.CURRENT_PRODUCT_ID||null};}
          function scopeValuePresent(value){return value!==undefined&&value!==null&&String(value).trim()!==''&&!['NONE','NOT APPLICABLE'].includes(upper(value));}
          function scopeMatches(record,scopeRule={}){const rs=record?.scope||{};for(const [key,value] of Object.entries(rs)){if(!scopeValuePresent(value))continue;if(Object.prototype.hasOwnProperty.call(scopeRule,key)&&scopeValuePresent(scopeRule[key])&&scopeRule[key]!==value)return false;}return true;}
          function recordsForCurrentScope(project,collection,scopeRule={}){const active=records(project,collection);const resolvedRule={...scopeRule};if(resolvedRule.iterationId&&!Object.prototype.hasOwnProperty.call(resolvedRule,'candidateId')){const iteration=records(project,'iterations').find(record=>recordId(record,'iterations')===String(resolvedRule.iterationId));const candidateId=recordValue(iteration,'CANDIDATE_ID')||iteration?.relationships?.CANDIDATE_ID;if(candidateId)resolvedRule.candidateId=String(candidateId);}const scope={...currentScope(project),...resolvedRule};const keys=new Set([...(CURRENT_SCOPE_KEYS_BY_COLLECTION[collection]||SCOPE_KEYS),...Object.keys(resolvedRule)]);const applicable=Object.fromEntries(Object.entries(scope).filter(([key,v])=>keys.has(key)&&scopeValuePresent(v)));return active.filter(record=>record.scope&&Object.keys(record.scope).length>0&&scopeMatches(record,applicable));}"""
          if old not in s: raise SystemExit('scope selector target not found')
          s=s.replace(old,new,1)
          s=s.replace("function deriveVerificationMatrix(project){const iteration=latestIteration(project,[10,17,19]);","function deriveVerificationMatrix(project){const iteration=latestIteration(project,[10]);",1)
          s=s.replace("function coverageMetrics(project){","function coverageMetrics(project,iterationIdOverride=null){",1)
          s=s.replace("const iterationId=recordId(iteration,'iterations')||project.job.CURRENT_ITERATION||'';const matrix=verificationMatrix(project,iterationId);","const iterationId=iterationIdOverride||recordId(iteration,'iterations')||project.job.CURRENT_ITERATION||'';const matrix=verificationMatrix(project,iterationId);",1)
          s=s.replace("const coverage=coverageMetrics(project);const material=unresolvedMaterialDefects(project)","const coverage=coverageMetrics(project,iterationId);const material=unresolvedMaterialDefects(project)",1)
          s=s.replace("case 12:{requireAccepted();const iteration=latestIteration(project,[10,17,19]);","case 12:{requireAccepted();const iteration=latestIteration(project,[10]);",1)
          old12="case 12:Object.assign(derived,{ACTIVE_MANDATORY_REQUIREMENTS:metrics.mandatoryRequirementCount,RUNS:metrics.iterationRunCount,EXPECTED_MANDATORY_RECORDS:metrics.expectedVerificationCount,ACTUAL_MANDATORY_RECORDS:metrics.actualVerificationTripleCount,MISSING_RECORDS:metrics.missingVerificationTriples.length,VERIFICATION_COVERAGE:metrics.verificationCoverage});break;"
          new12="case 12:{const initialMetrics=coverageMetrics(project,recordId(latestIteration(project,[10]),'iterations'));Object.assign(derived,{ACTIVE_MANDATORY_REQUIREMENTS:initialMetrics.mandatoryRequirementCount,RUNS:initialMetrics.iterationRunCount,EXPECTED_MANDATORY_RECORDS:initialMetrics.expectedVerificationCount,ACTUAL_MANDATORY_RECORDS:initialMetrics.actualVerificationTripleCount,MISSING_RECORDS:initialMetrics.missingVerificationTriples.length,VERIFICATION_COVERAGE:initialMetrics.verificationCoverage});break;}"
          if old12 not in s: raise SystemExit('stage 12 derivation target not found')
          s=s.replace(old12,new12,1)
          old15="const executions=recordsForCurrentScope(project,'regressionExecutions');for(const reg of regs)"
          if old15 not in s: raise SystemExit('stage 15 execution target not found')
          s=s.replace(old15,"const executions=records(project,'regressionExecutions');for(const reg of regs)",1)
          start=s.index('function freezeCandidate(')
          end=s.index('function freezeBaseline(',start)
          newblock="""function freezeCandidate(project,{stage=project.activeStage,artifactIds=[],operatorLabel='HUMAN_OPERATOR',purpose='TEST_CANDIDATE',toolConfiguration='CURRENT AUTHORIZED CONFIGURATION',settings='CURRENT AUTHORIZED SETTINGS',permissions='CURRENT AUTHORIZED PERMISSIONS',limitations='RECORDED LIMITATIONS',roleDistribution='WORKFLOW ROLE MAP',batchChangeRule='ANY MATERIAL CHANGE REQUIRES A NEW CANDIDATE'}={}){
            ensureShape(project);const stageNumber=Number(stage);if(![10,17,19].includes(stageNumber))throw new Error('Candidate freezing is permitted only for Stages 10, 17, and 19.');const artifacts=selectedArtifacts(project,artifactIds);if(!artifacts.length)throw new Error('At least one verified artifact is required to freeze a candidate.');const manifest=artifacts.map(a=>({artifactId:recordId(a,'artifacts'),filename:recordValue(a,'FILENAME'),byteSize:Number(recordValue(a,'BYTE_SIZE')),sha256:recordValue(a,'SHA256'),storageReference:recordValue(a,'STORAGE_REFERENCE')})),componentHashes=Object.fromEntries(manifest.map(a=>[a.artifactId,a.sha256])),createdAt=now(),previousIteration=recordsForCurrentScope(project,'iterations').at(-1),previousCandidate=recordsForCurrentScope(project,'candidateFreezes').at(-1);let candidateId,candidate;if(stageNumber===19){if(!previousCandidate)throw new Error('Stage 19 unchanged confirmation requires an existing candidate.');const priorManifest=recordValue(previousCandidate,'COMPONENT_MANIFEST')||[];if(hash.sha256Value(priorManifest)!==hash.sha256Value(manifest))throw new Error('Stage 19 requires the exact unchanged candidate artifact identity.');candidateId=recordId(previousCandidate,'candidateFreezes');candidate=previousCandidate;}else candidateId=allocateId(project,'candidateFreezes');const iterationId=allocateId(project,'iterations');
            const iterationFields={ITERATION_ID:iterationId,CANDIDATE_ID:candidateId,PREVIOUS_ITERATION_ID:recordId(previousIteration,'iterations')||'',CHANGESET_ID:recordId(recordsForCurrentScope(project,'changes').at(-1),'changes')||'',PURPOSE:purpose,STATUS:'FROZEN',LINEAGE:hash.sha256Value(manifest),EVIDENCE:`Application freeze from ${manifest.length} verified artifact(s).`};const iteration={id:iterationId,stage:stageNumber,createdAt,active:true,scope:currentScope(project),fields:iterationFields,...iterationFields,source:'APPLICATION_DERIVATION'};iteration.contentSha256=hash.contentRecordSha256(iteration,'ITERATION_ID');iteration.recordSha256=hash.recordSha256(iteration);iteration.sha256=iteration.recordSha256;
            project.projectData.iterations.push(iteration);if(stageNumber!==19){const candidateFields={CANDIDATE_ID:candidateId,ITERATION_ID:iterationId,COMPONENT_MANIFEST:manifest,COMPONENT_VERSIONS:Object.fromEntries(manifest.map(a=>[a.artifactId,'APPLICATION-CONTROLLED'])),COMPONENT_HASHES:componentHashes,ROLE_DISTRIBUTION:roleDistribution,IMMUTABLE_LOCATIONS:manifest.map(a=>a.storageReference),TOOL_CONFIGURATION:toolConfiguration,SETTINGS:settings,PERMISSIONS:permissions,LIMITATIONS:limitations,BATCH_CHANGE_RULE:batchChangeRule,STATUS:'FROZEN',EVIDENCE:hash.sha256Value({manifest,operatorLabel})};candidate={id:candidateId,stage:stageNumber,createdAt,active:true,scope:{...currentScope(project),iterationId,candidateId},fields:candidateFields,...candidateFields,source:'APPLICATION_DERIVATION'};candidate.contentSha256=hash.contentRecordSha256(candidate,'CANDIDATE_ID');candidate.recordSha256=hash.recordSha256(candidate);candidate.sha256=candidate.recordSha256;project.projectData.candidateFreezes.push(candidate);}project.job.CURRENT_ITERATION=iterationId;addHistory(project,'CANDIDATE_FROZEN',{stage:stageNumber,iterationId,candidateId,artifactIds:manifest.map(a=>a.artifactId),unchangedConfirmation:stageNumber===19,operatorLabel,identityAssurance:'SELF_ASSERTED'});recalculate(project);return {iteration,candidate};
          }
          """
          s=s[:start]+newblock+s[end:]
          s=s.replace("recordsForCurrentScope(project,'freshContexts').filter(r=>!recordValue(r,'RUN_ID'))","recordsForCurrentScope(project,'freshContexts').filter(r=>!scopeValuePresent(recordValue(r,'RUN_ID')))",1)
          s=s.replace("for(const id of safe(r.evidenceIds))evidenceIds.add(id);","for(const id of safe(r.evidenceRefs||r.evidenceIds))evidenceIds.add(id);",1)
          s=s.replace("unresolvedHumanRequests,openBlockers,acceptedChanges,hasStageActivity,mandatoryRequirements,confirmedDefects,unresolvedMaterialDefects,","unresolvedHumanRequests,openBlockers,acceptedChanges,hasStageActivity,mandatoryRequirements,confirmedDefects,defectResolutionState,unresolvedMaterialDefects,",1)
          p.write_text(s)
          PY
      - name: Make Stage 19 proof use application-owned freeze identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs')
          s=p.read_text()
          a=s.index('// Stage 19 unchanged confirmation')
          b=s.index('// Stage 20 baseline',a)
          replacement="""// Stage 19 unchanged confirmation uses exact same corrected candidate identity and ten new contexts.
          const frozen19=engine.freezeCandidate(p,{stage:19,artifactIds:[engine.recordId(correctedArtifact,'artifacts')],operatorLabel:OP,purpose:'UNCHANGED_CONFIRMATION'});
          const iteration19=engine.recordId(frozen19.iteration,'iterations'),candidate19=engine.recordId(frozen19.candidate,'candidateFreezes');
          assert(candidate19===candidate17,'Stage 19 changed the unchanged candidate identity.');
          acceptStage(19,{operation:'CONFIRM_FREEZE',stageData:{COMPLETE_TEST_SUITE_RUN:true}});
          runBatch(19,iteration19,candidate19,{operation:'EXECUTE_RUN'});
          acceptStage(19,{operation:'VERIFY',records:{verification:verificationRecords(iteration19,19)},stageData:{COMPLETE_TEST_SUITE_RUN:true}});
          acceptStage(19,{operation:'COMPARE',records:{comparisons:[proposal('comparisons',{tempKey:'comparison-19',fields:{RUN_DETERMINATIONS:'10/10 SATISFIED',INTERPRETATION_VARIANCE:'NONE',OUTPUT_VARIANCE:'NONE',AUTHORIZED_VARIANCE:'NONE',INCONCLUSIVE_TESTS:'NONE',REPEATED_FAILURE_PATTERNS:'NONE',UNIQUE_FAILURES:'NONE',CORRECTNESS_AFFECTING_VARIANCE:'NONE',EVIDENCE:'Unchanged confirmation comparison.'},relationships:{REQ_ID:rel(reqId)}})]},stageData:{CROSS_RUN_COMPARISON_COMPLETED:true}});
          acceptStage(19,{operation:'REGRESSION_VERIFY',records:{regressionExecutions:[proposal('regressionExecutions',{tempKey:'regexec-post19',fields:{PHASE:'UNCHANGED_CONFIRMATION',RESULT:'SATISFIED'},relationships:{REG_ID:rel(regId),ITERATION_ID:rel(iteration19),CANDIDATE_ID:rel(candidate19)}})]},stageData:{CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED:true}});
          acceptStage(19,{operation:'CONFIRM',records:{confirmationRecords:[proposal('confirmationRecords',{fields:{ZERO_MATERIAL_CHANGES:'TRUE',VERSION_HASH_COMPARISON:'IDENTICAL',TEN_NEW_CONTEXTS:'TRUE',COMPLETE_TEST_RESULTS:'SATISFIED',REGRESSION_RESULTS:'SATISFIED',COMPARISON_RESULTS:'SATISFIED',NEW_DEFECTS:'NONE',NEW_REQUIREMENTS:'NONE',NEW_FAILURE_CASES:'NONE',NEW_VARIANCE:'NONE',DETERMINATION:'SATISFIED',EVIDENCE:'Complete unchanged confirmation evidence.'},relationships:{SOURCE_ITERATION_ID:rel(iteration17),CONFIRMATION_ITERATION_ID:rel(iteration19)}})]}});assertStage(p,19);

          """
          s=s[:a]+replacement+s[b:]
          p.write_text(s)
          PY
      - name: Remove all integration and transport residue
        run: rm -rf .pr6-transport .github/workflows/pr6-integrate.yml .github/workflows/pr6-integrate-final.yml
      - name: Verify exact deterministic acceptance before commit
        run: |
          node build-test-project.mjs
          for f in workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-live.mjs verify-prompt-semantics.mjs test-fixtures.mjs verify-full-cycle.mjs; do node --check "$f"; done
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Enforce clean final source
        run: |
          test ! -e .pr6-transport
          test ! -e .github/workflows/pr6-integrate.yml
          test ! -e .github/workflows/pr6-integrate-final.yml
          test ! -e app.js
          ! find . -maxdepth 2 -name '.repair-*' -print -quit | grep -q .
          ! grep -R "document.write" -n --include='*.js' --include='*.html' .
          git status --short
      - name: Commit verified source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'PR 6: complete continuous reliability proof'
          git push origin HEAD:practical-100/pr6-integrated-final
