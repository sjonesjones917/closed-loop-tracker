name: Apply controlling specification conformance repair v6

on:
  push:
    branches: [fix/controlling-spec-conformance-20260830]
    paths: [.github/workflows/apply-controlling-spec-conformance-v6.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-conformance-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply audited repair and derive shared runtime identity
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/apply-controlling-spec-conformance-v4.yml').read_text()
          m=re.search(r"          python3 <<'PY'\n(?P<body>[\s\S]*?)\n          PY\n          node /tmp/apply-controlling-spec.js",src)
          if not m: raise SystemExit('v4 wrapper body not found')
          Path('/tmp/build-wrapper.py').write_text(textwrap.dedent(m.group('body')))
          PY
          python3 /tmp/build-wrapper.py
          node /tmp/apply-controlling-spec.js
          node <<'NODE'
          const fs=require('node:fs'),{createHash}=require('node:crypto');
          let verify=fs.readFileSync('verify-hash.mjs','utf8');
          const old="const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];";
          const next="const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];";
          if(!verify.includes(old))throw new Error('verify-hash runtime graph source not found.');
          verify=verify.replace(old,next);fs.writeFileSync('verify-hash.mjs',verify);
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const id=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|test-runtime|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js)\?v=[^"]+("\s*><\/script>)/g,`$1?v=${id}$2`);
          fs.writeFileSync('index.html',html);
          let worker=fs.readFileSync('test-worker.js','utf8');
          worker=worker.replace(/importScripts\('test-runtime\.js\?v=[^']+'\);/,`importScripts('test-runtime.js?v=${id}');`);
          fs.writeFileSync('test-worker.js',worker);
          fs.writeFileSync('/tmp/runtime-build-identity.txt',id+'\n');
          console.log('runtimeBuildIdentity='+id);
          NODE
      - name: Run conformance and existing regression proofs
        shell: bash
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check verify-controlling-spec.mjs
          node verify-controlling-spec.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit only proven application changes
        shell: bash
        run: |
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-controlling-spec-conformance.yml .github/workflows/apply-controlling-spec-conformance-v2.yml .github/workflows/apply-controlling-spec-conformance-v3.yml .github/workflows/apply-controlling-spec-conformance-v4.yml .github/workflows/apply-controlling-spec-conformance-v5.yml .github/workflows/apply-controlling-spec-conformance-v6.yml 2>/dev/null || true
          git rm -f .github/workflows/tmp-controlling-spec-conformance.yml 2>/dev/null || true
          git add -A
          git commit -m 'Align runtime contracts with controlling specification'
          git push origin HEAD:fix/controlling-spec-conformance-20260830
