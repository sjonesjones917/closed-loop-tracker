name: Apply Stage 01 semantic precedence fix
on:
  push:
    branches: [fix/stage01-semantic-precedence-v11]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-semantic-precedence-v11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/stage01.patch.gz.b64 <<'PAYLOAD'
           
          PAYLOAD
          base64 -d /tmp/stage01.patch.gz.b64 | gzip -d > /tmp/stage01.patch
          git apply --check /tmp/stage01.patch
          git apply /tmp/stage01.patch
          rm .github/workflows/stage01-semantic-precedence-transport.yml
          test "$(sha256sum prompt-engine.js | cut -d' ' -f1)" = a3ed72fb3d975af37dcf0ee5e379b51e30790ecb28d88a29dde87834d821ff0a
          test "$(sha256sum verify-prompt-semantics.mjs | cut -d' ' -f1)" = 31476d20d1b76d3c96c14b936666c5d2084de72c4960458eaa9c3ecf04ae09be
          test "$(sha256sum index.html | cut -d' ' -f1)" = 8c8e5f84d7d580b35c95087ce4faf93a8dcbd76b33b2ef9c9dc3e82cd2f61c40
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node verify-prompt-semantics.mjs
      - name: Commit the final three-file change and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add prompt-engine.js verify-prompt-semantics.mjs index.html .github/workflows/stage01-semantic-precedence-transport.yml
          git commit -m 'Make Stage 01 insufficiency precedence unambiguous' -m 'Prevent later-stage patent facts, external evidence, or downstream capabilities from forcing Stage 01 clarification. Bind verified supplied-file identities into the Stage 01 prompt context and add semantic regressions.'
          git push origin HEAD:fix/stage01-semantic-precedence-v11
