name: Verify focused test execution routing repair
on:
  push:
    branches: [reliability/test-execution-routing-20260826]
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/test-execution-routing-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused repair
        run: |
          node .repair-test-execution-anchor.mjs
          node .repair-test-execution-routing.mjs
      - name: Syntax and deterministic model
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Chromium acceptance
        run: |
          npx playwright install chromium --with-deps
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only verified permanent changes
        run: |
          rm -f .repair-test-execution-anchor.mjs .repair-test-execution-routing.mjs .github/workflows/test-execution-routing-repair.yml
          git config user.name closed-loop-reliability-bot
          git config user.email closed-loop-reliability-bot@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
            exit 0
          fi
          git commit -m 'Clarify test execution responsibility and artifact handling'
          git push origin HEAD:reliability/test-execution-routing-20260826
