name: Final organic prompt closure v3
on:
  push:
    branches: [practical-100/final-organic-prompt-closure]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-organic-prompt-closure
          fetch-depth: 60
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reapply source and semantic patches
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          y=subprocess.check_output(['git','show','4f0725249442c9482946349a885b44b75187da48:.github/workflows/final-organic-prompt-closure.yml'],text=True)
          def block(name):
            start=y.index('      - name: '+name);run=y.index('        run: |',start)+len('        run: |\n');end=y.find('\n      - name:',run);end=len(y) if end<0 else end
            return '\n'.join(line[10:] if line.startswith('          ') else line for line in y[run:end].splitlines())+'\n'
          for i,name in enumerate(['Patch existing responsible layers only','Strengthen permanent semantic verifier'],1):
            f=Path(f'/tmp/patch{i}.py');f.write_text(block(name));subprocess.run(['python',str(f)],check=True)
          p=Path('build-test-project.mjs');s=p.read_text();s=s.replace("'genuinely independent external governing sources','Research only the legitimate Stage 02 external governing source set'","'independent external source inventory','Research only the current accepted Stage 02 independent external source set'");p.write_text(s)
          p=Path('verify.mjs');s=p.read_text();s=s.replace("record.prompt.includes('genuinely independent external governing sources')","record.prompt.includes('independent external source inventory')").replace("record.prompt.includes('Research only the legitimate Stage 02 external governing source set')","record.prompt.includes('Research only the current accepted Stage 02 independent external source set')");p.write_text(s)
          p=Path('verify-prompt-semantics.mjs');s=p.read_text();needle="const p=baseProject();p.projectData.responseValidations.push({validationId:'VALIDATION-SCOPED'";replacement="const p=baseProject();p.projectData.candidateFreezes.push({id:'CANDIDATE-000001',stage:17,active:true,scope:{iterationId:'ITERATION-000001',candidateId:'CANDIDATE-000001'},fields:{CANDIDATE_ID:'CANDIDATE-000001',ITERATION_ID:'ITERATION-000001'}});p.projectData.responseValidations.push({validationId:'VALIDATION-SCOPED'";assert needle in s;s=s.replace(needle,replacement,1);p.write_text(s)
      - name: Run full deterministic acceptance
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit permanent changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/final-organic-prompt-closure-v3.yml
          git add prompt-engine.js response-ingestion.js verify-prompt-semantics.mjs build-test-project.mjs verify.mjs .github/workflows/final-organic-prompt-closure-v3.yml
          git commit -m "Close prompt authority and recovery contradictions"
          git push origin HEAD:practical-100/final-organic-prompt-closure
