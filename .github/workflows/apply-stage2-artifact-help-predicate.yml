name: Apply Stage 2 artifact help predicate fix
on:
  push:
    branches:
      - fix/stage2-artifact-help-predicate
    paths:
      - .github/workflows/apply-stage2-artifact-help-predicate.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage2-artifact-help-predicate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal predicate fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old="""function stageArtifactHelpText(n){\n  const supplied=suppliedFileMaterialLabels();\n  if((n===1||n===2)&&supplied.length){\n    const names=supplied.join('; ');\n    return n===1\n      ?`Include the supplied project artifact(s) with the Stage 01 prompt if ChatGPT does not already have them in this chat: ${names}.`\n      :`Include the original supplied project artifact(s) with the Stage 02 prompt so the agent can inventory and inspect the actual files: ${names}.`;\n  }\n"""
          new="""function stageArtifactHelpText(n){\n  const supplied=suppliedFileMaterialLabels();\n  const rawSupplied=String(current?.job?.SUPPLIED_MATERIALS_INVENTORY||'').trim();\n  let hasNonMessageSuppliedMaterial=false;\n  if(rawSupplied&&!/^(UNKNOWN|NONE|NOT APPLICABLE)$/i.test(rawSupplied)){\n    try{\n      const parsed=JSON.parse(rawSupplied),items=Array.isArray(parsed)?parsed:[parsed];\n      hasNonMessageSuppliedMaterial=items.some(item=>{\n        if(!item||typeof item!=='object')return true;\n        const type=String(item.type||item.materialType||item.kind||'').trim();\n        return !/^(MESSAGE|TEXT|PROMPT|USER_MESSAGE|CHAT)$/i.test(type);\n      });\n    }catch{hasNonMessageSuppliedMaterial=true;}\n  }\n  if((n===1||n===2)&&(supplied.length||hasNonMessageSuppliedMaterial)){\n    const names=supplied.join('; ');\n    if(n===1)return names\n      ?`Include the supplied project artifact(s) with the Stage 01 prompt if ChatGPT does not already have them in this chat: ${names}.`\n      :'Include the supplied project artifact(s) with the Stage 01 prompt if ChatGPT does not already have those files in this chat.';\n    return names\n      ?`Include the original supplied project artifact(s) with the Stage 02 prompt so the agent can inventory and inspect the actual files: ${names}.`\n      :'Include the original supplied project artifact(s) with the Stage 02 prompt so the agent can inventory and inspect the actual files. The prompt text alone does not provide the artifact bytes.';\n  }\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Refresh runtime cache identity
        run: |
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(f=>`${f}:${blob(f)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[0-9a-f]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
      - name: Verify
        run: |
          node --check app-core.js
          node verify-hash.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Commit application change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show Stage 2 artifact handoff for supplied materials'
          git push origin HEAD:fix/stage2-artifact-help-predicate
