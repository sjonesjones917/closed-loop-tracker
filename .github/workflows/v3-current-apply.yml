name: Apply v3 current branch
on:
  push:
    branches: [fix/closed-loop-v3-current-20260830]
    paths: [apply-v3-current.mjs, apply-v3-driver.mjs, apply-v3-followup.mjs, .github/workflows/v3-current-apply.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/closed-loop-v3-current-20260830, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply active implementation patches
        id: patch
        shell: bash
        run: |
          set +e
          : > v3-apply.log
          if grep -Fq "const PROJECT_SCHEMA='closed-loop-project/2';" workbook.js; then
            node apply-v3-driver.mjs >> v3-apply.log 2>&1
            code=$?
          else
            echo "Implementation already declares closed-loop-project/3; skipping initial transformer." >> v3-apply.log
            code=0
          fi
          if [ $code -eq 0 ]; then
            node apply-v3-followup.mjs >> v3-apply.log 2>&1
            code=$?
          fi
          cat v3-apply.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve implementation or diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.patch.outputs.exit_code }}" != "0" ]; then
            git add v3-apply.log
            git commit -m 'Capture v3 transform diagnostic [skip ci]' || true
            git push origin HEAD:fix/closed-loop-v3-current-20260830 || true
            exit 1
          fi
          if ! git diff --quiet -- workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js app-core.js index.html verify-prompt-semantics.mjs verify-ingestion.mjs; then
            git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js app-core.js index.html verify-prompt-semantics.mjs verify-ingestion.mjs
            git commit -m 'Strengthen v3 exhaustive stage semantics and regressions [skip ci]'
            git push origin HEAD:fix/closed-loop-v3-current-20260830
          fi
      - name: Syntax proof
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check test-runtime.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-ingestion.mjs
          git diff --check
# materialize direct Stage 4 current-user-input union
