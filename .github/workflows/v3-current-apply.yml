name: Apply v3 current branch
on:
  push:
    branches: [fix/closed-loop-v3-current-20260830]
    paths: [apply-v3-current.mjs, apply-v3-driver.mjs, .github/workflows/v3-current-apply.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/closed-loop-v3-current-20260830, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply transformer when source is still v2
        id: patch
        shell: bash
        run: |
          set +e
          if grep -q "closed-loop-project/2" workbook.js; then
            node apply-v3-driver.mjs > v3-apply.log 2>&1
            code=$?
          else
            echo "Implementation already transformed; skipping one-time transformer." > v3-apply.log
            code=0
          fi
          cat v3-apply.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve transform or diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.patch.outputs.exit_code }}" != "0" ]; then
            git add v3-apply.log
            git commit -m 'Capture v3 transform diagnostic [skip ci]' || true
            git push origin HEAD:fix/closed-loop-v3-current-20260830 || true
            exit 1
          fi
          if ! git diff --quiet -- workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js app-core.js index.html; then
            git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js app-core.js index.html
            git commit -m 'Apply v3 exhaustive intake and obligation implementation [skip ci]'
            git push origin HEAD:fix/closed-loop-v3-current-20260830
          fi
      - name: Syntax proof
        id: syntax
        shell: bash
        run: |
          set +e
          : > v3-syntax.log
          code=0
          for f in workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js test-runtime.js app-core.js; do
            echo "===== $f =====" >> v3-syntax.log
            node --check "$f" >> v3-syntax.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then code=$rc; fi
          done
          git diff --check >> v3-syntax.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then code=$rc; fi
          cat v3-syntax.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve syntax diagnostic
        if: steps.syntax.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v3-syntax.log
          git commit -m 'Capture v3 syntax diagnostic [skip ci]' || true
          git push origin HEAD:fix/closed-loop-v3-current-20260830 || true
          exit 1
