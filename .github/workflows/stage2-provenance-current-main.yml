name: Stage 2 provenance correction on current main
on:
  push:
    branches: [fix/stage2-provenance-current-main-20260826]
permissions:
  contents: write
jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage2-provenance-current-main-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified production commit without regressing newer UI work
        run: |
          set +e
          git cherry-pick 1991a9749890a8a18fdb2c49c30160cb7fac21b6
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            for f in app-core.js index.html verify-browser.mjs .github/workflows/stage2-provenance-current-main.yml; do
              if git diff --name-only --diff-filter=U | grep -Fxq "$f"; then git checkout --ours -- "$f"; git add "$f"; fi
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unexpected unresolved conflicts:" >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            GIT_EDITOR=true git cherry-pick --continue
          fi
          python3 - <<'PY'
          from pathlib import Path
          old='Include the original supplied project artifact(s) with the Stage 02 prompt'
          new='Stage 02 researches independent external sources. Supplied project artifacts are not required for this stage'
          for name in ['app-core.js','verify-browser.mjs']:
              p=Path(name); s=p.read_text()
              if old in s: s=s.replace(old,new)
              p.write_text(s)
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const id=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[0-9a-f]{16}/g,id);
          fs.writeFileSync('index.html',html);
          console.log(JSON.stringify({runtimeBuildIdentity:id}));
          NODE
      - name: Verify exact intended diff surface
        run: |
          allowed='app-core.js index.html prompt-engine.js verify-ingestion.mjs verify-prompt-semantics.mjs workflow-schema.js verify-browser.mjs .github/workflows/stage2-provenance-current-main.yml'
          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case " $allowed " in *" $f "*) ;; *) echo "Unexpected production/test change: $f"; bad=1;; esac
          done < <(git diff --name-only origin/main...HEAD; git diff --name-only)
          [ "$bad" -eq 0 ]
      - name: Syntax and core verification
        run: |
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser verification
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/stage2-current-main-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove temporary workflow and commit tested result
        run: |
          rm -f .github/workflows/stage2-provenance-current-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Rebase Stage 2 provenance fix on current main"
          git push origin HEAD:fix/stage2-provenance-current-main-20260826
