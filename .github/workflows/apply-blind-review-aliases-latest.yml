name: Apply blind review aliases latest
on:
  push:
    branches: [fix/blind-review-aliases-latest]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blind-review-aliases-latest
          fetch-depth: 0
      - run: |
          git show 990972fc2e9012b8f156873a718a204659ab5bb1^:repair-blind-review-aliases.py > /tmp/repair.py
          python /tmp/repair.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js workflow-engine.js project-store.js app-core.js response-ingestion.js
          git commit -m "Implement prompt-bound blind review aliases"
          git push origin HEAD:fix/blind-review-aliases-latest
