name: Export repair source
on:
  push:
    branches: [repair/practical-100-minimal]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar -czf repair-source.tar.gz \
            index.html app.js app-core.js workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js \
            verify.mjs verify-ingestion.mjs verify-complete.mjs verify-browser.mjs verify-browser-extra.mjs verify-live.mjs build-test-project.mjs build-test-project-impl.mjs README.md TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .github/workflows/pages.yml
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source
          path: repair-source.tar.gz
          if-no-files-found: error
