name: Bootstrap zero-loss semantic correction v9

on:
  push:
    branches: [reliability/semantic-adjudication-zero-loss-20260828-1103]
    paths: [.github/workflows/bootstrap-zero-loss-semantic-v9.yml]

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply v8 audited patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/bootstrap-zero-loss-semantic-v8.yml').read_text()
          name='Apply audited semantic patch and compatibility corrections'
          start=text.index('      - name: '+name)
          run=text.index('        run: |\n',start)+len('        run: |\n')
          end=text.index('\n      - name:',run)
          block=text[run:end]
          Path('/tmp/apply-v8.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n')
          PY
          bash /tmp/apply-v8.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-complete.mjs'); text=p.read_text()
          old=" const p=project('JOB-CONTRADICTION-V2');p.job.CURRENT_REQUIREMENTS_VERSION='R1';p.job.CURRENT_TEST_SUITE_VERSION='T1';const scope=engine.currentScope(p);const t=record('tests',6,{REQ_ID:'REQ-C',TEST_TYPE:'DETERMINISTIC',EXECUTION_MODE:'EXTERNAL_AGENT_TOOL',REQUIRED_CAPABILITY:'TEST_TOOL',ARTIFACT_REQUIREMENTS:'NONE',STATUS:'READY'},'TEST-C');t.scope={...scope};p.projectData.tests.push(t);const d=record('deterministicResults',22,{REQ_ID:'REQ-C',TEST_ID:'TEST-C',DETERMINATION:'SATISFIED'},'DET-C'),m=record('meaningResults',23,{REQ_ID:'REQ-C',TEST_ID:'TEST-C',DETERMINATION:'VIOLATED'},'MEAN-C');d.scope={...scope};m.scope={...scope};p.projectData.deterministicResults.push(d);p.projectData.meaningResults.push(m);assert(engine.detectCurrentContradictions(p).some(x=>x.type==='DETERMINISTIC_MEANING_CONFLICT'),'Cross-method contradiction was not detected.');"
          new=" const p=project('JOB-CONTRADICTION-V2');p.job.CURRENT_REQUIREMENTS_VERSION='R1';p.job.CURRENT_TEST_SUITE_VERSION='T1';p.job.AVAILABLE_TOOLS='TEST_TOOL';const scope=engine.currentScope(p),contextId='REVIEW-CONTEXT-C';const td=record('tests',6,{REQ_ID:'REQ-C',TEST_TYPE:'DETERMINISTIC',EXECUTION_MODE:'EXTERNAL_AGENT_TOOL',REQUIRED_CAPABILITY:'TEST_TOOL',ARTIFACT_REQUIREMENTS:'NONE',PROCEDURE:'Execute objective proposition check',EXPECTED_RESULT:'SATISFIED',EVIDENCE_TO_PRESERVE:'attributable tool output',STATUS:'READY'},'TEST-C-DET'),tm=record('tests',6,{REQ_ID:'REQ-C',TEST_TYPE:'MEANING',EXECUTION_MODE:'INDEPENDENT_AGENT_REVIEW',REQUIRED_CAPABILITY:'INDEPENDENT_REVIEWER',ARTIFACT_REQUIREMENTS:'NONE',PROCEDURE:'Compare required and observed meaning',EXPECTED_RESULT:'SATISFIED',EVIDENCE_TO_PRESERVE:'source-grounded comparison',STATUS:'READY'},'TEST-C-MEAN');td.scope={...scope};tm.scope={...scope};p.projectData.tests.push(td,tm);const ed=record('evidenceRecords',22,{KIND:'TOOL_OUTPUT',AUTHORITY_TYPE:'EXTERNAL_TOOL',DESCRIPTION:'TEST_TOOL execution',LOCATION:'controlled tool execution',CONTENT:'Objective proposition check returned SATISFIED',STATUS:'PRESERVED'},'EVIDENCE-C-DET'),em=record('evidenceRecords',23,{KIND:'INDEPENDENT_REVIEW',AUTHORITY_TYPE:'INDEPENDENT_REVIEWER',DESCRIPTION:'Independent semantic comparison',LOCATION:'product section 1',CONTENT:'Observed meaning conflicts with required meaning and source evidence',STATUS:'PRESERVED'},'EVIDENCE-C-MEAN');ed.scope={...scope};em.scope={...scope};p.projectData.evidenceRecords.push(ed,em);const d=record('deterministicResults',22,{REQ_ID:'REQ-C',PRODUCT_ID:'PRODUCT-C',TEST_ID:'TEST-C-DET',TOOL_AND_VERSION:'TEST_TOOL 1.0',PROCEDURE:'Execute objective proposition check',EXPECTED_RESULT:'SATISFIED',ACTUAL_RESULT:'SATISFIED',DETERMINATION:'SATISFIED'},'DET-C'),m=record('meaningResults',23,{REQ_ID:'REQ-C',PRODUCT_ID:'PRODUCT-C',TEST_ID:'TEST-C-MEAN',PRODUCT_LOCATION:'product section 1',EXTERNAL_SOURCE_EVIDENCE:'authoritative source section 1',REQUIRED_MEANING:'Required proposition',OBSERVED_MEANING:'Conflicting proposition',EVIDENCE_BASED_COMPARISON:'VIOLATED',DETERMINATION:'VIOLATED'},'MEAN-C');d.scope={...scope,contextId};m.scope={...scope,contextId};d.evidenceRefs=['EVIDENCE-C-DET'];m.evidenceRefs=['EVIDENCE-C-MEAN'];p.projectData.deterministicResults.push(d);p.projectData.meaningResults.push(m);assert(engine.effectiveDetermination('deterministicResults',d,td,p)==='SATISFIED','Contradiction fixture deterministic result is not effectively SATISFIED.');assert(engine.effectiveDetermination('meaningResults',m,tm,p)==='VIOLATED','Contradiction fixture meaning result is not effectively VIOLATED.');assert(engine.detectCurrentContradictions(p).some(x=>x.type==='DETERMINISTIC_MEANING_CONFLICT'),'Cross-method effective contradiction was not detected.');"
          if text.count(old)!=1: raise SystemExit(f'contradiction fixture: expected one match, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Derive runtime identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/bootstrap-zero-loss-semantic-v8.yml').read_text()
          name='Derive exact runtime bundle cache identity from patched bytes'
          start=text.index('      - name: '+name)
          run=text.index('        run: |\n',start)+len('        run: |\n')
          end=text.index('\n      - name:',run)
          block=text[run:end]
          Path('/tmp/runtime-v8.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n')
          PY
          bash /tmp/runtime-v8.sh
      - name: Syntax and deterministic proof stack
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-semantic-invariant.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
      - name: Local Chromium release blocker
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"; test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-bootstrap-http.log 2>&1 & server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$server" 2>/dev/null || true; trap - EXIT
      - name: Commit proven source and regression changes only
        shell: bash
        run: |
          set -euo pipefail
          allowed='app-core.js index.html prompt-engine.js verify-complete.mjs verify-full-cycle.mjs verify-semantic-invariant.mjs workflow-engine.js workflow-schema.js'
          while IFS= read -r path; do case " $allowed " in *" $path "*) ;; *) echo "Unexpected changed path: $path"; exit 1;; esac; done < <(git status --porcelain | cut -c4-)
          git config user.name 'OpenAI GPT-5.6 Sol'; git config user.email 'noreply@openai.com'
          git add app-core.js index.html prompt-engine.js verify-complete.mjs verify-full-cycle.mjs verify-semantic-invariant.mjs workflow-engine.js workflow-schema.js
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'Close remaining zero-loss semantic adjudication gaps'
          git push origin HEAD:reliability/semantic-adjudication-zero-loss-20260828-1103
