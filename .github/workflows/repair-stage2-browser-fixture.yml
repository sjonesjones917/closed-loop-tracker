name: Repair Stage 02 browser fixture

on:
  push:
    branches:
      - finish/live-human-gate-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Make Stage 02 browser response satisfy the current Stage 02 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-browser.mjs')
          text=path.read_text()
          old="stageData:{},records:{sources:[{tempKey:'source-1'"
          new="stageData:{SOURCE_APPLICABILITY_DETERMINATION:'APPLICABLE_SOURCES_ESTABLISHED'},records:{sources:[{tempKey:'source-1'"
          if old not in text:
              raise SystemExit('Stage 02 browser fixture target not found')
          path.write_text(text.replace(old,new,1))
          self_path=Path('.github/workflows/repair-stage2-browser-fixture.yml')
          if self_path.exists(): self_path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-browser.mjs .github/workflows
          git commit -m "Use a gate-valid Stage 02 browser response"
          git push origin HEAD:finish/live-human-gate-20260830