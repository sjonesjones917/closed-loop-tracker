name: Stage 01 objective guard repair
on:
  push:
    branches: [reliability/stage01-objective-guard-20260826]
permissions:
  contents: write
jobs:
  repair-and-prove:
    if: "!contains(github.event.head_commit.message, '[stage01-objective-guard-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/stage01-objective-guard-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply objective guard
        run: |
          node --check stage01-objective-guard-repair.mjs
          node stage01-objective-guard-repair.mjs
      - name: Prove deterministic and semantic behavior
        run: |
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit proven permanent tree
        run: |
          rm stage01-objective-guard-repair.mjs
          rm .github/workflows/stage01-objective-guard-repair.yml
          git config user.name "sjonesjones917"
          git config user.email "sjones.jones917@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Require a real Stage 01 verbatim objective [stage01-objective-guard-complete]"
          git push origin HEAD:reliability/stage01-objective-guard-20260826
