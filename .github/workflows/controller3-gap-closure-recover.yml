name: Recover Controller 3 executable gap closure
on:
  push:
    branches: [controller3-runtime-closure-20260904]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-runtime-closure-20260904
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply existing patch body, remove helpers, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/controller3-gap-closure.yml').read_text()
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          lines=[]
          for line in src[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/controller3-apply.py').write_text('\n'.join(lines)+'\n')
          PY
          python /tmp/controller3-apply.py
          rm .github/workflows/controller3-gap-closure.yml .github/workflows/controller3-gap-closure-recover.yml
          node --check workflow-engine.js
          node --check response-ingestion.js
          node verify-due-stage-timing.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-v3-definition-of-done.mjs > /tmp/section49.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/section49.json','utf8'));
          const bad=Object.entries(d.section49CoverageMetrics).filter(([k,v])=>k!=='actualIPhoneSafariAcceptanceCoverage'&&v.value!==1);
          if(bad.length)throw new Error('Executable Section 49 metrics incomplete: '+JSON.stringify(bad));
          if(d.section49ZeroCountInvariantViolations!==0)throw new Error('Section 49 zero-count invariant violation');
          NODE
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add workflow-engine.js response-ingestion.js verify-ingestion.mjs verify-complete.mjs .github/workflows/controller3-gap-closure.yml .github/workflows/controller3-gap-closure-recover.yml
          git commit -m "Close executable Section 49 accounting and due-stage gaps"
          git push origin HEAD:controller3-runtime-closure-20260904
