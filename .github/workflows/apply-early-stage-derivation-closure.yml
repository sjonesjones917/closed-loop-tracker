name: Apply early-stage derivation closure

on:
  push:
    branches:
      - fix/early-stage-derivation-closure-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/early-stage-derivation-closure-20260830
      - run: python apply-early-stage-derivation-closure.py
      - run: |
          rm -f .github/workflows/apply-early-stage-derivation-closure.yml apply-early-stage-derivation-closure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Close early-stage application derivations and action messaging"
          git push origin HEAD:fix/early-stage-derivation-closure-20260830
