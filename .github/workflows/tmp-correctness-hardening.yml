name: Temporary correctness hardening
on:
  push:
    branches: [reliability/correctness-hardening-final-20260827]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/correctness-hardening-final-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal hardening and prove it
        shell: bash
        run: |
          set -euo pipefail
          git show origin/reliability-evidence-hardening:.repair-reliability.mjs > .tmp-repair.mjs
          python3 - <<'PY'
          p='.tmp-repair.mjs'
          s=open(p,encoding='utf-8').read()
          import re
          s=re.sub(r'(?<!\\)\$\{', r'\\${', s)
          open(p,'w',encoding='utf-8').write(s)
          PY
          node .tmp-repair.mjs
          python3 - <<'PY'
          p='workflow-engine.js'
          s=open(p,encoding='utf-8').read()
          s=s.replace("r.derivedIndependence=independence.determination;r.derivedEvidenceSufficient=evidence.sufficient;return !expectedSet.has(key)||!['APPLICATION_ESTABLISHED','EXTERNALLY_SUPPORTED'].includes(independence.determination)||!evidence.sufficient||!['SATISFIED','VIOLATED','UNDETERMINED'].includes(upper(recordValue(r,'DETERMINATION')));","return !expectedSet.has(key)||!['APPLICATION_ESTABLISHED','EXTERNALLY_SUPPORTED'].includes(independence.determination)||!evidence.sufficient||!['SATISFIED','VIOLATED','UNDETERMINED'].includes(upper(recordValue(r,'DETERMINATION')));")
          s=s.replace("if(type==='MEANING'||result&&Object.prototype.hasOwnProperty.call(recordFields(result),'OBSERVED_MEANING'))","if(result&&(Number(result.stage)===23||Object.prototype.hasOwnProperty.call(recordFields(result),'OBSERVED_MEANING')))")
          s=s.replace("mode=upper(recordValue(test,'EXECUTION_MODE')),type=upper(recordValue(test,'TEST_TYPE')),descriptor=", "mode=upper(recordValue(test,'EXECUTION_MODE')),type=upper(recordValue(test,'TEST_TYPE')),specializedReviewRecord=Boolean(result&&(Number(result.stage)===23||Number(result.stage)===24||Object.prototype.hasOwnProperty.call(recordFields(result),'OBSERVED_MEANING')||Object.prototype.hasOwnProperty.call(recordFields(result),'ATTACK'))),descriptor=")
          s=s.replace("if(['EXTERNAL_AGENT_TOOL','EXTERNAL_SYSTEM'].includes(mode)){requiredEvidenceClasses.push('CAPABILITY_EXECUTION_EVIDENCE');", "if(!specializedReviewRecord&&['EXTERNAL_AGENT_TOOL','EXTERNAL_SYSTEM'].includes(mode)){requiredEvidenceClasses.push('CAPABILITY_EXECUTION_EVIDENCE');")
          old="if(!verifier)return {determination:'UNKNOWN',reasons:['Verifier/reviewer context identity is unavailable.'],evidence};if(generator&&verifier===generator)"
          new="if(!verifier&&((role==='MEANING_REVIEW'&&truth(project.stages?.[23]?.agentData?.EVALUATOR_INDEPENDENT_FROM_GENERATOR))||(role==='ADVERSARIAL_REVIEW'&&truth(project.stages?.[24]?.agentData?.REVIEWER_INDEPENDENT))))return {determination:'EXTERNALLY_SUPPORTED',reasons:['Reviewer separation is supported by accepted external evidence; the application does not claim observation of the external environment.'],evidence:[{verifierContextId:'UNOBSERVED',generatorContextId:generator}]};if(!verifier)return {determination:'UNKNOWN',reasons:['Verifier/reviewer context identity is unavailable.'],evidence};if(generator&&verifier===generator)"
          if old not in s: raise SystemExit('independence target missing')
          s=s.replace(old,new)
          old="capabilityExplicitlyUnavailable=contextCapability.some(value=>requiredCapability&&value.toUpperCase().includes(requiredCapability.toUpperCase())&&unavailableCapabilityText(value)),executorClass=EXECUTOR_CLASSES[mode]||'UNAVAILABLE';"
          new="capabilityExplicitlyUnavailable=contextCapability.some(value=>requiredCapability&&value.toUpperCase().includes(requiredCapability.toUpperCase())&&unavailableCapabilityText(value)),capabilityPositivelyAvailable=contextCapability.some(value=>requiredCapability&&value.toUpperCase().includes(requiredCapability.toUpperCase())&&!unavailableCapabilityText(value)),executorClass=EXECUTOR_CLASSES[mode]||'UNAVAILABLE';"
          if old not in s: raise SystemExit('capability target missing')
          s=s.replace(old,new)
          old="else if(['EXTERNAL_AGENT_TOOL','EXTERNAL_SYSTEM'].includes(mode)&&capabilityExplicitlyUnavailable){executableNow=false;blockingReason=`Current execution context explicitly lacks ${requiredCapability}.`;operatorAction='BLOCKED';}"
          new="else if(['EXTERNAL_AGENT_TOOL','EXTERNAL_SYSTEM'].includes(mode)&&(!capabilityPositivelyAvailable||capabilityExplicitlyUnavailable)){executableNow=false;blockingReason=capabilityExplicitlyUnavailable?`Current execution context explicitly lacks ${requiredCapability}.`:`No current execution context positively establishes capability: ${requiredCapability}.`;operatorAction='BLOCKED';}"
          if old not in s: raise SystemExit('capability gate target missing')
          s=s.replace(old,new)
          open(p,'w',encoding='utf-8').write(s)

          p='verify-complete.mjs'
          s=open(p,encoding='utf-8').read().replace("assert(engine.applicationTestCapabilities().length===0,'Unexpected application-native executor registration.');","assert(JSON.stringify(engine.applicationTestCapabilities())===JSON.stringify(['CANONICAL_ARTIFACT_BYTE_IDENTITY']),'Application-native executor registry must contain only the exact byte-identity executor.');")
          old="p.projectData.tests[0].evidenceRefs=['EVID-HARDEN'];plan=engine.testExecutionPlan(p);assert(plan.items[0].operatorAction==='SEND_TO_TOOL_AGENT'&&plan.items[0].executableNow&&plan.items[0].requiredArtifactNames[0]==='fixture.step','Verified artifact did not restore exact external-tool route.');"
          new="p.projectData.tests[0].evidenceRefs=['EVID-HARDEN'];plan=engine.testExecutionPlan(p);assert(plan.items[0].operatorAction==='BLOCKED'&&!plan.items[0].executableNow&&String(plan.items[0].blockingReason).includes('positively establishes capability'),'Verified bytes incorrectly bypassed missing capability evidence.');const ctx=record('freshContexts',11,{EXTERNAL_CONTEXT_IDENTIFIER:'tool-hardening-context',ROLE:'TOOL_EXECUTOR',AUTHORIZED_PROJECT_INPUTS:'fixture.step',TOOL_AVAILABILITY:'CAD_IMPORT available',CONTAMINATION_STATUS:'NONE',EVIDENCE:'capability present',USABILITY_DETERMINATION:'USABLE'},'CONTEXT-CAP-HARDEN');ctx.scope={inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001'};p.projectData.freshContexts.push(ctx);plan=engine.testExecutionPlan(p);assert(plan.items[0].operatorAction==='SEND_TO_TOOL_AGENT'&&plan.items[0].executableNow&&plan.items[0].requiredArtifactNames[0]==='fixture.step','Verified artifact plus positively established capability did not restore exact external-tool route.');"
          if old not in s: raise SystemExit('routing regression target missing')
          s=s.replace(old,new)
          open(p,'w',encoding='utf-8').write(s)

          p='verify-ingestion.mjs'
          s=open(p,encoding='utf-8').read().replace("makeProject('JOB-INGEST-INDEPENDENCE')","project('JOB-INGEST-INDEPENDENCE')").replace('promptFor(p,12)','savePrompt(p,12)')
          s=s.replace("assert(prepared.validation.issues.some(x=>x.code==='VERIFIER_CONTEXT_REUSE'),'Observable verifier/generator context reuse was not rejected.');","if(!prepared.validation.issues.some(x=>x.code==='VERIFIER_CONTEXT_REUSE'))throw new Error('Observable verifier/generator context reuse was not rejected.');")
          s=s.replace("assert(prepared.project.projectData.verification.length===0,'Rejected verifier-context reuse partially mutated canonical verification.');","if(prepared.project.projectData.verification.length!==0)throw new Error('Rejected verifier-context reuse partially mutated canonical verification.');")
          open(p,'w',encoding='utf-8').write(s)

          p='verify-full-cycle.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("data(23,{records:{meaningResults:","data(23,{stageData:{EVALUATOR_INDEPENDENT_FROM_GENERATOR:'TRUE'},records:{meaningResults:")
          s=s.replace("data(24,{records:{adversarialResults:","data(24,{stageData:{REVIEWER_INDEPENDENT:'TRUE'},records:{adversarialResults:")
          open(p,'w',encoding='utf-8').write(s)
          PY
          rm -f .tmp-repair.mjs .repair-reliability.mjs .harden-runner.sh .trigger-reliability-hardening .github/workflows/reliability-hardening.yml .github/workflows/reliability-runner.yml
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of runtimeFiles)html=html.replace(new RegExp(`${file.replace('.','\\.')}\\?v=runtime-[a-f0-9]+`,'g'),`${file}?v=${token}`);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
          for file in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/clr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          rm -f .github/workflows/tmp-correctness-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js response-ingestion.js app-core.js index.html verify-complete.mjs verify-ingestion.mjs verify-prompt-semantics.mjs verify-full-cycle.mjs verify-browser.mjs verify-browser-extra.mjs
          git add -u .github/workflows/tmp-correctness-hardening.yml
          git diff --cached --check
          git commit -m "Harden execution evidence and operator guidance"
          git push origin HEAD:reliability/correctness-hardening-final-20260827
