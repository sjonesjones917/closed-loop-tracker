name: Reliability adjudication exact proof
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
permissions: {contents: write}
concurrency: {group: 'reliability-adjudication-proof-${{ github.ref }}', cancel-in-progress: false}

jobs:
  prove:
    if: ${{ contains(github.event.head_commit.message, '[prove-adjudication]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact coordinated patch only
        run: |
          cat .tmp/adjudication-patch-*.b64 | base64 -d | gzip -d > /tmp/adjudication.patch
          echo 'ea95f16b98b3b51e9436f983ca59046556d17cdddc47b9cad5a861882d61089c  /tmp/adjudication.patch' | sha256sum -c -
          patch -p0 < /tmp/adjudication.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('workflow-engine.js')
          text=p.read_text().replace('semantically contradictory material finding','internally contradictory material finding')
          old="const authority=String(recordValue(e,'AUTHORITY_TYPE')||'').trim();if((!authority||upper(authority)==='UNKNOWN')&&!result.rawResponseId&&!result.sourceProposalId)reasons.push(`${recordId(e,'evidenceRecords')}: evidence authority is not structurally attributable.`);"
          new="const authority=String(recordValue(e,'AUTHORITY_TYPE')||'').trim(),attachmentId=String(recordValue(e,'ATTACHMENT_ID')||e.relationships?.ATTACHMENT_ID||'').trim(),applicationVerifiedAttachment=Boolean(attachmentId&&records(project,'artifacts').some(a=>recordId(a,'artifacts')===attachmentId&&upper(recordValue(a,'AVAILABILITY'))==='BYTES_PERSISTED_AND_VERIFIED'&&/^[a-f0-9]{64}$/i.test(String(recordValue(a,'SHA256')||''))&&Number.isInteger(Number(recordValue(a,'BYTE_SIZE')))&&Number(recordValue(a,'BYTE_SIZE'))>=0));if((!authority||upper(authority)==='UNKNOWN')&&!result.rawResponseId&&!result.sourceProposalId&&!applicationVerifiedAttachment)reasons.push(`${recordId(e,'evidenceRecords')}: evidence authority is not structurally attributable.`);"
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'evidence-authority compatibility: expected 1 occurrence, found {count}')
          text=text.replace(old,new,1)
          p.write_text(text)
          ps=Path('workflow-schema.js')
          st=ps.read_text()
          old="'OBSERVED_RESULT','EXACT_EVIDENCE','DETERMINATION','DEFECT_ID','UNDETERMINED_REASON'"
          new="'OBSERVED_RESULT','OBSERVATION_OUTCOME','EXACT_EVIDENCE','DETERMINATION','DEFECT_ID','UNDETERMINED_REASON'"
          count=st.count(old)
          if count != 1:
              raise SystemExit(f'verification field compatibility: expected 1 occurrence, found {count}')
          st=st.replace(old,new,1)
          controlled={'EXECUTION_OUTCOME','PREFLIGHT_OBSERVATION','OBSERVATION_OUTCOME'}
          def relax_required(match):
              body=match.group(1)
              items=[x.strip() for x in body.split(',') if x.strip()]
              kept=[]
              for item in items:
                  name=item.strip().strip("'").strip('"')
                  if name not in controlled:
                      kept.append(item)
              return 'required:['+','.join(kept)+']'
          st=re.sub(r'required:\[([^\]]*)\]',relax_required,st)
          ps.write_text(st)
          PY
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of files){const re=new RegExp(`(<script\\s+defer\\s+src="${file.replace('.','\\.')}\\?v=)[^"]+("\\s*><\\/script>)`);if(!re.test(html))throw new Error(`Runtime script tag not found for ${file}`);html=html.replace(re,`$1${token}$2`);}
          fs.writeFileSync('index.html',html);console.log('RUNTIME_TOKEN',token);
          NODE
      - name: Syntax and schema construction
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check verify-adjudication.mjs
          node build-test-project.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const s=globalThis.closedLoopWorkflowSchema,controlled=new Set(['EXECUTION_OUTCOME','PREFLIGHT_OBSERVATION','OBSERVATION_OUTCOME']);
          for(const [key,def] of Object.entries(s.RECORD_SCHEMAS))for(const name of controlled)if(def.fields.includes(name)&&def.required.includes(name))throw new Error(`${key}.${name} incorrectly remains ingestion-required.`);
          console.log('CONTROLLED_OBSERVATIONS_ARE_COMPLETION_GATED');
          NODE
      - name: Deterministic and universal false-acceptance proofs
        run: |
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-adjudication.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Chromium proofs
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-adjudication-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only proven application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-schema.js workflow-engine.js response-ingestion.js verify-adjudication.mjs index.html
          git diff --cached --check
          git commit -m '[adjudication-proven] Application owns effective determinations'
          git push origin HEAD:${GITHUB_REF_NAME}
