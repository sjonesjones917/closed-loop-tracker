name: Source snapshot for isolated analysis

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact checked-out source tree
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
