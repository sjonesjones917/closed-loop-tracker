name: Source snapshot

on:
  push:
    branches:
      - reliability/pr2-explicit-schema-v2

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source tree
        run: tar --exclude=.git --exclude=source-snapshot.tgz -czf source-snapshot.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.tgz
          if-no-files-found: error
          retention-days: 1
