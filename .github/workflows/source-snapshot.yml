name: Temporary source snapshot

on:
  push:
    branches:
      - closed-loop/pr2-explicit-schema

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-pr2-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
