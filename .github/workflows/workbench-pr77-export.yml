name: Apply verified PR77 fixes
on:
  push:
    branches: [workbench/pr77-source-export]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct verified patch
        run: |
          set -euo pipefail
          cat .workbench/pr77-fix-part00.b64 .workbench/pr77-fix-part01.b64 | base64 --decode | gzip -dc > /tmp/pr77-fix.patch
          test -s /tmp/pr77-fix.patch
      - name: Apply to PR77 source and verify every source suite
        run: |
          set -euo pipefail
          git fetch origin practical-100/pr6-final-proof-current
          git checkout -B practical-100/pr6-final-proof-current origin/practical-100/pr6-final-proof-current
          patch -p2 --forward --batch < /tmp/pr77-fix.patch
          git diff --check
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Exercise Chromium operator acceptance against the local static app
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified repair to PR77
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js response-ingestion.js verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs .github/workflows/pages.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "PR 6: close continuous lifecycle semantic defects"
          git push origin HEAD:practical-100/pr6-final-proof-current
