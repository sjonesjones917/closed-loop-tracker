name: Final public mobile usability proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: https://sjonesjones917.github.io/closed-loop-tracker/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node build-test-project.mjs && node verify.mjs
      - name: Verify deployed source identity
        run: |
          node --input-type=module - <<'NODE'
          const base=process.env.PAGE_URL;
          const expected={
            'app.js':['closed-loop-usability-20260824-r2'],
            'usability.js':['Phone-first usability floor','min-height:44px','grid-template-columns:1fr!important'],
            'verify-integrity-browser.mjs':['innerWidth===','matchMedia','renderReadinessDeterministic']
          };
          for(const [path,tokens] of Object.entries(expected)){
            const response=await fetch(new URL(`${path}?proof=${Date.now()}`,base),{cache:'no-store'});
            if(!response.ok)throw new Error(`${path} returned ${response.status}`);
            const body=await response.text();
            for(const token of tokens)if(!body.includes(token))throw new Error(`${path} missing deployed token: ${token}`);
          }
          NODE
      - name: Exercise deployed project and responsive behavior
        run: node verify-browser.mjs
      - name: Prove integrity determinism five consecutive times
        run: |
          for i in 1 2 3 4 5; do
            echo "Integrity pass $i"
            node verify-integrity-browser.mjs
          done
      - name: Exercise hardening regressions
        run: node verify-hardening-runner.mjs
      - name: Exercise all 30 deployed prompts
        run: node verify-prompts-live.mjs
