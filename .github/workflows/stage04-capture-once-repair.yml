name: Stage 04 capture-once repair

on:
  push:
    branches:
      - fix/stage04-capture-once

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage04-capture-once
          fetch-depth: 0
      - name: Apply and verify repair
        shell: bash
        run: |
          if grep -q "closed-loop-prompt-engine/25" prompt-engine.js; then
            echo "Stage 04 capture-once repair already applied."
            exit 0
          fi
          python3 .github/scripts/stage04_capture_once.py
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
          git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet -- prompt-engine.js workflow-engine.js verify-prompt-semantics.mjs verify-browser.mjs; then
            echo "No production repair changes to commit."
            exit 0
          fi
          git config user.name "closed-loop-repair"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-engine.js workflow-engine.js verify-prompt-semantics.mjs verify-browser.mjs
          git commit -m "Fix Stage 04 captured intent reuse"
          git push origin HEAD:fix/stage04-capture-once
