name: One-shot operation-specific scope repair

on:
  push:
    branches:
      - repair/operation-specific-scope-20260903-r3

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[operation-scope-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/operation-specific-scope-20260903-r3
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair operation-specific scope classification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          s=p.read_text()
          old="const STAGE_OPERATION_SCOPE_MATRIX=Object.freeze(Object.fromEntries(Object.entries(s0.STAGE_OPERATIONS).flatMap(([stageText,operations])=>{const stage=Number(stageText),targets=new Set(TARGET_DIMENSIONS_BY_STAGE[stage]||[]);return operations.map(operation=>{const dimensions=Object.fromEntries((EXACT_SCOPE_DIMENSIONS[stage]||[]).map(name=>[name,targets.has(name)?'TARGET_RESERVED':'INPUT_CURRENT']));return [`${stage}:${operation}`,Object.freeze({stage,operation,requiredDimensions:Object.freeze([...(EXACT_SCOPE_DIMENSIONS[stage]||[])]),dimensions:Object.freeze(dimensions),prohibitedExtraDimensions:true})];});})));"
          new="const TARGET_DIMENSIONS_BY_OPERATION=Object.freeze({\n  '19:CONFIRM_FREEZE':Object.freeze(['confirmationIterationId']),\n  '19:EXECUTE_RUN':Object.freeze([]),'19:VERIFY':Object.freeze([]),'19:COMPARE':Object.freeze([]),'19:REGRESSION_VERIFY':Object.freeze([]),'19:CONFIRM':Object.freeze([]),\n  '25:FREEZE_DELIVERY_CANDIDATE':Object.freeze(['deliveryCandidateSetId']),'25:COMPLETE':Object.freeze([]),\n  '26:COMPLETE':Object.freeze(['reviewVersion']),'26:SEMANTIC_REVIEW':Object.freeze([]),'26:RECONCILE':Object.freeze([]),\n  '27:CALCULATE_RELEASE':Object.freeze([]),'27:ADVISORY_REVIEW':Object.freeze([]),\n  '28:VERIFY_IDENTITY':Object.freeze([]),'28:CAPTURE_DELIVERY_INTENT':Object.freeze([]),\n  '29:CALCULATE_EVIDENCE_CHAINS':Object.freeze([]),'29:INVESTIGATE_MISSING_EVIDENCE':Object.freeze([]),\n  '30:CALCULATE_TERMINAL':Object.freeze([]),'30:EXPORT_OR_SHARE_AUTHORIZED_ARTIFACTS':Object.freeze([]),'30:RECORD_DELIVERY_EVIDENCE':Object.freeze([])\n});\nconst STAGE_OPERATION_SCOPE_MATRIX=Object.freeze(Object.fromEntries(Object.entries(s0.STAGE_OPERATIONS).flatMap(([stageText,operations])=>{const stage=Number(stageText);return operations.map(operation=>{const key=`${stage}:${operation}`,targets=new Set(Object.prototype.hasOwnProperty.call(TARGET_DIMENSIONS_BY_OPERATION,key)?TARGET_DIMENSIONS_BY_OPERATION[key]:(TARGET_DIMENSIONS_BY_STAGE[stage]||[]));const dimensions=Object.fromEntries((EXACT_SCOPE_DIMENSIONS[stage]||[]).map(name=>[name,targets.has(name)?'TARGET_RESERVED':'INPUT_CURRENT']));return [key,Object.freeze({stage,operation,requiredDimensions:Object.freeze([...(EXACT_SCOPE_DIMENSIONS[stage]||[])]),dimensions:Object.freeze(dimensions),prohibitedExtraDimensions:true})];});})));"
          if old not in s:
            raise SystemExit('scope-matrix construction marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('verify-operation-scope-classification.mjs').write_text("import fs from 'node:fs';\nimport vm from 'node:vm';\nimport assert from 'node:assert/strict';\nglobalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);\nfor(const f of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});\nconst schema=globalThis.closedLoopWorkflowSchema,m=schema.STAGE_OPERATION_SCOPE_MATRIX;assert(schema&&m,'scope matrix missing');\nconst input=(key,dim)=>assert.equal(m[key].dimensions[dim],'INPUT_CURRENT',`${key} ${dim} must be INPUT_CURRENT`);const target=(key,dim)=>assert.equal(m[key].dimensions[dim],'TARGET_RESERVED',`${key} ${dim} must be TARGET_RESERVED`);\ntarget('19:CONFIRM_FREEZE','confirmationIterationId');for(const key of ['19:EXECUTE_RUN','19:VERIFY','19:COMPARE','19:REGRESSION_VERIFY','19:CONFIRM'])input(key,'confirmationIterationId');\ntarget('25:FREEZE_DELIVERY_CANDIDATE','deliveryCandidateSetId');input('25:COMPLETE','deliveryCandidateSetId');\ntarget('26:COMPLETE','reviewVersion');input('26:SEMANTIC_REVIEW','reviewVersion');input('26:RECONCILE','reviewVersion');\nfor(const key of ['27:CALCULATE_RELEASE','27:ADVISORY_REVIEW'])input(key,'reconciledReviewVersion');for(const key of ['28:VERIFY_IDENTITY','28:CAPTURE_DELIVERY_INTENT'])input(key,'releaseId');for(const key of ['29:CALCULATE_EVIDENCE_CHAINS','29:INVESTIGATE_MISSING_EVIDENCE'])input(key,'hashReviewId');for(const key of ['30:CALCULATE_TERMINAL','30:EXPORT_OR_SHARE_AUTHORIZED_ARTIFACTS','30:RECORD_DELIVERY_EVIDENCE'])input(key,'evidenceChainVersion');\nconsole.log(JSON.stringify({operationSpecificScopeClassification:'PASS'}));\n")
          v=Path('verify-complete.mjs').read_text()
          if "verify-operation-scope-classification.mjs" not in v:
            v += "\nawait import('./verify-operation-scope-classification.mjs');\n"
          Path('verify-complete.mjs').write_text(v)
          PY
          node verify-operation-scope-classification.mjs
          node verify-v3-contract.mjs
          node verify-complete.mjs
      - name: Remove one-shot workflow and commit canonical changes
        shell: bash
        run: |
          git rm .github/workflows/repair-operation-specific-scope-r3.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add workflow-schema.js verify-complete.mjs verify-operation-scope-classification.mjs
          git commit -m 'Close operation-specific scope classification [operation-scope-done]'
          git push origin HEAD:repair/operation-specific-scope-20260903-r3