name: Controller 2 Stage 16 authoritative matrix repair

on:
  push:
    branches:
      - controller2-stage16-authoritative-matrix-20260904

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller2-stage16-authoritative-matrix-20260904
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply one-time Stage 16 repair
        run: |
          set -euo pipefail
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          node repair-controller-stage16.mjs
          node --check workflow-engine.js
          node --check verify-independent-run-verification.mjs
          node verify-independent-run-verification.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          test ! -f repair-controller-stage16.mjs
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Reject non-independent Stage 12 verification tuples"
          git push origin HEAD:controller2-stage16-authoritative-matrix-20260904
