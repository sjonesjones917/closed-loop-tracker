name: Apply final application correction

# Apply the existing one-shot correction to the checked-in application and retained project.
on:
  push:
    branches:
      - main
    paths:
      - final-correction.mjs
      - .github/workflows/apply-final-correction.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-application-correction
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out correction source
        uses: actions/checkout@v4
      - name: Use current Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the correction at the application boundary
        run: node final-correction.mjs
      - name: Verify static application architecture
        run: node verify-app.mjs
      - name: Verify retained application project
        run: node verify-self-project.mjs
      - name: Verify deterministic build equality
        shell: bash
        run: |
          set -euo pipefail
          cp index.html /tmp/corrected-index.html
          node build-app.mjs
          cmp /tmp/corrected-index.html index.html
      - name: Commit the corrected application and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f final-correction.mjs .github/workflows/apply-final-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify the human-first app and retain its native application project'
          git push origin HEAD:main
