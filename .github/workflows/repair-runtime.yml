name: Repair exact Test IR semantics
on:
  push:
    branches: [fix/controlling-amendment-53-70]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-amendment-53-70
          fetch-depth: 2
      - name: Apply exact runtime correction
        run: python3 repair-runtime.py
      - name: Prove runtime correction before commit
        run: |
          node --check test-runtime.js
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
      - name: Commit and remove repair machinery
        run: |
          rm -f repair-runtime.py .github/workflows/repair-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Implement exact Test IR numeric parsing and ordering"
          git push origin HEAD:fix/controlling-amendment-53-70
