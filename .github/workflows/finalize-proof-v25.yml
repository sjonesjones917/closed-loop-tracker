name: finalize-proof-v25
on:
  push:
    branches: [fix/controlling-spec-zero-loss-20260830]
    paths: [.github/workflows/finalize-proof-v25.yml]
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/controlling-spec-zero-loss-20260830, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply complete guarded repair set
        run: |
          set -euo pipefail
          python3 tools/finalize_capture_once_v4.py
          python3 tools/update_prompt_semantic_regressions.py
          python3 tools/fix_semantic_mutation_v15.py
          python3 tools/fix_semantic_mutation_v17.py
          python3 tools/finalize_stage1_stage4_gate_v17.py
          python3 tools/fix_stage1_prompt_quote_v21.py
          python3 tools/fix_stage1_ownership_v24.py
      - name: Run complete proof and preserve exact failure if any
        shell: bash
        run: |
          set +e
          : > proof-v25.log
          rc=0
          run_test(){
            echo "===== $* =====" | tee -a proof-v25.log
            "$@" >> proof-v25.log 2>&1
            x=$?
            echo "EXIT=$x" >> proof-v25.log
            if [ $x -ne 0 ]; then rc=$x; return $x; fi
            return 0
          }
          for f in workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js test-runtime.js test-worker.js verify-prompt-semantics.mjs verify-intent-capture.mjs; do run_test node --check "$f" || break; done
          if [ $rc -eq 0 ]; then
            for f in verify-intent-capture.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs verify-v3-migration.mjs verify-v3-contract.mjs verify-test-runtime-v3.mjs verify-test-runtime-limits.mjs verify-test-runtime.mjs verify-hash.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-definition-of-done.mjs verify-v3-definition-of-done.mjs verify-project-lifecycle.mjs verify.mjs; do run_test node "$f" || break; done
          fi
          if [ $rc -eq 0 ]; then
            git show origin/main:index.html > /tmp/main-index.html
            python3 - <<'PY' >> proof-v25.log 2>&1
          from pathlib import Path
          import re,hashlib
          main=Path('/tmp/main-index.html').read_text(); candidate=Path('index.html').read_text()
          a=re.search(r'<style>(.*?)</style>',main,re.S); b=re.search(r'<style>(.*?)</style>',candidate,re.S)
          if not a or not b: raise SystemExit('style block missing')
          ah=hashlib.sha256(a.group(1).encode()).hexdigest(); bh=hashlib.sha256(b.group(1).encode()).hexdigest()
          if ah!=bh: raise SystemExit(f'VISUAL CSS CHANGED: main={ah} candidate={bh}')
          if '.expandable-prompt{max-height:280px}' not in candidate: raise SystemExit('prompt box baseline changed')
          print('VISUAL_CSS_UNCHANGED='+ah)
          PY
            x=$?; echo "VISUAL_EXIT=$x" >> proof-v25.log; [ $x -eq 0 ] || rc=$x
          fi
          if [ $rc -eq 0 ]; then
            export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            if [ -z "$BROWSER" ]; then echo 'No Chromium binary' >> proof-v25.log; rc=1; else
              python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 & pid=$!
              run_test node verify-browser.mjs || true
              if [ $rc -eq 0 ]; then run_test node verify-browser-extra.mjs || true; fi
              kill "$pid" 2>/dev/null || true
            fi
          fi
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          if [ $rc -ne 0 ]; then
            git add proof-v25.log
            git commit -m 'Record exact remaining final proof failure v25' || true
            git push origin HEAD:fix/controlling-spec-zero-loss-20260830
            exit $rc
          fi
          find .github/workflows -maxdepth 1 -type f ! -name pages.yml -delete
          rm -f tools/finalize_intent_capture.py tools/materialize_remaining.py tools/materialize_remaining_v2.py tools/finalize_capture_once_v3.py tools/finalize_capture_once_v4.py tools/update_prompt_semantic_regressions.py tools/fix_semantic_mutation_v15.py tools/fix_semantic_mutation_v17.py tools/finalize_stage1_stage4_gate_v17.py tools/fix_stage1_prompt_quote_v21.py tools/fix_stage1_ownership_v24.py
          rm -f materialize-v4.log materialize-v4.status materialize-capture-once.log materialize-capture-once.status semantic-diagnostic.log semantic-v8.log semantic-v10.log semantic-v12.log semantic-v14.log semantic-v16.log semantic-v18.log semantic-v20.log semantic-v23.log proof-v25.log
          git add -A
          git commit -m 'Finalize controlling v3 closed-loop reliability implementation'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
