name: One-time fix browser conversation-state oracle

on:
  push:
    branches: [repair/full-spec-conformance-fcfc1c6]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Replace obsolete browser oracle and strengthen mutation coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          browser_path = Path('verify-browser-extra.mjs')
          browser = browser_path.read_text()
          old = "['Exact handoff','Continue the external conversation','Canonical state changed: NO'"
          new = "['Exact handoff','Continue talking to the agent. Do not import a final response file yet.','Canonical state changed: NO'"
          if browser.count(old) != 1:
              raise SystemExit(f'Expected exactly one obsolete conversation token, found {browser.count(old)}')
          browser_path.write_text(browser.replace(old, new))

          operator_path = Path('verify-file-first-operator.mjs')
          operator = operator_path.read_text()
          anchor = "  assert.match(engineSource,/SELECT_RESPONSE_JSON_FILE/,'The engine must derive response-file selection as the operator action.');\n"
          addition = "  assert.match(appSource,/Continue talking to the agent\\. Do not import a final response file yet\\./,'The operator UI must distinguish continuing the conversation from selecting the final response file.');\n"
          if operator.count(anchor) != 1:
              raise SystemExit(f'Expected one operator assertion anchor, found {operator.count(anchor)}')
          if addition not in operator:
              operator = operator.replace(anchor, anchor + addition)
          mutation_anchor = "assert.throws(()=>verify({engineSource:engine.replaceAll('SELECT_RESPONSE_JSON_FILE','PASTE_FINAL_JSON')}),/Paste must not remain/);\n"
          mutation = "assert.throws(()=>verify({appSource:app.replace('Continue talking to the agent. Do not import a final response file yet.','Continue the external conversation')}),/distinguish continuing the conversation/);\n"
          if operator.count(mutation_anchor) != 1:
              raise SystemExit(f'Expected one mutation anchor, found {operator.count(mutation_anchor)}')
          if mutation not in operator:
              operator = operator.replace(mutation_anchor, mutation_anchor + mutation)
          operator = operator.replace('mutationsDetected:7','mutationsDetected:8')
          operator_path.write_text(operator)
          PY
      - name: Prove browser-state and file-first contracts
        run: |
          set -euo pipefail
          node --check verify-browser-extra.mjs
          node --check verify-file-first-operator.mjs
          node verify-file-first-operator.mjs
          node verify-file-first-response.mjs
          node verify-ingestion.mjs
      - name: Remove one-time scaffolding and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-fix-browser-conversation-oracle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser-extra.mjs verify-file-first-operator.mjs .github/workflows/one-time-fix-browser-conversation-oracle.yml
          git diff --cached --check
          git commit -m 'Align browser conversation-state proof with file-first UI'
          git push origin HEAD:repair/full-spec-conformance-fcfc1c6
