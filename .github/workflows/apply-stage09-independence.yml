name: Apply Stage 09 independent preflight binding
on:
  push:
    branches: [fix/stage09-independent-preflight-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind Stage 09 to a real reviewer context
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('workflow-schema.js'); s=p.read_text()
          old="if(s===11)keys.push('runId','contextId');if(s>=20)keys.push('baselineId');"
          new="if(s===9)keys.push('contextId');if(s===11)keys.push('runId','contextId');if(s>=20)keys.push('baselineId');"
          if old not in s: raise SystemExit('scope anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('prompt-engine.js'); s=p.read_text()
          old="9:Object.freeze(['failureTests','requirementResolutions','sources','sourceConflicts']),"
          new="9:Object.freeze(['failureTests','requirementResolutions','sources','sourceConflicts','freshContexts']),"
          if old not in s: raise SystemExit('prompt context anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('workflow-engine.js'); s=p.read_text()
          old="""    case 9:\n      requireAccepted();requireCount('preflightRecords',1);\n      if(collection('preflightRecords').some(record=>['VIOLATED','UNDETERMINED','BLOCKED','REJECTED'].includes(upper(recordValue(record,'DETERMINATION')))))reasons.push('Instruction preflight contains an unresolved material finding.');\n      break;"""
          new="""    case 9:{\n      requireAccepted();requireCount('preflightRecords',1);\n      if(collection('preflightRecords').some(record=>['VIOLATED','UNDETERMINED','BLOCKED','REJECTED'].includes(upper(recordValue(record,'DETERMINATION')))))reasons.push('Instruction preflight contains an unresolved material finding.');\n      const preflightChange=changes.at(-1),preflightReviewer=String(preflightChange?.scope?.contextId||''),preflightIndependence=evaluateContextIndependence(project,{role:'PREFLIGHT_REVIEW',reviewerContextId:preflightReviewer});\n      if(!['APPLICATION_ESTABLISHED','EXTERNALLY_SUPPORTED'].includes(preflightIndependence.determination))reasons.push('Preflight reviewer independence is not established: '+preflightIndependence.reasons.join(' '));\n      break;\n    }"""
          if old not in s: raise SystemExit('stage9 gate anchor missing')
          s=s.replace(old,new,1)
          marker="  if(role==='VERIFICATION'){"
          insert="""  if(role==='PREFLIGHT_REVIEW'){\n    const reviewer=String(reviewerContextId||'').trim(),contexts=records(project,'freshContexts').filter(c=>isActiveRecord(c)&&Number(c.stage)===9),reviewerRecord=contexts.find(c=>recordId(c,'freshContexts')===reviewer),external=String(recordValue(reviewerRecord,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim();\n    if(!reviewer||!reviewerRecord||!external)return {determination:'UNKNOWN',reasons:['A current Stage 09 reviewer context with an external context identifier is required.'],evidence:[reviewer].filter(Boolean)};\n    if(['TRUE','YES','CONTAMINATED','DETECTED','POSITIVE'].includes(upper(recordValue(reviewerRecord,'CONTAMINATION_STATUS'))))return {determination:'VIOLATED',reasons:['The Stage 09 reviewer context is contaminated.'],evidence:[reviewer,external]};\n    if(forbidden.test(JSON.stringify(recordValue(reviewerRecord,'AUTHORIZED_PROJECT_INPUTS')||[])))return {determination:'VIOLATED',reasons:['The Stage 09 reviewer context contains prohibited prior review, root-cause, or correction material.'],evidence:[reviewer,external]};\n    return {determination:'EXTERNALLY_SUPPORTED',reasons:['The application binds a distinct current Stage 09 reviewer context, but the external Stage 08 author context is not fully observable and is not falsely claimed as application-proven.'],evidence:[reviewer,external]};\n  }\n"""
          if marker not in s: raise SystemExit('independence insertion anchor missing')
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)

          p=Path('app-core.js'); s=p.read_text()
          s=s.replace("requiresContext=requirements.includes('contextId')||[23,24].includes(Number(n))","requiresContext=requirements.includes('contextId')||[9,23,24].includes(Number(n))",1)
          s=s.replace("if([23,24].includes(Number(n))&&!currentReviewerContext(n))","if([9,23,24].includes(Number(n))&&!currentReviewerContext(n))",1)
          old="function reviewerContextMarkup(n,locked){if(![23,24].includes(n)||locked)return '';const ctx=currentReviewerContext(n),external=ctx?String(engine.recordValue(ctx,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim():'';if(ctx&&external)return `<div class=\"notice success\"><strong>Independent reviewer context registered.</strong><br>${esc(engine.recordId(ctx,'freshContexts'))} · ${esc(external)}. The controlling prompt is bound to this reviewer context and must not be reused in the product-generation context.</div>`;return `<div class=\"panel\" id=\"reviewer-context-required\" tabindex=\"-1\"><h2 class=\"section-title\">Open a fresh independent reviewer context</h2><p class=\"section-intro\">Use a new external conversation/context that did not generate the product. Enter its identifier here before saving or copying the reviewer instruction; the application binds that identity into the controlling prompt.</p><div class=\"field\"><label>Fresh reviewer context identifier</label><input id=\"fresh-context-id\" autocomplete=\"off\"><span class=\"help\">Use the external conversation/session identifier you can recognize later. Do not reuse the Stage 21 production context.</span></div><div class=\"button-row\"><button class=\"primary\" id=\"add-fresh-context\" type=\"button\">Register reviewer context</button></div></div>`;}"
          new="function reviewerContextMarkup(n,locked){if(![9,23,24].includes(n)||locked)return '';const ctx=currentReviewerContext(n),external=ctx?String(engine.recordValue(ctx,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim():'',preflight=n===9,reference=preflight?'the context that authored the Stage 08 production instruction':'the Stage 21 product-generation context';if(ctx&&external)return `<div class=\"notice success\"><strong>Independent reviewer context registered.</strong><br>${esc(engine.recordId(ctx,'freshContexts'))} · ${esc(external)}. The controlling prompt is bound to this reviewer context and must not reuse ${esc(reference)}.</div>`;return `<div class=\"panel\" id=\"reviewer-context-required\" tabindex=\"-1\"><h2 class=\"section-title\">Open a fresh independent reviewer context</h2><p class=\"section-intro\">Use a new external conversation/context that did not perform ${preflight?'Stage 08 instruction authoring':'product generation'}. Enter its identifier here before saving or copying the reviewer instruction; the application binds that identity into the controlling prompt.</p><div class=\"field\"><label>Fresh reviewer context identifier</label><input id=\"fresh-context-id\" autocomplete=\"off\"><span class=\"help\">Use the external conversation/session identifier you can recognize later. Do not reuse ${esc(reference)}.</span></div><div class=\"button-row\"><button class=\"primary\" id=\"add-fresh-context\" type=\"button\">Register reviewer context</button></div></div>`;}"
          if old not in s: raise SystemExit('reviewer UI anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("allowFresh=schema.STAGE_CONTRACTS[n].supportCollections.includes('freshContexts')&&![23,24].includes(n)","allowFresh=schema.STAGE_CONTRACTS[n].supportCollections.includes('freshContexts')&&![9,23,24].includes(n)",1)
          p.write_text(s)
          PY
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-schema.js prompt-engine.js workflow-engine.js app-core.js
          git commit -m "Bind Stage 09 preflight to an independent reviewer context"
          git push
