name: Finish user-intent closure
on:
  push:
    branches: [closed-loop-v3-completion]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-v3-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply intent closure repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(s,a,b,label):
              if s.count(a)!=1: raise SystemExit(f'{label}: {s.count(a)} matches')
              return s.replace(a,b,1)
          p=Path('prompt-engine.js');s=p.read_text()
          a="1:'Perform complete human-authority intake only. Read every accessible supplied material deeply enough to capture every human-supplied fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue relevant to defining the requested outcome. Do not do source research, requirement atomization, test design, production, filing, simulation, manufacturing, or product verification. Do not ask the human to repeat information already present in supplied material. Classify every APPLICATION INTAKE MANIFEST unit exactly once. INPUT_SET_CONTENTS must be a JSON string whose root is {\"units\":[]} and contains one entry for every manifest unit. Each entry must contain sourceUnitId, disposition, and extractedStatements. extractedStatements must capture all materially relevant human-authority statements from that unit; each statement must have statementKey, text, and statementClass. Allowed unit dispositions are incorporated into the job definition, retained as context, unresolved human-only, later-resolvable, or inapplicable with reason. This structured capture is the durable meaning-preserving handoff to later stages so the original intent file is not repeatedly required.'"
          b="1:'Perform complete human-authority intake only. Understand the requested project completely before this stage may finish. Exhaust the current user request, every accessible supplied material, and every current human-authority field. Capture every materially relevant human-supplied fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue relevant to defining the requested outcome. Preserve the exact objective and exact deliverable without narrowing, substituting, simplifying, or silently dropping any compatible instruction. Classify every unresolved issue as BLOCKING_NOW, ASK_NOW_NONBLOCKING, or LATER_RESOLVABLE. BLOCKING_NOW must be asked and answered before completion. ASK_NOW_NONBLOCKING must be asked before submission, but the human may answer unknown or deferred. LATER_RESOLVABLE must not be asked now when supplied material, authorized research, or a later stage can resolve it. Never ask the human to repeat information already supplied or available in accessible project material. Inspect accessible supplied artifacts deeply enough to extract human-authority information now; never infer substantive content from a filename when bytes are unavailable. Do not do source research, external-authority analysis, requirement atomization, test design, production, filing, simulation, manufacturing, or product verification. Classify every APPLICATION INTAKE MANIFEST unit exactly once. INPUT_SET_CONTENTS must be a JSON string whose root is {\"units\":[]} and contains one entry for every manifest unit. Each entry must contain sourceUnitId, disposition, and extractedStatements. extractedStatements must exhaust all materially relevant human-authority statements from that unit; each statement must have statementKey, text, and statementClass. Allowed unit dispositions are incorporated into the job definition, retained as context, unresolved human-only, later-resolvable, or inapplicable with reason. Before final JSON, verify that objective and intended deliverable are defined, every controlled input unit is accounted for, every foreseeable human-only issue was supplied or actually asked and answered or deferred as allowed, and no later-stage substantive work was performed. This structured capture is the durable meaning-preserving handoff to every later stage so project information supplied once is never requested again merely because the workflow advanced.'"
          s=rep(s,a,b,'stage1')
          a="3:'Research only the current accepted Stage 02 independent external source set, source-by-source and pass-by-pass. Preserve mandatory statements, recommendations, optional practices, examples, prohibitions, exceptions, dependencies, applicability facts, restrictions, invalidating material, and candidate obligations. Cover every current Stage 02 source unless Stage 02 established no applicable source.'"
          b="3:'Exhaust the current accepted Stage 02 independent external source set before this stage may finish. Research every current source source-by-source and pass-by-pass, inspecting every applicable portion needed to discover obligations or material that can change applicability or meaning. Extract and preserve mandatory statements, recommendations, optional practices, examples, explanatory material, prohibitions, exceptions, dependencies, applicability facts, restrictions, invalidating material, and candidate obligations. Perform a second conflict-and-exception pass after the initial extraction. Do not declare completion while any current source lacks coverage, a known controlling portion remains unexamined, a research gap or blocker remains unresolved, or the latest pass discovered a new material category that has not itself been exhausted. Cover every current Stage 02 source unless Stage 02 validly established no applicable external source. The result must be exhaustive enough that Stage 04 can consume the complete accepted research without rediscovering the source universe.'"
          s=rep(s,a,b,'stage3');p.write_text(s)
          p=Path('workflow-engine.js');s=p.read_text()
          start=s.index('  if(stage===4){\n    const currentInput=String(currentScope(project).inputVersion||\'\')',s.index('function executionHandoff'))
          end=s.index('  for(const item of items)',start)
          s=s[:start]+s[end:]
          a="if(stage===4){const handoff=executionHandoff(project,{stage:4,operation:'COMPLETE'}),materials=handoff.conversationMaterials.map(item=>item.label);if(materials.length)return 'Send the Stage 04 instruction with '+materials.join(', ')+'. The prompt does not include those materials. When the agent finishes, paste its final JSON response here.';}"
          b="if(stage===4)return 'Use the current Stage 04 instruction. The application has already carried forward the complete accepted Stage 01 human-authority capture and current Stage 03 research into the Stage 04 obligation universe. Do not reattach or re-enter project information already supplied. Return the final structured JSON when requirement compilation is complete.';"
          s=rep(s,a,b,'stage4 action')
          a="requireCount('research',1);const researched=new Set(collection('research').map(record=>String(recordValue(record,'SOURCE_ID')||record.relationships?.SOURCE_ID||''))),missing=sourceIds.filter(id=>!researched.has(id));if(missing.length)reasons.push(`Research is missing for source(s): ${missing.join(', ')}.`);break;"
          b="requireCount('research',1);const researchRows=collection('research'),researched=new Set(researchRows.map(record=>String(recordValue(record,'SOURCE_ID')||record.relationships?.SOURCE_ID||''))),missing=sourceIds.filter(id=>!researched.has(id));if(missing.length)reasons.push(`Research is missing for source(s): ${missing.join(', ')}.`);const stageData=project.stages[3]?.agentData||{};if(!truth(stageData.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED))reasons.push('Stage 03 has not established that all known controlling sources were examined.');if(!truth(stageData.SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED))reasons.push('Stage 03 requires a completed second conflict-and-exception pass.');if(Number(stageData.LATEST_PASS_NUMBER||0)<2)reasons.push('Stage 03 requires at least two completed research passes.');if(truth(stageData.NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS))reasons.push('Stage 03 cannot complete while the latest pass found a new material category.');if(!adjudicationEmpty(stageData.RESEARCH_GAPS_AND_BLOCKERS))reasons.push('Stage 03 cannot complete while research gaps or blockers remain.');break;"
          s=rep(s,a,b,'stage3 gate');p.write_text(s)
          p=Path('index.html');s=p.read_text();s=rep(s,'.prompt{height:clamp(260px,45vh,520px);max-height:80vh;','.prompt{height:auto;max-height:80vh;','prompt size');p.write_text(s)
          PY
          node --check prompt-engine.js
          node --check workflow-engine.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f .github/workflows/finish-user-intent-closure.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git commit -m "[intent-closure] exhaust Stage 01 and 03 before Stage 04"
          git push origin HEAD:closed-loop-v3-completion
