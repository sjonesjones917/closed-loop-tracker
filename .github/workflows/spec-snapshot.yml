name: Spec snapshot
on:
  push:
    branches: [fix/stage4-intent-reuse-current-main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
