name: One-shot scope and residual contract repair

on:
  push:
    branches:
      - repair/scope-and-residual-contracts-20260903-r2

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[scope-residual-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/scope-and-residual-contracts-20260903-r2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair operation-specific scope and residual contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          s=p.read_text()
          for obsolete in [
            '"HASHES_RECORDED_WHERE_PRACTICAL":{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"STRING"},',
            '"POST_CORRECTION_SUCCESSES_PROVEN":{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"STRING"},'
          ]:
            if obsolete not in s: raise SystemExit('expected obsolete schema metadata not found')
            s=s.replace(obsolete,'',1)
          extra=",'ASSERT_EXISTS','ASSERT_TYPE','ASSERT_NE'"
          if extra not in s: raise SystemExit('expected noncontrolling Test IR operations not found')
          s=s.replace(extra,'',1)
          old="const STAGE_OPERATION_SCOPE_MATRIX=Object.freeze(Object.fromEntries(Object.entries(s0.STAGE_OPERATIONS).flatMap(([stageText,operations])=>{const stage=Number(stageText),targets=new Set(TARGET_DIMENSIONS_BY_STAGE[stage]||[]);return operations.map(operation=>{const dimensions=Object.fromEntries((EXACT_SCOPE_DIMENSIONS[stage]||[]).map(name=>[name,targets.has(name)?'TARGET_RESERVED':'INPUT_CURRENT']));return [`${stage}:${operation}`,Object.freeze({stage,operation,requiredDimensions:Object.freeze([...(EXACT_SCOPE_DIMENSIONS[stage]||[])]),dimensions:Object.freeze(dimensions),prohibitedExtraDimensions:true})];});})));"
          new="const TARGET_DIMENSIONS_BY_OPERATION=Object.freeze({\n  '19:CONFIRM_FREEZE':Object.freeze(['confirmationIterationId']),\n  '25:FREEZE_DELIVERY_CANDIDATE':Object.freeze(['deliveryCandidateSetId']),\n  '26:COMPLETE':Object.freeze(['reviewVersion']),\n  '27:CALCULATE_RELEASE':Object.freeze([]),'27:ADVISORY_REVIEW':Object.freeze([]),\n  '28:VERIFY_IDENTITY':Object.freeze([]),'28:CAPTURE_DELIVERY_INTENT':Object.freeze([]),\n  '29:CALCULATE_EVIDENCE_CHAINS':Object.freeze([]),'29:INVESTIGATE_MISSING_EVIDENCE':Object.freeze([]),\n  '30:CALCULATE_TERMINAL':Object.freeze([]),'30:EXPORT_OR_SHARE_AUTHORIZED_ARTIFACTS':Object.freeze([]),'30:RECORD_DELIVERY_EVIDENCE':Object.freeze([])\n});\nconst STAGE_OPERATION_SCOPE_MATRIX=Object.freeze(Object.fromEntries(Object.entries(s0.STAGE_OPERATIONS).flatMap(([stageText,operations])=>{const stage=Number(stageText);return operations.map(operation=>{const key=`${stage}:${operation}`,targets=new Set(Object.prototype.hasOwnProperty.call(TARGET_DIMENSIONS_BY_OPERATION,key)?TARGET_DIMENSIONS_BY_OPERATION[key]:(TARGET_DIMENSIONS_BY_STAGE[stage]||[]));const dimensions=Object.fromEntries((EXACT_SCOPE_DIMENSIONS[stage]||[]).map(name=>[name,targets.has(name)?'TARGET_RESERVED':'INPUT_CURRENT']));return [key,Object.freeze({stage,operation,requiredDimensions:Object.freeze([...(EXACT_SCOPE_DIMENSIONS[stage]||[])]),dimensions:Object.freeze(dimensions),prohibitedExtraDimensions:true})];});})));"
          if old not in s: raise SystemExit('scope-matrix construction marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('verify-scope-residual-closure.mjs').write_text("import fs from 'node:fs';\nimport vm from 'node:vm';\nimport assert from 'node:assert/strict';\nglobalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);\nfor(const f of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});\nconst s=globalThis.closedLoopWorkflowSchema,m=s.STAGE_OPERATION_SCOPE_MATRIX;assert(s&&m,'scope matrix missing');\nconst input=(key,dim)=>assert.equal(m[key].dimensions[dim],'INPUT_CURRENT',`${key} ${dim} must be INPUT_CURRENT`);const target=(key,dim)=>assert.equal(m[key].dimensions[dim],'TARGET_RESERVED',`${key} ${dim} must be TARGET_RESERVED`);\ntarget('19:CONFIRM_FREEZE','confirmationIterationId');input('19:EXECUTE_RUN','confirmationIterationId');input('19:VERIFY','confirmationIterationId');input('19:CONFIRM','confirmationIterationId');target('25:FREEZE_DELIVERY_CANDIDATE','deliveryCandidateSetId');input('25:COMPLETE','deliveryCandidateSetId');target('26:COMPLETE','reviewVersion');input('26:SEMANTIC_REVIEW','reviewVersion');input('26:RECONCILE','reviewVersion');\nfor(const key of ['27:CALCULATE_RELEASE','27:ADVISORY_REVIEW'])input(key,'reconciledReviewVersion');for(const key of ['28:VERIFY_IDENTITY','28:CAPTURE_DELIVERY_INTENT'])input(key,'releaseId');for(const key of ['29:CALCULATE_EVIDENCE_CHAINS','29:INVESTIGATE_MISSING_EVIDENCE'])input(key,'hashReviewId');for(const key of ['30:CALCULATE_TERMINAL','30:EXPORT_OR_SHARE_AUTHORIZED_ARTIFACTS','30:RECORD_DELIVERY_EVIDENCE'])input(key,'evidenceChainVersion');\nconst source=fs.readFileSync('workflow-schema.js','utf8');assert.doesNotMatch(source,/HASHES_RECORDED_WHERE_PRACTICAL/);assert.doesNotMatch(source,/POST_CORRECTION_SUCCESSES_PROVEN/);const ops=['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE'];assert.deepEqual([...s.TEST_IR.operations],ops);console.log(JSON.stringify({scopeResidualClosure:'PASS',testIrOperations:ops.length}));\n")
          v=Path('verify-complete.mjs').read_text()
          if "verify-scope-residual-closure.mjs" not in v:v += "\nawait import('./verify-scope-residual-closure.mjs');\n"
          Path('verify-complete.mjs').write_text(v)
          PY
          node verify-scope-residual-closure.mjs
          node verify-v3-contract.mjs
          node verify-complete.mjs
      - name: Remove one-shot workflow and commit canonical changes
        shell: bash
        run: |
          git rm .github/workflows/repair-scope-residuals-r2.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add workflow-schema.js verify-complete.mjs verify-scope-residual-closure.mjs
          git commit -m 'Close operation-specific scope and residual contracts [scope-residual-done]'
          git push origin HEAD:repair/scope-and-residual-contracts-20260903-r2