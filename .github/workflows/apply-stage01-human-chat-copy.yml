name: Apply Stage 01 human-chat copy correction

on:
  push:
    branches:
      - fix/stage01-human-chat-copy-20260826

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stage01-human-chat-copy-clean]') && !contains(github.event.head_commit.message, '[stage01-human-chat-copy-failed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal Stage 01 copy correction
        run: node .maintenance-stage01-human-chat-copy.mjs
      - name: Verify complete deterministic workflow
        run: |
          set +e
          {
            node build-test-project.mjs &&
            node --check app-core.js &&
            node --check verify-prompt-semantics.mjs &&
            node verify-hash.mjs &&
            node verify.mjs &&
            node verify-ingestion.mjs &&
            node verify-complete.mjs &&
            node verify-prompt-semantics.mjs &&
            node verify-full-cycle.mjs
          } > .maintenance-stage01-human-chat-copy.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > .maintenance-stage01-human-chat-copy.exit
      - name: Commit verified source only
        run: |
          status=$(cat .maintenance-stage01-human-chat-copy.exit)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" = "0" ]; then
            rm .maintenance-stage01-human-chat-copy.mjs .github/workflows/apply-stage01-human-chat-copy.yml .maintenance-stage01-human-chat-copy.log .maintenance-stage01-human-chat-copy.exit
            git add -A
            git commit -m "Make Stage 01 guidance use normal ChatGPT conversation [stage01-human-chat-copy-clean]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            git add -A
            git commit -m "Capture Stage 01 human-chat copy verification failure [stage01-human-chat-copy-failed]"
            git push origin HEAD:${GITHUB_REF_NAME}
            cat .maintenance-stage01-human-chat-copy.log
            exit "$status"
          fi
