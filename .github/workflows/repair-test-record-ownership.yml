name: Repair test record ownership partition
on:
  push:
    branches: [fix/restore-deployment-proof-chain]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-deployment-proof-chain
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          text=p.read_text()
          old="'EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS','INPUTS'"
          new="'EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS','EXECUTABLE_SPEC_SHA256','INPUTS'"
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('tests field list target not found')
          p.write_text(text.replace(old,new,1))
          PY
          rm .github/workflows/repair-test-record-ownership.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js .github/workflows/repair-test-record-ownership.yml
          git commit -m "Fix verification test ownership partition"
          git push origin HEAD:fix/restore-deployment-proof-chain
