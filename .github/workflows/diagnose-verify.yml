name: Commit verified all stage prompt repairs
on:
  push:
    branches: [fix/stage01-intake-closure-20260830]
permissions: {contents: write}
jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact verified candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('repair-all-prompts.py'); s=p.read_text()
          old="STAGE-SPECIFIC TASK\\n${procedures[stage]||'Perform the current stage completely and only the current stage.'}\\n\\nPERMITTED AGENT-OWNED STAGE DATA"
          new="STAGE-SPECIFIC TASK\\n${procedures[stage]}\\n\\nPERMITTED AGENT-OWNED STAGE DATA"
          s=s.replace(old,new,1)
          old2="STAGE-SPECIFIC TASK\\n${operationSpecificTask(stage,operation)}${operationSpecificTask(stage,operation)?'\\\\n\\\\n':''}${procedures[stage]||'Perform the current stage completely and only the current stage.'}\\n\\nPERMITTED AGENT-OWNED STAGE DATA"
          new2="STAGE-SPECIFIC TASK\\n${operationSpecificTask(stage,operation)}${operationSpecificTask(stage,operation)?'\\\\n\\\\n':''}${procedures[stage]}\\n\\nPERMITTED AGENT-OWNED STAGE DATA"
          s=s.replace(old2,new2,1); p.write_text(s)
          PY
          python3 repair-all-prompts.py
          sed -i "s/closed-loop-prompt-engine\/28/closed-loop-prompt-engine\/29/" prompt-engine.js
      - name: Reprove exact candidate before commit
        run: |
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check verify-stage-prompts-complete.mjs
          node verify-stage-prompts-complete.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-test-runtime.mjs
          node verify-ingestion.mjs
          node verify.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js prompt-engine.js verify-stage-prompts-complete.mjs
          git commit -m "Make all stage prompts context-complete and operation-specific"
          git pull --rebase origin fix/stage01-intake-closure-20260830
          git push origin HEAD:fix/stage01-intake-closure-20260830
