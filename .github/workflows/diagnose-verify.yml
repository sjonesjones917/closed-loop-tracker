name: Diagnose all stage prompt repair
on:
  push:
    branches: [fix/stage01-intake-closure-20260830]
permissions: {contents: read}
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture patch failure
        id: patch
        continue-on-error: true
        run: |
          set +e
          python3 repair-all-prompts.py > repair-all-prompts.log 2>&1
          status=$?
          cat repair-all-prompts.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: all-stage-repair-failure
          path: repair-all-prompts.log
          if-no-files-found: error
      - name: Preserve failure
        if: steps.patch.outputs.status != '0'
        run: exit 1
