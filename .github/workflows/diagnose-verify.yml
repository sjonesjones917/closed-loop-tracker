name: Diagnose Stage 01 ingestion fixture
on:
  push:
    branches: [fix/stage01-intake-closure-20260830]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply fixture repair in runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs'); s=p.read_text()
          old="""  if(stage===1)records.intentStatements=[{tempKey:'intent-statement-1',fields:{SOURCE_MATERIAL:'authorized human job input',SOURCE_LOCATION:'verbatim request',EXACT_STATEMENT:'Verify the closed-loop response ingestion path.',STATEMENT_KIND:'REQUIREMENT',REQUIREMENT_RELEVANCE:'REQUIREMENT',NORMATIVE_FORCE:'MUST',DEPENDENCIES:'NONE',EXCEPTIONS:'NONE',CONFLICTS:'NONE',NOTES:'Controlled Stage 01 fixture'},relationships:{},evidenceRefs:['evidence-1']}];"""
          new="""  if(stage===1){
            const intakeManifest=engine.stage01IntakeManifest(p),entries=intakeManifest.entries||[];
            records.intentStatements=entries.map((entry,index)=>({tempKey:`intent-statement-${index+1}`,fields:{SOURCE_MATERIAL:String(entry.sourceIdentity||entry.sourceKind||'authorized human job input'),SOURCE_LOCATION:String(entry.location||entry.inputId||'controlled input'),EXACT_STATEMENT:typeof entry.value==='string'?entry.value:JSON.stringify(entry.value),STATEMENT_KIND:'OTHER',REQUIREMENT_RELEVANCE:'CONTEXT_ONLY',NORMATIVE_FORCE:'FACTUAL',DEPENDENCIES:'NONE',EXCEPTIONS:'NONE',CONFLICTS:'NONE',NOTES:'Controlled Stage 01 fixture'},relationships:{},evidenceRefs:['evidence-1']}));
            stageData.INTAKE_ACCOUNTING=entries.map((entry,index)=>({inputId:String(entry.inputId||''),disposition:'RETAINED_AS_CONTEXT',statementTempKeys:[`intent-statement-${index+1}`],reason:''}));
          }"""
          if old not in s: raise SystemExit('Stage 01 valid fixture anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Capture exact regression
        id: verify
        continue-on-error: true
        run: |
          set +e
          {
            echo '=== verify-stage01-intake-closure ==='
            node verify-stage01-intake-closure.mjs
            echo '=== verify-ingestion ==='
            node verify-ingestion.mjs
            echo '=== verify.mjs ==='
            node verify.mjs
          } > fixture-regression.log 2>&1
          status=$?
          cat fixture-regression.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-regression-log
          path: fixture-regression.log
          if-no-files-found: error
      - name: Preserve failure
        if: steps.verify.outputs.status != '0'
        run: exit 1
