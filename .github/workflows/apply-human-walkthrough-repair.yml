name: Apply human walkthrough repair
on:
  push:
    branches:
      - finish-app-human-walkthrough-20260830
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source repair
        run: python repair-human-walkthrough.py
      - name: Commit source repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app-core.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix one-time intent capture UI and restore prompt viewport"
          git push
