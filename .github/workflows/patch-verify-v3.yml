name: Finalize controlling v3 closure
on:
  push:
    branches: [controlling-spec-final-current]
    paths: ['.github/workflows/patch-verify-v3.yml','.github/patch_verify_v3.py']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: controlling-spec-final-current, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize final controlling semantics and visual rollback
        run: python3 .github/patch_verify_v3.py
      - name: Repair overbroad UI terminology regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-test-project.mjs')
          s=p.read_text()
          old="const banned=new RegExp('se'+'mantic','i');if(banned.test(activeSource))throw new Error('Prohibited normal UI terminology remains in active source.');"
          new="const banned=new RegExp('se'+'mantic','i');if(banned.test(html+app))throw new Error('Prohibited normal UI terminology remains on the primary UI surface.');"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('UI terminology regression anchor missing')
          p.write_text(s)
          PY
      - name: Syntax and architecture checks
        run: |
          node --check workbook.js
          node --check hash.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check test-worker.js
          node --check build-test-project.mjs
          node --check verify-stage01-stage03-stage04-closure.mjs
      - name: Execute controlling proofs
        run: |
          node build-test-project.mjs
          node verify-stage01-stage03-stage04-closure.mjs
          node verify-closed-accounting.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-definition-of-done.mjs
      - name: Remove one-time repair machinery and commit exact source
        run: |
          rm -f .github/patch_verify_v3.py .github/workflows/patch-verify-v3.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize exhaustive Stage 01 and Stage 03 closure"
          git push origin HEAD:controlling-spec-final-current
