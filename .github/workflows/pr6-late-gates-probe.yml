name: PR6 late-stage gate completeness probe
on:
  push:
    branches: [practical-100/pr6-finalize]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python .pr6-late-gates.py
          python .pr6-inventory-normalizer.py
      - run: |
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit proved changes and clean probe
        if: success()
        run: |
          rm .pr6-late-gates.py .pr6-inventory-normalizer.py .github/workflows/pr6-late-gates-probe.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 6: enforce complete late-stage gates"
          git push
