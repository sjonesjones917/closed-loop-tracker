name: Temporary Stage 21 convergence runtime repair

on:
  push:
    branches: [fix/stage21-due-convergence-20260904]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize pinned repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object workflow-engine.js)" = "b0151944b6c726a6ff8e739770040110513deb0f"
          base64 -d verification/.stage21-repair.patch.gz.b64 | gzip -d > /tmp/stage21.patch
          base64 -d verification/.stage21-verifier.gz.b64 | gzip -d > /tmp/verify-due-stage-timing.mjs
          test "$(sha256sum /tmp/stage21.patch | awk '{print $1}')" = "7853365e97799d7766d65b174aee0b64e029fde07356eb0d4ac659935f35522d"
          test "$(sha256sum /tmp/verify-due-stage-timing.mjs | awk '{print $1}')" = "799ff46d6b24c40a384812492c3dc06a8779123d0f8d1b73484fb095c5e9909e"
      - name: Prove repaired verifier rejects current invalid runtime
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/verify-due-stage-timing.mjs verify-due-stage-timing.mjs
          if node verify-due-stage-timing.mjs > /tmp/pre-repair.log 2>&1; then
            cat /tmp/pre-repair.log
            echo "Stage 21 invalid fixture unexpectedly passed before runtime repair." >&2
            exit 1
          fi
          cat /tmp/pre-repair.log
          grep -F "A future Stage 22 blocker must not block Stage 18 convergence" /tmp/pre-repair.log
      - name: Apply earliest-layer convergence repair and prove progression
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < /tmp/stage21.patch
          test "$(sha256sum workflow-engine.js | awk '{print $1}')" = "16b837ba205401948cd11d7788c056b1dd393f40c3736ed1773e6034ff9a74dc"
          node --check workflow-engine.js
          node verify-due-stage-timing.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
      - name: Commit only permanent implementation and regression
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage21-runtime-repair.yml verification/.stage21-repair.patch.gz.b64 verification/.stage21-verifier.gz.b64
          git add workflow-engine.js verify-due-stage-timing.mjs .github/workflows/stage21-runtime-repair.yml verification/.stage21-repair.patch.gz.b64 verification/.stage21-verifier.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Stage 18 due convergence semantics"
          git push origin HEAD:fix/stage21-due-convergence-20260904
