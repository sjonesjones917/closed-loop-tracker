name: Apply combined prompt engine closure
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          text=p.read_text()
          text=text.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/43';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/44';",1)
          text=text.replace("function humanInputBlock(job){const names=Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>definition?.producer==='HUMAN').map(([name])=>name);", "function humanInputBlock(job){const names=Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>name);",1)
          start='const PROMPT_CONTEXT_ADDITIONS=Object.freeze('
          end=');\nconst PROMPT_OPERATION_CONTEXT_ADDITIONS='
          a=text.find(start); b=text.find(end,a)
          if a<0 or b<0: raise SystemExit('prompt context additions block not found')
          expanded="""const PROMPT_CONTEXT_ADDITIONS=Object.freeze({
2:Object.freeze([]),
3:Object.freeze([]),
4:Object.freeze(['sourceConflicts']),
5:Object.freeze(['sources','research','candidateRequirements','sourceConflicts','evidenceRecords']),
6:Object.freeze(['requirements','requirementResolutions','sources','research','artifacts','evidenceRecords']),
7:Object.freeze(['requirements','tests','artifacts','evidenceRecords']),
8:Object.freeze(['requirements','requirementResolutions','tests','failureTests','sources','research','sourceConflicts','evidenceRecords']),
9:Object.freeze(['instructions','requirements','requirementResolutions','tests','failureTests','sources','sourceConflicts','evidenceRecords','freshContexts']),
10:Object.freeze(['instructions','preflightRecords','requirements','tests','failureTests','artifacts']),
11:Object.freeze(['candidateFreezes','iterations','instructions','artifacts','freshContexts']),
12:Object.freeze(['runs','requirements','tests','sources','research','evidenceRecords','artifacts','freshContexts']),
13:Object.freeze(['runs','verification','requirements','tests']),
14:Object.freeze(['comparisons','verification','defects','requirements','tests','instructions','runs','sources','research','candidateRequirements','requirementResolutions','failureTests','preflightRecords','artifacts','evidenceRecords','changes']),
15:Object.freeze(['defects','rootCauses','requirements','tests','runs','verification','artifacts','evidenceRecords']),
16:Object.freeze(['defects','rootCauses','regressions','regressionExecutions','requirements','requirementResolutions','instructions','tests','failureTests','artifacts','evidenceRecords','changes']),
18:Object.freeze(['iterations','runs','verification','comparisons','defects','rootCauses','regressions','regressionExecutions','requirements','tests','changes','blockers','evidenceRecords']),
20:Object.freeze(['confirmationRecords','candidateFreezes','iterations','artifacts']),
21:Object.freeze(['baselines','instructions','artifacts','freshContexts']),
22:Object.freeze(['products','requirements','tests','artifacts','evidenceRecords']),
23:Object.freeze(['products','requirements','tests','sources','research','evidenceRecords','artifacts','freshContexts']),
24:Object.freeze(['products','requirements','tests','regressions','regressionExecutions','sources','research','evidenceRecords','artifacts','freshContexts']),
25:Object.freeze(['products','baselines','tests','artifacts','evidenceRecords']),
26:Object.freeze(['requirements','tests','instructions','runs','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','confirmationRecords','baselines','products','evidenceRecords']),
27:Object.freeze(['requirements','tests','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','processAudits','productAudits','confirmationRecords','baselines','products','blockers','evidenceRecords']),
29:Object.freeze(['requirements','instructions','instructionTraces','tests','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','evidenceRecords','releaseRecords','artifactIdentities','baselines','products','evidenceChains']),
30:Object.freeze(['requirements','defects','regressions','regressionExecutions','baselines','evidenceRecords'])
})"""
          text=text[:a]+expanded+text[b+2:]
          marker='function projectDataExecutionRule(stage){'
          idx=text.find(marker)
          if idx<0: raise SystemExit('project data rule marker not found')
          if 'const STAGE_COMPLETION_DIRECTIVES=' not in text:
              completion="""const STAGE_COMPLETION_DIRECTIVES=Object.freeze({
1:'Complete only when objective and deliverable are defined, supplied materials identified, every controlled input unit accounted for, every foreseeable human-only issue supplied or asked and answered/deferred, and no later-stage work was performed.',
2:'Complete only when every reasonably possible controlling external-source category has been considered, accepted sources inspected/classified, conflicts resolved or blocked, and legitimate authority exists or NO_APPLICABLE_EXTERNAL_SOURCE is evidence-supported.',
3:'Complete only when every current Stage 02 source has current research coverage and repeated complete passes reach saturation with no new material obligation, exception, dependency, applicability fact, conflict, supersession issue, or invalidating condition.',
4:'Complete only when every obligationId has exactly one valid accounting path and every resulting requirement is atomic, traceable, applicable, observable, evidence-defined, failure-defined, and verification-ready.',
5:'Complete only when the entire current requirement set has been reviewed for every declared defect class and each defect is resolved or explicitly blocked.',
6:'Complete only when every active mandatory requirement has at least one complete ready test, false-positive analysis is complete, routes/capabilities/artifacts/evidence are determinable, and every native test uses valid supported Test IR.',
7:'Complete only after every applicable failure fixture was actually executed through a capable route, expected and actual rejection agree, evidence is sufficient, and every accepted-invalid fixture links to a validator defect.',
8:'Complete only when one coherent current production instruction contains every required section and every mandatory requirement has a complete instruction trace.',
9:'Complete only after an independent reviewer has reviewed every material clause and every material finding is resolved or blocked; any correction requires a new instruction version and full repeated preflight.',
10:'Complete only when human-selected authorized components and application-controlled identities, bytes, hashes, and tool configuration form one immutable candidate for all ten runs.',
11:'Execute exactly one reserved run lane in this response. Stage 11 completes only when exactly ten current accepted independent runs use the identical frozen candidate/package, distinct contexts, no contamination, and separately preserved outputs and receipts.',
12:'Complete only when every required current REQ_ID × RUN_ID × TEST_ID cell has exactly one independent current valid determination with sufficient evidence.',
13:'Complete only when every mandatory requirement is compared across all ten current runs and every correctness-affecting variance remains visible and is linked to a defect where required.',
14:'Complete only when every current material defect has one evidence-supported RCA identifying the earliest defective layer; unknown RCA remains blocked.',
15:'Complete only when every confirmed defect has a permanent regression definition and a distinct actual pre-correction execution reproducing the failure with sufficient evidence.',
16:'Complete only when every confirmed RCA has a controlled correction or blocker, required human authorization exists, old versions are preserved, new versions are created, and affected downstream work is invalidated.',
17:'Perform only the named operation. The corrected iteration completes only after application-controlled freeze, ten new independent runs, complete verification, comparison, RCA, regression proof, and evidenced root-cause correction.',
18:'Complete only when complete mandatory specification/verification/regression coverage and zero critical defects, major defects, mandatory unknowns, correctness-affecting contradictions, ambiguities, and unexplained variance are simultaneously true.',
19:'Perform only the named unchanged-confirmation operation. Final confirmation requires unchanged candidate identity/hashes, ten new contexts, full verification and regressions, and no new requirement, missed failure, material defect, contradiction, or unexplained variance.',
20:'Complete only after unchanged confirmation succeeded, genuine human baseline authorization exists, and the application freezes and hashes the exact approved versions and bytes as an immutable baseline.',
21:'Complete only when a fresh production context uses only approved baseline material, executes the approved production instruction completely, and returns every requested finished-product artifact and execution observation.',
22:'For external deterministic work, execute only tests explicitly routed externally and return objective evidence; never impersonate native execution. Stage 22 completes only when the application has one current sufficient result for every applicable mandatory deterministic test and all are satisfied.',
23:'Complete only when every active meaning-review requirement has one current independent review with product location, required meaning, observed meaning, evidence-based comparison, applicable source evidence, and supported determination; no mandatory review remains violated or undetermined.',
24:'Complete only after every applicable attack category and active authorized historical regression pattern was actually tested, findings have sufficient evidence, independence is preserved, and every unresolved mandatory finding has a defect or blocker.',
25:'Complete only after every current product/delivery artifact, required representation, page/view, transformation, and packaged file has actually been inspected through the proper authority path and no mandatory representation unknown remains.',
26:'Complete only when current process and product evidence are reviewed as separate propositions, discrepancies/missing links/contradictions are reconciled or blocked, and both evidence bodies support progression.',
27:'Provide advisory analysis only. The application alone completes Stage 27 by calculating exactly one idempotent ACCEPTED, REJECTED, or BLOCKED result from complete current sufficient noncontradictory evidence.',
28:'The application owns authoritative artifact identity. Completion requires one-to-one comparison of current audited and delivery bytes by canonical artifact identity, authorized filename, byte size, and SHA-256 with no missing, extra, duplicate, stale, renamed, modified, or unknown item.',
29:'Complete only when the application-generated chain for every mandatory requirement contains every current structural link and sufficient evidence capable of proving each proposition through current release and artifact identity where applicable.',
30:'Complete only when defect/regression histories remain append-only, corrections are new records, every confirmed defect has a permanent regression, and the latest applicable regression execution succeeded before baseline approval.'
});
function stageCompletionDirective(stage){return STAGE_COMPLETION_DIRECTIVES[stage]||'Complete the current stage only when every requirement of its declared stage contract is satisfied or explicitly blocked with exact reason and evidence.';}
"""
              text=text[:idx]+completion+text[idx:]
          old='\\n\\nSTAGE PROCEDURE\\n${procedureFor(stage,operation)}\\n\\n'
          new='\\n\\nSTAGE PROCEDURE\\n${procedureFor(stage,operation)}\\n\\nSTAGE COMPLETION BOUNDARY — DO NOT STOP EARLY\\n${stageCompletionDirective(stage)}\\n\\n'
          if old in text: text=text.replace(old,new,1)
          elif 'STAGE COMPLETION BOUNDARY — DO NOT STOP EARLY' not in text: raise SystemExit('stage completion insertion point not found')
          p.write_text(text)
          PY
          rm -f .github/workflows/apply-combined-prompt-engine.yml .github/workflows/apply-current-all-stage-prompt-closure.yml .prompt-closure-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Combine generic prompt basis with all-stage context closure"
          git push origin HEAD:main
