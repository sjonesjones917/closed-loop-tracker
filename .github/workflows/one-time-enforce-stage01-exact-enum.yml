name: One-time enforce exact Stage 01 disposition enum

on:
  push:
    branches:
      - repair/stage01-disposition-minimal-20260903

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reproduce case-normalization defect before repair
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const e=globalThis.closedLoopWorkflowEngine,c=globalThis.closedLoopCore;
          const x=c.createBlankState('JOB-STAGE01-CASE-REPRO');
          Object.assign(x.job,{JOB_TITLE:'Stage 01 exact enum reproduction',JOB_OWNER:'Operator',EXACT_USER_OBJECTIVE_VERBATIM:'Account every raw input unit.',EXPLICIT_USER_REQUIREMENTS:'Disposition enum values are exact.',SUPPLIED_MATERIALS_INVENTORY:'NONE',CURRENT_INPUT_VERSION:'INPUT-v001'});
          e.ensureShape(x);
          const m=e.intakeCoverageManifest(x);
          const capture={schema:'closed-loop-stage01-capture/1',inputVersion:m.inputVersion,manifestSha256:m.manifestSha256,units:m.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'retained_as_context',reason:'Case-normalization defect reproduction.',extractedStatements:[{statementKey:`S${i}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT'}]}))};
          const result=e.evaluateIntakeAccounting(x,{capture:JSON.stringify(capture)});
          if(!result.complete)throw new Error('Expected the pre-repair implementation to reproduce acceptance of a non-exact lowercase enum value.');
          console.log(JSON.stringify({defectReproduced:true,invalidValueAccepted:'retained_as_context'}));
          NODE
      - name: Apply exact-enum validation and permanent mutation regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text(encoding='utf-8')
          old="const disposition=String(unit?.disposition||'').trim().toUpperCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);"
          new="const disposition=String(unit?.disposition||'').trim();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);"
          if s.count(old) != 1:
              raise SystemExit(f'expected one Stage 01 disposition-normalization site, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('verify-stage01-disposition-contract.mjs')
          s=p.read_text(encoding='utf-8')
          old="const l=structuredClone(base);l.units[0].disposition='retained as context';assert.equal(e.evaluateIntakeAccounting(x,{capture:JSON.stringify(l)}).complete,false);"
          new="const invalidDispositions=['retained as context','retained_as_context','Retained_As_Context','EXTRACTED_RELEVANT_INFO',''];for(const invalidDisposition of invalidDispositions){const l=structuredClone(base);l.units[0].disposition=invalidDisposition;assert.equal(e.evaluateIntakeAccounting(x,{capture:JSON.stringify(l)}).complete,false,`Invalid disposition ${JSON.stringify(invalidDisposition)} must fail closed.`);}"
          if s.count(old) != 1:
              raise SystemExit(f'expected one legacy invalid-disposition assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Prove affected paths
        shell: bash
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check verify-stage01-disposition-contract.mjs
          node verify-stage01-disposition-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
      - name: Remove scaffolding and commit the complete ratchet step
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git rm .github/workflows/one-time-enforce-stage01-exact-enum.yml
          git add workflow-engine.js verify-stage01-disposition-contract.mjs
          git commit -m 'Enforce exact Stage 01 disposition enum values'
          git push origin HEAD:repair/stage01-disposition-minimal-20260903
