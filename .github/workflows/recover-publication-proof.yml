name: Recover and prove semantic-adjudication publication

on:
  push:
    branches:
      - reliability/semantic-adjudication-proof-recovery-20260828
    paths:
      - .github/workflows/recover-publication-proof.yml

permissions:
  actions: write
  checks: write
  contents: write
  deployments: read
  issues: write
  pages: read
  pull-requests: write

concurrency:
  group: recover-semantic-adjudication-publication-20260828
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_API: https://api.github.com
      TARGET_BRANCH: reliability/semantic-adjudication-zero-loss-20260828
      RECOVERY_BRANCH: reliability/semantic-adjudication-proof-recovery-20260828
      BASELINE_SHA: c396d80c81bd853267f047bcd1e952887b64c1d0
      LIVE_BASE_URL: https://sjonesjones917.github.io/closed-loop-tracker
    steps:
      - name: Check out recovery controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: reliability/semantic-adjudication-proof-recovery-20260828

      - name: Wait for the primary publisher to reach a terminal state
        id: publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=''
          status='not_found'
          conclusion=''
          for _ in $(seq 1 540); do
            runs=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs?branch=$TARGET_BRANCH&per_page=100")
            row=$(python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[r for r in d.get("workflow_runs",[]) if r.get("path")==".github/workflows/publish-tested-patch.yml"]; xs.sort(key=lambda r:r.get("created_at","") ,reverse=True); print(json.dumps(xs[0]) if xs else "")' <<< "$runs")
            if [ -z "$row" ]; then sleep 5; continue; fi
            run_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$row")
            status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$row")
            conclusion=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<< "$row")
            [ "$status" = completed ] && break
            sleep 10
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Resolve the target PR and current main identity
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:$TARGET_BRANCH&base=main&per_page=20")
          printf '%s' "$prs" > /tmp/target-prs.json
          python3 - <<'PY'
          import json,pathlib
          xs=json.loads(pathlib.Path('/tmp/target-prs.json').read_text())
          if not xs: raise SystemExit('target PR does not exist')
          xs.sort(key=lambda x:x.get('updated_at',''),reverse=True)
          p=xs[0]
          pathlib.Path('/tmp/pr-number').write_text(str(p['number']))
          pathlib.Path('/tmp/pr-state').write_text(p['state'])
          pathlib.Path('/tmp/pr-head').write_text(p['head']['sha'])
          pathlib.Path('/tmp/pr-merge').write_text(p.get('merge_commit_sha') or '')
          pathlib.Path('/tmp/pr-merged-at').write_text(p.get('merged_at') or '')
          PY
          git fetch --force origin main "$TARGET_BRANCH"
          main_sha=$(git rev-parse origin/main)
          pr=$(cat /tmp/pr-number)
          pr_state=$(cat /tmp/pr-state)
          pr_head=$(cat /tmp/pr-head)
          pr_merge=$(cat /tmp/pr-merge)
          pr_merged_at=$(cat /tmp/pr-merged-at)
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "pr_state=$pr_state" >> "$GITHUB_OUTPUT"
          echo "pr_head=$pr_head" >> "$GITHUB_OUTPUT"
          echo "pr_merge=$pr_merge" >> "$GITHUB_OUTPUT"
          echo "pr_merged_at=$pr_merged_at" >> "$GITHUB_OUTPUT"

      - name: Determine whether main already contains the clean reliability patch
        id: main_patch
        shell: bash
        run: |
          set -euo pipefail
          main_sha='${{ steps.state.outputs.main_sha }}'
          patched=false
          if git show "$main_sha:workflow-engine.js" | grep -q 'function evaluateEvidenceContract' \
            && git show "$main_sha:workflow-engine.js" | grep -q 'function evaluateResultConsistency' \
            && git show "$main_sha:workflow-engine.js" | grep -q 'function effectiveDetermination' \
            && git show "$main_sha:workflow-engine.js" | grep -q 'function validateTraceIntegrity' \
            && test "$(git ls-tree --name-only "$main_sha:.github/workflows" | sort)" = pages.yml \
            && git show "$main_sha:.github/workflows/pages.yml" | grep -q 'verify-false-acceptance.mjs' \
            && git show "$main_sha:.github/workflows/pages.yml" | grep -q 'verify-ui-prompt-contract.mjs'; then
            patched=true
          fi
          echo "patched=$patched" >> "$GITHUB_OUTPUT"

      - name: Prove the exact open PR head when main is not yet patched
        if: steps.main_patch.outputs.patched != 'true'
        id: head_proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ steps.state.outputs.pr }}'
          head='${{ steps.state.outputs.pr_head }}'
          test '${{ steps.state.outputs.pr_state }}' = open
          git checkout --detach "$head"
          git merge-base --is-ancestor "$BASELINE_SHA" "$head"
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = pages.yml
          grep -q 'function evaluateEvidenceContract' workflow-engine.js
          grep -q 'function evaluateResultConsistency' workflow-engine.js
          grep -q 'function effectiveDetermination' workflow-engine.js
          grep -q 'function validateTraceIntegrity' workflow-engine.js
          grep -q 'const APPLICATION_TEST_EXECUTORS=Object.freeze({})' workflow-engine.js
          for file in workbook.js workflow-schema.js hash.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-false-acceptance.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-ui-prompt-contract.mjs
          node verify-full-cycle.mjs
          node verify-browser.mjs
          node verify-browser-extra.mjs
          git diff --exit-code
          payload=$(python3 - "$head" <<'PY'
          import json,sys
          head=sys.argv[1]
          print(json.dumps({
            'name':'Closed-loop exact PR-head proof',
            'head_sha':head,
            'status':'completed',
            'conclusion':'success',
            'output':{
              'title':'Exact PR head is green',
              'summary':'Syntax, architecture, semantic false-acceptance invariants, ingestion atomicity, stage gates, prompt isolation, UI contract, complete synthetic 30-stage lifecycle, and Chromium acceptance passed on this exact head.'
            }
          }))
          PY
          )
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/check-runs" -d "$payload" >/tmp/check-run.json
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Merge only the exact proved PR head when needed
        if: steps.main_patch.outputs.patched != 'true'
        id: recovery_merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ steps.state.outputs.pr }}'
          head='${{ steps.state.outputs.pr_head }}'
          payload=$(python3 - "$head" <<'PY'
          import json,sys
          print(json.dumps({'sha':sys.argv[1],'merge_method':'merge','commit_title':'Enforce application-owned semantic adjudication','commit_message':'Merge the exact head after the recovery controller independently reran the complete deterministic and Chromium proof stack.'}))
          PY
          )
          code=$(curl --silent --show-error -o /tmp/recovery-merge.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -d "$payload")
          test "$code" = 200
          test "$(python3 -c 'import json; print(json.load(open("/tmp/recovery-merge.json")).get("merged") is True)')" = True
          merge_sha=$(python3 -c 'import json; print(json.load(open("/tmp/recovery-merge.json"))["sha"])')
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve the exact merge commit and refresh main
        id: merge_identity
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.main_patch.outputs.patched }}' = true ]; then
            merge_sha='${{ steps.state.outputs.main_sha }}'
          else
            merge_sha='${{ steps.recovery_merge.outputs.sha }}'
          fi
          for _ in $(seq 1 90); do
            git fetch --force origin main
            main_sha=$(git rev-parse origin/main)
            [ "$main_sha" = "$merge_sha" ] && break
            sleep 5
          done
          test "$main_sha" = "$merge_sha"
          test "$(git ls-tree --name-only "$merge_sha:.github/workflows" | sort)" = pages.yml
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Find an existing successful single-main deployment proof
        id: existing_main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merge_sha='${{ steps.merge_identity.outputs.sha }}'
          runs=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$merge_sha&branch=main&per_page=100")
          printf '%s' "$runs" >/tmp/main-runs.json
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/main-runs.json').read_text())
          xs=[r for r in d.get('workflow_runs',[]) if r.get('path')=='.github/workflows/pages.yml' and r.get('head_branch')=='main' and r.get('status')=='completed' and r.get('conclusion')=='success']
          xs.sort(key=lambda r:r.get('created_at',''),reverse=True)
          pathlib.Path('/tmp/existing-main-run').write_text(str(xs[0]['id']) if xs else '')
          PY
          echo "run_id=$(cat /tmp/existing-main-run)" >> "$GITHUB_OUTPUT"

      - name: Dispatch main only when no successful deployment proof exists
        if: steps.existing_main.outputs.run_id == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Resolve exactly one successful main acceptance run
        id: main_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merge_sha='${{ steps.merge_identity.outputs.sha }}'
          run_id='${{ steps.existing_main.outputs.run_id }}'
          if [ -z "$run_id" ]; then
            for _ in $(seq 1 540); do
              runs=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$merge_sha&branch=main&per_page=100")
              printf '%s' "$runs" >/tmp/poll-main-runs.json
              row=$(python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/poll-main-runs.json').read_text())
          xs=[r for r in d.get('workflow_runs',[]) if r.get('path')=='.github/workflows/pages.yml' and r.get('head_branch')=='main']
          xs.sort(key=lambda r:r.get('created_at',''),reverse=True)
          print(json.dumps(xs[0]) if xs else '')
          PY
              )
              if [ -n "$row" ]; then
                candidate=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$row")
                status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$row")
                conclusion=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<< "$row")
                if [ "$status" = completed ]; then
                  test "$conclusion" = success
                  run_id=$candidate
                  break
                fi
              fi
              sleep 10
            done
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Require exact acceptance artifacts and exact deployed package bytes
        id: artifact_proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id='${{ steps.main_run.outputs.run_id }}'
          merge_sha='${{ steps.merge_identity.outputs.sha }}'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" >/tmp/artifacts.json
          python3 - "$merge_sha" <<'PY'
          import json,pathlib,sys
          merge=sys.argv[1]
          xs=json.loads(pathlib.Path('/tmp/artifacts.json').read_text()).get('artifacts',[])
          pages=[x for x in xs if x.get('name')=='github-pages' and not x.get('expired')]
          acceptance=[x for x in xs if x.get('name')==f'closed-loop-acceptance-{merge}' and not x.get('expired')]
          if len(pages)!=1 or len(acceptance)!=1:
              raise SystemExit(f'exact acceptance artifacts missing: {[(x.get("name"),x.get("expired")) for x in xs]}')
          pathlib.Path('/tmp/pages-id').write_text(str(pages[0]['id']))
          pathlib.Path('/tmp/acceptance-id').write_text(str(acceptance[0]['id']))
          PY
          pages_id=$(cat /tmp/pages-id)
          acceptance_id=$(cat /tmp/acceptance-id)
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/artifacts/$pages_id/zip" -o /tmp/pages.zip
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/artifacts/$acceptance_id/zip" -o /tmp/acceptance.zip
          rm -rf /tmp/pages-zip /tmp/pages-unpacked /tmp/acceptance-unpacked
          mkdir -p /tmp/pages-zip /tmp/pages-unpacked /tmp/acceptance-unpacked
          unzip -q /tmp/pages.zip -d /tmp/pages-zip
          unzip -q /tmp/acceptance.zip -d /tmp/acceptance-unpacked
          python3 - <<'PY'
          import pathlib,shutil,tarfile
          src=pathlib.Path('/tmp/pages-zip'); dst=pathlib.Path('/tmp/pages-unpacked')
          archives=[p for p in src.rglob('*') if p.is_file() and (p.suffix in {'.tar','.gz','.tgz'} or '.tar.' in p.name)]
          if archives:
              with tarfile.open(archives[0],'r:*') as t: t.extractall(dst,filter='data')
          else:
              for p in src.rglob('*'):
                  if p.is_file():
                      target=dst/p.relative_to(src); target.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,target)
          PY
          git checkout --detach '${{ steps.merge_identity.outputs.sha }}'
          python3 - <<'PY'
          import hashlib,json,pathlib
          roots=[p.parent for p in pathlib.Path('/tmp/pages-unpacked').rglob('index.html')]
          if len(roots)!=1: raise SystemExit(f'expected one deployed root, got {roots}')
          root=roots[0]
          core=['.nojekyll','index.html','workbook.js','workflow-schema.js','hash.js','prompt-engine.js','response-ingestion.js','workflow-engine.js','project-store.js','app-core.js']
          for rel in core:
              source=pathlib.Path(rel); deployed=root/rel
              if not source.is_file() or not deployed.is_file(): raise SystemExit(f'missing source/deployed file: {rel}')
              a=source.read_bytes(); b=deployed.read_bytes()
              if len(a)!=len(b) or hashlib.sha256(a).hexdigest()!=hashlib.sha256(b).hexdigest():
                  raise SystemExit(f'deployed package mismatch: {rel}')
          acceptance=[p for p in pathlib.Path('/tmp/acceptance-unpacked').rglob('*') if p.is_file()]
          if not acceptance: raise SystemExit('machine acceptance artifact is empty')
          report={'files':[{'path':p.relative_to('/tmp/acceptance-unpacked').as_posix(),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in acceptance]}
          pathlib.Path('/tmp/acceptance-inspection.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          echo "pages_id=$pages_id" >> "$GITHUB_OUTPUT"
          echo "acceptance_id=$acceptance_id" >> "$GITHUB_OUTPUT"

      - name: Prove exact live bytes for the accepted main commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,time,urllib.parse
          core=['index.html','workbook.js','workflow-schema.js','hash.js','prompt-engine.js','response-ingestion.js','workflow-engine.js','project-store.js','app-core.js']
          base='https://sjonesjones917.github.io/closed-loop-tracker/'
          for rel in core:
              expected=pathlib.Path(rel).read_bytes(); digest=hashlib.sha256(expected).hexdigest(); ok=False
              for attempt in range(90):
                  url=base+urllib.parse.quote(rel,safe='/')+f'?recovery-proof={attempt}-{digest}'
                  r=subprocess.run(['curl','--fail','--silent','--show-error','--location','--connect-timeout','15','--max-time','45','-H','Cache-Control: no-cache',url],stdout=subprocess.PIPE)
                  if r.returncode==0 and len(r.stdout)==len(expected) and hashlib.sha256(r.stdout).hexdigest()==digest:
                      ok=True; break
                  time.sleep(5)
              if not ok: raise SystemExit(f'live byte mismatch: {rel}')
          PY

      - name: Publish final machine proof on the PR
        id: final_proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ steps.state.outputs.pr }}'
          clean_sha='${{ steps.state.outputs.pr_head }}'
          merge_sha='${{ steps.merge_identity.outputs.sha }}'
          main_run='${{ steps.main_run.outputs.run_id }}'
          pages_id='${{ steps.artifact_proof.outputs.pages_id }}'
          acceptance_id='${{ steps.artifact_proof.outputs.acceptance_id }}'
          publisher='${{ steps.publisher.outputs.run_id }}'
          python3 - "$pr" "$clean_sha" "$merge_sha" "$main_run" "$pages_id" "$acceptance_id" "$publisher" <<'PY'
          import datetime,json,pathlib,sys
          pr,clean,merge,mainrun,pages,acceptance,publisher=sys.argv[1:]
          proof={
            'schema':'closed-loop-publication-proof/1','status':'GREEN',
            'baseline':'c396d80c81bd853267f047bcd1e952887b64c1d0',
            'pullRequest':int(pr),'cleanHeadSha':clean,'mergeSha':merge,
            'publisherWorkflowRunId':int(publisher) if publisher else None,
            'mainDeploymentWorkflowRunId':int(mainrun),
            'githubPagesArtifactId':int(pages),'machineAcceptanceArtifactId':int(acceptance),
            'liveUrl':'https://sjonesjones917.github.io/closed-loop-tracker/',
            'deterministicConformance':'100% conformant to the exact tested deterministic invariant stack',
            'proved':['central semantic adjudication','structural evidence contracts','effective determinations','trace integrity','fail-closed gates, audits, convergence, regressions, and release','prompt isolation and exact handoff','universal false-acceptance mutation suite','synthetic 30-stage lifecycle','Chromium acceptance','single-main deployment proof','exact Pages artifact bytes','exact live bytes','machine acceptance artifact inspection'],
            'notClaimed':['population-wide operational reliability','separate real external-agent 30-stage project','actual Android Chrome runtime acceptance'],
            'completedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('/tmp/recovery-publication-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          inspection=json.loads(pathlib.Path('/tmp/acceptance-inspection.json').read_text())
          body='## Machine acceptance: GREEN\n\n```json\n'+json.dumps(proof,indent=2)+'\n```\n\nAcceptance artifact inspection:\n```json\n'+json.dumps(inspection,indent=2)+'\n```'
          pathlib.Path('/tmp/final-comment.json').write_text(json.dumps({'body':body}))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --data-binary @/tmp/final-comment.json >/dev/null
          echo "proof=/tmp/recovery-publication-proof.json" >> "$GITHUB_OUTPUT"

      - name: Upload recovery publication proof
        uses: actions/upload-artifact@v4
        with:
          name: recovered-semantic-adjudication-publication-proof-${{ steps.merge_identity.outputs.sha }}
          path: |
            /tmp/recovery-publication-proof.json
            /tmp/acceptance-inspection.json
          if-no-files-found: error
          retention-days: 90

      - name: Delete every temporary publication branch after proof is green
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'reliability/semantic-adjudication-zero-loss-20260828-probe'
            'reliability/semantic-adjudication-zero-loss-20260828-pr-ready'
            'reliability/semantic-adjudication-zero-loss-20260828-final'
            'reliability/semantic-adjudication-zero-loss-20260828-open-pr'
            'reliability/semantic-adjudication-zero-loss-20260828-pr'
            'connector-file-upload-probe-20260828'
            'reliability/semantic-adjudication-zero-loss-20260828'
            'reliability/semantic-adjudication-proof-recovery-20260828'
          )
          for branch in "${branches[@]}"; do
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "heads/$branch")
            curl --silent --show-error -o /dev/null -w '%{http_code}\n' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GH_API/repos/$GITHUB_REPOSITORY/git/refs/$encoded" || true
          done
