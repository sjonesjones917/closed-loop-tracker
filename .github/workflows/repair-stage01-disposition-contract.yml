name: One-time Stage 01 disposition contract repair

on:
  push:
    branches:
      - fix/stage01-disposition-contract-20260903b

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/stage01-disposition-contract-20260903b
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact Stage 01 correction
        run: python .github/repair-stage01.py
      - name: Focused Stage 01 proofs
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node verify-stage01-disposition-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-one-time-intent-intake.mjs
      - name: Capture all-stage prompt audit
        run: |
          set +e
          node verify-stage-prompts-complete.mjs > stage-prompt-failure.log 2>&1
          status=$?
          cat stage-prompt-failure.log
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add stage-prompt-failure.log
            git commit -m "Record Stage 01 repair prompt-audit failure"
            git push origin HEAD:fix/stage01-disposition-contract-20260903b
            exit "$status"
          fi
      - name: Full affected verification
        run: |
          node verify-full-cycle.mjs
          node verify.mjs
      - name: Commit repair and remove one-time scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-stage01-disposition-contract.yml
          git rm .github/repair-stage01.py
          git rm -f stage-prompt-failure.log || true
          git add workflow-engine.js prompt-engine.js .github/workflows/pages.yml verify-*.mjs
          git commit -m "Close Stage 01 raw-unit disposition contract"
          git push origin HEAD:fix/stage01-disposition-contract-20260903b
