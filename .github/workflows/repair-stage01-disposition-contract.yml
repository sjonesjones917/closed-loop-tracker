name: One-time Stage 01 disposition contract repair

on:
  push:
    branches: [codex/stage01-disposition-contract-20260903]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/stage01-disposition-contract-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair and prove Stage 01 disposition contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('workflow-engine.js','utf8');
          const legacy="const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['incorporated into the job definition','retained as context','unresolved human-only','later-resolvable','inapplicable with reason']);";
          const current="const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED']);";
          if(!s.includes(legacy)) throw new Error('Stage 01 disposition declaration changed; inspect current main.');
          s=s.replace(legacy,current);
          const oldBlock="const disposition=String(unit?.disposition||'').trim().toLowerCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);if(disposition==='inapplicable with reason'&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires an inapplicability reason.`);\n    const statements=safe(unit?.extractedStatements);if(disposition!=='inapplicable with reason'&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;";
          const newBlock="const disposition=String(unit?.disposition||'').trim().toUpperCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);const noStatementDisposition=['NO_PROJECT_RELEVANT_INFORMATION','INACCESSIBLE_OR_BLOCKED'].includes(disposition);if(noStatementDisposition&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires a reason for ${disposition}.`);if(disposition==='INACCESSIBLE_OR_BLOCKED')reasons.push(`Stage 01 intake unit ${id} is inaccessible or blocked and cannot satisfy Stage 01 completion.`);\n    const statements=safe(unit?.extractedStatements);if(!noStatementDisposition&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;";
          if(!s.includes(oldBlock)) throw new Error('Stage 01 evaluator changed; inspect current main.');
          s=s.replace(oldBlock,newBlock);
          const oldAccount="if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&(disposition==='inapplicable with reason'?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);";
          const newAccount="if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&(noStatementDisposition?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);";
          if(!s.includes(oldAccount)) throw new Error('Stage 01 accounting closure changed; inspect current main.');
          s=s.replace(oldAccount,newAccount);
          const exportBefore="version:'closed-loop-workflow-engine/1',STAGE_STATES,FORMAL_STATES,ALL_COLLECTIONS,ACTION_TYPES,";
          if(!s.includes(exportBefore)) throw new Error('Workflow-engine export changed; inspect current main.');
          s=s.replace(exportBefore,"version:'closed-loop-workflow-engine/1',STAGE_STATES,FORMAL_STATES,ALL_COLLECTIONS,ACTION_TYPES,INTAKE_ACCOUNTING_DISPOSITIONS,");
          fs.writeFileSync('workflow-engine.js',s);

          let p=fs.readFileSync('prompt-engine.js','utf8');
          const anchor='Classify every APPLICATION INTAKE MANIFEST unit exactly once.';
          const contract=' Classify each unit using exactly one of these closed disposition values: EXTRACTED_RELEVANT_INFORMATION, RETAINED_AS_CONTEXT, NO_PROJECT_RELEVANT_INFORMATION, UNRESOLVED_HUMAN_AUTHORITY, LATER_RESOLVABLE, or INACCESSIBLE_OR_BLOCKED. INACCESSIBLE_OR_BLOCKED means the required semantic content could not be inspected; report the exact blocker and do not claim Stage 01 completion.';
          if(!p.includes(anchor)) throw new Error('Stage 01 prompt anchor changed; inspect current main.');
          p=p.replace(anchor,anchor+contract);
          fs.writeFileSync('prompt-engine.js',p);
          NODE
          cat > verify-stage01-disposition-contract.mjs <<'NODE'
          import fs from 'node:fs';import vm from 'node:vm';import assert from 'node:assert/strict';
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js']) vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const e=globalThis.closedLoopWorkflowEngine,c=globalThis.closedLoopCore,p=globalThis.closedLoopPromptEngine;
          const exact=['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED'];assert.deepEqual([...e.INTAKE_ACCOUNTING_DISPOSITIONS],exact);
          const x=c.createBlankState('JOB-STAGE01-DISPOSITIONS');Object.assign(x.job,{JOB_TITLE:'Stage 01 disposition contract',JOB_OWNER:'Operator',EXACT_USER_OBJECTIVE_VERBATIM:'Account every raw input unit.',EXPLICIT_USER_REQUIREMENTS:'Inaccessible required material must block completion.',SUPPLIED_MATERIALS_INVENTORY:'NONE',CURRENT_INPUT_VERSION:'INPUT-v001'});x.projectData.userEntered={constraint:'Do not omit raw input.'};e.ensureShape(x);const m=e.intakeCoverageManifest(x);
          const base={schema:'closed-loop-stage01-capture/1',inputVersion:m.inputVersion,manifestSha256:m.manifestSha256,units:m.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'RETAINED_AS_CONTEXT',reason:'Retained.',extractedStatements:[{statementKey:`S${i}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT'}]}))};assert.equal(e.evaluateIntakeAccounting(x,{capture:JSON.stringify(base)}).complete,true);
          const n=structuredClone(base);n.units[0]={...n.units[0],disposition:'NO_PROJECT_RELEVANT_INFORMATION',reason:'No project-relevant information.',extractedStatements:[]};assert.equal(e.evaluateIntakeAccounting(x,{capture:JSON.stringify(n)}).complete,true);
          const b=structuredClone(base);b.units[0]={...b.units[0],disposition:'INACCESSIBLE_OR_BLOCKED',reason:'Cannot inspect semantic content.',extractedStatements:[]};const br=e.evaluateIntakeAccounting(x,{capture:JSON.stringify(b)});assert.equal(br.complete,false);assert(br.reasons.some(r=>/inaccessible or blocked/i.test(r)));
          const l=structuredClone(base);l.units[0].disposition='retained as context';assert.equal(e.evaluateIntakeAccounting(x,{capture:JSON.stringify(l)}).complete,false);
          const prompt=p.buildPromptRecord(1,x,{operation:'COMPLETE'}).prompt;for(const v of exact)assert(prompt.includes(v));assert(/INACCESSIBLE_OR_BLOCKED means .*do not claim Stage 01 completion/i.test(prompt));console.log(JSON.stringify({stage01DispositionContract:'PASS'}));
          NODE
          node verify-stage01-disposition-contract.mjs
          node --check workflow-engine.js
          node --check prompt-engine.js
      - name: Commit runtime repair and regression
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js verify-stage01-disposition-contract.mjs
          git diff --cached --check
          git commit -m 'Conform Stage 01 accounting dispositions'
          git push origin HEAD:codex/stage01-disposition-contract-20260903
