name: Materialize universal prompt context correction
on:
  push:
    branches: [fix/universal-prompt-context-dedup-20260830]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prompt authority and one-time intent corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: expected source text not found')
              return text.replace(old, new, 1)

          prompt=Path('prompt-engine.js')
          s=prompt.read_text()
          s=replace_once(s,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/49';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/50';",'prompt engine version')
          anchor="function humanInputBlock(job){const names=Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>name);return names.length?names.map(name=>`${name}:\\n${show(job?.[name])}`).join('\\n\\n'):'NONE';}\n"
          s=replace_once(s,anchor,anchor+"function directHumanInputPromptBlock(stage,job){return Number(stage)===1?`AUTHORIZED USER JOB INPUT\\n${humanInputBlock(job)}\\n\\n`:'';}\n",'one-time human input helper')
          s=replace_once(s,"return {currentUserJobInput:humanJobInput,originalUserEntered:state?.projectData?.userEntered||{},stage01AcceptedCapture:parseCapturedInputSet(state),","return {currentUserJobInput:humanJobInput,stage01AcceptedCapture:parseCapturedInputSet(state),",'stage4 duplicate original input')
          s=replace_once(s,"  const humanAuthority=Object.fromEntries(humanFieldNames.filter(name=>!isolatedReviewer||reviewerHumanFields.has(name)).map(name=>[name,job?.[name]??null]));\n","  const carryForwardHumanFields=new Set(['JOB_TITLE','JOB_OWNER','REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','AVAILABLE_TOOLS','PROHIBITED_ACTIONS']);\n  const humanAuthority=Object.fromEntries(humanFieldNames.filter(name=>isolatedReviewer?reviewerHumanFields.has(name):(Number(stage)<=3?false:carryForwardHumanFields.has(name))).map(name=>[name,job?.[name]??null]));\n",'authority projection')
          old_stage1="  const acceptedStage01=isolatedReviewer?{objectiveVerbatim:job.EXACT_USER_OBJECTIVE_VERBATIM??null,detailWithheld:true,withheldReason:'Independent verification receives only the current operation-authorized projection. The complete Stage 01 intake remains canonical and reusable but is not embedded when it is unnecessary to the proposition under review.'}:{capture:parseCapturedInputSet(state),agentData:stageOne.agentData||stageOne.acceptedData||{},humanData:stageOne.humanData||{},derivedData:workflow.deriveStageData(state,1)};\n"
          new_stage1="  const fullStage01=Number(stage)<=3&&!isolatedReviewer;\n  const acceptedStage01=isolatedReviewer?{objectiveVerbatim:job.EXACT_USER_OBJECTIVE_VERBATIM??null,detailWithheld:true,withheldReason:'Independent verification receives only the current operation-authorized projection. The complete Stage 01 intake remains canonical and reusable but is not embedded when it is unnecessary to the proposition under review.'}:fullStage01?{capture:parseCapturedInputSet(state),agentData:stageOne.agentData||stageOne.acceptedData||{},humanData:stageOne.humanData||{},derivedData:workflow.deriveStageData(state,1)}:{objective:job.EXACT_DELIVERABLE_REQUESTED||job.EXACT_USER_OBJECTIVE_VERBATIM||null,inputVersion:job.CURRENT_INPUT_VERSION||null,capturePreservedCanonically:true,acceptedChangeIds:safe(stageOne.acceptedDataChangeIds)};\n"
          s=replace_once(s,old_stage1,new_stage1,'stage1 carry-forward projection')
          old_context="function contextFor(stage,state,operation,scope={}){const parts=[];if(stage>1)parts.push(`PROJECT AUTHORITY BASIS — HUMAN INTENT + CURRENT EXTERNAL REQUIREMENTS\\n${show(projectAuthorityBasis(state,stage,operation,scope))}`);if(stage===3)parts.push(`STAGE 01 ACCEPTED HUMAN-AUTHORITY CONTEXT — USE FOR SOURCE RELEVANCE AND APPLICABILITY\\n${show({acceptedCapture:parseCapturedInputSet(state),acceptedDefinition:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:workflow.deriveStageData(state,1)}})}`);if(stage===4)parts.push(`EXHAUSTED STAGE 01 + STAGE 03 INPUTS — USE EVERY MATERIAL DETAIL\\n${show(stage4ExhaustedInputs(state))}`);"
          new_context="function contextFor(stage,state,operation,scope={}){const parts=[];if(stage>1&&stage!==4)parts.push(`PROJECT AUTHORITY BASIS — HUMAN INTENT + CURRENT EXTERNAL REQUIREMENTS\\n${show(projectAuthorityBasis(state,stage,operation,scope))}`);if(stage===4)parts.push(`EXHAUSTED STAGE 01 + STAGE 03 INPUTS — USE EVERY MATERIAL DETAIL\\n${show(stage4ExhaustedInputs(state))}`);"
          s=replace_once(s,old_context,new_context,'stage-specific context deduplication')
          s=replace_once(s,"AUTHORIZED USER JOB INPUT\\n${humanInputBlock(job)}\\n\\nCURRENT AGENT-NORMALIZED DELIVERABLE\\n","${directHumanInputPromptBlock(stage,job)}CURRENT AGENT-NORMALIZED DELIVERABLE\\n",'one-time raw human input')
          prompt.write_text(s)

          index=Path('index.html')
          h=index.read_text()
          if 'runtime-20260830-live-operator-55' not in h:
              raise SystemExit('index build identity not found')
          index.write_text(h.replace('runtime-20260830-live-operator-55','runtime-20260830-live-operator-56'))

          app=Path('app-core.js')
          a=app.read_text()
          if 'runtime-20260830-live-operator-55' not in a:
              raise SystemExit('app build identity not found')
          app.write_text(a.replace('runtime-20260830-live-operator-55','runtime-20260830-live-operator-56'))

          pages=Path('.github/workflows/pages.yml')
          y=pages.read_text()
          y=replace_once(y,' TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .nojekyll _site/',' TEST_PROJECT.json .nojekyll _site/','deployment prompt authority cleanup')
          pages.write_text(y)

          Path('AUTHORIZED_OPERATION_01.txt').unlink(missing_ok=True)
          Path('.github/workflows/materialize-universal-prompt-context-dedup.yml').unlink()
          PY
          git add -A
          git commit -m 'Deduplicate universal prompt context and enforce single prompt authority'
          git push origin HEAD
