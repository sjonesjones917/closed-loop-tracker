name: Repair Project actions accessibility state

on:
  push:
    branches: [fix/zero-loss-controlled-20260831]

permissions:
  contents: write

concurrency:
  group: repair-project-actions-toggle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the minimal application-owned toggle correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app-core.js')
          text = path.read_text(encoding='utf-8')
          marker = "function setProjectActionsOpen(open){"
          anchor = "function wire(){if($('#next-freeze-candidate'))"
          replacement = "function setProjectActionsOpen(open){const menu=$('.project-action-menu'),toggle=$('#project-actions-toggle'),expanded=Boolean(open);if(!menu||!toggle)return;menu.open=expanded;toggle.setAttribute('aria-expanded',String(expanded));}\nfunction wire(){const projectActionsToggle=$('#project-actions-toggle');if(projectActionsToggle){const menu=projectActionsToggle.closest('details');projectActionsToggle.onclick=event=>{event.preventDefault();setProjectActionsOpen(!Boolean(menu?.open));};if(menu)menu.ontoggle=()=>projectActionsToggle.setAttribute('aria-expanded',String(Boolean(menu.open)));}if($('#next-freeze-candidate'))"
          if marker not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'Expected one Project actions wiring boundary; found {text.count(anchor)}')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Prove the corrected lifecycle boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check app-core.js
          node verify-project-lifecycle.mjs
          node verify.mjs
      - name: Commit the accepted correction and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-project-actions-toggle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js .github/workflows/repair-project-actions-toggle.yml
          git diff --cached --check
          git commit -m "Synchronize Project actions accessibility state"
          git push origin HEAD:fix/zero-loss-controlled-20260831
