          actions=r'''async function renameCurrentProject(){const jobId=String(current?.job?.JOB_ID||''),name=$('#project-display-name')?.value.trim();if(!name){alert('Enter a display name.');return;}projectUi[jobId]={...projectUiEntry(jobId),displayName:name};await saveProjectUi();announce('project display name saved; canonical job identity unchanged');render();}
async function duplicateCurrentProject(){const source=current,p=ensureState(core.createBlankState(createUniqueJobId()));p.job.DATE_OPENED=new Date().toISOString();for(const [key] of jobFields)if(key!=='JOB_TITLE')p.job[key]=clone(source.job[key]);p.job.JOB_TITLE=source.job.JOB_TITLE?`${source.job.JOB_TITLE} — copy`:'Project copy';p.projectData.userEntered=clone(source.projectData.userEntered||{});p.activeView='Project';engine.createNewJobReset(p);await persistAll([p,...projects]);current=projects.find(x=>x.job?.JOB_ID===p.job.JOB_ID)||p;projectUi[p.job.JOB_ID]={displayName:`${projectDisplayName(source)} — copy`};await saveProjectUi();await projectStore.metaPut('selectedProject',p.job.JOB_ID);await refreshProjectStorage();announce('new project created from reusable human input; workflow history and artifact bytes were not copied');render();}
async function archiveCurrentProject(){if(current?.isRetainedTestProject){alert('The built-in retained reference project cannot be archived.');return;}const jobId=current.job.JOB_ID;projectUi[jobId]={...projectUiEntry(jobId),archivedAt:new Date().toISOString()};await saveProjectUi();let replacement=projects.find(p=>p!==current&&!projectIsArchived(p));if(!replacement){const p=ensureState(core.createBlankState(createUniqueJobId()));p.job.DATE_OPENED=new Date().toISOString();engine.createNewJobReset(p);await persistAll([p,...projects]);replacement=projects.find(x=>x.job?.JOB_ID===p.job.JOB_ID)||p;}current=replacement;await projectStore.metaPut('selectedProject',current.job.JOB_ID);await refreshProjectStorage();announce('project archived; canonical project content unchanged');render();}
async function restoreArchivedProject(jobId){const id=String(jobId||''),project=projects.find(p=>p.job?.JOB_ID===id);if(!project)return;const ui={...projectUiEntry(id)};delete ui.archivedAt;projectUi[id]=ui;await saveProjectUi();current=project;await projectStore.metaPut('selectedProject',id);await refreshProjectStorage();announce('project restored from archive');render();}
async function downloadProjectPackage(kind='export'){const blob=await projectStore.exportPackage(current.job.JOB_ID),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${current.job.JOB_ID||'project'}${kind==='backup'?'.backup':''}.closed-loop.json.gz`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0);globalThis.closedLoopStorageHealth=await projectStore.storageHealth();announce(kind==='backup'?'complete project backup exported':'complete project package exported');render();}
async function verifyStoredFilesNow(){try{await refreshProjectStorage({verify:true});announce(projectStorage.integrity==='VERIFIED'?'stored artifact bytes verified':'stored artifact mismatch detected');render();if(projectStorage.mismatches.length)alert(`Stored artifact byte verification failed for: ${projectStorage.mismatches.join(', ')}`);}catch(error){announce('stored artifact verification failed');alert(error.message||error);}}
async function discardCurrentAttempt(){const p=pendingProposal(),jobId=current.job.JOB_ID;if(p){const ui=projectUiEntry(jobId),ids=new Set(safe(ui.dismissedProposalIds));ids.add(p.proposalId);projectUi[jobId]={...ui,dismissedProposalIds:[...ids]};await saveProjectUi();}const node=$('#stage-output');if(node)node.value='';announce('attempt discarded; canonical state changed: NO');render();}
function clearUnsavedResponse(){const node=$('#stage-output');if(node){node.value='';node.focus();}announce('unsaved response cleared; canonical state changed: NO');}
async function prepareReplacementAttempt(){try{const node=$('#stage-output');if(node)node.value='';await savePromptRecord(current.activeStage);announce('replacement instruction saved; use the new controlling prompt');render();queueMicrotask(()=>$('#generated-prompt')?.focus());}catch(error){alert(error.message||error);}}
async function reopenHumanBlocker(blockerId){const reason=$('#blocker-reopen-reason')?.value.trim(),operatorLabel=$('#operator-label')?.value.trim()||'HUMAN_OPERATOR';if(!reason){alert('Explain why the blocker must be reopened.');$('#blocker-reopen-reason')?.focus();return;}try{const next=clone(current);engine.createHumanBlocker(next,{stage:current.activeStage,reason:`Reopened ${blockerId}: ${reason}`,operatorLabel});await persistReplacement(next);announce('new blocker created; prior resolved blocker preserved');render();}catch(error){alert(error.message||error);}}
