          controls=r'''function controls(d,locked){const n=d.number,allowFresh=schema.STAGE_CONTRACTS[n].supportCollections.includes('freshContexts'),runBatch=n===11||([17,19].includes(n)&&selectedOperation(n)==='EXECUTE_RUN'),humanBlockers=engine.openBlockers(current,n).filter(x=>x.source==='HUMAN_DECISION'),resolvedHumanBlockers=engine.records(current,'blockers',{active:false}).filter(x=>x.source==='HUMAN_DECISION'&&['RESOLVED','CLOSED'].includes(String(engine.recordValue(x,'STATUS')||'').toUpperCase()));return `<details class="record-card"><summary>Supporting records<span>Contextual</span></summary><div class="record-body"><p class="section-intro">Use authority-specific controls only. Canonical IDs, lifecycle state, timestamps, and hashes are application-assigned.</p><div class="field"><label>Blocker reason</label><textarea id="blocker-reason"></textarea></div><div class="button-row"><button id="add-blocker"${locked?' disabled':''}>Create blocker</button></div>${humanBlockers.length?`<div class="field"><label>Resolution evidence for human-created blocker</label><textarea id="blocker-resolution-evidence"></textarea></div>${humanBlockers.map(b=>`<div class="button-row"><button data-resolve-blocker="${esc(engine.recordId(b,'blockers'))}">Resolve ${esc(engine.recordId(b,'blockers'))}</button></div>`).join('')}`:''}${resolvedHumanBlockers.length?`<details class="record-card"><summary>Resolved human blockers<span>${resolvedHumanBlockers.length}</span></summary><div class="record-body"><div class="field"><label>Why this blocker must be reopened</label><textarea id="blocker-reopen-reason"></textarea><span class="help">Reopening is append-only: the closed blocker remains preserved and a new blocker receives a new application ID.</span></div>${resolvedHumanBlockers.map(b=>`<div class="button-row"><button data-reopen-blocker="${esc(engine.recordId(b,'blockers'))}">Reopen ${esc(engine.recordId(b,'blockers'))} as new blocker</button></div>`).join('')}</div></details>`:''}${allowFresh?`<div class="field"><label>External fresh-context identifier</label><input id="fresh-context-id"><span class="help">Fills the next reserved context slot for the current iteration when one exists.</span></div><div class="button-row"><button id="add-fresh-context"${locked?' disabled':''}>Register fresh context</button></div>`:''}${runBatch?`<div class="button-row"><button id="reserve-run-batch"${locked?' disabled':''}>Reserve ten run/context slots</button></div>`:''}<div class="field"><label>Operator label</label><input id="operator-label" value="HUMAN_OPERATOR"><span class="help">Identity assurance: SELF_ASSERTED</span></div></div></details>`;}
