name: Apply and prove compact project lifecycle controls
on:
  push:
    branches: [reliability/zero-loss-current-main-20260828]
permissions:
  contents: write
jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: reliability/zero-loss-current-main-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal lifecycle UI patch
        run: python3 apply-lifecycle-patch.py
      - name: Refresh exact runtime identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, re
          files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''.join(f'{f}:{subprocess.check_output(["git","hash-object",f],text=True).strip()}\n' for f in files)
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p=Path('index.html'); s=p.read_text(); s,n=re.subn(r'runtime-[0-9a-f]{16}',token,s)
          if n != 8: raise SystemExit(f'expected 8 runtime tokens, replaced {n}')
          p.write_text(s)
          print(token)
          PY
      - name: Deterministic proofs
        run: |
          node --check app-core.js
          node --check verify-project-lifecycle.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-semantic-invariant.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-lifecycle-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Publish proven lifecycle patch and remove temporary patch files
        run: |
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/lifecycle-ui-patch.yml apply-lifecycle-patch.py
          git add app-core.js index.html verify-browser-extra.mjs verify-project-lifecycle.mjs .github/workflows/pages.yml
          git commit -m 'Add compact rigorous project lifecycle controls'
          git push origin HEAD:reliability/zero-loss-current-main-20260828
