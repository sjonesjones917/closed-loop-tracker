name: Apply and prove compact project lifecycle controls
on:
  push:
    branches: [reliability/zero-loss-current-main-20260828]
permissions:
  contents: write
jobs:
  patch-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: reliability/zero-loss-current-main-20260828}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimal lifecycle UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old,new,1)

          p=Path('app-core.js'); s=p.read_text()
          s=must_replace(s,
            "let core,schema,engine,ingestion,projectStore,projects=[],current;",
            "let core,schema,engine,ingestion,projectStore,projects=[],current,projectUi={},projectStorage={artifactCount:0,byteSize:0,integrity:'NOT CHECKED',lastVerifiedAt:null,mismatches:[]};",
            'app state')

          completion="function completion(p=current){return Object.values(p?.stages||{}).filter(s=>s.status==='COMPLETE').length;}\n"
          helpers=r'''function completion(p=current){return Object.values(p?.stages||{}).filter(s=>s.status==='COMPLETE').length;}
const projectUiEntry=jobId=>projectUi[String(jobId||'')]||{};
const projectDisplayName=project=>projectUiEntry(project?.job?.JOB_ID).displayName||project?.job?.JOB_TITLE||project?.job?.JOB_ID||'Untitled project';
const projectIsArchived=project=>Boolean(projectUiEntry(project?.job?.JOB_ID).archivedAt);
async function saveProjectUi(){await projectStore.metaPut('projectUi',projectUi);}
async function refreshProjectStorage({verify=false}={}){
  const jobId=String(current?.job?.JOB_ID||'');if(!jobId)return projectStorage;
  const artifacts=await projectStore.listArtifacts(jobId),mismatches=[];
  if(verify)for(const row of artifacts){const bytes=await row.blob.arrayBuffer(),sha256=await globalThis.closedLoopHash.sha256Bytes(bytes);if(Number(row.byteSize)!==bytes.byteLength||String(row.sha256)!==sha256)mismatches.push(row.artifactId);}
  const prior=projectUiEntry(jobId),lastVerifiedAt=verify?new Date().toISOString():(prior.lastIntegrityVerification||null);
  projectStorage={artifactCount:artifacts.length,byteSize:artifacts.reduce((sum,row)=>sum+Number(row.byteSize||0),0),integrity:verify?(mismatches.length?'FAILED':'VERIFIED'):(lastVerifiedAt?'VERIFIED':'NOT CHECKED'),lastVerifiedAt,mismatches};
  if(verify){projectUi[jobId]={...prior,lastIntegrityVerification:lastVerifiedAt,lastIntegrityStatus:projectStorage.integrity};await saveProjectUi();}
  return projectStorage;
}
'''
          s=must_replace(s,completion,helpers,'project ui helpers')

          new_header=r'''function header(){const done=completion(),selectable=projects.filter(project=>!projectIsArchived(project));if(!selectable.includes(current)&&current)selectable.unshift(current);$('#current-project-summary').textContent=`${current.job.JOB_ID} · ${projectDisplayName(current)}`;$('#progress-label').textContent=`${done}/30 complete`;$('#progress-bar').style.width=`${done/30*100}%`;$('#project-picker').innerHTML=selectable.map(p=>{const i=projects.indexOf(p);return `<option value="${i}"${p===current?' selected':''}>${esc(projectDisplayName(p))}</option>`;}).join('');$('#view-tabs').innerHTML=views.map(v=>`<button data-view="${v}" aria-selected="${current.activeView===v}">${v}</button>`).join('');}
function stageList'''
          s,n=re.subn(r"function header\(\)\{.*?\}\nfunction stageList",new_header,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('header patch failed')

          project_management=r'''function projectManagementMarkup(){
  const jobId=String(current?.job?.JOB_ID||'').trim();if(!jobId)return '';
  const ui=projectUiEntry(jobId),archived=projects.filter(project=>projectIsArchived(project)),lastEvent=safe(current.projectData.history).at(-1),health=globalThis.closedLoopStorageHealth||{},lastBackup=health.lastVerifiedExport?.jobId===jobId?health.lastVerifiedExport:null;
  const properties={DISPLAY_NAME:projectDisplayName(current),JOB_ID:jobId,CURRENT_STAGE:current.job.CURRENT_STAGE,CURRENT_STATE:current.job.CURRENT_STATE,PROJECT_REVISION:current.revision,CURRENT_INPUT_VERSION:current.job.CURRENT_INPUT_VERSION,CURRENT_SOURCE_SET_VERSION:current.job.CURRENT_SOURCE_SET_VERSION,CURRENT_REQUIREMENTS_VERSION:current.job.CURRENT_REQUIREMENTS_VERSION,CURRENT_TEST_SUITE_VERSION:current.job.CURRENT_TEST_SUITE_VERSION,CURRENT_INSTRUCTION_VERSION:current.job.CURRENT_INSTRUCTION_VERSION,CURRENT_ITERATION:current.job.CURRENT_ITERATION,CURRENT_CANDIDATE_ID:current.job.CURRENT_CANDIDATE_ID||'NONE',CURRENT_BASELINE_ID:current.job.CURRENT_BASELINE_ID,CURRENT_PRODUCT_ID:current.job.CURRENT_PRODUCT_ID,CURRENT_BLOCKERS:current.job.CURRENT_BLOCKERS,LAST_CANONICAL_EVENT:lastEvent?.deviceTimestamp||lastEvent?.createdAt||'NONE',LAST_COMPLETE_BACKUP:lastBackup?.at||'NONE'};
  const archiveRows=archived.map(project=>`<div class="button-row project-archive-row"><span>${esc(projectDisplayName(project))} · ${esc(project.job.JOB_ID)}</span><button type="button" data-restore-project="${esc(project.job.JOB_ID)}">Restore</button></div>`).join('');
  const danger=current.isRetainedTestProject?`<div class="notice">The built-in retained reference project cannot be archived or permanently deleted.</div>`:`<details class="record-card" id="project-danger-zone"><summary>Danger zone<span>Hidden</span></summary><div class="record-body"><div class="notice danger"><strong>Permanent deletion.</strong><br>This removes this project and every artifact byte stored for it from this browser. Export a complete backup first if you may need it later.</div><div class="field"><label for="delete-project-confirmation">Type the exact JOB_ID to enable deletion</label><input id="delete-project-confirmation" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="${esc(jobId)}" aria-describedby="delete-project-confirmation-help"><span class="help" id="delete-project-confirmation-help">Required: ${esc(jobId)}</span></div><div class="button-row"><button class="danger" id="delete-project" type="button" disabled>Permanently delete project</button></div></div></details>`;
  return `<details class="record-card" id="project-management"><summary>Project management<span>Options</span></summary><div class="record-body"><p class="section-intro">Routine workflow stays separate from project lifecycle actions. Display-name, archive, and dismissed-attempt preferences are browser-local management metadata and do not rewrite controlled job identity or accepted evidence.</p><div class="grid-2"><div class="field"><label for="project-display-name">Display name</label><input id="project-display-name" value="${esc(projectDisplayName(current))}"><span class="help">Changes only the human-facing project label. JOB_ID and controlled substantive content remain unchanged.</span></div><div class="field"><label>Safe copy</label><div class="button-row"><button id="duplicate-project" type="button">Start from copy</button></div><span class="help">Copies reusable human-owned job input into a new JOB_ID. Accepted history, evidence, runs, releases, contexts, and stored artifact bytes are not copied as current truth.</span></div></div><div class="button-row"><button class="primary" id="rename-project" type="button">Save display name</button><button id="backup-project" type="button">Create backup now</button>${current.isRetainedTestProject?'':`<button id="archive-project" type="button">Archive project</button>`}</div>${details('Project properties',properties)}<details class="record-card"><summary>Storage & integrity<span>${projectStorage.artifactCount} files</span></summary><div class="record-body"><div class="record-rows">${field('Stored artifact Blob count',projectStorage.artifactCount)}${field('Stored artifact bytes',projectStorage.byteSize)}${field('Last explicit byte verification',projectStorage.lastVerifiedAt||'Not run')}${field('Integrity status',projectStorage.integrity)}${field('Browser storage persistence',health.persistent?'PERSISTENT':'NOT PERSISTENT')}${field('Browser storage usage',health.usage??'UNKNOWN')}${field('Browser storage quota',health.quota??'UNKNOWN')}</div><div class="button-row"><button id="verify-stored-files" type="button">Verify stored files now</button></div>${projectStorage.mismatches.length?`<div class="notice danger">Stored byte mismatch: ${esc(projectStorage.mismatches.join(', '))}</div>`:'<div class="notice">Verification re-reads stored Blob bytes and recomputes SHA-256. It does not mark tests passed or alter release truth.</div>'}</div></details>${archived.length?`<details class="record-card"><summary>Archived projects<span>${archived.length}</span></summary><div class="record-body">${archiveRows}</div></details>`:''}${danger}</div></details>`;
}
