            'pending proposal filter')
          s=s.replace("function proposalMarkup(n){const p=safe(current.projectData.responseProposals).filter(x=>x.status==='PENDING_OPERATOR_REVIEW'&&operatorLaneMatches(x,n)).at(-1);if(!p)return '';","function proposalMarkup(n){const p=pendingProposal();if(!p)return '';",1)

          accepted_old="${acceptedLaneChanges(n).length&&!current.isRetainedTestProject?`<details class=\"record-card\"><summary>Refine accepted result<span>Controlled</span></summary><div class=\"record-body\"><div class=\"field\"><label>Why refinement is required</label><textarea id=\"accepted-refinement-reason\"></textarea></div><button id=\"refine-accepted-response\">Invalidate accepted result and request refinement</button></div></details>`:''}</div>`;}"
          accepted_new="${acceptedLaneChanges(n).length&&!current.isRetainedTestProject?`<details class=\"record-card\"><summary>Refine accepted result<span>Controlled</span></summary><div class=\"record-body\"><div class=\"field\"><label>Why refinement is required</label><textarea id=\"accepted-refinement-reason\"></textarea></div><div class=\"button-row\"><button id=\"refine-accepted-response\">Invalidate accepted response / request correction</button><button type=\"button\" data-jump-provenance>View exact evidence / provenance</button></div></div></details>`:''}</div>`;}"
          s=must_replace(s,accepted_old,accepted_new,'accepted provenance action')
          s=s.replace('<div class="panel"><h2 class="section-title">Provenance navigation</h2>','<div class="panel" id="provenance-navigation" tabindex="-1"><h2 class="section-title">Provenance navigation</h2>',1)

