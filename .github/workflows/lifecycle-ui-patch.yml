          h=must_replace(h,css_anchor,css_add,'project action menu css')
          old_header='<div class="header-actions"><button class="primary" id="new-project" type="button">New project</button><button id="export-project" type="button">Export</button><button id="import-project" type="button">Import</button><input id="import-file" type="file" hidden accept=".json,.gz,.closed-loop.json.gz,application/json,application/gzip,application/x-gzip"></div>'
          new_header='<div class="header-actions"><button class="primary" id="new-project" type="button">New project</button><details class="project-action-menu"><summary>Project actions</summary><div class="project-action-popover"><button id="header-backup-project" type="button">Create complete backup</button><button id="export-project" type="button">Export complete project</button><button id="import-project" type="button">Import project package</button></div></details><input id="import-file" type="file" hidden accept=".json,.gz,.closed-loop.json.gz,application/json,application/gzip,application/x-gzip"></div>'
          h=must_replace(h,old_header,new_header,'compact header actions')
          p.write_text(h)

          # Browser acceptance now asserts the lifecycle controls exist and destructive controls stay concealed by default.
          p=Path('verify-browser-extra.mjs'); b=p.read_text()
          browser_anchor="  await waitExpr(cdp,`document.querySelector('#project-picker')?.options.length>=1`,20000);\n"
          browser_add=browser_anchor+'''\n  console.log('extra:project-lifecycle-ui');\n  await click(cdp,'[data-view="Project"]');\n  const lifecycleUi=await evalValue(cdp,`(()=>{const management=document.querySelector('#project-management'),danger=document.querySelector('#project-danger-zone');return {management:Boolean(management),managementOpen:Boolean(management?.open),danger:Boolean(danger),dangerOpen:Boolean(danger?.open),deleteVisible:Boolean(document.querySelector('#delete-project')?.offsetParent),headerMenu:Boolean(document.querySelector('.project-action-menu')),text:management?.textContent||''};})()`);\n  assert(lifecycleUi.management&&!lifecycleUi.managementOpen,'Project lifecycle controls must be present but collapsed by default.');\n  assert(lifecycleUi.headerMenu,'Compact Project actions menu is missing.');\n  if(lifecycleUi.danger)assert(!lifecycleUi.dangerOpen&&!lifecycleUi.deleteVisible,'Permanent deletion must remain concealed until the operator deliberately opens the danger zone.');\n  assert(lifecycleUi.text.includes('Start from copy')&&lifecycleUi.text.includes('Create backup now')&&lifecycleUi.text.includes('Verify stored files now'),'Project lifecycle options are incomplete.');\n'''
          b=must_replace(b,browser_anchor,browser_add,'browser lifecycle acceptance')
          p.write_text(b)

          Path('verify-project-lifecycle.mjs').write_text(r'''import fs from 'node:fs';
const assert=(value,message)=>{if(!value)throw new Error(message);};
const app=fs.readFileSync('app-core.js','utf8'),store=fs.readFileSync('project-store.js','utf8'),html=fs.readFileSync('index.html','utf8');
for(const token of ['renameCurrentProject','duplicateCurrentProject','archiveCurrentProject','restoreArchivedProject','downloadProjectPackage','verifyStoredFilesNow','discardCurrentAttempt','prepareReplacementAttempt','reopenHumanBlocker'])assert(app.includes(token),`Missing lifecycle action ${token}.`);
for(const token of ['project-management','project-danger-zone','Start from copy','Create backup now','Verify stored files now','View exact evidence / provenance','Clear unsaved response','Discard pending attempt','Prepare replacement attempt'])assert(app.includes(token),`Missing lifecycle UI ${token}.`);
assert(app.includes("dismissedProposalIds")&&app.includes('canonical state changed: NO'),'Discarded attempts must remain non-canonical UI lifecycle state.');
assert(app.includes("engine.createHumanBlocker(next,{stage:current.activeStage,reason:`Reopened ${blockerId}: ${reason}`"),'Reopen must append a new blocker instead of rewriting the resolved record.');
assert(store.includes("openTransaction([PROJECTS,ARTIFACTS,META],'readwrite')")&&store.includes('during-project-delete')&&store.includes("String(artifact.jobId)===jobId"),'Project deletion must remain one transaction over project/meta and owned artifact Blob rows.');
assert(html.includes('project-action-menu')&&html.includes('Project actions'),'Routine header actions must remain compact.');
assert(!html.includes('Force Complete Stage')&&!html.includes('Override Release Gate')&&!html.includes('Mark Test Passed'),'Unsafe override controls must not exist.');
console.log(JSON.stringify({projectLifecycleControls:true,compactHeader:true,dangerHiddenByDefault:true,transactionalDeleteRetained:true,unsafeOverrides:0},null,2));
''')

          # Make the focused lifecycle proof permanent in the single normal Pages workflow.
          p=Path('.github/workflows/pages.yml'); y=p.read_text()
          y=must_replace(y,'          node --check verify-definition-of-done.mjs\n','          node --check verify-definition-of-done.mjs\n          node --check verify-project-lifecycle.mjs\n','workflow syntax lifecycle')
          y=must_replace(y,'      - name: Derive definition-of-done coverage metrics\n        run: node verify-definition-of-done.mjs\n','      - name: Derive definition-of-done coverage metrics\n        run: node verify-definition-of-done.mjs\n      - name: Prove compact project lifecycle controls\n        run: node verify-project-lifecycle.mjs\n','workflow lifecycle proof')
          y=y.replace('node verify-prompt-semantics.mjs && node verify-semantic-invariant.mjs && node verify-definition-of-done.mjs','node verify-prompt-semantics.mjs && node verify-semantic-invariant.mjs && node verify-definition-of-done.mjs && node verify-project-lifecycle.mjs')
          p.write_text(y)
          PY
      - name: Refresh exact runtime identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, re
          files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''.join(f'{f}:{subprocess.check_output(["git","hash-object",f],text=True).strip()}\n' for f in files)
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p=Path('index.html'); s=p.read_text(); s,n=re.subn(r'runtime-[0-9a-f]{16}',token,s)
          if n != 8: raise SystemExit(f'expected 8 runtime tokens, replaced {n}')
          p.write_text(s)
          print(token)
          PY
      - name: Deterministic proofs
        run: |
