name: Practical 100 PR4 transformation
on:
  push:
    branches: [practical-100/pr4-deterministic-engine]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Transform deterministic engine
        run: python .practical100-pr4.py
      - name: Complete current-scope stamping and fail-closed identity evidence
        shell: python
        run: |
          from pathlib import Path
          p=Path('response-ingestion.js'); s=p.read_text()
          a="evidence.push({id,stage:Number(envelope.stage),createdAt:now(),active:true,fields,...fields,sourceProposalId:proposalId"
          b="evidence.push({id,stage:Number(envelope.stage),createdAt:now(),active:true,scope:clone(promptRecord.scope||{}),fields,...fields,sourceProposalId:proposalId"
          assert a in s; s=s.replace(a,b,1)
          a="id,stage:Number(envelope.stage),createdAt:now(),active:true,fields,...fields,relationships,evidenceRefs,"
          b="id,stage:Number(envelope.stage),createdAt:now(),active:true,scope:clone(promptRecord.scope||{}),fields,...fields,relationships,evidenceRefs,"
          assert a in s; s=s.replace(a,b,1)
          a="createdAt:now(),status:'PENDING_OPERATOR_REVIEW',canonicalEnvelopeSha256:hash.canonicalEnvelopeSha256(envelope),preconditions:proposalPreconditions(project,envelope,promptRecord),"
          b="createdAt:now(),status:'PENDING_OPERATOR_REVIEW',scope:clone(promptRecord.scope||{}),canonicalEnvelopeSha256:hash.canonicalEnvelopeSha256(envelope),preconditions:proposalPreconditions(project,envelope,promptRecord),"
          assert a in s; s=s.replace(a,b,1)
          p.write_text(s)
          p=Path('workflow-engine.js'); s=p.read_text()
          old="if(fields.AUTHORIZATION!=='AUTHORIZED')throw new Error('Artifact '+left.artifactId+' does not exactly match audited identity.');"
          assert old in s; s=s.replace(old,'',1); p.write_text(s)
      - name: Align and extend strengthened gate verifier
        shell: python
        run: |
          from pathlib import Path
          p=Path('verify-complete.mjs'); s=p.read_text()
          s=s.replace('/Exactly 10 independent runs/i','/Exactly ten current runs|Exactly 10 independent runs/i')
          s=s.replace('/ten runs|coverage/i','/ten runs|coverage|REQ × RUN × TEST/i')
          marker="// Material upstream change invalidates downstream records and release authorization."
          extra="""
          // Current-scope selection excludes historical scoped records, and triple verification counts TEST_ID.
          {
            const p=project('JOB-SCOPE');p.job.CURRENT_REQUIREMENTS_VERSION='REQUIREMENTS-v002';p.job.CURRENT_TEST_SUITE_VERSION='TEST-SUITE-v002';p.job.CURRENT_ITERATION='ITERATION-2';
            const current=record('requirements',4,{OBLIGATION:'current',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-CURRENT');current.scope={requirementsVersion:'REQUIREMENTS-v002'};
            const stale=record('requirements',4,{OBLIGATION:'stale',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-STALE');stale.scope={requirementsVersion:'REQUIREMENTS-v001'};p.projectData.requirements.push(current,stale);
            assert(engine.recordsForCurrentScope(p,'requirements').map(x=>engine.recordId(x,'requirements')).includes('REQ-CURRENT')&&!engine.recordsForCurrentScope(p,'requirements').map(x=>engine.recordId(x,'requirements')).includes('REQ-STALE'),'Historical scope satisfied current selector.');
          }

          // Artifact identity is independent of selection order while mismatches remain recorded as unauthorized.
          {
            const p=project('JOB-ORDER');p.projectData.releaseRecords.push(record('releaseRecords',27,{DETERMINATION:'ACCEPTED'},'RELEASE-ORDER'));
            const audited=[{artifactId:'A',name:'a.bin',size:1,sha256:'a'},{artifactId:'B',name:'b.bin',size:2,sha256:'b'}];
            const delivery=[{artifactId:'B',name:'b.bin',size:2,sha256:'b'},{artifactId:'A',name:'a.bin',size:1,sha256:'a'}];
            const r=engine.verifyArtifactIdentity(p,audited,delivery);assert(r.length===2&&p.release.authorization==='AUTHORIZED','Artifact identity depends on file-selection order.');
          }

          """
          assert marker in s; s=s.replace(marker,extra+marker,1); p.write_text(s)
      - name: Syntax
        run: |
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check response-ingestion.js
          node --check verify-complete.mjs
      - name: Deterministic verification
        run: |
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node - <<'NODE'
          global.window=global;global.location={href:'http://localhost/'};global.document={};
          for(const f of ['workbook.js','hash.js','workflow-schema.js','workflow-engine.js'])await import('./'+f+'?pr4='+Math.random());
          const e=global.closedLoopWorkflowEngine;
          if(!e.DERIVATIONS||Object.keys(e.DERIVATIONS).length!==6)throw new Error('Derivation registry incomplete.');
          if(typeof e.recordsForCurrentScope!=='function'||typeof e.evaluateIteration!=='function'||typeof e.verificationMatrix!=='function')throw new Error('Current-scope/iteration helpers missing.');
          console.log(JSON.stringify({derivations:Object.keys(e.DERIVATIONS),scopeSelector:true,iterationEvaluator:true,verificationTriples:true},null,2));
          NODE
      - name: Commit verified PR4 source only
        run: |
          rm .practical100-pr4.mjs .practical100-pr4.py .github/workflows/practical100-pr4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 4: complete deterministic workflow engine"
          git push origin HEAD:practical-100/pr4-deterministic-engine
