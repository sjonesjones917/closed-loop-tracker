name: Practical 100 PR5 transformation
on:
  push:
    branches: [practical-100/pr5-indexeddb-ui]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Repair branch-local transformer syntax
        shell: python
        run: |
          from pathlib import Path
          p=Path('.practical100-pr5.py');s=p.read_text();bad='if(\'http-equiv="Content-Security-Policy"\' not in s:';good='if \'http-equiv="Content-Security-Policy"\' not in s:';assert bad in s;p.write_text(s.replace(bad,good,1))
      - name: Apply IndexedDB and UI command integration
        run: |
          python .practical100-pr5.py
          python .practical100-pr5-finalize.py
      - name: Repair generated precedence
        shell: python
        run: |
          from pathlib import Path
          p=Path('workflow-engine.js');s=p.read_text();bad="stage:stage??Number(project.activeStage||0)||null";good="stage:(stage??Number(project.activeStage||0))||null";assert bad in s;p.write_text(s.replace(bad,good,1))
      - name: Syntax
        run: |
          node --check project-store.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify.mjs
      - name: Source boundaries
        run: |
          grep -q "closed-loop-reliability" project-store.js
          grep -q "createObjectStore(PROJECTS" project-store.js
          grep -q "createObjectStore(ARTIFACTS" project-store.js
          grep -q "createObjectStore(META" project-store.js
          grep -q "CompressionStream" project-store.js
          grep -q "captureRaw" response-ingestion.js
          ! grep -qE "projectData\.[A-Za-z0-9_]+\.push\(" app-core.js
          ! grep -qE "projectData\[[^]]+\]" app-core.js
          ! grep -q "prompt(" app-core.js
          grep -q "identityAssurance:'SELF_ASSERTED'" workflow-engine.js
      - name: Deterministic verification
        run: |
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Commit verified PR5 source only
        run: |
          rm .practical100-pr5.py .practical100-pr5-finalize.py .github/workflows/practical100-pr5.yml .github/workflows/practical100-pr5-inspect.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 5: add IndexedDB artifact persistence and validated UI commands"
          git push origin HEAD:practical-100/pr5-indexeddb-ui
