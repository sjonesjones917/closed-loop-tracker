name: Unique runtime closure
on:
  push:
    branches:
      - practical-100/final-organic-ui
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited unique runtime diff
        run: |
          git fetch origin practical-100/organic-self-spec-final --depth=100
          git diff d0aae2aef3fb7675962f2747f75b0051ba4fe427 2efee2303c2fd8b593e02264d6e5f9ea5a5a60f0 -- app-core.js response-ingestion.js workflow-engine.js > /tmp/runtime.patch
          git apply --3way /tmp/runtime.patch
          git show 2efee2303c2fd8b593e02264d6e5f9ea5a5a60f0:SELF_SPECIFICATION.md > SELF_SPECIFICATION.md
      - name: Verify existing acceptance suites
        run: |
          node --check app-core.js
          node --check response-ingestion.js
          node --check workflow-engine.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit clean result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-unique-runtime.yml
          git add -A
          git commit -m "Close accepted-response, run identity, and Stage 29 operator gaps"
          git push origin HEAD:practical-100/final-organic-ui
