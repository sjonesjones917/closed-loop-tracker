name: Apply Stage 01 user-experience repair v2

on:
  push:
    branches:
      - fix/restore-stage01-user-experience-20260830

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-stage01-user-experience-20260830
          fetch-depth: 0
      - name: Apply exact repair
        id: apply
        continue-on-error: true
        run: |
          set +e
          node apply-stage01-ux-repair-v2.mjs > repair-v2.log 2>&1
          status=$?
          cat repair-v2.log
          exit $status
      - name: Verify repaired runtime and regressions
        id: verify
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          {
            set -euo pipefail
            for file in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js; do
              node --check "$file"
            done
            node verify-stage01-user-experience.mjs
            node verify-one-time-intent-intake.mjs
            node verify-prompt-semantics.mjs
            node verify-user-prompt-invariants.mjs
          } > verify-v2.log 2>&1
          status=$?
          cat verify-v2.log
          exit $status
      - name: Commit verified repair and remove one-time files
        if: steps.apply.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f apply-stage01-ux-repair.mjs apply-stage01-ux-repair-v2.mjs .github/workflows/apply-stage01-ux-repair-v2.yml repair.log verify.log repair-v2.log verify-v2.log .stage01-repair-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Stage 01 conversation and fail-closed intake"
          git push origin HEAD:fix/restore-stage01-user-experience-20260830
      - name: Commit diagnostics on failure
        if: steps.apply.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          set -euo pipefail
          date -u +%FT%TZ > stage01-repair-diagnostic-time.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-v2.log verify-v2.log stage01-repair-diagnostic-time.txt
          git commit -m "Record Stage 01 repair v2 diagnostic"
          git push origin HEAD:fix/restore-stage01-user-experience-20260830
          exit 1
