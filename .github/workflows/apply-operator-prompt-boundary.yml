name: Apply operator prompt boundary repair
on:
  push:
    branches: [operator-prompt-boundary-20260830]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operator-prompt-boundary-20260830
      - run: python repair-operator-prompt-boundary.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js
          git commit -m "Keep agent semantics in prompts and locked stages non-actionable"
          git push origin HEAD:operator-prompt-boundary-20260830
