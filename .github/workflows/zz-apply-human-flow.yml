name: Apply minimal human-first flow correction
on:
  push:
    branches: [fix/human-first-stage-flow-20260827]
    paths: [.github/workflows/zz-apply-human-flow.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-first-stage-flow-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact minimal changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once('prompt-engine.js', "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/13';", "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/14';")

          replace_once(
              'prompt-engine.js',
              'If such a genuinely Stage-01-blocking fact is missing, return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL—as the single response. Put only the smallest set of blocking questions inside humanInputRequests using the exact question contract below. Ask necessary human questions conversationally before the final JSON response; do not encode a question as JSON merely to talk to the human. The application will display and type-check those questions, version the answers as User Job Input, invalidate this prompt, and generate a replacement Stage 01 instruction. Do not hide missing human information behind UNKNOWN, placeholders, empty strings, or guessed assumptions.',
              'If such a genuinely Stage-01-blocking fact is missing, ask the smallest useful set of plain-language questions conversationally and continue in the same chat. Do not encode a question as JSON merely to talk to the human, and do not require the human to re-enter an answer in the application before you can continue. After the human answers or states that an item is unknown or unavailable, faithfully use those human-authority facts in the permitted agent-owned fields and allowed evidence without assigning HUMAN or HUMAN_DECISION-owned fields. Use HUMAN_INPUT_REQUIRED only when interactive conversation is unavailable or the human explicitly defers a still-blocking answer; in that fallback, include only the unanswered blocking questions using the exact question contract below. Do not hide missing human information behind UNKNOWN, placeholders, empty strings, or guessed assumptions.'
          )

          replace_once(
              'prompt-engine.js',
              '- Never set a HUMAN or HUMAN_DECISION-owned field. When unavailable human information is required, return HUMAN_INPUT_REQUIRED and structured humanInputRequests. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.',
              '- Never set a HUMAN or HUMAN_DECISION-owned field. Resolve missing human information through HUMAN COLLABORATION MODE first. Use HUMAN_INPUT_REQUIRED and structured humanInputRequests only for a still-required answer that remains unavailable or explicitly deferred after that conversation, or when interactive conversation is unavailable. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.'
          )

          replace_once(
              'app-core.js',
              'Start with one thing: save the verbatim job request. Add files or constraints you already have; everything else can be clarified later. If more human information is needed now, the agent must return one structured HUMAN_INPUT_REQUIRED response. Paste it once and the application will show the plain-language questions here, validate your answers, version them as User Job Input, and regenerate Stage 01.',
              "Start with the verbatim job request. Add files or constraints you already have; the agent should read supplied materials and ask only for human-specific facts it cannot obtain itself. If it asks a plain-language question, answer it in that ChatGPT conversation and continue there; do not re-enter the answer here or regenerate the instruction. Paste only the agent's final JSON after it has enough information. HUMAN_INPUT_REQUIRED remains available only when a required answer is unknown, unavailable, or explicitly deferred."
          )

          replace_once(
              'app-core.js',
              'Clarify before final JSON.</strong> If the external agent asks a question, answer it there, then record the answer in User Job Input and regenerate this instruction. Do not paste or accept a placeholder DATA_PROPOSAL just to discover what information is missing.',
              "Use one ChatGPT conversation.</strong> If the agent asks a plain-language question, answer it there and continue; do not re-enter the answer here or regenerate the instruction. Paste only the agent's final JSON after it has enough information. HUMAN_INPUT_REQUIRED is a fallback only when a required answer remains unavailable or is explicitly deferred."
          )

          replace_once(
              'app-core.js',
              '<div class="operator-step"><b>1</b><span>Send instruction</span></div><div class="operator-step"><b>2</b><span>Paste full response</span></div><div class="operator-step"><b>3</b><span>Parse and validate</span></div><div class="operator-step"><b>4</b><span>Review and accept</span></div>',
              '<div class="operator-step"><b>1</b><span>Send instruction</span></div><div class="operator-step"><b>2</b><span>Answer questions</span></div><div class="operator-step"><b>3</b><span>Paste final JSON</span></div><div class="operator-step"><b>4</b><span>Parse, review, accept</span></div>'
          )

          replace_once(
              'app-core.js',
              'Paste the complete strict JSON response. Parse / validate preserves the raw response first, then validates it without changing canonical project records.',
              'After any conversational questions are finished, paste the complete final strict JSON response. Parse / validate preserves the raw response first, then validates it without changing canonical project records.'
          )

          replace_once(
              'index.html',
              'If it needs information only you can provide, it should ask short plain-language questions. Do not paste those questions into this app.',
              'If it needs information only you can provide, it should ask short plain-language questions. Do not paste those questions or re-enter the answers in this app.'
          )

          replace_once(
              'verify-prompt-semantics.mjs',
              "  if(record.prompt.includes('Do not ask conversational questions outside the JSON response')||record.prompt.includes('Missing human-authority information requires HUMAN_INPUT_REQUIRED'))issues.push('MACHINE_FIRST_HUMAN_CLARIFICATION_CONTRADICTION');",
              "  for(const banned of ['Do not ask conversational questions outside the JSON response','Missing human-authority information requires HUMAN_INPUT_REQUIRED','return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL','display and type-check those questions','generate a replacement Stage 01 instruction'])if(record.prompt.includes(banned))issues.push(`MACHINE_FIRST_HUMAN_CLARIFICATION_CONTRADICTION_${banned}`);"
          )

          replace_once(
              'verify-prompt-semantics.mjs',
              "    if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL')||!record.prompt.includes('Ask necessary human questions conversationally before the final JSON response')||!record.prompt.includes('display and type-check those questions')||!record.prompt.includes('generate a replacement Stage 01 instruction'))issues.push('STAGE01_STRUCTURED_CLARIFICATION_MISSING');",
              "    if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('ask the smallest useful set of plain-language questions conversationally and continue in the same chat')||!record.prompt.includes('do not require the human to re-enter an answer in the application')||!record.prompt.includes('Use HUMAN_INPUT_REQUIRED only when interactive conversation is unavailable or the human explicitly defers a still-blocking answer'))issues.push('STAGE01_HUMAN_FIRST_CLARIFICATION_MISSING');"
          )

          replace_once(
              'verify-prompt-semantics.mjs',
              " if(!ui.includes('Start with one thing: save the verbatim job request')||!ui.includes('one structured HUMAN_INPUT_REQUIRED response')||!ui.includes('validate your answers, version them as User Job Input, and regenerate Stage 01'))throw new Error('Stage 01 operator UI does not explain minimum intake and structured clarification.');",
              " if(!ui.includes('Start with the verbatim job request')||!ui.includes('answer it in that ChatGPT conversation')||!ui.includes('do not re-enter the answer here')||!ui.includes(\"Paste only the agent's final JSON\"))throw new Error('Stage 01 operator UI does not explain the single human-first ChatGPT intake path.');"
          )

          replace_once(
              'verify-prompt-semantics.mjs',
              "if(record.prompt.includes('ask only the necessary clarification questions in normal plain language first'))throw new Error('Stage 01 still contains the conversational-vs-JSON contradiction.');",
              "for(const banned of ['return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL','display and type-check those questions','generate a replacement Stage 01 instruction'])if(record.prompt.includes(banned))throw new Error(`Stage 01 still contains machine-first clarification text: ${banned}`);if(!record.prompt.includes('continue in the same chat')||!record.prompt.includes('do not require the human to re-enter an answer in the application'))throw new Error('Stage 01 does not preserve the single human-first ChatGPT intake path.');"
          )

          replace_count('index.html', 'runtime-6e61c99da4e764b5', 'runtime-44d9c63bfec28a71', 8)
          Path('.github/workflows/zz-apply-human-flow.yml').unlink()
      - name: Run focused verification
        run: |
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
      - name: Commit the verified correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js app-core.js index.html verify-prompt-semantics.mjs .github/workflows/zz-apply-human-flow.yml
          git diff --cached --check
          git commit -m "Use one human-first ChatGPT intake path across all stages"
          git push origin HEAD:fix/human-first-stage-flow-20260827
