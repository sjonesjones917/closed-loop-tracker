name: materialize-test-ir

on:
  push:
    branches:
      - closed-loop-test-ir-minimal
    paths:
      - materialize-test-ir.mjs
      - .github/workflows/materialize-test-ir.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-test-ir-minimal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize integration
        run: node materialize-test-ir.mjs
      - name: Syntax
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check test-runtime.js
          node --check test-worker.js
      - name: Test IR runtime
        run: node verify-test-runtime.mjs
      - name: Test IR integration
        run: node verify-test-ir-integration.mjs
      - name: Existing complete verification
        run: node verify-complete.mjs
      - name: Existing prompt semantics
        run: node verify-prompt-semantics.mjs
      - name: Existing ingestion
        run: node verify-ingestion.mjs
      - name: Existing full cycle
        run: node verify-full-cycle.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit materialized repair
        run: |
          git config user.name "closed-loop-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-schema.js workflow-engine.js prompt-engine.js test-runtime.js verify-test-runtime.mjs verify-test-ir-integration.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Integrate subject-neutral Test IR into verification routing"
            git push origin HEAD:closed-loop-test-ir-minimal
          fi
