name: Controller diagnostic grep
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  grep:
    if: github.head_ref == 'controller3-integrate-closure-20260904'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-integrate-closure-20260904
      - run: grep -R -n "Authoritative prompt body does not enforce exactly one final newline" . || true
