name: Apply exact intake UX repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact repair and remove temporary scaffolding
        run: |
          python3 apply-intake-ux-fix.py
          rm apply-intake-ux-fix.py .github/workflows/intake-ux-fix.yml
          node --check app-core.js
          node --check prompt-engine.js
          node --check project-store.js
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node verify-prompt-semantics.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix human-first intake and mobile source count'
          git push origin HEAD:${{ github.head_ref }}
