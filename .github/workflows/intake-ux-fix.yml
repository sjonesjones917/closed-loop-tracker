name: Apply exact intake UX repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact repair and remove temporary scaffolding
        run: |
          set +e
          {
            python3 apply-intake-ux-fix.py
            python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          text=p.read_text()
          old='- PATENT / REGULATED FILING: use only the minimum human-supplied invention facts needed to recognize and define the requested patent-application drafting job. A request such as "prepare a patent application for this project"'
          new='- PATENT / REGULATED FILING: use only the minimum human-supplied invention facts needed to recognize and define the requested patent-application drafting job. Use any supplied invention disclosure only for the minimum Stage 01 job-definition facts; do not perform Stage 02 inventory or patent research from it here. Do not make jurisdiction, filing route, inventorship, ownership, priority/continuity, disclosure history, filing deadline, or counsel-review-versus-filing-ready choices automatic Stage-01 blockers. A request such as "prepare a patent application for this project"'
          if text.count(old)!=1: raise SystemExit(f'patent wording anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
            node --check app-core.js
            node --check prompt-engine.js
            node --check project-store.js
            node --check verify-prompt-semantics.mjs
            node --check verify-browser.mjs
            node verify-prompt-semantics.mjs
          } > /tmp/intake-fix.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            cat /tmp/intake-fix.log
            cp /tmp/intake-fix.log repair-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add repair-error.txt
            git commit -m 'Capture intake repair failure diagnostics'
            git push origin HEAD:${{ github.head_ref }}
            exit "$STATUS"
          fi
          rm -f repair-error.txt apply-intake-ux-fix.py .github/workflows/intake-ux-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix human-first intake and mobile source count'
          git push origin HEAD:${{ github.head_ref }}
