name: finalize-capture-once-v19
on:
  push:
    branches: [fix/controlling-spec-zero-loss-20260830]
    paths: [.github/workflows/finalize-capture-once-v19.yml, tools/finalize_stage1_stage4_gate_v17.py]
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/controlling-spec-zero-loss-20260830, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply complete guarded repair set
        run: |
          set -euo pipefail
          python3 tools/finalize_capture_once_v4.py
          python3 tools/update_prompt_semantic_regressions.py
          python3 tools/fix_semantic_mutation_v15.py
          python3 tools/fix_semantic_mutation_v17.py
          python3 tools/finalize_stage1_stage4_gate_v17.py
      - name: Syntax and Stage 01 03 04 semantic proof
        run: |
          set -euo pipefail
          for file in workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js test-runtime.js test-worker.js verify-prompt-semantics.mjs verify-intent-capture.mjs; do node --check "$file"; done
          node verify-intent-capture.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
      - name: Complete deterministic and lifecycle proof
        run: |
          set -euo pipefail
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          node verify.mjs
      - name: Local Chromium acceptance
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Commit proven implementation and remove repair-only infrastructure
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          find .github/workflows -maxdepth 1 -type f \( -name 'finalize-intent-capture.yml' -o -name 'materialize-capture-once*.yml' -o -name 'finalize-capture-once-v*.yml' -o -name 'diagnose-capture-semantics-v*.yml' -o -name 'diagnose-semantic-v*.yml' -o -name 'zero-loss-materialize-v*.yml' \) -delete
          rm -f tools/finalize_intent_capture.py tools/materialize_remaining.py tools/materialize_remaining_v2.py tools/finalize_capture_once_v3.py tools/finalize_capture_once_v4.py tools/update_prompt_semantic_regressions.py tools/fix_semantic_mutation_v15.py tools/fix_semantic_mutation_v17.py tools/finalize_stage1_stage4_gate_v17.py
          rm -f materialize-v4.log materialize-v4.status materialize-capture-once.log materialize-capture-once.status semantic-diagnostic.log semantic-v8.log semantic-v10.log semantic-v12.log semantic-v14.log semantic-v16.log
          git add -A
          git commit -m 'Finalize exhaustive capture-once Stage 01 03 04 flow'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
