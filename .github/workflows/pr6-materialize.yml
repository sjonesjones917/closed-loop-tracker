# trigger existing PR6 materialization
name: Materialize recovered PR6 source
on:
  push:
    branches: [practical-100/pr6-final]
permissions:
  contents: write
concurrency:
  group: pr6-materialize-final
  cancel-in-progress: false
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and apply the transported PR6 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main practical-100/pr6-completion practical-100/pr6-acceptance-proof
          transport=ea845ac01a10a96fba8f000cb37b7d9e00efcb33
          git cat-file -e "$transport^{commit}"
          mapfile -t parts < <(git ls-tree -r --name-only "$transport" -- .pr6-patch | sort)
          test "${#parts[@]}" -gt 0
          : > /tmp/pr6.patch.b64
          for part in "${parts[@]}"; do
            git show "$transport:$part" >> /tmp/pr6.patch.b64
          done
          tr -d '\r\n' < /tmp/pr6.patch.b64 | base64 --decode > /tmp/pr6.patch.gz
          gzip -t /tmp/pr6.patch.gz
          gzip -dc /tmp/pr6.patch.gz > /tmp/pr6.patch
          git apply --stat /tmp/pr6.patch | tee /tmp/pr6-patch-stat.txt
          git apply --check /tmp/pr6.patch
          git apply /tmp/pr6.patch
          sed -i 's/ACCEPTED_CANONICAL_CHANGE/ACCEPTED_DATA_CHANGE/g' verify-live.mjs
          git show 4f9485ae35e986539c342e4a36f7b67b1e65633a:verify-prompt-semantics.mjs > verify-prompt-semantics.mjs
          rm -rf .pr6-patch
          rm -f .github/workflows/pr6-materialize.yml
          rm -f .github/workflows/pr6-source-export.yml .github/workflows/pr6-export-partial.yml .github/workflows/pr6-recover-source.yml .github/workflows/pr6-source-snapshot.yml
      - name: Verify recovered deterministic source
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Capture continuous lifecycle result
        id: lifecycle
        shell: bash
        run: |
          set +e
          node verify-full-cycle.mjs > /tmp/pr6-full-cycle.log 2>&1
          status=$?
          set -e
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          {
            printf 'PR6 recovered source continuous lifecycle exit code: %s\n\n' "$status"
            printf '%s\n' '--- LAST 300 LOG LINES ---'
            tail -n 300 /tmp/pr6-full-cycle.log
          } > PR6_FULL_CYCLE_DIAGNOSTIC.txt
          cat PR6_FULL_CYCLE_DIAGNOSTIC.txt
      - name: Commit reviewable recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 6: materialize recovered acceptance source"
          git push origin HEAD:practical-100/pr6-final
      - uses: actions/upload-artifact@v4
        with:
          name: pr6-materialized-diagnostic
          path: |
            /tmp/pr6-patch-stat.txt
            /tmp/pr6-full-cycle.log
          if-no-files-found: error
          retention-days: 7
      - name: Report diagnostic state
        run: echo "verify-full-cycle.mjs exit code ${{ steps.lifecycle.outputs.exit_code }}"
