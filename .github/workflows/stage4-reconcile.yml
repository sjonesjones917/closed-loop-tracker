name: Reconcile proofed Stage 04 repair onto current main
on:
  push:
    branches:
      - fix/stage4-canonical-reuse-main
permissions:
  contents: write
jobs:
  reconcile-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-canonical-reuse-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge proofed repair while preserving current main deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git fetch origin b2c4acb65f4c7b6a69b3d216c9ae335575cca762
          git merge --no-ff --no-commit -X ours b2c4acb65f4c7b6a69b3d216c9ae335575cca762
          test -z "$(git diff --name-only --diff-filter=U)"
          git checkout HEAD -- .github/workflows/pages.yml
          rm -f .github/workflows/stage4-reconcile.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          runtime=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for filename in runtime:
              data=Path(filename).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              manifest+=f'{filename}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          idx=Path('index.html')
          html=idx.read_text()
          html,count=re.subn(r'runtime-[0-9a-f]{16}',token,html)
          if count!=8: raise SystemExit(f'index.html runtime token count={count}')
          idx.write_text(html)
          print(token)
          PY
      - name: Prove reconciled final tree
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          for f in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js test-runtime.js test-worker.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs verify-project-lifecycle.mjs verify-test-runtime.mjs verify-one-time-intent-intake.mjs; do node --check "$f"; done
          node verify-one-time-intent-intake.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "pages.yml "
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          ! grep -R "document.write\|MutationObserver" --include='*.js' --include='*.html' .
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier(){ script="$1"; for attempt in 1 2 3; do log="/tmp/${script}.${attempt}.log"; if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi; cat "$log"; if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi; test "$attempt" -lt 3 || return 1; done; }
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only the reconciled permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Integrate Stage 04 canonical intent reuse on current main'
          git push origin HEAD:fix/stage4-canonical-reuse-main
