name: Temporary mobile hot-path bootstrap
on:
  push:
    branches: [reliability/mobile-freeze-hotpath-20260828]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/mobile-freeze-hotpath-20260828
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node apply-mobile-hotpath-fix.mjs
          node --check app-core.js
      - name: Commit responsible-layer patch
        run: |
          if git diff --quiet -- app-core.js; then
            echo 'app-core.js already patched'
            exit 0
          fi
          git config user.name 'closed-loop-ci'
          git config user.email 'closed-loop-ci@users.noreply.github.com'
          git add app-core.js
          git commit -m 'Remove mobile workflow render and startup clone stalls'
          git push origin HEAD:reliability/mobile-freeze-hotpath-20260828
