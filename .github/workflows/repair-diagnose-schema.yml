name: Capture consolidated repair failure

on:
  push:
    branches: [fix/monotonic-reliability-pass-20260831]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
      - name: Capture exact patch target counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          out=[]
          s=Path('workbook.js').read_text()
          out.append('migration_old='+str(s.count("if(p.schema!=='human-project/30')throw new Error")))
          out.append('migration_new='+str(s.count("const sourceSchema=String(p.schema||'');")))
          s=Path('workflow-engine.js').read_text()
          out.append('scope_old='+str(s.count("if(stage>=2)keys.push('inputVersion','sourceSetVersion')")))
          out.append('scope_new='+str(s.count("if(stage>=2)keys.push('sourceSetVersion')")))
          out.append('manifest_old='+str(s.count('operationalNextAction,operationalMetrics,intakeCoverageManifest,parseCapturedInputSet,evaluateIntakeAccounting,obligationManifest,evaluateObligationAccounting,representationInspectionCoverage,gate')))
          out.append('manifest_new='+str(s.count('stage01IntakeManifest:intakeCoverageManifest')))
          s=Path('.github/workflows/pages.yml').read_text()
          out.append('pages_old_start='+str(s.count('            fieldOwnershipCoverage:1,\n            applicationDerivationCoverage:1,')))
          out.append('pages_derived_start='+str(s.count('            fieldOwnershipCoverage:definition.fieldOwnershipCoverage,')))
          out.append('liveVerification='+str(s.count('            liveVerification:true,')))
          out.append('liveBrowserVerification='+str(s.count('            liveBrowserVerification:true,')))
          Path('.repair-contract-targets.txt').write_text('\n'.join(out)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .repair-contract-targets.txt
          git commit -m "Record consolidated repair targets"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831
