name: Capture schema gate failure

on:
  push:
    branches: [fix/monotonic-reliability-pass-20260831]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact schema gate
        shell: bash
        run: |
          set +e
          : > .repair-schema-diagnostic.txt
          run_one() {
            printf '\n===== %s =====\n' "$1" >> .repair-schema-diagnostic.txt
            shift
            "$@" >> .repair-schema-diagnostic.txt 2>&1
            rc=$?
            printf 'EXIT=%s\n' "$rc" >> .repair-schema-diagnostic.txt
            return $rc
          }
          run_one build-test-project node build-test-project.mjs || true
          run_one test-project-diff git diff --exit-code -- TEST_PROJECT.json || true
          run_one verify node verify.mjs || true
          run_one verify-spec3 node verify-spec3-contract.mjs || true
          run_one verify-v3 node verify-v3-contract.mjs || true
          run_one html-count bash -lc 'test "$(find . -maxdepth 1 -type f -name "*.html" | wc -l)" -eq 1' || true
          run_one no-app-js bash -lc 'test ! -f app.js' || true
          run_one no-repair-root bash -lc 'test -z "$(find . -maxdepth 1 -type f -name ".repair-*" ! -name ".repair-schema-diagnostic.txt" -print -quit)"' || true
          run_one no-document-write bash -lc '! grep -R "document.write" --include="*.js" --include="*.html" .' || true
          run_one no-mutation-observer bash -lc '! grep -R "MutationObserver" --include="*.js" --include="*.html" .' || true
          run_one no-stage31 bash -lc '! grep -REi "human-project/31|Stage 31|Operation 31" --include="*.js" --include="*.html" --include="TEST_PROJECT.json" .' || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .repair-schema-diagnostic.txt
          git commit -m "Record exact schema gate diagnostic"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831
