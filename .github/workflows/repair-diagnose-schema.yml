name: One-time deterministic migration and Stage 01 disposition repair

on:
  push:
    branches: [fix/monotonic-reliability-pass-20260831]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Implement and prove migration plus Stage 01 disposition contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('workbook.js'); s=p.read_text()
          old="""  if(p.schema!=='human-project/30')throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n  migrated.schema=PROJECT_SCHEMA;migrated.workflow=WORKFLOW_ID;migrated.stageCount=STAGE_COUNT;migrated.revision=Number.isInteger(migrated.revision)?migrated.revision:0;"""
          new="""  const sourceSchema=String(p.schema||'');\n  if(!['human-project/30','closed-loop-project/2'].includes(sourceSchema))throw new Error(`Unsupported project schema: ${sourceSchema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n  migrated.schema=PROJECT_SCHEMA;migrated.workflow=WORKFLOW_ID;migrated.stageCount=STAGE_COUNT;migrated.revision=Number.isInteger(migrated.revision)?migrated.revision:0;"""
          if new not in s:
              if s.count(old)!=1: raise SystemExit('migration entry target not unique')
              s=s.replace(old,new,1)
          s=s.replace("{kind:'LEGACY_STAGE_RECORDS',schema:'human-project/30',records:","{kind:'LEGACY_STAGE_RECORDS',schema:sourceSchema,records:",1)
          s=s.replace("{kind:'MIGRATION_SOURCE',schema:'human-project/30',preservedAt:","{kind:'MIGRATION_SOURCE',schema:sourceSchema,preservedAt:",1)
          p.write_text(s)

          p=Path('workflow-engine.js'); s=p.read_text()
          old="const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['incorporated into the job definition','retained as context','unresolved human-only','later-resolvable','inapplicable with reason']);"
          new="const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED']);"
          if new not in s:
              if s.count(old)!=1: raise SystemExit('Stage 01 disposition registry target not unique')
              s=s.replace(old,new,1)
          old="const disposition=String(unit?.disposition||'').trim().toLowerCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);if(disposition==='inapplicable with reason'&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires an inapplicability reason.`);\n    const statements=safe(unit?.extractedStatements);if(disposition!=='inapplicable with reason'&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);"
          new="const disposition=String(unit?.disposition||'').trim().toUpperCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);if(['NO_PROJECT_RELEVANT_INFORMATION','INACCESSIBLE_OR_BLOCKED'].includes(disposition)&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires a disposition reason.`);\n    const statements=safe(unit?.extractedStatements);if(!['NO_PROJECT_RELEVANT_INFORMATION','INACCESSIBLE_OR_BLOCKED'].includes(disposition)&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);"
          if new not in s:
              if s.count(old)!=1: raise SystemExit('Stage 01 disposition validation target not unique')
              s=s.replace(old,new,1)
          old="if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&(disposition==='inapplicable with reason'?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);"
          new="if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&(['NO_PROJECT_RELEVANT_INFORMATION','INACCESSIBLE_OR_BLOCKED'].includes(disposition)?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);"
          if new not in s:
              if s.count(old)!=1: raise SystemExit('Stage 01 disposition completion target not unique')
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('prompt-engine.js'); s=p.read_text()
          old='"disposition":"incorporated into the job definition|retained as context|unresolved human-only|later-resolvable|inapplicable with reason"'
          new='"disposition":"EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED"'
          if new not in s:
              if s.count(old)!=1: raise SystemExit('Stage 01 prompt disposition target not unique')
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('verify-spec3-contract.mjs'); s=p.read_text()
          old="""const p=core.createBlankState('CAPTURE');Object.assign(p.job,{EXACT_USER_OBJECTIVE_VERBATIM:'Build the requested thing',EXPLICIT_USER_REQUIREMENTS:'Never ask me for the same project data twice',SUPPLIED_MATERIALS_INVENTORY:'intent.pdf',EXACT_DELIVERABLE_REQUESTED:'finished product',INPUT_SET_CONTENTS:'captured project requirements'});engine.ensureShape(p);engine.recalculate(p);const intake=engine.stage01IntakeManifest(p),ob=engine.stage04ObligationManifest(p);assert(intake.entries.length>=3);assert(ob.entries.some(x=>String(x.value).includes('Never ask me')));const pr=prompt.buildPromptRecord(4,p).prompt;for(const t of ['PROJECT DATA EXECUTION RULE — MANDATORY','APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST','Never ask the human','Never ask me for the same project data twice'])assert(pr.includes(t),t);console.log(JSON.stringify({projectSchema:core.PROJECT_SCHEMA,responseSchema:schema.RESPONSE_SCHEMA,stageCount:core.STAGE_COUNT,intake: intake.entries.length,obligations:ob.entries.length,visualBaselineRestored:true,testRuntimeLoaded:true}));"""
          new="""const p=core.createBlankState('CAPTURE');Object.assign(p.job,{EXACT_USER_OBJECTIVE_VERBATIM:'Build the requested thing',EXPLICIT_USER_REQUIREMENTS:'Never ask me for the same project data twice',SUPPLIED_MATERIALS_INVENTORY:'intent.pdf'});engine.ensureShape(p);engine.recalculate(p);const intake=engine.intakeCoverageManifest(p);p.stages[1].agentData.EXACT_DELIVERABLE_REQUESTED='finished product';p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'EXTRACTED_RELEVANT_INFORMATION',reason:'Captured for migration contract fixture.',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||u.label,statementClass:'FACT'}]}))});for(let stage=1;stage<=3;stage++){p.stages[stage].status='COMPLETE';p.stages[stage].gate={complete:true,blocked:false,reasons:[]};}p.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';const accounting=engine.evaluateIntakeAccounting(p);assert.equal(accounting.complete,true);const ob=engine.obligationManifest(p);assert(intake.units.length>=3);assert(ob.items.some(x=>String(x.text).includes('Never ask me')));const stage1Prompt=prompt.buildPromptRecord(1,p).prompt;for(const disposition of ['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED'])assert(stage1Prompt.includes(disposition),disposition);const pr=prompt.buildPromptRecord(4,p).prompt;for(const t of ['PROJECT DATA EXECUTION RULE — MANDATORY','APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST','Never ask the human','Never ask me for the same project data twice'])assert(pr.includes(t),t);console.log(JSON.stringify({projectSchema:core.PROJECT_SCHEMA,responseSchema:schema.RESPONSE_SCHEMA,stageCount:core.STAGE_COUNT,intake:intake.units.length,obligations:ob.items.length,stage01DispositionContract:true,visualBaselineRestored:true,testRuntimeLoaded:true}));"""
          if new not in s:
              if s.count(old)!=1: raise SystemExit('manifest verifier target not unique')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check workbook.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check verify-spec3-contract.mjs
          node verify-spec3-contract.mjs
          git diff --check

      - name: Commit verified corrections and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-diagnose-schema.yml
          git rm -f .repair-contract-targets.txt .repair-migration-diagnostic.txt
          git add workbook.js workflow-engine.js prompt-engine.js verify-spec3-contract.mjs
          git commit -m "Implement v2 migration and exact Stage 01 dispositions"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831
