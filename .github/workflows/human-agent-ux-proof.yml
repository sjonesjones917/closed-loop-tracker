name: Prove human-agent walkthrough repair

on:
  push:
    branches:
      - 'fix/human-agent-walkthrough-minimal-20260826'

permissions:
  contents: write

jobs:
  prove:
    if: ${{ !contains(github.event.head_commit.message, '[repair-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal repair
        run: python3 .repair-human-agent-ux.py
      - name: Remove one-time repair scaffolding
        run: rm .repair-human-agent-ux.py .github/workflows/human-agent-ux-proof.yml
      - name: Syntax
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
      - name: Build fixture
        run: node build-test-project.mjs
      - name: Hash proof
        run: node verify-hash.mjs
      - name: Architecture proof
        run: node verify.mjs
      - name: Ingestion proof
        run: node verify-ingestion.mjs
      - name: Gate proof
        run: node verify-complete.mjs
      - name: Full cycle proof
        run: node verify-full-cycle.mjs
      - name: Prompt semantic proof
        run: node verify-prompt-semantics.mjs
      - name: Chromium verification
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit proven source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[repair-output] Make every stage human-first before final JSON'
          git push origin HEAD
