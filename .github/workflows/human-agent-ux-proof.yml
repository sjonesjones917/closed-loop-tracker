name: Diagnose human-agent stage UX repair
on:
  push:
    branches:
      - fix/human-agent-stage-guidance-20260826
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply candidate repair
        run: |
          node .repair-human-agent-ux.mjs
          node verify-hash.mjs
      - name: Capture architecture verifier
        run: |
          set +e
          node verify.mjs > .verify-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .verify-diagnostic.txt
          cat .verify-diagnostic.txt
          if [ "$code" -eq 0 ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .repair-human-agent-ux.mjs .github/workflows/human-agent-ux-proof.yml
          git add .verify-diagnostic.txt
          git commit -m "Capture UX repair verifier diagnosis"
          git push origin HEAD
          exit 1
