name: Prove human-agent stage UX repair
on:
  push:
    branches:
      - fix/human-agent-stage-guidance-20260826
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply minimal repair
        run: |
          node --check .repair-human-agent-ux.mjs
          node .repair-human-agent-ux.mjs
      - name: Prove deterministic behavior
        run: |
          node --check prompt-engine.js
          node --check app-core.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified permanent source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .repair-human-agent-ux.mjs .github/workflows/human-agent-ux-proof.yml
          git add prompt-engine.js app-core.js verify-prompt-semantics.mjs verify-browser.mjs index.html
          git commit -m "Make agent conversation human-first and JSON final"
          git push origin HEAD
