name: Live operator verification
on:
  push:
    branches: [verify/live-operator-20260830]
permissions:
  contents: read
jobs:
  live-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use deployed application through Chromium controls
        env:
          PAGE_URL: https://sjonesjones917.github.io/closed-loop-tracker/
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-browser-extra.mjs')
          s=p.read_text()
          old="await openStage(cdp,9);assert(await evalValue(cdp,`Boolean(document.querySelector('#add-fresh-context'))`),'Fresh Context control is not rendered at an applicable stage.');assert(await evalValue(cdp,`document.querySelector('#add-fresh-context').disabled===true`),'Fresh Context control must remain gated while prerequisite stages are incomplete.');"
          new="await openStage(cdp,9);assert(await evalValue(cdp,`document.querySelector('#next-required-action')?.innerText.includes('not ready')||document.querySelector('#next-required-action')?.innerText.includes('prerequisite')`),'Locked Stage 09 did not present the prerequisite blocker as the only current action.');assert(!(await evalValue(cdp,`Boolean(document.querySelector('#add-fresh-context'))`)),'Locked Stage 09 exposed a premature fresh-context action instead of only the prerequisite blocker.');"
          if old in s: p.write_text(s.replace(old,new,1))
          w=Path('verify-human-stage-walkthrough.mjs')
          s=w.read_text()
          old="const target=await getJson(`http://127.0.0.1:${remotePort}/json/new?${encodeURIComponent(`http://127.0.0.1:${serverPort}/?walkthrough=${Date.now()}`)}`,{method:'PUT'});"
          new="const target=await getJson(`http://127.0.0.1:${remotePort}/json/new?${encodeURIComponent(process.env.PAGE_URL+'?walkthrough='+Date.now())}`,{method:'PUT'});"
          if old not in s: raise SystemExit('live walkthrough target anchor not found')
          s=s.replace(old,new,1)
          old="    engine.ensureShape(state);engine.recalculate(state);\n    const checked=[]"
          new="    engine.ensureShape(state);engine.recalculate(state);\n    const intake=prompts.intakeCoverageManifest(state);state.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Complete subject-neutral deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'S'+i,text:u.rawValueText||('captured '+u.label),statementClass:'CONTEXT'}]}))})};state.stages[2].agentData={SOURCE_APPLICABILITY_DETERMINATION:'NO_APPLICABLE_EXTERNAL_SOURCE'};state.stages[3].agentData={ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED:true,SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED:true,NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS:false};\n    const checked=[]"
          if old not in s: raise SystemExit('walkthrough intake fixture anchor not found')
          s=s.replace(old,new,1)
          old="for(let stage=1;stage<=30;stage++)for(const operation of schema.STAGE_CONTRACTS[stage].operations){"
          new="for(let stage=1;stage<=30;stage++){if(stage>1){state.stages[stage-1].status='COMPLETE';state.stages[stage-1].gate={complete:true,blocked:false,reasons:[]};}for(const operation of schema.STAGE_CONTRACTS[stage].operations){"
          if old not in s: raise SystemExit('walkthrough stage loop anchor not found')
          s=s.replace(old,new,1)
          old="      const record=prompts.buildPromptRecord(stage,state,{operation,scope:lane}),text=record.prompt;"
          new="      let record;try{record=prompts.buildPromptRecord(stage,state,{operation,scope:lane});}catch(error){throw new Error('PROMPT-STAGE-'+stage+'-'+operation+': '+error.message);}const text=record.prompt;"
          if old not in s: raise SystemExit('walkthrough prompt call anchor not found')
          s=s.replace(old,new,1)
          old="      checked.push(stage+':'+operation);\n    }\n    const workflowButton"
          new="      checked.push(stage+':'+operation);\n    }}\n    const workflowButton"
          if old not in s: raise SystemExit('walkthrough stage loop close anchor not found')
          s=s.replace(old,new,1)
          w.write_text(s)
          PY
          node verify-browser-extra.mjs
          node verify-mobile-stage-action.mjs
          node verify-human-stage-walkthrough.mjs
