name: one-time-exact-scope-fixture-repair
on:
  push:
    branches:
      - repair/scope-authority-e2aab
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[scope-fixture-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node repair-scope-fixture.mjs
      - run: |
          node verify-operation-scope-authority.mjs
          node verify-spec-grounded-route-oracle.mjs
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs
          node verify-v3-contract.mjs
      - run: |
          rm repair-scope-fixture.mjs .github/workflows/repair-scope-fixture.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git commit -m 'Bind route fixtures to exact operation scope [scope-fixture-repaired]'
          git push origin HEAD:repair/scope-authority-e2aab
