      - name: Verify repair before committing
        shell: bash
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node verify-complete.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/stage16-one-time-repair.yml
          git add workflow-engine.js prompt-engine.js app-core.js verify-complete.mjs
