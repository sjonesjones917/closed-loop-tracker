name: Prove current all-stage candidate
on:
  push:
    branches: [fix/stage01-intake-closure-20260830]
permissions: {contents: read}
jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build current candidate
        run: python3 prepare-current-candidate.py
      - name: Run full candidate proof
        id: verify
        continue-on-error: true
        run: |
          set +e
          : > candidate-proof.log
          for cmd in \
            'node --check workflow-schema.js' \
            'node --check prompt-engine.js' \
            'node --check verify-stage-prompts-complete.mjs' \
            'node --check verify-full-cycle.mjs' \
            'node verify-stage-prompts-complete.mjs' \
            'node verify-stage01-intake-closure.mjs' \
            'node verify-one-time-intent-intake.mjs' \
            'node verify-prompt-semantics.mjs' \
            'node verify-test-runtime.mjs' \
            'node verify-ingestion.mjs' \
            'node verify.mjs' \
            'node verify-full-cycle.mjs' \
            'node verify-definition-of-done.mjs'; do
              echo "=== $cmd ===" | tee -a candidate-proof.log
              eval "$cmd" >> candidate-proof.log 2>&1
              status=$?
              if [ $status -ne 0 ]; then echo "FAILED_STATUS=$status" | tee -a candidate-proof.log; echo "status=$status" >> "$GITHUB_OUTPUT"; break; fi
          done
          if [ -z "${status:-}" ] || [ "$status" -eq 0 ]; then echo "status=0" >> "$GITHUB_OUTPUT"; fi
          cat candidate-proof.log
          sha256sum workflow-schema.js prompt-engine.js verify-stage-prompts-complete.mjs verify-full-cycle.mjs > candidate-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: proven-all-stage-candidate
          path: |
            workflow-schema.js
            prompt-engine.js
            verify-stage-prompts-complete.mjs
            verify-full-cycle.mjs
            candidate-source.sha256
            candidate-proof.log
          if-no-files-found: error
      - name: Preserve failure
        if: steps.verify.outputs.status != '0'
        run: exit 1
