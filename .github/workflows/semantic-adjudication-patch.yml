name: Semantic adjudication patch
on:
  push:
    branches: [semantic-adjudication-20260827]
permissions:
  contents: write
jobs:
  patch-and-prove:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-adjudication]') && !contains(github.event.head_commit.message, '[semantic-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply one coordinated semantic adjudication patch
        run: python3 .semantic-adjudication-patch.py
      - name: Prove syntax and semantic false-acceptance invariant
        id: semantic-proof
        run: |
          node --check workflow-engine.js 2>&1 | tee /tmp/semantic-proof.log
          node --check workflow-schema.js 2>&1 | tee -a /tmp/semantic-proof.log
          node --check verify-semantic-adjudication.mjs 2>&1 | tee -a /tmp/semantic-proof.log
          node build-test-project.mjs 2>&1 | tee -a /tmp/semantic-proof.log
          node verify-semantic-adjudication.mjs 2>&1 | tee -a /tmp/semantic-proof.log
      - name: Persist failure diagnostic on repair branch
        if: failure()
        run: |
          cp /tmp/semantic-proof.log semantic-proof-failure.log || true
          git checkout -- .semantic-adjudication-patch.py .github/workflows/semantic-adjudication-patch.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic-proof-failure.log
          git commit -m 'chore: semantic proof diagnostic [semantic-diagnostic]' || true
          git push origin HEAD:semantic-adjudication-20260827 || true
      - name: Run complete deterministic acceptance stack
        run: |
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Run Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/semantic-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit exact proven tree without one-time machinery
        run: |
          test ! -f .semantic-adjudication-patch.py
          test ! -f .github/workflows/semantic-adjudication-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: application-owned semantic adjudication [semantic-adjudication]'
          git push origin HEAD:semantic-adjudication-20260827
