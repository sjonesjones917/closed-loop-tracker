name: Apply minimal Stage 04 prompt-material UX repair

on:
  push:
    branches:
      - fix/stage04-send-material-with-prompt

permissions:
  contents: write

concurrency:
  group: stage04-send-material-with-prompt
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate current main and apply the minimal repair
        run: |
          git config user.name "closed-loop-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit origin/main
          printf '%s' '' | base64 -d | gzip -d > /tmp/repair-stage04.py
          python3 /tmp/repair-stage04.py
          rm -f /tmp/repair-stage04.py .github/workflows/stage04-prompt-material-repair.yml
      - name: Verify exact changed-source syntax
        run: |
          node --check app-core.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          git diff --check
      - name: Run complete deterministic verification
        run: |
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Run local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Prove one-time repair infrastructure is gone
        run: |
          test ! -e .github/workflows/stage04-prompt-material-repair.yml
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
      - name: Commit verified source-only repair
        run: |
          git add -A
          git status --short
          git commit -m "Make Stage 04 prompt-material handoff concise"
          git push origin "HEAD:${GITHUB_REF_NAME}"
