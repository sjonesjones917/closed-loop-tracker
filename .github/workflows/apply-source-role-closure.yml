name: Verify Stage 2 source-role closure
on:
  push:
    branches: [practical-100/source-role-closure]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/source-role-closure
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-role corrections
        run: python3 source_role_patch.py
      - name: Verify source-role closure
        run: |
          node --check prompt-engine.js
          node --check workbook.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit verified source
        run: |
          rm source_role_patch.py
          rm .github/workflows/apply-source-role-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Align external source authority and evidentiary roles'
          git push origin HEAD:practical-100/source-role-closure