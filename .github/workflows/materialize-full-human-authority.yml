name: Materialize complete human-authority carry-forward
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Materialize complete human-authority carry-forward')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Carry complete human authority into non-isolated stage prompts
        shell: python
        run: |
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          old="const carryForwardHumanFields=new Set(['JOB_TITLE','JOB_OWNER','REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','AVAILABLE_TOOLS','PROHIBITED_ACTIONS']);"
          new="const carryForwardHumanFields=new Set(humanFieldNames);"
          if old not in s:
              raise SystemExit('prompt-engine carry-forward target not found')
          s=s.replace(old,new,1)
          oldv="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/51';"
          if oldv in s:
              s=s.replace(oldv,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/52';",1)
          p.write_text(s)
          r=Path('README.md')
          t=r.read_text()
          t=t.replace('Project schema: `closed-loop-project/2`.','Project schema: `closed-loop-project/3`.')
          t=t.replace('Response schema: `closed-loop-stage-response/2`.','Response schema: `closed-loop-stage-response/3`.')
          t=t.replace('The deterministic legacy migration is `human-project/30` → `closed-loop-project/2`.','The deterministic migration path is `human-project/30` → `closed-loop-project/2` → `closed-loop-project/3`; a direct legacy-to-/3 migration is valid only when it produces the same canonical result and auditability.')
          r.write_text(t)
      - name: Update shared runtime cache identity
        shell: python
        run: |
          from pathlib import Path
          replacements={
            'index.html':('runtime-20260830-live-operator-57','runtime-20260830-live-operator-58'),
            'app-core.js':('runtime-20260830-live-operator-56','runtime-20260830-live-operator-58'),
          }
          for name,(old,new) in replacements.items():
              p=Path(name); s=p.read_text()
              if old not in s: raise SystemExit(f'{name}: cache token target not found')
              p.write_text(s.replace(old,new))
      - name: Commit source repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B fix/full-human-authority-carry-forward-source-20260830
          git add prompt-engine.js README.md index.html app-core.js
          git commit -m 'Carry complete human authority through stage prompts'
          git push --force origin fix/full-human-authority-carry-forward-source-20260830
# trigger materialization after required PR check
