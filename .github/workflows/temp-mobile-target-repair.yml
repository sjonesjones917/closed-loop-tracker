name: Temporary mobile acceptance target repair

on:
  push:
    branches:
      - fix/mobile-acceptance-target-persistence-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mobile-acceptance-target-persistence-20260910
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply scoped Stage 30 target persistence repair
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mobile_patch.py <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one source fragment, found {count}')
              s=s.replace(old,new,1)

          once("async function saveAcceptanceSession(){if(!current?.job?.JOB_ID)return;await projectStore.metaPut(acceptanceSessionKey(current.job.JOB_ID),{version:1,jobId:String(current.job.JOB_ID),...(acceptanceSession||{})});}",
               "async function saveAcceptanceSession(){if(!current?.job?.JOB_ID)return;acceptanceSession={...(acceptanceSession||{}),version:1,jobId:String(current.job.JOB_ID)};await projectStore.metaPut(acceptanceSessionKey(current.job.JOB_ID),acceptanceSession);}",
               'saveAcceptanceSession')
          once("function mobileAcceptanceMarkup(n){if(Number(n)!==30)return '';const probe=acceptanceSession?.probe||null,",
               "function mobileAcceptanceMarkup(n){if(Number(n)!==30)return '';const target=acceptanceSession?.target||null,probe=acceptanceSession?.probe||null,",
               'mobileAcceptanceMarkup target source')
          once('<textarea id="mobile-acceptance-target-json" class="code-text" spellcheck="false"></textarea>',
               '<textarea id="mobile-acceptance-target-json" class="code-text" spellcheck="false">${target?esc(JSON.stringify(target,null,2)):\'\'}</textarea>',
               'mobileAcceptanceMarkup rendered target')

          probe_prefix="async function runMobileCapabilityProbe(){const target=JSON.parse($('#mobile-acceptance-target-json')?.value||'');if(!target?.challenge||!target?.mobileAcceptanceTargetId)throw new Error('Import a pinned mobile acceptance target before running the capability probe.');"
          once(probe_prefix,"async function runMobileCapabilityProbe(){try{const target=sessionBoundMobileAcceptanceTarget({allowUnpersisted:true});",'capability probe target source')
          once("announce(`MOBILE_CAPABILITY_PROBE ${probe.result.toLowerCase()}`);render();}\nasync function recordMobileAcceptanceReceipt(){",
               "announce(`MOBILE_CAPABILITY_PROBE ${probe.result.toLowerCase()}`);render();}catch(error){announce('mobile capability probe blocked');alert(error.message||error);}}\nasync function recordMobileAcceptanceReceipt(){",
               'capability probe failure handling')

          receipt_prefix="async function recordMobileAcceptanceReceipt(){try{const target=JSON.parse($('#mobile-acceptance-target-json')?.value||''),probe=acceptanceSession?.probe;if(!target?.challenge||!probe||probe.challenge!==target.challenge)throw new Error('Run the application-recorded capability probe for the current pinned target first.');"
          once(receipt_prefix,"async function recordMobileAcceptanceReceipt(){try{const target=sessionBoundMobileAcceptanceTarget({requireProbe:true});",'receipt target source')

          measurement_prefix="async function recordMobileAcceptanceMeasurements(){try{const target=JSON.parse($('#mobile-acceptance-target-json')?.value||''),probe=acceptanceSession?.probe;if(!target?.challenge||!probe||probe.challenge!==target.challenge)throw new Error('Run the application-recorded capability probe for the current pinned target first.');const "
          once(measurement_prefix,"async function recordMobileAcceptanceMeasurements(){try{const target=sessionBoundMobileAcceptanceTarget({requireProbe:true}),",'measurement target source')

          export_prefix="async function exportMobileAcceptanceEvidence(){try{const target=JSON.parse($('#mobile-acceptance-target-json')?.value||''),actorEvidence=JSON.parse($('#mobile-acceptance-evidence-json')?.value||''),storedTarget=acceptanceSession?.target,probe=acceptanceSession?.probe,receipts=safe(acceptanceSession?.receipts),measurements=acceptanceSession?.measurements,"
          once(export_prefix,"async function exportMobileAcceptanceEvidence(){try{const target=sessionBoundMobileAcceptanceTarget({requireProbe:true}),actorEvidence=JSON.parse($('#mobile-acceptance-evidence-json')?.value||''),probe=acceptanceSession?.probe,receipts=safe(acceptanceSession?.receipts),measurements=acceptanceSession?.measurements,",'export target source')
          old_binding=";if(!target?.challenge||!actorEvidence?.challenge||!storedTarget||!probe)throw new Error('Import the pinned target, run MOBILE_CAPABILITY_PROBE, and provide actor evidence before export.');for(const field of ['challenge','mobileAcceptanceTargetId','sourceCommit','deploymentManifestDigest','origin','basePath','testProjectId','procedureVersion','deviceModel','iosVersion','safariVersion','safariUserAgent'])if(target[field]!==storedTarget[field]||probe[field]!==target[field])throw new Error(`Acceptance target binding is stale or mismatched: ${field}.`);if(JSON.stringify(target.viewport)!==JSON.stringify(storedTarget.viewport)||JSON.stringify(probe.viewport)!==JSON.stringify(target.viewport))throw new Error('Acceptance target viewport or capability binding is stale or mismatched.')"
          new_binding=";if(!actorEvidence?.challenge||!probe)throw new Error('Run MOBILE_CAPABILITY_PROBE and provide actor evidence before export.')"
          once(old_binding,new_binding,'export persisted-target binding')

          helpers=["function parseMobileAcceptanceTargetControl({required=false}={}){const text=String($('#mobile-acceptance-target-json')?.value||'').trim();if(!text){if(required)throw new Error('Import a pinned mobile acceptance target before continuing.');return null;}let target;try{target=JSON.parse(text);}catch{throw new Error('Pinned mobile acceptance target must be valid JSON.');}if(!target||typeof target!=='object'||Array.isArray(target)||!target.challenge||!target.mobileAcceptanceTargetId)throw new Error('Pinned mobile acceptance target must contain challenge and mobileAcceptanceTargetId.');return target;}", "function assertMobileProbeTargetBinding(target,probe){if(!probe||probe.challenge!==target.challenge||probe.targetId!==target.mobileAcceptanceTargetId)throw new Error('Run the application-recorded capability probe for the persisted pinned target first.');for(const field of ['sourceCommit','deploymentManifestDigest','origin','basePath','testProjectId','procedureVersion','deviceModel','iosVersion','safariVersion','safariUserAgent'])if(probe[field]!==target[field])throw new Error(`Persisted mobile capability probe no longer matches the pinned target: ${field}.`);if(globalThis.closedLoopHash.sha256Value(probe.viewport)!==globalThis.closedLoopHash.sha256Value(target.viewport))throw new Error('Persisted mobile capability probe no longer matches the pinned target viewport.');return probe;}", "function sessionBoundMobileAcceptanceTarget({allowUnpersisted=false,requireProbe=false}={}){const visible=parseMobileAcceptanceTargetControl(),stored=acceptanceSession?.target||null;if(!stored){if(allowUnpersisted)return visible||parseMobileAcceptanceTargetControl({required:true});throw new Error('Run the application-recorded capability probe before continuing the mobile acceptance session.');}if(acceptanceSession?.jobId&&String(acceptanceSession.jobId)!==String(current?.job?.JOB_ID||''))throw new Error('The persisted mobile acceptance target belongs to a different project.');if(visible&&globalThis.closedLoopHash.sha256Value(visible)!==globalThis.closedLoopHash.sha256Value(stored))throw new Error('Visible mobile acceptance target does not match the persisted acceptance-session target.');if(requireProbe)assertMobileProbeTargetBinding(stored,acceptanceSession?.probe);return stored;}"]
          anchor='async function runMobileCapabilityProbe(){'
          if any(h.split('(',1)[0] in s for h in helpers):
              raise SystemExit('unexpected existing mobile target helper before scoped repair')
          idx=s.find(anchor)
          if idx<0:
              raise SystemExit('capability probe anchor not found')
          s=s[:idx]+'\n'.join(helpers)+'\n'+s[idx:]
          p.write_text(s,encoding='utf-8')
          PY
          python3 /tmp/mobile_patch.py
          test "$(git hash-object app-core.js)" = "6a9bb989479c9b3f3e48eeb8c31d8afe8c4af7ca"
          test "$(git hash-object verify-mobile-stage-action.mjs)" = "1be6f629c9e72506f2eb24d7b3a8aa2ea63663c0"
          node --check app-core.js
          node --check verify-mobile-stage-action.mjs
          node verify-mobile-acceptance-target.mjs
          node verify-final-acceptance.mjs
          node verify-mobile-release-governance.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-deployment-manifest.mjs
          rm -f \
            verification/.gitkeep-mobile-acceptance-investigation \
            verification/mobile-acceptance-investigation-note.txt \
            verification/mobile-acceptance-target-persistence-red-regression.txt \
            verification/mobile-acceptance-target-persistence-reproduction.md \
            .github/workflows/temp-mobile-target-repair.yml
          git config user.name "closed-loop repair automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix mobile acceptance target persistence"
          git push origin HEAD:fix/mobile-acceptance-target-persistence-20260910
