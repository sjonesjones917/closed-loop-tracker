name: Apply controller Stage 11 proof

on:
  push:
    branches:
      - controller-stage-11-proof-20260904

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stage11-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage-11-proof-20260904
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply and verify Stage 11 controller proof
        run: |
          set -euo pipefail
          node apply-controller-stage11.mjs
          node verify-build-stage-ledger.mjs
          rm apply-controller-stage11.mjs .github/workflows/controller-stage11-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Prove controller Stage 11 failure tests [stage11-applied]'
          git push origin HEAD:controller-stage-11-proof-20260904
