name: PR6 Stage 8 evidence fix exact
on:
  push:
    branches: [practical-100/pr6-completion]
permissions: {contents: write}
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch validation and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('response-ingestion.js');s=p.read_text()
          a="const target=responseRecordIndex.get(String(reference.tempKey));\n        if(!target)issues.push"
          b="const target=responseRecordIndex.get(String(reference.tempKey));\n        const evidenceTarget=expectedCollection==='evidenceRecords'?evidenceIndex.get(String(reference.tempKey)):null;\n        if(!target&&!evidenceTarget)issues.push"
          assert s.count(a)==1, s.count(a)
          s=s.replace(a,b,1)
          a="else if(target.collection!==expectedCollection)issues.push"
          b="else if(target&&target.collection!==expectedCollection)issues.push"
          assert s.count(a)>=1
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
          rm .github/workflows/pr6-stage8-evidence-fix.yml .github/workflows/pr6-stage8-evidence-fix2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Resolve response-local evidence relationships'
          git push
