name: Repair Stage 11 refinement fixture prerequisite
on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct only the Stage 11 scoped-refinement fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-complete.mjs')
          text=path.read_text(encoding='utf-8')
          old=" const acceptLane=(slot,label)=>{const pr={...prompts.buildPromptRecord(stage,p,{scope:{runId:slot.runId,contextId:slot.contextId}}),generatedAt:new Date().toISOString()};"
          new=" const acceptLane=(slot,label)=>{p.stages[10].status='COMPLETE';p.stages[10].gate={complete:true,blocked:false,reasons:[]};const pr={...prompts.buildPromptRecord(stage,p,{scope:{runId:slot.runId,contextId:slot.contextId}}),generatedAt:new Date().toISOString()};"
          if text.count(old)!=1:
              raise SystemExit(f'Target Stage 11 fixture boundary count: {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/repair-stage11-refinement-fixture.yml
      - name: Prove the fixed boundary and expose the next failure
        shell: bash
        run: |
          set -euo pipefail
          node --check verify-complete.mjs
          set +e
          node verify-complete.mjs > /tmp/verify-complete.log 2>&1
          status=$?
          set -e
          cat /tmp/verify-complete.log
          if grep -Fq 'Stage 11 controlling instruction cannot be generated until Stage 10 is complete' /tmp/verify-complete.log; then
            echo 'Stage 11 fixture prerequisite remains invalid.' >&2
            exit 1
          fi
          echo "verify-complete advanced beyond Stage 11 prerequisite boundary with status ${status}."
      - name: Commit fixture correction and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-complete.mjs .github/workflows/repair-stage11-refinement-fixture.yml
          git diff --cached --check
          git commit -m 'Repair Stage 11 refinement prerequisite fixture'
          git push origin HEAD:fix/zero-loss-controlled-20260831