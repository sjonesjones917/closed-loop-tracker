name: Apply scoped refinement final proof
on:
  push:
    branches: [reliability/scoped-refinement-final-20260826]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/scoped-refinement-final-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact scoped-refinement transform
        run: |
          python3 .repair-scoped-refinement.py
          rm .repair-scoped-refinement.py
      - name: Full deterministic acceptance
        run: |
          node --check workflow-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Chromium acceptance
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Publish exact tested source without temporary scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-scoped-refinement.yml
          git add -A
          git commit -m "Scope accepted-result refinement to the selected target"
          git push origin HEAD:reliability/scoped-refinement-final-20260826
