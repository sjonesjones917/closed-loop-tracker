name: Final semantic cleanup
on:
  push:
    branches: [final-audit-minimum-fixes]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact semantic cleanup
        run: python3 .final-audit-2.py
      - name: Verify deterministic acceptance
        run: |
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit clean result
        run: |
          git rm .final-audit-2.py .github/workflows/final-audit-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js workflow-schema.js prompt-engine.js app-core.js verify-complete.mjs
          git commit -m 'Finish correction selection and source-count semantics'
          git push origin HEAD:final-audit-minimum-fixes
