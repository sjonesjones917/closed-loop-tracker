name: Apply verified lifecycle source closure on candidate 1242
on:
  push:
    branches: [repair/complete-conformance-continuation-20260914]
    paths:
      - .github/workflows/publish-lifecycle-1242.yml
      - verification/lifecycle-source-closure-payload.json
permissions:
  contents: write
concurrency:
  group: lifecycle-source-publication-1242
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'sjonesjones917/closed-loop-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact checked bytes and remove this temporary publisher
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/repair/complete-conformance-continuation-20260914
          test "$(git rev-parse HEAD^)" = 7df7add251fa87c40d87f92eb5641f10a5161a26
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          mkdir -p verification/lifecycle-closure
          node verification/apply-lifecycle-source-closure.mjs | tee verification/lifecycle-closure/applied.json
          git diff --check
          node --check verify-project-lifecycle.mjs
          node --check verify-project-lifecycle-full.mjs
      - name: Replay the complete corrected lifecycle gate
        run: |
          set -euo pipefail
          node verify-project-lifecycle.mjs 2>&1 | tee verification/lifecycle-closure/remote-lifecycle.log
          node verify-infrastructure-route-closure.mjs 2>&1 | tee verification/lifecycle-closure/remote-infrastructure.log
      - name: Commit to the same candidate without bypassing integration
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test ! -f .github/workflows/publish-lifecycle-1242.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair lifecycle source dependency closure; retain executed regression output'
          git push origin "HEAD:$GITHUB_REF"
          echo 'Authored repair committed. A fresh complete pages.yml run against the new head is still required; this publication job is not merge acceptance.'
      - name: Preserve publication and focused replay output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-source-closure-${{ github.sha }}-${{ github.run_id }}
          path: verification/lifecycle-closure/
          if-no-files-found: error
