name: diagnose-capture-semantics-v6

on:
  push:
    branches:
      - fix/controlling-spec-zero-loss-20260830
    paths:
      - .github/workflows/diagnose-capture-semantics-v6.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-zero-loss-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply final guarded corrections
        run: python3 tools/finalize_capture_once_v3.py
      - name: Capture semantic test outputs
        run: |
          set +e
          : > semantic-diagnostic.log
          for test in verify-intent-capture.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs; do
            echo "===== $test =====" >> semantic-diagnostic.log
            node "$test" >> semantic-diagnostic.log 2>&1
            echo "EXIT=$?" >> semantic-diagnostic.log
          done
          cat semantic-diagnostic.log
          exit 0
      - name: Commit exact diagnostic
        run: |
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add semantic-diagnostic.log
          git commit -m 'Record exact capture semantic regression failure'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
