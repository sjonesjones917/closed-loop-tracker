name: Narrow locked reviewer context presentation

on:
  push:
    branches:
      - finish/live-human-gate-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Keep only the Stage 09 locked reviewer prerequisite discoverable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app-core.js')
          text=path.read_text()
          old="function reviewerContextMarkup(n,locked){if(!reviewerOperation(n))return '';"
          new="function reviewerContextMarkup(n,locked){if(!reviewerOperation(n)||(locked&&Number(n)!==9))return '';"
          if old not in text:
              raise SystemExit('Reviewer lock scope target not found')
          path.write_text(text.replace(old,new,1))
          self_path=Path('.github/workflows/narrow-reviewer-context-lock.yml')
          if self_path.exists(): self_path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js .github/workflows
          git commit -m "Scope locked reviewer prerequisite to Stage 09"
          git push origin HEAD:finish/live-human-gate-20260830