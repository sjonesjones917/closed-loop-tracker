name: One-time operation stageData isolation repair
on:
  push:
    branches: [operation-stage-data-isolation-20260826]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operation-stage-data-isolation-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal operation authority correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. The schema is the sole authority for operation-specific stageData permissions.
          path=Path('workflow-schema.js')
          text=path.read_text()
          start=text.index('const OPERATION_CONTRACT_OVERRIDES=')
          end=text.index('\n\nconst HUMAN_INTAKE_FIELDS',start)
          replacement="""const OPERATION_CONTRACT_OVERRIDES=Object.freeze({
            17:Object.freeze({
              FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions'],agentWritableCollections:[],agentStageFields:['NEW_FROZEN_VERSIONS','OLD_CONVERSATIONS_CONTINUED','RUN_NAMESPACE','IDENTICAL_PACKAGE_CONFIRMED_FOR_ALL_RUNS','PRIOR_OUTPUTS_WITHHELD']}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],agentStageFields:[]}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],agentStageFields:[]}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],agentStageFields:['EXECUTE_COMPLETED','VERIFY_COMPLETED','COMPARE_COMPLETED']}),
              ROOT_CAUSE:Object.freeze({readCollections:['defects','comparisons','verification'],agentWritableCollections:['defects','rootCauses'],agentStageFields:['ROOT_CAUSE_COMPLETED']}),
              REGRESSION:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions'],agentWritableCollections:['regressions','regressionExecutions'],agentStageFields:['REGRESSION_TESTS_ADDED']}),
              CORRECT:Object.freeze({readCollections:['defects','rootCauses','regressions','regressionExecutions','changes'],agentWritableCollections:['changes'],agentStageFields:['CORRECTIONS_COMPLETED']})
            }),
            19:Object.freeze({
              CONFIRM_FREEZE:Object.freeze({readCollections:['convergenceRecords','candidateFreezes','iterations'],agentWritableCollections:[],agentStageFields:[]}),
              EXECUTE_RUN:Object.freeze({readCollections:['candidateFreezes','iterations','runs','freshContexts'],agentWritableCollections:['runs'],agentStageFields:[]}),
              VERIFY:Object.freeze({readCollections:['runs','requirements','tests','freshContexts'],agentWritableCollections:['verification'],agentStageFields:[]}),
              COMPARE:Object.freeze({readCollections:['verification','runs','requirements'],agentWritableCollections:['comparisons'],agentStageFields:['CROSS_RUN_COMPARISON_COMPLETED']}),
              REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs'],agentWritableCollections:['regressionExecutions'],agentStageFields:[]}),
              CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','regressionExecutions','candidateFreezes'],agentWritableCollections:['confirmationRecords'],agentStageFields:['COMPLETE_TEST_SUITE_RUN','NEW_CRITICAL_DEFECTS','NEW_MAJOR_DEFECTS','NEW_REQUIREMENTS_DISCOVERED','INJECTED_DEFECTS_NOT_DETECTED','NEW_CORRECTNESS_AFFECTING_VARIANCE','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED','REQUIRED_RETURN_STAGE']})
            })
          });
          function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};let scopeRequirements=override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[];if((stage===17||stage===19)&&!['EXECUTE_RUN','VERIFY'].includes(operation))scopeRequirements=scopeRequirements.filter(key=>key!=='runId'&&key!=='contextId');return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),agentStageFields:Object.freeze(override.agentStageFields||allowedAgentStageFields(stage)),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(scopeRequirements)});}"""
          text=text[:start]+replacement+text[end:]
          path.write_text(text)

          # 2. Generated prompts and their contract hash must expose the exact operation-specific stageData authority.
          path=Path('prompt-engine.js')
          text=path.read_text()
          old="const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation),writable=op?.agentWritableCollections||contract.agentWritableCollections;\n const stageData=Object.fromEntries(contract.allowedStageData.map(name=>[name,responseFieldContract(schema.STAGE_FIELDS[stage][name])]));"
          new="const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation),writable=op?.agentWritableCollections||contract.agentWritableCollections,stageFields=op?.agentStageFields||contract.allowedStageData;\n const stageData=Object.fromEntries(stageFields.map(name=>[name,responseFieldContract(schema.STAGE_FIELDS[stage][name])]));"
          if old not in text: raise SystemExit('prompt descriptor anchor not found')
          text=text.replace(old,new,1)
          old="agentStageFields:[...contract.allowedStageData]"
          if old not in text: raise SystemExit('prompt agentStageFields anchor not found')
          text=text.replace(old,"agentStageFields:[...stageFields]",1)
          old="const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation||contract.operations[0]);\n const fields=contract.allowedStageData.length?contract.allowedStageData.map(x=>{const d=schema.STAGE_FIELDS[stage][x];return `- ${x}: ${d.valueType}${d.enumValues?.length?` enum(${d.enumValues.join(' | ')})`:''}${d.nullable?' nullable':''}`;}).join('\\n'):'- No agent-owned stageData fields; use permitted records/evidence only.';"
          new="const contract=schema.STAGE_CONTRACTS[stage],op=schema.operationContract(stage,operation||contract.operations[0]),stageFields=op?.agentStageFields||contract.allowedStageData;\n const fields=stageFields.length?stageFields.map(x=>{const d=schema.STAGE_FIELDS[stage][x];return `- ${x}: ${d.valueType}${d.enumValues?.length?` enum(${d.enumValues.join(' | ')})`:''}${d.nullable?' nullable':''}`;}).join('\\n'):'- No agent-owned stageData fields for this operation; use permitted records/evidence only.';"
          if old not in text: raise SystemExit('prompt body field anchor not found')
          text=text.replace(old,new,1)
          path.write_text(text)

          # 3. Ingestion enforces operation scope separately from ownership so recovery diagnostics are truthful.
          path=Path('response-ingestion.js')
          text=path.read_text()
          old="const allowedStageData=new Set(contract?.allowedStageData||[]);"
          if old not in text: raise SystemExit('ingestion allowedStageData anchor not found')
          text=text.replace(old,"const allowedStageData=new Set(operationContract?.agentStageFields||contract?.allowedStageData||[]);",1)
          old="if(!allowedStageData.has(name)||!schema.authorizeMutation({fieldDefinition:definition,actor:'AGENT',mutationType:'RESPONSE_INGESTION'}).authorized)issues.push(issue('FIELD_OWNERSHIP_VIOLATION',path,`${name} is owned by ${definition.producer}, not the external agent.`));"
          new="const authorized=schema.authorizeMutation({fieldDefinition:definition,actor:'AGENT',mutationType:'RESPONSE_INGESTION'}).authorized;\n      if(!authorized)issues.push(issue('FIELD_OWNERSHIP_VIOLATION',path,`${name} is owned by ${definition.producer}, not the external agent.`));\n      else if(!allowedStageData.has(name))issues.push(issue('OPERATION_SCOPE_VIOLATION',path,`${name} is agent-owned but is not writable during operation ${expectedOperation}.`));"
          if old not in text: raise SystemExit('ingestion ownership anchor not found')
          text=text.replace(old,new,1)
          path.write_text(text)

          # 4. First-class semantic proof: prompt contract and schema agree on operation-specific stage fields.
          path=Path('verify-prompt-semantics.mjs')
          text=path.read_text()
          anchor="if(!arraysEqual(descriptor.agentWritableCollections||[],op?.agentWritableCollections||[]))issues.push('WRITE_COLLECTION_CONTRADICTION');"
          if anchor not in text: raise SystemExit('semantic descriptor anchor not found')
          text=text.replace(anchor,anchor+"\n  if(!arraysEqual(descriptor.agentStageFields||[],op?.agentStageFields||[]))issues.push('WRITE_STAGE_FIELD_CONTRADICTION');",1)
          anchor="let checked=0;"
          mapping="""const expectedOperationStageFields={
            17:{FREEZE:['NEW_FROZEN_VERSIONS','OLD_CONVERSATIONS_CONTINUED','RUN_NAMESPACE','IDENTICAL_PACKAGE_CONFIRMED_FOR_ALL_RUNS','PRIOR_OUTPUTS_WITHHELD'],EXECUTE_RUN:[],VERIFY:[],COMPARE:['EXECUTE_COMPLETED','VERIFY_COMPLETED','COMPARE_COMPLETED'],ROOT_CAUSE:['ROOT_CAUSE_COMPLETED'],REGRESSION:['REGRESSION_TESTS_ADDED'],CORRECT:['CORRECTIONS_COMPLETED']},
            19:{CONFIRM_FREEZE:[],EXECUTE_RUN:[],VERIFY:[],COMPARE:['CROSS_RUN_COMPARISON_COMPLETED'],REGRESSION_VERIFY:[],CONFIRM:['COMPLETE_TEST_SUITE_RUN','NEW_CRITICAL_DEFECTS','NEW_MAJOR_DEFECTS','NEW_REQUIREMENTS_DISCOVERED','INJECTED_DEFECTS_NOT_DETECTED','NEW_CORRECTNESS_AFFECTING_VARIANCE','CONFIRMATION_ACCEPTANCE_CRITERIA_SATISFIED','REQUIRED_RETURN_STAGE']}
          };
          for(const [stage,operations] of Object.entries(expectedOperationStageFields))for(const [operation,fields] of Object.entries(operations)){const op=schema.operationContract(Number(stage),operation);if(!arraysEqual(op.agentStageFields,fields))throw new Error(`Stage ${stage} ${operation} has semantically wrong writable stage fields: ${op.agentStageFields.join(', ')}`);const descriptor=prompts.responseContractDescriptor(Number(stage),operation);if(!arraysEqual(descriptor.agentStageFields,fields))throw new Error(`Stage ${stage} ${operation} prompt contract exposes wrong stage fields.`);}
          {
            const p=baseProject(),compare=prompts.buildPromptRecord(17,p,{operation:'COMPARE'}),correct=prompts.buildPromptRecord(17,p,{operation:'CORRECT'});
            if(compare.prompt.includes('- CORRECTIONS_COMPLETED:'))throw new Error('Stage 17 COMPARE prompt exposes CORRECT stageData.');
            if(!correct.prompt.includes('- CORRECTIONS_COMPLETED:'))throw new Error('Stage 17 CORRECT prompt omits its correction summary field.');
          }
          """
          if anchor not in text: raise SystemExit('semantic insertion anchor not found')
          text=text.replace(anchor,mapping+anchor,1)
          path.write_text(text)

          # 5. Negative ingestion proof: an agent-owned field from another sub-operation must be rejected as scope leakage.
          path=Path('verify-ingestion.mjs')
          text=path.read_text()
          anchor="// Duplicate response is semantic, not whitespace-sensitive."
          test="""// Operation-specific stageData authority: agent ownership does not imply cross-operation write authority.
          {
            const p=project('JOB-NEG-OPERATION-STAGE-DATA'),stage=17,pr={...prompts.buildPromptRecord(stage,p,{operation:'COMPARE'}),generatedAt:new Date().toISOString()};
            p.projectData.generatedPrompts.push(pr);
            const e={schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage,operation:'COMPARE',promptIdentity:{instructionId:pr.instructionId,bodySha256:pr.bodySha256,contractSha256:pr.contractSha256,contextSignature:pr.contextSignature},scope:pr.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{CORRECTIONS_COMPLETED:'YES'},records:{},evidence:[{temporaryKey:'evidence-op-scope',kind:'WORKFLOW_EVIDENCE',description:'Cross-operation scope fixture',location:'verification fixture',content:'Agent-owned field belongs to CORRECT, not COMPARE.'}],unresolved:[],warnings:[],attachments:[]};
            const prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});
            if(prepared.validation.valid||!prepared.validation.issues.some(i=>i.code==='OPERATION_SCOPE_VIOLATION'&&i.path==='/stageData/CORRECTIONS_COMPLETED'))throw new Error(`Cross-operation stageData was not rejected correctly: ${JSON.stringify(prepared.validation.issues)}`);
            if(prepared.project.projectData.acceptedChanges.length)throw new Error('Cross-operation stageData mutated canonical state.');
            negativeCount++;
          }

          """
          if anchor not in text: raise SystemExit('ingestion test insertion anchor not found')
          text=text.replace(anchor,test+anchor,1)
          path.write_text(text)
          PY
      - name: Verify exact branch
        shell: bash
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified correction and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-operation-stage-data-isolation.yml
          git add workflow-schema.js prompt-engine.js response-ingestion.js verify-prompt-semantics.mjs verify-ingestion.mjs
          git commit -m 'Enforce operation-specific stageData authority'
          git push origin HEAD:operation-stage-data-isolation-20260826
