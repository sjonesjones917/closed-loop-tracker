name: Exact SHA final v3 acceptance
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths:
      - .github/workflows/v3-final-acceptance.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: closed-loop-v3-exact-final
  cancel-in-progress: false
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align source and acceptance to controlling v3 specification
        run: |
          node - <<'NODE'
          const fs=require('fs'),c=require('crypto');
          let w=fs.readFileSync('workbook.js','utf8').replace("'REVISE THE RESPONSIBLE LAYER'","'CORRECT THE ROOT CAUSE'");
          fs.writeFileSync('workbook.js',w);
          let r=fs.readFileSync('test-runtime.js','utf8').replace('approximate comparison requires a positive absoluteTolerance or relativeTolerance.','approximate comparison requires a positive tolerance: absoluteTolerance or relativeTolerance.');
          fs.writeFileSync('test-runtime.js',r);
          let v=fs.readFileSync('verify.mjs','utf8').replace("'Revise the Responsible Layer'","'Correct the Root Cause'");
          fs.writeFileSync('verify.mjs',v);
          let p=fs.readFileSync('verify-prompt-semantics.mjs','utf8');
          p=p.replace("  if(!record.prompt.includes('PATENT / REGULATED FILING'))issues.push('PATENT_DOMAIN_RULE_MISSING');\n",'');
          p=p.replace("  if(!record.prompt.includes('SOFTWARE / MULTI-FILE SYSTEM'))issues.push('SOFTWARE_DOMAIN_RULE_MISSING');\n",'');
          p=p.replace("  if(!record.prompt.includes('BUILDING / ARCHITECTURE / AEC'))issues.push('BUILDING_DOMAIN_RULE_MISSING');\n",'');
          p=p.replace("  if(!record.prompt.includes('PHYSICAL / MECHANICAL / CAD / CAM / CNC / ADDITIVE'))issues.push('PHYSICAL_ENGINEERING_DOMAIN_RULE_MISSING');\n",'');
          p=p.replace("    if(!record.prompt.includes('STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY')||!record.prompt.includes('Do not perform source discovery, source research, requirement derivation, verification design, production-instruction authoring, implementation, artifact production'))issues.push('STAGE01_DOMAIN_INTAKE_BOUNDARY_MISSING');",
            "    if(!record.prompt.includes('STAGE 01 SUBJECT-NEUTRAL INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY')||!record.prompt.includes('Derive the human-authority questions from this job')||!record.prompt.includes('Do not use a hard-coded catalogue of project subjects or domain labels')||!record.prompt.includes('Do not perform source discovery, external-authority analysis, requirement atomization, verification design, production-instruction authoring, implementation, artifact production'))issues.push('STAGE01_SUBJECT_NEUTRAL_INTAKE_BOUNDARY_MISSING');");
          p=p.replace("  }else if(!record.prompt.includes('ARTIFACT GENERATION VS DOWNSTREAM EXECUTION')||!record.prompt.includes('must not be represented as completed'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');",
            "  }else if(!record.prompt.includes('SUBJECT-NEUTRAL DELIVERABLE ADAPTATION')||!record.prompt.includes('never claim downstream import, compilation, simulation, manufacturing, filing, deployment, physical performance, or other execution unless it actually occurred and is evidenced'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');");
          p=p.replace("    if(!record.prompt.includes('MANDATORY STAGE 01 HUMAN-INTAKE GATE')||!record.prompt.includes('BLOCKING_NOW')||!record.prompt.includes('ASK_NOW_NONBLOCKING')||!record.prompt.includes('LATER_RESOLVABLE')||!record.prompt.includes('Nonblocking means the human may defer; it does not mean the agent may skip the question')||!record.prompt.includes('intended jurisdiction(s)')||!record.prompt.includes('additional human-controlled invention materials exist'))issues.push('STAGE01_PROACTIVE_HUMAN_INTAKE_GATE_MISSING');",
            "    if(!record.prompt.includes('MANDATORY STAGE 01 HUMAN-INTAKE GATE')||!record.prompt.includes('BLOCKING_NOW')||!record.prompt.includes('ASK_NOW_NONBLOCKING')||!record.prompt.includes('LATER_RESOLVABLE')||!record.prompt.includes('Nonblocking means the human may defer; it does not mean the agent may skip the question')||!record.prompt.includes('Ask BLOCKING_NOW and ASK_NOW_NONBLOCKING questions in normal chat before the final machine response'))issues.push('STAGE01_PROACTIVE_HUMAN_INTAKE_GATE_MISSING');");
          fs.writeFileSync('verify-prompt-semantics.mjs',p);
          let h=fs.readFileSync('index.html','utf8');
          const files=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=f=>{const b=fs.readFileSync(f);return c.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(f=>`${f}:${blob(f)}\n`).join('');
          const token='runtime-'+c.createHash('sha256').update(manifest).digest('hex').slice(0,16);
          h=h.replace(/v=[^\"]+/g,'v='+token);
          fs.writeFileSync('index.html',h);
          NODE
      - name: Syntax
        run: for file in *.js *.mjs; do node --check "$file"; done
      - name: Schema and ownership architecture
        run: node verify.mjs
      - name: Migration
        run: node verify-v3-migration.mjs
      - name: Test IR validation security limits and deterministic runtime
        run: |
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
      - name: Raw-first ingestion
        run: node verify-ingestion.mjs
      - name: Workflow gates and full cycle
        run: |
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Prompt isolation subject neutrality and semantic proof
        run: |
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
      - name: Definition of done and lifecycle
        run: |
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only if tested SHA is still branch tip
        run: |
          git fetch origin implementation/closed-loop-v3
          TESTED_SHA="${GITHUB_SHA}"
          REMOTE_SHA="$(git rev-parse origin/implementation/closed-loop-v3)"
          test "$REMOTE_SHA" = "$TESTED_SHA"
          rm -f .github/workflows/v3-final-acceptance.yml
          git config user.name closed-loop-finalizer
          git config user.email closed-loop-finalizer@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Align and prove closed-loop v3 implementation against exact source SHA'
          git push origin HEAD:implementation/closed-loop-v3
