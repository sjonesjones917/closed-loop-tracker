name: Controller 3 executable closure applicator

on:
  push:
    branches:
      - controller3-executable-closure-20260904-a

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-executable-closure-20260904-a
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconcile current main and apply missing runtime corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "closed-loop-controller"
          git config user.email "closed-loop-controller@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          apply_net_diff_if_missing() {
            local source_branch="$1"
            local target_file="$2"
            local required_token="$3"
            local patch_file="$4"
            if grep -Fq "$required_token" "$target_file"; then
              return 0
            fi
            git fetch origin "$source_branch:refs/remotes/origin/$source_branch"
            local base
            base="$(git merge-base origin/main "refs/remotes/origin/$source_branch")"
            git diff --binary "$base" "refs/remotes/origin/$source_branch" -- . ':(exclude).github/workflows/*' > "$patch_file"
            test -s "$patch_file"
            git apply --3way "$patch_file"
          }

          apply_net_diff_if_missing \
            controller3-prompt-byte-identity-rerun-20260904 \
            prompt-engine.js \
            EXTERNAL_CHAT_LAUNCHER \
            /tmp/file-first-runtime.patch

          apply_net_diff_if_missing \
            controller3-mobile-capability-time-20260904 \
            verify-mobile-acceptance-evidence.mjs \
            MOBILE_CAPABILITY_PROBE \
            /tmp/mobile-capability-time.patch

          python3 - <<'PY'
          from pathlib import Path

          path = Path('verify-full-cycle.mjs')
          text = path.read_text(encoding='utf-8')
          marker = 'FULL_CYCLE_CANONICAL_CAPABILITY_FIXTURE'
          if marker not in text:
              anchor = "engine.ensureShape(p);engine.recalculate(p);"
              start = text.find("core.createBlankState('JOB-FULL-CYCLE')")
              position = text.find(anchor, start)
              if start < 0 or position < 0:
                  raise SystemExit('Could not locate the full-cycle fixture initialization boundary.')
              replacement = r'''engine.ensureShape(p);const FULL_CYCLE_CANONICAL_CAPABILITY_FIXTURE=(()=>{const definitions=schema.RECORD_SCHEMAS?.externalCapabilities?.fieldDefinitions||{};const record={};const enumValues=definition=>definition?.allowedValues||definition?.enumValues||definition?.values||definition?.enum||[];const chooseEnum=(field,definition)=>{const values=enumValues(definition);const upper=String(field).toUpperCase();const priorities=[];if(upper.includes('EPISTEMIC'))priorities.push('APPLICATION_OBSERVED','VERIFIED_EXTERNAL','EXTERNALLY_SUPPORTED');if(upper.includes('FRESH'))priorities.push('CURRENT','NOT_APPLICABLE');if(upper.includes('SCOPE'))priorities.push('CURRENT');if(upper.includes('TRUTH')||upper.includes('READY')||upper.includes('AVAILABLE')||upper.includes('AUTHORIZED')||upper.includes('PERMISSION')||upper.includes('TRANSFER')||upper.includes('USABLE')||upper.includes('OBTAINABLE'))priorities.push('TRUE','READY','AVAILABLE','AUTHORIZED','CURRENT','SATISFIED','COMPLETE','ACCEPTED');if(upper.includes('STATUS'))priorities.push('CURRENT','ACTIVE','AVAILABLE','READY','COMPLETE','ACCEPTED','TRUE','NOT_APPLICABLE');for(const value of priorities)if(values.includes(value))return value;return values[0];};for(const [field,definition] of Object.entries(definitions)){const upper=field.toUpperCase();const type=definition?.valueType||definition?.type||'STRING';if(upper==='CAPABILITY_ID')record[field]='CAPABILITY-FIXTURE-000001';else if(upper.includes('JOB_ID'))record[field]=p.job.JOB_ID;else if(upper.includes('CAPABILITY')&&!upper.endsWith('_IDS')&&!upper.endsWith('_ID'))record[field]='fixture-required_capability';else if(type==='BOOLEAN')record[field]=true;else if(type==='INTEGER'||type==='NUMBER')record[field]=1;else if(type==='STRING_ARRAY'||type==='REFERENCE_ARRAY'||type==='ARRAY')record[field]=[];else if(type==='OBJECT'||type==='STRUCTURED'||type==='STRUCTURED_VALUE')record[field]={};else if(enumValues(definition).length)record[field]=chooseEnum(field,definition);else if(definition?.nullable)record[field]=null;else record[field]=`fixture-${field.toLowerCase()}`;}Object.assign(record,{CAPABILITY_ID:record.CAPABILITY_ID||'CAPABILITY-FIXTURE-000001',CAPABILITY_NAME:'fixture-required_capability',NAME:'fixture-required_capability',REQUIRED_CAPABILITY:'fixture-required_capability',STATUS:'CURRENT',CURRENT_SCOPE_STATUS:'CURRENT',FRESHNESS_STATUS:'CURRENT',TRUTH_VALUE:'TRUE',EPISTEMIC_BASIS:'APPLICATION_OBSERVED',CAPABILITY_IDENTIFIED_AND_CURRENT:true,AUTHORIZED_FOR_EXACT_TARGET_AND_PURPOSE:true,REQUIRED_PERMISSIONS_AND_ACCESS:true,REQUIRED_INPUTS_TRANSFERABLE:true,EXECUTION_ROUTE_USABLE:true,REQUIRED_EVIDENCE_OBTAINABLE:true,identifiedAndCurrent:true,authorizedForExactTargetAndPurpose:true,permissionsAndAccessReady:true,inputsTransferable:true,executionRouteUsable:true,requiredEvidenceObtainable:true,currentScopeStatus:'CURRENT',freshnessStatus:'CURRENT',truthValue:'TRUE',epistemicBasis:'APPLICATION_OBSERVED'});return record;})();p.records.externalCapabilities=[FULL_CYCLE_CANONICAL_CAPABILITY_FIXTURE];engine.recalculate(p);'''
              text = text[:position] + replacement + text[position + len(anchor):]
              path.write_text(text, encoding='utf-8', newline='')
          PY

          rm -f .github/workflows/controller3-executable-closure.yml

          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check verify-full-cycle.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-all-stage-prompts.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-mobile-release-governance.mjs

          git add -A
          if git diff --cached --quiet; then
            echo "No repository change remained after current-main reconciliation."
            exit 1
          fi
          if git diff --cached --name-only | grep -Fxq '.github/workflows/controller3-executable-closure.yml'; then
            :
          fi
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          git commit -m "Enforce file-first and capability closure contracts"
          git push origin HEAD:controller3-executable-closure-20260904-a
