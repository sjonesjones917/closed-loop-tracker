name: Refresh runtime bundle token
on:
  push:
    branches:
      - reliability/execution-evidence-independence-v2
permissions:
  contents: write
concurrency:
  group: reliability-runtime-token
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/execution-evidence-independence-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update exact shared runtime identity
        run: |
          set -euo pipefail
          sed -i 's/runtime-77bc343d667df7b4/runtime-9af50601f4720527/g' index.html
          test "$(grep -o 'runtime-9af50601f4720527' index.html | wc -l)" -eq 8
          test "$(grep -o 'runtime-77bc343d667df7b4' index.html | wc -l)" -eq 0
          node verify-hash.mjs
      - name: Commit runtime identity and remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/update-runtime-token.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: bind runtime cache token to reliability bundle"
          git push origin HEAD:reliability/execution-evidence-independence-v2
