name: One-time runtime token update
on:
  push:
    branches: [closed-loop-test-ir-minimal]
    paths: [.github/workflows/update-runtime-token.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-test-ir-minimal
          fetch-depth: 0
      - name: Update exact shared runtime token
        run: |
          set -euo pipefail
          test "$(grep -o 'runtime-6c6df51ffe89f942' index.html | wc -l)" -eq 8
          sed -i 's/runtime-6c6df51ffe89f942/runtime-ab455a96964da1d4/g' index.html
          test "$(grep -o 'runtime-ab455a96964da1d4' index.html | wc -l)" -eq 8
          node verify-hash.mjs
      - name: Commit token repair
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: align runtime cache token with exact bundle"
          git push origin HEAD:closed-loop-test-ir-minimal
