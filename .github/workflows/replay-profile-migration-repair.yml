name: Replay proven profile migration repair

on:
  push:
    branches: [fix/profile-migration-contract-20260903-r2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/profile-migration-contract-20260903-r2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only the proven implementation and regression diff
        run: |
          set -euo pipefail
          git diff 37dcd34f7e1f792e5554bac25e3687724a031096 337222bd5800819631a8b7f41d5cd9c4ca1b5809 -- workbook.js workflow-schema.js verify-v3-migration.mjs > /tmp/profile-migration.patch
          test -s /tmp/profile-migration.patch
          git apply --3way /tmp/profile-migration.patch
      - name: Prove repair on current main
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check workflow-schema.js
          node --check verify-v3-migration.mjs
          node verify-v3-migration.mjs
          node verify.mjs
      - name: Commit repaired owners and remove scaffold
        run: |
          set -euo pipefail
          git rm .github/workflows/replay-profile-migration-repair.yml
          git add workbook.js workflow-schema.js verify-v3-migration.mjs
          git config user.name 'closed-loop repair'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fail closed on pre-profile project migration'
          git push origin HEAD:fix/profile-migration-contract-20260903-r2
