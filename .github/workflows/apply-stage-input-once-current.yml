name: Apply Stage 01 03 04 one-time intake fix on current main
on:
  push:
    branches: ['fix/stage-input-once-current']
    paths:
      - apply-stage-input-once.mjs
      - prepare-stage-input-once.mjs
      - .github/workflows/apply-stage-input-once-current.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-stage-input-once-current
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/stage-input-once-current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct the one-time applicator
        run: node prepare-stage-input-once.mjs
      - name: Apply exact source and regression changes
        run: node apply-stage-input-once.mjs
      - name: Rebuild retained test project
        run: node build-test-project.mjs
      - name: Syntax check changed runtime and proof files
        run: |
          node --check prompt-engine.js
          node --check workflow-engine.js
          node --check app-core.js
          node --check verify-stage-input-once.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-complete.mjs
          node --check verify-browser.mjs
      - name: Prove one-time intake and canonical Stage 04 context
        run: node verify-stage-input-once.mjs
      - name: Run prompt, gate, architecture, and mobile regressions
        run: |
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
          node verify.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-mobile-stage-action.mjs
      - name: Commit and push verified implementation
        run: |
          rm apply-stage-input-once.mjs
          rm prepare-stage-input-once.mjs
          git checkout -- .github/workflows/pages.yml
          git config user.name 'closed-loop-fix-bot'
          git config user.email 'closed-loop-fix-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Stage 01 03 04 to use one-time canonical intake'
          git push origin HEAD:fix/stage-input-once-current
