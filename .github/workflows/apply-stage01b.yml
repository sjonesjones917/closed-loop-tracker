name: Apply staged Build Stage 01 governance source

on:
  push:
    branches: [controller-v2-stage01b-governance-20260904]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply and verify exact staged source
        run: |
          set -euo pipefail
          cat .stage01b-payload.00 .stage01b-payload.01 .stage01b-payload.02 .stage01b-payload.03 .stage01b-payload.04 .stage01b-payload.05 .stage01b-payload.06 > /tmp/stage01b.b64
          test "$(wc -c </tmp/stage01b.b64)" -eq 30552
          echo "cd59e67592f540e729103adf41071b4e589c1a741c316347b064f8391a7ea51b  /tmp/stage01b.b64" | sha256sum -c -
          base64 -d /tmp/stage01b.b64 > /tmp/stage01b.tar.gz
          echo "2281ff87159986780d24b91029640eb8060a0f22235cbf3df72f9126f2eff17a  /tmp/stage01b.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stage01b.tar.gz
          git checkout HEAD -- .github/workflows/pages.yml
          rm -f .stage01b-payload.00 .stage01b-payload.01 .stage01b-payload.02 .stage01b-payload.03 .stage01b-payload.04 .stage01b-payload.05 .stage01b-payload.06
          node --check generate-specification-governance.mjs
          node --check review-specification-coverage.mjs
          node --check verify-specification-governance.mjs
          node --check generate-stage01-proof.mjs
          node --check verify-build-stage-state.mjs
          node verify-build-stage-state.mjs --self-test
          node verify-specification-governance.mjs
          node verify-deployment-manifest.mjs
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add -A
          git commit -m "Build Stage 01: establish controller v2 governance proof source"
          git push origin HEAD:controller-v2-stage01b-governance-20260904
