          PY
          cat > verify-stage01-stage04-zero-loss.mjs <<'EOF'
          import fs from 'node:fs'; import vm from 'node:vm';
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}}; globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const f of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine,A=(v,m)=>{if(!v)throw new Error(m)},p=core.createBlankState('JOB-ZERO-LOSS');
          Object.assign(p.job,{JOB_TITLE:'Zero loss',JOB_OWNER:'Operator',EXACT_USER_OBJECTIVE_VERBATIM:'Build exactly what I supplied without making me repeat it.',SUPPLIED_MATERIALS_INVENTORY:'intent.txt',REQUIRED_OUTPUT_FORMAT:'Working application',PROHIBITED_ACTIONS:'Do not change unrelated visuals.',EXPLICIT_USER_REQUIREMENTS:'Reuse accepted Stage 01 meaning.',CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'SOURCE-SET-v001'});engine.ensureShape(p);
          p.projectData.artifacts.push({id:'ARTIFACT-000001',stage:1,active:true,scope:{inputVersion:'INPUT-v001'},fields:{ARTIFACT_ID:'ARTIFACT-000001',FILENAME:'intent.txt',MEDIA_TYPE:'text/plain',BYTE_SIZE:122,SHA256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',ROLE:'SUPPLIED_PROJECT_INPUT',AVAILABILITY:'BYTES_PERSISTED_AND_VERIFIED'},relationships:{},evidenceRefs:[]});p.stages[1].authorizedFiles=[{artifactId:'ARTIFACT-000001',filename:'intent.txt'}];p.projectData.userEntered.suppliedArtifactText={'ARTIFACT-000001':{text:'KEEP THE PROMPT BOX SIZE UNCHANGED.\nTHE USER SUPPLIES PROJECT INFORMATION ONCE.\nSTAGE 4 MUST USE ALL STAGE 1 AND STAGE 3 DATA.'}};
          const m=engine.intakeCoverageManifest(p),u=m.units.filter(x=>x.kind==='SUPPLIED_MATERIAL_CONTENT');A(u.length===3,'stored file content not enumerated');A(u.every(x=>x.artifactId==='ARTIFACT-000001'),'artifact provenance lost');const s1=prompts.buildPromptRecord(1,p,{operation:'COMPLETE'});A(s1.prompt.includes('first semantic reader')&&s1.prompt.includes('Pass 1')&&s1.prompt.includes('Pass 2'),'Stage 01 semantic boundary missing');A(s1.prompt.includes('KEEP THE PROMPT BOX SIZE UNCHANGED.'),'file text missing from Stage 01');A(s1.prompt.includes('ARTIFACT-000001'),'Stage 01 file handoff missing');
          const cap={schema:'closed-loop-stage01-capture/1',inputVersion:m.inputVersion,manifestSha256:m.manifestSha256,units:m.units.map((x,i)=>({sourceUnitId:x.unitId,sourceRawValueSha256:x.rawValueSha256,disposition:'EXTRACTED_RELEVANT_INFORMATION',reason:'',extractedStatements:[{statementKey:`S${i}`,text:x.rawValueText,statementClass:'REQUIREMENT'}]}))};A(engine.evaluateIntakeAccounting(p,{capture:cap}).complete,'new intake contract failed');A(engine.evaluateIntakeAccounting(p,{capture:{...cap,units:cap.units.map(x=>({...x,disposition:'incorporated into the job definition'}))}}).complete,'legacy capture failed');p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Working app',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(cap)};p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true};p.projectData.sources.push({id:'SOURCE-000001',stage:2,active:true,scope:{inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001'},fields:{SOURCE_ID:'SOURCE-000001',TITLE:'Source'},relationships:{},evidenceRefs:[]});p.stages[2].agentData={SOURCE_APPLICABILITY_DETERMINATION:'APPLICABLE_SOURCES_ESTABLISHED'};p.stages[2].status='COMPLETE';p.stages[2].gate={complete:true};p.projectData.research.push({id:'RESEARCH-000001',stage:3,active:true,scope:{inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001'},fields:{RESEARCH_ID:'RESEARCH-000001',SOURCE_ID:'SOURCE-000001',PASS_NUMBER:2,MANDATORY_STATEMENTS:'External rule from Stage 03.',PROHIBITIONS:'External prohibition.',RECOMMENDATIONS:'NONE',OPTIONAL_PRACTICES:'NONE',EXAMPLES:'NONE',EXPLANATORY_MATERIAL:'NONE',EXCEPTIONS:'NONE',DEPENDENCIES:'NONE',APPLICABILITY_FACTS:'Applies.',RESTRICTIONS:'NONE',INVALIDATING_MATERIAL:'NONE'},relationships:{SOURCE_ID:'SOURCE-000001'},evidenceRefs:[]});p.projectData.candidateRequirements.push({id:'CANDIDATE-REQ-000001',stage:3,active:true,scope:{inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001'},fields:{CANDIDATE_REQ_ID:'CANDIDATE-REQ-000001',SOURCE_ID:'SOURCE-000001',CANDIDATE_OBLIGATION:'External candidate obligation from Stage 03.'},relationships:{SOURCE_ID:'SOURCE-000001'},evidenceRefs:[]});p.stages[3].agentData={SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED:'TRUE',LATEST_PASS_NUMBER:2,NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS:'FALSE'};p.stages[3].status='COMPLETE';p.stages[3].gate={complete:true};A(engine.deriveStageData(p,3).ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED===true,'derived Stage 03 coverage failed');const s4=prompts.buildPromptRecord(4,p,{operation:'COMPLETE'}),o=s4.contextManifest.obligationManifest.items.map(x=>x.text);A(s4.prompt.includes('KEEP THE PROMPT BOX SIZE UNCHANGED.')&&s4.prompt.includes('External rule from Stage 03.'),'Stage 04 carry-forward missing');A(s4.contextManifest.executionHandoff.send.length===0,'Stage 04 repeats intent file handoff');for(const x of ['KEEP THE PROMPT BOX SIZE UNCHANGED.','THE USER SUPPLIES PROJECT INFORMATION ONCE.','STAGE 4 MUST USE ALL STAGE 1 AND STAGE 3 DATA.','External rule from Stage 03.','External candidate obligation from Stage 03.'])A(o.includes(x),`missing obligation: ${x}`);console.log('verify-stage01-stage04-zero-loss: PASS');
          EOF
          node --check workflow-engine.js && node --check prompt-engine.js && node --check app-core.js && node --check test-runtime.js && node --check verify-stage01-stage04-zero-loss.mjs
          node verify-stage01-stage04-zero-loss.mjs
          git diff --check
      - name: Commit runtime repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-engine.js prompt-engine.js index.html app-core.js test-runtime.js verify-stage01-stage04-zero-loss.mjs
