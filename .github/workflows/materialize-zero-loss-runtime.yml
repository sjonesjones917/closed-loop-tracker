name: Materialize zero-loss runtime
on:
  push:
    branches: [fix/stage01-stage04-zero-loss-runtime-20260831]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply and verify isolated runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js'); s=p.read_text()
