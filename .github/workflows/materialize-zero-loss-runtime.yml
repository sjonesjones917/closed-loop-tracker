          new="const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED']);\nconst LEGACY_INTAKE_DISPOSITION_MAP=Object.freeze({'INCORPORATED INTO THE JOB DEFINITION':'EXTRACTED_RELEVANT_INFORMATION','RETAINED AS CONTEXT':'RETAINED_AS_CONTEXT','UNRESOLVED HUMAN-ONLY':'UNRESOLVED_HUMAN_AUTHORITY','LATER-RESOLVABLE':'LATER_RESOLVABLE','INAPPLICABLE WITH REASON':'NO_PROJECT_RELEVANT_INFORMATION'});\nconst normalizeIntakeDisposition=value=>{const key=String(value??'').trim().toUpperCase();return LEGACY_INTAKE_DISPOSITION_MAP[key]||key;};"
          if old not in s: raise SystemExit('intake disposition target missing')
          s=s.replace(old,new,1)
          old="  for(const artifact of stageOneArtifacts){const artifactId=recordId(artifact,'artifacts'),filename=String(recordValue(artifact,'FILENAME')||artifactId),sha256=String(recordValue(artifact,'SHA256')||''),byteSize=Number(recordValue(artifact,'BYTE_SIZE')||0),availability=String(recordValue(artifact,'AVAILABILITY')||'UNKNOWN'),sourceLocation=`artifact.${artifactId}`,rawValueText=JSON.stringify({artifactId,filename,sha256,byteSize,availability}),rawValueSha256=hash.sha256Value(rawValueText),unitId=`INPUT-UNIT-${hash.sha256Value({inputVersion,kind:'SUPPLIED_MATERIAL',sourceLocation,rawValueSha256}).slice(0,20).toUpperCase()}`;units.push({unitId,kind:'SUPPLIED_MATERIAL',sourceLocation,label:`Supplied material ${filename}`,rawValueSha256,rawValueText,artifactId,filename,artifactSha256:sha256,byteSize,availability});}"
          new="  const suppliedArtifactText=project.projectData.userEntered?.suppliedArtifactText||{};\n  for(const artifact of stageOneArtifacts){const artifactId=recordId(artifact,'artifacts'),filename=String(recordValue(artifact,'FILENAME')||artifactId),sha256=String(recordValue(artifact,'SHA256')||''),byteSize=Number(recordValue(artifact,'BYTE_SIZE')||0),availability=String(recordValue(artifact,'AVAILABILITY')||'UNKNOWN'),sourceLocation=`artifact.${artifactId}`,rawValueText=JSON.stringify({artifactId,filename,sha256,byteSize,availability}),rawValueSha256=hash.sha256Value(rawValueText),unitId=`INPUT-UNIT-${hash.sha256Value({inputVersion,kind:'SUPPLIED_MATERIAL',sourceLocation,rawValueSha256}).slice(0,20).toUpperCase()}`;units.push({unitId,kind:'SUPPLIED_MATERIAL',sourceLocation,label:`Supplied material ${filename}`,rawValueSha256,rawValueText,artifactId,filename,artifactSha256:sha256,byteSize,availability});const captured=suppliedArtifactText[artifactId];if(captured&&typeof captured.text==='string')enumerateInputLeaves(captured.text,`${sourceLocation}.content`,'SUPPLIED_MATERIAL_CONTENT',`Supplied material content ${filename}`,units,{inputVersion,extra:{artifactId,filename,artifactSha256:sha256,byteSize,availability}});}"
          if old not in s: raise SystemExit('artifact enumeration target missing')
          s=s.replace(old,new,1)
          old="    const disposition=String(unit?.disposition||'').trim().toLowerCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);if(disposition==='inapplicable with reason'&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires an inapplicability reason.`);\n    const statements=safe(unit?.extractedStatements);if(disposition!=='inapplicable with reason'&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;"
          new="    const disposition=normalizeIntakeDisposition(unit?.disposition);if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);const noRelevant=disposition==='NO_PROJECT_RELEVANT_INFORMATION',blocked=disposition==='INACCESSIBLE_OR_BLOCKED';if((noRelevant||blocked)&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires a reason for ${disposition}.`);\n    const statements=safe(unit?.extractedStatements);if(!noRelevant&&!blocked&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;"
          if old not in s: raise SystemExit('disposition validation target missing')
          s=s.replace(old,new,1)
          old="    if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&(disposition==='inapplicable with reason'?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);"
          new="    if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&((noRelevant||blocked)?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);"
          if old not in s: raise SystemExit('accounting target missing')
          s=s.replace(old,new,1); p.write_text(s)
          p=Path('prompt-engine.js'); s=p.read_text(); s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/55';",1)
          old="Perform complete human-authority intake only. This is an actual conversational intake, not a JSON-form-filling exercise."
          new="Perform complete human-authority intake only. You are the first semantic reader of the human's arbitrary supplied project materials; before this stage the application owns raw custody, byte identity, and raw-unit enumeration only and has not semantically interpreted those files. This is an actual conversational intake, not a JSON-form-filling exercise. Perform two mandatory semantic passes before final JSON: Pass 1 reads the complete request and every accessible supplied artifact from beginning to end and extracts every distinct project-relevant human-origin statement. Pass 2 compares that ledger back against every raw input unit and deliberately searches for omitted qualifiers, exceptions, dependencies, negative requirements, do-not-change statements, visual constraints, temporal constraints, acceptance conditions, authority statements, tool restrictions, file references, output-format requirements, corrections, and later statements that override earlier statements. Resolve every omission before final JSON."
          if old not in s: raise SystemExit('Stage 01 prompt target missing')
          s=s.replace(old,new,1)
          s=s.replace('\"disposition\":\"incorporated into the job definition|retained as context|unresolved human-only|later-resolvable|inapplicable with reason\"','\"disposition\":\"EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED\"',1)
          s=s.replace('\"reason\":\"optional concise reason\"','\"reason\":\"required for NO_PROJECT_RELEVANT_INFORMATION or INACCESSIBLE_OR_BLOCKED; otherwise optional\"',1)
          old="function assertStage4UpstreamExhausted(state){const fail=reason=>{const error=new Error(reason);error.code='STAGE4_UPSTREAM_INCOMPLETE';throw error;};const one=state?.stages?.[1],three=state?.stages?.[3];if(String(one?.status||'').toUpperCase()!=='COMPLETE'||one?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 01 human-authority intake is complete.');const intake=workflow.evaluateIntakeAccounting(state);if(!intake.complete)fail('Stage 04 cannot be generated because Stage 01 controlled-input accounting is incomplete: '+intake.reasons.join('; '));if(String(three?.status||'').toUpperCase()!=='COMPLETE'||three?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 03 research is complete.');const noSource=upper(state?.stages?.[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION||state?.stages?.[2]?.acceptedData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE';if(!noSource){const sources=safe(state?.projectData?.sources).filter(r=>r?.active!==false&&!r?.invalidatedBy),research=safe(state?.projectData?.research).filter(r=>r?.active!==false&&!r?.invalidatedBy),covered=new Set(research.map(r=>clean(recordValue(r,'SOURCE_ID')||r?.relationships?.SOURCE_ID)).filter(Boolean));for(const src of sources){const sid=recordId(src,'sources');if(sid&&!covered.has(sid))fail('Stage 04 cannot be generated because Stage 03 has not researched every current Stage 02 source.');}const d=three?.agentData||three?.acceptedData||{};if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED)))fail('Stage 04 cannot be generated until Stage 03 confirms all controlling sources were examined.');if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED)))fail('Stage 04 cannot be generated until Stage 03 completes the second conflict and exception pass.');if(['TRUE','YES','FOUND','DETECTED'].includes(upper(d.NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS)))fail('Stage 04 cannot be generated while the latest Stage 03 pass found a new material requirement category.');}return true;}"
          new="function assertStage4UpstreamExhausted(state){const fail=reason=>{const error=new Error(reason);error.code='STAGE4_UPSTREAM_INCOMPLETE';throw error;};const one=state?.stages?.[1],three=state?.stages?.[3];if(String(one?.status||'').toUpperCase()!=='COMPLETE'||one?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 01 human-authority intake is complete.');const intake=workflow.evaluateIntakeAccounting(state);if(!intake.complete)fail('Stage 04 cannot be generated because Stage 01 controlled-input accounting is incomplete: '+intake.reasons.join('; '));if(String(three?.status||'').toUpperCase()!=='COMPLETE'||three?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 03 research is complete.');const noSource=upper(state?.stages?.[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION||state?.stages?.[2]?.acceptedData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE';if(!noSource){const derived=workflow.deriveStageData(state,3);if(!derived.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED)fail('Stage 04 cannot be generated because application-derived Stage 03 source coverage is incomplete.');}return true;}"
          if old not in s: raise SystemExit('Stage 04 target missing')
          s=s.replace(old,new,1); p.write_text(s)
          for name in ['index.html','app-core.js','test-runtime.js']:
