name: Fix stage-aware runtime token
on:
  push:
    branches: ['patch/stage-aware-help-v2']
    paths: ['.github/workflows/fix-stage-aware-runtime.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Fix stage-aware runtime token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'patch/stage-aware-help-v2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Set deterministic runtime identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'([A-Za-z0-9._-]+\.js)\?v=[^\"\']+',r'\1?v=runtime-226f176ead45909c',s)
          p.write_text(s)
          PY
          node verify-hash.mjs
      - name: Commit verified identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Align stage-aware runtime cache identity'
          git push origin HEAD:'patch/stage-aware-help-v2'
