name: Temporary pinned-browser repair
on:
  push:
    branches: [controller3-current-file-first-20260904-0606]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-current-file-first-20260904-0606
      - name: Apply minimal browser provisioning repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text()
          a="""      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          node-version: '22'\n\n      - name: Capture exact PR source workspace\n"""
          b="""      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          node-version: '22'\n      - name: Install pinned Chrome for Testing\n        id: setup-chrome\n        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4\n        with:\n          chrome-version: '152.0.7977.82'\n\n      - name: Capture exact PR source workspace\n"""
          assert s.count(a)==1
          s=s.replace(a,b)
          a="""      - name: Local Chromium operator path\n        env:\n          BROWSER: /usr/bin/google-chrome\n        run: |\n          set -euo pipefail\n          if [ ! -x \"$BROWSER\" ]; then\n            BROWSER=\"$(command -v google-chrome || command -v chromium || command -v chrome || true)\"\n            export BROWSER\n          fi\n          test -n \"$BROWSER\"\n"""
          b="""      - name: Local Chromium operator path\n        env:\n          BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}\n        run: |\n          set -euo pipefail\n          test -x \"$BROWSER\"\n"""
          assert s.count(a)==1
          s=s.replace(a,b)
          marker="  verify-live:\n"
          i=s.index(marker)
          pre,tail=s[:i],s[i:]
          a="""      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          node-version: '22'\n      - name: Rebuild retained fixture used by deployment\n"""
          b="""      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          node-version: '22'\n      - name: Install pinned Chrome for Testing\n        id: setup-chrome\n        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4\n        with:\n          chrome-version: '152.0.7977.82'\n      - name: Rebuild retained fixture used by deployment\n"""
          assert tail.count(a)==1
          tail=tail.replace(a,b,1)
          s=pre+tail
          a="""      - name: Deployed Chromium operator path\n        run: |\n          set -euo pipefail\n          export BROWSER=\"$(command -v google-chrome || command -v chromium || command -v chrome || true)\"\n          test -n \"$BROWSER\"\n"""
          b="""      - name: Deployed Chromium operator path\n        env:\n          BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}\n        run: |\n          set -euo pipefail\n          test -x \"$BROWSER\"\n"""
          assert s.count(a)==1
          s=s.replace(a,b)
          marker="  publish-status:\n"
          i=s.index(marker)
          pre,tail=s[:i],s[i:]
          a="""      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          node-version: '22'\n      - name: Reverify deployed Chromium for authenticated mobile acceptance\n"""
          b="""      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          node-version: '22'\n      - name: Install pinned Chrome for Testing\n        id: setup-chrome\n        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4\n        with:\n          chrome-version: '152.0.7977.82'\n      - name: Reverify deployed Chromium for authenticated mobile acceptance\n"""
          assert tail.count(a)==1
          tail=tail.replace(a,b,1)
          s=pre+tail
          a="""      - name: Reverify deployed Chromium for authenticated mobile acceptance\n        if: github.event_name == 'workflow_dispatch'\n        env:\n          PAGE_URL: https://sjonesjones917.github.io/closed-loop-tracker/\n        run: |\n          set -euo pipefail\n          export BROWSER=\"$(command -v google-chrome || command -v chromium || command -v chrome || true)\"\n          test -n \"$BROWSER\"\n"""
          b="""      - name: Reverify deployed Chromium for authenticated mobile acceptance\n        if: github.event_name == 'workflow_dispatch'\n        env:\n          PAGE_URL: https://sjonesjones917.github.io/closed-loop-tracker/\n          BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}\n        run: |\n          set -euo pipefail\n          test -x \"$BROWSER\"\n"""
          assert s.count(a)==1
          s=s.replace(a,b)
          p.write_text(s)
          Path('.github/workflows/controller-temp-browser-fix.yml').unlink()
          PY
      - name: Verify preserved mobile governance
        run: node verify-mobile-release-governance.mjs
      - name: Commit repaired canonical workflow
        run: |
          set -euo pipefail
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add .github/workflows/pages.yml .github/workflows/controller-temp-browser-fix.yml
          git commit -m 'Provision pinned Chromium for browser proof'
          git push origin HEAD:controller3-current-file-first-20260904-0606
