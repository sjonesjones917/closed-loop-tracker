name: Apply Stage 6 contract alignment current
on:
  push:
    branches:
      - fix/stage6-contract-alignment-current-20260830
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage6-contract-alignment-current-20260830
          fetch-depth: 0
      - name: Align Stage 6 Test IR and future artifact contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          s=p.read_text()
          for old,new in [
              ('valueType:VALUE_TYPES.ENUM',"valueType:'STRING'"),
              ('valueType:VALUE_TYPES.STRING',"valueType:'STRING'"),
              ('valueType:VALUE_TYPES.OBJECT',"valueType:'OBJECT'"),
          ]:
              s=s.replace(old,new)
          p.write_text(s)

          p=Path('response-ingestion.js')
          s=p.read_text()
          start="    if(collection==='tests'&&String(record?.fields?.ARTIFACT_REQUIREMENTS||'').trim().toUpperCase()!=='NONE'){"
          end="    if(object(record?.relationships))for(const [name,reference] of Object.entries(record.relationships)){"
          if start in s:
              a=s.index(start); b=s.index(end,a)
              s=s[:a]+(
                  "    // Stage 06 defines tests before candidate/product bytes necessarily exist.\n"
                  "    // Artifact availability is execution readiness owned by testExecutionPlan()/workflow gates.\n"
                  "    // Explicit current artifactId bindings are still validated above; future CURRENT_PRODUCT/CURRENT_SCOPE bindings stay declarative until execution.\n"
              )+s[b:]
          p.write_text(s)

          for name in ['index.html','app-core.js']:
              p=Path(name); s=p.read_text()
              s=s.replace('runtime-20260830-live-operator-52','runtime-20260830-live-operator-53')
              p.write_text(s)
          PY
      - name: Commit materialized repair
        shell: bash
        run: |
          rm .github/workflows/apply-stage6-contract-alignment-current.yml
          git config user.name sjonesjones917
          git config user.email sjones.jones917@gmail.com
          git add workflow-schema.js response-ingestion.js index.html app-core.js .github/workflows/apply-stage6-contract-alignment-current.yml
          git commit -m "Align Stage 6 contracts on current main"
          git push origin HEAD:fix/stage6-contract-alignment-current-20260830
