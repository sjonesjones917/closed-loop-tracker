name: Apply proven zero-loss delta to latest main
on:
  push:
    branches: [reliability/semantic-adjudication-zero-loss-latest]
    paths: [.github/workflows/apply-zero-loss-latest.yml]
permissions: {contents: write}
concurrency: {group: zero-loss-latest-apply-v2, cancel-in-progress: false}

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact proven semantic delta
        run: |
          git diff 0bc70742b299d405dd20fa363f47903c8bde8c36 fd96f7af52a2d2e33546eee2a807dd1eaf3df0e8 -- workflow-engine.js verify-complete.mjs verify-semantic-invariant.mjs > /tmp/zero-loss.patch
          test -s /tmp/zero-loss.patch
          git apply --check /tmp/zero-loss.patch
          git apply /tmp/zero-loss.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest=''.join(f'{name}:{blob(name)}\n' for name in files).encode()
          token='runtime-'+hashlib.sha256(manifest).hexdigest()[:16]
          html=Path('index.html').read_text()
          for name in files:
              pattern=rf'(<script\s+defer\s+src="{re.escape(name)}\?v=)[^"]+("\s*></script>)'
              html,n=re.subn(pattern,rf'\g<1>{token}\2',html,count=1)
              if n!=1: raise SystemExit(f'{name}: expected one script tag, got {n}')
          Path('index.html').write_text(html)
          print(token)
          PY
      - name: Syntax
        run: |
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node --check verify-semantic-invariant.mjs
      - name: Hash proof
        run: timeout 60s node verify-hash.mjs
      - name: Architecture proof
        run: timeout 60s node verify.mjs
      - name: Semantic false-acceptance proof
        run: timeout 60s node verify-semantic-invariant.mjs
      - name: Ingestion proof
        run: timeout 90s node verify-ingestion.mjs
      - name: Gate and routing proof
        run: timeout 90s node verify-complete.mjs
      - name: Prompt semantics proof
        run: timeout 90s node verify-prompt-semantics.mjs
      - name: Materialize exact final repository candidate
        run: rm -f .github/workflows/apply-zero-loss-latest.yml
      - name: Definition-of-done proof
        run: timeout 90s node verify-definition-of-done.mjs
      - name: Full-cycle proof
        run: timeout 180s node verify-full-cycle.mjs
      - name: Local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout 180s node verify-browser.mjs
          timeout 180s node verify-browser-extra.mjs
      - name: Commit only proven final delta
        run: |
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Close remaining zero-loss semantic gaps'
          git push origin HEAD:reliability/semantic-adjudication-zero-loss-latest
