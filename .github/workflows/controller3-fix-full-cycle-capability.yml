name: Repair full-cycle capability fixture
on:
  push:
    branches: [controller3-prompt-byte-identity-rerun-20260904]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-prompt-byte-identity-rerun-20260904
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs')
          s=p.read_text()
          needle="data(7,{records:{failureTests:[recordProposal(schema,'failureTests'"
          insert="{const capabilityId='CAPABILITY-FULL-CYCLE-EXTERNAL-TOOL';p.projectData.externalCapabilities.push({id:capabilityId,recordId:capabilityId,active:true,scope:{inputVersion:p.job.CURRENT_INPUT_VERSION},fields:{CAPABILITY_ID:capabilityId,CAPABILITY_CLAIM:'fixture-required_capability',FRESHNESS_STATUS:'CURRENT',STATUS:'CURRENT',AUTHORIZED:true,PERMISSIONS_READY:true,INPUTS_TRANSFERABLE:true,ROUTE_USABLE:true,EVIDENCE_OBTAINABLE:true}});}\n"
          if insert not in s:
              if needle not in s: raise SystemExit('fixture insertion point not found')
              s=s.replace(needle,insert+needle,1)
          p.write_text(s)
          PY
          rm .github/workflows/controller3-fix-full-cycle-capability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-full-cycle.mjs .github/workflows/controller3-fix-full-cycle-capability.yml
          git commit -m "Repair full-cycle capability readiness fixture"
          git push origin HEAD:controller3-prompt-byte-identity-rerun-20260904