name: Apply minimal Stage 01 real prompt repair
on:
  push:
    branches: [fix/human-first-stage-ux-20260826]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-real-prompt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove blank-intake prompt blocker and refresh runtime identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          text=p.read_text()
          old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/13';"
          if text.count(old)!=1: raise SystemExit('Unexpected prompt engine version state')
          text=text.replace(old,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/14';",1)
          guard=" if(stage===1&&!String(state?.job?.EXACT_USER_OBJECTIVE_VERBATIM||'').trim()){const error=new Error('Stage 01 needs one thing before an instruction can be generated: enter the verbatim job request in User Job Input and save it. Additional details may be clarified by the agent afterward.');error.code='MISSING_MINIMUM_HUMAN_INPUT';throw error;}\n"
          if text.count(guard)!=1: raise SystemExit('Stage 01 hard prompt blocker not found exactly once')
          p.write_text(text.replace(guard,'',1))
          PY
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=files.map(file=>`${file}:${blobSha(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/(src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+/g,`$1${token}`);
          fs.writeFileSync('index.html',html);
          console.log(`runtime token: ${token}`);
          NODE
      - name: Verify complete source behavior
        run: |
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node build-test-project.mjs
      - name: Commit clean two-file repair
        run: |
          git config user.name "closed-loop-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-engine.js index.html
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "Always generate the real Stage 01 agent prompt"
          git push origin HEAD:fix/stage01-real-prompt
