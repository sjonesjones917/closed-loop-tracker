name: Integrate final semantic wording repairs
on:
  push:
    branches: [semantic-reliability/recovery-context]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-reliability/recovery-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal semantic repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new, label):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              p.write_text(s.replace(old,new,1))
          replace('workbook.js',
            "12:['Every mandatory requirement has one verification record per run','No generator validated its own output','Every result has evidence','Verification matrix count reconciles exactly']",
            "12:['Every current applicable mandatory REQ_ID × RUN_ID × TEST_ID triple has exactly one verification record','No generator validated its own output','Every result has evidence','Verification matrix count reconciles exactly']",
            'stage12 completion wording')
          replace('workflow-schema.js',
            "  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:1,provenanceRequired:false});",
            "  if(name==='DESIRED_SOURCE_COUNT')return field(name,PRODUCER.HUMAN,{requiredAtStage:null,provenanceRequired:false,valueType:'INTEGER',nullable:true,help:'Optional source-breadth target; never a quota or substitute for authority.'});\n  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:1,provenanceRequired:false});",
            'optional numeric source count')
          p=Path('prompt-engine.js'); s=p.read_text()
          reps=[
          ("1:'Initialize only this current job from this current job’s exact user input. Preserve the verbatim objective, exact deliverable, supplied-material inventory and provenance, inspection state, format requirements, temporal and geographic scope, user-supplied authority, tools, prohibitions, explicit user requirements, assumptions, unresolved unknowns, and controlled INPUT-vN identity. Assign and preserve this job’s unique JOB_ID before downstream artifacts.",
           "1:'Initialize only this current job from this current job’s exact user input. Preserve the verbatim objective, exact deliverable, supplied-material inventory and provenance, inspection state, format requirements, temporal and geographic scope, user-supplied authority, tools, prohibitions, explicit user requirements, assumptions, unresolved unknowns, and controlled INPUT-vN identity. Use and preserve the application-assigned JOB_ID; do not assign or alter it."),
          ("Create SOURCE-SET-vN only from legitimate external governing sources actually established in this stage; if none are yet established, leave the source set uncreated and record UNKNOWN/BLOCKED as applicable.",
           "Propose only legitimate external governing sources actually established in this stage. The application creates the controlled SOURCE-SET version after accepted canonical ingestion; if no legitimate external governing source applies, use the explicit no-source determination instead of inventing one."),
          ("10:'Freeze the exact candidate for this job and iteration. Assign CANDIDATE_ID and ITERATION_ID; preserve the exact component manifest, versions, hashes where real bytes exist, role distribution, immutable locations, tool configuration, settings, permissions, and limitations.",
           "10:'Freeze the exact candidate for this job and iteration. Human authority selects the candidate components and the application assigns CANDIDATE_ID and ITERATION_ID and computes byte hashes; the agent must not assign those values. Preserve only permitted substantive freeze observations and evidence."),
          ("20:'Freeze this job’s production baseline only after successful unchanged confirmation. Assign BASELINE_ID and preserve the supporting confirmation, exact approved versions, hashes where available, immutable baseline artifact records, authorized recipient roles, controlled baseline storage, status, and evidence.",
           "20:'Freeze this job’s production baseline only after successful unchanged confirmation. Human authority authorizes the baseline and the application assigns BASELINE_ID, freezes exact artifact identities, and computes byte hashes. The agent may provide only permitted substantive review findings and evidence."),
          ("21:'Generate this job’s finished target product here, in a fresh production context, using only the approved baseline materials. Before this stage the finished target product is not treated as existing. Assign PRODUCT_ID, PRODUCT_VERSION, BASELINE_ID, EXECUTION_ID, context, timestamps, instruction version, tool configuration, deviations, failures, and generated artifact inventory including filename, type, size, hash, and storage reference. No uncontrolled post-generation editing is permitted.',",
           "21:'Produce the approved deliverable in a fresh production context using only approved baseline materials when the external agent environment actually has the required capability. The application reserves PRODUCT_ID and EXECUTION_ID and owns versions, timestamps, byte sizes, hashes, lineage identities, and lifecycle state; the agent must not assign them. Report only permitted substantive execution results, deviations, failures, and artifact claims, and never claim repository changes, deployment, execution, or artifact creation that did not actually occur. This static browser application itself does not connect to or modify an external repository or external system. If direct implementation is unavailable or too large for the available environment, return the structured blocking/failure result and provide a complete implementation-ready specification when that is the appropriate achievable deliverable; self-contained artifacts that can actually be produced should still be produced. No uncontrolled post-generation editing is permitted.',"),
          ("27:'Apply this job’s release gate and produce exactly one determination: ACCEPTED, REJECTED, or BLOCKED. Preserve PRODUCT_ID, BASELINE_ID, mandatory requirement and evidence counts, violated and undetermined counts, validator counts, failed/not-run/unknown validators, critical and major defects, blocking requirements, failed tests, unresolved defects, blockers, controlling decision rule, and controlling evidence. ACCEPTED does not itself authorize delivery.',",
           "27:'Review the complete current release evidence and report permitted findings or missing evidence. The application alone computes and stores exactly one idempotent release determination: ACCEPTED, REJECTED, or BLOCKED; the agent and human must not set it. Preserve evidence that supports the application calculation. ACCEPTED does not itself authorize delivery.',")]
          for old,new in reps:
              n=s.count(old)
              if n!=1: raise SystemExit(f'prompt ownership wording anchor expected 1, found {n}: {old[:40]}')
              s=s.replace(old,new,1)
          # Validation failures become explicit recovery context, alongside operator correction feedback.
          old=" const corrections=(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}));\n if(corrections.length)parts.push(`OPERATOR REQUESTED CORRECTIONS / REFINEMENTS\\n${show(corrections)}`);"
          new=" const validations=(state?.projectData?.responseValidations||[]).filter(x=>Number(x.stage)===stage&&x.valid===false).slice(-3).map(x=>({validationId:x.validationId,rawResponseId:x.rawResponseId,issues:(x.issues||[]).map(i=>({code:i.code,path:i.path,message:i.message}))}));\n if(validations.length)parts.push(`PRIOR RESPONSE VALIDATION FAILURES TO CORRECT\\n${show(validations)}`);\n const corrections=(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}));\n if(corrections.length)parts.push(`OPERATOR REQUESTED CORRECTIONS / REFINEMENTS\\n${show(corrections)}`);"
          if s.count(old)!=1: raise SystemExit('validation recovery visible-context anchor mismatch')
          s=s.replace(old,new,1)
          old="operatorCorrectionRequests:(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}))};"
          new="validationFailures:(state?.projectData?.responseValidations||[]).filter(x=>Number(x.stage)===stage&&x.valid===false).slice(-3).map(x=>({validationId:x.validationId,rawResponseId:x.rawResponseId,issues:(x.issues||[]).map(i=>({code:i.code,path:i.path,message:i.message}))})),operatorCorrectionRequests:(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}))};"
          if s.count(old)!=1: raise SystemExit('validation recovery context-signature anchor mismatch')
          s=s.replace(old,new,1)
          old="Missing, stale, or incomplete canonical application context requires BLOCKED with MISSING_APPLICATION_CONTEXT. An unavailable external capability requires BLOCKED with MISSING_CAPABILITY, or EXECUTION_FAILED if an attempted execution failed."
          new="Missing, stale, or incomplete canonical application context requires BLOCKED with MISSING_APPLICATION_CONTEXT. A materially inadequate accepted prior-stage agent result requires BLOCKED with INADEQUATE_PRIOR_OUTPUT and must identify the earliest result that needs refinement. An unavailable external capability requires BLOCKED with MISSING_CAPABILITY, or EXECUTION_FAILED if an attempted execution failed."
          if s.count(old)!=1: raise SystemExit('prior-output taxonomy anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)
          replace('response-ingestion.js',
            "'MISSING_HUMAN_INPUT','MISSING_APPLICATION_CONTEXT','MISSING_AUTHORITY'",
            "'MISSING_HUMAN_INPUT','MISSING_APPLICATION_CONTEXT','INADEQUATE_PRIOR_OUTPUT','MISSING_AUTHORITY'",
            'inadequate prior output enum')
          replace('app-core.js',
            '<strong>Response rejected before canonical mutation.</strong><br>${safe(v.issues).map(x=>esc(`${x.code}: ${x.message}`)).join(\'<br>\')}',
            '<strong>Response rejected before canonical mutation.</strong><br>${safe(v.issues).map(x=>esc(`${x.code}: ${x.message}`)).join(\'<br>\')}<br><strong>Next step:</strong> regenerate the instruction; these validation failures will be included so the agent can return one complete corrected response without restarting the project.',
            'validation recovery UI')
          PY
      - name: Strengthen semantic verifier for the newly audited failure modes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          anchor="  if(!record.prompt.includes('implementation-ready specification rather than pretending implementation occurred'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');"
          if anchor in s:
              s=s.replace(anchor,"  if(!record.prompt.includes('implementation-ready specification')||!record.prompt.includes('does not connect to or modify an external repository'))issues.push('ENVIRONMENT_LIMIT_RULE_MISSING');",1)
          marker="  if(record.stage===2){"
          insert="  if(!record.prompt.includes('INADEQUATE_PRIOR_OUTPUT'))issues.push('PRIOR_OUTPUT_RECOVERY_MISSING');\n  if(record.stage===12&&!record.prompt.includes('REQ_ID × RUN_ID × TEST_ID'))issues.push('VERIFICATION_TRIPLE_WORDING_MISSING');\n"
          if marker not in s: raise SystemExit('semantic verifier marker missing')
          s=s.replace(marker,insert+marker,1)
          before="const p=baseProject();"
          recovery="const recovery=baseProject();recovery.projectData.responseValidations.push({validationId:'VALIDATION-RECOVERY',rawResponseId:'RAW-RECOVERY',stage:8,valid:false,issues:[{code:'MISSING_REQUIRED_FIELD',path:'/stageData/OUTPUT_CONTRACT',message:'OUTPUT_CONTRACT is required.'}]});const recoveryPrompt=prompts.buildPromptRecord(8,recovery);if(!recoveryPrompt.prompt.includes('VALIDATION-RECOVERY')||!recoveryPrompt.prompt.includes('OUTPUT_CONTRACT is required.'))throw new Error('Validation failure feedback is not carried into the next prompt.');\nif(schema.JOB_FIELDS.DESIRED_SOURCE_COUNT?.valueType!=='INTEGER'||schema.JOB_FIELDS.DESIRED_SOURCE_COUNT?.requiredAtStage!==null)throw new Error('Desired source count must be optional integer guidance.');\nconst p=baseProject();"
          if before not in s: raise SystemExit('semantic recovery fixture anchor missing')
          s=s.replace(before,recovery,1)
          p.write_text(s)
          PY
      - name: Verify all source, semantic, lifecycle, and browser prerequisites
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Remove one-time workflow and commit only final files
        run: |
          rm -f .github/workflows/semantic-final-integrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workbook.js workflow-schema.js prompt-engine.js response-ingestion.js app-core.js verify-prompt-semantics.mjs TEST_PROJECT.json
          git add -u .github/workflows/semantic-final-integrate.yml
          git diff --cached --check
          git commit -m "Remove remaining prompt ownership contradictions"
          git push origin HEAD:semantic-reliability/recovery-context
