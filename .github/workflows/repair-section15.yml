name: repair-section15-job-contract
on:
  push:
    branches:
      - fix/section15-job-contract
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/section15-job-contract
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node repair-section15-job-contract.mjs
      - run: node verify-section15-job-contract.mjs
      - name: Commit repaired source
        run: |
          if git diff --quiet -- workflow-schema.js; then
            echo 'No repair diff was produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-schema.js
          git commit -m 'Conform Section 15 job field contracts'
          git push origin HEAD:fix/section15-job-contract
# retrigger after regression harness fix
