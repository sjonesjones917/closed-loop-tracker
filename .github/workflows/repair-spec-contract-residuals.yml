name: One-shot residual contract repair

on:
  push:
    branches:
      - repair/spec-contract-residuals-20260903

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[residual-repair-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-contract-residuals-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct residual schema contradictions and add regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          s=p.read_text()
          obsolete='"HASHES_RECORDED_WHERE_PRACTICAL":{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"STRING"},'
          if obsolete not in s:
              raise SystemExit('expected obsolete Stage 10 metadata not found')
          s=s.replace(obsolete,'',1)
          obsolete2='"POST_CORRECTION_SUCCESSES_PROVEN":{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"STRING"},'
          if obsolete2 not in s:
              raise SystemExit('expected obsolete Stage 15 metadata not found')
          s=s.replace(obsolete2,'',1)
          extra=",'ASSERT_EXISTS','ASSERT_TYPE','ASSERT_NE'"
          if extra not in s:
              raise SystemExit('expected noncontrolling Test IR operations not found')
          s=s.replace(extra,'',1)
          p.write_text(s)

          test=Path('verify-spec-residual-closure.mjs')
          test.write_text("""import fs from 'node:fs';\nimport vm from 'node:vm';\nimport assert from 'node:assert/strict';\n\nglobalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};\nglobalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);\nfor(const file of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});\nconst schema=globalThis.closedLoopWorkflowSchema;\nassert(schema,'workflow schema did not load');\nconst source=fs.readFileSync('workflow-schema.js','utf8');\nassert.doesNotMatch(source,/HASHES_RECORDED_WHERE_PRACTICAL/,'Obsolete Stage 10 best-effort hashing contract must not exist.');\nassert.doesNotMatch(source,/POST_CORRECTION_SUCCESSES_PROVEN/,'Stage 15 must not claim later post-correction success inside its own stage contract.');\nconst controllingOps=['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE'];\nassert.deepEqual([...schema.TEST_IR.operations],controllingOps,'Schema Test IR operation universe must equal the controlling v1 primitive set.');\nassert(schema.STAGE_FIELDS[10].ALL_FROZEN_COMPONENT_BYTES_HASHED,'Stage 10 exact byte-hash field missing.');\nassert(!schema.STAGE_FIELDS[10].HASHES_RECORDED_WHERE_PRACTICAL,'Obsolete Stage 10 field leaked into runtime registry.');\nassert(!schema.STAGE_FIELDS[15].POST_CORRECTION_SUCCESSES_PROVEN,'Obsolete Stage 15 field leaked into runtime registry.');\nconsole.log(JSON.stringify({specResidualClosure:'PASS',testIrOperations:controllingOps.length}));\n""")

          verify=Path('verify-complete.mjs')
          v=verify.read_text()
          if "verify-spec-residual-closure.mjs" not in v:
              v += "\nawait import('./verify-spec-residual-closure.mjs');\n"
          verify.write_text(v)
          PY
          node verify-spec-residual-closure.mjs
          node verify-complete.mjs
      - name: Remove one-shot repair workflow and commit canonical changes
        shell: bash
        run: |
          git rm .github/workflows/repair-spec-contract-residuals.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add workflow-schema.js verify-complete.mjs verify-spec-residual-closure.mjs
          git commit -m 'Close residual Stage 10/15 and Test IR contracts [residual-repair-done]'
          git push origin HEAD:repair/spec-contract-residuals-20260903