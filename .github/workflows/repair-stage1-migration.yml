name: One-time Stage 1 migration repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/closed-loop-v3-final-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic legacy Stage 1 capture repair
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(text,needle,replacement,label){const first=text.indexOf(needle),last=text.lastIndexOf(needle);if(first<0||first!==last)throw new Error(`${label}: expected exactly one match`);return text.slice(0,first)+replacement+text.slice(first+needle.length);}

          {
            const path='workbook.js';let text=fs.readFileSync(path,'utf8');const marker='function migrateState(p){';
            const helper=`function restoreLegacyStage01AcceptedCapture(migrated,original){\n  const stage01=migrated?.stages?.['1']||migrated?.stages?.[1];\n  if(!stage01||String(stage01.status||'').toUpperCase()!=='COMPLETE')return migrated;\n  stage01.agentData=stage01.agentData&&typeof stage01.agentData==='object'&&!Array.isArray(stage01.agentData)?stage01.agentData:{};\n  const accepted=stage01.acceptedData&&typeof stage01.acceptedData==='object'&&!Array.isArray(stage01.acceptedData)?stage01.acceptedData:{};\n  if(String(stage01.agentData.INPUT_SET_CONTENTS||'').trim())return migrated;\n  if(String(accepted.INPUT_SET_CONTENTS||'').trim()){stage01.agentData.INPUT_SET_CONTENTS=String(accepted.INPUT_SET_CONTENTS);return migrated;}\n  const supplied=original?.userJobInput&&typeof original.userJobInput==='object'&&!Array.isArray(original.userJobInput)?original.userJobInput:null;\n  const captured=supplied&&Object.keys(supplied).length?JSON.stringify(supplied):String(stage01.draftRecord||'').trim();\n  if(captured)stage01.agentData.INPUT_SET_CONTENTS=captured;\n  return migrated;\n}\n`;
            if(!text.includes('function restoreLegacyStage01AcceptedCapture('))text=replaceOnce(text,marker,helper+marker,'workbook helper insertion');
            const before="  migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:'human-project/30',preservedAt:new Date().toISOString(),payload:original});\n  if(!migrated.stages||Object.keys(migrated.stages).length!==STAGE_COUNT)throw new Error('Legacy project migration requires exactly 30 stages.');";
            const after="  migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:'human-project/30',preservedAt:new Date().toISOString(),payload:original});\n  restoreLegacyStage01AcceptedCapture(migrated,original);\n  if(!migrated.stages||Object.keys(migrated.stages).length!==STAGE_COUNT)throw new Error('Legacy project migration requires exactly 30 stages.');";
            if(!text.includes('restoreLegacyStage01AcceptedCapture(migrated,original);'))text=replaceOnce(text,before,after,'workbook migration call');fs.writeFileSync(path,text);
          }

          {
            const path='workflow-schema.js';let text=fs.readFileSync(path,'utf8');
            const before="const clone=value=>typeof structuredClone==='function'?structuredClone(value):JSON.parse(JSON.stringify(value));\nfunction normalizeTestRecords";
            const after="const clone=value=>typeof structuredClone==='function'?structuredClone(value):JSON.parse(JSON.stringify(value));\nconst STAGE01_HUMAN_CAPTURE_FIELDS=Object.freeze(['JOB_TITLE','JOB_OWNER','EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY','REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','DESIRED_SOURCE_COUNT','KNOWN_AUTHORITATIVE_SOURCES','AVAILABLE_TOOLS','PROHIBITED_ACTIONS','EXPLICIT_USER_REQUIREMENTS']);\nfunction restoreMigratedStage01AcceptedCapture(migrated,original){\n  const stage01=migrated?.stages?.['1']||migrated?.stages?.[1];\n  if(!stage01||String(stage01.status||'').toUpperCase()!=='COMPLETE')return migrated;\n  stage01.agentData=stage01.agentData&&typeof stage01.agentData==='object'&&!Array.isArray(stage01.agentData)?stage01.agentData:{};\n  const accepted=stage01.acceptedData&&typeof stage01.acceptedData==='object'&&!Array.isArray(stage01.acceptedData)?stage01.acceptedData:{};\n  if(String(stage01.agentData.INPUT_SET_CONTENTS||'').trim())return migrated;\n  if(String(accepted.INPUT_SET_CONTENTS||'').trim()){stage01.agentData.INPUT_SET_CONTENTS=String(accepted.INPUT_SET_CONTENTS);return migrated;}\n  const legacy=original?.userJobInput&&typeof original.userJobInput==='object'&&!Array.isArray(original.userJobInput)?original.userJobInput:null;\n  const human={};for(const name of STAGE01_HUMAN_CAPTURE_FIELDS){const value=original?.job?.[name];if(value!==undefined&&value!==null&&String(value).trim()!=='')human[name]=clone(value);}\n  const source=legacy&&Object.keys(legacy).length?legacy:Object.keys(human).length?human:null;\n  const captured=source?JSON.stringify(source):String(stage01.draftRecord||'').trim();\n  if(captured)stage01.agentData.INPUT_SET_CONTENTS=captured;\n  return migrated;\n}\nfunction normalizeTestRecords";
            if(!text.includes('function restoreMigratedStage01AcceptedCapture('))text=replaceOnce(text,before,after,'schema helper insertion');
            const callBefore="  migrated=ensureV3Defaults(migrated);\n  const already=migrated.projectData.nonOperationalImportedPayloads.some";
            const callAfter="  migrated=ensureV3Defaults(migrated);\n  restoreMigratedStage01AcceptedCapture(migrated,original);\n  const already=migrated.projectData.nonOperationalImportedPayloads.some";
            if(!text.includes('restoreMigratedStage01AcceptedCapture(migrated,original);'))text=replaceOnce(text,callBefore,callAfter,'schema migration call');fs.writeFileSync(path,text);
          }

          {
            const path='verify-v3-migration.mjs';let text=fs.readFileSync(path,'utf8');
            const oldJob="  job:{JOB_ID:'JOB-MIGRATION',CURRENT_STAGE:'2'},stages,";
            const newJob="  job:{JOB_ID:'JOB-MIGRATION',CURRENT_STAGE:'2',EXACT_USER_OBJECTIVE_VERBATIM:'Preserved migration objective',EXPLICIT_USER_REQUIREMENTS:'Preserve it once and reuse it downstream.'},stages,";
            if(text.includes(oldJob))text=replaceOnce(text,oldJob,newJob,'v2 migration fixture');
            const before="assert.deepEqual(previous,original,'migration must not mutate the imported object');\n\nconst second=schema.migrateProjectToCurrent(migrated);";
            const after="assert.deepEqual(previous,original,'migration must not mutate the imported object');\nassert.match(String(migrated.stages[1].agentData.INPUT_SET_CONTENTS||''),/Preserved migration objective/,'/2 -> /3 migration must reconstruct completed Stage 01 accepted input-set capture from preserved human authority');\n\nconst legacyStages={};for(let stage=1;stage<=30;stage++)legacyStages[stage]={stage,status:stage===1?'COMPLETE':'NOT STARTED',agentData:{},humanData:{},derivedData:{}};\nconst legacy={schema:'human-project/30',jobId:'JOB-LEGACY-MIGRATION',userJobInput:{objective:'Legacy intent supplied exactly once',deliverable:'Legacy deliverable',explicitRequirements:['Never ask for this supplied intent again.'],authorizedOperation01:'Complete legacy Stage 01 authority packet'},job:{JOB_ID:'JOB-LEGACY-MIGRATION'},stages:legacyStages,projectData:{}};\nconst legacyOriginal=structuredClone(legacy);const legacyMigrated=context.closedLoopCore.migrateState(legacy);\nassert.match(String(legacyMigrated.stages[1]?.agentData?.INPUT_SET_CONTENTS||''),/Legacy intent supplied exactly once/,'human-project/30 migration must retain once-supplied Stage 01 input in canonical accepted Stage 01 data');\nassert.deepEqual(legacy,legacyOriginal,'human-project/30 migration must not mutate imported input');\nconst currentBroken=structuredClone(legacyMigrated);currentBroken.stages[1].agentData={...(currentBroken.stages[1].agentData||{})};delete currentBroken.stages[1].agentData.INPUT_SET_CONTENTS;if(currentBroken.stages[1].acceptedData)delete currentBroken.stages[1].acceptedData.INPUT_SET_CONTENTS;\nconst currentReprocessed=context.closedLoopCore.migrateState(currentBroken);assert.equal(String(currentReprocessed.stages[1]?.agentData?.INPUT_SET_CONTENTS||''),'','current /3 corruption must not be silently reconstructed by legacy migration logic');\n\nconst second=schema.migrateProjectToCurrent(migrated);";
            if(!text.includes('human-project/30 migration must retain once-supplied Stage 01 input'))text=replaceOnce(text,before,after,'migration regressions');
            text=text.replace("idempotent:true}));","idempotent:true,legacyStage01CapturePreserved:true,currentV3NoSilentHeal:true}));");fs.writeFileSync(path,text);
          }
          NODE
          node --check workbook.js
          node --check workflow-schema.js
          node --check verify-v3-migration.mjs
          node verify-v3-migration.mjs
          git diff --check
      - name: Commit integrated repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "closed-loop-repair-bot"
          git config user.email "closed-loop-repair-bot@users.noreply.github.com"
          git add workbook.js workflow-schema.js verify-v3-migration.mjs
          git commit -m "Preserve one-time Stage 1 intent across migration"
          git rm .github/workflows/repair-stage1-migration.yml
          git commit -m "Remove completed Stage 1 migration repair workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
