name: Final disposable hardening wrapper
on:
  push:
    branches: [reliability/correctness-hardening-final-20260827]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/correctness-hardening-final-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute proven runner with behavioral prompt assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import textwrap
          src=open('.github/workflows/tmp-correctness-hardening.yml',encoding='utf-8').read()
          marker0='        run: |\n';idx=src.rfind(marker0)
          if idx<0: raise SystemExit('runner body not found')
          body=textwrap.dedent(src[idx+len(marker0):])
          marker='node verify-prompt-semantics.mjs'
          patch="""python3 - <<'PYPROMPT'\nimport re\np='verify-prompt-semantics.mjs'\ns=open(p,encoding='utf-8').read()\nold=\"if(!ui.includes('Invalid application executor claim')||!ui.includes('No registered application-native executor exists'))throw new Error('Operator UI does not fail unsupported application-native test claims closed.');\"\nnew=\"const unsupported=core.createBlankState('JOB-UNSUPPORTED-NATIVE');Object.assign(unsupported.job,{EXACT_USER_OBJECTIVE_VERBATIM:'Test unsupported native execution.',CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_REQUIREMENTS_VERSION:'REQUIREMENTS-v001',CURRENT_TEST_SUITE_VERSION:'TEST-SUITE-v001'});engine.ensureShape(unsupported);unsupported.projectData.requirements.push({recordId:'REQ-UNSUPPORTED',fields:{REQ_ID:'REQ-UNSUPPORTED',OBLIGATION:'Unsupported native test stays blocked.',REQUIREMENT_TYPE:'USER',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'Observed',INTENDED_VERIFICATION_METHOD:'Native',EXPECTED_EVIDENCE:'Evidence',FAILURE_CONDITION:'Not blocked',SEVERITY:'MAJOR',STATUS:'ACTIVE'},scope:{inputVersion:'INPUT-v001',requirementsVersion:'REQUIREMENTS-v001'},status:'ACTIVE'});unsupported.projectData.tests.push({recordId:'TEST-UNSUPPORTED',fields:{TEST_ID:'TEST-UNSUPPORTED',REQ_ID:'REQ-UNSUPPORTED',TEST_TYPE:'DETERMINISTIC',EXECUTION_MODE:'APPLICATION_DETERMINISTIC',REQUIRED_CAPABILITY:'NOT_REGISTERED',ARTIFACT_REQUIREMENTS:'NONE',INPUTS:'Canonical state',TOOLS:'Application',PROCEDURE:'Attempt unsupported native execution.',EXPECTED_RESULT:'Blocked',FAILURE_CONDITION:'Execution proceeds',EVIDENCE_TO_PRESERVE:'Plan',STATUS:'READY'},relationships:{REQ_ID:'REQ-UNSUPPORTED'},scope:{inputVersion:'INPUT-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001'},status:'ACTIVE'});engine.recalculate(unsupported);const unsupportedPlan=engine.testExecutionPlan(unsupported).items.find(x=>x.testId==='TEST-UNSUPPORTED');if(!unsupportedPlan||unsupportedPlan.operatorAction!=='BLOCKED'||unsupportedPlan.executableNow||!String(unsupportedPlan.blockingReason||'').includes('No registered application-native executor'))throw new Error('Unsupported application-native execution does not fail closed with a precise plan reason.');\"\nif old not in s: raise SystemExit('old source-token assertion missing')\ns=s.replace(old,new)\npat6=r\"if\\(!record\\.prompt\\.includes\\('APPLICATION-NATIVE TEST CAPABILITIES(?:\\\\n|\\n)NONE'\\)\\|\\|!record\\.prompt\\.includes\\('do not select APPLICATION_DETERMINISTIC'\\)\\)issues\\.push\\('UNREGISTERED_APPLICATION_EXECUTOR_NOT_BLOCKED'\\);\"\ns,n=re.subn(pat6,\"{const native=engine.applicationTestCapabilities();if(!record.prompt.includes('APPLICATION-NATIVE TEST CAPABILITIES')||native.some(cap=>!record.prompt.includes(cap)))issues.push('APPLICATION_NATIVE_CAPABILITY_REGISTRY_MISMATCH');}\",s)\nif n!=1: raise SystemExit('stage6 native-capability semantic assertion not uniquely matched: '+str(n))\npat12=r\"if\\(record\\.stage===12&&!record\\.prompt\\.includes\\('APPLICATION-NATIVE TEST CAPABILITIES(?:\\\\n|\\n)NONE'\\)\\)issues\\.push\\('APPLICATION_NATIVE_CAPABILITY_CONTEXT_MISSING'\\);\"\ns,n=re.subn(pat12,\"if(record.stage===12){const native=engine.applicationTestCapabilities();if(!record.prompt.includes('APPLICATION-NATIVE TEST CAPABILITIES')||native.some(cap=>!record.prompt.includes(cap)))issues.push('APPLICATION_NATIVE_CAPABILITY_CONTEXT_MISSING');}\",s)\nif n!=1: raise SystemExit('stage12 native-capability semantic assertion not uniquely matched: '+str(n))\nopen(p,'w',encoding='utf-8').write(s)\nPYPROMPT\n"""
          if marker not in body: raise SystemExit('prompt test marker missing')
          body=body.replace(marker,patch+marker,1)
          body=body.replace("rm -f .github/workflows/tmp-correctness-hardening.yml","rm -f .github/workflows/tmp-correctness-hardening.yml .github/workflows/tmp-finalize-hardening.yml",1)
          open('/tmp/final-hardening.sh','w',encoding='utf-8').write(body)
          PY
          bash /tmp/final-hardening.sh
