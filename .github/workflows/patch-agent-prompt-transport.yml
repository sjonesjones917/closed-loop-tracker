name: Correct external-agent prompt transport (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-external-agent-prompt-transport
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move wrapper-to-agent prompt transport from argv to stdin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import import Path
          PY
          echo 'Manual migration retained for historical recovery only; the verified release already contains the corrected transport.'

      - name: Do not mutate the verified release automatically
        run: echo 'No automatic repository write is performed by this manual-only workflow.'
