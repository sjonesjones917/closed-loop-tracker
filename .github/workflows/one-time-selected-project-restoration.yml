name: Prove selected project restoration
on:
  push:
    branches: [reliability/selected-project-restoration-20260826]
permissions: {contents: write}
jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimum selection correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path);s=p.read_text();n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected one anchor, found {n}: {old[:150]!r}')
              p.write_text(s.replace(old,new,1))

          rep('app-core.js',
              "async function persistAll(nextProjects){projects=await projectStore.writeAll(nextProjects);return projects;}\n",
              "function preferredProject(projectId){return projects.find(p=>p.job?.JOB_ID===projectId)||projects.find(p=>!p.isRetainedTestProject)||projects[0]||null;}\nasync function persistAll(nextProjects,{selectedProjectId=current?.job?.JOB_ID}={}){projects=await projectStore.writeAll(nextProjects);const selected=preferredProject(selectedProjectId);if(selected)await projectStore.metaPut('selectedProject',selected.job.JOB_ID);return projects;}\n")
          rep('app-core.js',
              "async function save(){try{projects=await projectStore.writeAll(projects);current=projects.find(p=>p.job?.JOB_ID===current?.job?.JOB_ID)||current;announce('saved');return true;}catch(error){console.error(error);announce('storage failed');alert(`Save failed without replacing the prior persisted project state: ${error.message||error}`);return false;}}",
              "async function save(){try{const selectedId=current?.job?.JOB_ID;projects=await projectStore.writeAll(projects);current=preferredProject(selectedId)||current;if(current)await projectStore.metaPut('selectedProject',current.job.JOB_ID);announce('saved');return true;}catch(error){console.error(error);announce('storage failed');alert(`Save failed without replacing the prior persisted project state: ${error.message||error}`);return false;}}")
          rep('app-core.js',
              "async function addNew(){const p=ensureState(core.createBlankState(createUniqueJobId()));p.job.DATE_OPENED=new Date().toISOString();p.activeView='Project';engine.createNewJobReset(p);const next=[p,...projects];await persistAll(next);current=projects.find(x=>x.job?.JOB_ID===p.job.JOB_ID)||p;render();}",
              "async function addNew(){const p=ensureState(core.createBlankState(createUniqueJobId()));p.job.DATE_OPENED=new Date().toISOString();p.activeView='Project';engine.createNewJobReset(p);const next=[p,...projects];await persistAll(next,{selectedProjectId:p.job.JOB_ID});current=preferredProject(p.job.JOB_ID)||p;render();}")
          rep('app-core.js',
              "current=projects.find(p=>p.job?.JOB_ID===savedSelectedProjectId)||projects[0];if(needsPersist){const selectedId=current.job.JOB_ID;projects=await projectStore.writeAll(projects);current=projects.find(p=>p.job?.JOB_ID===selectedId)||projects[0];await projectStore.metaPut('selectedProject',current.job.JOB_ID);}const health=await projectStore.storageHealth();",
              "current=preferredProject(savedSelectedProjectId);if(needsPersist){const selectedId=current.job.JOB_ID;projects=await projectStore.writeAll(projects);current=preferredProject(selectedId);}if(current)await projectStore.metaPut('selectedProject',current.job.JOB_ID);const health=await projectStore.storageHealth();")
          rep('app-core.js',
              "current=projects.find(x=>x.job.JOB_ID===imported.job.JOB_ID)||projects[0];announce('project package imported and reloaded');render();",
              "current=preferredProject(imported.job.JOB_ID);if(current)await projectStore.metaPut('selectedProject',current.job.JOB_ID);announce('project package imported and reloaded');render();")

          anchor="  assert(imported&&Object.keys(imported.stages||{}).length===30,'Successful compressed package round trip lost project data.');assert(all.filter(p=>p.job?.JOB_ID==='JOB-20260823144121').length===1,'Successful import duplicated retained project.');\n"
          test="""  assert(imported&&Object.keys(imported.stages||{}).length===30,'Successful compressed package round trip lost project data.');assert(all.filter(p=>p.job?.JOB_ID==='JOB-20260823144121').length===1,'Successful import duplicated retained project.');

  console.log('extra:selected-project-restoration');
  const selectedProjectId=newest.job.JOB_ID;
  await evalValue(cdp,`location.reload();true`);await sleep(450);await waitExpr(cdp,`globalThis.closedLoopAppReady===true`,20000);
  assert((await evalValue(cdp,`document.querySelector('#current-project-summary')?.textContent?.split(' · ')[0]`))===selectedProjectId,'Imported/current project selection was not restored after reload.');
  await evalValue(cdp,`(async()=>{const all=await closedLoopProjectStore.readAll();await closedLoopProjectStore.writeAll(all);return true})()`);
  await evalValue(cdp,`location.reload();true`);await sleep(450);await waitExpr(cdp,`globalThis.closedLoopAppReady===true`,20000);
  assert((await evalValue(cdp,`document.querySelector('#current-project-summary')?.textContent?.split(' · ')[0]`))===selectedProjectId,'Bulk project save changed the selected project.');
  await evalValue(cdp,`closedLoopProjectStore.metaPut('selectedProject','JOB-NONEXISTENT-SELECTION')`);
  await evalValue(cdp,`location.reload();true`);await sleep(450);await waitExpr(cdp,`globalThis.closedLoopAppReady===true`,20000);
  const fallbackSelection=await evalValue(cdp,`(async()=>{const id=document.querySelector('#current-project-summary')?.textContent?.split(' · ')[0],all=await closedLoopProjectStore.readAll(),p=all.find(x=>x.job?.JOB_ID===id);return {id,retained:Boolean(p?.isRetainedTestProject)};})()`);
  assert(fallbackSelection?.id&&fallbackSelection.retained===false,'Missing selected-project identity fell back to the bundled retained test project while a real operator project existed.');
  await evalValue(cdp,`closedLoopProjectStore.metaPut('selectedProject',${JSON.stringify(selectedProjectId)})`);
  await evalValue(cdp,`location.reload();true`);await sleep(450);await waitExpr(cdp,`globalThis.closedLoopAppReady===true`,20000);
  assert((await evalValue(cdp,`document.querySelector('#current-project-summary')?.textContent?.split(' · ')[0]`))===selectedProjectId,'Explicit selected project was not restored after fallback test.');
"""
          p=Path('verify-browser-extra.mjs');s=p.read_text()
          if s.count(anchor)!=1: raise SystemExit(f'verify-browser-extra anchor mismatch: {s.count(anchor)}')
          p.write_text(s.replace(anchor,test,1))
          PY
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const token=`runtime-${createHash('sha256').update(files.map(file=>`${file}:${blob(file)}\n`).join('')).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');for(const file of files)html=html.replace(new RegExp(`(<script\\s+defer\\s+src=\"${file.replace('.','\\.')}\\?v=)[^\"]+(\"\\s*><\\/script>)`),`$1${token}$2`);fs.writeFileSync('index.html',html);console.log(token);
          NODE
      - name: Run complete acceptance
        run: |
          node build-test-project.mjs
          node --check app-core.js
          node --check verify-browser-extra.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-selected-project-http.log 2>&1 &
          SERVER_PID=$!;trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true;trap - EXIT
      - name: Commit only verified permanent source
        run: |
          rm .github/workflows/one-time-selected-project-restoration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js verify-browser-extra.mjs index.html .github/workflows/one-time-selected-project-restoration.yml
          git commit -m "Restore the exact selected operator project"
          git push origin HEAD:reliability/selected-project-restoration-20260826
