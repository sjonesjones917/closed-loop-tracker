name: Stage 01 confirmation edge-state repair

on:
  push:
    branches: [fix/stage01-intent-confirmation-deadlock-20260909]
    paths:
      - repair-stage01-confirmation-edge.mjs
      - .github/workflows/stage01-confirmation-edge-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply edge-state repair and regressions
        run: |
          set -euo pipefail
          node repair-stage01-confirmation-edge.mjs
          node --check workflow-engine.js
          node --check verify-complete.mjs
          changed="$(git diff --name-only | sort)"
          expected=$'verify-complete.mjs\nworkflow-engine.js'
          test "$changed" = "$expected"
          git diff --check
          node verify-complete.mjs
          node verify-stage01-intake-closure.mjs
          node verify-ingestion.mjs
          node verify-full-cycle.mjs
      - name: Replay browser path
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/closed-loop-stage01-edge-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome)"
          test -n "$BROWSER"
          node verify-browser-extra.mjs
      - name: Publish clean edge-state commit
        run: |
          set -euo pipefail
          rm repair-stage01-confirmation-edge.mjs .github/workflows/stage01-confirmation-edge-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          for file in workflow-engine.js verify-complete.mjs repair-stage01-confirmation-edge.mjs .github/workflows/stage01-confirmation-edge-repair.yml; do
            git diff --cached --name-only | grep -Fx "$file"
          done
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '4'
          git commit -m 'Keep Stage 01 confirmation behind active blockers'
          git push origin HEAD:refs/heads/fix/stage01-intent-confirmation-deadlock-20260909
