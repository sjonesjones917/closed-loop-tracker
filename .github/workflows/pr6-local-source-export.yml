name: PR6 local source export
on:
  push:
    branches:
      - practical-100/pr6-local-source-export
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr6-current-source
          path: |
            .
            !.git
          retention-days: 1
