name: Repair coordinated integration gate ordering
on:
  push:
    branches: [reliability/zero-loss-coordinated-20260828]
    paths: ['.github/workflows/fix-integration-workflow.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Move temporary workflow removal before definition-of-done proof
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/integrate-main-zero-loss.yml')
          source=path.read_text()
          marker="          git add index.html workflow-engine.js verify-semantic-invariant.mjs\n          test -z \"$(git diff --name-only --diff-filter=U)\"\n          git diff --check\n      - name: Full deterministic and Chromium acceptance"
          replacement="          git add index.html workflow-engine.js verify-semantic-invariant.mjs\n          test -z \"$(git diff --name-only --diff-filter=U)\"\n          git rm .github/workflows/integrate-main-zero-loss.yml\n          test \"$(find .github/workflows -maxdepth 1 -type f | wc -l)\" -eq 1\n          test -f .github/workflows/pages.yml\n          git diff --check\n      - name: Full deterministic and Chromium acceptance"
          if source.count(marker)!=1:
              raise SystemExit(f'Expected one pre-test insertion target; found {source.count(marker)}.')
          source=source.replace(marker,replacement,1)
          final_marker="          git rm .github/workflows/integrate-main-zero-loss.yml\n          test \"$(find .github/workflows -maxdepth 1 -type f | wc -l)\" -eq 1\n          test -f .github/workflows/pages.yml\n          git add -A"
          if source.count(final_marker)!=1:
              raise SystemExit(f'Expected one final-step target; found {source.count(final_marker)}.')
          path.write_text(source.replace(final_marker,"          git add -A",1))
          PY
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-integration-workflow.yml
          git add .github/workflows/integrate-main-zero-loss.yml
          git diff --cached --check
          git commit -m 'Run definition-of-done against final single-workflow tree'
          git push origin HEAD:reliability/zero-loss-coordinated-20260828
