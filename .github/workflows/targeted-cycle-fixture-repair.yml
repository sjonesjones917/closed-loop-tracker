name: Targeted full-cycle scope fixture repair
on:
  push:
    branches: [fix/restore-full-acceptance-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-full-acceptance-20260831
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Correct the earliest full-cycle runtime and authority failures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files={
            'verify-full-cycle.mjs':[
              (
                "data(9,{records:{preflightRecords:",
                "engine.registerFreshContext(p,{stage:9,externalContextIdentifier:'PREFLIGHT-CONTEXT-1',operatorLabel:'FULL_CYCLE'});const preflightContextId=rid('freshContexts');data(9,{scope:{contextId:preflightContextId},records:{preflightRecords:"
              ),
              (
                "function verifyBatch(stage,operation,slots){const records=[];",
                "function verifyBatch(stage,operation,slots){engine.registerFreshContext(p,{stage,externalContextIdentifier:`VERIFY-CONTEXT-${stage}-${operation}`,operatorLabel:'FULL_CYCLE'});const verifierContextId=rid('freshContexts');const records=[];"
              ),
              (
                "VERIFIER_CONTEXT_ID:`VERIFY-${runId}-${currentTestId}`",
                "VERIFIER_CONTEXT_ID:verifierContextId"
              ),
              (
                "data(stage,{operation,records:{verification:records}});}",
                "data(stage,{operation,scope:{contextId:verifierContextId},records:{verification:records}});}"
              ),
              (
                ";data(10,{stageData:{HASHES_RECORDED_WHERE_PRACTICAL:'TRUE',CHANGES_ALLOWED_DURING_BATCH:'NONE'}});engine.freezeCandidate",
                ";engine.freezeCandidate"
              ),
              (
                "data(17,{operation:'FREEZE',stageData:{NEW_FROZEN_VERSIONS:'CURRENT',OLD_CONVERSATIONS_CONTINUED:'FALSE'}});engine.freezeCandidate",
                "engine.freezeCandidate"
              ),
              (
                "data(17,{operation:'ROOT_CAUSE',stageData:{ROOT_CAUSE_COMPLETED:'TRUE'}});",
                ""
              ),
              (
                "data(17,{operation:'CORRECT',stageData:{CORRECTIONS_COMPLETED:'TRUE'}});",
                ""
              ),
              (
                "OBSERVATIONS:'No defects'",
                "OBSERVATIONS:JSON.stringify({requiredPageOrViewIds:[],inspectedPageOrViewIds:[],requiredPackagedFileIds:[],openedOrTestedPackagedFileIds:[],requiredTransformationIds:[],inspectedTransformationIds:[],observation:'No defects'})"
              )
            ],
            'workflow-schema.js':[
              (
                "agentWritableCollections:[],allowedStageData:['NEW_FROZEN_VERSIONS','OLD_CONVERSATIONS_CONTINUED']",
                "agentWritableCollections:[],allowedStageData:[]"
              ),
              (
                "agentWritableCollections:['defects','rootCauses'],allowedStageData:['ROOT_CAUSE_COMPLETED']",
                "agentWritableCollections:['defects','rootCauses'],allowedStageData:[]"
              ),
              (
                "agentWritableCollections:['changes'],allowedStageData:['CORRECTIONS_COMPLETED']",
                "agentWritableCollections:['changes'],allowedStageData:[]"
              )
            ],
            'workflow-engine.js':[
              (
                "case 10:requireAccepted();requireCount('iterations',1);requireCount('candidateFreezes',1);break;",
                "case 10:requireCount('iterations',1);requireCount('candidateFreezes',1);break;"
              ),
              (
                "ACTUAL_MANDATORY_RECORDS:matrix.actual.length",
                "ACTUAL_MANDATORY_RECORDS:matrix.verification.length"
              ),
              (
                "case 12:{requireAccepted();const iteration=latestIteration(project,[10,17,19]);",
                "case 12:{requireAccepted();const iteration=latestIteration(project,[10,11]);"
              ),
              (
                "case 12:{const iteration=latestIteration(project,[10,17,19]),",
                "case 12:{const iteration=latestIteration(project,[10,11]),"
              ),
              (
                "if(stage===13){const iteration=latestIteration(project,[10,17,19]),",
                "if(stage===13){const iteration=latestIteration(project,[10,11]),"
              ),
              (
                "case 13:{const it=latestIteration(project,[10,17,19]),",
                "case 13:{const it=latestIteration(project,[10,11]),"
              ),
              (
                "  if(Number(stage)===19){const appIteration=records(project,'iterations').find(r=>Number(r.stage)===19&&isActiveRecord(r)&&upper(recordValue(r,'PURPOSE'))==='UNCHANGED_CONFIRMATION'&&(!scopeRule.iterationId||recordId(r,'iterations')===String(scopeRule.iterationId))&&(!scopeRule.candidateId||String(recordValue(r,'CANDIDATE_ID')||r.scope?.candidateId||'')===String(scopeRule.candidateId)));if(appIteration)out.add('CONFIRM_FREEZE');}",
                "  if(Number(stage)===17){const appIteration=records(project,'iterations').find(r=>Number(r.stage)===17&&isActiveRecord(r)&&upper(recordValue(r,'PURPOSE'))==='CORRECTED'&&(!scopeRule.iterationId||recordId(r,'iterations')===String(scopeRule.iterationId))&&(!scopeRule.candidateId||String(recordValue(r,'CANDIDATE_ID')||r.scope?.candidateId||'')===String(scopeRule.candidateId)));if(appIteration)out.add('FREEZE');}\n  if(Number(stage)===19){const appIteration=records(project,'iterations').find(r=>Number(r.stage)===19&&isActiveRecord(r)&&upper(recordValue(r,'PURPOSE'))==='UNCHANGED_CONFIRMATION'&&(!scopeRule.iterationId||recordId(r,'iterations')===String(scopeRule.iterationId))&&(!scopeRule.candidateId||String(recordValue(r,'CANDIDATE_ID')||r.scope?.candidateId||'')===String(scopeRule.candidateId)));if(appIteration)out.add('CONFIRM_FREEZE');}"
              ),
              (
                "  const unexplained=comparisons.filter(r=>truth(recordValue(r,'CORRECTNESS_AFFECTING_VARIANCE'))&&!truth(recordValue(r,'AUTHORIZED_VARIANCE'))),ops=acceptedOperationSet(project,stage,{iterationId}),requiredOps=stage===17?['FREEZE','EXECUTE_RUN','VERIFY','COMPARE','ROOT_CAUSE','REGRESSION','CORRECT']:stage===19?['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:[],reasons=[];",
                "  const unexplained=comparisons.filter(r=>truth(recordValue(r,'CORRECTNESS_AFFECTING_VARIANCE'))&&!truth(recordValue(r,'AUTHORIZED_VARIANCE'))),ops=acceptedOperationSet(project,stage,{iterationId}),requiredOps=stage===17?['FREEZE','EXECUTE_RUN','VERIFY','COMPARE',...(defects.length?['ROOT_CAUSE']:[]),'REGRESSION',...(defects.length?['CORRECT']:[])]:stage===19?['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:[],reasons=[];"
              )
            ]
          }
          for path,replacements in files.items():
            p=Path(path); s=p.read_text()
            for old,new in replacements:
              count=s.count(old)
              if count!=1:
                raise SystemExit(f'{path}: expected one occurrence, found {count}: {old}')
              s=s.replace(old,new)
            p.write_text(s)
          PY
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify-full-cycle.mjs
      - name: Retain proven correction and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/targeted-cycle-fixture-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js verify-full-cycle.mjs .github/workflows/targeted-cycle-fixture-repair.yml
          git commit -m "Derive Stage 17 no-defect operations and prove strict representation coverage"
          git push origin HEAD:fix/restore-full-acceptance-20260831
