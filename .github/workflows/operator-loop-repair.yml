          p.write_text(s)

          p=Path('verify-browser-extra.mjs'); s=p.read_text(); marker="  console.log('extra:blob-persistence');"
          lane="""  console.log('extra:operator-lane-selection');\n  const laneSetup=await evalValue(cdp,`(async()=>{const store=closedLoopProjectStore,engine=closedLoopWorkflowEngine,jobId=${JSON.stringify(newest.job.JOB_ID)},p=(await store.readAll()).find(x=>x.job?.JOB_ID===jobId);p.job.CURRENT_ITERATION='ITERATION-BROWSER-LANE';const slots=engine.reserveRunBatch(p,{stage:17,iterationId:'ITERATION-BROWSER-LANE',candidateId:'CANDIDATE-BROWSER-LANE',count:10});const make=(slot,label)=>({proposalId:'PROPOSAL-BROWSER-'+label,rawResponseId:'RAW-BROWSER-'+label,validationId:'VALIDATION-BROWSER-'+label,promptId:'PROMPT-BROWSER-'+label,jobId,stage:17,responseType:'DATA_PROPOSAL',status:'PENDING_OPERATOR_REVIEW',scope:{iterationId:'ITERATION-BROWSER-LANE',runId:slot.runId,contextId:slot.contextId},envelope:{operation:'EXECUTE_RUN',scope:{iterationId:'ITERATION-BROWSER-LANE',runId:slot.runId,contextId:slot.contextId}},changes:[],proposedStageData:{},canonicalRecords:[],humanInputRequests:[],unresolved:[],warnings:[],attachments:[]});p.projectData.responseProposals.push(make(slots[0],'A'),make(slots[1],'B'));const saved=await store.writeProject(p,{expectedProjectRevision:p.revision});return {slots,revision:saved.revision};})()`);\n  await evalValue(cdp,`location.reload();true`);await sleep(450);await waitExpr(cdp,`globalThis.closedLoopAppReady===true`,20000);let selectedAfterReload=await activeProject(cdp);assert(selectedAfterReload.job.JOB_ID===newest.job.JOB_ID,'Reload ignored the persisted selected project and returned to another project.');\n  await openStage(cdp,17);assert(!(await evalValue(cdp,`Boolean(document.querySelector('#reserve-run-batch'))`)),'Run reservation control was exposed for non-execution Stage 17 operation.');await evalValue(cdp,`(()=>{const e=document.querySelector('#operation-picker');e.value='EXECUTE_RUN';e.dispatchEvent(new Event('change',{bubbles:true}));return true})()`);await waitExpr(cdp,`document.querySelector('#operation-picker')?.value==='EXECUTE_RUN'`);assert(await evalValue(cdp,`Boolean(document.querySelector('#reserve-run-batch'))`),'Run reservation control was missing for Stage 17 EXECUTE_RUN.');\n  assert(await evalValue(cdp,`document.querySelector('#proposal-heading')?.innerText.includes('PROPOSAL-BROWSER-A')&&!document.querySelector('#proposal-heading')?.innerText.includes('PROPOSAL-BROWSER-B')`),'Selected run A displayed the wrong pending proposal.');await evalValue(cdp,`(()=>{const e=document.querySelector('#run-slot-picker');e.value=${JSON.stringify(laneSetup.slots[1].runId)};e.dispatchEvent(new Event('change',{bubbles:true}));return true})()`);await waitExpr(cdp,`document.querySelector('#run-slot-picker')?.value===${JSON.stringify(laneSetup.slots[1].runId)}`);assert(await evalValue(cdp,`document.querySelector('#proposal-heading')?.innerText.includes('PROPOSAL-BROWSER-B')&&!document.querySelector('#proposal-heading')?.innerText.includes('PROPOSAL-BROWSER-A')`),'Selected run B displayed the wrong pending proposal.');await click(cdp,'#reject-proposal');await sleep(250);const laneState=await activeProject(cdp);const pa=laneState.projectData.responseProposals.find(x=>x.proposalId==='PROPOSAL-BROWSER-A'),pb=laneState.projectData.responseProposals.find(x=>x.proposalId==='PROPOSAL-BROWSER-B');assert(pa?.status==='PENDING_OPERATOR_REVIEW'&&pb?.status==='REJECTED','Reject action applied to the wrong run-scoped proposal.');\n\n"""
          if lane not in s:
              if marker not in s: raise SystemExit('browser lane marker missing')
              s=s.replace(marker,lane+marker,1)
          old="  await openStage(cdp,1);await fill(cdp,'#blocker-reason','Controlled missing human input');await click(cdp,'#add-blocker');let support=await activeProject(cdp);assert((support.projectData.blockers||[]).length>=1&&support.job.CURRENT_STATE==='BLOCKED','Universal blocker control did not gate the project.');await openStage(cdp,9);assert(await evalValue(cdp,`Boolean(document.querySelector('#add-fresh-context'))`),'Fresh Context control is not rendered at an applicable stage.');assert(await evalValue(cdp,`document.querySelector('#add-fresh-context').disabled===true`),'Fresh Context control must remain gated while prerequisite stages are incomplete.');"
          new="  await openStage(cdp,1);await fill(cdp,'#blocker-reason','Controlled missing human input');await click(cdp,'#add-blocker');let support=await activeProject(cdp);assert((support.projectData.blockers||[]).some(x=>x.source==='HUMAN_DECISION')&&support.job.CURRENT_STATE==='BLOCKED','Universal blocker control did not gate the project.');assert(await evalValue(cdp,`Boolean(document.querySelector('[data-resolve-blocker]'))`),'Human-created blocker has no resolution control.');await fill(cdp,'#blocker-resolution-evidence','Missing input was supplied and reviewed.');await click(cdp,'[data-resolve-blocker]');support=await activeProject(cdp);assert(!(support.projectData.blockers||[]).some(x=>x.source==='HUMAN_DECISION'&&String(x.STATUS||x.fields?.STATUS).toUpperCase()==='OPEN'),'Human-created blocker remained open after controlled resolution.');assert(support.job.CURRENT_STATE!=='BLOCKED','Resolved human blocker continued to deadlock the job.');await openStage(cdp,9);assert(await evalValue(cdp,`Boolean(document.querySelector('#add-fresh-context'))`),'Fresh Context control is not rendered at an applicable stage.');assert(await evalValue(cdp,`document.querySelector('#add-fresh-context').disabled===true`),'Fresh Context control must remain gated while prerequisite stages are incomplete.');"
          if old not in s: raise SystemExit('browser blocker source mismatch')
          s=s.replace(old,new,1)
          old="browserExtraVerified:true,exactPromptCopy:true,pendingProposalReload:true,successfulExport:true"
          new="browserExtraVerified:true,exactPromptCopy:true,pendingProposalReload:true,runScopedProposalSelection:true,selectedProjectRestored:true,runReservationControlContextual:true,successfulExport:true"
          if old not in s: raise SystemExit('browser summary source mismatch')
          s=s.replace(old,new,1).replace('blockerControl:true,freshContextControlContextual:true','blockerControl:true,humanBlockerResolution:true,freshContextControlContextual:true',1)
          p.write_text(s)
