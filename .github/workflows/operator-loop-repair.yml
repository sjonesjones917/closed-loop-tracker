name: Apply operator-loop reliability repair
on:
  push:
    branches:
      - reliability/operator-loop-closure-20260826
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/operator-loop-closure-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact minimum semantic repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_line(text,prefix,new_line):
              lines=text.splitlines()
              hits=[i for i,line in enumerate(lines) if line.startswith(prefix)]
              if len(hits)!=1: raise SystemExit(f'{prefix}: expected one line, found {len(hits)}')
              lines[hits[0]]=new_line
              return '\n'.join(lines)+'\n'

          p=Path('app-core.js'); s=p.read_text()
          s=replace_line(s,'function overview(){',"function overview(){const currentStage=Math.max(1,Math.min(30,Number(String(current.job.CURRENT_STAGE||'').match(/\\d+/)?.[0]||1))),done=completion(),blockers=engine.openBlockers(current).length;return `<div class=\"hero project-hero\"><div class=\"hero-top\"><div><h2>${esc(current.job.JOB_TITLE)}</h2><p>${esc(current.job.JOB_ID)}</p></div><span class=\"status ${statusClass(current.job.CURRENT_STATE)}\">${esc(current.job.CURRENT_STATE)}</span></div><div class=\"facts overview-counts\"><div class=\"fact\"><strong>${done}/30</strong><span>Completed</span></div><div class=\"fact\"><strong>${String(currentStage).padStart(2,'0')}</strong><span>Current stage</span></div><div class=\"fact\"><strong>${safe(current.projectData.generatedPrompts).length}</strong><span>Instructions</span></div><div class=\"fact\"><strong>${safe(current.projectData.generatedOutputs).length}</strong><span>Outputs</span></div></div></div><div class=\"panel next-action-panel\"><h2 class=\"section-title\">Next required action</h2><div class=\"notice\">${esc(current.job.NEXT_REQUIRED_ACTION||'No next action recorded.')}</div><div class=\"button-row overview-actions\"><button class=\"primary\" data-stage=\"${currentStage}\">Continue current stage</button></div></div>${blockers?`<div class=\"notice warn\">${blockers} open mandatory blocker${blockers===1?'':'s'} affect progression.</div>`:''}<div class=\"panel completed-work-panel\"><h2 class=\"section-title\">Completed work</h2>${stageList(core.STAGES.filter(d=>current.stages[d.number].status==='COMPLETE'))}</div>`;}")
          prompt_line="function promptOptions(n){const operation=selectedOperation(n),options={operation},requiresRun=(schema.operationContract(n,operation)?.scopeRequirements||[]).includes('runId');if(requiresRun){const run=selectedRun(n);if(run){const runId=engine.recordId(run,'runs'),contextId=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||run.scope?.contextId||'');options.scope={runId,contextId};}}return options;}"
          helpers="\n".join([
          "function responseLaneDescriptor(item){if(!item)return {operation:'',scope:{}};if(item.envelope)return {operation:item.envelope.operation||item.operation||'',scope:item.envelope.scope||item.scope||{}};if(item.operation||item.scope)return {operation:item.operation||'',scope:item.scope||{}};const prompt=safe(current.projectData.generatedPrompts).find(x=>(x.instructionId||x.promptId)===item.promptId);return {operation:prompt?.operation||'',scope:prompt?.scope||{}};}",
          "function responseLaneMatches(item,n){const options=promptOptions(n),lane=responseLaneDescriptor(item);if(String(lane.operation||'COMPLETE')!==String(options.operation||'COMPLETE'))return false;for(const [key,value] of Object.entries(options.scope||{}))if(String(lane.scope?.[key]??'')!==String(value??''))return false;return true;}",
          "function acceptedResponseForCurrentLane(n){return engine.acceptedChanges(current,n).filter(x=>responseLaneMatches(x,n)).at(-1)||null;}"
          ])
          if helpers not in s:
              if s.count(prompt_line)!=1: raise SystemExit('promptOptions source mismatch')
              s=s.replace(prompt_line,prompt_line+'\n'+helpers,1)
          s=replace_line(s,'function validationMarkup(n){',"function validationMarkup(n){const v=safe(current.projectData.responseValidations).filter(x=>Number(x.stage)===n&&responseLaneMatches(x,n)).at(-1);if(!v||v.valid)return '';return `<div class=\"notice danger\" id=\"validation-report\" tabindex=\"-1\"><strong>Response rejected before canonical mutation.</strong><br>${safe(v.issues).map(x=>esc(`${x.code}: ${x.message}`)).join('<br>')}</div>`;}")
          s=replace_line(s,'function proposalMarkup(n){',"function proposalMarkup(n){const p=safe(current.projectData.responseProposals).filter(x=>Number(x.stage)===n&&x.status==='PENDING_OPERATOR_REVIEW'&&responseLaneMatches(x,n)).at(-1);if(!p)return validationMarkup(n);const rows=safe(p.changes).map(c=>({recordType:c.canonicalRecordType||c.canonicalCollection||'stageData',temporaryKey:c.temporaryResponseKey||'',canonicalId:c.canonicalRecordId||'APPLICATION_ASSIGNED',field:c.canonicalField||c.canonicalRelationship||'',proposedValue:c.normalizedValue,jsonPointer:c.jsonPointer||'',evidence:c.evidenceIds||'',validation:'SATISFIED'}));return `<div class=\"panel\" id=\"proposal-heading\" tabindex=\"-1\"><h2 class=\"section-title\">Proposed extracted changes</h2><p class=\"section-intro\">Nothing below is canonical until you accept the complete validated proposal.</p>${details('Proposal diff',rows,true)}<details class=\"record-card\"><summary>Advanced raw proposal<span>Audit</span></summary><div class=\"record-body\">${details('Complete proposal',p)}</div></details><div class=\"button-row\"><button class=\"primary\" id=\"accept-proposal\">Accept response</button><button id=\"reject-proposal\">Reject response</button><button id=\"request-correction\">Request correction</button></div><div class=\"field\"><label>Correction or refinement needed</label><textarea id=\"correction-reason\" placeholder=\"State exactly what is missing, incorrect, or should be made more complete.\"></textarea></div></div>`;}")
          old_acc=[line for line in s.splitlines() if line.startswith('function acceptedStageMarkup(n){')]
          if len(old_acc)!=1: raise SystemExit('acceptedStageMarkup source mismatch')
          acc=old_acc[0].replace("records=collections.flatMap(c=>engine.records(current,c,{stage:n}).map(r=>({collection:c,...r})));","records=collections.flatMap(c=>engine.records(current,c,{stage:n}).map(r=>({collection:c,...r}))),laneAccepted=acceptedResponseForCurrentLane(n);").replace("${engine.acceptedChanges(current,n).length&&!current.isRetainedTestProject?","${laneAccepted&&!current.isRetainedTestProject?").replace('Invalidate accepted result and request refinement','Invalidate this operation/run result and request refinement')
          s=replace_line(s,'function acceptedStageMarkup(n){',acc)
          old_controls=[line for line in s.splitlines() if line.startswith('function controls(d,locked){')]
          if len(old_controls)!=1: raise SystemExit('controls source mismatch')
          c=old_controls[0].replace("runBatch=[11,17,19].includes(n);","runBatch=n===11||([17,19].includes(n)&&selectedOperation(n)==='EXECUTE_RUN'),humanBlockers=engine.openBlockers(current,n).filter(x=>x.source==='HUMAN_DECISION');")
          needle="</button></div>${allowFresh?"
          block="</button></div>${humanBlockers.length?`<div class=\"field\"><label>Resolution evidence for human-created blocker</label><textarea id=\"blocker-resolution-evidence\"></textarea></div>${humanBlockers.map(b=>`<div class=\"button-row\"><button data-resolve-blocker=\"${esc(engine.recordId(b,'blockers'))}\">Resolve ${esc(engine.recordId(b,'blockers'))}</button></div>`).join('')}`:''}${allowFresh?"
          if needle not in c: raise SystemExit('controls insertion source mismatch')
          c=c.replace(needle,block,1)
          s=replace_line(s,'function controls(d,locked){',c)
          s=replace_line(s,'function pendingProposal(){',"function pendingProposal(){return safe(current.projectData.responseProposals).filter(x=>Number(x.stage)===current.activeStage&&x.status==='PENDING_OPERATOR_REVIEW'&&responseLaneMatches(x,current.activeStage)).at(-1);}")
          add_line=[line for line in s.splitlines() if line.startswith('async function addBlocker(){')]
