          if old not in w: raise SystemExit('clipboard source mismatch')
          w=w.replace(old,new,1)
          old="if($('#refine-accepted-response'))$('#refine-accepted-response').onclick=async()=>{const reason=$('#accepted-refinement-reason')?.value.trim();if(!reason){alert('Describe why the accepted result must be refined.');$('#accepted-refinement-reason')?.focus();return;}try{const next=clone(current),change=engine.acceptedChanges(next,current.activeStage).at(-1);if(!change)throw new Error('No current accepted response exists to refine.');engine.invalidateAcceptedResponse(next,{stage:current.activeStage,rawResponseId:change.rawResponseId,reason,operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});await persistReplacement(next);announce('accepted result invalidated for refinement');render();}catch(error){alert(error.message||error);}};"
          new="if($('#refine-accepted-response'))$('#refine-accepted-response').onclick=async()=>{const reason=$('#accepted-refinement-reason')?.value.trim();if(!reason){alert('Describe why the accepted result must be refined.');$('#accepted-refinement-reason')?.focus();return;}try{const next=clone(current),change=acceptedResponseForCurrentLane(current.activeStage);if(!change)throw new Error('No accepted response exists for the selected operation/run lane.');engine.invalidateAcceptedResponse(next,{stage:current.activeStage,rawResponseId:change.rawResponseId,reason,operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});await persistReplacement(next);announce('accepted result invalidated for refinement');render();}catch(error){alert(error.message||error);}};"
          if old not in w: raise SystemExit('refinement source mismatch')
          w=w.replace(old,new,1)
          old="if($('#add-blocker'))$('#add-blocker').onclick=addBlocker;if($('#add-fresh-context'))"
          new="if($('#add-blocker'))$('#add-blocker').onclick=addBlocker;document.querySelectorAll('[data-resolve-blocker]').forEach(b=>b.onclick=()=>resolveHumanBlocker(b.dataset.resolveBlocker));if($('#add-fresh-context'))"
          if old not in w: raise SystemExit('blocker wire source mismatch')
          w=w.replace(old,new,1)
          s=replace_line(s,'function wire(){',w)
          load=[line for line in s.splitlines() if line.startswith('async function load(){')]
          if len(load)!=1: raise SystemExit('load source mismatch')
          l=load[0]
          old="await projectStore.ready;projects=(await projectStore.readAll()).filter(Boolean).map(normalize);let needsPersist=false;"
          new="await projectStore.ready;const savedSelectedProjectId=await projectStore.metaGet('selectedProject');projects=(await projectStore.readAll()).filter(Boolean).map(normalize);let needsPersist=false;"
          if old not in l: raise SystemExit('load selection source mismatch')
          l=l.replace(old,new,1)
          old="if(!projects.length){projects=[ensureState(core.createBlankState(createUniqueJobId()))];needsPersist=true;}current=projects[0];if(needsPersist){const selectedId=current.job.JOB_ID;projects=await projectStore.writeAll(projects);current=projects.find(p=>p.job?.JOB_ID===selectedId)||projects[0];}"
          new="if(!projects.length){projects=[ensureState(core.createBlankState(createUniqueJobId()))];needsPersist=true;}current=projects.find(p=>p.job?.JOB_ID===savedSelectedProjectId)||projects[0];if(needsPersist){const selectedId=current.job.JOB_ID;projects=await projectStore.writeAll(projects);current=projects.find(p=>p.job?.JOB_ID===selectedId)||projects[0];await projectStore.metaPut('selectedProject',current.job.JOB_ID);}"
          if old not in l: raise SystemExit('load current source mismatch')
