          if export_old not in s: raise SystemExit('engine export source mismatch')
          s=s.replace(export_old,'registerGeneratedPrompt,createHumanBlocker,resolveHumanBlocker,registerFreshContext',1)
          p.write_text(s)

          p=Path('verify-complete.mjs'); s=p.read_text(); marker="console.log(JSON.stringify({scopedAcceptedResultRefinement:true},null,2));"
          tests="""// Run-batch reservation is idempotent and partial batches fail closed.\n{\n const p=project('JOB-RUN-BATCH-IDEMPOTENT');p.job.CURRENT_ITERATION='ITERATION-IDEMPOTENT';\n const first=engine.reserveRunBatch(p,{stage:17,iterationId:'ITERATION-IDEMPOTENT',candidateId:'CANDIDATE-IDEMPOTENT',count:10}),historyCount=p.projectData.history.filter(x=>x.type==='RUN_BATCH_RESERVED').length;\n const second=engine.reserveRunBatch(p,{stage:17,iterationId:'ITERATION-IDEMPOTENT',candidateId:'CANDIDATE-IDEMPOTENT',count:10});\n assert(first.length===10&&second.length===10&&engine.records(p,'runs',{stage:17}).length===10&&engine.records(p,'freshContexts',{stage:17}).length===10,'Repeated run-batch reservation allocated duplicate slots.');\n assert(p.projectData.history.filter(x=>x.type==='RUN_BATCH_RESERVED').length===historyCount,'Idempotent run-batch reservation created a second reservation event.');\n engine.records(p,'runs',{stage:17})[0].active=false;let threw=false;try{engine.reserveRunBatch(p,{stage:17,iterationId:'ITERATION-IDEMPOTENT',candidateId:'CANDIDATE-IDEMPOTENT',count:10});}catch{threw=true;}assert(threw,'Partial active run batch was silently topped up instead of failing closed.');\n}\n\n// Human-created blockers have a controlled human-resolution inverse and cannot resolve agent blockers.\n{\n const p=project('JOB-HUMAN-BLOCKER-RESOLUTION'),human=engine.createHumanBlocker(p,{stage:1,reason:'Human-only prerequisite is missing.',operatorLabel:'VERIFY'});assert(engine.openBlockers(p).some(x=>engine.recordId(x,'blockers')===human.id),'Human blocker did not open.');\n const resolved=engine.resolveHumanBlocker(p,{blockerId:human.id,resolutionEvidence:'The prerequisite was supplied and reviewed.',operatorLabel:'VERIFY'});assert(engine.recordValue(resolved,'STATUS')==='RESOLVED'&&engine.recordValue(resolved,'CLOSURE')==='CLOSED'&&!engine.openBlockers(p).some(x=>engine.recordId(x,'blockers')===human.id),'Human blocker did not close through the controlled resolution path.');\n const agent=record('blockers',1,{STATUS:'OPEN',CLOSURE:'OPEN'},'BLOCKER-AGENT');agent.source='APPLICATION_DISPOSITION';p.projectData.blockers.push(agent);let rejected=false;try{engine.resolveHumanBlocker(p,{blockerId:'BLOCKER-AGENT',resolutionEvidence:'not authorized',operatorLabel:'VERIFY'});}catch{rejected=true;}assert(rejected,'Human resolution control was allowed to close a non-human blocker.');\n}\n\n"""
          if tests not in s:
