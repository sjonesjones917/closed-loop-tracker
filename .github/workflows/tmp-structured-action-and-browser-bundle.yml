name: Finish structured action and package browser app
on:
  push:
    branches: [fix/complete-all-stage-prompts-main-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-all-stage-prompts-main-20260830
          fetch-depth: 0
      - name: Apply source changes
        run: python3 tmp-structured-patch.py
      - name: Package application for browser use
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-app-browser-bundle
          path: |
            index.html
            workbook.js
            hash.js
            workflow-schema.js
            test-runtime.js
            test-worker.js
            workflow-engine.js
            prompt-engine.js
            response-ingestion.js
            project-store.js
            app-core.js
            TEST_PROJECT.json
          retention-days: 1
      - name: Commit implementation and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/tmp-structured-action-and-browser-bundle.yml tmp-structured-patch.py
          git add workflow-schema.js workflow-engine.js app-core.js
          git commit -m 'Implement structured operator actions end to end'
          git push origin HEAD:fix/complete-all-stage-prompts-main-20260830
