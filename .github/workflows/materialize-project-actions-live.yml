name: Materialize Project actions live repair
on:
  push:
    branches: [fix/project-actions-live-20260830]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Repair Project actions live toggle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-actions-live-20260830
      - name: Add native details state synchronization
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          anchor='<script>(()=>{const sync=()=>{const select=document.getElementById(\'stage-picker\');'
          if anchor not in s:
            raise SystemExit('stage-picker inline-script anchor not found')
          script="""<script>(()=>{const menu=document.querySelector('.project-action-menu'),toggle=document.getElementById('project-actions-toggle');if(!menu||!toggle)return;const sync=()=>toggle.setAttribute('aria-expanded',menu.open?'true':'false');menu.addEventListener('toggle',sync);sync();})();</script>\n"""
          if 'menu.addEventListener(\'toggle\',sync)' not in s:
            s=s.replace(anchor,script+anchor,1)
          p.write_text(s)
          Path('.github/workflows/materialize-project-actions-live.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/materialize-project-actions-live.yml
          git commit -m 'Repair Project actions live toggle'
          git push origin fix/project-actions-live-20260830
