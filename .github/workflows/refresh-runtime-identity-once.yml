name: Refresh runtime identity once
on:
  push:
    branches:
      - fix/final-controlling-v3-20260830
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-controlling-v3-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh shared runtime identity and restore established prompt preview height
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('runtime-1c329919060e7a50','runtime-31b7b6b3a4d6535d')
          s=s.replace('.expandable-prompt{max-height:280px}', '.expandable-prompt{height:280px;max-height:280px}')
          p.write_text(s)
          PY
          rm -f .github/workflows/refresh-runtime-identity-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/refresh-runtime-identity-once.yml
          git diff --cached --check
          git commit -m "Refresh runtime cache identity and restore prompt preview baseline"
          git push origin HEAD:fix/final-controlling-v3-20260830
