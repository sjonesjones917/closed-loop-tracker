name: One-time Test IR DAG owner repair
on:
  push:
    branches: [fix/test-ir-explicit-dag]
permissions:
  contents: write
jobs:
  repair-and-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/test-ir-explicit-dag
          fetch-depth: 0
      - name: Repair the single Test IR owner
        shell: bash
        run: |
          set -euo pipefail
          node repair-test-runtime-dag-bootstrap.mjs
          node --check test-runtime.js
          node --check test-worker.js
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime-dag.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Remove one-time repair scaffolding and commit owner changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f repair-test-runtime-dag.mjs repair-test-runtime-dag-bootstrap.mjs .repair-test-runtime-dag.compiled.mjs .github/workflows/test-ir-dag-repair.yml
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A test-runtime.js verify-test-runtime-v3.mjs verify-test-runtime-dag.mjs repair-test-runtime-dag.mjs repair-test-runtime-dag-bootstrap.mjs .github/workflows/test-ir-dag-repair.yml
          git commit -m "Replace implicit Test IR pipeline with explicit DAG semantics"
          git push origin HEAD:fix/test-ir-explicit-dag
