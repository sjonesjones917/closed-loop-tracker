name: Repair human-stage walkthrough accounting

on:
  push:
    branches: [finish/live-human-gate-20260830]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Supply current Stage 01 and Stage 03 accounting to the walkthrough fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('verify-human-stage-walkthrough.mjs')
          text = path.read_text(encoding='utf-8')
          old = "    engine.ensureShape(state);engine.recalculate(state);\n    const checked=[],lane={runId:'RUN-001',contextId:'CTX-001',iterationId:'ITER-001',candidateId:'CAND-001',baselineId:'BASE-001',productId:'PROD-001'};"
          new = "    engine.ensureShape(state);engine.recalculate(state);\n    const intake=prompts.intakeCoverageManifest(state);\n    state.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Build one complete subject-neutral deliverable while preserving every supplied project requirement exactly once.',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((unit,index)=>({sourceUnitId:unit.unitId,sourceRawValueSha256:unit.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'WALKTHROUGH-'+String(index+1),text:unit.rawValueText||unit.label||unit.sourceLocation,statementClass:unit.kind==='SUPPLIED_MATERIAL'?'MATERIAL_REFERENCE':'CONTEXT'}]}))})};\n    state.stages[2].agentData={SOURCE_APPLICABILITY_DETERMINATION:'NO_APPLICABLE_EXTERNAL_SOURCE'};\n    state.stages[3].agentData={ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED:true,SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED:true,NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS:false};\n    const checked=[],lane={runId:'RUN-001',contextId:'CTX-001',iterationId:'ITER-001',candidateId:'CAND-001',baselineId:'BASE-001',productId:'PROD-001'};"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one walkthrough initialization target, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          self_path = Path('.github/workflows/repair-human-stage-walkthrough-accounting.yml')
          if self_path.exists():
              self_path.unlink()
          PY
          node --check verify-human-stage-walkthrough.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-human-stage-walkthrough.mjs .github/workflows
          git commit -m "Use valid intake accounting in human-stage walkthrough"
          git push origin HEAD:finish/live-human-gate-20260830
