name: Apply runtime cache token
on:
  push:
    branches: [spec-v3-zero-loss-20260830]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spec-v3-zero-loss-20260830}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply token only
        run: |
          node repair-runtime-cache-token.mjs
          node verify-hash.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f repair-runtime-cache-token.mjs
          git add index.html
          git commit -m "Sync runtime cache identity"
          git push origin HEAD:spec-v3-zero-loss-20260830