name: Repair current exact scope
on:
  push:
    branches: [repair/scope-current-2612]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[scope-current-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/scope-current-2612
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply scope contract to current main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('workflow-schema.js'); s=p.read_text()
          matrix="""const SCOPE_REQUIREMENTS=Object.freeze({
            1:Object.freeze(['projectRevision','inputVersion']),
            2:Object.freeze(['projectRevision','inputVersion','sourceSetVersion']),
            3:Object.freeze(['projectRevision','inputVersion','sourceSetVersion','researchVersion']),
            4:Object.freeze(['projectRevision','inputVersion','sourceSetVersion','researchVersion','requirementsVersion']),
            5:Object.freeze(['projectRevision','inputVersion','sourceSetVersion','researchVersion','requirementsVersion']),
            6:Object.freeze(['projectRevision','requirementsVersion','testSuiteVersion']),
            7:Object.freeze(['projectRevision','requirementsVersion','testSuiteVersion']),
            8:Object.freeze(['projectRevision','requirementsVersion','testSuiteVersion','instructionVersion']),
            9:Object.freeze(['projectRevision','requirementsVersion','testSuiteVersion','instructionVersion']),
            10:Object.freeze(['projectRevision','requirementsVersion','testSuiteVersion','instructionVersion','iterationId','candidateId']),
            11:Object.freeze(['projectRevision','iterationId','candidateId','runId']),
            12:Object.freeze(['projectRevision','iterationId','candidateId','runId','requirementsVersion','testSuiteVersion']),
            13:Object.freeze(['projectRevision','iterationId','candidateId','requirementsVersion','testSuiteVersion','instructionVersion']),
            14:Object.freeze(['projectRevision','iterationId','candidateId','requirementsVersion','testSuiteVersion','instructionVersion']),
            15:Object.freeze(['projectRevision','iterationId','candidateId','requirementsVersion','testSuiteVersion','instructionVersion']),
            16:Object.freeze(['projectRevision','iterationId','candidateId','requirementsVersion','testSuiteVersion','instructionVersion']),
            17:Object.freeze(['projectRevision','iterationId','candidateId','requirementsVersion','testSuiteVersion','instructionVersion']),
            18:Object.freeze(['projectRevision','iterationId','candidateId','requirementsVersion','testSuiteVersion','instructionVersion']),
            19:Object.freeze(['projectRevision','sourceConvergedIterationId','confirmationIterationId','candidateId','requirementsVersion','testSuiteVersion','instructionVersion']),
            20:Object.freeze(['projectRevision','confirmationIterationId','baselineId']),
            21:Object.freeze(['projectRevision','baselineId','productId']),
            22:Object.freeze(['projectRevision','baselineId','productId','productVersion','requirementsVersion','testSuiteVersion']),
            23:Object.freeze(['projectRevision','baselineId','productId','productVersion','requirementsVersion','testSuiteVersion']),
            24:Object.freeze(['projectRevision','baselineId','productId','productVersion','requirementsVersion','testSuiteVersion']),
            25:Object.freeze(['projectRevision','baselineId','productId','productVersion','deliveryCandidateSetId']),
            26:Object.freeze(['projectRevision','baselineId','productId','productVersion','deliveryCandidateSetId','reviewVersion']),
            27:Object.freeze(['projectRevision','baselineId','productId','productVersion','deliveryCandidateSetId','reconciledReviewVersion']),
            28:Object.freeze(['projectRevision','baselineId','productId','productVersion','deliveryCandidateSetId','releaseId']),
            29:Object.freeze(['projectRevision','baselineId','productId','productVersion','deliveryCandidateSetId','releaseId','hashReviewId']),
            30:Object.freeze(['projectRevision','baselineId','productId','productVersion','deliveryCandidateSetId','releaseId','hashReviewId','evidenceChainVersion'])
          });"""
          s,n=re.subn(r'^const SCOPE_REQUIREMENTS=.*$',matrix,s,count=1,flags=re.M)
          if n!=1: raise SystemExit('SCOPE_REQUIREMENTS authority not found exactly once')
          op="function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};const scopeRequirements=override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[];return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),allowedStageData:Object.freeze(override.allowedStageData||STAGE_CONTRACTS[stage]?.allowedStageData||[]),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(scopeRequirements)});}"
          s,n=re.subn(r'^function operationContract\(stage,operation\).*$',op,s,count=1,flags=re.M)
          if n!=1: raise SystemExit('operationContract authority not found')
          p.write_text(s)

          p=Path('prompt-engine.js'); s=p.read_text()
          selected="function selectedContextRecords(state,collection,scope={}){const laneScope=Object.fromEntries(Object.entries(scope||{}).filter(([,value])=>value!==undefined&&value!==null&&value!==''));let selected=workflow.recordsForCurrentScope(state,collection,laneScope);if(collection==='runs'&&scope.runId)selected=selected.filter(record=>recordId(record,'runs')===String(scope.runId));if(collection==='freshContexts'&&scope.contextId)selected=selected.filter(record=>recordId(record,'freshContexts')===String(scope.contextId));return selected;}"
          s,n=re.subn(r'^function selectedContextRecords\(state,collection,scope=\{\}\).*$',selected,s,count=1,flags=re.M)
          if n!=1: raise SystemExit('selectedContextRecords not found')
          scope="function scopeFor(stage,state,overrides={}){const job=state?.job||{},own=(key,fallback)=>Object.prototype.hasOwnProperty.call(overrides,key)?overrides[key]:fallback,iterationId=own('iterationId',job.CURRENT_ITERATION||null),candidate=safe(state?.projectData?.candidateFreezes).filter(x=>x?.active!==false&&!x?.invalidatedBy).filter(x=>!iterationId||String(recordValue(x,'ITERATION_ID')||x?.scope?.iterationId||'')===String(iterationId)).at(-1),all={projectRevision:Number(state?.revision||0),inputVersion:job.CURRENT_INPUT_VERSION||null,sourceSetVersion:job.CURRENT_SOURCE_SET_VERSION||null,researchVersion:job.CURRENT_RESEARCH_VERSION||null,requirementsVersion:job.CURRENT_REQUIREMENTS_VERSION||null,testSuiteVersion:job.CURRENT_TEST_SUITE_VERSION||null,instructionVersion:job.CURRENT_INSTRUCTION_VERSION||null,iterationId,candidateId:own('candidateId',candidate?recordId(candidate,'candidateFreezes'):null),runId:own('runId',null),contextId:own('contextId',null),sourceConvergedIterationId:own('sourceConvergedIterationId',null),confirmationIterationId:own('confirmationIterationId',null),baselineId:own('baselineId',!placeholder(job.CURRENT_BASELINE_ID)?job.CURRENT_BASELINE_ID:null),productId:own('productId',!placeholder(job.CURRENT_PRODUCT_ID)?job.CURRENT_PRODUCT_ID:null),productVersion:own('productVersion',!placeholder(job.CURRENT_PRODUCT_VERSION)?job.CURRENT_PRODUCT_VERSION:null),deliveryCandidateSetId:own('deliveryCandidateSetId',!placeholder(job.CURRENT_DELIVERY_CANDIDATE_SET_ID)?job.CURRENT_DELIVERY_CANDIDATE_SET_ID:null),reviewVersion:own('reviewVersion',!placeholder(job.CURRENT_REVIEW_VERSION)?job.CURRENT_REVIEW_VERSION:null),reconciledReviewVersion:own('reconciledReviewVersion',!placeholder(job.CURRENT_RECONCILED_REVIEW_VERSION)?job.CURRENT_RECONCILED_REVIEW_VERSION:null),releaseId:own('releaseId',!placeholder(job.CURRENT_RELEASE_ID)?job.CURRENT_RELEASE_ID:null),hashReviewId:own('hashReviewId',!placeholder(job.CURRENT_HASH_REVIEW_ID)?job.CURRENT_HASH_REVIEW_ID:null),evidenceChainVersion:own('evidenceChainVersion',!placeholder(job.CURRENT_EVIDENCE_CHAIN_VERSION)?job.CURRENT_EVIDENCE_CHAIN_VERSION:null)};const required=schema.operationContract(stage,selectedOperationForScope(stage,overrides))?.scopeRequirements||schema.SCOPE_REQUIREMENTS?.[stage]||[];return Object.fromEntries(required.map(key=>[key,all[key]]));}\nfunction selectedOperationForScope(stage,overrides){return String(overrides?.operation||schema.STAGE_OPERATIONS?.[stage]?.[0]||'COMPLETE');}"
          s,n=re.subn(r'^function scopeFor\(stage,state,overrides=\{\}\).*$',scope,s,count=1,flags=re.M)
          if n!=1: raise SystemExit('scopeFor not found')
          p.write_text(s)

          p=Path('response-ingestion.js'); s=p.read_text()
          keys="const RESPONSE_SCOPE_KEYS=Object.freeze(['projectRevision','inputVersion','sourceSetVersion','researchVersion','requirementsVersion','testSuiteVersion','instructionVersion','iterationId','candidateId','runId','contextId','sourceConvergedIterationId','confirmationIterationId','baselineId','productId','productVersion','deliveryCandidateSetId','reviewVersion','reconciledReviewVersion','releaseId','hashReviewId','evidenceChainVersion']);"
          s,n=re.subn(r'^const RESPONSE_SCOPE_KEYS=.*$',keys,s,count=1,flags=re.M)
          if n!=1: raise SystemExit('RESPONSE_SCOPE_KEYS not found')
          p.write_text(s)

          p=Path('verify-ingestion.mjs'); s=p.read_text()
          lines=s.splitlines()
          out=[]
          for line in lines:
            if "JOB-PARALLEL-PROMPT-VALIDATION" in line:
              line=line.replace("stage=17","stage=11").replace("scope:{runId:'RUN-A',contextId:'CTX-A'}","scope:{runId:'RUN-A'}").replace("scope:{runId:'RUN-B',contextId:'CTX-B'}","scope:{runId:'RUN-B'}")
            if "JOB-SCOPED-CLARIFICATION" in line:
              line=line.replace("stage=17","stage=11").replace("scope:{runId:'RUN-CLARIFY',contextId:'CTX-CLARIFY'}","scope:{runId:'RUN-CLARIFY'}")
              line=line.replace("x.scope?.runId==='RUN-CLARIFY'&&x.scope?.contextId==='CTX-CLARIFY'","x.scope?.runId==='RUN-CLARIFY'&&!Object.prototype.hasOwnProperty.call(x.scope||{},'contextId')")
              line=line.replace("Scoped clarification did not regenerate the exact operation/run prompt.","Scoped clarification did not regenerate the exact Stage 11 operation/run scope.")
            out.append(line)
          s='\n'.join(out)+'\n'
          old="""// Raw capture audit scope must be controlled by the persisted prompt, not a caller-supplied context hint.
          {
            const p=project('JOB-RAW-SCOPE');
            p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';
            const prompt=fixtureBuildPrompt(17,p,{operation:'EXECUTE_RUN',scope:{iterationId:'ITERATION-SCOPE-001',candidateId:'CANDIDATE-SCOPE-001',runId:'RUN-SCOPE-001',contextId:'CONTEXT-SCOPE-001'}});
            p.projectData.generatedPrompts.push({...prompt,generatedAt:new Date().toISOString()});
            const captured=ingestion.captureRaw(p,{stage:17,text:'{}',promptRecord:prompt,contextId:'MISLEADING-CALLER-CONTEXT'});
            if(captured.rawRecord.runId!=='RUN-SCOPE-001'||captured.rawRecord.contextId!=='CONTEXT-SCOPE-001'||captured.rawRecord.iteration!=='ITERATION-SCOPE-001')throw new Error('Raw-response audit identity is not bound to the controlling prompt scope.');
          }
          """.replace('          ','')
          new="""// Raw capture audit scope must preserve the exact registered prompt scope; caller hints cannot add scope dimensions.
          {
            const p=project('JOB-RAW-SCOPE');
            p.job.CURRENT_ITERATION='ITERATION-SCOPE-001';
            const prompt=fixtureBuildPrompt(11,p,{operation:'EXECUTE_RUN',scope:{iterationId:'ITERATION-SCOPE-001',candidateId:'CANDIDATE-SCOPE-001',runId:'RUN-SCOPE-001'}});
            p.projectData.generatedPrompts.push({...prompt,generatedAt:new Date().toISOString()});
            const captured=ingestion.captureRaw(p,{stage:11,text:'{}',promptRecord:prompt,contextId:'MISLEADING-CALLER-CONTEXT'});
            if(captured.rawRecord.runId!=='RUN-SCOPE-001'||captured.rawRecord.iteration!=='ITERATION-SCOPE-001')throw new Error('Raw-response audit identity lost the controlling Stage 11 prompt scope.');
            if(Object.prototype.hasOwnProperty.call(captured.rawRecord.promptScope||{},'contextId')||JSON.stringify(captured.rawRecord.promptScope)!==JSON.stringify(prompt.scope))throw new Error('Caller-supplied context leaked into the registered prompt scope.');
          }
          """.replace('          ','')
          if old not in s: raise SystemExit('raw scope fixture not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('verify-spec3-contract.mjs'); s=p.read_text()
          call="const {execFileSync}=await import('node:child_process');execFileSync(process.execPath,['verify-stage-operation-scope-matrix.mjs'],{stdio:'inherit'});"
          if call not in s: s=s.rstrip()+"\n"+call+"\n"
          p.write_text(s)
          PY
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node verify-stage-operation-scope-matrix.mjs
          node verify-ingestion.mjs
          node verify-spec3-contract.mjs
          node verify.mjs
          rm .github/workflows/repair-current-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js prompt-engine.js response-ingestion.js verify-ingestion.mjs verify-spec3-contract.mjs verify-stage-operation-scope-matrix.mjs .github/workflows/repair-current-scope.yml
          git commit -m 'Conform exact stage-operation scope on current main [scope-current-applied]'
          git push origin HEAD:repair/scope-current-2612
