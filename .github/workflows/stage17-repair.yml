name: Stage 17 repair

on:
  push:
    branches:
      - controller-stage17-requirement-resolution-20260904

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - name: Apply Stage 17 repair and remove one-time repair files
        run: |
          set -euo pipefail
          python stage17-repair.py
          rm stage17-repair.py .github/workflows/stage17-repair.yml
      - name: Verify repaired Stage 17 behavior
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check app-core.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-full-cycle.mjs
          node verify-semantic-operation-boundaries.mjs
          node build-test-project.mjs
      - name: Commit repaired runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Stage 17: enforce independent requirement review"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
