name: Stage 01 browser diagnostic

on:
  push:
    branches: [fix/stage01-atomic-intake-self-staleness-20260909]
    paths:
      - diagnose-stage01-browser.mjs
      - .github/workflows/stage01-browser-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply tested repair and diagnostic instrumentation
        run: |
          set -euo pipefail
          node diagnose-stage01-browser.mjs
          node --check workflow-engine.js
          node --check verify-browser-extra.mjs
      - name: Reproduce browser result with diagnostics
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/closed-loop-stage01-browser-diag-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome)"
          test -n "$BROWSER"
          node verify-browser-extra.mjs
