name: Controller 3 semantic fixture repair
on:
  push:
    branches: [controller3-runtime-closure-20260904]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[controller3-fixture-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-runtime-closure-20260904
          fetch-depth: 0
      - name: Repair stale semantic capability fixture and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-semantic-invariant.mjs')
          s=p.read_text()
          old="q.job.AVAILABLE_TOOLS='SOLIDWORKS_IMPORT';plan=engine.testExecutionPlan(q).items[0];assert(plan.executableNow&&plan.operatorAction==='SEND_TO_TOOL_AGENT','Affirmatively available external capability did not restore routing');"
          new="q.projectData.externalCapabilities.push({id:'CAPABILITY-SOLIDWORKS',active:true,scope:{inputVersion:q.job.CURRENT_INPUT_VERSION},fields:{CAPABILITY_ID:'CAPABILITY-SOLIDWORKS',CAPABILITY_CLAIM:'SOLIDWORKS_IMPORT',FRESHNESS_STATUS:'CURRENT',STATUS:'CURRENT',AUTHORIZED:true,PERMISSIONS_READY:true,INPUTS_TRANSFERABLE:true,ROUTE_USABLE:true,EVIDENCE_OBTAINABLE:true}});plan=engine.testExecutionPlan(q).items[0];assert(plan.executableNow&&plan.operatorAction==='SEND_TO_TOOL_AGENT','Affirmatively available canonical external capability did not restore routing');"
          if old not in s:
              raise SystemExit('stale capability fixture text not found')
          p.write_text(s.replace(old,new))
          PY
          node verify-semantic-invariant.mjs
          rm .github/workflows/controller3-fix-semantic-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-semantic-invariant.mjs .github/workflows/controller3-fix-semantic-fixture.yml
          git commit -m 'Repair semantic capability fixture [controller3-fixture-fixed]'
          git push origin HEAD:controller3-runtime-closure-20260904