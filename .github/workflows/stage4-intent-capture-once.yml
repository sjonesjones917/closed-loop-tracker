name: Apply minimal Stage 1 intent-capture correction
on:
  push:
    branches: [fix/stage4-intent-capture-minimal]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-intent-capture-minimal
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch only the Stage 1 capture contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('prompt-engine.js')
          text = path.read_text()
          old1 = "If their actual contents are available in the current executing context, read only the minimum portions needed to identify the requested objective or deliverable or to resolve a genuinely Stage-01-blocking ambiguity; do not ask the human to re-enter facts that are already present in those materials."
          new1 = "If their actual contents are available in the current executing context, inspect them deeply enough to capture every human-authority statement relevant to defining the job while staying inside the Stage 01 boundary; do not atomize requirements or perform later-stage work, and do not ask the human to re-enter facts that are already present in those materials."
          old2 = "INPUT_SET_CONTENTS should identify the top-level supplied human inputs and attached materials available to this job. Do not turn it into a Stage 02 archive/file inventory."
          new2 = "INPUT_SET_CONTENTS must preserve the substantive human-authority statements already available from each supplied intent or material file, together with the material name or reference needed to trace them. Do not return only filenames, a material list, or a summary that drops supplied requirements. Do not turn it into a Stage 02 archive/file inventory."
          if text.count(old1) != 1:
              raise SystemExit(f'expected exactly one first Stage 1 capture sentence, found {text.count(old1)}')
          if text.count(old2) != 1:
              raise SystemExit(f'expected exactly one INPUT_SET_CONTENTS sentence, found {text.count(old2)}')
          text = text.replace(old1, new1).replace(old2, new2)
          path.write_text(text)
          PY
          node --check prompt-engine.js
          node verify-prompt-semantics.mjs
      - name: Commit the one-file correction and remove this one-time workflow
        run: |
          rm .github/workflows/stage4-intent-capture-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js .github/workflows/stage4-intent-capture-once.yml
          git commit -m "Fix Stage 1 intent capture for Stage 4 reuse"
          git push origin HEAD:fix/stage4-intent-capture-minimal
