name: Replay final integrity on current main
on:
  push:
    branches: [reliability/final-integrity-authority-final-20260826]
permissions:
  contents: write
jobs:
  replay:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-replay-final-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/final-integrity-authority-final-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply proved semantic repair to current main
        shell: bash
        run: |
          git show c72ed2b16362fc663028bbc12fc87e7e1c346c15:.github/workflows/final-integrity-authority-repair.yml > /tmp/original-repair.yml
          python3 - <<'PY'
          from pathlib import Path
          y=Path('/tmp/original-repair.yml').read_text()
          body=y.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          lines=[]; skipping=False
          for line in body.splitlines():
              line=line[10:] if line.startswith('          ') else line
              if line.strip()=="# Generic current and historical record-integrity assertion before final output.": skipping=True; continue
              if skipping:
                  if line.strip()=="p.write_text(s)": lines.append(line); skipping=False
                  continue
              lines.append(line)
          Path('/tmp/repair.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/repair.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-complete.mjs'); s=p.read_text()
          a="const p=project('JOB-CHAIN');p.projectData.requirements.push(record('requirements',4,{OBLIGATION:'Synthetic mandatory requirement'"
          b="const p=project('JOB-CHAIN');const req=record('requirements',4,{OBLIGATION:'Synthetic mandatory requirement'"
          if s.count(a)==1:
              s=s.replace(a,b,1)
              a2="},'REQ-TEST'));\n  const chains=engine.constructEvidenceChains(p);"
              b2="},'REQ-TEST');req.scope=engine.currentScope(p);p.projectData.requirements.push(req);\n  const chains=engine.constructEvidenceChains(p);"
              if s.count(a2)!=1: raise SystemExit('Stage29 fixture close mismatch')
              s=s.replace(a2,b2,1)
          old="let p=project('JOB-SCOPED-ACCEPTED-REFINEMENT'),stage=11;p.job.CURRENT_ITERATION='ITERATION-REFINE';\n const slots=engine.reserveRunBatch(p,{stage,iterationId:'ITERATION-REFINE',candidateId:'CANDIDATE-REFINE',count:10});"
          new="let p=project('JOB-SCOPED-ACCEPTED-REFINEMENT'),stage=11;const bytes=new TextEncoder().encode('refinement-candidate');engine.registerArtifactBytes(p,{stage:10,artifactId:'ARTIFACT-REFINE',filename:'refine.bin',mediaType:'application/octet-stream',byteSize:bytes.byteLength,sha256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'});const frozen=engine.freezeCandidate(p,{stage:10,artifactIds:['ARTIFACT-REFINE'],operatorLabel:'VERIFY'}),iterationId=engine.recordId(frozen.iteration,'iterations'),candidateId=engine.recordId(frozen.candidate,'candidateFreezes');\n const slots=engine.reserveRunBatch(p,{stage,iterationId,count:10});for(const slot of slots){const run=engine.records(p,'runs').find(r=>engine.recordId(r,'runs')===slot.runId);assert(engine.recordValue(run,'CANDIDATE_ID')===candidateId,'Scoped refinement fixture did not reserve the canonical iteration candidate.');}"
          if s.count(old)==1: s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('workflow-schema.js'); s=p.read_text()
          s=s.replace("const VALUE_TYPES=Object.freeze(['STRING','INTEGER','NUMBER','BOOLEAN','STRING_ARRAY','REFERENCE','REFERENCE_ARRAY','OBJECT']);","const VALUE_TYPES=Object.freeze(['STRING','INTEGER','NUMBER','BOOLEAN','STRING_ARRAY','REFERENCE','REFERENCE_ARRAY','OBJECT','OBJECT_ARRAY']);")
          head,sep,tail=s.partition('const EXPLICIT_RECORD_FIELD_TYPES=Object.freeze(')
          if not sep: raise SystemExit('record type registry missing')
          changes={'COMPONENT_MANIFEST':'OBJECT_ARRAY','COMPONENT_VERSIONS':'OBJECT','IMMUTABLE_LOCATIONS':'STRING_ARRAY','APPROVED_VERSIONS':'OBJECT','IMMUTABLE_ARTIFACT_RECORDS':'STRING_ARRAY'}
          for field,t in changes.items():
              old=f'"{field}":{{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"STRING"}}'; new=f'"{field}":{{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"{t}"}}'
              if tail.count(old)==1: tail=tail.replace(old,new,1)
              elif new not in tail: raise SystemExit(f'{field} type not found in expected old/new state')
          p.write_text(head+sep+tail)
          p=Path('response-ingestion.js'); s=p.read_text(); old="else if(t==='OBJECT'&&!object(value))issues.push(issue('WRONG_VALUE_TYPE',path,'Expected OBJECT.'));"; new="else if(t==='OBJECT'&&!object(value))issues.push(issue('WRONG_VALUE_TYPE',path,'Expected OBJECT.'));else if(t==='OBJECT_ARRAY'&&(!Array.isArray(value)||value.some(v=>!object(v))))issues.push(issue('WRONG_VALUE_TYPE',path,'Expected OBJECT_ARRAY.'));"; s=s.replace(old,new,1) if old in s and new not in s else s; p.write_text(s)
          p=Path('verify-full-cycle.mjs'); s=p.read_text(); old="case 'STRING_ARRAY':case 'REFERENCE_ARRAY':return Array.isArray(value)&&value.every(item=>typeof item==='string');case 'OBJECT':return value!==null&&typeof value==='object'&&!Array.isArray(value);default:return false;"; new="case 'STRING_ARRAY':case 'REFERENCE_ARRAY':return Array.isArray(value)&&value.every(item=>typeof item==='string');case 'OBJECT':return value!==null&&typeof value==='object'&&!Array.isArray(value);case 'OBJECT_ARRAY':return Array.isArray(value)&&value.every(item=>item!==null&&typeof item==='object'&&!Array.isArray(item));default:return false;"; s=s.replace(old,new,1) if old in s else s; integrity="for(const [collection,definition] of Object.entries(schema.RECORD_SCHEMAS))for(const record of p.projectData[collection]||[]){if(record.recordSha256)assert(record.recordSha256===hash.recordSha256(record),`${collection} ${engine.recordId(record,collection)} has a stale recordSha256.`);if(record.contentSha256)assert(record.contentSha256===hash.contentRecordSha256(record,definition.idField),`${collection} ${engine.recordId(record,collection)} has a stale contentSha256.`);}\n"; s += ('\n'+integrity) if integrity not in s else ''; p.write_text(s)
          PY
          rm -f .github/workflows/replay-final-integrity-final.yml
      - name: Run deterministic acceptance on exact current-main replay
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node verify-hash.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit exact passing replay
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replay final authority and integrity closure on current main [semantic-replay-final-complete]"
          git push origin HEAD:reliability/final-integrity-authority-final-20260826
