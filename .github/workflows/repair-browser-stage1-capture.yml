name: One-time retained Stage 1 capture repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/closed-loop-v3-final-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch retained-project Stage 1 capture
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function once(text,from,to,label){const a=text.indexOf(from),b=text.lastIndexOf(from);if(a<0||a!==b)throw new Error(`${label}: expected exactly one match`);return text.slice(0,a)+to+text.slice(a+from.length);}
          {
            const path='app-core.js';let text=fs.readFileSync(path,'utf8');
            const from="p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:p.job.EXACT_DELIVERABLE_REQUESTED||'',ASSUMPTIONS:p.job.ASSUMPTIONS||'',UNKNOWN_INFORMATION:p.job.UNKNOWN_INFORMATION||'',INPUT_SET_CONTENTS:p.job.INPUT_SET_CONTENTS||''};";
            const to="const legacyStage01Capture=JSON.stringify({userJobInput:clone(raw.userJobInput||{}),suppliedMaterials:clone(raw.suppliedMaterials||[]),jobTitle:raw.title||'',jobOwner:raw.jobOwner||''});p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:p.job.EXACT_DELIVERABLE_REQUESTED||'',ASSUMPTIONS:p.job.ASSUMPTIONS||'',UNKNOWN_INFORMATION:p.job.UNKNOWN_INFORMATION||'',INPUT_SET_CONTENTS:legacyStage01Capture};";
            if(!text.includes('const legacyStage01Capture=JSON.stringify('))text=once(text,from,to,'app-core retained Stage 1 capture');
            fs.writeFileSync(path,text);
          }
          {
            const path='verify-browser.mjs';let text=fs.readFileSync(path,'utf8');
            const from="assert(String(retained.stages['1']?.agentData?.INPUT_SET_CONTENTS||retained.stages['1']?.acceptedData?.INPUT_SET_CONTENTS||'').trim().length>0,'Legacy Stage 01 accepted input-set capture was not preserved.');";
            const to="const retainedInputCapture=String(retained.stages['1']?.agentData?.INPUT_SET_CONTENTS||retained.stages['1']?.acceptedData?.INPUT_SET_CONTENTS||'');assert(retainedInputCapture.trim().length>0,'Legacy Stage 01 accepted input-set capture was not preserved.');assert(retainedInputCapture.includes(String(retained.job.EXACT_USER_OBJECTIVE_VERBATIM||'')),'Legacy Stage 01 accepted input-set capture does not contain the preserved exact user objective.');";
            if(!text.includes('retainedInputCapture.includes'))text=once(text,from,to,'browser retained capture regression');
            fs.writeFileSync(path,text);
          }
          NODE
          node --check app-core.js
          node --check verify-browser.mjs
          git diff --check
      - name: Commit integrated repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "closed-loop-repair-bot"
          git config user.email "closed-loop-repair-bot@users.noreply.github.com"
          git add app-core.js verify-browser.mjs
          git commit -m "Capture retained Stage 1 human authority once"
          git rm .github/workflows/repair-browser-stage1-capture.yml
          git commit -m "Remove completed retained Stage 1 capture repair workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
