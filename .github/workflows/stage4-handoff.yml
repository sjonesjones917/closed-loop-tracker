name: Apply Stage 04 exact artifact handoff
on:
  push:
    branches: [stage4-exact-artifact-handoff]
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and verify
        run: |
          python3 .github/stage4_patch.py
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-browser-extra.mjs
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
      - name: Commit integrated change and remove one-time files
        run: |
          rm .github/workflows/stage4-handoff.yml .github/stage4_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Stage 04 outgoing artifact handoff explicit"
          git push origin HEAD:stage4-exact-artifact-handoff
