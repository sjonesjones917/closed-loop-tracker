name: One-time final reliability closure
on:
  push:
    branches: [fix/final-reliability-closure-20260830]
permissions:
  contents: write
concurrency:
  group: final-reliability-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-reliability-closure-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the four remaining existing-engine corrections
        run: |
          git fetch origin reliability-hardening-20260829
          for file in app-core.js workflow-engine.js verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-browser.mjs; do
            git show "origin/reliability-hardening-20260829:$file" > "/tmp/reference-$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_exact(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, replacement, label, flags=0):
              matches = list(re.finditer(pattern, text, flags))
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {len(matches)}")
              return re.sub(pattern, lambda _: replacement, text, count=1, flags=flags)

          def line(text, pattern, label):
              match = re.search(pattern, text, re.M)
              if not match:
                  raise SystemExit(f"{label}: reference line not found")
              return match.group(0)

          def block(text, start, end, label):
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f"{label}: start boundary not found")
              last = text.find(end, first)
              if last < 0:
                  raise SystemExit(f"{label}: end boundary not found")
              return text[first:last]

          # app-core.js: show reviewer setup only when Stages 23/24 are actionable,
          # and bind that exact context to the prompt. Stage 04 remains untouched.
          current = read('app-core.js')
          reference = read('/tmp/reference-app-core.js')
          reviewer_line = line(reference, r"^function currentReviewerContext\(n\)\{.*$", 'currentReviewerContext')
          prompt_options = line(reference, r"^function promptOptions\(n\)\{.*$", 'promptOptions')
          current = replace_regex(current, r"^function promptOptions\(n\)\{.*$", reviewer_line + "\n" + prompt_options, 'promptOptions', re.M)
          current = replace_regex(current, r"^function currentStagePrompt\(n\)\{.*$", line(reference, r"^function currentStagePrompt\(n\)\{.*$", 'currentStagePrompt reference'), 'currentStagePrompt', re.M)
          current = replace_regex(current, r"^function controls\(d,locked\)\{.*$", line(reference, r"^function controls\(d,locked\)\{.*$", 'controls reference'), 'controls', re.M)
          reviewer_markup = line(reference, r"^function reviewerContextMarkup\(n,locked\)\{.*$", 'reviewerContextMarkup')
          current = replace_exact(current, "function stagePurposeMarkup(n){", reviewer_markup + "\nfunction stagePurposeMarkup(n){", 'reviewer UI insertion')
          current = replace_exact(current, "${stagePurposeMarkup(n)}${n===1?", "${stagePurposeMarkup(n)}${reviewerContextMarkup(n,locked)}${n===1?", 'reviewer UI render timing')
          current = replace_exact(
              current,
              "  const existing=currentPromptRecord(n);if(existing)return existing;",
              "  const existing=currentPromptRecord(n);if(existing)return existing;if([23,24].includes(Number(n))&&!currentReviewerContext(n))throw new Error('Register a fresh independent reviewer context before saving or copying this reviewer instruction.');",
              'reviewer prompt save gate'
          )
          write('app-core.js', current)

          # workflow-engine.js: reuse the already-tested implementations for
          # Stage 07 fail-closed behavior, reviewer independence, native Test IR
          # routing/input custody, and completed-operation reliability metrics.
          current = read('workflow-engine.js')
          reference = read('/tmp/reference-workflow-engine.js')
          for start, end, label in [
              ("function gate(stage,project){", "\n\nconst applicationadjudicationGate=gate;", 'base gate'),
              ("function evaluateContextIndependence(project,", "\nfunction detectCurrentContradictions", 'independence evaluator'),
              ("function testExecutionPlan(project){", "\nfunction recordApplicationDeterministicResult", 'test execution plan'),
              ("function operationalMetrics(project){", "\n\nglobalThis.closedLoopWorkflowEngine", 'operational metrics'),
          ]:
              current_block = block(current, start, end, label + ' current')
              reference_block = block(reference, start, end, label + ' reference')
              current = replace_exact(current, current_block, reference_block, label)
          current = replace_exact(
              current,
              "if(stage===4){const handoff=executionHandoff(project,{stage:4,operation:'COMPLETE'}),materials=handoff.conversationMaterials.map(item=>item.label);if(materials.length)return 'Send the Stage 04 instruction with '+materials.join(', ')+'. The prompt does not include those materials. When the agent finishes, paste its final JSON response here.';}const plan=testExecutionPlan(project)",
              "if(stage===4){const handoff=executionHandoff(project,{stage:4,operation:'COMPLETE'}),materials=handoff.conversationMaterials.map(item=>item.label);if(materials.length)return 'Send the Stage 04 instruction with '+materials.join(', ')+'. The prompt does not include those materials. When the agent finishes, paste its final JSON response here.';}if([23,24].includes(stage)){const reviewer=records(project,'freshContexts').filter(r=>isActiveRecord(r)&&Number(r.stage)===stage).at(-1);if(!reviewer)return 'Open a fresh independent reviewer context and register its identifier in this stage. The application will bind that identity into the controlling prompt before you send any product or review material.';}const plan=testExecutionPlan(project)",
              'reviewer next action'
          )
          write('workflow-engine.js', current)

          # Append only the focused regression tests from the tested reference.
          current = read('verify-complete.mjs')
          reference = read('/tmp/reference-verify-complete.mjs')
          marker = "\n{\n  const p=project('JOB-EXECUTION-ROUTING-HARDENING');"
          start = reference.find(marker)
          if start < 0:
              raise SystemExit('verify-complete reference block not found')
          if "JOB-EXECUTION-ROUTING-HARDENING" in current:
              raise SystemExit('verify-complete closure tests already present')
          current = current.rstrip() + "\n" + reference[start+1:].rstrip() + "\n"
          write('verify-complete.mjs', current)

          current = read('verify-prompt-semantics.mjs')
          reference = read('/tmp/reference-verify-prompt-semantics.mjs')
          marker = "\n// Independent final-product review prompts carry the application-selected reviewer context identity."
          start = reference.find(marker)
          if start < 0:
              raise SystemExit('reviewer prompt-identity reference block not found')
          if "independentReviewerPromptIdentity" in current:
              raise SystemExit('reviewer prompt-identity tests already present')
          current = current.rstrip() + "\n" + reference[start+1:].rstrip() + "\n"
          write('verify-prompt-semantics.mjs', current)

          # Use the tested full-cycle Stage 23/24 lines with explicit reviewer scope.
          current = read('verify-full-cycle.mjs')
          reference = read('/tmp/reference-verify-full-cycle.mjs')
          for stage, prefix in [(23, "engine.registerFreshContext(p,{stage:23"), (24, "engine.registerFreshContext(p,{stage:24")]:
              replacement = line(reference, rf"^{re.escape(prefix)}.*complete\({stage}\);$", f'full-cycle Stage {stage} reference')
              current = replace_regex(current, rf"^data\({stage},.*complete\({stage}\);$", replacement, f'full-cycle Stage {stage}', re.M)
          write('verify-full-cycle.mjs', current)

          # Prove reviewer setup does not appear on locked future stages.
          current = read('verify-browser.mjs')
          reference = read('/tmp/reference-verify-browser.mjs')
          browser_lines = []
          for stage in (23, 24):
              browser_lines.append(line(reference, rf"^ await openStage\(cdp,{stage}\);assert\(await evalValue\(cdp,`!document\.querySelector\('#reviewer-context-required'\)`\).*$", f'browser Stage {stage} timing'))
          reachability = line(current, r"^ for\(let n=1;n<=30;n\+\+\)\{await openStage\(cdp,n\);.*$", 'browser stage reachability')
          if "Locked future Stage 23 exposed reviewer-context work" in current:
              raise SystemExit('browser reviewer timing tests already present')
          current = replace_exact(current, reachability, reachability + "\n" + "\n".join(browser_lines), 'browser reviewer timing insertion')
          write('verify-browser.mjs', current)
          PY

          node <<'NODE'
          const fs=require('node:fs');
          const {createHash}=require('node:crypto');
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const identity=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          const pattern=/(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+(">)/g;
          let html=fs.readFileSync('index.html','utf8'),count=0;
          html=html.replace(pattern,(_,prefix,suffix)=>{count+=1;return prefix+identity+suffix;});
          if(count!==runtimeFiles.length)throw new Error(`Expected ${runtimeFiles.length} runtime tokens; updated ${count}.`);
          fs.writeFileSync('index.html',html);
          console.log(identity);
          NODE

          rm -f .github/workflows/final-reliability-closure.yml
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*final-reliability-closure*' -print -quit)"
          git diff --check

      - name: Verify syntax and deterministic contracts
        run: |
          node --check app-core.js
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs

      - name: Exercise phone-first browser behavior
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-final-reliability-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Commit the exact tested clean tree
        run: |
          test ! -e .github/workflows/final-reliability-closure.yml
          git config user.name "closed-loop-reliability"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close remaining deterministic reliability gaps"
          git push origin HEAD:fix/final-reliability-closure-20260830
