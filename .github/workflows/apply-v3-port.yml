name: Apply v3 port

on:
  push:
    branches:
      - fix/closed-loop-v3-controlling-spec
    paths:
      - .github/workflows/apply-v3-port.yml
      - tools/apply-v3-current.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and prove v3 repair
        run: python3 tools/apply-v3-current.py
      - name: Publish verified source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
