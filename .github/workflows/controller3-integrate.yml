name: Controller 3 repair chromium governance verifier
on:
  push:
    branches: [controller3-integrate-prompt-chrome-20260904]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Patch verifier and push target branch
        run: |
          set -euo pipefail
          git fetch origin controller3-pin-chromium-20260904
          git checkout -B controller3-pin-chromium-20260904 origin/controller3-pin-chromium-20260904
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-mobile-release-governance.mjs')
          s=p.read_text()
          a=s.index('export function assertWorkflowGovernance(workflow){')
          b=s.index('\n}\n\nconst completePhysicalEvidence=',a)+2
          new=r'''export function assertWorkflowGovernance(workflow){
  assert.doesNotMatch(workflow,/actualAndroidChromeAcceptance/,'Android acceptance must not substitute for the pinned actual-iPhone requirement.');
  assert.match(workflow,/mobile_acceptance_target_json:/,'Authenticated workflow dispatch must accept the pinned mobile target JSON.');
  assert.match(workflow,/mobile_acceptance_evidence_json:/,'Authenticated workflow dispatch must accept physical mobile evidence JSON.');
  assert.match(workflow,/node evaluate-mobile-acceptance-submission\.mjs > \/tmp\/mobile-acceptance\.json/,'The acceptance job must execute the strict mobile-evidence evaluator.');
  assert.match(workflow,/const mobileAcceptance=JSON\.parse\(fs\.readFileSync\('\/tmp\/mobile-acceptance\.json','utf8'\)\)/,'The machine acceptance artifact must consume the evaluator result.');
  assert.match(workflow,/mobileAcceptance\.accepted&&mobileAcceptance\.physicalDeviceObservationAccepted/,'The acceptance calculation must require accepted physical-iPhone observation evidence.');
  assert.match(workflow,/if\(!actualIPhoneSafariAcceptance\) throw new Error/,'Final acceptance publication must fail closed when current physical-iPhone proof is absent.');
  assert.match(workflow,/actualIphoneSafariAcceptanceCoverage:actualIPhoneSafariAcceptance/,'The Section 49 metric must consume the exact physical-iPhone result.');
  assert.match(workflow,/physicalIphoneAcceptance:mobileAcceptance/,'The machine acceptance artifact must retain the complete physical-device evaluator result.');
  assert.match(workflow,/mobile-acceptance-challenge-\$CHALLENGE/,'Accepted challenges must be durably marked as used.');
  const tagStep=workflow.match(/\n\s*- name: Create release tag only after physical-iPhone acceptance\n(?<body>[\s\S]*?)(?=\n\s*- name:|\s*$)/);
  assert.ok(tagStep,'A release-tag step must exist.');
  assert.match(tagStep.groups.body,/^\s*if:\s*github\.event_name\s*==\s*'workflow_dispatch'/m,'Release tagging must be restricted to authenticated workflow dispatch.');
  assert.match(tagStep.groups.body,/\.physicalIphoneAcceptance\.accepted/,'The tag step must consume the generated acceptance artifact physical-device result.');
  assert.match(tagStep.groups.body,/test "\$ACCEPTED" = true/,'The actual remote tag path must fail closed unless physical evidence was accepted.');
  assert.match(tagStep.groups.body,/git push origin/,'The physical acceptance condition must govern the actual remote tag write.');
  assert.match(workflow,/Install pinned Chrome for Testing/,'Required Chromium proof must provision a browser explicitly.');
  assert.match(workflow,/browser-actions\/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4/,'Chrome setup action must be pinned by immutable identity.');
  assert.match(workflow,/chrome-version: '152\.0\.7977\.82'/,'Chrome for Testing version must be pinned.');
  return true;
}'''
          s=s[:a]+new+s[b:]
          old="""const unconditionalMutation=workflow.replace(/\\n\\s*if:\\s*steps\\.acceptance\\.outputs\\.final_acceptance\\s*==\\s*'true'/,'');
assert.throws(()=>assertWorkflowGovernance(unconditionalMutation),/conditionally gated/,'The regression must fail when release tagging becomes unconditional.');
const hardCodedBlockMutation=workflow.replace('...mobileAcceptance,','...mobileAcceptance,actualIPhoneSafariAcceptance:false,');
assert.throws(()=>assertWorkflowGovernance(hardCodedBlockMutation),/hard-code/,'The regression must fail when valid physical evidence is made impossible to accept.');
const missingEvaluatorMutation=workflow.replace('node evaluate-mobile-acceptance-submission.mjs > /tmp/mobile-acceptance.json','true');
assert.throws(()=>assertWorkflowGovernance(missingEvaluatorMutation),/strict mobile-evidence evaluator/,'The regression must fail when the workflow stops executing the evidence verifier.');
"""
          replacement="""const unconditionalMutation=workflow.replace(/\\n\\s*if:\\s*github\\.event_name\\s*==\\s*'workflow_dispatch'/,'');
assert.throws(()=>assertWorkflowGovernance(unconditionalMutation),/authenticated workflow dispatch/,'The regression must fail when release tagging becomes unconditional.');
const physicalBypassMutation=workflow.replace('test \"$ACCEPTED\" = true','true');
assert.throws(()=>assertWorkflowGovernance(physicalBypassMutation),/fail closed/,'The regression must fail when the tag path bypasses accepted physical evidence.');
const missingEvaluatorMutation=workflow.replace('node evaluate-mobile-acceptance-submission.mjs > /tmp/mobile-acceptance.json','true');
assert.throws(()=>assertWorkflowGovernance(missingEvaluatorMutation),/strict mobile-evidence evaluator/,'The regression must fail when the workflow stops executing the evidence verifier.');
"""
          if old not in s: raise SystemExit('mutation block not found')
          s=s.replace(old,replacement,1)
          p.write_text(s)
          PY
          node verify-mobile-release-governance.mjs >/dev/null
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add verify-mobile-release-governance.mjs
          git commit -m "Align mobile governance verifier with pinned Chromium gate"
          git push origin HEAD:controller3-pin-chromium-20260904
