name: Apply reconciled controller runtime corrections
on:
  push:
    branches: [controller3-prompt-byte-identity-rerun-20260904]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-prompt-byte-identity-rerun-20260904
          fetch-depth: 0
      - name: Copy disjoint immutable implementation files
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=3f00e59967d88bd8b379fd636a35e349e866fb0a
          PROMPT=554a09bf84281e5cdd9e68dc9ab4f75bba640737
          raw="https://raw.githubusercontent.com/sjonesjones917/closed-loop-tracker"
          for f in workflow-engine.js workflow-schema.js verify-complete.mjs verify-contract-closure.mjs verify-stage01-intake-closure.mjs verify-capability-readiness.mjs; do curl -fsSL "$raw/$RUNTIME/$f" -o "$f"; done
          for f in build-test-project.mjs verify-browser.mjs verify-file-first-response.mjs verify-prompt-semantics.mjs verify.mjs; do curl -fsSL "$raw/$PROMPT/$f" -o "$f"; done
          curl -fsSL "$raw/$RUNTIME/prompt-engine.js" -o /tmp/a
          curl -fsSL "$raw/6206234856cdcaf7e83de6943540db09cfe3c4e2/prompt-engine.js" -o /tmp/b
          curl -fsSL "$raw/$PROMPT/prompt-engine.js" -o /tmp/c
      - name: Merge prompt authority corrections
        run: git merge-file -p /tmp/a /tmp/b /tmp/c > prompt-engine.js
      - name: Align affected fixed-oracle fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
          'verify-spec-grounded-route-oracle.mjs':("extractedStatements:[{statementKey:`S${i+1}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT'}]","extractedStatements:[{statementKey:`S${i+1}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT',sourceLocation:u.kind==='SUPPLIED_MATERIAL'?u.sourceLocation:undefined}]"),
          'verify-stage-prompts-complete.mjs':("'STRICT RESPONSE CONTRACT'","'RESPONSE CONTRACT DEFINITIONS'"),
          'verify-human-stage-walkthrough.mjs':("if(!text.includes('STRICT RESPONSE CONTRACT'))throw new Error(`Stage ${stage} generated prompt lacks response contract.`);","if(!text.includes('RESPONSE CONTRACT DEFINITIONS')||!text.includes('closed-loop-stage-response/3'))throw new Error(`Stage ${stage} generated prompt lacks response contract.`);")}
          for path,(old,new) in replacements.items():
              p=Path(path); s=p.read_text()
              if old in s: s=s.replace(old,new,1)
              if new not in s: raise SystemExit(f'unresolved verifier anchor: {path}')
              p.write_text(s)
          PY
      - name: Commit final one-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/controller3-integrate.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Enforce file-first runtime closure contracts'
          git push origin HEAD:controller3-prompt-byte-identity-rerun-20260904
