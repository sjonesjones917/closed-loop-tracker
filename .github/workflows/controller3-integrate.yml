name: Apply reconciled controller runtime corrections
on:
  push:
    branches: [controller3-prompt-byte-identity-rerun-20260904]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-prompt-byte-identity-rerun-20260904
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconcile behavior-backed corrections
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main controller3-runtime-current-main-replay-20260904 controller3-prompt-byte-identity-20260904
          test "$(git rev-parse HEAD^)" = "cc8be2d01d364ab493a93a1d00c72298d08e4cf1" || test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          BASE=6206234856cdcaf7e83de6943540db09cfe3c4e2
          RUNTIME=origin/controller3-runtime-current-main-replay-20260904
          PROMPT=origin/controller3-prompt-byte-identity-20260904
          for f in workflow-engine.js workflow-schema.js verify-complete.mjs verify-contract-closure.mjs verify-stage01-intake-closure.mjs verify-capability-readiness.mjs; do git show "$RUNTIME:$f" > "$f"; done
          for f in build-test-project.mjs verify-browser.mjs verify-file-first-response.mjs verify-prompt-semantics.mjs verify.mjs; do git show "$PROMPT:$f" > "$f"; done
          git show "$RUNTIME:prompt-engine.js" >/tmp/prompt-runtime.js
          git show "$BASE:prompt-engine.js" >/tmp/prompt-base.js
          git show "$PROMPT:prompt-engine.js" >/tmp/prompt-filefirst.js
          git merge-file -p /tmp/prompt-runtime.js /tmp/prompt-base.js /tmp/prompt-filefirst.js > prompt-engine.js
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected one anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          replace_once('verify-spec-grounded-route-oracle.mjs',
            "extractedStatements:[{statementKey:`S${i+1}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT'}]",
            "extractedStatements:[{statementKey:`S${i+1}`,text:u.rawValueText||u.label||u.unitId,statementClass:'CONTEXT',sourceLocation:u.kind==='SUPPLIED_MATERIAL'?u.sourceLocation:undefined}]")
          replace_once('verify-stage-prompts-complete.mjs',"'STRICT RESPONSE CONTRACT'","'RESPONSE CONTRACT DEFINITIONS'")
          replace_once('verify-human-stage-walkthrough.mjs',
            "if(!text.includes('STRICT RESPONSE CONTRACT'))throw new Error(`Stage ${stage} generated prompt lacks response contract.`);",
            "if(!text.includes('RESPONSE CONTRACT DEFINITIONS')||!text.includes('closed-loop-stage-response/3'))throw new Error(`Stage ${stage} generated prompt lacks response contract.`);")
          PY
          rm .github/workflows/controller3-integrate.yml
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node verify-contract-closure.mjs
          node verify-capability-readiness.mjs
          node verify-stage01-intake-closure.mjs
          node verify-spec-grounded-route-oracle.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-prompt-semantics.mjs
          node verify-file-first-response.mjs
          node verify-complete.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js workflow-schema.js prompt-engine.js build-test-project.mjs verify-browser.mjs verify-file-first-response.mjs verify-prompt-semantics.mjs verify.mjs verify-complete.mjs verify-contract-closure.mjs verify-stage01-intake-closure.mjs verify-capability-readiness.mjs verify-spec-grounded-route-oracle.mjs verify-stage-prompts-complete.mjs verify-human-stage-walkthrough.mjs .github/workflows/controller3-integrate.yml
          git commit -m 'Enforce file-first runtime closure contracts'
          git push origin HEAD:controller3-prompt-byte-identity-rerun-20260904
