name: Repair live Stage01 and prompt context binding
on:
  push:
    branches: [fix/live-stage01-context-binding-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-stage01-context-binding-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal source corrections
        shell: python
        run: |
          from pathlib import Path

          p=Path('prompt-engine.js')
          s=p.read_text()
          old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';"
          assert old in s
          s=s.replace(old,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/55';",1)
          old="contextRecordsFor(state,collection,scope,batchPlan,stage).map(record=>"
          assert old in s
          s=s.replace(old,"contextRecordsFor(state,collection,scope,batchPlan,stage,operation).map(record=>",1)
          old='HUMAN COLLABORATION MODE — APPLIES TO EVERY EXTERNAL-AGENT STAGE'
          assert old in s
          s=s.replace(old,'HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE',1)
          p.write_text(s)

          p=Path('workflow-engine.js')
          s=p.read_text()
          old="const f=comparisonFacts(project,requirementId(req),iterationId);facts[requirementId(req)]={RUN_DETERMINATIONS:f.runDeterminations,ALL_TEN_SATISFIED:f.allSatisfied,ANY_VIOLATION:f.anyViolation,ANY_UNDETERMINED:f.anyUndetermined,SATISFIED_COUNT:f.determinations.filter(x=>x==='SATISFIED').length,VIOLATED_COUNT:f.determinations.filter(x=>x==='VIOLATED').length,UNDETERMINED_COUNT:f.determinations.filter(x=>!['SATISFIED','VIOLATED'].includes(x)).length};}const stability=iterationId?executionStability(project,iterationId):{repeatedDefectCount:0,uniqueDefectCount:0},comparisons=iterationId?recordsForIteration(project,'comparisons',iterationId):[];"
          assert old in s
          new="const f=comparisonFacts(project,requirementId(req),iterationId)||{},determinations=safe(f.determinations),runDeterminations=safe(f.runDeterminations);facts[requirementId(req)]={RUN_DETERMINATIONS:runDeterminations,ALL_TEN_SATISFIED:Boolean(f.allSatisfied),ANY_VIOLATION:Boolean(f.anyViolation),ANY_UNDETERMINED:Boolean(f.anyUndetermined)||determinations.length===0,SATISFIED_COUNT:determinations.filter(x=>x==='SATISFIED').length,VIOLATED_COUNT:determinations.filter(x=>x==='VIOLATED').length,UNDETERMINED_COUNT:determinations.filter(x=>!['SATISFIED','VIOLATED'].includes(x)).length+(determinations.length===0?1:0)};}const stability=iterationId?(executionStability(project,iterationId)||{}):{repeatedDefectCount:0,uniqueDefectCount:0},comparisons=safe(iterationId?recordsForIteration(project,'comparisons',iterationId):[]);"
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('app-core.js')
          s=p.read_text()
          old="const RUNTIME_BUILD_ID='runtime-20260830-live-operator-59';"
          assert old in s
          s=s.replace(old,"const RUNTIME_BUILD_ID='runtime-20260831-live-operator-60';",1)
          old="stageOneAccounting=safe(p.envelope?.stageData?.INTAKE_ACCOUNTING),stageOneIntents=safe(p.envelope?.records?.intentStatements),stageOneSummary=stageOne?"
          assert old in s
          new="stageOneCaptured=engine.parseCapturedInputSet({agentData:p.envelope?.stageData||{}}),stageOneAccounting=safe(stageOneCaptured?.units),stageOneIntents=safe(stageOneCaptured?.extractedStatements),stageOneSummary=stageOne?"
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('verify-all-stage-prompts.mjs')
          s=p.read_text()
          old="for(let s=1;s<=30;s++){for(const op of schema.STAGE_CONTRACTS[s].operations){"
          assert old in s
          new="for(let s=1;s<=30;s++){if(s>1){state.stages[s-1].status='COMPLETE';state.stages[s-1].gate={complete:true};}for(const op of schema.STAGE_CONTRACTS[s].operations){"
          s=s.replace(old,new,1)
          old="const scope=s===11?{runId:'RUN-AUDIT',contextId:'CONTEXT-AUDIT'}:{};"
          assert old in s
          new="const scope=Object.fromEntries((schema.operationContract(s,op)?.scopeRequirements||[]).map(key=>[key,key.toUpperCase()+'-AUDIT']));"
          s=s.replace(old,new)
          old="const r=prompts.buildPromptRecord(s,state,{operation:op,scope});"
          assert old in s
          s=s.replace(old,"console.log('PROMPT_FIXTURE_STAGE',s,op,JSON.stringify(scope));const r=prompts.buildPromptRecord(s,state,{operation:op,scope});",1)
          regression="""\n// Permanent regression: persisted prompt context must use the same operation-isolated selector as the visible prompt.\n{\n  const source=fs.readFileSync(new URL('./prompt-engine.js',import.meta.url),'utf8');\n  assert(source.includes('contextRecordsFor(state,collection,scope,batchPlan,stage,operation).map(record=>'),'Persisted prompt context selector omitted the active operation.');\n}\n// Permanent regression: sparse Stage 13 comparison state must fail closed rather than throw while deriving prompt context.\n{\n  const sparse=core.createBlankState('JOB-STAGE13-SPARSE');\n  Object.assign(sparse.job,{EXACT_USER_OBJECTIVE_VERBATIM:'sparse-stage13-regression',CURRENT_INPUT_VERSION:'INPUT-SPARSE',CURRENT_SOURCE_SET_VERSION:'SOURCE-SPARSE',CURRENT_REQUIREMENTS_VERSION:'REQ-SPARSE',CURRENT_TEST_SUITE_VERSION:'TEST-SPARSE',CURRENT_INSTRUCTION_VERSION:'INSTRUCTION-SPARSE'});\n  engine.ensureShape(sparse);engine.recalculate(sparse);\n  for(let i=1;i<=12;i++){sparse.stages[i].status='COMPLETE';sparse.stages[i].gate={complete:true};}\n  const derived=engine.deriveStageData(sparse,13);\n  assert(derived&&Array.isArray(derived.REQUIREMENTS_WITH_AT_LEAST_ONE_UNDETERMINED),'Sparse Stage 13 derivation did not return a controlled result.');\n}\n"""
          if regression.strip() not in s:
              s += regression
          p.write_text(s)

          p=Path('verify-browser.mjs')
          s=p.read_text()
          regression="""\n// Permanent regression: Stage 01 proposal summary reads the current /3 INPUT_SET_CONTENTS contract.\n{\n  const source=fs.readFileSync(new URL('./app-core.js',import.meta.url),'utf8');\n  assert.match(source,/parseCapturedInputSet\\(\\{agentData:p\\.envelope\\?\\.stageData\\|\\|\\{\\}\\}\\)/);\n  assert.doesNotMatch(source,/stageData\\?\\.INTAKE_ACCOUNTING/);\n  assert.doesNotMatch(source,/records\\?\\.intentStatements/);\n}\n"""
          if regression.strip() not in s:
              s += regression
          p.write_text(s)
      - name: Verify repaired sources
        run: |
          node --check prompt-engine.js
          node --check workflow-engine.js
          node --check app-core.js
          node verify-all-stage-prompts.mjs
          node verify-browser.mjs
      - name: Commit integrated repair and remove one-time workflow
        run: |
          rm .github/workflows/repair-live-stage01-context.yml
          rm -f .repair-trigger-20260831 .repair-trigger-2 .repair-trigger-3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix Stage 01 proposal accounting and operation-bound prompt context [repair-applied]'
          git push origin HEAD:fix/live-stage01-context-binding-20260831
