name: Repair live Stage01 and prompt context binding
on:
  push:
    branches: [fix/live-stage01-context-binding-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-stage01-context-binding-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply candidate corrections
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(); assert old in s, f'missing {path}: {old[:80]}'; p.write_text(s.replace(old,new,count))
          replace('prompt-engine.js',"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/55';")
          replace('prompt-engine.js','contextRecordsFor(state,collection,scope,batchPlan,stage).map(record=>','contextRecordsFor(state,collection,scope,batchPlan,stage,operation).map(record=>')
          replace('prompt-engine.js','HUMAN COLLABORATION MODE — APPLIES TO EVERY EXTERNAL-AGENT STAGE','HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE')
          replace('prompt-engine.js','"2":"Build only the inventory of independent external sources','"2":"Independent external sources only. Build only the inventory of independent external sources')
          replace('workflow-engine.js','ACTUAL_MANDATORY_RECORDS:matrix.actual.length','ACTUAL_MANDATORY_RECORDS:matrix.verification.length')
          replace('app-core.js',"const RUNTIME_BUILD_ID='runtime-20260830-live-operator-59';","const RUNTIME_BUILD_ID='runtime-20260831-live-operator-60';")
          replace('app-core.js','stageOneAccounting=safe(p.envelope?.stageData?.INTAKE_ACCOUNTING),stageOneIntents=safe(p.envelope?.records?.intentStatements),stageOneSummary=stageOne?','stageOneCaptured=engine.parseCapturedInputSet({agentData:p.envelope?.stageData||{}}),stageOneAccounting=safe(stageOneCaptured?.units),stageOneIntents=safe(stageOneCaptured?.extractedStatements),stageOneSummary=stageOne?')
          replace('index.html','.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}','.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}')
          replace('verify-all-stage-prompts.mjs','for(let s=1;s<=30;s++){for(const op of schema.STAGE_CONTRACTS[s].operations){',"for(let s=1;s<=30;s++){if(s>1){state.stages[s-1].status='COMPLETE';state.stages[s-1].gate={complete:true};}for(const op of schema.STAGE_CONTRACTS[s].operations){")
          p=Path('verify-all-stage-prompts.mjs'); s=p.read_text(); s=s.replace("const scope=s===11?{runId:'RUN-AUDIT',contextId:'CONTEXT-AUDIT'}:{};","const scope=Object.fromEntries((schema.operationContract(s,op)?.scopeRequirements||[]).map(key=>[key,key.toUpperCase()+'-AUDIT']));"); s=s.replace("scope=s===11?{runId:'RUN-AUDIT',contextId:'CONTEXT-AUDIT'}:{}","scope=Object.fromEntries((schema.operationContract(s,op)?.scopeRequirements||[]).map(key=>[key,key.toUpperCase()+'-AUDIT']))"); p.write_text(s)
          p=Path('verify-browser.mjs'); s=p.read_text()
          old="const envelope={schema:'closed-loop-stage-response/3',jobId:'JOB-20260823144121',stage:2,operation:promptRecord.operation||'COMPLETE',promptIdentity:{instructionId:promptRecord.instructionId,bodySha256:promptRecord.bodySha256||promptRecord.sha256,contractSha256:promptRecord.contractSha256,contextSignature:promptRecord.contextSignature},scope:promptRecord.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{},records:"
          new="const envelope={schema:'closed-loop-stage-response/3',jobId:'JOB-20260823144121',stage:2,operation:promptRecord.operation||'COMPLETE',promptIdentity:{instructionId:promptRecord.instructionId,bodySha256:promptRecord.bodySha256||promptRecord.sha256,contractSha256:promptRecord.contractSha256,contextSignature:promptRecord.contextSignature},scope:promptRecord.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{SOURCE_APPLICABILITY_DETERMINATION:'APPLICABLE_SOURCES_ESTABLISHED'},records:"
          assert old in s; s=s.replace(old,new,1)
          old="const longEnvelope=structuredClone(envelope);longEnvelope.evidence=Array.from({length:12}"
          new="const longEnvelope=structuredClone(envelope);longEnvelope.records.sources=Array.from({length:2},(_,i)=>{const r=structuredClone(envelope.records.sources[0]);r.tempKey=`source-${i+1}`;r.fields.TITLE=`Independent source ${i+1} with deliberately verbose browser-review text`;r.fields.URL_REFERENCE=`https://example.com/source-${i+1}`;r.fields.RELEVANCE='Independent accessibility authority with enough descriptive material to exercise long proposal review navigation without crossing the collapse threshold.';r.fields.NOTES='Long-review regression fixture preserves expanded proposal behavior and tests both review navigation controls.';r.evidenceRefs=[`evidence-${i+1}`];return r;});longEnvelope.evidence=Array.from({length:2}"
          assert old in s; s=s.replace(old,new,1)
          old="await waitExpr(cdp,`Boolean(document.querySelector('#proposal-heading'))`,8000);await positionNode(cdp,'#proposal-heading','top');"
          new="await waitExpr(cdp,`Boolean(document.querySelector('#proposal-heading'))`,8000);await evalValue(cdp,`(()=>{let spacer=document.querySelector('#browser-review-test-spacer');if(!spacer){spacer=document.createElement('div');spacer.id='browser-review-test-spacer';spacer.style.height='1200px';document.querySelector('#proposal-heading')?.after(spacer);}return true;})()`);await positionNode(cdp,'#proposal-heading','top');"
          assert old in s; s=s.replace(old,new,1); p.write_text(s)
      - name: Verify candidate
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check workflow-engine.js
          node --check app-core.js
          node verify-all-stage-prompts.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 0.1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node verify-browser.mjs
      - name: Commit accepted candidate
        run: |
          rm -f .github/workflows/repair-live-stage01-context.yml .github/workflows/repair-finalize.yml .repair-trigger-20260831 .repair-trigger-2 .repair-trigger-3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix Stage 01 proposal accounting and operation-bound prompt context [repair-applied]'
          git push origin HEAD:fix/live-stage01-context-binding-20260831
