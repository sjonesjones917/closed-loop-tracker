name: Repair live Stage01 and prompt context binding
on:
  push:
    branches: [fix/live-stage01-context-binding-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-stage01-context-binding-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal source corrections
        shell: python
        run: |
          from pathlib import Path

          p=Path('prompt-engine.js')
          s=p.read_text()
          old="const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';"
          assert old in s
          s=s.replace(old,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/55';",1)
          old="contextRecordsFor(state,collection,scope,batchPlan,stage).map(record=>"
          assert old in s
          s=s.replace(old,"contextRecordsFor(state,collection,scope,batchPlan,stage,operation).map(record=>",1)
          old='HUMAN COLLABORATION MODE — APPLIES TO EVERY EXTERNAL-AGENT STAGE'
          assert old in s
          s=s.replace(old,'HUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE',1)
          old='"2":"Build only the inventory of independent external sources'
          assert old in s
          s=s.replace(old,'"2":"Independent external sources only. Build only the inventory of independent external sources',1)
          p.write_text(s)

          p=Path('workflow-engine.js')
          s=p.read_text()
          old="ACTUAL_MANDATORY_RECORDS:matrix.actual.length"
          assert old in s
          s=s.replace(old,"ACTUAL_MANDATORY_RECORDS:matrix.verification.length",1)
          p.write_text(s)

          p=Path('app-core.js')
          s=p.read_text()
          old="const RUNTIME_BUILD_ID='runtime-20260830-live-operator-59';"
          assert old in s
          s=s.replace(old,"const RUNTIME_BUILD_ID='runtime-20260831-live-operator-60';",1)
          old="stageOneAccounting=safe(p.envelope?.stageData?.INTAKE_ACCOUNTING),stageOneIntents=safe(p.envelope?.records?.intentStatements),stageOneSummary=stageOne?"
          assert old in s
          new="stageOneCaptured=engine.parseCapturedInputSet({agentData:p.envelope?.stageData||{}}),stageOneAccounting=safe(stageOneCaptured?.units),stageOneIntents=safe(stageOneCaptured?.extractedStatements),stageOneSummary=stageOne?"
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          old='.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'
          assert old in s
          s=s.replace(old,'.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}',1)
          p.write_text(s)

          p=Path('verify-all-stage-prompts.mjs')
          s=p.read_text()
          old="for(let s=1;s<=30;s++){for(const op of schema.STAGE_CONTRACTS[s].operations){"
          assert old in s
          new="for(let s=1;s<=30;s++){if(s>1){state.stages[s-1].status='COMPLETE';state.stages[s-1].gate={complete:true};}for(const op of schema.STAGE_CONTRACTS[s].operations){"
          s=s.replace(old,new,1)
          old="const scope=s===11?{runId:'RUN-AUDIT',contextId:'CONTEXT-AUDIT'}:{};"
          assert old in s
          new="const scope=Object.fromEntries((schema.operationContract(s,op)?.scopeRequirements||[]).map(key=>[key,key.toUpperCase()+'-AUDIT']));"
          s=s.replace(old,new)
          old="scope=s===11?{runId:'RUN-AUDIT',contextId:'CONTEXT-AUDIT'}:{}"
          assert old in s
          new="scope=Object.fromEntries((schema.operationContract(s,op)?.scopeRequirements||[]).map(key=>[key,key.toUpperCase()+'-AUDIT']))"
          s=s.replace(old,new)
          regression="""\n// Permanent regression: persisted prompt context must use the same operation-isolated selector as the visible prompt.\n{\n  const source=fs.readFileSync(new URL('./prompt-engine.js',import.meta.url),'utf8');\n  assert(source.includes('contextRecordsFor(state,collection,scope,batchPlan,stage,operation).map(record=>'),'Persisted prompt context selector omitted the active operation.');\n}\n// Permanent regression: Stage 12 derived verification count uses the verification matrix collection and never an undefined matrix.actual member.\n{\n  const source=fs.readFileSync(new URL('./workflow-engine.js',import.meta.url),'utf8');\n  assert(source.includes('ACTUAL_MANDATORY_RECORDS:matrix.verification.length'),'Stage 12 derived verification count is not bound to matrix.verification.');\n  assert(!source.includes('ACTUAL_MANDATORY_RECORDS:matrix.actual.length'),'Stage 12 still references nonexistent matrix.actual.');\n}\n// Permanent regression: prompt expansion dimensions remain at the approved pre-regression baseline.\n{\n  const html=fs.readFileSync(new URL('./index.html',import.meta.url),'utf8');\n  assert(html.includes('.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'),'Approved prompt expansion dimensions were not restored.');\n  assert(!html.includes('.expandable-prompt{height:280px;max-height:280px}'),'Unapproved fixed prompt height remains.');\n}\n// Permanent regression: Stage 02 states the independent-source boundary in the controlling prompt.\n{\n  const text=prompts.buildPromptRecord(2,state,{operation:'COMPLETE'}).prompt;\n  assert(text.includes('Independent external sources only.'),'Stage 02 independent-source boundary missing from controlling prompt.');\n}\n"""
          if regression.strip() not in s:
              s += regression
          p.write_text(s)

          p=Path('verify-browser.mjs')
          s=p.read_text()
          old="const longEnvelope=structuredClone(envelope);longEnvelope.evidence=Array.from({length:12}"
          assert old in s
          new="const longEnvelope=structuredClone(envelope);longEnvelope.records.sources=Array.from({length:2},(_,i)=>{const r=structuredClone(envelope.records.sources[0]);r.tempKey=`source-${i+1}`;r.fields.TITLE=`Independent source ${i+1} with deliberately verbose browser-review text`;r.fields.URL_REFERENCE=`https://example.com/source-${i+1}`;r.fields.RELEVANCE='Independent accessibility authority with enough descriptive material to exercise long proposal review navigation without crossing the collapse threshold.';r.fields.NOTES='Long-review regression fixture preserves expanded proposal behavior and tests both review navigation controls.';r.evidenceRefs=[`evidence-${i+1}`];return r;});longEnvelope.evidence=Array.from({length:2}"
          s=s.replace(old,new,1)
          old="await waitExpr(cdp,`Boolean(document.querySelector('#proposal-heading'))`,8000);await positionNode(cdp,'#proposal-heading','top');"
          assert old in s
          new="await waitExpr(cdp,`Boolean(document.querySelector('#proposal-heading'))`,8000);await evalValue(cdp,`(()=>{let spacer=document.querySelector('#browser-review-test-spacer');if(!spacer){spacer=document.createElement('div');spacer.id='browser-review-test-spacer';spacer.style.height='1200px';document.querySelector('#proposal-heading')?.after(spacer);}return true;})()`);await positionNode(cdp,'#proposal-heading','top');"
          s=s.replace(old,new,1)
          regression="""\n// Permanent regression: Stage 01 proposal summary reads the current /3 INPUT_SET_CONTENTS contract.\n{\n  const source=fs.readFileSync(new URL('./app-core.js',import.meta.url),'utf8');\n  assert.match(source,/parseCapturedInputSet\\(\\{agentData:p\\.envelope\\?\\.stageData\\|\\|\\{\\}\\}\\)/);\n  assert.doesNotMatch(source,/stageData\\?\\.INTAKE_ACCOUNTING/);\n  assert.doesNotMatch(source,/records\\?\\.intentStatements/);\n}\n"""
          if regression.strip() not in s:
              s += regression
          p.write_text(s)
      - name: Verify repaired sources
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check workflow-engine.js
          node --check app-core.js
          node verify-all-stage-prompts.mjs
          python3 -m http.server 4173 > /tmp/closed-loop-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node verify-browser.mjs
      - name: Commit integrated repair and remove one-time workflow
        run: |
          rm .github/workflows/repair-live-stage01-context.yml
          rm -f .repair-trigger-20260831 .repair-trigger-2 .repair-trigger-3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix Stage 01 proposal accounting and operation-bound prompt context [repair-applied]'
          git push origin HEAD:fix/live-stage01-context-binding-20260831
