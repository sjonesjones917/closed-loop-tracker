name: Materialize Stage 01 and Stage 04 canonical capture
on:
  push:
    branches: [fix/stage4-canonical-intent-capture]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'Materialize Stage 01 and Stage 04 canonical capture')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/stage4-canonical-intent-capture
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble source patcher
        run: cat .stage4-repair.part1 .stage4-repair.part2 .stage4-repair.part3 > .stage4-repair.mjs
      - name: Apply structural fix
        run: node .stage4-repair.mjs
      - name: Remove one-time patch assets
        run: rm -f .stage4-repair.part1 .stage4-repair.part2 .stage4-repair.part3
      - name: Verify structural fix
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-stage4-intent-reuse.mjs
          node verify-stage4-intent-reuse.mjs
      - name: Commit materialized fix
        run: |
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Stage 01 and Stage 04 canonical capture"
          git push origin HEAD:fix/stage4-canonical-intent-capture
