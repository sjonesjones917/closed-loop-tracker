name: Inspect native worker integration before prompt repair
on:
  push:
    branches: [fix/complete-stage-prompts-20260830]
    paths: [.github/workflows/stage-prompt-inspection.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace application-native execution and worker loading
        run: |
          echo '=== native runtime references ==='
          grep -R -n -E 'test-worker|new[[:space:]]+Worker|globalThis\.Worker|closedLoopTestRuntime|APPLICATION_TEST_RUNTIME|runNative|native.*test|executeTest' -- app-core.js workflow-engine.js test-runtime.js test-worker.js project-store.js response-ingestion.js || true
          echo '=== stage action references ==='
          grep -R -n -E 'RUN_APP_TESTS|RUN_IN_APP|Run tests|Run verification|APPLICATION_DETERMINISTIC' -- app-core.js workflow-engine.js workbook.js || true
