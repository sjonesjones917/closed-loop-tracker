name: One-time Stage 04 accounting repair

on:
  push:
    branches:
      - fix/controlling-spec3-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec3-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow repair
        run: python3 tmp_stage04_accounting_repair.py
      - name: Prove focused repair
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-one-time-intent-intake.mjs
          node --check verify-browser-extra.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify.mjs
      - name: Commit integrated repair and remove temporary files
        run: |
          rm .github/workflows/tmp-stage04-accounting-repair.yml
          rm tmp_stage04_accounting_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Enforce complete Stage 04 obligation accounting"
          git push origin HEAD:fix/controlling-spec3-complete
