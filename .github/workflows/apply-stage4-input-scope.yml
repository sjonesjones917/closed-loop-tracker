name: Apply Stage 4 obligation input scope
on:
  push:
    branches: [spec-v3-zero-loss-20260830]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spec-v3-zero-loss-20260830}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply Stage 4 input-scope correction
        run: |
          node repair-stage4-obligation-input-scope.mjs
          node --check workflow-engine.js
          node --check verify-stage4-obligation-input-scope.mjs
          node verify-stage4-obligation-input-scope.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f repair-stage4-obligation-input-scope.mjs
          git add workflow-engine.js verify-stage4-obligation-input-scope.mjs
          git commit -m "Bind Stage 4 obligation manifest only to input universe"
          git push origin HEAD:spec-v3-zero-loss-20260830