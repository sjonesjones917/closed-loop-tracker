name: Apply complete stage prompt context repair
on:
  push:
    branches: [finish-stage-prompts-current-20260830]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-stage-prompts-current-20260830
      - run: python repair-stage-prompts.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js workflow-schema.js prompt-engine.js
          git commit -m "Complete locked-stage and upstream prompt context behavior"
          git push origin HEAD:finish-stage-prompts-current-20260830
# apply
