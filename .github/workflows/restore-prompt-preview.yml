name: Restore prompt preview height
on:
  push:
    branches:
      - fix/restore-prompt-preview-height
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-prompt-preview-height
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore established 280px collapsed preview and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '.expandable-prompt{height:auto;max-height:clamp(280px,42vh,440px)}.expandable-prompt.expanded{height:auto;max-height:none}'
          new = '.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'
          if old not in text:
              raise SystemExit('Prompt preview sizing anchor not found; refusing unrelated edit.')
          text = text.replace(old, new, 1)
          index.write_text(text)

          browser = Path('verify-browser.mjs')
          b = browser.read_text()
          anchor = "assert(await evalValue(cdp,`(()=>{const n=document.querySelector('#generated-prompt');return Boolean(n&&n.scrollHeight>n.clientHeight+1);})()`),'Compact prompt preview is not actually bounded.');"
          addition = anchor + "const collapsedPromptHeight=await evalValue(cdp,`document.querySelector('#generated-prompt')?.getBoundingClientRect().height||0`);assert(collapsedPromptHeight>=279&&collapsedPromptHeight<=281,`Collapsed prompt preview must remain the established 280px height on mobile; got ${collapsedPromptHeight}px.`);"
          if anchor not in b:
              raise SystemExit('Browser prompt-preview assertion anchor not found; refusing unrelated edit.')
          b = b.replace(anchor, addition, 1)
          browser.write_text(b)
          PY
      - name: Focused proof
        shell: bash
        run: |
          node --check verify-browser.mjs
          node verify-hash.mjs
          grep -F '.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}' index.html
          ! grep -F '#prompt-heading .expandable-prompt:not(.expanded){max-height:88px}' index.html
      - name: Commit permanent repair
        shell: bash
        run: |
          rm -f .github/workflows/restore-prompt-preview.yml
          git config user.name 'closed-loop-prompt-preview-repair'
          git config user.email 'closed-loop-prompt-preview-repair@users.noreply.github.com'
          git add -A
          git commit -m 'Restore established prompt preview height'
          git push origin HEAD:fix/restore-prompt-preview-height
