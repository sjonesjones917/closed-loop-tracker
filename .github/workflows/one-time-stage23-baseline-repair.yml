  }`,
`  if(stage===20){
    const baselines=recordsForCurrentScope(project,'baselines').filter(isActiveRecord);
    if(!baselines.length)return actionEnvelope(project,stage,{actionType:'FREEZE_BASELINE',heading:'Authorize and freeze the production baseline',explanation:'Confirm baseline authorization for the exact unchanged-confirmed candidate. The application records that human decision, binds the exact candidate bytes and successful unchanged confirmation, allocates the baseline identity, and freezes the immutable baseline. No external Stage 20 response is required.',primaryButton:'Freeze baseline'});
  }`);
          replaceOnce('workflow-engine.js',
`function gate(stageOrProject,projectOrStage){const stage=typeof stageOrProject==='number'?Number(stageOrProject):Number(projectOrStage),p=typeof stageOrProject==='number'?projectOrStage:stageOrProject;ensure(p);const b=e0.gate(stage,p),rr=[...(b.reasons||[]),...reasons(p,stage)];return{...b,complete:Boolean(b.complete)&&rr.length===0,blocked:Boolean(b.blocked)||rr.length>0,reasons:[...new Set(rr)]};}`,
`function gate(stageOrProject,projectOrStage){const stage=typeof stageOrProject==='number'?Number(stageOrProject):Number(projectOrStage),p=typeof stageOrProject==='number'?projectOrStage:stageOrProject;ensure(p);const b=e0.gate(stage,p),baseReasons=stage===20?safe(b.reasons).filter(reason=>!/accepted/i.test(String(reason))):safe(b.reasons),rr=[...baseReasons,...reasons(p,stage)],baseComplete=stage===20?baseReasons.length===0:Boolean(b.complete);return{...b,complete:baseComplete&&rr.length===0,blocked:(stage===20?baseReasons.length>0:Boolean(b.blocked))||rr.length>0,reasons:[...new Set(rr)]};}`);
          replaceOnce('verify-full-cycle.mjs',
`data(20,{stageData:{BASELINE_PACKAGE_SEPARATED_FROM_WORKING_FILES:'TRUE'}});const baselineAuthorization=engine.recordRegisteredHumanDecision(p,{stage:20,purpose:'BASELINE_AUTHORIZATION',targetFamily:'candidateFreezes',targetId:cand19,value:'AUTHORIZED',operatorLabel:'FULL_CYCLE'});engine.freezeBaseline(p,{artifactIds:['ARTIFACT-CANDIDATE'],baselineAuthorizationDecisionId:engine.recordId(baselineAuthorization,'humanDecisions'),operatorLabel:'FULL_CYCLE'});const baselineId=rid('baselines'),baseline=engine.recordsForCurrentScope(p,'baselines').at(-1);`,
`const baselineAuthorization=engine.recordRegisteredHumanDecision(p,{stage:20,purpose:'BASELINE_AUTHORIZATION',targetFamily:'candidateFreezes',targetId:cand19,value:'AUTHORIZED',operatorLabel:'FULL_CYCLE'});engine.freezeBaseline(p,{artifactIds:['ARTIFACT-CANDIDATE'],baselineAuthorizationDecisionId:engine.recordId(baselineAuthorization,'humanDecisions'),operatorLabel:'FULL_CYCLE'});assert(engine.acceptedChanges(p,20).length===0,'Stage 20 application-owned baseline freeze must not require an accepted external Stage 20 response.');const baselineId=rid('baselines'),baseline=engine.recordsForCurrentScope(p,'baselines').at(-1);`);
