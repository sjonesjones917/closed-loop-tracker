          set -euo pipefail
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git fetch origin d3457175dd3baeb82c4bc4529aa9af4ac2f7f66c b5e9aeaa533317dd54db01140f0aaafbdce769f7
          test "$(git merge-base HEAD d3457175dd3baeb82c4bc4529aa9af4ac2f7f66c)" = d3457175dd3baeb82c4bc4529aa9af4ac2f7f66c
          git checkout b5e9aeaa533317dd54db01140f0aaafbdce769f7 -- workflow-schema.js workflow-engine.js app-core.js verify-complete.mjs verify-full-cycle.mjs verify-controller-stage-bundle.mjs .github/workflows/pages.yml verify-production-baseline.mjs
          mv verify-production-baseline.mjs verify-production-baseline-authority.mjs
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(path,oldText,newText){let s=fs.readFileSync(path,'utf8');const n=s.split(oldText).length-1;if(n!==1)throw new Error(`${path}: expected one match, found ${n}`);s=s.replace(oldText,newText);fs.writeFileSync(path,s);}
          replaceOnce('workflow-engine.js',
`  if(stage===20&&acceptedChanges(project,20).length){
