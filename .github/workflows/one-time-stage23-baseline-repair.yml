          let v=fs.readFileSync('verify-production-baseline-authority.mjs','utf8');
          v=v.replace("console.log(JSON.stringify({productionBaselineAuthorization:'PASS'},null,2));",String.raw`
{
  const p=project('JOB-BASELINE-DIRECT-APPLICATION-COMMAND');
  assert(engine.acceptedChanges(p,20).length===0,'Fixture unexpectedly contains an accepted external Stage 20 response.');
  const action=engine.operationalNextAction(p,20);
  assert(action.actionType==='FREEZE_BASELINE','Stage 20 next action does not directly expose FREEZE_BASELINE without an accepted external response.');
  const decision=engine.recordRegisteredHumanDecision(p,{stage:20,purpose:'BASELINE_AUTHORIZATION',targetFamily:'candidateFreezes',targetId:'CANDIDATE-CONFIRMED',value:'AUTHORIZED',operatorLabel:'VERIFY'});
  engine.freezeBaseline(p,{artifactIds:['ARTIFACT-CONFIRMED'],baselineAuthorizationDecisionId:engine.recordId(decision,'humanDecisions'),operatorLabel:'VERIFY'});
  assert(engine.acceptedChanges(p,20).length===0,'FREEZE_BASELINE manufactured an accepted external Stage 20 response.');
  const g=engine.gate(20,p);
  assert(g.complete,`Stage 20 application-owned baseline freeze did not complete without an external response: ${JSON.stringify(g.reasons)}`);
}
{
  const p=project('JOB-BASELINE-WRONG-PURPOSE');
  const wrong=engine.recordRegisteredHumanDecision(p,{stage:20,purpose:'TRADEOFF_OR_SCOPE_DECISION',targetFamily:'candidateFreezes',targetId:'CANDIDATE-CONFIRMED',value:'AUTHORIZED',operatorLabel:'VERIFY'});
  expectRejectsWithoutBaselineMutation(p,()=>engine.freezeBaseline(p,{artifactIds:['ARTIFACT-CONFIRMED'],baselineAuthorizationDecisionId:engine.recordId(wrong,'humanDecisions'),operatorLabel:'VERIFY'}),/does not authorize baseline freeze/i,'Wrong-purpose baseline authorization decision was accepted.');
}
{
  const p=project('JOB-BASELINE-WRONG-ARTIFACT-SET');
  const decision=engine.recordRegisteredHumanDecision(p,{stage:20,purpose:'BASELINE_AUTHORIZATION',targetFamily:'candidateFreezes',targetId:'CANDIDATE-CONFIRMED',value:'AUTHORIZED',operatorLabel:'VERIFY'});
  expectRejectsWithoutBaselineMutation(p,()=>engine.freezeBaseline(p,{artifactIds:['ARTIFACT-NOT-CANDIDATE'],baselineAuthorizationDecisionId:engine.recordId(decision,'humanDecisions'),operatorLabel:'VERIFY'}),/exact artifact set/i,'Wrong baseline artifact set was accepted.');
}
console.log(JSON.stringify({productionBaselineAuthorization:'PASS'},null,2));`);
          fs.writeFileSync('verify-production-baseline-authority.mjs',v);
          NODE
