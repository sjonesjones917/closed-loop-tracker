name: Apply final minimal human-flow boundary correction
on:
  push:
    branches: [fix/final-human-flow-boundary-20260827]
    paths: [.github/workflows/zz-final-human-flow-boundary.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-human-flow-boundary-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact minimal correction
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'prompt-engine.js',
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/14';",
              "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/15';"
          )

          replace_once(
              'prompt-engine.js',
              '- Never set a HUMAN or HUMAN_DECISION-owned field. When unavailable human information is required, return HUMAN_INPUT_REQUIRED and structured humanInputRequests. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.',
              '- Never set a HUMAN or HUMAN_DECISION-owned field. Resolve missing human information through HUMAN COLLABORATION MODE first. Use HUMAN_INPUT_REQUIRED only when a required human answer remains unavailable or explicitly deferred after that conversation, or when interactive conversation is unavailable. Do not convert a missing human fact, choice, legal assertion, engineering parameter, or authority decision into an assumption.'
          )

          replace_once(
              'verify-prompt-semantics.mjs',
              "  if(record.prompt.includes('Do not ask conversational questions outside the JSON response')||record.prompt.includes('Missing human-authority information requires HUMAN_INPUT_REQUIRED')||record.prompt.includes('return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL')||record.prompt.includes('STAGE 01 NEEDS YOUR JOB REQUEST'))issues.push('MACHINE_FIRST_HUMAN_CLARIFICATION_CONTRADICTION');",
              "  if(record.prompt.includes('Do not ask conversational questions outside the JSON response')||record.prompt.includes('Missing human-authority information requires HUMAN_INPUT_REQUIRED')||record.prompt.includes('return HUMAN_INPUT_REQUIRED—not DATA_PROPOSAL')||record.prompt.includes('STAGE 01 NEEDS YOUR JOB REQUEST')||record.prompt.includes('When unavailable human information is required, return HUMAN_INPUT_REQUIRED and structured humanInputRequests'))issues.push('MACHINE_FIRST_HUMAN_CLARIFICATION_CONTRADICTION');"
          )

          replace_once(
              'verify-prompt-semantics.mjs',
              "  if(!record.prompt.includes('Use HUMAN_INPUT_REQUIRED only when a required human answer remains unavailable or explicitly deferred after that conversation, or when interactive conversation is unavailable'))issues.push('HUMAN_INPUT_REQUIRED_FALLBACK_BOUNDARY_MISSING');",
              "  if(!record.prompt.includes('Resolve missing human information through HUMAN COLLABORATION MODE first.'))issues.push('HUMAN_FIELD_COLLABORATION_BOUNDARY_MISSING');\n  if(!record.prompt.includes('Use HUMAN_INPUT_REQUIRED only when a required human answer remains unavailable or explicitly deferred after that conversation, or when interactive conversation is unavailable'))issues.push('HUMAN_INPUT_REQUIRED_FALLBACK_BOUNDARY_MISSING');"
          )

          runtime_files = [
              'workbook.js',
              'hash.js',
              'workflow-schema.js',
              'workflow-engine.js',
              'prompt-engine.js',
              'response-ingestion.js',
              'project-store.js',
              'app-core.js',
          ]

          def git_blob_sha(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          manifest = ''.join(f'{path}:{git_blob_sha(path)}\n' for path in runtime_files)
          runtime_token = 'runtime-' + hashlib.sha256(manifest.encode()).hexdigest()[:16]
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tokens = re.findall(r'\?v=(runtime-[0-9a-f]{16})', html)
          if len(tokens) != 8 or len(set(tokens)) != 1:
              raise SystemExit(f'Expected exactly 8 identical runtime tokens; found {tokens}')
          html = html.replace(tokens[0], runtime_token)
          if html.count(runtime_token) != 8:
              raise SystemExit(f'Expected 8 derived runtime tokens; found {html.count(runtime_token)}')
          index.write_text(html, encoding='utf-8')

          Path('.github/workflows/zz-final-human-flow-boundary.yml').unlink()
      - name: Run focused verification
        run: |
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node verify-hash.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
      - name: Commit verified correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js verify-prompt-semantics.mjs index.html .github/workflows/zz-final-human-flow-boundary.yml
          git diff --cached --check
          git commit -m "Finalize human-first prompt boundary and invalidate stale prompts"
          git push origin HEAD:fix/final-human-flow-boundary-20260827
