name: Prove agent JSON contract repair

on:
  push:
    branches:
      - 'fix/agent-json-contract-20260826'

permissions:
  contents: write

jobs:
  prove:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair without changing workbook contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .repair-agent-json.py
          git checkout -- workbook.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('prompt-engine.js'); s=p.read_text()
          s=s.replace('do not ask the human to re-enter facts that are already present.','do not ask the human to re-enter facts that are already present in those materials.',1)
          s=s.replace('A request such as "prepare a patent application for this project" is sufficient at Stage 01 unless','A request such as "prepare a patent application for this project" is sufficient to define a patent-application drafting job at Stage 01 unless',1)
          s=s.replace('- PATENT / REGULATED FILING: use only the minimum human-supplied invention facts needed to recognize and define the requested patent-application drafting job.','- PATENT / REGULATED FILING: use only the minimum human-supplied invention facts needed to recognize and define the requested patent-application drafting job. Use any supplied invention disclosure only for those minimum Stage 01 job-definition facts.',1)
          s=s.replace('Do not inventory the invention packet internally in Stage 01 and do not require jurisdiction, filing route, inventorship, ownership, priority/continuity, disclosure history, filing deadline, or counsel-review-versus-filing-ready choices merely to finish Stage 01;','Do not inventory the invention packet internally in Stage 01. Do not require jurisdiction, filing route, inventorship, ownership, priority/continuity, disclosure history, filing deadline, or counsel-review-versus-filing-ready choices merely to finish Stage 01;',1)
          s=s.replace('Stage 02 owns that inventory and formal inspection.','This limited intake inspection is Stage 01 job-definition work; Stage 02 owns that inventory and formal inspection.',1)
          p.write_text(s)
          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          s=s.replace("'internal material inventory is deferred to Stage 02'","'Do not turn it into a Stage 02 archive/file inventory'")
          p.write_text(s)
          p=Path('verify-browser.mjs'); s=p.read_text()
          s=s.replace("document.body.innerText.includes('Response rejected before canonical mutation.')","document.body.innerText.includes('Last parsed response was rejected before canonical mutation.')")
          p.write_text(s)
          files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for f in files:
              b=Path(f).read_bytes(); blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest(); manifest+=f'{f}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p=Path('index.html'); html=p.read_text(); html=re.sub(r'(<script\s+defer\s+src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+("\s*></script>)',lambda m:m.group(1)+token+m.group(2),html); p.write_text(html)
          PY
      - name: Remove one-time repair scaffolding before proof
        shell: bash
        run: rm -f .repair-agent-json.py .github/workflows/agent-json-contract-proof.yml semantic-failure.txt
      - name: Syntax
        run: |
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node --check verify-ingestion.mjs
          node --check verify-browser.mjs
      - name: Build fixture
        run: node build-test-project.mjs
      - name: Hash proof
        run: node verify-hash.mjs
      - name: Architecture proof
        run: node verify.mjs
      - name: Ingestion proof
        run: node verify-ingestion.mjs
      - name: Gate proof
        run: node verify-complete.mjs
      - name: Full cycle proof
        run: node verify-full-cycle.mjs
      - name: Prompt semantic proof
        run: node verify-prompt-semantics.mjs
      - name: Boundary assertions
        run: |
          grep -q 'closed-loop-prompt-engine/11' prompt-engine.js
          grep -q 'closed-loop-response-ingestion/4' response-ingestion.js
          grep -q 'JSON_TYPOGRAPHY_NORMALIZED' response-ingestion.js
          grep -q 'evidenceKeys' prompt-engine.js
          grep -q 'Last parsed response was rejected' app-core.js
          grep -q 'Last parsed response was rejected before canonical mutation.' verify-browser.mjs
      - name: Chromium verification
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit verified permanent source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make agent response JSON exact and recoverable'
          git push origin HEAD
