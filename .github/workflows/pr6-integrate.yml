name: PR6 integrate verified lifecycle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'practical-100/pr6-integrated-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-integrated-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse reviewed lifecycle fixtures
        run: |
          git fetch origin practical-100/pr6-final-proof-current
          git checkout origin/practical-100/pr6-final-proof-current -- test-fixtures.mjs verify-full-cycle.mjs .github/workflows/pages.yml
      - name: Apply only confirmed scope and candidate-freeze repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          lines=s.splitlines()
          replaced=False
          out=[]
          for line in lines:
              if line.startswith('function recordsForCurrentScope(project,collection,scopeRule={})'):
                  out.append("const PERSISTENT_HISTORY_COLLECTIONS=new Set(['defects','rootCauses','regressions','changes']);")
                  out.append("function recordBelongsToInvalidatedChange(project,collection,record){const id=recordId(record,collection);return Boolean(id&&safe(project?.projectData?.acceptedChanges).some(change=>change?.invalidatedBy&&safe(change.canonicalRecordIds).map(String).includes(String(id))));}")
                  out.append("function recordsForCurrentScope(project,collection,scopeRule={}){const active=records(project,collection).filter(record=>!recordBelongsToInvalidatedChange(project,collection,record));const scope={...currentScope(project),...scopeRule};if(Object.prototype.hasOwnProperty.call(scopeRule,'iterationId')&&!Object.prototype.hasOwnProperty.call(scopeRule,'candidateId'))delete scope.candidateId;if(Object.prototype.hasOwnProperty.call(scopeRule,'baselineId')&&!Object.prototype.hasOwnProperty.call(scopeRule,'productId'))delete scope.productId;if(collection==='candidateFreezes')delete scope.iterationId;if(PERSISTENT_HISTORY_COLLECTIONS.has(collection)){delete scope.iterationId;delete scope.candidateId;delete scope.baselineId;delete scope.productId;}const applicable=Object.fromEntries(Object.entries(scope).filter(([,v])=>v!==undefined&&v!==null));return active.filter(record=>record.scope&&Object.keys(record.scope).length>0&&scopeMatches(record,applicable));}")
                  replaced=True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('recordsForCurrentScope target not found')
          s='\n'.join(out)+'\n'
          a=s.index('function freezeCandidate(')
          b=s.index('function freezeBaseline(',a)
          block=s[a:b]
          if 'function freezeCandidate(project,{artifactIds=[]' not in block:
              raise SystemExit('freezeCandidate signature target not found')
          block=block.replace('function freezeCandidate(project,{artifactIds=[]','function freezeCandidate(project,{stage=10,artifactIds=[]',1)
          block=block.replace('stage:10','stage:Number(stage)')
          block=block.replace('scope:currentScope(project)','scope:{...currentScope(project),iterationId,candidateId}',1)
          s=s[:a]+block+s[b:]
          p.write_text(s)
          PY
      - name: Remove transport and integration scaffolding
        run: rm -rf .pr6-transport .github/workflows/pr6-integrate.yml
      - name: Verify deterministic acceptance before committing
        run: |
          node build-test-project.mjs
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit verified source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'PR 6: integrate continuous lifecycle proof'
          git push origin HEAD:practical-100/pr6-integrated-final
