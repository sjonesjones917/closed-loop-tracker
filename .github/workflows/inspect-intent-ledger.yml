name: Inspect intent ledger implementation
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:workflow-schema.js > /tmp/main-schema.js
          git show origin/main:workbook.js > /tmp/main-workbook.js
          git show origin/main:workflow-engine.js > /tmp/main-engine.js
          git show origin/main:response-ingestion.js > /tmp/main-ingestion.js
          git show origin/main:prompt-engine.js > /tmp/main-prompt.js
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['/tmp/main-schema.js','/tmp/main-workbook.js','/tmp/main-engine.js','/tmp/main-ingestion.js','/tmp/main-prompt.js']){
            const s=fs.readFileSync(f,'utf8');
            console.log('\n===== '+f+' =====');
            for(const term of ['intentStatements','STATEMENT_ID','MISSING_INTENT_STATEMENT','canonical intent','original intent file']){
              let from=0,count=0;
              while(true){const i=s.indexOf(term,from);if(i<0)break;count++;console.log(`--- ${term} #${count} @ ${i} ---`);console.log(s.slice(Math.max(0,i-1400),Math.min(s.length,i+3000)));from=i+term.length;if(count>=8)break;}
            }
          }
          NODE
