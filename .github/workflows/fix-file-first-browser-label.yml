name: fix-file-first-browser-label
on:
  workflow_dispatch:
  push:
    branches: [fix/spec-driven-file-first-20260902]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-driven-file-first-20260902
      - name: Bind browser oracle to actual file export control
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='verify-browser.mjs';
          let text=fs.readFileSync(path,'utf8');
          const old="'Export authoritative prompt file'";
          const replacement="'Export instruction file'";
          if(!text.includes(old)) throw new Error('Expected prior oracle token not found.');
          text=text.replace(old,replacement);
          fs.writeFileSync(path,text);
          NODE
          node --check verify-browser.mjs
          rm .github/workflows/fix-file-first-browser-label.yml
      - name: Commit repaired browser oracle and remove scaffolding
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify-browser.mjs .github/workflows/fix-file-first-browser-label.yml
          git commit -m 'Bind file-first browser oracle to visible export control'
          git push origin HEAD:fix/spec-driven-file-first-20260902
