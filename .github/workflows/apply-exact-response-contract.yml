name: Apply exact response contract
on:
  push:
    branches:
      - semantic-reliability/exact-response-contract
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 .exact-response-contract.py
      - name: Verify deterministic, semantic, and browser acceptance
        run: |
          node --check workflow-schema.js
          node --check prompt-engine.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.1; done
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit clean source-only result
        run: |
          rm -f .exact-response-contract.py .github/workflows/apply-exact-response-contract.yml
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git add -A
          git commit -m 'Make response contracts exact and placeholder-free'
          git push origin HEAD:semantic-reliability/exact-response-contract
