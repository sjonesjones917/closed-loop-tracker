name: Controller Stage 13 one-time repair
on:
  push:
    branches:
      - controller3-stage13-operational-next-action-20260904
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-stage13-operational-next-action-20260904
          fetch-depth: 0
      - name: Apply and verify Stage 09 operator-path repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('workflow-engine.js')
          text=path.read_text()
          old="function next(p){const b=e0.operationalNextAction(p),n=Number(p.activeStage||p.job?.CURRENT_STAGE||0);"
          new="function next(p,currentStage){const b=e0.operationalNextAction(p,currentStage),n=Number(currentStage||p.activeStage||String(p.job?.CURRENT_STAGE||'').replace(/[^0-9]/g,'')||0);"
          if text.count(old)!=1:
              raise SystemExit(f'Expected one operationalNextAction wrapper occurrence; found {text.count(old)}')
          path.write_text(text.replace(old,new,1))

          vp=Path('verify-independent-preflight.mjs')
          v=vp.read_text()
          needle="const gate=engine.gate(8,committed);assert(gate.complete,`Stage 08 prerequisite did not complete: ${JSON.stringify(gate)}`);"
          repl="const gate=engine.gate(8,committed);assert(gate.complete,`Stage 08 prerequisite did not complete: ${JSON.stringify(gate)}`);committed.stages[8].status='COMPLETE';committed.stages[8].gate=gate;"
          if v.count(needle)!=1:
              raise SystemExit(f'Expected one Stage 08 fixture-normalization insertion target; found {v.count(needle)}')
          v=v.replace(needle,repl,1)
          recalc="  engine.recalculate(p);\n  const action=engine.operationalNextAction(p,9),gate=engine.gate(9,p);"
          no_recalc="  const action=engine.operationalNextAction(p,9),gate=engine.gate(9,p);"
          if v.count(recalc)!=1:
              raise SystemExit(f'Expected one synthetic-fixture recalculate occurrence; found {v.count(recalc)}')
          v=v.replace(recalc,no_recalc,1)
          oldctx="function reviewerContext(p,label){return engine.registerFreshContext(p,{stage:9,externalContextIdentifier:label,operatorLabel:'STAGE13_VERIFIER',purpose:'REVIEWER'});}"
          newctx="function reviewerContext(p,label){const ctx=engine.registerFreshContext(p,{stage:9,externalContextIdentifier:label,operatorLabel:'STAGE13_VERIFIER',purpose:'REVIEWER'});for(let n=1;n<=8;n++){p.stages[n].status='COMPLETE';p.stages[n].gate={complete:true,blocked:false,reasons:[]};}return ctx;}"
          if v.count(oldctx)!=1:
              raise SystemExit(f'Expected one reviewerContext fixture helper; found {v.count(oldctx)}')
          vp.write_text(v.replace(oldctx,newctx,1))
          PY
          node --check workflow-engine.js
          node verify-independent-preflight.mjs
          node verify-definition-of-done.mjs
          rm .github/workflows/controller-stage13-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js verify-independent-preflight.mjs verify-definition-of-done.mjs .github/workflows/controller-stage13-repair.yml
          git commit -m "Fix Stage 09 independent reviewer next action"
          git push origin HEAD:controller3-stage13-operational-next-action-20260904
