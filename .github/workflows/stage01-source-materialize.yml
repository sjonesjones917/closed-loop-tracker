name: Stage 01 source materialization

on:
  push:
    branches:
      - controller-v2-stage01-20260903

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-v2-stage01-20260903
          fetch-depth: 0
      - name: Materialize exact current specification and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          cat .repair-stage01-source.b64.* | base64 -d | bzip2 -d > /tmp/repair-stage01-source.sh
          chmod +x /tmp/repair-stage01-source.sh
          rm -f .repair-stage01-source.b64.*
          sed -i '/git diff --cached --name-only/,+1d' /tmp/repair-stage01-source.sh
          bash /tmp/repair-stage01-source.sh
