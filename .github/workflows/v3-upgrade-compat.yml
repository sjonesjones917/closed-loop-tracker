name: One-time closed-loop v3 compatibility closure
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths:
      - upgrade-v3-compat.mjs
      - .github/workflows/v3-upgrade-compat.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: closed-loop-v3-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply primary transformation when it has not committed yet
        run: |
          if [ -f upgrade-v3.mjs ]; then node upgrade-v3.mjs; fi
      - name: Close compatibility and build-identity requirements
        run: node upgrade-v3-compat.mjs
      - name: Syntax verification
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
      - name: Execute complete non-browser proof stack
        run: |
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Remove one-time files and commit the proven implementation
        run: |
          rm -f upgrade-v3.mjs upgrade-v3-compat.mjs v3-upgrade-report.json
          rm -f .github/workflows/v3-upgrade.yml .github/workflows/v3-upgrade-compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement closed-loop v3 contracts and deterministic Test IR"
          git push origin HEAD:implementation/closed-loop-v3
