name: Disposable numbered regression expansion
on:
  push:
    branches: [reliability/correctness-hardening-final-20260827]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/correctness-hardening-final-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add deterministic checks 1-48 and prove them
        shell: bash
        run: |
          set -euo pipefail
          cat >> verify-complete.mjs <<'EOF'

// Numbered reliability acceptance checks 1-48. Each class includes a deliberately invalid state and its repaired counterpart.
{
  const passed=new Set(); const check=(n,value,message)=>{assert(value,`Hardening check ${n}: ${message}`);passed.add(n);};
  const base=(id='JOB-NUMBERED')=>{const p=project(id);Object.assign(p.job,{CURRENT_SOURCE_SET_VERSION:'SOURCE-SET-v001',CURRENT_REQUIREMENTS_VERSION:'REQUIREMENTS-v001',CURRENT_TEST_SUITE_VERSION:'TEST-SUITE-v001'});return p;};
  const req=(id='REQ-N')=>{const r=record('requirements',4,{OBLIGATION:'Numbered reliability requirement',REQUIREMENT_TYPE:'USER',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'Verified',INTENDED_VERIFICATION_METHOD:'Controlled verification',EXPECTED_EVIDENCE:'Canonical evidence',FAILURE_CONDITION:'Not established',SEVERITY:'MAJOR',STATUS:'ACTIVE'},id);r.scope={inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001'};return r;};
  const test=(id,mode,cap='CAP',artifact='NONE',type='DETERMINISTIC')=>{const t=record('tests',6,{REQ_ID:'REQ-N',TEST_TYPE:type,EXECUTION_MODE:mode,REQUIRED_CAPABILITY:cap,ARTIFACT_REQUIREMENTS:artifact,INPUTS:'controlled input identity',TOOLS:cap,PROCEDURE:type==='DETERMINISTIC'?'Compare SHA-256 byte identity':'Controlled procedure',EXPECTED_RESULT:'SATISFIED',FAILURE_CONDITION:'VIOLATED',EVIDENCE_TO_PRESERVE:'objective evidence',STATUS:'READY'},id);t.relationships={REQ_ID:'REQ-N'};t.scope={inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001'};return t;};
  const capability=(p,cap,id='CTX-CAP')=>{const c=record('freshContexts',11,{EXTERNAL_CONTEXT_IDENTIFIER:id,ROLE:'TOOL_EXECUTOR',AUTHORIZED_PROJECT_INPUTS:'controlled input only',TOOL_AVAILABILITY:`${cap} available`,CONTAMINATION_STATUS:'NONE',EVIDENCE:'capability observed',USABILITY_DETERMINATION:'USABLE'},id);c.scope={inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001'};p.projectData.freshContexts.push(c);return c;};
  const attach=(p,{availability='BYTES_PERSISTED_AND_VERIFIED',id='ART-N',evidenceId='EVID-N'}={})=>{const a=record('artifacts',6,{FILENAME:'fixture.bin',TYPE:'application/octet-stream',VERSION:'v1',BYTE_SIZE:4,SHA256:'a'.repeat(64),ROLE:'TEST_INPUT',STORAGE_REFERENCE:`indexeddb:${id}`,AVAILABILITY:availability},id);a.scope={inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001'};const e=record('evidenceRecords',6,{KIND:'ARTIFACT',DESCRIPTION:'Verified test bytes',LOCATION:'IndexedDB',CONTENT:'Application-verified custody',STATUS:'PRESERVED',ATTACHMENT_ID:id},evidenceId);e.relationships={ATTACHMENT_ID:id};e.scope=a.scope;p.projectData.artifacts.push(a);p.projectData.evidenceRecords.push(e);return {a,e};};

  {const p=base('JOB-N1');p.projectData.requirements.push(req());p.projectData.tests.push(test('TEST-N1','APPLICATION_DETERMINISTIC','CANONICAL_ARTIFACT_BYTE_IDENTITY'));const x=engine.testExecutionPlan(p).items[0];check(1,x.operatorAction==='NO_ACTION'&&x.executableNow,'registered native executor did not route to NO_ACTION');}
  {const p=base('JOB-N2');p.projectData.requirements.push(req());p.projectData.tests.push(test('TEST-N2','APPLICATION_DETERMINISTIC','NOT_REGISTERED'));const x=engine.testExecutionPlan(p).items[0];check(2,x.operatorAction==='BLOCKED'&&!x.executableNow,'unregistered native executor did not fail closed');}
  {const p=base('JOB-N3');p.projectData.requirements.push(req());const t=test('TEST-N3','EXTERNAL_AGENT_TOOL','CAD_IMPORT','fixture.bin');p.projectData.tests.push(t);const {e}=attach(p);t.evidenceRefs=[e.id];capability(p,'CAD_IMPORT');const x=engine.testExecutionPlan(p).items[0];check(3,x.operatorAction==='SEND_TO_TOOL_AGENT'&&x.executableNow,'capable external-agent route with verified bytes was not executable');}
  {const p=base('JOB-N4');p.projectData.requirements.push(req());const t=test('TEST-N4','EXTERNAL_AGENT_TOOL','CAD_IMPORT','fixture.bin');p.projectData.tests.push(t);const {e}=attach(p);t.evidenceRefs=[e.id];const x=engine.testExecutionPlan(p).items[0];check(4,x.operatorAction==='BLOCKED'&&!x.executableNow&&/capability/i.test(x.blockingReason),'missing capability did not block');}
  {const p=base('JOB-N5');p.projectData.requirements.push(req());p.projectData.tests.push(test('TEST-N5','EXTERNAL_AGENT_TOOL','CAD_IMPORT','fixture.bin'));capability(p,'CAD_IMPORT');const x=engine.testExecutionPlan(p).items[0];check(5,x.operatorAction==='BLOCKED'&&!x.executableNow,'missing required bytes did not block');}
  {const p=base('JOB-N6');p.projectData.requirements.push(req());p.projectData.tests.push(test('TEST-N6','HUMAN_INSPECTION','HUMAN_VISUAL'));const x=engine.testExecutionPlan(p).items[0];check(6,x.operatorAction==='HUMAN_INSPECTION'&&x.executorClass==='HUMAN','human inspection did not route to human');}
  {const p=base('JOB-N7');p.projectData.requirements.push(req());p.projectData.tests.push(test('TEST-N7','INDEPENDENT_AGENT_REVIEW','MEANING_REVIEW','NONE','MEANING'));const x=engine.testExecutionPlan(p).items[0];check(7,x.operatorAction==='SEND_TO_INDEPENDENT_REVIEWER'&&x.executorClass==='INDEPENDENT_REVIEWER','independent review did not route to fresh reviewer');}
  {const p=base('JOB-N8');p.projectData.requirements.push(req());p.projectData.tests.push(test('TEST-N8','EXTERNAL_SYSTEM','LAB_MEASUREMENT'));capability(p,'LAB_MEASUREMENT');const x=engine.testExecutionPlan(p).items[0];check(8,x.operatorAction==='USE_EXTERNAL_SYSTEM'&&x.executableNow,'external system did not route to external-system action');}
  {const p=base('JOB-N9');p.projectData.requirements.push(req());p.projectData.tests.push(test('TEST-N9','UNAVAILABLE','UNAVAILABLE'));const x=engine.testExecutionPlan(p).items[0];check(9,x.operatorAction==='BLOCKED'&&!x.executableNow,'UNAVAILABLE execution did not fail closed');}
  {const p=base('JOB-N10');p.projectData.requirements.push(req());const t=test('TEST-N10','EXTERNAL_AGENT_TOOL','CAD_IMPORT','fixture.bin');p.projectData.tests.push(t);const {e}=attach(p,{availability:'METADATA_ONLY'});t.evidenceRefs=[e.id];capability(p,'CAD_IMPORT');check(10,engine.testExecutionPlan(p).items[0].operatorAction==='BLOCKED','metadata-only artifact satisfied byte requirement');}
  {const p=base('JOB-N11');p.projectData.requirements.push(req());const t=test('TEST-N11','EXTERNAL_AGENT_TOOL','CAD_IMPORT','fixture.bin');p.projectData.tests.push(t);const {e}=attach(p);t.evidenceRefs=[e.id];capability(p,'CAD_IMPORT');check(11,engine.testExecutionPlan(p).items[0].executableNow,'verified artifact did not satisfy byte custody');}
  {const p=base('JOB-N12');p.projectData.requirements.push(req());const t=test('TEST-N12','EXTERNAL_AGENT_TOOL','CAD_IMPORT','fixture.bin');p.projectData.tests.push(t);const {a,e}=attach(p);t.evidenceRefs=[e.id];capability(p,'CAD_IMPORT');assert(engine.testExecutionPlan(p).items[0].executableNow,'precondition for check 12 failed');a.fields.AVAILABILITY='METADATA_ONLY';check(12,!engine.testExecutionPlan(p).items[0].executableNow,'readiness was not revoked after verified bytes were lost');}

  const independentFixture=()=>{const p=base('JOB-INDEPENDENCE-N');p.job.CURRENT_ITERATION='ITER-N';const it=record('iterations',10,{CANDIDATE_ID:'CAND-N',PURPOSE:'TEST',STATUS:'FROZEN'},'ITER-N');it.scope={iterationId:'ITER-N',candidateId:'CAND-N'};const cand=record('candidateFreezes',10,{ITERATION_ID:'ITER-N',COMPONENT_HASHES:{artifact:'hash'},STATUS:'FROZEN'},'CAND-N');cand.scope=it.scope;p.projectData.iterations.push(it);p.projectData.candidateFreezes.push(cand);for(let i=0;i<10;i++){const r=record('runs',11,{ITERATION_ID:'ITER-N',CANDIDATE_ID:'CAND-N',CONTEXT_ID:`CTX-N-${i}`,CONTAMINATION_CHECK:'NONE',COMPLETE_OUTPUT:`output-${i}`},`RUN-N-${i}`);r.relationships={ITERATION_ID:'ITER-N',CANDIDATE_ID:'CAND-N',CONTEXT_ID:`CTX-N-${i}`};r.scope=it.scope;p.projectData.runs.push(r);const c=record('freshContexts',11,{EXTERNAL_CONTEXT_IDENTIFIER:`external-${i}`,ROLE:'PRODUCTION',AUTHORIZED_PROJECT_INPUTS:'frozen candidate only',TOOL_AVAILABILITY:'GENERATOR available',CONTAMINATION_STATUS:'NONE',EVIDENCE:'fresh context',USABILITY_DETERMINATION:'USABLE',ITERATION_ID:'ITER-N',RUN_ID:`RUN-N-${i}`},`CTX-N-${i}`);c.scope=it.scope;p.projectData.freshContexts.push(c);}return p;};
  {const p=independentFixture();check(13,engine.evaluateContextIndependence(p,{role:'RUN_BATCH',iterationId:'ITER-N'}).determination==='APPLICATION_ESTABLISHED','ten unique current run contexts were not established');}
  {const p=independentFixture();p.projectData.runs[1].fields.CONTEXT_ID='CTX-N-0';check(14,engine.evaluateContextIndependence(p,{role:'RUN_BATCH',iterationId:'ITER-N'}).determination==='VIOLATED','duplicate context across runs was not detected');}
  {const p=independentFixture(),r={fields:{RUN_ID:'RUN-N-0',VERIFIER_CONTEXT_ID:'CTX-N-0',INDEPENDENCE_STATUS:'INDEPENDENT'}};check(15,engine.evaluateContextIndependence(p,{role:'VERIFICATION',iterationId:'ITER-N',runId:'RUN-N-0',result:r}).determination==='VIOLATED','same generator/verifier context was accepted');}
  {const p=independentFixture(),c=record('freshContexts',12,{EXTERNAL_CONTEXT_IDENTIFIER:'verifier-external',ROLE:'VERIFIER',AUTHORIZED_PROJECT_INPUTS:'target run and test only',CONTAMINATION_STATUS:'NONE',EVIDENCE:'fresh verifier',USABILITY_DETERMINATION:'USABLE'},'CTX-VERIFIER-N');c.scope={iterationId:'ITER-N',candidateId:'CAND-N'};p.projectData.freshContexts.push(c);const r={fields:{RUN_ID:'RUN-N-0',VERIFIER_CONTEXT_ID:'CTX-VERIFIER-N',INDEPENDENCE_STATUS:'UNKNOWN'}};check(16,engine.evaluateContextIndependence(p,{role:'VERIFICATION',iterationId:'ITER-N',runId:'RUN-N-0',result:r}).determination==='APPLICATION_ESTABLISHED','distinct current verifier context was not established');}
  {const p=independentFixture(),r={fields:{RUN_ID:'RUN-N-0',VERIFIER_CONTEXT_ID:'CTX-N-0',INDEPENDENCE_STATUS:'INDEPENDENT'}};check(17,engine.evaluateContextIndependence(p,{role:'VERIFICATION',iterationId:'ITER-N',runId:'RUN-N-0',result:r}).determination==='VIOLATED','agent independence claim overrode observable context reuse');}
  {const p=independentFixture();p.projectData.freshContexts[3].fields.CONTAMINATION_STATUS='CONTAMINATED';check(18,engine.evaluateContextIndependence(p,{role:'RUN_BATCH',iterationId:'ITER-N'}).determination==='VIOLATED','explicit contamination did not violate independence');}
  {const p=independentFixture();check(19,engine.evaluateContextIndependence(p,{role:'RUN_BATCH',iterationId:'ITER-N'}).determination==='APPLICATION_ESTABLISHED','same candidate across all ten did not satisfy batch identity');}
  {const p=independentFixture();p.projectData.runs[9].fields.CANDIDATE_ID='CAND-OTHER';check(20,engine.evaluateContextIndependence(p,{role:'RUN_BATCH',iterationId:'ITER-N'}).determination==='VIOLATED','one different candidate did not fail batch integrity');}
  {const p=independentFixture();p.projectData.freshContexts[4].fields.AUTHORIZED_PROJECT_INPUTS='frozen candidate plus prior run output';check(21,engine.evaluateContextIndependence(p,{role:'RUN_BATCH',iterationId:'ITER-N'}).determination==='VIOLATED','prior-run output in authorized inputs did not flag contamination');}
  {const p=independentFixture();p.projectData.freshContexts[5].fields.AUTHORIZED_PROJECT_INPUTS='frozen candidate plus reviewer feedback';check(22,engine.evaluateContextIndependence(p,{role:'RUN_BATCH',iterationId:'ITER-N'}).determination==='VIOLATED','reviewer feedback in run input did not flag contamination');}

  const evidenceProject=()=>{const p=base('JOB-EVID-N');const r=req('REQ-E');p.projectData.requirements.push(r);return {p,r};};
  {const {p,r}=evidenceProject(),t=test('TEST-E23','APPLICATION_DETERMINISTIC','CANONICAL_ARTIFACT_BYTE_IDENTITY','fixture.bin');t.fields.REQ_ID='REQ-E';t.relationships={REQ_ID:'REQ-E'};const e=record('evidenceRecords',22,{KIND:'AGENT_ASSERTION',DESCRIPTION:'Agent says bytes match',LOCATION:'response',CONTENT:'passed',STATUS:'PRESERVED'},'EVID-E23'),res={fields:{DETERMINATION:'SATISFIED'},evidenceRefs:['EVID-E23']};p.projectData.evidenceRecords.push(e);check(23,!engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'prose-only evidence satisfied byte identity');}
  {const {p,r}=evidenceProject(),t=test('TEST-E24','APPLICATION_DETERMINISTIC','CANONICAL_ARTIFACT_BYTE_IDENTITY','fixture.bin');t.fields.REQ_ID='REQ-E';t.relationships={REQ_ID:'REQ-E'};const {e}=attach(p,{id:'ART-E24',evidenceId:'EVID-E24'}),res={fields:{DETERMINATION:'SATISFIED'},evidenceRefs:[e.id]};check(24,engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'application-verified byte evidence was not sufficient');}
  {const {p,r}=evidenceProject(),t=test('TEST-E25','INDEPENDENT_AGENT_REVIEW','MEANING_REVIEW','NONE','MEANING');t.fields.REQ_ID='REQ-E';t.relationships={REQ_ID:'REQ-E'};const {e}=attach(p,{id:'ART-E25',evidenceId:'EVID-E25'}),res=record('meaningResults',23,{REQ_ID:'REQ-E',TEST_ID:'TEST-E25',DETERMINATION:'SATISFIED'},'MEANING-E25');res.evidenceRefs=[e.id];check(25,!engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'hash evidence alone satisfied meaning verification');}
  {const {p,r}=evidenceProject(),t=test('TEST-E26','INDEPENDENT_AGENT_REVIEW','MEANING_REVIEW','NONE','MEANING');t.fields.REQ_ID='REQ-E';t.relationships={REQ_ID:'REQ-E'};const e=record('evidenceRecords',23,{KIND:'MEANING_REVIEW',DESCRIPTION:'Observed comparison',LOCATION:'product section',CONTENT:'source-to-product comparison',STATUS:'PRESERVED'},'EVID-E26');p.projectData.evidenceRecords.push(e);const res=record('meaningResults',23,{REQ_ID:'REQ-E',TEST_ID:'TEST-E26',PRODUCT_LOCATION:'section 2',REQUIRED_MEANING:'required proposition',OBSERVED_MEANING:'matching proposition',EVIDENCE_BASED_COMPARISON:'direct comparison',EXTERNAL_SOURCE_EVIDENCE:'source excerpt',DETERMINATION:'SATISFIED'},'MEANING-E26');res.evidenceRefs=[e.id];check(26,engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'complete meaning evidence was not sufficient');}
  {const {p,r}=evidenceProject(),t=test('TEST-E27','HUMAN_INSPECTION','HUMAN_VISUAL');t.fields.REQ_ID='REQ-E';const e=record('evidenceRecords',25,{KIND:'AGENT_REVIEW',DESCRIPTION:'AI claims inspection passed',LOCATION:'response',CONTENT:'passed',STATUS:'PRESERVED'},'EVID-E27');p.projectData.evidenceRecords.push(e);const res={fields:{DETERMINATION:'SATISFIED'},evidenceRefs:[e.id]};check(27,!engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'agent assertion substituted for human observation');}
  {const {p,r}=evidenceProject(),t=test('TEST-E28','HUMAN_INSPECTION','HUMAN_VISUAL');t.fields.REQ_ID='REQ-E';const e=record('evidenceRecords',25,{KIND:'HUMAN_OBSERVATION',AUTHORITY_TYPE:'HUMAN',DESCRIPTION:'Operator inspected product',LOCATION:'product',CONTENT:'explicit observation',STATUS:'PRESERVED'},'EVID-E28');p.projectData.evidenceRecords.push(e);const res={fields:{DETERMINATION:'SATISFIED'},evidenceRefs:[e.id]};check(28,engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'explicit human observation evidence was rejected');}
  {const {p,r}=evidenceProject(),t=test('TEST-E29','EXTERNAL_SYSTEM','LAB_MEASUREMENT');t.fields.REQ_ID='REQ-E';const e=record('evidenceRecords',22,{KIND:'AGENT_ASSERTION',DESCRIPTION:'Agent claims lab passed',LOCATION:'response',CONTENT:'pass',STATUS:'PRESERVED'},'EVID-E29');p.projectData.evidenceRecords.push(e);const res={fields:{TOOL_AND_VERSION:'LAB_MEASUREMENT',ACTUAL_RESULT:'pass',INPUTS:'sample-A',DETERMINATION:'SATISFIED'},evidenceRefs:[e.id]};check(29,!engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'external-system test passed without system-attributable evidence');}
  {const {p,r}=evidenceProject(),t=test('TEST-E30','UNAVAILABLE','UNAVAILABLE');t.fields.REQ_ID='REQ-E';const e=record('evidenceRecords',22,{KIND:'WORKFLOW_EVIDENCE',DESCRIPTION:'unavailable',LOCATION:'system',CONTENT:'none',STATUS:'PRESERVED'},'EVID-E30');p.projectData.evidenceRecords.push(e);const res={fields:{DETERMINATION:'SATISFIED'},evidenceRefs:[e.id]};check(30,!engine.evaluateEvidenceSufficiency(p,{requirement:r,test:t,result:res}).sufficient,'UNAVAILABLE execution produced sufficient satisfaction proof');}

  const contradictionBase=()=>{const p=base('JOB-CONTR-N');Object.assign(p.job,{CURRENT_PRODUCT_ID:'PRODUCT-N',CURRENT_BASELINE_ID:'BASELINE-N'});return p;};
  {const p=contradictionBase(),scope={inputVersion:'INPUT-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001',iterationId:'ITER-N'};const a=record('verification',12,{REQ_ID:'REQ-C31',RUN_ID:'RUN-C31',TEST_ID:'TEST-C31',DETERMINATION:'SATISFIED'},'VER-C31-A'),b=record('verification',12,{REQ_ID:'REQ-C31',RUN_ID:'RUN-C31',TEST_ID:'TEST-C31',DETERMINATION:'VIOLATED'},'VER-C31-B');a.scope=scope;b.scope=scope;p.projectData.verification.push(a,b);check(31,engine.detectCurrentContradictions(p).some(x=>x.type==='VERIFICATION_CONTRADICTION'),'same verification proposition SATISFIED/VIOLATED contradiction not detected');}
  {const p=contradictionBase(),scope={inputVersion:'INPUT-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001',productId:'PRODUCT-N'},t=test('TEST-C32','EXTERNAL_AGENT_TOOL','TOOL');t.fields.REQ_ID='REQ-C32';t.scope=scope;p.projectData.tests.push(t);const d=record('deterministicResults',22,{TEST_ID:'TEST-C32',DETERMINATION:'SATISFIED'},'DET-C32'),m=record('meaningResults',23,{REQ_ID:'REQ-C32',TEST_ID:'TEST-C32',DETERMINATION:'VIOLATED'},'MEAN-C32');d.scope=scope;m.scope=scope;p.projectData.deterministicResults.push(d);p.projectData.meaningResults.push(m);check(32,engine.detectCurrentContradictions(p).some(x=>x.type==='PRODUCT_EVIDENCE_CONTRADICTION'),'deterministic SATISFIED plus meaning VIOLATED contradiction not detected');}
  {const p=contradictionBase(),scope={inputVersion:'INPUT-v001',requirementsVersion:'REQUIREMENTS-v001',testSuiteVersion:'TEST-SUITE-v001',productId:'PRODUCT-N'},t=test('TEST-C33','INDEPENDENT_AGENT_REVIEW','REVIEW','NONE','MEANING');t.fields.REQ_ID='REQ-C33';t.scope=scope;p.projectData.tests.push(t);const m=record('meaningResults',23,{REQ_ID:'REQ-C33',TEST_ID:'TEST-C33',DETERMINATION:'SATISFIED'},'MEAN-C33'),a=record('adversarialResults',24,{TEST_ID:'TEST-C33',DETERMINATION:'VIOLATED',SEVERITY:'MAJOR'},'ATTACK-C33');m.scope=scope;a.scope=scope;p.projectData.meaningResults.push(m);p.projectData.adversarialResults.push(a);check(33,engine.detectCurrentContradictions(p).some(x=>x.type==='PRODUCT_EVIDENCE_CONTRADICTION'),'meaning satisfaction plus mandatory adversarial violation not detected');}
  {const p=contradictionBase(),scope={inputVersion:'INPUT-v001'},a=record('artifacts',21,{VERSION:'v1',BYTE_SIZE:4,SHA256:'a'.repeat(64),AVAILABILITY:'BYTES_PERSISTED_AND_VERIFIED'},'ART-C34'),b=record('artifacts',21,{VERSION:'v1',BYTE_SIZE:4,SHA256:'b'.repeat(64),AVAILABILITY:'BYTES_PERSISTED_AND_VERIFIED'},'ART-C34');a.scope=scope;b.scope=scope;p.projectData.artifacts.push(a,b);check(34,engine.detectCurrentContradictions(p).some(x=>x.type==='ARTIFACT_IDENTITY_CONTRADICTION'),'same current artifact identity with different hashes not detected');}
  {const p=contradictionBase(),rel=record('releaseRecords',27,{DETERMINATION:'ACCEPTED'},'REL-C35'),b=record('blockers',27,{MISSING_ITEM_TYPE:'EVIDENCE',MISSING_FACT_INPUT_AUTHORITY_EVIDENCE_CAPABILITY_DECISION_RULE:'mandatory proof',WHY_WORK_CANNOT_CONTINUE:'mandatory proof missing',ATTEMPTED_RESOLUTIONS:'none',DOWNSTREAM_WORK_STOPPED:'STAGE 27',STATUS:'OPEN'},'BLOCK-C35');p.projectData.releaseRecords.push(rel);p.projectData.blockers.push(b);check(35,engine.detectCurrentContradictions(p).some(x=>x.type==='RELEASE_BLOCKER_CONTRADICTION'),'accepted release plus current mandatory blocker contradiction not detected');}
  {const p=contradictionBase();p.release.authorization='AUTHORIZED';p.release.authorizedArtifactIds=['ART-C36'];check(36,engine.detectCurrentContradictions(p).some(x=>x.type==='STALE_DELIVERY_AUTHORIZATION'),'delivery authorization without current identity proof not detected');}

  const stabilityFixture=(determinations,iteration='ITER-STAB')=>{const p=base(`JOB-${iteration}`);p.job.CURRENT_ITERATION=iteration;const it=record('iterations',10,{CANDIDATE_ID:`CAND-${iteration}`,STATUS:'FROZEN'},iteration);it.scope={iterationId:iteration,candidateId:`CAND-${iteration}`};p.projectData.iterations.push(it);for(let i=0;i<10;i++){const run=record('runs',11,{ITERATION_ID:iteration,CANDIDATE_ID:`CAND-${iteration}`,CONTEXT_ID:`CTX-${iteration}-${i}`,EXECUTION_STATUS:'COMPLETED'},`RUN-${iteration}-${i}`);run.scope=it.scope;p.projectData.runs.push(run);const v=record('verification',12,{REQ_ID:'REQ-STAB',RUN_ID:run.id,TEST_ID:'TEST-STAB',VERIFIER:'V',VERIFIER_CONTEXT_ID:`VCTX-${i}`,INDEPENDENCE_STATUS:'INDEPENDENT',INPUTS:'run',PROCEDURE:'test',EXPECTED_RESULT:'pass',OBSERVED_RESULT:'observed',EXACT_EVIDENCE:'evidence',DETERMINATION:determinations[i]},`VER-${iteration}-${i}`);v.scope=it.scope;p.projectData.verification.push(v);}return p;};
  {const p=stabilityFixture(Array(10).fill('SATISFIED'));const s=engine.executionStability(p,'ITER-STAB');check(37,s.requirementStability['REQ-STAB'].agreementRate===1,'10/10 identical determinations did not yield agreement 1');}
  {const p=stabilityFixture([...Array(9).fill('SATISFIED'),'VIOLATED'],'ITER-STAB38');const s=engine.executionStability(p,'ITER-STAB38');check(38,s.requirementStability['REQ-STAB'].agreementRate===0.9,'9/10 agreement did not yield 0.9');}
  {const p=stabilityFixture([...Array(7).fill('SATISFIED'),'VIOLATED','VIOLATED','UNDETERMINED'],'ITER-STAB39');const s=engine.executionStability(p,'ITER-STAB39').requirementStability['REQ-STAB'];check(39,s.satisfied===7&&s.violated===2&&s.undetermined===1,'violation/undetermined stability counts do not reconcile');}
  {const p=stabilityFixture(Array(10).fill('SATISFIED'),'ITER-STAB40');for(const [i,observed] of ['A','A','B'].entries()){const d=record('defects',14,{REQ_ID:'REQ-STAB',RUN_ID:`RUN-ITER-STAB40-${i}`,OBSERVED_FAILURE:observed,EXPECTED_CONDITION:'good',SEVERITY:'MAJOR',STATUS:'CONFIRMED'},`DEF-STAB40-${i}`);d.scope={iterationId:'ITER-STAB40',candidateId:'CAND-ITER-STAB40'};p.projectData.defects.push(d);}const s=engine.executionStability(p,'ITER-STAB40');check(40,s.totalDistinctDefects===2&&s.repeatedDefectCount===2&&s.uniqueDefectCount===1&&s.newDefectsByRun['RUN-ITER-STAB40-0']===1,'new/repeated/unique defect stability counts are wrong');}
