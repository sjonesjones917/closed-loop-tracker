name: Copilot CLI capability probe

on:
  push:
    branches:
      - complete-app-work
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run isolated real agent request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --yolo -sp 'Return only this JSON object and no markdown: {"schema":"copilot_probe","status":"COMPLETE","summary":"Real isolated Copilot CLI request completed."}' > copilot-probe-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          text=Path('copilot-probe-result.json').read_text().strip()
          if text.startswith('```'):
              text='\n'.join(text.splitlines()[1:-1]).strip()
          obj=json.loads(text)
          assert obj['schema']=='copilot_probe'
          assert obj['status']=='COMPLETE'
          Path('copilot-probe-result.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: copilot-probe-result
          path: copilot-probe-result.json
          if-no-files-found: error
