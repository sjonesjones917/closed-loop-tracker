name: Complete zero-loss intake and obligation closure
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply complete prompt and accounting repair
        run: |
          git show 5a82dc376cf47ed8a896d096464036374785ecfa:verify-browser-extra.mjs > verify-browser-extra.mjs
          python3 finalize-zero-loss.py
          python3 patch-browser-extra-v3.py
          python3 patch-all-stage-audit-v2.py
          python3 patch-stage01-operator.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-browser-extra.mjs')
          t=p.read_text()
          old="'Continue talking to the agent'"
          new="'Continue the external conversation'"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('Expected operator interaction-mode assertion not found')
          p.write_text(t)
          PY
      - name: Prove source syntax
        run: |
          git diff --check
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-zero-loss-accounting.mjs
          node --check verify-all-stage-prompts.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
      - name: Prove established prompt dimensions
        run: |
          grep -F "height:clamp(260px,45vh,520px)" index.html
          grep -F ".expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}" index.html
          ! grep -F "#prompt-heading .expandable-prompt:not(.expanded){max-height:88px}" index.html
      - name: Prove zero-loss Stage 01 and Stage 04 semantics
        run: node verify-zero-loss-accounting.mjs
      - name: Prove all 30 stage and operation prompts
        run: |
          node verify-all-stage-prompts.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
      - name: Prove full synthetic lifecycle
        run: node build-test-project.mjs
      - name: Prove browser behavior
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit integrated source and remove one-time repair files
        run: |
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git rm -f repair-zero-loss.py finalize-zero-loss.py patch-browser-extra-v3.py patch-all-stage-audit-v2.py patch-stage01-operator.py .github/workflows/complete-zero-loss-closure.yml zero-loss-failure.log || true
          git add workflow-engine.js workflow-schema.js prompt-engine.js response-ingestion.js app-core.js verify-browser.mjs verify-browser-extra.mjs verify-zero-loss-accounting.mjs verify-all-stage-prompts.mjs
          git commit -m "Make all 30 stage prompts explicit and context-complete [zero-loss-closure-applied]"
          git push origin HEAD:fix/closed-loop-v3-final-20260830