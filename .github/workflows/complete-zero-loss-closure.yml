name: Complete zero-loss intake and obligation closure
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Constrain repair transformation to preserve contextFor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('repair-zero-loss.py'); t=p.read_text()
          old='stage4_pattern = r"function stage4ExhaustedInputs\\(state\\)\\{.*?\\nfunction assertStage4UpstreamExhausted"\n    stage4_repl = "function stage4ExhaustedInputs(state){const active=list=>safe(list).filter(r=>r?.active!==false&&!r?.invalidatedBy).map(r=>({id:r?.id||r?.recordId||null,stage:r?.stage??null,scope:r?.scope||{},fields:recordFields(r),relationships:r?.relationships||{},evidenceRefs:r?.evidenceRefs||[]})),humanJobInput=Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>[\'HUMAN\',\'HUMAN_DECISION\'].includes(definition?.producer)).map(([name])=>[name,state?.job?.[name]??null]));return {currentUserJobInput:humanJobInput,originalUserEntered:state?.projectData?.userEntered||{},stage01AcceptedCapture:parseCapturedInputSet(state),stage01AcceptedDefinition:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:state?.stages?.[1]?.derivedData||{}},stage03AcceptedData:{agentData:state?.stages?.[3]?.agentData||state?.stages?.[3]?.acceptedData||{},humanData:state?.stages?.[3]?.humanData||{},derivedData:state?.stages?.[3]?.derivedData||{}},stage03Research:active(state?.projectData?.research),stage03CandidateRequirements:active(state?.projectData?.candidateRequirements),applicableSources:active(state?.projectData?.sources),applicableEvidence:active(state?.projectData?.evidenceRecords).filter(record=>[2,3].includes(Number(record.stage)))};}\\nfunction assertStage4UpstreamExhausted"'
          new='stage4_pattern = r"function stage4ExhaustedInputs\\(state\\)\\{.*?\\n(?=function contextFor)"\n    stage4_repl = "function stage4ExhaustedInputs(state){const active=list=>safe(list).filter(r=>r?.active!==false&&!r?.invalidatedBy).map(r=>({id:r?.id||r?.recordId||null,stage:r?.stage??null,scope:r?.scope||{},fields:recordFields(r),relationships:r?.relationships||{},evidenceRefs:r?.evidenceRefs||[]})),humanJobInput=Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>[\'HUMAN\',\'HUMAN_DECISION\'].includes(definition?.producer)).map(([name])=>[name,state?.job?.[name]??null]));return {currentUserJobInput:humanJobInput,originalUserEntered:state?.projectData?.userEntered||{},stage01AcceptedCapture:parseCapturedInputSet(state),stage01AcceptedDefinition:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:state?.stages?.[1]?.derivedData||{}},stage03AcceptedData:{agentData:state?.stages?.[3]?.agentData||state?.stages?.[3]?.acceptedData||{},humanData:state?.stages?.[3]?.humanData||{},derivedData:state?.stages?.[3]?.derivedData||{}},stage03Research:active(state?.projectData?.research),stage03CandidateRequirements:active(state?.projectData?.candidateRequirements),applicableSources:active(state?.projectData?.sources),applicableEvidence:active(state?.projectData?.evidenceRecords).filter(record=>[2,3].includes(Number(record.stage)))}};\\n"'
          if old not in t: raise SystemExit('Expected Stage 04 repair transformation was not found')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Apply deterministic source repair
        run: python3 repair-zero-loss.py
      - name: Align browser proof to native current-project intake manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-browser.mjs'); t=p.read_text()
          start="const intakeProof=await evalValue(cdp,`"
          end="assert((retained.projectData.sources||[]).length===0,'Stage 02 sources were fabricated on clean load.');"
          a=t.find(start); b=t.find(end,a)
          if a<0 or b<0: raise SystemExit('Expected retained intake proof block not found')
          replacement="const nativeIntakeProof=await evalValue(cdp,`(()=>{const p=globalThis.closedLoopCore.createBlankState('JOB-BROWSER-INTAKE-PROOF');p.job.EXACT_USER_OBJECTIVE_VERBATIM='browser-intake-objective';p.job.EXPLICIT_USER_REQUIREMENTS='browser-intake-requirement';p.projectData.userEntered={objective:'browser-intake-objective',nested:{acceptance:'browser-intake-acceptance'}};globalThis.closedLoopWorkflowEngine.recalculate(p);const m=globalThis.closedLoopWorkflowEngine.intakeCoverageManifest(p);return {inputVersion:m?.inputVersion,unitCount:m?.unitCount||0,hasObjective:(m?.units||[]).some(u=>u.sourceLocation==='job.EXACT_USER_OBJECTIVE_VERBATIM'),hasNested:(m?.units||[]).some(u=>u.sourceLocation==='projectData.userEntered.nested.acceptance')};})()`);assert(nativeIntakeProof&&nativeIntakeProof.unitCount>0&&nativeIntakeProof.hasObjective&&nativeIntakeProof.hasNested,'Application-owned Stage 01 intake manifest did not enumerate native current human-authority input.');"
          t=t[:a]+replacement+t[b:]
          p.write_text(t)
          PY
      - name: Normalize permanent visual regression to compare exact baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-zero-loss-accounting.mjs'); t=p.read_text()
          old="const css=fs.readFileSync('index.html','utf8');assert(css.includes('.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'),'Visual prompt-box baseline changed.');"
          if old not in t: raise SystemExit('Expected visual assertion not found')
          p.write_text(t.replace(old,"",1))
          PY
      - name: Prove source syntax
        run: |
          git diff --check
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-zero-loss-accounting.mjs
      - name: Prove zero-loss accounting semantics
        run: node verify-zero-loss-accounting.mjs
      - name: Prove full synthetic lifecycle
        run: node build-test-project.mjs
      - name: Prove browser behavior and established prompt dimensions
        run: |
          grep -F "height:clamp(260px,45vh,520px)" index.html
          grep -F ".expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}" index.html
          ! grep -F "#prompt-heading .expandable-prompt:not(.expanded){max-height:88px}" index.html
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit integrated repair and remove one-time repair files
        run: |
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git rm repair-zero-loss.py .github/workflows/complete-zero-loss-closure.yml
          git rm -f zero-loss-failure.log || true
          git add workflow-engine.js prompt-engine.js response-ingestion.js app-core.js verify-browser.mjs verify-zero-loss-accounting.mjs
          git commit -m "Enforce zero-loss Stage 01 and Stage 04 accounting [zero-loss-closure-applied]"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
