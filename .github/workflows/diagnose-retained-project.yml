name: Diagnose retained project loading

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, migrate, and diagnose
        shell: bash
        run: |
          set +e
          : > RETAINED_PROJECT_DIAGNOSTIC.txt
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> RETAINED_PROJECT_DIAGNOSTIC.txt
          node migrate-self-project.mjs >> RETAINED_PROJECT_DIAGNOSTIC.txt 2>&1
          echo "MIGRATE_EXIT=$?" >> RETAINED_PROJECT_DIAGNOSTIC.txt
          node build-app.mjs >> RETAINED_PROJECT_DIAGNOSTIC.txt 2>&1
          echo "BUILD_EXIT=$?" >> RETAINED_PROJECT_DIAGNOSTIC.txt
          node attach-self-project.mjs >> RETAINED_PROJECT_DIAGNOSTIC.txt 2>&1
          echo "ATTACH_EXIT=$?" >> RETAINED_PROJECT_DIAGNOSTIC.txt
          node verify-app.mjs >> RETAINED_PROJECT_DIAGNOSTIC.txt 2>&1
          echo "VERIFY_APP_EXIT=$?" >> RETAINED_PROJECT_DIAGNOSTIC.txt
          node verify-self-project.mjs >> RETAINED_PROJECT_DIAGNOSTIC.txt 2>&1
          echo "VERIFY_SELF_EXIT=$?" >> RETAINED_PROJECT_DIAGNOSTIC.txt
          npm install --no-save --ignore-scripts playwright-core >> RETAINED_PROJECT_DIAGNOSTIC.txt 2>&1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_PATH" node browser-smoke.mjs >> RETAINED_PROJECT_DIAGNOSTIC.txt 2>&1
          echo "BROWSER_SMOKE_EXIT=$?" >> RETAINED_PROJECT_DIAGNOSTIC.txt
      - name: Commit diagnostic when manually requested
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SELF_VERIFIED_PROJECT.json RETAINED_PROJECT_DIAGNOSTIC.txt
          git commit -m 'Record retained application project verification [skip ci]' || exit 0
          git push origin HEAD:main
