name: Apply runtime identity refresh
on: {push: {branches: [fix/spec-conformance-final]}}
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/spec-conformance-final}
      - run: |
          python _patch8.py
          node verify-hash.mjs
          rm _patch7.py _patch8.py .github/workflows/_apply7.yml .github/workflows/_apply8.yml 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -m 'Refresh shared runtime identity for Test IR graph' && git push origin HEAD:fix/spec-conformance-final
