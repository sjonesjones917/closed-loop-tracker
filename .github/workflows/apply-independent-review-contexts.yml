name: Apply independent review context binding
on:
  push:
    branches: [bind-independent-review-contexts-20260830]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bind-independent-review-contexts-20260830
      - run: python repair-independent-review-contexts.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js prompt-engine.js app-core.js
          git commit -m "Bind independent verification prompts to reviewer contexts"
          git push origin HEAD:bind-independent-review-contexts-20260830
