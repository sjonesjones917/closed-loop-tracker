name: Synchronize committed human-first application source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/synchronize-human-first-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use current Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify the current human-first application
        shell: bash
        run: |
          set -euo pipefail
          node migrate-self-project.mjs
          node build-app.mjs
          node attach-self-project.mjs
          cp index.html app-v13.html
          node verify-app.mjs
          node verify-self-project.mjs
          grep -Fq '<script id="stage-manifest" type="application/json">' index.html
          grep -Fq 'HUMAN_AGENT_TEAM' index.html
          grep -Fq 'data-self-project-proof="true"' index.html
          if grep -Eqi 'Agent response|paste agent response|sidecar-filename defect|version 13|\bv13\b' index.html; then
            echo 'Obsolete prompt-relay or repair/version text remains in committed HTML.' >&2
            exit 1
          fi
          cmp -s index.html app-v13.html
      - name: Commit synchronized application files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/synchronize-human-first-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v13.html SELF_VERIFIED_PROJECT.json .github/workflows/synchronize-human-first-source.yml
          git commit -m 'Synchronize committed HTML with verified human-first application'
          git push origin HEAD:main
