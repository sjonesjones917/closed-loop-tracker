name: Apply exact Stage 07 routing repair
on:
  push:
    branches: [fix/required-full-commit-gates-20260830]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Stage 07 routing caller') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/required-full-commit-gates-20260830
      - name: Replace only the obsolete structured-plan caller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('workflow-engine.js')
          text = path.read_text()
          old = "plans=testExecutionPlan(project).filter(item=>String(item.requirementId||'')===reqId)"
          new = "plans=safe(testExecutionPlan(project)?.items).filter(item=>String(item.requirementId||'')===reqId)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one obsolete Stage 07 routing caller, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- workflow-engine.js
      - name: Commit exact repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js
          git commit -m 'Fix Stage 07 routing caller'
          git push origin HEAD:fix/required-full-commit-gates-20260830
