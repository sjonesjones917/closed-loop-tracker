name: Temporary current-main edge proof
on:
  push:
    branches: [reliability/current-main-operator-migration-prompt]
permissions: {contents: write}
jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, 'Apply current-main edge corrections') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: reliability/current-main-operator-migration-prompt, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node .apply-current.mjs
      - run: node --check app-core.js && node --check project-store.js && node --check prompt-engine.js
      - run: node verify-hash.mjs
      - run: node build-test-project.mjs
      - run: node verify.mjs
      - run: node verify-ingestion.mjs
      - run: node verify-complete.mjs
      - run: node verify-full-cycle.mjs
      - run: node verify-prompt-semantics.mjs
      - name: Chromium
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/cl.log 2>&1 & PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit clean tree
        run: |
          rm -f .apply-current.mjs .github/workflows/temp-current-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply current-main edge corrections"
          git push origin HEAD:reliability/current-main-operator-migration-prompt
