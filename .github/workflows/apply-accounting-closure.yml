name: Apply deterministic accounting closure
on:
  push:
    branches: [fix/spec-conformance-zero-loss-clean]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Correct accounting repair metadata and proof contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.repair-accounting-closure.py'); s=p.read_text()
          s=s.replace("  'INTENT-STATEMENT':Object.freeze({\n    INPUT_UNIT_ID:","  'INTENT-STATEMENT':Object.freeze({\n    INTENT_STATEMENT_ID:Object.freeze({valueType:'STRING',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),\n    INPUT_UNIT_ID:",1)
          s=s.replace("  'OBLIGATION-DISPOSITION':Object.freeze({\n    OBLIGATION_ID:","  'OBLIGATION-DISPOSITION':Object.freeze({\n    DISPOSITION_ID:Object.freeze({valueType:'STRING',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),\n    OBLIGATION_ID:",1)
          for token in ['STRING_ARRAY','STRING']:
              s=s.replace(f'VALUE_TYPES.{token}',repr(token))
          p.write_text(s)

          p=Path('verify.mjs'); s=p.read_text()
          s=s.replace("'index.html','app-core.js','hash.js','workflow-schema.js','workflow-engine.js'","'index.html','app-core.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js'")
          s=s.replace("['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js']","['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js']")
          s=s.replace("orderedScripts=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']","orderedScripts=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']")
          s=s.replace("'Revise the Responsible Layer'","'CORRECT THE ROOT CAUSE'")
          s=s.replace("'closed-loop-project/2'","'closed-loop-project/3'").replace("'closed-loop-stage-response/2'","'closed-loop-stage-response/3'")
          s=s.replace("for(const file of fs.readdirSync('.'))if(/^\\.repair-/.test(file))throw new Error(`Repair scaffolding remains: ${file}`);","for(const file of fs.readdirSync('.'))if(/^\\.repair-/.test(file)&&file!=='.repair-accounting-closure.py')throw new Error(`Unexpected repair scaffolding remains: ${file}`);")
          p.write_text(s)
          PY
      - name: Apply accounting repair
        run: python3 .repair-accounting-closure.py
      - name: Prove schema, ingestion, prompt memory and visuals
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node verify-project-memory.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify.mjs
          python3 -c "import re,subprocess,pathlib; b=subprocess.check_output(['git','show','7a8b4e88962a01fdd3e2245879fa6adbc3e97469:index.html'],text=True); n=pathlib.Path('index.html').read_text(); assert re.search(r'<style>(.*?)</style>',b,re.S).group(1)==re.search(r'<style>(.*?)</style>',n,re.S).group(1); print('visual baseline CSS: PASS')"
      - name: Commit proven accounting closure
        run: |
          git rm -f .repair-accounting-closure.py .github/workflows/apply-accounting-closure.yml .github/workflows/conformance-introspect.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js response-ingestion.js verify-ingestion.mjs
          git commit -m 'Enforce Stage 1 and Stage 4 accounting closure'
          git push origin HEAD:fix/spec-conformance-zero-loss-clean
