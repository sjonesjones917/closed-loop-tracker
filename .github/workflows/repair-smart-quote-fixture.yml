name: Repair smart-quote fixture and self-remove
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run one-time smart-quote fixture repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - name: Preserve current Stage 01 accounting in smart-quote regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          t=p.read_text()
          old="  e.stageData={EXACT_DELIVERABLE_REQUESTED:'Patent application draft',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'Later filing-route facts',INPUT_SET_CONTENTS:'Human request and invention-packet.zip'};"
          new="  e.stageData={...e.stageData,EXACT_DELIVERABLE_REQUESTED:'Patent application draft',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'Later filing-route facts'};"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('smart-quote Stage 01 fixture anchor not found')
          p.write_text(t)
          PY
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          git rm .github/workflows/repair-smart-quote-fixture.yml
          git commit -m "Keep smart-quote regression bound to current intake accounting"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
