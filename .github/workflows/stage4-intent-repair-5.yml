name: Stage 4 intent repair 5
on: {push: {branches: [fix/stage4-canonical-intent]}}
permissions: {contents: write}
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/stage4-canonical-intent}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('prompt-engine.js'); s=p.read_text().replace('closed-loop-prompt-engine/24','closed-loop-prompt-engine/25')
          new="If their actual contents are available in the current executing context, inspect them deeply enough during Stage 01 to capture every human-authority fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue relevant to defining the requested outcome. Preserve those captured statements durably in INPUT_SET_CONTENTS with their source material/location so later stages consume canonical captured human authority instead of requiring the human to attach the same intent material again. Do not ask the human to re-enter facts that are already present in those materials. This limited intake inspection is Stage 01 job-definition work: it is limited to complete human-authority capture and MUST NOT perform external-source authority analysis, requirement atomization, verification design, or production work. Do not classify, validate, rank, establish provenance for, or determine authority/currency/conflicts among supplied materials here. Do not enumerate archive entries, internal file counts, directory trees, hashes, workbook rows, detailed disclosure chronology, reference lists, or other internal packet inventory in Stage 01. Stage 02 owns independent external-source discovery and assessment."
          s=re.sub(r"If their actual contents are available in the current executing context, read only the minimum portions needed.*?Supplied project materials remain project input and are inspected later only when the stage performing substantive work actually needs them\.",new,s,count=1)
          s=re.sub(r"4:'Compile atomic requirement proposals for this current job from authorized User Job Input, supplied project materials sent with this Stage 04 instruction.*?If a required material remains inaccessible, return BLOCKED with the exact MISSING_ARTIFACT or MISSING_INPUT reason rather than fabricating a complete requirement set\.","4:'Compile atomic requirement proposals for this current job from the complete application-supplied obligation universe: current authorized User Job Input, the accepted Stage 01 job definition and captured human-authority intake, human-origin obligations preserved from supplied project materials, and legitimately applicable Stage 03 external-source research. Treat the accepted Stage 01 capture as the durable semantic authority for human intent already supplied. Never require the operator to reattach, re-upload, retype, or resummarize an original intent/disclosure/source file merely to recover human-authority information that Stage 01 already captured. Original bytes are required again only when the current proposition genuinely depends on inspecting those bytes themselves or when Stage 01 explicitly recorded that required substantive content could not be captured. Preserve provenance for every obligation and fail closed if the application-provided obligation universe is incomplete; do not rediscover an unspecified input universe. A supplied project material is human-authority input, not automatically independent external authority.",s,count=1)
          s=s.replace("function contextFor(stage,state,operation,scope={}){\n const parts=[];","function contextFor(stage,state,operation,scope={}){\n const parts=[];\n if(stage===4){const stageOne=state?.stages?.[1];const captured=stageOne?{agentData:stageOne.agentData||stageOne.acceptedData||{},humanData:stageOne.humanData||{},derivedData:stageOne.derivedData||{}}:'NONE';parts.push(`STAGE 01 CAPTURED HUMAN-AUTHORITY INTAKE\\n${show(captured)}`);}")
          s=s.replace("INPUT_SET_CONTENTS should identify the top-level supplied human inputs and attached materials available to this job. Do not turn it into a Stage 02 archive/file inventory.","CAPTURE SUPPLIED HUMAN AUTHORITY ONCE: INPUT_SET_CONTENTS is the durable semantic carrier for human authority already supplied to Stage 01. When supplied material bytes are available, capture every material human-authority statement relevant to defining the requested outcome, including its source material and location, so later stages do not need the same intent file attached again. Keep this concise and semantic rather than reproducing entire files or archive inventories. INPUT_SET_CONTENTS should also identify the top-level supplied human inputs and materials. Do not turn it into a Stage 02 archive/file inventory.")
          p.write_text(s)
          p=Path('app-core.js'); s=p.read_text(); anchor="  const later={\n"; add="  if(n===4)return 'Do not reattach the original intent or disclosure files when their human-authority content was already captured and accepted in Stage 01. Stage 04 consumes that canonical capture; original bytes are needed only for a proposition that genuinely depends on the bytes themselves or for content Stage 01 explicitly could not capture.';\n"; s=s if add in s else s.replace(anchor,add+anchor,1); p.write_text(s)
          PY
          node verify-stage4-intent-capture.mjs
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stage4-intent-repair*.yml
          git add prompt-engine.js app-core.js verify-stage4-intent-capture.mjs
          git commit -m "Fix Stage 4 canonical intent carry-forward"
          git push origin HEAD:fix/stage4-canonical-intent
