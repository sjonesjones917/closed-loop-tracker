name: Remove accidental final probe
on:
  push:
    branches: [reliability/zero-loss-coordinated-20260828]
    paths: ['.github/workflows/remove-no-more-probes.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Remove probe and self
        run: |
          grep -q 'compactHistoricalNavigationStage' app-core.js
          grep -q 'historicalBackStarted' verify-browser.mjs
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f NO_MORE_PROBES
          git rm -f --ignore-unmatch .github/workflows/remove-no-more-probes.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove accidental probe before review'
          git push origin HEAD:reliability/zero-loss-coordinated-20260828
