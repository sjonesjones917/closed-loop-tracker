name: Correct Stage 27 ownership fixture
on:
  push:
    branches: [fix/zero-loss-controlled-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Stage 27 fixture correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs')
          s=p.read_text()
          old="data(27,{records:{releaseGateReviews:[recordProposal(schema,'releaseGateReviews',{tempKey:'review'})]},stageData:{CONTROLLING_DECISION_RULE:'Application-derived release only',CONTROLLING_REASON:'Canonical current evidence',AFFIRMATIVE_EVIDENCE:'Complete'}});"
          new="data(27,{records:{releaseGateReviews:[recordProposal(schema,'releaseGateReviews',{tempKey:'review'})]}});"
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('Stage 27 fixture pattern missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Prove ownership regression
        run: |
          node --check verify-full-cycle.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const f of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          const s=globalThis.closedLoopWorkflowSchema;
          for(const field of ['CONTROLLING_DECISION_RULE','CONTROLLING_REASON','AFFIRMATIVE_EVIDENCE']){
            if(s.STAGE_FIELDS[27][field].producer!=='APPLICATION')throw new Error(field+' must remain APPLICATION-owned');
          }
          const text=fs.readFileSync('verify-full-cycle.mjs','utf8');
          const marker="data(27,{records:{releaseGateReviews:[recordProposal(schema,'releaseGateReviews',{tempKey:'review'})]}});";
          if(!text.includes(marker))throw new Error('Stage 27 external fixture still attempts application-owned stageData');
          console.log(JSON.stringify({stage27ExternalReleaseFieldsApplicationOwned:true,stage27FixtureAdvisoryOnly:true}));
          NODE
      - name: Commit correction and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-stage27-fixture.yml
          git add verify-full-cycle.mjs
          git diff --cached --check
          git commit -m "Keep Stage 27 release derivation application-owned"
          git push origin HEAD:fix/zero-loss-controlled-20260831
