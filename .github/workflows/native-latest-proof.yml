name: Prove native capability truth on latest main
on:
  push:
    branches: [reliability/native-test-capability-latest-main-20260826]
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/native-test-capability-latest-main-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact latest-main correction
        run: |
          node .adapt-native-latest.mjs
          node .apply-native-current.mjs
          rm .adapt-native-latest.mjs
          rm .apply-native-current.mjs
          rm .github/workflows/native-latest-proof.yml
      - name: Architecture boundaries
        run: |
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -R "document.write" --include='*.js' --include='*.html' .
      - name: Full deterministic proof
        run: |
          node build-test-project.mjs
          for f in workbook.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js test-fixtures.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$f"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Chromium proof
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit verified permanent source
        run: |
          test ! -e .adapt-native-latest.mjs
          test ! -e .apply-native-current.mjs
          test ! -e .github/workflows/native-latest-proof.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fail closed on nonexistent native test executors"
          git push origin HEAD:reliability/native-test-capability-latest-main-20260826
