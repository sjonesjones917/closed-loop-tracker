name: Controller v3 attachment-slot apply
on:
  push:
    branches:
      - controller-v3-attachment-slots-20260904
    paths:
      - controller-v3-slot-trigger.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller-v3-attachment-slots-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node controller-v3-slot-apply.mjs
      - name: Verify attachment slots
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node verify-attachment-slot-mapping.mjs
          node verify-ingestion.mjs
          node verify-file-first-response.mjs
          mv .github/workflows/controller-v3-slot-apply.yml /tmp/controller-v3-slot-apply.yml
          node verify-complete.mjs
          node verify-v3-definition-of-done.mjs
          mv /tmp/controller-v3-slot-apply.yml .github/workflows/controller-v3-slot-apply.yml
      - name: Commit source corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js response-ingestion.js app-core.js verify-attachment-slot-mapping.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Map returned files through application-owned attachment slots'
          git push origin HEAD:controller-v3-attachment-slots-20260904
