name: Repair reviewer context lock presentation

on:
  push:
    branches:
      - finish/live-human-gate-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Keep reviewer context action visible while prerequisites are locked
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app-core.js')
          text=path.read_text()
          old="function reviewerContextMarkup(n,locked){if(!reviewerOperation(n)||locked)return '';const ctx=currentReviewerContext(n),external=ctx?String(engine.recordValue(ctx,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim():'',preflight=n===9,runReview=n===12||([17,19].includes(n)&&selectedOperation(n)==='VERIFY'),reference=preflight?'the context that authored the Stage 08 production instruction':runReview?'the production context that generated the selected run':'the Stage 21 product-generation context';if(ctx&&external)return `<div class=\"notice success\"><strong>Independent reviewer context registered.</strong><br>${esc(engine.recordId(ctx,'freshContexts'))} · ${esc(external)}. The controlling prompt is bound to this reviewer context and must not reuse ${esc(reference)}.</div>`;return `<div class=\"panel\" id=\"reviewer-context-required\" tabindex=\"-1\"><h2 class=\"section-title\">Open a fresh independent reviewer context</h2><p class=\"section-intro\">Use a new external conversation/context that did not perform ${preflight?'Stage 08 instruction authoring':runReview?'the selected run generation':'product generation'}. Enter its identifier here before saving or copying the reviewer instruction; the application binds that identity into the controlling prompt.</p><div class=\"field\"><label>Fresh reviewer context identifier</label><input id=\"fresh-context-id\" autocomplete=\"off\"><span class=\"help\">Use the external conversation/session identifier you can recognize later. Do not reuse ${esc(reference)}.</span></div><div class=\"button-row\"><button class=\"primary\" id=\"add-fresh-context\" type=\"button\">Register reviewer context</button></div></div>`;}"
          new="function reviewerContextMarkup(n,locked){if(!reviewerOperation(n))return '';const ctx=currentReviewerContext(n),external=ctx?String(engine.recordValue(ctx,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim():'',preflight=n===9,runReview=n===12||([17,19].includes(n)&&selectedOperation(n)==='VERIFY'),reference=preflight?'the context that authored the Stage 08 production instruction':runReview?'the production context that generated the selected run':'the Stage 21 product-generation context';if(ctx&&external)return `<div class=\"notice success\"><strong>Independent reviewer context registered.</strong><br>${esc(engine.recordId(ctx,'freshContexts'))} · ${esc(external)}. The controlling prompt is bound to this reviewer context and must not reuse ${esc(reference)}.</div>`;return `<div class=\"panel\" id=\"reviewer-context-required\" tabindex=\"-1\"><h2 class=\"section-title\">Open a fresh independent reviewer context</h2><p class=\"section-intro\">${locked?'This independent-review action becomes available after the prerequisite stages are complete. ':''}Use a new external conversation/context that did not perform ${preflight?'Stage 08 instruction authoring':runReview?'the selected run generation':'product generation'}. Enter its identifier here before saving or copying the reviewer instruction; the application binds that identity into the controlling prompt.</p><div class=\"field\"><label>Fresh reviewer context identifier</label><input id=\"fresh-context-id\" autocomplete=\"off\"${locked?' disabled':''}><span class=\"help\">Use the external conversation/session identifier you can recognize later. Do not reuse ${esc(reference)}.</span></div><div class=\"button-row\"><button class=\"primary\" id=\"add-fresh-context\" type=\"button\"${locked?' disabled':''}>Register reviewer context</button></div></div>`;}"
          if old not in text:
              raise SystemExit('Reviewer context markup target not found')
          path.write_text(text.replace(old,new,1))
          self_path=Path('.github/workflows/repair-reviewer-context-lock.yml')
          if self_path.exists(): self_path.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js .github/workflows
          git commit -m "Keep locked reviewer context action visible"
          git push origin HEAD:finish/live-human-gate-20260830