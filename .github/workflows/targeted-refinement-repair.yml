name: Temporary targeted refinement repair
on:
  push:
    branches: [practical-100/targeted-refinement-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/targeted-refinement-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact minimal repair and remove temporary machinery
        run: |
          python .github/targeted-refinement-repair.py
          rm .github/targeted-refinement-repair.py .github/workflows/targeted-refinement-repair.yml
      - name: Check workflow engine syntax
        run: node --check workflow-engine.js
      - name: Check ingestion syntax
        run: node --check response-ingestion.js
      - name: Check regression syntax
        run: node --check verify-ingestion.mjs
      - name: Build retained fixture
        run: node build-test-project.mjs
      - name: Hash proof
        run: node verify-hash.mjs
      - name: Architecture and ingestion-cycle proof
        run: node verify.mjs
      - name: Ingestion and targeted refinement proof
        run: node verify-ingestion.mjs
      - name: Strict gate proof
        run: node verify-complete.mjs
      - name: Full 30-stage lifecycle proof
        run: node verify-full-cycle.mjs
      - name: Prompt semantic proof
        run: node verify-prompt-semantics.mjs
      - name: Commit only permanent delta
        run: |
          git checkout -- TEST_PROJECT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Scope accepted-result refinement to exact response lane"
          git push origin HEAD:practical-100/targeted-refinement-20260826
