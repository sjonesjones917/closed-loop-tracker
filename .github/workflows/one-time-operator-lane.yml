name: One-time exact-current operator-lane proof
on:
  push:
    branches: [reliability/operator-lane-current-455a-20260826]
permissions:
  contents: write
jobs:
  prove-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/operator-lane-current-455a-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only the demonstrated operator-lane repair
        run: python3 apply-operator-lane.py
      - name: Remove one-time proof machinery before verification
        run: rm -f apply-operator-lane.py .github/workflows/one-time-operator-lane.yml
      - name: Run full deterministic and Chromium acceptance
        run: |
          node build-test-project.mjs
          node --check app-core.js
          node --check verify-complete.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/operator-lane-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if PAGE_URL=http://127.0.0.1:4173/ node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log" || return 1
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser verify-browser.mjs
          run_browser verify-browser-extra.mjs
      - name: Commit only passing permanent source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test ! -f apply-operator-lane.py
          test ! -f .github/workflows/one-time-operator-lane.yml
          git commit -m 'Bind operator review controls to selected workflow lane'
          git push origin HEAD:reliability/operator-lane-current-455a-20260826
