name: Integrate final semantic repairs v2
on:
  push:
    branches: [semantic-reliability/recovery-context]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-reliability/recovery-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse the already-reviewed source and verifier transforms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/semantic-final-integrate.yml').read_text().splitlines()
          def extract(name):
              marker=f'      - name: {name}'
              start=lines.index(marker)
              run_i=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
              out=[]
              for line in lines[run_i+1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '): break
                  out.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(out)+'\n'
          Path('/tmp/apply-source.sh').write_text(extract('Apply minimal semantic repairs'))
          Path('/tmp/apply-semantic.sh').write_text(extract('Strengthen semantic verifier for the newly audited failure modes'))
          PY
          bash /tmp/apply-source.sh
          bash /tmp/apply-semantic.sh
      - name: Make every semantic mutation real and detectable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          old="{...original,prompt:original.prompt.replace('implementation-ready specification rather than pretending implementation occurred','assume implementation occurred')}"
          new="{...original,prompt:original.prompt.replace('implementation-ready specification','assume implementation occurred')}"
          if old not in s: raise SystemExit('stale environment mutation anchor not found')
          s=s.replace(old,new,1)
          old_loop="for(const mutant of mutants)if(!semanticIssues(mutant).length)throw new Error('Semantic contradiction mutation escaped detection.');"
          new_loop="for(const mutant of mutants){if(mutant.prompt===original.prompt&&JSON.stringify(mutant.contextManifest)===JSON.stringify(original.contextManifest))throw new Error('Semantic test mutation did not alter the prompt or context manifest.');if(!semanticIssues(mutant).length)throw new Error('Semantic contradiction mutation escaped detection.');}"
          if old_loop not in s: raise SystemExit('semantic mutation loop anchor not found')
          s=s.replace(old_loop,new_loop,1)
          p.write_text(s)
          PY
      - name: Verify every deterministic and semantic boundary before commit
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Remove every temporary audit file and commit final files only
        run: |
          rm -f .semantic-trigger .github/workflows/semantic-final-integrate.yml .github/workflows/semantic-final-integrate-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workbook.js workflow-schema.js prompt-engine.js response-ingestion.js app-core.js verify-prompt-semantics.mjs TEST_PROJECT.json
          git add -u .semantic-trigger .github/workflows/semantic-final-integrate.yml .github/workflows/semantic-final-integrate-v2.yml
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -E '^\.semantic|^\.github/workflows/semantic-' || true)"
          git commit -m "Remove remaining prompt ownership contradictions"
          git push origin HEAD:semantic-reliability/recovery-context
