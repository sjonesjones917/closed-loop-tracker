name: One-time Test IR limits verifier repair
on:
  push:
    paths:
      - .github/workflows/one-time-test-runtime-limits-bootstrap.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind limits verifier to shared hash dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-test-runtime-limits.mjs')
          s=p.read_text()
          old="const context={console,crypto:webcrypto,TextEncoder,TextDecoder,Uint8Array,ArrayBuffer,DataView,URL,setTimeout,clearTimeout,Date,Math,Promise};context.globalThis=context;vm.createContext(context);\nvm.runInContext(fs.readFileSync(new URL('./test-runtime.js',import.meta.url),'utf8'),context,{filename:'test-runtime.js'});"
          new="const context={console,crypto:webcrypto,TextEncoder,TextDecoder,Uint8Array,ArrayBuffer,DataView,URL,setTimeout,clearTimeout,Date,Math,Promise};context.globalThis=context;vm.createContext(context);\nvm.runInContext(fs.readFileSync(new URL('./hash.js',import.meta.url),'utf8'),context,{filename:'hash.js'});\nvm.runInContext(fs.readFileSync(new URL('./test-runtime.js',import.meta.url),'utf8'),context,{filename:'test-runtime.js'});"
          if old not in s: raise SystemExit('limits verifier bootstrap anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          rm .github/workflows/one-time-test-runtime-limits-bootstrap.yml
      - name: Commit verifier dependency repair and remove scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-test-runtime-limits.mjs .github/workflows/one-time-test-runtime-limits-bootstrap.yml
          git commit -m "Bind Test IR limit verifier to hash authority"
          git push origin HEAD:repair/canonical-test-ir-authority-20260903
