name: Apply complete human authority prompt block
on:
  push:
    branches: [fix/complete-human-authority-prompt-block]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-human-authority-prompt-block
          fetch-depth: 0
      - name: Include all human authority in every generated prompt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          text=p.read_text()
          old="function humanInputBlock(job){const names=Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>definition?.producer==='HUMAN').map(([name])=>name);"
          new="function humanInputBlock(job){const names=Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>name);"
          if old not in text:
              if new not in text:
                  raise SystemExit('humanInputBlock target not found')
          else:
              text=text.replace(old,new,1)
          text=text.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/42';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/43';",1)
          p.write_text(text)
          PY
          rm .github/workflows/apply-complete-human-authority-prompt-block.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js .github/workflows/apply-complete-human-authority-prompt-block.yml
          git commit -m "Include complete human authority in every prompt"
          git push origin HEAD:fix/complete-human-authority-prompt-block
