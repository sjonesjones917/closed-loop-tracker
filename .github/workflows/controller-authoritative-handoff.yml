name: Controller authoritative handoff transplant
on:
  push:
    branches: [controller/stage10-authoritative-handoff]
permissions:
  contents: write
jobs:
  transplant:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply proven authoritative handoff repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin 987b93f830bda48bc392daa35d88cab7f353eda6
          if ! git cherry-pick 987b93f830bda48bc392daa35d88cab7f353eda6; then
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git rm .github/workflows/controller-authoritative-handoff.yml
          git commit --amend --no-edit
      - name: Proof
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-v3-definition-of-done.mjs
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Push repaired branch
        run: git push --force-with-lease origin HEAD:controller/stage10-authoritative-handoff
