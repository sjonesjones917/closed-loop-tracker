name: One-time repair proposal-reload profile fixture

on:
  push:
    branches: [repair/response-envelope-binding-20260903]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bind the proposal-reload response to the active contract profile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('verify-browser-extra.mjs')
          source = path.read_text()
          old = "const envelope={schema:'closed-loop-stage-response/3',jobId:'JOB-20260823144121'"
          new = "const envelope={schema:'closed-loop-stage-response/3',contractProfileId:retained.job.CONTRACT_PROFILE_ID,jobId:'JOB-20260823144121'"
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy proposal-reload envelope; found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          node --check verify-browser-extra.mjs
          node verify-response-contract-profile.mjs
      - name: Replay the exact proposal-reload Chromium path
        env:
          BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove one-time scaffolding and commit the complete repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-fix-extra-browser-profile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser-extra.mjs .github/workflows/one-time-fix-extra-browser-profile.yml
          git diff --cached --check
          git commit -m 'Bind proposal-reload fixture to current contract profile'
          git push origin HEAD:repair/response-envelope-binding-20260903