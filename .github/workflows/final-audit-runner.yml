name: Execute final audit integration
on:
  push:
    branches: [final-audit-minimum-fixes]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute audited source transformer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/final-audit-integration.yml').read_text()
          start=source.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=source.index("\n          PY\n",start)
          lines=source[start:end].splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          old='t=once(t,"\\nconsole.log(JSON.stringify({",insert+"\\nconsole.log(JSON.stringify({",\'strict date test\')'
          new='t=once(t,"\\nconsole.log(JSON.stringify({pr3Dispositions:true",insert+"\\nconsole.log(JSON.stringify({pr3Dispositions:true",\'strict date test\')'
          if script.count(old)!=1: raise SystemExit(f'Runner strict-date transformer target count {script.count(old)}')
          script=script.replace(old,new,1)
          Path('/tmp/final-audit-transform.py').write_text(script)
          PY
          python3 /tmp/final-audit-transform.py
      - name: Verify all deterministic acceptance suites
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node --check verify-ingestion.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit clean runtime delta
        run: |
          git rm .github/workflows/final-audit-integration.yml .github/workflows/final-audit-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js response-ingestion.js prompt-engine.js app-core.js verify-complete.mjs verify-ingestion.mjs
          git commit -m 'Close final operator recovery and operation-flow gaps'
          git push origin HEAD:final-audit-minimum-fixes
