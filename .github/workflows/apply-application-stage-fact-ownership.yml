name: Apply application stage fact ownership

on:
  push:
    branches:
      - fix/application-stage-fact-ownership-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/application-stage-fact-ownership-20260830
      - run: python apply-application-stage-fact-ownership.py
      - run: |
          rm -f .github/workflows/apply-application-stage-fact-ownership.yml apply-application-stage-fact-ownership.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Make stage completion facts application-owned"
          git push origin HEAD:fix/application-stage-fact-ownership-20260830
