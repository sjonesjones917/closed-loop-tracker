name: Bootstrap verified semantic adjudication patch

on:
  push:
    branches:
      - reliability/semantic-adjudication
    paths:
      - .github/workflows/bootstrap-semantic.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-semantic-adjudication
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and authenticate the locally proven patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'bypass-tunnel-reminder: true' \
            'https://sjones-semantic-patch-917.loca.lt/closed-loop-semantic-adjudication.patch' \
            -o /tmp/semantic.patch
          curl -fsSL -H 'bypass-tunnel-reminder: true' \
            'https://sjones-semantic-patch-917.loca.lt/closed-loop-semantic-adjudication.patch.sha256' \
            -o /tmp/semantic.patch.sha256
          expected="$(awk '{print $1}' /tmp/semantic.patch.sha256)"
          actual="$(sha256sum /tmp/semantic.patch | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Reconstruct the exact patch tree from the audited baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI GPT-5.6 Pro'
          git config user.email 'noreply@openai.com'
          git reset --hard c396d80c81bd853267f047bcd1e952887b64c1d0
          git am /tmp/semantic.patch
          test ! -e .github/workflows/bootstrap-semantic.yml
          curl -fsSL -H 'bypass-tunnel-reminder: true' \
            'https://sjones-semantic-patch-917.loca.lt/closed-loop-semantic-adjudication.expected-sha256' \
            -o /tmp/expected-source.sha256
          sha256sum -c /tmp/expected-source.sha256

      - name: Install Chromium test dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Prove syntax, semantics, ingestion, workflow, prompt isolation, and full cycle
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          node verify-complete.mjs
          node verify-semantic-adjudication.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs

      - name: Prove local Chromium acceptance
        shell: bash
        run: |
          set -euo pipefail
          node verify-browser.mjs
          node verify-browser-extra.mjs

      - name: Publish only the proven branch tree and remove bootstrap machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package.json package-lock.json
          test ! -e .github/workflows/bootstrap-semantic.yml
          test -z "$(git status --porcelain)"
          git push --force-with-lease=refs/heads/reliability/semantic-adjudication:${GITHUB_SHA} \
            origin HEAD:refs/heads/reliability/semantic-adjudication
