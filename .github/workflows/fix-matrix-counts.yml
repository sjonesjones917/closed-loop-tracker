name: Consolidated reliability compatibility repair
on:
  push:
    branches:
      - reliability/execution-evidence-independence-v2
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/execution-evidence-independence-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatibility repairs
        run: |
          set -euo pipefail
          node fix-stage23-evidence.mjs
          node <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[a-f0-9]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
          node --check workflow-engine.js
          node verify-hash.mjs
      - name: Complete deterministic suite
        run: node verify-complete.mjs
      - name: Ingestion suite
        run: node verify-ingestion.mjs
      - name: Full 30-stage cycle suite
        id: fullcycle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node verify-full-cycle.mjs 2>&1 | tee full-cycle.log
      - name: Upload full-cycle diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-cycle-diagnostic-final
          path: full-cycle.log
          retention-days: 1
      - name: Require full-cycle success
        if: steps.fullcycle.outcome != 'success'
        run: exit 1
      - name: Prompt semantic isolation suite
        run: node verify-prompt-semantics.mjs
      - name: Commit repair and remove one-time machinery
        run: |
          set -euo pipefail
          rm .github/workflows/fix-matrix-counts.yml .repair-trigger fix-stage23-evidence.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve reliability compatibility contracts"
          git push origin HEAD:reliability/execution-evidence-independence-v2
