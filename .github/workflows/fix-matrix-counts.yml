name: Repair verification matrix count compatibility
on:
  push:
    branches:
      - reliability/execution-evidence-independence-v2
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/execution-evidence-independence-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing verificationMatrix counts contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='workflow-engine.js';
          let s=fs.readFileSync(path,'utf8');
          const from="const presentKeys=new Set([...grouped.entries()].filter(([,items])=>items.length===1).map(([key])=>key)),missing=expected.filter(key=>!presentKeys.has(key)||duplicates.includes(key));\n  return {iterationId:String(iterationId||''),requirements,tests,runs,expected,expectedCount:expected.length,actual:valid,actualCount:valid.length,missing,duplicates,invalid,valid,satisfied,violated,undetermined,selfValidated,coverage:expected.length?valid.length/expected.length:0,complete:expected.length>0&&!missing.length&&!duplicates.length&&!invalid.length&&valid.length===expected.length};";
          const to="const counts=new Map([...grouped.entries()].map(([key,items])=>[key,items.length])),presentKeys=new Set([...grouped.entries()].filter(([,items])=>items.length===1).map(([key])=>key)),missing=expected.filter(key=>!presentKeys.has(key)||duplicates.includes(key));\n  return {iterationId:String(iterationId||''),requirements,tests,runs,expected,expectedCount:expected.length,counts,actual:valid,actualCount:valid.length,missing,duplicates,invalid,valid,satisfied,violated,undetermined,selfValidated,coverage:expected.length?valid.length/expected.length:0,complete:expected.length>0&&!missing.length&&!duplicates.length&&!invalid.length&&valid.length===expected.length};";
          if(!s.includes(from))throw new Error('Expected hardened verificationMatrix return shape not found.');
          s=s.replace(from,to);
          fs.writeFileSync(path,s);
          NODE
          node <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[a-f0-9]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
          node --check workflow-engine.js
          node verify-hash.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit repair and remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/fix-matrix-counts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve verification matrix count contract"
          git push origin HEAD:reliability/execution-evidence-independence-v2
