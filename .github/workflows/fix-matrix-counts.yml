name: Repair verification matrix compatibility
on:
  push:
    branches:
      - reliability/execution-evidence-independence-v2
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/execution-evidence-independence-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore matrix, evidence, iteration, and review contracts
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='workflow-engine.js';
          let s=fs.readFileSync(path,'utf8');
          const countFrom="const presentKeys=new Set([...grouped.entries()].filter(([,items])=>items.length===1).map(([key])=>key)),missing=expected.filter(key=>!presentKeys.has(key)||duplicates.includes(key));\n  return {iterationId:String(iterationId||''),requirements,tests,runs,expected,expectedCount:expected.length,actual:valid,actualCount:valid.length,missing,duplicates,invalid,valid,satisfied,violated,undetermined,selfValidated,coverage:expected.length?valid.length/expected.length:0,complete:expected.length>0&&!missing.length&&!duplicates.length&&!invalid.length&&valid.length===expected.length};";
          const countTo="const counts=new Map([...grouped.entries()].map(([key,items])=>[key,items.length])),presentKeys=new Set([...grouped.entries()].filter(([,items])=>items.length===1).map(([key])=>key)),missing=expected.filter(key=>!presentKeys.has(key)||duplicates.includes(key));\n  return {iterationId:String(iterationId||''),requirements,tests,runs,expected,expectedCount:expected.length,counts,actual:valid,actualCount:valid.length,missing,duplicates,invalid,valid,satisfied,violated,undetermined,selfValidated,coverage:expected.length?valid.length/expected.length:0,complete:expected.length>0&&!missing.length&&!duplicates.length&&!invalid.length&&valid.length===expected.length};";
          if(!s.includes(countFrom))throw new Error('Expected hardened verificationMatrix return shape not found.');
          s=s.replace(countFrom,countTo);
          const meaningFrom="if(testType==='MEANING'||Number(result?.stage)===23){requiredEvidenceClasses.push('MEANING_COMPARISON');";
          const meaningTo="if(Number(result?.stage)===23||String(recordValue(result,'MEANING_REVIEW_ID')||'').trim()){requiredEvidenceClasses.push('MEANING_COMPARISON');";
          if(!s.includes(meaningFrom))throw new Error('Expected over-broad meaning evidence predicate not found.');
          s=s.replace(meaningFrom,meaningTo);
          const operationFrom="const requiredOperations=normalizedPurpose==='CONFIRMATION'?['EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:['FREEZE','EXECUTE_RUN','VERIFY','COMPARE','ROOT_CAUSE','REGRESSION','CORRECT'],stage=normalizedPurpose==='CONFIRMATION'?19:17,currentOperations=new Set(acceptedChanges(project,stage).filter(change=>String(change.scope?.iterationId||'')===id).map(change=>change.operation||'COMPLETE')),missingOperations=requiredOperations.filter(operation=>!currentOperations.has(operation));";
          const operationTo="const requiredOperations=normalizedPurpose==='CONFIRMATION'?['EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:['EXECUTE_RUN','VERIFY','COMPARE','ROOT_CAUSE','REGRESSION','CORRECT'],stage=normalizedPurpose==='CONFIRMATION'?19:17,currentOperations=new Set(acceptedChanges(project,stage).filter(change=>String(change.scope?.iterationId||'')===id).map(change=>change.operation||'COMPLETE')),missingOperations=requiredOperations.filter(operation=>!currentOperations.has(operation));";
          if(!s.includes(operationFrom))throw new Error('Expected Stage 17 operation gate with response-bound FREEZE not found.');
          s=s.replace(operationFrom,operationTo);
          const reviewReasonFrom="if(matches.length!==1)reasons.push(`${testId} requires exactly one current independent meaning result.`);";
          const reviewReasonTo="if(matches.length!==1)reasons.push(`Meaning review for test ${testId} requires exactly one current independent result.`);";
          if(!s.includes(reviewReasonFrom))throw new Error('Expected Stage 23 missing-result diagnostic not found.');
          s=s.replace(reviewReasonFrom,reviewReasonTo);
          const stage24From="case 24:{const tests=(recordsForCurrentScope(project,'tests').length?recordsForCurrentScope(project,'tests'):records(project,'tests')).filter(item=>upper(recordValue(item,'TEST_TYPE'))==='ADVERSARIAL'),results=records(project,'adversarialResults');for(const test of tests){const testId=recordId(test,'tests'),matches=results.filter(item=>String(recordValue(item,'TEST_ID')||item.relationships?.TEST_ID||'')===testId);if(matches.length!==1)reasons.push(`${testId} requires exactly one current adversarial result.`);else{const result=matches[0],requirement=records(project,'requirements').find(item=>requirementId(item)===testRequirementId(test));if(upper(recordValue(result,'DETERMINATION'))!=='SATISFIED')reasons.push(`${testId} adversarial determination is not SATISFIED.`);if(!evaluateEvidenceSufficiency(project,{requirement,test,result}).sufficient)reasons.push(`${testId} lacks evidence sufficient for the adversarial proposition.`);}}break;}";
          const stage24To="case 24:{const tests=(recordsForCurrentScope(project,'tests').length?recordsForCurrentScope(project,'tests'):records(project,'tests')).filter(item=>upper(recordValue(item,'TEST_TYPE'))==='ADVERSARIAL'),results=records(project,'adversarialResults');for(const test of tests){const testId=recordId(test,'tests'),matches=results.filter(item=>String(recordValue(item,'TEST_ID')||item.relationships?.TEST_ID||'')===testId);if(matches.length!==1)reasons.push(`${testId} requires exactly one current adversarial result.`);else{const result=matches[0],requirement=records(project,'requirements').find(item=>requirementId(item)===testRequirementId(test));if(upper(recordValue(result,'DETERMINATION'))!=='SATISFIED')reasons.push(`${testId} adversarial determination is not SATISFIED.`);if(!evaluateEvidenceSufficiency(project,{requirement,test,result}).sufficient)reasons.push(`${testId} lacks evidence sufficient for the adversarial proposition.`);}}const activeRegressions=records(project,'regressions').filter(item=>upper(recordValue(item,'ACTIVE_RETIRED_STATE')||'ACTIVE')!=='RETIRED');for(const regression of activeRegressions){const regId=recordId(regression,'regressions'),matches=results.filter(item=>String(recordValue(item,'REG_ID')||item.relationships?.REG_ID||'')===regId);if(matches.length!==1)reasons.push(`Active permanent regression ${regId} requires exactly one current adversarial challenge.`);else if(upper(recordValue(matches[0],'DETERMINATION'))!=='SATISFIED')reasons.push(`Active permanent regression ${regId} adversarial challenge is not SATISFIED.`);}break;}";
          if(!s.includes(stage24From))throw new Error('Expected Stage 24 adversarial-only gate not found.');
          s=s.replace(stage24From,stage24To);
          fs.writeFileSync(path,s);
          NODE
          node <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[a-f0-9]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
          node --check workflow-engine.js
          node verify-hash.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit repair and remove one-time machinery
        run: |
          set -euo pipefail
          rm .github/workflows/fix-matrix-counts.yml .repair-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve matrix, evidence, iteration, and review contracts"
          git push origin HEAD:reliability/execution-evidence-independence-v2
