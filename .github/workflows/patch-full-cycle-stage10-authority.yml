name: Repair full-cycle Stage 10 authority fixture
on:
  push:
    branches: [fix/required-full-commit-gates-20260830]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove agent-owned Stage 10 freeze facts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/required-full-commit-gates-20260830
      - name: Remove application-owned fields from Stage 10 agent response
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs')
          s=p.read_text()
          old="data(10,{stageData:{HASHES_RECORDED_WHERE_PRACTICAL:'TRUE',CHANGES_ALLOWED_DURING_BATCH:'NONE'}});engine.freezeCandidate"
          new="data(10);engine.freezeCandidate"
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one obsolete Stage 10 agent-data fixture, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- verify-full-cycle.mjs
      - name: Commit fixture repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-full-cycle.mjs
          git commit -m 'Remove agent-owned Stage 10 freeze facts'
          git push origin HEAD:fix/required-full-commit-gates-20260830
