name: One-time response authority follow-up

on:
  push:
    branches: [repair/operation-authority-closure-20260903]

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply complete operation-authority repair
        run: node .repair-response-authority-followup.mjs
      - name: Prove executable authority boundary
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node verify-operation-authority-closure.mjs
          node verify-v3-contract.mjs
          node verify-ingestion.mjs
      - name: Remove one-time scaffold and commit complete repair
        run: |
          set -euo pipefail
          rm -f .repair-response-authority-followup.mjs .github/workflows/one-time-response-authority-followup.yml
          git config user.name "closed-loop repair automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Enforce closed operation authority in ingestion"
          git push origin HEAD:repair/operation-authority-closure-20260903
