name: Controller one-time product version repair
on:
  push:
    branches:
      - controller3-section49-runtime-closure-20260904
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-section49-runtime-closure-20260904
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply earliest-layer product-version repair and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="project.job.CURRENT_PRODUCT_ID=productId;addHistory(project,'PRODUCT_EXECUTION_RESERVED'"
          new="project.job.CURRENT_PRODUCT_ID=productId;project.job.CURRENT_PRODUCT_VERSION=fields.PRODUCT_VERSION;addHistory(project,'PRODUCT_EXECUTION_RESERVED'"
          if old not in s:
              if new in s:
                  print('Repair already present.')
              else:
                  raise SystemExit('Expected reserveProductExecution product-pointer sequence not found.')
          else:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          node --check workflow-engine.js
          git rm .github/workflows/controller-one-time-product-version.yml
          git config user.name 'closed-loop-controller'
          git config user.email 'closed-loop-controller@users.noreply.github.com'
          git add workflow-engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bind reserved product version for due-stage gates'
          git push origin HEAD:controller3-section49-runtime-closure-20260904
