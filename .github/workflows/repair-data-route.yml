name: Repair data route

on:
  push:
    branches: [fix/zero-loss-controlled-20260831]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
      - name: Apply and prove repair
        run: |
          set -euo pipefail
          python3 .repair-data-route.py
          node --check workflow-engine.js
          node --check app-core.js
          node --check verify-data-route-closure.mjs
          node verify-complete.mjs
          node verify-data-route-closure.mjs
          node verify-v3-contract.mjs
          git diff --check
      - name: Remove one-shot machinery and commit
        run: |
          set -euo pipefail
          rm .repair-data-route.py .github/workflows/repair-data-route.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js app-core.js verify-data-route-closure.mjs verify-human-stage-walkthrough.mjs .github/workflows/pages.yml .repair-data-route.py .github/workflows/repair-data-route.yml
          git diff --cached --check
          git commit -m "Prove complete 30-stage data routing and operator guidance"
          git push origin HEAD:fix/zero-loss-controlled-20260831
