name: Zero-loss finalization
on:
  push:
    branches:
      - fix/closed-loop-v3-zero-loss-final
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[zero-loss-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integrated v3 patches
        run: |
          python3 tools/zero_loss_finalize.py
          python3 tools/fix_zero_loss_test.py
          python3 tools/fix_inherited_tests.py
      - name: Run focused and existing regressions with diagnostics
        shell: bash
        run: |
          set +e
          {
            node --check workbook.js &&
            node --check workflow-schema.js &&
            node --check test-runtime.js &&
            node --check workflow-engine.js &&
            node --check prompt-engine.js &&
            node --check response-ingestion.js &&
            node verify-zero-loss-final.mjs &&
            node verify-capture-once.mjs &&
            node verify-followup-spec.mjs &&
            node verify-test-runtime.mjs &&
            node verify-ingestion.mjs &&
            node verify-prompt-semantics.mjs
          } > zero-loss-final-output.txt 2>&1
          echo ${PIPESTATUS[0]:-$?} > zero-loss-final-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: zero-loss-final-diagnostic
          path: |
            zero-loss-final-output.txt
            zero-loss-final-status.txt
      - name: Diagnostic stop
        run: exit 1
