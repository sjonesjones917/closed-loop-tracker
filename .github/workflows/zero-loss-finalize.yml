name: Zero-loss finalization
on:
  push:
    branches:
      - fix/closed-loop-v3-zero-loss-final
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[zero-loss-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integrated v3 patches
        run: |
          python3 tools/zero_loss_finalize.py
          python3 tools/fix_zero_loss_test.py
          python3 tools/fix_inherited_tests.py
          python3 tools/fix_stage4_next_action.py
      - name: Run regression set and capture exact failure
        shell: bash
        run: |
          set +e
          (
            set -e
            for f in workbook.js workflow-schema.js test-runtime.js workflow-engine.js prompt-engine.js response-ingestion.js; do
              echo "=== syntax $f ==="
              node --check "$f"
            done
            for t in verify-zero-loss-final.mjs verify-capture-once.mjs verify-followup-spec.mjs verify-test-runtime.mjs verify-ingestion.mjs verify-prompt-semantics.mjs; do
              echo "=== $t ==="
              node "$t"
            done
          ) > zero-loss-remaining-output.txt 2>&1
          status=$?
          echo "$status" > zero-loss-remaining-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: zero-loss-remaining-diagnostic
          path: |
            zero-loss-remaining-output.txt
            zero-loss-remaining-status.txt
      - name: Diagnostic stop
        run: exit 1
