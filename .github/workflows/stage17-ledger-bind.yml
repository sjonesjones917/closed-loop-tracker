name: Stage 17 proof ledger binding

on:
  push:
    branches:
      - controller-stage17-proof-bind-20260904

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Bind Stage 17 ledger and remove one-time files
        run: |
          set -euo pipefail
          python stage17-ledger-bind.py
          rm stage17-ledger-bind.py .github/workflows/stage17-ledger-bind.yml
      - name: Verify monotonic ledger and current Stage 17 proof
        run: |
          set -euo pipefail
          node verify-build-stage-ledger.mjs
          node verify-semantic-operation-boundaries.mjs
          node verify-full-cycle.mjs
      - name: Commit proof binding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Stage 17: bind exact-main proof evidence"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
