name: diagnose-semantic-v10
on:
  push:
    branches: [fix/controlling-spec-zero-loss-20260830]
    paths: [.github/workflows/diagnose-semantic-v10.yml]
permissions: {contents: write}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/controlling-spec-zero-loss-20260830, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          python3 tools/finalize_capture_once_v4.py
          python3 tools/update_prompt_semantic_regressions.py
      - run: |
          set +e
          : > semantic-v10.log
          for test in verify-intent-capture.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs; do
            echo "===== $test =====" >> semantic-v10.log
            node "$test" >> semantic-v10.log 2>&1
            echo "EXIT=$?" >> semantic-v10.log
          done
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add semantic-v10.log
          git commit -m 'Record remaining behavior semantic failures'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
          exit 0
