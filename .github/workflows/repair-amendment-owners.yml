name: Integrate controlling amendment into owners
on:
  push:
    branches: [fix/controlling-amendment-53-70]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-amendment-53-70
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate amendment into owning files
        run: node repair-amendment-owners.mjs
      - name: Commit integrated owners
        run: |
          rm -f repair-amendment-owners.mjs controlling-amendment.js .github/workflows/repair-amendment-owners.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Integrate controlling amendment into production owners"
          git push origin HEAD:fix/controlling-amendment-53-70
