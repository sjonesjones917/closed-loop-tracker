name: Lifecycle operator diagnostic
on:
  push:
    branches: [reliability/zero-loss-semantic-ui-20260828]
    paths: [verify-browser-lifecycle.mjs, .github/workflows/lifecycle-diagnostic.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check verify-browser-lifecycle.mjs
      - run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/lifecycle-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-lifecycle.mjs
