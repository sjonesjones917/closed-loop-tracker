name: One-time Stage 11 fixture repair
on:
  push:
    branches: [codex/exact-stage-operation-registry]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/exact-stage-operation-registry
      - name: Correct exact Stage 11 regression fixture and remove repair scaffold
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-complete.mjs')
          text=path.read_text()
          old="p.projectData.acceptedChanges.push({changeId:`CHANGE-STAGE11-${i}`,stage:11,status:'COMMITTED',responseType:'DATA_PROPOSAL',operation:'COMPLETE',rawResponseId:`RAW-STAGE11-${i}`"
          new="p.projectData.acceptedChanges.push({changeId:`CHANGE-STAGE11-${i}`,stage:11,status:'COMMITTED',responseType:'DATA_PROPOSAL',operation:'EXECUTE_RUN',rawResponseId:`RAW-STAGE11-${i}`"
          if old not in text:
              raise SystemExit('Expected Stage 11 fixture pattern not found exactly once.')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Stage 11 fixture pattern; found {text.count(old)}.')
          path.write_text(text.replace(old,new,1))
          PY
          rm .github/workflows/one-time-stage11-fixture-repair.yml
          node verify-stage-operation-registry.mjs
          node verify-complete.mjs
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add verify-complete.mjs .github/workflows/one-time-stage11-fixture-repair.yml
          git diff --cached --check
          git commit -m "Correct Stage 11 operation regression fixture"
          git push origin HEAD:codex/exact-stage-operation-registry
