name: One-time wire file-first regression
on:
  push:
    branches: [fix/file-first-operator-path]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/file-first-operator-path
      - name: Wire permanent regression into existing prompt verifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs')
          text=p.read_text()
          line="\nawait import('./verify-file-first-operator.mjs');\n"
          if line.strip() not in text:
              text=text.rstrip()+line
          p.write_text(text)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add verify-prompt-semantics.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Wire file-first operator regression"
            git push origin HEAD:fix/file-first-operator-path
          fi
