name: Repair scoped run-lane prerequisite fixture

on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831

permissions:
  contents: write

concurrency:
  group: repair-scoped-lane-prerequisite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the isolated Stage 10 prompt prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-complete.mjs')
          text=path.read_text(encoding='utf-8')
          old=" const acceptLane=(slot,label)=>{const pr={...prompts.buildPromptRecord(stage,p,{scope:{runId:slot.runId,contextId:slot.contextId}}),generatedAt:new Date().toISOString()};"
          new=" const acceptLane=(slot,label)=>{p.stages[10].status='COMPLETE';p.stages[10].gate={complete:true,blocked:false,reasons:[]};const pr={...prompts.buildPromptRecord(stage,p,{scope:{runId:slot.runId,contextId:slot.contextId}}),generatedAt:new Date().toISOString()};"
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'Expected one scoped-lane prompt boundary; found {text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/repair-scoped-lane-prerequisite.yml
      - name: Prove the scoped-lane fixture reaches its intended assertions
        shell: bash
        run: |
          set -euo pipefail
          node --check verify-complete.mjs
          set +e
          node verify-complete.mjs > /tmp/verify-complete.log 2>&1
          status=$?
          set -e
          cat /tmp/verify-complete.log
          if grep -Fq 'Stage 11 controlling instruction cannot be generated until Stage 10 is complete' /tmp/verify-complete.log; then
            echo 'The scoped-lane fixture still fails at its isolated Stage 10 prompt prerequisite.' >&2
            exit 1
          fi
          echo "verify-complete advanced beyond the Stage 10 scoped-lane prerequisite with status ${status}."
      - name: Commit the accepted fixture correction and remove the runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-complete.mjs .github/workflows/repair-scoped-lane-prerequisite.yml
          git diff --cached --check
          git commit -m 'Restore Stage 10 precondition in scoped lane regression'
          git push origin HEAD:fix/zero-loss-controlled-20260831
