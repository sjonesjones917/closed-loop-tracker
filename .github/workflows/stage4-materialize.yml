name: Materialize Stage 4 persisted prompt invalidation

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'Materialize Stage 4 persisted prompt invalidation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and prove the permanent Stage 4 repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=fix/stage4-persisted-prompt-v26
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git checkout -b "$BRANCH"

          node <<'NODE'
          const fs = require('fs');

          let prompt = fs.readFileSync('prompt-engine.js', 'utf8');
          const oldVersion = "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';";
          const newVersion = "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';";
          if (!prompt.includes(oldVersion)) throw new Error('Expected prompt-engine/25 boundary was not found.');
          prompt = prompt.replace(oldVersion, newVersion);
          fs.writeFileSync('prompt-engine.js', prompt);

          let semantic = fs.readFileSync('verify-prompt-semantics.mjs', 'utf8');
          const marker = "console.log(JSON.stringify({stage04CanonicalInputReuse:true}));";
          const replacement = "if(prompts.version!=='closed-loop-prompt-engine/26')throw new Error('Persisted Stage 04 prompts were not invalidated after the canonical-input reuse repair.');\nconsole.log(JSON.stringify({stage04CanonicalInputReuse:true,stage04PersistedPromptInvalidation:true,promptEngineVersion:prompts.version}));";
          if (!semantic.includes(marker)) throw new Error('Stage 04 canonical-input regression marker was not found.');
          semantic = semantic.replace(marker, replacement);
          fs.writeFileSync('verify-prompt-semantics.mjs', semantic);

          let html = fs.readFileSync('index.html', 'utf8');
          const runtimeToken = 'runtime-5f84d932b1a760ce';
          const runtimeScript = /(<script defer src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+("><\/script>)/g;
          let changedScripts = 0;
          html = html.replace(runtimeScript, (_match, prefix, suffix) => {
            changedScripts += 1;
            return prefix + runtimeToken + suffix;
          });
          if (changedScripts !== 8) throw new Error(`Expected 8 shared runtime script identities; changed ${changedScripts}.`);
          fs.writeFileSync('index.html', html);

          let workflow = fs.readFileSync('.github/workflows/pages.yml', 'utf8');
          const priorWorkflow = workflow;
          workflow = workflow.replace(/\n  materialize-stage4-intent-reuse:[\s\S]*?(?=\n  publish-status:)/, '');
          if (workflow === priorWorkflow) throw new Error('Obsolete one-time Stage 04 materializer was not found.');
          fs.writeFileSync('.github/workflows/pages.yml', workflow);

          fs.unlinkSync('.github/workflows/stage4-materialize.yml');
          NODE

          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
          git diff --check
          git add -A
          git diff --cached --check
          git commit -m "Invalidate persisted Stage 4 prompts after canonical reuse fix"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Invalidate persisted Stage 4 prompts after canonical reuse fix" \
            --body "Stage 4 already consumes accepted Stage 1 canonical intent data and no longer creates an intent-file handoff. This patch closes the remaining persistence defect: it increments the prompt-engine identity so stored pre-fix Stage 4 prompts/proposals become obsolete, refreshes the shared browser cache identity, strengthens the permanent regression, removes the obsolete materializer, and deletes this one-time workflow."
