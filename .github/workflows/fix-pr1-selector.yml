name: Fix PR1 mobile status selector
on:
  push:
    branches: [repair/pr1-mobile-selector-fix]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct the mobile status selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='@media(max-width:620px){.workflow-list .stage-card{padding:6px}.workflow-list .status{font-size:11px;min-height:24px}.workflow-list .stage-head{row-gap:3px}}'
          new='@media(max-width:620px){.workflow-list .stage-card{padding:6px}.workflow-list .stage-head>.status{font-size:11px;min-height:24px}.workflow-list .stage-head{row-gap:3px}}'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix mobile status readability selector"
          git push origin HEAD:repair/pr1-mobile-selector-fix
