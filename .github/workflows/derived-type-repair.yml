name: Temporary derived-type repair
on:
  push:
    branches:
      - reliability/derived-type-conformance-20260826
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct deterministic schema types and add regression
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          let schema=fs.readFileSync('workflow-schema.js','utf8');
          if(!schema.includes('const RECORD_FIELD_TYPE_OVERRIDES=')){
            const marker='const STAGE_FIELD_TYPE_OVERRIDES=Object.freeze({';
            if(!schema.includes(marker))throw new Error('Stage type override marker not found.');
            const overrides=`const RECORD_FIELD_TYPE_OVERRIDES=Object.freeze({\n  'ARTIFACT':Object.freeze({BYTE_SIZE:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null})}),\n  'ARTIFACT-IDENTITY':Object.freeze({AUDITED_BYTE_SIZE:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),RELEASE_BYTE_SIZE:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),EXACT_HASH_MATCH:Object.freeze({valueType:'BOOLEAN',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),EXACT_SIZE_MATCH:Object.freeze({valueType:'BOOLEAN',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null})}),\n  'CANDIDATE':Object.freeze({COMPONENT_HASHES:Object.freeze({valueType:'OBJECT',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null})}),\n  'CHAIN':Object.freeze({TEST_ID:Object.freeze({valueType:'REFERENCE_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),TEST_RESULT_ID:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),EVIDENCE_ID:Object.freeze({valueType:'REFERENCE_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),ARTIFACT_HASH_IDENTITY:Object.freeze({valueType:'REFERENCE_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),MISSING_LINKS:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null})}),\n  'RELEASE':Object.freeze({MANDATORY_REQUIREMENT_COUNTS:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),AFFIRMATIVE_EVIDENCE_COUNTS:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),VIOLATED_COUNTS:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),UNDETERMINED_COUNTS:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),VALIDATOR_COUNTS:Object.freeze({valueType:'INTEGER',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),FAILED_VALIDATORS:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),UNKNOWN_VALIDATORS:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),BLOCKING_REQUIREMENTS:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),VIOLATIONS:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null}),BLOCKERS:Object.freeze({valueType:'STRING_ARRAY',enumValues:Object.freeze([]),nullable:false,normalizerKey:null,closedProperties:null})})\n});\n`;
            schema=schema.replace(marker,overrides+marker);
            const old="const producer=ownerFromPartition(ownership,name,title),type=EXPLICIT_RECORD_FIELD_TYPES[prefix]?.[name];if(!type)throw new Error(`${title} field ${name} has no explicit type metadata.`);";
            const replacement="const producer=ownerFromPartition(ownership,name,title),type=RECORD_FIELD_TYPE_OVERRIDES[prefix]?.[name]||EXPLICIT_RECORD_FIELD_TYPES[prefix]?.[name];if(!type)throw new Error(`${title} field ${name} has no explicit type metadata.`);";
            if(!schema.includes(old))throw new Error('recordSchema type lookup marker not found.');
            schema=schema.replace(old,replacement);
            const relOld="relationships:{REQ_ID:'requirements',INSTRUCTION_ID:'instructions',TEST_ID:'tests',RELEASE_DECISION_ID:'releaseRecords',ARTIFACT_HASH_IDENTITY:'artifactIdentities'}}),";
            const relNew="relationships:{REQ_ID:'requirements',INSTRUCTION_ID:'instructions',TEST_ID:'tests',EVIDENCE_ID:'evidenceRecords',RELEASE_DECISION_ID:'releaseRecords',ARTIFACT_HASH_IDENTITY:'artifactIdentities'}}),";
            if(!schema.includes(relOld))throw new Error('evidence-chain relationship marker not found.');
            schema=schema.replace(relOld,relNew);
            fs.writeFileSync('workflow-schema.js',schema);
          }
          let full=fs.readFileSync('verify-full-cycle.mjs','utf8');
          const tag='// Application-derived record values must conform to their canonical declared types.';
          if(!full.includes(tag)){
            full+=`\n${tag}\n{\n const matches=(type,value)=>{switch(type){case 'STRING':case 'REFERENCE':return typeof value==='string';case 'INTEGER':return Number.isInteger(value);case 'NUMBER':return typeof value==='number'&&Number.isFinite(value);case 'BOOLEAN':return typeof value==='boolean';case 'STRING_ARRAY':case 'REFERENCE_ARRAY':return Array.isArray(value)&&value.every(item=>typeof item==='string');case 'OBJECT':return value!==null&&typeof value==='object'&&!Array.isArray(value);default:return false;}};\n const mismatches=[];\n for(const [collection,definition] of Object.entries(schema.RECORD_SCHEMAS)){for(const record of (p.projectData?.[collection]||[])){for(const [fieldName,fieldDefinition] of Object.entries(definition.fieldDefinitions||{})){if(fieldDefinition.producer!=='APPLICATION')continue;const fields=record.fields&&typeof record.fields==='object'?record.fields:record;if(!Object.prototype.hasOwnProperty.call(fields,fieldName))continue;const value=fields[fieldName];if(value===null&&fieldDefinition.nullable)continue;if(!matches(fieldDefinition.valueType,value))mismatches.push(\`\${collection}.\${fieldName}: declared \${fieldDefinition.valueType}, actual \${Array.isArray(value)?'ARRAY':typeof value}, value=\${JSON.stringify(value)}\`);}}}\n assert(!mismatches.length,'Application-derived type mismatches:\\n'+mismatches.join('\\n'));\n}\n`;
            fs.writeFileSync('verify-full-cycle.mjs',full);
          }
          NODE
      - name: Run deterministic acceptance
        run: |
          node --check workflow-schema.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Remove repair scaffolding and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/derived-type-repair.yml
          git add workflow-schema.js verify-full-cycle.mjs
          git commit -m "Align deterministic record values with canonical field types"
          git push origin HEAD:reliability/derived-type-conformance-20260826
