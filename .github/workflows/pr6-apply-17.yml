name: PR6 apply Stage 17 lifecycle
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend lifecycle through corrected iteration
        run: |
          python .pr6-extend-17.py
          rm -f .pr6-extend-17.py .github/workflows/pr6-apply-17.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Extend full-cycle proof through corrected iteration'
          git push
