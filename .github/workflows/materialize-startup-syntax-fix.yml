name: Materialize startup syntax repair
on:
  push:
    branches: [fix/startup-syntax-and-real-test-20260830]
    paths: [.github/workflows/materialize-startup-syntax-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-syntax-and-real-test-20260830
      - name: Repair exact Stage 17 syntax defect
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="CORRECTIONS_COMPLETED:defects.every(d=>changes.some(c=>String(recordValue(c,'TRIGGERING_DEFECT_IDS')||'').includes(recordId(d,'defects')))});"
          new="CORRECTIONS_COMPLETED:defects.every(d=>changes.some(c=>String(recordValue(c,'TRIGGERING_DEFECT_IDS')||'').includes(recordId(d,'defects'))))});"
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly one startup syntax defect, found {n}')
          p.write_text(s.replace(old,new))
          PY
          node --check workflow-engine.js
          rm .github/workflows/materialize-startup-syntax-fix.yml
      - name: Commit exact repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js .github/workflows/materialize-startup-syntax-fix.yml
          git commit -m "Fix workflow engine startup syntax"
          git push origin HEAD:fix/startup-syntax-and-real-test-20260830
