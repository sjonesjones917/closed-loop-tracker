name: Apply final Test IR repair

on:
  push:
    branches: [closed-loop-test-ir-minimal]
    paths: [.github/workflows/apply-test-ir-final.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-test-ir-minimal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact locally proven repair
        run: |
          base64 -d repair-final.patch.gz.b64 | gzip -d > /tmp/final.patch
          python3 - <<'PY'
          import re
          p='/tmp/final.patch'
          text=open(p,encoding='utf-8').read()
          parts=re.split(r'(?=^diff -ruN )',text,flags=re.M)
          text=''.join(part for part in parts if 'materialize-repair-workspace.yml' not in part)
          open(p,'w',encoding='utf-8').write(text)
          PY
          patch -p3 --batch < /tmp/final.patch
          rm -f repair-final.patch.gz.b64 .repair-test-ir.py .github/workflows/apply-test-ir-final.yml
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check test-runtime.js
          node --check test-worker.js
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit integrated repair and remove one-time files
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -o -iname '*apply-test-ir-final*' | head -1)"
          git commit -m "Integrate subject-neutral deterministic Test IR"
          git push origin HEAD:closed-loop-test-ir-minimal
