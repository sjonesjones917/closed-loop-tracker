name: Verify and commit operator-loop repair
on:
  push:
    branches:
      - reliability/operator-loop-closure-20260826
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/operator-loop-closure-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse exact patch transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          path=Path('.github/workflows/operator-loop-repair.yml')
          lines=path.read_text().splitlines()
          start=next(i for i,line in enumerate(lines) if line.strip()=="python - <<'PY'")
          end=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='PY')
          code=textwrap.dedent('\n'.join(lines[start+1:end]))
          exec(compile(code,str(path),'exec'),{'__name__':'__main__'})
          PY
      - name: Remove temporary executors before repository verification
        run: rm .github/workflows/operator-loop-repair.yml .github/workflows/operator-loop-rerun.yml
      - name: Verify deterministic application contracts
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node --check app-core.js
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node --check verify-browser-extra.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit permanent files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js workflow-engine.js verify-complete.mjs verify-browser-extra.mjs TEST_PROJECT.json .github/workflows/operator-loop-repair.yml .github/workflows/operator-loop-rerun.yml
          git commit -m "Close operator recovery and run-lane gaps"
          git push origin HEAD:reliability/operator-loop-closure-20260826
