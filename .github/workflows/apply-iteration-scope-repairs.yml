name: Apply repeated-iteration scope repairs
on:
  push:
    branches: [repair/closed-loop-reliability-20260831]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/closed-loop-reliability-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Bind historical gates to their accepted iteration and derive no-defect Stage 17 operations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js'); s=p.read_text()
          old="case 12:{requireAccepted();const iteration=latestIteration(project,[10,17,19]);const m=verificationMatrix(project,recordId(iteration,'iterations'));"
          new="case 12:{requireAccepted();const stage12Change=acceptedChanges(project,12).at(-1),stage12IterationId=String(stage12Change?.scope?.iterationId||''),iteration=stage12IterationId?records(project,'iterations').find(r=>recordId(r,'iterations')===stage12IterationId):latestIteration(project,[10]);const m=verificationMatrix(project,recordId(iteration,'iterations'));"
          if old not in s: raise SystemExit('Stage 12 current-iteration rebinding signature not found')
          s=s.replace(old,new)
          old="if(stage===13){const iteration=latestIteration(project,[10,17,19]),iterationId=recordId(iteration,'iterations');for(const req of mandatoryRequirements(project,scopeForIteration(project,iterationId)))"
          new="if(stage===13){const stage13Change=acceptedChanges(project,13).at(-1),stage13IterationId=String(stage13Change?.scope?.iterationId||''),iteration=stage13IterationId?records(project,'iterations').find(r=>recordId(r,'iterations')===stage13IterationId):latestIteration(project,[10]),iterationId=recordId(iteration,'iterations');for(const req of mandatoryRequirements(project,scopeForIteration(project,iterationId)))"
          if old not in s: raise SystemExit('Stage 13 current-iteration rebinding signature not found')
          s=s.replace(old,new)
          anchor="  if(Number(stage)===19){const appIteration=records(project,'iterations').find(r=>Number(r.stage)===19&&isActiveRecord(r)&&upper(recordValue(r,'PURPOSE'))==='UNCHANGED_CONFIRMATION'&&(!scopeRule.iterationId||recordId(r,'iterations')===String(scopeRule.iterationId))&&(!scopeRule.candidateId||String(recordValue(r,'CANDIDATE_ID')||r.scope?.candidateId||'')===String(scopeRule.candidateId)));if(appIteration)out.add('CONFIRM_FREEZE');}"
          insert="  if(Number(stage)===17){const appIteration=records(project,'iterations').find(r=>Number(r.stage)===17&&isActiveRecord(r)&&(!scopeRule.iterationId||recordId(r,'iterations')===String(scopeRule.iterationId)));if(appIteration){const appIterationId=recordId(appIteration,'iterations');if(iterationCandidateId(project,appIterationId))out.add('FREEZE');const currentIterationDefects=recordsForIteration(project,'defects',appIterationId);if(!currentIterationDefects.length){out.add('ROOT_CAUSE');out.add('CORRECT');}}}\n"
          if anchor not in s: raise SystemExit('Stage 19 application-operation anchor not found')
          if 'if(Number(stage)===17){const appIteration=' not in s:
              s=s.replace(anchor,insert+anchor)
          p.write_text(s)
          PY
          node --check workflow-engine.js
          node verify-hash.mjs
          node verify-zero-loss-accounting.mjs
          node verify-semantic-invariant.mjs
          node verify-v3-migration.mjs
      - name: Commit application source and remove repair materializer
        run: |
          rm -f .github/workflows/apply-iteration-scope-repairs.yml .repair-iteration-scope-trigger
          git config user.name closed-loop-repair-bot
          git config user.email closed-loop-repair-bot@users.noreply.github.com
          git add workflow-engine.js .github/workflows .repair-iteration-scope-trigger
          git commit -m "Bind repeated-iteration gates to canonical scope"
          git push origin HEAD:repair/closed-loop-reliability-20260831
