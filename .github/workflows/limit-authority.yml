name: Resource-limit authority proof
on:
  push:
    branches: [practical-100/final-deliverable-semantics]
permissions: {contents: write}
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python .limit-authority.py
      - run: |
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit proved change and clean proof
        if: success()
        run: |
          rm .limit-authority.py .github/workflows/limit-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use one text-field resource limit authority"
          git push
