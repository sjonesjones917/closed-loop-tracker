name: Reliability adjudication branch tool
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
permissions: {contents: write}
concurrency: {group: 'reliability-adjudication-${{ github.ref }}', cancel-in-progress: false}

jobs:
  inspect-outcome-metadata:
    if: ${{ contains(github.event.head_commit.message, '[inspect-outcome]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged patch and print exact controlled-outcome representation
        run: |
          cat .tmp/adjudication-patch-*.b64 | base64 -d | gzip -d > /tmp/adjudication.patch
          echo 'ea95f16b98b3b51e9436f983ca59046556d17cdddc47b9cad5a861882d61089c  /tmp/adjudication.patch' | sha256sum -c -
          patch -p0 < /tmp/adjudication.patch
          python3 - <<'PY'
          from pathlib import Path
          s=Path('workflow-schema.js').read_text()
          for needle in ['EXECUTION_OUTCOME','OBSERVATION_OUTCOME']:
              print('===',needle,'===')
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-500):min(len(s),i+900)])
                  start=i+len(needle)
          PY
