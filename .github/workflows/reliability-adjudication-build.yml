name: Reliability adjudication branch tool
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
permissions: {contents: write}

jobs:
  diagnose-core:
    if: ${{ contains(github.event.head_commit.message, '[diagnose-core]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged patch and print remaining central surfaces
        run: |
          cat .tmp/adjudication-patch-*.b64 | base64 -d | gzip -d > /tmp/adjudication.patch
          echo 'ea95f16b98b3b51e9436f983ca59046556d17cdddc47b9cad5a861882d61089c  /tmp/adjudication.patch' | sha256sum -c -
          patch -p0 < /tmp/adjudication.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('workflow-schema.js'); s=p.read_text(); title='Requirement-by-run verification'; ti=s.find(title); start=s.rfind('recordSchema({',0,ti); m=re.search(r'fields\s*:\s*\[([^\]]*)\]',s[start:ti+5000],re.S); a=start+m.start(1); b=start+m.end(1); body=s[a:b]
          if 'OBSERVATION_OUTCOME' not in body: s=s[:a]+body.rstrip()+(',' if not body.rstrip().endswith(',') else '')+"'OBSERVATION_OUTCOME'"+body[len(body.rstrip()):]+s[b:]
          p.write_text(s)
          PY
          for needle in 'function validateTraceIntegrity' 'function releaseMetrics' "case 'regressionExecutions'" 'function defectResolvedByRegression' 'function coverageMetrics' 'case 15:' 'case 16:' 'case 30:'; do echo "===== $needle ====="; grep -n -A170 -B20 "$needle" workflow-engine.js | head -230 || true; done
          echo '===== regression schema ====='; grep -n -A8 -B4 'regressionExecutions:recordSchema' workflow-schema.js || true
          echo '===== root/change schema ====='; grep -n -A18 -B3 'rootCauses:recordSchema' workflow-schema.js || true; grep -n -A18 -B3 'changes:recordSchema' workflow-schema.js || true
          echo '===== invariant suite ====='; cat verify-adjudication.mjs
