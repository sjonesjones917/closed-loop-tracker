name: Reliability adjudication branch tool
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: 'reliability-adjudication-${{ github.ref }}', cancel-in-progress: false}

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[adjudication-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Snapshot exact implementation inputs
        run: |
          mkdir -p /tmp/adjudication-snapshot
          cp workflow-engine.js workflow-schema.js response-ingestion.js prompt-engine.js project-store.js app-core.js workbook.js test-fixtures.mjs verify-complete.mjs verify-ingestion.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-browser.mjs verify-browser-extra.mjs /tmp/adjudication-snapshot/
      - uses: actions/upload-artifact@v4
        with:
          name: adjudication-source-${{ github.sha }}
          path: /tmp/adjudication-snapshot
          if-no-files-found: error
