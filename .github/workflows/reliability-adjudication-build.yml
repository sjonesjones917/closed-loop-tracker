name: Reliability adjudication branch tool
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
permissions: {contents: write}

jobs:
  inspect-overrides:
    if: ${{ contains(github.event.head_commit.message, '[inspect-overrides]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact post-patch override and record blocks
        run: |
          cat .tmp/adjudication-patch-*.b64 | base64 -d | gzip -d > /tmp/adjudication.patch
          patch -p0 < /tmp/adjudication.patch
          python3 - <<'PY'
          from pathlib import Path
          s=Path('workflow-schema.js').read_text()
          for needle in ['const RECORD_FIELD_TYPE_OVERRIDES','regressionExecutions:recordSchema','changes:recordSchema','evidenceRecords:recordSchema']:
            i=s.find(needle); print('\n===== '+needle+' ====='); print(s[i:i+6000] if i>=0 else 'NOT FOUND')
          PY
