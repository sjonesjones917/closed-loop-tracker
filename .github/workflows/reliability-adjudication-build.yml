name: Reliability adjudication branch tool
on:
  push:
    branches: [reliability/semantic-adjudication-20260827]
permissions: {contents: write}

jobs:
  diagnose-bindings:
    if: ${{ contains(github.event.head_commit.message, '[diagnose-bindings]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged patch and inspect canonical binding surfaces
        run: |
          cat .tmp/adjudication-patch-*.b64 | base64 -d | gzip -d > /tmp/adjudication.patch
          echo 'ea95f16b98b3b51e9436f983ca59046556d17cdddc47b9cad5a861882d61089c  /tmp/adjudication.patch' | sha256sum -c -
          patch -p0 < /tmp/adjudication.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('workflow-schema.js'); s=p.read_text(); title='Requirement-by-run verification'; ti=s.find(title); start=s.rfind('recordSchema({',0,ti); m=re.search(r'fields\s*:\s*\[([^\]]*)\]',s[start:ti+5000],re.S); a=start+m.start(1); b=start+m.end(1); body=s[a:b]
          if 'OBSERVATION_OUTCOME' not in body: s=s[:a]+body.rstrip()+(',' if not body.rstrip().endswith(',') else '')+"'OBSERVATION_OUTCOME'"+body[len(body.rstrip()):]+s[b:]
          p.write_text(s)
          PY
          echo '===== response ingestion evidence/result wiring ====='
          grep -n -E 'evidenceRefs|evidenceRecords|rawResponseId|sourceProposalId|context|CONTEXT|execution|EXECUTION|canonicalRecord|append|push\(' response-ingestion.js | head -280
          echo '===== context schemas ====='
          grep -n -A24 -B4 -E 'contextRegistrations|contexts:recordSchema|runContexts|generationContexts|verificationContexts' workflow-schema.js || true
          echo '===== evidence schema ====='
          grep -n -A18 -B4 'evidenceRecords:recordSchema' workflow-schema.js
          echo '===== regression/change schema ====='
          grep -n -A14 -B4 'regressionExecutions:recordSchema' workflow-schema.js
          grep -n -A18 -B4 'changes:recordSchema' workflow-schema.js
          echo '===== artifact/version schemas ====='
          grep -n -A24 -B4 -E 'artifacts:recordSchema|versions:recordSchema|products:recordSchema|baselines:recordSchema' workflow-schema.js || true
          echo '===== result context fields ====='
          grep -n -E 'VERIFIER_CONTEXT_ID|GENERATION_CONTEXT_ID|CONTEXT_ID|RUN_ID|EXECUTION_ID' workflow-schema.js | head -220
          echo '===== staged evidence/effective evaluator ====='
          grep -n -A230 -B20 'function evaluateEvidenceContract' workflow-engine.js | head -280
