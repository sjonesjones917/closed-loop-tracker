name: Reproduce candidate operator browser failure
on:
  push:
    branches: [repair/complete-conformance-continuation-20260914]
    paths:
      - .github/workflows/reproduce-operator-browser.yml
permissions:
  contents: write
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact registered source corrections on the existing candidate
        run: |
          set -euo pipefail
          mkdir -p browser-reproduction
          git rev-parse HEAD > browser-reproduction/starting-commit.txt
          cp app-core.js /tmp/clt-before.js
          node verification/conformance-20260917/apply-continuation-repair.mjs > browser-reproduction/repair.json
          for FILE in app-core.js verify-workflow-focus.mjs verify-removal-feedback.mjs verify-browser.mjs verify-browser-extra.mjs verify-mobile-stage-action.mjs verify-browser-recovery.mjs operator-browser-driver.mjs verify-complete-operator-journey.mjs verify-conformance-regressions.mjs; do node --check "$FILE"; done
          git diff --check
          git diff > browser-reproduction/repair.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-core.js verify-workflow-focus.mjs verify-browser.mjs verify-browser-extra.mjs verify-mobile-stage-action.mjs verify-browser-recovery.mjs operator-browser-driver.mjs verify-complete-operator-journey.mjs verify-conformance-regressions.mjs
          git commit -m 'Preserve explicit retry focus and verify complete recovery transport against its authority'
          git push origin HEAD:refs/heads/repair/complete-conformance-continuation-20260914
          SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_COMMIT" > browser-reproduction/source-commit.txt
          git archive --format=tar HEAD | gzip > browser-reproduction/exact-source.tar.gz
          sha256sum app-core.js index.html workbook.js hash.js project-store.js prompt-engine.js response-ingestion.js workflow-engine.js specification/closed-loop-reliability-controlling-implementation-specification.txt > browser-reproduction/source-hashes.txt
      - name: Prove original focus and removal failures then verify repaired cases
        run: |
          set -euo pipefail
          for SUITE in verify-workflow-focus.mjs verify-removal-feedback.mjs; do
            set +e
            APP_SOURCE=/tmp/clt-before.js node "$SUITE" > "browser-reproduction/$SUITE.before.stdout" 2> "browser-reproduction/$SUITE.before.stderr"
            BEFORE=$?
            set -e
            printf '%s\n' "$BEFORE" > "browser-reproduction/$SUITE.before.exit"
            test "$BEFORE" != 0
          done
          grep -q FOCUS_DEFERRED_REASON_ORACLE browser-reproduction/verify-workflow-focus.mjs.before.stderr
          grep -q FOCUS_RETRY_CALLER_ORACLE browser-reproduction/verify-workflow-focus.mjs.before.stderr
          grep -q REMOVAL_RECOVERY_TRUTH_ORACLE browser-reproduction/verify-removal-feedback.mjs.before.stdout
          for SUITE in verify-workflow-focus.mjs verify-removal-feedback.mjs verify-history-selection-capture.mjs verify-history-selection-fault.mjs verify-history-navigation.mjs; do
            node "$SUITE" > "browser-reproduction/$SUITE.stdout" 2> "browser-reproduction/$SUITE.stderr"
            printf '0\n' > "browser-reproduction/$SUITE.exit"
          done
      - name: Build exact corrected static application
        id: build
        run: node build-static-site.mjs --out _site --source-commit "$SOURCE_COMMIT" --workflow-run "$GITHUB_RUN_ID" > browser-reproduction/build.json
      - name: Replay actual Save and navigation viewport regression
        id: viewport
        env:
          BROWSER: /usr/bin/google-chrome
          VIEWPORT_EVIDENCE_DIR: browser-reproduction/viewport
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site > browser-reproduction/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 10m node verify-action-viewport.mjs > browser-reproduction/viewport.raw.log 2>&1
          RESULT=$?
          printf '%s\n' "$RESULT" > browser-reproduction/viewport.exit
          exit "$RESULT"
      - name: Preserve focused source and raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-continuation-focused-${{ github.run_id }}
          path: |
            browser-reproduction/*.txt
            browser-reproduction/*.json
            browser-reproduction/*.diff
            browser-reproduction/*.stdout
            browser-reproduction/*.stderr
            browser-reproduction/*.exit
            browser-reproduction/*.log
            browser-reproduction/*.tar.gz
            browser-reproduction/viewport/viewport.json
            browser-reproduction/viewport/*/stage-*.png
          if-no-files-found: error
      - name: Replay the complete actual-controls operator journey
        if: always() && steps.viewport.outcome == 'success'
        env:
          BROWSER: /usr/bin/google-chrome
          STATIC_SITE_ROOT: _site
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site > browser-reproduction/journey-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          set +e
          timeout --signal=TERM --kill-after=20s 60m node verify-complete-operator-journey.mjs > browser-reproduction/complete-operator.stdout 2> browser-reproduction/complete-operator.stderr
          RESULT=$?
          printf '%s\n' "$RESULT" > browser-reproduction/complete-operator.exit
          exit "$RESULT"
      - name: Preserve complete operator evidence before independent browser cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-continuation-journey-${{ github.run_id }}
          path: |
            browser-reproduction/source-commit.txt
            browser-reproduction/complete-operator.stdout
            browser-reproduction/complete-operator.stderr
            browser-reproduction/complete-operator.exit
            operator-evidence/
          if-no-files-found: error
      - name: Replay missing and corrected returned-file transport
        if: always() && steps.build.outcome == 'success'
        env:
          BROWSER: /usr/bin/google-chrome
          STATIC_SITE_ROOT: _site
        run: |
          set -euo pipefail
          mkdir -p browser-reproduction/extra
          python3 -m http.server 4173 --directory _site > browser-reproduction/extra/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 15m node verify-browser-extra.mjs > browser-reproduction/extra/stdout 2> browser-reproduction/extra/stderr
          RESULT=$?
          printf '%s\n' "$RESULT" > browser-reproduction/extra/exit
          exit "$RESULT"
      - name: Preserve returned-file observations and failure details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-continuation-extra-${{ github.run_id }}
          path: |
            browser-reproduction/source-commit.txt
            browser-reproduction/extra/
          if-no-files-found: error
      - name: Replay independent project creation and full recovery file transport
        if: always() && steps.build.outcome == 'success'
        env:
          BROWSER: /usr/bin/google-chrome
          STATIC_SITE_ROOT: _site
        run: |
          set -euo pipefail
          mkdir -p browser-reproduction/affected
          python3 -m http.server 4173 --directory _site > browser-reproduction/affected/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          RESULT=0
          for SUITE in verify-browser.mjs verify-mobile-stage-action.mjs verify-browser-recovery.mjs; do
            set +e
            timeout --signal=TERM --kill-after=10s 15m node "$SUITE" > "browser-reproduction/affected/$SUITE.stdout" 2> "browser-reproduction/affected/$SUITE.stderr"
            STATUS=$?
            set -e
            printf '%s\n' "$STATUS" > "browser-reproduction/affected/$SUITE.exit"
            if test "$STATUS" != 0; then RESULT=1; fi
          done
          exit "$RESULT"
      - name: Preserve affected browser results without truncation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-continuation-affected-${{ github.run_id }}
          path: |
            browser-reproduction/source-commit.txt
            browser-reproduction/source-hashes.txt
            browser-reproduction/affected/
            recovery-browser-evidence/
          if-no-files-found: error
