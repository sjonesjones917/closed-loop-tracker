name: Reproduce candidate operator browser failure
on:
  push:
    branches: [repair/complete-conformance-continuation-20260914]
    paths:
      - .github/workflows/reproduce-operator-browser.yml
permissions:
  contents: write
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact reviewed source repairs without overwriting concurrent work
        run: |
          set -euo pipefail
          mkdir -p browser-reproduction
          git rev-parse HEAD > browser-reproduction/starting-commit.txt
          node verification/conformance-20260917/apply-view-coordinate-repair.mjs > browser-reproduction/repair.json
          node --check app-core.js
          node --check test-project-store-runtime.mjs
          git diff --check
          git diff -- app-core.js test-project-store-runtime.mjs > browser-reproduction/repair.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-core.js test-project-store-runtime.mjs
          git commit -m 'Initialize new view coordinates and provide shared history timer cancellation'
          git push origin HEAD:refs/heads/repair/complete-conformance-continuation-20260914
          SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_COMMIT" > browser-reproduction/source-commit.txt
          sha256sum app-core.js index.html test-project-store-runtime.mjs specification/closed-loop-reliability-controlling-implementation-specification.txt > browser-reproduction/source-hashes.txt
      - name: Replay shared production history navigation
        run: |
          set -euo pipefail
          node verify-history-navigation.mjs > browser-reproduction/history-navigation.stdout 2> browser-reproduction/history-navigation.stderr
      - name: Build exact corrected source
        run: |
          set -euo pipefail
          node build-test-project.mjs > browser-reproduction/build-test-project.log 2>&1
          node build-static-site.mjs --out _site --source-commit "$SOURCE_COMMIT" --workflow-run "$GITHUB_RUN_ID" > browser-reproduction/build.json
      - name: Replay actual Save and navigation viewport regression
        id: viewport
        env:
          BROWSER: /usr/bin/google-chrome
          VIEWPORT_EVIDENCE_DIR: browser-reproduction/viewport
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site > browser-reproduction/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 10m node verify-action-viewport.mjs > browser-reproduction/viewport.raw.log 2>&1
          RESULT=$?
          set -e
          printf '%s\n' "$RESULT" > browser-reproduction/viewport.exit
          cat browser-reproduction/viewport.raw.log
          exit "$RESULT"
      - name: Preserve exact focused evidence before the complete journey
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-repair-focused-${{ github.run_id }}
          path: |
            browser-reproduction/starting-commit.txt
            browser-reproduction/source-commit.txt
            browser-reproduction/source-hashes.txt
            browser-reproduction/repair.json
            browser-reproduction/repair.diff
            browser-reproduction/history-navigation.stdout
            browser-reproduction/history-navigation.stderr
            browser-reproduction/build-test-project.log
            browser-reproduction/build.json
            browser-reproduction/http.log
            browser-reproduction/viewport.raw.log
            browser-reproduction/viewport.exit
            browser-reproduction/viewport/viewport.json
            browser-reproduction/viewport/*/stage-*.png
          if-no-files-found: error
      - name: Replay complete actual-controls operator journey against corrected source
        if: steps.viewport.outcome == 'success'
        env:
          BROWSER: /usr/bin/google-chrome
          STATIC_SITE_ROOT: _site
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site > browser-reproduction/journey-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          set +e
          timeout --signal=TERM --kill-after=20s 60m node verify-complete-operator-journey.mjs > browser-reproduction/complete-operator.stdout 2> browser-reproduction/complete-operator.stderr
          RESULT=$?
          printf '%s\n' "$RESULT" > browser-reproduction/complete-operator.exit
          exit "$RESULT"
      - name: Preserve complete operator replay raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-repair-journey-${{ github.run_id }}
          path: |
            browser-reproduction/source-commit.txt
            browser-reproduction/source-hashes.txt
            browser-reproduction/complete-operator.stdout
            browser-reproduction/complete-operator.stderr
            browser-reproduction/complete-operator.exit
            browser-reproduction/journey-http.log
            operator-evidence/
          if-no-files-found: error
