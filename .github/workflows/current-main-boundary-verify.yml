name: Verify current-main boundary repairs

on:
  push:
    branches:
      - reliability/current-main-final-boundaries-20260826

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused repairs
        run: |
          python3 .github/current-main-engine-patch.py
          python3 .github/current-main-identity-patch.py
          python3 .github/current-main-storage-patch.py
          python3 .github/current-main-test-patch.py
          python3 .github/current-main-cache-token.py
      - name: Syntax
        run: |
          node --check workflow-engine.js
          node --check project-store.js
          node --check app-core.js
      - name: Hash and source/schema
        run: |
          node verify-hash.mjs
          node verify.mjs
      - name: Ingestion and gates
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Continuous lifecycle
        run: node verify-full-cycle.mjs
      - name: Prompt contradiction acceptance
        run: node verify-prompt-semantics.mjs
      - name: Primary and extended Chromium acceptance
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-boundary-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only verified permanent changes
        run: |
          git config user.name "closed-loop-reliability-bot"
          git config user.email "closed-loop-reliability-bot@users.noreply.github.com"
          git rm .github/current-main-engine-patch.py .github/current-main-identity-patch.py .github/current-main-storage-patch.py .github/current-main-test-patch.py .github/current-main-cache-token.py .github/workflows/current-main-boundary-verify.yml
          git add workflow-engine.js project-store.js app-core.js index.html verify-complete.mjs verify-browser-extra.mjs
          git commit -m "Close remaining current-state reliability boundaries"
          git push origin HEAD:reliability/current-main-final-boundaries-20260826
