name: Temporary spec repair bootstrap
on:
  push:
    branches: [fix/spec-conformance-envelope-20260903]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce Stage 01 repair and capture failure
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          replacements={
            "'incorporated into the job definition'":"'EXTRACTED_RELEVANT_INFORMATION'",
            '"incorporated into the job definition"':'"EXTRACTED_RELEVANT_INFORMATION"',
            "'retained as context'":"'RETAINED_AS_CONTEXT'",
            '"retained as context"':'"RETAINED_AS_CONTEXT"',
            "'unresolved human-only'":"'UNRESOLVED_HUMAN_AUTHORITY'",
            '"unresolved human-only"':'"UNRESOLVED_HUMAN_AUTHORITY"',
            "'later-resolvable'":"'LATER_RESOLVABLE'",
            '"later-resolvable"':'"LATER_RESOLVABLE"',
            "'inapplicable with reason'":"'NO_PROJECT_RELEVANT_INFORMATION'",
            '"inapplicable with reason"':'"NO_PROJECT_RELEVANT_INFORMATION"',
          }
          for p in list(Path('.').glob('*.js'))+list(Path('.').glob('*.mjs')):
            s=p.read_text(); before=s
            for a,b in replacements.items(): s=s.replace(a,b)
            s=s.replace('incorporated into the job definition|retained as context|unresolved human-only|later-resolvable|inapplicable with reason','EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED')
            if s!=before:p.write_text(s)
          PY
          : > /tmp/repair-failure.txt
          for cmd in \
            "node --check prompt-engine.js" \
            "node verify-stage01-intake-closure.mjs" \
            "node verify-zero-loss-accounting.mjs" \
            "node verify-one-time-intent-intake.mjs" \
            "node verify-prompt-semantics.mjs"; do
            echo "===== $cmd =====" >> /tmp/repair-failure.txt
            bash -lc "$cmd" >> /tmp/repair-failure.txt 2>&1
            echo "exit=$?" >> /tmp/repair-failure.txt
          done
          git reset --hard HEAD
          git clean -fd
          cp /tmp/repair-failure.txt repair-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repair-failure.txt
          git commit -m 'Capture Stage 01 repair diagnostics [diagnostic-output]'
          git push
