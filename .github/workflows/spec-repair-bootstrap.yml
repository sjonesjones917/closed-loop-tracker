name: Temporary spec repair bootstrap
on:
  push:
    branches:
      - fix/spec-conformance-envelope-20260903
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[stage01-dispositions-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair
        run: python .repair-stage01.py
      - name: Prove repair
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check prompt-engine.js
          node verify-stage01-disposition-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
      - name: Commit complete ratchet step
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js verify-*.mjs
          git commit -m 'Enforce closed Stage 01 accounting dispositions [stage01-dispositions-applied]'
          git push
