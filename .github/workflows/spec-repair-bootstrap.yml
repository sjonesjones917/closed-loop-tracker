name: Temporary spec repair bootstrap
on:
  push:
    branches: [fix/spec-conformance-envelope-20260903]
permissions:
  contents: write
jobs:
  locate:
    if: ${{ !contains(github.event.head_commit.message, '[locator-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture Stage 01 accounting evaluator seams
        run: |
          python - <<'PY'
          from pathlib import Path
          needles=['incorporated into the job definition','retained as context','unresolved human-only','later-resolvable','sourceUnitId','ACCOUNTING_COMPLETE','raw unit','RAW_UNIT']
          out=[]
          for name in ['workflow-engine.js','response-ingestion.js','workflow-schema.js']:
            text=Path(name).read_text()
            out.append('===== '+name+' =====')
            for needle in needles:
              pos=0
              while True:
                i=text.find(needle,pos)
                if i<0: break
                out.append(f'--- {needle} @ {i} ---')
                out.append(text[max(0,i-1200):min(len(text),i+2200)])
                pos=i+len(needle)
          Path('/tmp/repair-locator.txt').write_text('\n'.join(out))
          PY
          cp /tmp/repair-locator.txt repair-locator.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repair-locator.txt
          git commit -m 'Capture Stage 01 accounting evaluator seams [locator-output]'
          git push
