name: One-time Stage 1 browser semantic capture assertion repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/closed-loop-v3-final-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace impossible raw JSON substring assertion with semantic equality
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');const path='verify-browser.mjs';let text=fs.readFileSync(path,'utf8');
          const from="assert(retainedInputCapture.includes(String(retained.job.EXACT_USER_OBJECTIVE_VERBATIM||'')),'Legacy Stage 01 accepted input-set capture does not contain the preserved exact user objective.');";
          const to="let parsedRetainedInputCapture;try{parsedRetainedInputCapture=JSON.parse(retainedInputCapture);}catch{parsedRetainedInputCapture=null;}assert(parsedRetainedInputCapture?.humanAuthority?.EXACT_USER_OBJECTIVE_VERBATIM===String(retained.job.EXACT_USER_OBJECTIVE_VERBATIM||''),'Legacy Stage 01 accepted input-set capture does not exactly preserve the canonical user objective after JSON decoding.');assert(parsedRetainedInputCapture?.humanAuthority?.EXPLICIT_USER_REQUIREMENTS===String(retained.job.EXPLICIT_USER_REQUIREMENTS||''),'Legacy Stage 01 accepted input-set capture does not exactly preserve the canonical explicit requirements after JSON decoding.');";
          const a=text.indexOf(from),b=text.lastIndexOf(from);if(a<0||a!==b)throw new Error('Expected exactly one invalid retained capture substring assertion.');text=text.slice(0,a)+to+text.slice(a+from.length);fs.writeFileSync(path,text);
          NODE
          node --check verify-browser.mjs
          git diff --check
      - name: Commit integrated regression correction and remove one-time workflow
        shell: bash
        run: |
          git config user.name "closed-loop-repair-bot"
          git config user.email "closed-loop-repair-bot@users.noreply.github.com"
          git add verify-browser.mjs
          git commit -m "Verify Stage 1 retained capture semantically"
          git rm .github/workflows/repair-browser-semantic-capture-assertion.yml
          git commit -m "Remove completed Stage 1 browser assertion repair workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
