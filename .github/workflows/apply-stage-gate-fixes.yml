name: Apply stage gate completion fixes
on:
  push:
    branches:
      - fix/complete-closed-loop-spec-20260831
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
          fetch-depth: 0
      - name: Apply lifecycle and gate fixes
        run: python3 .github/apply-gate.py
      - name: Verify runtime syntax
        run: |
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check app-core.js
          node --check test-runtime.js
      - name: Commit integrated correction and remove repair scaffolding
        run: |
          rm .github/apply-gate.py .github/workflows/apply-stage-gate-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js workflow-schema.js index.html app-core.js test-runtime.js .github/apply-gate.py .github/workflows/apply-stage-gate-fixes.yml
          git commit -m "Close lifecycle and release gate authority holes"
          git push origin HEAD:fix/complete-closed-loop-spec-20260831
