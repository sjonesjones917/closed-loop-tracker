name: Apply complete prompt authority source fix
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize complete prompt authority source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/51';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/52';",1)
          old="const reviewerHumanFields=new Set(['EXACT_USER_OBJECTIVE_VERBATIM','PROHIBITED_ACTIONS']);\n  const carryForwardHumanFields=new Set(['JOB_TITLE','JOB_OWNER','REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','AVAILABLE_TOOLS','PROHIBITED_ACTIONS']);\n  const humanAuthority=Object.fromEntries(humanFieldNames.filter(name=>isolatedReviewer?reviewerHumanFields.has(name):(Number(stage)<=3?false:carryForwardHumanFields.has(name))).map(name=>[name,job?.[name]??null]));"
          new="const reviewerHumanFields=new Set(['EXACT_USER_OBJECTIVE_VERBATIM','PROHIBITED_ACTIONS']);\n  const humanAuthority=Object.fromEntries(humanFieldNames.filter(name=>isolatedReviewer?reviewerHumanFields.has(name):true).map(name=>[name,job?.[name]??null]));"
          if old not in s: raise SystemExit('human authority selector not found')
          s=s.replace(old,new,1)
          old2="const fullStage01=Number(stage)<=3&&!isolatedReviewer;\n  const acceptedStage01=isolatedReviewer?{objectiveVerbatim:job.EXACT_USER_OBJECTIVE_VERBATIM??null,detailWithheld:true,withheldReason:'Independent verification receives only the current operation-authorized projection. The complete Stage 01 intake remains canonical and reusable but is not embedded when it is unnecessary to the proposition under review.'}:fullStage01?{capture:parseCapturedInputSet(state),agentData:stageOne.agentData||stageOne.acceptedData||{},humanData:stageOne.humanData||{},derivedData:workflow.deriveStageData(state,1)}:{objective:job.EXACT_DELIVERABLE_REQUESTED||job.EXACT_USER_OBJECTIVE_VERBATIM||null,inputVersion:job.CURRENT_INPUT_VERSION||null,capturePreservedCanonically:true,acceptedChangeIds:safe(stageOne.acceptedDataChangeIds)};"
          new2="const fullStage01=!isolatedReviewer;\n  const acceptedStage01=isolatedReviewer?{objectiveVerbatim:job.EXACT_USER_OBJECTIVE_VERBATIM??null,detailWithheld:true,withheldReason:'Independent verification receives only the current operation-authorized projection. The complete Stage 01 intake remains canonical and reusable but is not embedded when it is unnecessary to the proposition under review.'}:{capture:parseCapturedInputSet(state),agentData:stageOne.agentData||stageOne.acceptedData||{},humanData:stageOne.humanData||{},derivedData:workflow.deriveStageData(state,1),capturePreservedCanonically:true};"
          if old2 not in s: raise SystemExit('stage one capture selector not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          for name in ['index.html','app-core.js','test-runtime.js']:
              q=Path(name); t=q.read_text(); t=t.replace('runtime-20260830-live-operator-57','runtime-20260830-live-operator-58'); q.write_text(t)
          readme=Path('README.md'); t=readme.read_text(); t=t.replace('Project schema: `closed-loop-project/2`.','Project schema: `closed-loop-project/3`.').replace('Response schema: `closed-loop-stage-response/2`.','Response schema: `closed-loop-stage-response/3`.').replace('The deterministic legacy migration is `human-project/30` → `closed-loop-project/2`.','The deterministic migration path is `human-project/30` → `closed-loop-project/2` → `closed-loop-project/3`; a direct legacy-to-/3 migration is valid only when it produces the same canonical result and auditability.'); readme.write_text(t)
          PY
          rm -f .github/workflows/materialize-full-human-authority.yml
          rm -f .github/workflows/apply-complete-prompt-authority-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-engine.js index.html app-core.js test-runtime.js README.md .github/workflows
          git commit -m "Carry complete captured human authority through stage prompts"
          git push origin HEAD:fix/complete-prompt-authority-source-20260830
