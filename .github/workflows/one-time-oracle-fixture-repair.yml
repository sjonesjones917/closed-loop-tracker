name: One-time oracle fixture repair

on:
  push:
    branches:
      - fix/spec-grounded-route-oracle-20260831

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spec-grounded-route-oracle-20260831
      - name: Apply fixture repair
        run: python .repair-oracle-fixture.py
      - name: Verify only oracle changed
        run: |
          git diff --exit-code -- . ':!verify-spec-grounded-route-oracle.mjs'
          git diff --check
      - name: Commit fixture repair
        run: |
          if git diff --quiet -- verify-spec-grounded-route-oracle.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify-spec-grounded-route-oracle.mjs
          git commit -m 'Make defect route sentinels derivation-valid'
          git push origin HEAD:fix/spec-grounded-route-oracle-20260831
