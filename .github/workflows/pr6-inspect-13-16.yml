name: PR6 inspect stages 13-16
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Print controlling contracts
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}}; globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const f of ['workbook.js','hash.js','workflow-schema.js','workflow-engine.js']) vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          const s=globalThis.closedLoopWorkflowSchema;
          for(const n of [13,14,15,16]) console.log('STAGE',n,JSON.stringify(s.STAGE_CONTRACTS[n],null,2));
          for(const c of ['comparisons','defects','rootCauses','regressions','regressionExecutions','changes']) console.log('SCHEMA',c,JSON.stringify(s.RECORD_SCHEMAS[c],null,2));
          NODE
