name: Apply audited 30-stage patch
on:
  push:
    branches: [fix/full-30-stage-prompt-contract-audit-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, reconstruct, test, and apply exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'e02bc24c3c304f4710ff6d8dc35df39e47a27d0a2198cf5d2add64be7a559756  .audit-patch-v2/chunk-00' | sha256sum -c -
          echo '7917e8d9934cf1a893eb31d5a73829629caa9e4c966065fb9d029c325ff68cf7  .audit-patch-v2/chunk-01' | sha256sum -c -
          echo 'f56a7ee390c240425d41d77d2c6d5573877bff9ba022e4b693f5ca04e73fec8d  .audit-patch-v2/chunk-02' | sha256sum -c -
          echo 'fe61b119f00818184665bc3d1a82dd786da2d262fc62b55ebb569aa29087418f  .audit-patch-v2/chunk-03' | sha256sum -c -
          echo '5ee081cc2336d94418e603ea10d550cc1afcb8ce1cae346dd07059db794919cf  .audit-patch-v2/chunk-04' | sha256sum -c -
          cat .audit-patch-v2/chunk-* > /tmp/audit-v2.patch.b64
          echo 'c9a4f6f8756e5fd7ad6c1afbb4e3390f0336cc70eef18dcc0204bacb7a65e634  /tmp/audit-v2.patch.b64' | sha256sum -c -
          base64 -d /tmp/audit-v2.patch.b64 | gzip -d > /tmp/audit-v2.patch
          echo 'ca732383add18b4ee9951bcf6e4fa5982582d240894f103875f98a3da7f28f7d  /tmp/audit-v2.patch' | sha256sum -c -
          git apply --check /tmp/audit-v2.patch
          git apply /tmp/audit-v2.patch
          git diff --check
          node verify-spec3-contract.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify.mjs
          rm -rf .audit-patch .audit-patch-v2
          rm -f .github/workflows/apply-audit-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Audit and enforce all 30 stage prompt contracts'
          git push origin HEAD:fix/full-30-stage-prompt-contract-audit-20260830
