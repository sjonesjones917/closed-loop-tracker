name: Repair ingestion prompt prerequisites

on:
  push:
    branches:
      - fix/monotonic-reliability-pass-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - name: Establish valid upstream state in ingestion fixtures and remove temporary workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="function savePrompt(p,stage){\n  if(stage===4)prepareStage4Upstream(p);\n  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};"
          new="function savePrompt(p,stage){\n  if(stage>=4)prepareStage4Upstream(p);\n  for(let i=1;i<stage;i++){p.stages[i].status='COMPLETE';p.stages[i].gate={complete:true,blocked:false,reasons:[]};}\n  if(stage>=3)p.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';\n  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};"
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'Expected savePrompt fixture target once; found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          rm -f .github/workflows/repair-ingestion-prompt-prereqs.yml .github/workflows/repair-verify-prerequisites.yml
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node verify.mjs
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A verify.mjs verify-ingestion.mjs .github/workflows
          git commit -m "Align verifier fixtures with prompt prerequisites"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831

