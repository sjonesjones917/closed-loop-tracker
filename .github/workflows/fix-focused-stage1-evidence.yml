name: Fix focused Stage 01 accounting evidence fixture
on:
  push:
    branches:
      - fix/stage01-stage04-closed-accounting-v2
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Fix focused Stage 01 accounting evidence fixture')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add required proposal evidence to focused Stage 01 fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('apply-accounting.mjs')
          s=p.read_text()
          old="records:{},evidence:[],unresolved:[],warnings:[],attachments:[]});"
          new="records:{},evidence:[{temporaryKey:'evidence-1',kind:'WORKFLOW_EVIDENCE',description:'Stage 01 accounting fixture evidence',location:'fixture',content:'The structured intake capture is the proposed semantic preservation of the enumerated human-authority input.'}],unresolved:[],warnings:[],attachments:[]});"
          if s.count(old)!=1:
              raise SystemExit(f'Expected one focused Stage 01 evidence anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          rm -rf ACCOUNTING_PATCH_DIAGNOSTIC .accounting-retry-2 .github/workflows/fix-focused-stage1-evidence.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Correct focused Stage 01 accounting evidence fixture"
          git push origin HEAD:fix/stage01-stage04-closed-accounting-v2
