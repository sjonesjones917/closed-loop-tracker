name: One-time route-scope repair

on:
  push:
    branches:
      - fix/spec-grounded-route-oracle-20260831

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/spec-grounded-route-oracle-20260831
      - name: Apply exact minimal repair
        run: python .repair-route-scope.py
      - name: Verify only intended production files changed
        run: |
          git diff --exit-code -- . ':!prompt-engine.js' ':!workflow-engine.js'
          git diff --check
      - name: Commit exact repair
        run: |
          if git diff --quiet -- prompt-engine.js workflow-engine.js; then
            echo 'No production repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompt-engine.js workflow-engine.js
          git commit -m 'Keep Stage 01 and Stage 04 prompt inputs in current scope'
          git push origin HEAD:fix/spec-grounded-route-oracle-20260831
