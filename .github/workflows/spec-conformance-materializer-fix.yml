name: Fix conformance materializer schema hash metadata
on:
  push:
    branches: [fix/spec-conformance-zero-loss-20260830-0215]
    paths: [.github/workflows/spec-conformance-materializer-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch and retrigger conformance materializer
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='.github/workflows/spec-conformance-materializer.yml';
          let s=fs.readFileSync(path,'utf8');
          const anchor="    EXECUTABLE_SPEC_VERSION:Object.freeze({valueType:VALUE_TYPES.STRING,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),";
          const replacement=anchor+"\n    EXECUTABLE_SPEC_SHA256:Object.freeze({valueType:VALUE_TYPES.STRING,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),";
          if(!s.includes(anchor))throw new Error('Test IR type metadata anchor not found in materializer.');
          if(!s.includes('EXECUTABLE_SPEC_SHA256:Object.freeze'))s=s.replace(anchor,replacement);
          fs.writeFileSync(path,s);
          NODE
          rm .github/workflows/spec-conformance-materializer-fix.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix Test IR hash type metadata in conformance materializer"
          git push origin HEAD
