name: Apply one-shot file-first repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix-file-first-response-20260902'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply digest-guarded repair and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          cat .repair-file-first.mjs.gz.part00 .repair-file-first.mjs.gz.part01 | base64 --decode | gzip --decompress > /tmp/apply-file-first.mjs
          test "$(sha256sum /tmp/apply-file-first.mjs | cut -d' ' -f1)" = "09b336bf76be6ffb971aff49ed9bd2fc39fa2ba93206001b72864354138886ee"
          node /tmp/apply-file-first.mjs
          rm -f .repair-file-first.gz.part00 .repair-file-first.gz.part01 .repair-file-first.mjs.gz.part00 .repair-file-first.mjs.gz.part01 .github/workflows/apply-file-first.yml
          git diff --check
          git config user.name "closed-loop-repair-bot"
          git config user.email "closed-loop-repair-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Make external response transport file-first"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
