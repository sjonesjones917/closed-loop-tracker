name: one-time-stage01-exact-enum-repair
on:
  push:
    branches:
      - repair/stage01-accounting-dispositions-20260903-r1
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/stage01-accounting-dispositions-20260903-r1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: node .repair-stage01-exact-enum.mjs
      - run: node --check workflow-engine.js && node verify-stage01-controlling-dispositions.mjs
      - name: Commit exact enum repair and remove scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce exact Stage 01 disposition literals'
          git push origin HEAD:repair/stage01-accounting-dispositions-20260903-r1
