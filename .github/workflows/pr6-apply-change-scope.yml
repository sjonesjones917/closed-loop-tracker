name: PR6 apply Stage 16 change scope
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep controlled changes current across iteration transition
        run: |
          python .pr6-change-scope.py
          rm -f .pr6-change-scope.py .github/workflows/pr6-apply-change-scope.yml
          node --check workflow-engine.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Keep controlled corrections current across reruns'
          git push
