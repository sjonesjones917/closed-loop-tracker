name: Transient proven ratchet repair

on:
  push:
    branches:
      - 'fix/spec-conformance-20260903-v3'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-conformance-20260903-v3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only the proven responsible-layer changes
        run: python3 .repair-proven-ratchets.py
      - name: Reprove both ratchets against current main
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check workflow-engine.js
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-prompt-semantics.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
      - name: Commit and remove transient scaffolding
        run: |
          set -euo pipefail
          rm .repair-proven-ratchets.py .github/workflows/rebase-proven-ratchets.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add -A
          git commit -m 'Restore proven Stage 01 and prompt-byte conformance ratchets'
          git push origin HEAD:fix/spec-conformance-20260903-v3
