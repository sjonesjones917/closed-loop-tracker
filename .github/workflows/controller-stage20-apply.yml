name: Apply controller Stage 20 corrected-iteration repair

on:
  push:
    branches: [controller-stage20-corrected-iteration-20260904c]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage20-corrected-iteration-20260904c
          fetch-depth: 0
      - name: Apply Stage 20 repair
        run: node verification/apply-stage20-corrected-iteration-repair.mjs
      - name: Test invalid and repaired corrected-iteration paths
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check verify-corrected-iteration.mjs
          node verify-root-cause-correction.mjs
          node verify-corrected-iteration.mjs
      - name: Commit repaired implementation and remove applicator
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js verify-spec-residual-closure.mjs verify-corrected-iteration.mjs
          git rm verification/apply-stage20-corrected-iteration-repair.mjs .github/workflows/controller-stage20-apply.yml
          git commit -m "Stage 20: enforce corrected iteration lineage and closure"
          git push origin HEAD:controller-stage20-corrected-iteration-20260904c
