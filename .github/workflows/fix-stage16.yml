name: Final clean v3 source acceptance
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths:
      - .github/workflows/fix-stage16.yml
      - test-runtime.js
      - workbook.js
      - prompt-engine.js
      - workflow-engine.js
      - workflow-schema.js
      - response-ingestion.js
      - project-store.js
      - app-core.js
      - index.html
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: closed-loop-v3-final-clean
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic final source corrections
        run: |
          node - <<'NODE'
          const fs=require('fs'),c=require('crypto');
          let w=fs.readFileSync('workbook.js','utf8').replace("'REVISE THE RESPONSIBLE LAYER'","'CORRECT THE ROOT CAUSE'");
          fs.writeFileSync('workbook.js',w);
          let r=fs.readFileSync('test-runtime.js','utf8').replace('approximate comparison requires a positive absoluteTolerance or relativeTolerance.','approximate comparison requires a positive tolerance: absoluteTolerance or relativeTolerance.');
          fs.writeFileSync('test-runtime.js',r);
          let h=fs.readFileSync('index.html','utf8');
          const csp=`<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'sha256-YgkAI8+6MdirEbh6wT7XpR2zE/QVMj5bMSNrm4/WvUc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">`;
          h=h.replace(/<meta http-equiv="Content-Security-Policy"[^\n]*>/,csp);
          const files=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=f=>{const b=fs.readFileSync(f);return c.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(f=>`${f}:${blob(f)}\n`).join('');
          const token='runtime-'+c.createHash('sha256').update(manifest).digest('hex').slice(0,16);
          h=h.replace(/v=[^\"]+/g,'v='+token);
          fs.writeFileSync('index.html',h);
          if(fs.existsSync('.v3-final-trigger'))fs.unlinkSync('.v3-final-trigger');
          NODE
      - name: Syntax
        run: for file in *.js *.mjs; do node --check "$file"; done
      - name: Schema ownership and migration
        run: |
          node verify.mjs
          node verify-v3-migration.mjs
      - name: Test IR validation security limits and runtime
        run: |
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
      - name: Raw-first ingestion and workflow gates
        run: |
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Prompt isolation subject neutrality and semantic proof
        run: |
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
      - name: Definition of done and project lifecycle
        run: |
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove one-time finalizer and commit accepted source
        run: |
          rm -f .github/workflows/fix-stage16.yml
          git config user.name closed-loop-finalizer
          git config user.email closed-loop-finalizer@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize clean closed-loop v3 source after complete local acceptance'
          git push origin HEAD:implementation/closed-loop-v3
