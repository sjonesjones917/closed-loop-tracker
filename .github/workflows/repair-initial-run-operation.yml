name: One-time initial-run operation repair

on:
  push:
    branches: [codex/exact-stage-operation-registry]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/exact-stage-operation-registry
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Make the shared repeated-iteration evaluator consume EXECUTE_RUN at Stage 11
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='workflow-engine.js';
          let t=fs.readFileSync(p,'utf8');
          const old="requiredRunOperation=mode==='INITIAL'?'COMPLETE':'EXECUTE_RUN'";
          const replacement="requiredRunOperation='EXECUTE_RUN'";
          if(!t.includes(old))throw new Error('Expected legacy Stage 11 COMPLETE run-operation selection not found.');
          t=t.replace(old,replacement);
          fs.writeFileSync(p,t);
          NODE
          node --check workflow-engine.js
          node verify-stage-operation-registry.mjs
      - name: Remove one-time scaffolding and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-initial-run-operation.yml
          git add workflow-engine.js verify-full-cycle.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Use EXECUTE_RUN for initial repeated-iteration evidence"
          git push origin HEAD:codex/exact-stage-operation-registry
