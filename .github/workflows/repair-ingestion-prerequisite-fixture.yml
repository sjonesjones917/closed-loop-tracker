name: Repair ingestion prerequisite fixture

on:
  push:
    branches:
      - fix/monotonic-zero-loss-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the minimal fixture correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('verify-ingestion.mjs')
          text = path.read_text(encoding='utf-8')

          enum_marker = "if(name==='TEST_TYPE')return 'DETERMINISTIC';"
          enum_needle = "function safeValue(name){\n  if(/ARTIFACT_REQUIREMENTS/.test(name))return 'NONE';"
          enum_replacement = "function safeValue(name){\n  if(name==='TEST_TYPE')return 'DETERMINISTIC';\n  if(name==='EXECUTION_MODE')return 'EXTERNAL_AGENT_TOOL';\n  if(/ARTIFACT_REQUIREMENTS/.test(name))return 'NONE';"
          if enum_marker not in text:
              if enum_needle not in text:
                  raise SystemExit('Expected fixture value boundary not found; no change made.')
              text = text.replace(enum_needle, enum_replacement, 1)

          helper_marker = 'function preparePromptPrerequisites(p,stage)'
          save_needle = "function savePrompt(p,stage){\n  if(stage===4)prepareStage4Upstream(p);"
          save_replacement = """function preparePromptPrerequisites(p,stage){
            if(stage<=1)return p;
            const intake=prompts.buildPromptRecord(1,p).contextManifest.intakeCoverageManifest;
            p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||('Captured '+u.label),statementClass:'FACT'}]}))});
            p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true,blocked:false,reasons:[]};
            if(stage>=3){p.stages[2].status='COMPLETE';p.stages[2].gate={complete:true,blocked:false,reasons:[]};p.stages[2].agentData.SOURCE_APPLICABILITY_DETERMINATION='NO_APPLICABLE_EXTERNAL_SOURCE';}
            if(stage>=4){p.stages[3].status='COMPLETE';p.stages[3].gate={complete:true,blocked:false,reasons:[]};}
            for(let prior=4;prior<stage;prior++){p.stages[prior].status='COMPLETE';p.stages[prior].gate={complete:true,blocked:false,reasons:[]};}
            return p;
          }
          function savePrompt(p,stage){
            preparePromptPrerequisites(p,stage);
            if(stage===4)prepareStage4Upstream(p);"""
          if helper_marker not in text:
              if save_needle not in text:
                  raise SystemExit('Expected savePrompt fixture boundary not found; no change made.')
              text = text.replace(save_needle, save_replacement, 1)

          next_needle = "if(stage<30){const nextStage=stage+1;if(nextStage===4)prepareStage4Upstream(reloaded);"
          next_replacement = "if(stage<30){const nextStage=stage+1;preparePromptPrerequisites(reloaded,nextStage);if(nextStage===4)prepareStage4Upstream(reloaded);"
          if next_replacement not in text:
              if next_needle not in text:
                  raise SystemExit('Expected downstream prompt fixture boundary not found; no change made.')
              text = text.replace(next_needle, next_replacement, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/repair-ingestion-prerequisite-fixture.yml').unlink()
          PY
      - name: Prove the corrected fixture and affected downstream suites
        shell: bash
        run: |
          set -euo pipefail
          node --check verify-ingestion.mjs
          node verify-ingestion.mjs
          node verify.mjs
      - name: Commit the accepted correction and remove this one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-ingestion.mjs .github/workflows/repair-ingestion-prerequisite-fixture.yml
          git diff --cached --check
          git commit -m "Repair ingestion fixture prerequisites [repair-applied]"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
