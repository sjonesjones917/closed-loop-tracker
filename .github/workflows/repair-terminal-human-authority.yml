name: One-time terminal human-authority repair

on:
  push:
    branches:
      - fix/terminal-human-authority-20260903

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/terminal-human-authority-20260903
          fetch-depth: 0
      - name: Wire regression into permanent verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-complete.mjs')
          s=p.read_text()
          marker="await import('./verify-terminal-human-authority.mjs');"
          if marker not in s:
              s += "\n"+marker+"\n"
              p.write_text(s)
          PY
      - name: Prove permanent suite entry point
        run: node verify-complete.mjs
      - name: Commit permanent verifier wiring
        shell: bash
        run: |
          git config user.name "closed-loop-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add verify-complete.mjs
          git commit -m "Run terminal authority regression in complete suite"
          git push origin HEAD:fix/terminal-human-authority-20260903
