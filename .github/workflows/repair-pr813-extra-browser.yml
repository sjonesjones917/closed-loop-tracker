name: Repair response-profile extra browser fixture

on:
  push:
    branches:
      - repair/response-envelope-binding-20260903
    paths:
      - .github/workflows/repair-pr813-extra-browser.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/response-envelope-binding-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct and replay the extra browser response fixture
        env:
          BROWSER: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('verify-browser-extra.mjs')
          source = path.read_text(encoding='utf-8')
          envelope_old = "const envelope={schema:'closed-loop-stage-response/3',jobId:'JOB-20260823144121'"
          envelope_new = "const envelope={schema:'closed-loop-stage-response/3',contractProfileId:retained.job.CONTRACT_PROFILE_ID,jobId:'JOB-20260823144121'"
          if source.count(envelope_old) != 1:
              raise SystemExit(f'Expected one legacy extra-browser response envelope, found {source.count(envelope_old)}.')
          source = source.replace(envelope_old, envelope_new, 1)
          wording_old = "'Continue the external conversation'"
          wording_new = "'Continue talking to the agent. Do not import a final response file yet.'"
          if source.count(wording_old) != 1:
              raise SystemExit(f'Expected one stale conversation-mode oracle, found {source.count(wording_old)}.')
          source = source.replace(wording_old, wording_new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          node --check verify-browser-extra.mjs
          node verify-response-contract-profile.mjs
          if [ ! -x "$BROWSER" ]; then
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
            export BROWSER
          fi
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove scaffolding and commit the complete fixture repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr813-extra-browser.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-browser-extra.mjs .github/workflows/repair-pr813-extra-browser.yml
          git diff --cached --check
          git commit -m "Fix response-profile extra browser fixture"
          git push origin HEAD:repair/response-envelope-binding-20260903
