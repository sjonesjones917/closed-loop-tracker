name: Temporary Stage 01 practical intake repair
on:
  push:
    branches: [fix/stage01-practical-intake-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-practical-intake-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply responsible-layer repair
        run: |
          python .stage01-practical-intake-repair.py
          python <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          s=p.read_text()
          if 'inspection state' not in s:
              raise SystemExit('Stage 01 future-stage phrase not found')
          p.write_text(s.replace('inspection state','formal inspection status',1))

          p=Path('verify-prompt-semantics.mjs')
          s=p.read_text()
          replacements={
            "!/requested filing artifacts/.test(r.prompt)":"!/supplied invention disclosure/.test(r.prompt)",
            "const required1=[/job definition and clarification only/i,/opaque authorized inputs/i,/later source\\/material stage owns discovery, inventory, provenance, inspection, authority, currency, supersession, applicability, and conflicts/i];":"const required1=[/job definition and clarification only/i,/authorized human job input/i,/limited intake inspection is Stage 01 job-definition work/i,/do not classify, validate, rank, establish provenance for, or determine authority\\/currency\\/conflicts among supplied materials here/i];"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('stale Stage 01 semantic assertion not found: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const bytes=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          const html=fs.readFileSync('index.html','utf8').replace(/runtime-[0-9a-f]{16}/g,token);
          fs.writeFileSync('index.html',html);
          console.log(token);
          NODE
      - name: Verify prompt behavior and complete deterministic path
        run: |
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit permanent source only
        run: |
          git rm .stage01-practical-intake-repair.py .github/workflows/stage01-practical-intake-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js verify-prompt-semantics.mjs index.html
          git commit -m "Make Stage 01 practical and machine-contract exact"
          git push origin HEAD:fix/stage01-practical-intake-20260826
