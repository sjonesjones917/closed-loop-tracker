name: One-time browser v3 regression repair
'on':
  push:
    branches: [fix/stage06-authoring-contract-final]
    paths: ['.github/workflows/repair-browser-v3.yml']
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/stage06-authoring-contract-final, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Update browser assertions to current v3 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-browser.mjs')
          s=p.read_text()
          old="retained.stages['1'].status==='COMPLETE'&&retained.job.CURRENT_STAGE==='STAGE 02'"
          new="retained.stages['1'].status==='COMPLETE'&&Number(retained.job.CURRENT_STAGE)===2"
          if old not in s: raise SystemExit('retained Stage 01/02 assertion anchor missing')
          s=s.replace(old,new,1)
          count=s.count('closed-loop-stage-response/2')
          if count!=2: raise SystemExit(f'expected two obsolete response /2 browser tokens, found {count}')
          s=s.replace('closed-loop-stage-response/2','closed-loop-stage-response/3')
          p.write_text(s)
          PY
          node --check verify-browser.mjs
          git rm .github/workflows/repair-browser-v3.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-browser.mjs
          git commit -m 'Align browser regression with v3 retained state'
          git push origin HEAD:fix/stage06-authoring-contract-final
