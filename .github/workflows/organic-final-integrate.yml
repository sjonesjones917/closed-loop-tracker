name: Final runtime and prompt integration
on:
  push:
    branches: [practical-100/organic-self-spec-final]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 100}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply audited prompt closure without stale ingestion
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          subprocess.run(['git','fetch','origin','practical-100/final-organic-prompt-closure','practical-100/organic-self-spec-acceptance','--depth=100'],check=True)
          current_ingestion=subprocess.check_output(['git','show','d0aae2aef3fb7675962f2747f75b0051ba4fe427:response-ingestion.js'],text=True)
          y=subprocess.check_output(['git','show','4f0725249442c9482946349a885b44b75187da48:.github/workflows/final-organic-prompt-closure.yml'],text=True)
          def block(name):
            start=y.index('      - name: '+name)
            run=y.index('        run: |',start)+len('        run: |\n')
            end=y.find('\n      - name:',run)
            if end<0:end=len(y)
            return '\n'.join(line[10:] if line.startswith('          ') else line for line in y[run:end].splitlines())+'\n'
          for i,name in enumerate(['Patch existing responsible layers only','Strengthen permanent semantic verifier'],1):
            f=Path(f'/tmp/audited-{i}.py');f.write_text(block(name));subprocess.run(['python',str(f)],check=True)
          Path('response-ingestion.js').write_text(current_ingestion)
          p=Path('build-test-project.mjs');s=p.read_text().replace("'genuinely independent external governing sources','Research only the legitimate Stage 02 external governing source set'","'independent external source inventory','Research only the current accepted Stage 02 independent external source set'");p.write_text(s)
          p=Path('verify.mjs');s=p.read_text().replace("record.prompt.includes('genuinely independent external governing sources')","record.prompt.includes('independent external source inventory')").replace("record.prompt.includes('Research only the legitimate Stage 02 external governing source set')","record.prompt.includes('Research only the current accepted Stage 02 independent external source set')");p.write_text(s)
      - name: Apply exact runtime closure
        run: python .final_patch.py
      - name: Keep regenerated prompt versions current and match scoped feedback safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('prompt-engine.js');s=p.read_text()
          old="function scopeFor(stage,state,overrides={}){const j=state?.job||{},has=key=>Object.prototype.hasOwnProperty.call(overrides,key),pick=(key,fallback)=>has(key)?overrides[key]:fallback;return {projectRevision:pick('projectRevision',Number(state?.revision||0)),inputVersion:pick('inputVersion',j.CURRENT_INPUT_VERSION||null),sourceSetVersion:pick('sourceSetVersion',j.CURRENT_SOURCE_SET_VERSION||null),requirementsVersion:pick('requirementsVersion',j.CURRENT_REQUIREMENTS_VERSION||null),testSuiteVersion:pick('testSuiteVersion',j.CURRENT_TEST_SUITE_VERSION||null),instructionVersion:pick('instructionVersion',j.CURRENT_INSTRUCTION_VERSION||null),iterationId:pick('iterationId',j.CURRENT_ITERATION||null),candidateId:pick('candidateId',state?.projectData?.candidateFreezes?.filter(x=>x?.active!==false&&!x?.invalidatedBy).at(-1)?.id||null),runId:pick('runId',null),contextId:pick('contextId',null),baselineId:pick('baselineId',j.CURRENT_BASELINE_ID&&!['NONE','NOT APPLICABLE'].includes(String(j.CURRENT_BASELINE_ID))?j.CURRENT_BASELINE_ID:null),productId:pick('productId',j.CURRENT_PRODUCT_ID&&!['NONE','NOT APPLICABLE'].includes(String(j.CURRENT_PRODUCT_ID))?j.CURRENT_PRODUCT_ID:null)};}"
          new="function scopeFor(stage,state,overrides={}){const j=state?.job||{},has=key=>Object.prototype.hasOwnProperty.call(overrides,key),pick=(key,fallback)=>has(key)?overrides[key]:fallback;return {projectRevision:Number(state?.revision||0),inputVersion:j.CURRENT_INPUT_VERSION||null,sourceSetVersion:j.CURRENT_SOURCE_SET_VERSION||null,requirementsVersion:j.CURRENT_REQUIREMENTS_VERSION||null,testSuiteVersion:j.CURRENT_TEST_SUITE_VERSION||null,instructionVersion:j.CURRENT_INSTRUCTION_VERSION||null,iterationId:pick('iterationId',j.CURRENT_ITERATION||null),candidateId:pick('candidateId',state?.projectData?.candidateFreezes?.filter(x=>x?.active!==false&&!x?.invalidatedBy).at(-1)?.id||null),runId:pick('runId',null),contextId:pick('contextId',null),baselineId:pick('baselineId',j.CURRENT_BASELINE_ID&&!['NONE','NOT APPLICABLE'].includes(String(j.CURRENT_BASELINE_ID))?j.CURRENT_BASELINE_ID:null),productId:pick('productId',j.CURRENT_PRODUCT_ID&&!['NONE','NOT APPLICABLE'].includes(String(j.CURRENT_PRODUCT_ID))?j.CURRENT_PRODUCT_ID:null)};}"
          if s.count(old)!=1: raise SystemExit('scopeFor generated form not found exactly once')
          s=s.replace(old,new,1)
          old_scope="const samePromptScope=(a,b={})=>['iterationId','candidateId','runId','contextId','baselineId','productId'].every(key=>String(a?.[key]??'')===String(b?.[key]??''));"
          new_scope="const samePromptScope=(declared,current={})=>['iterationId','candidateId','runId','contextId','baselineId','productId'].every(key=>{const value=declared?.[key];return value===undefined||value===null||value===''||String(value)===String(current?.[key]??'');});"
          if s.count(old_scope)!=1: raise SystemExit('samePromptScope form not found exactly once')
          p.write_text(s.replace(old_scope,new_scope,1))
      - name: Run strict verifier and capture exact exit
        id: verify
        continue-on-error: true
        run: |
          set +e
          bash -o pipefail -c 'node --check prompt-engine.js && node --check workflow-schema.js && node --check workflow-engine.js && node --check response-ingestion.js && node --check app-core.js && node build-test-project.mjs && node verify.mjs && node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs && node verify-prompt-semantics.mjs' > .integration-test.log 2>&1
          code=$?
          echo "$code" > .integration-exit
          cat .integration-test.log
          exit $code
      - name: Persist exact result
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$(cat .integration-exit)" = 0 ]; then
            rm -f .final_patch.py .integration-test.log .integration-exit .github/workflows/organic-final-integrate.yml
            git add -A
            git commit -m "Close prompt, recovery, operation, and evidence workflow gaps"
          else
            git add .integration-test.log .integration-exit
            git commit -m "Capture strict final integration result" || true
          fi
          git push origin HEAD:practical-100/organic-self-spec-final
