name: PR6 source export
on:
  push:
    branches: [practical-100/pr6-acceptance-proof]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-completion-2
      - name: Package target branch source
        run: |
          rm -rf .git
          zip -qr source.zip . -x source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pr76-source
          path: source.zip
          if-no-files-found: error
          retention-days: 1
