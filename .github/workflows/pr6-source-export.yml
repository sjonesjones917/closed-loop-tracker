name: PR6 verified semantic repair
on:
  push:
    branches: [practical-100/pr6-acceptance-proof]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-completion-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply the verified minimum semantic corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('workbook.js'); s=p.read_text()
          s=s.replace('''    "agent": [\n      "REGRESSION_TEST_SUCCESS",\n      "RETURN_STAGE_FOR_EACH_FAILURE"\n    ],\n    "application": [\n      "ITERATION_ID",''','''    "agent": [\n      "RETURN_STAGE_FOR_EACH_FAILURE"\n    ],\n    "application": [\n      "ITERATION_ID",\n      "REGRESSION_TEST_SUCCESS",''')
          s=s.replace('''    "agent": [\n      "SUPPORTING_CONFIRMATION_ITERATION",\n      "APPROVED_VERSIONS",\n      "BASELINE_PACKAGE_SEPARATED_FROM_WORKING_FILES"\n    ],\n    "application": [\n      "BASELINE_ID",''','''    "agent": [\n      "BASELINE_PACKAGE_SEPARATED_FROM_WORKING_FILES"\n    ],\n    "application": [\n      "BASELINE_ID",\n      "SUPPORTING_CONFIRMATION_ITERATION",\n      "APPROVED_VERSIONS",''')
          s=s.replace('''    "agent": [\n      "RELEASE_GATE_STATE"\n    ],\n    "application": [\n      "HASH_REVIEW_ID",''','''    "agent": [],\n    "application": [\n      "HASH_REVIEW_ID",\n      "RELEASE_GATE_STATE",''')
          p.write_text(s)

          p=Path('workflow-engine.js'); s=p.read_text()
          start=s.index('function freezeCandidate('); end=s.index('\nfunction freezeBaseline(',start)
          replacement='''function freezeCandidate(project,{stage=project.activeStage||10,artifactIds=[],operatorLabel='HUMAN_OPERATOR',purpose='TEST_CANDIDATE',toolConfiguration='CURRENT AUTHORIZED CONFIGURATION',settings='CURRENT AUTHORIZED SETTINGS',permissions='CURRENT AUTHORIZED PERMISSIONS',limitations='RECORDED LIMITATIONS',roleDistribution='WORKFLOW ROLE MAP',batchChangeRule='ANY MATERIAL CHANGE REQUIRES A NEW CANDIDATE'}={}){\n  ensureShape(project);const freezeStage=Number(stage);if(![10,17,19].includes(freezeStage))throw new Error('Candidate freezes are allowed only at Stages 10, 17, and 19.');const artifacts=selectedArtifacts(project,artifactIds);if(!artifacts.length)throw new Error('At least one verified artifact is required to freeze a candidate.');const manifest=artifacts.map(a=>({artifactId:recordId(a,'artifacts'),filename:recordValue(a,'FILENAME'),byteSize:Number(recordValue(a,'BYTE_SIZE')),sha256:recordValue(a,'SHA256'),storageReference:recordValue(a,'STORAGE_REFERENCE')})),componentHashes=Object.fromEntries(manifest.map(a=>[a.artifactId,a.sha256])),createdAt=now(),previousIteration=latestIteration(project,[10,17,19]),previousCandidate=records(project,'candidateFreezes').at(-1);let candidateId,candidate;if(freezeStage===19){if(!previousCandidate)throw new Error('Stage 19 unchanged confirmation requires an existing candidate.');const priorManifest=recordValue(previousCandidate,'COMPONENT_MANIFEST')||[];if(hash.sha256Value(priorManifest)!==hash.sha256Value(manifest))throw new Error('Stage 19 requires the exact unchanged candidate artifact identity.');candidateId=recordId(previousCandidate,'candidateFreezes');candidate=previousCandidate;}else candidateId=allocateId(project,'candidateFreezes');const iterationId=allocateId(project,'iterations');\n  const frozenScope={...currentScope(project),iterationId,candidateId};const iterationFields={ITERATION_ID:iterationId,CANDIDATE_ID:candidateId,PREVIOUS_ITERATION_ID:recordId(previousIteration,'iterations')||'',CHANGESET_ID:recordId(records(project,'changes').at(-1),'changes')||'',PURPOSE:purpose,STATUS:'FROZEN',LINEAGE:hash.sha256Value(manifest),EVIDENCE:`Application freeze from ${manifest.length} verified artifact(s).`};const iteration={id:iterationId,stage:freezeStage,createdAt,active:true,scope:frozenScope,fields:iterationFields,...iterationFields,source:'APPLICATION_DERIVATION'};iteration.contentSha256=hash.contentRecordSha256(iteration,'ITERATION_ID');iteration.recordSha256=hash.recordSha256(iteration);iteration.sha256=iteration.recordSha256;project.projectData.iterations.push(iteration);\n  if(freezeStage!==19){const candidateFields={CANDIDATE_ID:candidateId,ITERATION_ID:iterationId,COMPONENT_MANIFEST:manifest,COMPONENT_VERSIONS:Object.fromEntries(manifest.map(a=>[a.artifactId,'APPLICATION-CONTROLLED'])),COMPONENT_HASHES:componentHashes,ROLE_DISTRIBUTION:roleDistribution,IMMUTABLE_LOCATIONS:manifest.map(a=>a.storageReference),TOOL_CONFIGURATION:toolConfiguration,SETTINGS:settings,PERMISSIONS:permissions,LIMITATIONS:limitations,BATCH_CHANGE_RULE:batchChangeRule,STATUS:'FROZEN',EVIDENCE:hash.sha256Value({manifest,operatorLabel})};candidate={id:candidateId,stage:freezeStage,createdAt,active:true,scope:frozenScope,fields:candidateFields,...candidateFields,source:'APPLICATION_DERIVATION'};candidate.contentSha256=hash.contentRecordSha256(candidate,'CANDIDATE_ID');candidate.recordSha256=hash.recordSha256(candidate);candidate.sha256=candidate.recordSha256;project.projectData.candidateFreezes.push(candidate);}\n  project.job.CURRENT_ITERATION=iterationId;addHistory(project,'CANDIDATE_FROZEN',{stage:freezeStage,iterationId,candidateId,artifactIds:manifest.map(a=>a.artifactId),unchangedConfirmation:freezeStage===19,operatorLabel,identityAssurance:'SELF_ASSERTED'});recalculate(project);return {iteration,candidate};\n}'''
          s=s[:start]+replacement+s[end:]; p.write_text(s)

          p=Path('verify-full-cycle.mjs'); s=p.read_text()
          s=s.replace("data(18,{stageData:{REGRESSION_TEST_SUCCESS:'1',RETURN_STAGE_FOR_EACH_FAILURE:'NONE'}});", "data(18,{stageData:{RETURN_STAGE_FOR_EACH_FAILURE:'NONE'}});")
          s=s.replace("data(20,{stageData:{SUPPORTING_CONFIRMATION_ITERATION:iter19,APPROVED_VERSIONS:'CURRENT',BASELINE_PACKAGE_SEPARATED_FROM_WORKING_FILES:'TRUE'}});", "data(20,{stageData:{BASELINE_PACKAGE_SEPARATED_FROM_WORKING_FILES:'TRUE'}});")
          old="const iter19=rid('iterations'),cand19=rid('candidateFreezes');"
          new="const iter19=rid('iterations'),cand19=engine.recordValue(engine.records(p,'iterations',{stage:19}).at(-1),'CANDIDATE_ID');assert(cand19===cand17,'Stage 19 must reuse the exact unchanged candidate identity.');"
          if old in s:s=s.replace(old,new)
          elif "Stage 19 must reuse the exact unchanged candidate identity." not in s:raise SystemExit('Stage 19 lifecycle fixture location not found')
          s=s.replace("const productSha=hash.sha256Text('product-bytes');", "const productSha=hash.sha256Text('released-product-bytes');")
          s=s.replace("data(28,{stageData:{RELEASE_GATE_STATE:'ACCEPTED'}});engine.verifyArtifactIdentity", "engine.verifyArtifactIdentity")
          p.write_text(s)

          p=Path('verify-ingestion.mjs'); s=p.read_text()
          s=s.replace("const collection=contract.allowedCollections.find(name=>name!=='blockers')||contract.allowedCollections[0];\n    if(!collection)throw new Error(`Stage ${stage} has no ingestible response surface.`);", "const collection=contract.allowedCollections.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||contract.allowedCollections.find(name=>schema.recordAgentFields(name).length);\n    if(!collection)return null;")
          old="""  const envelope=validEnvelope(p,stage,promptRecord);\n  const prepared=ingestion.prepare(p,{stage,text:JSON.stringify(envelope),promptRecord});\n  if(!prepared.validation.valid)throw new Error(`Stage ${stage} valid response rejected: ${JSON.stringify(prepared.validation.issues)}`);"""
          new="""  const envelope=validEnvelope(p,stage,promptRecord);\n  if(!envelope){\n    const prohibited={schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage,operation:promptRecord.operation,promptIdentity:{instructionId:promptRecord.instructionId,bodySha256:promptRecord.bodySha256,contractSha256:promptRecord.contractSha256,contextSignature:promptRecord.contextSignature},scope:promptRecord.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{},records:{},evidence:[],unresolved:[],warnings:[],attachments:[]};\n    const rejected=ingestion.prepare(p,{stage,text:JSON.stringify(prohibited),promptRecord});\n    if(rejected.validation.valid)throw new Error(`Stage ${stage} application-only contract accepted an empty agent DATA_PROPOSAL.`);\n    allStages.push({stage,applicationControlled:true});\n    continue;\n  }\n  const prepared=ingestion.prepare(p,{stage,text:JSON.stringify(envelope),promptRecord});\n  if(!prepared.validation.valid)throw new Error(`Stage ${stage} valid response rejected: ${JSON.stringify(prepared.validation.issues)}`);"""
          if old in s:s=s.replace(old,new)
          elif 'application-only contract accepted' not in s:raise SystemExit('ingestion loop location not found')
          p.write_text(s)
          PY
      - name: Verify deterministic and browser acceptance before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check workflow-engine.js
          node --check verify-ingestion.mjs
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/pr6-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only the verified PR6 changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workbook.js workflow-engine.js verify-ingestion.mjs verify-full-cycle.mjs
          git diff --cached --quiet && exit 0
          git commit -m "PR 6: enforce application authority and unchanged confirmation identity"
          git push origin HEAD:practical-100/pr6-completion-2
