name: Normalize retained Operation 01 proof

on:
  push:
    branches: [finish/live-human-gate-20260830]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Remove the nonexistent duplicate artifact dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('verify.mjs')
          s=p.read_text()
          s=s.replace(",'AUTHORIZED_OPERATION_01.txt'",'',1)
          old="""const operation01=fs.readFileSync('AUTHORIZED_OPERATION_01.txt','utf8').trim();
          if(retained.generatedOutputs?.[0]?.output!==operation01||retained.stageRecords?.['1']?.output!==operation01)throw new Error('Authorized Operation 01 output was not preserved exactly.');"""
          new="""const operation01=String(retained.stageRecords?.['1']?.output||'');
          if(!operation01||retained.generatedOutputs?.[0]?.output!==operation01)throw new Error('Authorized Operation 01 output was not preserved exactly inside the canonical retained project.');"""
          if old not in s:
              raise SystemExit('verify.mjs retained output block was not found')
          p.write_text(s.replace(old,new,1))

          p=Path('build-test-project.mjs')
          s=p.read_text()
          if ",'AUTHORIZED_OPERATION_01.txt'" not in s:
              raise SystemExit('build-test-project.mjs duplicate artifact dependency was not found')
          p.write_text(s.replace(",'AUTHORIZED_OPERATION_01.txt'",'',1))

          p=Path('verify-live.mjs')
          s=p.read_text()
          p.write_text(s.replace(",'AUTHORIZED_OPERATION_01.txt'",'',1))

          p=Path('.github/workflows/pages.yml')
          s=p.read_text()
          p.write_text(s.replace(' TEST_PROJECT.json AUTHORIZED_OPERATION_01.txt .nojekyll',' TEST_PROJECT.json .nojekyll',1))
          PY
          rm -f .github/workflows/normalize-retained-operation-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify.mjs build-test-project.mjs verify-live.mjs .github/workflows
          git commit -m "Use canonical retained Operation 01 output without duplicate file"
          git push origin HEAD:finish/live-human-gate-20260830
