name: Stage 01 self-staleness reproduction

on:
  push:
    branches: [fix/stage01-atomic-intake-self-staleness-20260909]
    paths:
      - verify-human-authority-roundtrip.mjs
      - .github/workflows/stage01-self-staleness-repro.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Reproduce Stage 01 atomic-confirmation self-staleness
        run: node verify-human-authority-roundtrip.mjs
