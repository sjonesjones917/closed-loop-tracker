name: Apply minimum deterministic semantic closure
'on':
  push:
    branches: [practical-100/final-semantic-closure-main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-semantic-closure-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact deterministic corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1))

          p=Path('workflow-engine.js'); text=p.read_text()
          old="""function mandatoryRequirements(project){
  return records(project,'requirements').filter(record=>{
    const value=upper(recordValue(record,'MANDATORY_OPTIONAL_STATUS')||recordValue(record,'MANDATORY')||'MANDATORY');
    return value!=='OPTIONAL'&&value!=='FALSE'&&value!=='NO';
  });
}"""
          new="""function mandatoryRequirements(project,scopeRule=null){
  const source=scopeRule?recordsForScope(project,'requirements',scopeRule):records(project,'requirements');
  return source.filter(record=>{
    const value=upper(recordValue(record,'MANDATORY_OPTIONAL_STATUS')||recordValue(record,'MANDATORY')||'MANDATORY');
    return value!=='OPTIONAL'&&value!=='FALSE'&&value!=='NO';
  });
}"""
          if text.count(old)!=1: raise SystemExit('mandatoryRequirements block mismatch')
          text=text.replace(old,new,1)

          old="""function unresolvedMaterialDefects(project){
  return confirmedDefects(project).filter(record=>{
    const severity=upper(recordValue(record,'SEVERITY'));
    const status=upper(recordValue(record,'STATUS'));
    return ['CRITICAL','MAJOR'].includes(severity)&&!['CLOSED','CLOSED VERIFIED','CLOSED_VERIFIED','RESOLVED','CORRECTED AND VERIFIED','RETIRED'].includes(status);
  });
}"""
          new="""function defectResolvedByRegression(project,defect){
  const defectId=recordId(defect,'defects');
  const regressions=records(project,'regressions').filter(record=>String(recordValue(record,'DEFECT_ID')||record.relationships?.DEFECT_ID||'')===defectId&&upper(recordValue(record,'ACTIVE_RETIRED_STATE')||'ACTIVE')!=='RETIRED');
  if(!regressions.length)return false;
  return regressions.every(regression=>{
    const regId=recordId(regression,'regressions');
    const executions=records(project,'regressionExecutions').filter(record=>String(recordValue(record,'REG_ID')||record.relationships?.REG_ID||'')===regId);
    const latest=executions.at(-1);
    return Boolean(latest)&&upper(recordValue(latest,'PHASE'))!=='PRE_CORRECTION'&&['SATISFIED','SUCCESS','PASSED'].includes(upper(recordValue(latest,'RESULT')));
  });
}
function unresolvedMaterialDefects(project){
  return confirmedDefects(project).filter(record=>{
    const severity=upper(recordValue(record,'SEVERITY'));
    const status=upper(recordValue(record,'STATUS'));
    return ['CRITICAL','MAJOR'].includes(severity)&&!['CLOSED','CLOSED VERIFIED','CLOSED_VERIFIED','RESOLVED','CORRECTED AND VERIFIED','RETIRED'].includes(status)&&!defectResolvedByRegression(project,record);
  });
}"""
          if text.count(old)!=1: raise SystemExit('unresolvedMaterialDefects block mismatch')
          text=text.replace(old,new,1)

          start=text.index('function scopeMatches(')
          end=text.index('function deriveMandatoryTestCoverage',start)
          replacement=r'''function scopeMatches(record,scopeRule={}){const rs=record?.scope||{};for(const [key,value] of Object.entries(rs)){if(value===undefined||value===null)continue;if(Object.prototype.hasOwnProperty.call(scopeRule,key)&&(scopeRule[key]??null)!==value)return false;}return true;}
function recordsForScope(project,collection,scopeRule={}){const applicable=Object.fromEntries(Object.entries(scopeRule||{}).filter(([,v])=>v!==undefined&&v!==null));return records(project,collection).filter(record=>record.scope&&Object.keys(record.scope).length>0&&scopeMatches(record,applicable));}
function recordsForCurrentScope(project,collection,scopeRule={}){return recordsForScope(project,collection,{...currentScope(project),...scopeRule});}
function scopeForIteration(project,iterationId){const id=String(iterationId||'');const iteration=records(project,'iterations').find(record=>recordId(record,'iterations')===id);if(!iteration)return {iterationId:id||null};const candidateId=String(recordValue(iteration,'CANDIDATE_ID')||iteration.relationships?.CANDIDATE_ID||iteration.scope?.candidateId||'');return {...clone(iteration.scope||{}),iterationId:id,candidateId:candidateId||null};}
function recordsForIteration(project,collection,iterationId){return recordsForScope(project,collection,scopeForIteration(project,iterationId));}
function applicableTests(project,requirement,scopeRule=null){const req=requirementId(requirement),source=scopeRule?recordsForScope(project,'tests',scopeRule):recordsForCurrentScope(project,'tests');return source.filter(test=>testRequirementId(test)===req&&!['RETIRED','BLOCKED','NOT READY'].includes(upper(recordValue(test,'STATUS')||'READY')));}
function verificationMatrix(project,iterationId){
  const scope=scopeForIteration(project,iterationId),requirements=mandatoryRequirements(project,scope);
  const runs=recordsForIteration(project,'runs',iterationId).filter(run=>runIterationId(run)===String(iterationId||''));
  const verification=recordsForIteration(project,'verification',iterationId),expected=[];
  for(const req of requirements)for(const test of applicableTests(project,req,scope))for(const run of runs)expected.push([requirementId(req),recordId(run,'runs'),recordId(test,'tests')].join('|'));
  const expectedSet=new Set(expected),counts=new Map();for(const record of verification){const key=verificationKey(record);counts.set(key,(counts.get(key)||0)+1);}
  const missing=expected.filter(key=>!counts.has(key));
  const duplicates=[...counts].filter(([key,count])=>expectedSet.has(key)&&count!==1).map(([key,count])=>({key,count}));
  const invalid=verification.filter(record=>!expectedSet.has(verificationKey(record))||upper(recordValue(record,'INDEPENDENCE_STATUS'))!=='INDEPENDENT'||!String(recordValue(record,'EXACT_EVIDENCE')||'').trim()||!['SATISFIED','VIOLATED','UNDETERMINED'].includes(upper(recordValue(record,'DETERMINATION'))));
  return {scope,requirements,runs,verification,expected,counts,missing,duplicates,invalid,coverage:expected.length?expected.filter(key=>counts.get(key)===1).length/expected.length:0};
}
function currentRegressionExecutions(project,iterationId){return recordsForIteration(project,'regressionExecutions',iterationId).filter(record=>!iterationId||String(recordValue(record,'ITERATION_ID')||record.relationships?.ITERATION_ID||record.scope?.iterationId||'')===String(iterationId));}
function activeRegressions(project){return records(project,'regressions').filter(record=>upper(recordValue(record,'ACTIVE_RETIRED_STATE')||'ACTIVE')!=='RETIRED');}
function acceptedOperationSet(project,stage){const proposals=safe(project.projectData.responseProposals),operations=new Set();for(const change of acceptedChanges(project,stage)){const operation=change.operation||proposals.find(item=>item.proposalId===change.proposalId)?.envelope?.operation;if(operation)operations.add(String(operation));}return operations;}
function candidateComponentIdentity(project,candidateId){const candidate=records(project,'candidateFreezes').find(record=>recordId(record,'candidateFreezes')===String(candidateId||''));return candidate?hash.sha256Value(recordValue(candidate,'COMPONENT_HASHES')||{}):'';}
function evaluateIteration(project,iterationId,mode='INITIAL'){
  const matrix=verificationMatrix(project,iterationId),runs=matrix.runs,scope=matrix.scope,iteration=records(project,'iterations').find(record=>recordId(record,'iterations')===String(iterationId||'')),stage=Number(runs[0]?.stage||iteration?.stage||0);
  const contextRecords=recordsForIteration(project,'freshContexts',iterationId),contextById=new Map(contextRecords.map(record=>[recordId(record,'freshContexts'),record])),placeholder=new Set(['','UNASSIGNED','UNKNOWN','PENDING','NOT APPLICABLE','NONE']);
  const resolvedContexts=runs.map(run=>{const id=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||run.scope?.contextId||'');const record=contextById.get(id),externalIdentifier=String(recordValue(record,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim();return {id,record,externalIdentifier};});
  const contexts=new Set(resolvedContexts.filter(item=>item.record&&!placeholder.has(upper(item.externalIdentifier))).map(item=>upper(item.externalIdentifier)));
  const candidates=new Set(runs.map(r=>String(recordValue(r,'CANDIDATE_ID')||r.relationships?.CANDIDATE_ID||r.scope?.candidateId||''))),expectedCandidate=String(scope.candidateId||''),candidateIdentity=candidateComponentIdentity(project,expectedCandidate);
  const contaminated=runs.filter(r=>!['NONE','FALSE','CLEAN','NOT CONTAMINATED'].includes(upper(recordValue(r,'CONTAMINATION_CHECK'))));
  const requiredRunOperation=mode==='INITIAL'?'COMPLETE':'EXECUTE_RUN',runChanges=acceptedChanges(project,stage).filter(change=>change.operation===requiredRunOperation&&String(change.scope?.iterationId||'')===String(iterationId));
  const rawResponses=safe(project.projectData.rawResponses),receipts=safe(project.projectData.outputReceipts),runLinkFailures=[];
  for(const run of runs){const runId=recordId(run,'runs'),contextId=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||''),links=runChanges.filter(change=>String(change.scope?.runId||'')===runId&&String(change.scope?.contextId||'')===contextId);if(links.length!==1){runLinkFailures.push(runId);continue;}const raw=rawResponses.find(item=>item.rawResponseId===links[0].rawResponseId&&!item.invalidatedBy),receipt=receipts.find(item=>item.rawResponseId===links[0].rawResponseId);if(!raw||!receipt||String(receipt.runId||'')!==runId||String(receipt.contextId||'')!==contextId)runLinkFailures.push(runId);}
  const comparisons=recordsForIteration(project,'comparisons',iterationId),defects=recordsForIteration(project,'defects',iterationId),rca=recordsForIteration(project,'rootCauses',iterationId),regExec=currentRegressionExecutions(project,iterationId),activeRegs=activeRegressions(project),regressionFailures=[];
  if(mode!=='INITIAL')for(const reg of activeRegs){const regId=recordId(reg,'regressions'),matches=regExec.filter(record=>String(recordValue(record,'REG_ID')||record.relationships?.REG_ID||'')===regId);if(matches.length!==1||!['SATISFIED','SUCCESS','PASSED'].includes(upper(recordValue(matches[0],'RESULT'))))regressionFailures.push(regId);}
  const unexplained=comparisons.filter(r=>truth(recordValue(r,'CORRECTNESS_AFFECTING_VARIANCE'))&&!truth(recordValue(r,'AUTHORIZED_VARIANCE'))),operations=acceptedOperationSet(project,stage),requiredOperations=stage===17?['FREEZE','EXECUTE_RUN','VERIFY','COMPARE','ROOT_CAUSE','REGRESSION','CORRECT']:stage===19?['CONFIRM_FREEZE','EXECUTE_RUN','VERIFY','COMPARE','REGRESSION_VERIFY','CONFIRM']:[];
  const reasons=[];if(runs.length!==10)reasons.push('Exactly ten current runs are required.');if(resolvedContexts.some(item=>!item.record||placeholder.has(upper(item.externalIdentifier)))||contexts.size!==10)reasons.push('Ten distinct, actually registered external fresh contexts are required.');if(candidates.size!==1||candidates.has('')||[...candidates][0]!==expectedCandidate||!candidateIdentity)reasons.push('Every run must resolve to one exact frozen candidate identity and component hash set.');if(contaminated.length)reasons.push('A current run is contaminated or contamination is unknown.');if(runLinkFailures.length)reasons.push('Every current run requires exactly one accepted run-bound raw response and receipt: '+runLinkFailures.join(', ')+'.');if(mode!=='INITIAL'&&(matrix.expected.length===0||matrix.missing.length||matrix.duplicates.length||matrix.invalid.length))reasons.push('The current REQ × RUN × TEST matrix is incomplete or invalid.');if(regressionFailures.length)reasons.push('Every active permanent regression requires exactly one successful execution in the current iteration: '+regressionFailures.join(', ')+'.');const missingOperations=requiredOperations.filter(operation=>!operations.has(operation));if(missingOperations.length)reasons.push('Required stage operations are missing: '+missingOperations.join(', ')+'.');if(unexplained.length)reasons.push('Unexplained correctness-affecting variance remains.');
  return {mode,iterationId,runs:runs.map(r=>recordId(r,'runs')),contextCount:contexts.size,contextRecordIds:resolvedContexts.map(item=>item.id),externalContextIdentifiers:resolvedContexts.map(item=>item.externalIdentifier),candidateIds:[...candidates],candidateIdentity,matrix,comparisonCount:comparisons.length,defectCount:defects.length,rootCauseCount:rca.length,regressionExecutionCount:regExec.length,unexplainedVarianceCount:unexplained.length,complete:reasons.length===0,reasons};
}
'''
          text=text[:start]+replacement+text[end:]
          p.write_text(text)

          p=Path('response-ingestion.js'); text=p.read_text()
          old="receiptId,jobId:project.job.JOB_ID,stage:Number(stage),role:globalThis.closedLoopCore?.STAGES?.[Number(stage)-1]?.role||'UNKNOWN',contextId:'UNKNOWN',\n    iteration:project.job.CURRENT_ITERATION||'NOT APPLICABLE',runId:'NOT APPLICABLE',"
          new="receiptId,jobId:project.job.JOB_ID,stage:Number(stage),role:globalThis.closedLoopCore?.STAGES?.[Number(stage)-1]?.role||'UNKNOWN',contextId:promptRecord.scope?.contextId||'NOT APPLICABLE',\n    iteration:promptRecord.scope?.iterationId||project.job.CURRENT_ITERATION||'NOT APPLICABLE',runId:promptRecord.scope?.runId||'NOT APPLICABLE',"
          if text.count(old)!=1: raise SystemExit('receipt scope block mismatch')
          text=text.replace(old,new,1)
          old="canonicalEnvelopeSha256:proposal.canonicalEnvelopeSha256};next.projectData.acceptedChanges.push(acceptedChange);"
          new="canonicalEnvelopeSha256:proposal.canonicalEnvelopeSha256,operation:proposal.envelope?.operation||null,scope:clone(proposal.envelope?.scope||proposal.scope||{})};next.projectData.acceptedChanges.push(acceptedChange);"
          if text.count(old)!=1: raise SystemExit('accepted change scope insertion mismatch')
          p.write_text(text.replace(old,new,1))

          p=Path('verify-full-cycle.mjs'); text=p.read_text()
          old="EVIDENCE:'Defect evidence',SEVERITY:'MINOR'"
          new="EVIDENCE:'Defect evidence',SEVERITY:'MAJOR'"
          if text.count(old)!=1: raise SystemExit('full-cycle material defect severity mismatch')
          p.write_text(text.replace(old,new,1))

          p=Path('verify-complete.mjs'); text=p.read_text()
          text += r'''

// Final semantic closure: historical iteration scope must remain evaluable after a newer iteration exists.
{
  const p=project('JOB-HISTORICAL-ITERATION-SCOPE'),base=engine.currentScope(p),oldIteration='ITERATION-HIST-1',oldCandidate='CANDIDATE-HIST-1',newIteration='ITERATION-HIST-2',newCandidate='CANDIDATE-HIST-2';
  const req=record('requirements',4,{OBLIGATION:'Scoped requirement',MANDATORY_OPTIONAL_STATUS:'MANDATORY'},'REQ-HIST');req.scope={...base};p.projectData.requirements.push(req);
  const test=record('tests',6,{STATUS:'READY'},'TEST-HIST');test.scope={...base};test.relationships={REQ_ID:'REQ-HIST'};test.fields.REQ_ID='REQ-HIST';test.REQ_ID='REQ-HIST';p.projectData.tests.push(test);
  p.projectData.iterations.push({...record('iterations',10,{CANDIDATE_ID:oldCandidate},oldIteration),scope:{...base,iterationId:oldIteration,candidateId:oldCandidate}},{...record('iterations',17,{CANDIDATE_ID:newCandidate},newIteration),scope:{...base,iterationId:newIteration,candidateId:newCandidate}});
  p.projectData.candidateFreezes.push({...record('candidateFreezes',10,{ITERATION_ID:oldIteration,COMPONENT_HASHES:{a:'a'}},oldCandidate),scope:{...base,iterationId:oldIteration,candidateId:oldCandidate}},{...record('candidateFreezes',17,{ITERATION_ID:newIteration,COMPONENT_HASHES:{a:'b'}},newCandidate),scope:{...base,iterationId:newIteration,candidateId:newCandidate}});
  const m=engine.verificationMatrix(p,oldIteration);if(m.requirements.length!==1)throw new Error('A newer iteration hid the historical mandatory requirement set.');if(m.scope.iterationId!==oldIteration||m.scope.candidateId!==oldCandidate)throw new Error('Historical iteration scope was not reconstructed from its canonical iteration record.');
}
'''
          p.write_text(text)
          PY
      - name: Verify deterministic source and lifecycle
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit only passing corrections
        run: |
          rm .github/workflows/final-semantic-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close iteration and material-defect semantic gaps"
          git push origin HEAD:practical-100/final-semantic-closure-main
