name: Apply minimum deterministic semantic closure
on:
  push:
    branches:
      - practical-100/final-semantic-closure-main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-semantic-closure-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact deterministic corrections
        run: |
          node .semantic-followup.mjs
          node .semantic-closure.mjs
      - name: Verify corrected source
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified non-workflow source
        run: |
          rm -f .semantic-closure.mjs .semantic-followup.mjs
          git checkout HEAD -- .github/workflows/pages.yml .github/workflows/apply-semantic-closure.yml .github/workflows/final-semantic-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Close remaining semantic reliability gaps"
          git push origin HEAD:practical-100/final-semantic-closure-main
