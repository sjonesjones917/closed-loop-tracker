name: PR6 inspect Stage 17 contract
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Print Stage 17 operation contracts
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const f of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          console.log(JSON.stringify(globalThis.closedLoopWorkflowSchema.STAGE_CONTRACTS[17].operationContracts,null,2));
          NODE
