name: Repair Stage 01 structured intake capture schema
on:
  push:
    branches:
      - implementation/closed-loop-v3
    paths:
      - .github/workflows/repair-stage1-capture-type.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - name: Make INPUT_SET_CONTENTS a structured v3 capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          s=p.read_text()
          old="if(AGENT_JOB_FIELDS.includes(name))return field(name,PRODUCER.AGENT,{requiredAtStage:1});"
          new="if(AGENT_JOB_FIELDS.includes(name))return field(name,PRODUCER.AGENT,{requiredAtStage:1,valueType:name==='INPUT_SET_CONTENTS'?'OBJECT':'STRING'});"
          if old not in s:
              raise SystemExit('Stage 01 job-field schema anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check workflow-schema.js
      - name: Commit schema correction and remove one-time workflow
        run: |
          rm .github/workflows/repair-stage1-capture-type.yml
          git config user.name closed-loop-stage1-schema-repair
          git config user.email closed-loop-stage1-schema-repair@users.noreply.github.com
          git add workflow-schema.js .github/workflows/repair-stage1-capture-type.yml
          git commit -m "Type Stage 01 intake capture as structured object"
          git push origin HEAD:implementation/closed-loop-v3