name: Exhaustive Stage 01 to Stage 04 proof
on:
  push:
    branches: [fix/exhaustive-intake-stage3-stage4-20260830]
permissions:
  contents: write
jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage3-stage4-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reconciled implementation
        shell: bash
        run: |
          set -euo pipefail
          git show ec101e3364880d343893409f5097bf78bf665060:.github/workflows/z-exhaustive-intake-stage4-repair.yml > /tmp/bootstrap.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/bootstrap.yml').read_text()
          start=text.index('      - name: Reconcile proven v3 mechanisms onto current main')
          run=text.index('        run: |\n',start)+len('        run: |\n')
          end=text.index('      - name: Prove exact requested closure',run)
          block=text[run:end]
          Path('/tmp/reconcile.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n')
          PY
          bash /tmp/reconcile.sh
          cat > verify-exhaustive-stage1-stage3-stage4.mjs <<'EOF'
          import fs from 'node:fs';import vm from 'node:vm';import assert from 'node:assert/strict';
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine;
          assert.equal(core.PROJECT_SCHEMA,'closed-loop-project/3');assert.equal(globalThis.closedLoopWorkflowSchema.RESPONSE_SCHEMA,'closed-loop-stage-response/3');
          const p=core.createBlankState('JOB-EXHAUSTIVE');Object.assign(p.job,{EXACT_USER_OBJECTIVE_VERBATIM:'Build the exact requested product.',CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'SOURCE-SET-v001'});engine.ensureShape(p);
          const intake=engine.intakeCoverageManifest(p);p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Exact requested product',ASSUMPTIONS:'No unstated assumptions.',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify({schema:'closed-loop-intake-capture/1',inputVersion:'INPUT-v001',manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,disposition:'INCORPORATED',reason:'',extractedStatements:[{statementKey:'s'+i,text:u.label,statementClass:'REQUIREMENT'}]})),conversationStatements:[]})};
          p.stages[3].agentData={SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED:true,LATEST_PASS_NUMBER:2,NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS:false,RESEARCH_GAPS_AND_BLOCKERS:'NONE',EXCEPTIONS_AND_EDGE_CONDITIONS:'All found conditions captured.',CONFLICTING_OR_INVALIDATING_MATERIAL:'NONE'};
          const prompt1=prompts.buildPromptRecord(1,p).prompt;assert.match(prompt1,/APPLICATION INTAKE MANIFEST/);assert.doesNotMatch(prompt1,/patent application fixture|software\/repository|building\/AEC|physical\/mechanical/i);
          const prompt4=prompts.buildPromptRecord(4,p).prompt;assert.match(prompt4,/APPLICATION OBLIGATION MANIFEST/);assert.match(prompt4,/COMPLETE ACCEPTED STAGE 01 JOB DEFINITION/);assert.match(prompt4,/COMPLETE EXHAUSTED STAGE 03 STAGE DATA/);assert.match(prompt4,/Do not omit, summarize away, or ask the human to repeat/i);assert.doesNotMatch(prompt4,/attach the original intent file again/i);
          const html=fs.readFileSync('index.html','utf8');const expected='.prompt{height:clamp(260px,45vh,520px);max-height:80vh;resize:vertical;white-space:pre;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55}';assert.equal(html.match(/\.prompt\{[^}]+\}/)?.[0],expected,'Prompt box CSS changed from the restored visual baseline.');
          console.log('verify-exhaustive-stage1-stage3-stage4: PASS');
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml'); text=p.read_text()
          if 'node --check verify-exhaustive-stage1-stage3-stage4.mjs' not in text:text=text.replace('          node --check verify-intake-obligation-accounting.mjs\n','          node --check verify-intake-obligation-accounting.mjs\n          node --check verify-exhaustive-stage1-stage3-stage4.mjs\n')
          if 'node verify-exhaustive-stage1-stage3-stage4.mjs' not in text:
              text=text.replace('          node verify-intake-obligation-accounting.mjs\n','          node verify-intake-obligation-accounting.mjs\n          node verify-exhaustive-stage1-stage3-stage4.mjs\n',1)
              text=text.replace('node verify-intake-obligation-accounting.mjs && node verify-test-runtime.mjs','node verify-intake-obligation-accounting.mjs && node verify-exhaustive-stage1-stage3-stage4.mjs && node verify-test-runtime.mjs')
          p.write_text(text)
          PY
      - name: Prove exact requested closure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/z-exhaustive-intake-stage4.yml
          for f in workbook.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify-exhaustive-stage1-stage3-stage4.mjs; do node --check "$f"; done
          node build-test-project.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-exhaustive-stage1-stage3-stage4.mjs
          node verify-test-runtime.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          git diff --check
      - name: Commit proven implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add workbook.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js index.html .github/workflows/pages.yml \
            build-test-project.mjs verify-complete.mjs verify-definition-of-done.mjs verify-full-cycle.mjs verify-hash.mjs verify-ingestion.mjs verify-intake-obligation-accounting.mjs verify-project-lifecycle.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs verify-test-runtime-limits.mjs verify-test-runtime-v3.mjs verify-test-runtime.mjs verify-v3-contract.mjs verify-v3-definition-of-done.mjs verify-v3-migration.mjs verify.mjs verify-exhaustive-stage1-stage3-stage4.mjs
          git diff --cached --check
          git commit -m 'Enforce exhaustive Stage 01 and Stage 03 input closure for Stage 04'
          git push origin HEAD:fix/exhaustive-intake-stage3-stage4-20260830
