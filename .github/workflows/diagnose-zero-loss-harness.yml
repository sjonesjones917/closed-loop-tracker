name: Diagnose zero-loss harness

on:
  push:
    branches: [reliability/semantic-adjudication-zero-loss-20260828-1103]
    paths: [.github/workflows/diagnose-zero-loss-harness.yml]

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture failed job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for job in 98909157318 98909877296; do
            curl -L --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" \
              -o "/tmp/$job.log"
          done
          {
            echo '=== bootstrap apply failure ==='
            tail -n 120 /tmp/98909157318.log
            echo
            echo '=== fixer failure ==='
            tail -n 120 /tmp/98909877296.log
          } > zero-loss-harness-diagnostic.txt
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          rm .github/workflows/diagnose-zero-loss-harness.yml
          git add zero-loss-harness-diagnostic.txt .github/workflows/diagnose-zero-loss-harness.yml
          git commit -m 'Capture zero-loss harness failure diagnostics'
          git push origin HEAD:reliability/semantic-adjudication-zero-loss-20260828-1103
