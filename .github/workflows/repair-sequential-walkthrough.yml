name: Repair sequential walkthrough Stage 01 state
on:
  push:
    branches: [finish/live-human-gate-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/live-human-gate-20260830
          fetch-depth: 0
      - name: Correct walkthrough fixture and replay it
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-human-stage-walkthrough.mjs'); s=p.read_text()
          old="    engine.ensureShape(state);engine.recalculate(state);\n    const checked=[],lane={runId:'RUN-001',contextId:'CTX-001',iterationId:'ITER-001',candidateId:'CAND-001',baselineId:'BASE-001',productId:'PROD-001'};"
          new="""    engine.ensureShape(state);engine.recalculate(state);
    const intake=engine.intakeCoverageManifest(state);
    state.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Complete subject-neutral deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((unit,index)=>({sourceUnitId:unit.unitId,sourceRawValueSha256:unit.rawValueSha256,disposition:'incorporated into the job definition',reason:'Sequential walkthrough preserves the complete supplied human authority.',extractedStatements:[{statementKey:'WALK-'+String(index+1),text:unit.rawValueText||('Captured '+unit.label),statementClass:'CONTEXT'}]}))})};
    state.stages[2].agentData={SOURCE_APPLICABILITY_DETERMINATION:'NO_APPLICABLE_EXTERNAL_SOURCE'};
    state.stages[3].agentData={ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED:true,SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED:true,LATEST_PASS_NUMBER:'2',NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS:false};
    const checked=[],lane={runId:'RUN-001',contextId:'CTX-001',iterationId:'ITER-001',candidateId:'CAND-001',baselineId:'BASE-001',productId:'PROD-001'};"""
          if s.count(old)!=1: raise SystemExit('walkthrough insertion point changed')
          p.write_text(s.replace(old,new))
          PY
          node verify-human-stage-walkthrough.mjs
      - name: Commit fixture and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/repair-sequential-walkthrough.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build real Stage 01 intake state in sequential walkthrough'
          git push origin HEAD:finish/live-human-gate-20260830
