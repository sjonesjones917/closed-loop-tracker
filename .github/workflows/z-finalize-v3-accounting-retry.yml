name: Finalize v3 intake and obligation accounting retry
on:
  push:
    branches:
      - implementation/closed-loop-v3
    paths:
      - .github/workflows/z-finalize-v3-accounting-retry.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make finalizer anchors tolerant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('finalize-v3-accounting.mjs')
          s=p.read_text()
          s=s.replace("if(next===text)throw new Error(`Patch anchor not found: ${label}`);","if(next===text){console.warn(`Patch anchor not found: ${label}`);return text;}")
          s=s.replace("if(!text.includes(\"const INTAKE_MANIFEST_SCHEMA='closed-loop-intake-manifest/1'\"))text=replaceOnce(text,'function executionHandoff(project,{stage,operation,testIds=null,runIds=null}={}){',accountingCode+'\\nfunction executionHandoff(project,{stage,operation,testIds=null,runIds=null}={}){','accounting helper insertion');","if(!text.includes(\"const INTAKE_MANIFEST_SCHEMA='closed-loop-intake-manifest/1'\"))text=replaceOnce(text,/function executionHandoff\\(/,accountingCode+'\\nfunction executionHandoff(','accounting helper insertion');")
          p.write_text(s)
          PY
      - name: Apply Stage 01 and Stage 04 closure
        run: node finalize-v3-accounting.mjs
      - name: Restore supplied-material enumeration used by intake manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          marker='function intakeCoverageManifest(project){'
          if marker not in s:
              raise SystemExit('intake manifest anchor missing')
          if 'function suppliedMaterialReferences(project){' not in s:
              helper="""function suppliedMaterialReferences(project){
  const raw=project&&project.job?project.job.SUPPLIED_MATERIALS_INVENTORY:null;
  if(raw===undefined||raw===null||String(raw).trim()==='')return [];
  const out=[];
  const push=value=>{const label=String(value===undefined?'':value).trim();if(label)out.push({label,type:'SUPPLIED_MATERIAL',transferMode:'REFERENCE'});};
  const ingest=value=>{
    if(value===undefined||value===null)return;
    if(Array.isArray(value)){value.forEach(ingest);return;}
    if(typeof value==='object'){
      const label=value.exactNameOrReference||value.filename||value.name||value.label||value.reference||value.path;
      if(label!==undefined)push(label);else Object.values(value).forEach(ingest);
      return;
    }
    const text=String(value).trim();
    if(!text)return;
    try{const parsed=JSON.parse(text);if(typeof parsed!=='string'){ingest(parsed);return;}}catch(error){}
    text.split(/\\r?\\n|;/).map(line=>line.trim()).filter(Boolean).forEach(push);
  };
  ingest(raw);
  const seen=new Set();
  return out.filter(item=>{const key=item.label.toLowerCase();if(seen.has(key))return false;seen.add(key);return true;});
}
"""
              s=s.replace(marker,helper+marker,1)
          p.write_text(s)
          PY
      - name: Syntax
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
      - name: Focused accounting proof
        run: |
          node build-test-project.mjs
          node verify-intake-obligation-accounting.mjs
      - name: Architecture proof
        run: node verify.mjs
      - name: Commit repaired implementation
        run: |
          rm -f stage4-*.log stage4-diagnostic-summary.txt
          rm -f finalize-v3-accounting.mjs
          rm -f .github/workflows/apply-stage4-closure.yml
          rm -f .github/workflows/apply-stage4-closure-final.yml
          rm -f .github/workflows/z-finalize-v3-accounting.yml
          rm -f .github/workflows/z-finalize-v3-accounting-retry.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          git config user.name closed-loop-accounting-finalizer
          git config user.email closed-loop-accounting-finalizer@users.noreply.github.com
          git add -A
          git commit -m "Close Stage 01 intake and Stage 04 obligation accounting"
          git push origin HEAD:implementation/closed-loop-v3
