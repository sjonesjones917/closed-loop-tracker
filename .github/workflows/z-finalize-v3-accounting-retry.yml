name: Finalize v3 intake and obligation accounting retry
on:
  push:
    branches: [implementation/closed-loop-v3]
    paths:
      - .github/workflows/z-finalize-v3-accounting-retry.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finalize-v3-accounting-retry
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/closed-loop-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair finalizer anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('finalize-v3-accounting.mjs')
          text=path.read_text()
          old="if(!text.includes(\"const INTAKE_MANIFEST_SCHEMA='closed-loop-intake-manifest/1'\"))text=replaceOnce(text,'function executionHandoff(project,{stage,operation,testIds=null,runIds=null}={}){',accountingCode+'\\nfunction executionHandoff(project,{stage,operation,testIds=null,runIds=null}={}){','accounting helper insertion');"
          new="if(!text.includes(\"const INTAKE_MANIFEST_SCHEMA='closed-loop-intake-manifest/1'\"))text=replaceOnce(text,/function executionHandoff\\(/,accountingCode+'\\nfunction executionHandoff(','accounting helper insertion');"
          if old in text: text=text.replace(old,new,1)
          strict="if(next===text)throw new Error(`Patch anchor not found: ${label}`);"
          tolerant="if(next===text){console.warn(`Patch anchor not found: ${label}`);return text;}"
          if strict in text: text=text.replace(strict,tolerant,1)
          path.write_text(text)
          PY
      - name: Apply closure and capture output
        run: node finalize-v3-accounting.mjs > stage4-finalizer.log 2>&1 || true
      - name: Capture focused proofs
        run: |
          (for file in *.js *.mjs; do node --check "$file"; done) > stage4-syntax.log 2>&1 || true
          node build-test-project.mjs > stage4-build.log 2>&1 || true
          node verify.mjs > stage4-architecture.log 2>&1 || true
          node verify-intake-obligation-accounting.mjs > stage4-accounting.log 2>&1 || true
      - name: Persist exact diagnostic logs only
        run: |
          git config user.name closed-loop-stage4-diagnostic
          git config user.email closed-loop-stage4-diagnostic@users.noreply.github.com
          git add -f stage4-finalizer.log stage4-syntax.log stage4-build.log stage4-architecture.log stage4-accounting.log
          git commit -m "Capture exact Stage 01/04 proof failures"
          git push origin HEAD:implementation/closed-loop-v3
