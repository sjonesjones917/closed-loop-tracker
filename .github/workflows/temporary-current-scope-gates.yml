name: Temporary current scope gate repair
on:
  push:
    branches:
      - reliability/current-scope-gates-20260826
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify
        run: |
          set -euo pipefail
          python repair-current-scope-gates.py
          node build-test-project.mjs
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified result and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm repair-current-scope-gates.py .github/workflows/temporary-current-scope-gates.yml
          git add workflow-engine.js verify-complete.mjs repair-current-scope-gates.py .github/workflows/temporary-current-scope-gates.yml
          git commit -m 'Bind correction and release gates to current authority'
          git push origin HEAD
