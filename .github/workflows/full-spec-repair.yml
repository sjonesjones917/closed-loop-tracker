name: Temporary full-spec conformance repair
on:
  push:
    branches: [fix/full-spec-conformance]
permissions:
  contents: write
concurrency:
  group: full-spec-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-spec-conformance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply controlling specification corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def one(text, old, new, label):
              c=text.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1 exact match, found {c}')
              return text.replace(old,new)

          # Preserve the established visual system exactly. Functional changes below may
          # alter CSP/script loading, never the CSS style block.
          index_before=read('index.html')
          style_before=re.search(r'<style>(.*?)</style>',index_before,re.S).group(1)
          style_sha=hashlib.sha256(style_before.encode()).hexdigest()

          # workbook.js — controlling identities, Stage 16 visible name, deterministic /2 -> /3 migration.
          p='workbook.js'; t=read(p)
          t=one(t,"const PROJECT_SCHEMA='closed-loop-project/2';","const PROJECT_SCHEMA='closed-loop-project/3';",'project schema')
          t=one(t,"'REVISE THE RESPONSIBLE LAYER'","'CORRECT THE ROOT CAUSE'",'stage 16 title')
          old="""  if(p.schema!=='human-project/30')throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n  migrated.schema=PROJECT_SCHEMA;migrated.workflow=WORKFLOW_ID;migrated.stageCount=STAGE_COUNT;migrated.revision=Number.isInteger(migrated.revision)?migrated.revision:0;\n  migrated.projectData=migrated.projectData&&typeof migrated.projectData==='object'?migrated.projectData:{};\n  migrated.projectData.migrationArchives=Array.isArray(migrated.projectData.migrationArchives)?migrated.projectData.migrationArchives:[];\n  migrated.projectData.historicalImportRecords=Array.isArray(migrated.projectData.historicalImportRecords)?migrated.projectData.historicalImportRecords:[];\n  if(migrated.projectData.stageRecords&&Object.keys(migrated.projectData.stageRecords).length){migrated.projectData.historicalImportRecords.push({kind:'LEGACY_STAGE_RECORDS',schema:'human-project/30',records:JSON.parse(JSON.stringify(migrated.projectData.stageRecords))});delete migrated.projectData.stageRecords;}\n  if(migrated.projectData.fullProject&&Object.keys(migrated.projectData.fullProject).length)delete migrated.projectData.fullProject;\n  migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:'human-project/30',preservedAt:new Date().toISOString(),payload:original});\n  if(!migrated.stages||Object.keys(migrated.stages).length!==STAGE_COUNT)throw new Error('Legacy project migration requires exactly 30 stages.');\n  return migrated;"""
          new="""  const sourceSchema=String(p.schema||'');\n  if(!['human-project/30','closed-loop-project/2'].includes(sourceSchema))throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));\n  migrated.schema=PROJECT_SCHEMA;migrated.workflow=WORKFLOW_ID;migrated.stageCount=STAGE_COUNT;migrated.revision=Number.isInteger(migrated.revision)?migrated.revision:0;\n  migrated.projectData=migrated.projectData&&typeof migrated.projectData==='object'?migrated.projectData:{};\n  migrated.projectData.migrationArchives=Array.isArray(migrated.projectData.migrationArchives)?migrated.projectData.migrationArchives:[];\n  migrated.projectData.historicalImportRecords=Array.isArray(migrated.projectData.historicalImportRecords)?migrated.projectData.historicalImportRecords:[];\n  if(migrated.projectData.stageRecords&&Object.keys(migrated.projectData.stageRecords).length){migrated.projectData.historicalImportRecords.push({kind:'LEGACY_STAGE_RECORDS',schema:sourceSchema,records:JSON.parse(JSON.stringify(migrated.projectData.stageRecords))});delete migrated.projectData.stageRecords;}\n  if(migrated.projectData.fullProject&&Object.keys(migrated.projectData.fullProject).length)delete migrated.projectData.fullProject;\n  migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:sourceSchema,preservedAt:new Date().toISOString(),payload:original,operational:false});\n  if(!migrated.stages||Object.keys(migrated.stages).length!==STAGE_COUNT)throw new Error('Project migration requires exactly 30 stages.');\n  return migrated;"""
          t=one(t,old,new,'migration path')
          write(p,t)

          # workflow-schema.js — /3 response identity, exact producer ownership, Test IR contract.
          p='workflow-schema.js'; t=read(p)
          t=one(t,"const RESPONSE_SCHEMA='closed-loop-stage-response/2';","const RESPONSE_SCHEMA='closed-loop-stage-response/3';",'response schema')
          old="""const HUMAN_JOB_FIELDS=Object.freeze([\n  'JOB_TITLE','JOB_OWNER','EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY',\n  'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','DESIRED_SOURCE_COUNT','KNOWN_AUTHORITATIVE_SOURCES',\n  'AVAILABLE_TOOLS','PROHIBITED_ACTIONS','EXPLICIT_USER_REQUIREMENTS'\n]);"""
          new="""const HUMAN_JOB_FIELDS=Object.freeze([\n  'EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY','REQUIRED_OUTPUT_FORMAT',\n  'DEADLINE_OR_TEMPORAL_SCOPE','DESIRED_SOURCE_COUNT','KNOWN_AUTHORITATIVE_SOURCES',\n  'AVAILABLE_TOOLS','PROHIBITED_ACTIONS','EXPLICIT_USER_REQUIREMENTS'\n]);\nconst HUMAN_DECISION_JOB_FIELDS=Object.freeze(['JOB_TITLE','JOB_OWNER']);"""
          t=one(t,old,new,'job ownership list')
          t=one(t,"  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:name==='EXACT_USER_OBJECTIVE_VERBATIM'?1:null,provenanceRequired:false,valueType:name==='DESIRED_SOURCE_COUNT'?'INTEGER':'STRING',nullable:name!=='EXACT_USER_OBJECTIVE_VERBATIM'});","  if(HUMAN_DECISION_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN_DECISION,{provenanceRequired:false,nullable:true});\n  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:name==='EXACT_USER_OBJECTIVE_VERBATIM'?1:null,provenanceRequired:false,valueType:name==='DESIRED_SOURCE_COUNT'?'INTEGER':'STRING',nullable:name!=='EXACT_USER_OBJECTIVE_VERBATIM'});",'job owner derivation')
          t=one(t,"const JOB_FIELDS=Object.freeze(Object.fromEntries([...new Set([...HUMAN_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])].map(name=>[name,jobFieldDefinition(name)])));","const JOB_FIELDS=Object.freeze(Object.fromEntries([...new Set([...HUMAN_JOB_FIELDS,...HUMAN_DECISION_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])].map(name=>[name,jobFieldDefinition(name)])));",'job field union')
          # Static test ownership: semantic spec is AGENT; version/hash are APPLICATION.
          t=t.replace('      "EXECUTABLE_KIND",\n      "EXECUTABLE_SPEC_VERSION",\n      "EXECUTABLE_SPEC",','      "EXECUTABLE_KIND",\n      "EXECUTABLE_SPEC",',1)
          t=t.replace('      "TEST_ID",\n      "REQ_ID",\n      "STATUS"\n    ]\n  },\n  "failureTests"','      "TEST_ID",\n      "REQ_ID",\n      "STATUS",\n      "EXECUTABLE_SPEC_VERSION",\n      "EXECUTABLE_SPEC_SHA256"\n    ]\n  },\n  "failureTests"',1)
          start=t.index('const TEST_IR=Object.freeze({')
          end=t.index('const TEST_IR_FORBIDDEN_STEP_KEYS=',start)
          replacement="""const TEST_IR=Object.freeze({\n  version:'closed-loop-test-spec/1',\n  capability:'CLOSED_LOOP_TEST_IR',\n  executableKinds:Object.freeze(['NONE','TEST_IR']),\n  operations:Object.freeze(['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE']),\n  limits:Object.freeze({maxTotalInputBytes:33554432,maxDecompressedBytes:33554432,maxSteps:64,maxSelectorDepth:32,maxParsedDepth:64,maxCollectionItems:100000,maxRegexLength:2000,maxRegexInputBytes:1048576,maxCsvCells:250000,maxWorkerDurationMs:5000,maxArchiveExpansionBytes:33554432})\n});\n"""
          t=t[:start]+replacement+t[end:]
          t=t.replace("if(String(get('EXECUTABLE_KIND')||'').toUpperCase()!=='CUSTOM_PIPELINE')issues.push('EXECUTABLE_KIND must be CUSTOM_PIPELINE.');","if(String(get('EXECUTABLE_KIND')||'').toUpperCase()!=='TEST_IR')issues.push('EXECUTABLE_KIND must be TEST_IR.');")
          t=t.replace("    EXECUTABLE_SPEC_VERSION:Object.freeze({valueType:VALUE_TYPES.STRING,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),","    EXECUTABLE_SPEC_VERSION:Object.freeze({valueType:VALUE_TYPES.STRING,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),\n    EXECUTABLE_SPEC_SHA256:Object.freeze({valueType:VALUE_TYPES.STRING,enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),")
          # The application-owned fields are still typed by the TEST additional field table.
          write(p,t)

          # prompt-engine.js — subject-neutral runtime prompts, task before context, no repeat-data path, exact TEST_IR kind.
          p='prompt-engine.js'; t=read(p)
          t=t.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/27';")
          ds=t.index("${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION")
          de=t.index("\n\n${stage===1?`STAGE 01 CLARIFICATION EXPERIENCE",ds)
          generic="""${stage===1?`STAGE 01 SUBJECT-NEUTRAL INTAKE ADAPTATION\nDerive any subject-specific human-authority questions only from the actual user request, accessible supplied materials, and current canonical context. Do not use a hard-coded project-subject catalogue. Ask only genuinely human-only questions; do not ask the human for facts already supplied, facts available in authorized materials, common domain knowledge, or facts resolvable by authorized research/tools. Keep Stage 01 limited to complete human-authority intake and job definition; do not perform later-stage research, requirement compilation, design, production, or verification.\n`:`SUBJECT-NEUTRAL EXECUTION ADAPTATION\nDerive subject-specific work only from this project's current requirements, sources, artifacts, tools, and stage contract. Do not use a hard-coded project-subject catalogue. Preserve the distinction between artifact generation and downstream execution/verification, and never claim unavailable execution or evidence.\n`}"""
          t=t[:ds]+generic+t[de:]
          t=re.sub(r'For PATENT / REGULATED FILING jobs,.*?Do not turn researchable legal strategy into a human question\.\n','Derive ASK_NOW_NONBLOCKING questions generically from the actual request and accessible materials. The patent acceptance fixture is test data only and must never become a runtime domain branch.\n',t,count=1)
          t=t.replace('EXECUTABLE_KIND = CUSTOM_PIPELINE, EXECUTABLE_SPEC_VERSION = ${schema.TEST_IR.version}, and provide EXECUTABLE_SPEC plus EXECUTABLE_INPUT_BINDINGS.','EXECUTABLE_KIND = TEST_IR and provide EXECUTABLE_SPEC plus EXECUTABLE_INPUT_BINDINGS. The application owns EXECUTABLE_SPEC_VERSION and the normalized Test IR SHA-256; do not emit or override those application-owned values.')
          t=t.replace("if(materials.length){lines.push('MATERIALS TO SEND WITH THIS STAGE 04 INSTRUCTION');for(const item of materials)lines.push('- '+item.label+' — '+item.type);lines.push('These materials are not embedded in the prompt. Attach or provide them in the agent conversation where this Stage 04 instruction is run. Do not assume access to any earlier stage conversation. If a required material is unavailable, ask the human to attach or provide the original before final JSON. Do not ask the human to retype or summarize its contents. Do not infer contents from a filename, path, link label, claimed hash, or metadata. If required material remains inaccessible, return BLOCKED with the exact missing-item reason.');}","if(materials.length){lines.push('APPLICATION-SELECTED CANONICAL RECORDS / MATERIALS');for(const item of materials)lines.push('- '+item.label+' — '+item.type);lines.push('Use these application-selected current materials exactly as supplied. Never ask the human to repeat, retype, summarize, reattach, or resend project information already captured in canonical state. If required prior-stage information should exist but is absent or stale, return BLOCKED with MISSING_APPLICATION_CONTEXT; do not recreate it from memory or ask for a duplicate submission.');}")
          marker='AUTHORIZED BOUNDED CONTEXT FOR THIS STAGE\n${contextFor(stage,state,operation,scope)}'
          t=one(t,marker,'CURRENT STAGE TASK — EXECUTE THIS NOW\n${procedures[stage]}\n\nAUTHORIZED BOUNDED CONTEXT FOR THIS STAGE\n${contextFor(stage,state,operation,scope)}','task-before-context')
          t=one(t,"})()}STAGE-SPECIFIC TASK\n${procedures[stage]}\n\nPERMITTED AGENT-OWNED STAGE DATA","})()}PERMITTED AGENT-OWNED STAGE DATA",'remove buried duplicate task')
          write(p,t)

          # test-runtime.js — replace with one exact registered declarative runtime, closed operation schemas,
          # explicit CSV/XML/selector/regex/numeric contracts, and same-origin worker coordination.
          runtime=r'''(()=>{\n'use strict';\nconst VERSION='closed-loop-test-runtime/2';\nconst SPEC_VERSION='closed-loop-test-spec/1';\nconst CAPABILITY='CLOSED_LOOP_TEST_IR';\nconst OPS=Object.freeze(['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE']);\nconst LIMITS=Object.freeze({maxTotalInputBytes:33554432,maxDecompressedBytes:33554432,maxSteps:64,maxSelectorDepth:32,maxParsedDepth:64,maxCollectionItems:100000,maxRegexLength:2000,maxRegexInputBytes:1048576,maxCsvCells:250000,maxWorkerDurationMs:5000,maxArchiveExpansionBytes:33554432});\nconst STEP_KEYS=Object.freeze({LOAD_ARTIFACT:['op','binding'],READ_BYTES:['op'],DECODE_UTF8:['op'],PARSE_JSON:['op'],PARSE_CSV:['op','delimiter','header','quote','newline','encoding'],PARSE_XML:['op'],SELECT_JSON_PATH:['op','path'],SELECT_XML:['op','path'],COUNT:['op'],SUM:['op'],MIN:['op'],MAX:['op'],SORT:['op'],UNIQUE:['op'],HASH_SHA256:['op'],REGEX:['op','pattern','flags'],COMPARE:['op','value','binding'],ASSERT_EQ:['op','value','tolerance','message'],ASSERT_GT:['op','value','message'],ASSERT_GTE:['op','value','message'],ASSERT_LT:['op','value','message'],ASSERT_LTE:['op','value','message'],ASSERT_MATCH:['op','pattern','flags','message'],ASSERT_CONTAINS:['op','value','message'],ASSERT_NOT_CONTAINS:['op','value','message'],ASSERT_SET_EQUAL:['op','value','message'],BYTE_COMPARE:['op','binding']});\nconst REQUIRED=Object.freeze({LOAD_ARTIFACT:['binding'],PARSE_CSV:['delimiter','header','quote','newline','encoding'],SELECT_JSON_PATH:['path'],SELECT_XML:['path'],REGEX:['pattern'],ASSERT_EQ:['value'],ASSERT_GT:['value'],ASSERT_GTE:['value'],ASSERT_LT:['value'],ASSERT_LTE:['value'],ASSERT_CONTAINS:['value'],ASSERT_NOT_CONTAINS:['value'],ASSERT_SET_EQUAL:['value'],BYTE_COMPARE:['binding']});\nconst bytesOf=v=>v instanceof Uint8Array?v:v instanceof ArrayBuffer?new Uint8Array(v):ArrayBuffer.isView(v)?new Uint8Array(v.buffer,v.byteOffset,v.byteLength):null;\nconst field=(t,k)=>t?.fields?.[k]??t?.[k];\nconst stable=v=>JSON.stringify(v,(_,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort(([a],[b])=>a.localeCompare(b))):x);\nconst depth=v=>{if(v===null||typeof v!=='object')return 0;let m=0,stack=[[v,1]];while(stack.length){const [x,d]=stack.pop();m=Math.max(m,d);if(m>LIMITS.maxParsedDepth)return m;for(const y of Array.isArray(x)?x:Object.values(x))if(y&&typeof y==='object')stack.push([y,d+1]);}return m};\nasync function sha256(v){const b=bytesOf(v);if(!b)throw new Error('HASH_SHA256 requires bytes.');const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}\nfunction parseCsv(text,cfg){if(cfg.encoding!=='UTF-8')throw new Error('PARSE_CSV supports only UTF-8.');if(typeof cfg.delimiter!=='string'||cfg.delimiter.length!==1)throw new Error('PARSE_CSV delimiter must be one character.');if(typeof cfg.quote!=='string'||cfg.quote.length!==1)throw new Error('PARSE_CSV quote must be one character.');if(!['LF','CRLF','AUTO'].includes(cfg.newline))throw new Error('PARSE_CSV newline must be LF, CRLF, or AUTO.');if(typeof cfg.header!=='boolean')throw new Error('PARSE_CSV header must be boolean.');const d=cfg.delimiter,q=cfg.quote,rows=[];let row=[],cell='',quoted=false,cells=0;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch===q&&text[i+1]===q){cell+=q;i++}else if(ch===q)quoted=false;else cell+=ch;continue}if(ch===q){if(cell.length)throw new Error('Malformed CSV quote.');quoted=true;continue}if(ch===d){row.push(cell);cell='';cells++}else if(ch==='\n'){if(cfg.newline==='CRLF'&&text[i-1]!=='\r')throw new Error('CSV newline violates CRLF contract.');row.push(cell);rows.push(row);row=[];cell='';cells++}else if(ch==='\r'){if(text[i+1]==='\n')continue;if(cfg.newline!=='AUTO')throw new Error('CSV newline violates declared contract.');row.push(cell);rows.push(row);row=[];cell='';cells++}else cell+=ch;if(cells>LIMITS.maxCsvCells)throw new Error('CSV exceeds cell limit.')}if(quoted)throw new Error('Malformed CSV unterminated quote.');if(cell.length||row.length){row.push(cell);rows.push(row)}if(rows.length>LIMITS.maxCollectionItems)throw new Error('CSV exceeds row limit.');if(!cfg.header)return rows;if(!rows.length)return [];const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}\nfunction parseXml(text){const root={name:'#document',attrs:{},children:[],text:''},stack=[root],rx=/<([^>]+)>|([^<]+)/g;let m;while((m=rx.exec(text))){if(m[2]){stack.at(-1).text+=m[2];continue}const raw=m[1].trim();if(raw.startsWith('?')||raw.startsWith('!'))continue;if(raw.startsWith('/')){const name=raw.slice(1).trim();if(stack.length===1||stack.at(-1).name!==name)throw new Error('Malformed XML close tag.');stack.pop();continue}const self=raw.endsWith('/'),body=self?raw.slice(0,-1).trim():raw,name=body.split(/\s+/)[0];if(!/^[A-Za-z_][\w:.-]*$/.test(name))throw new Error('Unsupported XML element name.');const node={name,attrs:{},children:[],text:''};stack.at(-1).children.push(node);if(!self)stack.push(node);if(stack.length>LIMITS.maxParsedDepth)throw new Error('XML exceeds parsed-depth limit.')}if(stack.length!==1)throw new Error('Malformed XML unclosed tag.');return root}\nfunction jsonSelect(v,path){const s=String(path||'').trim();if(s==='$')return v;if(!s.startsWith('$.'))throw new Error('SELECT_JSON_PATH requires registered root syntax.');const toks=s.slice(2).split('.');if(toks.length>LIMITS.maxSelectorDepth)throw new Error('Selector exceeds depth limit.');let out=v;for(const token of toks){const m=token.match(/^([^\[\]]+)(?:\[(\d+)\])?$/);if(!m)throw new Error('Unsupported JSON selector token.');out=out?.[m[1]];if(m[2]!==undefined)out=out?.[Number(m[2])];if(out===undefined)throw new Error('JSON selector does not resolve.')}return out}\nfunction xmlSelect(v,path){const s=String(path||'').trim();if(!/^\/[A-Za-z_][\w:.-]*(?:\/[A-Za-z_][\w:.-]*)*$/.test(s))throw new Error('SELECT_XML supports only absolute element paths.');const parts=s.slice(1).split('/');if(parts.length>LIMITS.maxSelectorDepth)throw new Error('Selector exceeds depth limit.');let nodes=v.children||[];for(const part of parts){nodes=nodes.filter(n=>n.name===part);if(!nodes.length)return [];nodes=nodes.flatMap(n=>n.children?.length?n.children:[n])}return nodes}\nfunction safeRegex(pattern,flags,input){if(String(pattern).length>LIMITS.maxRegexLength)throw new Error('Regex exceeds pattern limit.');if(new TextEncoder().encode(String(input)).byteLength>LIMITS.maxRegexInputBytes)throw new Error('Regex input exceeds limit.');if(!/^[gimsuy]*$/.test(String(flags||''))||/([+*]\)|\}\+|\}\*|\]\+|\]\*)/.test(String(pattern)))throw new Error('Regex construct is outside the registered safe subset.');return new RegExp(String(pattern),String(flags||''))}\nfunction numericCompare(a,b,op){if(typeof a!=='number'||typeof b!=='number'||!Number.isFinite(a)||!Number.isFinite(b))throw new Error(op+' requires finite numbers.');return op==='GT'?a>b:op==='GTE'?a>=b:op==='LT'?a<b:a<=b}\nfunction equal(a,b,tol){if(tol!==undefined){if(typeof a!=='number'||typeof b!=='number'||!Number.isFinite(a)||!Number.isFinite(b))throw new Error('Tolerance comparison requires finite numbers.');const allowed=new Set(['absolute','relative']);for(const k of Object.keys(tol||{}))if(!allowed.has(k))throw new Error('Unknown tolerance property '+k);const abs=tol?.absolute,rel=tol?.relative;if(abs===undefined&&rel===undefined)throw new Error('Approximate comparison requires absolute or relative tolerance.');const diff=Math.abs(a-b),okAbs=abs!==undefined&&diff<=Number(abs),scale=Math.max(Math.abs(a),Math.abs(b),1),okRel=rel!==undefined&&diff<=Number(rel)*scale;return okAbs||okRel}if((typeof a==='number'&&!Number.isInteger(a))||(typeof b==='number'&&!Number.isInteger(b)))throw new Error('Precision-sensitive non-integer equality requires explicit tolerance or exact decimal strings.');return stable(a)===stable(b)}\nfunction validateSpec(spec){const issues=[];if(!spec||typeof spec!=='object'||Array.isArray(spec))return {valid:false,issues:['Test IR must be an object.']};for(const k of Object.keys(spec))if(!['version','steps'].includes(k))issues.push('Unknown Test IR property '+k+'.');if(spec.version!==SPEC_VERSION)issues.push('Unsupported Test IR version.');if(!Array.isArray(spec.steps)||!spec.steps.length)issues.push('Test IR requires steps.');if((spec.steps?.length||0)>LIMITS.maxSteps)issues.push('Test IR exceeds step limit.');for(const [i,st] of (spec.steps||[]).entries()){if(!st||typeof st!=='object'||Array.isArray(st)){issues.push('Step '+i+' must be object.');continue}if(!OPS.includes(st.op)){issues.push('Step '+i+' uses unsupported operation '+String(st.op)+'.');continue}const allowed=new Set(STEP_KEYS[st.op]);for(const k of Object.keys(st))if(!allowed.has(k))issues.push('Step '+i+' has unknown property '+k+'.');for(const k of REQUIRED[st.op]||[])if(!Object.prototype.hasOwnProperty.call(st,k))issues.push('Step '+i+' missing '+k+'.');if((st.op==='REGEX'||st.op==='ASSERT_MATCH')&&String(st.pattern??st.value??'').length>LIMITS.maxRegexLength)issues.push('Step '+i+' regex exceeds limit.');if(st.op==='PARSE_CSV'&&(st.encoding!=='UTF-8'||typeof st.header!=='boolean'||typeof st.delimiter!=='string'||st.delimiter.length!==1||typeof st.quote!=='string'||st.quote.length!==1||!['LF','CRLF','AUTO'].includes(st.newline)))issues.push('Step '+i+' has invalid explicit CSV contract.');if(st.op==='ASSERT_EQ'&&typeof st.value==='number'&&!Number.isInteger(st.value)&&st.tolerance===undefined)issues.push('Step '+i+' non-integer equality requires tolerance or decimal string.')}return {valid:!issues.length,issues}}\nfunction validateBindings(bindings){const issues=[];if(!bindings||typeof bindings!=='