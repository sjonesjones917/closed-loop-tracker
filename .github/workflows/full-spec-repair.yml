      - name: Remove temporary workflows before proof
        shell: bash
        run: |
          rm -f .github/workflows/full-spec-audit.yml .github/workflows/full-spec-repair.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "pages.yml"
      - name: Prove repaired contracts and regression suite
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          for f in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify-controlling-spec.mjs verify-one-time-intent-intake.mjs verify-test-runtime.mjs verify-hash.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs verify-project-lifecycle.mjs; do node --check "$f"; done
          node verify-controlling-spec.mjs
          node verify-test-runtime.mjs
          node verify-one-time-intent-intake.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Commit permanent conformance repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Align runtime prompts and contracts with controlling specification"
          git push origin HEAD:fix/full-spec-conformance
