name: Repair Stage 02 UI boundary

on:
  push:
    branches:
      - fix/monotonic-reliability-pass-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - name: Add exact Stage 02 operator boundary and remove temporary workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old="return 'Stage 02 researches independent external sources. Supplied project artifacts are not required for this stage.';"
          new="return 'Independent external sources only. Stage 02 researches independent external sources. Supplied project artifacts are not required for this stage.';"
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected one Stage 02 UI target; found {s.count(old)}')
              s=s.replace(old,new)
              p.write_text(s)
          PY
          rm -f .github/workflows/repair-stage02-ui-boundary.yml .github/workflows/diagnose-schema-gate.yml
          node --check app-core.js
          grep -F "Independent external sources only." app-core.js
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A app-core.js .github/workflows
          git commit -m "Clarify Stage 02 independent-source operator boundary"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831