name: Temporary source snapshot

on:
  push:
    branches:
      - fix/reliability-routing-evidence-20260827

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reliability-routing-evidence-20260827
          fetch-depth: 0
      - name: Package exact branch source
        shell: bash
        run: tar --exclude=.git -czf closed-loop-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-source-snapshot
          path: closed-loop-source.tgz
          if-no-files-found: error
