name: Repair one-time intent fixture and self-remove
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run one-time intent fixture canonical-location repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - name: Mirror accepted Stage 01 deliverable into its canonical Job field
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-one-time-intent-intake.mjs')
          t=p.read_text()
          anchor="project.stages[1].status='COMPLETE';"
          insertion="project.job.EXACT_DELIVERABLE_REQUESTED=project.stages[1].agentData.EXACT_DELIVERABLE_REQUESTED;\nproject.stages[1].status='COMPLETE';"
          if insertion not in t:
              if anchor not in t: raise SystemExit('Stage 01 canonical Job-field fixture anchor not found')
              t=t.replace(anchor,insertion,1)
          p.write_text(t)
          PY
          node --check verify-one-time-intent-intake.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-one-time-intent-intake.mjs
          git rm .github/workflows/repair-one-time-intent-fixture.yml
          git commit -m "Use the canonical Stage 01 deliverable location in the one-time intent proof"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
