name: Controller v3 prompt byte identity apply
on:
  push:
    branches:
      - controller-v3-prompt-file-identity-20260904
    paths:
      - controller-v3-prompt-trigger.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller-v3-prompt-file-identity-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply prompt corrections
        run: node controller-v3-prompt-apply.mjs
      - name: Verify prompt byte identity
        run: |
          node --check prompt-engine.js
          node --check project-store.js
          node verify-authoritative-prompt-file-identity.mjs
          node verify-file-first-operator.mjs
          node verify-file-first-response.mjs
          mv .github/workflows/controller-v3-prompt-apply.yml /tmp/controller-v3-prompt-apply.yml
          node verify-complete.mjs
          node verify-v3-definition-of-done.mjs
          mv /tmp/controller-v3-prompt-apply.yml .github/workflows/controller-v3-prompt-apply.yml
      - name: Commit source corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js project-store.js verify-authoritative-prompt-file-identity.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Bind authoritative prompt identity to exact file bytes'
          git push origin HEAD:controller-v3-prompt-file-identity-20260904
