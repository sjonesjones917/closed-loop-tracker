name: One-time controlling specification materializer
on:
  push:
    branches: [fix/controlling-spec-final-20260830]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  materialize:
    if: github.head_ref == 'fix/controlling-spec-final-20260830' || github.ref_name == 'fix/controlling-spec-final-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize controlling implementation without visual redesign
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin implementation/closed-loop-v3:refs/remotes/origin/implementation/closed-loop-v3 closed-loop-v3-completion:refs/remotes/origin/closed-loop-v3-completion
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const style=html.match(/<style>[\s\S]*?<\/style>/)?.[0];
          if(!style)throw new Error('Unable to capture current visual stylesheet.');
          fs.writeFileSync('/tmp/visual-style-baseline.txt',style);
          if(!style.includes('height:clamp(260px,45vh,520px)'))throw new Error('Prompt box visual baseline changed before repair.');
          if(!style.includes('.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'))throw new Error('Prompt expansion baseline changed before repair.');
          NODE
          for f in workbook.js app-core.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js response-ingestion.js project-store.js build-test-project.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-definition-of-done.mjs verify-project-lifecycle.mjs verify-semantic-invariant.mjs verify-test-runtime.mjs verify-test-runtime-limits.mjs verify-test-runtime-v3.mjs verify-v3-contract.mjs verify-v3-definition-of-done.mjs verify-v3-migration.mjs; do
            git show "origin/implementation/closed-loop-v3:$f" > "$f"
          done
          git show origin/implementation/closed-loop-v3:.github/workflows/pages.yml > .github/workflows/pages.yml
          git show origin/closed-loop-v3-completion:prompt-engine.js > prompt-engine.js
          node <<'NODE'
          const fs=require('fs');
          let schema=fs.readFileSync('workflow-schema.js','utf8');
          schema=schema.replace("const HUMAN_JOB_FIELDS=Object.freeze([\n  'JOB_TITLE','JOB_OWNER','EXACT_USER_OBJECTIVE_VERBATIM'","const HUMAN_JOB_FIELDS=Object.freeze([\n  'EXACT_USER_OBJECTIVE_VERBATIM'");
          const appAnchor="const APPLICATION_JOB_FIELDS=Object.freeze([";
          if(!schema.includes(appAnchor))throw new Error('Job ownership anchor missing.');
          schema=schema.replace(appAnchor,"const HUMAN_DECISION_JOB_FIELDS=Object.freeze(['JOB_TITLE','JOB_OWNER']);\n"+appAnchor);
          const defAnchor="function jobFieldDefinition(name){\n  if(APPLICATION_JOB_FIELDS.includes(name))";
          if(!schema.includes(defAnchor))throw new Error('Job field definition anchor missing.');
          schema=schema.replace(defAnchor,"function jobFieldDefinition(name){\n  if(HUMAN_DECISION_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN_DECISION,{nullable:true,provenanceRequired:false});\n  if(APPLICATION_JOB_FIELDS.includes(name))");
          const union="[...new Set([...HUMAN_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])]";
          if(!schema.includes(union))throw new Error('Job field union anchor missing.');
          schema=schema.replace(union,"[...new Set([...HUMAN_DECISION_JOB_FIELDS,...HUMAN_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])]");
          fs.writeFileSync('workflow-schema.js',schema);
          NODE
          node <<'NODE'
          const fs=require('fs');
          let ui=fs.readFileSync('app-core.js','utf8');
          if(!ui.includes("if(n===4)return ''")){
            const anchor='function artifactControlMarkup(n,locked){';
            if(!ui.includes(anchor))throw new Error('Stage 04 artifact-control anchor missing in v3 app-core.');
            ui=ui.replace(anchor,anchor+"if(n===4)return '';");
          }
          if(!ui.includes('RUN_APP_TESTS'))throw new Error('v3 app-core lacks native RUN_APP_TESTS control.');
          fs.writeFileSync('app-core.js',ui);
          NODE
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('prompt-engine.js','utf8');
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/30';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/32';");
          const stage1="Perform complete human-authority intake only.";
          if(!s.includes(stage1))throw new Error('Stage 01 directive anchor missing.');
          s=s.replace(stage1,stage1+" Exhaust the human-authority intake before Stage 01 can complete: capture every materially relevant fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue present in current user input or accessible supplied materials. The user supplies project information once; if information is already present, capture and reuse it rather than asking for it again. Ask every foreseeable genuinely human-only issue now using BLOCKING_NOW or ASK_NOW_NONBLOCKING; classify research/later-resolvable matters as LATER_RESOLVABLE and do not ask the human for those. Do not return DATA_PROPOSAL until every application-enumerated intake unit is accounted for and every required human-only issue has been supplied, asked and answered, or explicitly deferred.");
          const stage3="Research only the current accepted Stage 02 independent external source set, source-by-source and pass-by-pass.";
          if(!s.includes(stage3))throw new Error('Stage 03 directive anchor missing.');
          s=s.replace(stage3,stage3+" Exhaust the current accepted Stage 02 source universe before completion. Inspect every current source, preserve every material mandatory statement, recommendation, optional practice, example, prohibition, exception, dependency, applicability fact, restriction, invalidating material, and candidate obligation, perform the required second conflict/exception pass, and do not complete while a current source lacks research coverage or the latest complete pass still found a new material requirement category.");
          const stage4="Compile atomic requirement proposals from the complete APPLICATION OBLIGATION MANIFEST.";
          if(!s.includes(stage4))throw new Error('Stage 04 directive anchor missing.');
          s=s.replace(stage4,stage4+" Stage 04 receives the complete exhausted Stage 01 capture and complete exhausted Stage 03 research directly from canonical project state. Use all of it. Do not ask the user to attach, restate, summarize, retype, or otherwise resupply any project intent, requirement, fact, material description, or decision already supplied or captured earlier. Process every obligationId exactly once before final JSON; schema-valid output with an omitted obligation is invalid.");
          const execNeedle="Perform only this stage and operation for JOB_ID ${job.JOB_ID||'UNKNOWN'}.\\n\\n";
          if(!s.includes(execNeedle))throw new Error('Prompt execution anchor missing.');
          s=s.replace(execNeedle,"Perform only this stage and operation for JOB_ID ${job.JOB_ID||'UNKNOWN'}.\\n\\nEXECUTION DIRECTIVE — USE THE PROJECT DATA AND DO THE STAGE WORK NOW\\nThe project data, manifests, accepted prior-stage records, evidence, and bounded context below are the actual inputs to this operation. Apply the PROCEDURE to those exact inputs now. Do not merely summarize context, restate the schema, describe what another agent should do, or ask the human to repeat information already present. If a required fact exists anywhere in authorized current project input or accepted prior-stage capture, use it. Only genuinely unavailable human-only authority may be requested from the human.\\n\\n");
          const buildAnchor="function buildPromptRecord(stageOrDefinition,state,options={}){const stage=Number(stageOrDefinition?.number||stageOrDefinition);";
          if(!s.includes(buildAnchor))throw new Error('buildPromptRecord anchor missing.');
          const helper="function assertStage4UpstreamExhausted(state){const fail=reason=>{const error=new Error(reason);error.code='STAGE4_UPSTREAM_INCOMPLETE';throw error;};const one=state?.stages?.[1],three=state?.stages?.[3];if(String(one?.status||'').toUpperCase()!=='COMPLETE'||one?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 01 human-authority intake is complete.');const manifest=intakeCoverageManifest(state),captured=parseCapturedInputSet(one),ids=new Set(safe(captured.units).map(unit=>clean(unit?.sourceUnitId)).filter(Boolean));for(const unit of safe(manifest.units))if(!ids.has(unit.unitId))fail('Stage 04 cannot be generated because Stage 01 did not account for every controlled input unit.');if(String(three?.status||'').toUpperCase()!=='COMPLETE'||three?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 03 research is complete.');const noSource=upper(state?.stages?.[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION||state?.stages?.[2]?.acceptedData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE';if(!noSource){const sources=safe(state?.projectData?.sources).filter(r=>r?.active!==false&&!r?.invalidatedBy),research=safe(state?.projectData?.research).filter(r=>r?.active!==false&&!r?.invalidatedBy),covered=new Set(research.map(r=>clean(recordValue(r,'SOURCE_ID')||r?.relationships?.SOURCE_ID)).filter(Boolean));for(const src of sources){const sid=recordId(src,'sources');if(sid&&!covered.has(sid))fail('Stage 04 cannot be generated because Stage 03 has not researched every current Stage 02 source.');}const d=three?.agentData||three?.acceptedData||{};if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED)))fail('Stage 04 cannot be generated until Stage 03 confirms all controlling sources were examined.');if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED)))fail('Stage 04 cannot be generated until Stage 03 completes the second conflict and exception pass.');if(['TRUE','YES','FOUND','DETECTED'].includes(upper(d.NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS)))fail('Stage 04 cannot be generated while the latest Stage 03 pass found a new material requirement category.');}return true;}\n";
          const guarded=buildAnchor.replace(";",";if(stage===4)assertStage4UpstreamExhausted(state);");
          s=s.replace(buildAnchor,helper+guarded);
          if(s.includes('FILES OR CONTEXT YOU MUST NOT RECEIVE'))s=s.replaceAll('FILES OR CONTEXT YOU MUST NOT RECEIVE','FILES YOU MUST NOT RECEIVE');
          fs.writeFileSync('prompt-engine.js',s);
          NODE
          node <<'NODE'
          const fs=require('fs');
          let proof=fs.readFileSync('verify-definition-of-done.mjs','utf8');
          const old="assert(core.PROJECT_SCHEMA==='closed-loop-project/2'&&schema.RESPONSE_SCHEMA==='closed-loop-stage-response/2','Schema identity changed.');";
          const current="assert(core.PROJECT_SCHEMA==='closed-loop-project/3'&&schema.RESPONSE_SCHEMA==='closed-loop-stage-response/3','Schema identity changed.');";
          if(!proof.includes(old))throw new Error('Legacy /2 definition-of-done assertion anchor missing.');
          proof=proof.replace(old,current);
          fs.writeFileSync('verify-definition-of-done.mjs',proof);
          NODE
          node .tmp-stage4-exhaustive-patch.mjs
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace("connect-src 'self'; object-src", "connect-src 'self'; worker-src 'self'; object-src");
          if(!html.includes('test-runtime.js'))html=html.replace(/(<script\s+defer\s+src=\"workflow-schema\.js\?v=[^\"]+\"\s*><\/script>)/, '$1\n<script defer src="test-runtime.js?v=controlling-v3-20260830"></script>');
          html=html.replace(/(workbook|hash|workflow-schema|test-runtime|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=[^\"']+/g,'$1.js?v=controlling-v3-20260830');
          fs.writeFileSync('index.html',html);
          const style=html.match(/<style>[\s\S]*?<\/style>/)?.[0];
          if(style!==fs.readFileSync('/tmp/visual-style-baseline.txt','utf8'))throw new Error('Visual stylesheet changed.');
          NODE
          rm -f .github/workflows/repair-controlling-spec.yml .github/workflows/patch-controlling-materializer.yml .tmp-stage4-exhaustive-patch.mjs
          node --check workbook.js
          node --check app-core.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node verify-user-prompt-invariants.mjs
          node build-test-project.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          node verify-v3-definition-of-done.mjs
          git diff --check
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Implement exhaustive Stage 1 and Stage 3 inputs for Stage 4"
          git push origin HEAD:fix/controlling-spec-final-20260830
