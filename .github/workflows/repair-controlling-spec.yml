name: One-time controlling specification materializer
on:
  push:
    branches: [fix/controlling-spec-final-20260830]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  materialize:
    if: github.head_ref == 'fix/controlling-spec-final-20260830' || github.ref_name == 'fix/controlling-spec-final-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize controlling implementation without visual redesign
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin implementation/closed-loop-v3:refs/remotes/origin/implementation/closed-loop-v3 closed-loop-v3-completion:refs/remotes/origin/closed-loop-v3-completion
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const style=html.match(/<style>[\s\S]*?<\/style>/)?.[0];
          if(!style)throw new Error('Unable to capture current visual stylesheet.');
          fs.writeFileSync('/tmp/visual-style-baseline.txt',style);
          if(!style.includes('height:clamp(260px,45vh,520px)'))throw new Error('Prompt box visual baseline changed.');
          if(!style.includes('.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'))throw new Error('Prompt expansion baseline changed.');
          NODE
          for f in workbook.js app-core.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js response-ingestion.js project-store.js build-test-project.mjs verify.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-definition-of-done.mjs verify-project-lifecycle.mjs verify-semantic-invariant.mjs verify-test-runtime.mjs verify-test-runtime-limits.mjs verify-test-runtime-v3.mjs verify-v3-contract.mjs verify-v3-definition-of-done.mjs verify-v3-migration.mjs; do
            git show "origin/implementation/closed-loop-v3:$f" > "$f"
          done
          git show origin/implementation/closed-loop-v3:.github/workflows/pages.yml > .github/workflows/pages.yml
          git show origin/closed-loop-v3-completion:prompt-engine.js > prompt-engine.js
          node <<'NODE'
          const fs=require('fs');
          let ui=fs.readFileSync('app-core.js','utf8');
          if(!ui.includes("if(n===4)return ''")){
            const anchor='function artifactControlMarkup(n,locked){';
            if(!ui.includes(anchor))throw new Error('Stage 04 artifact-control anchor missing in v3 app-core.');
            ui=ui.replace(anchor,anchor+"if(n===4)return '';");
          }
          if(!ui.includes('RUN_APP_TESTS'))throw new Error('v3 app-core lacks native RUN_APP_TESTS control.');
          fs.writeFileSync('app-core.js',ui);
          NODE
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('prompt-engine.js','utf8');
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/30';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/31';");
          const needle="Perform only this stage and operation for JOB_ID ${job.JOB_ID||'UNKNOWN'}.\\n\\n";
          if(!s.includes(needle))throw new Error('Prompt execution anchor not found.');
          const directive="Perform only this stage and operation for JOB_ID ${job.JOB_ID||'UNKNOWN'}.\\n\\nEXECUTION DIRECTIVE — USE THE PROJECT DATA AND DO THE STAGE WORK NOW\\nThe project data, manifests, current records, evidence, and bounded context included below are the actual inputs to this operation. They are not decorative background and they are not a substitute for instructions. Apply the PROCEDURE below to those exact inputs now. Do not merely summarize the context, restate the schema, describe what another agent should do, or ask the human to repeat information already present. If this stage is semantically executable with the supplied context, perform the stage work and return the required proposal/result. If a required fact is already present anywhere in authorized current project input or an accepted prior-stage capture, use it rather than asking for it again. Only genuinely unavailable human-only authority may be requested from the human.\\n\\n";
          s=s.replace(needle,directive);
          const stage4="Compile atomic requirement proposals from the complete APPLICATION OBLIGATION MANIFEST.";
          if(!s.includes(stage4))throw new Error('Stage 04 directive anchor missing.');
          s=s.replace(stage4,stage4+" You MUST process every manifest obligationId exactly once before final JSON. The prompt already carries forward the captured project intent and obligation universe; never ask for the original intent file, a re-summary, a re-description, or a second copy of any project fact already captured. Schema-valid output with an omitted obligation is invalid and must not be returned.");
          const stage1="Perform complete human-authority intake only.";
          if(!s.includes(stage1))throw new Error('Stage 01 directive anchor missing.');
          s=s.replace(stage1,stage1+" The user supplies project information once. Capture every materially relevant project statement that is actually available now so later stages can reuse it without asking the user to resupply it. The durable intake manifest and structured INPUT_SET_CONTENTS are the downstream memory boundary.");
          if(!s.includes('FILES OR CONTEXT YOU MUST NOT RECEIVE'))throw new Error('Prompt handoff withheld-material heading anchor missing.');
          s=s.replace('FILES OR CONTEXT YOU MUST NOT RECEIVE','FILES YOU MUST NOT RECEIVE');
          fs.writeFileSync('prompt-engine.js',s);
          NODE
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace("connect-src 'self'; object-src", "connect-src 'self'; worker-src 'self'; object-src");
          if(!html.includes('test-runtime.js'))html=html.replace(/(<script\s+defer\s+src=\"workflow-schema\.js\?v=[^\"]+\"\s*><\/script>)/, '$1\n<script defer src="test-runtime.js?v=controlling-v3-20260830"></script>');
          html=html.replace(/(workbook|hash|workflow-schema|test-runtime|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=[^\"']+/g,'$1.js?v=controlling-v3-20260830');
          fs.writeFileSync('index.html',html);
          const style=html.match(/<style>[\s\S]*?<\/style>/)?.[0];
          if(style!==fs.readFileSync('/tmp/visual-style-baseline.txt','utf8'))throw new Error('Visual stylesheet changed.');
          NODE
          rm -f .github/workflows/repair-controlling-spec.yml .github/workflows/patch-controlling-materializer.yml
          node --check workbook.js
          node --check app-core.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node build-test-project.mjs
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          node verify-v3-definition-of-done.mjs
          git diff --check
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Implement controlling /3 reliability specification without visual redesign"
          git push origin HEAD:fix/controlling-spec-final-20260830