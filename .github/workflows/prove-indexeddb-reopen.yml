name: Prove IndexedDB reopen
on:
  push:
    branches:
      - fix/indexeddb-reopen-current-20260826
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/indexeddb-reopen-current-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .apply-indexeddb-reopen.py
      - run: |
          node build-test-project.mjs
          node --check project-store.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - run: |
          rm -f .apply-indexeddb-reopen.py .github/workflows/prove-indexeddb-reopen.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix IndexedDB closing connection lifecycle [indexeddb-reopen-applied]"
          git push origin HEAD:fix/indexeddb-reopen-current-20260826