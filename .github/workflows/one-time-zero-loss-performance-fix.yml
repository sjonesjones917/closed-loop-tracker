name: Apply the one-time zero-loss operator-path performance correction

on:
  push:
    branches:
      - codex/zero-loss-final-v3

permissions:
  contents: write

concurrency:
  group: one-time-zero-loss-performance-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/zero-loss-final-v3
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Apply the minimal complete correction set
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, replacements):
              value = path.read_bytes()
              for before, after, expected in replacements:
                  actual = value.count(before)
                  if actual != expected:
                      raise SystemExit(
                          f'{path} correction target count was {actual}, expected {expected}: {before!r}'
                      )
                  value = value.replace(before, after)
              path.write_bytes(value)
              return value

          app_old = b'async function persistReplacement(next){engine.ensureShape(next);engine.recalculate(next);const committed='
          app_new = b'async function persistReplacement(next){const committed='
          app = replace_exact(Path('app-core.js'), [(app_old, app_new, 1)])
          if app_old in app or app.count(app_new) != 1:
              raise SystemExit('app-core.js postcondition failed')

          store_replacements = [
              (b'assertProjectIntegrity(project,{verifyDerived:true});', b'assertProjectIntegrity(project,{verifyDerived:false});', 1),
              (b'engine?.recalculate?.(next);assertProjectIntegrity(next);', b'engine?.recalculate?.(next);assertProjectIntegrity(next,{verifyDerived:false});', 1),
              (b'engine?.recalculate?.(next);next.revision=expected+1;assertProjectIntegrity(next);', b'engine?.recalculate?.(next);next.revision=expected+1;assertProjectIntegrity(next,{verifyDerived:false});', 1),
              (b'engine?.recalculate?.(next);const integrity=prior.validateProjectIntegrity(next);', b'engine?.recalculate?.(next);const integrity=prior.validateProjectIntegrity(next,{verifyDerived:false});', 1),
              (b'engine.recalculate(next);const integrity=prior.validateProjectIntegrity(next);', b'engine.recalculate(next);const integrity=prior.validateProjectIntegrity(next,{verifyDerived:false});', 2),
          ]
          store = replace_exact(Path('project-store.js'), store_replacements)
          for before, after, expected in store_replacements:
              if before in store or store.count(after) != expected:
                  raise SystemExit(f'project-store.js postcondition failed: {after!r}')

          # Imported and otherwise untrusted project state must still receive a full
          # independent derived-state integrity validation before activation.
          required_full_checks = [
              b'const projectIntegrity=prior.validateProjectIntegrity(project);',
              b'const integrity=prior.validateProjectIntegrity(project);',
          ]
          for required in required_full_checks:
              if required not in store:
                  raise SystemExit(f'full import integrity check was lost: {required!r}')
          PY
      - name: Verify the affected correctness paths before committing
        run: |
          set -euo pipefail
          node --check app-core.js
          node --check project-store.js
          node verify-ingestion.mjs
          node verify-project-lifecycle.mjs
          node verify-store-completion-amendment.mjs
          node verify-terminal-delivery-lifecycle.mjs
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs
          git diff --check
      - name: Commit the verified correction to the pull-request branch
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add app-core.js project-store.js
          git diff --cached --quiet && { echo 'No correction remained to commit.'; exit 1; }
          git commit -m 'Fix duplicate project recalculation on operator writes'
          git push origin HEAD:codex/zero-loss-final-v3
