name: Apply all 30 stage prompt functionality repairs
on:
  push:
    branches: [fix/exhaustive-intake-stage3-stage4-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage3-stage4-20260830
          fetch-depth: 0
      - name: Apply implementation repairs
        run: python3 fix-all-stage-prompts.py
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add prompt-engine.js workbook.js
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Complete all 30 stage prompt behavior and durable project memory'
          git push origin HEAD:fix/exhaustive-intake-stage3-stage4-20260830
