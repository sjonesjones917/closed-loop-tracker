name: All 30 stage prompt audit
on:
  push:
    branches: [fix/exhaustive-intake-stage3-stage4-20260830]
permissions:
  contents: write
jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage3-stage4-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply all-stage prompt audit fixes
        run: python3 fix-all-stage-prompts.py
      - name: Prove every stage prompt and full app closure
        shell: bash
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check prompt-engine.js
          node verify-prompt-semantics.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-exhaustive-stage1-stage3-stage4.mjs
          node verify-test-runtime-v3.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          git diff --check
      - name: Commit only proven implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f fix-all-stage-prompts.py .github/workflows/z-all-stage-prompt-audit.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add workbook.js prompt-engine.js verify-prompt-semantics.mjs verify-definition-of-done.mjs
          git add -u -- fix-all-stage-prompts.py .github/workflows/z-all-stage-prompt-audit.yml
          git diff --cached --check
          git commit -m 'Audit and enforce all 30 stage prompt contracts'
          git push origin HEAD:fix/exhaustive-intake-stage3-stage4-20260830
