name: Finalize all-stage prompt implementation
on:
  push:
    branches: [fix/exhaustive-intake-stage3-stage4-20260830]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage3-stage4-20260830
          fetch-depth: 0
      - name: Finalize source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p=Path('prompt-engine.js')
          s=p.read_text()
          line=" if(stage>1){parts.push('DURABLE PROJECT MEMORY — HUMAN AUTHORITY AND ACCEPTED STAGE 01 SEMANTIC CAPTURE — DO NOT ASK THE HUMAN TO RESUPPLY IT\\n'+show({humanJobInput:Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,d])=>['HUMAN','HUMAN_DECISION'].includes(d?.producer)).map(([name])=>[name,state?.job?.[name]??null])),stage01:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:state?.stages?.[1]?.derivedData||{}},currentInputVersion:state?.job?.CURRENT_INPUT_VERSION||null}));}\n"
          while s.count(line)>1:
              first=s.find(line)
              second=s.find(line,first+len(line))
              s=s[:second]+s[second+len(line):]
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          established='.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'
          old='.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'
          if established not in s:
              if old not in s:
                  raise SystemExit('Established prompt preview anchor missing.')
              s=s.replace(old,established,1)
              p.write_text(s)
          PY
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git rm -f fix-all-stage-prompts.py .github/workflows/z-all-stage-prompt-audit.yml
          git add prompt-engine.js index.html workflow-engine.js workbook.js
          git commit -m 'Finalize complete stage prompts and remove repair scaffolding'
          git push origin HEAD:fix/exhaustive-intake-stage3-stage4-20260830
