name: Apply convergent accessibility ratchet

on:
  workflow_dispatch:
  push:
    branches: [implementation/convergent-directive-20260902]
    paths:
      - .github/workflows/apply-convergent-accessibility-ratchet.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implementation/convergent-directive-20260902
          persist-credentials: true
      - name: Apply the minimal complete text-size correction and permanent browser regression
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const htmlPath='index.html';
          const browserPath='verify-browser.mjs';
          let html=fs.readFileSync(htmlPath,'utf8');
          let browser=fs.readFileSync(browserPath,'utf8');

          const cssMarker='/* Normative accessibility floor: primary body and control text 16px; secondary metadata 14px. */';
          if(!html.includes(cssMarker)){
            const css=`\n${cssMarker}\n:root{--ui-small:14px;--ui-body:16px}\nbody{font-size:16px}\n.app *,.app-help *{font-size:16px!important}\n.app .brand-kicker,.app .storage-status,.app .progress-line strong,.app .fact span,.app .status,.app .field .help,.app .stage-number,.app .stage-meta,.app .record-key,.app .project-field-group>summary span:last-child,.app .prompt-meta,.app .stage-output-hint{font-size:14px!important}\n.app .brand h1,.app .hero h2{font-size:18px!important}\n.app h2.section-title,.app .fact strong{font-size:16px!important}\n.app button,.app .file-button,.app .project-action-menu>summary{line-height:1.2}\n@media(max-width:420px){.app .stage-picker-display{font-size:16px!important}}\n`;
            if(!html.includes('\n</style>'))throw new Error('index.html style terminator not found');
            html=html.replace('\n</style>',`${css}\n</style>`);
          }

          browser=browser.replaceAll('parseFloat(getComputedStyle(e).fontSize)<11','parseFloat(getComputedStyle(e).fontSize)<14');
          browser=browser.replaceAll('UI text below 11px','UI text below 14px');
          browser=browser.replaceAll('minimumUiTextPx:11','minimumUiTextPx:14');
          const controlAnchor='assert(tinyText.length===0,`UI text below 14px at ${width}px: ${JSON.stringify(tinyText)}`);}';
          if(!browser.includes('Primary control text below 16px')){
            if(!browser.includes(controlAnchor))throw new Error('verify-browser accessibility assertion anchor not found');
            const replacement='assert(tinyText.length===0,`UI text below 14px at ${width}px: ${JSON.stringify(tinyText)}`);const undersizedControls=await evalValue(cdp,`[...document.querySelectorAll("button,input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select,.project-action-menu>summary")].filter(e=>e.getClientRects().length&&parseFloat(getComputedStyle(e).fontSize)<16).map(e=>({text:e.textContent.trim().slice(0,80),size:getComputedStyle(e).fontSize,className:e.className}))`);assert(undersizedControls.length===0,`Primary control text below 16px at ${width}px: ${JSON.stringify(undersizedControls)}`);}';
            browser=browser.replace(controlAnchor,replacement);
          }
          if(!html.includes(cssMarker))throw new Error('Accessibility CSS repair did not apply');
          if(browser.includes('fontSize)<11')||browser.includes('minimumUiTextPx:11'))throw new Error('Obsolete 11px acceptance remains');
          fs.writeFileSync(htmlPath,html);
          fs.writeFileSync(browserPath,browser);
          NODE
          git config user.name "closed-loop-ratchet"
          git config user.email "closed-loop-ratchet@users.noreply.github.com"
          git add index.html verify-browser.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No accessibility correction was required."
            exit 0
          fi
          git commit -m "Enforce normative mobile text-size floors"
          git push origin HEAD:implementation/convergent-directive-20260902
