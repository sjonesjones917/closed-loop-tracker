name: One-time ingestion fixture contract repair
on:
  push:
    branches:
      - fix/monotonic-reliability-pass-20260831
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-reliability-pass-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair verifier fixtures against current contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          replacements=[]
          replacements.append(("""  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};\n""","""  const operation=stage===19?'COMPARE':schema.STAGE_CONTRACTS[stage].operations[0];\n  const scope={};\n  for(const key of schema.operationContract(stage,operation)?.scopeRequirements||[]){\n    if(key==='projectRevision')scope[key]=Number(p.revision||0);\n    else if(key==='inputVersion')scope[key]=p.job.CURRENT_INPUT_VERSION;\n    else if(key==='sourceSetVersion')scope[key]='SOURCE-SET-v001';\n    else if(key==='requirementsVersion')scope[key]='REQUIREMENTS-v001';\n    else if(key==='testSuiteVersion')scope[key]='TEST-SUITE-v001';\n    else if(key==='instructionVersion')scope[key]='INSTRUCTION-v001';\n    else if(key==='iterationId')scope[key]='ITERATION-INGESTION-FIXTURE';\n    else if(key==='candidateId')scope[key]='CANDIDATE-INGESTION-FIXTURE';\n    else if(key==='runId')scope[key]='RUN-INGESTION-FIXTURE';\n    else if(key==='contextId')scope[key]='CONTEXT-INGESTION-FIXTURE';\n    else if(key==='baselineId')scope[key]='BASELINE-INGESTION-FIXTURE';\n    else if(key==='productId')scope[key]='PRODUCT-INGESTION-FIXTURE';\n  }\n  const options={operation,scope};\n"""))
          replacements.append(("""  const stageData={};\n  if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);\n""","""  const stageData={};\n  const writableStageField=stageFields.find(name=>schema.STAGE_FIELDS?.[stage]?.[name]?.producer===schema.PRODUCER.AGENT);\n  if(writableStageField)stageData[writableStageField]=safeValue(writableStageField);\n"""))
          replacements.append(("""    for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);}\n    if(!Object.keys(fields).length){const agentField=schema.recordAgentFields(collection)[0];if(agentField)fields[agentField]=safeValue(agentField);}\n""","""    for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);}\n    if(stage===6&&collection==='tests'){fields.TEST_TYPE='DETERMINISTIC';fields.EXECUTION_MODE='APPLICATION_DETERMINISTIC';fields.REQUIRED_CAPABILITY='CLOSED_LOOP_TEST_IR';fields.ARTIFACT_REQUIREMENTS='NONE';fields.EXECUTABLE_KIND='TEST_IR';fields.EXECUTABLE_SPEC={version:'closed-loop-test-spec/1',steps:[{op:'ASSERT_EQ',value:1}]};fields.EXECUTABLE_INPUT_BINDINGS={};}\n    if(!Object.keys(fields).length){const agentField=schema.recordAgentFields(collection)[0];if(agentField)fields[agentField]=safeValue(agentField);}\n"""))
          replacements.append(("""{let p=project('JOB-REFINEMENT-LOOP'),stage=2,pr=savePrompt(p,stage),e=validEnvelope(p,stage,pr),prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});const result=ingestion.reject(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Add the missing controlling-source rationale and make the result more complete.',requestCorrection:true});""","""{let p=project('JOB-REFINEMENT-LOOP'),stage=1,pr=savePrompt(p,stage),e=validEnvelope(p,stage,pr),prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});const result=ingestion.reject(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Add the missing intake rationale and make the result more complete.',requestCorrection:true});"""))
          replacements.append(("""!replacement.prompt.includes('Add the missing controlling-source rationale and make the result more complete.')""","""!replacement.prompt.includes('Add the missing intake rationale and make the result more complete.')"""))
          for old,new in replacements:
              if new in s: continue
              if s.count(old)!=1: raise SystemExit('fixture repair target not found exactly once')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node verify-ingestion.mjs
          git diff --check
      - name: Commit verified repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-stage6-valid-ir.yml
          git add verify-ingestion.mjs
          git commit -m "Align ingestion fixtures with current contracts"
          git push origin HEAD:fix/monotonic-reliability-pass-20260831
