name: Reconcile current main into file-first ratchet
on:
  push:
    branches: [repair/full-spec-conformance-fcfc1c6]
    paths:
      - .github/workflows/reconcile-current-main-file-first.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reconcile-current-main-file-first.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/full-spec-conformance-fcfc1c6
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Merge exact current main
        run: |
          set -euo pipefail
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main
      - name: Prove both current ratchets together
        run: |
          set -euo pipefail
          node --check workbook.js
          node --check app-core.js
          node --check workflow-engine.js
          node verify-reservation-contract.mjs
          node verify-state-release-contract.mjs
          node verify-file-first-operator.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
          node verify.mjs
      - name: Prove visible operator path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-reconcile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove scaffold and push reconciled ratchet
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-current-main-file-first.yml
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:repair/full-spec-conformance-fcfc1c6
