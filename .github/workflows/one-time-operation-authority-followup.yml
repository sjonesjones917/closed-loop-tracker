name: One-time operation authority follow-up

on:
  push:
    branches: [repair/operation-authority-closure-20260903]

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply minimal follow-up
        run: node .repair-operation-authority-followup.mjs
      - name: Prove focused and route contracts
        run: |
          node --check workflow-schema.js
          node verify-operation-authority-closure.mjs
          node verify-spec-grounded-route-oracle.mjs
          node verify-v3-contract.mjs
      - name: Commit completed authority correction
        run: |
          set -euo pipefail
          git config user.name "closed-loop repair automation"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-schema.js verify-spec-grounded-route-oracle.mjs
          git diff --cached --exit-code && exit 0
          git commit -m "Close non-agent operation write authority"
          git push origin HEAD:repair/operation-authority-closure-20260903
