name: Apply minimal Stage 4 capture-once correction on current main

on:
  push:
    branches: [fix/stage4-capture-once-current-main-20260830]
    paths: [.github/workflows/stage4-capture-once-current-main.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-capture-once-current-main-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the Stage 4 original-intent filename decoupling
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,s)=>fs.writeFileSync(p,s);
          const exact=(s,a,b,label)=>{if(!s.includes(a))throw new Error('Missing exact source: '+label);return s.replace(a,b)};
          let p=read('prompt-engine.js');
          p=exact(p,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';",'prompt version');
          p=exact(p,"function humanInputBlock(job){\n const definitions=schema.JOB_FIELDS||{};\n const names=Object.entries(definitions).filter(([,definition])=>definition?.producer==='HUMAN').map(([name])=>name);\n return names.length?names.map(name=>`${name}:\\n${show(job?.[name])}`).join('\\n\\n'):'NONE';\n}","function humanInputBlock(job,stage=1){\n const definitions=schema.JOB_FIELDS||{};\n const names=Object.entries(definitions).filter(([name,definition])=>definition?.producer==='HUMAN'&&(Number(stage)===1||name!=='SUPPLIED_MATERIALS_INVENTORY')).map(([name])=>name);\n return names.length?names.map(name=>`${name}:\\n${show(job?.[name])}`).join('\\n\\n'):'NONE';\n}",'stage-aware human input projection');
          p=exact(p,'${humanInputBlock(j)}','${humanInputBlock(j,stage)}','human input invocation');
          write('prompt-engine.js',p);
          let semantic=read('verify-prompt-semantics.mjs');
          semantic=exact(semantic,"if(renamed.bodySha256===record.bodySha256)throw new Error('Current human input change did not change the Stage 04 instruction body.');","if(renamed.bodySha256!==record.bodySha256)throw new Error('Original intent filename leaked into Stage 04 after canonical Stage 01 capture.');",'Stage 04 filename independence expectation');
          write('verify-prompt-semantics.mjs',semantic);
          let html=read('index.html');
          if(!/\?v=[^\"']+/.test(html))throw new Error('No runtime build token found.');
          html=html.replace(/\?v=[^\"']+/g,'?v=runtime-stage4-capture-once-20260830');
          write('index.html',html);
          NODE
      - name: Run directly affected proofs
        run: |
          node --check prompt-engine.js
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-full-cycle.mjs
      - name: Commit only the tested source repair
        shell: bash
        run: |
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add prompt-engine.js index.html verify-prompt-semantics.mjs
          git commit -m 'Stop Stage 4 from reusing original intent filename'
          git push origin HEAD:fix/stage4-capture-once-current-main-20260830
