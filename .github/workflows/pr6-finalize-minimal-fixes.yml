name: PR6 finalize minimum semantic fixes
on:
  push:
    branches: [practical-100/pr6-finalize]
permissions: {contents: write}
jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimum responsible-layer repairs
        env:
          PATCH_B64: 
      - name: Apply patch
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Verify repaired invariants
        run: |
          node --check response-ingestion.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified repairs and remove temporary workflow
        run: |
          rm .github/workflows/pr6-finalize-minimal-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'PR 6: close no-source and rejection semantics'
          git push
