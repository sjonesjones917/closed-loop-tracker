name: PR6 finalize minimum semantic fixes
on:
  push:
    branches:
      - practical-100/pr6-finalize
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimum responsible-layer repairs
        run: |
          sed -i "s/\`NO_APPLICABLE_EXTERNAL_SOURCE: <evidence-supported rationale>\`/'NO_APPLICABLE_EXTERNAL_SOURCE: <evidence-supported rationale>'/" .pr6-finalize-patch.py
          python .pr6-finalize-patch.py
      - name: Verify repaired invariants
        run: |
          node --check response-ingestion.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified repairs and remove temporary files
        run: |
          rm .github/workflows/pr6-finalize-minimal-fixes.yml
          rm .pr6-finalize-patch.py
          rm -f .pr6-finalize-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'PR 6: close no-source and rejection semantics'
          git push
