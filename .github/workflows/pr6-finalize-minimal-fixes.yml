name: PR6 finalize minimum semantic fixes
on:
  push:
    branches: [practical-100/pr6-finalize]
permissions: {contents: write}
jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimum responsible-layer repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(); assert old in s, f'missing target in {path}'; p.write_text(s.replace(old,new,count))

          replace('response-ingestion.js',
          "if(['REJECTED','CORRECTION_REQUESTED'].includes(proposal.status)){const prior=safe(next.projectData.rejectedResponses).find(x=>x.proposalId===proposalId);return {project:next,rejected:prior,receipt:findReceipt(next,proposal.receiptId),idempotent:true};}",
          "if(['REJECTED','CORRECTION_REQUESTED'].includes(proposal.status)){const e=new Error(`Response proposal is ${proposal.status} and cannot be accepted.`);e.code='PROPOSAL_REJECTED';throw e;}")
          replace('response-ingestion.js',
          "  if(!proposal)throw new Error('Response proposal does not exist.');\n  if(proposal.status!=='PENDING_OPERATOR_REVIEW')throw new Error(`Response proposal is ${proposal.status}, not pending review.`);",
          "  if(!proposal)throw new Error('Response proposal does not exist.');\n  if(['REJECTED','CORRECTION_REQUESTED'].includes(proposal.status)){const prior=safe(next.projectData.rejectedResponses).find(x=>x.proposalId===proposalId);return {project:next,rejected:prior||null,receipt:findReceipt(next,proposal.receiptId),idempotent:true};}\n  if(proposal.status!=='PENDING_OPERATOR_REVIEW')throw new Error(`Response proposal is ${proposal.status}, not pending review.`);")

          replace('workflow-schema.js',
          "  'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','KNOWN_AUTHORITATIVE_SOURCES',\n  'AVAILABLE_TOOLS','PROHIBITED_ACTIONS','EXPLICIT_USER_REQUIREMENTS'",
          "  'REQUIRED_OUTPUT_FORMAT','DEADLINE_OR_TEMPORAL_SCOPE','KNOWN_AUTHORITATIVE_SOURCES','DESIRED_SOURCE_COUNT',\n  'AVAILABLE_TOOLS','PROHIBITED_ACTIONS','EXPLICIT_USER_REQUIREMENTS'")

          replace('app-core.js',
          "['KNOWN_AUTHORITATIVE_SOURCES','Known authority supplied by user','textarea'],['AVAILABLE_TOOLS','Allowed / required tools','textarea']",
          "['KNOWN_AUTHORITATIVE_SOURCES','Known authority supplied by user','textarea'],['DESIRED_SOURCE_COUNT','Desired / suggested source count','input'],['AVAILABLE_TOOLS','Allowed / required tools','textarea']")

          replace('prompt-engine.js',
          "USER-SUPPLIED KNOWN AUTHORITY (classification preserved; do not automatically relabel as external authority):\n${show(j.KNOWN_AUTHORITATIVE_SOURCES)}\n\nAVAILABLE TOOLS:",
          "USER-SUPPLIED KNOWN AUTHORITY (classification preserved; do not automatically relabel as external authority):\n${show(j.KNOWN_AUTHORITATIVE_SOURCES)}\n\nDESIRED OR SUGGESTED SOURCE COUNT (search target only; never fabricate sources to satisfy it):\n${show(j.DESIRED_SOURCE_COUNT)}\n\nAVAILABLE TOOLS:")
          replace('prompt-engine.js',
          "- Stage 02 may contain only genuinely independent external governing sources; target-product and repository artifacts are prohibited.\n- Stage 03 may research only accepted Stage 02 external governing sources.",
          "- Stage 02 may contain only genuinely independent external governing sources; target-product and repository artifacts are prohibited. If diligent inspection establishes that no legitimate external governing source applies, set AUTHORITY_HIERARCHY to `NO_APPLICABLE_EXTERNAL_SOURCE: <evidence-supported rationale>`, set KNOWN_CONTROLLING_SOURCES_EXAMINED to true, return no source records, and never invent a source to satisfy a desired count.\n- Stage 03 may research only accepted Stage 02 external governing sources; when Stage 02 has the valid NO_APPLICABLE_EXTERNAL_SOURCE determination, Stage 03 research is explicitly not applicable and no source may be invented.")

          old="""    case 2:
      requireAccepted();requireCount('sources',1,'At least one inspected independent external governing source is required.');
      for(const source of collection('sources'))reasons.push(...schema.sourceClassificationIssues(recordFields(source)).map(issue=>`${recordId(source,'sources')}: ${issue}`));
      if(collection('sourceConflicts').some(record=>['UNRESOLVED','BLOCKED','UNKNOWN','OPEN'].includes(upper(recordValue(record,'RESOLUTION_STATUS')))))reasons.push('An external-source conflict remains unresolved or blocked.');
      break;
    case 3:{
      requireAccepted();requireCount('research',1);
      const sourceIds=all('sources').map(record=>recordId(record,'sources'));
      const researched=new Set(collection('research').map(record=>String(recordValue(record,'SOURCE_ID')||record.relationships?.SOURCE_ID||'')));
      const missing=sourceIds.filter(id=>!researched.has(id));
      if(missing.length)reasons.push(`Research is missing for source(s): ${missing.join(', ')}.`);
      break;
    }"""
          new="""    case 2:{
      requireAccepted();
      const noSource=upper(project.stages[2]?.agentData?.AUTHORITY_HIERARCHY).startsWith('NO_APPLICABLE_EXTERNAL_SOURCE')&&truth(project.stages[2]?.agentData?.KNOWN_CONTROLLING_SOURCES_EXAMINED);
      if(!collection('sources').length&&!noSource)reasons.push('At least one inspected independent external governing source or an evidence-supported NO_APPLICABLE_EXTERNAL_SOURCE determination is required.');
      if(collection('sources').length&&noSource)reasons.push('NO_APPLICABLE_EXTERNAL_SOURCE cannot coexist with current external source records.');
      for(const source of collection('sources'))reasons.push(...schema.sourceClassificationIssues(recordFields(source)).map(issue=>`${recordId(source,'sources')}: ${issue}`));
      if(collection('sourceConflicts').some(record=>['UNRESOLVED','BLOCKED','UNKNOWN','OPEN'].includes(upper(recordValue(record,'RESOLUTION_STATUS')))))reasons.push('An external-source conflict remains unresolved or blocked.');
      break;
    }
    case 3:{
      requireAccepted();
      const noSource=upper(project.stages[2]?.agentData?.AUTHORITY_HIERARCHY).startsWith('NO_APPLICABLE_EXTERNAL_SOURCE')&&truth(project.stages[2]?.agentData?.KNOWN_CONTROLLING_SOURCES_EXAMINED);
      const sourceIds=all('sources').map(record=>recordId(record,'sources'));
      if(noSource){if(sourceIds.length)reasons.push('Stage 02 no-source determination conflicts with current source records.');if(collection('research').length)reasons.push('Stage 03 research must remain empty when external source research is not applicable.');break;}
      requireCount('research',1);
      const researched=new Set(collection('research').map(record=>String(recordValue(record,'SOURCE_ID')||record.relationships?.SOURCE_ID||'')));
      const missing=sourceIds.filter(id=>!researched.has(id));
      if(missing.length)reasons.push(`Research is missing for source(s): ${missing.join(', ')}.`);
      break;
    }"""
          replace('workflow-engine.js',old,new)

          p=Path('verify-complete.mjs'); s=p.read_text(); marker='// Artifact identity is independent of file-selection order.'
          block="""// Valid evidence-supported no-source determination must not force fabricated authority.\n{\n  const p=project('JOB-NO-SOURCE');p.stages[1].status='COMPLETE';p.projectData.acceptedChanges.push({changeId:'CHANGE-NO-SOURCE-2',stage:2,status:'COMMITTED',responseType:'DATA_PROPOSAL'});p.stages[2].agentData={AUTHORITY_HIERARCHY:'NO_APPLICABLE_EXTERNAL_SOURCE: Diligent inspection found no independent external governing authority for this synthetic job.',KNOWN_CONTROLLING_SOURCES_EXAMINED:true};\n  const stage2=engine.gate(2,p);assert(stage2.complete,`Valid no-source Stage 02 was blocked: ${stage2.reasons.join('; ')}`);p.stages[2].status='COMPLETE';p.projectData.acceptedChanges.push({changeId:'CHANGE-NO-SOURCE-3',stage:3,status:'COMMITTED',responseType:'DATA_PROPOSAL'});const stage3=engine.gate(3,p);assert(stage3.complete,`No-source Stage 03 not-applicable path was blocked: ${stage3.reasons.join('; ')}`);\n  const invalid=project('JOB-NO-SOURCE-MISSING');invalid.stages[1].status='COMPLETE';invalid.projectData.acceptedChanges.push({changeId:'CHANGE-BAD-NO-SOURCE',stage:2,status:'COMMITTED',responseType:'DATA_PROPOSAL'});invalid.stages[2].agentData={AUTHORITY_HIERARCHY:'NO_APPLICABLE_EXTERNAL_SOURCE: unsupported',KNOWN_CONTROLLING_SOURCES_EXAMINED:false};assert(!engine.gate(2,invalid).complete,'Unsupported no-source assertion completed Stage 02.');\n}\n\n"""
          assert marker in s; p.write_text(s.replace(marker,block+marker,1))

          p=Path('verify-ingestion.mjs'); s=p.read_text(); marker="console.log(JSON.stringify({pr3Dispositions:true"
          block="""// Rejection/correction disposition is idempotent and cannot later be accepted.\n{let p=project('JOB-PR3-REJECT'),stage=2,pr=savePrompt(p,stage),e=validEnvelope(p,stage,pr);const prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});const first=ingestion.reject(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Controlled rejection.'});const count=first.project.projectData.rejectedResponses.length;const again=ingestion.reject(first.project,prepared.proposal.proposalId,{operator:'VERIFY',reason:'Repeated rejection.'});if(!again.idempotent||again.project.projectData.rejectedResponses.length!==count||again.rejected?.rejectedResponseId!==first.rejected.rejectedResponseId)throw new Error('Repeat rejection was not idempotent.');let accepted=false;try{ingestion.commit(first.project,prepared.proposal.proposalId,{operator:'VERIFY'});accepted=true;}catch{}if(accepted)throw new Error('Acceptance after rejection was permitted.');}\n"""
          assert marker in s; p.write_text(s.replace(marker,block+marker,1))
          PY
      - name: Verify repaired invariants
        run: |
          node --check response-ingestion.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Commit verified repairs and remove temporary workflow
        run: |
          rm .github/workflows/pr6-finalize-minimal-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'PR 6: close no-source and rejection semantics'
          git push
