name: Apply storage boundary repair
on:
  push:
    branches:
      - reliability/storage-boundary-current-20260826
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/storage-boundary-current-20260826
      - name: Apply exact storage correction
        run: python3 .storage-repair.py
      - name: Syntax checks
        run: |
          node --check project-store.js
          node --check verify-browser-extra.mjs
      - name: Verify retained project
        run: node build-test-project.mjs
      - name: Verify canonical serialization and SHA-256
        run: node verify-hash.mjs
      - name: Verify canonical workflow and persistence
        run: node verify.mjs
      - name: Verify response ingestion
        run: node verify-ingestion.mjs
      - name: Verify gates and completion
        run: node verify-complete.mjs
      - name: Verify full lifecycle
        run: node verify-full-cycle.mjs
      - name: Verify prompt semantics
        run: node verify-prompt-semantics.mjs
      - name: Verify primary browser workflow
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
      - name: Verify browser persistence and edge cases
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http-extra.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs
      - name: Commit proven repair and remove branch-only tooling
        run: |
          rm .storage-repair.py
          rm .github/workflows/apply-storage-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close storage integrity and atomicity gaps"
          git push origin HEAD:reliability/storage-boundary-current-20260826
