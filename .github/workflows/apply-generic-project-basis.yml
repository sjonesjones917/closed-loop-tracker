name: Apply generic project prompt basis
on:
  push:
    branches: [fix/generic-project-prompt-basis-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/41';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/42';")
          old="function contextFor(stage,state,operation,scope={}){const parts=[];"
          new="function projectAuthorityBasis(state,stage,operation,scope={}){const job=state?.job||{},humanAuthority=Object.fromEntries(Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>[name,job?.[name]??null])),stageOne=state?.stages?.[1]||{},sources=workflow.recordsForCurrentScope(state,'sources').filter(record=>workflow.isActiveRecord(record)).map(record=>({sourceId:recordId(record,'sources'),title:recordValue(record,'TITLE')||null,authorityLevel:recordValue(record,'AUTHORITY_LEVEL')||null,authorityRole:recordValue(record,'AUTHORITY_ROLE')||null,controllingState:recordValue(record,'CONTROLLING_STATE')||null})),requirements=workflow.recordsForCurrentScope(state,'requirements').filter(record=>workflow.isActiveRecord(record)).map(record=>({requirementId:recordId(record,'requirements'),obligation:recordValue(record,'OBLIGATION')||null,mandatoryOptionalStatus:recordValue(record,'MANDATORY_OPTIONAL_STATUS')||null,applicability:recordValue(record,'APPLICABILITY')||null,status:recordValue(record,'STATUS')||null}));return {rule:'Every stage is generated from this same subject-neutral project authority basis. Preserve the human intent captured once in Stage 01 and the current external-authority/requirement identities. Never ask the human to repeat or reattach information already captured. Use only the detailed records authorized by the current stage and operation below, so this basis does not leak prohibited later-stage context or authorize work outside the current stage.',humanAuthority,acceptedStage01:{capture:parseCapturedInputSet(state),agentData:stageOne.agentData||stageOne.acceptedData||{},humanData:stageOne.humanData||{},derivedData:workflow.deriveStageData(state,1)},currentAuthoritySummary:{sources,requirements},currentVersions:{inputVersion:job.CURRENT_INPUT_VERSION||null,sourceSetVersion:job.CURRENT_SOURCE_SET_VERSION||null,requirementsVersion:job.CURRENT_REQUIREMENTS_VERSION||null,testSuiteVersion:job.CURRENT_TEST_SUITE_VERSION||null,instructionVersion:job.CURRENT_INSTRUCTION_VERSION||null},stage,operation,scope};}\nfunction contextFor(stage,state,operation,scope={}){const parts=[];if(stage>1)parts.push(`PROJECT AUTHORITY BASIS — HUMAN INTENT + CURRENT EXTERNAL REQUIREMENTS\\n${show(projectAuthorityBasis(state,stage,operation,scope))}`);"
          if old not in s: raise SystemExit('contextFor anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-engine.js
          git commit -m "Generate every stage from one generic project authority basis"
          git push
