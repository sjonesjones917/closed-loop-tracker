name: Apply focused runtime fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('workflow-engine.js')
          text = engine.read_text()
          old = "actionMap={APPLICATION_DETERMINISTIC:'NO_ACTION',EXTERNAL_AGENT_TOOL:'SEND_TO_TOOL_AGENT',INDEPENDENT_AGENT_REVIEW:'SEND_TO_INDEPENDENT_REVIEWER',HUMAN_INSPECTION:'HUMAN_INSPECTION',EXTERNAL_SYSTEM:'USE_EXTERNAL_SYSTEM',UNAVAILABLE:'BLOCKED'}"
          new = "actionMap={APPLICATION_DETERMINISTIC:'RUN_IN_APP',EXTERNAL_AGENT_TOOL:'SEND_TO_TOOL_AGENT',INDEPENDENT_AGENT_REVIEW:'SEND_TO_INDEPENDENT_REVIEWER',HUMAN_INSPECTION:'HUMAN_INSPECTION',EXTERNAL_SYSTEM:'USE_EXTERNAL_SYSTEM',UNAVAILABLE:'BLOCKED'}"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('native actionMap target not found')

          old = "const plan=testExecutionPlan(project),relevant=[12,22,23,24].includes(stage)?plan.items:[];"
          new = "const plan=testExecutionPlan(project),relevant=stage===12?plan.items:stage===22?plan.items.filter(item=>item.testType==='DETERMINISTIC'):stage===23?plan.items.filter(item=>item.testType==='MEANING'):stage===24?plan.items.filter(item=>item.testType==='ADVERSARIAL'):[];"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('stage-specific test routing target not found')
          engine.write_text(text)

          prompt = Path('prompt-engine.js')
          text = prompt.read_text()
          marker = "function contextFor(stage,state,operation,scope={}){const parts=[];"
          addition = "if(stage===3)parts.push(`STAGE 01 ACCEPTED HUMAN-AUTHORITY CONTEXT — USE FOR SOURCE RELEVANCE AND APPLICABILITY\\n${show({acceptedCapture:parseCapturedInputSet(state),acceptedDefinition:{agentData:state?.stages?.[1]?.agentData||state?.stages?.[1]?.acceptedData||{},humanData:state?.stages?.[1]?.humanData||{},derivedData:workflow.deriveStageData(state,1)}})}`);"
          if addition not in text:
              if marker not in text:
                  raise SystemExit('contextFor marker not found')
              text = text.replace(marker, marker + addition, 1)
          prompt.write_text(text)
          PY
          rm .github/workflows/apply-focused-runtime-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js .github/workflows/apply-focused-runtime-fixes.yml
          git commit -m "Fix Stage 03 context and verification routing"
          git push -f origin HEAD:refs/heads/automation/focused-runtime-patch-result
