name: Transient prompt file repair

on:
  push:
    branches:
      - 'fix/spec-conformance-20260903-v2'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-conformance-20260903-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply repair
        run: python3 .repair-prompt-file.py
      - name: Prove repair
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node verify-prompt-semantics.mjs
          node verify-stage01-intake-closure.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
      - name: Commit and remove scaffolding
        run: |
          set -euo pipefail
          rm .repair-prompt-file.py .github/workflows/repair-prompt-file-identity.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add -A
          git commit -m 'Make instruction.txt bytes the single prompt authority'
          git push origin HEAD:fix/spec-conformance-20260903-v2
