name: Workbench current PR77 export
on:
  push:
    branches: [workbench/pr77-current-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -qr source.zip . -x source.zip -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: pr77-current-source
          path: source.zip
          retention-days: 1
