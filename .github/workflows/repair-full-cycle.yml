name: Repair full-cycle Stage 04 fixture
on:
  push:
    branches:
      - finish/closed-loop-live-20260830
    paths:
      - .github/workflows/repair-full-cycle.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/closed-loop-live-20260830
      - name: Bind Stage 04 full-cycle fixture to obligation manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('verify-full-cycle.mjs')
          s=p.read_text()
          pattern=r"data\(4,\{records:\{requirements:\[recordProposal\(schema,'requirements',\{tempKey:'req',overrides:\{.*?\}\}\)\]\}\}\);const reqId=rid\('requirements'\);"
          replacement="""{const obligationManifest=engine.obligationManifest(p);const stage4Requirements=obligationManifest.items.map((item,i)=>recordProposal(schema,'requirements',{tempKey:`req-${i+1}`,overrides:{OBLIGATION:item.text||`Obligation ${i+1}`,REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',USER_INPUT_RELATIONSHIP:item.obligationId,APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'The mapped obligation is satisfied.',INTENDED_VERIFICATION_METHOD:'DETERMINISTIC_AND_INDEPENDENT_CONTENT_REVIEW',EXPECTED_EVIDENCE:'Canonical verification evidence',FAILURE_CONDITION:'The mapped obligation is not satisfied.',SEVERITY:'MAJOR'}}));data(4,{records:{requirements:stage4Requirements}});}const reqId=engine.recordId(engine.recordsForCurrentScope(p,'requirements')[0],'requirements');"""
          ns,n=re.subn(pattern,replacement,s,count=1)
          if n!=1:
              raise SystemExit(f'expected one Stage 04 fixture replacement, got {n}')
          p.write_text(ns)
          PY
          rm .github/workflows/repair-full-cycle.yml
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-full-cycle.mjs .github/workflows/repair-full-cycle.yml
          git commit -m "Bind full-cycle Stage 04 fixture to complete obligation manifest"
          git push origin HEAD:finish/closed-loop-live-20260830
