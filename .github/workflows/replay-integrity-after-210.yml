name: Replay integrity closure after operator recovery
on:
  push:
    branches: [reliability/integrity-authority-after-210-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[integrity-after-210-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/integrity-authority-after-210-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply proved integrity closure without regressing operator recovery
        shell: bash
        run: |
          cp workflow-engine.js /tmp/engine-after-210.js
          git checkout 32202649fb159045cf6dec955c702182167364ca -- project-store.js response-ingestion.js workflow-schema.js workflow-engine.js verify-full-cycle.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          def one(s,old,new,label):
              if s.count(old)!=1: raise SystemExit(f'{label}: expected one anchor, found {s.count(old)}')
              return s.replace(old,new,1)
          pre=Path('/tmp/engine-after-210.js').read_text()
          m=re.search(r"function resolveHumanBlocker\(.*?\n\}\nfunction registerFreshContext",pre,re.S)
          if not m: raise SystemExit('PR210 resolveHumanBlocker function not found')
          human=m.group(0).rsplit('function registerFreshContext',1)[0]
          p=Path('workflow-engine.js');s=p.read_text()
          s=one(s,'function registerFreshContext',human+'function registerFreshContext','restore human blocker resolution')
          s=one(s,'createHumanBlocker,registerFreshContext','createHumanBlocker,resolveHumanBlocker,registerFreshContext','restore blocker export')
          pat=r"function reserveRunBatch\(project,\{stage=project\.activeStage,iterationId=null,candidateId=null,count=10\}=\{\}\)\{.*?\n\}\nfunction registerArtifactBytes"
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('integrity reserveRunBatch not found')
          fn=m.group(0)
          anchor="const iterationScope=scopeForIteration(project,resolvedIteration);\n  const created=[];"
          inject="const iterationScope=scopeForIteration(project,resolvedIteration),stageNumber=Number(stage),existingRuns=records(project,'runs').filter(run=>Number(run.stage)===stageNumber&&String(recordValue(run,'ITERATION_ID')||run.scope?.iterationId||'')===resolvedIteration);\n  if(existingRuns.length){if(existingRuns.length!==count)throw new Error(`The current Stage ${String(stageNumber).padStart(2,'0')} iteration already contains ${existingRuns.length} active run slots; expected exactly ${count}. Resolve the partial or contradictory batch instead of allocating more.`);const existing=existingRuns.map(run=>{const runId=recordId(run,'runs'),contextId=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||''),runCandidate=String(recordValue(run,'CANDIDATE_ID')||run.scope?.candidateId||'');if(runCandidate!==resolvedCandidate)throw new Error(`Existing run ${runId} is bound to the wrong candidate.`);if(String(run.scope?.iterationId||'')!==resolvedIteration||String(run.scope?.candidateId||'')!==resolvedCandidate||String(run.scope?.runId||'')!==runId||String(run.scope?.contextId||'')!==contextId)throw new Error(`Existing run ${runId} has contradictory execution scope.`);const context=records(project,'freshContexts').find(item=>recordId(item,'freshContexts')===contextId&&String(recordValue(item,'ITERATION_ID')||item.scope?.iterationId||'')===resolvedIteration&&isActiveRecord(item));if(!context)throw new Error(`Existing run ${runId} does not resolve to its active fresh-context slot.`);if(String(context.scope?.candidateId||'')!==resolvedCandidate||String(context.scope?.runId||'')!==runId||String(context.scope?.contextId||'')!==contextId)throw new Error(`Existing context ${contextId} has contradictory execution scope.`);return {runId,contextId};});if(new Set(existing.map(item=>item.contextId)).size!==count)throw new Error('The existing run batch does not contain ten distinct active context slots.');return existing;}\n  const created=[];"
          if fn.count(anchor)!=1: raise SystemExit('reserve idempotency insertion anchor mismatch')
          fn=fn.replace(anchor,inject,1).replace('core.STAGES[Number(stage)-1]','core.STAGES[stageNumber-1]').replace('{stage,source:\'APPLICATION_RESERVATION\'','{stage:stageNumber,source:\'APPLICATION_RESERVATION\'').replace("addHistory(project,'RUN_BATCH_RESERVED',{stage,iterationId:","addHistory(project,'RUN_BATCH_RESERVED',{stage:stageNumber,iterationId:")
          s=s[:m.start()]+fn+s[m.end():]
          p.write_text(s)
          p=Path('verify-complete.mjs');s=p.read_text()
          a="const p=project('JOB-CHAIN');p.projectData.requirements.push(record('requirements',4,{OBLIGATION:'Synthetic mandatory requirement'"
          if s.count(a)==1:
              s=s.replace(a,"const p=project('JOB-CHAIN');const req=record('requirements',4,{OBLIGATION:'Synthetic mandatory requirement'",1)
              a2="},'REQ-TEST'));\n  const chains=engine.constructEvidenceChains(p);"
              b2="},'REQ-TEST');req.scope=engine.currentScope(p);p.projectData.requirements.push(req);\n  const chains=engine.constructEvidenceChains(p);"
              if s.count(a2)!=1: raise SystemExit('Stage29 fixture close mismatch')
              s=s.replace(a2,b2,1)
          old="let p=project('JOB-SCOPED-ACCEPTED-REFINEMENT'),stage=11;p.job.CURRENT_ITERATION='ITERATION-REFINE';\n const slots=engine.reserveRunBatch(p,{stage,iterationId:'ITERATION-REFINE',candidateId:'CANDIDATE-REFINE',count:10});"
          new="let p=project('JOB-SCOPED-ACCEPTED-REFINEMENT'),stage=11;const bytes=new TextEncoder().encode('refinement-candidate');engine.registerArtifactBytes(p,{stage:10,artifactId:'ARTIFACT-REFINE',filename:'refine.bin',mediaType:'application/octet-stream',byteSize:bytes.byteLength,sha256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'});const frozen=engine.freezeCandidate(p,{stage:10,artifactIds:['ARTIFACT-REFINE'],operatorLabel:'VERIFY'}),iterationId=engine.recordId(frozen.iteration,'iterations'),candidateId=engine.recordId(frozen.candidate,'candidateFreezes');\n const slots=engine.reserveRunBatch(p,{stage,iterationId,count:10});for(const slot of slots){const run=engine.records(p,'runs').find(r=>engine.recordId(r,'runs')===slot.runId);assert(engine.recordValue(run,'CANDIDATE_ID')===candidateId,'Scoped refinement fixture did not reserve the canonical iteration candidate.');}"
          if s.count(old)==1:s=s.replace(old,new,1)
          setup=" const p=project('JOB-RUN-BATCH-IDEMPOTENT');p.job.CURRENT_ITERATION='ITERATION-IDEMPOTENT';"
          canonical=" const p=project('JOB-RUN-BATCH-IDEMPOTENT');const bytes=new TextEncoder().encode('idempotent-candidate');engine.registerArtifactBytes(p,{stage:10,artifactId:'ARTIFACT-IDEMPOTENT',filename:'idempotent.bin',mediaType:'application/octet-stream',byteSize:bytes.byteLength,sha256:'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'});const frozen=engine.freezeCandidate(p,{stage:10,artifactIds:['ARTIFACT-IDEMPOTENT'],operatorLabel:'VERIFY'}),iterationId=engine.recordId(frozen.iteration,'iterations'),candidateId=engine.recordId(frozen.candidate,'candidateFreezes');"
          if s.count(setup)!=1: raise SystemExit('idempotency fixture setup mismatch')
          s=s.replace(setup,canonical,1)
          literal="{stage:17,iterationId:'ITERATION-IDEMPOTENT',candidateId:'CANDIDATE-IDEMPOTENT',count:10}"
          if s.count(literal)!=3: raise SystemExit(f'idempotency call count mismatch: {s.count(literal)}')
          s=s.replace(literal,"{stage:17,iterationId,candidateId,count:10}")
          p.write_text(s)
          PY
          rm -f .github/workflows/replay-integrity-after-210.yml
      - name: Run complete deterministic acceptance
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node verify-hash.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit exact passing tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close integrity and authority gaps after operator recovery [integrity-after-210-complete]"
          git push origin HEAD:reliability/integrity-authority-after-210-20260826
