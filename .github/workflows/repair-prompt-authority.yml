name: Repair prompt authority marker

on:
  push:
    branches:
      - fix/monotonic-zero-loss-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal prompt and stage-read corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('prompt-engine.js')
          text=p.read_text(encoding='utf-8')
          replacements=[
            ('"1":"Perform complete human-authority intake only. This is an actual conversational intake, not a JSON-form-filling exercise.', '"1":"Stage 01 is the first semantic reader of the complete human request and every accessible supplied artifact. Do not assume any prior semantic intake or extraction occurred before this stage. Perform complete human-authority intake only. This is an actual conversational intake, not a JSON-form-filling exercise.'),
            ('Never invent a source and do not perform Stage 03 source extraction or Stage 04 requirement compilation.', 'Do not stop at the first plausible source. Repeat the source-inventory search and applicability review until no new applicable controlling or correctness-relevant external source category is found. Never invent a source and do not perform Stage 03 source extraction or Stage 04 requirement compilation.'),
            ('Every current Stage 02 source must receive current research coverage unless Stage 02 validly established NO_APPLICABLE_EXTERNAL_SOURCE.', 'Every current accepted Stage 02 source has current research coverage unless Stage 02 validly established NO_APPLICABLE_EXTERNAL_SOURCE. Perform a distinct conflict/exception/saturation pass over the complete current source set. Every current Stage 02 source must receive current research coverage unless Stage 02 validly established NO_APPLICABLE_EXTERNAL_SOURCE.'),
            ('APPLICATION OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION','APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION')
          ]
          for old,new in replacements:
              if new not in text:
                  if text.count(old)!=1: raise SystemExit(f'Prompt insertion point count for {old[:45]!r}: {text.count(old)}')
                  text=text.replace(old,new,1)

          start=text.index('const procedureAugmentation=Object.freeze({')
          stop=text.index('const procedures=Object.freeze(',start)
          augment="""const procedureAugmentation=Object.freeze({
            2:'Continue source discovery until no new applicable controlling or correctness-relevant external source category is found. Do not stop at the first plausible source or at an arbitrary source count; source count is a search target, never permission to omit stronger authority or invent weaker sources.',
            5:'Resolve the current job’s requirement set exhaustively. After each semantic correction, repeat the review against the resulting requirement set until every defect class has been resolved or is explicitly blocked; do not review only the changed rows.',
            6:'Use closed-loop-test-spec/1 and TEST_IR when faithfully representable, and explicitly analyze how a defective product could falsely appear compliant.',
            7:'Fixture definition is not execution; the actual observed result and evidence are required.',
            8:'Author the production instruction only from the resolved current requirement set and verification architecture, with complete requirement traceability.',
            9:'If any material correction is required, produce the correction for a new instruction version and then re-review the entire current instruction from the beginning; do not review only the edited clause. Do not execute target production during preflight.',
            10:'The human selects authorized canonical components; the application assigns candidate identity, versions, byte hashes, and immutable freeze state. Do not assign candidate identity.',
            11:'This prompt authorizes exactly one reserved RUN_ID and CONTEXT_ID; do not perform another run.',
            12:'The required verification universe is REQ_ID × RUN_ID × TEST_ID. Never substitute a different executor for the declared route.',
            13:'Compare all ten executions and never discard a run.',
            14:'For each material defect, perform tracing backward through product/output, execution, instruction, requirement, research, source, user input, tool/configuration, artifact, and audit/evidence layers as applicable, and identify the earliest defective layer supported by evidence.',
            15:'Require an actual pre-correction regression execution. Do not claim post-correction success at Stage 15.',
            16:'Correct only the responsible earliest defective layer. Never overwrite a controlled version in place.',
            18:'The application calculates mandatory requirement coverage and all other convergence metrics. Do not set or override those application-derived values.',
            20:'The human authorizes the baseline; the application owns baseline identity and byte hashes. Do not assign baseline identity.',
            21:'Produce the job’s approved deliverable. Generate the complete approved deliverable from the exact approved baseline only.',
            22:'Never claim an unexecuted deterministic check ran.',
            23:'Perform independent meaning/content verification with source evidence where applicable.',
            24:'Perform adversarial verification and do not claim attacks that were not actually executed.',
            25:'Inspect the exact final delivered representation and package.',
            26:'Treat process evidence and product evidence as two separate propositions.',
            27:'Do not set a release state. The application evaluates the complete current evidence.',
            28:'The application performs the authoritative immediate pre-release byte comparison.',
            29:'Establish the complete evidence graph for every mandatory requirement. Do not fabricate a link.',
            30:'Preserve append-only defect and regression history. Do not rewrite history.'
          });
          """
          text=text[:start]+augment+text[stop:]
          old_pf='function procedureFor(stage,operation){return operationSpecial?.[stage]?.[operation]||stageSpecial[stage];}'
          new_pf='function procedureFor(stage,operation){return operationSpecial?.[stage]?.[operation]||procedures[stage];}'
          if new_pf not in text:
              if text.count(old_pf)!=1: raise SystemExit(f'procedureFor boundary count {text.count(old_pf)}')
              text=text.replace(old_pf,new_pf,1)
          p.write_text(text,encoding='utf-8')

          s=Path('workflow-schema.js')
          schema=s.read_text(encoding='utf-8')
          begin=schema.index('const READ_COLLECTIONS=Object.freeze({')
          end=schema.index('const APPLICATION_COLLECTIONS=',begin)
          reads=schema[begin:end]
          stage_reads={
            4:['research','candidateRequirements','sources','sourceConflicts','evidenceRecords'],
            5:['requirements','research','sources','sourceConflicts','candidateRequirements','evidenceRecords'],
            6:['requirements','requirementResolutions','artifacts','sources','research'],
            8:['requirements','tests','failureTests','requirementResolutions','sources','sourceConflicts'],
            9:['instructions','instructionTraces','requirements','tests','failureTests','requirementResolutions','sources','sourceConflicts'],
            18:['iterations','runs','verification','comparisons','defects','regressions','regressionExecutions','blockers','requirements','tests','rootCauses','changes'],
            20:['confirmationRecords','candidateFreezes','iterations','artifacts'],
            23:['products','requirements','tests','sources','research','evidenceRecords'],
            24:['products','requirements','tests','failureTests','regressions','regressionExecutions','defects','sources','research','artifacts','evidenceRecords'],
            26:['products','baselines','requirements','instructions','tests','runs','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','confirmationRecords','defects','blockers','evidenceRecords'],
            27:['requirements','tests','products','baselines','confirmationRecords','deterministicResults','meaningResults','adversarialResults','representationInspections','processAudits','productAudits','regressions','defects','blockers','regressionExecutions','evidenceRecords'],
            29:['sources','requirements','instructions','instructionTraces','runs','products','baselines','tests','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','processAudits','productAudits','regressions','regressionExecutions','releaseRecords','artifactIdentities','evidenceRecords','evidenceChains'],
            30:['defects','rootCauses','regressions','regressionExecutions','changes','baselines','requirements','evidenceRecords']
          }
          for stage,items in stage_reads.items():
              replacement=f"{stage}:["+','.join(repr(x) for x in items)+"]"
              pattern=rf"(?<!\d){stage}:\[[^\]]*\]"
              matches=list(re.finditer(pattern,reads))
              if len(matches)!=1: raise SystemExit(f'Stage {stage} bounded READ_COLLECTIONS match count {len(matches)}')
              reads=reads[:matches[0].start()]+replacement+reads[matches[0].end():]
          schema=schema[:begin]+reads+schema[end:]
          s.write_text(schema,encoding='utf-8')
          PY
          rm -f .github/workflows/repair-stage4-manifest.yml
          rm -f .github/workflows/repair-prompt-authority.yml
      - name: Prove corrected prompt and declared-read authority
        shell: bash
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check workflow-schema.js
          node verify-spec3-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-all-stage-prompts.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-repair-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit accepted correction and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js workflow-schema.js .github/workflows/repair-prompt-authority.yml .github/workflows/repair-stage4-manifest.yml
          git diff --cached --check
          git commit -m "Complete prompt and stage-read authority contracts [repair-applied]"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
