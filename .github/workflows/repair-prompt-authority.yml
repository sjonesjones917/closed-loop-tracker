name: Apply canonical zero-loss corrections

on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831

permissions:
  contents: write

concurrency:
  group: controlled-zero-loss-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal canonical corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('prompt-engine.js')
          text=p.read_text(encoding='utf-8')

          def prepend(stage, phrase):
              global text
              marker=f'"{stage}":"'
              if text.count(marker)!=1:
                  raise SystemExit(f'Expected exactly one stage marker {marker!r}; found {text.count(marker)}')
              start=text.index(marker)+len(marker)
              end=text.index(f',"{stage+1}":"',start) if stage<30 else text.index('});',start)
              if phrase.casefold() in text[start:end].casefold():
                  return
              text=text[:start]+phrase+' '+text[start:]

          prepend(1, 'Stage 01 is the first semantic reader of the complete human request and every accessible supplied artifact. Do not assume any prior semantic intake or extraction occurred before this stage.')
          prepend(2, 'Do not stop at the first plausible source. Repeat the source-inventory search and applicability review until no new applicable controlling or correctness-relevant external source category is found.')
          prepend(3, 'Every current accepted Stage 02 source has current research coverage unless Stage 02 validly established NO_APPLICABLE_EXTERNAL_SOURCE. Perform a distinct conflict/exception/saturation pass over the complete current source set.')
          prepend(5, 'Resolve the current job’s requirement set exhaustively. After every correction, repeat the review against the resulting requirement set.')
          prepend(7, 'Generating an invalid fixture and executing that fixture are separate boundaries. The actual observed result and evidence are required.')
          prepend(8, 'Build the production instruction only from the resolved current requirement set and verification architecture, preserving complete requirement traceability.')
          prepend(9, 'Re-review the entire current instruction from the beginning after any correction. Do not execute target production during preflight.')
          prepend(10, 'The human selects authorized canonical components. Do not assign candidate identity.')
          prepend(11, 'This prompt authorizes exactly one reserved RUN_ID and CONTEXT_ID. Do not perform another run.')
          prepend(12, 'Complete the exact REQ_ID × RUN_ID × TEST_ID verification cell or cells authorized by this prompt. Never substitute a different executor.')
          prepend(13, 'Compare all ten executions. Never discard a run.')
          prepend(14, 'Perform RCA by tracing backward through product/output, execution, instruction, requirement, research, source, user input, tool, and audit to the earliest defective layer.')
          prepend(15, 'Require an actual pre-correction regression execution. Do not claim post-correction success at Stage 15.')
          prepend(16, 'Correct the responsible earliest defective layer. Never overwrite a controlled version in place.')
          prepend(18, 'The application calculates mandatory requirement coverage. Do not set or override those application-derived values.')
          prepend(20, 'The human authorizes the baseline. Do not assign baseline identity.')
          prepend(21, 'Produce the job’s approved deliverable. Generate the complete approved deliverable.')
          prepend(22, 'Never claim an unexecuted deterministic check ran.')
          prepend(23, 'Perform independent meaning/content verification using source evidence where applicable.')
          prepend(24, 'Perform adversarial verification. Do not claim attacks that were not actually executed.')
          prepend(25, 'Inspect the exact final delivered representation and package.')
          prepend(26, 'Reconcile process evidence and product evidence as two separate propositions.')
          prepend(27, 'Do not set a release state. The application evaluates the complete current evidence.')
          prepend(28, 'The application performs the authoritative immediate pre-release byte comparison.')
          prepend(29, 'Preserve and investigate the complete evidence graph for every mandatory requirement. Do not fabricate a link.')
          prepend(30, 'Preserve failures permanently with append-only defect and regression history. Do not rewrite history.')

          old='APPLICATION OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION'
          new='APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION'
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'Stage 04 manifest heading insertion point count: {text.count(old)}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          s=Path('workflow-schema.js')
          schema=s.read_text(encoding='utf-8')
          begin=schema.index('const READ_COLLECTIONS=Object.freeze({')
          end=schema.index('const APPLICATION_COLLECTIONS=',begin)
          reads=schema[begin:end]
          stage_reads={
            4:['research','candidateRequirements','sources','sourceConflicts','evidenceRecords'],
            5:['requirements','research','sources','sourceConflicts','candidateRequirements','evidenceRecords'],
            6:['requirements','requirementResolutions','artifacts','sources','research'],
            8:['requirements','tests','failureTests','requirementResolutions','sources','sourceConflicts'],
            9:['instructions','instructionTraces','requirements','tests','failureTests','requirementResolutions','sources','sourceConflicts'],
            18:['iterations','runs','verification','comparisons','defects','regressions','regressionExecutions','blockers','requirements','tests','rootCauses','changes'],
            20:['confirmationRecords','candidateFreezes','iterations','artifacts'],
            23:['products','requirements','tests','sources','research','evidenceRecords'],
            24:['products','requirements','tests','failureTests','regressions','regressionExecutions','defects','sources','research','artifacts','evidenceRecords'],
            26:['products','baselines','requirements','instructions','tests','runs','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','regressions','regressionExecutions','confirmationRecords','defects','blockers','evidenceRecords'],
            27:['requirements','tests','products','baselines','confirmationRecords','deterministicResults','meaningResults','adversarialResults','representationInspections','processAudits','productAudits','regressions','defects','blockers','regressionExecutions','evidenceRecords'],
            29:['sources','requirements','instructions','instructionTraces','runs','products','baselines','tests','verification','deterministicResults','meaningResults','adversarialResults','representationInspections','processAudits','productAudits','regressions','regressionExecutions','releaseRecords','artifactIdentities','evidenceRecords','evidenceChains'],
            30:['defects','rootCauses','regressions','regressionExecutions','changes','baselines','requirements','evidenceRecords']
          }
          for stage,items in stage_reads.items():
              pattern=rf'(?<!\d){stage}:\[([^\]]*)\]'
              matches=list(re.finditer(pattern,reads))
              if len(matches)!=1:
                  raise SystemExit(f'Stage {stage} bounded READ_COLLECTIONS match count {len(matches)}')
              match=matches[0]
              inner=match.group(1).strip()
              for item in items:
                  if not re.search(rf'["\']{re.escape(item)}["\']',inner):
                      inner+=((',' if inner else '')+repr(item))
              replacement=f'{stage}:[{inner}]'
              reads=reads[:match.start()]+replacement+reads[match.end():]
          schema=schema[:begin]+reads+schema[end:]
          s.write_text(schema,encoding='utf-8')

          e=Path('workflow-engine.js')
          engine=e.read_text(encoding='utf-8')
          bad='plans=testExecutionPlan(project).filter(item=>'
          good='plans=testExecutionPlan(project).items.filter(item=>'
          if good not in engine:
              if engine.count(bad)!=1:
                  raise SystemExit(f'Stage 07 execution-plan repair point count: {engine.count(bad)}')
              engine=engine.replace(bad,good,1)
          e.write_text(engine,encoding='utf-8')
          PY
          rm -f .github/workflows/apply-prompt-repair.yml
          rm -f .github/workflows/repair-prompt-authority.yml
          rm -f .github/workflows/repair-stage4-manifest.yml
          rm -f .repair-*
      - name: Prove canonical corrections before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node verify.mjs
          node verify-spec3-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-one-time-intent-intake.mjs
          node verify-all-stage-prompts.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-repair-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..100}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && break
            sleep 0.1
          done
          PAGE_URL=http://127.0.0.1:4173/ node verify-stage-prompts-complete.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-user-prompt-invariants.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-prompt-semantics.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-semantic-invariant.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit accepted correction and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js workflow-schema.js workflow-engine.js .github/workflows
          git diff --cached --check
          git commit -m "Integrate canonical prompt routing corrections"
          git push origin HEAD:fix/zero-loss-controlled-20260831
