name: Materialize Stage 19 application freeze confirmation
on:
  push:
    branches: [fix/stage19-application-freeze-confirmation-20260830]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage19-application-freeze-confirmation-20260830
      - run: |
          python .github/repair/stage19-freeze-confirmation.py
          rm .github/repair/stage19-freeze-confirmation.py .github/workflows/materialize-stage19-freeze-confirmation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Stage 19 freeze confirmation application-owned' || exit 0
          git push
