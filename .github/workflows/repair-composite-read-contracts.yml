name: Repair composite operation read contracts
on:
  push:
    branches: [fix/monotonic-zero-loss-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct composite operation reads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-schema.js')
          text=p.read_text(encoding='utf-8')
          replacements={
            "FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions']":"FREEZE:Object.freeze({readCollections:['changes','candidateFreezes','iterations','tests','regressions','regressionExecutions','instructions','requirements','artifacts']",
            "CONFIRM_FREEZE:Object.freeze({readCollections:['convergenceRecords','candidateFreezes','iterations']":"CONFIRM_FREEZE:Object.freeze({readCollections:['convergenceRecords','candidateFreezes','iterations','requirements','tests','artifacts']",
            "REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs']":"REGRESSION_VERIFY:Object.freeze({readCollections:['regressions','regressionExecutions','runs','tests','requirements','artifacts']",
            "CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','tests','regressions','regressionExecutions','candidateFreezes','defects','blockers','evidenceRecords']":"CONFIRM:Object.freeze({readCollections:['runs','verification','comparisons','tests','regressions','regressionExecutions','candidateFreezes','defects','blockers','evidenceRecords','requirements']"
          }
          for old,new in replacements.items():
              if new in text:
                  continue
              if text.count(old)!=1:
                  raise SystemExit(f'composite read replacement count {text.count(old)} for {old[:50]}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          node --check workflow-schema.js
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-opread-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..100}; do curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && break; sleep 0.1; done
          PAGE_URL=http://127.0.0.1:4173/ node verify-stage-prompts-complete.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit accepted correction and remove repair runners
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-composite-read-contracts.yml .github/workflows/repair-prompt-authority.yml .github/workflows/repair-stage4-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js .github/workflows/repair-composite-read-contracts.yml .github/workflows/repair-prompt-authority.yml .github/workflows/repair-stage4-authority.yml
          git diff --cached --check
          git commit -m "Complete composite operation read contracts"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
