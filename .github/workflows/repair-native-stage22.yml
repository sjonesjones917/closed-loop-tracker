name: Repair native Stage 22 gate

on:
  push:
    branches: [closed-loop-test-ir-minimal]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closed-loop-test-ir-minimal
          fetch-depth: 0
      - name: Apply repair
        run: python3 .github/repair_native_stage22.py
      - name: Run focused verification
        run: |
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node verify-complete.mjs
          node verify-test-runtime.mjs
          node verify-prompt-semantics.mjs
          node verify-definition-of-done.mjs
      - name: Remove temporary repair files and commit
        run: |
          git rm .github/workflows/repair-native-stage22.yml .github/repair_native_stage22.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js verify-complete.mjs
          git commit -m "Allow native-only Stage 22 without external response"
          git push origin HEAD:closed-loop-test-ir-minimal
