name: Apply human inspection authority repair
on:
  push:
    branches: [fix/human-inspection-authority-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js'); s=p.read_text()
          anchor="function evidenceReferences(result){"
          insert="""function recordHumanInspectionEvidence(project,{testId,observation,evidenceDescription='',operatorLabel='HUMAN_OPERATOR'}={}){\n  ensureShape(project);const tid=String(testId||'').trim(),text=String(observation||'').trim(),description=String(evidenceDescription||'').trim();if(!tid)throw new Error('A current HUMAN_INSPECTION test is required.');if(!text)throw new Error('Record the actual human observation before continuing.');const test=recordsForCurrentScope(project,'tests').find(record=>recordId(record,'tests')===tid);if(!test||upper(recordValue(test,'EXECUTION_MODE'))!=='HUMAN_INSPECTION')throw new Error('The selected test is not a current HUMAN_INSPECTION test.');const plan=testExecutionPlan(project).items.find(item=>item.testId===tid);if(!plan?.executableNow)throw new Error(plan?.blockingReason||'The human inspection is not currently executable.');const payload={testId:tid,requirementId:testRequirementId(test),observation:text,evidenceDescription:description||'Human-owned observation recorded directly by the operator.',operatorLabel:String(operatorLabel||'HUMAN_OPERATOR'),identityAssurance:'SELF_ASSERTED',stage:Number(project.activeStage||0),scope:currentScope(project)};const identity=hash.sha256Value(payload),existing=recordsForCurrentScope(project,'evidenceRecords').find(record=>record?.source==='HUMAN_OBSERVATION'&&String(record?.humanInspectionTestId||'')===tid&&String(recordValue(record,'SHA256')||'')===identity);if(existing)return existing;const evidence=commandRecord(project,'evidenceRecords',{APPLICATION_EVIDENCE_KIND:'HUMAN_OBSERVATION',APPLICATION_EVIDENCE_DESCRIPTION:payload.evidenceDescription,APPLICATION_EVIDENCE_CONTENT:JSON.stringify(payload),SHA256:identity,STATUS:'CURRENT'},{stage:Number(project.activeStage||0),source:'HUMAN_OBSERVATION'});evidence.humanInspectionTestId=tid;evidence.humanAuthority={operatorLabel:payload.operatorLabel,identityAssurance:'SELF_ASSERTED'};refreshRecordHashes(evidence,'evidenceRecords');addHistory(project,'HUMAN_INSPECTION_OBSERVATION_RECORDED',{stage:Number(project.activeStage||0),testId:tid,evidenceId:recordId(evidence,'evidenceRecords'),operatorLabel:payload.operatorLabel,identityAssurance:'SELF_ASSERTED'});recalculate(project);return evidence;\n}\n\n"""
          if anchor not in s: raise SystemExit('evidenceReferences anchor not found')
          s=s.replace(anchor,insert+anchor,1)
          old="const ids=evidenceReferences(result),evidence=ids.map(id=>records(project,'evidenceRecords').find(x=>recordId(x,'evidenceRecords')===id)).filter(Boolean),nativeEvidence=evidence.filter(x=>x?.source==='APPLICATION_TEST_RUNTIME')"
          new="const ids=evidenceReferences(result),referencedEvidence=ids.map(id=>records(project,'evidenceRecords').find(x=>recordId(x,'evidenceRecords')===id)).filter(Boolean),mode=upper(recordValue(test,'EXECUTION_MODE')||''),testId=String(recordId(test,'tests')||''),humanEvidence=mode==='HUMAN_INSPECTION'?recordsForCurrentScope(project,'evidenceRecords').filter(x=>x?.source==='HUMAN_OBSERVATION'&&String(x?.humanInspectionTestId||'')===testId):[],evidence=[...new Map([...referencedEvidence,...humanEvidence].map(x=>[recordId(x,'evidenceRecords'),x])).values()],nativeEvidence=evidence.filter(x=>x?.source==='APPLICATION_TEST_RUNTIME')"
          if old not in s: raise SystemExit('evidence evaluator evidence anchor not found')
          s=s.replace(old,new,1)
          old=",mode=upper(recordValue(test,'EXECUTION_MODE')||''),type=upper(recordValue(test,'TEST_TYPE')||'')"
          new=",type=upper(recordValue(test,'TEST_TYPE')||'')"
          if old not in s: raise SystemExit('duplicate mode anchor not found')
          s=s.replace(old,new,1)
          old="if(mode==='HUMAN_INSPECTION'){requiredEvidenceClasses.push('HUMAN_OBSERVATION');const human=evidence.some(e=>/HUMAN/.test(upper(recordValue(e,'AUTHORITY_TYPE')||recordValue(e,'KIND'))));if(!human)reasons.push('Human inspection requires evidence attributable to an actual human observation.');}"
          new="if(mode==='HUMAN_INSPECTION'){requiredEvidenceClasses.push('HUMAN_OBSERVATION');const human=humanEvidence.some(e=>e?.source==='HUMAN_OBSERVATION'&&String(e?.humanAuthority?.identityAssurance||'')==='SELF_ASSERTED'&&String(recordValue(e,'APPLICATION_EVIDENCE_CONTENT')||'').trim());if(!human)reasons.push('Human inspection requires an explicit human-owned observation recorded through the application; an agent-labelled HUMAN evidence claim is insufficient.');}"
          if old not in s: raise SystemExit('human evaluator anchor not found')
          s=s.replace(old,new,1)
          old="presentEvidenceIds:ids,verifiedArtifactIds"
          new="presentEvidenceIds:[...new Set(evidence.map(e=>recordId(e,'evidenceRecords')).filter(Boolean))],verifiedArtifactIds"
          if old not in s: raise SystemExit('present evidence anchor not found')
          s=s.replace(old,new,1)
          old="if(item.operatorAction==='HUMAN_INSPECTION')return actionEnvelope(project,stage,{...common,actionType:'HUMAN_INSPECTION',heading:'Human inspection is required',explanation:'Perform the exact inspection and preserve an explicit human-owned observation. An AI assertion that a human inspected the product is insufficient.',primaryButton:'Open inspection instructions'});"
          new="if(item.operatorAction==='HUMAN_INSPECTION'){const recorded=recordsForCurrentScope(project,'evidenceRecords').find(e=>e?.source==='HUMAN_OBSERVATION'&&String(e?.humanInspectionTestId||'')===item.testId);if(recorded)return actionEnvelope(project,stage,{...common,actionType:'PASTE_FINAL_JSON',heading:'Human observation recorded — return the structured result',explanation:'The application has preserved the human-owned observation for '+item.testId+'. The current stage executor may now use that exact evidence to return the contracted final JSON; it must not invent, replace, or relabel the human observation.',primaryButton:'Paste final JSON'});return actionEnvelope(project,stage,{...common,actionType:'HUMAN_INSPECTION',heading:'Human inspection is required',explanation:'Perform the exact inspection for '+item.testId+' and record the observation directly in the application. An AI assertion that a human inspected the product is insufficient.',primaryButton:'Record human observation',testId:item.testId,requirementId:item.requirementId,requiredEvidenceDescription:item.returnRequirements?.requiredEvidenceDescription||''});}"
          if old not in s: raise SystemExit('human operational action anchor not found')
          s=s.replace(old,new,1)
          old="recordHumanDecision,invalidateAcceptedResponse"
          new="recordHumanDecision,recordHumanInspectionEvidence,invalidateAcceptedResponse"
          if old not in s: raise SystemExit('engine export anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('app-core.js'); s=p.read_text()
          old="action.actionType==='BUILD_EVIDENCE_CHAINS'?`<button class=\"primary\" id=\"build-evidence-chains\" type=\"button\">${esc(action.primaryButton)}</button>`:['AI_REVIEW'"
          new="action.actionType==='BUILD_EVIDENCE_CHAINS'?`<button class=\"primary\" id=\"build-evidence-chains\" type=\"button\">${esc(action.primaryButton)}</button>`:action.actionType==='HUMAN_INSPECTION'?`<button class=\"primary\" id=\"record-human-inspection\" type=\"button\">${esc(action.primaryButton)}</button>`:['AI_REVIEW'"
          if old not in s: raise SystemExit('human action button anchor not found')
          s=s.replace(old,new,1)
          old="return `<div class=\"panel next-action-panel\" id=\"next-required-action\" tabindex=\"-1\"><h2"
          new="const humanCapture=action.actionType==='HUMAN_INSPECTION'?`<div class=\"field full\"><label>Actual human observation</label><textarea id=\"human-inspection-observation\"></textarea><span class=\"help\">Record only what the human actually observed for ${esc(action.testId||'the current inspection')}. Do not paste an AI statement here.</span></div><div class=\"field full\"><label>Observation evidence / location</label><textarea id=\"human-inspection-evidence\"></textarea></div>`:'';return `<div class=\"panel next-action-panel\" id=\"next-required-action\" tabindex=\"-1\"><h2"
          if old not in s: raise SystemExit('next action markup return anchor not found')
          s=s.replace(old,new,1)
          old="${send}${withhold}${returns}<div class=\"record-rows action-certainty\">"
          new="${send}${withhold}${returns}${humanCapture}<div class=\"record-rows action-certainty\">"
          if old not in s: raise SystemExit('human capture insertion anchor not found')
          s=s.replace(old,new,1)
          wire="if($('#build-evidence-chains'))$('#build-evidence-chains').onclick=async()=>{try{if(Number(current.activeStage)!==29)throw new Error('Evidence-chain construction is available only at Stage 29.');const next=clone(current);engine.constructEvidenceChains(next);await persistReplacement(next);announce('evidence chains constructed');render();requestAnimationFrame(()=>$('#next-required-action')?.focus());}catch(error){announce('evidence-chain construction blocked');alert(error.message||error);}};"
          add=wire+"if($('#record-human-inspection'))$('#record-human-inspection').onclick=async()=>{try{const action=currentNextAction(),observation=$('#human-inspection-observation')?.value.trim()||'',evidenceDescription=$('#human-inspection-evidence')?.value.trim()||'';if(action.actionType!=='HUMAN_INSPECTION'||!action.testId)throw new Error('No current human-inspection test is selected.');if(!observation){announce('human inspection observation required');$('#human-inspection-observation')?.focus();return;}const next=clone(current);engine.recordHumanInspectionEvidence(next,{testId:action.testId,observation,evidenceDescription,operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});await persistReplacement(next);announce('human inspection observation recorded');render();requestAnimationFrame(()=>$('#next-required-action')?.focus());}catch(error){announce('human inspection evidence rejected');alert(error.message||error);}};"
          if wire not in s: raise SystemExit('wire evidence chain anchor not found')
          s=s.replace(wire,add,1)
          p.write_text(s)

          p=Path('prompt-engine.js'); s=p.read_text()
          old="const open=safe(state?.projectData?.blockers)"
          new="const humanInspectionEvidence=workflow.recordsForCurrentScope(state,'evidenceRecords').filter(record=>record?.source==='HUMAN_OBSERVATION');if(humanInspectionEvidence.length)parts.push(`APPLICATION-RECORDED HUMAN INSPECTION EVIDENCE — DO NOT INVENT OR REPLACE\\n${show(humanInspectionEvidence.map(record=>({evidenceId:recordId(record,'evidenceRecords'),testId:record.humanInspectionTestId||null,authority:record.humanAuthority||{},content:recordValue(record,'APPLICATION_EVIDENCE_CONTENT')||null,sha256:recordValue(record,'SHA256')||record.sha256||null})))}`);const open=safe(state?.projectData?.blockers)"
          if old not in s: raise SystemExit('prompt human evidence anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-engine.js app-core.js prompt-engine.js
          git commit -m "Make human inspection evidence genuinely human-owned"
          git push