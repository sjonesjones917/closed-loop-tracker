name: Align repository description with v3
on:
  push:
    branches: [fix/deployment-proof-v3-20260830]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deployment-proof-v3-20260830
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('Project schema: `closed-loop-project/2`.','Project schema: `closed-loop-project/3`.')
          s=s.replace('Response schema: `closed-loop-stage-response/2`.','Response schema: `closed-loop-stage-response/3`.')
          s=s.replace('The deterministic legacy migration is `human-project/30` → `closed-loop-project/2`.','The deterministic migration chain is `human-project/30` → `closed-loop-project/2` → `closed-loop-project/3`. Current `/2` raw responses remain historical and cannot satisfy a current `/3` prompt without a new current response.')
          s=s.replace('Prompt content, context selection, and prompt identity | `prompt-engine.js` |','Prompt content, bounded context selection, withheld-context rules, blind aliases, and prompt identity | `prompt-engine.js` |')
          s=s.replace('Derived values, current-scope selection, gates, invalidation, and release logic | `workflow-engine.js` |','Derived values, current-scope selection, routing, independence, evidence sufficiency, contradictions, stability, gates, invalidation, convergence, and release logic | `workflow-engine.js` |')
          s=s.replace('Projects, revisions, artifact bytes, migration, import/export | `project-store.js` |','Projects, revisions, artifact bytes, migration, integrity, import/export, artifact download, and execution-package construction | `project-store.js` |')
          if 'Deterministic Test IR validation support' not in s:
              marker='| Canonical serialization and SHA-256 | `hash.js` |\n'
              s=s.replace(marker,marker+'| Deterministic Test IR validation support, registered operations, capabilities, and runtime coordination | `test-runtime.js` |\n| Isolated declarative Test IR execution | `test-worker.js` |\n')
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-readme-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/apply-readme-v3.yml
          git commit -m "Align README with v3 application"
          git push origin HEAD:fix/deployment-proof-v3-20260830
