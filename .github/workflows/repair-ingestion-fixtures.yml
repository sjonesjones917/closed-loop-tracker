name: Repair ingestion fixtures and self-remove
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
concurrency:
  group: repair-ingestion-fixtures-once
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.head_commit.message == 'Run one-time ingestion fixture repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - name: Bind Stage 01 and Stage 04 fixtures to current manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          t=p.read_text()

          old="p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,disposition:'incorporated into the job definition',extractedStatements:[{statementKey:'S'+String(i+1),text:'Captured '+u.label,statementClass:'FACT'}]}))});"
          new="p.stages[1].agentData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:intake.inputVersion,manifestSha256:intake.manifestSha256,units:intake.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||('Captured '+u.label),statementClass:'FACT'}]}))});"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('prepareStage4Upstream Stage 01 fixture anchor not found')

          needle="if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);"
          stage1="if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);\n  if(stage===1){const m=promptRecord.contextManifest.intakeCoverageManifest;stageData.EXACT_DELIVERABLE_REQUESTED='Verified deliverable';stageData.ASSUMPTIONS='NONE';stageData.UNKNOWN_INFORMATION='NONE';stageData.INPUT_SET_CONTENTS=JSON.stringify({schema:'closed-loop-stage01-capture/1',inputVersion:m.inputVersion,manifestSha256:m.manifestSha256,units:m.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'incorporated into the job definition',reason:'',extractedStatements:[{statementKey:'S'+String(i+1),text:u.rawValueText||u.label,statementClass:'FACT'}]}))});}"
          if stage1 not in t:
              if needle not in t: raise SystemExit('validEnvelope stageData anchor not found')
              t=t.replace(needle,stage1,1)

          anchor="records[collection]=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];"
          stage4="records[collection]=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];\n    if(stage===4&&collection==='requirements'){const obligationManifest=promptRecord.contextManifest.obligationManifest;records.requirements=(obligationManifest.items||[]).map((item,index)=>{const requirementFields={};for(const name of def.required){if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)requirementFields[name]=safeValue(name);}requirementFields.USER_INPUT_RELATIONSHIP=item.obligationId;return {tempKey:'requirement-'+String(index+1),fields:requirementFields,relationships:{},evidenceRefs:['evidence-1']};});}"
          if stage4 not in t:
              if anchor not in t: raise SystemExit('Stage 04 requirement fixture anchor not found')
              t=t.replace(anchor,stage4,1)

          p.write_text(t)
          PY
          node --check verify-ingestion.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add verify-ingestion.mjs
          git rm .github/workflows/repair-ingestion-fixtures.yml
          git commit -m "Bind ingestion fixtures to current accounting manifests"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
