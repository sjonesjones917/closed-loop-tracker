name: Prepare Stage 01B current-main governance

on:
  push:
    branches:
      - controller/stage01-reachable-source-755e

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller/stage01-reachable-source-755e
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate and prove Stage 01 governance
        run: node .controller/prepare-stage01b.mjs
      - name: Commit generated Stage 01B state
        run: |
          set -euo pipefail
          rm -f .controller/prepare-stage01b.mjs .github/workflows/prepare-stage01b-current-main.yml
          rmdir .controller 2>/dev/null || true
          git config user.name closed-loop-controller
          git config user.email closed-loop-controller@users.noreply.github.com
          git add specification verification .controller .github/workflows/prepare-stage01b-current-main.yml
          git commit -m "Stage 01B: regenerate governance on exact current main"
          git push origin HEAD:controller/stage01-reachable-source-755e
