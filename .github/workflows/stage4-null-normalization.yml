name: Normalize absent Stage 01 intake values
on:
  push:
    branches: [fix/stage4-canonical-intent-capture]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Normalize absent intake fields for canonical hashing')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/stage4-canonical-intent-capture
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize undefined human intake fields to null
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="const payload=Object.fromEntries((globalThis.closedLoopWorkflowSchema?.HUMAN_INTAKE_FIELDS||[]).map(name=>[name,clone(project.job[name])]))"
          new="const payload=Object.fromEntries((globalThis.closedLoopWorkflowSchema?.HUMAN_INTAKE_FIELDS||[]).map(name=>[name,project.job[name]===undefined?null:clone(project.job[name])]))"
          if old not in s: raise SystemExit('input payload normalization anchor missing')
          p.write_text(s.replace(old,new,1))
          q=Path('verify-stage4-intent-reuse.mjs')
          t=q.read_text()
          anchor="const p=core.createBlankState('JOB-STAGE4-REUSE');\n"
          addition=anchor+"delete p.job.DESIRED_SOURCE_COUNT;\nengine.ensureShape(p);\nengine.currentIntakeCoverageManifest(p);\n"
          if 'delete p.job.DESIRED_SOURCE_COUNT' not in t:
              if anchor not in t: raise SystemExit('focused regression anchor missing')
              t=t.replace(anchor,addition,1)
          q.write_text(t)
          PY
          rm -f .github/workflows/stage4-null-normalization.yml
      - name: Verify sparse intake and Stage 04 reuse
        run: |
          node --check workflow-engine.js
          node --check verify-stage4-intent-reuse.mjs
          node verify-stage4-intent-reuse.mjs
      - name: Commit fix
        run: |
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize absent intake fields for canonical hashing"
          git push origin HEAD:fix/stage4-canonical-intent-capture
