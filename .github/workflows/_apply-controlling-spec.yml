name: Apply controlling specification repair
on:
  push:
    branches: [fix/controlling-spec-20260830-0716]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-controlling-spec-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-20260830-0716
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact repair
        run: |
          python3 .repair-controlling-spec.py
          python3 .repair-post.py
      - name: Syntax workbook
        run: node --check workbook.js
      - name: Syntax schema
        run: node --check workflow-schema.js
      - name: Syntax runtime
        run: node --check test-runtime.js
      - name: Syntax worker
        run: node --check test-worker.js
      - name: Syntax engine
        run: node --check workflow-engine.js
      - name: Syntax prompt
        run: node --check prompt-engine.js
      - name: Syntax ingestion
        run: node --check response-ingestion.js
      - name: Syntax store
        run: node --check project-store.js
      - name: Syntax app
        run: node --check app-core.js
      - name: Syntax controlling verifier
        run: node --check verify-controlling-spec.mjs
      - name: Focused controlling-spec proof
        run: node verify-controlling-spec.mjs
      - name: Preserve exact semantic failure
        if: failure()
        run: |
          node verify-controlling-spec.mjs > repair-failure.log 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repair-failure.log
          git commit -m "Record controlling-spec repair diagnostic" || true
          git push origin HEAD:fix/controlling-spec-20260830-0716 || true
      - name: Remove one-time scaffolding before repository proofs
        run: rm -f .repair-controlling-spec.py .repair-post.py .github/workflows/_apply-controlling-spec.yml repair-failure.log runtime-failure.log
      - name: Build architecture proof
        run: node build-test-project.mjs
      - name: Existing Test IR runtime proof
        run: node verify-test-runtime.mjs
      - name: Preserve exact Test IR runtime failure
        if: failure()
        run: |
          node verify-test-runtime.mjs > runtime-failure.log 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime-failure.log
          git commit -m "Record Test IR repair diagnostic" || true
          git push origin HEAD:fix/controlling-spec-20260830-0716 || true
      - name: Canonical hash proof
        run: node verify-hash.mjs
      - name: Existing workflow proof
        run: node verify.mjs
      - name: Existing ingestion proof
        run: node verify-ingestion.mjs
      - name: Existing prompt semantics proof
        run: node verify-prompt-semantics.mjs
      - name: Commit verified repair
        run: |
          rm -f runtime-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Implement controlling /3 reliability specification"
          git push origin HEAD:fix/controlling-spec-20260830-0716
