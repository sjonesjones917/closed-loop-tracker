name: Finalize durable Stage 04 intent accounting
on:
  push:
    branches: [fix/stage4-durable-accounting-final-20260830]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-durable-accounting-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the deterministic Stage 01 to Stage 04 ledger repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 0da8554368bf233767cf2e8a4e90660a3b07d0c3
          git checkout 0da8554368bf233767cf2e8a4e90660a3b07d0c3 -- \
            app-core.js \
            build-test-project.mjs \
            prompt-engine.js \
            response-ingestion.js \
            verify-complete.mjs \
            verify-full-cycle.mjs \
            verify-ingestion.mjs \
            verify-one-time-intent-intake.mjs \
            verify-prompt-semantics.mjs \
            verify-test-runtime.mjs \
            verify.mjs \
            workbook.js \
            workflow-engine.js \
            workflow-schema.js

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new))

          # The original intake file is not a later-stage handoff item. Later stages consume canonical state.
          replace_once(
              'workflow-engine.js',
              "  if(stage>1)withhold.set('original Stage 01 intent file',{artifactIdOrCategory:'original Stage 01 intent file',reason:'One-time intake only. Later stages use the canonical intentStatements ledger and must not request, attach, resend, reopen, or rely on the original file.'});\n",
              ''
          )

          # Stage 01 must capture all relevant human authority from available bytes, not a minimal summary.
          replace_once(
              'prompt-engine.js',
              'If their actual contents are available in the current executing context, read only the minimum portions needed to identify the requested objective or deliverable or to resolve a genuinely Stage-01-blocking ambiguity; do not ask the human to re-enter facts that are already present in those materials.',
              'If their actual contents are available in the current executing context, inspect them deeply enough to capture every human-authority statement relevant to defining the job while staying inside the Stage 01 boundary; do not atomize requirements or perform later-stage work, and do not ask the human to re-enter facts that are already present in those materials.'
          )

          # Stage 04 receives the complete accepted Stage 01 job definition in addition to the canonical statement ledger.
          replace_once(
              'prompt-engine.js',
              "CURRENT AGENT-NORMALIZED DELIVERABLE (when already accepted; otherwise UNKNOWN):\n${show(j.EXACT_DELIVERABLE_REQUESTED)}\n\n${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY",
              "CURRENT AGENT-NORMALIZED DELIVERABLE (when already accepted; otherwise UNKNOWN):\n${show(j.EXACT_DELIVERABLE_REQUESTED)}\n\n${stage===4?`ACCEPTED STAGE 01 JOB DEFINITION — CURRENT CANONICAL VALUES; DO NOT ASK THE HUMAN TO RESEND THEM\nASSUMPTIONS:\n${show(j.ASSUMPTIONS)}\n\nUNKNOWN_INFORMATION:\n${show(j.UNKNOWN_INFORMATION)}\n\nINPUT_SET_CONTENTS:\n${show(j.INPUT_SET_CONTENTS)}`:''}\n\n${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION — CLARIFY AND NORMALIZE ONLY"
          )

          # Runtime regressions: Stage 04 sends and withholds no original-file artifact.
          replace_once(
              'verify-test-runtime.mjs',
              "assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,1);assert.equal(stage4Handoff.withhold[0]?.artifactIdOrCategory,'original Stage 01 intent file');assert.equal(stage4Handoff.expectBack.length,0);",
              "assert.equal(stage4Handoff.send.length,0,'Stage 04 must not infer an outgoing byte handoff from a filename in supplied-material inventory.');assert.equal(stage4Handoff.withhold.length,0,'Stage 04 must not turn the original intent file into another handoff item.');assert.equal(stage4Handoff.expectBack.length,0);"
          )
          replace_once(
              'verify-one-time-intent-intake.mjs',
              "assert(handoff.withhold.some(item=>item.artifactIdOrCategory==='original Stage 01 intent file'),'Stage 04 does not explicitly withhold the original intent file.');",
              "assert(handoff.withhold.length===0,'Stage 04 still turns the original intent file into a later-stage handoff item.');"
          )

          # Existing complete-suite fixture must model the canonical statement ledger and current next-action wording.
          replace_once(
              'verify-complete.mjs',
              "  Object.assign(p.job,{EXACT_DELIVERABLE_REQUESTED:'CANONICAL-STAGE-01-DELIVERABLE',ASSUMPTIONS:'CANONICAL-STAGE-01-ASSUMPTION',UNKNOWN_INFORMATION:'CANONICAL-STAGE-01-UNKNOWN',INPUT_SET_CONTENTS:'CANONICAL-STAGE-01-INTENT-CAPTURE'});\n  const candidate=record('candidateRequirements',3,{SOURCE_LOCATION:'accepted Stage 03 research',CANDIDATE_OBLIGATION:'CANONICAL-STAGE-03-OBLIGATION',CLASSIFICATION:'MANDATORY',APPLICABILITY:'APPLICABLE',EVIDENCE:'EVIDENCE-STAGE-03'},'CANDIDATE-REQ-STAGE04');",
              "  Object.assign(p.job,{EXACT_DELIVERABLE_REQUESTED:'CANONICAL-STAGE-01-DELIVERABLE',ASSUMPTIONS:'CANONICAL-STAGE-01-ASSUMPTION',UNKNOWN_INFORMATION:'CANONICAL-STAGE-01-UNKNOWN',INPUT_SET_CONTENTS:'CANONICAL-STAGE-01-INTENT-CAPTURE'});\n  const intent=record('intentStatements',1,{SOURCE_MATERIAL:'design-input.pdf',SOURCE_LOCATION:'page 1',EXACT_STATEMENT:'CANONICAL-STAGE-01-INTENT-STATEMENT',STATEMENT_KIND:'REQUIREMENT',REQUIREMENT_RELEVANCE:'REQUIREMENT',NORMATIVE_FORCE:'MUST',DEPENDENCIES:'NONE',EXCEPTIONS:'NONE',CONFLICTS:'NONE',NOTES:'',STATUS:'ACTIVE'},'INTENT-STATEMENT-STAGE04');intent.scope={inputVersion:p.job.CURRENT_INPUT_VERSION};p.projectData.intentStatements.push(intent);\n  const candidate=record('candidateRequirements',3,{SOURCE_LOCATION:'INTENT-STATEMENT-STAGE04',CANDIDATE_OBLIGATION:'CANONICAL-STAGE-03-OBLIGATION',CLASSIFICATION:'MANDATORY',APPLICABILITY:'APPLICABLE',EVIDENCE:'EVIDENCE-STAGE-03'},'CANDIDATE-REQ-STAGE04');"
          )
          replace_once(
              'verify-complete.mjs',
              "  assert(next.includes('accepted Stage 01 job definition')&&next.includes('accepted Stage 03 findings'),'Stage 04 next action does not identify the canonical input sources it reuses.');",
              "  assert(next.includes('canonical Stage 01 intent-statement ledger')&&next.includes('Do not attach, resend, reopen, or otherwise reuse the original intent file.'),'Stage 04 next action does not identify canonical intent reuse.');"
          )

          # Remove the obsolete self-modifying job from the one permanent Pages workflow.
          pages_path = Path('.github/workflows/pages.yml')
          pages = pages_path.read_text()
          pages, removed = re.subn(r'\n  materialize-stage4-intent-reuse:[\s\S]*?(?=\n  publish-status:)', '', pages)
          if removed != 1:
              raise SystemExit(f'pages.yml: expected one obsolete materializer job, removed {removed}')
          if 'verify-one-time-intent-intake.mjs' not in pages:
              pages = pages.replace(
                  '          node --check verify-test-runtime.mjs\n',
                  '          node --check verify-test-runtime.mjs\n          node --check verify-one-time-intent-intake.mjs\n',
                  1
              )
              pages = pages.replace(
                  '          node verify-complete.mjs\n',
                  '          node verify-complete.mjs\n          node verify-one-time-intent-intake.mjs\n',
                  1
              )
              pages = pages.replace(
                  'node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs',
                  'node verify-ingestion.mjs && node verify-complete.mjs && node verify-one-time-intent-intake.mjs && node verify-full-cycle.mjs',
                  1
              )
          if 'materialize-stage4-intent-reuse:' in pages:
              raise SystemExit('pages.yml: obsolete Stage 04 materializer remains')
          pages_path.write_text(pages)

          # Refresh the one shared runtime/cache identity after runtime byte changes.
          runtime = ['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest = ''
          for filename in runtime:
              data = Path(filename).read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              manifest += f'{filename}:{blob}\n'
          token = 'runtime-' + hashlib.sha256(manifest.encode()).hexdigest()[:16]
          index_path = Path('index.html')
          index = index_path.read_text()
          index, count = re.subn(r'runtime-[0-9a-f]{16}', token, index)
          if count != 8:
              raise SystemExit(f'index.html: expected 8 runtime tokens, replaced {count}')
          index_path.write_text(index)
          print(token)
          PY

      - name: Prove the repaired one-time intake and Stage 04 path
        shell: bash
        run: |
          set -euo pipefail
          for file in app-core.js workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js verify-one-time-intent-intake.mjs verify-test-runtime.mjs verify-complete.mjs verify-full-cycle.mjs verify-ingestion.mjs verify-prompt-semantics.mjs verify.mjs; do
            node --check "$file"
          done
          node build-test-project.mjs
          node verify-one-time-intent-intake.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          git diff --check
          test "$(grep -R --include='*.yml' --include='*.yaml' -l 'materialize-stage4-intent-reuse:' .github/workflows 2>/dev/null | wc -l)" -eq 0

      - name: Commit only permanent implementation and regression files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage4-durable-finalize.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -Ec '^\.github/workflows/stage4-durable-finalize\.yml$')" -eq 1
          git commit -m 'Persist Stage 01 intent and enforce Stage 04 reuse'
          git push origin HEAD:fix/stage4-durable-accounting-final-20260830
