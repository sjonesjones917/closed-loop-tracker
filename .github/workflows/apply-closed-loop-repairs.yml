name: Apply verified closed-loop source repairs
on:
  push:
    branches: [repair/closed-loop-reliability-20260831]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'closed-loop-repair-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/closed-loop-reliability-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal verified corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="plans=testExecutionPlan(project).filter(item=>String(item.requirementId||'')===reqId)"
          new="plans=testExecutionPlan(project).items.filter(item=>String(item.requirementId||'')===reqId)"
          if old not in s: raise SystemExit('Stage 07 execution-plan defect signature not found')
          s=s.replace(old,new)
          old="""      // Stage 06 proves the verification definition is complete, not that future execution inputs already exist.
                // Exact byte readiness remains fail-closed in testExecutionPlan() at the execution stage.
                break;"""
          new="""      const executionPlan=testExecutionPlan(project),mandatoryPlanItems=executionPlan.items.filter(item=>mandatoryIds.has(String(item.requirementId||''))),lostBoundBytes=mandatoryPlanItems.filter(item=>safe(item.requiredArtifactIds).length>0&&(!item.artifactReady||safe(item.missingArtifactIds).length||safe(item.unverifiedArtifactIds).length));
                if(lostBoundBytes.length)reasons.push(`${lostBoundBytes.length} mandatory test definition(s) reference exact artifact bytes that are missing or no longer application-verified.`);
                break;"""
          if old not in s: raise SystemExit('Stage 06 readiness defect signature not found')
          s=s.replace(old,new)
          old="const ids=evidenceReferences(result),referencedEvidence=ids.map(id=>records(project,'evidenceRecords').find(x=>recordId(x,'evidenceRecords')===id)).filter(Boolean),mode=upper(recordValue(test,'EXECUTION_MODE')||''),testId=String(recordId(test,'tests')||''),humanEvidence=mode==='HUMAN_INSPECTION'?recordsForCurrentScope(project,'evidenceRecords').filter(x=>x?.source==='HUMAN_OBSERVATION'&&String(x?.humanInspectionTestId||'')===testId):[],evidence="
          new="const ids=evidenceReferences(result),referencedEvidence=ids.map(id=>records(project,'evidenceRecords').find(x=>recordId(x,'evidenceRecords')===id)).filter(Boolean),mode=upper(recordValue(test,'EXECUTION_MODE')||''),testId=String(recordId(test,'tests')||''),humanEvidence=mode==='HUMAN_INSPECTION'?[...recordsForCurrentScope(project,'evidenceRecords').filter(x=>x?.source==='HUMAN_OBSERVATION'&&String(x?.humanInspectionTestId||'')===testId),...referencedEvidence.filter(x=>upper(recordValue(x,'AUTHORITY_TYPE'))==='HUMAN_OBSERVATION')]:[],evidence="
          if old not in s: raise SystemExit('Human evidence selection defect signature not found')
          s=s.replace(old,new)
          old="const human=humanEvidence.some(e=>e?.source==='HUMAN_OBSERVATION'&&String(e?.humanAuthority?.identityAssurance||'')==='SELF_ASSERTED'&&String(recordValue(e,'APPLICATION_EVIDENCE_CONTENT')||'').trim());"
          new="const human=humanEvidence.some(e=>(e?.source==='HUMAN_OBSERVATION'&&String(e?.humanAuthority?.identityAssurance||'')==='SELF_ASSERTED'&&String(recordValue(e,'APPLICATION_EVIDENCE_CONTENT')||'').trim())||(upper(recordValue(e,'AUTHORITY_TYPE'))==='HUMAN_OBSERVATION'&&String(recordValue(e,'CONTENT')||recordValue(e,'DESCRIPTION')||'').trim()));"
          if old not in s: raise SystemExit('Human evidence sufficiency defect signature not found')
          p.write_text(s.replace(old,new))

          p=Path('prompt-engine.js')
          s=p.read_text()
          old="return {currentUserJobInput:humanJobInput,stage01AcceptedCapture:parseCapturedInputSet(state)"
          new="return {currentUserJobInput:humanJobInput,originalUserEntered:{EXACT_USER_OBJECTIVE_VERBATIM:state?.job?.EXACT_USER_OBJECTIVE_VERBATIM??null,SUPPLIED_MATERIALS_INVENTORY:state?.job?.SUPPLIED_MATERIALS_INVENTORY??null,EXPLICIT_USER_REQUIREMENTS:state?.job?.EXPLICIT_USER_REQUIREMENTS??null,PROHIBITED_ACTIONS:state?.job?.PROHIBITED_ACTIONS??null},stage01AcceptedCapture:parseCapturedInputSet(state)"
          if old not in s: raise SystemExit('Stage 04 input-union defect signature not found')
          p.write_text(s.replace(old,new))

          p=Path('app-core.js')
          s=p.read_text()
          old="function artifactControlMarkup(n,locked){\n  if(n===19)"
          new="function artifactControlMarkup(n,locked){if(n===19)"
          if old not in s: raise SystemExit('Visual-baseline function signature not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Prove corrected defects
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node verify-hash.mjs
          node verify-zero-loss-accounting.mjs
          node verify-semantic-invariant.mjs
          node verify-v3-migration.mjs
      - name: Remove temporary repair workflows and commit source
        run: |
          rm -f .github/workflows/repair-source-bundle.yml .github/workflows/apply-closed-loop-repairs.yml
          git config user.name closed-loop-repair-bot
          git config user.email closed-loop-repair-bot@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js app-core.js .github/workflows
          git commit -m "Repair Stage 04 accounting, Stage 07 routing, and evidence gates"
          git push origin HEAD:repair/closed-loop-reliability-20260831
