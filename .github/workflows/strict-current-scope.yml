name: Strict current-scope closure
on:
  push:
    branches:
      - reliability/strict-current-scope-20260826
permissions:
  contents: write
concurrency:
  group: strict-current-scope-closure
  cancel-in-progress: false
jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/strict-current-scope-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimum current-scope repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {n}')
              p.write_text(s.replace(old,new,1))

          engine=Path('workflow-engine.js')
          s=engine.read_text()
          old="""function versionCollections(stage){return schema.STAGE_CONTRACTS[stage]?.primaryCollections||[];}
          function registerStageVersion(project,stage,acceptedChangeId){
            ensureShape(project);
            const config=VERSION_BY_STAGE[stage];
            if(!config)return null;
            if(Number(stage)===2&&upper(project.stages[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE'){project.job.CURRENT_SOURCE_SET_VERSION='NOT APPLICABLE';return null;}
            const [jobField,prefix]=config;
            const payload={stage,collections:Object.fromEntries(versionCollections(stage).map(collection=>[collection,records(project,collection).map(record=>({id:recordId(record,collection),fields:recordFields(record),relationships:record.relationships||{},sha256:record.sha256||null}))])),acceptedData:project.stages[stage].acceptedData};
            const sha256=hash.sha256Value(payload);
            const latest=safe(project.projectData.artifactVersions).filter(item=>item.stage===stage&&item.kind===prefix).at(-1);
            if(latest?.sha256===sha256){project.job[jobField]=latest.version;return latest;}
            const version=nextVersion(project.job[jobField],prefix);
            const record={versionId:allocateInfrastructureId(project,'VERSION','artifactVersions'),stage,kind:prefix,version,sha256,createdAt:now(),acceptedChangeId,payload};
            project.projectData.artifactVersions.push(record);
            project.job[jobField]=version;
            return record;
          }
          """
          new="""function versionCollections(stage){return schema.STAGE_CONTRACTS[stage]?.primaryCollections||[];}
          const VERSION_SCOPE_KEY_BY_STAGE=Object.freeze({2:'sourceSetVersion',4:'requirementsVersion',5:'requirementsVersion',6:'testSuiteVersion',8:'instructionVersion'});
          function stampCurrentVersionMembership(project,stage,version){
            const key=VERSION_SCOPE_KEY_BY_STAGE[stage];if(!key||!version)return;
            const collections=stage===5?[...new Set(['requirements',...versionCollections(stage)])]:versionCollections(stage);
            for(const collection of collections)for(const record of records(project,collection)){record.scope={...(record.scope||{}),[key]:version};refreshRecordHashes(record,collection);}
          }
          function registerStageVersion(project,stage,acceptedChangeId){
            ensureShape(project);
            const config=VERSION_BY_STAGE[stage];
            if(!config)return null;
            if(Number(stage)===2&&upper(project.stages[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE'){project.job.CURRENT_SOURCE_SET_VERSION='NOT APPLICABLE';return null;}
            const [jobField,prefix]=config;
            const payload={stage,collections:Object.fromEntries(versionCollections(stage).map(collection=>[collection,records(project,collection).map(record=>({id:recordId(record,collection),fields:recordFields(record),relationships:record.relationships||{},sha256:record.sha256||null}))])),acceptedData:project.stages[stage].acceptedData};
            const sha256=hash.sha256Value(payload);
            const latest=safe(project.projectData.artifactVersions).filter(item=>item.stage===stage&&item.kind===prefix).at(-1);
            if(latest?.sha256===sha256){project.job[jobField]=latest.version;stampCurrentVersionMembership(project,stage,latest.version);return latest;}
            const version=nextVersion(project.job[jobField],prefix);
            const record={versionId:allocateInfrastructureId(project,'VERSION','artifactVersions'),stage,kind:prefix,version,sha256,createdAt:now(),acceptedChangeId,payload};
            project.projectData.artifactVersions.push(record);
            project.job[jobField]=version;
            stampCurrentVersionMembership(project,stage,version);
            return record;
          }
          """
          if s.count(old)!=1: raise SystemExit(f'version membership anchor: {s.count(old)}')
          s=s.replace(old,new,1)
          old="""function scopeMatches(record,scopeRule={}){const rs=record?.scope||{};for(const [key,value] of Object.entries(rs)){if(value===undefined||value===null)continue;if(Object.prototype.hasOwnProperty.call(scopeRule,key)&&(scopeRule[key]??null)!==value)return false;}return true;}
          function recordsForScope(project,collection,scopeRule={}){const applicable=Object.fromEntries(Object.entries(scopeRule||{}).filter(([,v])=>v!==undefined&&v!==null));return records(project,collection).filter(record=>record.scope&&Object.keys(record.scope).length>0&&scopeMatches(record,applicable));}
          """
          new="""function requiredVersionScopeKeys(collection){const stage=Number(schema.RECORD_SCHEMAS[collection]?.stage||0),keys=[];if(stage>=2)keys.push('inputVersion','sourceSetVersion');if(stage>=4)keys.push('requirementsVersion');if(stage>=6)keys.push('testSuiteVersion');if(stage>=8)keys.push('instructionVersion');return keys;}
          function scopeMatches(record,scopeRule={},requiredKeys=[]){const rs=record?.scope||{};for(const key of requiredKeys){const expected=scopeRule[key];if(expected===undefined||expected===null)continue;if(!Object.prototype.hasOwnProperty.call(rs,key)||rs[key]===undefined||rs[key]===null||rs[key]!==expected)return false;}for(const [key,value] of Object.entries(rs)){if(value===undefined||value===null)continue;if(Object.prototype.hasOwnProperty.call(scopeRule,key)&&(scopeRule[key]??null)!==value)return false;}return true;}
          function recordsForScope(project,collection,scopeRule={}){const applicable=Object.fromEntries(Object.entries(scopeRule||{}).filter(([,v])=>v!==undefined&&v!==null)),required=requiredVersionScopeKeys(collection).filter(key=>Object.prototype.hasOwnProperty.call(applicable,key));return records(project,collection).filter(record=>record.scope&&Object.keys(record.scope).length>0&&scopeMatches(record,applicable,required));}
          """
          if s.count(old)!=1: raise SystemExit(f'scope selector anchor: {s.count(old)}')
          s=s.replace(old,new,1)
          engine.write_text(s)

          verify=Path('verify-complete.mjs'); s=verify.read_text()
          old="""  const current=record('requirements',4,{OBLIGATION:'current',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-CURRENT');current.scope={requirementsVersion:'REQUIREMENTS-v002'};
            const stale=record('requirements',4,{OBLIGATION:'stale',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-STALE');stale.scope={requirementsVersion:'REQUIREMENTS-v001'};p.projectData.requirements.push(current,stale);
          """
          new="""  const current=record('requirements',4,{OBLIGATION:'current',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-CURRENT');current.scope={inputVersion:'INPUT-v001',requirementsVersion:'REQUIREMENTS-v002'};
            const stale=record('requirements',4,{OBLIGATION:'stale',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-STALE');stale.scope={inputVersion:'INPUT-v001',requirementsVersion:'REQUIREMENTS-v001'};p.projectData.requirements.push(current,stale);
          """
          if s.count(old)!=1: raise SystemExit(f'current scope fixture anchor: {s.count(old)}')
          s=s.replace(old,new,1)
          old="""  const unscoped=record('requirements',4,{OBLIGATION:'unscoped historical',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-UNSCOPED');delete unscoped.scope;p.projectData.requirements.push(unscoped);const scopedIds=engine.recordsForCurrentScope(p,'requirements').map(x=>engine.recordId(x,'requirements'));assert(!scopedIds.includes('REQ-UNSCOPED'),'Unscoped historical record satisfied current selector.');
          """
          new="""  const unscoped=record('requirements',4,{OBLIGATION:'unscoped historical',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-UNSCOPED');delete unscoped.scope;p.projectData.requirements.push(unscoped);const partial=record('requirements',4,{OBLIGATION:'partial historical',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'e',FAILURE_CONDITION:'f',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-PARTIAL');partial.scope={requirementsVersion:'REQUIREMENTS-v002'};p.projectData.requirements.push(partial);const scopedIds=engine.recordsForCurrentScope(p,'requirements').map(x=>engine.recordId(x,'requirements'));assert(!scopedIds.includes('REQ-UNSCOPED'),'Unscoped historical record satisfied current selector.');assert(!scopedIds.includes('REQ-PARTIAL'),'Partially scoped historical record satisfied current selector by omitting an applicable version identity.');
          """
          if s.count(old)!=1: raise SystemExit(f'partial scope insertion anchor: {s.count(old)}')
          s=s.replace(old,new,1)
          verify.write_text(s)

          files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          def git_blob_sha(path):
              b=Path(path).read_bytes(); return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          manifest=''.join(f'{f}:{git_blob_sha(f)}\n' for f in files).encode()
          token='runtime-'+hashlib.sha256(manifest).hexdigest()[:16]
          index=Path('index.html'); h=index.read_text(); h2=re.sub(r'(?<=\?v=)runtime-[a-f0-9]{16}',token,h)
          if h2==h: raise SystemExit('runtime token was not refreshed')
          index.write_text(h2)
          print(token)
          PY
      - name: Prove source, ingestion, gates, lifecycle, prompts, and Chromium
        run: |
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-scope-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only final responsible-layer changes
        run: |
          git rm .github/workflows/strict-current-scope.yml
          git config user.name 'closed-loop-reliability'
          git config user.email 'actions@users.noreply.github.com'
          git add workflow-engine.js verify-complete.mjs index.html
          git commit -m 'Fail closed on partial current-scope membership'
          git push origin HEAD:reliability/strict-current-scope-20260826
