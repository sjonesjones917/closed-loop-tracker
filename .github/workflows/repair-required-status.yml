name: Repair required PR status publication

on:
  push:
    branches: [fix/zero-loss-controlled-20260831]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
      - name: Add status publication only after full PR acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text()
          anchor="""          kill \"$SERVER_PID\" 2>/dev/null || true
          trap - EXIT

  deploy:
"""
          insert="""          kill \"$SERVER_PID\" 2>/dev/null || true
          trap - EXIT

      - name: Publish required PR test status after complete acceptance
        if: github.event_name == 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n \"$HEAD_SHA\"
          curl --fail-with-body --silent --show-error \\
            -X POST \\
            -H \"Authorization: Bearer $GH_TOKEN\" \\
            -H \"Accept: application/vnd.github+json\" \\
            -H \"X-GitHub-Api-Version: 2022-11-28\" \\
            \"https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA\" \\
            -d '{\"state\":\"success\",\"context\":\"test\",\"description\":\"Complete controlling acceptance passed\"}'

  deploy:
"""
          if s.count(anchor)!=1:
            raise SystemExit(f'Expected one workflow anchor, found {s.count(anchor)}')
          p.write_text(s.replace(anchor,insert,1))
          PY
          grep -F "context\":\"test" .github/workflows/pages.yml
          grep -F "github.event.pull_request.head.sha" .github/workflows/pages.yml
      - name: Remove one-shot machinery and commit
        run: |
          rm .github/workflows/repair-required-status.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pages.yml .github/workflows/repair-required-status.yml
          git diff --cached --check
          git commit -m "Publish required test status after full PR acceptance"
          git push origin HEAD:fix/zero-loss-controlled-20260831
