name: Apply focus stabilization repair
on:
  push:
    branches: [repair/complete-conformance-continuation-20260914]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/complete-conformance-continuation-20260914
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repair shared focus authority and preserve regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js'); s=p.read_text()
          old="function focusAfterAction(control,{reason='FORWARD'}={}){if(!control)return;if(operatorActionInFlight&&control.disabled){actionFocusTarget=control;operatorActionInFlight.focusReason=reason;return;}for(let parent=control.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;control.focus({preventScroll:true});const rect=control.getBoundingClientRect?.(),viewportHeight=Number(globalThis.innerHeight||document.documentElement?.clientHeight||0),below=Boolean(rect&&viewportHeight&&rect.bottom>viewportHeight),above=Boolean(rect&&rect.top<0),allowUp=reason==='CORRECTION'||reason==='RETURN'||reason==='RETRY';if(below||(above&&allowUp)){control.scrollIntoView?.({block:'nearest',inline:'nearest',behavior:'instant'});const placed=control.getBoundingClientRect?.();if(placed&&viewportHeight&&placed.bottom>viewportHeight&&placed.height<=viewportHeight)window.scrollBy?.({top:Math.ceil(placed.bottom-viewportHeight),behavior:'instant'});else if(placed&&placed.top<0&&allowUp)window.scrollBy?.({top:Math.floor(placed.top),behavior:'instant'});}}"
          new="function focusAfterAction(control,{reason='FORWARD'}={}){if(!control)return;if(operatorActionInFlight&&control.disabled){actionFocusTarget=control;operatorActionInFlight.focusReason=reason;return;}for(let parent=control.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;control.focus({preventScroll:true});const allowUp=reason==='CORRECTION'||reason==='RETURN'||reason==='RETRY',place=()=>{if(!control.isConnected)return;const rect=control.getBoundingClientRect?.(),viewportHeight=Number(globalThis.innerHeight||document.documentElement?.clientHeight||0),below=Boolean(rect&&viewportHeight&&rect.bottom>viewportHeight),above=Boolean(rect&&rect.top<0);if(below||(above&&allowUp)){control.scrollIntoView?.({block:'nearest',inline:'nearest',behavior:'instant'});const placed=control.getBoundingClientRect?.();if(placed&&viewportHeight&&placed.bottom>viewportHeight&&placed.height<=viewportHeight)window.scrollBy?.({top:Math.ceil(placed.bottom-viewportHeight),behavior:'instant'});else if(placed&&placed.top<0&&allowUp)window.scrollBy?.({top:Math.floor(placed.top),behavior:'instant'});}};place();requestAnimationFrame(()=>place());}"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          old_call="focusAfterAction($('#next-required-action'),{reason:'RETURN'});"
          assert s.count(old_call)==1, s.count(old_call)
          s=s.replace(old_call,"focusAfterAction($('#next-required-action'));",1)
          p.write_text(s)

          q=Path('verify-workflow-focus.mjs'); t=q.read_text()
          needle="cases.push({caseId:'FOCUS-FRACTIONAL-EDGE',result:'PASS',bottomAfterCorrection:fractionalRect.bottom,viewportHeight:c.innerHeight});calls.length=0;delete c.window.scrollBy;"
          rep="""cases.push({caseId:'FOCUS-FRACTIONAL-EDGE',result:'PASS',bottomAfterCorrection:fractionalRect.bottom,viewportHeight:c.innerHeight});calls.length=0;
          // A render can settle a fractional pixel after the synchronous focus pass.
          // The shared authority must recheck after layout without another operator action.
          const settledRect={top:760,bottom:851.75,width:300,height:91.75},settled=element('settled-next-action',settledRect);
          settled.scrollIntoView=options=>{calls.push({type:'scroll',id:settled.id,options});settledRect.top=759.625;settledRect.bottom=852.375;};
          c.window.scrollBy=options=>{calls.push({type:'residual-scroll',id:settled.id,options});settledRect.top-=options.top;settledRect.bottom-=options.top;};
          c.ui.focus(settled);settledRect.bottom=852.375;settledRect.top=760.625;await paint();
          assert.ok(settledRect.bottom<=c.innerHeight,'FOCUS_POST_LAYOUT_FRACTIONAL_ORACLE: the next action became clipped after layout settled');
          assert.ok(calls.some(call=>call.type==='residual-scroll'&&call.id===settled.id&&call.options.top>0),'Post-layout fractional correction did not expose the action');
          cases.push({caseId:'FOCUS-POST-LAYOUT-FRACTIONAL-EDGE',result:'PASS',bottomAfterCorrection:settledRect.bottom,viewportHeight:c.innerHeight});calls.length=0;delete c.window.scrollBy;"""
          assert t.count(needle)==1, t.count(needle)
          q.write_text(t.replace(needle,rep))

          r=Path('verify-project-lifecycle.mjs'); u=r.read_text()
          line="import './verify-workflow-focus.mjs';\n"
          assert line not in u
          r.write_text(u+line)
          PY
          node --check app-core.js
          node --check verify-workflow-focus.mjs
          node verify-workflow-focus.mjs
          cp app-core.js /tmp/app-core-focus-fault.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/app-core-focus-fault.js'); s=p.read_text(); old='place();requestAnimationFrame(()=>place());'; assert s.count(old)==1; p.write_text(s.replace(old,'place();',1))
          PY
          if APP_SOURCE=/tmp/app-core-focus-fault.js node verify-workflow-focus.mjs >/tmp/focus-fault.out 2>&1; then
            cat /tmp/focus-fault.out
            echo 'FAULT_DETECTION_GAP: post-layout focus fault escaped regression' >&2
            exit 1
          fi
          grep -q 'FOCUS_POST_LAYOUT_FRACTIONAL_ORACLE' /tmp/focus-fault.out
          rm .github/workflows/apply-focus-stabilization.yml
          git diff --check
          git status --short
          git diff -- app-core.js verify-workflow-focus.mjs verify-project-lifecycle.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js verify-workflow-focus.mjs verify-project-lifecycle.mjs .github/workflows/apply-focus-stabilization.yml
          git commit -m 'Stabilize next-action focus after layout'
          git push origin HEAD:repair/complete-conformance-continuation-20260914
