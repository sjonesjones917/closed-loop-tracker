name: Align shared runtime cache identity
on:
  push:
    branches: [fix/shared-runtime-cache-identity-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use one runtime cache identity everywhere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          target='runtime-20260830-live-operator-43'
          # app-core runtime identity
          p=Path('app-core.js'); s=p.read_text();
          import re
          s,n=re.subn(r"const RUNTIME_BUILD_ID='runtime-[^']+';",f"const RUNTIME_BUILD_ID='{target}';",s,count=1)
          if n!=1: raise SystemExit('app-core runtime identity not found')
          p.write_text(s)
          # deterministic runtime identity; worker URL inherits this script's exact query string
          p=Path('test-runtime.js'); s=p.read_text();
          s,n=re.subn(r"const RUNTIME_BUILD_ID='runtime-[^']+';",f"const RUNTIME_BUILD_ID='{target}';",s,count=1)
          if n!=1: raise SystemExit('test-runtime runtime identity not found')
          p.write_text(s)
          # all runtime scripts load under the same cache identity
          p=Path('index.html'); s=p.read_text();
          s,n=re.subn(r'(?<=\.js\?v=)runtime-[^"\']+',target,s)
          if n!=9: raise SystemExit(f'expected 9 runtime script tokens, got {n}')
          p.write_text(s)
          PY
          rm .github/workflows/tmp-shared-runtime-cache.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align shared runtime and worker cache identity"
          git push origin HEAD:fix/shared-runtime-cache-identity-20260830
