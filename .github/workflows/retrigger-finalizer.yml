name: Restart final application finalizer once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retrigger-finalizer.yml

permissions:
  actions: write
  contents: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalizer from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-prompt-generation-once.yml --ref main
      - name: Remove this one-shot dispatcher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit dispatcher cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/retrigger-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-shot finalizer dispatcher'
          git pull --rebase origin main
          git push origin HEAD:main
