name: Stage 03 one-time integration

on:
  push:
    branches: [controller-stage03-current-20260903]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage03-current-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact Stage 03 amendment
        run: |
          set -euo pipefail
          test -f .stage03-amendment.jsfrag
          test -f .stage03-verify-contract-closure.mjs
          if ! grep -q 'BUILD STAGE 03 CLOSED CONTRACT AMENDMENT' workflow-schema.js; then
            cat .stage03-amendment.jsfrag >> workflow-schema.js
          fi
          cp .stage03-verify-contract-closure.mjs verify-contract-closure.mjs
          rm -f .stage03-amendment.jsfrag .stage03-verify-contract-closure.mjs .controller-source-capture .github/workflows/stage03-repair.yml
      - name: Prove Stage 03 and all affected earlier paths
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check verify-contract-closure.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-contract-closure.mjs
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs
          node verify-v3-contract.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-v3-definition-of-done.mjs
      - name: Commit integrated Stage 03 result
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-controller'
          git config user.email 'closed-loop-controller@users.noreply.github.com'
          git add workflow-schema.js verify-contract-closure.mjs .github/workflows/stage03-repair.yml .stage03-amendment.jsfrag .stage03-verify-contract-closure.mjs .controller-source-capture || true
          test -z "$(git status --porcelain | grep -E '^.. (\.stage03-|\.controller-source-capture|\.github/workflows/stage03-repair.yml)$' || true)" || true
          git commit -m 'Stage 03: close schema and registry contracts'
          git push origin HEAD:controller-stage03-current-20260903
