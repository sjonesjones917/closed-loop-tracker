name: Apply returned-file control restoration
on:
  push:
    branches: [fix/restore-stage-returned-file-controls]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old="  if([2,3,4].includes(n))return files.length?`<div class=\"panel\"><h2 class=\"section-title\">Previously returned stage files</h2><p class=\"section-intro\">These bytes were already captured for this stage. No project-intent file should be attached or resent here.</p>${details('Verified artifact bytes',files,true)}</div>`:'';\n"
          if old not in s:
              raise SystemExit('expected Stage 2-4 suppression line not found')
          p.write_text(s.replace(old,'',1))
          PY
          rm .github/workflows/apply-stage-returned-file-controls.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js .github/workflows/apply-stage-returned-file-controls.yml
          git commit -m "Restore returned-file controls without repeat intent intake"
          git push origin HEAD:fix/restore-stage-returned-file-controls
