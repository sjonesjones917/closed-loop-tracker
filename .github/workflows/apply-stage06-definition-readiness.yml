name: Apply Stage 06 definition readiness
on:
  push:
    branches: [fix/stage06-definition-readiness]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          text=p.read_text()
          old="      const mandatoryTestIds=new Set(mandatoryTests.map(test=>recordId(test,'tests'))),missingArtifacts=testExecutionPlan(project).missingArtifactTestIds.filter(id=>mandatoryTestIds.has(id));\n      if(missingArtifacts.length)reasons.push(`${missingArtifacts.length} mandatory test definition(s) require exact artifact bytes that are missing or no longer application-verified.`);\n"
          new="      // Stage 06 proves the verification definition is complete, not that future execution inputs already exist.\n      // Exact byte readiness remains fail-closed in testExecutionPlan() at the execution stage.\n"
          if old not in text:
              raise SystemExit('Stage 06 execution-byte gate block not found')
          text=text.replace(old,new,1)
          p.write_text(text)
          PY
          rm -f .github/workflows/apply-stage06-definition-readiness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Separate Stage 06 design readiness from execution bytes"
          git push origin HEAD:fix/stage06-definition-readiness