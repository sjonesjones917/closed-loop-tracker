name: repair-section14-scope-matrix
on:
  push:
    branches:
      - fix/section15-job-contract
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/section15-job-contract
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node repair-scope-and-wire.mjs
      - run: node verify-section15-job-contract.mjs
      - run: node verify-section14-scope-matrix.mjs
      - run: node verify-v3-contract.mjs
      - run: node verify-data-route-closure.mjs
      - run: node verify-ingestion.mjs
      - name: Commit repaired source and data-route fixture
        run: |
          test -n "$(git status --short -- workflow-schema.js verify-data-route-closure.mjs)"
          git checkout -- .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-schema.js verify-data-route-closure.mjs
          git commit -m 'Conform exact stage-operation scope matrix'
          git push origin HEAD:fix/section15-job-contract
# retrigger with workflow-file mutation excluded from bot push
