name: One-time exact scope matrix repair
on:
  push:
    branches: [repair/spec-scope-current-20260903]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-scope-current-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact scope matrix correction
        run: node .repair-scope-contract.mjs
      - name: Prove repaired owner files and regression
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node verify-stage-operation-scope-matrix.mjs
      - name: Commit canonical repair and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Conform exact stage-operation scope matrix"
          git push origin HEAD:repair/spec-scope-current-20260903
