name: One-time exact scope matrix repair
on:
  push:
    branches: [repair/spec-scope-response-closure]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-scope-response-closure
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node .repair-scope-contract.mjs
      - run: node --check workflow-schema.js && node --check prompt-engine.js && node --check response-ingestion.js && node verify-stage-operation-scope-matrix.mjs
      - name: Commit repaired canonical files and remove scaffolding
        run: |
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add -A
          git commit -m "Conform exact stage-operation scope matrix"
          git push origin HEAD:repair/spec-scope-response-closure
