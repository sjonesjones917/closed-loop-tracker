name: Apply controlling bundle exact repair
on:
  push:
    branches: [fix/controlling-bundle-exact]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/controlling-bundle-exact, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply only prompt semantics and restore unauthorized visuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); s=p.read_text()
          old="4:'Compile atomic requirement proposals only from the complete current canonical input union selected by the application: current User Job Input, the accepted Stage 01 job definition, human-origin obligations already captured from supplied material, accepted Stage 03 source research, candidate external-source obligations, and their applicable provenance. The application must create and provide the obligation universe before this stage; do not rediscover an unspecified input universe. Do not ask the human to attach, resend, retype, or summarize the original intent file or any other material whose relevant human-authority content was already captured in canonical state. Do not infer substantive content from a filename. If required prior-stage information was not captured, return BLOCKED with MISSING_APPLICATION_CONTEXT or INADEQUATE_PRIOR_OUTPUT and identify the responsible earlier stage; do not convert an earlier-stage capture defect into another user attachment request."
          new="4:'Compile atomic requirement proposals from the complete application-supplied Stage 04 project input embedded in this instruction: current User Job Input, accepted Stage 01 job definition, every captured human-origin and supplied-material obligation, accepted Stage 03 source research, candidate external-source obligations, and applicable provenance. The application must create and provide the complete obligation universe before this stage; do not rediscover an unspecified input universe. Project information is supplied by the human once. Never ask the human to attach, resend, retype, summarize, select, restate, or otherwise resupply project information already supplied at any earlier point. Use the persisted project information in this prompt. Do not infer substantive content from a filename. If required project information is absent from the application-supplied context, return BLOCKED with MISSING_APPLICATION_CONTEXT or INADEQUATE_PRIOR_OUTPUT and identify the earliest responsible stage; never convert an application capture/projection defect into another human data-entry or attachment request."
          if old not in s: raise SystemExit('Stage 04 procedure anchor missing')
          s=s.replace(old,new,1)
          anchor="- Continue the same conversation from the human answer. Ask only the next genuinely useful human-only question(s); do not interrogate the human for facts available in supplied materials, common domain knowledge, or authorized research/tools."
          rule=anchor+"\n- Project information is supplied by the human once. If project-relevant information has ever been supplied and is available in current canonical context or this generated instruction, use it directly and never ask the human to provide it again. Missing projected context is an application/prior-stage defect, not a human resupply task."
          if anchor not in s: raise SystemExit('human collaboration anchor missing')
          s=s.replace(anchor,rule,1)
          p.write_text(s)
          idx=Path('index.html'); t=idx.read_text(); t=t.replace("#prompt-heading .expandable-prompt:not(.expanded){max-height:88px}\n",""); idx.write_text(t)
          PY
          node --check prompt-engine.js
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
          git diff --check
      - name: Commit repair and remove applicator
        shell: bash
        run: |
          git rm .github/workflows/apply-controlling-bundle-exact.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add prompt-engine.js index.html
          git diff --cached --check
          git commit -m 'Enforce capture-once prompts and restore prompt visual'
          git push origin HEAD:fix/controlling-bundle-exact