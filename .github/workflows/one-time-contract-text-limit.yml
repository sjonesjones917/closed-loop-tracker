name: One-time contract text-limit proof
on:
  push:
    branches: [reliability/contract-text-limit-20260826]
permissions:
  contents: write
jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply minimum authority correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('response-ingestion.js'); s=p.read_text()
          replacements=[
            ("function validateValue(definition,value,path,issues,{required=false}={})", "function validateValue(definition,value,path,issues,{required=false,maxTextFieldLength=schema.DEFAULT_RESOURCE_LIMITS.maxTextFieldLength}={})", 'validator signature'),
            ("typeof value==='string'&&value.length>200000", "typeof value==='string'&&value.length>Number(maxTextFieldLength||schema.DEFAULT_RESOURCE_LIMITS.maxTextFieldLength)", 'hidden text limit'),
            ("  const contract=schema.STAGE_CONTRACTS[stageNumber];\n", "  const contract=schema.STAGE_CONTRACTS[stageNumber];\n  const valueLimits={maxTextFieldLength:contract?.resourceLimits?.maxTextFieldLength??schema.DEFAULT_RESOURCE_LIMITS.maxTextFieldLength};\n", 'effective stage limit'),
            ("      validateValue(definition,value,path,issues);", "      validateValue(definition,value,path,issues,valueLimits);", 'stage-data validation'),
            ("          validateValue(fieldDefinition,value,fieldPath,issues,{required:definition.required.includes(name)});", "          validateValue(fieldDefinition,value,fieldPath,issues,{required:definition.required.includes(name),...valueLimits});", 'record-field validation'),
          ]
          for old,new,label in replacements:
            if s.count(old)!=1: raise SystemExit(f'{label}: expected one anchor, found {s.count(old)}')
            s=s.replace(old,new,1)
          if 'value.length>200000' in s: raise SystemExit('hidden text limit remains')
          p.write_text(s)

          p=Path('verify-ingestion.mjs'); s=p.read_text()
          anchor="{const issues=[];ingestion.validateValue({valueType:'STRING',enumValues:['ALLOWED'],nullable:false},'__INVALID_ENUM__','/invalid-enum',issues,{required:true});if(!issues.some(i=>i.code==='INVALID_ENUM_VALUE'))throw new Error('invalid enum: expected INVALID_ENUM_VALUE.');negativeCount++;}\n"
          test="{const issues=[];ingestion.validateValue({valueType:'STRING',enumValues:[],nullable:false},'12345','/contract-text-limit',issues,{required:true,maxTextFieldLength:4});if(!issues.some(i=>i.code==='TEXT_FIELD_TOO_LARGE'))throw new Error('configured contract text limit was not enforced.');negativeCount++;}\n"
          if s.count(anchor)!=1: raise SystemExit(f'test anchor mismatch: {s.count(anchor)}')
          if 'configured contract text limit was not enforced' not in s: s=s.replace(anchor,anchor+test,1)
          p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs'),{createHash}=require('crypto');
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const token=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          for(const file of files) html=html.replace(new RegExp(`(<script\\s+defer\\s+src=\"${file.replace('.','\\.')}\\?v=)[^\"]+(\"\\s*><\\/script>)`),`$1${token}$2`);
          fs.writeFileSync('index.html',html);
          NODE
      - name: Run complete application proof
        run: |
          node build-test-project.mjs
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit only verified permanent files
        run: |
          rm .github/workflows/one-time-contract-text-limit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add response-ingestion.js verify-ingestion.mjs index.html .github/workflows/one-time-contract-text-limit.yml
          git commit -m "Bind text validation to hashed response contract"
          git push origin HEAD:reliability/contract-text-limit-20260826
