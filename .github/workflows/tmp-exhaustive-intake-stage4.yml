name: Inspect stage context contract source
on:
  push:
    branches:
      - fix/exhaustive-intake-stage4-20260830
    paths:
      - .github/workflows/tmp-exhaustive-intake-stage4.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage4-20260830
      - name: Show READ_COLLECTIONS source
        run: grep -n "READ_COLLECTIONS" workflow-schema.js