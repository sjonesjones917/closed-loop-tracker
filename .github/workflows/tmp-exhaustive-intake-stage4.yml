name: Apply exhaustive intake and Stage 04 closure repair
on:
  push:
    branches:
      - fix/exhaustive-intake-stage4-20260830
    paths:
      - .github/workflows/tmp-exhaustive-intake-stage4.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage4-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct current Stage 03 gate anchor in one-time script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.repair-exhaustive-intake.py'); s=p.read_text()
          old='''replace_once('workflow-engine.js',"      if(sourceIds.length&&!sourceIds.every(id=>researchedSourceIds.has(id)))reasons.push('Every current accepted Stage 02 source must have current Stage 03 research coverage.');","      if(sourceIds.length&&!sourceIds.every(id=>researchedSourceIds.has(id)))reasons.push('Every current accepted Stage 02 source must have current Stage 03 research coverage.');\\n      const researchManifest=stage03ResearchManifest(project),researchAccounting=safe(project.stages[3]?.agentData?.RESEARCH_ACCOUNTING),researchSeen=new Set();for(const entry of researchAccounting){const id=String(entry?.researchUnitId||'');if(id)researchSeen.add(id);}const missingResearch=safe(researchManifest.entries).map(x=>String(x.researchUnitId||'')).filter(id=>id&&!researchSeen.has(id));if(missingResearch.length)reasons.push(`Stage 03 research accounting is missing application-enumerated research unit(s): ${missingResearch.join(', ')}.`);")'''
          new='''replace_once('workflow-engine.js',"      if(sourceIds.length){requireCount('research',1);const researched=new Set(collection('research').map(record=>String(recordValue(record,'SOURCE_ID')||record.relationships?.SOURCE_ID||''))),missing=sourceIds.filter(id=>!researched.has(id));if(missing.length)reasons.push(`Research is missing for source(s): ${missing.join(', ')}.`);}","      if(sourceIds.length){requireCount('research',1);const researched=new Set(collection('research').map(record=>String(recordValue(record,'SOURCE_ID')||record.relationships?.SOURCE_ID||''))),missing=sourceIds.filter(id=>!researched.has(id));if(missing.length)reasons.push(`Research is missing for source(s): ${missing.join(', ')}.`);}\\n      const researchManifest=stage03ResearchManifest(project),researchAccounting=safe(project.stages[3]?.agentData?.RESEARCH_ACCOUNTING),researchSeen=new Set();for(const entry of researchAccounting){const id=String(entry?.researchUnitId||'');if(id)researchSeen.add(id);}const missingResearch=safe(researchManifest.entries).map(x=>String(x.researchUnitId||'')).filter(id=>id&&!researchSeen.has(id));if(missingResearch.length)reasons.push(`Stage 03 research accounting is missing application-enumerated research unit(s): ${missingResearch.join(', ')}.`);")'''
          if old not in s: raise SystemExit('Old Stage 03 repair anchor line not found.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply repair
        run: python3 .repair-exhaustive-intake.py
      - name: Syntax and focused deterministic proof
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-intake-closure.mjs
          node verify-hash.mjs
          node verify-test-runtime.mjs
          node verify-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          git diff --check
      - name: Commit integrated repair and remove one-time files
        run: |
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/tmp-exhaustive-intake-stage4.yml .repair-exhaustive-intake.py
          git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js index.html verify-intake-closure.mjs .github/workflows/pages.yml
          git commit -m 'Close Stage 01 and Stage 03 accounting before Stage 04'
          git push origin HEAD:fix/exhaustive-intake-stage4-20260830