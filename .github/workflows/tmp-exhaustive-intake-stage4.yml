name: Apply exhaustive intake and Stage 04 closure repair
on:
  push:
    branches:
      - fix/exhaustive-intake-stage4-20260830
    paths:
      - .github/workflows/tmp-exhaustive-intake-stage4.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exhaustive-intake-stage4-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integrated repair and current-scope proof fixture
        run: |
          python3 .repair-orchestrate.py
          python3 .repair-fixture.py
      - name: Syntax and focused deterministic proof
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-intake-closure.mjs
          node --check verify-one-time-intent-intake.mjs
          node verify-hash.mjs
          node verify-test-runtime.mjs
          node verify-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          git diff --check
      - name: Commit integrated repair and remove one-time files
        run: |
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/tmp-exhaustive-intake-stage4.yml .repair-exhaustive-intake.py .repair-orchestrate.py .repair-fixture.py
          git add workbook.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js index.html verify-intake-closure.mjs verify-one-time-intent-intake.mjs .github/workflows/pages.yml
          git commit -m 'Close Stage 01 and Stage 03 accounting before Stage 04'
          git push origin HEAD:fix/exhaustive-intake-stage4-20260830