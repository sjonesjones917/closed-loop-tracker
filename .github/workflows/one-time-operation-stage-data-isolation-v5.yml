name: One-time operation stageData isolation repair v5
on:
  push:
    branches: [operation-stage-data-isolation-20260826]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operation-stage-data-isolation-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply proven production patch and update stale semantic fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/one-time-operation-stage-data-isolation-v4.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(y) if "python3 - <<'PY'" in line)+1
          end=next(i for i in range(start,len(y)) if y[i].strip()=='PY')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in y[start:end])+'\n'
          exec(compile(code,'v4-production-patch','exec'),{})

          p=Path('verify-prompt-semantics.mjs'); s=p.read_text()
          old="19:{CONFIRM_FREEZE:[],EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],REGRESSION_VERIFY:['regressionExecutions'],CONFIRM:['confirmationRecords']}"
          new="19:{EXECUTE_RUN:['runs'],VERIFY:['verification'],COMPARE:['comparisons'],REGRESSION_VERIFY:['regressionExecutions'],CONFIRM:['confirmationRecords']}"
          if old not in s: raise SystemExit('stale expectedOperationWrites CONFIRM_FREEZE fixture not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify exact repaired branch
        shell: bash
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check workflow-engine.js
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit green patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-operation-stage-data-isolation.yml .github/workflows/one-time-operation-stage-data-isolation-v2.yml .github/workflows/one-time-operation-stage-data-isolation-v3.yml .github/workflows/one-time-operation-stage-data-isolation-v4.yml .github/workflows/one-time-operation-stage-data-isolation-v5.yml
          git add workflow-schema.js prompt-engine.js response-ingestion.js workflow-engine.js verify-ingestion.mjs verify-prompt-semantics.mjs verify-full-cycle.mjs
          git commit -m 'Enforce operation-specific stageData authority'
          git push origin HEAD:operation-stage-data-isolation-20260826
