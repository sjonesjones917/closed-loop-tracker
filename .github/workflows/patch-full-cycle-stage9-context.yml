name: Repair full-cycle Stage 09 reviewer context
on:
  push:
    branches: [fix/required-full-commit-gates-20260830]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Reserve Stage 09 reviewer context in full-cycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/required-full-commit-gates-20260830
      - name: Add canonical reviewer context to Stage 09 fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs')
          s=p.read_text()
          old="data(9,{records:{preflightRecords:[recordProposal(schema,'preflightRecords'"
          new="const preflightContext=engine.registerFreshContext(p,{stage:9,externalContextIdentifier:'EXTERNAL-PREFLIGHT-CONTEXT',operatorLabel:'FULL_CYCLE',purpose:'REVIEWER'});data(9,{scope:{contextId:engine.recordId(preflightContext,'freshContexts')},records:{preflightRecords:[recordProposal(schema,'preflightRecords'"
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one Stage 09 fixture call, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- verify-full-cycle.mjs
      - name: Commit fixture repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-full-cycle.mjs
          git commit -m 'Reserve Stage 09 reviewer context in full-cycle'
          git push origin HEAD:fix/required-full-commit-gates-20260830
