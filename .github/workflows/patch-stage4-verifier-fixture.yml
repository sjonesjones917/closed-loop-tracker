name: Patch Stage 04 verifier fixture
on:
  push:
    branches: [fix/controlling-spec-final-20260830]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-final-20260830
          fetch-depth: 0
      - name: Make verify.mjs satisfy Stage 04 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="for(let stage=1;stage<=30;stage++){const p=blank(`JOB-PROMPT-${stage}`);const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));"
          if old not in s:
              print('Stage 04 verifier fixture already patched or anchor unavailable; no change.')
              raise SystemExit(0)
          new="""for(let stage=1;stage<=30;stage++){const p=blank(`JOB-PROMPT-${stage}`);if(stage===4){const manifest=prompts.intakeCoverageManifest(p);p.stages[1].status='COMPLETE';p.stages[1].gate={...(p.stages[1].gate||{}),complete:true};p.stages[1].agentData={...(p.stages[1].agentData||{}),INPUT_SET_CONTENTS:JSON.stringify({units:manifest.units.map(unit=>({sourceUnitId:unit.unitId,disposition:'retained as context',extractedStatements:[{statementKey:'fixture-context',text:p.job.EXACT_USER_OBJECTIVE_VERBATIM,statementClass:'CONTEXT'}]}))})};p.stages[2].agentData={...(p.stages[2].agentData||{}),SOURCE_APPLICABILITY_DETERMINATION:'NO_APPLICABLE_EXTERNAL_SOURCE'};p.stages[3].status='COMPLETE';p.stages[3].gate={...(p.stages[3].gate||{}),complete:true};}const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));"""
          p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet -- verify.mjs; then exit 0; fi
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add verify.mjs
          git commit -m "Make generic Stage 04 prompt verifier use complete upstream fixture"
          git push origin HEAD:fix/controlling-spec-final-20260830
