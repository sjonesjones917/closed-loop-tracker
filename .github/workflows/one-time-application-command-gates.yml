name: One-time application command gate repair

on:
  push:
    branches: [repair/operation-authority-closure-20260903]

permissions:
  contents: write

jobs:
  repair-prove-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply application-command gate repair
        run: node .repair-application-command-gates.mjs
      - name: Prove authority and full cycle
        run: |
          node --check workflow-engine.js
          node --check verify-full-cycle.mjs
          node verify-operation-authority-closure.mjs
          node verify-full-cycle.mjs
          node verify-v3-contract.mjs
      - name: Remove one-time scaffold and commit
        run: |
          set -euo pipefail
          rm -f .repair-application-command-gates.mjs .github/workflows/one-time-application-command-gates.yml
          git config user.name "closed-loop repair automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Calculate non-agent stage gates in application"
          git push origin HEAD:repair/operation-authority-closure-20260903
