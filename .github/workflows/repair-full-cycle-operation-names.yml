name: One-time full-cycle operation-name repair

on:
  push:
    branches: [codex/exact-stage-operation-registry]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/exact-stage-operation-registry
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Use exact application-operation names in the full-cycle regression
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='verify-full-cycle.mjs';
          let t=fs.readFileSync(p,'utf8');
          for(const [from,to] of [["operationContract(10,'COMPLETE')","operationContract(10,'FREEZE')"],["operationContract(20,'COMPLETE')","operationContract(20,'FREEZE_BASELINE')"]]){
            if(!t.includes(from))throw new Error(`Expected legacy assertion ${from} not found.`);
            t=t.replace(from,to);
          }
          fs.writeFileSync(p,t);
          NODE
          node --check verify-full-cycle.mjs
          node verify-stage-operation-registry.mjs
      - name: Remove one-time scaffolding and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-full-cycle-operation-names.yml
          git add verify-full-cycle.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Use exact application operation names in full-cycle proof"
          git push origin HEAD:codex/exact-stage-operation-registry
