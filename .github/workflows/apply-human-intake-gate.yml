name: Apply minimal human-intake prompt and UX gate

on:
  push:
    branches:
      - fix/human-intake-gate-v16
    paths:
      - .github/workflows/apply-human-intake-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact minimal patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          p = Path('prompt-engine.js')
          s = p.read_text()
          old = "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/15';"
          assert old in s
          s = s.replace(old, "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/16';", 1)

          anchor = "Stage 01 should collect all human-specific information already foreseeable as needed to achieve the requested outcome, not merely the minimum needed to name the job. Later research, source, requirement, verification, production, or audit stages may discover a new human-only fact or decision; when that happens, ask the human conversationally at that later stage rather than guessing. Keep human-facing explanations concise, complete, accurate, and action-oriented."
          replacement = anchor + "\nClassify missing information before deciding whether to ask: BLOCKING-NOW means the human answer is required to complete the current stage; ASK-NOW/NONBLOCKING means the fact must come from the human and should be asked now, but the human may answer unknown or defer without blocking Stage 01; LATER-RESOLVABLE means supplied materials, authorized research/tools, ordinary domain knowledge, or a later stage can resolve it, so do not ask the human now. Nonblocking means the human may answer unknown or defer; it does not mean you may skip a required Stage 01 intake question. Conversational questions are not humanInputRequests: humanInputRequests exists only in the final HUMAN_INPUT_REQUIRED machine response."
          assert anchor in s
          s = s.replace(anchor, replacement, 1)

          patent = "However, when any of these are foreseeable human-specific inputs for the requested patent outcome and are not already supplied, ask the human for them conversationally during Stage 01. If the human does not know or cannot decide yet, record that item as unresolved for the earliest later stage that actually requires it. Do not research patent authority, prior art, or draft the application here."
          patent_replacement = "However, when any of these are foreseeable human-specific inputs for the requested patent outcome and are not already supplied, ask the human for them conversationally during Stage 01. For a patent-application job, the ASK-NOW/NONBLOCKING intake MUST cover, when not already known from human input or supplied materials: intended jurisdiction or jurisdictions; filing-route or application-type preference and any existing filing; all inventor identities; ownership, assignment, employment, contractor, or other rights obligations; priority, continuity, and related-application history; public disclosure, publication, sale, offer for sale, public use, demonstration, or other disclosure history and dates; known filing or business deadlines; government funding or joint-research circumstances; intended endpoint such as inventor review, counsel review, or filing-ready; and whether additional human-controlled invention materials exist but have not yet been supplied. Ask only what genuinely must come from the human. If the human does not know or cannot decide yet, record that item as unresolved for the earliest later stage that actually requires it. Do not research patent authority, prior art, or draft the application here."
          assert patent in s
          s = s.replace(patent, patent_replacement, 1)

          marker = "${stage===1?`STAGE 01 MACHINE OUTPUT SHAPE — DO NOT INVENT SUB-OBJECT KEYS"
          gate = "${stage===1?`MANDATORY STAGE 01 HUMAN-INTAKE GATE — COMPLETE BEFORE FINAL JSON\\nBefore returning DATA_PROPOSAL, identify every foreseeable fact or decision that must ultimately come from the human rather than research, ordinary domain knowledge, or supplied materials and that has not already been supplied. Ask every ASK-NOW/NONBLOCKING item conversationally before producing final JSON. Do not satisfy this gate by moving an unasked human-only item directly into UNKNOWN_INFORMATION. If the human answers unknown, I do not know, unavailable, or explicitly defers, preserve that as unresolved and continue unless the answer is BLOCKING-NOW. HUMAN_INPUT_REQUIRED is reserved for a still-unanswered BLOCKING-NOW human fact or decision that prevents the current Stage 01 job definition itself from being completed.\\n\\nA material named in SUPPLIED_MATERIALS_INVENTORY whose bytes are unavailable is still part of INPUT_SET_CONTENTS. Do not ask the human to describe its contents during Stage 01. Record byte unavailability as nonblocking unless the missing bytes prevent identification of the objective or deliverable, and do not infer substantive facts merely from the filename.\\n\\nBEFORE RETURNING STAGE 01 JSON, VERIFY ALL FIVE:\\n1. Objective and deliverable are defined.\\n2. Supplied materials are identified only to the minimum Stage 01 level; Stage 02 inventory work was not performed.\\n3. Every foreseeable human-only intake item was already supplied, asked conversationally and answered, or asked conversationally and explicitly marked unknown/deferred by the human.\\n4. No source research, prior-art research, requirement derivation, verification design, drafting, filing, implementation, or other later-stage production was performed.\\n5. Only then choose DATA_PROPOSAL, HUMAN_INPUT_REQUIRED, BLOCKED, or EXECUTION_FAILED.\\n\\n`:''}\\n${stage===1?`STAGE 01 MACHINE OUTPUT SHAPE — DO NOT INVENT SUB-OBJECT KEYS"
          assert marker in s
          s = s.replace(marker, gate, 1)
          p.write_text(s)

          p = Path('app-core.js')
          s = p.read_text()
          old = '<div class="panel"><h2 class="section-title">Agent loop</h2><div class="operator-loop" aria-label="Normal stage workflow"><div class="operator-step"><b>1</b><span>Send instruction</span></div><div class="operator-step"><b>2</b><span>Answer agent questions</span></div><div class="operator-step"><b>3</b><span>Paste final JSON</span></div><div class="operator-step"><b>4</b><span>Validate and review</span></div></div></div>'
          new = '<div class="panel"><h2 class="section-title">Agent loop</h2><div class="operator-loop" aria-label="Normal stage workflow"><div class="operator-step"><b>1</b><span>Send instruction</span></div><div class="operator-step"><b>2</b><span>Answer agent questions</span></div><div class="operator-step"><b>3</b><span>Paste final JSON</span></div><div class="operator-step"><b>4</b><span>Validate and review</span></div></div><details class="record-card"><summary>How this stage works<span>?</span></summary><div class="record-body"><p class="section-intro">Use ChatGPT as the conversation. The agent should ask plain-language human-only questions there and explain briefly why they matter. Stay in that chat until the agent says it has enough information and returns one final JSON object. Paste only that final JSON here. If research or requirements later reveal a new human-only fact or decision, the agent should ask you then rather than guess. If the app rejects a response, the rejected response remains audit history; edit or replace the response and press Parse / validate again. You should not repair JSON structure or invent missing agent data yourself.</p></div></details></div>'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('verify-prompt-semantics.mjs')
          s = p.read_text()
          old = "if(!record.prompt.includes('STAGE 01 CLARIFICATION EXPERIENCE')||!record.prompt.includes('ask it conversationally first under HUMAN COLLABORATION MODE')||!record.prompt.includes('Use HUMAN_INPUT_REQUIRED only as the final machine fallback'))issues.push('STAGE01_CONVERSATION_FIRST_CLARIFICATION_MISSING');"
          new = old + "\n    if(!record.prompt.includes('MANDATORY STAGE 01 HUMAN-INTAKE GATE')||!record.prompt.includes('ASK-NOW/NONBLOCKING')||!record.prompt.includes('Nonblocking means the human may answer unknown or defer; it does not mean you may skip')||!record.prompt.includes('Conversational questions are not humanInputRequests')||!record.prompt.includes('BEFORE RETURNING STAGE 01 JSON, VERIFY ALL FIVE'))issues.push('STAGE01_HUMAN_INTAKE_GATE_MISSING');"
          assert old in s
          s = s.replace(old, new, 1)
          ui_old = "if(!ui.includes('Stage 01 is an intake conversation')||!ui.includes('remaining human-only questions in normal chat')||!ui.includes('HUMAN_INPUT_REQUIRED in this app is only a fallback')||!ui.includes('Answer agent questions')||!ui.includes('Paste final JSON'))throw new Error('Stage 01 operator UI does not explain the human conversation and final JSON handoff.');"
          ui_new = ui_old + "\n if(!ui.includes('How this stage works')||!ui.includes('You should not repair JSON structure or invent missing agent data yourself'))throw new Error('Operator UI is missing the collapsed first-use stage guide.');"
          assert ui_old in s
          s = s.replace(ui_old, ui_new, 1)
          p.write_text(s)

          runtime_files = ['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest = ''
          for file in runtime_files:
              data = Path(file).read_bytes()
              blob_sha = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              manifest += f'{file}:{blob_sha}\n'
          runtime_id = 'runtime-' + hashlib.sha256(manifest.encode()).hexdigest()[:16]
          p = Path('index.html')
          s = p.read_text()
          ids = set(re.findall(r'runtime-[A-Za-z0-9]+', s))
          assert len(ids) == 1, ids
          s = s.replace(next(iter(ids)), runtime_id)
          p.write_text(s)
          PY
      - name: Verify minimal patch
        run: |
          node --check prompt-engine.js
          node --check app-core.js
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-browser.mjs
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-human-intake-gate.yml
          git config user.name "closed-loop patch"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-engine.js app-core.js verify-prompt-semantics.mjs index.html .github/workflows/apply-human-intake-gate.yml
          git commit -m "Make Stage 01 human intake deterministic"
          git push origin HEAD:fix/human-intake-gate-v16
