name: Apply runtime graph verifier correction
on:
  push:
    branches: [fix/spec-conformance-final]
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/spec-conformance-final}
      - run: |
          python _patch6.py
          node build-test-project.mjs
          rm _patch6.py .github/workflows/_apply6.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -m 'Include Test IR runtime in direct runtime graph' && git push origin HEAD:fix/spec-conformance-final
