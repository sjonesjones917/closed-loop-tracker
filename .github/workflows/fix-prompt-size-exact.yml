name: Restore exact prompt preview dimensions
on: [push]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); s=s.replace('.expandable-prompt{height:auto;max-height:clamp(280px,42vh,440px)}.expandable-prompt.expanded{height:auto;max-height:none}', '.expandable-prompt{height:280px;max-height:280px}.expandable-prompt.expanded{height:auto;max-height:none}'); p.write_text(s)
          PY
          grep -F '.expandable-prompt{height:280px;max-height:280px}' index.html
      - run: |
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add index.html && git commit -m 'Restore exact 280px prompt preview size' && git push origin HEAD:fix/spec-conformance-zero-loss