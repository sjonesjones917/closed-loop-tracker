name: Sync Stage 4 runtime identity
on:
  push:
    branches: [fix/stage4-durable-intent-final-20260830]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.head_commit.message == 'Trigger Stage 4 runtime token sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-durable-intent-final-20260830
      - name: Synchronize exact repaired runtime build token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='runtime-bec66cf2784e2a2b'; new='runtime-7c23ea058a84cda1'
          if s.count(old)!=8: raise SystemExit(f'expected 8 old runtime tokens, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync Stage 4 runtime identity'
          git push origin HEAD:fix/stage4-durable-intent-final-20260830
