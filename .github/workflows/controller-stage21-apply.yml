name: Controller Stage 21 convergence applicator
on:
  push:
    branches:
      - controller-v2/stage21-convergence-20260904
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply convergence correction and capture diagnostics
        id: applicator
        shell: bash
        run: |
          set +e
          : > stage21-apply.log
          python3 controller-stage21-hotfix.py >> stage21-apply.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 controller-stage21-apply.py >> stage21-apply.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            rm controller-stage21-hotfix.py
            rm controller-stage21-apply.py
            rm .github/workflows/controller-stage21-apply.yml
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload applicator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage21-applicator-diagnostics
          path: stage21-apply.log
          if-no-files-found: error
      - name: Require applicator success
        run: |
          cat stage21-apply.log
          test "${{ steps.applicator.outputs.status }}" = "0"
      - name: Focused Stage 21 proof
        id: focused
        shell: bash
        run: |
          set +e
          : > stage21-focused.log
          python3 -m http.server 4173 >/tmp/closed-loop-stage21-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          {
            node --check workflow-schema.js &&
            node --check workflow-engine.js &&
            node --check app-core.js &&
            node verify-convergence.mjs &&
            node verify-due-stage-timing.mjs &&
            node verify-definition-of-done.mjs &&
            node verify-complete.mjs &&
            node verify-browser.mjs &&
            node verify-full-cycle.mjs
          } >> stage21-focused.log 2>&1
          status=$?
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused proof diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage21-focused-diagnostics
          path: |
            stage21-focused.log
            workflow-engine.js
            workflow-schema.js
            app-core.js
            verify-browser.mjs
            verify-full-cycle.mjs
            verify-convergence.mjs
            index.html
          if-no-files-found: error
      - name: Require focused proof success
        run: |
          cat stage21-focused.log
          test "${{ steps.focused.outputs.status }}" = "0"
      - name: Commit actual Stage 21 implementation
        run: |
          set -euo pipefail
          rm -f stage21-apply.log stage21-focused.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'Stage 21: close application-owned convergence'
          git push origin HEAD:controller-v2/stage21-convergence-20260904
