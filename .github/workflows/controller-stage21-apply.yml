name: Controller Stage 21 convergence applicator
on:
  push:
    branches:
      - controller-v2/stage21-convergence-20260904
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply convergence correction and remove temporary delivery files
        run: |
          set -euo pipefail
          python3 controller-stage21-hotfix.py
          python3 controller-stage21-apply.py
          rm controller-stage21-hotfix.py
          rm controller-stage21-apply.py
          rm .github/workflows/controller-stage21-apply.yml
      - name: Focused Stage 21 proof
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check app-core.js
          node verify-convergence.mjs
          node verify-due-stage-timing.mjs
          node verify-definition-of-done.mjs
          node verify-complete.mjs
          node verify-browser.mjs
          node verify-full-cycle.mjs
      - name: Commit actual Stage 21 implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'Stage 21: close application-owned convergence'
          git push origin HEAD:controller-v2/stage21-convergence-20260904
