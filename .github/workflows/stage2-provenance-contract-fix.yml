name: Stage 2 provenance contract correction
on:
  push:
    branches: [fix/stage2-provenance-contract-20260826]
permissions:
  contents: write
jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage2-provenance-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimum semantic fixes
        run: |
          node .github/apply-stage2-provenance-contract-fix.mjs
          sed -i 's#closed-loop-response-contract/2.3#closed-loop-response-contract/2.4#g' verify-prompt-semantics.mjs
      - name: Syntax checks
        run: |
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node --check verify-prompt-semantics.mjs
      - name: Core verification
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser verification
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/stage2-provenance-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove temporary repair scaffolding
        run: rm -f .github/apply-stage2-provenance-contract-fix.mjs .github/workflows/stage2-provenance-contract-fix.yml
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Stage 2 external-source and provenance contract"
          git push origin HEAD:fix/stage2-provenance-contract-20260826
