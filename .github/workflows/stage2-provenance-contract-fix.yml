name: Stage 2 provenance contract correction
on:
  push:
    branches: [fix/stage2-provenance-contract-20260826]
permissions:
  contents: write
jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage2-provenance-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimum semantic fixes
        run: |
          node .github/apply-stage2-provenance-contract-fix.mjs
          sed -i 's#closed-loop-response-contract/2.3#closed-loop-response-contract/2.4#g' verify-prompt-semantics.mjs
          sed -i 's#Stage 02 owns independent external-source discovery, inspection, authority classification, currency, supersession, applicability, and external-source conflicts.#Stage 02 owns independent external-source discovery and assessment.#' prompt-engine.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-prompt-semantics.mjs')
          s=p.read_text()
          old="const required2=[/complete source and supplied-material inventory/i,/Stage 02 owns inventory and inspection/i,/Do not perform Stage 03 substantive source research or derive requirements yet/i];"
          new="const required2=[/Stage 02 is not a supplied-project-material inventory stage/i,/Missing project-material bytes do not by themselves block Stage 02/i,/Do not perform Stage 03 substantive source research or derive requirements yet/i];"
          if s.count(old)!=1: raise SystemExit(f'expected one Stage 02 boundary assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');};
          const manifest=files.map(file=>`${file}:${blob(file)}\n`).join('');
          const id=`runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[0-9a-f]{16}/g,id);
          fs.writeFileSync('index.html',html);
          console.log(JSON.stringify({runtimeBuildIdentity:id}));
          NODE
      - name: Syntax checks
        run: |
          node --check workflow-schema.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-ingestion.mjs
          node --check verify-prompt-semantics.mjs
      - name: Core verification
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Browser verification
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/stage2-provenance-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove temporary repair scaffolding
        run: rm -f .github/apply-stage2-provenance-contract-fix.mjs .github/workflows/stage2-provenance-contract-fix.yml
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Stage 2 external-source and provenance contract"
          git push origin HEAD:fix/stage2-provenance-contract-20260826
