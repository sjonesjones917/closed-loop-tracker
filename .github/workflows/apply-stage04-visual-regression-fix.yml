name: Apply retained verification correction
on:
  push:
    branches: [fix/restore-controlling-verification-20260831b]
    paths: [.github/workflows/apply-stage04-visual-regression-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-verification-20260831b
      - name: Prepare Stage 02 isolation fixtures through Stage 01
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="const pa=prompts.buildPromptRecord(2,blank('JOB-A')).prompt,pb=prompts.buildPromptRecord(2,blank('JOB-B')).prompt;if(pa.includes('JOB-B')||pb.includes('JOB-A'))throw new Error('Cross-project prompt contamination detected.');"
          new="const pA=blank('JOB-A'),pB=blank('JOB-B');for(const fixture of [pA,pB]){fixture.stages[1].status='COMPLETE';fixture.stages[1].gate={complete:true,blocked:false,reasons:[]};}const pa=prompts.buildPromptRecord(2,pA).prompt,pb=prompts.buildPromptRecord(2,pB).prompt;if(pa.includes('JOB-B')||pb.includes('JOB-A'))throw new Error('Cross-project prompt contamination detected.');"
          if old not in s: raise SystemExit('expected Stage 02 isolation fixture not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit minimal correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs
          git commit -m "Prepare Stage 02 isolation fixtures through Stage 01"
          git push origin HEAD:fix/restore-controlling-verification-20260831b
