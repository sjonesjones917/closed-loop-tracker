name: Apply retained verification correction
on:
  push:
    branches: [fix/restore-controlling-verification-20260831b]
    paths: [.github/workflows/apply-stage04-visual-regression-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-verification-20260831b
      - name: Remove obsolete duplicate Stage 01 authorization-file dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="const files=['index.html','app-core.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','workbook.js','TEST_PROJECT.json','AUTHORIZED_OPERATION_01.txt'];"
          new="const files=['index.html','app-core.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','workbook.js','TEST_PROJECT.json'];"
          if old not in s: raise SystemExit('expected obsolete file dependency not found')
          s=s.replace(old,new,1)
          old="const operation01=fs.readFileSync('AUTHORIZED_OPERATION_01.txt','utf8').trim();\nif(retained.generatedOutputs?.[0]?.output!==operation01||retained.stageRecords?.['1']?.output!==operation01)throw new Error('Authorized Operation 01 output was not preserved exactly.');"
          new="const operation01=String(retained.generatedOutputs?.[0]?.output||'');\nif(!operation01.trim()||retained.stageRecords?.['1']?.output!==operation01)throw new Error('Retained Stage 01 output is missing or inconsistent across preserved history.');"
          if old not in s: raise SystemExit('expected obsolete Stage 01 duplicate comparison not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit minimal correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs
          git commit -m "Remove obsolete Stage 01 authorization-file test dependency"
          git push origin HEAD:fix/restore-controlling-verification-20260831b
