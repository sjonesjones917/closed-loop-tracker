name: Apply retained verification correction
on:
  push:
    branches: [fix/restore-controlling-verification-20260831b]
    paths: [.github/workflows/apply-stage04-visual-regression-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-verification-20260831b
      - name: Make synthetic prompt fixtures satisfy production prerequisites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs')
          s=p.read_text()
          old="for(let stage=1;stage<=30;stage++){const p=blank(`JOB-PROMPT-${stage}`);if(stage===4)prepareStage4(p);const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));"
          new="for(let stage=1;stage<=30;stage++){const p=blank(`JOB-PROMPT-${stage}`);if(stage===4)prepareStage4(p);else for(let prior=1;prior<stage;prior++){p.stages[prior].status='COMPLETE';p.stages[prior].gate={complete:true,blocked:false,reasons:[]};}const record=prompts.buildPromptRecord(stage,p,syntheticPromptOptions(stage,p));"
          if old not in s: raise SystemExit('expected synthetic prompt loop not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit minimal correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.mjs
          git commit -m "Prepare prerequisite state in synthetic prompt verification"
          git push origin HEAD:fix/restore-controlling-verification-20260831b
