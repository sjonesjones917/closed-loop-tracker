name: Repair file-first browser selection state
on:
  push:
    branches: [fix/spec-driven-file-first-20260902]
    paths:
      - repair-file-first-browser-state.mjs
      - .github/workflows/repair-file-first-browser-state.yml
  pull_request:
    branches: [main]
    paths:
      - repair-file-first-browser-state.mjs
      - .github/workflows/repair-file-first-browser-state.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-driven-file-first-20260902
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply minimal owner fix and permanent regression
        run: node repair-file-first-browser-state.mjs
      - name: Prove static file-first regression
        run: |
          node --check app-core.js
          node verify-file-first-operator.mjs
      - name: Prove exact live malformed-response path
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          export BROWSER
          python3 -m http.server 4173 >/tmp/closed-loop-repair-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Remove one-time scaffolding and commit whole ratchet step
        run: |
          rm -f repair-file-first-browser-state.mjs .github/workflows/repair-file-first-browser-state.yml
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo 'No repair diff produced'; exit 1; } || true
          git commit -m "Fix file-first response selection state"
          git push origin HEAD:fix/spec-driven-file-first-20260902
