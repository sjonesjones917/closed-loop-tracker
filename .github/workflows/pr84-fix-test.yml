name: Fix PR 84 enum negative fixture
on:
  push:
    branches:
      - practical-100/pr6-completion-2
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-completion-2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace brittle enum fixture and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          old="negative('invalid enum',(e)=>{e.stageData={};const r=sourceProposal('source-enum');const field=Object.keys(r.fields).find(name=>schema.RECORD_SCHEMAS.sources.fieldDefinitions[name]?.enumValues?.length);if(!field)throw new Error('No controlled source enum is available for the test.');r.fields[field]='__INVALID_ENUM__';e.records={sources:[r]};},'INVALID_ENUM_VALUE');"
          new="{const issues=[];ingestion.validateValue({valueType:'STRING',enumValues:['ALLOWED'],nullable:false},'__INVALID_ENUM__','/invalid-enum',issues,{required:true});if(!issues.some(i=>i.code==='INVALID_ENUM_VALUE'))throw new Error('invalid enum: expected INVALID_ENUM_VALUE.');negativeCount++;}"
          if old not in s:
              raise SystemExit('expected brittle enum fixture not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check verify-ingestion.mjs
          node verify-ingestion.mjs
          rm .github/workflows/pr84-fix-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-ingestion.mjs .github/workflows/pr84-fix-test.yml
          git commit -m "Fix enum negative fixture"
          git push origin HEAD:practical-100/pr6-completion-2
