name: Materialize verified PR6 source

on:
  push:
    branches: [practical-100/pr6-acceptance-proof]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch immutable patch blob and apply it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB: 3c98b1ac259b9a252b8e617c35a7a27bb3750ff6
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$PATCH_BLOB" > /tmp/blob.json
          python3 - <<'PY'
          import base64,json,pathlib
          obj=json.load(open('/tmp/blob.json'))
          pathlib.Path('/tmp/pr6.patch.gz').write_bytes(base64.b64decode(obj['content']))
          PY
          gzip -t /tmp/pr6.patch.gz
          gzip -dc /tmp/pr6.patch.gz > /tmp/pr6.patch
          git apply --check /tmp/pr6.patch
          git apply /tmp/pr6.patch
      - name: Prove source before commit
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-full-cycle.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Commit only verified PR6 source and remove transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pr6-patch .pr6-transport
          rm -f .github/workflows/pr6-recover-source.yml .github/workflows/pr6-source-export.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'PR 6: materialize verified acceptance source'
          git push origin HEAD:practical-100/pr6-acceptance-proof
