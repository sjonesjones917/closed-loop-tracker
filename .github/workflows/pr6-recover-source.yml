name: Recover PR6 reviewable source

on:
  push:
    branches: [practical-100/pr6-acceptance-proof]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate exact transported patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin practical-100/pr6-final-acceptance
          {
            git show origin/practical-100/pr6-final-acceptance:.pr6-transport/part00
            git show origin/practical-100/pr6-final-acceptance:.pr6-transport/part01
          } | tr -d '\r\n' | base64 --decode > /tmp/pr6.patch.gz
          gzip -t /tmp/pr6.patch.gz
          gzip -dc /tmp/pr6.patch.gz > /tmp/pr6.patch
          test -s /tmp/pr6.patch
          grep -q '^diff --git ' /tmp/pr6.patch
          sha256sum /tmp/pr6.patch.gz /tmp/pr6.patch > /tmp/pr6.sha256
          wc -c -l /tmp/pr6.patch.gz /tmp/pr6.patch
      - uses: actions/upload-artifact@v4
        with:
          name: pr6-exact-transport
          path: |
            /tmp/pr6.patch.gz
            /tmp/pr6.patch
            /tmp/pr6.sha256
          if-no-files-found: error
          retention-days: 1
