name: Recover PR6 reviewable source
on:
  push:
    branches: [practical-100/pr6-acceptance-proof]
permissions:
  contents: write
concurrency:
  group: pr6-recover-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and inspect the transported patch in an isolated worktree
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          old=aa8a2b26f03f7db302ee22f7b6954b635cb73253
          base=10dc739a9bd088b0df70d1bf6fee776ef09c55eb
          git show "$old:.pr6-patch/part00" > /tmp/pr6-part00
          git show "$old:.pr6-patch/part01" > /tmp/pr6-part01
          cat /tmp/pr6-part00 /tmp/pr6-part01 | tr -d '\r\n' | base64 --decode > /tmp/pr6.patch.gz
          set +e
          gzip -dc /tmp/pr6.patch.gz > /tmp/pr6.patch 2>/tmp/pr6-gzip-error.txt
          gzip_status=$?
          set -e
          printf 'gzip_status=%s\n' "$gzip_status" | tee /tmp/pr6-recovery-status.txt
          wc -c /tmp/pr6.patch.gz /tmp/pr6.patch | tee -a /tmp/pr6-recovery-status.txt
          cat /tmp/pr6-gzip-error.txt | tee -a /tmp/pr6-recovery-status.txt
          test -s /tmp/pr6.patch
          grep '^diff --git ' /tmp/pr6.patch | tee /tmp/pr6-files.txt
          git worktree add --detach /tmp/pr6-work "$base"
          git -C /tmp/pr6-work apply --stat /tmp/pr6.patch | tee /tmp/pr6-stat.txt
          git -C /tmp/pr6-work apply --check /tmp/pr6.patch
          git -C /tmp/pr6-work apply /tmp/pr6.patch
      - name: Verify recovered source and capture the exact lifecycle result
        id: verify
        shell: bash
        working-directory: /tmp/pr6-work
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          set +e
          if test -f verify-full-cycle.mjs; then
            node verify-full-cycle.mjs > /tmp/pr6-full-cycle.log 2>&1
            lifecycle_status=$?
          else
            printf '%s\n' 'Recovered patch contains no verify-full-cycle.mjs.' > /tmp/pr6-full-cycle.log
            lifecycle_status=127
          fi
          set -e
          cat /tmp/pr6-full-cycle.log
          printf 'lifecycle_status=%s\n' "$lifecycle_status" | tee -a /tmp/pr6-recovery-status.txt
      - name: Commit recovered reviewable files and remove all transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git /tmp/pr6-work/ ./
          rm -rf .pr6-patch .github/workflows/pr6-source-export.yml .github/workflows/pr6-recover-source.yml
          python - <<'PY'
          from pathlib import Path
          path=Path('verify-live.mjs')
          text=path.read_text()
          text=text.replace('ACCEPTED_CANONICAL_CHANGE','ACCEPTED_DATA_CHANGE')
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "PR 6: recover acceptance proof source"
          git push origin HEAD:practical-100/pr6-acceptance-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr6-source-recovery-diagnostics
          path: |
            /tmp/pr6-recovery-status.txt
            /tmp/pr6-gzip-error.txt
            /tmp/pr6-files.txt
            /tmp/pr6-stat.txt
            /tmp/pr6-full-cycle.log
          if-no-files-found: warn
          retention-days: 7
