name: Materialize verified PR6 source

on:
  push:
    branches: [practical-100/pr6-acceptance-proof]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct verified patch and tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA256: 581ce3b61c60bc8c227669614c9b9cec1e4ea9a907268e68e5663eb51a6e94d8
          PATCH_BLOBS: >-
            044e25439da1d8d5f87d94905427ae3306ab70f3
            77b48bc5cc61ab015da26b35fb26caa5cbfc5e42
            3b77dc6554873a5030629a4d1a91030c42f79bad
            e462e763b808f74d141a9e6e43eb2519f0dfa95c
            e76d9193853c2097f5273b03bfef12a17ee61918
            02c919028f0bac6767788f6e51477a13a6355d7a
            0f1bf5c9ff2a7403d2ac226cfc248e6b0940bcb1
            1d11f55d20e237f5a9fc02f9799958dfeaeb06b6
          FIXTURE_BLOB: ba957970cac9a49b802d3fbdb08064d65461373e
          FIXTURE_SHA256: 619837541e8f648a3279f98ca96cbf1ab75f12341c14bdefdff782b4dc77aa01
          FULL_CYCLE_BLOBS: >-
            5a3e37feff146071aa6faaa6ec4ab021d902c011
            e614bb0e2e032b3830b3a6582b6da2cda6c0fe88
            b96cc1d107122f41e94d943f3a21b9fc94ae9394
            d48dd0ad658feea3b52b23a9a72cea78ddf3ee81
            f92ee99201309a31ad6c3b99c3fc131049132052
            ba82e134883a615b5e2fc75e4ca829667496cb18
            38b3db0e7ca6450a012bc805f4da8eb5a26ee1e9
            9a1941bfc3ec3c8c8b3bbd254c4b067edddfa074
          FULL_CYCLE_SHA256: 2d0caf951734dfad9e8f50673d26dbd0837eb4c318642f490f76f42710550cc1
        run: |
          set -euo pipefail
          fetch_blob() {
            local blob="$1" out="$2"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$blob" > /tmp/blob.json
            python3 - "$out" <<'PY'
          import base64,json,pathlib,sys
          obj=json.load(open('/tmp/blob.json'))
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(obj['content']))
          PY
          }

          : > /tmp/pr6.patch.gz
          n=0
          for blob in $PATCH_BLOBS; do
            fetch_blob "$blob" "/tmp/patch-part-$n"
            cat "/tmp/patch-part-$n" >> /tmp/pr6.patch.gz
            n=$((n+1))
          done
          echo "$PATCH_SHA256  /tmp/pr6.patch.gz" | sha256sum --check --strict
          test "$(wc -c < /tmp/pr6.patch.gz)" -eq 37734
          gzip -t /tmp/pr6.patch.gz
          gzip -dc /tmp/pr6.patch.gz > /tmp/pr6.patch
          git apply --check /tmp/pr6.patch
          git apply /tmp/pr6.patch

          fetch_blob "$FIXTURE_BLOB" test-fixtures.mjs
          echo "$FIXTURE_SHA256  test-fixtures.mjs" | sha256sum --check --strict
          test "$(wc -c < test-fixtures.mjs)" -eq 1608

          : > verify-full-cycle.mjs
          n=0
          for blob in $FULL_CYCLE_BLOBS; do
            fetch_blob "$blob" "/tmp/full-cycle-part-$n"
            cat "/tmp/full-cycle-part-$n" >> verify-full-cycle.mjs
            n=$((n+1))
          done
          echo "$FULL_CYCLE_SHA256  verify-full-cycle.mjs" | sha256sum --check --strict
          test "$(wc -c < verify-full-cycle.mjs)" -eq 36284

      - name: Prove source before commit
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check test-fixtures.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs

      - name: Commit only verified PR6 source and remove transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pr6-patch .pr6-transport
          rm -f .github/workflows/pr6-recover-source.yml .github/workflows/pr6-source-export.yml .github/workflows/pr6-export-partial.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'PR 6: materialize verified acceptance source'
          git push origin HEAD:practical-100/pr6-acceptance-proof
