name: Apply prompt data closure repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair prompt authority and one-time project data reuse
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('prompt-engine.js')
          text = p.read_text()

          text = text.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/39';", "const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/40';", 1)

          marker = "function body(stage,state,operation,scope){"
          if marker not in text:
              raise SystemExit('prompt body marker not found')

          helper = r'''function projectDataExecutionRule(stage){const lines=['PROJECT DATA EXECUTION RULE — MANDATORY','Project-relevant information supplied by the human is supplied once. Stage 01 is the one-time capture boundary and accepted project meaning must be carried forward in canonical context.','Never ask the human to repeat, retype, summarize, resend, reopen, or reattach project information already present in current User Job Input, accepted Stage 01 capture, accepted canonical records, accessible canonical artifacts, or authorized research.','If this stage needs a fact already established upstream, use the supplied current canonical data directly. If required upstream data is actually missing because the responsible earlier stage is incomplete, do not substitute a new human request; the stage must remain blocked at the responsible missing authority or upstream work.','Agent instructions exist only in this generated prompt. UI labels, helper text, record cards, and architecture descriptions are not agent instructions.','Perform the complete current stage and current operation now, and only that stage and operation. Do not merely describe what should be done and do not perform later-stage work.'];if(stage>1)lines.push('The original Stage 01 intent file is prohibited input for this stage. Its materially relevant contents must already be represented by accepted Stage 01 capture and current canonical context. Do not request, require, reopen, resend, or reattach that original file again.');if(stage===1)lines.push('Exhaust human-authority intake before Stage 01 completion: every application-enumerated input unit must be classified exactly once, every materially relevant human-authority statement must be preserved, and every foreseeable genuinely human-only BLOCKING_NOW or ASK_NOW_NONBLOCKING issue must be asked before final Stage 01 JSON unless already answered. Never silently move an unasked human-only issue into UNKNOWN_INFORMATION.');if(stage===3)lines.push('Stage 03 is exhaustive source research: every current Stage 02 source must have current coverage, the conflict/exception pass and second complete pass must be performed, and Stage 03 must not complete while the latest complete pass finds a new material requirement category.');if(stage===4)lines.push('Stage 04 may be generated only after Stage 01 intake accounting and Stage 03 research are complete. Use the complete application-supplied Stage 01 + Stage 03 union and obligation manifest. Do not rediscover the input universe and do not ask the human to supply any information or file already captured upstream.');return lines.join('\n');}
'''
          if 'function projectDataExecutionRule(stage)' not in text:
              text = text.replace(marker, helper + marker, 1)

          old = "return `COPY BLOCK — STAGE ${String(stage).padStart(2,'0')} — ${definition.title}\\n\\nHUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE"
          new = "return `COPY BLOCK — STAGE ${String(stage).padStart(2,'0')} — ${definition.title}\\n\\n${projectDataExecutionRule(stage)}\\n\\nHUMAN COLLABORATION MODE — APPLIES TO EVERY STAGE"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('prompt body insertion point not found')

          old_stage4 = "The application rejects missing or duplicate obligation accounting. Do not request the original intent file again: the Stage 01 capture and application manifest are the controlling human-authority input for Stage 04."
          new_stage4 = "The application rejects missing or duplicate obligation accounting. The complete Stage 01 capture, current User Job Input, Stage 03 research/candidate obligations, applicable source identities/evidence, and application obligation manifest below are the controlling Stage 04 inputs. Do not request, reopen, attach, resend, restate, summarize, or retype the original intent file or any project information already represented there."
          if old_stage4 in text:
              text = text.replace(old_stage4, new_stage4, 1)

          p.write_text(text)
          PY
          rm .github/workflows/apply-prompt-data-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js .github/workflows/apply-prompt-data-closure.yml
          git commit -m "Close prompt project-data reuse across all stages"
          git push origin HEAD:main
