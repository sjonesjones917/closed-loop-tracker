name: One-time Stage 10 proof isolation

on:
  push:
    branches: [controller-stage10-authoritative-prompt-20260903]

permissions:
  contents: write

jobs:
  repair-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage10-authoritative-prompt-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply the exact current Stage 10 repair script
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Rebase repair on exact current main and apply minimal Stage 10 correction/{found=1;next}
            found && /- name: Prove Stage 10 and affected prior paths/{exit}
            found && /^        run: \|/{inrun=1;next}
            found && inrun{sub(/^          /,""); print}
          ' .github/workflows/controller-stage10-repair.yml > /tmp/stage10-repair.sh
          test -s /tmp/stage10-repair.sh
          bash /tmp/stage10-repair.sh
          node <<'NODE'
          const fs=require('fs');
          let p=fs.readFileSync('prompt-engine.js','utf8');
          const replacements=[
            ["inputVersion:job.CURRENT_INPUT_VERSION||null","inputVersion:own('inputVersion',job.CURRENT_INPUT_VERSION||null)"],
            ["sourceSetVersion:job.CURRENT_SOURCE_SET_VERSION||null","sourceSetVersion:own('sourceSetVersion',job.CURRENT_SOURCE_SET_VERSION||null)"],
            ["researchVersion:job.CURRENT_RESEARCH_VERSION||null","researchVersion:own('researchVersion',job.CURRENT_RESEARCH_VERSION||null)"],
            ["requirementsVersion:job.CURRENT_REQUIREMENTS_VERSION||null","requirementsVersion:own('requirementsVersion',job.CURRENT_REQUIREMENTS_VERSION||null)"],
            ["testSuiteVersion:job.CURRENT_TEST_SUITE_VERSION||null","testSuiteVersion:own('testSuiteVersion',job.CURRENT_TEST_SUITE_VERSION||null)"],
            ["instructionVersion:job.CURRENT_INSTRUCTION_VERSION||null","instructionVersion:own('instructionVersion',job.CURRENT_INSTRUCTION_VERSION||null)"]
          ];
          for(const [a,b] of replacements){if(!p.includes(a))throw new Error(`prompt scope override anchor missing: ${a}`);p=p.replace(a,b);}
          fs.writeFileSync('prompt-engine.js',p);
          const path='verify-spec-grounded-route-oracle.mjs';
          let s=fs.readFileSync(path,'utf8');
          const oldLane="const lane={projectRevision:state.revision,inputVersion:state.job.CURRENT_INPUT_VERSION,sourceSetVersion:state.job.CURRENT_SOURCE_SET_VERSION,requirementsVersion:state.job.CURRENT_REQUIREMENTS_VERSION,testSuiteVersion:state.job.CURRENT_TEST_SUITE_VERSION,instructionVersion:state.job.CURRENT_INSTRUCTION_VERSION,iterationId:'ITER-ORACLE-v1',candidateId:'CAND-ORACLE-v1',runId:sent.runs.id,contextId:sent.freshContexts.id,baselineId:'BASE-ORACLE-v1',productId:'PROD-ORACLE-v1'};";
          const newLane="const lane={projectRevision:state.revision,inputVersion:state.job.CURRENT_INPUT_VERSION,sourceSetVersion:state.job.CURRENT_SOURCE_SET_VERSION,researchVersion:'RESEARCH-ORACLE-v1',requirementsVersion:state.job.CURRENT_REQUIREMENTS_VERSION,testSuiteVersion:state.job.CURRENT_TEST_SUITE_VERSION,instructionVersion:state.job.CURRENT_INSTRUCTION_VERSION,iterationId:'ITER-ORACLE-v1',candidateId:'CAND-ORACLE-v1',runId:sent.runs.id,sourceConvergedIterationId:'ITER-ORACLE-v1',confirmationIterationId:'CONFIRM-ORACLE-v1',baselineId:'BASE-ORACLE-v1',productId:'PROD-ORACLE-v1',productVersion:'PRODVER-ORACLE-v1',deliveryCandidateSetId:'DELIVERYSET-ORACLE-v1',reviewVersion:'REVIEW-ORACLE-v1',reconciledReviewVersion:'RECON-ORACLE-v1',releaseId:'RELEASE-ORACLE-v1',hashReviewId:'HASHREVIEW-ORACLE-v1',evidenceChainVersion:'CHAIN-ORACLE-v1'};";
          if(!s.includes(oldLane))throw new Error('route oracle lane anchor missing');
          fs.writeFileSync(path,s.replace(oldLane,newLane));
          NODE
      - name: Syntax proof
        run: node --check prompt-engine.js
      - name: Route-oracle proof
        run: node verify-spec-grounded-route-oracle.mjs
      - name: Build proof
        run: node build-test-project.mjs
      - name: Prompt semantics proof
        run: node verify-prompt-semantics.mjs
      - name: User prompt invariants proof
        run: node verify-user-prompt-invariants.mjs
      - name: File-first operator proof
        run: node verify-file-first-operator.mjs
      - name: File-first response proof
        run: node verify-file-first-response.mjs
      - name: Ingestion proof
        run: node verify-ingestion.mjs
      - name: Full-cycle proof
        run: node verify-full-cycle.mjs
      - name: Hash prior-stage proof
        run: node verify-hash.mjs
      - name: Governance prior-stage proof
        run: node verify-specification-governance.mjs
      - name: Commit integrated correction and remove transient workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/controller-stage10-repair.yml .github/workflows/controller-stage10-diagnostic.yml
          git add -A
          git commit -m "Repair authoritative Stage 10 prompt bytes"
          git push --force-with-lease origin HEAD:controller-stage10-authoritative-prompt-20260903
