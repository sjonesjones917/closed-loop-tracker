name: One-time Stage 10 proof isolation

on:
  push:
    branches: [controller-stage10-authoritative-prompt-20260903]

permissions:
  contents: write

jobs:
  repair-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller-stage10-authoritative-prompt-20260903
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply the exact current Stage 10 repair script
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Rebase repair on exact current main and apply minimal Stage 10 correction/{found=1;next}
            found && /- name: Prove Stage 10 and affected prior paths/{exit}
            found && /^        run: \|/{inrun=1;next}
            found && inrun{sub(/^          /,""); print}
          ' .github/workflows/controller-stage10-repair.yml > /tmp/stage10-repair.sh
          test -s /tmp/stage10-repair.sh
          bash /tmp/stage10-repair.sh
          node <<'NODE'
          const fs=require('fs');
          const path='verify-spec-grounded-route-oracle.mjs';
          let s=fs.readFileSync(path,'utf8');
          const a="CURRENT_SOURCE_SET_VERSION:'SOURCE-ORACLE-v1',CURRENT_REQUIREMENTS_VERSION:'REQ-ORACLE-v1'";
          const b="CURRENT_SOURCE_SET_VERSION:'SOURCE-ORACLE-v1',CURRENT_RESEARCH_VERSION:'RESEARCH-ORACLE-v1',CURRENT_REQUIREMENTS_VERSION:'REQ-ORACLE-v1'";
          if(!s.includes(a))throw new Error('route oracle research-version anchor missing');
          s=s.replace(a,b);
          const c="CURRENT_BASELINE_ID:'BASE-ORACLE-v1',CURRENT_PRODUCT_ID:'PROD-ORACLE-v1'";
          const d="CURRENT_BASELINE_ID:'BASE-ORACLE-v1',CURRENT_PRODUCT_ID:'PROD-ORACLE-v1',CURRENT_PRODUCT_VERSION:'PRODVER-ORACLE-v1',CURRENT_DELIVERY_CANDIDATE_SET_ID:'DELIVERYSET-ORACLE-v1',CURRENT_REVIEW_VERSION:'REVIEW-ORACLE-v1',CURRENT_RECONCILED_REVIEW_VERSION:'RECON-ORACLE-v1',CURRENT_RELEASE_ID:'RELEASE-ORACLE-v1',CURRENT_HASH_REVIEW_ID:'HASHREVIEW-ORACLE-v1',CURRENT_EVIDENCE_CHAIN_VERSION:'CHAIN-ORACLE-v1'";
          if(!s.includes(c))throw new Error('route oracle terminal-version anchor missing');
          s=s.replace(c,d);
          const oldLane="const lane={projectRevision:state.revision,inputVersion:state.job.CURRENT_INPUT_VERSION,sourceSetVersion:state.job.CURRENT_SOURCE_SET_VERSION,requirementsVersion:state.job.CURRENT_REQUIREMENTS_VERSION,testSuiteVersion:state.job.CURRENT_TEST_SUITE_VERSION,instructionVersion:state.job.CURRENT_INSTRUCTION_VERSION,iterationId:'ITER-ORACLE-v1',candidateId:'CAND-ORACLE-v1',runId:sent.runs.id,contextId:sent.freshContexts.id,baselineId:'BASE-ORACLE-v1',productId:'PROD-ORACLE-v1'};";
          const newLane="const lane={projectRevision:state.revision,inputVersion:state.job.CURRENT_INPUT_VERSION,sourceSetVersion:state.job.CURRENT_SOURCE_SET_VERSION,researchVersion:state.job.CURRENT_RESEARCH_VERSION,requirementsVersion:state.job.CURRENT_REQUIREMENTS_VERSION,testSuiteVersion:state.job.CURRENT_TEST_SUITE_VERSION,instructionVersion:state.job.CURRENT_INSTRUCTION_VERSION,iterationId:'ITER-ORACLE-v1',candidateId:'CAND-ORACLE-v1',runId:sent.runs.id,sourceConvergedIterationId:'ITER-ORACLE-v1',confirmationIterationId:'CONFIRM-ORACLE-v1',baselineId:'BASE-ORACLE-v1',productId:'PROD-ORACLE-v1',productVersion:state.job.CURRENT_PRODUCT_VERSION,deliveryCandidateSetId:state.job.CURRENT_DELIVERY_CANDIDATE_SET_ID,reviewVersion:state.job.CURRENT_REVIEW_VERSION,reconciledReviewVersion:state.job.CURRENT_RECONCILED_REVIEW_VERSION,releaseId:state.job.CURRENT_RELEASE_ID,hashReviewId:state.job.CURRENT_HASH_REVIEW_ID,evidenceChainVersion:state.job.CURRENT_EVIDENCE_CHAIN_VERSION};";
          if(!s.includes(oldLane))throw new Error('route oracle lane anchor missing');
          s=s.replace(oldLane,newLane);
          const oldOrder="for(const [c,list] of producers){for(const producer of list)for(const consumer of consumers.get(c)||[])assert(producer.stage<consumer.stage||(producer.stage===consumer.stage&&producer.operation===consumer.operation)||[17,19].includes(producer.stage),`${c}: later-stage producer ${producer.stage}/${producer.operation} is routed into earlier ${consumer.stage}/${consumer.operation}.`);}";
          const newOrder="for(const [c,list] of producers){for(const producer of list)for(const consumer of consumers.get(c)||[]){const sameStage=producer.stage===consumer.stage;const order=schema.STAGE_OPERATIONS[producer.stage]||[];const producerIndex=order.indexOf(producer.operation),consumerIndex=order.indexOf(consumer.operation);const forwardSameStage=sameStage&&producerIndex>=0&&consumerIndex>=0&&producerIndex<=consumerIndex;assert(producer.stage<consumer.stage||forwardSameStage,`${c}: producer ${producer.stage}/${producer.operation} is routed backward into ${consumer.stage}/${consumer.operation}.`);}}";
          if(!s.includes(oldOrder))throw new Error('route oracle ordering anchor missing');
          s=s.replace(oldOrder,newOrder);
          fs.writeFileSync(path,s);
          NODE
      - name: Syntax proof
        run: node --check prompt-engine.js
      - name: Route-oracle proof
        run: node verify-spec-grounded-route-oracle.mjs
      - name: Build proof
        run: node build-test-project.mjs
      - name: Prompt semantics proof
        run: node verify-prompt-semantics.mjs
      - name: User prompt invariants proof
        run: node verify-user-prompt-invariants.mjs
      - name: File-first operator proof
        run: node verify-file-first-operator.mjs
      - name: File-first response proof
        run: node verify-file-first-response.mjs
      - name: Ingestion proof
        run: node verify-ingestion.mjs
      - name: Full-cycle proof
        run: node verify-full-cycle.mjs
      - name: Hash prior-stage proof
        run: node verify-hash.mjs
      - name: Governance prior-stage proof
        run: node verify-specification-governance.mjs
      - name: Commit integrated correction and remove transient workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/controller-stage10-repair.yml .github/workflows/controller-stage10-diagnostic.yml
          git add -A
          git commit -m "Repair authoritative Stage 10 prompt bytes"
          git push --force-with-lease origin HEAD:controller-stage10-authoritative-prompt-20260903
