name: Materialize prompt closure
on:
  push:
    branches:
      - fix/materialize-all-stage-prompt-closure-20260830
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize all-stage prompt context and completion boundaries
        shell: bash
        run: |
          echo '' | base64 -d | python
          rm -f .github/workflows/apply-all-stage-prompt-context-closure.yml
          rm -f .github/workflows/apply-operator-conversation-state.yml
          rm -f .github/workflows/materialize-prompt-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js .github/workflows
          git commit -m "Materialize all-stage prompt context and completion boundaries"
          git push origin HEAD:fix/materialize-all-stage-prompt-closure-20260830
