name: Synchronize Stage 4 runtime identity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write

jobs:
  synchronize:
    if: github.head_ref == 'automation/stage4-materializer-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute, apply, and prove the exact shared runtime identity
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com

          node <<'NODE'
          const fs = require('fs');
          const {createHash} = require('crypto');
          const runtimeFiles = ['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha = file => {
            const bytes = fs.readFileSync(file);
            return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          };
          const manifest = runtimeFiles.map(file => `${file}:${gitBlobSha(file)}\n`).join('');
          const runtimeIdentity = `runtime-${createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html = fs.readFileSync('index.html', 'utf8');
          let changed = 0;
          html = html.replace(/(<script defer src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+("><\/script>)/g, (_match, prefix, suffix) => {
            changed += 1;
            return prefix + runtimeIdentity + suffix;
          });
          if (changed !== runtimeFiles.length) throw new Error(`Expected ${runtimeFiles.length} runtime script identities; changed ${changed}.`);
          fs.writeFileSync('index.html', html);
          fs.unlinkSync('.github/workflows/stage4-token-sync.yml');
          console.log(JSON.stringify({runtimeIdentity,updatedScripts:changed}));
          NODE

          node verify-hash.mjs
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
          git diff --check
          git add -A
          git diff --cached --check
          git commit -m "Synchronize runtime identity for Stage 4 persisted prompt fix"
          git push origin "HEAD:${BRANCH}"
          gh workflow run pages.yml --ref "$BRANCH"
