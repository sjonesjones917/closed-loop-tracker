name: Apply Stage 04 canonical intent reuse
on:
  push:
    branches: [fix/stage04-canonical-intent-reuse-20260830]
    paths: [.github/workflows/stage4-canonical-reuse-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage04-canonical-intent-reuse-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source and regression deltas
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          apply_delta() {
            file="$1"
            encoded="$2"
            printf '%s' "$encoded" | base64 -d > "$file.stage4.zst"
            cp "$file" "$file.stage4.base"
            zstd -q -d --patch-from="$file.stage4.base" "$file.stage4.zst" -o "$file.stage4.new"
            mv "$file.stage4.new" "$file"
            rm -f "$file.stage4.base" "$file.stage4.zst"
          }
          apply_delta app-core.js 'KLUv/aQFFQIAzAQAAgMKD9DnJN8ko49IHgBAdgODA8dMaTejx61s+Clyz5h4c+uwPylxtnEKCB2gAE1uGgMgwogQiURC9AGsZYQKagrR8JwKRZCaeghPkhRs1nN+cy+QkLBlD9xIlDI5d7ioI59rFq9ViPQ0oTsOiNlHpSBF5+O12IrZDLvAAOhzcuqzlimdCY3wwKGHunFtnUb0SQEfHnzSgs5yTQAAAAEAAoVQoY9AaM3Rdw=='
          apply_delta index.html 'KLUv/WQNbb0BAIg8ODY2YzYyYjM0ODRiY2E1NhCg0Nd/AzAn0z0DQsT4jrgOibOo4XQ6hh7OIYITAiTdK4S7px2FqmBU'
          apply_delta prompt-engine.js ''
          apply_delta verify-browser.mjs 'KLUv/WQWu/UDADQCaSwnMWVmaW5pdGlvbjMgZmlzcmVzZW5kaW50ZW5lcnZpZXcYoFBVIa0BEE6EiAlEog9KJYMnz1T4j4JHVX5Qob/rRXhod/VOTaE96vKuY0sL9KoMhVjk5t0O8lPYLzuJl0c/vYvGsvkuYkj5McS2I5GE0UtGtqkEk6enH/pLWMA='
          apply_delta verify-complete.mjs ''
          apply_delta verify-prompt-semantics.mjs ''
          apply_delta verify-test-runtime.mjs ''
          apply_delta workflow-engine.js 'KLUv/aT0NgMAXAAACCgBAPz/aETzKARlBQAiwwsRoD1kkksxkRN/t74vnuA/BAEGCO9lC+V0kdWvo4JfS2/lHPm3INiUjBC5/zcdDSGAIK2UtgFh073NuGtjDV1O23hjjQP+hYEQBKMB0OlPuUhQhbP82ZxVI0YRQDNDZiEpGnHUYN4GpPtsCXaENcoiYY26g7lABDUWk5q4AIV7rowGSnQQg0LwpiKEgKq8cH1xm3g1Ki1bxlrva9uMvaBWd8ZfSA+NqB5XOTg9Iw=='
          rm -rf .stage4-fix .stage4-canonical-reuse-payload
          grep -q 'Do not attach or resend the original intent file' workflow-engine.js
          ! grep -q 'function suppliedMaterialReferences' workflow-engine.js
          ! grep -q 'MATERIALS TO SEND WITH THIS STAGE 04 INSTRUCTION' prompt-engine.js
      - name: Syntax checks
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-test-runtime.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-complete.mjs
          node --check verify-browser.mjs
      - name: Deterministic and semantic regression proof
        run: |
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Browser regression proof
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/stage4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for script in verify-browser.mjs verify-browser-extra.mjs; do
            success=false
            for attempt in 1 2 3; do
              if node "$script"; then success=true; break; fi
              test "$attempt" -lt 3 || exit 1
            done
            test "$success" = true
          done
      - name: Commit proved correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-stage4-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add workflow-engine.js prompt-engine.js app-core.js index.html verify-test-runtime.mjs verify-prompt-semantics.mjs verify-complete.mjs verify-browser.mjs
          git add -A .stage4-fix .stage4-canonical-reuse-payload
          git diff --cached --check
          git commit -m 'Fix Stage 04 canonical intent reuse'
          git push origin HEAD:fix/stage04-canonical-intent-reuse-20260830
