name: Apply Stage 25 representation closure

on:
  push:
    branches:
      - fix/stage25-representation-closure-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage25-representation-closure-20260830
      - run: python apply-stage25-representation-closure.py
      - run: |
          rm -f .github/workflows/apply-stage25-representation-closure.yml apply-stage25-representation-closure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Close Stage 25 representation coverage and restore prompt geometry"
          git push origin HEAD:fix/stage25-representation-closure-20260830
