name: Prove current IndexedDB closing race
on:
  push:
    branches:
      - fix/indexeddb-closing-race-current-20260826
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/indexeddb-closing-race-current-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact storage-layer race correction
        run: |
          git fetch origin fix/indexeddb-closing-recovery-20260826
          git show origin/fix/indexeddb-closing-recovery-20260826:project-store.js > project-store.js
          git show origin/fix/indexeddb-closing-recovery-20260826:verify-browser-extra.mjs > verify-browser-extra.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          runtime=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          def gitblob(path):
              b=Path(path).read_bytes();return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          token='runtime-'+hashlib.sha256(''.join(f'{f}:{gitblob(f)}\n' for f in runtime).encode()).hexdigest()[:16]
          p=Path('index.html');html=p.read_text();html,n=re.subn(r'(src="(?:workbook|hash|workflow-schema|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)runtime-[a-f0-9]{16}(\")',rf'\g<1>{token}\2',html)
          if n!=8: raise SystemExit(f'runtime token count {n}')
          p.write_text(html)
          PY
          git diff --check
      - name: Full acceptance
        run: |
          node build-test-project.mjs
          node --check project-store.js
          node --check verify-browser-extra.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit permanent passing source only
        run: |
          rm -f .github/workflows/prove-indexeddb-closing-race-current.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Close IndexedDB transaction-opening race"
          git push origin HEAD:fix/indexeddb-closing-race-current-20260826