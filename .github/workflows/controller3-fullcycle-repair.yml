name: Controller 3 full-cycle fixture repair
on:
  push:
    branches: [controller3-runtime-current-main-replay-20260904]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-runtime-current-main-replay-20260904
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply and execute fixture repair
        run: |
          set -euo pipefail
          python3 controller3-fullcycle-fixture-repair.py
          node verify-capability-readiness.mjs
          node verify-stage01-intake-closure.mjs
          node verify-contract-closure.mjs
          timeout 10m node verify-full-cycle.mjs
          rm controller3-fullcycle-fixture-repair.py .github/workflows/controller3-fullcycle-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-full-cycle.mjs controller3-fullcycle-fixture-repair.py .github/workflows/controller3-fullcycle-repair.yml
          git commit -m 'Repair full-cycle capability fixture'
          git push origin HEAD:controller3-runtime-current-main-replay-20260904
