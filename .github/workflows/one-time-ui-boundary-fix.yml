name: One-time UI boundary correction
on:
  push:
    branches: [repair/full-spec-conformance-fcfc1c6]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/full-spec-conformance-fcfc1c6
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct the owner-file boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app-core.js')
          text = path.read_text()
          old = '<strong>The agent should now return one final JSON response file. Select that file below.</strong>'
          new = '<strong>One final JSON response file is now required. Select that file below.</strong>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one leaked instruction phrase, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Prove the corrected boundary and file-first path
        shell: bash
        run: |
          set -euo pipefail
          node verify-data-route-closure.mjs
          node verify-infrastructure-route-closure.mjs
          node verify-file-first-response.mjs
          node verify-file-first-operator.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Commit the complete ratchet step and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-ui-boundary-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js .github/workflows/one-time-ui-boundary-fix.yml
          git diff --cached --check
          git commit -m 'Keep external-agent behavior inside prompt authority'
          git push origin HEAD:repair/full-spec-conformance-fcfc1c6
