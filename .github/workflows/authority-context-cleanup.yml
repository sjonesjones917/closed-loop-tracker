name: Authority and prompt-context cleanup proof
on:
  push:
    branches: [practical-100/final-deliverable-semantics]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply cleanup
        run: python .authority-context-cleanup.py
      - name: Verify complete deterministic suite
        run: |
          node --check app-core.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Verify Chromium after authority cleanup
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
      - name: Commit proved changes and clean probe
        if: success()
        run: |
          rm .authority-context-cleanup.py .github/workflows/authority-context-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use one stage-data authority and current prompt scope"
          git push
