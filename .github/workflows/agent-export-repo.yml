name: Apply 30-stage source

on:
  push:
    branches:
      - agent/complete-app-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-app-20260830
          fetch-depth: 0
      - name: Apply complete 30-stage source
        run: |
          set -e
          git fetch origin fix/full-30-stage-prompt-contract-audit-20260830
          git checkout origin/fix/full-30-stage-prompt-contract-audit-20260830 -- prompt-engine.js response-ingestion.js workflow-engine.js workflow-schema.js workbook.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-engine.js response-ingestion.js workflow-engine.js workflow-schema.js workbook.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Complete all 30 stage prompts and canonical reuse"
          git push origin HEAD:agent/complete-app-20260830
