name: Agent repository export

on:
  push:
    branches:
      - agent/complete-app-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-30-stage-prompt-contract-audit-20260830
      - name: Stage repository snapshot
        shell: bash
        run: |
          mkdir -p /tmp/closed-loop-tracker-audited
          rsync -a --exclude='.git' ./ /tmp/closed-loop-tracker-audited/
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-tracker-audited-source
          path: /tmp/closed-loop-tracker-audited
          include-hidden-files: true
          retention-days: 1
