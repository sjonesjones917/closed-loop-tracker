name: Apply completed 30-stage implementation

on:
  push:
    branches:
      - agent/complete-app-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-app-20260830
          fetch-depth: 0
      - name: Bring forward the complete 30-stage prompt/state implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/full-30-stage-prompt-contract-audit-20260830
          git checkout origin/fix/full-30-stage-prompt-contract-audit-20260830 -- \
            prompt-engine.js \
            response-ingestion.js \
            workflow-engine.js \
            workflow-schema.js \
            workbook.js
      - name: Correct Test IR authority and application derivation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('prompt-engine.js')
          s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/29';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/30';")
          s=s.replace(
            'If yes, you MUST use EXECUTION_MODE = APPLICATION_DETERMINISTIC, REQUIRED_CAPABILITY = ${schema.TEST_IR.capability}, EXECUTABLE_KIND = TEST_IR, EXECUTABLE_SPEC_VERSION = ${schema.TEST_IR.version}, and provide EXECUTABLE_SPEC plus EXECUTABLE_INPUT_BINDINGS.',
            'If yes, you MUST use EXECUTION_MODE = APPLICATION_DETERMINISTIC, REQUIRED_CAPABILITY = ${schema.TEST_IR.capability}, EXECUTABLE_KIND = TEST_IR, and provide EXECUTABLE_SPEC plus EXECUTABLE_INPUT_BINDINGS. The application, not you, assigns EXECUTABLE_SPEC_VERSION = ${schema.TEST_IR.version} and the canonical executable-spec SHA-256 after validation.'
          )
          p.write_text(s)

          p=Path('workflow-schema.js')
          s=p.read_text()
          old='''      "EXECUTABLE_KIND",\n      "EXECUTABLE_SPEC_VERSION",\n      "EXECUTABLE_SPEC",\n      "EXECUTABLE_INPUT_BINDINGS"\n    ],\n    "application": [\n      "TEST_ID",\n      "REQ_ID",\n      "STATUS"\n    ]'''
          new='''      "EXECUTABLE_KIND",\n      "EXECUTABLE_SPEC",\n      "EXECUTABLE_INPUT_BINDINGS"\n    ],\n    "application": [\n      "TEST_ID",\n      "REQ_ID",\n      "EXECUTABLE_SPEC_VERSION",\n      "EXECUTABLE_SPEC_SHA256",\n      "STATUS"\n    ]'''
          if old not in s: raise SystemExit('tests ownership block not found')
          s=s.replace(old,new,1)
          s=s.replace("valueType:VALUE_TYPES.ENUM", "valueType:'STRING'")
          s=s.replace("valueType:VALUE_TYPES.STRING", "valueType:'STRING'")
          s=s.replace("valueType:VALUE_TYPES.OBJECT", "valueType:'OBJECT'")
          s=s.replace(
            "EXECUTABLE_SPEC_VERSION:Object.freeze({valueType:'STRING',enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),\n    EXECUTABLE_SPEC:Object.freeze",
            "EXECUTABLE_SPEC_VERSION:Object.freeze({valueType:'STRING',enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),\n    EXECUTABLE_SPEC_SHA256:Object.freeze({valueType:'STRING',enumValues:[],nullable:true,normalizerKey:null,closedProperties:null}),\n    EXECUTABLE_SPEC:Object.freeze",
            1
          )
          s=s.replace(
            "'EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS'",
            "'EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC_SHA256','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS'",
            1
          )
          s=s.replace(
            "required:['TEST_TYPE','EXECUTION_MODE','REQUIRED_CAPABILITY','ARTIFACT_REQUIREMENTS','INPUTS','TOOLS','PROCEDURE','EXPECTED_RESULT','FAILURE_CONDITION','EVIDENCE_TO_PRESERVE','STATUS']",
            "required:['TEST_TYPE','EXECUTION_MODE','REQUIRED_CAPABILITY','ARTIFACT_REQUIREMENTS','EXECUTABLE_KIND','INPUTS','TOOLS','PROCEDURE','EXPECTED_RESULT','FAILURE_CONDITION','EVIDENCE_TO_PRESERVE','STATUS']",
            1
          )
          p.write_text(s)

          p=Path('response-ingestion.js')
          s=p.read_text()
          needle="        if(collection==='sources')for(const message of schema.sourceClassificationIssues(record.fields))issues.push(issue('INVALID_EXTERNAL_SOURCE',path,message));\n"
          insert="""        if(collection==='sources')for(const message of schema.sourceClassificationIssues(record.fields))issues.push(issue('INVALID_EXTERNAL_SOURCE',path,message));
        if(collection==='tests'){
          const executableKind=upper(record.fields.EXECUTABLE_KIND||'NONE');
          const executionMode=upper(record.fields.EXECUTION_MODE||'');
          const capability=String(record.fields.REQUIRED_CAPABILITY||'').trim();
          if(!['NONE','TEST_IR'].includes(executableKind))issues.push(issue('INVALID_TEST_IR_KIND',`${path}/fields/EXECUTABLE_KIND`,'EXECUTABLE_KIND must be NONE or TEST_IR.'));
          if(executableKind==='TEST_IR'){
            if(executionMode!=='APPLICATION_DETERMINISTIC')issues.push(issue('INVALID_TEST_IR_ROUTE',`${path}/fields/EXECUTION_MODE`,'TEST_IR requires APPLICATION_DETERMINISTIC execution.'));
            if(capability!==schema.TEST_IR.capability)issues.push(issue('INVALID_TEST_IR_CAPABILITY',`${path}/fields/REQUIRED_CAPABILITY`,`TEST_IR requires capability ${schema.TEST_IR.capability}.`));
            for(const message of schema.validateTestIRSpec(record.fields.EXECUTABLE_SPEC).issues)issues.push(issue('INVALID_TEST_IR_SPEC',`${path}/fields/EXECUTABLE_SPEC`,message));
            for(const message of schema.validateTestIRBindings(record.fields.EXECUTABLE_INPUT_BINDINGS).issues)issues.push(issue('INVALID_TEST_IR_BINDING',`${path}/fields/EXECUTABLE_INPUT_BINDINGS`,message));
          }else{
            if(record.fields.EXECUTABLE_SPEC!==undefined&&record.fields.EXECUTABLE_SPEC!==null)issues.push(issue('PROHIBITED_TEST_IR_SPEC',`${path}/fields/EXECUTABLE_SPEC`,'EXECUTABLE_SPEC is permitted only when EXECUTABLE_KIND is TEST_IR.'));
            if(record.fields.EXECUTABLE_INPUT_BINDINGS!==undefined&&record.fields.EXECUTABLE_INPUT_BINDINGS!==null)issues.push(issue('PROHIBITED_TEST_IR_BINDING',`${path}/fields/EXECUTABLE_INPUT_BINDINGS`,'EXECUTABLE_INPUT_BINDINGS is permitted only when EXECUTABLE_KIND is TEST_IR.'));
          }
        }
"""
          if needle not in s: raise SystemExit('test validation insertion point not found')
          s=s.replace(needle,insert,1)
          needle="""      const fields={...workflow.applicationInitialFields(collection),...clone(proposed.fields||{})};
      fields[definition.idField]=id;
"""
          insert="""      const fields={...workflow.applicationInitialFields(collection),...clone(proposed.fields||{})};
      fields[definition.idField]=id;
      if(collection==='tests'&&upper(fields.EXECUTABLE_KIND||'NONE')==='TEST_IR'){
        fields.EXECUTABLE_SPEC_VERSION=schema.TEST_IR.version;
        fields.EXECUTABLE_SPEC_SHA256=hash.sha256Value(fields.EXECUTABLE_SPEC);
      }
"""
          if needle not in s: raise SystemExit('test derivation insertion point not found')
          s=s.replace(needle,insert,1)
          needle="for(const [name,value] of Object.entries(workflow.applicationInitialFields(collection)))if(!Object.prototype.hasOwnProperty.call(proposed?.fields||{},name))changes.push({origin:'APPLICATION_DERIVATION',jsonPointer:null,rawValueHash:null,normalizerUsed:null,canonicalCollection:collection,canonicalRecordType:collection,canonicalRecordId:record.id,canonicalField:name,relationshipTargetId:null,evidenceIds:record.evidenceRefs||[],normalizedValue:clone(value),temporaryResponseKey:record.temporaryKey,derivationKey:`${collection}.initial.${name}`});"
          replacement=needle+"if(collection==='tests'&&upper(record.fields?.EXECUTABLE_KIND||'NONE')==='TEST_IR'){for(const name of ['EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC_SHA256'])changes.push({origin:'APPLICATION_DERIVATION',jsonPointer:null,rawValueHash:null,normalizerUsed:null,canonicalCollection:collection,canonicalRecordType:collection,canonicalRecordId:record.id,canonicalField:name,relationshipTargetId:null,evidenceIds:record.evidenceRefs||[],normalizedValue:clone(record.fields[name]),temporaryResponseKey:record.temporaryKey,derivationKey:`tests.${name}`});}"
          if needle not in s: raise SystemExit('extraction derivation insertion point not found')
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
      - name: Preserve the established visual shell exactly
        shell: bash
        run: |
          git checkout 4e29cd0dc892f92bfe0d1aded8195d4713b1e745 -- index.html app-core.js project-store.js test-runtime.js test-worker.js hash.js
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "closed-loop implementation agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-engine.js response-ingestion.js workflow-engine.js workflow-schema.js workbook.js index.html app-core.js project-store.js test-runtime.js test-worker.js hash.js
          git diff --cached --quiet && exit 0
          git commit -m "Complete 30-stage prompt and canonical state flow"
          git push origin HEAD:agent/complete-app-20260830
