name: Finalize 30-stage implementation

on:
  push:
    branches:
      - agent/complete-app-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-app-20260830
          fetch-depth: 0
      - name: Apply remaining implementation corrections
        run: python3 agent-finalize.py
      - name: Preserve visual baseline and remove temporary implementation machinery
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm agent-finalize.py .github/workflows/agent-export-repo.yml
          git add prompt-engine.js response-ingestion.js workflow-schema.js
          git commit -m "Finalize 30-stage prompt state and Test IR authority"
          git push origin HEAD:agent/complete-app-20260830
