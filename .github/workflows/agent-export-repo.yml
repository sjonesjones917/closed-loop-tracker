name: Agent repository export

on:
  push:
    branches:
      - agent/complete-app-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e29cd0dc892f92bfe0d1aded8195d4713b1e745
      - name: Stage repository snapshot
        shell: bash
        run: |
          mkdir -p /tmp/closed-loop-tracker-base
          rsync -a --exclude='.git' ./ /tmp/closed-loop-tracker-base/
      - uses: actions/upload-artifact@v4
        with:
          name: closed-loop-tracker-base-source
          path: /tmp/closed-loop-tracker-base
          include-hidden-files: true
          retention-days: 1
