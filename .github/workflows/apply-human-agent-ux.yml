name: Apply minimal human-agent UX fix
on:
  push:
    branches: [fix/human-agent-stage-ux]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply asserted source edits
        run: |
          cat .ux-fix/apply.part1 .ux-fix/apply.part2 .ux-fix/apply.part3 .ux-fix/apply.part4 > apply-ux-fix.mjs
          node --check apply-ux-fix.mjs
          node apply-ux-fix.mjs
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-prompt-semantics.mjs
          node verify-prompt-semantics.mjs
      - name: Commit only the product and regression changes
        run: |
          rm -rf .ux-fix apply-ux-fix.mjs .github/workflows/apply-human-agent-ux.yml
          git config user.name "closed-loop-fix-bot"
          git config user.email "closed-loop-fix-bot@users.noreply.github.com"
          git add -A
          git commit -m "Make agent clarification conversational and app handoff explicit [ux-fix-applied]"
          git push origin HEAD:fix/human-agent-stage-ux
