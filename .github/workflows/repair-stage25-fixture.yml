name: Correct Stage 25 acceptance fixture

on:
  push:
    branches:
      - fix/zero-loss-controlled-20260831
    paths:
      - repair-stage25-fixture.mjs
      - .github/workflows/repair-stage25-fixture.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-loss-controlled-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply explicit acceptance-epoch correction
        run: node repair-stage25-fixture.mjs
      - name: Validate corrected fixture syntax
        run: node --check verify-full-cycle.mjs
      - name: Commit corrected fixture and remove one-shot repair machinery
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm repair-stage25-fixture.mjs .github/workflows/repair-stage25-fixture.yml
          git add verify-full-cycle.mjs
          git diff --cached --check
          git commit -m "Correct Stage 25 strict coverage acceptance fixture"
          git push origin HEAD:fix/zero-loss-controlled-20260831
