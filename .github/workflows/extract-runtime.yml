name: Extract existing workbook runtime source

on:
  push:
    branches:
      - repair/human-project-workflow
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the existing runtime source
        run: |
          set -euo pipefail
          cat workbook.module.gz.1 workbook.module.gz.2 workbook.module.gz.3 > /tmp/workbook.module.gz
          gzip -dc /tmp/workbook.module.gz > workbook.module.js
          node --check workbook.module.js
      - uses: actions/upload-artifact@v4
        with:
          name: existing-workbook-runtime-source
          path: workbook.module.js
          if-no-files-found: error
          retention-days: 1
