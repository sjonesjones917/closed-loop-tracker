name: Apply Stage 04 zero-loss accounting repair
on:
  push:
    branches: [fix/final-controlling-v3-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-controlling-v3-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Remove Stage 04 silent-loss path and strengthen regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('workflow-engine.js')
          text = engine.read_text()
          old = """  const obligationClasses=new Set(['FACT_AFFECTING_REQUIREMENTS','REQUIREMENT','CONSTRAINT','DECISION','PROHIBITION','REQUESTED_OUTPUT','ACCEPTANCE_CONDITION','UNRESOLVED_HUMAN_ONLY']);\n  for(const statement of intake.capturedStatements||[]){if(!obligationClasses.has(statement.statementClass)||statement.disposition==='INAPPLICABLE'||statement.disposition==='RETAINED_CONTEXT')continue;add(statement.text,'STAGE01_CAPTURED_HUMAN_AUTHORITY',{statementId:statement.statementId,sourceUnitId:statement.sourceUnitId,statementKey:statement.statementKey,inputVersion,status:statement.status||null});}\n"""
          new = """  for(const statement of intake.capturedStatements||[]){\n    if(statement.disposition==='INAPPLICABLE')continue;\n    add(statement.text,'STAGE01_CAPTURED_HUMAN_AUTHORITY',{statementId:statement.statementId,sourceUnitId:statement.sourceUnitId,statementKey:statement.statementKey,statementClass:statement.statementClass,stage01Disposition:statement.disposition,inputVersion,status:statement.status||null});\n  }\n"""
          if old not in text:
              raise SystemExit('Expected Stage 04 filtering block not found; refusing an ambiguous repair.')
          engine.write_text(text.replace(old, new, 1))

          test = Path('verify-intake-obligation-accounting.mjs')
          text = test.read_text()
          old_prompt1 = "const prompt1=prompts.buildPromptRecord(1,p),envelope=(capture)=>"
          new_prompt1 = "const prompt1=prompts.buildPromptRecord(1,p);p.projectData.generatedPrompts.push(prompt1);const envelope=(capture)=>"
          if old_prompt1 not in text:
              raise SystemExit('Expected Stage 01 prompt fixture block not found; refusing an ambiguous repair.')
          text = text.replace(old_prompt1, new_prompt1, 1)
          old_assert = "engine.recalculate(p);assert(engine.evaluateIntakeCoverage(p).complete&&engine.evaluateIntakeCoverage(p).coverage===1,'Complete Stage 01 capture did not close accounting.');"
          new_assert = "engine.recalculate(p);const stage1Accounting=engine.evaluateIntakeCoverage(p);if(!stage1Accounting.complete)console.error('STAGE1_ACCOUNTING_DIAGNOSTIC',JSON.stringify(stage1Accounting,null,2));assert(stage1Accounting.complete&&stage1Accounting.coverage===1,'Complete Stage 01 capture did not close accounting.');"
          if old_assert not in text:
              raise SystemExit('Expected Stage 01 accounting assertion not found; refusing an ambiguous repair.')
          text = text.replace(old_assert,new_assert,1)
          old = """const obligations=engine.obligationManifest(p);assert(obligations.obligationCount>=4,'Stage 04 did not build the complete obligation universe.');const prompt4=prompts.buildPromptRecord(4,p);assert(prompt4.prompt.includes('APPLICATION OBLIGATION MANIFEST')&&prompt4.prompt.includes(obligations.items[0].obligationId),'Stage 04 prompt omitted the application obligation manifest.');assert(!/attach or provide the original material with the Stage 04 instruction/i.test(prompt4.prompt),'Stage 04 prompt still requires the original intent file.');const handoff=engine.executionHandoff(p,{stage:4,operation:'COMPLETE'});assert(handoff.conversationMaterials.length===0&&handoff.send.length===0,'Stage 04 still derives an original-intent-file handoff.');\n"""
          new = """const intakeAccounting=engine.evaluateIntakeCoverage(p);const obligations=engine.obligationManifest(p);assert(obligations.obligationCount>=4,'Stage 04 did not build the complete obligation universe.');for(const statement of intakeAccounting.capturedStatements.filter(statement=>statement.disposition!=='INAPPLICABLE')){const item=obligations.items.find(candidate=>candidate.provenance?.statementId===statement.statementId);assert(item,'Stage 04 silently discarded Stage 01 statement '+statement.statementId+'.');assert.equal(item.provenance.statementClass,statement.statementClass,'Stage 04 lost the original Stage 01 semantic class.');assert.equal(item.provenance.stage01Disposition,statement.disposition,'Stage 04 lost the original Stage 01 disposition.');}const retained=intakeAccounting.capturedStatements.find(statement=>statement.disposition==='RETAINED_CONTEXT');assert(retained&&obligations.items.some(item=>item.provenance?.statementId===retained.statementId),'Stage 04 silently discarded retained Stage 01 project context.');const prompt4=prompts.buildPromptRecord(4,p);p.projectData.generatedPrompts.push(prompt4);assert(prompt4.prompt.includes('APPLICATION OBLIGATION MANIFEST')&&prompt4.prompt.includes(obligations.items[0].obligationId),'Stage 04 prompt omitted the application obligation manifest.');assert(prompt4.prompt.includes(retained.statementId)&&prompt4.prompt.includes(retained.text),'Stage 04 prompt omitted retained Stage 01 project context.');assert(!/attach or provide the original material with the Stage 04 instruction/i.test(prompt4.prompt),'Stage 04 prompt still requires the original intent file.');const handoff=engine.executionHandoff(p,{stage:4,operation:'COMPLETE'});assert(handoff.send.length===0,'Stage 04 still derives an original-intent-file handoff.');\n"""
          if old not in text:
              raise SystemExit('Expected Stage 04 accounting fixture block not found; refusing an ambiguous repair.')
          test.write_text(text.replace(old, new, 1))
          PY

          node --check workflow-engine.js
          node verify-intake-obligation-accounting.mjs
          node verify-one-time-intent-intake.mjs
          node verify-single-supply-prompts.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
      - name: Commit repaired engine and regression
        run: |
          if git diff --quiet -- workflow-engine.js verify-intake-obligation-accounting.mjs; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-engine.js verify-intake-obligation-accounting.mjs
          git commit -m 'Preserve every Stage 01 statement through Stage 04 accounting'
          git push origin HEAD:fix/final-controlling-v3-20260830
