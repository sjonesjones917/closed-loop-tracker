name: Controller 3 source snapshot

on:
  push:
    branches: [controller3-source-snapshot-6206234]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create exact source snapshot
        run: tar --exclude=.git -czf /tmp/controller3-source.tar.gz .
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller3-source-${{ github.sha }}
          path: /tmp/controller3-source.tar.gz
          if-no-files-found: error
          retention-days: 1
