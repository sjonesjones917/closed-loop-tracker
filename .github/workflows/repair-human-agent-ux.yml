name: Repair human-agent stage UX
on:
  push:
    branches: [fix/stage-agent-ux-repair]
permissions:
  contents: write
jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply minimal repair
        run: python3 .repair-stage-agent-ux.py
      - name: Remove one-time scaffolding
        run: rm .repair-stage-agent-ux.py .github/workflows/repair-human-agent-ux.yml
      - name: Syntax checks
        run: |
          node --check workbook.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check test-fixtures.mjs
          node --check verify.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-live.mjs
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
      - name: Full deterministic suite
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Chromium phone and desktop proof
        run: |
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only proven source
        run: |
          git config user.name 'sjonesjones917'
          git config user.email 'sjones.jones917@gmail.com'
          git add prompt-engine.js app-core.js index.html verify-prompt-semantics.mjs verify-browser.mjs
          git commit -m 'Restore real human-first stage agent workflow'
          git push origin HEAD:fix/stage-agent-ux-repair
