name: Patch controlling materializer
on:
  push:
    branches: [fix/controlling-spec-final-20260830]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-final-20260830
          fetch-depth: 0
      - name: Correct stale /2 verifier and subject-neutral prompt proof
        shell: bash
        run: |
          set -euo pipefail
          cat > verify-prompt-semantics.mjs <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg);};
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const f of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          const core=globalThis.closedLoopCore,schema=globalThis.closedLoopWorkflowSchema,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine;
          assert(core&&schema&&engine&&prompts,'Prompt runtime failed to load.');
          assert(core.WORKFLOW_ID==='mobile-closed-loop/30'&&core.STAGE_COUNT===30,'Workflow identity changed.');
          assert(core.PROJECT_SCHEMA==='closed-loop-project/3'&&schema.RESPONSE_SCHEMA==='closed-loop-stage-response/3','Prompt test requires /3 contracts.');
          const src=fs.readFileSync('prompt-engine.js','utf8');
          for(const forbidden of ['PATENT / REGULATED FILING','SOFTWARE / MULTI-FILE SYSTEM','BUILDING / ARCHITECTURE / AEC','PHYSICAL / MECHANICAL / CAD / CAM / CNC / ADDITIVE','STAGE 01 DOMAIN INTAKE ADAPTATION'])assert(!src.includes(forbidden),`Hard-coded project-domain prompt branch remains: ${forbidden}`);
          for(const required of ['EXECUTION DIRECTIVE — USE THE PROJECT DATA AND DO THE STAGE WORK NOW','APPLICATION INTAKE MANIFEST','APPLICATION OBLIGATION MANIFEST','No obligation may disappear','BLOCKING_NOW','ASK_NOW_NONBLOCKING','LATER_RESOLVABLE','closed-loop-test-spec/1','FILES YOU MUST RECEIVE','FILES YOU MUST NOT RECEIVE','FILES OR EVIDENCE YOU MUST RETURN'])assert(src.includes(required),`Prompt authority missing ${required}`);
          assert(src.includes('Do not merely summarize context')||src.includes('Do not merely summarize the context'),'Prompts do not explicitly require execution rather than context summary.');
          assert(src.includes('already present')&&src.includes('asking the user to resupply it'),'One-time project-input invariant is absent.');
          assert(src.includes('process every obligationId exactly once')||src.includes('Process every obligationId exactly once'),'Stage 04 does not require exhaustive obligation processing.');
          assert(src.includes('never ask for the original intent file')||src.includes('Do not ask the user to attach'),'Stage 04 original-intent reuse rule is absent.');
          const p=core.createBlankState('JOB-SUBJECT-NEUTRAL-PROMPT');
          Object.assign(p.job,{EXACT_USER_OBJECTIVE_VERBATIM:'Produce the requested deliverable from all project information supplied by the user.',EXPLICIT_USER_REQUIREMENTS:'Never ask for the same project information twice.',CURRENT_INPUT_VERSION:'INPUT-v001'});
          engine.ensureShape(p);engine.recalculate(p);
          const stage1=prompts.buildPromptRecord(1,p,'COMPLETE').prompt;
          assert(stage1.includes('EXECUTION DIRECTIVE — USE THE PROJECT DATA AND DO THE STAGE WORK NOW'),'Generated Stage 01 prompt lacks execution directive.');
          assert(stage1.includes('APPLICATION INTAKE MANIFEST'),'Generated Stage 01 prompt lacks intake manifest.');
          assert(stage1.includes('EXACT_USER_OBJECTIVE_VERBATIM'),'Generated Stage 01 prompt omits user project authority.');
          assert(!/PATENT \/ REGULATED FILING|SOFTWARE \/ MULTI-FILE SYSTEM|BUILDING \/ ARCHITECTURE \/ AEC/.test(stage1),'Generated prompt is not subject neutral.');
          const handoff=engine.executionHandoff(p,{stage:4,operation:'COMPLETE'});
          assert((handoff.send||[]).length===0,'Stage 04 creates a repeated file-send obligation.');
          assert((handoff.conversationMaterials||[]).length===0,'Stage 04 creates repeated conversation-material transfer.');
          const html=fs.readFileSync('index.html','utf8');
          assert(html.includes('height:clamp(260px,45vh,520px)'),'Prompt box height changed.');
          assert(html.includes('.expandable-prompt{max-height:280px}.expandable-prompt.expanded{max-height:none}'),'Prompt preview/collapse sizing changed.');
          console.log(JSON.stringify({subjectNeutralPrompts:true,explicitStageExecution:true,oneTimeProjectInput:true,stage04NoRepeatHandoff:true,visualPromptBaseline:true}));
          NODE
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/repair-controlling-spec.yml')
          s=p.read_text()
          anchor="          git show origin/closed-loop-v3-completion:prompt-engine.js > prompt-engine.js\n"
          addition=anchor+"          sed -i 's/closed-loop-project\\/2/closed-loop-project\\/3/g; s/closed-loop-stage-response\\/2/closed-loop-stage-response\\/3/g' verify-definition-of-done.mjs\n"
          if anchor not in s: raise SystemExit('definition-of-done patch anchor missing')
          s=s.replace(anchor,addition,1)
          anchor2='          node verify-semantic-invariant.mjs\n'
          if anchor2 not in s: raise SystemExit('prompt test insertion anchor missing')
          s=s.replace(anchor2,'          node verify-prompt-semantics.mjs\n'+anchor2,1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-controlling-materializer.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Correct stale v2 acceptance and subject-neutral prompt proof"
          git push origin HEAD:fix/controlling-spec-final-20260830
