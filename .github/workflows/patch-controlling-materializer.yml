name: Patch controlling materializer
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/controlling-spec-final-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-final-20260830
          fetch-depth: 0
      - name: Include v3 app controls without visual CSS changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/repair-controlling-spec.yml')
          s=p.read_text()
          old='for f in workbook.js workflow-schema.js test-runtime.js'
          new='for f in workbook.js app-core.js workflow-schema.js test-runtime.js'
          if old not in s:
              raise SystemExit('materializer file list anchor missing')
          s=s.replace(old,new,1)
          anchor='          git show origin/closed-loop-v3-completion:prompt-engine.js > prompt-engine.js\n'
          addition=r'''          git show origin/closed-loop-v3-completion:prompt-engine.js > prompt-engine.js

          node <<'NODE'
          const fs=require('fs');
          let ui=fs.readFileSync('app-core.js','utf8');
          if(!ui.includes("if(n===4)return ''")){
            const anchor='function artifactControlMarkup(n,locked){';
            if(!ui.includes(anchor))throw new Error('Stage 04 artifact-control anchor missing in v3 app-core.');
            ui=ui.replace(anchor,anchor+"if(n===4)return '';");
          }
          if(!ui.includes('RUN_APP_TESTS'))throw new Error('v3 app-core lacks native RUN_APP_TESTS control.');
          fs.writeFileSync('app-core.js',ui);
          NODE
'''
          if anchor not in s:
              raise SystemExit('prompt-engine checkout anchor missing')
          s=s.replace(anchor,addition,1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-controlling-materializer.yml
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Include v3 application controls in controlling repair"
          git push origin HEAD:fix/controlling-spec-final-20260830
