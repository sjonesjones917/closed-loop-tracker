name: Apply control evidence closure
on:
  push:
    branches:
      - reliability/control-evidence-boolean-current-20260826
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/control-evidence-boolean-current-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal source corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {n}")
              p.write_text(s.replace(old, new, 1))

          once('response-ingestion.js',
               "    if(!/^[0-9a-f]{64}$/.test(claimedHash))issues.push(issue('INVALID_ATTACHMENT_SHA256',`${path}/sha256`,'sha256 must be a 64-character hexadecimal SHA-256 digest.'));\n    const byName=",
               "    if(!/^[0-9a-f]{64}$/.test(claimedHash))issues.push(issue('INVALID_ATTACHMENT_SHA256',`${path}/sha256`,'sha256 must be a 64-character hexadecimal SHA-256 digest.'));\n    if(attachment.required!==undefined&&typeof attachment.required!=='boolean')issues.push(issue('WRONG_VALUE_TYPE',`${path}/required`,'required must be BOOLEAN when supplied.'));\n    const byName=",
               'attachment.required boolean')

          once('response-ingestion.js',
               "    if(!Array.isArray(request.allowedValues))issues.push(issue('INVALID_ARRAY',`${path}/allowedValues`,'allowedValues must be an array.'));\n    for(const name of safe(request.affectedStageFields))",
               "    if(!Array.isArray(request.allowedValues))issues.push(issue('INVALID_ARRAY',`${path}/allowedValues`,'allowedValues must be an array.'));\n    if(request.blocking!==undefined&&typeof request.blocking!=='boolean')issues.push(issue('WRONG_VALUE_TYPE',`${path}/blocking`,'blocking must be BOOLEAN when supplied.'));\n    for(const name of safe(request.affectedStageFields))",
               'human request blocking boolean')

          once('response-ingestion.js',
               "if(!Array.isArray(item.affectedStageFields)||!Array.isArray(item.affectedRecords))issues.push(issue('INVALID_UNRESOLVED_TARGETS',path,'affectedStageFields and affectedRecords must be arrays.'));});",
               "if(!Array.isArray(item.affectedStageFields)||!Array.isArray(item.affectedRecords))issues.push(issue('INVALID_UNRESOLVED_TARGETS',path,'affectedStageFields and affectedRecords must be arrays.'));if(item.blocking!==undefined&&typeof item.blocking!=='boolean')issues.push(issue('WRONG_VALUE_TYPE',`${path}/blocking`,'blocking must be BOOLEAN when supplied.'));});",
               'unresolved blocking boolean')

          once('response-ingestion.js',
               "function commit(project,proposalId,{operator='HUMAN_OPERATOR',reviewNote='Accepted after operator review.'}={}){",
               "function commitEvidence(project,proposal){const ids=[];for(const evidence of safe(proposal.evidence)){if(project.projectData.evidenceRecords.some(record=>workflow.recordId(record,'evidenceRecords')===evidence.id))throw new Error(`Evidence ID collision: ${evidence.id}.`);project.projectData.evidenceRecords.push(clone(evidence));ids.push(evidence.id);}return ids;}\nfunction commit(project,proposalId,{operator='HUMAN_OPERATOR',reviewNote='Accepted after operator review.'}={}){",
               'commitEvidence helper')

          once('response-ingestion.js',
               "if(proposal.responseType!=='DATA_PROPOSAL'){let type,status,details={};",
               "if(proposal.responseType!=='DATA_PROPOSAL'){const evidenceIds=commitEvidence(next,proposal);let type,status,details={evidenceIds};",
               'control evidence commit')

          once('response-ingestion.js',
               "blocking:request.blocking!==false,status:'OPEN',createdAt:stamp",
               "blocking:request.blocking!==false,status:'OPEN',evidenceIds:clone(evidenceIds),createdAt:stamp",
               'human request evidence link')

          once('response-ingestion.js',
               "RESOLUTION_EVIDENCE:'NONE',CLOSURE:'OPEN'",
               "RESOLUTION_EVIDENCE:evidenceIds.length?evidenceIds:'NONE',CLOSURE:'OPEN'",
               'blocker resolution evidence')

          once('response-ingestion.js',
               "const blocker={id,stage,active:true,fields,...fields,source:'APPLICATION_DISPOSITION',rawResponseId:proposal.rawResponseId};",
               "const blocker={id,stage,active:true,fields,...fields,evidenceRefs:clone(evidenceIds),source:'APPLICATION_DISPOSITION',rawResponseId:proposal.rawResponseId};",
               'blocker evidence refs')

          once('response-ingestion.js',
               "warnings:clone(proposal.warnings),createdAt:stamp});details.failureId=failureId;}",
               "warnings:clone(proposal.warnings),evidenceIds:clone(evidenceIds),createdAt:stamp});details.failureId=failureId;}",
               'execution failure evidence')

          once('response-ingestion.js',
               "receipt.acceptedCanonicalChangeId='NONE';receipt.completionState=type;receipt.nextRequiredVerificationStage=",
               "receipt.acceptedCanonicalChangeId='NONE';receipt.completionState=type;receipt.evidenceIds=clone(evidenceIds);receipt.nextRequiredVerificationStage=",
               'receipt evidence')

          old = "  const committedRecordIds=[],reservedTargetSnapshots=[];for(const evidence of proposal.evidence){if(next.projectData.evidenceRecords.some(record=>workflow.recordId(record,'evidenceRecords')===evidence.id))throw new Error(`Evidence ID collision: ${evidence.id}.`);next.projectData.evidenceRecords.push(clone(evidence));committedRecordIds.push(evidence.id);}" 
          once('response-ingestion.js', old, "  const committedRecordIds=commitEvidence(next,proposal),reservedTargetSnapshots=[];", 'data proposal evidence helper')

          p=Path('index.html'); s=p.read_text(); old='runtime-scoped-reliability-20260826-r1'; n=s.count(old)
          if n != 8: raise SystemExit(f'runtime token: expected 8 matches, got {n}')
          p.write_text(s.replace(old,'runtime-control-evidence-20260826-r2'))

          p=Path('verify-ingestion.mjs'); s=p.read_text()
          marker="console.log(JSON.stringify({stages:allStages.length,negativeCases:negativeCount,status:'PASS'},null,2));"
          if marker not in s: raise SystemExit('verify-ingestion final marker missing')
          test=r'''

// Control semantics: supplied Boolean flags are typed, and accepted control evidence is canonical.
{
  const p=project('JOB-NEG-CONTROL-BOOLEAN'),pr=savePrompt(p,1);
  const e={schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage:1,operation:pr.operation,promptIdentity:{instructionId:pr.instructionId,bodySha256:pr.bodySha256,contractSha256:pr.contractSha256,contextSignature:pr.contextSignature},scope:pr.scope,responseType:'HUMAN_INPUT_REQUIRED',humanInputRequests:[{temporaryKey:'q-bool',question:'Need value?',whyRequired:'Human authority required.',affectedStageFields:['EXACT_DELIVERABLE_REQUESTED'],affectedRecords:[],answerType:'TEXT',allowedValues:[],blocking:'false'}],stageData:{},records:{},evidence:[],unresolved:[],warnings:[],attachments:[]};
  const prepared=ingestion.prepare(p,{stage:1,text:JSON.stringify(e),promptRecord:pr});
  if(prepared.validation.valid||!prepared.validation.issues.some(i=>i.code==='WRONG_VALUE_TYPE'&&i.path==='/humanInputRequests/0/blocking'))throw new Error('String control flag was accepted as Boolean.');
  negativeCount++;
}
for(const responseType of ['HUMAN_INPUT_REQUIRED','BLOCKED','EXECUTION_FAILED']){
  let p=project(`JOB-CONTROL-EVIDENCE-${responseType}`),pr=savePrompt(p,1);
  const e={schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage:1,operation:pr.operation,promptIdentity:{instructionId:pr.instructionId,bodySha256:pr.bodySha256,contractSha256:pr.contractSha256,contextSignature:pr.contextSignature},scope:pr.scope,responseType,humanInputRequests:[],stageData:{},records:{},evidence:[{temporaryKey:'control-evidence',kind:'WORKFLOW_EVIDENCE',description:'Controlled recovery evidence',location:'verification fixture',content:'Canonical control-response evidence'}],unresolved:[],warnings:[],attachments:[]};
  if(responseType==='HUMAN_INPUT_REQUIRED')e.humanInputRequests=[{temporaryKey:'q',question:'Exact value?',whyRequired:'Human authority required.',affectedStageFields:['EXACT_DELIVERABLE_REQUESTED'],affectedRecords:[],answerType:'TEXT',allowedValues:[],blocking:true}];
  else e.unresolved=[{temporaryKey:'u',kind:responseType==='BLOCKED'?'MISSING_HUMAN_INPUT':'TOOL_FAILURE',description:'Cannot proceed.',whyBlocking:'Required condition is unavailable.',affectedStageFields:['EXACT_DELIVERABLE_REQUESTED'],affectedRecords:[],blocking:true}];
  const prepared=ingestion.prepare(p,{stage:1,text:JSON.stringify(e),promptRecord:pr});
  if(!prepared.validation.valid)throw new Error(`${responseType} control evidence fixture rejected: ${JSON.stringify(prepared.validation.issues)}`);
  const committed=ingestion.commit(prepared.project,prepared.proposal.proposalId,{operator:'VERIFICATION_OPERATOR'});
  const ids=committed.disposition?.evidenceIds||[];
  if(ids.length!==1||!committed.project.projectData.evidenceRecords.some(r=>engine.recordId(r,'evidenceRecords')===ids[0]))throw new Error(`${responseType} accepted response discarded its canonical evidence.`);
}
'''
          p.write_text(s.replace(marker,test+'\n'+marker,1))
          PY
      - name: Verify deterministic contracts
        run: |
          node --check app-core.js
          node --check hash.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check verify-ingestion.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit permanent source only
        run: |
          rm .github/workflows/apply-control-evidence-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/apply-control-evidence-closure.yml
          git commit -m 'Preserve control evidence and type control flags'
          git push origin HEAD:reliability/control-evidence-boolean-current-20260826
