name: Apply Stage 17 fixture prerequisite fix
on:
  push:
    branches: [fix/restore-controlling-verification-20260831b]
    paths: [.github/workflows/apply-stage17-fixture-prereq-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-verification-20260831b
      - name: Establish prerequisite stages in direct Stage 17 fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-ingestion.mjs')
          s=p.read_text()
          for job in ['JOB-PARALLEL-PROMPT-VALIDATION','JOB-SCOPED-CLARIFICATION']:
              old=f"{{let p=project('{job}'),stage=17;p.revision=0;"
              new=f"{{let p=project('{job}'),stage=17;for(let n=1;n<stage;n++){{p.stages[n].status='COMPLETE';p.stages[n].gate={{complete:true,blocked:false,reasons:[]}};}}p.revision=0;"
              if old not in s: raise SystemExit(f'expected {job} fixture not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit minimal fixture correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-ingestion.mjs
          git commit -m "Establish prerequisites in direct Stage 17 fixtures"
          git push origin HEAD:fix/restore-controlling-verification-20260831b
