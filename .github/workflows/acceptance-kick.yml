name: One-time clean acceptance kick

on:
  push:
    branches:
      - fix/monotonic-zero-loss-20260831

permissions:
  contents: write

jobs:
  acceptance:
    if: ${{ !contains(github.event.head_commit.message, '[accepted-stage04-heading]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal prompt-authority correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('prompt-engine.js')
          text=path.read_text(encoding='utf-8')
          old='Every obligationId in APPLICATION OBLIGATION MANIFEST must be completely accounted.'
          new='APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST\nEvery obligationId in APPLICATION OBLIGATION MANIFEST must be completely accounted.'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Stage 04 manifest heading insertion point; found {count}.')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Test the corrected clean final tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/acceptance-kick.yml /tmp/acceptance-kick.yml
          rm .github/workflows/acceptance-kick.yml
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 1
          test ! -f app.js
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          ! grep -R "document.write" --include='*.js' --include='*.html' .
          ! grep -R "MutationObserver" --include='*.js' --include='*.html' .
          ! grep -REi "human-project/31|Stage 31|Operation 31" --include='*.js' --include='*.html' --include='TEST_PROJECT.json' .
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
          node verify-user-prompt-invariants.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          run_browser_verifier() {
            script="$1"
            for attempt in 1 2 3; do
              log="/tmp/${script}.${attempt}.log"
              if node "$script" >"$log" 2>&1; then cat "$log"; return 0; fi
              cat "$log"
              if ! grep -Eq 'ECONNREFUSED 127\.0\.0\.1:[0-9]+' "$log"; then return 1; fi
              test "$attempt" -lt 3 || return 1
            done
          }
          run_browser_verifier verify-human-stage-walkthrough.mjs
          run_browser_verifier verify-mobile-stage-action.mjs
          run_browser_verifier verify-browser.mjs
          run_browser_verifier verify-browser-extra.mjs
          cp /tmp/acceptance-kick.yml .github/workflows/acceptance-kick.yml
      - name: Commit only the accepted production correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add prompt-engine.js
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only)" = "prompt-engine.js"
          git commit -m "Make Stage 04 manifest ownership explicit [accepted-stage04-heading]"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
