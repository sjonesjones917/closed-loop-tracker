name: Apply zero-loss conformance repair
on: [push]
permissions: {contents: write, pull-requests: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply controlling-spec corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          baseline=subprocess.check_output(['git','show','7db322163404461bc1bded245f9ec8b8d9af6985:index.html'],text=True)
          current=Path('index.html').read_text(); old_style=re.search(r'<style>(.*?)</style>',baseline,re.S).group(1)
          current=re.sub(r'<style>.*?</style>',lambda m:'<style>'+old_style+'</style>',current,count=1,flags=re.S)
          if 'worker-src' not in current: current=current.replace("object-src 'none'; base-uri 'none'", "object-src 'none'; base-uri 'none'; worker-src 'self'")
          current=re.sub(r'<script defer src="test-runtime\.js\?[^\"]+"></script>\n?', '', current)
          m=re.search(r'(<script defer src="workflow-schema\.js\?[^\"]+"></script>)',current)
          if m: current=current.replace(m.group(1),m.group(1)+'\n<script defer src="test-runtime.js?v=runtime-spec3"></script>',1)
          current=re.sub(r'(src="(?:workbook|hash|workflow-schema|test-runtime|workflow-engine|prompt-engine|response-ingestion|project-store|app-core)\.js\?v=)[^"]+',r'\1runtime-spec3',current)
          Path('index.html').write_text(current)
          wb=Path('workbook.js').read_text().replace("const PROJECT_SCHEMA='closed-loop-project/2';","const PROJECT_SCHEMA='closed-loop-project/3';").replace("'REVISE THE RESPONSIBLE LAYER'","'CORRECT THE ROOT CAUSE'"); Path('workbook.js').write_text(wb)
          ws=Path('workflow-schema.js').read_text().replace("const RESPONSE_SCHEMA='closed-loop-stage-response/2';","const RESPONSE_SCHEMA='closed-loop-stage-response/3';"); Path('workflow-schema.js').write_text(ws)
          pe=Path('prompt-engine.js').read_text(); start=pe.find("${stage===1?`STAGE 01 DOMAIN INTAKE ADAPTATION"); end=pe.find("\n\n${stage===1?`STAGE 01 CLARIFICATION EXPERIENCE",start)
          if start!=-1 and end!=-1:
            generic="""${stage===1?`STAGE 01 SUBJECT-NEUTRAL INTAKE\nDerive human-authority questions from the actual user request, accessible supplied materials, and current canonical context. Extract every human-supplied fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue relevant to defining the requested outcome. Inspect accessible supplied artifacts deeply enough to capture those human-authority statements, but do not perform source research, requirement atomization, test design, production design, artifact generation, filing, simulation, manufacturing, or product verification. Ask only genuinely human-only questions. Do not ask for facts already supplied or reliably obtainable from authorized materials, research, or tools. Preserve every compatible statement without silent loss.\n`:`SUBJECT-NEUTRAL STAGE EXECUTION\nUse only the current stage contract, current canonical context selected for this stage, and authorized evidence. Apply domain knowledge only as needed to perform this stage correctly. Do not introduce hard-coded subject modes, project-subject assumptions, or requirements not established by human authority or legitimate source authority.\n`}"""; pe=pe[:start]+generic+pe[end:]
          ps=pe.find('For PATENT / REGULATED FILING jobs, when not already known'); pe2=pe.find('Before Stage 01 submission verify:',ps) if ps!=-1 else -1
          if ps!=-1 and pe2!=-1: pe=pe[:ps]+pe[pe2:]
          pe=pe.replace("4:'Compile atomic requirement proposals only from the complete current canonical input union selected by the application:","4:'Compile atomic requirement proposals only from the complete current canonical input union selected by the application. The human supplies project information once: if the human already supplied it in any accepted current project input or Stage 01 intake, use the canonical captured value and never ask the human to attach, resend, retype, restate, or summarize it again. The Stage 04 prompt must carry the complete application-selected obligation universe and the accepted Stage 01 job definition needed for this task. If required prior-stage content is missing, return BLOCKED and identify the earlier capture defect; do not turn that defect into another human data request. Continue with the complete current canonical input union:")
          Path('prompt-engine.js').write_text(pe)
          ci=Path('.github/workflows/pages.yml').read_text().replace("const expected=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];","const expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];"); Path('.github/workflows/pages.yml').write_text(ci)
          PY
          cat > verify-controlling-spec.mjs <<'EOF'
          import fs from 'node:fs'; const fail=m=>{throw new Error(m)}; const wb=fs.readFileSync('workbook.js','utf8'),ws=fs.readFileSync('workflow-schema.js','utf8'),pe=fs.readFileSync('prompt-engine.js','utf8'),html=fs.readFileSync('index.html','utf8'),ci=fs.readFileSync('.github/workflows/pages.yml','utf8');
          if(!wb.includes("PROJECT_SCHEMA='closed-loop-project/3'"))fail('project schema'); if(!ws.includes("RESPONSE_SCHEMA='closed-loop-stage-response/3'"))fail('response schema'); if(!wb.includes("'CORRECT THE ROOT CAUSE'"))fail('stage16'); for(const t of ['PATENT / REGULATED FILING','SOFTWARE / MULTI-FILE SYSTEM','BUILDING / ARCHITECTURE / AEC','PHYSICAL / MECHANICAL / CAD / CAM / CNC / ADDITIVE'])if(pe.includes(t))fail('domain branch '+t); for(const t of ['never ask the human to attach, resend, retype, restate, or summarize it again','identify the earlier capture defect'])if(!pe.includes(t))fail('stage4 '+t); const scripts=[...html.matchAll(/<script\s+defer\s+src="([^"]+)"/g)].map(m=>m[1].split('?')[0]),expected=['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']; if(JSON.stringify(scripts)!==JSON.stringify(expected))fail('scripts '+JSON.stringify(scripts)); if(!/worker-src 'self'/.test(html))fail('worker CSP'); if(!ci.includes("'test-runtime.js'"))fail('CI graph'); console.log('verify-controlling-spec: PASS');
          EOF
      - name: Verify corrected source
        run: node verify-controlling-spec.mjs && node --check workbook.js && node --check workflow-schema.js && node --check prompt-engine.js && node --check test-runtime.js && node --check test-worker.js
      - name: Commit repair and remove applicator
        run: |
          git config user.name closed-loop-spec-repair
          git config user.email actions@users.noreply.github.com
          rm .github/workflows/apply-spec-conformance.yml
          git add -A && git commit -m 'Align runtime with controlling /3 specification' && git push origin HEAD:fix/spec-conformance-zero-loss
      - name: Open pull request
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh pr create --base main --head fix/spec-conformance-zero-loss --title 'Align application with controlling /3 specification' --body 'Restores visual CSS to the pre-regression baseline; fixes the nine-script runtime order and worker CSP; changes project/response identities to /3; restores Stage 16 label; removes hard-coded subject prompt branches; and makes Stage 04 consume already-captured project information instead of reacquiring it. Includes a focused regression.'