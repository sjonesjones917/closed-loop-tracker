name: Apply final stage prompt semantics
on:
  push:
    branches: [fix/final-stage-prompt-semantics-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct remaining stage prompt semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('prompt-engine.js')
          text=p.read_text()
          text=re.sub(r"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/\d+';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/41';",text,count=1)
          replacements={
          3:"Research only the complete current accepted Stage 02 independent external source set supplied in this prompt, using the accepted Stage 01 human-authority capture and current User Job Input only to determine relevance and applicability. Never ask the human to repeat available project facts or reattach the original Stage 01 intent file. Inspect every current source and every applicable portion deeply enough to extract every mandatory statement, recommendation, optional practice, example, explanatory statement, prohibition, exception, dependency, applicability fact, restriction, invalidating material, conflict, supersession issue, and candidate obligation with exact source evidence. Every current Stage 02 source must receive current research coverage unless Stage 02 validly established NO_APPLICABLE_EXTERNAL_SOURCE. Perform the complete first research pass, the required conflict-and-exception pass, and at least one second complete pass over the entire current source set. If any complete pass discovers any new material obligation, requirement category, exception, restriction, dependency, applicability fact, conflict, supersession issue, or invalidating condition, incorporate it and perform another complete pass over the entire current source set. Repeat until the latest complete pass finds no new material of any of those kinds. Do not atomize final requirements, resolve the requirement set, design tests, or perform later-stage work here.",
          22:"Handle only deterministic verification of the current finished product and only the deterministic tests selected by the application for Stage 22. Application-native Test IR execution is application-owned: never claim, imitate, fabricate, or substitute for an application-native execution, native result, native receipt, application hash, or application gate. Native-ready tests require no external agent execution and are run by the application worker. This prompt is used only for deterministic work that the application explicitly routes to an external capable executor; execute exactly those routed tests with the exact supplied product bytes, test specifications, capabilities, and handoff, preserve objective evidence and returned artifacts, and report observations honestly. If a required capability or byte-backed input is unavailable, return the exact blocker or execution failure rather than a synthetic pass. Do not perform meaning review, adversarial review, representation inspection, release calculation, or any later-stage work.",
          23:"Perform only independent meaning-based verification for the exact current Stage 23 meaning-review requirements and tests supplied by the application. Use the actual finished product, governing requirement, applicable source evidence, and authorized meaning rubric or test. For every required review identify the exact product location, required meaning, observed meaning, evidence-based comparison, and proposed determination. Evaluate meaning in the representation and context required by the governing requirement; do not reduce semantic correctness to file existence, hashes, formatting alone, or other evidence incapable of proving the proposition. Preserve independence and use only the bounded context supplied in this prompt; do not use generator self-evaluation, unnecessary deterministic pass conclusions, adversarial findings, prior meaning-review conclusions, or hidden project history. Do not perform deterministic verification, adversarial verification, representation inspection, release calculation, or later-stage work.",
          25:"Inspect only the exact final representations, views, transformations, packages, and delivery artifacts that Stage 25 requires for the current product. Open and inspect every required representation and packaged item identified by the application, and report irreducible observations using the authority assigned by the current requirement or test. Check whether the delivered representation faithfully preserves the required content, relationships, legibility, usability, and transformation outcome needed by the governing requirement without substituting generic file metadata for representation judgment. Objective filename, byte-size, hash, product, baseline, and transformation identities remain application-owned. Do not repeat Stage 22 deterministic verification or Stage 23/24 reviews, do not invent human inspection, and do not calculate release."
          }
          for stage,new_text in replacements.items():
              pattern=rf'("{stage}":)"(?:\\.|[^"\\])*"'
              text,n=re.subn(pattern,lambda m:m.group(1)+json.dumps(new_text,ensure_ascii=False),text,count=1)
              if n!=1:
                  raise SystemExit(f'could not replace stage {stage} prompt exactly once; got {n}')
          p.write_text(text)
          PY
          rm -f .github/workflows/tmp-final-stage-prompt-semantics.yml .github/workflows/apply-prompt-data-closure.yml tmp-trigger-final-stage-prompt-semantics
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finish stage prompt semantics and remove repair workflow"
          git push origin HEAD:fix/final-stage-prompt-semantics-20260830
