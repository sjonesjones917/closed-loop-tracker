name: PR2 complete verifier adaptation
on:
  push:
    branches: [practical-100/pr2-schema-response-v2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node .pr2-verify-complete-fix.mjs
      - run: |
          node --check verify-complete.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - run: |
          rm .pr2-verify-complete-fix.mjs .github/workflows/pr2-verify-complete-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align complete verification with response schema v2"
          git push origin HEAD:practical-100/pr2-schema-response-v2
