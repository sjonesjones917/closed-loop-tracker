name: Rebase and prove complete Stage 04 repair
on:
  push:
    branches: [fix/stage4-intent-reuse-current-main]
permissions:
  contents: write
concurrency:
  group: stage4-rebase-and-prove-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebase-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-intent-reuse-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main and reconcile the Stage 04 operator control
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git fetch origin main
          git merge --no-edit -X ours origin/main
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app-core.js')
          text=path.read_text()
          start=text.index('function artifactControlMarkup(n,locked){')
          stage19=text.index('if(n===19)return',start)
          text=text[:start]+"function artifactControlMarkup(n,locked){if(n===4)return '';"+text[stage19:]
          required="function artifactControlMarkup(n,locked){if(n===4)return '';if(n===19)"
          if required not in text:
              raise SystemExit('Stage 04 artifact-control reconciliation failed.')
          path.write_text(text)
          PY
          rm -f .stage4-ci-trigger
          find .github/workflows -maxdepth 1 -type f ! -name pages.yml -print -delete
          printf 'Permanent workflows after cleanup:\n'
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "pages.yml"
      - name: Refresh the shared runtime identity from exact runtime bytes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          runtime=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for filename in runtime:
              data=Path(filename).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              manifest += f'{filename}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          index=Path('index.html')
          html=index.read_text()
          html,count=re.subn(r'runtime-[0-9a-f]{16}',token,html)
          if count != 8:
              raise SystemExit(f'index.html: expected 8 runtime identities, replaced {count}')
          index.write_text(html)
          print(token)
          PY
      - name: Prove the one-time Stage 01 through Stage 04 data path
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node --check workbook.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-one-time-intent-intake.mjs
          node --check verify-test-runtime.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-ingestion.mjs
          node --check verify-complete.mjs
          node --check verify-full-cycle.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-test-runtime.mjs
          node verify-one-time-intent-intake.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          ! grep -R "materialize-stage4-intent-reuse\|stage4-rebase-and-prove\|stage4-reconcile-main" .github/workflows/pages.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "pages.yml"
      - name: Commit the conflict-resolved permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Rebase complete Stage 04 canonical-intent repair onto current main"
          git push origin HEAD:fix/stage4-intent-reuse-current-main
