name: Final integrity clean acceptance
on:
  push:
    branches: [reliability/final-integrity-authority-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/final-integrity-authority-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair and remove temporary harnesses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/final-integrity-authority-repair.yml').read_text()
          body=y.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          lines=[]; skipping=False
          for line in body.splitlines():
              line=line[10:] if line.startswith('          ') else line
              if line.strip()=="# Generic current and historical record-integrity assertion before final output.": skipping=True; continue
              if skipping:
                  if line.strip()=="p.write_text(s)": lines.append(line); skipping=False
                  continue
              lines.append(line)
          Path('/tmp/repair.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/repair.py
          cat >> verify-full-cycle.mjs <<'JS'
          
          for(const [collection,definition] of Object.entries(schema.RECORD_SCHEMAS))for(const record of p.projectData[collection]||[]){if(record.recordSha256)assert(record.recordSha256===hash.recordSha256(record),`${collection} ${engine.recordId(record,collection)} has a stale recordSha256.`);if(record.contentSha256)assert(record.contentSha256===hash.contentRecordSha256(record,definition.idField),`${collection} ${engine.recordId(record,collection)} has a stale contentSha256.`);}
          JS
          rm .github/workflows/final-integrity-authority-repair.yml .github/workflows/final-integrity-continuation.yml .github/workflows/final-integrity-finalize.yml
      - name: Run deterministic acceptance on final tree
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node verify-hash.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit exact passing tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close final authority and canonical integrity gaps [repair-complete]"
          git push origin HEAD:reliability/final-integrity-authority-20260826
