name: Controlled repair
on:
  push:
    branches: [fix/restore-monotonic-proof-20260831]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-monotonic-proof-20260831
          fetch-depth: 0
      - name: Apply exact demonstrated corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count==0 and new in text:
                  print(f'{path}: correction already present')
                  return False
              if count!=expected:
                  raise SystemExit(f'{path}: expected {expected} exact source sentinel(s), found {count}')
              p.write_text(text.replace(old,new))
              print(f'{path}: replaced {count} exact source sentinel(s)')
              return True

          changed=False
          changed |= replace_exact(
              'workflow-engine.js',
              "      // Stage 06 proves the verification definition is complete, not that future execution inputs already exist.\n      // Exact byte readiness remains fail-closed in testExecutionPlan() at the execution stage.\n      break;",
              "      const stage06Plan=testExecutionPlan(project);\n      const missingRequiredBytes=mandatoryTests.filter(test=>{const item=stage06Plan.items.find(planItem=>planItem.testId===recordId(test,'tests'));return item&&item.artifactRequired&&!item.artifactReady;});\n      if(missingRequiredBytes.length)reasons.push(`${missingRequiredBytes.length} mandatory test definition(s) have required artifact bytes missing or no longer application-verified.`);\n      break;"
          )
          changed |= replace_exact(
              'workflow-engine.js',
              "plans=testExecutionPlan(project).filter(item=>String(item.requirementId||'')===reqId)",
              "plans=testExecutionPlan(project).items.filter(item=>String(item.requirementId||'')===reqId)"
          )
          changed |= replace_exact(
              'workbook.js',
              "  if(p.schema!=='human-project/30')throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));",
              "  if(!['human-project/30','closed-loop-project/2'].includes(p.schema))throw new Error(`Unsupported project schema: ${p.schema||'MISSING'}`);\n  const sourceSchema=p.schema;\n  const migrated=JSON.parse(JSON.stringify(p));\n  const original=JSON.parse(JSON.stringify(p));"
          )
          changed |= replace_exact(
              'workbook.js',
              "migrated.projectData.historicalImportRecords.push({kind:'LEGACY_STAGE_RECORDS',schema:'human-project/30',records:JSON.parse(JSON.stringify(migrated.projectData.stageRecords))});",
              "migrated.projectData.historicalImportRecords.push({kind:'LEGACY_STAGE_RECORDS',schema:sourceSchema,records:JSON.parse(JSON.stringify(migrated.projectData.stageRecords))});"
          )
          changed |= replace_exact(
              'workbook.js',
              "migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:'human-project/30',preservedAt:new Date().toISOString(),payload:original});",
              "migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:sourceSchema,preservedAt:new Date().toISOString(),payload:original});"
          )
          if not changed:
              print('No source changes required.')
          PY
          node --check workbook.js
          node --check workflow-engine.js
      - name: Commit controlled corrections
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add workbook.js workflow-engine.js
          git commit -m 'Correct Stage 06 custody, Stage 07 routing, and v2 migration'
          git push origin HEAD:fix/restore-monotonic-proof-20260831
