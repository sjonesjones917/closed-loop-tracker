name: Controlled repair
on:
  push:
    branches: [fix/restore-monotonic-proof-20260831]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-monotonic-proof-20260831
          fetch-depth: 0
      - name: Correct exact Stage 02 refinement fixture prerequisite
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify-complete.mjs'); text=p.read_text()
          old="assert(Object.keys(p.stages[2].agentData||{}).length===0&&p.stages[2].acceptedDataChangeIds.length===0&&p.stages[2].acceptedResponseIds.length===0,'Invalidated stage retained accepted agent state.');const replacement=prompts.buildPromptRecord(2,p);"
          new="assert(Object.keys(p.stages[2].agentData||{}).length===0&&p.stages[2].acceptedDataChangeIds.length===0&&p.stages[2].acceptedResponseIds.length===0,'Invalidated stage retained accepted agent state.');p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true};const replacement=prompts.buildPromptRecord(2,p);"
          count=text.count(old)
          if count==1:p.write_text(text.replace(old,new))
          elif count==0 and new in text:pass
          else:raise SystemExit(f'expected one Stage 02 refinement fixture sentinel, found {count}')
          PY
          node --check verify-complete.mjs
      - name: Commit fixture correction
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add verify-complete.mjs
          git commit -m 'Bind Stage 02 refinement fixture to Stage 01 gate'
          git push origin HEAD:fix/restore-monotonic-proof-20260831
