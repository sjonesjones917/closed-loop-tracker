name: Controlled repair
on:
  push:
    branches: [fix/restore-monotonic-proof-20260831]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-monotonic-proof-20260831
          fetch-depth: 0
      - name: Apply exact-sentinel repairs
        run: |
          set -euo pipefail
          python3 .github/repair.py
          python3 .github/repair2.py
          python3 .github/repair3.py
          python3 .github/repair4.py
          python3 .github/repair5.py
          python3 .github/repair6.py
      - name: Syntax check affected files
        run: |
          set -euo pipefail
          for file in workflow-engine.js prompt-engine.js app-core.js verify-zero-loss-accounting.mjs verify-one-time-intent-intake.mjs verify-stage01-intake-closure.mjs verify-stage-prompts-complete.mjs verify-spec3-contract.mjs verify-complete.mjs; do
            node --check "$file"
          done
      - name: Run focused regressions
        run: |
          set -euo pipefail
          node verify-complete.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-semantic-invariant.mjs
          node verify-zero-loss-accounting.mjs
          node verify-spec3-contract.mjs
          node verify-v3-contract.mjs
          node verify-user-prompt-invariants.mjs
      - name: Commit corrected application
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source correction required.'
            exit 0
          fi
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add workflow-engine.js prompt-engine.js app-core.js verify-zero-loss-accounting.mjs verify-one-time-intent-intake.mjs verify-stage01-intake-closure.mjs verify-stage-prompts-complete.mjs verify-spec3-contract.mjs verify-complete.mjs
          git commit -m 'Correct Stage 01 accounting, prompt authority, evidence, context, and operator regressions'
          git push origin HEAD:fix/restore-monotonic-proof-20260831
