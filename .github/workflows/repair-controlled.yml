name: Controlled repair
on:
  push:
    branches: [fix/restore-monotonic-proof-20260831]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-monotonic-proof-20260831
          fetch-depth: 0
      - name: Correct exact prerequisite fixture state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-complete.mjs')
          text=path.read_text()
          old="p.stages[1].status='COMPLETE';p.stages[2].status='COMPLETE';const pr=prompt(p,stage);"
          new="p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true};p.stages[2].status='COMPLETE';p.stages[2].gate={complete:true};const pr=prompt(p,stage);"
          count=text.count(old)
          if count==1:path.write_text(text.replace(old,new))
          elif count==0 and new in text:pass
          else:raise SystemExit(f'expected one prerequisite fixture sentinel, found {count}')
          PY
          node --check verify-complete.mjs
      - name: Commit fixture correction
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add verify-complete.mjs
          git commit -m 'Bind Stage 03 fixture to complete upstream gates'
          git push origin HEAD:fix/restore-monotonic-proof-20260831
