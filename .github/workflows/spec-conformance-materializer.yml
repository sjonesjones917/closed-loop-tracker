name: Materialize controlling-spec conformance repair
on:
  push:
    branches: [fix/controlling-spec-conformance]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply controlling specification repair
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const must=(condition,message)=>{if(!condition)throw new Error(message)};
          const read=f=>fs.readFileSync(f,'utf8');
          const write=(f,s)=>fs.writeFileSync(f,s);
          const replaceOnce=(s,from,to,label)=>{must(s.includes(from),`Missing anchor: ${label}`);return s.replace(from,to)};

          // workbook.js: /3 schema, exact Stage 16 visible identity, deterministic legacy and /2 migration.
          let workbook=read('workbook.js');
          workbook=replaceOnce(workbook,"const PROJECT_SCHEMA='closed-loop-project/2';","const PROJECT_SCHEMA='closed-loop-project/3';",'project schema');
          workbook=replaceOnce(workbook,"'REVISE THE RESPONSIBLE LAYER'","'CORRECT THE ROOT CAUSE'",'Stage 16 title');
          const migrateStart=workbook.indexOf('function migrateState(p){');
          const migrateEnd=workbook.indexOf('\nglobalThis.closedLoopCore=',migrateStart);
          must(migrateStart>=0&&migrateEnd>migrateStart,'migrateState block not found');
          const migrate=`function migrateState(p){
  if(!p||typeof p!=='object')return createBlankState();
  const sourceSchema=String(p.schema||'');
  const supportedCurrent=sourceSchema===PROJECT_SCHEMA;
  const supportedV2=sourceSchema==='closed-loop-project/2';
  const supportedLegacy=sourceSchema==='human-project/30';
  if(!supportedCurrent&&!supportedV2&&!supportedLegacy)throw new Error(\`Unsupported project schema: \${p.schema||'MISSING'}\`);
  if(sourceSchema!=='human-project/30'&&(p.workflow!==WORKFLOW_ID||Number(p.stageCount)!==STAGE_COUNT))throw new Error('Project workflow identity or stage count is incompatible with mobile-closed-loop/30.');
  const migrated=JSON.parse(JSON.stringify(p));
  const original=JSON.parse(JSON.stringify(p));
  migrated.schema=PROJECT_SCHEMA;migrated.workflow=WORKFLOW_ID;migrated.stageCount=STAGE_COUNT;migrated.revision=Number.isInteger(migrated.revision)?migrated.revision:0;
  migrated.projectData=migrated.projectData&&typeof migrated.projectData==='object'?migrated.projectData:{};
  migrated.projectData.migrationArchives=Array.isArray(migrated.projectData.migrationArchives)?migrated.projectData.migrationArchives:[];
  migrated.projectData.historicalImportRecords=Array.isArray(migrated.projectData.historicalImportRecords)?migrated.projectData.historicalImportRecords:[];
  if(migrated.projectData.stageRecords&&Object.keys(migrated.projectData.stageRecords).length){migrated.projectData.historicalImportRecords.push({kind:'LEGACY_STAGE_RECORDS',schema:sourceSchema,records:JSON.parse(JSON.stringify(migrated.projectData.stageRecords))});delete migrated.projectData.stageRecords;}
  if(migrated.projectData.fullProject&&Object.keys(migrated.projectData.fullProject).length){migrated.projectData.migrationArchives.push({kind:'LEGACY_NESTED_PROJECT',schema:sourceSchema,preservedAt:new Date().toISOString(),payload:JSON.parse(JSON.stringify(migrated.projectData.fullProject))});delete migrated.projectData.fullProject;}
  if(!supportedCurrent)migrated.projectData.migrationArchives.push({kind:'MIGRATION_SOURCE',schema:sourceSchema,preservedAt:new Date().toISOString(),operational:false,payload:original});
  if(!migrated.stages||Object.keys(migrated.stages).length!==STAGE_COUNT)throw new Error('Project migration requires exactly 30 stages.');
  return migrated;
}`;
          workbook=workbook.slice(0,migrateStart)+migrate+workbook.slice(migrateEnd);
          write('workbook.js',workbook);

          // workflow-schema.js: /3 response, exact producer split, Test IR identity and runtime contract.
          let schema=read('workflow-schema.js');
          schema=replaceOnce(schema,"const RESPONSE_SCHEMA='closed-loop-stage-response/2';","const RESPONSE_SCHEMA='closed-loop-stage-response/3';",'response schema');
          schema=replaceOnce(schema,"const HUMAN_JOB_FIELDS=Object.freeze([\n  'JOB_TITLE','JOB_OWNER','EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY',","const HUMAN_DECISION_JOB_FIELDS=Object.freeze(['JOB_TITLE','JOB_OWNER']);\nconst HUMAN_JOB_FIELDS=Object.freeze([\n  'EXACT_USER_OBJECTIVE_VERBATIM','SUPPLIED_MATERIALS_INVENTORY',",'human job ownership');
          schema=replaceOnce(schema,"  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:name==='EXACT_USER_OBJECTIVE_VERBATIM'?1:null,provenanceRequired:false,valueType:name==='DESIRED_SOURCE_COUNT'?'INTEGER':'STRING',nullable:name!=='EXACT_USER_OBJECTIVE_VERBATIM'});","  if(HUMAN_DECISION_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN_DECISION,{requiredAtStage:null,provenanceRequired:false,nullable:true});\n  if(HUMAN_JOB_FIELDS.includes(name))return field(name,PRODUCER.HUMAN,{requiredAtStage:name==='EXACT_USER_OBJECTIVE_VERBATIM'?1:null,provenanceRequired:false,valueType:name==='DESIRED_SOURCE_COUNT'?'INTEGER':'STRING',nullable:name!=='EXACT_USER_OBJECTIVE_VERBATIM'});",'jobFieldDefinition decision branch');
          schema=replaceOnce(schema,"[...new Set([...HUMAN_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])]","[...new Set([...HUMAN_DECISION_JOB_FIELDS,...HUMAN_JOB_FIELDS,...APPLICATION_JOB_FIELDS,...AGENT_JOB_FIELDS])]",'job field set');
          schema=schema.replace("executableKinds:Object.freeze(['NONE','CUSTOM_PIPELINE'])","executableKinds:Object.freeze(['NONE','TEST_IR'])");
          schema=schema.replace("if(String(get('EXECUTABLE_KIND')||'').toUpperCase()!=='CUSTOM_PIPELINE')issues.push('EXECUTABLE_KIND must be CUSTOM_PIPELINE.');","if(String(get('EXECUTABLE_KIND')||'').toUpperCase()!=='TEST_IR')issues.push('EXECUTABLE_KIND must be TEST_IR.');");
          schema=schema.replace("'EXECUTABLE_SPEC_VERSION',\n      \"EXECUTABLE_SPEC\",","\"EXECUTABLE_SPEC\",");
          schema=schema.replace("\"STATUS\"\n    ]\n  },\n  \"failureTests\"", "\"STATUS\",\n      \"EXECUTABLE_SPEC_VERSION\",\n      \"EXECUTABLE_SPEC_SHA256\"\n    ]\n  },\n  \"failureTests\"");
          schema=schema.replace("'TEST_ID','REQ_ID','TEST_TYPE','EXECUTION_MODE','REQUIRED_CAPABILITY','ARTIFACT_REQUIREMENTS','EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS'","'TEST_ID','REQ_ID','TEST_TYPE','EXECUTION_MODE','REQUIRED_CAPABILITY','ARTIFACT_REQUIREMENTS','EXECUTABLE_KIND','EXECUTABLE_SPEC_VERSION','EXECUTABLE_SPEC_SHA256','EXECUTABLE_SPEC','EXECUTABLE_INPUT_BINDINGS'");
          schema=schema.replace("operations:Object.freeze(['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','SELECT_JSON_PATH','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','BYTE_COMPARE','ASSERT_EXISTS','ASSERT_TYPE','ASSERT_EQ','ASSERT_NE','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL'])","operations:Object.freeze(['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE'])");
          schema=schema.replace("limits:Object.freeze({maxSteps:64,maxTextBytes:16777216,maxCollectionItems:100000,maxRegexLength:2000,maxCsvCells:250000})","limits:Object.freeze({maxInputBytes:16777216,maxDecompressedBytes:33554432,maxSteps:64,maxSelectorDepth:32,maxParsedDepth:64,maxCollectionItems:100000,maxRegexLength:2000,maxRegexInputLength:1048576,workerTimeoutMs:10000,maxArchiveExpansionBytes:33554432,maxCsvCells:250000})");
          schema=schema.replace("PRODUCER,RESPONSE_SCHEMA,RESPONSE_TYPES,CONFLICT_POLICIES,TEST_IR","PRODUCER,RESPONSE_SCHEMA,RESPONSE_TYPES,CONFLICT_POLICIES,TEST_IR");
          schema=schema.replace("JOB_FIELDS,HUMAN_JOB_FIELDS,APPLICATION_JOB_FIELDS,AGENT_JOB_FIELDS,HUMAN_INTAKE_FIELDS,","JOB_FIELDS,HUMAN_DECISION_JOB_FIELDS,HUMAN_JOB_FIELDS,APPLICATION_JOB_FIELDS,AGENT_JOB_FIELDS,HUMAN_INTAKE_FIELDS,");
          write('workflow-schema.js',schema);

          // test-runtime.js: single deterministic runtime authority, exact v1 primitive language and centralized limits.
          const runtime=`(()=>{\n'use strict';\nconst VERSION='closed-loop-test-runtime/2';\nconst SPEC_VERSION='closed-loop-test-spec/1';\nconst CAPABILITY='CLOSED_LOOP_TEST_IR';\nconst OPS=Object.freeze(['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE']);\nconst LIMITS=Object.freeze({maxInputBytes:16*1024*1024,maxDecompressedBytes:32*1024*1024,maxSteps:64,maxSelectorDepth:32,maxParsedDepth:64,maxCollectionItems:100000,maxRegexLength:2000,maxRegexInputLength:1024*1024,workerTimeoutMs:10000,maxArchiveExpansionBytes:32*1024*1024,maxCsvCells:250000});\nconst STEP_KEYS=Object.freeze({LOAD_ARTIFACT:['op','binding'],READ_BYTES:['op'],DECODE_UTF8:['op'],PARSE_JSON:['op'],PARSE_CSV:['op','delimiter','header','quote','newline','encoding'],PARSE_XML:['op'],SELECT_JSON_PATH:['op','path'],SELECT_XML:['op','selector'],COUNT:['op'],SUM:['op'],MIN:['op'],MAX:['op'],SORT:['op'],UNIQUE:['op'],HASH_SHA256:['op'],REGEX:['op','pattern','flags'],COMPARE:['op','value','binding'],ASSERT_EQ:['op','value','absoluteTolerance','relativeTolerance','message'],ASSERT_GT:['op','value','message'],ASSERT_GTE:['op','value','message'],ASSERT_LT:['op','value','message'],ASSERT_LTE:['op','value','message'],ASSERT_MATCH:['op','pattern','flags','message'],ASSERT_CONTAINS:['op','value','message'],ASSERT_NOT_CONTAINS:['op','value','message'],ASSERT_SET_EQUAL:['op','value','message'],BYTE_COMPARE:['op','binding']});\nconst bytesOf=v=>v instanceof Uint8Array?v:v instanceof ArrayBuffer?new Uint8Array(v):ArrayBuffer.isView(v)?new Uint8Array(v.buffer,v.byteOffset,v.byteLength):null;\nconst field=(test,key)=>test?.fields?.[key]??test?.[key];\nconst stable=v=>JSON.stringify(v,(_,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort(([a],[b])=>a.localeCompare(b))):x);\nconst depth=v=>{let max=0;const walk=(x,d)=>{max=Math.max(max,d);if(d>LIMITS.maxParsedDepth)throw new Error('Parsed structure exceeds depth limit.');if(x&&typeof x==='object')for(const y of Object.values(x))walk(y,d+1);};walk(v,0);return max;};\nasync function sha256(bytes){const data=bytesOf(bytes);if(!data)throw new Error('HASH_SHA256 requires bytes.');const digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');}\nfunction safeRegex(pattern,flags=''){const p=String(pattern||''),f=String(flags||'');if(p.length>LIMITS.maxRegexLength)throw new Error('Regex exceeds pattern limit.');if(/\\\\[1-9]|\\(\\?<([=!])|\\([^)]*[+*][^)]*\\)[+*{]/.test(p))throw new Error('Regex construct is outside the registered safe subset.');if(!/^[dgimsuvy]*$/.test(f))throw new Error('Regex flags are outside the registered subset.');return new RegExp(p,f);}\nfunction parseCsv(text,cfg){const delimiter=String(cfg.delimiter??''),quote=String(cfg.quote??''),newline=String(cfg.newline??''),encoding=String(cfg.encoding??'');if(delimiter.length!==1||quote.length!==1||!['LF','CRLF','ANY'].includes(newline)||encoding!=='UTF-8'||typeof cfg.header!=='boolean')throw new Error('PARSE_CSV requires explicit delimiter, header, quote, newline, and encoding=UTF-8.');const rows=[];let row=[],cell='',quoted=false,cells=0;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch===quote&&text[i+1]===quote){cell+=quote;i++;}else if(ch===quote)quoted=false;else cell+=ch;continue;}if(ch===quote){if(cell.length)throw new Error('Malformed CSV quote.');quoted=true;continue;}if(ch===delimiter){row.push(cell);cell='';cells++;continue;}const isLf=ch==='\\n',isCr=ch==='\\r';if(isLf||isCr){if(newline==='LF'&&isCr)throw new Error('CSV newline does not match LF contract.');if(newline==='CRLF'&&!(isCr&&text[i+1]==='\\n'))throw new Error('CSV newline does not match CRLF contract.');if(isCr&&text[i+1]==='\\n')i++;row.push(cell);rows.push(row);row=[];cell='';cells++;continue;}cell+=ch;if(cells>LIMITS.maxCsvCells)throw new Error('CSV exceeds cell limit.');}if(quoted)throw new Error('Malformed CSV: unterminated quote.');if(cell.length||row.length){row.push(cell);rows.push(row);}if(rows.length>LIMITS.maxCollectionItems)throw new Error('CSV exceeds row limit.');if(!cfg.header)return rows;if(!rows.length)return [];const names=rows[0];return rows.slice(1).map(r=>Object.fromEntries(names.map((n,i)=>[n,r[i]??''])));}\nfunction parseXml(text){const root={name:'#document',attrs:{},children:[],text:''},stack=[root],tokens=String(text).match(/<[^>]+>|[^<]+/g)||[];for(const token of tokens){if(token.startsWith('<?')||token.startsWith('<!'))continue;if(token.startsWith('</')){const name=token.slice(2,-1).trim();if(stack.length<2||stack.at(-1).name!==name)throw new Error('Malformed XML closing tag.');stack.pop();continue;}if(token.startsWith('<')){const selfClose=/\\/\\s*>$/.test(token),body=token.slice(1,selfClose?-2:-1).trim(),m=body.match(/^([^\\s/>]+)([\\s\\S]*)$/);if(!m)throw new Error('Malformed XML tag.');const node={name:m[1],attrs:{},children:[],text:''},attrs=m[2]||'';for(const a of attrs.matchAll(/([^\\s=]+)\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)')/g))node.attrs[a[1]]=a[2]??a[3]??'';stack.at(-1).children.push(node);if(!selfClose)stack.push(node);continue;}stack.at(-1).text+=token;}if(stack.length!==1)throw new Error('Malformed XML: unclosed tag.');depth(root);return root;}\nfunction selectJsonPath(value,path){const text=String(path||'').trim();if(text==='$')return value;if(!text.startsWith('$.'))throw new Error('Unsupported JSON selector.');const tokens=text.slice(2).split('.');if(tokens.length>LIMITS.maxSelectorDepth)throw new Error('JSON selector exceeds depth limit.');let out=value;for(const token of tokens){const m=token.match(/^([^\\[\\]]+)(?:\\[(\\d+)\\])?$/);if(!m)throw new Error('Unsupported JSON selector token.');out=out?.[m[1]];if(m[2]!==undefined)out=out?.[Number(m[2])];if(out===undefined)throw new Error('JSON selector does not resolve.');}return out;}\nfunction selectXml(root,selector){const text=String(selector||'').trim();if(!text.startsWith('/'))throw new Error('SELECT_XML requires an absolute restricted selector.');const parts=text.split('/').filter(Boolean);if(parts.length>LIMITS.maxSelectorDepth)throw new Error('XML selector exceeds depth limit.');let nodes=[root];for(const part of parts){if(part.startsWith('@')){if(nodes.length!==1)throw new Error('XML attribute selector requires one node.');return nodes[0].attrs[part.slice(1)];}const m=part.match(/^([A-Za-z_][\\w:.-]*)(?:\\[(\\d+)\\])?$/);if(!m)throw new Error('Unsupported XML selector token.');let next=nodes.flatMap(n=>n.children.filter(c=>c.name===m[1]));if(m[2])next=next[Number(m[2])-1]?[next[Number(m[2])-1]]:[];nodes=next;}return nodes.length===1?nodes[0]:nodes;}\nfunction validateSpec(spec){const issues=[];if(!spec||typeof spec!=='object'||Array.isArray(spec))issues.push('Test IR must be an object.');if(spec?.version!==SPEC_VERSION)issues.push('Unsupported Test IR version.');if(!Array.isArray(spec?.steps)||!spec.steps.length)issues.push('Test IR requires steps.');if((spec?.steps?.length||0)>LIMITS.maxSteps)issues.push('Test IR exceeds step limit.');for(const [i,step] of (spec?.steps||[]).entries()){if(!step||typeof step!=='object'||Array.isArray(step)){issues.push('Step '+i+' is not an object.');continue;}if(!OPS.includes(step.op)){issues.push('Step '+i+' uses unsupported operation '+String(step.op)+'.');continue;}const allowed=new Set(STEP_KEYS[step.op]||['op']);for(const key of Object.keys(step))if(!allowed.has(key))issues.push('Step '+i+' contains unsupported property '+key+'.');if(['LOAD_ARTIFACT','BYTE_COMPARE'].includes(step.op)&&!String(step.binding||'').trim())issues.push('Step '+i+' requires binding.');if(step.op==='SELECT_JSON_PATH'&&!String(step.path||'').trim())issues.push('Step '+i+' requires path.');if(step.op==='SELECT_XML'&&!String(step.selector||'').trim())issues.push('Step '+i+' requires selector.');if(step.op==='PARSE_CSV'&&(String(step.encoding||'')!=='UTF-8'||typeof step.header!=='boolean'||String(step.delimiter||'').length!==1||String(step.quote||'').length!==1||!['LF','CRLF','ANY'].includes(String(step.newline||''))))issues.push('Step '+i+' has incomplete CSV contract.');if(['REGEX','ASSERT_MATCH'].includes(step.op)){try{safeRegex(step.pattern??step.value??'',step.flags||'');}catch(e){issues.push('Step '+i+': '+e.message);}}if(step.op==='ASSERT_EQ'&&typeof step.value==='number'&&!Number.isInteger(step.value)&&step.absoluteTolerance===undefined&&step.relativeTolerance===undefined)issues.push('Precision-sensitive numeric ASSERT_EQ requires explicit tolerance or exact string representation.');}return {valid:issues.length===0,issues};}\nfunction validateBindings(bindings){const issues=[];if(!bindings||typeof bindings!=='object'||Array.isArray(bindings))return {valid:false,issues:['EXECUTABLE_INPUT_BINDINGS must be an object.']};for(const [name,binding] of Object.entries(bindings)){if(!/^[A-Z][A-Z0-9_]{0,63}$/.test(name))issues.push('Invalid binding '+name+'.');if(typeof binding==='string')continue;if(!binding||typeof binding!=='object'||Array.isArray(binding)){issues.push('Binding '+name+' is invalid.');continue;}const allowed=new Set(['artifactId','source','artifactRole','filename']);for(const key of Object.keys(binding))if(!allowed.has(key))issues.push('Binding '+name+' contains unsupported key '+key+'.');if(binding.source&&!['CURRENT_PRODUCT','CURRENT_SCOPE'].includes(binding.source))issues.push('Binding '+name+' has unsupported source.');if(!binding.artifactId&&!binding.artifactRole&&!binding.filename)issues.push('Binding '+name+' does not identify an artifact.');}return {valid:issues.length===0,issues};}\nfunction supports(test){return String(field(test,'EXECUTION_MODE')||'').toUpperCase()==='APPLICATION_DETERMINISTIC'&&String(field(test,'REQUIRED_CAPABILITY')||'')===CAPABILITY&&String(field(test,'EXECUTABLE_KIND')||'').toUpperCase()==='TEST_IR'&&field(test,'EXECUTABLE_SPEC_VERSION')===SPEC_VERSION&&validateSpec(field(test,'EXECUTABLE_SPEC')).valid&&validateBindings(field(test,'EXECUTABLE_INPUT_BINDINGS')).valid;}\nfunction assertCmp(op,a,b){if(typeof a==='number'&&typeof b==='number'&&!Number.isFinite(a+b))throw new Error('Numeric assertion requires finite values.');return op==='ASSERT_GT'?a>b:op==='ASSERT_GTE'?a>=b:op==='ASSERT_LT'?a<b:a<=b;}\nasync function executeTest(testOrSpec,artifacts={},canonicalBindings={}){const spec=testOrSpec?.version?testOrSpec:field(testOrSpec,'EXECUTABLE_SPEC'),check=validateSpec(spec);if(!check.valid)throw new Error(check.issues.join(' '));let value=null,currentArtifact=null,lastRegex=null,lastAssertion=null;const observations=[];for(const [index,step] of spec.steps.entries()){switch(step.op){case 'LOAD_ARTIFACT':{const a=artifacts[step.binding];if(!a)throw new Error('Artifact binding '+step.binding+' unavailable.');if(Number(a.byteSize||a.bytes?.byteLength||0)>LIMITS.maxInputBytes)throw new Error('Artifact exceeds input byte limit.');currentArtifact=a;value=a;break;}case 'READ_BYTES':{value=bytesOf(currentArtifact?.bytes??value?.bytes??value);if(!value)throw new Error('READ_BYTES requires bytes.');break;}case 'DECODE_UTF8':{const b=bytesOf(value);if(!b||b.byteLength>LIMITS.maxInputBytes)throw new Error('DECODE_UTF8 requires bounded bytes.');value=new TextDecoder('utf-8',{fatal:true}).decode(b);break;}case 'PARSE_JSON':value=JSON.parse(String(value));depth(value);break;case 'PARSE_CSV':value=parseCsv(String(value),step);depth(value);break;case 'PARSE_XML':value=parseXml(String(value));break;case 'SELECT_JSON_PATH':value=selectJsonPath(value,step.path);break;case 'SELECT_XML':value=selectXml(value,step.selector);break;case 'COUNT':if(value==null||typeof value.length!=='number'||value.length>LIMITS.maxCollectionItems)throw new Error('COUNT requires a bounded collection.');value=value.length;break;case 'SUM':case 'MIN':case 'MAX':{if(!Array.isArray(value)||value.length>LIMITS.maxCollectionItems)throw new Error(step.op+' requires a bounded array.');const nums=value.map(x=>{if(typeof x!=='number'||!Number.isFinite(x))throw new Error(step.op+' requires finite numbers.');return x;});value=step.op==='SUM'?nums.reduce((a,b)=>a+b,0):step.op==='MIN'?Math.min(...nums):Math.max(...nums);break;}case 'SORT':if(!Array.isArray(value))throw new Error('SORT requires array.');value=[...value].sort((a,b)=>stable(a).localeCompare(stable(b)));break;case 'UNIQUE':if(!Array.isArray(value))throw new Error('UNIQUE requires array.');{const seen=new Set();value=value.filter(x=>{const k=stable(x);if(seen.has(k))return false;seen.add(k);return true;});}break;case 'HASH_SHA256':value=await sha256(value);break;case 'REGEX':if(String(value).length>LIMITS.maxRegexInputLength)throw new Error('Regex input exceeds limit.');lastRegex=safeRegex(step.pattern,step.flags);value=lastRegex.test(String(value));break;case 'COMPARE':{const other=Object.prototype.hasOwnProperty.call(step,'value')?step.value:canonicalBindings[step.binding]??artifacts[step.binding]?.value;value=stable(value)===stable(other);break;}case 'BYTE_COMPARE':{const a=bytesOf(value),b=bytesOf(artifacts[step.binding]?.bytes);if(!a||!b)throw new Error('BYTE_COMPARE requires bytes.');value=a.byteLength===b.byteLength&&a.every((x,i)=>x===b[i]);break;}case 'ASSERT_EQ':{let ok;if(typeof value==='number'&&typeof step.value==='number'&&(!Number.isInteger(value)||!Number.isInteger(step.value))){const abs=Number(step.absoluteTolerance??0),rel=Number(step.relativeTolerance??0),delta=Math.abs(value-step.value);ok=delta<=Math.max(abs,rel*Math.max(Math.abs(value),Math.abs(step.value)));}else ok=stable(value)===stable(step.value);lastAssertion={determination:ok?'SATISFIED':'VIOLATED',expected:step.value,actual:value};break;}case 'ASSERT_GT':case 'ASSERT_GTE':case 'ASSERT_LT':case 'ASSERT_LTE':lastAssertion={determination:assertCmp(step.op,value