name: Apply final semantic operator corrections
'on':
  push:
    branches: [practical-100/final-semantic-operator-correctness]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-semantic-operator-correctness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded minimum corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def one(path,old,new,label):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old,new,1))

          one('response-ingestion.js',"'MISSING_HUMAN_INPUT','MISSING_AUTHORITY','MISSING_EVIDENCE','MISSING_CAPABILITY','MISSING_ARTIFACT'","'MISSING_HUMAN_INPUT','MISSING_APPLICATION_CONTEXT','MISSING_AUTHORITY','MISSING_EVIDENCE','MISSING_CAPABILITY','WORK_TOO_LARGE_FOR_ENVIRONMENT','MISSING_ARTIFACT'",'explicit recovery taxonomy')

          p=Path('prompt-engine.js'); s=p.read_text()
          # Remove the duplicate runtime context selector; operation contract is the sole selector.
          start=s.index('const contextCollections={'); end=s.index('const recordId=',start)
          s=s[:start]+s[end:]
          old='function contextFor(stage,state){'; new='function contextFor(stage,state,operation){'
          if s.count(old)!=1: raise SystemExit('contextFor signature mismatch')
          s=s.replace(old,new,1)
          old="for(const collection of contextCollections[stage]||[])parts.push"
          new="const op=schema.operationContract(stage,operation||schema.STAGE_CONTRACTS[stage].operations[0]);\n for(const collection of op?.readCollections||schema.STAGE_CONTRACTS[stage].readCollections||[])parts.push"
          if s.count(old)!=1: raise SystemExit('context selector hook mismatch')
          s=s.replace(old,new,1)
          old='${contextFor(stage,state)}'; new='${contextFor(stage,state,operation)}'
          if s.count(old)!=1: raise SystemExit('context call hook mismatch')
          s=s.replace(old,new,1)
          old='Create one applicable verification record for every required REQ_ID × RUN_ID relation, linked to TEST_ID.'
          new='Create exactly one current verification record for every applicable REQ_ID × RUN_ID × TEST_ID triple; each triple is the required REQ_ID × RUN_ID relation linked to its exact TEST_ID.'
          if s.count(old)!=1: raise SystemExit('stage12 wording hook mismatch')
          s=s.replace(old,new,1)
          old="if(answered.length)parts.push(`ANSWERED HUMAN CLARIFICATIONS\\n${show(answered)}`);"
          new="if(answered.length)parts.push(`ANSWERED HUMAN CLARIFICATIONS\\n${show(answered)}`);\n const corrections=(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}));\n if(corrections.length)parts.push(`OPERATOR REQUESTED CORRECTIONS / REFINEMENTS\\n${show(corrections)}`);"
          if s.count(old)!=1: raise SystemExit('correction context hook mismatch')
          s=s.replace(old,new,1)
          old="answeredHumanClarifications:(state?.projectData?.humanInputAnswers||[]).filter(x=>Number(x.stage)===stage).map(x=>({requestId:x.requestId,answerId:x.answerId,inputVersion:x.inputVersion||state?.job?.CURRENT_INPUT_VERSION||null}))};"
          new="answeredHumanClarifications:(state?.projectData?.humanInputAnswers||[]).filter(x=>Number(x.stage)===stage).map(x=>({requestId:x.requestId,answerId:x.answerId,inputVersion:x.inputVersion||state?.job?.CURRENT_INPUT_VERSION||null})),operatorCorrectionRequests:(state?.projectData?.rejectedResponses||[]).filter(x=>Number(x.stage)===stage&&x.requestCorrection&&!x.invalidatedBy).map(x=>({rejectedResponseId:x.rejectedResponseId,reason:x.reason,rawResponseId:x.rawResponseId}))};"
          if s.count(old)!=1: raise SystemExit('correction signature hook mismatch')
          s=s.replace(old,new,1)
          anchor='- When the environment cannot perform a requested implementation or execution, provide an implementation-ready specification rather than pretending implementation occurred.\n'
          inserted="- Before substantive work at this stage, decide whether the current human input, canonical application context, prior accepted outputs, evidence, and available capabilities are sufficient to proceed reliably for this specific job and stage. Do not use a generic hard-coded sufficiency threshold.\n- Missing human-authority information requires HUMAN_INPUT_REQUIRED. Missing, stale, or incomplete canonical application context requires BLOCKED with MISSING_APPLICATION_CONTEXT. An unavailable external capability requires BLOCKED with MISSING_CAPABILITY, or EXECUTION_FAILED if an attempted execution failed. Work too large for the available environment requires BLOCKED with WORK_TOO_LARGE_FOR_ENVIRONMENT plus a complete implementation-ready specification; do not claim execution occurred. Self-contained deliverables that can actually be produced in the available environment should still be produced.\n- If the result is incomplete or needs refinement, identify the exact missing, incorrect, or insufficient work so the next controlling prompt can correct it without restarting the project.\n"+anchor
          if s.count(anchor)!=1: raise SystemExit('environment anchor mismatch')
          s=s.replace(anchor,inserted,1)
          p.write_text(s)

          one('workflow-schema.js',"function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[])});}","function operationContract(stage,operation){const operations=STAGE_OPERATIONS[stage]||['COMPLETE'];if(!operations.includes(operation))return null;const override=OPERATION_CONTRACT_OVERRIDES[stage]?.[operation]||{};let scopeRequirements=override.scopeRequirements||SCOPE_REQUIREMENTS[stage]||[];if((stage===17||stage===19)&&!['EXECUTE_RUN','VERIFY'].includes(operation))scopeRequirements=scopeRequirements.filter(key=>key!=='runId'&&key!=='contextId');return Object.freeze({operation,readCollections:Object.freeze(override.readCollections||READ_COLLECTIONS[stage]||[]),agentWritableCollections:Object.freeze(override.agentWritableCollections||STAGE_COLLECTIONS[stage]||[]),applicationCollections:Object.freeze(APPLICATION_COLLECTIONS[stage]||[]),humanActions:Object.freeze(HUMAN_ACTIONS[stage]||[]),scopeRequirements:Object.freeze(scopeRequirements)});}",'operation scope requirements')

          p=Path('workflow-engine.js'); s=p.read_text()
          marker='function freezeBaseline(project,'
          if 'function beginUnchangedConfirmationIteration(' not in s:
              i=s.index(marker)
              fn="""function beginUnchangedConfirmationIteration(project,{candidateId,operatorLabel='HUMAN_OPERATOR'}={}){\n  ensureShape(project);const candidate=records(project,'candidateFreezes').find(record=>recordId(record,'candidateFreezes')===String(candidateId||'')&&isActiveRecord(record));if(!candidate)throw new Error('A current frozen candidate is required for unchanged confirmation.');const componentHashes=recordValue(candidate,'COMPONENT_HASHES')||{};if(!componentHashes||typeof componentHashes!=='object'||Array.isArray(componentHashes)||!Object.keys(componentHashes).length)throw new Error('The unchanged-confirmation candidate must have application-computed component hashes.');const previousIterationId=String(recordValue(candidate,'ITERATION_ID')||candidate.scope?.iterationId||'');const previousIteration=records(project,'iterations').find(record=>recordId(record,'iterations')===previousIterationId);if(!previousIteration)throw new Error('The candidate source iteration does not exist.');const iterationId=allocateId(project,'iterations'),createdAt=now(),baseScope=clone(previousIteration.scope||candidate.scope||currentScope(project));const fields={ITERATION_ID:iterationId,CANDIDATE_ID:String(candidateId),PREVIOUS_ITERATION_ID:previousIterationId,CHANGESET_ID:'',PURPOSE:'UNCHANGED_CONFIRMATION',STATUS:'FROZEN',LINEAGE:hash.sha256Value({candidateId:String(candidateId),componentHashes}),EVIDENCE:'Application allocated a new unchanged-confirmation iteration using the exact existing frozen candidate identity.'};const iteration={id:iterationId,stage:19,createdAt,active:true,scope:{...baseScope,iterationId,candidateId:String(candidateId)},fields,...fields,source:'APPLICATION_DERIVATION'};iteration.contentSha256=hash.contentRecordSha256(iteration,'ITERATION_ID');iteration.recordSha256=hash.recordSha256(iteration);iteration.sha256=iteration.recordSha256;project.projectData.iterations.push(iteration);project.job.CURRENT_ITERATION=iterationId;addHistory(project,'UNCHANGED_CONFIRMATION_ITERATION_STARTED',{stage:19,iterationId,candidateId:String(candidateId),previousIterationId,operatorLabel,identityAssurance:'SELF_ASSERTED'});recalculate(project);return iteration;\n}\n"""
              s=s[:i]+fn+s[i:]
          old="const contexts=recordsForCurrentScope(project,'freshContexts').filter(r=>!recordValue(r,'RUN_ID')),context=contexts.at(-1);"
          if old in s:s=s.replace(old,"const contexts=recordsForCurrentScope(project,'freshContexts').filter(r=>{const runId=upper(recordValue(r,'RUN_ID'));return !runId||runId==='NOT APPLICABLE';}),context=contexts.at(-1);",1)
          if 'beginUnchangedConfirmationIteration' not in s[s.rfind('globalThis.closedLoopWorkflowEngine'):]:
              old='freezeCandidate,freezeBaseline,reserveProductExecution'
              if s.count(old)!=1: raise SystemExit('engine export hook mismatch')
              s=s.replace(old,'freezeCandidate,beginUnchangedConfirmationIteration,freezeBaseline,reserveProductExecution',1)
          p.write_text(s)

          p=Path('app-core.js'); s=p.read_text()
          old="function promptOptions(n){const operation=selectedOperation(n),options={operation};if(n===11||operation==='EXECUTE_RUN'){const run=selectedRun(n);if(run){const runId=engine.recordId(run,'runs'),contextId=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||run.scope?.contextId||'');options.scope={runId,contextId};}}return options;}"
          new="function promptOptions(n){const operation=selectedOperation(n),options={operation},requiresRun=(schema.operationContract(n,operation)?.scopeRequirements||[]).includes('runId');if(requiresRun){const run=selectedRun(n);if(run){const runId=engine.recordId(run,'runs'),contextId=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||run.scope?.contextId||'');options.scope={runId,contextId};}}return options;}"
          if s.count(old)!=1: raise SystemExit('promptOptions hook mismatch')
          s=s.replace(old,new,1)
          old="const picker=(n===11||selectedOperation(n)==='EXECUTE_RUN')&&runs.length?"
          new="const picker=(schema.operationContract(n,selectedOperation(n))?.scopeRequirements||[]).includes('runId')&&runs.length?"
          if s.count(old)!=1: raise SystemExit('run picker hook mismatch')
          s=s.replace(old,new,1)
          old='<button id="request-correction">Request correction</button>'
          new='<button id="request-correction">Request correction</button></div><div class="field"><label>Correction or refinement needed</label><textarea id="correction-reason" placeholder="State exactly what is missing, incorrect, or should be made more complete."></textarea><div class="button-row">'
          if s.count(old)!=1: raise SystemExit('correction UI hook mismatch')
          s=s.replace(old,new,1)
          old="async function rejectPendingProposal(requestCorrection=false){const p=pendingProposal();if(!p)return;const result=ingestion.reject(current,p.proposalId,{operator:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR',reason:requestCorrection?'Correction requested after proposal review.':'Rejected after proposal review.',requestCorrection});"
          new="async function rejectPendingProposal(requestCorrection=false){const p=pendingProposal();if(!p)return;const correction=$('#correction-reason')?.value.trim()||'';if(requestCorrection&&!correction){alert('Describe the correction or refinement that is required.');$('#correction-reason')?.focus();return;}const result=ingestion.reject(current,p.proposalId,{operator:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR',reason:requestCorrection?correction:'Rejected after proposal review.',requestCorrection});"
          if s.count(old)!=1: raise SystemExit('correction handler hook mismatch')
          s=s.replace(old,new,1)
          old="${s.gate?.reasons?.length?`<div class=\"notice warn\"><strong>Completion gate is not satisfied.</strong><br>${s.gate.reasons.map(esc).join('<br>')}</div>`:`<div class=\"notice success\">Completion gate is satisfied by current canonical evidence.</div>`}</div>`;}"
          new="${s.gate?.reasons?.length?`<div class=\"notice warn\"><strong>Completion gate is not satisfied.</strong><br>${s.gate.reasons.map(esc).join('<br>')}</div>`:`<div class=\"notice success\">Completion gate is satisfied by current canonical evidence.</div>`}${engine.acceptedChanges(current,n).length&&!current.isRetainedTestProject?`<details class=\"record-card\"><summary>Refine accepted result<span>Controlled</span></summary><div class=\"record-body\"><div class=\"field\"><label>Why refinement is required</label><textarea id=\"accepted-refinement-reason\"></textarea></div><button id=\"refine-accepted-response\">Invalidate accepted result and request refinement</button></div></details>`:''}</div>`;}"
          if s.count(old)!=1: raise SystemExit('accepted refinement markup mismatch')
          s=s.replace(old,new,1)
          old="const applicable=[10,17,19,20,21,25].includes(n)"
          new="const applicable=[10,17,20,21,25].includes(n)"
          if s.count(old)!=1: raise SystemExit('artifact stages hook mismatch')
          s=s.replace(old,new,1)
          old="${[10,17,19].includes(n)?`<button id=\"freeze-candidate\"${locked?' disabled':''}>${n===17?'Freeze corrected candidate':n===19?'Verify unchanged candidate':'Freeze selected candidate'}</button>`:''}"
          new="${[10,17].includes(n)?`<button id=\"freeze-candidate\"${locked?' disabled':''}>${n===17?'Freeze corrected candidate':'Freeze selected candidate'}</button>`:''}${n===19?`<button id=\"begin-unchanged-confirmation\"${locked?' disabled':''}>Begin unchanged confirmation using Stage 17 candidate</button>`:''}"
          if s.count(old)!=1: raise SystemExit('candidate control hook mismatch')
          s=s.replace(old,new,1)
          hook="if($('#reject-proposal'))$('#reject-proposal').onclick=()=>rejectPendingProposal(false);"
          if s.count(hook)!=1: raise SystemExit('reject wire hook mismatch')
          s=s.replace(hook,hook+"if($('#refine-accepted-response'))$('#refine-accepted-response').onclick=async()=>{const reason=$('#accepted-refinement-reason')?.value.trim();if(!reason){alert('Describe why the accepted result must be refined.');$('#accepted-refinement-reason')?.focus();return;}try{const next=clone(current),change=engine.acceptedChanges(next,current.activeStage).at(-1);if(!change)throw new Error('No current accepted response exists to refine.');engine.invalidateAcceptedResponse(next,{stage:current.activeStage,rawResponseId:change.rawResponseId,reason,operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});await persistReplacement(next);announce('accepted result invalidated for refinement');render();}catch(error){alert(error.message||error);}};",1)
          hook="if($('#freeze-baseline'))"
          if s.count(hook)!=1: raise SystemExit('baseline wire hook mismatch')
          s=s.replace(hook,"if($('#begin-unchanged-confirmation'))$('#begin-unchanged-confirmation').onclick=async()=>{try{const next=clone(current),candidate=engine.records(next,'candidateFreezes').filter(r=>Number(r.stage)===17&&engine.isActiveRecord(r)).at(-1);if(!candidate)throw new Error('A current Stage 17 frozen candidate is required.');engine.beginUnchangedConfirmationIteration(next,{candidateId:engine.recordId(candidate,'candidateFreezes'),operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});await persistReplacement(next);announce('unchanged confirmation iteration started');render();}catch(error){alert(error.message||error);}};"+hook,1)
          p.write_text(s)
          PY
      - name: Verify source, semantics, lifecycle, and operator contracts
        run: |
          node --check workflow-schema.js && node --check workflow-engine.js && node --check prompt-engine.js && node --check response-ingestion.js && node --check app-core.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const f of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          const s=globalThis.closedLoopWorkflowSchema,pe=fs.readFileSync('prompt-engine.js','utf8'),ui=fs.readFileSync('app-core.js','utf8'),ing=fs.readFileSync('response-ingestion.js','utf8'),eng=fs.readFileSync('workflow-engine.js','utf8');const must=(c,m)=>{if(!c)throw new Error(m)};
          must(!pe.includes('const contextCollections='),'Duplicate prompt context selector remains');
          must(pe.includes('REQ_ID × RUN_ID × TEST_ID triple'),'Stage 12 prompt is not exact-triple based');
          must(pe.includes('OPERATOR REQUESTED CORRECTIONS / REFINEMENTS'),'Correction feedback missing from next prompt');
          must(pe.includes('WORK_TOO_LARGE_FOR_ENVIRONMENT')&&ing.includes('MISSING_APPLICATION_CONTEXT'),'Recovery taxonomy incomplete');
          must(!s.operationContract(17,'FREEZE').scopeRequirements.includes('runId')&&s.operationContract(17,'VERIFY').scopeRequirements.includes('runId'),'Stage 17 operation scope wrong');
          must(!s.operationContract(19,'CONFIRM_FREEZE').scopeRequirements.includes('runId')&&s.operationContract(19,'VERIFY').scopeRequirements.includes('runId')&&!s.operationContract(19,'CONFIRM').scopeRequirements.includes('runId'),'Stage 19 operation scope wrong');
          must(ui.includes("requiresRun=(schema.operationContract(n,operation)?.scopeRequirements||[]).includes('runId')"),'UI run scoping not schema-driven');
          must(ui.includes('accepted-refinement-reason'),'Accepted response refinement missing');
          must(ui.includes('begin-unchanged-confirmation')&&eng.includes('beginUnchangedConfirmationIteration'),'Same-candidate Stage 19 path missing');
          must(!ui.includes("n===19?'Verify unchanged candidate'"),'Stage 19 still creates a new candidate under an unchanged label');
          console.log(JSON.stringify({singleContextSelector:true,exactTriplePrompt:true,recoveryTaxonomy:true,operationScopeExact:true,schemaDrivenRunUI:true,postAcceptanceRefinement:true,sameCandidateStage19:true},null,2));
          NODE
      - name: Commit verified source and remove one-time workflow
        run: |
          rm .github/workflows/final-semantic-operator-correctness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close remaining semantic operator contradictions"
          git push origin HEAD:practical-100/final-semantic-operator-correctness
