name: Temporary Stage 1 input invalidation v2 repair
on:
  push:
    branches:
      - semantic-reliability/stage1-input-invalidation-v2-20260826
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Invalidate Stage 1 when authoritative job input changes
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          let app=fs.readFileSync('app-core.js','utf8');
          const old="engine.recordHumanInputVersion(next,changed,'HUMAN_OPERATOR');if(next.stages[1].status==='COMPLETE'&&!next.isRetainedTestProject){const id=engine.allocateInfrastructureId(next,'HUMAN-INPUT-CHANGE','changes');engine.invalidateDownstream(next,1,id,'User Job Input changed after Stage 01 completion.');}await persistReplacement(next);";
          const replacement="engine.recordHumanInputVersion(next,changed,'HUMAN_OPERATOR');if(next.stages[1].status==='COMPLETE'&&!next.isRetainedTestProject)engine.invalidateStageForAuthorityChange(next,{stage:1,reason:'User Job Input changed after Stage 01 completion.',operatorLabel:'HUMAN_OPERATOR'});await persistReplacement(next);";
          if(!app.includes(old))throw new Error('Expected User Job Input invalidation path not found.');
          fs.writeFileSync('app-core.js',app.replace(old,replacement));

          let verify=fs.readFileSync('verify-complete.mjs','utf8');
          const marker="// Explicit workflow gates cannot be bypassed by manual assertions.\n";
          const test=`// Authoritative User Job Input changes after Stage 01 completion must invalidate Stage 01 itself, not only downstream work.\n{\n  const appSource=fs.readFileSync('app-core.js','utf8');\n  assert(appSource.includes("invalidateStageForAuthorityChange(next,{stage:1,reason:'User Job Input changed after Stage 01 completion.'"),'User Job Input edit path does not invalidate Stage 01 authority.');\n  assert(!appSource.includes("invalidateDownstream(next,1,id,'User Job Input changed after Stage 01 completion.'"),'User Job Input edit still leaves stale Stage 01 accepted authority current.');\n  const p=project('JOB-STAGE1-INPUT-CHANGE');\n  p.stages[1].status='COMPLETE';p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'OLD DELIVERABLE'};p.stages[1].acceptedData={EXACT_DELIVERABLE_REQUESTED:'OLD DELIVERABLE'};p.stages[1].acceptedDataChangeIds=['CHANGE-STAGE1-OLD'];p.stages[1].acceptedResponseIds=['CHANGE-STAGE1-OLD'];\n  p.projectData.acceptedChanges.push({changeId:'CHANGE-STAGE1-OLD',stage:1,status:'COMMITTED',responseType:'DATA_PROPOSAL',rawResponseId:'RAW-STAGE1-OLD'});\n  p.projectData.stageConfirmations.push({confirmationId:'CONFIRM-STAGE1-OLD',stage:1,acceptedChangeId:'CHANGE-STAGE1-OLD',confirmed:true});\n  p.stages[2].status='COMPLETE';const source=record('sources',2,{TITLE:'Old source',ISSUING_ORGANIZATION_OR_AUTHOR:'Authority',SOURCE_TYPE:'OFFICIAL_STANDARD',PUBLICATION_ORIGIN:'Authority',URL_REFERENCE:'https://example.invalid/old',AUTHORITY_LEVEL:'PRIMARY',AUTHORITY_ROLE:'GOVERNING',RELEVANCE:'old',APPLICABLE_PORTIONS:'old',INSPECTION_STATUS:'INSPECTED',CURRENCY_STATUS:'CURRENT',SUPERSESSION_STATUS:'NOT SUPERSEDED',CONTROLLING_STATE:'CONTROLLING'},'SOURCE-OLD-INPUT');p.projectData.sources.push(source);\n  engine.invalidateStageForAuthorityChange(p,{stage:1,reason:'User Job Input changed after Stage 01 completion.',operatorLabel:'VERIFY'});\n  assert(p.stages[1].status!=='COMPLETE'&&!Object.keys(p.stages[1].agentData||{}).length&&!Object.keys(p.stages[1].acceptedData||{}).length,'Stage 01 remained complete with stale normalized input after authoritative input change.');\n  assert(p.projectData.acceptedChanges[0].invalidatedBy&&p.projectData.stageConfirmations[0].invalidatedBy,'Old Stage 01 acceptance or human confirmation remained current.');\n  assert(source.active===false&&source.invalidatedBy,'Downstream Stage 02 evidence remained current after Stage 01 authority changed.');\n}\n\n`;
          if(!verify.includes('JOB-STAGE1-INPUT-CHANGE')){
            if(!verify.includes(marker))throw new Error('verify-complete insertion marker not found.');
            verify=verify.replace(marker,test+marker);
            fs.writeFileSync('verify-complete.mjs',verify);
          }
          NODE
          rm .github/workflows/stage1-input-invalidation-v2-repair.yml
      - name: Run deterministic acceptance
        run: |
          node --check app-core.js
          node --check verify-complete.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit proven repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git add -A
          git commit -m "Invalidate Stage 1 when job input changes"
          git push origin HEAD:semantic-reliability/stage1-input-invalidation-v2-20260826
