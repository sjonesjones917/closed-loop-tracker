name: Apply final prompt completeness repair
on:
  push:
    branches:
      - fix/complete-stage-context-and-ci-20260830
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-stage-context-and-ci-20260830
      - run: python3 repair-final-prompts.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish every stage prompt context and procedure"
          git push origin HEAD:fix/complete-stage-context-and-ci-20260830
