name: Materialize payload-built application

on:
  push:
    branches:
      - inspect-built-application
    paths-ignore:
      - BUILT_APPLICATION.html
      - PROJECT_LANGUAGE_REPORT.json

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild verified payload
        run: |
          set -euo pipefail
          node build-app.mjs
          cp index.html BUILT_APPLICATION.html
          node inspect-project-language.mjs
      - name: Commit diagnostic outputs to this branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILT_APPLICATION.html PROJECT_LANGUAGE_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh materialized application diagnostics [skip ci]'
          git push origin HEAD:inspect-built-application
