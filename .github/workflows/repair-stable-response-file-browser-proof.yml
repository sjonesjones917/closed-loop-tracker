name: repair-stable-response-file-browser-proof

on:
  push:
    branches:
      - fix/spec-driven-file-first-20260902

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spec-driven-file-first-20260902
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply stable current-control browser proof
        run: |
          set -euo pipefail
          node repair-stable-response-file-browser-proof.mjs
          node --check verify-browser.mjs
      - name: Remove one-time repair scaffolding and commit the permanent regression
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify-browser.mjs
          git rm repair-stable-response-file-browser-proof.mjs .github/workflows/repair-stable-response-file-browser-proof.yml
          git commit -m 'Stabilize authoritative response-file browser proof'
          git push origin HEAD:fix/spec-driven-file-first-20260902
