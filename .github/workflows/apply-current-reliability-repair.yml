name: Apply current reliability repair
on:
  push:
    branches: [fix/restore-full-acceptance-cache-identity-20260830]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic runtime cache identity
        run: node .github/scripts/apply-current-reliability-repair.mjs
      - name: Verify the repaired runtime identity and core semantics
        run: |
          node --check app-core.js
          node --check test-runtime.js
          node --check prompt-engine.js
          node verify-runtime-bundle-identity.mjs
          node verify-test-runtime.mjs
          node verify-prompt-semantics.mjs
          node verify-zero-loss-accounting.mjs
      - name: Commit the verified repair and remove one-time files
        run: |
          test ! -e .github/workflows/apply-current-reliability-repair.yml
          test ! -e .github/scripts/apply-current-reliability-repair.mjs
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Bind runtime cache identity to exact verified source"
          git push origin HEAD:${GITHUB_REF_NAME}
