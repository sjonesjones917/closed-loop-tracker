name: One-time v3 browser migration repair
on:
  push:
    branches: [fix/closed-loop-v3-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-v3-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Replace stale legacy-intent browser assertion with v3 durable-intake proof
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='verify-browser.mjs';
          let s=fs.readFileSync(path,'utf8');
          const old="const migratedIntent=retained.projectData.intentStatements||[];assert(migratedIntent.length>0,'Legacy Stage 01 human authority was not migrated into the canonical intent ledger.');assert(migratedIntent.every(r=>r.scope?.inputVersion===retained.job.CURRENT_INPUT_VERSION),'Migrated intent statement scope does not match the current input version.');assert(migratedIntent.some(r=>(r.fields?.EXACT_STATEMENT||r.EXACT_STATEMENT)===retained.job.EXACT_USER_OBJECTIVE_VERBATIM),'Exact legacy user objective is missing from the canonical intent ledger.');";
          const replacement="const migratedIntake=await evalValue(cdp,`(async()=>{const all=await globalThis.closedLoopProjectStore.readAll();const r=all.find(p=>p.job?.JOB_ID==='JOB-20260823144121');const stage1=globalThis.closedLoopPromptEngine.buildPromptRecord(1,r).contextManifest.intakeCoverageManifest;const stage4=globalThis.closedLoopPromptEngine.buildPromptRecord(4,r).contextManifest.obligationManifest;return {stage1,stage4,inputSet:r.stages?.[1]?.agentData?.INPUT_SET_CONTENTS||r.stages?.[1]?.acceptedData?.INPUT_SET_CONTENTS||'',archives:r.projectData?.nonOperationalImportedPayloads||[],objective:r.job?.EXACT_USER_OBJECTIVE_VERBATIM,inputVersion:r.job?.CURRENT_INPUT_VERSION};})()`);assert(migratedIntake.stage1?.inputVersion===migratedIntake.inputVersion,'Migrated Stage 01 intake manifest is not bound to the current input version.');assert((migratedIntake.stage1?.units||[]).some(u=>u.sourceLocation==='job.EXACT_USER_OBJECTIVE_VERBATIM'),'Exact legacy user objective is missing from the Stage 01 application intake manifest.');assert(String(migratedIntake.inputSet||'').trim().length>0,'Legacy Stage 01 accepted input capture was not preserved.');assert((migratedIntake.stage4?.items||[]).some(item=>item.text===migratedIntake.objective),'Stage 04 obligation manifest does not preserve the migrated exact user objective.');assert((migratedIntake.archives||[]).some(a=>a?.operational===false&&JSON.stringify(a.payload||{}).includes(migratedIntake.objective)),'Original imported legacy payload was not preserved as non-operational audit evidence.');";
          const count=s.split(old).length-1;
          if(count!==1)throw new Error(`Expected one stale intent-ledger browser assertion, found ${count}`);
          s=s.replace(old,replacement);
          fs.writeFileSync(path,s);
          NODE
      - name: Remove accidental early-exit debris from full-cycle proof
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='verify-full-cycle.mjs';
          let s=fs.readFileSync(path,'utf8');
          const before=(s.match(/process\.exit\(0\);/g)||[]).length;
          if(before<1)throw new Error('Expected accidental process.exit(0) debris in full-cycle verifier.');
          s=s.replace(/\nprocess\.exit\(0\);\s*/g,'\n');
          if(/process\.exit\(0\);/.test(s))throw new Error('Full-cycle verifier still contains an early success exit.');
          fs.writeFileSync(path,s);
          NODE
      - name: Prove focused migration and syntax checks
        run: |
          node --check verify-browser.mjs
          node --check verify-full-cycle.mjs
          node verify-v3-migration.mjs
          node verify-prompt-semantics.mjs
          node verify-user-prompt-invariants.mjs
          node verify-full-cycle.mjs
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/repair-v3-browser-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify-browser.mjs verify-full-cycle.mjs .github/workflows/repair-v3-browser-migration.yml
          git commit -m "Prove migrated intent through v3 durable intake"
          git push origin HEAD:fix/closed-loop-v3-final-20260830
