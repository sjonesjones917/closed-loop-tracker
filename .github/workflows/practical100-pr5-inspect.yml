name: Practical 100 PR5 inspect
on:
  push:
    branches: [practical-100/pr5-indexeddb-ui]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-core.js').read_text()
          for term in ['function clarificationMarkup','answerHumanInput','function recordControlledChange','function filesView','function proposalMarkup','id="add-blocker"','id="add-context"','async function savePromptRecord','function wire','load();']:
            i=s.find(term);print('\n###',term,i);print(s[max(0,i-500):i+3000] if i>=0 else 'NOT FOUND')
          h=Path('index.html').read_text();print('\n### INDEX TAIL\n',h[-3500:])
          PY
