name: Practical 100 PR5 inspect
on:
  push:
    branches: [practical-100/pr5-indexeddb-ui]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-core.js').read_text()
          terms=['function canonicalSupportRecord','function addBlocker','function addFreshContext','function recordControlledChange','function render','async function load','save-job','save-human-stage','answer-human-input','accept-proposal','reject-proposal','request-correction','add-blocker','add-fresh-context','controlled-change','attach-files','release-audited','release-delivery']
          for term in terms:
            i=s.find(term)
            print('\n###',term,i)
            print(s[max(0,i-500):i+3500] if i>=0 else 'NOT FOUND')
          PY
