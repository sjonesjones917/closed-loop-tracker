name: PR1202 permanent repair promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'fix/external-response-reservation-transport-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact permanent repair
        run: |
          cat > /tmp/final.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/final.patch.gz.b64 | gzip -dc > /tmp/final.patch
          git apply --check /tmp/final.patch
          git apply /tmp/final.patch
          git diff --check
          node --check response-ingestion.js
          node --check verify-browser.mjs
          node --check verify-browser-extra.mjs
          node --check verify-reservation-contract.mjs
      - name: Existing reservation and ingestion regressions
        run: |
          set -euo pipefail
          node verify-reservation-contract.mjs
          node verify-ingestion.mjs
          node verify-file-first-operator.mjs
          node verify-response-contract-profile.mjs
          node verify-stage03-agent-protocol.mjs
      - name: Human stage walkthrough
        run: node verify-human-stage-walkthrough.mjs
      - name: Mobile stage action
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/pr1202-promote-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          node verify-mobile-stage-action.mjs
      - name: Browser core
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/pr1202-promote-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          node verify-browser.mjs
      - name: Browser extra
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/pr1202-promote-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          node verify-browser-extra.mjs
      - name: Commit permanent repair to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add response-ingestion.js verify-browser.mjs verify-browser-extra.mjs verify-reservation-contract.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Keep reservation live during returned-file repair'
          git push origin HEAD:${{ github.head_ref }}
