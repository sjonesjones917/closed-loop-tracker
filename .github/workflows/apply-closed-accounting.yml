name: Apply closed accounting implementation
on:
  push:
    branches: [controlling-spec-final-current]
    paths: ['.github/workflows/apply-closed-accounting.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: controlling-spec-final-current, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and verify
        run: |
          python3 .github/patch_closed_accounting.py
          node --check workbook.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node verify-stage01-stage03-stage04-closure.mjs
          node verify-v3-migration.mjs
          node verify-closed-accounting.mjs
      - name: Commit product implementation
        run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add workbook.js workflow-engine.js prompt-engine.js response-ingestion.js verify-closed-accounting.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Machine-enforce Stage 01 and Stage 04 closed accounting"
          git push origin HEAD:controlling-spec-final-current
