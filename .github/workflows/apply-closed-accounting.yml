name: Apply closed Stage 01 and Stage 04 accounting
on:
  push:
    branches:
      - fix/stage01-stage04-closed-accounting-current
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current-main accounting repair
        shell: bash
        run: |
          set -euo pipefail
          cp index.html /tmp/index-before.html
          git fetch origin pull/453/head:accounting-reference
          git show accounting-reference:finalize-v3-accounting.mjs >/tmp/accounting-reference.mjs
          node <<'NODE'
          const fs=require('fs');
          const fail=m=>{throw new Error(m)};
          const one=(text,pattern,replacement,label)=>{let count=0;const next=text.replace(pattern,(...args)=>{count++;return typeof replacement==='function'?replacement(...args):replacement;});if(count!==1)fail(`${label}: expected 1 replacement, got ${count}`);return next;};
          const ref=fs.readFileSync('/tmp/accounting-reference.mjs','utf8');
          const m=ref.match(/const accountingCode=String\.raw`([\s\S]*?)`;\n\n\/\/ workflow-schema\.js:/);if(!m)fail('Could not extract proven accounting helper implementation.');const accountingCode=m[1];

          // workflow-engine.js — application-owned intake and obligation accounting only.
          let engine=fs.readFileSync('workflow-engine.js','utf8');
          if(!engine.includes("const INTAKE_MANIFEST_SCHEMA='closed-loop-intake-manifest/1'"))engine=one(engine,/function executionHandoff\(/,accountingCode+'\nfunction executionHandoff(','insert accounting helpers');
          engine=one(engine,/case 1:\{\s*if\(!String\(project\.job\.EXACT_USER_OBJECTIVE_VERBATIM\|\|''\)\.trim\(\)\)reasons\.push\('Verbatim User Job Input is required\.'\);\s*requireAccepted\(\);/,`case 1:{\n      if(!String(project.job.EXACT_USER_OBJECTIVE_VERBATIM||'').trim())reasons.push('Verbatim User Job Input is required.');\n      requireAccepted();const intake=evaluateIntakeCoverage(project);if(!intake.complete)reasons.push(...intake.errors.map(reason=>'Stage 01 intake accounting: '+reason));`,'Stage 01 gate accounting');
          engine=one(engine,/case 4:\{\s*requireAccepted\(\);requireCount\('requirements',1\);/,`case 4:{\n      requireAccepted();requireCount('requirements',1);const accounting=evaluateObligationAccounting(project);if(!accounting.closed)reasons.push(...accounting.errors.map(reason=>'Stage 04 obligation accounting: '+reason));if(accounting.blocked.length)reasons.push('Stage 04 contains blocked obligation dispositions: '+accounting.blocked.map(item=>item.obligationId).join(', ')+'.');`,'Stage 04 gate accounting');
          const derive1="case 1:Object.assign(derived,{JOB_ID:project.job.JOB_ID,DATE_OPENED:project.job.DATE_OPENED,INPUT_SET_VERSION:project.job.CURRENT_INPUT_VERSION,INPUT_SET_HASH_OR_MANIFEST:project.job.INPUT_SET_HASH_OR_MANIFEST||'UNKNOWN',JOB_RECORD_STATUS:project.stages[1].status==='COMPLETE'?'READY':'NOT READY'});break;";
          const derive1New="case 1:{const intake=evaluateIntakeCoverage(project);Object.assign(derived,{JOB_ID:project.job.JOB_ID,DATE_OPENED:project.job.DATE_OPENED,INPUT_SET_VERSION:project.job.CURRENT_INPUT_VERSION,INPUT_SET_HASH_OR_MANIFEST:project.job.INPUT_SET_HASH_OR_MANIFEST||intake.manifest.manifestSha256,JOB_RECORD_STATUS:project.stages[1].status==='COMPLETE'?'READY':'NOT READY',INTAKE_COVERAGE_MANIFEST:intake.manifest,INTAKE_COVERAGE:intake.coverage,UNACCOUNTED_INPUT_UNITS:intake.missingUnitIds});break;}";
          if(!engine.includes(derive1))fail('Stage 01 derive anchor missing');engine=engine.replace(derive1,derive1New);
          const derive4="case 4:Object.assign(derived,{REQUIREMENTS_VERSION:project.job.CURRENT_REQUIREMENTS_VERSION||'NOT APPLICABLE',TOTAL_REQUIREMENTS:recordsForCurrentScope(project,'requirements').length,MANDATORY_REQUIREMENTS:metrics.mandatoryRequirementCount});break;";
          const derive4New="case 4:{const accounting=evaluateObligationAccounting(project);Object.assign(derived,{REQUIREMENTS_VERSION:project.job.CURRENT_REQUIREMENTS_VERSION||'NOT APPLICABLE',TOTAL_REQUIREMENTS:recordsForCurrentScope(project,'requirements').length,MANDATORY_REQUIREMENTS:metrics.mandatoryRequirementCount,OBLIGATION_MANIFEST:accounting.manifest,OBLIGATION_ACCOUNTING_COVERAGE:accounting.coverage,UNACCOUNTED_OBLIGATIONS:accounting.missingObligationIds,BLOCKED_OBLIGATIONS:accounting.blocked.map(item=>item.obligationId)});break;}";
          if(!engine.includes(derive4))fail('Stage 04 derive anchor missing');engine=engine.replace(derive4,derive4New);
          engine=one(engine,'currentScope,recordsForScope,recordsForCurrentScope,scopeForIteration,recordsForIteration,verificationMatrix,evaluateIteration,DERIVATIONS,coverageMetrics,convergenceMetrics,releaseMetrics,applicationTestCapabilities,capabilityAffirmativelyAvailable,testExecutionPlan,executionHandoff,','currentScope,recordsForScope,recordsForCurrentScope,scopeForIteration,recordsForIteration,verificationMatrix,evaluateIteration,DERIVATIONS,coverageMetrics,convergenceMetrics,releaseMetrics,intakeCoverageManifest,evaluateIntakeCoverage,obligationManifest,evaluateObligationAccounting,applicationTestCapabilities,capabilityAffirmativelyAvailable,testExecutionPlan,executionHandoff,','engine accounting exports');
          fs.writeFileSync('workflow-engine.js',engine);

          // prompt-engine.js — publish exact manifests and require complete mappings. No UI changes.
          let prompt=fs.readFileSync('prompt-engine.js','utf8');
          prompt=one(prompt,/const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine\/\d+';/,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/27';",'prompt engine version');
          const lines=prompt.split('\n');let i1=lines.findIndex(x=>x.startsWith("1:'")),i4=lines.findIndex(x=>x.startsWith("4:'"));if(i1<0||i4<0)fail('Stage procedure anchors missing');
          lines[i1]=`1:'Perform complete human-authority intake only. The application has enumerated every current controlled human-input unit in APPLICATION INTAKE MANIFEST. Account for every supplied unit exactly once and preserve every materially relevant fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue. INPUT_SET_CONTENTS must be one JSON string using schema closed-loop-intake-capture/1 with exact root keys schema, inputVersion, manifestSha256, units, and optional conversationStatements. units must contain exactly one entry for every manifest unit, with exact keys sourceUnitId, disposition, reason, extractedStatements. Allowed dispositions are INCORPORATED, RETAINED_CONTEXT, UNRESOLVED_HUMAN_ONLY, LATER_RESOLVABLE, INAPPLICABLE. extractedStatements entries use exact keys statementKey, text, statementClass. Allowed statement classes are FACT, FACT_AFFECTING_REQUIREMENTS, REQUIREMENT, CONSTRAINT, DECISION, PROHIBITION, REQUESTED_OUTPUT, ACCEPTANCE_CONDITION, MATERIAL_REFERENCE, UNRESOLVED_HUMAN_ONLY. Conversation answers obtained after this prompt belong in conversationStatements with exact keys statementKey, question, text, statementClass, status; status is ANSWERED, UNKNOWN, or DEFERRED. Ask genuinely human-only questions conversationally before final JSON. The accepted capture is the durable meaning-preserving handoff to every later stage: never ask the human to attach, resend, retype, or summarize project information already supplied and captured. Do not perform source research, requirement atomization, test design, production, filing, simulation, manufacturing, or product verification.',`;
          lines[i4]=`4:'Compile atomic requirement proposals only from APPLICATION OBLIGATION MANIFEST. That manifest is the complete application-generated input universe from current User Job Input, the accepted Stage 01 semantic capture, accepted Stage 01 job definition, and Stage 03 research. Do not rediscover an unspecified input universe and do not ask the human to attach, resend, retype, or summarize the original intent material again. For every obligationId, either map it to one or more proposed requirements by placing the exact obligationId in USER_INPUT_RELATIONSHIP, or provide exactly one evidence item with kind OBLIGATION_DISPOSITION and content equal to strict JSON containing only obligationId, disposition, and reason. Non-requirement dispositions are RETAINED_NONNORMATIVE_CONTEXT, INAPPLICABLE, or BLOCKED. An obligation cannot be both mapped and disposed. No obligation may disappear. Every proposed requirement must reference at least one obligation identity, remain independently testable where possible, preserve source identity/location where applicable, and define observable satisfaction, failure, evidence, applicability, dependencies, prohibitions, and severity. The application assigns requirement IDs, versions, hashes, scope, counts, and accounting coverage. If the application manifest is incomplete, return BLOCKED and identify the earlier-stage defect; do not request the same human material again.',`;
          prompt=lines.join('\n');
          prompt=one(prompt,`function contextFor(stage,state,operation,scope={}){\n const parts=[];`,`function contextFor(stage,state,operation,scope={}){\n const parts=[];\n if(stage===1)parts.push('APPLICATION INTAKE MANIFEST\\n'+show(workflow.intakeCoverageManifest(state)));\n if(stage===4)parts.push('APPLICATION OBLIGATION MANIFEST\\n'+show(workflow.obligationManifest(state)));`,'prompt accounting context');
          prompt=one(prompt,'contextManifest={stage,operation,scope,verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,readCollections:','contextManifest={stage,operation,scope,intakeCoverageManifest:stage===1?workflow.intakeCoverageManifest(state):null,obligationManifest:stage===4?workflow.obligationManifest(state):null,verificationBatchPlan:batchPlan,executionHandoff:promptHandoff,readCollections:','prompt identity accounting');
          fs.writeFileSync('prompt-engine.js',prompt);

          // response-ingestion.js — schema-valid but semantically incomplete intake/obligation output fails closed.
          let ingest=fs.readFileSync('response-ingestion.js','utf8');
          if(!ingest.includes('INCOMPLETE_INTAKE_ACCOUNTING')){
            const validation=`  if(envelope.responseType==='DATA_PROPOSAL'&&stageNumber===1){\n    const accounting=workflow.evaluateIntakeCoverage(project,envelope.stageData?.INPUT_SET_CONTENTS);\n    for(const message of accounting.errors)issues.push(issue('INCOMPLETE_INTAKE_ACCOUNTING','/stageData/INPUT_SET_CONTENTS',message));\n  }\n  if(envelope.responseType==='DATA_PROPOSAL'&&stageNumber===4){\n    const accounting=workflow.evaluateObligationAccounting(project,{requirements:safe(envelope.records?.requirements),evidence:safe(envelope.evidence)});\n    for(const message of accounting.errors)issues.push(issue('INCOMPLETE_OBLIGATION_ACCOUNTING','/records/requirements',message));\n  }\n`;
            ingest=one(ingest,'  const canonicalEnvelopeSha256=hash.canonicalEnvelopeSha256(envelope);',validation+'\n  const canonicalEnvelopeSha256=hash.canonicalEnvelopeSha256(envelope);','ingestion accounting validation');
          }
          fs.writeFileSync('response-ingestion.js',ingest);

          // verify-full-cycle.mjs — upgrade obsolete synthetic Stage 01/04 responses, without weakening production validation.
          let full=fs.readFileSync('verify-full-cycle.mjs','utf8');
          const oldS1="const s1=data(1,{stageData:{EXACT_DELIVERABLE_REQUESTED:'Verified deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:'Verbatim job input plus clarification.'}});";
          const newS1="const intakeManifest=engine.intakeCoverageManifest(p),intakeCapture={schema:'closed-loop-intake-capture/1',inputVersion:intakeManifest.inputVersion,manifestSha256:intakeManifest.manifestSha256,units:intakeManifest.units.map((unit,index)=>({sourceUnitId:unit.unitId,disposition:'INCORPORATED',reason:'',extractedStatements:[{statementKey:'full-cycle-'+(index+1),text:String(unit.label||unit.sourceLocation),statementClass:unit.label==='EXACT_USER_OBJECTIVE_VERBATIM'?'REQUESTED_OUTPUT':'FACT'}]})),conversationStatements:[]};const s1=data(1,{stageData:{EXACT_DELIVERABLE_REQUESTED:'Verified deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(intakeCapture)}});";
          if(!full.includes(oldS1))fail('Full-cycle Stage 01 fixture anchor missing');full=full.replace(oldS1,newS1);
          const oldS4="data(4,{records:{requirements:[recordProposal(schema,'requirements',{tempKey:'req',overrides:{OBLIGATION:'The deliverable must contain the required verified content.',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',USER_INPUT_RELATIONSHIP:'User Job Input',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'Required content is present.',INTENDED_VERIFICATION_METHOD:'DETERMINISTIC_AND_INDEPENDENT_CONTENT_REVIEW',EXPECTED_EVIDENCE:'Canonical verification evidence',FAILURE_CONDITION:'Required content absent',SEVERITY:'MAJOR'}})]}});";
          const newS4="const stage4Obligations=engine.obligationManifest(p).items,stage4Relationship=stage4Obligations.map(item=>item.obligationId).join(' ');data(4,{records:{requirements:[recordProposal(schema,'requirements',{tempKey:'req',overrides:{OBLIGATION:'The deliverable must satisfy every current application-enumerated obligation.',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',USER_INPUT_RELATIONSHIP:stage4Relationship,APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'Required content is present.',INTENDED_VERIFICATION_METHOD:'DETERMINISTIC_AND_INDEPENDENT_CONTENT_REVIEW',EXPECTED_EVIDENCE:'Canonical verification evidence',FAILURE_CONDITION:'Required content absent',SEVERITY:'MAJOR'}})]}});";
          if(!full.includes(oldS4))fail('Full-cycle Stage 04 fixture anchor missing');full=full.replace(oldS4,newS4);
          fs.writeFileSync('verify-full-cycle.mjs',full);

          // verify-ingestion.mjs — isolated Stage 01/04 contract fixtures must meet the new semantic contract.
          let vi=fs.readFileSync('verify-ingestion.mjs','utf8');
          const start=vi.indexOf('function validEnvelope(p,stage,promptRecord){'),end=vi.indexOf('function blockedEnvelope(',start);if(start<0||end<0)fail('validEnvelope fixture function anchors missing');
          const replacement=`function fixtureIntakeCapture(p){const manifest=engine.intakeCoverageManifest(p);return {schema:'closed-loop-intake-capture/1',inputVersion:manifest.inputVersion,manifestSha256:manifest.manifestSha256,units:manifest.units.map((unit,index)=>({sourceUnitId:unit.unitId,disposition:'INCORPORATED',reason:'',extractedStatements:[{statementKey:'ingestion-'+(index+1),text:String(unit.label||unit.sourceLocation),statementClass:unit.label==='EXACT_USER_OBJECTIVE_VERBATIM'?'REQUESTED_OUTPUT':'FACT'}]})),conversationStatements:[]};}\nfunction installStageOneCapture(p){const capture=fixtureIntakeCapture(p);p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'Verified deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(capture)};p.stages[1].acceptedData={...p.stages[1].agentData};return capture;}\nfunction validEnvelope(p,stage,promptRecord){\n  const contract=schema.STAGE_CONTRACTS[stage],operationContract=schema.operationContract(stage,promptRecord.operation),stageFields=operationContract?.allowedStageData||contract.allowedStageData,writableCollections=operationContract?.agentWritableCollections||contract.allowedCollections;\n  const stageData={},records={};\n  if(stage===1){const capture=fixtureIntakeCapture(p);Object.assign(stageData,{EXACT_DELIVERABLE_REQUESTED:'Verified deliverable',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(capture)});}\n  else if(stage===4){const obligations=engine.obligationManifest(p).items,collection='requirements',def=schema.RECORD_SCHEMAS[collection],fields={};for(const name of def.required)if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);fields.OBLIGATION='All enumerated fixture obligations are preserved.';fields.USER_INPUT_RELATIONSHIP=obligations.map(x=>x.obligationId).join(' ');fields.APPLICABILITY='APPLICABLE';records.requirements=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];}\n  else {if(stageFields.length)stageData[stageFields[0]]=safeValue(stageFields[0]);if(!Object.keys(stageData).length){const collection=writableCollections.find(name=>name!=='blockers'&&schema.recordAgentFields(name).length)||writableCollections.find(name=>schema.recordAgentFields(name).length);if(!collection)return null;const def=schema.RECORD_SCHEMAS[collection],fields={};for(const name of def.required)if(def.fieldDefinitions[name]?.producer===schema.PRODUCER.AGENT)fields[name]=safeValue(name);if(!Object.keys(fields).length){const agentField=schema.recordAgentFields(collection)[0];if(agentField)fields[agentField]=safeValue(agentField);}records[collection]=[{tempKey:'record-1',fields,relationships:{},evidenceRefs:['evidence-1']}];}}\n  return {schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage,operation:promptRecord.operation,promptIdentity:{instructionId:promptRecord.instructionId,bodySha256:promptRecord.bodySha256,contractSha256:promptRecord.contractSha256,contextSignature:promptRecord.contextSignature},scope:promptRecord.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData,records,evidence:[{temporaryKey:'evidence-1',kind:'WORKFLOW_EVIDENCE',description:'Controlled verification evidence',location:'verification fixture',content:\`stage-\${stage}-evidence\`}],unresolved:[],warnings:[],attachments:[]};\n}\n`;
          vi=vi.slice(0,start)+replacement+vi.slice(end);
          vi=vi.replace("  p.activeStage=stage;\n  const promptRecord=savePrompt(p,stage);","  p.activeStage=stage;\n  if(stage===4)installStageOneCapture(p);\n  const promptRecord=savePrompt(p,stage);");
          fs.writeFileSync('verify-ingestion.mjs',vi);

          // Focused permanent regression: omissions fail, complete accounting passes, and no Stage 04 reattachment is derived.
          fs.writeFileSync('verify-stage01-stage04-accounting.mjs',`import fs from 'node:fs';import vm from 'node:vm';import assert from 'node:assert/strict';\nglobalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);\nfor(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});\nconst core=globalThis.closedLoopCore,schema=globalThis.closedLoopWorkflowSchema,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine,ingestion=globalThis.closedLoopResponseIngestion;\nlet p=core.createBlankState('JOB-CLOSED-ACCOUNTING');Object.assign(p.job,{JOB_TITLE:'Closed accounting fixture',EXACT_USER_OBJECTIVE_VERBATIM:'Build a controlled product.',SUPPLIED_MATERIALS_INVENTORY:JSON.stringify([{type:'FILE',exactNameOrReference:'intent.pdf'}]),EXPLICIT_USER_REQUIREMENTS:'Never ask for project-relevant information twice.',CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'NOT APPLICABLE'});engine.ensureShape(p);engine.recalculate(p);\nconst manifest=engine.intakeCoverageManifest(p),captureFor=units=>({schema:'closed-loop-intake-capture/1',inputVersion:manifest.inputVersion,manifestSha256:manifest.manifestSha256,units:units.map((unit,index)=>({sourceUnitId:unit.unitId,disposition:'INCORPORATED',reason:'',extractedStatements:[{statementKey:'s-'+(index+1),text:unit.label==='intent.pdf'?'The supplied intent contains controlling human project authority.':String(unit.label||unit.sourceLocation),statementClass:unit.label==='EXACT_USER_OBJECTIVE_VERBATIM'?'REQUESTED_OUTPUT':unit.label==='EXPLICIT_USER_REQUIREMENTS'?'REQUIREMENT':unit.label==='intent.pdf'?'MATERIAL_REFERENCE':'FACT'}]})),conversationStatements:[]});\nconst prompt1=prompts.buildPromptRecord(1,p),env1=capture=>({schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage:1,operation:prompt1.operation,promptIdentity:{instructionId:prompt1.instructionId,bodySha256:prompt1.bodySha256,contractSha256:prompt1.contractSha256,contextSignature:prompt1.contextSignature},scope:prompt1.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{EXACT_DELIVERABLE_REQUESTED:'Controlled product',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(capture)},records:{},evidence:[{temporaryKey:'evidence-1',kind:'WORKFLOW_EVIDENCE',description:'fixture',location:'fixture',content:'fixture'}],unresolved:[],warnings:[],attachments:[]});\nlet x=ingestion.prepare(p,{stage:1,text:JSON.stringify(env1(captureFor(manifest.units.slice(1)))),promptRecord:prompt1});assert.equal(x.validation.valid,false);assert.ok(x.validation.issues.some(i=>i.code==='INCOMPLETE_INTAKE_ACCOUNTING'));x=ingestion.prepare(p,{stage:1,text:JSON.stringify(env1(captureFor(manifest.units))),promptRecord:prompt1});assert.equal(x.validation.valid,true,JSON.stringify(x.validation.issues));p=ingestion.commit(x.project,x.proposal.proposalId,{operator:'TEST'}).project;assert.equal(engine.evaluateIntakeCoverage(p).complete,true);\nconst prompt4=prompts.buildPromptRecord(4,p),obligations=engine.obligationManifest(p).items;assert.ok(prompt4.prompt.includes('APPLICATION OBLIGATION MANIFEST'));assert.ok(obligations.length>0);assert.equal(engine.executionHandoff(p,{stage:4,operation:'COMPLETE'}).send.length,0);assert.ok(!/FILES YOU MUST RECEIVE[\\s\\S]*intent\\.pdf/i.test(prompt4.prompt));\nconst req=(ids)=>({tempKey:'req-1',fields:{OBLIGATION:'All mapped obligations are preserved.',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',SOURCE_LOCATION:'APPLICATION OBLIGATION MANIFEST',SOURCE_AUTHORITY:'HUMAN_AND_CANONICAL_RESEARCH',USER_INPUT_RELATIONSHIP:ids.join(' '),APPLICABILITY:'APPLICABLE',DEPENDENCIES:'NONE',PROHIBITIONS:'NONE',DEFINED_TERMS:'NONE',OBSERVABLE_SATISFACTION_CONDITION:'All mapped obligations are satisfied.',INTENDED_VERIFICATION_METHOD:'INDEPENDENT_VERIFICATION',EXPECTED_EVIDENCE:'Current sufficient evidence',FAILURE_CONDITION:'A mapped obligation is not satisfied.',SEVERITY:'MAJOR',NOTES:''},relationships:{},evidenceRefs:['evidence-1']});const env4=ids=>({schema:schema.RESPONSE_SCHEMA,jobId:p.job.JOB_ID,stage:4,operation:prompt4.operation,promptIdentity:{instructionId:prompt4.instructionId,bodySha256:prompt4.bodySha256,contractSha256:prompt4.contractSha256,contextSignature:prompt4.contextSignature},scope:prompt4.scope,responseType:'DATA_PROPOSAL',humanInputRequests:[],stageData:{},records:{requirements:[req(ids)]},evidence:[{temporaryKey:'evidence-1',kind:'WORKFLOW_EVIDENCE',description:'fixture',location:'fixture',content:'fixture'}],unresolved:[],warnings:[],attachments:[]});\nlet ids=obligations.map(o=>o.obligationId);x=ingestion.prepare(p,{stage:4,text:JSON.stringify(env4(ids.slice(1))),promptRecord:prompt4});assert.equal(x.validation.valid,false);assert.ok(x.validation.issues.some(i=>i.code==='INCOMPLETE_OBLIGATION_ACCOUNTING'));x=ingestion.prepare(p,{stage:4,text:JSON.stringify(env4(ids)),promptRecord:prompt4});assert.equal(x.validation.valid,true,JSON.stringify(x.validation.issues));assert.equal(engine.evaluateObligationAccounting(p,{requirements:env4(ids).records.requirements,evidence:env4(ids).evidence}).closed,true);\nconst html=fs.readFileSync('index.html','utf8');assert.ok(html.includes('.prompt{height:clamp(260px,45vh,520px);max-height:80vh'));assert.ok(html.includes('.expandable-prompt{max-height:280px}'));console.log(JSON.stringify({stage01InputAccounting:1,stage04ObligationAccounting:1,repeatedIntentAttachmentRequired:false,visualBaselinePreserved:true},null,2));\n`);

          // CI: make the focused accounting regression permanent.
          let yml=fs.readFileSync('.github/workflows/pages.yml','utf8');
          if(!yml.includes('verify-stage01-stage04-accounting.mjs')){
            yml=yml.replace('          node --check verify-test-runtime.mjs\n','          node --check verify-test-runtime.mjs\n          node --check verify-stage01-stage04-accounting.mjs\n');
            yml=yml.replace('          node verify-complete.mjs\n','          node verify-complete.mjs\n          node verify-stage01-stage04-accounting.mjs\n');
            yml=yml.replace('node verify-ingestion.mjs && node verify-complete.mjs && node verify-full-cycle.mjs','node verify-ingestion.mjs && node verify-complete.mjs && node verify-stage01-stage04-accounting.mjs && node verify-full-cycle.mjs');
          }
          fs.writeFileSync('.github/workflows/pages.yml',yml);
          NODE

          # Runtime byte identity: cache token only; CSS and markup must remain unchanged.
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];const blob=file=>{const b=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')};const manifest=files.map(f=>`${f}:${blob(f)}\n`).join(''),token=`runtime-${crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;let html=fs.readFileSync('index.html','utf8'),n=0;html=html.replace(/(<script\s+defer\s+src="[^"?]+)\?v=[^"]+("\s*><\/script>)/g,(_,a,b)=>{n++;return `${a}?v=${token}${b}`});if(n!==files.length)throw new Error(`runtime token replacements ${n}`);fs.writeFileSync('index.html',html);console.log(token);
          NODE
          python3 <<'PY'
          from pathlib import Path
          import re
          a=Path('/tmp/index-before.html').read_text();b=Path('index.html').read_text();style=lambda s:re.search(r'<style>([\s\S]*?)</style>',s).group(1)
          if style(a)!=style(b): raise SystemExit('CSS changed')
          if re.sub(r'\?v=[^"\s]+','?v=TOKEN',a)!=re.sub(r'\?v=[^"\s]+','?v=TOKEN',b): raise SystemExit('index.html changed beyond cache token')
          PY

          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check verify-stage01-stage04-accounting.mjs
          node verify-stage01-stage04-accounting.mjs
          node verify-ingestion.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-complete.mjs
          node verify-hash.mjs
      - name: Commit permanent accounting repair and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-closed-accounting.yml
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
