name: PR6 fix full-cycle fixture
on:
  push:
    branches: [practical-100/pr6-completion]
permissions: {contents: write}
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct fixture and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-full-cycle.mjs');s=p.read_text()
          old="INSTRUCTION_TEXT:'Produce the authorized artifact and fail closed on uncertainty.'})],instructionTraces:"
          new="INSTRUCTION_TEXT:'Produce the authorized artifact and fail closed on uncertainty.'}))],instructionTraces:"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/pr6-fix-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix Stage 8 full-cycle fixture syntax'
          git push
