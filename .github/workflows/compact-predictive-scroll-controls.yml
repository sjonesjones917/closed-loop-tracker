name: Compact predictive scroll controls

on:
  push:
    branches:
      - fix/compact-predictive-scroll-controls-20260827

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-predictive-scroll-controls-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal compact predictive scroll-control correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.tmp-compact-predictive-scroll-controls.mjs')
          source=path.read_text()
          old="browser=replaceAllExpected(browser,nestedOpen,nestedCentered,2,'nested long-review openings');"
          new="browser=replaceAllExpected(browser,nestedOpen,nestedCentered,1,'nested long-review opening');"
          if source.count(old)!=1:
              raise SystemExit(f'Expected one nested-opening count guard; found {source.count(old)}.')
          source=source.replace(old,new)
          lines=source.splitlines()
          targets=[line for line in lines if "'generic-section navigation sequence'" in line]
          if len(targets)!=1:
              raise SystemExit(f'Expected one generic-section sequence generator; found {len(targets)}.')
          source=source.replace(targets[0],"// Generic-section navigation sequence is patched below with bounded markers.")
          path.write_text(source)
          PY
          node --check .tmp-compact-predictive-scroll-controls.mjs
          node .tmp-compact-predictive-scroll-controls.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('verify-browser.mjs')
          source=path.read_text()
          old="await click(cdp,'#proposal-heading>details.record-card:nth-of-type(2)>summary');await click(cdp,'#proposal-heading>details.record-card:nth-of-type(2) details.record-card>summary');await waitExpr(cdp,"
          new="await click(cdp,'#proposal-heading>details.record-card:nth-of-type(2)>summary');await click(cdp,'#proposal-heading>details.record-card:nth-of-type(2) details.record-card>summary');await positionNode(cdp,'#proposal-heading>details.record-card:nth-of-type(2) details.record-card','center');await waitExpr(cdp,"
          if source.count(old)!=1:
              raise SystemExit(f'Expected one initial nested review opening; found {source.count(old)}.')
          source=source.replace(old,new)
          start="await click(cdp,'#section-bottom-jump');await waitExpr(cdp,`"
          top="await click(cdp,'#section-top-jump');"
          end="`,8000);"
          start_index=source.find(start)
          top_index=source.find(top,start_index+1) if start_index>=0 else -1
          end_index=source.find(end,top_index+1) if top_index>=0 else -1
          if min(start_index,top_index,end_index)<0:
              raise SystemExit('Could not isolate the existing generic-section navigation sequence.')
          end_index+=len(end)
          replacement="await click(cdp,'#section-top-jump');await waitExpr(cdp,`(()=>{const summary=document.querySelector('#provenance-long-section > summary'),r=summary?.getBoundingClientRect();return Boolean(r&&r.bottom>0&&r.top<innerHeight);})()`,8000);await positionNode(cdp,'#provenance-long-section','center');await waitExpr(cdp,`(()=>{const t=document.querySelector('#section-top-jump'),b=document.querySelector('#section-bottom-jump');return Boolean(t&&!t.hidden&&b&&!b.hidden);})()`);await click(cdp,'#section-bottom-jump');await waitExpr(cdp,`(()=>{const r=document.querySelector('#provenance-long-section')?.getBoundingClientRect();return Boolean(r&&r.bottom>0&&r.bottom<=innerHeight+2);})()`,8000);await positionNode(cdp,'#provenance-long-section','sliver');await waitExpr(cdp,`(()=>{const t=document.querySelector('#section-top-jump'),b=document.querySelector('#section-bottom-jump');return Boolean(t?.hidden&&b?.hidden);})()`);"
          source=source[:start_index]+replacement+source[end_index:]
          path.write_text(source)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          runtime_files=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js']
          manifest=''
          for filename in runtime_files:
              data=Path(filename).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              manifest+=f'{filename}:{blob}\n'
          token='runtime-'+hashlib.sha256(manifest.encode()).hexdigest()[:16]
          path=Path('index.html')
          source=path.read_text()
          old='runtime-compact-scroll-8f2c6d1a4b7e'
          if source.count(old)!=8:
              raise SystemExit(f'Expected eight provisional runtime tokens; found {source.count(old)}.')
          path.write_text(source.replace(old,token))
          print(token)
          PY
          node --check hash.js
          node --check verify-browser.mjs
      - name: Verify complete application and scroll-control behavior
        run: |
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
      - name: Commit only the verified minimal correction
        run: |
          rm .tmp-compact-predictive-scroll-controls.mjs .github/workflows/compact-predictive-scroll-controls.yml
          git config user.name "sjonesjones917"
          git config user.email "sjones.jones917@gmail.com"
          git add hash.js verify-browser.mjs index.html .tmp-compact-predictive-scroll-controls.mjs .github/workflows/compact-predictive-scroll-controls.yml
          git commit -m "Tighten contextual scroll controls"
          git push origin HEAD:fix/compact-predictive-scroll-controls-20260827
