name: final-v3-proof
on:
  push:
    branches: ['fix/final-zero-loss-v3-20260830']
    paths: ['.github/workflows/final-v3-proof.yml']
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-zero-loss-v3-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair candidate in runner and verify invariant preconditions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js'); t=p.read_text()
          bad="'history','newJobResets','reviews','recoveredProjects','responseDispositions','executionFailures,'intakeArtifactSnapshots'"
          good="'history','newJobResets','reviews','recoveredProjects','responseDispositions','executionFailures','intakeArtifactSnapshots'"
          if bad in t: t=t.replace(bad,good,1)
          if good not in t: raise SystemExit('Stage 1 infrastructure collection partition is not valid')
          p.write_text(t)
          PY
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,hashlib
          candidate=Path('index.html').read_text(); main=subprocess.check_output(['git','show','origin/main:index.html'],text=True)
          cs=re.search(r'<style>(.*?)</style>',candidate,re.S); ms=re.search(r'<style>(.*?)</style>',main,re.S)
          if not cs or not ms: raise SystemExit('style baseline missing')
          if hashlib.sha256(cs.group(1).encode()).hexdigest()!=hashlib.sha256(ms.group(1).encode()).hexdigest(): raise SystemExit('VISUAL REGRESSION: CSS differs from current main')
          if '.expandable-prompt{max-height:280px}' not in candidate: raise SystemExit('prompt preview size changed')
          PY
          node - <<'NODE'
          const fs=require('fs'),p=fs.readFileSync('prompt-engine.js','utf8'),e=fs.readFileSync('workflow-engine.js','utf8'),a=fs.readFileSync('app-core.js','utf8');const q=(v,m)=>{if(!v)throw Error(m)};
          q(p.includes('Stage 01 is COMPLETE HUMAN-AUTHORITY INTAKE')&&p.includes('account for EVERY INPUT UNIT ID'),'Stage 01 exhaustive intake/accounting missing');
          q(p.includes('Exhaustively research every current accepted Stage 02 independent external source')&&p.includes('Do not mark Stage 03 complete until all current sources have coverage'),'Stage 03 exhaustive research missing');
          q(p.includes('Compile the requirement specification ONLY from the complete APPLICATION OBLIGATION MANIFEST')&&p.includes('NEVER ask the human to reattach, resend, retype, restate, reconstruct, or summarize'),'Stage 04 closed union/single-supply missing');
          q(p.indexOf('YOUR TASK — DO THIS NOW')<p.indexOf('JOB CONTROL'),'task not before project data');
          q(e.includes("'executionFailures','intakeArtifactSnapshots'"),'snapshot infrastructure bug remains');
          q(a.includes("function artifactControlMarkup(n,locked){if(n===4)return '';"),'Stage 4 upload control remains');
          console.log('preconditions: PASS');
          NODE
      - name: Run every deterministic proof and capture first failure
        id: suite
        shell: bash
        run: |
          set +e
          : > final-proof.log
          run(){ echo "=== $* ===" | tee -a final-proof.log; "$@" >> final-proof.log 2>&1; rc=$?; if [ $rc -ne 0 ]; then echo "FAILED rc=$rc: $*" | tee -a final-proof.log; exit $rc; fi; }
          for f in *.js *.mjs; do run node --check "$f" || exit $?; done
          run node build-test-project.mjs || exit $?
          for t in verify.mjs verify-v3-migration.mjs verify-v3-contract.mjs verify-test-runtime-v3.mjs verify-test-runtime-limits.mjs verify-test-runtime.mjs verify-hash.mjs verify-ingestion.mjs verify-complete.mjs verify-full-cycle.mjs verify-prompt-semantics.mjs verify-single-supply-prompts.mjs verify-semantic-invariant.mjs verify-definition-of-done.mjs verify-v3-definition-of-done.mjs verify-project-lifecycle.mjs; do run node "$t" || exit $?; done
          echo 'ALL DETERMINISTIC PROOFS PASSED' | tee -a final-proof.log
      - name: Persist diagnostic on failure
        if: failure() && steps.suite.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          git add final-proof.log
          git commit -m 'Record isolated conformance failure diagnostic'
          git push origin HEAD:fix/final-zero-loss-v3-20260830
      - name: Commit proven source repair
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          rm -f final-proof.log
          git add workflow-engine.js
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'Fix durable Stage 1 intent snapshot initialization'; git push origin HEAD:fix/final-zero-loss-v3-20260830; fi
