          'stage19 base task')

          # Add exact sub-operation instructions for the two composite stages.
          p=Path('prompt-engine.js'); s=p.read_text()
          anchor="};\nconst recordId=(record,collection)=>"
          if anchor not in s: raise SystemExit('operation task insertion anchor not found')
