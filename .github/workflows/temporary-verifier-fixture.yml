name: Temporary verifier fixture applicator
on:
  push:
    branches: [fix/restore-zero-loss-proof-20260831]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-zero-loss-proof-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make ingestion fixtures honor prompt prerequisites
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='verify-ingestion.mjs';
          let text=fs.readFileSync(path,'utf8');
          const from="function savePrompt(p,stage){\n  if(stage===4)prepareStage4Upstream(p);\n  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};";
          const to="function savePrompt(p,stage){\n  if(stage===4)prepareStage4Upstream(p);\n  else if(stage>1){p.stages[stage-1].status='COMPLETE';p.stages[stage-1].gate={complete:true,blocked:false,reasons:[]};}\n  const options=stage===19?{operation:'COMPARE'}:stage===11?{scope:{runId:'RUN-INGESTION-FIXTURE',contextId:'CONTEXT-INGESTION-FIXTURE'}}:{};";
          const count=text.split(from).length-1;
          if(count!==1)throw new Error(`Expected exactly one savePrompt fixture target; found ${count}.`);
          text=text.replace(from,to);
          fs.writeFileSync(path,text);
          NODE
          node --check verify-ingestion.mjs
          node verify-ingestion.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-ingestion.mjs
          git commit -m "Make ingestion fixtures honor stage prerequisites"
          git push origin HEAD:fix/restore-zero-loss-proof-20260831
