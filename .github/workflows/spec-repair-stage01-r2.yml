name: One-time Stage 01 closed-disposition repair
on:
  push:
    branches:
      - "repair/stage01-closed-dispositions-r2"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "repair/stage01-closed-dispositions-r2"
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Apply owner-file repair and remove one-time scaffolding
        run: |
          set -euo pipefail
          python3 .repair-stage01-r2.py
          rm .repair-stage01-r2.py .github/workflows/spec-repair-stage01-r2.yml
      - name: Prove Stage 01 contract and existing source suite
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check prompt-engine.js
          node verify-stage01-disposition-contract.mjs
          node build-test-project.mjs
          node verify.mjs
      - name: Commit proven repair
        run: |
          set -euo pipefail
          git config user.name "closed-loop-repair-bot"
          git config user.email "closed-loop-repair-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close Stage 01 raw-unit disposition contract"
          git push origin HEAD:repair/stage01-closed-dispositions-r2
