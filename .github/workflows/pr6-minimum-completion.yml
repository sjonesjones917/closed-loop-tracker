name: PR6 minimum completion
on:
  push:
    branches: [practical-100/pr6-completion]
permissions:
  contents: write
jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimum proven repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('workflow-engine.js')
          s=p.read_text()
          old="if(matrix.expected.length===0||matrix.missing.length||matrix.duplicates.length||matrix.invalid.length)reasons.push('The current REQ × RUN × TEST matrix is incomplete or invalid.');"
          new="if(mode!=='INITIAL'&&(matrix.expected.length===0||matrix.missing.length||matrix.duplicates.length||matrix.invalid.length))reasons.push('The current REQ × RUN × TEST matrix is incomplete or invalid.');"
          if old in s:s=s.replace(old,new,1)
          insert="""
          const APPLICATION_INITIAL_FIELDS=Object.freeze({
            requirements:Object.freeze({STATUS:'ACTIVE'}),candidateRequirements:Object.freeze({STATUS:'ACTIVE'}),requirementResolutions:Object.freeze({STATUS:'RESOLVED'}),tests:Object.freeze({STATUS:'READY'}),instructions:Object.freeze({STATUS:'CURRENT'}),instructionTraces:Object.freeze({STATUS:'COMPLETE'}),preflightRecords:Object.freeze({STATUS:'COMPLETE'}),iterations:Object.freeze({STATUS:'FROZEN'}),candidateFreezes:Object.freeze({STATUS:'FROZEN'}),defects:Object.freeze({STATUS:'CONFIRMED'}),regressions:Object.freeze({ACTIVE_RETIRED_STATE:'ACTIVE'}),baselines:Object.freeze({STATUS:'FROZEN'}),products:Object.freeze({STATUS:'RESERVED'}),blockers:Object.freeze({STATUS:'OPEN'}),evidenceRecords:Object.freeze({STATUS:'PRESERVED'})
          });
          function applicationInitialFields(collection){return clone(APPLICATION_INITIAL_FIELDS[collection]||{});}
          """
          anchor="function addHistory(project,type,details={}){"
          if 'function applicationInitialFields(collection)' not in s:
            assert anchor in s;s=s.replace(anchor,insert+'\n'+anchor,1)
          export_old="  currentScope,recordsForCurrentScope,verificationMatrix,evaluateIteration,DERIVATIONS,coverageMetrics,convergenceMetrics,releaseMetrics,gate,deriveStageData,recalculate,invalidateDownstream,"
          export_new="  currentScope,recordsForCurrentScope,verificationMatrix,evaluateIteration,DERIVATIONS,coverageMetrics,convergenceMetrics,releaseMetrics,gate,deriveStageData,recalculate,invalidateDownstream,applicationInitialFields,"
          if export_old in s:s=s.replace(export_old,export_new,1)
          p.write_text(s)

          p=Path('response-ingestion.js');s=p.read_text()
          old="""      if(reference.tempKey){
                const target=responseRecordIndex.get(String(reference.tempKey));
                if(!target)issues.push(issue('UNRESOLVED_RELATIONSHIP',`${path}/relationships/${pointerEscape(name)}`,`Temporary relationship ${reference.tempKey} does not exist.`));
                else if(target.collection!==expectedCollection)issues.push(issue('WRONG_RELATIONSHIP_TYPE',`${path}/relationships/${pointerEscape(name)}`,`${name} must refer to ${expectedCollection}, not ${target.collection}.`));
              }else if(reference.recordId){"""
          new="""      if(reference.tempKey){
                const target=responseRecordIndex.get(String(reference.tempKey));
                const evidenceTarget=expectedCollection==='evidenceRecords'?evidenceIndex.get(String(reference.tempKey)):null;
                if(!target&&!evidenceTarget)issues.push(issue('UNRESOLVED_RELATIONSHIP',`${path}/relationships/${pointerEscape(name)}`,`Temporary relationship ${reference.tempKey} does not exist.`));
                else if(target&&target.collection!==expectedCollection)issues.push(issue('WRONG_RELATIONSHIP_TYPE',`${path}/relationships/${pointerEscape(name)}`,`${name} must refer to ${expectedCollection}, not ${target.collection}.`));
              }else if(reference.recordId){"""
          if old in s:s=s.replace(old,new,1)
          old="""      const fields=clone(proposed.fields||{});
                fields[definition.idField]=id;"""
          new="""      const fields={...workflow.applicationInitialFields(collection),...clone(proposed.fields||{})};
                fields[definition.idField]=id;"""
          if old in s:s=s.replace(old,new,1)
          old="""for(const [collection,list] of Object.entries(canonicalRecords))list.forEach((record,index)=>{const proposed=safe(envelope.records?.[collection])[index];const def=schema.RECORD_SCHEMAS[collection];changes.push({origin:record.updateTargetId?'APPLICATION_RELATIONSHIP_RESOLUTION':'APPLICATION_ID_ALLOCATION',jsonPointer:null,rawValueHash:null,normalizerUsed:null,canonicalCollection:collection,canonicalRecordType:collection,canonicalRecordId:record.id,canonicalField:def.idField,relationshipTargetId:null,evidenceIds:record.evidenceRefs||[],normalizedValue:record.id,temporaryResponseKey:record.temporaryKey});for(const [name,value] of Object.entries(proposed?.fields||{}))changes.push"""
          new="""for(const [collection,list] of Object.entries(canonicalRecords))list.forEach((record,index)=>{const proposed=safe(envelope.records?.[collection])[index];const def=schema.RECORD_SCHEMAS[collection];changes.push({origin:record.updateTargetId?'APPLICATION_RELATIONSHIP_RESOLUTION':'APPLICATION_ID_ALLOCATION',jsonPointer:null,rawValueHash:null,normalizerUsed:null,canonicalCollection:collection,canonicalRecordType:collection,canonicalRecordId:record.id,canonicalField:def.idField,relationshipTargetId:null,evidenceIds:record.evidenceRefs||[],normalizedValue:record.id,temporaryResponseKey:record.temporaryKey});for(const [name,value] of Object.entries(workflow.applicationInitialFields(collection)))if(!Object.prototype.hasOwnProperty.call(proposed?.fields||{},name))changes.push({origin:'APPLICATION_DERIVATION',jsonPointer:null,rawValueHash:null,normalizerUsed:null,canonicalCollection:collection,canonicalRecordType:collection,canonicalRecordId:record.id,canonicalField:name,relationshipTargetId:null,evidenceIds:record.evidenceRefs||[],normalizedValue:clone(value),temporaryResponseKey:record.temporaryKey,derivationKey:`${collection}.initial.${name}`});for(const [name,value] of Object.entries(proposed?.fields||{}))changes.push"""
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('prompt-engine.js');s=p.read_text()
          if "DESIRED OR SUGGESTED SOURCE COUNT" not in s:
            s=s.replace("2:'Build the external governing source inventory for this current job only.","2:'Build the external governing source inventory for this current job only. Treat any DESIRED OR SUGGESTED SOURCE COUNT as a search target, never as authority to invent sources. Prefer primary, official, controlling sources when applicable. If no legitimate external authority applies after evidence-supported inspection, return an explicit no-applicable-source determination rather than inventing a source.",1)
          s=s.replace("3:'Research only the legitimate Stage 02 external governing source set, source-by-source and pass-by-pass.","3:'Research only the legitimate Stage 02 external governing source set; research only the current accepted Stage 02 external governing source set, source-by-source and pass-by-pass.",1)
          rule="- If required authority, evidence, capability, or decision rule is unavailable, return BLOCKED or HUMAN_INPUT_REQUIRED as applicable rather than inventing data."
          extra="\n- If execution itself is unavailable, return EXECUTION_FAILED; do not represent unexecuted work as completed.\n- A rejected response or rejected data is not canonical and must not be reused as accepted project truth.\n- When the environment cannot perform a requested implementation or execution, provide an implementation-ready specification rather than pretending implementation occurred."
          if 'rejected data is not canonical' not in s:
            assert rule in s;s=s.replace(rule,rule+extra,1)
          p.write_text(s)

          p=Path('verify-complete.mjs');s=p.read_text()
          if 'JOB-STAGE11-BOUNDARY' not in s:
            anchor='// Current-scope selection excludes historical scoped records.'
            block="""// Stage 11 initial execution completion does not depend on Stage 12 verification triples.
          {
            const p=project('JOB-STAGE11-BOUNDARY');
            p.job.CURRENT_ITERATION='ITERATION-STAGE11';p.stages[10].status='COMPLETE';
            p.projectData.iterations.push(record('iterations',10,{CANDIDATE_ID:'CANDIDATE-STAGE11',STATUS:'FROZEN'},'ITERATION-STAGE11'));
            p.projectData.candidateFreezes.push(record('candidateFreezes',10,{ITERATION_ID:'ITERATION-STAGE11',STATUS:'FROZEN'},'CANDIDATE-STAGE11'));
            p.projectData.acceptedChanges.push({changeId:'CHANGE-STAGE11',stage:11,status:'COMMITTED',responseType:'DATA_PROPOSAL'});
            for(let i=0;i<10;i++){
              const run=record('runs',11,{ITERATION_ID:'ITERATION-STAGE11',CANDIDATE_ID:'CANDIDATE-STAGE11',CONTEXT_ID:`CONTEXT-STAGE11-${i}`,CONTAMINATION_CHECK:'NONE',COMPLETE_OUTPUT:`output-${i}`},`RUN-STAGE11-${i}`);
              run.scope={iterationId:'ITERATION-STAGE11',candidateId:'CANDIDATE-STAGE11'};p.projectData.runs.push(run);
              p.projectData.rawResponses.push({rawResponseId:`RAW-STAGE11-${i}`,stage:11});p.projectData.outputReceipts.push({receiptId:`RECEIPT-STAGE11-${i}`,stage:11});
            }
            const stage11=engine.gate(11,p);assert(stage11.complete,`Stage 11 incorrectly depends on Stage 12 verification data: ${stage11.reasons.join('; ')}`);
            const stage12=engine.gate(12,p);assert(!stage12.complete&&stage12.reasons.some(r=>/REQ × RUN × TEST|coverage/i.test(r)),'Stage 12 completed without verification triples.');
          }

          """
            assert anchor in s;s=s.replace(anchor,block+anchor,1)
          p.write_text(s)
          PY
          for f in *.js *.mjs; do node --check "$f"; done
      - name: Deterministic acceptance
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Browser acceptance diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          timeout 90s node verify-browser.mjs 2>&1 | tee /tmp/browser.log
          primary=${PIPESTATUS[0]}
          timeout 90s node verify-browser-extra.mjs 2>&1 | tee /tmp/browser-extra.log
          extra=${PIPESTATUS[0]}
          printf 'primary=%s\nextra=%s\n' "$primary" "$extra" | tee /tmp/browser-status.txt
          exit $(( primary || extra ))
      - name: Commit deterministic repairs and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr6-source-snapshot.yml .github/workflows/pr6-minimum-completion.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'PR 6: close Stage 8 and Stage 11 acceptance boundaries'
          git push origin HEAD:practical-100/pr6-completion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr6-minimum-completion-diagnostics
          path: |
            /tmp/http.log
            /tmp/browser.log
            /tmp/browser-extra.log
            /tmp/browser-status.txt
          if-no-files-found: warn
          retention-days: 2
