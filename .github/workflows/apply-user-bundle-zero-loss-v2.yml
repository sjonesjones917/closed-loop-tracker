name: Apply exhaustive intake repair
# proof revision 13
on:
  push:
    branches:
      - repair/user-bundle-zero-loss-20260830
    paths:
      - .github/workflows/apply-user-bundle-zero-loss-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/user-bundle-zero-loss-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Overlay v3 behavioral implementation
        run: |
          git fetch origin repair/controlling-v3-zero-loss:refs/remotes/origin/repair/controlling-v3-zero-loss
          for f in workbook.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js build-test-project.mjs verify-browser.mjs verify-complete.mjs verify-definition-of-done.mjs verify-full-cycle.mjs verify-hash.mjs verify-ingestion.mjs verify-project-lifecycle.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs verify-test-runtime.mjs verify.mjs verify-intake-obligation-accounting.mjs verify-test-runtime-limits.mjs verify-test-runtime-v3.mjs verify-v3-contract.mjs verify-v3-definition-of-done.mjs verify-v3-migration.mjs; do git show "origin/repair/controlling-v3-zero-loss:$f" > "$f"; done
      - name: Apply controlling corrections
        run: |
          python3 tools/rewrite-patcher-structural.py
          python3 tools/apply-exhaustive-intake-patch.py
          python3 tools/fix-canonical-intake-evaluator.py
          python3 tools/fix-stage1-input-version-authority.py
          python3 tools/align-accounting-contract.py
          python3 tools/remove-repeat-intent-language.py
          node tools/finalize-runtime.mjs
      - name: Syntax
        run: |
          for f in workbook.js hash.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js verify-user-bundle-conformance.mjs; do node --check "$f"; done
      - name: Exhaustive Stage 1 and Stage 4 proof
        run: node verify-user-bundle-conformance.mjs
      - name: V3 and accounting proofs
        run: |
          node verify-v3-contract.mjs
          node verify-v3-migration.mjs
          node verify-intake-obligation-accounting.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
      - name: Existing regression proofs
        run: |
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          node verify-one-time-intent-intake.mjs
      - name: Commit proven implementation
        run: |
          git config user.name closed-loop-user-bundle-repair
          git config user.email closed-loop-user-bundle-repair@users.noreply.github.com
          git rm .github/workflows/apply-user-bundle-zero-loss.yml .github/workflows/apply-user-bundle-zero-loss-v2.yml tools/apply-exhaustive-intake-patch.py tools/rewrite-patcher-structural.py tools/fix-canonical-intake-evaluator.py tools/fix-stage1-input-version-authority.py tools/align-accounting-contract.py tools/remove-repeat-intent-language.py tools/finalize-runtime.mjs
          git add -A
          git commit -m 'Enforce exhaustive Stage 1 and Stage 3 input to Stage 4'
          git push origin HEAD:repair/user-bundle-zero-loss-20260830
