          new1="Perform complete human-authority intake only. The application has enumerated every current controlled human-input unit in APPLICATION INTAKE MANIFEST. Inspect every controlled unit and extract EVERY semantically distinct project-relevant fact, requirement, constraint, decision, prohibition, requested output, acceptance condition, material reference, and unresolved human-only issue. Preserve distinctions exactly: do not summarize away, merge, generalize, compress, paraphrase into loss, or omit separate meanings merely because they appear in one long user statement or artifact. Classify every supplied unit exactly once and preserve every distinct project-relevant meaning it contains."
