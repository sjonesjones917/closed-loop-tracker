name: Apply user controlling bundle zero-loss v2

on:
  push:
    branches: [repair/user-bundle-zero-loss-20260830]
    paths: [.github/workflows/apply-user-bundle-zero-loss-v2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/user-bundle-zero-loss-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Overlay closest v3 implementation
        shell: bash
        run: |
          git fetch origin repair/controlling-v3-zero-loss:refs/remotes/origin/repair/controlling-v3-zero-loss
          files=(
            workbook.js workflow-schema.js test-runtime.js test-worker.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js app-core.js
            build-test-project.mjs verify-browser.mjs verify-complete.mjs verify-definition-of-done.mjs verify-full-cycle.mjs verify-hash.mjs verify-ingestion.mjs verify-project-lifecycle.mjs verify-prompt-semantics.mjs verify-semantic-invariant.mjs verify-test-runtime.mjs verify.mjs
            verify-intake-obligation-accounting.mjs verify-test-runtime-limits.mjs verify-test-runtime-v3.mjs verify-v3-contract.mjs verify-v3-definition-of-done.mjs verify-v3-migration.mjs
          )
          for f in "${files[@]}"; do git show "origin/repair/controlling-v3-zero-loss:$f" > "$f"; done
      - name: Implement exhaustive intake and Stage 4 prerequisite closure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          marker="const SCOPE_KEYS=Object.freeze(['inputVersion'"
          if marker not in s: raise SystemExit('workflow-engine insertion marker missing')
          helpers=r'''
function currentHumanInputRecord(project){
  ensureShape(project);
  const version=String(project.job.CURRENT_INPUT_VERSION||'').trim();
  const rows=safe(project.projectData.inputVersions);
  return rows.slice().reverse().find(row=>String(row.version||'')===version)||rows.at(-1)||null;
}
function intakeCoverageManifest(project){
  ensureShape(project);
  const row=currentHumanInputRecord(project),inputVersion=String(project.job.CURRENT_INPUT_VERSION||row?.version||'').trim();
  const payload=clone(row?.payload||project.projectData.userEntered||{}),units=[];
  const definitions=schema.JOB_FIELDS||{};
  const humanNames=Object.entries(definitions).filter(([,d])=>['HUMAN','HUMAN_DECISION'].includes(d?.producer)).map(([name])=>name);
  const add=(sourceLocation,fieldName,rawValue,kind='HUMAN_FIELD')=>{
    if(rawValue===undefined||rawValue===null)return;
    if(typeof rawValue==='string'&&!rawValue.trim())return;
    if(Array.isArray(rawValue)&&!rawValue.length)return;
    const canonical=typeof rawValue==='string'?rawValue:JSON.stringify(rawValue);
    const rawValueSha256=hash.sha256Value(rawValue);
    const sourceUnitId='INPUT-'+hash.sha256Value({inputVersion,sourceLocation,rawValueSha256}).slice(0,24).toUpperCase();
    units.push({sourceUnitId,sourceLocation,fieldName,kind,rawValue:clone(rawValue),text:canonical,rawValueSha256});
  };
  for(const name of humanNames)add(`/inputVersions/${row?.inputVersionId||inputVersion||'CURRENT'}/payload/${name}`,name,Object.prototype.hasOwnProperty.call(payload,name)?payload[name]:project.job[name]);
  for(const [i,item] of safe(payload.clarifications).entries())add(`/inputVersions/${row?.inputVersionId||inputVersion||'CURRENT'}/payload/clarifications/${i}`,'clarification',item,'HUMAN_CLARIFICATION');
  const identity={schema:'closed-loop-intake-manifest/1',inputVersion,units:units.map(({sourceUnitId,sourceLocation,fieldName,kind,rawValueSha256})=>({sourceUnitId,sourceLocation,fieldName,kind,rawValueSha256}))};
  return {...identity,units,manifestSha256:hash.sha256Value(identity)};
}
function parseIntakeCapture(value){if(value&&typeof value==='object'&&!Array.isArray(value))return value;try{return JSON.parse(String(value||''));}catch{return null;}}
function evaluateIntakeCoverage(project,inputSetContents){
  const manifest=intakeCoverageManifest(project),capture=parseIntakeCapture(inputSetContents),errors=[];
  if(!capture||typeof capture!=='object'||Array.isArray(capture))return {complete:false,coverage:0,total:manifest.units.length,accounted:0,errors:['INPUT_SET_CONTENTS must be valid closed-loop-intake-capture/1 JSON.'],manifest};
  if(capture.schema!=='closed-loop-intake-capture/1')errors.push('Intake capture schema must be closed-loop-intake-capture/1.');
  if(String(capture.inputVersion||'')!==String(manifest.inputVersion||''))errors.push('Intake capture inputVersion does not match the current User Job Input version.');
  if(String(capture.manifestSha256||'')!==String(manifest.manifestSha256||''))errors.push('Intake capture manifestSha256 does not match the current application intake manifest.');
  const allowed=new Set(['INCORPORATED','RETAINED_CONTEXT','UNRESOLVED_HUMAN_ONLY','LATER_RESOLVABLE','INAPPLICABLE']),ids=new Set(manifest.units.map(u=>u.sourceUnitId)),seen=new Set(),accounted=new Set();
  const units=safe(capture.units);
  for(const [i,u] of units.entries()){
    const id=String(u?.sourceUnitId||'');
    if(!ids.has(id)){errors.push(`Unknown intake sourceUnitId ${id||'(missing)'} at units[${i}].`);continue;}
    if(seen.has(id)){errors.push(`Duplicate intake accounting for ${id}.`);continue;}seen.add(id);
    const disposition=upper(u?.disposition);if(!allowed.has(disposition)){errors.push(`Invalid intake disposition for ${id}.`);continue;}
    const statements=safe(u?.extractedStatements);
    if(disposition!=='INAPPLICABLE'&&!statements.length)errors.push(`${id} has no extractedStatements; every semantically distinct project-relevant meaning must be preserved.`);
    const statementKeys=new Set();
    for(const [j,st] of statements.entries()){
      const key=String(st?.statementKey||'').trim(),text=String(st?.text||'').trim(),cls=String(st?.statementClass||'').trim();
      if(!key||!text||!cls)errors.push(`${id} extractedStatements[${j}] requires statementKey, text, and statementClass.`);
      if(key&&statementKeys.has(key))errors.push(`${id} repeats statementKey ${key}.`);statementKeys.add(key);
    }
    if(disposition==='INAPPLICABLE'&&!String(u?.reason||'').trim())errors.push(`${id} is INAPPLICABLE without a reason.`);
    accounted.add(id);
  }
  for(const id of ids)if(!seen.has(id))errors.push(`Controlled input unit ${id} is omitted from Stage 01 accounting.`);
  const total=ids.size,coverage=total?accounted.size/total:1;
  return {complete:errors.length===0&&coverage===1,coverage,total,accounted:accounted.size,errors,manifest,capture};
}
function obligationManifest(project){
  ensureShape(project);
  const prerequisites={stage1Complete:project.stages?.[1]?.status==='COMPLETE',stage3Complete:project.stages?.[3]?.status==='COMPLETE'};
  const input=intakeCoverageManifest(project),intakeEval=evaluateIntakeCoverage(project,project.job.INPUT_SET_CONTENTS),obligations=[],seen=new Set();
  const add=(originType,originId,sourceLocation,text,provenance={})=>{
    const t=typeof text==='string'?text.trim():JSON.stringify(text);
    if(!t||['NONE','NOT APPLICABLE'].includes(upper(t)))return;
    const contentSha256=hash.sha256Value(text),obligationId='OBL-'+hash.sha256Value({originType,originId,sourceLocation,contentSha256}).slice(0,24).toUpperCase();
    if(seen.has(obligationId))return;seen.add(obligationId);obligations.push({obligationId,originType,originId,sourceLocation,text:t,contentSha256,provenance:clone(provenance)});
  };
  for(const u of input.units)add('USER_JOB_INPUT',u.sourceUnitId,u.sourceLocation,u.rawValue,{inputVersion:input.inputVersion,rawValueSha256:u.rawValueSha256});
  const cap=intakeEval.capture;
  if(cap){for(const u of safe(cap.units))for(const [i,st] of safe(u.extractedStatements).entries())add('STAGE01_CAPTURE',String(st.statementKey||`${u.sourceUnitId}:${i}`),`/job/INPUT_SET_CONTENTS/units/${u.sourceUnitId}/extractedStatements/${i}`,st.text,{sourceUnitId:u.sourceUnitId,statementClass:st.statementClass});for(const [i,st] of safe(cap.conversationStatements).entries())add('STAGE01_CONVERSATION',String(st.statementKey||`conversation:${i}`),`/job/INPUT_SET_CONTENTS/conversationStatements/${i}`,st.text,{question:st.question,status:st.status,statementClass:st.statementClass});}
  for(const name of ['EXACT_DELIVERABLE_REQUESTED','ASSUMPTIONS','UNKNOWN_INFORMATION'])add('STAGE01_JOB_DEFINITION',name,`/stages/1/agentData/${name}`,project.stages?.[1]?.agentData?.[name]??project.job?.[name],{stage:1});
  const current=col=>recordsForCurrentScope(project,col);
  for(const collection of ['research','candidateRequirements'])for(const rec of current(collection)){
    const id=recordId(rec,collection)||hash.sha256Value(rec).slice(0,16),fields=recordFields(rec);
    for(const [fieldName,value] of Object.entries(fields)){
      if(fieldName===schema.RECORD_SCHEMAS?.[collection]?.idField)continue;
      if(value===undefined||value===null||value===''||(Array.isArray(value)&&!value.length))continue;
      add('STAGE03_'+collection.toUpperCase(),`${id}:${fieldName}`,`/${collection}/${id}/${fieldName}`,value,{stage:3,recordId:id,fieldName,relationships:clone(rec.relationships||{})});
    }
  }
  for(const rec of current('sources')){const id=recordId(rec,'sources');add('SOURCE_IDENTITY',id,`/sources/${id}`,{id,fields:recordFields(rec)},{stage:2,recordId:id});}
  const identity={schema:'closed-loop-obligation-manifest/1',inputVersion:input.inputVersion,sourceSetVersion:project.job.CURRENT_SOURCE_SET_VERSION||null,researchVersion:project.job.CURRENT_RESEARCH_VERSION||null,prerequisites,obligations:obligations.map(({obligationId,originType,originId,sourceLocation,contentSha256,provenance})=>({obligationId,originType,originId,sourceLocation,contentSha256,provenance}))};
  return {...identity,obligations,manifestSha256:hash.sha256Value(identity)};
}
function obligationRefsFromRequirement(record){const value=record?.fields?.USER_INPUT_RELATIONSHIP??record?.USER_INPUT_RELATIONSHIP;return Array.isArray(value)?value.map(String):String(value||'').split(/[\s,;]+/).filter(v=>/^OBL-/i.test(v));}
function evaluateObligationAccounting(project,{requirements=[],evidence=[]}={}){
  const manifest=obligationManifest(project),errors=[];
  if(!manifest.prerequisites.stage1Complete)errors.push('Stage 01 is not COMPLETE; Stage 04 obligation accounting cannot close.');
  if(!manifest.prerequisites.stage3Complete)errors.push('Stage 03 is not COMPLETE; Stage 04 obligation accounting cannot close.');
  const ids=new Set(manifest.obligations.map(o=>o.obligationId)),mapped=new Map(),disposed=new Map(),allowed=new Set(['RETAINED_NONNORMATIVE_CONTEXT','INAPPLICABLE','BLOCKED']);
  for(const req of safe(requirements))for(const id of obligationRefsFromRequirement(req)){if(!ids.has(id))errors.push(`Requirement references unknown obligation ${id}.`);else{if(!mapped.has(id))mapped.set(id,0);mapped.set(id,mapped.get(id)+1);}}
  for(const ev of safe(evidence))if(upper(ev?.kind)==='OBLIGATION_DISPOSITION'){
    let d;try{d=typeof ev.content==='string'?JSON.parse(ev.content):ev.content;}catch{errors.push('OBLIGATION_DISPOSITION evidence content is malformed JSON.');continue;}
    const keys=d&&typeof d==='object'&&!Array.isArray(d)?Object.keys(d):[];if(keys.length!==3||!['obligationId','disposition','reason'].every(k=>keys.includes(k))){errors.push('OBLIGATION_DISPOSITION must contain exactly obligationId, disposition, and reason.');continue;}
    const id=String(d.obligationId||'');if(!ids.has(id)){errors.push(`Disposition references unknown obligation ${id||'(missing)'}.`);continue;}if(disposed.has(id))errors.push(`Duplicate disposition for ${id}.`);disposed.set(id,d);if(!allowed.has(upper(d.disposition)))errors.push(`Invalid non-requirement disposition for ${id}.`);if(!String(d.reason||'').trim())errors.push(`Disposition for ${id} requires a reason.`);
  }
  for(const id of ids){if(mapped.has(id)&&disposed.has(id))errors.push(`${id} is both mapped to a requirement and disposed.`);else if(!mapped.has(id)&&!disposed.has(id))errors.push(`${id} has no requirement mapping or valid non-requirement disposition.`);}
  const accounted=[...ids].filter(id=>(mapped.has(id)?1:0)+(disposed.has(id)?1:0)===1).length,total=ids.size;
  return {complete:errors.length===0&&accounted===total,coverage:total?accounted/total:1,total,accounted,errors,manifest};
}
