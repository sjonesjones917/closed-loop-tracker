name: Closed Loop Self Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check spec.js
          node --check engine-base.js
          node --check engine-contract.js
          node --check engine-validate.js
          node --check engine-batch.js
      - name: Full 30-stage workflow self-test
        run: node selftest.js
      - name: Verify generated artifact
        run: |
          test "$(cat selftest-artifact.txt)" = "HELLO CLOSED LOOP"
          echo "960046275eb0798c9968d7a14d0a6d45c09c97534012185f27936cb4cb39550e  selftest-artifact.txt" | sha256sum -c -
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-selftest-evidence
          path: |
            selftest-artifact.txt
            selftest-state.json
