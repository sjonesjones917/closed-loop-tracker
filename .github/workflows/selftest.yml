name: Closed Loop V2 Self Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check final app engine
        run: |
          node --check v2-spec.js
          node --check v2-model.js
          node --check v2-contract.js
          node --check v2-validate.js
          node --check v2-fixes.js
          node --check v2-batch.js
          node --check v2-ui.js
      - name: Full 30-stage workflow self-test
        run: node selftest-v2.js
      - name: Verify generated artifact identity
        run: |
          test "$(cat selftest-artifact-v2.txt)" = "HELLO CLOSED LOOP"
          echo "960046275eb0798c9968d7a14d0a6d45c09c97534012185f27936cb4cb39550e  selftest-artifact-v2.txt" | sha256sum -c -
          ! grep -R '\$1' selftest-state-v2.json
      - name: Upload full evidence
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-v2-selftest-evidence
          path: |
            selftest-artifact-v2.txt
            selftest-state-v2.json
