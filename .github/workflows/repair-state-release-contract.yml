name: Repair state and release contract
on:
  push:
    branches: [repair/spec-state-release-20260903]
    paths:
      - repair-state-release-contract.mjs
      - .github/workflows/repair-state-release-contract.yml
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-state-release-20260903
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node repair-state-release-contract.mjs
      - run: node verify-state-release-contract.mjs
      - run: node verify-v3-contract.mjs
      - run: node verify.mjs
      - name: Commit repaired implementation
        run: |
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git commit -m "Conform canonical state and release precedence"
          git push origin HEAD:repair/spec-state-release-20260903
