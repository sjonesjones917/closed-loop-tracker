name: Materialize worker build identity correction

on:
  push:
    branches: [fix/restore-controlling-proof-20260830]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-controlling-proof-20260830
          fetch-depth: 0
      - name: Bind worker URL to the loaded runtime build and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_path=Path('test-runtime.js')
          runtime=runtime_path.read_text()
          insertion_old="const root=globalThis;\nconst VERSION='closed-loop-test-runtime/1';"
          insertion_new="const root=globalThis;\nconst RUNTIME_SCRIPT_URL=typeof document!=='undefined'?document.currentScript?.src||null:null;\nconst VERSION='closed-loop-test-runtime/1';"
          if insertion_old in runtime:
            runtime=runtime.replace(insertion_old,insertion_new,1)
          elif insertion_new not in runtime:
            raise SystemExit('Runtime script URL capture point was not found.')

          function_old="function workerUrl(){\n  const source=typeof document!=='undefined'?document.currentScript?.src:null;const base=source||root.location?.href;if(!base)return 'test-worker.js';const url=new URL('test-worker.js',base);if(source)url.search=new URL(source).search;return url.href;\n}"
          function_new="function workerUrl(){\n  const base=RUNTIME_SCRIPT_URL||root.location?.href;if(!base)return 'test-worker.js';const url=new URL('test-worker.js',base);if(RUNTIME_SCRIPT_URL)url.search=new URL(RUNTIME_SCRIPT_URL).search;return url.href;\n}"
          if function_old in runtime:
            runtime=runtime.replace(function_old,function_new,1)
          elif function_new not in runtime:
            raise SystemExit('Runtime worker URL function was not found.')
          runtime_path.write_text(runtime)

          live_path=Path('verify-live.mjs')
          live=live_path.read_text()
          live_old="if(!fs.readFileSync('test-runtime.js','utf8').includes(`test-worker.js?v=${buildToken}`))throw new Error('Deployed worker URL does not share the runtime build identity.');"
          live_new="const runtimeSource=fs.readFileSync('test-runtime.js','utf8');\nif(!runtimeSource.includes('const RUNTIME_SCRIPT_URL=')||!runtimeSource.includes('url.search=new URL(RUNTIME_SCRIPT_URL).search'))throw new Error('Deployed worker URL does not preserve the loaded runtime build identity.');"
          if live_old in live:
            live=live.replace(live_old,live_new,1)
          elif live_new not in live:
            raise SystemExit('Live worker build assertion was not found.')
          live_path.write_text(live)

          Path('.github/workflows/materialize-worker-build-identity.yml').unlink()
          PY
          git config user.name 'closed-loop-repair'
          git config user.email 'closed-loop-repair@users.noreply.github.com'
          git add test-runtime.js verify-live.mjs .github/workflows/materialize-worker-build-identity.yml
          git commit -m 'Preserve runtime build identity in Test IR worker URL'
          git push origin HEAD:fix/restore-controlling-proof-20260830
