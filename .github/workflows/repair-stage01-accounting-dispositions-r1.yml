name: One-shot Stage 01 accounting disposition repair

on:
  push:
    branches:
      - repair/stage01-accounting-dispositions-20260903-r1

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[stage01-dispositions-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/stage01-accounting-dispositions-20260903-r1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply Stage 01 disposition repair
        run: python3 .github/repairs/stage01-dispositions-r1.py
      - name: Prove Stage 01 disposition repair
        run: |
          node verify-stage01-controlling-dispositions.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
      - name: Remove temporary repair files and commit canonical changes
        run: |
          git rm .github/workflows/repair-stage01-accounting-dispositions-r1.yml .github/repairs/stage01-dispositions-r1.py
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add workflow-engine.js prompt-engine.js verify*.mjs
          git commit -m 'Use controlling Stage 01 accounting dispositions [stage01-dispositions-done]'
          git push origin HEAD:repair/stage01-accounting-dispositions-20260903-r1