name: Apply derivation registry closure repair
on:
  push:
    branches: [fix/semantic-registry-scope-closure-20260903]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[derivation-registry-repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/semantic-registry-scope-closure-20260903
      - name: Close derivation registry and remove scaffolding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('workflow-schema.js')
          text=path.read_text()
          old="""const normalizerRegistry=Object.freeze({identity:'closed-loop-normalizer-registry/1',entries:Object.freeze({})});
          const derivationRegistry=Object.freeze({identity:'closed-loop-derivation-registry/1',entries:Object.freeze({})});"""
          new="""const normalizerRegistry=Object.freeze({identity:'closed-loop-normalizer-registry/1',entries:Object.freeze({})});
          const DERIVATION_REGISTRY_VERSION='closed-loop-derivation-registry/1';
          const DERIVATION_ENTRY_VERSION='closed-loop-derivation-contract/1';
          const derivationEntries={};
          for(const entry of Object.values(FIELD_REGISTRY)){
            const registryId=entry.derivationIdentity;
            if(!registryId||derivationEntries[registryId])continue;
            derivationEntries[registryId]=Object.freeze({
              registryId,
              version:DERIVATION_ENTRY_VERSION,
              implementationOwnerFile:entry.invalidationOwner||'workflow-engine.js',
              canonicalInputContract:Object.freeze({
                dependencyClosure:'CURRENT_CANONICAL_DEPENDENCY_CLOSURE',
                sourceRecordHashes:'REQUIRED_FOR_PERSISTED_DERIVED_VALUES',
                scopeDimensions:Object.freeze([...(entry.scopeDimensions||[])])
              }),
              outputContract:Object.freeze({path:entry.path,valueType:entry.valueType,nullable:entry.nullable,cardinality:entry.cardinality}),
              implementationIdentity:VERSION,
              invalidationConsequences:'CONSERVATIVE_STAGE_INVALIDATION'
            });
          }
          const derivationRegistry=Object.freeze({identity:DERIVATION_REGISTRY_VERSION,entries:Object.freeze(derivationEntries)});"""
          if text.count(old)!=1: raise SystemExit(f'derivation registry replacement count={text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          rm .github/workflows/repair-derivation-registry.yml
          node --check workflow-schema.js
          node verify-contract-closure.mjs
          git config user.name closed-loop-repair
          git config user.email closed-loop-repair@users.noreply.github.com
          git add workflow-schema.js verify-contract-closure.mjs .github/workflows/repair-derivation-registry.yml
          git commit -m "Close derivation registry references [derivation-registry-repair-applied]"
          git push origin HEAD:fix/semantic-registry-scope-closure-20260903
