name: Full controller executable evidence
on:
  push:
    branches: [controller/c3-live-verification-20260904]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          cp controller-full-evidence.mjs /tmp/controller-full-evidence.mjs
          git fetch origin main --no-tags
          TARGET=$(git merge-base HEAD origin/main)
          echo "TARGET_COMMIT=$TARGET" >> "$GITHUB_ENV"
          git checkout --detach "$TARGET"
      - name: Execute all repository and local-browser evidence
        env:
          BROWSER: /usr/bin/google-chrome
          REPORT_PATH: /tmp/controller-full-evidence.json
        run: node /tmp/controller-full-evidence.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: controller-full-evidence-${{ env.TARGET_COMMIT }}
          path: /tmp/controller-full-evidence.json
          if-no-files-found: error
