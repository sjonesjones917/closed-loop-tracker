name: Apply PR1 architecture cleanup
on:
  push:
    branches: [repair/pr1-architecture-cleanup]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply, verify, and commit only permanent non-workflow changes
        run: |
          if [ ! -f pr1-apply.mjs ]; then
            echo 'PR1 transformation already committed.'
            exit 0
          fi
          node pr1-apply.mjs
          node build-test-project.mjs
          for f in app-core.js hash.js workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js project-store.js workbook.js verify.mjs verify-ingestion.mjs verify-complete.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs; do node --check "$f"; done
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/closed-loop-pr1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .1; done
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser.mjs
          PAGE_URL=http://127.0.0.1:4173/ node verify-browser-extra.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md index.html build-test-project.mjs verify.mjs verify-live.mjs verify-browser.mjs verify-browser-extra.mjs
          git rm app.js .repair-engine-a.mjs .repair-engine-b.mjs .repair-schema.mjs pr1-apply.mjs
          git commit -m "Clean runtime loading and integrate verified mobile repair"
          git push origin HEAD:repair/pr1-architecture-cleanup