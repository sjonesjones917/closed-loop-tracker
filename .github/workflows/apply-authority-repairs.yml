name: Apply freeze authority and artifact-binding repairs
on:
  push:
    branches: [repair/closed-loop-reliability-20260831]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/closed-loop-reliability-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Correct application authority and sentinel artifact binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow-engine.js')
          s=p.read_text()
          old="case 10:requireAccepted();requireCount('iterations',1);requireCount('candidateFreezes',1);break;"
          new="case 10:requireCount('iterations',1);requireCount('candidateFreezes',1);break;"
          if old not in s: raise SystemExit('Stage 10 agent-gate signature not found')
          s=s.replace(old,new)
          old="case 20:{requireAccepted();const confirmations="
          new="case 20:{const confirmations="
          if old not in s: raise SystemExit('Stage 20 agent-gate signature not found')
          s=s.replace(old,new)
          old="evidenceArtifactIds=evidenceIds.map(id=>evidenceById.get(id)).map(item=>String(recordValue(item,'ATTACHMENT_ID')||item?.relationships?.ATTACHMENT_ID||'').trim()).filter(Boolean)"
          new="evidenceArtifactIds=evidenceIds.map(id=>evidenceById.get(id)).map(item=>String(recordValue(item,'ATTACHMENT_ID')||item?.relationships?.ATTACHMENT_ID||'').trim()).filter(id=>id&&!['UNKNOWN','NONE','NOT APPLICABLE','N/A'].includes(upper(id)))"
          if old not in s: raise SystemExit('Evidence attachment sentinel signature not found')
          p.write_text(s.replace(old,new))
          PY
          node --check workflow-engine.js
          node verify-hash.mjs
          node verify-zero-loss-accounting.mjs
          node verify-semantic-invariant.mjs
      - name: Commit corrected application source
        run: |
          rm -f .github/workflows/apply-authority-repairs.yml
          git config user.name closed-loop-repair-bot
          git config user.email closed-loop-repair-bot@users.noreply.github.com
          git add workflow-engine.js .github/workflows
          git commit -m "Correct freeze authority and artifact readiness binding"
          git push origin HEAD:repair/closed-loop-reliability-20260831
