name: finalize-capture-once-v5

on:
  push:
    branches:
      - fix/controlling-spec-zero-loss-20260830
    paths:
      - .github/workflows/finalize-capture-once-v5.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlling-spec-zero-loss-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final guarded corrections
        run: python3 tools/finalize_capture_once_v3.py
      - name: Syntax
        run: |
          set -euo pipefail
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check test-runtime.js
          node --check test-worker.js
      - name: Capture once and prompt semantics
        run: |
          node verify-intent-capture.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
      - name: Contracts runtime ingestion and lifecycle
        run: |
          node verify-v3-migration.mjs
          node verify-v3-contract.mjs
          node verify-test-runtime-v3.mjs
          node verify-test-runtime-limits.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
          node verify-project-lifecycle.mjs
          node verify.mjs
      - name: Local browser acceptance
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Commit verified implementation and remove one-time repair infrastructure
        run: |
          set -euo pipefail
          git config user.name closed-loop-repair
          git config user.email actions@users.noreply.github.com
          rm -f \
            .github/workflows/finalize-intent-capture.yml \
            .github/workflows/materialize-capture-once.yml \
            .github/workflows/materialize-capture-once-v2.yml \
            .github/workflows/materialize-capture-once-v3.yml \
            .github/workflows/materialize-capture-once-v4.yml \
            .github/workflows/finalize-capture-once-v5.yml \
            .github/workflows/zero-loss-materialize-v4.yml \
            .github/workflows/zero-loss-materialize-v5.yml \
            .github/workflows/zero-loss-materialize-v6.yml \
            tools/finalize_intent_capture.py \
            tools/materialize_remaining.py \
            tools/materialize_remaining_v2.py \
            tools/finalize_capture_once_v3.py \
            materialize-v4.log materialize-v4.status materialize-capture-once.log materialize-capture-once.status
          git add -A
          git commit -m 'Finalize exhaustive capture-once Stage 01 03 04 flow'
          git push origin HEAD:fix/controlling-spec-zero-loss-20260830
