name: Verify controlling v3 repair branch
on:
  push:
    branches: [spec-v3-controlling-bundle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-v3-controlling-bundle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and controlling checks
        run: |
          node --check workbook.js
          node --check workflow-schema.js
          node --check test-runtime.js
          node --check test-worker.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node --check app-core.js
          node --check verify-spec-v3.mjs
          node --check verify-intent-exhaustion.mjs
          node verify-spec-v3.mjs
          node verify-intent-exhaustion.mjs
          node verify-test-runtime.mjs
