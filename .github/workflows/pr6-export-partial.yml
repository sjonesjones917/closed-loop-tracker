name: Export recoverable PR6 patch prefix
on:
  push:
    branches: [practical-100/pr6-acceptance-proof]
permissions:
  contents: read
jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct valid gzip prefix
        shell: bash
        run: |
          set -euo pipefail
          transport=ea845ac01a10a96fba8f000cb37b7d9e00efcb33
          git fetch --no-tags origin "$transport"
          { git show "$transport:.pr6-patch/part00"; git show "$transport:.pr6-patch/part01"; } | tr -d '\r\n' | base64 --decode > /tmp/pr6.patch.gz
          set +e
          gzip -dc /tmp/pr6.patch.gz > /tmp/pr6.patch 2>/tmp/pr6-gzip-error.txt
          status=$?
          set -e
          printf 'gzip_status=%s\n' "$status" > /tmp/pr6-status.txt
          wc -c /tmp/pr6.patch.gz /tmp/pr6.patch >> /tmp/pr6-status.txt
          test -s /tmp/pr6.patch
      - uses: actions/upload-artifact@v4
        with:
          name: pr6-recoverable-prefix
          path: |
            /tmp/pr6.patch
            /tmp/pr6.patch.gz
            /tmp/pr6-gzip-error.txt
            /tmp/pr6-status.txt
          retention-days: 7
