name: Repair blocker record hash preimage
on:
  push:
    branches:
      - fix/blocker-record-hash-preimage
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blocker-record-hash-preimage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal repair
        run: node repair-blocker-record-hash.mjs
      - name: Verify exact repair
        run: |
          node verify-hash.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit repaired source and regression
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Hash accepted blocker records from complete canonical state"
          git push origin HEAD:fix/blocker-record-hash-preimage
