name: Apply Stage 01 conversation restoration

on:
  push:
    branches: [fix/complete-closed-loop-spec-20260831]
    paths:
      - .github/workflows/apply-stage01-conversation.yml
      - .github/apply-stage01-conversation.py
      - .github/apply-stage01-followups.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore conversation-first Stage 01 prompt behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-stage01-conversation.py
          python3 .github/apply-stage01-followups.py
          python3 - <<'PY'
          from pathlib import Path
          import json

          prompt_path=Path('prompt-engine.js')
          prompt_source=prompt_path.read_text()

          def append_stage(stage,next_stage,required,addition):
              global prompt_source
              marker=f',"{stage}":'
              end_marker=f',"{next_stage}":'
              start=prompt_source.find(marker)
              end=prompt_source.find(end_marker,start+len(marker))
              if start<0 or end<0:
                  raise SystemExit(f'Stage {stage} prompt-procedure boundary was not found.')
              value_start=start+len(marker)
              procedure=json.loads(prompt_source[value_start:end])
              if required not in procedure:
                  procedure=procedure+addition
              prompt_source=prompt_source[:value_start]+json.dumps(procedure,ensure_ascii=False)+prompt_source[end:]

          append_stage(21,22,'actual output bytes',' Use only approved baseline materials in the fresh production context. Generate and return the actual output bytes for every required finished-product artifact whenever the executing environment can create them. Preserve the exact output-file inventory, application-verifiable byte identity, hashes from transferred bytes, baseline lineage, and production-context relationship. A prose description, filename, path, code block, or hash claim is not a substitute for the actual finished-product bytes.')
          append_stage(22,23,'application is running all mechanical tests',' The application is running all mechanical tests that its registered deterministic runtime can faithfully execute against the exact finished-product bytes. Native Test IR tests run automatically in the application worker and create application-owned observations, evidence, receipts, normalized results, counts, and gate state. Do not ask an external agent to imitate, assert, or fabricate application-native execution. Unsupported deterministic tests route to the exact capable external tool or system and remain BLOCKED or EXECUTION_FAILED when the required capability or exact bytes are unavailable. Never claim an unexecuted deterministic check ran. Preserve exact product identity, Test IR identity, runtime identity, input-artifact identities and hashes, observations, result, and evidence.')
          prompt_path.write_text(prompt_source)

          path=Path('verify-stage-prompts-complete.mjs')
          text=path.read_text()
          old="    if((stage===17||stage===19))assert(prompt.includes(`CURRENT DECLARED OPERATION: ${operation}`),`Stage ${stage} ${operation} lacks its exact operation-specific instruction.`);"
          new="    if(stage===17||stage===19){const operationProcedure=prompts.procedureFor(stage,operation);assert(prompt.includes(operationProcedure),`Stage ${stage} ${operation} does not embed its operation-specific procedure.`);assert(operationProcedure.includes(`operation ${operation} only`),`Stage ${stage} ${operation} is not restricted to its declared operation.`);}"
          if old not in text:
              raise SystemExit('Composite operation verification anchor was not found.')
          path.write_text(text.replace(old,new,1))
          PY
          node --check prompt-engine.js
          node --check workflow-engine.js
          node --check verify-stage01-conversation-first.mjs
          node --check verify-human-stage-walkthrough.mjs
          node --check verify-all-stage-prompts.mjs
          node --check verify-stage-prompts-complete.mjs
          node --check verify-live.mjs
          node build-test-project.mjs
          node verify-stage01-conversation-first.mjs
          node verify-prompt-semantics.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-one-time-intent-intake.mjs
          node verify-stage01-intake-closure.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
      - name: Commit the runtime repair and remove one-time scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/apply-stage01-conversation.yml .github/apply-stage01-conversation.py .github/apply-stage01-followups.py
          git rm -f .github/workflows/apply-verify-op01.yml .github/apply-verify-op01.py AUTHORIZED_OPERATION_01.txt
          git add prompt-engine.js workflow-engine.js index.html verify-stage01-conversation-first.mjs verify-stage01-intake-closure.mjs verify-human-stage-walkthrough.mjs verify-all-stage-prompts.mjs verify-stage-prompts-complete.mjs verify-live.mjs .github/workflows/pages.yml
          git commit -m "Restore Stage 01 human conversation and required file intake"
          git push origin HEAD:fix/complete-closed-loop-spec-20260831

# Stage 22 now preserves application-owned native execution and exact external routing boundaries.
