name: Apply Stage 01 conversation restoration

on:
  push:
    branches: [fix/complete-closed-loop-spec-20260831]
    paths:
      - .github/workflows/apply-stage01-conversation.yml
      - .github/apply-stage01-conversation.py
      - .github/apply-stage01-followups.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-closed-loop-spec-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore complete prompt behavior and ordered use
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-stage01-conversation.py
          python3 .github/apply-stage01-followups.py
          python3 - <<'PY'
          from pathlib import Path
          import json

          prompt_path=Path('prompt-engine.js')
          prompt_source=prompt_path.read_text()

          def append_stage(stage,next_stage,required,addition):
              global prompt_source
              marker=f',"{stage}":'
              end_marker=f',"{next_stage}":'
              start=prompt_source.find(marker)
              end=prompt_source.find(end_marker,start+len(marker))
              if start<0 or end<0:
                  raise SystemExit(f'Stage {stage} prompt-procedure boundary was not found.')
              value_start=start+len(marker)
              procedure=json.loads(prompt_source[value_start:end])
              if required not in procedure:
                  procedure=procedure+addition
              prompt_source=prompt_source[:value_start]+json.dumps(procedure,ensure_ascii=False)+prompt_source[end:]

          def append_last_stage(stage,required,addition):
              global prompt_source
              marker=f',"{stage}":'
              start=prompt_source.find(marker)
              end=prompt_source.find('});',start+len(marker))
              if start<0 or end<0:
                  raise SystemExit(f'Stage {stage} final prompt-procedure boundary was not found.')
              value_start=start+len(marker)
              procedure=json.loads(prompt_source[value_start:end])
              if required not in procedure:
                  procedure=procedure+addition
              prompt_source=prompt_source[:value_start]+json.dumps(procedure,ensure_ascii=False)+prompt_source[end:]

          append_stage(21,22,'actual output bytes',' Use only approved baseline materials in the fresh production context. Generate and return the actual output bytes for every required finished-product artifact whenever the executing environment can create them. Preserve the exact output-file inventory, application-verifiable byte identity, hashes from transferred bytes, baseline lineage, and production-context relationship. A prose description, filename, path, code block, or hash claim is not a substitute for the actual finished-product bytes.')
          append_stage(22,23,'application is running all mechanical tests',' The application is running all mechanical tests that its registered deterministic runtime can faithfully execute against the exact finished-product bytes. Native Test IR tests run automatically in the application worker and create application-owned observations, evidence, receipts, normalized results, counts, and gate state. Do not ask an external agent to imitate, assert, or fabricate application-native execution. Unsupported deterministic tests route to the exact capable external tool or system and remain BLOCKED or EXECUTION_FAILED when the required capability or exact bytes are unavailable. Never claim an unexecuted deterministic check ran. Preserve exact product identity, Test IR identity, runtime identity, input-artifact identities and hashes, observations, result, and evidence.')
          append_stage(23,24,'independent interpretation',' Some requirements require independent interpretation. Use a fresh independent reviewer context distinct from the Stage 21 production context. Give that reviewer only the actual product, the governing requirement, applicable source evidence, and the authorized meaning rubric. Withhold the generator’s correctness claims, generator reasoning, unnecessary deterministic pass status, adversarial findings, and prior meaning-review conclusions. For every applicable meaning requirement identify the exact product location, required meaning, observed meaning, evidence-based comparison, and SATISFIED, VIOLATED, or UNDETERMINED determination. A bare conclusion or a hash alone is insufficient. Every mandatory violated or undetermined result must prevent progression and have the required defect or blocker relationship.')
          append_stage(24,25,'every applicable attack category',' Test every applicable attack category and every active historical regression pattern against the exact current product. Use a fresh independent adversarial reviewer context and only the authorized product, requirements, regressions, failure patterns, artifacts, and evidence. Withhold generator reasoning, generator self-evaluation, conclusions telling the reviewer what to find, and prior reviewer conclusions unless a specific authorized attack requires them. Preserve attack method, expected behavior, actual result, severity, evidence, determination, and regression relationship. Every unresolved mandatory finding must have a defect or blocker and must return the product to root-cause correction rather than being averaged away.')
          append_stage(25,26,'every product, delivery artifact',' Inspect every product, delivery artifact, and required representation using the exact current bytes. Inspect every required page, view, transformation, and packaged file; open or exercise each packaged item rather than relying on filenames or inventories. Preserve the transformation chain, tools and versions, rendering or opening evidence, exact artifact location, observations, and determination. Objective filename, size, hash, lineage, and package facts are application-derived; irreducible visual or meaning judgments must come from the declared human or independent-review authority. No mandatory representation unknown may remain.')
          append_stage(26,27,'discrepancies and contradictions',' Establish process evidence and product evidence separately, then reconcile them. Compare approved inputs, instructions, tools, executions, tests, custody, current product, deterministic results, meaning results, adversarial results, representation inspections, regressions, defects, blockers, and evidence. Identify all missing links, discrepancies and contradictions. Agent-authored semantic review may explain observations, but the application owns identities, current-scope selection, counts, contradiction effects, missing-link effects, and the normalized reconciled determination. Any unresolved release-material discrepancy, contradiction, insufficient evidence, defect, or blocker prevents progression.')
          append_stage(27,28,'application alone calculates',' The application alone calculates the release gate from complete current sufficient noncontradictory evidence and creates exactly one ACCEPTED, REJECTED, or BLOCKED state. The agent may provide advisory analysis of observed blockers, violations, missing evidence, and controlling rules, but must never set or override release state, counts, identities, gate fields, or controlling normalized reason. Current mandatory violations produce REJECTED; incompatible or insufficient current evidence produces BLOCKED. Release cannot be accepted while any current mandatory violation, blocker, unresolved critical or major defect, contradiction, stale evidence, failed regression, missing result, or artifact-identity problem exists.')
          append_stage(28,29,'No external agent operation is required',' No external agent operation is required for canonical byte-identity comparison. The human selects or authorizes the audited and delivery artifacts; the application reads the actual bytes, computes SHA-256 and byte size, and performs one-to-one identity matching independent of array order. Reject missing, extra, duplicate, multiply matched, unauthorized renamed, resized, stale, unavailable, or differently hashed delivery artifacts. Delivery authorization is application-derived only after every required artifact has exact canonical identity, authorized filename, byte size, and hash equality with the audited product.')
          append_stage(29,30,'application-generated graph',' Build and preserve an application-generated graph for every mandatory requirement from authority or human authority through requirement, instruction trace, execution or product element, every applicable test, every required result, sufficient canonical evidence, current release, and every applicable released artifact identity. Every link must be current, scope-correct, relationship-valid, and supported by evidence capable of proving its proposition. Agent investigation may locate missing evidence only; never fabricate a link, identity, result, evidence record, or artifact relationship. Structural presence without epistemic sufficiency is incomplete.')
          append_last_stage(30,'Never rewrite history',' Preserve defect and regression history as append-only permanent records. Every confirmed defect has a permanent regression definition, preserved failure fixture, actual pre-correction failure execution with sufficient evidence, and a distinct later corrected execution establishing success. The latest applicable regression execution must succeed before baseline approval and release. Corrections create superseding records; Never rewrite history, delete an applicable regression, convert an unexecuted definition into a pass, or use one execution as both pre- and post-correction proof.')
          prompt_path.write_text(prompt_source)

          path=Path('verify-stage-prompts-complete.mjs')
          text=path.read_text()
          old="    if((stage===17||stage===19))assert(prompt.includes(`CURRENT DECLARED OPERATION: ${operation}`),`Stage ${stage} ${operation} lacks its exact operation-specific instruction.`);"
          new="    if(stage===17||stage===19){const operationProcedure=prompts.procedureFor(stage,operation);assert(prompt.includes(operationProcedure),`Stage ${stage} ${operation} does not embed its operation-specific procedure.`);assert(operationProcedure.includes(`operation ${operation} only`),`Stage ${stage} ${operation} is not restricted to its declared operation.`);}"
          if old not in text:
              raise SystemExit('Composite operation verification anchor was not found.')
          path.write_text(text.replace(old,new,1))
          PY
          node --check prompt-engine.js
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check verify-stage01-conversation-first.mjs
          node --check verify-human-stage-walkthrough.mjs
          node --check verify-all-stage-prompts.mjs
          node --check verify-stage-prompts-complete.mjs
          node --check verify-live.mjs
          node build-test-project.mjs
          node verify-stage01-conversation-first.mjs
          node verify-prompt-semantics.mjs
          node verify-human-stage-walkthrough.mjs
          node verify-one-time-intent-intake.mjs
          node verify-stage01-intake-closure.mjs
          node verify-all-stage-prompts.mjs
          node verify-stage-prompts-complete.mjs
      - name: Commit runtime repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/apply-stage01-conversation.py .github/apply-stage01-followups.py .github/apply-verify-op01.py AUTHORIZED_OPERATION_01.txt
          git add prompt-engine.js workflow-schema.js workflow-engine.js index.html verify-stage01-conversation-first.mjs verify-stage01-intake-closure.mjs verify-human-stage-walkthrough.mjs verify-all-stage-prompts.mjs verify-stage-prompts-complete.mjs verify-live.mjs
          git commit -m "Restore complete human-facing prompt workflow"
          git push origin HEAD:fix/complete-closed-loop-spec-20260831
