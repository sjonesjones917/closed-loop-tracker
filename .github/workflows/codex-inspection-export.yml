name: Codex inspection export

on:
  push:
    branches:
      - codex/inspect-reliability-evidence

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git archive --format=tar.gz --output=/tmp/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: inspected-reliability-source
          path: /tmp/source.tar.gz
          if-no-files-found: error
          retention-days: 1
