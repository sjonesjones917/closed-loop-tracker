name: Restore corrupted workflow engine
'on':
  push:
    branches:
      - practical-100/pr6-final-proof-current
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/pr6-final-proof-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact last plaintext workflow engine
        run: |
          git checkout 7718b8dbbb587fdddabcdbb118853507d79db3da -- workflow-engine.js
          node --check workflow-engine.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
      - name: Commit restoration and remove temporary workflow
        run: |
          rm .github/workflows/pr6-semantic-scope-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js .github/workflows/pr6-semantic-scope-bootstrap.yml
          git commit -m "Restore plaintext workflow engine"
          git push origin HEAD:practical-100/pr6-final-proof-current
