name: Materialize and preserve the complete retained project

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-cache-bust.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize the complete existing retained project
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node --check app.js
          node --check workbook.js
          node --check verify.mjs
          node verify.mjs
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('TEST_PROJECT.json','utf8'));
          if(p.schema!=='human-project/30') throw new Error('wrong schema');
          if(Object.keys(p.stageRecords||{}).length!==30) throw new Error('missing stage records');
          if((p.generatedPrompts||[]).length!==30) throw new Error('missing generated instructions');
          if((p.generatedOutputs||[]).length!==30) throw new Error('missing generated outputs');
          if((p.runRecords||[]).length<20) throw new Error('missing independent runs');
          NODE
      - name: Preserve the complete project in the repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-cache-bust.yml
          git add TEST_PROJECT.json .github/workflows/apply-cache-bust.yml
          git diff --cached --check
          git commit -m "Preserve the complete retained project"
          git push origin HEAD:main
