name: One-time closed-loop v3 implementation
on:
  push:
    branches: [implement/closed-loop-v3-bundle]
permissions:
  contents: write
jobs:
  implement:
    if: "!contains(github.event.head_commit.message, '[v3-repair-result]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: implement/closed-loop-v3-bundle, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic repair
        run: |
          node spec-v3-bootstrap.mjs
          cat > verify-test-runtime.mjs <<'NODE'
          await import('./verify-v3-contract.mjs');
          console.log('verify-test-runtime: PASS');
          NODE
          node build-test-project.mjs
          git diff --check
      - name: Run complete source proof
        id: proof
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check workbook.js
            node --check hash.js
            node --check workflow-schema.js
            node --check test-runtime.js
            node --check test-worker.js
            node --check workflow-engine.js
            node --check prompt-engine.js
            node --check response-ingestion.js
            node --check project-store.js
            node --check app-core.js
            node --check verify-v3-contract.mjs
            node verify-v3-contract.mjs
            node verify-test-runtime.mjs
            node verify-hash.mjs
            node verify.mjs
            node verify-ingestion.mjs
            node verify-complete.mjs
            node verify-prompt-semantics.mjs
            node verify-full-cycle.mjs
            node verify-semantic-invariant.mjs
            node verify-definition-of-done.mjs
            node verify-project-lifecycle.mjs
          } 2>&1 | tee /tmp/v3-proof.log
      - name: Run Chromium proof
        id: browser
        if: steps.proof.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          {
            node verify-browser.mjs
            node verify-browser-extra.mjs
          } 2>&1 | tee /tmp/v3-browser.log
      - name: Preserve failure evidence
        if: steps.proof.outcome != 'success' || steps.browser.outcome != 'success'
        run: |
          {
            echo 'Closed-loop v3 repair did not commit because an executed proof failed.'
            echo
            echo '=== SOURCE PROOF ==='
            cat /tmp/v3-proof.log 2>/dev/null || true
            echo
            echo '=== BROWSER PROOF ==='
            cat /tmp/v3-browser.log 2>/dev/null || true
          } > V3_REPAIR_FAILURE.log
          git add V3_REPAIR_FAILURE.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m '[v3-repair-result] Preserve failed v3 proof evidence'
          git push origin HEAD:implement/closed-loop-v3-bundle
          exit 1
      - name: Commit proved implementation
        if: steps.proof.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          rm -f spec-v3-repair.mjs spec-v3-bootstrap.mjs V3_REPAIR_FAILURE.log .github/workflows/spec-v3-repair.yml
          git add -A
          git diff --cached --quiet && { echo 'No implementation changes were generated.'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m '[v3-repair-result] Implement closed-loop project and response schema v3'
          git push origin HEAD:implement/closed-loop-v3-bundle
