name: Current-main final reliability repairs
on:
  push:
    branches: [final-audit-current-main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact current-main repairs
        run: python3 .final-current.py
      - name: Verify all deterministic acceptance suites
        run: |
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-complete.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit clean runtime and proof changes
        run: |
          git rm .final-current.py .github/workflows/final-current.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js response-ingestion.js prompt-engine.js app-core.js verify-complete.mjs
          git commit -m 'Close accepted-response recovery and operation-proof gaps'
          git push origin HEAD:final-audit-current-main
