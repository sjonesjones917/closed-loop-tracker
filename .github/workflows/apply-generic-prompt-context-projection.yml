name: Apply generic prompt context projection repair
on:
  push:
    branches: [fix/generic-prompt-context-projection-20260830]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('prompt-engine.js')
          s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/46';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/47';",1)
          start=s.index('function projectAuthorityBasis(')
          end=s.index('function contextFor(',start)
          replacement=r'''function projectAuthorityBasis(state,stage,operation,scope={}){
            const job=state?.job||{},stageOne=state?.stages?.[1]||{},batchPlan=verificationBatchPlan(stage,state,operation,scope),allowedCollections=new Set(promptReadCollections(stage,operation)),isolatedReviewer=[12,23,24].includes(Number(stage));
            const humanFieldNames=Object.entries(schema.JOB_FIELDS||{}).filter(([,definition])=>['HUMAN','HUMAN_DECISION'].includes(definition?.producer)).map(([name])=>name);
            const reviewerHumanFields=new Set(['EXACT_USER_OBJECTIVE_VERBATIM','PROHIBITED_ACTIONS']);
            const humanAuthority=Object.fromEntries(humanFieldNames.filter(name=>!isolatedReviewer||reviewerHumanFields.has(name)).map(name=>[name,job?.[name]??null]));
            const selected=(collection)=>allowedCollections.has(collection)?contextRecordsFor(state,collection,scope,batchPlan,stage).filter(record=>workflow.isActiveRecord(record)):[];
            const sources=selected('sources').map(record=>({sourceId:recordId(record,'sources'),title:recordValue(record,'TITLE')||null,authorityLevel:recordValue(record,'AUTHORITY_LEVEL')||null,authorityRole:recordValue(record,'AUTHORITY_ROLE')||null,controllingState:recordValue(record,'CONTROLLING_STATE')||null}));
            const requirements=selected('requirements').map(record=>({requirementId:recordId(record,'requirements'),obligation:recordValue(record,'OBLIGATION')||null,mandatoryOptionalStatus:recordValue(record,'MANDATORY_OPTIONAL_STATUS')||null,applicability:recordValue(record,'APPLICABILITY')||null,status:recordValue(record,'STATUS')||null}));
            const acceptedStage01=isolatedReviewer?{objectiveVerbatim:job.EXACT_USER_OBJECTIVE_VERBATIM??null,detailWithheld:true,withheldReason:'Independent verification receives only the current operation-authorized projection. The complete Stage 01 intake remains canonical and reusable but is not embedded when it is unnecessary to the proposition under review.'}:{capture:parseCapturedInputSet(state),agentData:stageOne.agentData||stageOne.acceptedData||{},humanData:stageOne.humanData||{},derivedData:workflow.deriveStageData(state,1)};
            return {rule:'Every prompt is generated by the same subject-neutral authority algorithm. Human project intent is captured once and remains canonical. The current prompt receives that intent plus only the current external-authority, requirement, artifact, execution, and evidence records authorized by this stage and operation. Never ask the human to repeat or reattach captured information. Never include records merely because they exist when the current context contract withholds them.',humanAuthority,acceptedStage01,currentAuthoritySummary:{sources,requirements},currentVersions:{inputVersion:job.CURRENT_INPUT_VERSION||null,sourceSetVersion:job.CURRENT_SOURCE_SET_VERSION||null,requirementsVersion:job.CURRENT_REQUIREMENTS_VERSION||null,testSuiteVersion:job.CURRENT_TEST_SUITE_VERSION||null,instructionVersion:job.CURRENT_INSTRUCTION_VERSION||null},stage,operation,scope};
          }
          '''
          s=s[:start]+replacement+s[end:]
          old="const open=safe(state?.projectData?.blockers).filter(x=>!x.invalidatedBy&&!['CLOSED','RESOLVED','RETIRED'].includes(upper(recordValue(x,'STATUS')||x.status||'OPEN')));if(open.length)parts.push(`APPLICABLE OPEN BLOCKERS\\n${show(open)}`);"
          new="const open=safe(state?.projectData?.blockers).filter(x=>!x.invalidatedBy&&!['CLOSED','RESOLVED','RETIRED'].includes(upper(recordValue(x,'STATUS')||x.status||'OPEN'))).filter(x=>{const blockerStage=Number(x.stage||recordValue(x,'STAGE_DISCOVERED')||0);if(blockerStage===stage)return true;const affected=String(recordValue(x,'AFFECTED_ARTIFACTS')||recordValue(x,'DOWNSTREAM_WORK_STOPPED')||'');return new RegExp(`(?:STAGE\\\\s*0?${stage}\\\\b|\\\\b${stage}\\\\b)`,'i').test(affected);});if(open.length)parts.push(`APPLICABLE OPEN BLOCKERS\\n${show(open)}`);"
          if old not in s: raise SystemExit('open blocker projection anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-engine.js
          git commit -m "Project generic prompt authority through stage context contracts"
          git push