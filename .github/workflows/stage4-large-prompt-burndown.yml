name: Stage 04 large prompt defect burn-down

on:
  push:
    branches: [fix/stage4-large-prompt-iphone-crash-20260910]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce Stage 04 oversized prompt failure
        run: node verify-prompt-inline-limits.mjs
