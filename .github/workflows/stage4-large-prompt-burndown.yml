name: Apply Stage 04 large-prompt repair

on:
  push:
    branches: [fix/stage4-large-prompt-iphone-crash-20260910]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply minimal production repair and permanent CI wiring
        env:
          REPAIR_PATCH_GZ_B64: '[... ELLIPSIZATION ...]'
        run: |
          set -euo pipefail
          printf '%s' "$REPAIR_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/stage4-large-prompt.patch
          git apply --check /tmp/stage4-large-prompt.patch
          git apply /tmp/stage4-large-prompt.patch
          rm .github/workflows/stage4-large-prompt-burndown.yml
          node --check prompt-engine.js
          node --check app-core.js
          node --check verify-prompt-inline-limits.mjs
          node verify-prompt-inline-limits.mjs
          node verify-prompt-semantics.mjs
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -o -name '*.yaml' | wc -l)" -eq 1
          git diff --check
      - name: Commit completed repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompt-engine.js app-core.js verify-prompt-inline-limits.mjs .github/workflows/pages.yml .github/workflows/stage4-large-prompt-burndown.yml
          git commit -m 'Enforce bounded Stage 04 prompt context transport'
          git push origin HEAD:fix/stage4-large-prompt-iphone-crash-20260910
