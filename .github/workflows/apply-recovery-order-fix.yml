name: Apply recovery sequence-order fix

on:
  push:
    branches:
      - semantic-reliability/recovery-sequence-order

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-reliability/recovery-sequence-order
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact recovery ordering fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js'); text=p.read_text()
          old="const accepted=(state?.projectData?.acceptedChanges||[]).filter(x=>lane(x)&&x.status==='COMMITTED'&&x.responseType==='DATA_PROPOSAL').at(-1);"
          new="const accepted=(state?.projectData?.acceptedChanges||[]).filter(x=>lane(x)&&x.status==='COMMITTED'&&x.responseType==='DATA_PROPOSAL').reduce((latest,item)=>!latest||Number(item.eventSequence||0)>Number(latest.eventSequence||0)?item:latest,null);"
          if text.count(old)!=1: raise SystemExit(f'accepted selector anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1))

          p=Path('verify-prompt-semantics.mjs'); text=p.read_text()
          old=" p.projectData.acceptedChanges.push({changeId:'CHANGE-REPLACEMENT',status:'COMMITTED',responseType:'DATA_PROPOSAL',rawResponseId:'RAW-REPLACEMENT',promptId:first.instructionId,eventSequence:20,...lane});\n const afterRecovery=prompts.buildPromptRecord(2,p,{operation:'COMPLETE',scope:{...first.scope}});"
          new=" p.projectData.acceptedChanges.push({changeId:'CHANGE-REPLACEMENT',status:'COMMITTED',responseType:'DATA_PROPOSAL',rawResponseId:'RAW-REPLACEMENT',promptId:first.instructionId,eventSequence:20,...lane});\n // A valid import may preserve records in a different physical array order; canonical eventSequence still controls chronology.\n p.projectData.acceptedChanges.push({changeId:'CHANGE-OLDER-OUT-OF-ORDER',status:'COMMITTED',responseType:'DATA_PROPOSAL',rawResponseId:'RAW-OLDER',promptId:first.instructionId,eventSequence:5,...lane});\n const afterRecovery=prompts.buildPromptRecord(2,p,{operation:'COMPLETE',scope:{...first.scope}});"
          if text.count(old)!=1: raise SystemExit(f'semantic test anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Verify before commit
        run: |
          node --check prompt-engine.js
          node --check verify-prompt-semantics.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit source and remove repair workflow
        run: |
          rm .github/workflows/apply-recovery-order-fix.yml
          git config user.name semantic-reliability-bot
          git config user.email actions@users.noreply.github.com
          git add prompt-engine.js verify-prompt-semantics.mjs .github/workflows/apply-recovery-order-fix.yml
          git commit -m "Use event sequence for recovery cutoff"
          git push origin HEAD:semantic-reliability/recovery-sequence-order
