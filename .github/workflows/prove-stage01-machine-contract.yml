name: Prove Stage 01 machine clarification contract
on:
  push:
    branches:
      - fix/stage01-machine-clarification-contract-20260826
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage01-machine-clarification-contract-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact prompt and clarification repair
        run: |
          sed -i "s/The application owns JOB_ID and controlled input identity/The application already owns JOB_ID and controlled input identity/" .apply-stage01-machine-contract.py
          python3 .apply-stage01-machine-contract.py
      - name: Full deterministic and browser acceptance
        run: |
          node build-test-project.mjs
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          node --check verify-ingestion.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit permanent passing source only
        run: |
          rm -f .apply-stage01-machine-contract.py .github/workflows/prove-stage01-machine-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Make Stage 01 prompts machine-executable and human-usable"
          git push origin HEAD:fix/stage01-machine-clarification-contract-20260826
