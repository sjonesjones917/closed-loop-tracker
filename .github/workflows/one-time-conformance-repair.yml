name: One-time conformance repair

on:
  push:
    branches: [agent/spec-conformance-ratchet]
    paths:
      - .github/workflows/one-time-conformance-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/spec-conformance-ratchet
          fetch-depth: 0
      - name: Repair demonstrated specification contradictions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('response-ingestion.js')
          text=path.read_text()
          start=text.index('  let envelope,normalization=null,firstError=null;')
          end=text.index('\n}\n\nfunction remapBlindAliases',start)
          replacement="""  if(/[“”]/.test(trimmed))throw Object.assign(new Error('Unsafe smart or curly quotation marks are not valid in an authoritative response JSON file.'),{code:'SMART_JSON_QUOTATION'});
  let envelope;
  try{envelope=parseCandidate(trimmed);}catch(error){
    if(error.code)throw error;
    const likelyTruncated=!trimmed.endsWith('}')||((trimmed.match(/{/g)||[]).length!==(trimmed.match(/}/g)||[]).length);
    throw Object.assign(new Error(`Response JSON could not be parsed: ${error.message}`),{code:likelyTruncated?'TRUNCATED_RESPONSE':'MALFORMED_JSON',cause:error});
  }
  if(!object(envelope))throw Object.assign(new Error('The response root must be one JSON object.'),{code:'INVALID_ROOT'});
  return envelope;"""
          text=text[:start]+replacement+text[end:]
          path.write_text(text)

          path=Path('workflow-schema.js')
          text=path.read_text()
          old="""const APPLICATION_JOB_FIELDS=Object.freeze(['JOB_ID','DATE_OPENED','CURRENT_ITERATION','CURRENT_STAGE','CURRENT_STATE','CURRENT_INPUT_VERSION','CURRENT_SOURCE_SET_VERSION','CURRENT_REQUIREMENTS_VERSION','CURRENT_TEST_SUITE_VERSION','CURRENT_INSTRUCTION_VERSION','CURRENT_BASELINE_ID','CURRENT_PRODUCT_ID','CURRENT_BLOCKERS','NEXT_REQUIRED_ACTION','LATEST_EVIDENCE_REFERENCE','INPUT_SET_HASH_OR_MANIFEST','JOB_RECORD_STATUS','STATUS_EVIDENCE']);"""
          new="""const APPLICATION_JOB_FIELDS=Object.freeze(['JOB_ID','CONTRACT_PROFILE_ID','DATE_OPENED','CURRENT_ITERATION','CURRENT_STAGE','CURRENT_STATE','CURRENT_INPUT_VERSION','CURRENT_SOURCE_SET_VERSION','CURRENT_RESEARCH_VERSION','CURRENT_REQUIREMENTS_VERSION','CURRENT_TEST_SUITE_VERSION','CURRENT_INSTRUCTION_VERSION','CURRENT_CANDIDATE_ID','CURRENT_BASELINE_ID','CURRENT_PRODUCT_ID','CURRENT_PRODUCT_VERSION','CURRENT_DELIVERY_CANDIDATE_SET_ID','CURRENT_REVIEW_VERSION','CURRENT_RECONCILED_REVIEW_VERSION','CURRENT_RELEASE_ID','CURRENT_HASH_REVIEW_ID','CURRENT_EVIDENCE_CHAIN_VERSION','CURRENT_DELIVERY_ID','CURRENT_BLOCKERS','NEXT_REQUIRED_ACTION','LATEST_EVIDENCE_REFERENCE','INPUT_SET_HASH_OR_MANIFEST','JOB_RECORD_STATUS','STATUS_EVIDENCE']);"""
          if old not in text: raise SystemExit('APPLICATION_JOB_FIELDS owner changed; refusing blind patch')
          text=text.replace(old,new,1)
          if "const CONTRACT_PROFILE_ID='closed-loop-completion-profile/1';" not in text:
              anchor="const RESPONSE_SCHEMA='closed-loop-stage-response/3';"
              if anchor not in text: raise SystemExit('schema constant anchor missing')
              text=text.replace(anchor,anchor+"\nconst CONTRACT_PROFILE_ID='closed-loop-completion-profile/1';",1)
          old="if(project.schema==='closed-loop-project/3')return ensureV3Defaults(clone(project));"
          if old in text:
              new="""if(project.schema==='closed-loop-project/3'){
    const current=ensureV3Defaults(clone(project));
    if(current?.job?.CONTRACT_PROFILE_ID!==CONTRACT_PROFILE_ID){
      current.legacyContractProfileStatus='LEGACY_PROFILE_MISSING_NON_GATING';
      current.profileValidation={valid:false,code:'MISSING_CONTRACT_PROFILE',required:CONTRACT_PROFILE_ID};
    }
    return current;
  }"""
              text=text.replace(old,new,1)
          path.write_text(text)

          path=Path('workbook.js')
          text=path.read_text()
          anchor="const PROJECT_SCHEMA='closed-loop-project/3';"
          if "const CONTRACT_PROFILE_ID='closed-loop-completion-profile/1';" not in text:
              text=text.replace(anchor,anchor+"\nconst CONTRACT_PROFILE_ID='closed-loop-completion-profile/1';",1)
          text=text.replace("CURRENT_STATE:'READY'","CURRENT_STATE:'READY_FOR_NEXT_OPERATION'")
          text=text.replace("CURRENT_STATE:'NOT STARTED'","CURRENT_STATE:'READY_FOR_NEXT_OPERATION'")
          text=text.replace("JOB_RECORD_STATUS:'NOT READY'","JOB_RECORD_STATUS:'INCOMPLETE'")
          marker="JOB_ID:jobId,"
          if marker in text and "CONTRACT_PROFILE_ID:CONTRACT_PROFILE_ID" not in text:
              text=text.replace(marker,marker+"CONTRACT_PROFILE_ID:CONTRACT_PROFILE_ID,",1)
          path.write_text(text)

          Path('verify-controlling-contradictions.mjs').write_text(r'''import fs from 'node:fs';
import vm from 'node:vm';
import assert from 'node:assert/strict';
globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type}};
globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
for(const f of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js','response-ingestion.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
const core=globalThis.closedLoopCore;
const schema=globalThis.closedLoopWorkflowSchema;
const ingestion=globalThis.closedLoopResponseIngestion;
assert(core&&schema&&ingestion,'Required runtime modules did not load.');
const requiredJobFields=['CONTRACT_PROFILE_ID','CURRENT_RESEARCH_VERSION','CURRENT_CANDIDATE_ID','CURRENT_PRODUCT_VERSION','CURRENT_DELIVERY_CANDIDATE_SET_ID','CURRENT_REVIEW_VERSION','CURRENT_RECONCILED_REVIEW_VERSION','CURRENT_RELEASE_ID','CURRENT_HASH_REVIEW_ID','CURRENT_EVIDENCE_CHAIN_VERSION','CURRENT_DELIVERY_ID'];
for(const field of requiredJobFields)assert(schema.JOB_FIELD_DEFINITIONS?.[field],`Missing required Job field contract ${field}`);
const fresh=core.createBlankState('JOB-CONFORMANCE-REGRESSION');
assert.equal(fresh.job.CONTRACT_PROFILE_ID,'closed-loop-completion-profile/1','Fresh /3 project lacks contract profile.');
assert(['BLOCKED','AWAITING_HUMAN_INPUT','PROPOSAL_PENDING_REVIEW','RESPONSE_STAGED','AWAITING_EXTERNAL_RESPONSE','READY_FOR_NEXT_OPERATION','WORKFLOW_COMPLETE'].includes(fresh.job.CURRENT_STATE),'Fresh CURRENT_STATE is outside the closed enum.');
assert(['INCOMPLETE','BLOCKED','COMPLETE'].includes(fresh.job.JOB_RECORD_STATUS),'Fresh JOB_RECORD_STATUS is outside the closed enum.');
let rejected=false;try{ingestion.strictParse('{“schema”:“closed-loop-stage-response/3”}');}catch(error){rejected=error?.code==='SMART_JSON_QUOTATION';}
assert(rejected,'Curly JSON quotation marks were repaired or accepted instead of rejected.');
const ingestionSource=fs.readFileSync('response-ingestion.js','utf8');
assert(!ingestionSource.includes("normalization='SMART_JSON_DELIMITERS'"),'Smart-quote repair path still exists.');
console.log('controlling contradiction regressions passed');
''')

          path=Path('.github/workflows/pages.yml')
          text=path.read_text()
          needle='          node verify-ingestion.mjs\n'
          if 'node verify-controlling-contradictions.mjs' not in text:
              if needle not in text: raise SystemExit('Pages ingestion test anchor missing')
              text=text.replace(needle,needle+'          node verify-controlling-contradictions.mjs\n',1)
          path.write_text(text)
          PY

          for file in workbook.js workflow-schema.js response-ingestion.js verify-controlling-contradictions.mjs; do node --check "$file"; done
          node verify-controlling-contradictions.mjs
          node verify-v3-migration.mjs
          node verify-ingestion.mjs

      - name: Commit completed ratchet step and remove repair scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-conformance-repair.yml
          git config user.name 'closed-loop-conformance-agent'
          git config user.email 'closed-loop-conformance-agent@users.noreply.github.com'
          git add workbook.js workflow-schema.js response-ingestion.js verify-controlling-contradictions.mjs .github/workflows/pages.yml .github/workflows/one-time-conformance-repair.yml
          git commit -m 'Reject repaired responses and close project profile fields'
          git push origin HEAD:agent/spec-conformance-ratchet
