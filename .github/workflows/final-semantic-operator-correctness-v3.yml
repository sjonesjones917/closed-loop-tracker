name: Apply final semantic operator corrections v3
'on':
  push:
    branches: [practical-100/final-semantic-operator-correctness]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-semantic-operator-correctness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded transformer and exact cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/final-semantic-operator-correctness.yml').read_text()
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          exec(compile(code,'final-semantic-transform.py','exec'),{})

          # Deleted context selector must not remain exported.
          p=Path('prompt-engine.js');s=p.read_text();old=',procedures,contextCollections,contextFor,';new=',procedures,contextFor,'
          if s.count(old)!=1:raise SystemExit(f'obsolete context export expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)
          # Make Stage 02 explicitly use web discovery when the external agent has it.
          old='Treat this count as guidance, not a quota. Prefer the most authoritative and reputable sources appropriate to the domain, prioritizing primary, official, controlling sources where they exist. Verify identity, currency, applicability, and authority before proposing a source.'
          new='Treat this count as guidance, not a quota. When web access is available, search broadly enough to discover the relevant source landscape, then inspect and prefer original authoritative publications rather than summaries or search snippets. Prefer the most authoritative and reputable sources appropriate to the domain, prioritizing primary, official, controlling sources where they exist. Verify identity, currency, applicability, and authority before proposing a source.'
          if s.count(old)!=1:raise SystemExit('Stage 02 web-discovery wording hook mismatch')
          s=s.replace(old,new,1)
          # State the static application's own repository boundary accurately.
          anchor='- When the environment cannot perform a requested implementation or execution, provide an implementation-ready specification rather than pretending implementation occurred.\n'
          boundary='- This static application does not itself read from or write to an external project repository. Treat repository implementation as unavailable unless the external agent execution context actually provides that capability and the current stage authorizes its use.\n'
          if s.count(anchor)!=1:raise SystemExit('repository-boundary anchor mismatch')
          s=s.replace(anchor,boundary+anchor,1)
          p.write_text(s)

          # Strengthen unchanged-confirmation command boundary.
          p=Path('workflow-engine.js');s=p.read_text()
          old="ensureShape(project);const candidate=records(project,'candidateFreezes').find(record=>recordId(record,'candidateFreezes')===String(candidateId||'')&&isActiveRecord(record));if(!candidate)throw new Error('A current frozen candidate is required for unchanged confirmation.');"
          new="ensureShape(project);if(project.stages?.[18]?.status!=='COMPLETE')throw new Error('Stage 18 must be complete before unchanged confirmation can begin.');const candidate=records(project,'candidateFreezes').find(record=>recordId(record,'candidateFreezes')===String(candidateId||'')&&Number(record.stage)===17&&isActiveRecord(record));if(!candidate)throw new Error('A current Stage 17 frozen candidate is required for unchanged confirmation.');"
          if s.count(old)!=1:raise SystemExit('unchanged-confirmation command boundary mismatch')
          p.write_text(s.replace(old,new,1))

          # Correct proposal HTML nesting introduced by the guarded transformation.
          p=Path('app-core.js');s=p.read_text()
          bad='<button id="request-correction">Request correction</button></div><div class="field"><label>Correction or refinement needed</label><textarea id="correction-reason" placeholder="State exactly what is missing, incorrect, or should be made more complete."></textarea><div class="button-row"></div></div>'
          good='<button id="request-correction">Request correction</button></div><div class="field"><label>Correction or refinement needed</label><textarea id="correction-reason" placeholder="State exactly what is missing, incorrect, or should be made more complete."></textarea></div></div>'
          if s.count(bad)!=1:raise SystemExit(f'proposal correction markup cleanup expected 1, found {s.count(bad)}')
          s=s.replace(bad,good,1)
          # Stage 19 must not present a file selector that implies a new candidate can be chosen.
          start=s.index('function artifactControlMarkup(n,locked){')
          end=s.index('function runBatchMarkup(n){',start)
          existing=s[start:end]
          replacement="""function artifactControlMarkup(n,locked){if(n===19)return `<div class=\"panel\"><h2 class=\"section-title\">Unchanged candidate control</h2><p class=\"section-intro\">Stage 19 reuses the exact current Stage 17 frozen candidate identity and hashes. Do not select replacement files or create a new candidate.</p><div class=\"button-row\"><button id=\"begin-unchanged-confirmation\"${locked?' disabled':''}>Begin unchanged confirmation using Stage 17 candidate</button></div></div>`;const applicable=[10,17,20,21,25].includes(n),files=safe(current.stages[n].authorizedFiles);return `<div class=\"panel\"><h2 class=\"section-title\">${applicable?'Artifact control':'Authorized files for this stage'}</h2><p class=\"section-intro\">Actual selected bytes are stored in IndexedDB, hashed by the application, read back, and rehashed before becoming canonical artifact identities.</p><div class=\"field\"><label>Select exact files</label><input id=\"stage-files\" type=\"file\" multiple${locked?' disabled':''}></div>${files.length?details('Verified artifact bytes',files,true):'<div class=\"empty-state\">No verified stage artifact bytes.</div>'}<div class=\"button-row\">${[10,17].includes(n)?`<button id=\"freeze-candidate\"${locked?' disabled':''}>${n===17?'Freeze corrected candidate':'Freeze selected candidate'}</button>`:''}${n===20?`<button id=\"freeze-baseline\"${locked?' disabled':''}>Freeze selected baseline</button>`:''}${n===21?`<button id=\"reserve-product-execution\"${locked?' disabled':''}>Reserve product execution</button>`:''}</div></div>`;}\n"""
          if 'begin-unchanged-confirmation' not in existing or 'stage-files' not in existing:raise SystemExit('Stage 19 artifact control expected transformed shape missing')
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Verify source, semantics, lifecycle, and operator contracts
        run: |
          node --check workflow-schema.js && node --check workflow-engine.js && node --check prompt-engine.js && node --check response-ingestion.js && node --check app-core.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          node - <<'NODE'
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          const fs=require('fs'),vm=require('vm');for(const f of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});const s=globalThis.closedLoopWorkflowSchema,pe=fs.readFileSync('prompt-engine.js','utf8'),ui=fs.readFileSync('app-core.js','utf8'),ing=fs.readFileSync('response-ingestion.js','utf8'),eng=fs.readFileSync('workflow-engine.js','utf8');const must=(c,m)=>{if(!c)throw new Error(m)};
          must(!pe.includes('const contextCollections='),'Duplicate prompt context selector remains');must(!pe.includes('contextCollections,contextFor'),'Obsolete context selector remains exported');must(pe.includes('REQ_ID × RUN_ID × TEST_ID triple'),'Stage 12 prompt is not exact-triple based');must(pe.includes('OPERATOR REQUESTED CORRECTIONS / REFINEMENTS'),'Correction feedback missing');must(pe.includes('WORK_TOO_LARGE_FOR_ENVIRONMENT')&&ing.includes('MISSING_APPLICATION_CONTEXT'),'Recovery taxonomy incomplete');must(pe.includes('When web access is available, search broadly enough'),'Stage 02 web discovery rule missing');must(pe.includes('does not itself read from or write to an external project repository'),'Repository capability boundary missing');
          must(!s.operationContract(17,'FREEZE').scopeRequirements.includes('runId')&&s.operationContract(17,'VERIFY').scopeRequirements.includes('runId'),'Stage17 scope wrong');must(!s.operationContract(19,'CONFIRM_FREEZE').scopeRequirements.includes('runId')&&s.operationContract(19,'VERIFY').scopeRequirements.includes('runId')&&!s.operationContract(19,'CONFIRM').scopeRequirements.includes('runId'),'Stage19 scope wrong');must(ui.includes("requiresRun=(schema.operationContract(n,operation)?.scopeRequirements||[]).includes('runId')"),'UI run scoping not schema-driven');must(ui.includes('accepted-refinement-reason'),'Accepted refinement missing');must(ui.includes('Unchanged candidate control')&&ui.includes('Do not select replacement files or create a new candidate.'),'Stage19 UI still permits misleading candidate selection');must(ui.includes('begin-unchanged-confirmation')&&eng.includes('beginUnchangedConfirmationIteration'),'Same-candidate Stage19 path missing');must(eng.includes("project.stages?.[18]?.status!=='COMPLETE'")&&eng.includes('Number(record.stage)===17'),'Stage19 command boundary is not exact');
          console.log(JSON.stringify({singleContextSelector:true,exactTriplePrompt:true,recoveryTaxonomy:true,stage2WebDiscovery:true,repositoryBoundary:true,operationScopeExact:true,schemaDrivenRunUI:true,postAcceptanceRefinement:true,sameCandidateStage19:true,stage19UiSemantics:true},null,2));
          NODE
      - name: Commit verified source and remove one-time workflows
        run: |
          rm .github/workflows/final-semantic-operator-correctness.yml .github/workflows/final-semantic-operator-correctness-v2.yml .github/workflows/final-semantic-operator-correctness-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close remaining semantic operator contradictions"
          git push origin HEAD:practical-100/final-semantic-operator-correctness
