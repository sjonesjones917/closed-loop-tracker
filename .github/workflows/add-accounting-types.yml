name: Apply accounting type metadata
on:
  push:
    branches: [controlling-spec-final-current]
    paths: ['.github/workflows/add-accounting-types.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: controlling-spec-final-current, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          python3 .github/add_accounting_types.py
          node --check workflow-schema.js
          node build-test-project.mjs
          node verify-closed-accounting.mjs
      - run: |
          git config user.name closed-loop-conformance
          git config user.email actions@users.noreply.github.com
          git add workflow-schema.js
          git diff --cached --quiet && exit 0
          git commit -m "Declare closed accounting field types"
          git push origin HEAD:controlling-spec-final-current
