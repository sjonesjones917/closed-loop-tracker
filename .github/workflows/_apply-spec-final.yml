e('function selectJsonPath(value,path){',xml+'function selectJsonPath(value,path){').replace("case 'PARSE_CSV':value=parseCsv(String(value));break;","case 'PARSE_CSV':value=parseCsv(String(value));break;case 'PARSE_XML':value=parseXml(String(value));break;").replace("case 'SELECT_JSON_PATH':value=selectJsonPath(value,step.path);break;","case 'SELECT_JSON_PATH':value=selectJsonPath(value,step.path);break;case 'SELECT_XML':value=selectXml(value,step.path);break;");s=re.sub(r"\\n\\s*case 'ASSERT_EXISTS':.*?break;",'',s);s=re.sub(r"\\n\\s*case 'ASSERT_TYPE':\\{.*?break;\\}",'',s);s=re.sub(r"\\n\\s*case 'ASSERT_NE':.*?break;",'',s);p.write_text(s)
