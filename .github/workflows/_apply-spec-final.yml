ements.join(', ')}.`);const obligations=obligationManifest(project),coveredObligations=new Set();for(const req of collection('requirements')){const rel=String(recordValue(req,'USER_INPUT_RELATIONSHIP')||'').trim(),src=String(recordValue(req,'SOURCE_LOCATION')||'').trim();for(const o of obligations)if(rel===o.sourceId||src===o.sourceId||src===o.obligationId)coveredObligations.add(o.obligationId);}const missingObligations=obligations.map(o=>o.obligationId).filter(id=>!coveredObligations.has(id));if(missingObligations.length)reasons.push(`Stage 04 obligation accounting is incomplete; missing obligation(s): ${missingObligations.join(', ')}.`);\n      break;");s=s.replace('mandatoryRequirements,currentIntentStatements,intentStatementRequiresRequirement,confirmedDefects','mandatoryRequirements,intakeCoverageManifest,obligationManifest,currentIntentStatements,intentStatementRequiresRequirement,confirmedDefects');p.write_text(s)
