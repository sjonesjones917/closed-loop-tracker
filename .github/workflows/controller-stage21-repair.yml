name: Controller Stage 21 convergence repair
on:
  push:
    branches:
      - controller-v2/stage21-convergence-20260904-3
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller-v2/stage21-convergence-20260904-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair and execute Stage 18 convergence proofs
        run: |
          python verification/controller-stage21-repair.py
          set +e
          : > verification/controller-stage21-run.log
          for cmd in \
            "node verify-convergence.mjs" \
            "node verify-complete.mjs" \
            "node verify-corrected-iteration.mjs" \
            "node verify-full-cycle.mjs" \
            "node verify-definition-of-done.mjs" \
            "node verify-v3-definition-of-done.mjs"
          do
            echo "COMMAND: $cmd" | tee -a verification/controller-stage21-run.log
            bash -lc "$cmd" >> verification/controller-stage21-run.log 2>&1
            code=$?
            echo "EXIT: $code" | tee -a verification/controller-stage21-run.log
          done
          cat verification/controller-stage21-run.log
      - name: Remove temporary repair mechanism and commit branch evidence
        run: |
          rm .github/workflows/controller-stage21-repair.yml verification/controller-stage21-repair.py
          git config user.name "closed-loop-controller"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Stage 21: make convergence application-owned and non-vacuous"
          git push origin HEAD:controller-v2/stage21-convergence-20260904-3
