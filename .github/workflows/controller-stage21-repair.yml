name: Controller Stage 21 convergence repair
on:
  push:
    branches:
      - controller-v2/stage21-convergence-20260904-3
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller-v2/stage21-convergence-20260904-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair Stage 18 application-owned convergence
        run: python verification/controller-stage21-repair.py
      - name: Execute focused invalid/repaired convergence proofs
        run: |
          node verify-convergence.mjs
          node verify-complete.mjs
          node verify-corrected-iteration.mjs
      - name: Execute affected full-cycle regression
        run: |
          node verify-full-cycle.mjs
          node verify-definition-of-done.mjs
          node verify-v3-definition-of-done.mjs
      - name: Self-remove repair files and commit implementation
        run: |
          rm .github/workflows/controller-stage21-repair.yml verification/controller-stage21-repair.py
          git config user.name "closed-loop-controller"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-schema.js workflow-engine.js app-core.js verify-full-cycle.mjs verify-convergence.mjs .github/workflows/pages.yml .github/workflows/controller-stage21-repair.yml verification/controller-stage21-repair.py
          git commit -m "Stage 21: make convergence application-owned and non-vacuous"
          git push origin HEAD:controller-v2/stage21-convergence-20260904-3
