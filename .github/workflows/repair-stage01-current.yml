name: One-time Stage 01 current repair
on:
  push:
    branches: [fix/stage01-disposition-contract-20260903c]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/stage01-disposition-contract-20260903c
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply repair
        run: python .github/repair-stage01-current.py
      - name: Prove exact failure and affected downstream path
        run: |
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node verify-stage01-disposition-contract.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-one-time-intent-intake.mjs
          node verify-stage-prompts-complete.mjs
          node verify-full-cycle.mjs
          node verify.mjs
      - name: Commit runtime and permanent regression only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-engine.js prompt-engine.js app-core.js verify-*.mjs
          git commit -m "Close Stage 01 raw-unit disposition contract"
          git push origin HEAD:fix/stage01-disposition-contract-20260903c
