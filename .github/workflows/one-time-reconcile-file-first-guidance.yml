name: One-time reconcile file-first guidance and oracle

on:
  push:
    branches: [repair/full-spec-conformance-fcfc1c6]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconcile product guidance and fixed oracle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('index.html')
          html = html_path.read_text()
          replacements = [
              (
                  '<li><strong>Select the exact response.json file returned by the agent for the current instruction.</strong></li>',
                  '<li><strong>Obtain the exact authoritative response.json file returned by the agent for the current instruction.</strong></li>'
              ),
              (
                  '<li><strong>Select that exact response JSON file in the application</strong>, then tap <em>Stage and validate response file</em>. Review the proposed change before accepting it.</li>',
                  '<li><strong>Select that exact response.json file in the application</strong>, then tap <em>Stage and validate response file</em>. Review the proposed change before accepting it.</li>'
              )
          ]
          for old, new in replacements:
              if html.count(old) != 1:
                  raise SystemExit(f'Expected exactly one guidance occurrence, found {html.count(old)}: {old}')
              html = html.replace(old, new)
          html_path.write_text(html)

          test_path = Path('verify-file-first-response.mjs')
          test = test_path.read_text()
          old_assertions = """  assert.match(htmlSource,/obtain the authoritative response\\.json file for the current instruction/i,'Static operator guidance must identify the authoritative response.json filename and current-instruction binding.');
  assert.match(htmlSource,/Select the exact response\\.json file returned by the agent in the application/i,'Static operator guidance must identify the selected response.json file and its external-agent origin.');"""
          new_assertions = """  assert.match(htmlSource,/Obtain the exact authoritative response\\.json file returned by the agent for the current instruction/i,'Static operator guidance must bind the authoritative returned response.json file to the current instruction.');
  assert.match(htmlSource,/Select that exact response\\.json file in the application/i,'Static operator guidance must require selecting the exact returned file in the application.');"""
          if test.count(old_assertions) != 1:
              raise SystemExit(f'Expected one obsolete assertion pair, found {test.count(old_assertions)}')
          test = test.replace(old_assertions, new_assertions)
          old_mutation = "assert.throws(()=>assertFileFirstResponseContract({htmlSource:html.replace('returned by the agent','from an unspecified source')}),/external-agent origin/,'Mutation erasing the returned-file origin must fail.');"
          new_mutations = """assert.throws(()=>assertFileFirstResponseContract({htmlSource:html.replace('authoritative ','')}),/authoritative returned response\\.json/,'Mutation erasing authoritative byte status must fail.');
assert.throws(()=>assertFileFirstResponseContract({htmlSource:html.replace('returned by the agent','from an unspecified source')}),/authoritative returned response\\.json/,'Mutation erasing the returned-file origin must fail.');
assert.throws(()=>assertFileFirstResponseContract({htmlSource:html.replace('Select that exact response.json file in the application','Paste JSON into the application')}),/selecting the exact returned file/,'Mutation restoring text-entry guidance must fail.');"""
          if test.count(old_mutation) != 1:
              raise SystemExit(f'Expected one obsolete response-origin mutation, found {test.count(old_mutation)}')
          test = test.replace(old_mutation, new_mutations)
          test = test.replace("  responseOriginMutationDetected:true,", "  authoritativeStatusMutationDetected:true,\n  responseOriginMutationDetected:true,\n  exactSelectionMutationDetected:true,")
          test_path.write_text(test)
          PY
      - name: Prove exact branch behavior
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify-file-first-response.mjs
          node verify-file-first-operator.mjs
          node verify-ingestion.mjs
          node verify.mjs
          test "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' ! -name 'one-time-reconcile-file-first-guidance.yml' -print -quit)" = ""
      - name: Remove one-time scaffolding and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-reconcile-file-first-guidance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html verify-file-first-response.mjs .github/workflows/one-time-reconcile-file-first-guidance.yml
          git diff --cached --check
          git commit -m 'Bind file-first guidance to authoritative returned response bytes'
          git push origin HEAD:repair/full-spec-conformance-fcfc1c6
