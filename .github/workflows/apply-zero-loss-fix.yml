name: Apply zero-loss repair
on:
  push:
    branches: [fix/stage01-stage04-zero-loss-20260831]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated runtime corrections and permanent regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('workflow-engine.js')
          s=p.read_text()
          old="const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['incorporated into the job definition','retained as context','unresolved human-only','later-resolvable','inapplicable with reason']);"
          new="const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED']);\nconst LEGACY_INTAKE_DISPOSITION_MAP=Object.freeze({'INCORPORATED INTO THE JOB DEFINITION':'EXTRACTED_RELEVANT_INFORMATION','RETAINED AS CONTEXT':'RETAINED_AS_CONTEXT','UNRESOLVED HUMAN-ONLY':'UNRESOLVED_HUMAN_AUTHORITY','LATER-RESOLVABLE':'LATER_RESOLVABLE','INAPPLICABLE WITH REASON':'NO_PROJECT_RELEVANT_INFORMATION'});\nconst normalizeIntakeDisposition=value=>{const key=String(value??'').trim().toUpperCase();return LEGACY_INTAKE_DISPOSITION_MAP[key]||key;};"
          if old not in s: raise SystemExit('intake disposition target missing')
          s=s.replace(old,new,1)
          old="  for(const artifact of stageOneArtifacts){const artifactId=recordId(artifact,'artifacts'),filename=String(recordValue(artifact,'FILENAME')||artifactId),sha256=String(recordValue(artifact,'SHA256')||''),byteSize=Number(recordValue(artifact,'BYTE_SIZE')||0),availability=String(recordValue(artifact,'AVAILABILITY')||'UNKNOWN'),sourceLocation=`artifact.${artifactId}`,rawValueText=JSON.stringify({artifactId,filename,sha256,byteSize,availability}),rawValueSha256=hash.sha256Value(rawValueText),unitId=`INPUT-UNIT-${hash.sha256Value({inputVersion,kind:'SUPPLIED_MATERIAL',sourceLocation,rawValueSha256}).slice(0,20).toUpperCase()}`;units.push({unitId,kind:'SUPPLIED_MATERIAL',sourceLocation,label:`Supplied material ${filename}`,rawValueSha256,rawValueText,artifactId,filename,artifactSha256:sha256,byteSize,availability});}"
          new="  const suppliedArtifactText=project.projectData.userEntered?.suppliedArtifactText||{};\n  for(const artifact of stageOneArtifacts){\n    const artifactId=recordId(artifact,'artifacts'),filename=String(recordValue(artifact,'FILENAME')||artifactId),sha256=String(recordValue(artifact,'SHA256')||''),byteSize=Number(recordValue(artifact,'BYTE_SIZE')||0),availability=String(recordValue(artifact,'AVAILABILITY')||'UNKNOWN'),sourceLocation=`artifact.${artifactId}`,rawValueText=JSON.stringify({artifactId,filename,sha256,byteSize,availability}),rawValueSha256=hash.sha256Value(rawValueText),unitId=`INPUT-UNIT-${hash.sha256Value({inputVersion,kind:'SUPPLIED_MATERIAL',sourceLocation,rawValueSha256}).slice(0,20).toUpperCase()}`;\n    units.push({unitId,kind:'SUPPLIED_MATERIAL',sourceLocation,label:`Supplied material ${filename}`,rawValueSha256,rawValueText,artifactId,filename,artifactSha256:sha256,byteSize,availability});\n    const captured=suppliedArtifactText[artifactId];\n    if(captured&&typeof captured.text==='string')enumerateInputLeaves(captured.text,`${sourceLocation}.content`,'SUPPLIED_MATERIAL_CONTENT',`Supplied material content ${filename}`,units,{inputVersion,extra:{artifactId,filename,artifactSha256:sha256,byteSize,availability}});\n  }"
          if old not in s: raise SystemExit('Stage 01 artifact enumeration target missing')
          s=s.replace(old,new,1)
          old="    const disposition=String(unit?.disposition||'').trim().toLowerCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);if(disposition==='inapplicable with reason'&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires an inapplicability reason.`);\n    const statements=safe(unit?.extractedStatements);if(disposition!=='inapplicable with reason'&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;"
          new="    const disposition=normalizeIntakeDisposition(unit?.disposition);if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);const noRelevant=disposition==='NO_PROJECT_RELEVANT_INFORMATION',blocked=disposition==='INACCESSIBLE_OR_BLOCKED';if((noRelevant||blocked)&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires a reason for ${disposition}.`);\n    const statements=safe(unit?.extractedStatements);if(!noRelevant&&!blocked&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;"
          if old not in s: raise SystemExit('Stage 01 disposition validation target missing')
          s=s.replace(old,new,1)
          old="    if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&(disposition==='inapplicable with reason'?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);"
          new="    if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&((noRelevant||blocked)?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);"
          if old not in s: raise SystemExit('Stage 01 accounting target missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('prompt-engine.js')
          s=p.read_text()
          s=s.replace("const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/54';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/55';",1)
          old="Perform complete human-authority intake only. This is an actual conversational intake, not a JSON-form-filling exercise."
          new="Perform complete human-authority intake only. You are the first semantic reader of the human's arbitrary supplied project materials; before this stage the application owns raw custody, byte identity, and raw-unit enumeration only and has not semantically interpreted those files. This is an actual conversational intake, not a JSON-form-filling exercise. Perform two mandatory semantic passes before final JSON: Pass 1 reads the complete request and every accessible supplied artifact from beginning to end and extracts every distinct project-relevant human-origin statement. Pass 2 compares that ledger back against every raw input unit and deliberately searches for omitted qualifiers, exceptions, dependencies, negative requirements, do-not-change statements, visual constraints, temporal constraints, acceptance conditions, authority statements, tool restrictions, file references, output-format requirements, corrections, and later statements that override earlier statements. Resolve every omission before final JSON."
          if old not in s: raise SystemExit('Stage 01 first-reader target missing')
          s=s.replace(old,new,1)
          s=s.replace('\"disposition\":\"incorporated into the job definition|retained as context|unresolved human-only|later-resolvable|inapplicable with reason\"','\"disposition\":\"EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED\"',1)
          s=s.replace('\"reason\":\"optional concise reason\"','\"reason\":\"required for NO_PROJECT_RELEVANT_INFORMATION or INACCESSIBLE_OR_BLOCKED; otherwise optional\"',1)
          old="function assertStage4UpstreamExhausted(state){const fail=reason=>{const error=new Error(reason);error.code='STAGE4_UPSTREAM_INCOMPLETE';throw error;};const one=state?.stages?.[1],three=state?.stages?.[3];if(String(one?.status||'').toUpperCase()!=='COMPLETE'||one?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 01 human-authority intake is complete.');const intake=workflow.evaluateIntakeAccounting(state);if(!intake.complete)fail('Stage 04 cannot be generated because Stage 01 controlled-input accounting is incomplete: '+intake.reasons.join('; '));if(String(three?.status||'').toUpperCase()!=='COMPLETE'||three?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 03 research is complete.');const noSource=upper(state?.stages?.[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION||state?.stages?.[2]?.acceptedData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE';if(!noSource){const sources=safe(state?.projectData?.sources).filter(r=>r?.active!==false&&!r?.invalidatedBy),research=safe(state?.projectData?.research).filter(r=>r?.active!==false&&!r?.invalidatedBy),covered=new Set(research.map(r=>clean(recordValue(r,'SOURCE_ID')||r?.relationships?.SOURCE_ID)).filter(Boolean));for(const src of sources){const sid=recordId(src,'sources');if(sid&&!covered.has(sid))fail('Stage 04 cannot be generated because Stage 03 has not researched every current Stage 02 source.');}const d=three?.agentData||three?.acceptedData||{};if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED)))fail('Stage 04 cannot be generated until Stage 03 confirms all controlling sources were examined.');if(!['TRUE','YES','COMPLETE','COMPLETED'].includes(upper(d.SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED)))fail('Stage 04 cannot be generated until Stage 03 completes the second conflict and exception pass.');if(['TRUE','YES','FOUND','DETECTED'].includes(upper(d.NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS)))fail('Stage 04 cannot be generated while the latest Stage 03 pass found a new material requirement category.');}return true;}"
          new="function assertStage4UpstreamExhausted(state){const fail=reason=>{const error=new Error(reason);error.code='STAGE4_UPSTREAM_INCOMPLETE';throw error;};const one=state?.stages?.[1],three=state?.stages?.[3];if(String(one?.status||'').toUpperCase()!=='COMPLETE'||one?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 01 human-authority intake is complete.');const intake=workflow.evaluateIntakeAccounting(state);if(!intake.complete)fail('Stage 04 cannot be generated because Stage 01 controlled-input accounting is incomplete: '+intake.reasons.join('; '));if(String(three?.status||'').toUpperCase()!=='COMPLETE'||three?.gate?.complete===false)fail('Stage 04 cannot be generated until Stage 03 research is complete.');const noSource=upper(state?.stages?.[2]?.agentData?.SOURCE_APPLICABILITY_DETERMINATION||state?.stages?.[2]?.acceptedData?.SOURCE_APPLICABILITY_DETERMINATION)==='NO_APPLICABLE_EXTERNAL_SOURCE';if(!noSource){const derived=workflow.deriveStageData(state,3);if(!derived.ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED)fail('Stage 04 cannot be generated because application-derived Stage 03 source coverage is incomplete.');}return true;}"
          if old not in s: raise SystemExit('Stage 04 prerequisite target missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          for name in ['index.html','app-core.js','test-runtime.js']:
              p=Path(name)
              s=p.read_text()
              if 'runtime-20260830-live-operator-59' not in s: raise SystemExit(f'build token target missing in {name}')
              p.write_text(s.replace('runtime-20260830-live-operator-59','runtime-20260831-stage01-stage04-60'))
          PY

          cat > verify-stage01-stage04-zero-loss.mjs <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';
          globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};
          globalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);
          for(const file of ['workbook.js','hash.js','workflow-schema.js','test-runtime.js','workflow-engine.js','prompt-engine.js'])vm.runInThisContext(fs.readFileSync(file,'utf8'),{filename:file});
          const core=globalThis.closedLoopCore,engine=globalThis.closedLoopWorkflowEngine,prompts=globalThis.closedLoopPromptEngine,assert=(v,m)=>{if(!v)throw new Error(m);};
          const p=core.createBlankState('JOB-ZERO-LOSS-INTAKE');
          Object.assign(p.job,{JOB_TITLE:'Zero-loss intake proof',JOB_OWNER:'Operator',EXACT_USER_OBJECTIVE_VERBATIM:'Build exactly what I supplied without making me repeat it.',SUPPLIED_MATERIALS_INVENTORY:'intent.txt',REQUIRED_OUTPUT_FORMAT:'Working application',PROHIBITED_ACTIONS:'Do not change unrelated visuals. Do not ask me for the same project information twice.',EXPLICIT_USER_REQUIREMENTS:'Every later stage must reuse accepted Stage 01 project meaning.',CURRENT_INPUT_VERSION:'INPUT-v001',CURRENT_SOURCE_SET_VERSION:'SOURCE-SET-v001'});
          engine.ensureShape(p);
          p.projectData.artifacts.push({id:'ARTIFACT-000001',stage:1,active:true,scope:{inputVersion:'INPUT-v001'},fields:{ARTIFACT_ID:'ARTIFACT-000001',FILENAME:'intent.txt',MEDIA_TYPE:'text/plain',BYTE_SIZE:122,SHA256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',ROLE:'SUPPLIED_PROJECT_INPUT',AVAILABILITY:'BYTES_PERSISTED_AND_VERIFIED'},relationships:{},evidenceRefs:[]});
          p.stages[1].authorizedFiles=[{artifactId:'ARTIFACT-000001',filename:'intent.txt'}];
          p.projectData.userEntered.suppliedArtifactFiles={'ARTIFACT-000001':{artifactId:'ARTIFACT-000001',filename:'intent.txt',sha256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',byteSize:122,mediaType:'text/plain'}};
          p.projectData.userEntered.suppliedArtifactText={'ARTIFACT-000001':{artifactId:'ARTIFACT-000001',filename:'intent.txt',sha256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',byteSize:122,mediaType:'text/plain',text:'KEEP THE PROMPT BOX SIZE UNCHANGED.\nTHE USER SUPPLIES PROJECT INFORMATION ONCE.\nSTAGE 4 MUST USE ALL STAGE 1 AND STAGE 3 DATA.'}};
          const manifest=engine.intakeCoverageManifest(p),fileContent=manifest.units.filter(u=>u.kind==='SUPPLIED_MATERIAL_CONTENT');
          assert(fileContent.length===3,'Stored text file was not raw-unit enumerated.');
          assert(fileContent.some(u=>u.rawValueText==='KEEP THE PROMPT BOX SIZE UNCHANGED.'),'Visual constraint disappeared before semantic intake.');
          assert(fileContent.every(u=>u.artifactId==='ARTIFACT-000001'),'File content units lost artifact provenance.');
          const stage1=prompts.buildPromptRecord(1,p,{operation:'COMPLETE'});
          assert(stage1.prompt.includes('first semantic reader'),'Stage 01 lacks first-semantic-reader rule.');
          assert(stage1.prompt.includes('Pass 1')&&stage1.prompt.includes('Pass 2'),'Stage 01 lacks mandatory omission challenge.');
          assert(stage1.prompt.includes('KEEP THE PROMPT BOX SIZE UNCHANGED.'),'Stage 01 prompt omitted stored raw text content.');
          assert(stage1.prompt.includes('FILES YOU MUST RECEIVE')&&stage1.prompt.includes('ARTIFACT-000001'),'Stage 01 lost exact file handoff.');
          const capture={schema:'closed-loop-stage01-capture/1',inputVersion:manifest.inputVersion,manifestSha256:manifest.manifestSha256,units:manifest.units.map((u,i)=>({sourceUnitId:u.unitId,sourceRawValueSha256:u.rawValueSha256,disposition:'EXTRACTED_RELEVANT_INFORMATION',reason:'',extractedStatements:[{statementKey:`S${i+1}`,text:u.rawValueText,statementClass:u.kind==='SUPPLIED_MATERIAL_CONTENT'?'REQUIREMENT':'CONTEXT'}]}))};
          assert(engine.evaluateIntakeAccounting(p,{capture}).complete,'New Stage 01 accounting contract did not close.');
          assert(engine.evaluateIntakeAccounting(p,{capture:{...capture,units:capture.units.map(u=>({...u,disposition:'incorporated into the job definition'}))}}).complete,'Legacy accepted /3 intake became unreadable.');
          p.stages[1].agentData={EXACT_DELIVERABLE_REQUESTED:'A working application preserving every captured requirement.',ASSUMPTIONS:'NONE',UNKNOWN_INFORMATION:'NONE',INPUT_SET_CONTENTS:JSON.stringify(capture)};p.stages[1].status='COMPLETE';p.stages[1].gate={complete:true,blocked:false,reasons:[]};
          p.projectData.sources.push({id:'SOURCE-000001',stage:2,active:true,scope:{inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001'},fields:{SOURCE_ID:'SOURCE-000001',TITLE:'Controlling source'},relationships:{},evidenceRefs:[]});p.stages[2].agentData={SOURCE_APPLICABILITY_DETERMINATION:'APPLICABLE_SOURCES_ESTABLISHED'};p.stages[2].status='COMPLETE';p.stages[2].gate={complete:true,blocked:false,reasons:[]};
          p.projectData.research.push({id:'RESEARCH-000001',stage:3,active:true,scope:{inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001'},fields:{RESEARCH_ID:'RESEARCH-000001',SOURCE_ID:'SOURCE-000001',PASS_NUMBER:2,MANDATORY_STATEMENTS:'External rule from Stage 03.',RECOMMENDATIONS:'NONE',OPTIONAL_PRACTICES:'NONE',EXAMPLES:'NONE',EXPLANATORY_MATERIAL:'NONE',PROHIBITIONS:'External prohibition from Stage 03.',EXCEPTIONS:'NONE',DEPENDENCIES:'NONE',APPLICABILITY_FACTS:'Applies.',RESTRICTIONS:'NONE',INVALIDATING_MATERIAL:'NONE'},relationships:{SOURCE_ID:'SOURCE-000001'},evidenceRefs:[]});
          p.projectData.candidateRequirements.push({id:'CANDIDATE-REQ-000001',stage:3,active:true,scope:{inputVersion:'INPUT-v001',sourceSetVersion:'SOURCE-SET-v001'},fields:{CANDIDATE_REQ_ID:'CANDIDATE-REQ-000001',SOURCE_ID:'SOURCE-000001',CANDIDATE_OBLIGATION:'External candidate obligation from Stage 03.'},relationships:{SOURCE_ID:'SOURCE-000001'},evidenceRefs:[]});
          p.stages[3].agentData={SECOND_CONFLICT_AND_EXCEPTION_PASS_COMPLETED:'TRUE',LATEST_PASS_NUMBER:2,NEW_MATERIAL_CATEGORY_FOUND_IN_LATEST_PASS:'FALSE'};p.stages[3].status='COMPLETE';p.stages[3].gate={complete:true,blocked:false,reasons:[]};
          assert(engine.deriveStageData(p,3).ALL_KNOWN_CONTROLLING_SOURCES_EXAMINED===true,'Derived Stage 03 source coverage failed.');
          const stage4=prompts.buildPromptRecord(4,p,{operation:'COMPLETE'}),obligations=stage4.contextManifest.obligationManifest.items.map(x=>x.text);
          assert(stage4.prompt.includes('KEEP THE PROMPT BOX SIZE UNCHANGED.'),'Stage 04 lost file-derived Stage 01 meaning.');
          assert(stage4.prompt.includes('External rule from Stage 03.')&&stage4.prompt.includes('External candidate obligation from Stage 03.'),'Stage 04 lost Stage 03 data.');
          assert(stage4.contextManifest.executionHandoff.send.length===0,'Stage 04 requested repeat transfer of Stage 01 intent file.');
          for(const expected of ['KEEP THE PROMPT BOX SIZE UNCHANGED.','THE USER SUPPLIES PROJECT INFORMATION ONCE.','STAGE 4 MUST USE ALL STAGE 1 AND STAGE 3 DATA.','External rule from Stage 03.','External candidate obligation from Stage 03.'])assert(obligations.includes(expected),`Stage 04 omitted ${expected}`);
          console.log('verify-stage01-stage04-zero-loss: PASS');
          EOF

          # Restore the previously proven full CI/deploy/live-verification workflow, then include this regression.
          git show d8bbd7fb7a584babe5e68d3f1211087c5653ea53:.github/workflows/pages.yml > .github/workflows/pages.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml'); s=p.read_text()
          s=s.replace('          node --check verify-one-time-intent-intake.mjs\n','          node --check verify-one-time-intent-intake.mjs\n          node --check verify-stage01-stage04-zero-loss.mjs\n',1)
          s=s.replace('      - name: Verify canonical serialization and SHA-256\n','      - name: Verify Stage 01 raw-file semantic boundary and Stage 04 zero-loss carry-forward\n        run: node verify-stage01-stage04-zero-loss.mjs\n      - name: Verify canonical serialization and SHA-256\n',1)
          s=s.replace('node build-test-project.mjs && node verify-test-runtime.mjs && node verify-one-time-intent-intake.mjs &&','node build-test-project.mjs && node verify-test-runtime.mjs && node verify-one-time-intent-intake.mjs && node verify-stage01-stage04-zero-loss.mjs &&',1)
          s=s.replace("          node verify-one-time-intent-intake.mjs > /tmp/verify-one-time-intent-intake.out\n","          node verify-one-time-intent-intake.mjs > /tmp/verify-one-time-intent-intake.out\n          node verify-stage01-stage04-zero-loss.mjs > /tmp/verify-stage01-stage04-zero-loss.out\n",1)
          s=s.replace("          grep -q 'verify-one-time-intent-intake: PASS' /tmp/verify-one-time-intent-intake.out\n","          grep -q 'verify-one-time-intent-intake: PASS' /tmp/verify-one-time-intent-intake.out\n          grep -q 'verify-stage01-stage04-zero-loss: PASS' /tmp/verify-stage01-stage04-zero-loss.out\n",1)
          s=s.replace("              oneTimeIntentIntake:'verify-one-time-intent-intake.mjs',\n","              oneTimeIntentIntake:'verify-one-time-intent-intake.mjs',\n              stage01Stage04ZeroLoss:'verify-stage01-stage04-zero-loss.mjs',\n",1)
          p.write_text(s)
          PY

          rm -f .github/workflows/apply-zero-loss-fix.yml
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check app-core.js
          node --check test-runtime.js
          node --check verify-stage01-stage04-zero-loss.mjs
          node verify-stage01-stage04-zero-loss.mjs
          git diff --check
      - name: Commit repaired runtime and regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-engine.js prompt-engine.js index.html app-core.js test-runtime.js verify-stage01-stage04-zero-loss.mjs .github/workflows/pages.yml .github/workflows/apply-zero-loss-fix.yml
          git commit -m 'Enforce zero-loss Stage 01 intake and Stage 04 carry-forward'
          git push origin HEAD:${GITHUB_REF_NAME}
