          replace_once('response-ingestion.js',
          "stage:Number(stage),role:globalThis.closedLoopCore?.STAGES?.[Number(stage)-1]?.role||'UNKNOWN',contextId:'UNKNOWN',\n    iteration:project.job.CURRENT_ITERATION||'NOT APPLICABLE',runId:'NOT APPLICABLE',",
          "stage:Number(stage),role:globalThis.closedLoopCore?.STAGES?.[Number(stage)-1]?.role||'UNKNOWN',contextId:promptRecord.scope?.contextId||'NOT APPLICABLE',\n    iteration:promptRecord.scope?.iterationId||project.job.CURRENT_ITERATION||'NOT APPLICABLE',runId:promptRecord.scope?.runId||'NOT APPLICABLE',")
          replace_once('response-ingestion.js',
          "jobId:next.job.JOB_ID,stage,responseType:'DATA_PROPOSAL',operatorLabel:operator,identityAssurance:'SELF_ASSERTED',reviewNote,",
          "jobId:next.job.JOB_ID,stage,operation:proposal.envelope.operation,scope:clone(proposal.envelope.scope||{}),responseType:'DATA_PROPOSAL',operatorLabel:operator,identityAssurance:'SELF_ASSERTED',reviewNote,")

          replace_once('app-core.js',
          "engine.freezeCandidate(next,{artifactIds:selectedArtifactIds(),operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});",
          "engine.freezeCandidate(next,{stage:current.activeStage,artifactIds:selectedArtifactIds(),operatorLabel:$('#operator-label')?.value.trim()||'HUMAN_OPERATOR'});")
