  const prepared=ingestion.prepare(p,{stage,text:JSON.stringify(e),promptRecord:pr});assert(prepared.validation.valid,'Evidence-supported no-source response was rejected.');p=ingestion.commit(prepared.project,prepared.proposal.proposalId,{operator:'VERIFY'}).project;p.stages[1].status='COMPLETE';const result=engine.gate(2,p);assert(result.complete,`Valid no-source determination did not complete Stage 02: ${result.reasons.join('; ')}`);assert(p.job.CURRENT_SOURCE_SET_VERSION==='NOT APPLICABLE','No-source determination fabricated a source-set version.');
}

// Candidate freeze uses the owning stage and stamps the new iteration/candidate with their own identities.
{
  const p=project('JOB-STAGE-CORRECT-FREEZE');engine.registerArtifactBytes(p,{stage:17,artifactId:'ARTIFACT-FREEZE',filename:'candidate.bin',mediaType:'application/octet-stream',byteSize:1,sha256:'a'.repeat(64)});const frozen=engine.freezeCandidate(p,{stage:17,artifactIds:['ARTIFACT-FREEZE'],operatorLabel:'VERIFY'}),iterationId=engine.recordId(frozen.iteration,'iterations'),candidateId=engine.recordId(frozen.candidate,'candidateFreezes');assert(frozen.iteration.stage===17&&frozen.candidate.stage===17,'Candidate freeze was recorded against the wrong stage.');assert(frozen.iteration.scope.iterationId===iterationId&&frozen.iteration.scope.candidateId===candidateId&&frozen.candidate.scope.iterationId===iterationId&&frozen.candidate.scope.candidateId===candidateId,'Frozen iteration/candidate was stamped with prior scope.');
}

// Iteration-specific verification remains resolvable after a newer iteration becomes current.
{
  const p=project('JOB-ITERATION-SCOPE'),oldIteration='ITERATION-OLD',oldCandidate='CANDIDATE-OLD',newIteration='ITERATION-NEW',newCandidate='CANDIDATE-NEW';
  p.projectData.iterations.push({...record('iterations',10,{CANDIDATE_ID:oldCandidate,STATUS:'FROZEN'},oldIteration),scope:{iterationId:oldIteration,candidateId:oldCandidate}},{...record('iterations',17,{CANDIDATE_ID:newCandidate,STATUS:'FROZEN'},newIteration),scope:{iterationId:newIteration,candidateId:newCandidate}});p.projectData.candidateFreezes.push({...record('candidateFreezes',10,{ITERATION_ID:oldIteration,STATUS:'FROZEN'},oldCandidate),scope:{iterationId:oldIteration,candidateId:oldCandidate}},{...record('candidateFreezes',17,{ITERATION_ID:newIteration,STATUS:'FROZEN'},newCandidate),scope:{iterationId:newIteration,candidateId:newCandidate}});p.job.CURRENT_ITERATION=newIteration;
  const req=record('requirements',4,{OBLIGATION:'Scoped requirement',REQUIREMENT_TYPE:'FUNCTIONAL',MANDATORY_OPTIONAL_STATUS:'MANDATORY',APPLICABILITY:'APPLICABLE',OBSERVABLE_SATISFACTION_CONDITION:'yes',INTENDED_VERIFICATION_METHOD:'test',EXPECTED_EVIDENCE:'evidence',FAILURE_CONDITION:'failure',SEVERITY:'MAJOR',STATUS:'ACTIVE'},'REQ-SCOPED'),test=record('tests',6,{REQ_ID:'REQ-SCOPED',TEST_TYPE:'DETERMINISTIC',INPUTS:'input',TOOLS:'tool',PROCEDURE:'procedure',EXPECTED_RESULT:'SATISFIED',FAILURE_CONDITION:'failure',EVIDENCE_TO_PRESERVE:'evidence',STATUS:'READY'},'TEST-SCOPED'),run={...record('runs',11,{ITERATION_ID:oldIteration,CANDIDATE_ID:oldCandidate,CONTEXT_ID:'CONTEXT-SCOPED',CONTAMINATION_CHECK:'NONE',COMPLETE_OUTPUT:'output'},'RUN-SCOPED'),scope:{iterationId:oldIteration,candidateId:oldCandidate}},verification={...record('verification',12,{REQ_ID:'REQ-SCOPED',RUN_ID:'RUN-SCOPED',TEST_ID:'TEST-SCOPED',INDEPENDENCE_STATUS:'INDEPENDENT',EXACT_EVIDENCE:'evidence',DETERMINATION:'SATISFIED'},'VERIFICATION-SCOPED'),scope:{iterationId:oldIteration,candidateId:oldCandidate}};test.relationships={REQ_ID:'REQ-SCOPED'};verification.relationships={REQ_ID:'REQ-SCOPED',RUN_ID:'RUN-SCOPED',TEST_ID:'TEST-SCOPED'};p.projectData.requirements.push(req);p.projectData.tests.push(test);p.projectData.runs.push(run);p.projectData.verification.push(verification);const matrix=engine.verificationMatrix(p,oldIteration);assert(matrix.runs.length===1&&matrix.expected.length===1&&matrix.coverage===1,'Newer iteration scope hid the initial verification matrix.');
}

// Permanent regression/change records remain authoritative after a new candidate is frozen.
{
  const p=project('JOB-PERSISTENT-CORRECTION');p.stages[15].status='COMPLETE';p.projectData.acceptedChanges.push({changeId:'CHANGE-16',stage:16,status:'COMMITTED',responseType:'DATA_PROPOSAL'});const defect=record('defects',14,{OBSERVED_FAILURE:'failure',EXPECTED_CONDITION:'success',EVIDENCE:'evidence',SEVERITY:'MINOR',STATUS:'CONFIRMED'},'DEFECT-PERSISTENT'),change={...record('changes',16,{TRIGGERING_DEFECT_IDS:'DEFECT-PERSISTENT',ROOT_CAUSE_ANALYSIS:'rca',RESPONSIBLE_LAYER:'instruction',OLD_ARTIFACT_VERSION:'v1',EXACT_MODIFICATION:'fix',NEW_ARTIFACT_VERSION:'v2',DOWNSTREAM_INVALIDATION:'17+',REQUIRED_RERUNS:'17',INSTRUCTION_CHANGE_DETERMINATION:'UNCHANGED',REQUIRED_REPEATED_PREFLIGHT:'NONE',JUSTIFIED_UNCHANGED_ARTIFACTS:'none',EVIDENCE:'evidence'},'CHANGE-PERSISTENT'),scope:{iterationId:'ITERATION-OLD',candidateId:'CANDIDATE-OLD'}};p.projectData.defects.push(defect);p.projectData.changes.push(change);p.job.CURRENT_ITERATION='ITERATION-NEW';p.projectData.iterations.push({...record('iterations',17,{CANDIDATE_ID:'CANDIDATE-NEW',STATUS:'FROZEN'},'ITERATION-NEW'),scope:{iterationId:'ITERATION-NEW',candidateId:'CANDIDATE-NEW'}});const result=engine.gate(16,p);assert(result.complete,`New iteration hid the accepted Stage 16 correction: ${result.reasons.join('; ')}`);
}

