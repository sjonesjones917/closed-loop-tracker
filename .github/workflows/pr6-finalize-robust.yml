name: Finalize PR6 after exact source acceptance
on:
  push:
    branches: [practical-100/pr6-final]
permissions:
  contents: write
concurrency:
  group: pr6-finalize-robust
  cancel-in-progress: false
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact source acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -f verify-full-cycle.mjs
          test -f test-fixtures.mjs
          test -f verify-prompt-semantics.mjs
          for file in *.js *.mjs; do node --check "$file"; done
          node build-test-project.mjs
          node verify.mjs
          node verify-prompt-semantics.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Integrate required CI commands and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          text=p.read_text()
          for anchor, command in [
              ('node verify.mjs','node verify-prompt-semantics.mjs'),
              ('node verify-complete.mjs','node verify-full-cycle.mjs'),
          ]:
              if command in text:
                  continue
              pos=text.find(anchor)
              if pos < 0:
                  raise SystemExit(f'missing workflow insertion anchor: {anchor}')
              eol=text.find('\n',pos)
              prefix=text[text.rfind('\n',0,pos)+1:pos]
              text=text[:eol+1]+prefix+command+'\n'+text[eol+1:]
          p.write_text(text)
          PY
          rm -f PR6_FULL_CYCLE_DIAGNOSTIC.txt
          rm -f .github/workflows/pr6-finalize.yml .github/workflows/pr6-finalize-robust.yml .github/workflows/pr6-stage8-contract.yml .github/workflows/pr6-materialize.yml
      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR 6: complete deterministic acceptance proof"
          git push origin HEAD:practical-100/pr6-final
