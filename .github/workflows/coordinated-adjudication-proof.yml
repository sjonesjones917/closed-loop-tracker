name: Coordinated adjudication proof
on:
  push:
    branches: [semantic-adjudication-20260827]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply coordinated patch in runner only
        run: |
          node semantic-fixup.mjs
          node verification-trust-fixup.mjs
          node regression-adjudication-fixup.mjs
          node trace-adjudication-fixup.mjs
          node result-adapter-fixup.mjs
          node release-trust-fixup.mjs
          node regression-consumer-fixup.mjs
      - name: Syntax and retained architecture
        run: |
          node --check workflow-engine.js
          node --check workflow-schema.js
          node --check response-ingestion.js
          node --check verify-semantic-invariant.mjs
          node build-test-project.mjs
          node verify-hash.mjs
      - name: Universal false-acceptance invariant
        run: node verify-semantic-invariant.mjs
      - name: Retained verification suite
        run: node verify.mjs
      - name: Retained ingestion suite
        run: node verify-ingestion.mjs
      - name: Retained completion suite
        run: node verify-complete.mjs
      - name: Retained full lifecycle
        run: node verify-full-cycle.mjs
      - name: Retained prompt semantics
        run: node verify-prompt-semantics.mjs
      - name: Existing Chromium acceptance unchanged
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/adjudication-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
