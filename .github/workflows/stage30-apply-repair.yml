name: Stage 30 apply production repair

on:
  push:
    branches:
      - controller-v2/stage30-terminal-boundary-20260905

permissions:
  contents: write

jobs:
  apply-repair:
    if: contains(github.event.head_commit.message, 'activate Stage 30 production repair')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply and verify Stage 30 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, itertools, string

          expected = 'c48e910ba86709666c111fbeef0d692f7b8d6e8d0c0310dcfa52f22d8b8dc158'
          parts = sorted(Path('.stage30-patch').glob('part-*'))
          if [p.name for p in parts] != [f'part-{i:02d}' for i in range(6)]:
              raise SystemExit(f'unexpected Stage 30 patch parts: {[p.name for p in parts]}')
          texts = [''.join(p.read_text(encoding='ascii').split()) for p in parts]
          lengths = [len(x) for x in texts]
          print(f'patch part lengths: {lengths}')
          # part-03 is three characters shorter than the fixed 5000-character
          # slices used for the preceding payload parts. Recover exactly those
          # three transport characters from the independently recorded gzip
          # digest instead of guessing or weakening the digest check.
          if lengths != [5000,5000,5000,4997,5000,2444]:
              raise SystemExit(f'unexpected patch payload lengths: {lengths}')
          prefix_text = ''.join(texts[:4])
          suffix_text = ''.join(texts[4:])
          if len(prefix_text) % 4 != 1 or len(suffix_text) % 4 != 0:
              raise SystemExit('patch payload alignment is not the expected three-character truncation')
          fixed_prefix_text = prefix_text[:-1]
          dangling = prefix_text[-1]
          prefix_bytes = base64.b64decode(fixed_prefix_text, validate=True)
          suffix_bytes = base64.b64decode(suffix_text, validate=True)
          prefix_hash = hashlib.sha256()
          prefix_hash.update(prefix_bytes)
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
          recovered = None
          for chars in itertools.product(alphabet, repeat=3):
              missing = ''.join(chars)
              middle = base64.b64decode(dangling + missing, validate=True)
              h = prefix_hash.copy()
              h.update(middle)
              h.update(suffix_bytes)
              if h.hexdigest() == expected:
                  recovered = missing
                  break
          if recovered is None:
              raise SystemExit('unable to recover the three missing base64 transport characters from the pinned gzip digest')
          print('recovered three-character Stage 30 patch transport gap')
          encoded = prefix_text + recovered + suffix_text
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'reconstructed patch digest mismatch: {actual}')
          Path('/tmp/stage30-production.patch.gz').write_bytes(raw)
          print(f'patch base64 characters: {len(encoded)}; gzip bytes: {len(raw)}')
          PY
          echo 'c48e910ba86709666c111fbeef0d692f7b8d6e8d0c0310dcfa52f22d8b8dc158  /tmp/stage30-production.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/stage30-production.patch.gz > /tmp/stage30-production.patch
          git apply --check /tmp/stage30-production.patch
          git apply /tmp/stage30-production.patch
          node --check workflow-engine.js
          node --check app-core.js
          node verify-stage30-terminal-mobile-boundary.mjs
          node verify-spec-grounded-route-oracle.mjs
          git config user.name 'closed-loop-controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-engine.js app-core.js
          git commit -m 'Stage 30: implement atomic terminal delivery boundary'
          git push origin HEAD:${GITHUB_REF_NAME}
