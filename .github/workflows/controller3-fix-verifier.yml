name: Repair prompt identity regression oracle
on:
  push:
    branches: [controller3-prompt-byte-identity-rerun-20260904]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: controller3-prompt-byte-identity-rerun-20260904
      - name: Repair and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify.mjs'); s=p.read_text(); old="'STRICT RESPONSE CONTRACT'"; new="'RESPONSE CONTRACT DEFINITIONS'"
          if old not in s: raise SystemExit('stale verifier anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/controller3-fix-verifier.yml
          node --check verify.mjs
          node build-test-project.mjs
          node verify.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Align prompt identity verifier with canonical file contract'
          git push origin HEAD:controller3-prompt-byte-identity-rerun-20260904
