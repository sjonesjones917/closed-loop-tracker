name: Transplant proven file-first path onto current main
on:
  pull_request:
    branches: [main]
    paths:
      - SOURCE_EXPORT_REQUEST.txt
      - .github/workflows/transplant-file-first-current-main.yml
permissions:
  contents: write
jobs:
  transplant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/full-spec-conformance-fcfc1c6
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebase ratchet input on exact current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge --no-edit origin/main
      - name: Transplant exact merge-tested file-first owners without overwriting reservation work
        run: |
          set -euo pipefail
          FILEFIRST=4ffb6dbe7b8139cabce4e15e8b6fa05396e9ea3e
          BASE=fcfc1c640a03bce10bb762c3b704b2ec6bbb0b9a
          git fetch --no-tags origin "$FILEFIRST"
          git checkout "$FILEFIRST" -- \
            app-core.js \
            build-test-project.mjs \
            index.html \
            project-store.js \
            response-ingestion.js \
            verify-browser-extra.mjs \
            verify-browser.mjs \
            verify-file-first-operator.mjs \
            verify-file-first-response.mjs \
            verify-ingestion.mjs \
            verify-prompt-semantics.mjs \
            verify.mjs
          git show "$BASE":workflow-engine.js >/tmp/workflow-engine.base.js
          git show "$FILEFIRST":workflow-engine.js >/tmp/workflow-engine.filefirst.js
          git merge-file workflow-engine.js /tmp/workflow-engine.base.js /tmp/workflow-engine.filefirst.js
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' workflow-engine.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text()
          old='const operationSelection={},runSelection={};'
          new='const operationSelection={},runSelection={},responseFileSelection={};'
          if new not in s:
              if s.count(old)!=1:
                  raise SystemExit('Expected exactly one response-file selection declaration target')
              s=s.replace(old,new)
          old_mode="if(requests.length||n===1&&!current.stages[1].responseDraft)return `<div class=\"notice\"><strong>Continue the external conversation.</strong><br>Do not paste the conversation into the application. Continue until you receive one final strict JSON response file.</div>`;"
          new_mode="if(requests.length||n===1&&!current.stages[1].responseDraft)return `<div class=\"notice\"><strong>Continue talking to the agent. Do not import a final response file yet.</strong><br>Do not paste the conversation into the application. Continue until the agent has enough information to return the final response file.</div>`;"
          if old_mode not in s:
              raise SystemExit('Expected Stage 01 conversation-mode text target is missing')
          s=s.replace(old_mode,new_mode)
          final_old="return `<div class=\"notice\"><strong>Obtain the final response.json file for this current instruction.</strong><br>Select that exact JSON file below. The application stages, hashes, re-reads, and preserves its bytes before parsing. If the response declares returned files, select those exact files into their named slots before acceptance.</div>`;"
          final_new="return `<div class=\"notice\"><strong>The agent should now return one final JSON response file. Select that file below.</strong><br>The application stages, hashes, re-reads, and preserves its bytes before parsing. If the response declares returned files, select those exact files into their named slots before acceptance.</div>`;"
          if final_old not in s:
              raise SystemExit('Expected final-response mode text target is missing')
          s=s.replace(final_old,final_new)
          p.write_text(s)

          p=Path('verify-file-first-operator.mjs')
          s=p.read_text()
          assertion="  assert.match(appSource,/const operationSelection=\\{\\},runSelection=\\{\\},responseFileSelection=\\{\\};/,'The file-first UI must retain declared response-file selection state before wiring change and process handlers.');\n"
          if assertion not in s:
              anchor="  assert.match(appSource,/id=\"response-json-file\"[^>]*type=\"file\"[^>]*accept=\"[^\"]*(?:application\\/json|\\.json)/,'The normal external-response path must expose the authoritative JSON file selector.');\n"
              if anchor not in s:
                  raise SystemExit('File-first regression anchor missing')
              s=s.replace(anchor,anchor+assertion)
              mutation="assert.throws(()=>verify({appSource:app.replace('const operationSelection={},runSelection={},responseFileSelection={};','const operationSelection={},runSelection={};')}),/declared response-file selection state/);\n"
              first="assert.throws(()=>verify({appSource:app.replace('id=\"response-json-file\" type=\"file\"','id=\"response-json-file\" type=\"text\"')}),/authoritative JSON file selector/);\n"
              if first not in s:
                  raise SystemExit('File-first mutation anchor missing')
              s=s.replace(first,first+mutation)
              s=s.replace('mutationsDetected:6','mutationsDetected:7')
          p.write_text(s)

          p=Path('verify-browser.mjs')
          s=p.read_text()
          old="'Select the exact response.json file returned by the agent'"
          new="'Continue talking to the agent. Do not import a final response file yet.'"
          if old not in s:
              raise SystemExit('Expected stale Stage 01 browser oracle is missing')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Prove combined reservation and file-first ratchet
        run: |
          set -euo pipefail
          node --check app-core.js
          node --check workflow-engine.js
          node verify-reservation-contract.mjs
          node verify-file-first-operator.mjs
          node verify-v3-contract.mjs
          node verify-spec3-contract.mjs
          node verify-ingestion.mjs
          node verify-prompt-semantics.mjs
          node verify.mjs
      - name: Prove exact visible Stage 01 and malformed-response path
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-file-first-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Commit whole ratchet step and remove scaffold
        run: |
          set -euo pipefail
          rm -f SOURCE_EXPORT_REQUEST.txt .github/workflows/transplant-file-first-current-main.yml
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No ratchet diff produced'; exit 1; }
          git commit -m "Make current external response path file-first"
          git push origin HEAD:repair/full-spec-conformance-fcfc1c6
