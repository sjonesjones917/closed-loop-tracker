name: Nested review scroll controls fix

on:
  push:
    branches:
      - fix/nested-review-scroll-controls-20260827

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nested-review-scroll-controls-20260827
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal nested review correction
        run: node .tmp-nested-review-scroll-controls.mjs
      - name: Verify complete application and nested review behavior
        shell: bash
        run: |
          node --check hash.js
          node --check verify-browser.mjs
          node build-test-project.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
      - name: Commit only the verified minimal correction
        shell: bash
        run: |
          rm .github/workflows/nested-review-scroll-controls-fix.yml .tmp-nested-review-scroll-controls.mjs
          git config user.name sjonesjones917
          git config user.email sjones.jones917@gmail.com
          git add -A
          git commit -m "Show review controls for nested long proposal content"
          git push origin HEAD:fix/nested-review-scroll-controls-20260827
