name: Repair Stage 04 prompt authority
on:
  push:
    branches: [fix/monotonic-zero-loss-20260831]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monotonic-zero-loss-20260831
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal Stage 04 authority correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prompt-engine.js')
          text=p.read_text(encoding='utf-8')
          old='APPLICATION OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION'
          new='APPLICATION-OWNED STAGE 04 OBLIGATION MANIFEST — ACCOUNT FOR EVERY OBLIGATION'
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit(f'expected one Stage 04 manifest heading, found {text.count(old)}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          node --check prompt-engine.js
          node verify-spec3-contract.mjs
      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-stage4-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prompt-engine.js .github/workflows/repair-stage4-authority.yml
          git diff --cached --check
          git commit -m "Bind Stage 04 obligation manifest to application authority"
          git push origin HEAD:fix/monotonic-zero-loss-20260831
