name: Apply the minimal Stage 04 conversation-material repair

on:
  push:
    branches:
      - fix/stage04-conversation-material-handoff

permissions:
  contents: write

concurrency:
  group: stage04-conversation-material-handoff
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate the exact current main before applying the repair
        run: |
          git config user.name "closed-loop-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the forward-only Stage 04 repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.repair-stage04-context-handoff.mjs')
          source=path.read_text()
          anchor_token="${n===4?artifactControlMarkup(n,locked):''}"
          if source.count(anchor_token)!=2:
              raise SystemExit(f'Expected two stale Stage 04 artifact-control anchor tokens in repair script; found {source.count(anchor_token)}')
          source=source.replace(anchor_token,'')
          old_runtime_token='runtime-4f8b7c2d1a6e9f30'
          new_runtime_token='runtime-753fd50defa181f3'
          if source.count(old_runtime_token)!=1:
              raise SystemExit(f'Expected one provisional runtime token in repair script; found {source.count(old_runtime_token)}')
          source=source.replace(old_runtime_token,new_runtime_token)
          old_assert="  if(withOptionalAppCopy.bodySha256!==withoutAppCopy.bodySha256||withOptionalAppCopy.contextSignature!==withoutAppCopy.contextSignature)throw new Error('Optional browser custody incorrectly controls or invalidates the Stage 04 external-conversation prompt.');"
          new_assert="  for(const token of ['No second upload into the application is required','already attached and readable in this external conversation'])if(!withOptionalAppCopy.prompt.includes(token))throw new Error('Optional browser custody weakened the Stage 04 same-conversation instruction: '+token);\n  if(withOptionalAppCopy.prompt.includes('FILES YOU MUST RECEIVE'))throw new Error('Optional application custody became a required external handoff.');"
          if source.count(old_assert)!=1:
              raise SystemExit(f'Expected one overbroad optional-custody prompt assertion in repair script; found {source.count(old_assert)}')
          source=source.replace(old_assert,new_assert)
          old_external="[4,11,12,17,19,21,23,24,25].includes(stage)"
          new_external="[11,12,17,19,21,23,24,25].includes(stage)"
          if source.count(old_external)!=1:
              raise SystemExit(f'Expected one redundant Stage 04 response-handoff route in repair script; found {source.count(old_external)}')
          source=source.replace(old_external,new_external)
          old_expect="  assert(handoff.expectBack.some(item=>item.kind==='STRUCTURED_RESPONSE'&&item.required),'Stage 04 handoff omitted the final structured response.');"
          new_expect="  assert(handoff.send.length===0&&handoff.expectBack.length===0,'Stage 04 material reference incorrectly became a duplicate transport contract.');"
          if source.count(old_expect)!=1:
              raise SystemExit(f'Expected one redundant Stage 04 response-handoff assertion in repair script; found {source.count(old_expect)}')
          source=source.replace(old_expect,new_expect)
          old_layout="fileVisible:Boolean(file?.getClientRects().length)"
          new_layout="fileNested:Boolean(optional&&file&&optional.contains(file)&&Boolean(file.closest('.record-body'))),summaryVisible:Boolean(optional?.querySelector('summary')?.getClientRects().length)"
          if source.count(old_layout)!=1:
              raise SystemExit(f'Expected one stale browser visibility probe in repair script; found {source.count(old_layout)}')
          source=source.replace(old_layout,new_layout)
          old_condition="&&!stage04Layout.fileVisible&&!stage04Layout.overflow"
          new_condition="&&stage04Layout.fileNested&&stage04Layout.summaryVisible&&!stage04Layout.overflow"
          if source.count(old_condition)!=1:
              raise SystemExit(f'Expected one stale browser visibility assertion in repair script; found {source.count(old_condition)}')
          source=source.replace(old_condition,new_condition)
          path.write_text(source)
          PY
          node .repair-stage04-context-handoff.mjs
      - name: Remove one-time repair infrastructure before verification
        run: rm -f .repair-stage04-context-handoff.mjs .github/workflows/stage04-context-handoff-repair.yml
      - name: Verify changed source syntax
        run: |
          node --check app-core.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check verify-complete.mjs
          node --check verify-prompt-semantics.mjs
          node --check verify-browser.mjs
          git diff --check
      - name: Run the complete deterministic verification suite
        run: |
          node build-test-project.mjs
          node verify-test-runtime.mjs
          node verify-hash.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
          node verify-semantic-invariant.mjs
          node verify-definition-of-done.mjs
          node verify-project-lifecycle.mjs
      - name: Run local Chromium acceptance
        run: |
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chrome || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 >/tmp/closed-loop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify-browser.mjs
          node verify-browser-extra.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Prove temporary repair files are gone
        run: |
          test ! -e .repair-stage04-context-handoff.mjs
          test ! -e .github/workflows/stage04-context-handoff-repair.yml
          test -z "$(find . -maxdepth 1 -type f -name '.repair-*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*repair*' -print -quit)"
      - name: Commit the verified source-only repair
        run: |
          git add -A
          git status --short
          git commit -m "Repair Stage 04 external material handoff [stage04-context-handoff-applied]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
