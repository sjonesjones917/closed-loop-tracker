name: Stage 01 self-staleness repair

on:
  push:
    branches: [fix/stage01-atomic-intake-self-staleness-20260909]
    paths:
      - repair-stage01-self-staleness.mjs
      - .github/workflows/stage01-self-staleness-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply responsible-layer repair
        run: |
          set -euo pipefail
          node repair-stage01-self-staleness.mjs
          node --check workflow-engine.js
          node --check verify-human-authority-roundtrip.mjs
          git diff --check
      - name: Run Stage 01 and ingestion regressions
        run: |
          set -euo pipefail
          node verify-human-authority-roundtrip.mjs
          node verify-stage01-intake-closure.mjs
          node verify-one-time-intent-intake.mjs
          node verify-zero-loss-accounting.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
      - name: Publish clean state repair
        run: |
          set -euo pipefail
          rm repair-stage01-self-staleness.mjs .github/workflows/stage01-self-staleness-repair.yml .github/workflows/stage01-self-staleness-repro.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(find .github/workflows -maxdepth 1 -type f ! -name 'pages.yml' -print -quit)"
          git commit -m 'Fix Stage 01 atomic intake accounting self-staleness'
          git push origin HEAD:refs/heads/fix/stage01-atomic-intake-self-staleness-20260909
