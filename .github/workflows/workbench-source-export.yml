name: Workbench source export
on:
  push:
    branches: [workbench/pr6-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checked-out source
        run: |
          rm -rf .git
          zip -qr source.zip . -x source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-source
          path: source.zip
          if-no-files-found: error
          retention-days: 1
