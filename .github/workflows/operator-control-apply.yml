name: Apply minimal operator-control recovery closure
on:
  push:
    branches:
      - reliability/operator-control-recovery-current-20260826
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/operator-control-recovery-current-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact minimum changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_line(text,prefix,new_line):
              lines=text.splitlines(); hits=[i for i,x in enumerate(lines) if x.startswith(prefix)]
              if len(hits)!=1: raise SystemExit(f'{prefix}: expected one match, found {len(hits)}')
              lines[hits[0]]=new_line
              return '\n'.join(lines)+'\n'

          p=Path('app-core.js'); s=p.read_text()
          s=replace_line(s,'function overview(){',"function overview(){const currentStage=Math.max(1,Math.min(30,Number(String(current.job.CURRENT_STAGE||'').match(/\\d+/)?.[0]||1))),done=completion(),blockers=engine.openBlockers(current).length;return `<div class=\"hero project-hero\"><div class=\"hero-top\"><div><h2>${esc(current.job.JOB_TITLE)}</h2><p>${esc(current.job.JOB_ID)}</p></div><span class=\"status ${statusClass(current.job.CURRENT_STATE)}\">${esc(current.job.CURRENT_STATE)}</span></div><div class=\"facts overview-counts\"><div class=\"fact\"><strong>${done}/30</strong><span>Completed</span></div><div class=\"fact\"><strong>${String(currentStage).padStart(2,'0')}</strong><span>Current stage</span></div><div class=\"fact\"><strong>${safe(current.projectData.generatedPrompts).length}</strong><span>Instructions</span></div><div class=\"fact\"><strong>${safe(current.projectData.generatedOutputs).length}</strong><span>Outputs</span></div></div></div><div class=\"panel next-action-panel\"><h2 class=\"section-title\">Next required action</h2><div class=\"notice\">${esc(current.job.NEXT_REQUIRED_ACTION||'No next action recorded.')}</div><div class=\"button-row overview-actions\"><button class=\"primary\" data-stage=\"${currentStage}\">Continue current stage</button></div></div>${blockers?`<div class=\"notice warn\">${blockers} open mandatory blocker${blockers===1?'':'s'} affect progression.</div>`:''}<div class=\"panel completed-work-panel\"><h2 class=\"section-title\">Completed work</h2>${stageList(core.STAGES.filter(d=>current.stages[d.number].status==='COMPLETE'))}</div>`;}")

          controls=[x for x in s.splitlines() if x.startswith('function controls(d,locked){')]
          if len(controls)!=1: raise SystemExit('controls source mismatch')
          c=controls[0]
          if "runBatch=[11,17,19].includes(n)" not in c: raise SystemExit('runBatch source mismatch')
          c=c.replace("runBatch=[11,17,19].includes(n)","runBatch=n===11||([17,19].includes(n)&&selectedOperation(n)==='EXECUTE_RUN'),humanBlockers=engine.openBlockers(current,n).filter(x=>x.source==='HUMAN_DECISION')",1)
          needle="</button></div>${allowFresh?"
          insert="</button></div>${humanBlockers.length?`<div class=\"field\"><label>Resolution evidence for human-created blocker</label><textarea id=\"blocker-resolution-evidence\"></textarea></div>${humanBlockers.map(b=>`<div class=\"button-row\"><button data-resolve-blocker=\"${esc(engine.recordId(b,'blockers'))}\">Resolve ${esc(engine.recordId(b,'blockers'))}</button></div>`).join('')}`:''}${allowFresh?"
          if needle not in c: raise SystemExit('blocker-control insertion source mismatch')
          c=c.replace(needle,insert,1)
          s=replace_line(s,'function controls(d,locked){',c)

          add=[x for x in s.splitlines() if x.startswith('async function addBlocker(){')]
          if len(add)!=1: raise SystemExit('addBlocker source mismatch')
          resolver="async function resolveHumanBlocker(blockerId){const resolutionEvidence=$('#blocker-resolution-evidence')?.value.trim(),operatorLabel=$('#operator-label')?.value.trim()||'HUMAN_OPERATOR';if(!resolutionEvidence){alert('Resolution evidence is required before closing a human-created blocker.');$('#blocker-resolution-evidence')?.focus();return;}try{const next=clone(current);engine.resolveHumanBlocker(next,{blockerId,resolutionEvidence,operatorLabel});await persistReplacement(next);announce('human blocker resolved');render();}catch(error){alert(error.message||error);}}"
          if resolver not in s: s=s.replace(add[0],add[0]+'\n'+resolver,1)

          wire=[x for x in s.splitlines() if x.startswith('function wire(){')]
          if len(wire)!=1: raise SystemExit('wire source mismatch')
          w=wire[0]
          old="if($('#copy-prompt'))$('#copy-prompt').onclick=async()=>{const record=await savePromptRecord(current.activeStage);await navigator.clipboard?.writeText(record.prompt);announce('instruction saved and copied');};"
          new="if($('#copy-prompt'))$('#copy-prompt').onclick=async()=>{const record=await savePromptRecord(current.activeStage);try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard API unavailable.');await navigator.clipboard.writeText(record.prompt);announce('instruction saved and copied');}catch(error){console.error(error);announce('instruction saved; clipboard copy failed');}};"
          if old not in w: raise SystemExit('clipboard source mismatch')
          w=w.replace(old,new,1)
          old="if($('#add-blocker'))$('#add-blocker').onclick=addBlocker;if($('#add-fresh-context'))"
          new="if($('#add-blocker'))$('#add-blocker').onclick=addBlocker;document.querySelectorAll('[data-resolve-blocker]').forEach(b=>b.onclick=()=>resolveHumanBlocker(b.dataset.resolveBlocker));if($('#add-fresh-context'))"
          if old not in w: raise SystemExit('blocker wiring source mismatch')
          w=w.replace(old,new,1)
          s=replace_line(s,'function wire(){',w)

          load=[x for x in s.splitlines() if x.startswith('async function load(){')]
          if len(load)!=1: raise SystemExit('load source mismatch')
          l=load[0]
          old="await projectStore.ready;projects=(await projectStore.readAll()).filter(Boolean).map(normalize);let needsPersist=false;"
          new="await projectStore.ready;const savedSelectedProjectId=await projectStore.metaGet('selectedProject');projects=(await projectStore.readAll()).filter(Boolean).map(normalize);let needsPersist=false;"
          if old not in l: raise SystemExit('selected project read source mismatch')
          l=l.replace(old,new,1)
          old="if(!projects.length){projects=[ensureState(core.createBlankState(createUniqueJobId()))];needsPersist=true;}current=projects[0];if(needsPersist){const selectedId=current.job.JOB_ID;projects=await projectStore.writeAll(projects);current=projects.find(p=>p.job?.JOB_ID===selectedId)||projects[0];}"
          new="if(!projects.length){projects=[ensureState(core.createBlankState(createUniqueJobId()))];needsPersist=true;}current=projects.find(p=>p.job?.JOB_ID===savedSelectedProjectId)||projects[0];if(needsPersist){const selectedId=current.job.JOB_ID;projects=await projectStore.writeAll(projects);current=projects.find(p=>p.job?.JOB_ID===selectedId)||projects[0];await projectStore.metaPut('selectedProject',current.job.JOB_ID);}"
          if old not in l: raise SystemExit('selected project restore source mismatch')
          l=l.replace(old,new,1)
          s=replace_line(s,'async function load(){',l)
          picker="$('#project-picker').onchange=e=>{current=projects[Number(e.target.value)];render();};"
          if picker not in s: raise SystemExit('project picker source mismatch')
          s=s.replace(picker,"$('#project-picker').onchange=async e=>{current=projects[Number(e.target.value)];await projectStore.metaPut('selectedProject',current.job.JOB_ID);render();};",1)
          p.write_text(s)

          p=Path('workflow-engine.js'); s=p.read_text()
          marker='function registerFreshContext'
          pos=s.index(marker)
          resolver_engine="""function resolveHumanBlocker(project,{blockerId,resolutionEvidence,operatorLabel='HUMAN_OPERATOR'}={}){\n  ensureShape(project);const id=String(blockerId||'').trim(),evidence=String(resolutionEvidence||'').trim();if(!id)throw new Error('A blocker identity is required.');if(!evidence)throw new Error('Resolution evidence is required.');const blocker=records(project,'blockers',{active:false}).find(record=>recordId(record,'blockers')===id);if(!blocker)throw new Error(`Blocker ${id} does not exist.`);if(blocker.source!=='HUMAN_DECISION')throw new Error('Only independently human-created blockers may be resolved by this human authority control.');if(!isActiveRecord(blocker)||!['OPEN','BLOCKED','IN PROGRESS','UNKNOWN'].includes(upper(recordValue(blocker,'STATUS')||'OPEN')))throw new Error(`Blocker ${id} is not open.`);\n  const updates={STATUS:'RESOLVED',RESOLUTION_EVIDENCE:evidence,CLOSURE:'CLOSED',REEVALUATION:'COMPLETED',REQUIRED_REVALIDATION:'RECALCULATED'};blocker.fields=blocker.fields&&typeof blocker.fields==='object'?blocker.fields:{};for(const [key,value] of Object.entries(updates)){blocker.fields[key]=value;blocker[key]=value;}blocker.updatedAt=now();blocker.resolvedBy=operatorLabel;blocker.identityAssurance='SELF_ASSERTED';blocker.contentSha256=hash.contentRecordSha256?hash.contentRecordSha256(blocker,'BLOCKER_ID'):hash.sha256Value(blocker.fields);blocker.recordSha256=hash.recordSha256?hash.recordSha256(blocker):hash.sha256Value(blocker);blocker.sha256=blocker.recordSha256;addHistory(project,'HUMAN_BLOCKER_RESOLVED',{stage:Number(blocker.stage||0),recordId:id,operatorLabel,identityAssurance:'SELF_ASSERTED',resolutionEvidence:evidence});recalculate(project);return blocker;\n}\n"""
          if 'function resolveHumanBlocker(' not in s: s=s[:pos]+resolver_engine+s[pos:]
          start=s.index("function reserveRunBatch(project,{stage=project.activeStage,iterationId=null,candidateId=null,count=10}={}){")
          end=s.index('function registerArtifactBytes',start)
          reserve="""function reserveRunBatch(project,{stage=project.activeStage,iterationId=null,candidateId=null,count=10}={}){\n  ensureShape(project);if(count!==10)throw new Error('Run batches must contain exactly ten slots.');const resolvedIteration=iterationId||project.job.CURRENT_ITERATION;if(!resolvedIteration)throw new Error('A current iteration is required before reserving runs.');const stageNumber=Number(stage),existingRuns=records(project,'runs').filter(run=>Number(run.stage)===stageNumber&&String(recordValue(run,'ITERATION_ID')||run.scope?.iterationId||'')===String(resolvedIteration));\n  if(existingRuns.length){if(existingRuns.length!==count)throw new Error(`The current Stage ${String(stageNumber).padStart(2,'0')} iteration already contains ${existingRuns.length} active run slots; expected exactly ${count}. Resolve the partial or contradictory batch instead of allocating more.`);const existing=existingRuns.map(run=>{const runId=recordId(run,'runs'),contextId=String(recordValue(run,'CONTEXT_ID')||run.relationships?.CONTEXT_ID||'');const context=records(project,'freshContexts').find(item=>recordId(item,'freshContexts')===contextId&&String(recordValue(item,'ITERATION_ID')||item.scope?.iterationId||'')===String(resolvedIteration));if(!context)throw new Error(`Existing run ${runId} does not resolve to its active fresh-context slot.`);return {runId,contextId};});if(new Set(existing.map(item=>item.contextId)).size!==count)throw new Error('The existing run batch does not contain ten distinct active context slots.');return existing;}\n  const created=[];for(let i=0;i<count;i++){const context=commandRecord(project,'freshContexts',{EXTERNAL_CONTEXT_IDENTIFIER:'UNASSIGNED',ROLE:core.STAGES[stageNumber-1]?.role||'UNKNOWN',ITERATION_ID:resolvedIteration,RUN_ID:'PENDING',AUTHORIZED_PROJECT_INPUTS:project.job.CURRENT_INPUT_VERSION||'UNKNOWN',AUTHORIZED_EXTERNAL_SOURCE_MATERIAL:project.job.CURRENT_SOURCE_SET_VERSION||'NOT APPLICABLE',FROZEN_ARTIFACT_VERSIONS:'CURRENT AUTHORIZED VERSIONS',TOOL_AVAILABILITY:'UNKNOWN',CONTAMINATION_STATUS:'UNKNOWN',OUTPUT_IDENTITY:'UNKNOWN',DEVIATIONS:'NONE',EVIDENCE:'Application-reserved context slot.',USABILITY_DETERMINATION:'PENDING'},{stage:stageNumber,source:'APPLICATION_RESERVATION'});const run=commandRecord(project,'runs',{ITERATION_ID:resolvedIteration,CANDIDATE_ID:candidateId||'PENDING',CONTEXT_ID:context.id,FRESH_CONTEXT_RECORD:context.id,CONTAMINATION_CHECK:'PENDING',TOOL_CONFIGURATION:'PENDING',EXECUTION_STATUS:'RESERVED',COMPLETE_OUTPUT:''},{stage:stageNumber,source:'APPLICATION_RESERVATION'});context.fields.RUN_ID=context.RUN_ID=run.id;created.push({runId:run.id,contextId:context.id});}\n  addHistory(project,'RUN_BATCH_RESERVED',{stage:stageNumber,iterationId:resolvedIteration,count,slots:created});recalculate(project);return created;\n}\n"""
          s=s[:start]+reserve+s[end:]
          export_old='registerGeneratedPrompt,createHumanBlocker,registerFreshContext'
          if export_old not in s: raise SystemExit('engine export source mismatch')
          s=s.replace(export_old,'registerGeneratedPrompt,createHumanBlocker,resolveHumanBlocker,registerFreshContext',1)
          p.write_text(s)

          p=Path('verify-complete.mjs'); s=p.read_text(); marker="console.log(JSON.stringify({scopedAcceptedResultRefinement:true},null,2));"
          if marker not in s: raise SystemExit('verify-complete insertion marker missing')
          tests="""// Operator control recovery: run-batch reservation is idempotent and partial batches fail closed.\n{\n const p=project('JOB-RUN-BATCH-IDEMPOTENT');p.job.CURRENT_ITERATION='ITERATION-IDEMPOTENT';\n const first=engine.reserveRunBatch(p,{stage:17,iterationId:'ITERATION-IDEMPOTENT',candidateId:'CANDIDATE-IDEMPOTENT',count:10}),events=p.projectData.history.filter(x=>x.type==='RUN_BATCH_RESERVED').length;\n const second=engine.reserveRunBatch(p,{stage:17,iterationId:'ITERATION-IDEMPOTENT',candidateId:'CANDIDATE-IDEMPOTENT',count:10});\n assert(first.length===10&&second.length===10&&engine.records(p,'runs',{stage:17}).length===10&&engine.records(p,'freshContexts',{stage:17}).length===10,'Repeated run-batch reservation allocated duplicate slots.');assert(p.projectData.history.filter(x=>x.type==='RUN_BATCH_RESERVED').length===events,'Idempotent reservation created another reservation event.');\n engine.records(p,'runs',{stage:17})[0].active=false;let threw=false;try{engine.reserveRunBatch(p,{stage:17,iterationId:'ITERATION-IDEMPOTENT',candidateId:'CANDIDATE-IDEMPOTENT',count:10});}catch{threw=true;}assert(threw,'Partial active batch was silently topped up.');\n}\n\n// Human-created blockers have an authority-matched resolution path; agent blockers do not.\n{\n const p=project('JOB-HUMAN-BLOCKER-RESOLUTION'),human=engine.createHumanBlocker(p,{stage:1,reason:'Missing human prerequisite.',operatorLabel:'VERIFY'});assert(engine.openBlockers(p).some(x=>engine.recordId(x,'blockers')===human.id),'Human blocker did not open.');const resolved=engine.resolveHumanBlocker(p,{blockerId:human.id,resolutionEvidence:'Prerequisite supplied and reviewed.',operatorLabel:'VERIFY'});assert(engine.recordValue(resolved,'STATUS')==='RESOLVED'&&!engine.openBlockers(p).some(x=>engine.recordId(x,'blockers')===human.id),'Human blocker did not resolve.');\n const agent=record('blockers',1,{STATUS:'OPEN',CLOSURE:'OPEN'},'BLOCKER-AGENT');agent.source='APPLICATION_DISPOSITION';p.projectData.blockers.push(agent);let rejected=false;try{engine.resolveHumanBlocker(p,{blockerId:'BLOCKER-AGENT',resolutionEvidence:'not authorized',operatorLabel:'VERIFY'});}catch{rejected=true;}assert(rejected,'Human control resolved a non-human blocker.');\n}\n\n"""
          if 'JOB-RUN-BATCH-IDEMPOTENT' not in s: s=s.replace(marker,tests+marker,1)
          p.write_text(s)
          PY
      - name: Remove temporary executor before verification
        run: rm .github/workflows/operator-control-apply.yml
      - name: Verify complete deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          node build-test-project.mjs
          node --check app-core.js
          node --check workflow-engine.js
          node --check verify-complete.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
      - name: Commit permanent files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-core.js workflow-engine.js verify-complete.mjs TEST_PROJECT.json .github/workflows/operator-control-apply.yml
          git commit -m "Close remaining operator control recovery gaps"
          git push origin HEAD:reliability/operator-control-recovery-current-20260826
