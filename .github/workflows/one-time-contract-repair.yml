name: One-time prompt contract repair

on:
  push:
    branches: [repair/controlling-prompt-scope-closure]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/controlling-prompt-scope-closure
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact contract repairs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function read(file){return fs.readFileSync(file,'utf8');}
          function write(file,text){fs.writeFileSync(file,text,'utf8');}
          function replaceExact(text,from,to,label){
            const count=text.split(from).length-1;
            if(count!==1)throw new Error(`${label}: expected exactly one match, found ${count}`);
            return text.replace(from,to);
          }

          let prompt=read('prompt-engine.js');
          prompt=replaceExact(prompt,"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/58';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/59';",'prompt version');
          prompt=replaceExact(prompt,'return `COPY BLOCK — STAGE ${String(stage).padStart(2,\'0\')} — ${definition.title}\\n\\n','return `STAGE ${String(stage).padStart(2,\'0\')} — ${definition.title}\\n\\n','copy-block prefix');
          prompt=replaceExact(prompt,'- When the stage is ready, return exactly one complete strict JSON object and no surrounding prose. The human must never be asked to repair agent JSON. Use ASCII U+0022 double quotation marks, valid escaping, only contract-declared keys, and self-check that the final text parses as JSON before sending it.\\n','- When the stage is ready, create and return exactly one authoritative UTF-8 response.json file with media type application/json and no surrounding prose. The human must never be asked to repair agent JSON. Use ASCII U+0022 double quotation marks, valid escaping, only contract-declared keys, and self-check that the file parses as JSON before returning it.\\n','final response file instruction');
          prompt=replaceExact(prompt,'- Return one final strict JSON object only when ready for machine ingestion. Use ASCII quotation marks and no Markdown wrapper.\\n','- Return one final authoritative response.json file only when ready for machine ingestion. Use ASCII quotation marks and no Markdown wrapper. Echo promptIdentity, packageId, operationReservationId, challengeNonce, and scope exactly from manifest.json; do not calculate, rewrite, or infer those application-owned bindings.\\n','mandatory response file rule');
          prompt=replaceExact(prompt,'"disposition":"incorporated into the job definition|retained as context|unresolved human-only|later-resolvable|inapplicable with reason"','"disposition":"EXTRACTED_RELEVANT_INFORMATION|RETAINED_AS_CONTEXT|NO_PROJECT_RELEVANT_INFORMATION|UNRESOLVED_HUMAN_AUTHORITY|LATER_RESOLVABLE|INACCESSIBLE_OR_BLOCKED"','stage01 disposition contract');
          prompt=replaceExact(prompt,'END HASHED INSTRUCTION BODY`;','END AUTHORITATIVE INSTRUCTION`;','instruction terminator');
          const oldBuild=`  const bodyText=\`${'${UNTRUSTED_DATA_RULE}'}\\n\\n${'${refreshDataEnvelopes(aliasedBody)}'}\`;\n  const bodySha256=hash.sha256Text(bodyText);\n  const descriptor=responseContractDescriptor(stage,operation);\n  const contractSha256=hash.sha256Value(descriptor);\n  const same=activeExisting.find(x=>x.contextSignature===contextSignature&&x.bodySha256===bodySha256&&x.contractSha256===contractSha256&&x.operation===operation);\n  const instructionId=same?.instructionId||same?.promptId||\`INSTRUCTION-${'${String(state?.job?.JOB_ID||\'UNKNOWN\').replace(/[^A-Za-z0-9-]/g,\'\')}'}-S${'${String(stage).padStart(2,\'0\')}'}-${'${String(existing.length+1).padStart(3,\'0\')}'}\`;\n  const identityBlock=\`\\n\\nPROMPT IDENTITY — ECHO EXACTLY\\nINSTRUCTION_ID: ${'${instructionId}'}\\nBODY_SHA256: ${'${bodySha256}'}\\nCONTRACT_SHA256: ${'${contractSha256}'}\\nCONTEXT_SIGNATURE: ${'${contextSignature}'}\\nOPERATION: ${'${operation}'}\\nPROJECT_REVISION: ${'${scope.projectRevision}'}\\n\\nSTRICT RESPONSE CONTRACT\\n${'${responseContract(stage,operation,instructionId,bodySha256,contractSha256,contextSignature,publicScope,state?.job?.JOB_ID)}'}\\n\\nEND COPY BLOCK — STAGE ${'${String(stage).padStart(2,\'0\')}'}\`;\n  const prompt=bodyText+identityBlock;\n  return {instructionId,promptId:instructionId,promptEngineVersion:PROMPT_ENGINE_VERSION,stage,operation,role:definition.role,bodySha256,sha256:bodySha256,contractSha256,contextSignature,contextManifest,scope,scopeSha256:hash.sha256Value(scope),prompt,fullTextSha256:hash.sha256Text(prompt),promptInjectionBoundaryApplied:true,untrustedDataBoundaryVersion:UNTRUSTED_DATA_SCHEMA};`;
          const newBuild=`  const prompt=\`${'${UNTRUSTED_DATA_RULE}'}\\n\\n${'${refreshDataEnvelopes(aliasedBody)}'}\`.replace(/\\r\\n?/g,'\\n').replace(/\\n*$/,'')+'\\n';\n  const bodySha256=hash.sha256Text(prompt);\n  const descriptor=responseContractDescriptor(stage,operation);\n  const contractSha256=hash.sha256Value(descriptor);\n  const same=activeExisting.find(x=>x.contextSignature===contextSignature&&x.bodySha256===bodySha256&&x.contractSha256===contractSha256&&x.operation===operation);\n  const instructionId=same?.instructionId||same?.promptId||\`INSTRUCTION-${'${String(state?.job?.JOB_ID||\'UNKNOWN\').replace(/[^A-Za-z0-9-]/g,\'\')}'}-S${'${String(stage).padStart(2,\'0\')}'}-${'${String(existing.length+1).padStart(3,\'0\')}'}\`;\n  return {instructionId,promptId:instructionId,promptEngineVersion:PROMPT_ENGINE_VERSION,stage,operation,role:definition.role,bodySha256,sha256:bodySha256,contractSha256,contextSignature,contextManifest,scope,scopeSha256:hash.sha256Value(scope),prompt,fullTextSha256:bodySha256,promptInjectionBoundaryApplied:true,untrustedDataBoundaryVersion:UNTRUSTED_DATA_SCHEMA};`;
          prompt=replaceExact(prompt,oldBuild,newBuild,'self-referential prompt identity block');
          write('prompt-engine.js',prompt);

          let engine=read('workflow-engine.js');
          engine=replaceExact(engine,"const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['incorporated into the job definition','retained as context','unresolved human-only','later-resolvable','inapplicable with reason']);","const INTAKE_ACCOUNTING_DISPOSITIONS=Object.freeze(['EXTRACTED_RELEVANT_INFORMATION','RETAINED_AS_CONTEXT','NO_PROJECT_RELEVANT_INFORMATION','UNRESOLVED_HUMAN_AUTHORITY','LATER_RESOLVABLE','INACCESSIBLE_OR_BLOCKED']);",'Stage 01 disposition enum');
          const oldAccounting="const disposition=String(unit?.disposition||'').trim().toLowerCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);if(disposition==='inapplicable with reason'&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires an inapplicability reason.`);\n    const statements=safe(unit?.extractedStatements);if(disposition!=='inapplicable with reason'&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;";
          const newAccounting="const disposition=String(unit?.disposition||'').trim().toUpperCase();if(!INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition))reasons.push(`Stage 01 intake unit ${id} has an invalid disposition.`);const noStatementDisposition=['NO_PROJECT_RELEVANT_INFORMATION','INACCESSIBLE_OR_BLOCKED'].includes(disposition);if(disposition==='INACCESSIBLE_OR_BLOCKED'&&!String(unit?.reason||'').trim())reasons.push(`Stage 01 intake unit ${id} requires an inaccessible-or-blocked reason.`);if(source.kind==='SUPPLIED_MATERIAL'&&disposition==='INACCESSIBLE_OR_BLOCKED')reasons.push(`Stage 01 required supplied material ${id} remains inaccessible or blocked.`);\n    const statements=safe(unit?.extractedStatements);if(!noStatementDisposition&&!statements.length)reasons.push(`Stage 01 intake unit ${id} contains no extracted human-authority statement.`);const statementKeys=new Set();let statementsValid=true;";
          engine=replaceExact(engine,oldAccounting,newAccounting,'Stage 01 disposition validation');
          engine=replaceExact(engine,"if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&(disposition==='inapplicable with reason'?Boolean(String(unit?.reason||'').trim()):statements.length>0))accounted.add(id);","if(hashMatches&&INTAKE_ACCOUNTING_DISPOSITIONS.includes(disposition)&&statementsValid&&((['NO_PROJECT_RELEVANT_INFORMATION'].includes(disposition))||(['INACCESSIBLE_OR_BLOCKED'].includes(disposition)&&Boolean(String(unit?.reason||'').trim()))||(!noStatementDisposition&&statements.length>0)))accounted.add(id);",'Stage 01 accounted-unit predicate');
          write('workflow-engine.js',engine);

          for(const file of fs.readdirSync('.').filter(name=>name.endsWith('.mjs'))){
            let text=read(file);
            text=text.replaceAll("'incorporated into the job definition'","'EXTRACTED_RELEVANT_INFORMATION'");
            text=text.replaceAll('"incorporated into the job definition"','"EXTRACTED_RELEVANT_INFORMATION"');
            if(file==='verify-prompt-semantics.mjs'){
              const old=`const identityMarker='\\n\\nPROMPT IDENTITY — ECHO EXACTLY\\n';\nconst markerIndex=promptIdentityRecord.prompt.indexOf(identityMarker);\nassert(markerIndex>0,'Generated prompt is missing its identity block.');\nconst exactBody=promptIdentityRecord.prompt.slice(0,markerIndex);\nconst embeddedBodySha256=(promptIdentityRecord.prompt.match(/BODY_SHA256:\\s*([0-9a-f]{64})/i)||[])[1];\nassert(embeddedBodySha256===promptIdentityRecord.bodySha256,'Embedded BODY_SHA256 differs from the prompt record bodySha256.');\nassert(globalThis.closedLoopHash.sha256Text(exactBody)===promptIdentityRecord.bodySha256,'bodySha256 does not hash the exact displayed and copied instruction body.');\nassert(globalThis.closedLoopHash.sha256Text(promptIdentityRecord.prompt)===promptIdentityRecord.fullTextSha256,'fullTextSha256 does not hash the exact complete prompt.');`;
              const replacement=`assert(!promptIdentityRecord.prompt.includes('PROMPT IDENTITY — ECHO EXACTLY'),'Authoritative instruction.txt still embeds a prompt-identity block.');\nassert(!promptIdentityRecord.prompt.includes(promptIdentityRecord.bodySha256),'Authoritative instruction.txt embeds its own bodySha256.');\nassert(!promptIdentityRecord.prompt.includes(promptIdentityRecord.contractSha256),'Authoritative instruction.txt embeds its response-contract digest.');\nassert(!promptIdentityRecord.prompt.includes(promptIdentityRecord.contextSignature),'Authoritative instruction.txt embeds its context-signature digest.');\nassert(promptIdentityRecord.prompt.endsWith('\\n'),'Authoritative instruction.txt must end with one LF newline.');\nassert(!promptIdentityRecord.prompt.endsWith('\\n\\n'),'Authoritative instruction.txt must not gain an extra trailing newline.');\nassert(!promptIdentityRecord.prompt.includes('\\r'),'Authoritative instruction.txt must use LF line endings only.');\nassert(globalThis.closedLoopHash.sha256Text(promptIdentityRecord.prompt)===promptIdentityRecord.bodySha256,'bodySha256 does not hash the exact authoritative instruction.txt bytes.');\nassert(promptIdentityRecord.fullTextSha256===promptIdentityRecord.bodySha256,'A second prompt byte identity remains.');\nassert(promptIdentityRecord.prompt.includes('Echo promptIdentity, packageId, operationReservationId, challengeNonce, and scope exactly from manifest.json'),'Authoritative instruction does not direct the external actor to echo manifest-owned bindings.');`;
              text=replaceExact(text,old,replacement,'prompt identity regression');
            }
            write(file,text);
          }
          NODE
      - name: Prove repaired invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check prompt-engine.js
          node --check workflow-engine.js
          node verify-prompt-semantics.mjs
          node verify-stage01-intake-closure.mjs
          node verify-zero-loss-accounting.mjs
          node verify-file-first-operator.mjs
          ! grep -R "incorporated into the job definition" --include='*.js' --include='*.mjs' .
          ! grep -q "PROMPT IDENTITY — ECHO EXACTLY" prompt-engine.js
      - name: Commit repair and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-contract-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair authoritative prompt and Stage 01 accounting contracts"
          git push origin HEAD:repair/controlling-prompt-scope-closure
