name: One-time contract repair
on:
  push:
    branches:
      - repair/spec-conformance-20260902
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'repair/spec-conformance-20260902' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/spec-conformance-20260902
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply Test IR repair
        run: |
          node repair-test-ir.mjs
          node - <<'NODE'
          const fs=require('fs');
          const path='test-runtime.js';
          let text=fs.readFileSync(path,'utf8');
          const from="const port=(type,required=true,defaultValue)=>Object.freeze({type,required,...(arguments.length>2?{defaultValue}:{})});";
          const to="function port(type,required=true,defaultValue){return Object.freeze({type,required,...(arguments.length>2?{defaultValue}:{})});}";
          if(!text.includes(from))throw new Error('Port helper repair target not found.');
          fs.writeFileSync(path,text.replace(from,to));
          NODE
      - run: node --check test-runtime.js && node verify-test-ir-dag-contract.mjs
      - name: Commit repaired runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "Replace implicit Test IR pipeline with explicit DAG"
          git push origin HEAD:repair/spec-conformance-20260902
