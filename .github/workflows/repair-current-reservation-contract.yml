name: Repair current reservation contract
on:
  push:
    branches: [repair/spec-conformance-current-20260903]
    paths:
      - repair-current-reservation-contract.mjs
      - .github/workflows/repair-current-reservation-contract.yml
  pull_request:
    branches: [main]
    paths:
      - repair-current-reservation-contract.mjs
      - .github/workflows/repair-current-reservation-contract.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec-conformance-current-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node repair-current-reservation-contract.mjs
      - name: Normalize the generated Node verification harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('verify-reservation-contract.mjs')
          text = path.read_text()
          text = text.replace("globalThis.crypto=globalThis.crypto||await import('node:crypto').then(m=>m.webcrypto);\n", "")
          text = text.replace("globalThis.TextEncoder=globalThis.TextEncoder||await import('node:util').then(m=>m.TextEncoder);\n", "")
          marker = "import assert from 'node:assert/strict';\n"
          setup = "globalThis.Event=globalThis.Event||class Event{constructor(type){this.type=type;}};\nglobalThis.dispatchEvent=globalThis.dispatchEvent||(()=>true);\n"
          if setup not in text:
              if marker not in text:
                  raise SystemExit('reservation regression import marker not found')
              text = text.replace(marker, marker + setup, 1)
          path.write_text(text)
          PY
      - name: Run permanent reservation regression
        run: |
          set +e
          node verify-reservation-contract.mjs > /tmp/reservation-regression.log 2>&1
          status=$?
          cat /tmp/reservation-regression.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/reservation-regression.log reservation-regression-error.txt
            git config user.name "closed-loop-repair"
            git config user.email "closed-loop-repair@users.noreply.github.com"
            git add reservation-regression-error.txt
            git commit -m "Capture reservation regression failure"
            git push origin HEAD:repair/spec-conformance-current-20260903
            exit "$status"
          fi
      - run: node verify-v3-contract.mjs
      - run: node verify.mjs
      - name: Commit repaired implementation
        run: |
          rm -f reservation-regression-error.txt
          git config user.name "closed-loop-repair"
          git config user.email "closed-loop-repair@users.noreply.github.com"
          git add -A
          git commit -m "Conform operation reservation transaction contract"
          git push origin HEAD:repair/spec-conformance-current-20260903
