name: Apply Test IR runtime authority repair
on:
  push:
    branches: [fix/test-ir-runtime-authority-20260830]
    paths: [.github/workflows/apply-test-ir-runtime-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-ir-runtime-authority-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          # workflow-schema: keep response-shape metadata, but delegate executable semantics to the loaded runtime.
          p=Path('workflow-schema.js'); s=p.read_text()
          s=s.replace("operations:Object.freeze(['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','SELECT_JSON_PATH','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','BYTE_COMPARE','ASSERT_EXISTS','ASSERT_TYPE','ASSERT_EQ','ASSERT_NE','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL']),","operations:Object.freeze(['LOAD_ARTIFACT','READ_BYTES','DECODE_UTF8','PARSE_JSON','PARSE_CSV','PARSE_XML','SELECT_JSON_PATH','SELECT_XML','COUNT','SUM','MIN','MAX','SORT','UNIQUE','HASH_SHA256','REGEX','COMPARE','ASSERT_EQ','ASSERT_GT','ASSERT_GTE','ASSERT_LT','ASSERT_LTE','ASSERT_MATCH','ASSERT_CONTAINS','ASSERT_NOT_CONTAINS','ASSERT_SET_EQUAL','BYTE_COMPARE','ASSERT_EXISTS','ASSERT_TYPE','ASSERT_NE']),",1)
          s=s.replace("limits:Object.freeze({maxSteps:64,maxTextBytes:16777216,maxCollectionItems:100000,maxRegexLength:2000,maxCsvCells:250000})","limits:Object.freeze({maxTotalInputBytes:33554432,maxTextBytes:16777216,maxDecompressedBytes:67108864,maxSteps:128,maxSelectorDepth:32,maxParsedDepth:64,maxParsedNodes:250000,maxCollectionItems:100000,maxRegexPatternBytes:2048,maxRegexLength:2000,maxRegexInputBytes:2097152,maxCsvCells:250000,maxXmlNodes:100000,workerTimeoutMs:5000,maxArchiveExpansionBytes:67108864})",1)
          marker="function validateTestIRSpec(spec){\n  const issues=[];"
          if marker not in s: raise SystemExit('validateTestIRSpec anchor missing')
          s=s.replace(marker,"function validateTestIRSpec(spec){\n  const runtime=globalThis.closedLoopTestRuntime;if(runtime?.validateSpec)return runtime.validateSpec(spec);\n  const issues=[];",1)
          marker="function validateTestIRBindings(bindings){\n  const issues=[];"
          if marker not in s: raise SystemExit('validateTestIRBindings anchor missing')
          s=s.replace(marker,"function validateTestIRBindings(bindings){\n  const runtime=globalThis.closedLoopTestRuntime;if(runtime?.validateBindings)return runtime.validateBindings(bindings);\n  const issues=[];",1)
          p.write_text(s)

          # workflow-engine: the runtime is the single executor/capability authority.
          p=Path('workflow-engine.js'); s=p.read_text()
          old="function applicationTestCapabilities(){return Object.freeze([schema.TEST_IR.capability]);}\nfunction applicationTestSupported(test){return schema.validateTestIRTest(test).valid;}"
          new="function deterministicRuntime(){return globalThis.closedLoopTestRuntime||null;}\nfunction applicationTestCapabilities(){const runtime=deterministicRuntime();return runtime?.capabilities?runtime.capabilities():Object.freeze([]);}\nfunction applicationTestSupported(test){const runtime=deterministicRuntime();return Boolean(runtime?.supports&&runtime.supports(test));}"
          if old not in s: raise SystemExit('engine runtime authority anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("if(!test||!schema.validateTestIRTest(test).valid)throw new Error(`Test ${tid||'UNKNOWN'} is not a valid current application-native Test IR test.`);","if(!test||!applicationTestSupported(test))throw new Error(`Test ${tid||'UNKNOWN'} is not a valid current application-native Test IR test.`);",1)
          p.write_text(s)

          # prompt-engine: publish the real runtime grammar/contracts/limits and current binding candidates.
          p=Path('prompt-engine.js'); s=p.read_text()
          s=s.replace("const workflow=globalThis.closedLoopWorkflowEngine;\nconst PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/34';\nif(!core||!schema||!hash||!workflow)throw new Error('workbook.js, hash.js, workflow-schema.js, and workflow-engine.js must load before prompt-engine.js.');","const workflow=globalThis.closedLoopWorkflowEngine;\nconst testRuntime=globalThis.closedLoopTestRuntime;\nconst PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/35';\nif(!core||!schema||!hash||!workflow||!testRuntime)throw new Error('workbook.js, hash.js, workflow-schema.js, test-runtime.js, and workflow-engine.js must load before prompt-engine.js.');",1)
          helper="""function testIrAuthoringBlock(state){const artifacts=workflow.recordsForCurrentScope(state,'artifacts').filter(record=>workflow.isActiveRecord(record)).map(record=>({artifactId:recordId(record,'artifacts'),filename:String(recordValue(record,'FILENAME')||''),role:String(recordValue(record,'ROLE')||''),sha256:String(recordValue(record,'SHA256')||''),availability:String(recordValue(record,'AVAILABILITY')||'UNKNOWN')}));return `CLOSED LOOP TEST IR — APPLICATION-OWNED DETERMINISTIC LANGUAGE\nVersion: ${testRuntime.SPEC_VERSION}\nRegistered capability: ${testRuntime.CAPABILITY}\nRegistered operations: ${testRuntime.OPS.join(', ')}\nOPERATION ARGUMENT CONTRACTS\n${show(testRuntime.operationContracts())}\nRUNTIME LIMITS\n${show(testRuntime.LIMITS)}\nAVAILABLE CURRENT ARTIFACT BINDINGS\n${show(artifacts)}\nPERMITTED FUTURE/IMMUTABLE BINDING FORMS\n- Artifact: {\"kind\":\"ARTIFACT\",\"artifactId\":\"...\"} or a closed selector using source CURRENT_PRODUCT/CURRENT_SCOPE/EXPLICIT_ARTIFACT plus artifactRole or filename.\n- Immutable canonical value: {\"kind\":\"CANONICAL_VALUE\",\"canonicalKey\":\"application-selected key\",\"valueSha256\":\"application-bound sha256\"}; use only when the application publishes that key.\nUse EXECUTION_MODE = APPLICATION_DETERMINISTIC, REQUIRED_CAPABILITY = ${testRuntime.CAPABILITY}, EXECUTABLE_KIND = TEST_IR, EXECUTABLE_SPEC_VERSION = ${testRuntime.SPEC_VERSION}, plus a valid EXECUTABLE_SPEC and EXECUTABLE_INPUT_BINDINGS whenever the proposition can be represented faithfully. Otherwise use EXECUTABLE_KIND = NONE and route externally. Arbitrary JavaScript, Python, shell, eval, Function, dynamic imports, and network access are prohibited. Do not invent an operation, selector syntax, argument, binding, or runtime limit that is not published above.\n`; }\n"""
          anchor="function procedureFor(stage,operation){return operationSpecial?.[stage]?.[operation]||stageSpecial[stage];}\n"
          if anchor not in s: raise SystemExit('prompt helper anchor missing')
          if 'function testIrAuthoringBlock(' not in s:s=s.replace(anchor,anchor+helper,1)
          start="native=stage===6?`CLOSED LOOP TEST IR — APPLICATION-OWNED DETERMINISTIC LANGUAGE\\nVersion: ${schema.TEST_IR.version}"
          i=s.find(start)
          if i<0: raise SystemExit('native prompt block anchor missing')
          end=s.find("`:'';return `COPY BLOCK",i)
          if end<0: raise SystemExit('native prompt block end missing')
          s=s[:i]+"native=stage===6?testIrAuthoringBlock(state):'';return `COPY BLOCK"+s[end+len("`:'';return `COPY BLOCK"):]
          p.write_text(s)

          # response-ingestion: reject unsupported/unsafe Stage 06 native specs before proposal creation.
          p=Path('response-ingestion.js'); s=p.read_text()
          s=s.replace("const hash=globalThis.closedLoopHash;\nif(!schema||!workflow||!hash)throw new Error('workflow-schema.js, workflow-engine.js, and hash.js must load before response-ingestion.js.');","const hash=globalThis.closedLoopHash;\nconst testRuntime=globalThis.closedLoopTestRuntime;\nif(!schema||!workflow||!hash||!testRuntime)throw new Error('workflow-schema.js, test-runtime.js, workflow-engine.js, and hash.js must load before response-ingestion.js.');",1)
          anchor="        if(collection==='sources')for(const message of schema.sourceClassificationIssues(record.fields))issues.push(issue('INVALID_EXTERNAL_SOURCE',path,message));\n"
          insertion="""        if(collection==='tests'&&String(record.fields.EXECUTION_MODE||'').toUpperCase()==='APPLICATION_DETERMINISTIC'){const runtimeCheck=testRuntime.validateSpec(record.fields.EXECUTABLE_SPEC,record.fields.EXECUTABLE_INPUT_BINDINGS);for(const message of runtimeCheck.issues)issues.push(issue('INVALID_TEST_IR',`${path}/fields/EXECUTABLE_SPEC`,message));if(String(record.fields.REQUIRED_CAPABILITY||'')!==testRuntime.CAPABILITY)issues.push(issue('INVALID_TEST_IR_CAPABILITY',`${path}/fields/REQUIRED_CAPABILITY`,`Application deterministic tests require ${testRuntime.CAPABILITY}.`));if(String(record.fields.EXECUTABLE_KIND||'').toUpperCase()!=='TEST_IR')issues.push(issue('INVALID_TEST_IR_KIND',`${path}/fields/EXECUTABLE_KIND`,'Application deterministic tests require EXECUTABLE_KIND TEST_IR.'));if(record.fields.EXECUTABLE_SPEC_VERSION!==testRuntime.SPEC_VERSION)issues.push(issue('INVALID_TEST_IR_VERSION',`${path}/fields/EXECUTABLE_SPEC_VERSION`,`Expected ${testRuntime.SPEC_VERSION}.`));for(const [bindingName,binding] of Object.entries(record.fields.EXECUTABLE_INPUT_BINDINGS||{})){const artifactId=typeof binding==='string'?binding:String(binding?.artifactId||'');if(!artifactId)continue;const artifact=workflow.records(project,'artifacts',{active:true}).find(item=>workflow.recordId(item,'artifacts')===artifactId);if(!artifact)issues.push(issue('INVALID_TEST_IR_BINDING',`${path}/fields/EXECUTABLE_INPUT_BINDINGS/${pointerEscape(bindingName)}`,`Artifact binding ${artifactId} is not an active artifact in this project.`));}}\n"""
          if anchor not in s: raise SystemExit('ingestion test validation anchor missing')
          s=s.replace(anchor,anchor+insertion,1)
          p.write_text(s)

          # app-core: use test-runtime.js, not a second worker protocol.
          p=Path('app-core.js'); s=p.read_text()
          s=s.replace("engine.records(current,'tests').some(t=>engine.recordId(t,'tests')===item.testId&&schema.validateTestIRTest(t).valid)","engine.records(current,'tests').some(t=>engine.recordId(t,'tests')===item.testId&&globalThis.closedLoopTestRuntime?.supports(t))",1)
          old="const result=await executeTestWorker(engine.recordValue(test,'EXECUTABLE_SPEC'),artifactPayload);if(result?.status==='EXECUTION_FAILED')throw new Error(`${item.testId}: ${result.error||'deterministic execution failed'}`);"
          new="const runtime=globalThis.closedLoopTestRuntime;if(!runtime)throw new Error('The application Test IR runtime is unavailable.');const result=await runtime.executeTest(test,artifactPayload,{});if(result?.status==='EXECUTION_FAILED')throw new Error(`${item.testId}: ${result.failure?.message||'deterministic execution failed'}`);"
          if old not in s: raise SystemExit('native execution anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check prompt-engine.js
          node --check response-ingestion.js
          node --check app-core.js
          git diff --check
          git config user.name closed-loop-reliability-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/apply-test-ir-runtime-fix.yml
          git add workflow-schema.js workflow-engine.js prompt-engine.js response-ingestion.js app-core.js
          git commit -m 'Use Test IR runtime as the native execution authority'
          git push origin HEAD:fix/test-ir-runtime-authority-20260830
