name: Fix final specification workflow runner
on:
  push:
    branches: [fix/final-spec-conformance]
permissions:
  contents: write
jobs:
  patch-workflow:
    if: "!contains(github.event.head_commit.message, 'FIX-FINAL-SPEC-WORKFLOW-CRYPTO') && !contains(github.event.head_commit.message, 'FINAL-SPEC-PATCH-MATERIALIZED')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-spec-conformance
      - name: Correct Node crypto regression setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/final-spec-patch.yml')
          s=p.read_text()
          old="import fs from 'node:fs';import vm from 'node:vm';import {webcrypto} from 'node:crypto';globalThis.crypto=webcrypto;vm.runInThisContext"
          new="import fs from 'node:fs';import vm from 'node:vm';vm.runInThisContext"
          if old not in s:
              raise SystemExit('crypto regression anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit workflow correction
        run: |
          git config user.name "closed-loop-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/final-spec-patch.yml
          git commit -m "FIX-FINAL-SPEC-WORKFLOW-CRYPTO"
          git push origin HEAD:fix/final-spec-conformance
