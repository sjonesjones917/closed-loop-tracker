name: Apply bounded central adjudication refinements

on:
  push:
    branches:
      - reliability/zero-loss-semantic-adjudication-clean
    paths:
      - .github/workflows/zero-loss-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply responsible-layer corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .zero-loss-refine.py
          rm -f .zero-loss-refine.py .github/workflows/zero-loss-refine.yml .github/workflows/zero-loss-test.yml
          node build-test-project.mjs
          for file in *.js *.mjs; do node --check "$file"; done
          node verify-hash.mjs
          node verify.mjs
          timeout 120s node verify-adjudication.mjs
          timeout 180s node verify-ingestion.mjs
          timeout 180s node verify-complete.mjs
          timeout 180s node verify-prompt-semantics.mjs
          start=$(date +%s%3N)
          timeout 90s node verify-full-cycle.mjs
          end=$(date +%s%3N)
          echo "FULL_CYCLE_MS=$((end-start))"
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "pages.yml"
      - name: Commit proven refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'closed-loop-reliability-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Bound central adjudication and enforce controlled outcomes'
          git push origin HEAD:reliability/zero-loss-semantic-adjudication-clean
