name: Apply final semantic operator corrections v2
'on':
  push:
    branches: [practical-100/final-semantic-operator-correctness]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practical-100/final-semantic-operator-correctness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded transformer and remove stale export
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/final-semantic-operator-correctness.yml').read_text()
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("\n          PY\n",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          exec(compile(code,'final-semantic-transform.py','exec'),{})
          p=Path('prompt-engine.js');s=p.read_text();old=',procedures,contextCollections,contextFor,';new=',procedures,contextFor,'
          if s.count(old)!=1:raise SystemExit(f'obsolete context export expected 1, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify source, semantics, lifecycle, and operator contracts
        run: |
          node --check workflow-schema.js && node --check workflow-engine.js && node --check prompt-engine.js && node --check response-ingestion.js && node --check app-core.js
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-prompt-semantics.mjs
          node verify-full-cycle.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');for(const f of ['workbook.js','hash.js','workflow-schema.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});const s=globalThis.closedLoopWorkflowSchema,pe=fs.readFileSync('prompt-engine.js','utf8'),ui=fs.readFileSync('app-core.js','utf8'),ing=fs.readFileSync('response-ingestion.js','utf8'),eng=fs.readFileSync('workflow-engine.js','utf8');const must=(c,m)=>{if(!c)throw new Error(m)};
          must(!pe.includes('const contextCollections='),'Duplicate prompt context selector remains');must(!pe.includes('contextCollections,contextFor'),'Obsolete context selector remains exported');must(pe.includes('REQ_ID × RUN_ID × TEST_ID triple'),'Stage 12 prompt is not exact-triple based');must(pe.includes('OPERATOR REQUESTED CORRECTIONS / REFINEMENTS'),'Correction feedback missing');must(pe.includes('WORK_TOO_LARGE_FOR_ENVIRONMENT')&&ing.includes('MISSING_APPLICATION_CONTEXT'),'Recovery taxonomy incomplete');must(!s.operationContract(17,'FREEZE').scopeRequirements.includes('runId')&&s.operationContract(17,'VERIFY').scopeRequirements.includes('runId'),'Stage17 scope wrong');must(!s.operationContract(19,'CONFIRM_FREEZE').scopeRequirements.includes('runId')&&s.operationContract(19,'VERIFY').scopeRequirements.includes('runId')&&!s.operationContract(19,'CONFIRM').scopeRequirements.includes('runId'),'Stage19 scope wrong');must(ui.includes("requiresRun=(schema.operationContract(n,operation)?.scopeRequirements||[]).includes('runId')"),'UI run scoping not schema-driven');must(ui.includes('accepted-refinement-reason'),'Accepted refinement missing');must(ui.includes('begin-unchanged-confirmation')&&eng.includes('beginUnchangedConfirmationIteration'),'Same-candidate Stage19 path missing');must(!ui.includes("n===19?'Verify unchanged candidate'"),'Stage19 still creates new candidate under unchanged label');console.log(JSON.stringify({singleContextSelector:true,exactTriplePrompt:true,recoveryTaxonomy:true,operationScopeExact:true,schemaDrivenRunUI:true,postAcceptanceRefinement:true,sameCandidateStage19:true},null,2));
          NODE
      - name: Commit verified source and remove one-time workflows
        run: |
          rm .github/workflows/final-semantic-operator-correctness.yml .github/workflows/final-semantic-operator-correctness-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close remaining semantic operator contradictions"
          git push origin HEAD:practical-100/final-semantic-operator-correctness
