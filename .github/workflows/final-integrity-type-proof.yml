name: Final integrity type proof
on:
  push:
    branches: [reliability/final-integrity-authority-20260826]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/final-integrity-authority-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic repair and exact type corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/final-integrity-authority-repair.yml').read_text()
          body=y.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          lines=[]; skipping=False
          for line in body.splitlines():
              line=line[10:] if line.startswith('          ') else line
              if line.strip()=="# Generic current and historical record-integrity assertion before final output.": skipping=True; continue
              if skipping:
                  if line.strip()=="p.write_text(s)": lines.append(line); skipping=False
                  continue
              lines.append(line)
          Path('/tmp/repair.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/repair.py
          python3 - <<'PY'
          from pathlib import Path
          # Stage29 negative fixture must represent an actual current canonical requirement.
          p=Path('verify-complete.mjs'); s=p.read_text()
          a="const p=project('JOB-CHAIN');p.projectData.requirements.push(record('requirements',4,{OBLIGATION:'Synthetic mandatory requirement'"
          b="const p=project('JOB-CHAIN');const req=record('requirements',4,{OBLIGATION:'Synthetic mandatory requirement'"
          if s.count(a)!=1: raise SystemExit('Stage29 fixture anchor mismatch')
          s=s.replace(a,b,1)
          a="},'REQ-TEST'));\n  const chains=engine.constructEvidenceChains(p);"
          b="},'REQ-TEST');req.scope=engine.currentScope(p);p.projectData.requirements.push(req);\n  const chains=engine.constructEvidenceChains(p);"
          if s.count(a)!=1: raise SystemExit('Stage29 fixture close mismatch')
          s=s.replace(a,b,1); p.write_text(s)

          # Correct canonical value types exposed by moving application-created records to application authority.
          p=Path('workflow-schema.js'); s=p.read_text()
          s=s.replace("const VALUE_TYPES=Object.freeze(['STRING','INTEGER','NUMBER','BOOLEAN','STRING_ARRAY','REFERENCE','REFERENCE_ARRAY','OBJECT']);","const VALUE_TYPES=Object.freeze(['STRING','INTEGER','NUMBER','BOOLEAN','STRING_ARRAY','REFERENCE','REFERENCE_ARRAY','OBJECT','OBJECT_ARRAY']);")
          head,sep,tail=s.partition('const EXPLICIT_RECORD_FIELD_TYPES=Object.freeze(')
          if not sep: raise SystemExit('record type registry missing')
          changes={
            'COMPONENT_MANIFEST':'OBJECT_ARRAY',
            'COMPONENT_VERSIONS':'OBJECT',
            'IMMUTABLE_LOCATIONS':'STRING_ARRAY',
            'APPROVED_VERSIONS':'OBJECT',
            'IMMUTABLE_ARTIFACT_RECORDS':'STRING_ARRAY'
          }
          for field,t in changes.items():
              old=f'"{field}":{{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"STRING"}}'
              new=f'"{field}":{{"closedProperties":null,"enumValues":[],"normalizerKey":null,"nullable":false,"valueType":"{t}"}}'
              n=tail.count(old)
              if n!=1: raise SystemExit(f'{field} type occurrence count {n}')
              tail=tail.replace(old,new,1)
          p.write_text(head+sep+tail)

          p=Path('response-ingestion.js'); s=p.read_text()
          old="else if(t==='OBJECT'&&!object(value))issues.push(issue('WRONG_VALUE_TYPE',path,'Expected OBJECT.'));"
          new="else if(t==='OBJECT'&&!object(value))issues.push(issue('WRONG_VALUE_TYPE',path,'Expected OBJECT.'));else if(t==='OBJECT_ARRAY'&&(!Array.isArray(value)||value.some(v=>!object(v))))issues.push(issue('WRONG_VALUE_TYPE',path,'Expected OBJECT_ARRAY.'));"
          if s.count(old)!=1: raise SystemExit('OBJECT validator anchor mismatch')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('verify-full-cycle.mjs'); s=p.read_text()
          old="case 'STRING_ARRAY':case 'REFERENCE_ARRAY':return Array.isArray(value)&&value.every(item=>typeof item==='string');case 'OBJECT':return value!==null&&typeof value==='object'&&!Array.isArray(value);default:return false;"
          new="case 'STRING_ARRAY':case 'REFERENCE_ARRAY':return Array.isArray(value)&&value.every(item=>typeof item==='string');case 'OBJECT':return value!==null&&typeof value==='object'&&!Array.isArray(value);case 'OBJECT_ARRAY':return Array.isArray(value)&&value.every(item=>item!==null&&typeof item==='object'&&!Array.isArray(item));default:return false;"
          if s.count(old)!=1: raise SystemExit('type verifier anchor mismatch')
          s=s.replace(old,new,1)
          s += "\nfor(const [collection,definition] of Object.entries(schema.RECORD_SCHEMAS))for(const record of p.projectData[collection]||[]){if(record.recordSha256)assert(record.recordSha256===hash.recordSha256(record),`${collection} ${engine.recordId(record,collection)} has a stale recordSha256.`);if(record.contentSha256)assert(record.contentSha256===hash.contentRecordSha256(record,definition.idField),`${collection} ${engine.recordId(record,collection)} has a stale contentSha256.`);}\n"
          p.write_text(s)
          PY
          rm .github/workflows/final-integrity-authority-repair.yml .github/workflows/final-integrity-continuation.yml .github/workflows/final-integrity-finalize.yml .github/workflows/final-integrity-scoped-proof.yml .github/workflows/final-integrity-type-proof.yml
      - name: Run deterministic acceptance on exact final tree
        run: |
          node --check workflow-schema.js
          node --check workflow-engine.js
          node --check response-ingestion.js
          node --check project-store.js
          node verify-hash.mjs
          node build-test-project.mjs
          node verify.mjs
          node verify-ingestion.mjs
          node verify-complete.mjs
          node verify-full-cycle.mjs
          node verify-prompt-semantics.mjs
      - name: Commit exact passing tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close final authority and canonical integrity gaps [repair-complete]"
          git push origin HEAD:reliability/final-integrity-authority-20260826
