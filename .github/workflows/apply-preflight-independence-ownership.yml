name: Apply preflight independence ownership fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          schema = Path('workflow-schema.js')
          text = schema.read_text()
          text, n1 = re.subn(r'("VERIFIER_CONTEXT_ID",\s*)"INDEPENDENCE_STATUS",\s*("INPUTS",)', r'\1\2', text, count=1)
          if n1 != 1 and '"VERIFIER_CONTEXT_ID",\n      "INPUTS",' not in text:
              raise SystemExit('verification agent ownership target not found')
          text, n2 = re.subn(r'("VERIFICATION_ID",\s*"REQ_ID",\s*"RUN_ID",\s*"TEST_ID",\s*"DEFECT_ID")', r'\1,\n      "INDEPENDENCE_STATUS"', text, count=1)
          if n2 != 1 and '"DEFECT_ID",\n      "INDEPENDENCE_STATUS"' not in text:
              raise SystemExit('verification application ownership target not found')
          schema.write_text(text)

          engine = Path('workflow-engine.js')
          text = engine.read_text()
          check = "if(true){const currentPrompt=safe(project?.projectData?.generatedPrompts).filter(p=>Number(p?.stage)===9&&!p?.invalidatedBy).at(-1),contextId=String(currentPrompt?.scope?.contextId||'').trim(),context=records(project,'freshContexts').find(record=>isActiveRecord(record)&&recordId(record,'freshContexts')===contextId),externalId=String(recordValue(context,'EXTERNAL_CONTEXT_IDENTIFIER')||'').trim();if(!contextId||!context||!externalId)reasons.push('Independent preflight requires one current application-bound reviewer context with a supplied external context identifier.');}"
          if check not in text:
              pattern = r"(case 9:\s*requireAccepted\(\);requireCount\('preflightRecords',1\);)"
              text, n3 = re.subn(pattern, r"\1" + check, text, count=1)
              if n3 != 1:
                  raise SystemExit('Stage 09 gate insertion target not found')
          engine.write_text(text)
          PY
          rm .github/workflows/apply-preflight-independence-ownership.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js workflow-engine.js .github/workflows/apply-preflight-independence-ownership.yml
          git commit -m "Enforce preflight reviewer context and application independence ownership"
          git push -f origin HEAD:refs/heads/automation/preflight-independence-ownership-result
