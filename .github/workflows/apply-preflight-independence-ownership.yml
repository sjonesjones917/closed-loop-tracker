name: Apply verification independence ownership fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          schema = Path('workflow-schema.js')
          text = schema.read_text()

          text, removed = re.subn(r'("VERIFIER_CONTEXT_ID",\s*)"INDEPENDENCE_STATUS",\s*("INPUTS",)', r'\1\2', text, count=1)
          if removed != 1 and not re.search(r'"VERIFIER_CONTEXT_ID",\s*"INPUTS",', text):
              raise SystemExit('verification agent ownership target not found')

          start = text.find('"verification": {')
          if start < 0:
              raise SystemExit('verification ownership block not found')
          end = text.find('\n  }', start)
          if end < 0:
              raise SystemExit('verification ownership block end not found')
          block = text[start:end]
          app_marker = '"application": ['
          app_start = block.find(app_marker)
          if app_start < 0:
              raise SystemExit('verification application partition not found')
          app_end = block.find(']', app_start)
          if app_end < 0:
              raise SystemExit('verification application partition end not found')
          app_body = block[app_start:app_end]
          if '"INDEPENDENCE_STATUS"' not in app_body:
              block = block[:app_end] + ',\n      "INDEPENDENCE_STATUS"' + block[app_end:]
              text = text[:start] + block + text[end:]

          pattern = r"(verification:recordSchema\(\{.*?required:\[)(.*?)(\],relationships:)"
          def remove_required(m):
              body = re.sub(r"'INDEPENDENCE_STATUS',?", '', m.group(2), count=1)
              body = re.sub(r',\s*,', ',', body)
              return m.group(1) + body + m.group(3)
          text, changed = re.subn(pattern, remove_required, text, count=1, flags=re.S)
          if changed != 1:
              raise SystemExit('verification required fields target not found')

          schema.write_text(text)
          PY
          rm .github/workflows/apply-preflight-independence-ownership.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow-schema.js .github/workflows/apply-preflight-independence-ownership.yml
          git commit -m "Make verification independence application-owned"
          git push -f origin HEAD:refs/heads/automation/verification-independence-ownership-result
