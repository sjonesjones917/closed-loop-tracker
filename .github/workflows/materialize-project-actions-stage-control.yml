name: Materialize project actions repair
on:
  push:
    branches: [fix/project-actions-and-stage-control-20260830]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-actions-and-stage-control-20260830
      - name: Restore Project actions popover
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='.header-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;overflow:hidden}'; assert old in s; p.write_text(s.replace(old,'.header-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;overflow:visible}',1))"
          rm .github/workflows/materialize-project-actions-stage-control.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Project actions popover' || exit 0
          git push
