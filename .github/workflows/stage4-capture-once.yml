name: Materialize Stage 04 capture-once repair
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'Install one-time Stage 04 capture-once materializer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize capture-once runtime and remove one-time infrastructure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          let prompt=fs.readFileSync('prompt-engine.js','utf8');
          const mustReplace=(name,pattern,replacement)=>{const before=prompt;if(pattern instanceof RegExp)prompt=prompt.replace(pattern,replacement);else prompt=prompt.replace(pattern,replacement);if(prompt===before)throw new Error(`${name} anchor not found.`);};
          mustReplace('prompt engine version',"const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/25';","const PROMPT_ENGINE_VERSION='closed-loop-prompt-engine/26';");
          mustReplace('Stage 04 procedure',/\n4:'Compile atomic requirement proposals[\s\S]*?',\n5:/,`\n4:'Compile atomic requirement proposals from the complete application-supplied Stage 04 project input embedded in this instruction. Treat every included project fact, constraint, prohibition, acceptance condition, human-origin obligation, supplied-material obligation, current source finding, and candidate external obligation as the current input universe for this operation. The operator does not attach, resend, retype, summarize, select, or otherwise resupply project information at Stage 04 merely because another conversation is being used. Do not infer substantive content from a filename. If required project information is absent from the application-supplied Stage 04 input, return BLOCKED with MISSING_APPLICATION_CONTEXT or INADEQUATE_PRIOR_OUTPUT and identify the earliest responsible stage; never turn an application capture/projection defect into another human data-entry or attachment request. For every application-enumerated obligation, provide one or more atomic requirement proposals or an explicit retained-context, inapplicable, or blocked disposition with reason. Preserve independent traceability for every original obligation identity. Each proposed requirement should express one independently testable obligation where possible and record type, mandatory/optional status, governing source or user-input relationship, exact source location when applicable, authority, applicability, dependencies, prohibitions, defined terms, observable satisfaction condition, intended verification method, expected evidence, failure condition, severity, and notes. The application assigns REQ_ID, versions, hashes, counts, scope, and closure after validated ingestion. Do not derive requirements from the target product or an existing implementation merely because that implementation contains a behavior.',\n5:`);
          const collaborationAnchor='- Continue the same conversation from the human answer. Ask only the next genuinely useful human-only question(s); do not interrogate the human for facts available in supplied materials, common domain knowledge, or authorized research/tools.\\n';
          mustReplace('capture-once collaboration rule',collaborationAnchor,collaborationAnchor+'- Project information is supplied by the human once. If project-relevant information is already present in this generated instruction or current canonical context, never ask the human to attach, resend, retype, summarize, select, or otherwise provide it again. Missing projected context is an application/prior-stage defect, not a human resupply task.\\n');
          mustReplace('persisted project input label','ACCEPTED STAGE 01 JOB DEFINITION — CANONICAL INPUT, DO NOT ASK THE HUMAN TO RESEND IT','PERSISTED PROJECT INPUT — APPLICATION-SUPPLIED, NO USER RESUPPLY');
          mustReplace('Stage 04 final response rule','- Stage 04 receives current User Job Input, the accepted Stage 01 job definition, and accepted Stage 03 findings as canonical context. Do not ask the human to attach, resend, retype, or summarize the original intent file or any material whose relevant human-authority content is already present in that canonical context. If required prior-stage context is incomplete, return BLOCKED with MISSING_APPLICATION_CONTEXT or INADEQUATE_PRIOR_OUTPUT and identify the responsible earlier stage instead of asking the human to resend the same material.\\n','- Stage 04 receives its project information through this generated instruction. Never ask the human to attach, resend, retype, summarize, select, or otherwise resupply information already supplied for this project. Missing projected context is an application/prior-stage defect, not a human resupply task.\\n');
          fs.writeFileSync('prompt-engine.js',prompt);
          const workflowPath='.github/workflows/pages.yml';
          let workflow=fs.readFileSync(workflowPath,'utf8');
          workflow=workflow.replace(/\n  materialize-stage4-intent-reuse:[\s\S]*?(?=\n  publish-status:)/,'');
          fs.writeFileSync(workflowPath,workflow);
          fs.rmSync('.github/workflows/stage4-capture-once.yml');
          const runtimeFiles=['workbook.js','hash.js','workflow-schema.js','workflow-engine.js','prompt-engine.js','response-ingestion.js','project-store.js','app-core.js'];
          const gitBlobSha=file=>{const bytes=fs.readFileSync(file);return crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');};
          const manifest=runtimeFiles.map(file=>`${file}:${gitBlobSha(file)}\n`).join('');
          const identity=`runtime-${crypto.createHash('sha256').update(manifest).digest('hex').slice(0,16)}`;
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/runtime-[a-f0-9]{16}/g,identity);
          fs.writeFileSync('index.html',html);
          console.log(JSON.stringify({runtimeBuildIdentity:identity,promptEngine:'closed-loop-prompt-engine/26'}));
          NODE
          node --check prompt-engine.js
          node verify-hash.mjs
          node verify-test-runtime.mjs
          node verify-prompt-semantics.mjs
      - name: Open protected-branch repair pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=fix/stage04-capture-once-materialized
          git config user.name closed-loop-materializer
          git config user.email actions@users.noreply.github.com
          git checkout -b "$BRANCH"
          git add prompt-engine.js index.html .github/workflows/pages.yml
          git add -u .github/workflows/stage4-capture-once.yml
          git diff --cached --check
          git commit -m "Enforce capture-once project context in Stage 04"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Enforce capture-once project context in Stage 04" --body "Project information supplied by the human is carried forward by the application. Stage 04 receives the persisted project information inside its generated instruction and may not request a repeat attachment, retype, summary, selection, or other resupply. Saved /25 prompts are superseded by prompt-engine/26. The runtime cache identity is recalculated from the exact changed runtime bytes. One-time materializer infrastructure removes itself in this PR."
