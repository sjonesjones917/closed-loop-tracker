name: Apply exhaustive full-cycle fixture
on: {push: {branches: [fix/spec-conformance-final]}}
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/spec-conformance-final}
      - run: |
          python _patch10.py
          node verify-full-cycle.mjs
          rm _patch10.py .github/workflows/_apply10.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -m 'Exercise exhaustive intake and obligation closure in full cycle' && git push origin HEAD:fix/spec-conformance-final
