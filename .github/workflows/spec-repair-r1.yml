name: One-time contract repair runner
on:
  push:
    branches:
      - "repair/spec-p4-contracts-20260903-r1"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "repair/spec-p4-contracts-20260903-r1"
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Apply exact owner-file repair
        run: python3 .repair-r1.py
      - name: Prove repaired invariants
        run: |
          set -euo pipefail
          node --check workflow-engine.js
          node --check verify-v3-definition-of-done.mjs
          node build-test-project.mjs
          node verify-v3-definition-of-done.mjs
      - name: Commit repair and remove one-time scaffolding
        run: |
          set -euo pipefail
          rm .repair-r1.py .github/workflows/spec-repair-r1.yml
          git config user.name "closed-loop-repair-bot"
          git config user.email "closed-loop-repair-bot@users.noreply.github.com"
          git add workflow-engine.js verify-v3-definition-of-done.mjs .repair-r1.py .github/workflows/spec-repair-r1.yml
          git diff --cached --check
          git commit -m "Fix nullable source pointer and Stage 30 ownership mapping"
          git push origin HEAD:repair/spec-p4-contracts-20260903-r1
