name: Complete controlled verification observation schema repair

on:
  push:
    branches:
      - reliability/zero-loss-semantic-adjudication-clean
    paths:
      - .github/workflows/zero-loss-repair-wording.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify the minimal corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('workflow-engine.js')
          text = engine.read_text()
          old = 'semantically contradictory material finding'
          new = 'internally contradictory material finding'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one wording target, found {text.count(old)}')
          engine.write_text(text.replace(old, new, 1))

          schema = Path('workflow-schema.js')
          text = schema.read_text()
          old = "    'OBSERVED_RESULT','EXACT_EVIDENCE','DETERMINATION','DEFECT_ID','UNDETERMINED_REASON'"
          new = "    'OBSERVED_RESULT','OBSERVATION_OUTCOME','EXACT_EVIDENCE','DETERMINATION','DEFECT_ID','UNDETERMINED_REASON'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one verification fields target, found {text.count(old)}')
          schema.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/zero-loss-repair-wording.yml
          node --check workflow-engine.js
          node --check workflow-schema.js
          node build-test-project.mjs
      - name: Commit the corrections
        run: |
          git config user.name 'closed-loop-reliability-bot'
          git config user.email 'closed-loop-reliability-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Complete controlled verification observation schema'
          git push origin HEAD:reliability/zero-loss-semantic-adjudication-clean
