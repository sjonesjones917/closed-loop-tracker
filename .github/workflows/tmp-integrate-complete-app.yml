name: Temporary complete-app integration
on:
  push:
    branches:
      - integrate/complete-app-20260830
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge repair work without discarding current main changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/complete-all-stage-prompts-main-20260830
          if git merge-base --is-ancestor origin/fix/complete-all-stage-prompts-main-20260830 HEAD; then
            echo "Repair branch already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -X ours origin/fix/complete-all-stage-prompts-main-20260830 -m "Integrate all-stage prompt and project-memory repair"
          git push origin HEAD:integrate/complete-app-20260830
