name: One-time mobile action overflow repair
on:
  push:
    branches: [fix/mobile-stage-action-overflow]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Fix mobile Stage action overflow regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-stage-action-overflow
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact layout repair and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old=".stage-action-strip{display:flex;gap:6px;flex-wrap:nowrap;align-items:flex-start;margin-top:8px;font-size:9.5px;color:var(--muted);font-weight:750}"
          new=".stage-action-strip{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px;align-items:start;margin-top:8px;max-width:100%;min-width:0;overflow:hidden;font-size:9.5px;color:var(--muted);font-weight:750}"
          if old not in s: raise SystemExit('stage-action-strip base rule not found')
          s=s.replace(old,new,1)
          old2=".stage-action-strip span:last-child{flex:1 1 260px;min-width:0;overflow-wrap:anywhere}"
          new2=".stage-action-strip span:last-child{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;white-space:normal}"
          if old2 not in s: raise SystemExit('stage-action-strip child rule not found')
          s=s.replace(old2,new2,1)
          marker='@media(max-width:900px)'
          mobile="@media(max-width:620px){.stage-action-strip{grid-template-columns:1fr}.stage-action-strip span:first-child{justify-self:start}.stage-action-strip span:last-child{width:100%;border-radius:10px}.stage-hero,.stage-hero>*{min-width:0;max-width:100%}}\n"
          if mobile not in s:
              pos=s.find(marker)
              if pos < 0: raise SystemExit('responsive marker not found')
              s=s[:pos]+mobile+s[pos:]
          p.write_text(s)

          p=Path('verify-browser.mjs'); s=p.read_text()
          old="for(const width of [320,393,1280]){await setWidth(cdp,width);await openStage(cdp,2);const pair=await evalValue(cdp,`(()=>{const spans=[...document.querySelectorAll('.stage-action-strip span')];if(spans.length!==2)return null;const first=spans[0].getBoundingClientRect(),second=spans[1].getBoundingClientRect(),strip=spans[0].parentElement.getBoundingClientRect();return {firstTop:first.top,secondTop:second.top,firstRight:first.right,secondLeft:second.left,secondRight:second.right,stripRight:strip.right};})()`);assert(pair&&Math.abs(pair.firstTop-pair.secondTop)<=1&&pair.secondLeft>=pair.firstRight&&pair.secondRight<=pair.stripRight+1,`Current state and next action separated at ${width}px: ${JSON.stringify(pair)}`);}"
          new="for(const width of [320,393,1280]){await setWidth(cdp,width);await openStage(cdp,2);const pair=await evalValue(cdp,`(()=>{const spans=[...document.querySelectorAll('.stage-action-strip span')];if(spans.length!==2)return null;const strip=spans[0].parentElement,original=spans[1].textContent;spans[1].textContent='SEND_THIS_EXACT_EXTREMELY_LONG_UNBROKEN_ARTIFACT_IDENTIFIER_ABCDEFGHIJKLMNOPQRSTUVWXYZ_0123456789_WITHOUT_HORIZONTAL_OVERFLOW';const second=spans[1].getBoundingClientRect(),box=strip.getBoundingClientRect(),desc=[...strip.querySelectorAll('*')].map(e=>e.getBoundingClientRect());spans[1].textContent=original;return {secondLeft:second.left,secondRight:second.right,stripLeft:box.left,stripRight:box.right,overflow:desc.some(r=>r.left<box.left-1||r.right>box.right+1)};})()`);assert(pair&&!pair.overflow&&pair.secondLeft>=pair.stripLeft-1&&pair.secondRight<=pair.stripRight+1,`Current state/next action or long artifact name overflows at ${width}px: ${JSON.stringify(pair)}`);}"
          if old not in s: raise SystemExit('browser adjacency test not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check verify-browser.mjs
          rm .github/workflows/repair-mobile-action.yml
          git config user.name 'closed-loop-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html verify-browser.mjs .github/workflows/repair-mobile-action.yml
          git commit -m 'Fix mobile Stage action overflow regression'
          git push origin HEAD:fix/mobile-stage-action-overflow
