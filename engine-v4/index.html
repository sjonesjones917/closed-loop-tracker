<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Closed Loop Reliability</title></head><body style="margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;padding:24px">Loading Closed Loop Reliability…<script>(async()=>{try{let b64="";for(let i=0;i<8;i++){const r=await fetch(`part-${String(i).padStart(2,"0")}.txt`,{cache:"no-store"});if(!r.ok)throw new Error(`part ${i}: HTTP ${r.status}`);b64+=(await r.text()).trim()}const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=new TextDecoder("utf-8").decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<h2>Closed Loop Reliability failed to load</h2><pre style="white-space:pre-wrap">'+String(e)+'</pre>'}})()</script></body></html>
