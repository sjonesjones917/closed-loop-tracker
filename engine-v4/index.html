<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Closed Loop Reliability</title></head><body style="margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;padding:24px">Loading Closed Loop Reliability…<script>(async()=>{try{const files=["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06a.txt","part-06b.txt"];let b64="";for(const f of files){const r=await fetch(f,{cache:"no-store"});if(!r.ok)throw new Error(`${f}: HTTP ${r.status}`);b64+=(await r.text()).trim()}const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=new TextDecoder("utf-8").decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<h2>Closed Loop Reliability failed to load</h2><pre style="white-space:pre-wrap">'+String(e)+'</pre>'}})()</script></body></html>
